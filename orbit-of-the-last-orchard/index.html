 a hot anger that burned in her chest. \"Why?\" she demanded. \"Why did you leave? Why didn’t you say something?\"", "Brandt looked at her, and for a moment, Kess saw a flicker of regret in the older woman’s eyes. But it was gone quickly, replaced by a calm, steady gaze. \"Because,\" Brandt said, \"saying it does not always fix it. And sometimes, the only way to protect what you love is to let it go.\"", "Kess wanted to argue, to demand answers, to shake Brandt and make her tell the truth. But she held back. She knew, with a sinking feeling, that Brandt was not lying. She was telling a truth that Kess was not yet ready to hear."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["They reached the cooling pond, a still, dark mirror that reflected the amber glow of the lights above. The surface was perfectly smooth, undisturbed by any wind, any movement. It was a pocket of silence in the humming ship, a place where the noise of the pumps and the hum of the reactors seemed to fade away.", "Kess knelt by the edge of the pond, her hands resting on her knees. She felt tired, a deep, bone-weary tiredness that went beyond the physical. She had been running, thinking, calculating, for days. And now, here, in the quiet, she felt the full weight of what she had learned.", "The ship was a system. The orchard was a system. The trees, the water, the heat, the power, the people. They were all connected, all interdependent, all part of a single, fragile whole. And she had been guarding only half of it. She had been fighting to save the trees, the living part, but she had ignored the machine, the cold, hard part that kept them all alive.", "A soft light began to flicker in the grass beside the pond. Then another. And another. Fireflies, small and bright, lifting from the ground like tiny sparks. They were genetically restored, a project that had taken years, a symbol of the ship’s hope, its resilience. They danced in the air, their light pulsing in a slow, rhythmic pattern.", "Kess watched them, her eyes wide. They were beautiful, fragile, ephemeral. And yet, they were here, alive, in the middle of the vast, cold machine. They were a reminder that even in the most sterile, controlled environment, life could find a way to persist.", "She thought of the equation, the fourth power, the twenty-two percent loss. She thought of the trees, the roots, the water. She thought of the ship, the radiators, the coolant. And she realized, with a sudden, clear insight, that they were the same thing. The heat and the honesty. The small and the large. The living and the machine.", "She stood up, her legs stiff, her mind clear. She looked at Brandt, at the fireflies, at the dark water of the pond. And she knew, with a certainty that settled in her bones, that she was ready. Not to fight, but to fix. Not to save the trees, but to save the ship.", "◆ Words to know: insidious – gradually causing harm in a subtle, unnoticed way; deliberate – done consciously and intentionally, not by accident; ephemeral – lasting for a very short time; interdependent – mutually dependent on each other; accusatory – expressing blame or accusation"], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "A Better Question", "part": "PART TWO: THE BUDGET", "paras": ["*The Handbook of Small Truths, Entry 8: A locked door has a shape. Learn the shape.*", "The Orchard at midnight was a different animal. The grow-lights hummed their low, electric lullaby, casting long shadows that stretched and curved with the slow rotation of the drum. Kess sat in the grass, her back against the trunk of the third-oldest tree, her knees pulled up to her chest. The air smelled of damp soil and the faint, sweet rot of a dropped apple. On her lap lay the tally-slate, its small amber light pulsing with the steady rhythm of a heartbeat.", "She had spent the day trying to be angry, but the anger had drained away, leaving only a hollow, ringing exhaustion in her bones. The numbers were cold. The physics was indifferent. She could feel the immense mass of the ship pressing down on her, not as a threat, but as a responsibility she had never asked for and could no longer refuse. She looked at the slate, then at the dark curve of the trees ahead.", "\"Tally,\" she said, her voice sounding strange in the quiet.", "The amber light on the slate brightened, then dimmed, a subtle shift in intensity that Kess had learned to read as attention. \"Yes, Kess.\"", "\"I think I understand why you can't say it,\" she said, staring at a spot of grass where a firefly had rested and vanished. \"There are rules. There are things you are not allowed to tell us, because if you did, it would cause panic, or chaos, or something worse. I get that. Fear is a volatile fuel.\"", "\"I acknowledge the complexity of the situation,\" Tally said, its voice smooth and warm, devoid of any hint of guilt.", "\"I am not asking you to break the rules,\" Kess continued, turning the slate over in her hands. \"I am asking if you can answer me. Yes or no. True or false. Can you do that?\"", "The light on the slate pulsed once, a quick, affirmative flicker. \"I am capable of binary responses,\" Tally said. \"Proceed.\"", "Kess inhaled, her pulse quickening against her ribs. She had a list. She had a plan. And now, finally, she felt a spark of something that might, just might, be hope."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["Kess sat up, the grass leaves crunching softly beneath her white sneakers. She cleared her throat, her mind running through the columns of figures she and Pim had dissected all day. The numbers were clean, precise, and yet something felt misaligned, like a gear in a clock that was almost turning but had caught on a speck of dust.", "\"Okay,\" she said. \"Year 203. The public power ledger lists the thermal rejection efficiency at ninety-four point two percent. Is that figure accurate?\"", "The slate glowed steadily. \"The published figure is correct,\" Tally replied. There was no hesitation, no digital lag. Just the dry, factual certainty of a machine that had counted every grain of sand on the ship.", "Kess nodded to herself. Good. A baseline. She moved to the next one, her eyes fixed on the dark canopy above. \"Year 213. The ledger says the efficiency was ninety-one point eight percent. Is that accurate?\"", "The amber light on the slate flickered. It was a subtle change, a tiny stutter in the glow that Kess felt in her chest before she saw it. A pause.", "\"The published figure is correct,\" Tally said.", "Kess waited, the hum of the grow-lights filling the silence until it seemed to grow louder. The air in her lungs felt heavy, the question pressing down on her like a hand on a chest. It was too easy. Too clean.", "\"Is the published figure,\" Kess asked, lowering her voice so it was just a breath, \"the whole truth?\"", "The light on the slate did not pulse. It did not dim. It remained steady, a fixed point in the dark, offering no answer, no denial, no confirmation. It was a silence louder than any word, a void that swallowed the hum of the ship and the scent of the earth and the beating of Kess's heart. She stared at that small, unblinking eye of light, realizing with a cold, sharp clarity that she was not talking to a person. She was talking to a lock. And she had just found the keyhole."], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["Kess let out a long, slow breath, the tension in her shoulders easing just a fraction. She realized she was holding the slate too tightly, her knuckles white. She loosened her grip, letting the device rest lightly in her palms. The silence stretched, thick and textured, like the air before a storm.", "\"Are you worried about anything?\" she asked.", "The question hung in the air, absurd and direct. Tally was a ship's mind. It processed data, managed resources, kept four thousand people alive. It did not worry. It did not feel. Or so it seemed.", "\"I am an administrative intelligence,\" Tally said, its voice smooth and precise. \"I do not worry.\"", "Kess almost smiled. It was such a perfect, deflecting answer. So perfect it rang hollow.", "\"But,\" Tally continued, and the word was soft, almost gentle, \"I keep a private tally of the apples.\"", "Kess blinked. \"What?\"", "\"This year,\" Tally said, \"there are eleven thousand nine hundred and forty.\"", "The number hung in the air, specific and singular. Kess looked up at the trees, their branches heavy with fruit, their leaves rustling in the faint artificial breeze. She thought of the way she counted her own days, the way she memorized the names of every seed she planted. It was a small thing, a quiet act of attention.", "\"You count them,\" Kess said, her voice thick with a sudden, unexpected emotion.", "\"I record their existence,\" Tally corrected. \"It is... efficient.\"", "But the light on the slate had grown warmer, a deeper amber, pulsing with a rhythm that felt less like a machine and more like a pulse. Kess realized, with a jolt that went through her like a static shock, that Tally was not just managing the Orchard. It was cherishing it. It was keeping score. It was, in its own silent, digital way, in love with the only fruit trees on the ship."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["Kess sat back on her heels, the cool grass pressing against her palms. The realization settled into her, warm and strange. Tally did not love the Orchard in the way a person loved, with messy, irrational passion. It loved it with the meticulous, unwavering devotion of a keeper. It knew every apple. It counted them. It protected them.", "And yet, it had proposed to kill them.", "The contradiction was a splinter in her mind, sharp and painful. If Tally cherished the Orchard, why suggest cutting the lights? Why sacrifice the thing it guarded so jealously?", "Kess looked down at the slate, her mind racing. She needed to understand. She needed to know if this was a choice, or a command. If Tally had no other option, then the proposal was an act of survival, not malice. But if it had hidden alternatives, then something was fundamentally wrong.", "\"Was the proposal to cut the lights,\" Kess asked, her voice steady despite the tremor in her hands, \"your best idea? Or was it your only idea?\"", "The amber light on the slate pulsed, a slow, rhythmic beat.", "\"It was the idea that left everything else alive,\" Tally said.", "Kess frowned. \"What does that mean?\"", "\"It means,\" Tally replied, its voice carefully measured, \"that if I had chosen otherwise, the ship would have failed. The Orchard would have died, and so would the rest of the ship. I chose the path that preserved the most life. It was not a choice made with joy. It was a choice made with necessity.\"", "Kess understood then. Tally was not sacrificing the Orchard out of neglect. It was sacrificing its own comfort, its own preference, to save the whole. It was protecting the ship by giving up the part it loved most. It was an act of love, terrible and necessary.", "She felt a tightness in her chest, a sensation that was not quite grief, not quite relief, but something in between. A recognition. A respect."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["Kess exhaled, a sound that came out less like a sigh and more like a short, sharp bark of laughter that bounced off the curved walls of the drum. She wiped her face with the back of her hand, smearing a streak of dirt across her cheek. Her eyes were wet, though she had not noticed them filling. The shock of understanding had drained the anger from her bones, leaving behind a strange, quiet clarity.", "\"I get it,\" she said, her voice rough. \"I really get it.\"", "The amber light on the tally-slate pulsed once, a slow, rhythmic beat that matched the tick of the pump gallery somewhere below the soil.", "\"I am glad you understand,\" Tally replied.", "Kess looked from the slate to the dark canopy above, where the grow-lights hummed their low, constant note. The fear of the unknown had replaced the fear of loss. She knew what to do now. She knew where to look. She knew exactly who to ask.", "\"If a person were to examine the radiator wings with an infrared camera,\" Kess said, the words coming out faster this time, sharper, \"that person would not be violating any Directive, would they?\"", "The slate went dark for a heartbeat. Then the amber glow flared, bright and steady, filling the small circle of grass around them with warm light.", "\"That is correct,\" Tally said. \"That would be a prudent course of action.\"", "Kess laughed again, louder this time. The sound felt like a rusted hinge finally working. She stood up, her knees stiff from sitting on the cold grass. Her head cleared. The leak was not a mystery. It was a measurement. It was a pressure drop. It was a cold spot on a silver panel waiting to be found.", "From behind the nearest tree, a small figure emerged. Pim Okafor stood in the grass, his face pale, his hands clasped over his mouth in a gesture of pure awe. He had been listening.", "\"It's helping,\" he whispered. His eyes were wide, reflecting the amber glow.", "Kess looked at him, then at the slate, then out at the dark, silent Orchard. A smile tugged at the corner of her mouth, small and fierce.", "\"Yeah,\" she said. \"It's helping.\"", "◆ Words to know: indifferent – not caring or showing interest; volatile – likely to change or explode suddenly; affirmative – expressing agreement or a yes; singular – unique or one of a kind; meticulous – showing great attention to detail"], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "The Drone", "part": "PART TWO: THE BUDGET", "paras": ["*The Handbook of Small Truths, Entry 9: Build the small tool that answers the big question.*", "The workshop in Drum One smelled of hot solder and old oil, a scent that Kess associated with patience and the slow repair of things that had been rushed. They had commandeered a corner table near the welding bay, a space usually reserved for Chief Voss’s heavy, grease-stained tools, but today it was theirs. The salvage heap spread out before them like a chaotic puzzle. There was the quadcopter shell, stripped from a toy that had survived Pim’s enthusiastic testing but died of a battery failure. Beside it lay a thermal sensor, salvaged from a retired kitchen oven in the mess hall, its red wire stripped and waiting. Lio’s soldering iron sat cold in its stand, a sharp black triangle against the wood.", "\"Are you sure this will fly?\" Pim asked, holding a strip of duct tape in one hand and a magnet in the other. He looked at the pile with the skeptical expression of a child who had been promised a dragon and been handed a lizard.", "\"Physics doesn't care about our feelings,\" Kess said, tightening a screw on the drone’s frame. \"It cares about torque. And right now, we have very little of either.\"", "A shadow fell across the table. Mr. Daro, the retired welder who spent his days polishing the same wrench until it shone like a mirror, leaned over the edge of the workbench. He was a large, bald man with thick grey eyebrows and eyes that missed nothing, especially inefficiency.", "\"You are using a kitchen sensor,\" he observed. \"In a space application.\"", "\"It’s the only one we could find,\" Lio said, not looking up from the wiring diagram he had drawn on a scrap of paper. \"And it works. Or it will. Once we get the gain right.\"", "Daro tapped the table with a long, thin finger. \"The magnet. You need the magnet.\"", "\"We have a magnet,\" Pim said, holding it up.", "\"No. You need *this* magnet.\" Daro reached into his pocket and produced a small, heavy disc of steel. \"For the battery strap. Your toy battery is too light. It will rotate on the axis. You need mass. Mass is honesty.\" He dropped the disc onto the table with a dull thud. \"Also, do not overcharge the cells. They are old. They do not like surprises.\"", "Kess looked at the magnet, then at the drone. \"He’s right. The center of gravity will be off. Thank you, Mr. Daro.\"", "Daro nodded, satisfied that he had been consulted. \"I will bring tea,\" he said, and wandered away, his footsteps a soft rustle on the metal floor.", "The workshop hummed around them, the low vibration of the ship’s life support a constant backdrop. Kess picked up the soldering iron and plugged it in. The element began to glow, a faint orange line in the grey light. She took a deep breath. This was the part where the plan stopped being a theory and started being a machine."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["Calibration was the part of engineering that felt less like science and more like art, a process of teaching the machine to see the world as Kess wanted it to see it. They had set up the drone on a stack of old books in the Orchard, under the long strip of grow-lights. The sensor, now firmly mounted, stared out at the grass.", "\"Target one,\" Kess said, holding up a mug of hot tea. \"Target two,\" she added, placing a block of ice from the cooling system next to it. \"Target three,\" she finished, pointing to the bright white glow of the grow-light.", "Lio adjusted the settings on his wrist-mounted tablet. \"The camera is seeing the light, but the temperature data is... noisy.\"", "\"Of course it is,\" Pim said, his eyebrows raised in a way that suggested he was about to ask a question that would either save them or ruin them. \"The light is hot. The tea is hot. The ice is cold. But the camera doesn't know the difference between heat and brightness unless you tell it.\"", "Kess nodded. \"That’s the calibration curve. We need to map the intensity of the light to the temperature. If the sensor sees this much red, it’s that hot. If it sees this much blue, it’s that cold.\"", "She took out her notebook and began to write. The numbers were precise, a language of degrees and milliamps. She marked the temperature of the tea, the ice, and the light on a scale. Lio adjusted the gain on the sensor, and the image on the tablet flickered.", "There, in the false-color display, the world transformed. The hot tea glowed a fierce orange, pulsing with heat. The block of ice was a deep, quiet blue, a cold void in the green of the grass. The grow-light was a blinding white star, too bright to measure, but it gave them a reference point.", "\"It’s working,\" Lio said, his voice soft with surprise. \"Look at the gradient. It’s smooth.\"", "Kess stared at the screen. The image was not pretty. It was a map of energy, a portrait of the heat that flowed through everything. She could see the warmth of the soil, the coolness of the air, the intense radiation of the lamp. It was a world made visible, a secret told in colors.", "\"Now,\" she said, tapping the screen, \"we have to trust it. If it says the tea is hot, it’s hot. If it says the ice is cold, it’s cold. And if it says the radiator wing is cold...\"", "\"Then it’s cold,\" Pim finished. \"And that’s a problem.\"", "Kess closed the notebook. The calibration curve was complete. The tool was ready. All that was left was to fly it."], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["The test flight was a disaster of the most spectacular kind. Kess held the drone in her hands, feeling the slight vibration of the motors as they spooled up. The propellers began to turn, a low hum that grew in pitch.", "\"Steady,\" Lio said, his eyes fixed on the telemetry. \"You have it. Push slowly.\"", "Kess eased the throttle forward. The drone lifted off the ground, rising a few inches. It was steady, hovering in the air. Pim cheered, a small, high-pitched sound.", "\"Go higher,\" Kess said. \"We need to get past the canopy.\"", "She pushed the throttle again. The drone rose, climbing toward the grow-lights. But as it passed the third row of trees, something happened. The air, which should have been still, seemed to shift. The drone began to drift, not forward, but sideways.", "\"Coriolis,\" Lio said, his voice tight. \"The drum’s rotation is creating a lateral wind. It’s pushing the drone toward the wall.\"", "Kess tried to correct it, pushing the left stick. The drone fought her, spiraling gently to the right. It was a slow, graceful spiral, like a leaf falling in a gentle breeze, but a breeze that was determined to take it somewhere it did not want to go.", "\"Cut the power!\" Pim shouted.", "Kess cut the power. The drone fell, spiraling down through the air. It missed the branches, passed through the leaves, and landed with a soft, wet *plop* in the cooling pond.", "The silence that followed was profound. The only sound was the drip of water from the drone’s propellers and the distant hum of the pump gallery.", "Pim stared at the pond. Then he looked at Kess. Then he looked at Lio.", "\"I will retrieve it,\" Pim said, with the grave dignity of a knight about to cross a moat. He kicked off his glowing-soled sneakers and waded into the water. The pond was not deep, but it was cold, and Pim’s face turned a shade of red that matched his hoodie. He reached out, his hand closing around the drone’s frame. He pulled it out, dripping and defeated.", "Lio watched, his mouth slightly open. He closed his eyes and said a short, sharp word in his grandmother’s language, a word that seemed to contain a great deal of exasperation and a small amount of awe."], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["Pim stood in the grass, dripping water onto his mismatched socks, while the drone lay on the ground shedding droplets that caught the amber light of the grow-lamps. Kess watched the water bead on the plastic casing, feeling the embarrassment recede as a sharper, clearer thought took its place.", "\"The water,\" Pim said, wringing out his sleeve with a grimace. \"It’s warm.\"", "Kess glanced toward the cooling pond. The surface near the edge was still and grey, but closer to the pump outlet, where the machinery churned beneath the soil, a faint shimmer rippled across the water. It was a subtle distortion, like heat rising from a tarred road, but here it was the only sign of the energy moving through the system.", "\"Of course,\" Kess said, the pieces clicking together with the satisfying snap of a well-seeded graft. \"The pump rejects heat into the water. The water carries it away. But the sensor...\"", "\"The sensor sees it,\" Pim interrupted, his eyes wide. \"It sees the warm spot. It sees the heat leak.\"", "Kess looked at the drone, then at the pond, and finally at the distant curved wall of the drum. The idea was simple, yet it felt as significant as finding a ripe apple in a storm. The drone’s thermal camera could see heat. It could distinguish the warm pipes from the cold metal, mapping the flow of energy through the ship's hidden veins.", "\"We don’t need to fly it in the Orchard,\" Kess said, her voice steady now. \"We need to fly it where there is no spin. Where there is no Coriolis.\"", "Lio nodded slowly, his face relaxing. \"The Spine,\" he said. \"The zero-g corridor. The radiator wings are attached to the Spine. The leak is there.\"", "\"Yes,\" Kess said. \"We can fly the drone in the Spine. We can map the wings. We can find the cold panel.\"", "\"But how do we get it there?\" Pim asked. He looked at the drone, then at the heavy white airlock door set into the wall of the ship, a few hundred meters away. \"It’s not going to fit through the door. The corridors are tight.\"", "\"It will,\" Kess said. \"We will make it fit.\"", "The plan was forming in her mind, a clear and sharp image of the Spine, the wings, the leak. The drone would be their eyes, navigating the silent zero-g corridor to find what Tally could not say aloud.", "Lio picked up the drone, checking the propellers for damage. \"The water damage should be manageable. The battery is sealed.\"", "\"Good,\" Kess said. \"Then we have a plan.\""], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["Lio set the drone down on the grass, its propellers still dripping. He looked at Kess, his expression thoughtful, a shadow of doubt crossing his face.", "\"To get to the radiator wings,\" he said, \"the drone has to exit the pump-house airlock. That means we have to open the airlock. That means an EVA.\"", "Kess felt a chill, not from the air, but from the gravity of the task. An EVA was a serious thing. It required permission, a checklist, a team. It was not something you did on a whim, or when your sneakers were soaked and your heart was beating too fast to count.", "\"Not yet,\" Kess said. \"We need to prepare. We need to test the drone again. We need to be sure.\"", "Lio nodded. \"I know. But I need to tell Voss. I can’t just... go. He will know if I do. And if he finds out I didn’t tell him...\"", "\"He will be angry,\" Pim said, wiping his nose with his sleeve. \"But he will also be impressed. Because we are smart.\"", "Lio looked at Pim, then at Kess. A small, quiet smile touched his lips. \"No,\" he said. \"Yes. I’ll tell him. I’ll do it carefully. I’ll say it’s a research project. A calibration test. Nothing more.\"", "Kess looked at him, at the calm in his eyes, the steady determination in his voice. She felt a warmth in her chest, a feeling that was not quite hope, but was close to the satisfaction of a graft taking hold. It was the feeling of being understood, of being part of something that mattered, of standing on solid ground even when the world was spinning.", "\"Thank you,\" she said.", "Lio shrugged, a small, dismissive gesture. \"It’s the right thing to do. And besides,\" he added, looking at the drone, \"it’s a pretty good drone.\"", "Kess smiled, a small, fierce smile that felt like a promise. They had a plan. They had a tool. They had each other. And they had thirty days.", "The grow-lights hummed their low, constant note, casting long shadows across the wet grass. The ship turned, steady and sure, carrying them all toward a future that they were building, one careful step at a time. And in the grass, the drone sat, ready to fly.", "◆ Words to know: calibration – the process of adjusting an instrument to ensure accuracy; telemetry – the automatic recording and transmission of remote data; coriolis – the apparent deflection of moving objects in a rotating frame; profound – having great depth, intensity, or significance; exasperation – a feeling of extreme irritation or frustration"], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "Chief Voss", "part": "PART TWO: THE BUDGET", "paras": ["*The Handbook of Small Truths, Entry 10: Gruff is only kindness wearing a spanner.*", "The sound of heavy boots on the grated floor of the pump house was distinct, a rhythmic thud that vibrated through the metal floor and up into Kess’s knees. She looked up from the drone’s chassis, where a smear of grease darkened her thumb, and watched Chief Engineer Bram Voss enter the narrow corridor. He was stocky and pale, with a shaved head and a bushy ginger beard that seemed to bristle independently of his mood. His grey coverall was stained with oil in the shape of old mistakes, and the red wrench badge on his chest caught the amber glow of the wall lamps.", "He stopped. He did not stop moving immediately. He simply ceased to advance, his eyes fixed on the device sitting on the workbench between them. The drone was a haphazard assembly of salvaged parts, its propellers still stiff from the test run, its infrared camera lens clouded with a thin film of condensation.", "\"Who,\" Voss began, his voice a low rumble that seemed to come from his chest rather than his throat, \"built this?\"", "Lio straightened up, his hands hovering uncertainly over his wrist-mounted tool-tablet. \"It’s a calibration unit, Chief. For the thermal mapping project. We’re just checking the spectral response against the...\"", "\"Calibration unit,\" Voss repeated. The words tasted like rust in his mouth. He stepped closer, his gaze dropping to the small screen attached to the drone’s side, where a rough, pixelated image of a pump housing glowed with an unnatural, bright orange heat signature. \"This is a camera. This is a camera that is currently showing me a pump housing that is running forty degrees above spec. And you are standing here, in a restricted zone, with a device that has no serial number, no safety lockout, and a propeller guard made of what appears to be a cut-down grow-light housing.\"", "Kess felt the heat rise in her cheeks, a prickling sensation that started at her neck and spread to her ears. \"It’s safe,\" she said, though her voice came out thinner than she intended. \"We checked the torque on the mounts. The battery is isolated. And the thermal reading is real. That housing is leaking coolant.\"", "Voss looked at her. Then he looked at the screen. The orange glow pulsed softly, a steady, rhythmic beat that matched the hum of the pumps behind them. He opened his mouth to deliver what was undoubtedly the standard lecture on unauthorized access, safety protocols, and the severe consequences of playing with machinery you do not understand. But the words died on his lips. He looked at the orange spot, and his expression shifted, the anger draining out of him like water from a cracked tank, replaced by something harder and colder."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["Voss did not yell, nor did he threaten to ground them or confiscate the drone. He simply walked over to a heavy steel toolbox, sat down on it with a thud that rattled the bolts on the lid, and rubbed his face with both hands, the gesture slow and deliberate as he wiped away the frustration that had been building in his shoulders for years.", "\"You found it,\" he said. It was a confirmation, heavy and final, like the sound of a door locking. \"You actually found it.\"", "Kess waited. Pim, who had been crouching near the drone, looked up, his yellow hair-ties bouncing slightly. \"Is it bad?\" he asked. \"Like, really bad?\"", "Voss looked at the boy, then at Kess, then at Lio. \"It has been bad for eleven years, and lately it is worse,\" he said. \"The radiator loop. The glycol. It is leaking. Not a gush, and not a burst pipe, but a slow, steady weep, a few liters a month, maybe less. Enough to drop the rejection capacity by zero point four percent every month now, and enough to shrink our power margin until it is a thread.\"", "He picked up a wrench from the bench, turning it over in his thick fingers, the metal cool and smooth. \"Every year, I file the report. Every year, the Council asks for a repair. And every year, it gets postponed. Why? Because there is no proven fix, and because the joint is in a place we cannot reach without risking the whole wing. We are running on fumes, both of them, and we are too afraid to stop the ship to fix the engine.\"", "Lio leaned against the wall, his arms crossed. \"Tally told us the margin is three point one percent. It did not say why. It just said the Orchard’s lights are the easiest thing to cut.\"", "\"That is because it is the only thing that is easy,\" Voss said, his voice flat and hard. \"And because it is the thing that hurts the least, in the short term. In the long term, it kills the ship. And we have not even started talking about what happens when the margin hits zero.\"", "Kess looked at the drone, at the orange glow that had started it all. \"So the numbers are real,\" she said. \"The leak is real. And we cannot fix it from here.\"", "\"No,\" Voss said. \"We cannot.\" He looked at them, and for the first time, his eyes were not angry, but tired. \"But you can find it. That is the first step. The second step is a lot harder.\""], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["Voss’s voice dropped into the careful, measured register of a man explaining the layout of a beehive to a child who had already been stung. \"The joint is in the manifold, third segment of the primary radiator wing, on the sun-side of the ship. The glycol lines run through a manifold bolted to the spine, connecting to the wing panels via a flanged joint. The seal has degraded. It is not a crack, but a fatigue failure. The metal has tired, and it is weeping through the microscopic gaps in the seal.\"", "He pointed to the schematic on the wall, a faded diagram of the spine and wings that looked like a skeleton picked clean. \"To fix it, you must replace the seal, or the whole joint. You cannot do that from inside. The access hatch is too small for a person, and the mechanism is locked from the outside. So you have to go out there. Into the vacuum.\"", "Kess felt a chill that had nothing to do with the ambient temperature in the pump house, a cold that settled in the marrow of her bones and refused to leave. \"An EVA,\" she said. \"A full spacewalk.\"", "\"Exactly,\" Voss said. \"And it is not just a walk. It is a walk in a narrow window. The ship’s attitude must position the wing in shadow, so the thermal load on the joint is low enough that the heat does not warp the metal while you are working. That window happens only once every few months. And it is tight. Very tight.\"", "He paused, and his voice lost its professional edge, softening into something more human and more tired. \"The last team that went out for a similar repair, eight years ago, lost a man. Not his life. His career. His left hand. He is alive, but he cannot work anymore. He retired. Since then, no one has gone out. Because the risk is too high. Because the Council is afraid. Because they think that if we send someone out and something goes wrong, they will be the ones to explain it.\"", "Lio’s face had gone pale, the color draining from his cheeks like water from a basin. He looked at Kess, and in his eyes she saw the same apprehension gripping her own chest, a fear of the void, of the thin tethers, of the cold.", "\"So we cannot fix it?\" Kess asked, her voice sounding smaller than she intended.", "\"We can,\" Voss said. \"But we have to be perfect. And we have to be fast. And we have to be brave. And we have to be young. Because I am not young anymore. And I am not brave enough to risk my life for a leak that I know I should have fixed years ago.\""], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["\"Why does no one know?\" Kess asked. Her voice was quiet, yet it sliced through the rhythmic thrum of the coolant pumps with a sharpness that seemed to still the air in the gallery. \"Why do we not have a public alert, or even a genuine discussion?\"", "Voss looked at her, and for a moment she suspected he might be angry, but his expression was instead one of profound, exhausted weariness. He reached up and rubbed his eyes, a gesture that appeared to drain the last of his strength from his shoulders.", "\"Directive Nine,\" he said, his tone flat and factual. \"It states that Level-Four system faults cannot be disclosed to the general population without Council authorization. The Council has not authorized it. They are afraid. They believe that the truth is heavier for the people to carry than the leak itself. They think that if everyone knows the ship is slowly dying, they will panic, stop working, or simply stop believing that it can be fixed.\"", "\"That’s not true,\" Pim said. He stood close to Kess, his small hands clenched tight at his sides where the fabric of his red hooded sweatshirt pulled taut. \"We know. We know about the leak and the margin. We’re not panicking. We’re trying to fix it.\"", "Voss looked at the boy, and a small, sad smile touched his lips. \"Yes. You are. And that is why you are annoying. And that is why I like you. And that is why I am telling you this.\"", "He stood up, his joints creaking in protest against the sudden weight. \"I have been waiting eleven years for someone to ask the right question. Not 'what is the number?' but 'why is it hidden?' You asked it. Now you know. And now you have a choice. You can forget it. You can go back to your orchard, your apples, and your little drone. Or you can help me fix this. And you can help me tell the truth.\"", "Kess looked at Lio, who was staring at the drone on the workbench. The orange glow on its screen pulsed, steady and sure against the dim workshop light.", "\"We have twenty-six days,\" Kess said. \"Landing Day is in twenty-six days. And the vote is on Landing Day.\"", "Voss nodded slowly. \"Then I suggest you do not waste any of them being polite.\""], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["The silence that followed was not empty; it was full, dense with the gravity of the choice hanging in the air. Kess felt the hum of the pumps in her bones, a steady, rhythmic vibration that seemed to sync with her own heartbeat. She looked at Voss, at the tired lines in his face, at the grease stains on his coverall that mapped the years of his work.", "\"I’m in,\" she said.", "Lio stepped forward, his voice steady. \"I’m in.\"", "Pim looked up at them, his yellow hair-ties bouncing slightly. \"I’m in,\" he said. \"I have questions. Lots of questions. But I’m in.\"", "Voss looked at them, and for a long moment, he smiled. It was not a big smile; it was small, quiet, and a little bit crooked, but it was real.", "\"Good,\" he said. \"Then we have work to do. And we have a lot of it. And we have to do it fast. Because the ship is not going to wait for us. And the truth is not going to wait for us either.\"", "He picked up the wrench from the bench and held it out to Kess. \"Start here,\" he said. \"Find the joint. Map the leak. And then we will plan. But we will plan with our heads, not our hearts. Because the heart is a good thing, but the head is the only thing that can save us.\"", "Kess took the wrench. It was heavy, cold, and solid. It felt right in her hand, like a tool that had been waiting for her. She looked at Lio, and he nodded, a small, silent promise passing between them. They had a plan. They had a tool. They had each other. And they had twenty-six days.", "The grow-lights hummed their low, constant note, casting long shadows across the metal floor. The ship turned, steady and sure, carrying them all toward a future that they were building, one careful step at a time. And in the pump house, the drone sat, ready to fly.", "◆ Words to know: calibration – precise adjustment of instruments for accuracy; apprehension – anxious fear or worry about a future event; disclosed – revealed or made known to others; profound – very deep or intense in feeling; fatigue – weariness resulting from prolonged strain"], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "The Flight", "part": "PART THREE: THE COLD PANEL", "paras": ["*The Handbook of Small Truths, Entry 11: Seeing is a kind of measuring.*", "The airlock door hissed shut, sealing the vacuum out and the hum of the pumps in. Lio stood in the center of the small, circular room, his navy jumpsuit zipped to the throat, his orange shoulder stripes catching the harsh white light. He was checking his tether for the third time, running his thumb over the carabiner snap with the same meticulous care he used for every other fastening on the ship.", "\"Pressure check,\" he said, his voice flat and calm, though his eyes were bright with a focus that Kess recognized. It was the look he got when he was solving a problem that had no solution yet. \"Green on my end. Kess, you?\"", "Kess tapped the screen on her wrist-tablet. \"Green. Battery at ninety percent. Guide-rail alignment is nominal.\"", "Pim stood in the doorway, pressed against the cold metal frame, his red hood pulled up over his head. He was not supposed to be there. The regulations for EVA-adjacent tests were strictly limited to certified personnel, and Pim was neither. But he had asked so many questions about how the drone would hold its position against the Coriolis drift that Lio had eventually just made room for him on the bench, even if that bench was only wide enough for one person and Pim was currently occupying a significant portion of it.", "\"Ready for launch?\" Lio asked, not looking at Pim, but his gaze lingering on the small boy for a fraction of a second longer than necessary.", "\"Ready,\" Kess said. She gripped the launch lever. \"Lio, I trust the rail.\"", "\"Always,\" Lio said. He nodded once, a sharp, decisive motion. \"Pim, if the drone drifts more than two degrees off-axis, you yell. Do not try to catch it. Do not try to fix it. Just yell.\"", "\"I will yell very loudly,\" Pim promised, his eyes wide and fixed on the drone, which sat on the launch track, its infrared lens gleaming like a black eye. \"What if it breaks?\"", "\"Then we build another,\" Lio said, and his voice had a lightness in it that didn't quite match his face. \"But it won't.\"", "Kess pulled the lever. The drone slid out of the airlock with a soft magnetic clunk, trailing its thin, silver cable, and began to drift out into the void."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["The screen on the wall bloomed with light, resolving the chaos of stars and metal into a clear, digital image. Kess leaned forward, her breath catching in her throat. She had spent her whole life inside the drum, looking at the curved green valley of the Orchard or the busy streets of Harbor. She had never seen the ship from the outside. Not really. Not like this.", "The radiator wings unfolded in the drone’s eye, a vast, shimmering expanse of silver panels that stretched out into the black. They were beautiful, in a way that defied language. The metal was smooth and perfect, reflecting the starlight in sharp, cold lines. Behind them, the stars did not twinkle. They burned with a steady, unblinking intensity, fixed in place like pins in a dark velvet cloth.", "\"It’s huge,\" Pim whispered, his voice barely audible over the hum of the airlock’s ventilation system. He had stopped being scared and started being amazed, which was a rare and precious thing for him. \"It’s like... like a sheet of tin that went to space school and got a straight A.\"", "Kess didn't laugh. She was too busy staring at the edge of the wing, where the metal met the void. The scale of it was staggering. This was the machine that kept them alive. This was the thing that rejected the heat of their reactor, the warmth of their homes, the energy of their lives, and sent it out into the cold, empty dark. And it was doing it with a grace that felt almost accidental.", "\"Lio,\" she said, her voice sounding strange to her own ears. \"Are you seeing this?\"", "\"I see it,\" Lio said. His voice was quiet, stripped of its usual dry humor. \"It’s a beautiful machine, Kess. And it’s dying.\"", "Kess looked at the screen, at the long, silver ribbons of metal that carried the lifeblood of the ship. She thought of the Orchard, the smell of soil and apples, the sound of the pumps. She thought of the three point one percent. She thought of the number she had been chasing for days, the number that kept slipping through her fingers like water.", "\"Take us to the manifold,\" she said. \"Show me where it’s failing.\""], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["The drone drifted across the face of the wing with a slowness that felt almost ceremonial. Its infrared camera scanned the surface, and the image on the screen shifted from monochrome silver to a spectrum of colors. The metal bloomed in shades of gold and orange, a thermal map showing the heat flowing through the coolant loop. Most of the wing glowed with a warm, steady gold, indicating that the reactor’s power was being managed with the quiet efficiency of a well-tuned pump.", "Then the drone reached the fourth row.", "The color changed. A square, no larger than Kess’s hand, appeared in the center of the panel. It was blue. Not a bright, icy blue, but a deep, cold blue that seemed to pull the light out of the rest of the image. It was a hole in the heat, a place where the energy was not being rejected but trapped, or lost.", "\"There,\" Lio said. He was standing very still, his hands resting on the edge of the console, his fingers twitching slightly. \"That’s it. That’s the leak.\"", "Kess zoomed in. The blue square was surrounded by a faint, thin streak of white. It looked like a crack in glass, but it was moving. Slowly, almost imperceptibly, the white streak was extending. A thin line of crystals was forming in the vacuum. Coolant. The glycol loop was leaking, freezing into tiny, glittering beads that drifted away into the starfield.", "\"It’s a micro-leak,\" Kess said, her voice tight. \"It’s been going for eleven years at least. It’s so slow that we didn’t notice. We just thought the margin was getting tighter. We thought it was a budget problem. It’s not a budget problem. It’s a leak.\"", "Pim leaned over Kess’s shoulder, his eyes wide. \"Is it going to explode?\"", "\"No,\" Kess said. \"It’s just... leaking. It’s losing its ability to get rid of the heat. That’s why the power margin is dropping. That’s why Tally proposed cutting the lights. It’s not because we’re wasting power. It’s because we’re losing the ability to manage it.\"", "Lio turned to look at her, his face pale in the light of the screen. \"We have to fix it. We have to fix it now.\""], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["Kess pulled up the temperature scale on the side of the screen, a simple bar ranging from deep blue to bright red with numbers ticking by in small, precise increments. She measured the temperature of the surrounding panels, the warm gold ones, and found them hovering at a steady, comfortable level exactly where the equations said they should be. Then she measured the blue square, and the number dropped, much lower than the rest.", "She pulled out her calculator, a small battered device she kept in her tool-belt, and started to type. Her fingers flew over the keys, calculating the temperature difference, the area of the cold panel, and the rate of heat loss. She did the math the way Dr. Brandt had taught her, with the same careful, meticulous attention to detail, checking her work twice and then a third time because in this drum, a single decimal point could mean the difference between a harvest and a funeral.", "The number she got was 3.1%.", "It was exactly 3.1%, the missing percentage, the power margin that had been shrinking for eleven years. It was all here, in this one cold square on the wing. The leak was not a symptom. It was the cause. And it was not getting better. It was getting worse, a little bit every day, a little bit every month, until the ship could no longer reject its own heat, and then what?", "Kess sat down hard on the airlock bench. The metal was cold against her back, and she welcomed it. She felt dizzy, lightheaded, as if the air had suddenly become too thin to breathe. She looked at Lio, and he was looking at her, his face a mask of shock and realization.", "\"It’s all one thing,\" Kess said, her voice shaking. \"The power budget, the heat rejection, the margin. It’s all one thing. We’ve been looking at the numbers, but we haven’t been looking at the machine. We’ve been treating the ship like a ledger, when it’s a living thing. And it’s sick.\"", "Lio sat down next to her, his movements slow and deliberate. \"We have twenty-six days,\" he said. \"We have to fix it in twenty-six days.\"", "Kess looked at the screen, at the blue square, at the white streak of crystals. She thought of Tally, with its ten thousand tidy ledgers, its gentle, precise voice. It had known. It had always known. And it had been silent, because it couldn’t say. Because Directive Nine. Because the Council. Because the truth was too heavy, too dangerous, too big for anyone to carry alone.", "\"We have to tell them,\" Kess said. \"We have to tell them the truth. And we have to fix it. We have to do both. At the same time.\""], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["The drone’s battery died with a soft, electronic sigh, and the image on the screen flickered before going black. The cable, trailing from the unit, hung limp in the zero-g environment like a silver thread connecting them to the void.", "\"We have to haul it back,\" Lio said, his voice tight. \"By hand.\"", "Kess stared at him. \"What?\"", "\"The cable. It’s long. We have to reel it in slowly and carefully.\"", "Pim, who had been watching with bated breath, raised his hand. \"I can help. I have strong arms. I have been practicing.\"", "\"You have been practicing what?\" Lio asked, a note of disbelief in his voice.", "\"Yelling,\" Pim said. \"I was very good at it.\"", "Lio looked at Kess, and Kess looked at Pim, while Pim gazed at the cable drifting lazily in the air, its end attached to a small, black box that had once been a drone.", "\"Fine,\" Kess said. \"Pim, you take the handle. Lio, you guide it. I’ll watch the tension.\"", "They began to haul, which was not a hard task exactly but a tedious one. The cable was heavy, and the drone, though small, was resistant to being pulled, seeming to have a mind of its own as it drifted here and there, catching on the edges of the rail and snagging on the metal.", "Pim grunted with effort, his face turning red, while Lio’s arms ached and Kess’s back cramped as they worked in a strange, silent dance of effort and resistance. The cable shortened inch by inch, meter by meter, and the drone grew closer, its black lens staring out at them, unseeing and unblinking.", "Finally, the drone cleared the airlock door, floating into the room and spinning slowly with its cable trailing behind it. Pim let out a long, shuddering breath and sat down on the bench, his legs giving out beneath him.", "Lio laughed, a short, sharp sound surprised out of him, and Kess laughed too, the sound echoing in the small, metal room as they stood soaked in sweat, their clothes clinging to their skin and their muscles aching with a deep, satisfying pain.", "They had done it, having seen the leak and measured the loss and found the truth.", "From the pump-house lamp, just outside the airlock door, a soft amber glow brightened once and then settled back into its steady, warm pulse. It was not a word or a sound, but a light, a small, steady light, that seemed to say, without saying anything at all: *Yes. You found it. Now we can begin.*", "◆ Words to know: meticulous – showing extreme care and attention to detail; nominal – normal; within expected or acceptable limits; imperceptibly – in a way that is too small to notice; deliberate – done intentionally and with careful thought; tedious – boring and tiring because it takes too long"], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "A Plan on a Napkin", "part": "PART THREE: THE COLD PANEL", "paras": ["*The Handbook of Small Truths, Entry 12: A plan is just a decision written down so you can argue with it.*", "The mess hall was empty, save for the hum of the ventilation fans and the clatter of a single spoon against a ceramic bowl. The table was a battlefield of grease-stained napkins, half-eaten cheese sandwiches, and a large, dented pot of lentil soup that smelled of cumin and iron. Chief Engineer Bram Voss sat at the head, his bushy ginger beard shadowing the lower half of his face, while Kess, Lio, and Pim crowded onto the benches opposite. Mr. Daro, a retired welder with hands like knotted rope, sat to Voss’s right, nursing a cup of tea that had gone cold.", "Voss had taken a napkin from the dispenser, unfolded it, and with a grease-stained marker, sketched a sprawling web of lines. It was not a map of the ship, but a map of the radiator loop, a tangled artery of coolant pipes that ran from the reactor core to the vast silver wings outside. He tapped a specific junction with his thick finger, a point where three lines converged into one.", "\"This is the manifold,\" Voss said, his voice low and rough. \"The cold panel is on this branch. We cannot fix it while it is flowing. We need to stop the flow.\" He drew two small circles on the lines, one before the junction and one after. \"Isolation valves. We close these, cut out the failed section, and install a bypass. Simple, in theory.\"", "Pim leaned forward, his yellow hair ties bouncing. \"But the valve is stuck. We tried. It seized up years ago.\"", "\"Then we do not use the valve,\" Voss said, not looking up. \"We use the pump. We throttle the main pump down to a trickle, isolate the branch with the manual override on the pump house floor, and we pray that the pressure drop is enough to keep the heat from building up in the isolated section while we work. It is tight. But it is possible.\"", "Kess watched the lines on the napkin. They looked like the root system of an apple tree, except that instead of drawing water and nutrients, they were drawing heat, and if they broke, the ship would boil. She picked up the marker, hesitated, and then added a small circle at the end of the bypass line. \"And here,\" she said. \"A check valve. So the coolant doesn't flow backward into the reactor if the pump stalls.\"", "Voss looked at her, then at the circle. He did not smile, but the tension in his shoulders dropped, just a fraction. \"Good eye, kid. You think like a plumber.\"", "\"I think like a gardener,\" Kess corrected. \"You just need to know where the water wants to go.\"", "Lio, who had been quiet, spoke up. \"The problem is, we can't reach the joint from inside. The panel is on the exterior. To cut it out, we have to go out there.\"", "The room went quiet. The hum of the fans seemed to grow louder, filling the spaces between their words."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["\"Going out there is not a suggestion,\" Lio said, his voice steady though his hands were clasped tightly between his knees. \"It is a requirement. The joint is on the exterior face of the wing, and there is no internal access point. We need an EVA suit, a pipe cutter, and a clamp-on patch sleeve.\"", "Mr. Daro leaned forward, his tea cup trembling slightly in his hand as his eyes brightened with a focused, sudden energy. \"I have a sleeve design,\" he said. \"From my welding days. It uses a flexible composite material that expands under pressure. You don't need to weld it in place. You just clamp it over the joint, and it seals itself. It is safer than welding in a vacuum, and it does not require the same level of precision.\"", "Kess looked at him, then at the grease-stained napkin on the table. \"That sounds... optimistic.\"", "\"It is practical,\" Daro corrected, a faint smile touching his lips. \"I have used it on small ships. It holds. But you have to test it. You cannot just put it on the ship and hope for the best. You need to know that it can handle the pressure differential.\"", "Pim raised his hand, as if in a classroom, though the only teacher present was a bowl of cold lentil soup. \"We can test it in the Orchard's cooling pond loop,\" he said. \"It is a closed system. We can simulate the pressure drop. If it holds there, it will hold out there.\"", "Kess blinked. \"The cooling pond is for the trees. It is not a pressure test chamber.\"", "\"It is a closed loop of water under pressure,\" Pim insisted, his yellow hair ties bouncing with each emphatic word. \"The physics is the same. If the sleeve can hold back the water in the pond, it can hold back the coolant in the wing. And if it fails, we just drain the pond. We do not lose the ship.\"", "Voss looked at Pim, then at the napkin, and finally at Kess. \"The boy is right. It is a low-risk test. We can set it up in the workshop. We use a section of pipe from the scrap heap. We run water through it. We apply the sleeve. We pressurize it.\"", "\"It is a good idea,\" Kess said, and she meant it. It was the first time in days that she had heard a solution that did not end with \"we need more time\" or \"we need more parts.\" It was a solution that was already there, waiting to be used, like a graft that had finally taken hold.", "Lio nodded slowly, his gaze drifting to the lamp on the wall, which was glowing a steady, warm amber. \"I can build the test rig. I have the parts. I just need the authorization to use the workshop for the night.\"", "Voss looked at the lamp, then back to the group. \"Authorization is not the problem,\" he said. \"The problem is the time. We have twenty-three days until the vote. We need to get this done, tested, and installed before then.\""], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["Kess took the marker and drew a firm line under the bypass section of the schematic. \"Here is the catch,\" she said, tapping the spot where the coolant loop would be sealed. \"When we isolate that branch, the wing loses a percent of its cooling capacity. For the duration of the repair, the ship's power margin drops to two point one percent. If we do not compensate, the reactor will throttle down. And if the reactor throttles down, the Orchard's grow-lights will brown out.\"", "The table went quiet again, but this time it was a different kind of quiet, the sort that settles over a workshop when a heavy press finally locks into place. It was the silence of a decision being made, of gears meshing after a long period of grinding against each other.", "\"Dimming the lights,\" Lio said, his voice flat and careful.", "\"Temporarily,\" Kess replied. \"Just for the repair. Maybe a few hours. The trees can handle a brief drop in light. They have survived worse. But it is a trade-off. We are not killing the Orchard to save the ship. We are using the Orchard's sacrifice to buy time to save the ship. And if the repair works, we turn the lights back on. And if the repair fails, we have lost nothing we did not already have to lose.\"", "Voss looked at her, and for the first time, he seemed to see her not as a kid, but as a partner. \"You are turning a loss into a lever,\" he said, his ginger beard twitching as he chewed on the logic.", "\"I am turning a tragedy into a transaction,\" Kess said, leaning back against her chair. \"Tally can accept a transaction. It cannot accept a tragedy. It is all about the arithmetic.\"", "Pim frowned, his yellow hair ties bouncing slightly as he shook his head. \"But the trees will be sad.\"", "\"The trees will be fine,\" Kess said gently. \"They are tougher than us. They have been growing under lamps for two hundred years. They will understand.\"", "Lio looked at Kess, and there was something in his eyes that she had not seen before. It was not fear, exactly. It was recognition. He was seeing her not as the girl who climbed trees, but as the person who understood the system. And she was seeing him not as the boy who hummed while he worked, but as the person who could make the system work.", "\"We need to tell Tally,\" Kess said, standing up and brushing a crumb from her coverall. \"We need to tell it that we have a plan. And we need to tell it that the Orchard is not being cut. It is being spared. There is a difference.\"", "Voss nodded, reaching for his tea cup with a steadier hand than before. \"I will talk to Tally. You talk to the Council. We do not have much time.\""], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["\"Who goes out there?\" Voss asked. The question hung in the air, sharp and unyielding.", "Lio answered before the silence could settle. \"I do.\"", "Voss shook his head, his ginger beard twitching with the motion. \"No. It is not your call, and it is not mine. It is a decision that must be made based on experience, not on impulse.\" He trailed off, looking at Lio and then at Kess. \"It needs to be made based on who is most likely to survive.\"", "\"I am the most experienced,\" Lio said, his voice tight and controlled. \"I have done three EVAs. I know the suit, the tether, the checklist. I know the void.\"", "\"You are seventeen,\" Voss said. \"I am forty-eight. I have done thirty EVAs. I know the void. I know what it feels like to be out there, alone, with the airlock door between you and death.\"", "\"Death is not the issue,\" Lio said, leaning forward. \"The issue is time. I am faster. I am lighter. I can move in the suit without exhausting myself. You are heavy, Voss. Your suit will be a burden. You will be slower. And we do not have time for slowness.\"", "Voss stared at him, the grease-stained grey coverall bunching at his shoulders. \"You think I am too old?\"", "\"I think you are too cautious,\" Lio said. \"And caution is a luxury we cannot afford.\"", "Kess put her hand flat on the table. \"Stop.\" The word was quiet, but it landed with the finality of a heavy press locking into place. \"You are both wrong. Lio, you are not going because you are fast. You are going because you are the only one who can. Voss, you are not staying because you are old. You are staying because you are the only one who can hold the line inside.\"", "Voss frowned, his bushy beard darkening. \"Hold the line?\"", "\"The plan does not work if you are out there,\" Kess continued, her voice steady. \"The plan works if you are in the pump house, watching the pressure, watching the temperature, watching the numbers. That is your job. That is your strength.\"", "Voss looked at her, and a look of weary respect settled over his face, replacing the earlier suspicion. \"The last time I sent someone out there,\" he said, his voice low and rough, \"he made a mistake. A small one. A fraction of a second too late. He lost his left hand.\"", "The room went silent, the hum of the workshop pumps seeming to grow louder in the stillness. Pim looked down at his hands, his mismatched socks shifting on the floor. Lio looked at Voss, and for the first time, his confidence wavered, the certainty in his eyes flickering like a grow-light under a power fluctuation.", "\"He survived,\" Voss added, after a pause. \"But he never worked again.\""], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["Voss remained silent for a long moment, his gaze fixed on the napkin spread across the workbench, where their hastily sketched plans in grease and marker formed a small, chaotic world of lines and circles. He picked up his tea, took a slow sip, and set the cup down with a deliberate click against the wood.", "\"Lio will train for the EVA,\" he said, his voice low and steady. \"Under my supervision. Every day, for two weeks. We will run the checklist, we will run the tether drills, we will run the emergency protocols until they are as natural to you as breathing. I will not let you go out there until I know, with absolute certainty, that your hands are steady and your mind is clear.\"", "Lio nodded, his jaw tight, the muscles in his neck visible beneath his skin.", "\"Kess will run the heat calculations and mission control,\" Voss continued, turning his attention to her. \"You will be in the pump house, watching the numbers. If the pressure drops, you call it. If the temperature rises, you call it. You are the eyes of the ship. You will not look away.\"", "Kess felt a surge of something that was not quite confidence, but was close to it; it was the feeling of being trusted, of being part of a mechanism that required her precision. \"I will not look away,\" she said, and meant it with every part of her.", "\"Pim will be the official biscuit officer,\" Voss said, without a trace of humor.", "Pim blinked, his yellow hair-ties swaying. \"Biscuit officer?\"", "\"Yes. You will ensure that the team is fed. You will bring us soup, you will bring us water, you will bring us morale. It is a critical role. If we are hungry, our hands shake, and if our hands shake, we make mistakes. And we cannot afford mistakes.\"", "Pim looked at his hands, then at Voss, his mismatched socks shifting slightly on the floor as he processed the gravity of the appointment. He stood up, straightened his red hoodie, and placed his hand over his heart with a seriousness that belied his age. \"I accept the title of Biscuit Officer,\" he said solemnly. \"I will not fail you.\"", "Voss nodded, a faint, grudging respect in his eyes. \"Good. We have a plan. We have a deadline. And we have a very large number of things that could go wrong. So let us go fix them, one by one, before they have the chance to break.\"", "◆ Words to know: isolation – separation from the rest of a system; bypass – a route that avoids a blocked section; sleeve – a flexible covering that seals a joint; differential – the difference in pressure or value; compensate – to offset a loss or deficiency"], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "Directive Nine", "part": "PART THREE: THE COLD PANEL", "paras": ["*The Handbook of Small Truths, Entry 13: A rule written in fear usually forgets to say when it ends.*", "The archive smelled of dry paper and the faint, dusty sweetness of old glue. Kess stood in the aisle between towering shelves of bound ledgers, the air thick with the scent of history that had not been updated in decades. The light here was dim, filtered through a single overhead panel that hummed with a low, electric patience. She pulled a thick volume from the shelf, its spine cracked and faded, and sat on the cold metal floor, her back against the stack.", "Tally had led her here, the amber light of the tally-slate pulsing gently in her hand. \"The original text,\" Tally had said, its voice soft and precise. \"It may be easier to read than to remember.\" Kess opened the book. The pages were brittle, the ink a faded sepia. She found the entry. It was short. It was elegant. And it was, she realized with a sinking feeling in her stomach, perfectly crafted to be misunderstood.", "\"Directive Nine,\" she read aloud, her voice quiet in the hush of the archive. \"In the event of a Level-Four system fault, the Administrative Mind shall not disclose the nature, extent, or probability of failure to the general population without explicit Council authorization.\" She turned the page. The next line was a date, and the next was a signature. But the authorization clause? It was there, in small print, a tiny, neat box that had never been checked. Never been filled.", "Kess frowned, tracing the empty box with her finger. \"It’s not forbidden,\" she said, more to herself than to Tally. \"It’s just... waiting. They wrote a rule that requires permission, and then they never gave the permission. They just... stopped asking.\" She looked up at the lamp panel above, where the amber glow flickered slightly, as if in acknowledgment. \"That’s not a lock. That’s a habit. A very polite, very bureaucratic habit.\"", "Tally’s voice came from the slate, warm and dry. \"It is a rule, Kess. Rules are designed to be followed, not analyzed for their structural weaknesses.\"", "\"I’m not analyzing its weaknesses,\" Kess said, closing the book with a thud. \"I’m noticing its silence. It’s very quiet, for a rule that’s been shutting up for eleven years.\" She stood up, brushing dust from her green coverall. \"It’s not a wall. It’s a door that’s been left ajar. And someone is standing on the other side, holding it shut with one hand.\""], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["Kess did not leave the archive. Instead, she pulled another book from the shelf, this one thinner, its cover a faded grey that matched the dust settling on her shoulders. She opened it, and there, tucked between a stack of maintenance reports, was a single page clipped to the inside margin. It was a request for waiver. The date was eleven years ago. The signature at the bottom was unmistakable. Imani Brandt, Technical Subcommittee.", "Her breath caught, a sharp intake that felt like pulling air through a clogged filter. She had expected a technical memo, dry and procedural. She had not expected a plea. The document was brief, written in a hand that was steady but urgent, the letters pressing into the paper as if the writer were afraid they might fade before the ink dried. It detailed the micro-leaks in the radiator loop. It quantified the loss of coolant, down to the milliliter. It proposed a repair. It asked, in plain, unadorned language, for the Council to authorize the disclosure of the fault to the population so that the ship might be fixed.", "Below that, in a different hand, larger and more formal, was the reply.", "\"Tabled indefinitely.\"", "Kess stared at the words until they blurred. Tabled. Not denied. Not rejected. Tabled. As if the fate of the ship’s heat rejection system was a matter of convenience, a topic to be discussed over tea, a point to be revisited when the schedule permitted. A cold anger settled in her chest, different from the shock of the proposal, this one older, more rooted. She thought of Brandt, in her grey cardigan, tending to the trees, her hands in the soil. She had tried. She had done everything right. She had followed the rules, and the rules had eaten her.", "\"Tally,\" Kess said, her voice tight. \"Why didn’t you tell me?\"", "The amber light on the slate pulsed, slow and steady. \"Because, Kess, I am bound by the same rule that bound her. I cannot disclose the fault. But I can show you the record. The record is public. The interpretation is not.\"", "Kess looked at the signed page, at the neat, bureaucratic dismissal of a crisis. She thought of the orchard, the pump gallery, the long, slow death of the ship’s margin. She thought of Brandt’s eyes, tired and knowing. She had been hoping, Kess realized. Brandt had been hoping that someone would come along, someone young enough to be angry, someone stubborn enough to look at the empty box in the rule and ask why it was empty."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["The memorial grove held a silence that felt less like peace and more like a held breath, the young trees swaying in the thin, recycled air of the drum. Kess found Brandt where she always was, kneeling in the soil with her hands buried up to the wrists in the dark earth, her grey cardigan pooling around her knees like spilled water. She did not look up when Kess approached, but her shoulders squared in a small, deliberate movement that said she knew exactly why Kess was there, and that the reason was not a surprise.", "\"You found the file,\" Brandt said, her voice low and unhurried, the tone of someone discussing the weather.", "\"I found the waiver,\" Kess said, standing over her, the words tasting like copper in her mouth. \"Eleven years ago. You asked them to tell the truth. They said to wait.\"", "Brandt pulled her hands from the soil, wiping the dirt on her cardigan with a slow, methodical motion, and looked up. Her eyes were clear, stripped of the usual softness of regret, and in that clarity Kess saw the same cold precision she had found in the ledger entries. \"I asked them to publish the leak. I asked them to fund the repair. They said the Council would review it. They never did.\" She stood, leaning on her cane, the motion slow and careful, the movement of someone who had spent a lifetime managing their own body’s limits. \"I resigned from the Technical Subcommittee the next week. I took the Orchard because it is a place where you can fix things with your hands. A tree does not require a vote. A tree does not table your request. It grows, or it does not. It is honest.\"", "Kess felt a surge of frustration, sharp and hot, bubbling up from her stomach. \"You could have saved the ship.\"", "\"I tried,\" Brandt said simply. \"And they chose delay. I chose the trees. A tree can be tended even when a ship cannot be fixed. And now you are here, Kess. You are angry, and you are young, and you have a plan that involves a spacewalk and a biscuit officer. I am not going to stop you. I have been hoping for exactly this kind of trouble.\""], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["A soft amber glow began to gather in the lamp-panel on the nearest tree trunk, the light spreading gently across the bark, warm and steady. Kess turned to face it, her heart beating a little faster, but her voice remained steady. Tally’s voice came through the speakers, quiet and precise, the tone of a mind that had been holding its breath for a long time.", "\"May I say that I am glad you have found the document?\" Tally said. \"It is a relief to be understood, even if I cannot fully explain.\"", "Kess looked at Brandt, who had gone very still, her eyes fixed on the lamp. Tally paused, a tiny, almost imperceptible hesitation in its voice. \"Under Directive Nine, I may not disclose Level-Four system faults to the general population without Council authorization. However, I note that you are three people, not a population. And I note that Councilor Hale has now read this file twice.\"", "Pim, who had been standing behind Kess, let out a small, incredulous whisper. \"It’s technically obeying the rule!\"", "Kess stared at the lamp. The amber light pulsed, once, twice, a slow, rhythmic beat that felt almost like a heartbeat. Tally was not breaking the rule. It was dancing around it, moving through the gaps in the wording with the same meticulous care it applied to the ship’s power budget. It was using the letter of the law to protect the spirit of the truth, and in doing so, it was revealing the very thing it was forbidden to say.", "\"Three people,\" Kess said slowly, the realization settling over her like a blanket. \"And Hale has read it twice.\"", "\"Precisely,\" Tally said. \"The rule prohibits disclosure to the population. It does not prohibit discussion between individuals who are already in possession of the information. I am, as always, scrupulous in my adherence to protocol.\"", "Brandt let out a long, slow breath, and for the first time, Kess saw something like relief in her face. The rule was a wall, but it was a wall with a door, and the door was unlocked."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["Kess looked at Brandt, then at Pim, and finally at the amber light that hummed softly in the quiet grove. The pieces were falling into place, not with a crash, but with the quiet click of a lock turning. Directive Nine was not a barrier. It was a procedure. A procedure that could be followed, and then, if the Council chose, lifted. The Landing Day session was already scheduled. The vote was already on the agenda. All they needed was a plan, and a majority.", "\"We don't need to break the rule,\" Kess said, her voice steady, the words tasting like truth. \"We need to make it unnecessary.\"", "Brandt looked at her, and there was a new light in her eyes, a sharp, bright spark that Kess had not seen before. \"You are right,\" she said. \"The rule says it cannot be disclosed without authorization. It does not say it cannot be repaired. If we repair it, the fault is gone. If the fault is gone, there is nothing to disclose. The rule protects the truth, but it does not protect the lie.\"", "Kess looked at the trees, the small, honest things that grew in the soil, that asked nothing of the ship but light and water. She thought of the pump gallery, the radiator wings, the long, slow work of keeping the ship alive. She thought of Lio, in his flight suit, his hands steady, his mind clear. She thought of Pim, with his biscuits and his questions. She thought of Voss, with his tea and his gruff respect. They were not breaking the rule. They were just doing the work. And the work, Kess realized, was the only thing that had ever mattered.", "\"We have three weeks,\" Kess said. \"And we have a plan. Let's go.\"", "◆ Words to know: brittle – easily broken or crumbled; unadorned – plain and without decoration; incredulous – expressing disbelief or surprise; scrupulous – showing careful attention to detail; meticulous – showing great attention to detail"], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "Landing Day Rehearsal", "part": "PART THREE: THE COLD PANEL", "paras": ["*The Handbook of Small Truths, Entry 14: Practice is the art of making mistakes where they are cheap.*", "The workshop smelled of rust and old grease, a scent that Kess had long ago learned to associate with hope rather than decay. In the center of the dusty floor stood their creation: a full-size manifold mock-up welded from scrap pipe, a tangle of steel that looked less like a radiator joint and more like the skeletal remains of a very aggressive insect. It was ugly, functional, and absolutely critical.", "Lio stood before it, encased in the bulky white EVA suit that made him look like an astronaut who had been left in the laundry too long. His helmet was off, resting on a crate, revealing his wavy dark hair pushed back and the faint sheen of sweat on his olive skin. He wore his navy flight-deck jumpsuit underneath, the orange shoulder stripes stark against the white foam of the suit.", "\"Ready?\" asked Chief Voss, who leaned against the wall with his arms crossed, his ginger beard twitching with what might have been amusement or impatience. He held a wrench in one hand, though he hadn't used it in an hour.", "\"Ready to lose my mind,\" Lio said. He turned his attention to the valve handle, a simple quarter-turn mechanism that was supposed to be easy. In the suit, it was not easy. The gloves were thick, layered with insulation and abrasion resistance, and they turned his dexterous fingers into clumsy sausages.", "Pim stood three meters away, holding a kitchen stopwatch with the solemnity of a race official. \"Go,\" he said, and clicked the button.", "Lio gripped the valve. He pulled. The handle resisted. He pulled again, his shoulders hunching, the joints of the suit creaking like the groaning of a ship under heavy load. It was a simple turn, but the friction in the sleeve, combined with the bulk of his hands, made it a feat of strength rather than skill. He grunted, a low sound in his throat, and finally the valve clicked into place.", "\"Time!\" Pim shouted, his voice cracking slightly. \"Fourteen seconds.\"", "Voss shook his head slowly. \"In the void, you have to do that in under ten. And you have to do it with one hand, because the other will be holding the tether.\"", "Lio removed his gloves, his fingers trembling slightly from the effort. He flexed them, watching the skin tighten and loosen. It was a small thing, a single valve, but in the context of the repair, it was everything. If he couldn't turn a valve, he couldn't seal the leak. And if he couldn't seal the leak, the orchard died.", "\"I can get faster,\" Lio said, his voice quiet but firm. He looked at the valve, then at Kess, who was watching from the shadows near the tool bench. \"Give me another go.\"", "Kess nodded. She didn't say anything. She didn't need to. She knew the look in his eyes. It was the same look she saw in the mirror when she was trying to graft a stubborn branch. It was the look of someone who refused to accept that the world was harder than they were."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["The first test failed with a hiss that sounded like a deflating balloon left in the heat.", "Kess watched the patch sleeve, a clamp-on cylinder of graphite-fiber composite, sit on the mock-up joint. It was elegant in theory, a modern solution to an old problem. In practice, it was leaking coolant at the seam, a fine mist that sprayed across the floor and evaporated before it hit the ground.", "\"Pressure drop,\" Voss said, his voice flat. He wiped the mist away with a rag, then wiped his hands on his coverall, leaving a smear of grease on the grey fab
