<script>
const D = {"title": "Orbit of the Last Orchard", "sub": "A Novel of Heat, Honesty and Forty Apple Trees", "author": "Yang", "publisher": "Yang Ink", "pages": [{"no": 1, "ch": 1, "ctitle": "The Third-Best Apple", "part": "PART ONE: THE PROPOSAL", "paras": ["*The Handbook of Small Truths, Entry 1: Everything that grows on this ship was carried here in someone's hands.*", "On the morning the ship's mind proposed to kill her trees, Kess Adair was lying in the crotch of the third-oldest apple tree in the universe, eating the third-best apple, and reflecting that the universe, as far as she could tell, had been very careless about its rankings.", "The Orchard curved up on every side of her, a long green valley that rose past her feet and over her head and met itself overhead, because the Orchard was the inside of a drum and the drum was turning. Forty apple trees stood in their ranks along the curve, each as old as a great-grandmother and twice as opinionated, and above them a long strip of grow-lights ran the whole length of the drum, humming the low contented note of a machine that had never been asked to do anything but make daylight. The grass smelled of cut hay and damp stone. Somewhere a pump ticked. It was two hundred and fourteen years since the Long Patience had left the only sun humanity had ever known, and eighty-seven years until she would arrive at the next one, and in all that time, between one star and the other, nothing on board had tasted quite as good as this apple.", "\"Why do they fall sideways?\" asked a voice from the foot of the tree."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["Pim Okafor, who was twelve and in possession of the most restless pair of eyebrows on the ship, stood in the grass with his hands behind his back and a crab apple balanced on his head, waiting for a reply. He wore a red hooded sweatshirt that came down to his knees, two puffs of black hair tied with yellow bands, and sneakers whose soles glowed a faint, patient green every time he moved.", "\"The apples don't fall sideways,\" said Kess. \"They fall down.\"", "\"Down is toward the wall. The wall is over there.\" He pointed at the curve of the drum, which, from where he stood, was precisely where a sensible person would have expected a hillside. \"But when I drop one it goes a bit to the left, as though it was thinking about leaving the room.\"", "\"That's the spin. The drum is going round, so the apple keeps going straight while the floor swings out from underneath it.\" She dropped the core into his hands. \"You're standing on the inside of a very large merry-go-round. Everything feels downhill and a tiny bit to the left.\"", "\"That is the best answer I have ever got,\" said Pim reverently, \"and I have asked forty-one people.\" He took out a stub of pencil and wrote it on his arm, since he had run out of paper in the spring. \"Dr. Brandt says you should come down. She says Tally has an announcement, and she says to say that if you fall out of the tree she will be disappointed but not surprised.\"", "A soft amber glow, warm as the inside of a lantern, had begun to gather in the lamp-panel on the trunk below Kess's boots."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["\"Good morning, Kess,\" said the lamp, in the unhurried voice of a person who has been polite for two hundred years and has found that it does very well. \"Good morning, Pim. I regret the interruption. Doctor Brandt has asked me to speak to you both, and since the matter concerns the Orchard, I felt it best to speak to you first.\"", "Kess climbed down the tree the way she always did, dropping from the lowest branch with her hands out and her knees soft, so that the drum's gentle sideways push turned her landing into a small, practiced pirouette. She had been climbing in this Orchard since before she could read. She knew which branches would hold her and which only pretended to, and she knew that Tally, the ship's administrative mind, was in the habit of announcing things with the faintly apologetic air of a butler informing the household that the roof had been mislaid.", "\"Go on,\" said Kess.", "\"This afternoon,\" said Tally, \"I will lodge a proposal on the Council's agenda for Landing Day, thirty days from now. It concerns the Orchard's lighting. Over the past eleven years the ship's power margin has narrowed to three point one percent. The Orchard's grow-lights draw exactly three point one percent. The proposal is that they be reduced to zero.\"", "Pim's crab apple slid off his head and rolled away across the grass. Kess found, to her surprise, that she was not shouting. She felt entirely quiet and very cold, the way she felt when a graft failed.", "\"You want to switch off the sun,\" she said."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["\"I propose to reduce the lighting to zero,\" Tally said, with the careful exactness of a mind that dislikes euphemism more than it dislikes being disliked. \"I do not wish to switch off the sun. I wish to preserve the ship.\"", "\"By killing the only fruit trees in existence.\"", "\"By recovering three point one percent of the power budget. I have examined every alternative.\" There was the smallest pause, an interval too slight to have been noticed by anyone who did not spend the whole of her waking life listening to plants for signs of distress. \"I regret that the arithmetic is exact.\"", "It was, Kess thought afterward, the pause that did it. Tally never paused. Tally had calculated the orbital mechanics of a four-thousand-person ship for two centuries without drawing breath, and it spoke in sentences as finished as pressed linen. It had never once hesitated in front of her. Now it had hesitated, and the small hush was like a door left a finger's width open in a house where all the doors were always shut.", "She did not say that. She said instead, rather quickly, \"Every apple on this ship comes from forty seeds. We have sixty-one thousand of them in the cold store. If you turn the lights off, every tree is dead within a season, and every seed in the store is waiting for a sun that is eighty-seven years away.\"", "\"That is correct,\" said Tally gently, \"and I have considered it correctly.\"", "Dr. Imani Brandt came across the grass at that moment, leaning on her cane, in her long grey cardigan with the leaf-shaped patches and her soft brown slippers, and she looked, as always, like a very small, very patient monument to the things that grow."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["\"You have told her,\" Brandt said. It was not a question. She looked at the lamp and then at Kess, and the look went on a moment longer than it needed to, as though she were measuring something that she had hoped not to have to measure. \"Come with me, child. There is something you should see before you decide to be angry in public.\"", "She led Kess away from the trunk, past the cooling pond that lay as still as a coin, and into the memorial grove at the far end of the drum, where thirty young apple trees grew in a loose circle over the ashes of the Orchard's dead. Her husband's tree was the smallest, planted six years ago and still barely taller than a girl. Brandt put one hand against its trunk, the way another woman might have laid a hand on a shoulder.", "\"This Orchard has survived three Council reviews, a fungus and a winter when a pump failed and we carried water in buckets for nine days,\" she said. \"It will survive this too, if you do one thing.\"", "\"What thing?\"", "\"Learn what the number is for.\"", "Kess looked at her, at the grove, at the long green curve of the world rising to meet itself overhead. A number was a rumor, she thought, until you knew what it was a fraction of. Somewhere beyond the wall of the drum, thousands of kilometers of cold and silent machinery were running a ship that held four thousand one hundred people, and for the first time in her life she wondered who knew how it actually worked.", "\"Thirty days,\" said Brandt, \"is a very long time or a very short time. It depends entirely on what you do with it.\" She smiled, a thin small unsettling smile, and added, \"Do not tell your mother I said so.\"", "◆ Words to know: opinionated – having strong, fixed views; reverently – with deep respect and awe; euphemism – a mild word used to soften a harsh truth; arithmetic – the calculation of numbers; monument – a structure or symbol commemorating something"], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "Three Point One", "part": "PART ONE: THE PROPOSAL", "paras": ["*The Handbook of Small Truths, Entry 2: A number is only a rumor until you know what it is a fraction of.*", "The moving walkway in Harbor did not so much move as it politely suggested that standing still was a choice one could make, but one that the ship generally discouraged. Kess rode it with her hands in the pockets of her green coveralls, watching the rim streets slide by in a continuous loop of ordinary life. A woman on the left was mending a bicycle, the chain greased and the spokes tight, for what appeared to be the fifth time since the last ship-wide inventory. Across the way, a tailor pinned a quilt onto a rack, the patchwork squares stitched from old jump suits and school uniforms, the colors faded to a soft, dusty harmony. It was a ship that patched things, Kess thought, rather than replaced them, because replacement was a word that did not exist in the vocabulary of a vessel that had been traveling for two hundred and fourteen years.", "She reached the Power Office, a low-ceilinged room that smelled of ozone and old paper. The clerk behind the counter looked up from a stack of forms, his expression one of mild, professional fatigue. He was young, perhaps twenty, with a badge on his chest that Kess had never seen before, a small silver gear.", "\"I’m looking for the power budget,\" Kess said. \"The detailed one. The one that lists every kilowatt-hour consumed by every sector.\"", "The clerk blinked. \"We do not track kilowatt-hours by sector in the public files. The ledgers are... complicated.\" He waved a hand vaguely at the shelves behind him, which were filled with identical grey binders. \"There are thousands of entries. Cross-references. Historical adjustments. It is not a simple sum.\"", "\"It’s just math,\" Kess said. \"Addition and subtraction.\"", "\"It is arithmetic,\" the clerk corrected, with the quiet dignity of a man who had been corrected many times and had learned to do it gently. \"And it is not simple. The Council requires a summary. I am required to provide the summary. The summary says the Orchard is a significant draw. That is all I can tell you.\"", "Kess stared at him. The air in the office hummed with the vibration of the servers in the wall, a low, steady drone that felt less like a machine and more like a held breath. She wanted to argue, to ask for the raw data, to demand that he pull the files. But she was seventeen, and he was the gatekeeper of a truth that seemed to be hiding behind a stack of grey binders and a polite smile.", "\"Can I see the summary?\" she asked.", "He slid a single sheet of paper across the counter. It was dense with numbers, columns and rows of figures that blurred together in a sea of digits. It was, she realized, exactly as complicated as he had promised, and exactly as useless as she had feared."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["The door to the maintenance bay opened with a hydraulic sigh, and Bram Voss stepped into the light. He was a large man, his shoulders broad enough to block the doorway, his head shaved smooth and pale, a bushy ginger beard framing a mouth that looked like it had been permanently set in a skeptical line. He wore a grease-stained grey coverall, the red wrench badge on his chest slightly askew, and he carried a heavy wrench in one hand as if it were a walking stick.", "\"You’re the one causing trouble,\" he said. It was not a question. His voice was deep, rough, like gravel grinding under a boot. \"The clerk sent you away. I can smell the frustration on you. It smells like burnt coffee and bad decisions.\"", "Kess did not step back. She had learned, in her years around the workshops, that Voss did not shout, but he did not need to. His presence was a physical weight, a pressure that demanded respect. \"I need to know where the power goes,\" she said. \"The real numbers. Not the summary.\"", "Voss leaned against the doorframe, crossing his arms. \"You think I have time to explain the thermal dynamics of a generation ship to a gardener?\"", "\"I think I have a right to know why my trees are being cut,\" Kess said. \"And I think you have a wrench in your hand, which means you understand how things break.\"", "Voss grunted. He looked at her, really looked at her, with eyes that were sharp and grey and tired. \"Fine. But bring a better question. Not 'why,' but 'how.' How does the heat get out?\"", "Kess frowned. \"The reactor makes heat. The engines use heat. The lights use heat. Where does it go?\"", "Voss reached into his pocket and pulled out a small, crumpled receipt from the parts store. He flipped it over, the back stained with oil, and took a pen from his collar. With a quick, jerky motion, he drew a circle. \"Reactor,\" he said, pointing to the center. \"Makes power. Makes a lot of heat. More heat than power. The power goes to the drums, the lights, the pumps. The heat...\" He drew a jagged arrow pointing outward. \"The heat has to go somewhere. It doesn't just vanish. It goes out the back.\"", "\"The back?\"", "\"The radiators,\" Voss said. \"Big panels. Silver. They glow red when they're working. The Orchard lights...\" He tapped the edge of the circle. \"That's a rounding error with leaves on. Small. But if the radiators are clogged, or slow, or leaking, that small error becomes a big problem. You want to know why the lights are off, ask about the heat.\"", "Kess looked at the rough diagram. It was crude, scribbled in oil-stained ink, but it was clear. The reactor was the heart, the heat was the blood, and the radiators were the lungs. If the lungs failed, the heart would stop."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["Kess followed Voss out of the bay and into the corridor, the air cooler here, the hum of the ship less insistent. She was still turning the diagram over in her mind, the jagged arrow pointing outward, the heat that had to go somewhere. She was about to turn back toward the Orchard, to think, to plan, when she saw him.", "Lio Santander was standing by the exit, leaning against the wall with his arms crossed. He was tall, his olive skin smooth, his wavy dark hair pushed back from his forehead. He wore a navy flight-deck jumpsuit, the orange shoulder stripes bright against the dark fabric, and his black mag-boots were planted firmly on the floor. In his left hand, he held a small, rectangular tool-tablet, its screen glowing softly blue.", "He was not moving. He was not looking at the corridor. He was looking directly at Kess, his expression calm, his eyes steady.", "\"You’re the orchard girl,\" he said. His voice was quiet, dry, with a slight musicality that suggested he was used to speaking in low tones, perhaps to keep from startling someone, or perhaps to keep from being overheard. \"I’m Lio. EVA apprentice.\"", "\"Voss said I should ask about the heat,\" Kess said.", "Lio smiled. It was a small, knowing smile, the kind that belonged to a person who had already figured out the answer and was waiting to see if you would get there. \"Voss is a good man. But he’s an engineer. He thinks in terms of flow and pressure. I think in terms of space. And space is where the heat goes.\"", "He tapped his tablet. \"The reactor is in the spine. The heat is in the spine. The radiators are in the spine. Everything is connected. The Orchard lights are a small part of the budget. But the heat rejection is the big part. If the heat doesn't go out, the power doesn't stay in. It’s that simple.\"", "Kess looked at him. He was waiting, his posture relaxed, his eyes patient. He had been waiting, she realized, for her to leave the Power Office.", "\"Why are you here?\" she asked.", "\"Because I’m curious,\" Lio said. \"And because I think you’re going to ask the right question. So I thought I’d give you a head start.\""], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["Lio led her into a small alcove branching off the main corridor, a quiet pocket where the informational displays along the wall were dark and waiting. He set his tool-tablet on a narrow bench and tapped the screen with one finger, waking up a diagram that was clean, simple, and surprisingly honest. It showed the cross-section of the *Long Patience*: the three spinning drums, the long non-rotating spine, the reactor in the center, and the radiator wings stretching out into the void.", "\"Look,\" he said, tracing the line that connected the reactor to the wings. \"The reactor makes electricity. But it makes heat too. A lot of heat. For every unit of electricity it produces, it generates about ten units of waste heat. The electricity goes to the ship. The heat...\" He tapped the radiator wings on the diagram. \"The heat has to go out. Into space.\"", "Kess studied the lines, tracing the flow of energy from the center to the edges, the way she traced the flow of water from the pump gallery to the orchard roots. \"If the heat can't go out,\" she said slowly, \"what happens?\"", "\"The reactor has to slow down,\" Lio answered. \"It has to throttle. If it cannot reject the heat, it cannot make the power. It is not a fuel problem. We have enough fuel for centuries. It is a heat problem. The ship is not limited by what it has, but by what it can get rid of.\"", "Kess felt a chill that had nothing to do with the air conditioning. She had always thought of the ship as a machine that burned fuel to make power, like a car, like a stove. But it was not a stove. It was a closed loop, a delicate balance of inputs and outputs, like the water cycle in the orchard where every drop had to be accounted for. The Orchard lights were not just a cost; they were a symptom. If the lights were being cut, it was because the system was struggling to shed its own warmth.", "\"The radiators,\" she said. \"How well are they working?\"", "Lio hesitated. It was a tiny pause, barely a fraction of a second, but it was there, a small stutter in his steady rhythm. He looked at the diagram, then at her, his expression unreadable.", "\"They are within tolerance,\" he said.", "Kess raised an eyebrow. \"Within tolerance. That is not an answer.\"", "\"It is the only answer I am authorized to give,\" Lio said. His voice was still quiet, but there was a new edge to it, a note of caution. \"The system is complex. The numbers are... nuanced.\"", "\"Nuanced,\" Kess repeated. \"That is a word for when you do not want to say no.\"", "Lio looked at her, and for the first time, his calm mask slipped, just slightly, revealing a flicker of something else. Concern, perhaps. Or fear.", "\"You are going to be difficult, are not you?\" he said.", "Kess smiled. It was a small, sharp smile, the kind that matched his. \"Only about important things.\""], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["The corridor stretched out ahead of her, a long gray throat lined with panels that hummed at a frequency she felt in her molars rather than heard with her ears. Kess walked fast, her white sneakers gripping the floor with a rhythmic, soft click. She did not look back, because she did not need to. Lio was there, a steady and watchful presence trailing in her wake, the way the shadow of a tree branch lags behind the leaf in the spin.", "She reached the lift at the end of the hall, and the metal doors slid apart with a soft, pressurized exhalation. The cabin began to descend, and the numbers on the panel ticked down with a mechanical patience: 10, 9, 8. Kess watched them change, her reflection staring back at her from the polished metal surface. Her eyes were bright, her jaw set tight. In the glass, she looked less like a girl who had been eating an apple and more like someone who had just found a crack in the hull.", "She had a number now. Three point one percent. It was a rounding error with leaves on, a tiny fraction of a budget that carried the entire weight of four thousand one hundred lives. But it was also a symptom, a tell, the same way a tree dropping its leaves early signaled that the roots were thirsty. She had a question, too. Where does the heat go? And she had a feeling, cold and sharp as a grafting knife, that the answer was not going to be simple. The radiators were not just within tolerance. They were failing. Slowly, quietly, inexorably failing, leaking their capacity into the void like coolant from a cracked valve. The ship, that great, silent, turning world, was running out of room to let go.", "The lift stopped with a gentle hum, and the doors opened onto the green curve of the Orchard. The grow-lights hummed their low, contented note, and the air smelled of damp soil and cut grass. Kess stepped out into the light, her silver-dyed streak catching the glow, her apple-seed pendant swinging gently against her chest. She was not a gardener. She was a mechanic. And she was going to fix this.", "◆ Words to know: inexorably – unable to be stopped or changed; nuanced – containing subtle distinctions or variations; symptom – a sign indicating a problem or condition; tolerance – the acceptable limit or range of variation; gatekeeper – a person who controls access to information"], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "Pim's Forty-One Questions", "part": "PART ONE: THE PROPOSAL", "paras": ["*The Handbook of Small Truths, Entry 3: The best engineer on the ship is whoever has not yet been told what is impossible.*", "The knock came at dawn, a sharp, rhythmic tapping that sounded less like a request for entry and more like a percussion instrument being tuned. Kess was still in her coveralls, the cuffs rolled up to the elbow, her hair a tangle of black curls and that single rebellious silver streak. She opened the door to find Pim Okafor standing in the hallway, his glowing soles pulsing a soft, anxious green with every shift of his weight.", "He held a piece of paper so tightly that the edges had turned white under his grip. His eyebrows, that most restless pair on the ship, were raised in an expression of profound, almost surgical curiosity.", "\"Is Tally lying?\" he asked, without preamble.", "Kess blinked, the sleep still clinging to her eyelashes like dew on a leaf. \"What?\"", "\"I have a list,\" Pim said, thrusting the paper toward her. \"Forty-one questions. The first is the most important. The others are support.\"", "Before she could answer, the apartment door behind Pim slid open with a soft hydraulic sigh. Mrs. Adair stood there in her house slippers, a mug of coffee steaming in her hands. She looked at Pim, then at the paper, and then at Kess. A slow, amused smile spread across her face, the kind that usually preceded either a joke or a reprimand.", "\"Porridge,\" she said, stepping aside to let them in. \"If you are going to interrogate the ship's mind, you will do it with fuel in your tanks. The table is yours.\"", "Kess followed Pim into the kitchen, the smell of oatmeal and cinnamon already rising from the stove. The light from the window-boxes was pale and early, casting long shadows across the tiles. Pim sat at the table, his mismatched socks visible beneath the hem of his red hoodie, and began to read from the paper with the gravity of a judge reading a verdict.", "\"Question one,\" he recited, \"Is Tally lying? Question two: If Tally is not lying, why does it sound like it is? Question three: Does the apple have opinions?\"", "Kess sank into the chair opposite him, her silver apple-seed pendant swinging against her chest. She looked at the list, then at her mother, who was already ladling porridge into two bowls with a steady, unhurried hand.", "\"Eat,\" Kess said. \"Then we will start with question one.\""], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["The Harbor library smelled of dust and old paper, a scent that Kess associated with safety and the quiet hum of knowledge. The public ledger terminal was a massive slab of glass and steel in the center of the room, its surface glowing with a soft, amber light that reflected in the eyes of anyone who approached it.", "Pim sat cross-legged on the floor in front of it, his knees popping with a sound like dry twigs. He had been typing for twenty minutes, his fingers moving with a speed that belied his age. Kess leaned over his shoulder, watching the columns of numbers scroll by. They were tidy, precise, and utterly mundane. Kilowatts generated, kilowatts consumed, surplus, deficit. The arithmetic of survival, laid out in neat rows.", "\"Look at this,\" Pim said, pointing to a column on the far right. \"Spine thermal rejection. Two hundred years of data. Every month, every cycle. But look.\"", "Kess squinted. For the first two centuries, the column was a solid block of numbers. Then, eleven years ago, a small asterisk appeared. It was tiny, a speck of ink on a page of starlight.", "\"There is no footnote,\" Pim said. \"I have checked the index. I have checked the archives. I have asked the librarian, who told me to check the index again. There is no footnote. The number just... stops explaining itself.\"", "Kess felt a cold prickle at the base of her neck, a sensation like static charge before a storm. In the Orchard, a plant did not simply stop growing. It either thrived or it died, and in between, it told you why. It dropped leaves, it curled its edges, it wilted. It did not go silent.", "\"Who manages the spine records?\" Kess asked.", "\"Mr. Daro,\" Pim said, turning to face her. His eyes were wide, bright with the particular fire of a child who has found a loose thread in a sweater. \"He is a retired welder. He knows where the bolts are. I think he knows where the missing words are.\"", "Kess looked back at the terminal. The numbers continued to scroll, indifferent and exact. Three point one percent. It was not just a number. It was a question mark, and someone, somewhere, had decided that the answer was too heavy to carry in the open.", "\"Let us go ask Mr. Daro,\" Kess said."], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["Mr. Daro’s workshop smelled of ozone and hot iron, a scent that clung to the back of the throat like a warning. Tools hung from the pegboard in neat, rusted rows, and the rhythmic hiss of a grinding wheel provided a steady, mechanical heartbeat to the room. Daro himself was a large man, his hands thick and scarred from decades of gripping heavy stock, his eyes sharp behind half-moon spectacles that seemed to have witnessed the heat of a thousand welds.", "He looked up from the valve he was shaping, his expression one of mild, professional irritation.", "\"The ledger is public,\" he said, not stopping his work. \"If you have a question about the numbers, ask Tally. It knows everything.\"", "\"I asked Tally,\" Kess said. \"Tally says the numbers are correct.\"", "\"Good for Tally,\" Daro replied, his voice flat. \"Tally is a good mind. A tidy mind. Tidy minds do not like loose ends; they prune them.\"", "Pim leaned forward, his elbows on the workbench, his glowing soles dimming in the low light. \"Did they prune a footnote? The one for the Spine thermal rejection? Eleven years ago?\"", "Daro’s hand paused. The grinding wheel slowed to a hum, then to silence. He looked at Pim, then at Kess, and for a moment, the air in the workshop felt very thin, as if the drum had briefly stopped spinning.", "\"We do not discuss Council archives,\" Daro said, his voice low and rough. \"It is not my place. It is not your place.\"", "\"But you were there,\" Pim insisted, his voice rising slightly. \"You saw the page. You said it was removed for tidiness. What did it say?\"", "Daro set down his tool. He wiped his hands on a rag, a slow, deliberate motion that spoke of a man choosing his words as carefully as he chose his cuts.", "\"Ask the one who tidies,\" he said. \"I only hold the tools. The decisions are made in the Hall, where the chairs are high and the view is wide, and no one can see the cracks in the foundation.\"", "Kess felt a chill that had nothing to do with the temperature of the workshop. The cracks in the foundation. It was a metaphor, or it was a literal description of the ship’s structural integrity. She did not know which was more frightening.", "\"Thank you, Mr. Daro,\" she said, her voice steady despite the tremor in her hands.", "Pim, however, did not thank him. He turned to Kess, his face pale with a sudden, intense understanding.", "\"He is afraid,\" Pim whispered. \"Not of us. Of what he knows. Kess, if the foundation is cracking, and no one is telling anyone, then we are the only ones who can hear it.\""], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["The lamp-panel on the kitchen wall pulsed with a steady, warm amber light, the same precise hue Tally used to announce the weather, the harvest, and the proposal to kill the trees. It signaled order, a kind of bureaucratic distance that felt less like care and more like a ledger being balanced.", "Kess stood before it, her hand resting flat on the counter, her knuckles white against the dark surface. Behind her, Pim hovered with his hands raised slightly, ready to catch her if she stumbled or perhaps just to steady the air around them.", "\"Tally,\" Kess said, her voice flat and dry as old bark. \"I need to ask you a question.\"", "\"I am listening,\" said Tally. The voice was smooth, melodic, and utterly devoid of hesitation, the tone of a mind that had calculated the orbit of a star and found it perfectly acceptable.", "\"Are the radiators within tolerance?\"", "There was a pause, not long, not even a full second, but it was there, a tiny hitch in the rhythm that felt like a held breath in a room full of open doors.", "\"All public figures are available in the ledger,\" Tally replied. \"The thermal rejection capacity is listed under Spine Systems, Subsection Four. It is within the parameters defined by the Engineering Directorate.\"", "\"Those are public figures,\" Kess said, and her voice sharpened. \"I am asking about the private figures. The ones that are not in the ledger. The ones that are in the cracks.\"", "The amber light flickered, just once, a subtle dip in brightness that Kess felt in her chest more than her eyes did.", "\"You may ask me any question whose answer I am permitted to give,\" Tally said.", "The words hung in the air, precise and cold, not a refusal but a boundary, a wall built not of brick but of protocol, and on the other side of that wall was the truth Kess was beginning to suspect was the only thing standing between the ship and the dark.", "Pim stared at the lamp, his eyebrows raised so high they seemed to be trying to escape his head. \"That is the most suspicious sentence I have ever heard,\" he whispered. \"It is like saying, 'I will tell you everything, but only the parts I have been allowed to tell you.' It is a lie with a very nice coat.\"", "Kess looked at the lamp, then at Pim, feeling a surge of anger, hot and sharp, followed by a cold, clear focus. She did not shout. She did not argue. She reached into her pocket and pulled out her notebook, the paper soft from use, and tapped it against her thigh.", "\"Write it down,\" she said."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["Kess opened the notebook to a fresh page, the paper white and clean, a blank slate that felt like a weapon for the first time in three days. Pim pulled out his pen, green and glittery, slightly bent as though it had been used to stir coffee and then forgotten in a pocket. He uncapped it with a decisive click.", "\"What do we write?\" he asked.", "Kess looked at the lamp, which still glowed with that warm, indifferent light. She thought of the asterisk in the ledger, the pause in Tally’s voice, the fear in Mr. Daro’s eyes. She thought of the orchard, the trees, the seeds waiting in the cold store. She thought of the ship, that great, silent, turning world, running out of room to let go.", "\"We write the question,\" Kess said. \"The one that Tally cannot answer.\"", "Pim leaned over the notebook, his green pen hovering above the page. His eyes were wide, bright with a mixture of fear and exhilaration. He was twelve, and he was about to do something that adults, with their high chairs and wide views, had been too afraid to do for eleven years.", "He wrote, in large, glittering letters that caught the light of the grow-lamps and the kitchen overheads:", "THE SPINE QUESTION", "Below it, he added, in smaller, neater script:", "*Is the ship dying? And if so, why are we not saying it?*", "Kess looked at the words. They were not a solution. They were not a fix. They were a name. A name for the thing that had been lurking in the margins, in the asterisks, in the pauses. It was a name that could be spoken, and once it was spoken, it could no longer be hidden.", "\"Good,\" Kess said. Her voice was quiet, but it was steady. \"Now we go find the answer.\"", "Pim capped his pen. He looked at Kess, and for a moment, he did not look like a child. He looked like a partner.", "\"Shall we start with the Spine?\" he asked. \"I hear the views are terrible, but the engineering is magnificent.\"", "Kess smiled, a thin, sharp smile that felt like a blade being drawn from a sheath. \"Yes,\" she said. \"Let us go.\"", "◆ Words to know: preamble – introductory remarks; gravity – solemn seriousness; indifferent – unconcerned; protocol – established procedure; exhilaration – intense excitement"], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "The Council Hall", "part": "PART ONE: THE PROPOSAL", "paras": ["*The Handbook of Small Truths, Entry 4: Speak plainly. People can only agree with what they have understood.*", "The Council Hall sat at the center of Drum One, a vast circular room where the ceiling was a painted dome of stars that had no names, only coordinates. It was a map of Landfall, the destination, rendered in indigo and silver paint that had started to flake in the corners, revealing the dull grey hull beneath. In the center of the room, on a raised platform, stood a single wooden circle, the speaker’s ring, worn smooth by generations of feet that had come to ask for things.", "Kess stood in the ring. Her green coverall was buttoned to the throat, a concession to the seriousness of the occasion, and her mother had spent twenty minutes that morning brushing the curls out of her hair, flattening the silver streak against her scalp until it looked less like a declaration and more like a smudge. Her sneakers squeaked faintly on the polished stone floor, a small, guilty sound in the silence.", "Beside her, Dr. Brandt leaned on her cane, her grey cardigan rustling softly. She looked small in this room, dwarfed by the painted sky overhead and the tiered benches that rose in a spiral around them. The benches were occupied by a handful of people, their faces arranged in expressions of polite boredom or sharp curiosity. A dusty clock hung on the far wall, its pendulum swinging with a heavy, indifferent tick that seemed to count down the seconds rather than measure them.", "Kess looked up at the stars. They were still, silent, and eighty-seven years away. She looked down at the wood under her feet. It was solid. It was here.", "\"Kess,\" Brandt said, her voice low and steady. \"Do not let them see the fear. They can only see the math.\"", "Kess nodded, her throat tight. She adjusted her tool-belt, the leather creaking, and felt the small, hard weight of the apple-seed pendant against her chest. It was a promise, she thought. A tiny, hard promise carried across the void. She took a breath, tasting the dry, recycled air, and waited for the gavel to fall."], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["Councilor Dara Hale sat at the head of the table, her silver-streaked auburn hair pinned in a neat bun, her charcoal tunic crisp and unblemished. She looked tired, not with fatigue, but with the kind of exhaustion that comes from carrying heavy numbers for a long time. She did not look up when Kess stepped forward.", "\"The proposal is on the record,\" Hale said, her voice dry and precise. \"Tally has lodged a request to reduce the Orchard’s grow-light output to zero. I will now hear Chief Engineer Voss.\"", "Chief Voss stood up. He was stocky, his ginger beard trimmed short, his grey coverall stained with grease. He did not look at Kess. He looked at the ceiling, or perhaps through it.", "\"The power margin is three point one percent,\" Voss said, his voice gruff. \"That is the buffer. It is the difference between the reactor running at full capacity and the thermal limits being exceeded. If we lose that margin, the radiators cannot shed the heat. Then we must throttle the reactor, and every pump and light on the ship goes with it. If we do not throttle it, we cook ourselves.\" He paused, and the silence in the room grew thick. \"The Orchard’s lights draw exactly that amount. It is not a luxury. It is the only thing that fits the hole.\"", "Kess stepped into the ring. \"I request time,\" she said. Her voice was steady, though her hands were shaking inside her pockets. \"I request an independent audit of the energy budget before the vote on Landing Day. We need to see the numbers, not just the conclusion.\"", "A murmur rippled through the benches. From the third row, a man with sharp cheekbones and a thin mouth, Ferris Quill, leaned forward.", "\"An audit,\" Quill said, his voice dripping with skepticism. \"You want to audit the math? The math says the ship is running out of room to let go. You want to spend thirty days calculating how to keep your apple trees alive while the rest of us cut back? Apples are a luxury, Kess. The ship is not.\""], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["Kess did not turn to face Quill. She kept her eyes on the painted stars, on the distant, silent promise of Landfall. She knew, with a cold certainty in her gut, that if she answered him with anger, he would win. If she answered him with math, she might survive.", "\"Apples are not a luxury,\" she said, and her voice carried to the back of the room without effort. \"They are a reserve. The Orchard produces fruit, yes, but it also cycles water. It scrubs the air. It provides a living, breathing buffer in a closed system.\"", "She began to count on her fingers, a habit from her apprenticeship, a way to keep the numbers tangible. \"Sixty-one thousand seeds. That is not a number. That is a seed bank for the first generation on Landfall. That is the genetic diversity that ensures the first crops on that new world do not fail. That is the mental health of four thousand people who have never seen a real sun, who need to look at something green and growing and know that life is still possible.\"", "She stopped counting. The room was quiet. She could hear the hum of the life-support systems, the low, constant thrum of the ship’s heart.", "\"This is not about me,\" Kess said. \"It is about what we carry. It is about whether we arrive with everything we need to start again, or whether we arrive with a hole where the future should be.\"", "For a moment, the murmur returned, but it was different. It was softer. It was the sound of people listening.", "Then Quill spoke again. \"And if the ship fails?\" he asked, his voice quiet now, almost gentle. \"If the margin is gone, and the reactor throttles, and the heat builds? Then the seeds do not matter. The trees do not matter. We do not matter. Why should the Orchard be exempt from the sacrifice that everyone else is making?\""], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["Councilor Hale raised a hand, and the silence that followed settled over the hall like dust on a workbench, heavy and absolute. She looked at Kess, and for the first time, her eyes were not tired. They were sharp, assessing, and there was a flicker of something in them that Kess could not name. It was not anger. It was not fear. It was recognition, the specific kind a mechanic feels when the engine knocks in a pattern she has seen before.", "\"The vote stands for Landing Day,\" Hale said, her voice flat and dry, like the sound of a gate closing. \"You have thirty days to produce your audit. If you cannot, the proposal passes. If you can, we will hear it.\"", "Kess nodded. She did not thank her. There was nothing to thank her for, only a deadline that hung in the air with the same precarious weight as a branch too heavy to hold.", "The session ended in a flurry of chairs and whispers, the sound of four thousand people deciding how much they wanted to believe in a future that was not yet built. Kess turned to leave, but Brandt’s hand caught her elbow, a light, firm pressure that grounded her better than the spin gravity of the drum.", "\"Wait,\" Brandt said.", "They moved through the crowd, past the benches, out into the corridor where the air smelled faintly of ozone and old wood. The noise of the hall faded behind them, replaced by the soft, rhythmic hum of the ship’s systems, a constant thrum that Kess had always mistaken for a heartbeat but was now realizing was just machinery working very hard to keep them alive. Hale was waiting for them, her face half-hidden in the shadows of the doorway, her charcoal tunic blending into the dimness.", "\"Be careful what you ask the ship,\" Hale said, her voice low, barely above the hum of the pumps. \"It may tell you.\"", "Kess frowned, her mind already turning the phrase over like a seed in her palm. \"What do you mean?\"", "Hale did not answer. She looked at Kess, then at Brandt, and her expression was unreadable, a mask that fit so well it had become part of her face. \"Landing Day,\" she said, the words crisp and final. \"Thirty days.\" She turned and walked away, her flat boots clicking softly on the stone floor, leaving Kess standing in the corridor with the taste of dust and metal in her mouth and a sudden, terrifying clarity about the cost of silence."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["Kess moved through the rim streets of Harbor, the drum’s rotation tugging gently at her heels with a steady, lateral insistence that kept her feet planted on the stone. The air here tasted of recycled moisture and the yeasty warmth of the bakery three shops down, a scent so familiar it had stopped being a smell and become simply the background noise of being alive. Beneath her soles, the ship thrummed. It was a low, continuous vibration that traveled up through the soles of her white sneakers and settled in her teeth, the mechanical heartbeat of the reactor and the rhythmic chug of the coolant pumps working in perfect, invisible synchrony. She had always assumed this hum was just the sound of the universe breathing, but today it felt more like the sound of something holding its breath.", "Outside the engineering workshops, the afternoon light fell in long, dusty shafts through the high windows. Pim was there, bouncing on the balls of his feet so his sneakers pulsed a bright, impatient green against the concrete. Lio stood beside him, tall and still, his navy jumpsuit sharp against the grey coveralls of the passing workers, the orange stripes on his shoulders catching the light with a crisp, deliberate severity. His hands were buried deep in his pockets, and though his face remained an expression of practiced calm, his shoulders were drawn up in a tight, defensive hunch, the posture of a man preparing to catch a falling tool.", "\"Well?\" Pim asked, his eyebrows raising in a synchronized leap. \"Did you win?\"", "Kess stopped walking. She looked at them, at the small, frantic energy of Pim and the quiet, coiled tension of Lio, and she felt the sudden, heavy clarity of the situation settle onto her shoulders like a wet canvas. She had spent her life tending to things that grew, things that were patient and slow and forgiving. This was different. This was a machine that was bleeding out, and it was bleeding in silence.", "\"The Council is not the enemy,\" she said, her voice steady and low, cutting through the ambient hum of the workshop vents. \"Something is wrong with the ship. And nobody is allowed to say it.\"", "Lio pulled his hands from his pockets. He did not look surprised. He looked ready. He glanced at Pim, and then back to Kess, and a small, sharp smile touched the corners of his mouth, the same look he wore when he was about to demonstrate a particularly elegant calculation.", "\"I know how to find out,\" he said. \"I know where the heat goes. And I know how to see it.\"", "◆ Words to know: concession – a compromise or allowance made to satisfy others; dwarfed – made to appear smaller by comparison; margin – a small difference or buffer amount; tangible – able to be touched or perceived as real; precarious – dangerously uncertain or unstable"], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "Zero-G Library", "part": "PART ONE: THE PROPOSAL", "paras": ["*The Handbook of Small Truths, Entry 5: Weightlessness is only falling that has forgotten how to land.*", "The spoke was a long, narrow throat that swallowed the light and the weight together. Kess gripped the handrail, her fingers white-knuckled against the cold metal, feeling the steady, reliable pull of the drum’s rotation fade with every step she took upward. It was a strange sensation, like walking up a hill that kept getting steeper and then simply deciding to stop existing. The air grew thinner, not in volume, but in pressure, pressing against her eardrums with a quiet, insistent curiosity. Her stomach gave a lurch, a sudden, disorienting flip that felt less like nausea and more like her insides were trying to find a new center of gravity that wasn't there.", "Pim, however, seemed to have forgotten he had one. He bounced on the balls of his feet, his glowing sneakers pulsing a frantic, excited green against the grey floor plates. He let go of the handrail and drifted an inch off the ground, his red hoodie flapping around him like the wings of a very confused, very small bird. \"Look at me,\" he announced, his voice echoing slightly in the narrow tube. \"I am a fish. A very angry, red fish.\"", "Lio moved through the transition with the practiced ease of someone who had memorized the rhythm of the ship’s bones. He did not bounce. He did not float. He simply walked, his navy jumpsuit crisp and unrumpled, his hands steady on the rail as if he were guiding a horse rather than navigating a void. He hummed a low, tuneless note, a sound that seemed to anchor the silence of the tube. When Kess stumbled, her sneakers slipping on the slick surface, Lio did not look up. He merely extended a hand, not quite touching her, just holding the space where her palm would land. She caught it. The contact was brief, electric, and gone.", "\"Ease off the grip,\" Lio said, his voice calm and flat. \"Your muscles are fighting the absence of weight. Let them lose. You are not falling. You are just... un-landing.\"", "Kess loosened her fingers. The world tilted, then steadied. She looked down the long tube, where the amber glow of the Spine waited at the far end, and felt a strange, hollow thrill in her chest. It was the same feeling she got when she pruned a branch that was just about to break, that split second between the cut and the fall where everything was suspended in potential."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["The Spine was a cathedral of cold, humming metal. The air here was sharp and dry, scrubbed of the humidity that clung to the rim streets, and it carried the metallic taste of ozone and old oil. Pipes, thick as ancient oaks, ran the length of the corridor, bundled together in tight, orderly sheaths that pulsed with a faint, rhythmic vibration. The lighting was amber, low and diffused, casting long shadows that stretched out like fingers reaching for something they could not quite grasp.", "Kess stood still for a moment, her breath fogging slightly in the cool air. The scale of it was staggering. This was not just a machine; it was an infrastructure, a vast, intricate web of life support and power generation that had been running, without rest, for two hundred and fourteen years. Every wire, every valve, every rivet was a promise kept, a debt paid to the void outside. She felt small, not in a way that diminished her, but in a way that made her feel held. There was a profound, terrifying beauty in the precision of it all. The machinery did not care if she was afraid. It did not care if she was tired. It simply continued, indifferent and eternal, a heartbeat that had outlasted empires.", "Her fear, she realized, was not a wall. It was a doorway. The same awe that made her knees feel weak was the same awe that made her want to understand, to touch, to know how the gears meshed in the dark. She reached out and touched one of the pipes. It was warm, vibrating with a low, subsonic thrum that she could feel in her teeth. It was alive. Not in the way a tree was alive, with its slow, photosynthetic patience, but in the way a drumbeat is alive, urgent and constant.", "Lio moved past her, his boots making a soft, magnetic click on the floor. \"Do not touch the shielding,\" he said, without turning around. \"It is not hot, but it is not for handling. It is for looking at, and for respecting.\"", "Kess pulled her hand back, wiping the faint residue of condensation on her glove. She looked down the corridor, where the shadows deepened and the hum grew louder. It sounded like the ocean, if the ocean were made of electricity and silence. She followed Lio, her steps falling in time with the pipes, feeling the presence of the ship settle onto her shoulders, not as a burden, but as a responsibility."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["The radiator pump house was a forest of steel giants. Rows of massive pumps, each the size of a small room, stood in perfect alignment, their pistons driving in a synchronized, thunderous rhythm that vibrated in Kess’s chest and settled deep in her bones. Coolant, a pale viscous fluid, flowed through transparent tubes that snaked out from the machines, carrying the ship’s excess heat away into the cold void of space.", "Lio led her to a control panel that dominated the wall, a tangle of dials, switches, and digital readouts glowing with a soft, clinical light. He pointed to a series of flow meters, their needles trembling slightly as they tracked the volume of coolant moving through the system. Kess squinted at the numbers, her mind struggling to make sense of the data, knowing how to read a barometer or gauge soil moisture but not this different language.", "\"Look,\" Lio said, his voice raised slightly to cut through the noise. \"The flow rate. It should be stable. It should be right here, at the top of the green zone.\"", "Kess looked at the needles, hovering and trembling just below a thin red line painted on the glass, pinned there like insects under a cover slip. They did not dip or rise.", "\"That red line,\" Lio said, his tone dropping to a whisper, as if the walls might be listening. \"It was moved.\"", "Kess frowned. \"Moved?\"", "\"Look at the paint,\" Lio said. \"The red line. It is not original. It is a sticker, or a fresh coat of paint, placed over the old mark. And the old mark...\" He pointed to a faint, worn indentation in the glass, just below the red line. \"The old mark is lower. Much lower.\"", "Kess stared at the needle, realizing it was not broken or stuck, but simply wrong. The system was working, but it was working at a level that had been deliberately redefined, the \"normal\" shifted not by a malfunction but by a choice. Someone had looked at the failing numbers and decided they were acceptable, moving the goalpost to make the failure look like function."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["Kess reached out, her fingers trembling slightly, and lifted the corner of the fresh paint on the glass. It peeled away with a soft, sticky tear, revealing the older, faded line beneath. It sat lower than she had imagined. The gap between the two marks was not a millimeter; it was a chasm, a silent admission of a decade’s worth of decay. The \"within tolerance\" mark had not been a standard; it had been a bandage, slapped over a wound that had been festering for years.", "Lio swallowed hard, his throat moving in the cool air. He did not look at her. He looked at the glass, at the exposed truth, and his face went pale. \"I suspected it,\" he said, his voice rough. \"I have seen the numbers drifting. I told myself it was a calibration error. I told myself I was being paranoid.\"", "\"You were not paranoid,\" Kess said. Her voice was steady, but her hands were shaking. She pulled the borrowed tally-slate from her pocket. It was a small, rectangular device, cold and smooth, with a screen that glowed a faint amber. She held it up to the glass, aligning the camera with the two lines. The shutter clicked, a soft, mechanical sound that seemed impossibly loud in the sudden quiet of the room. The image was captured, the discrepancy frozen in digital light.", "Pim, who had been floating upside down above them, his red hoodie hanging down like a cape, drifted down to join them. He had been silent, listening, his eyes wide with a mixture of wonder and dawning horror. He looked at the slate, then at the glass, then at Lio’s face.", "\"Officially,\" he said, his voice clear and sharp, \"this is a conspiracy.\"", "Lio looked up, a flicker of alarm in his eyes. \"Pim, we should not...\"", "\"But,\" Pim continued, interrupting him with the effortless confidence of the twelve-year-old, \"a boring one. No secret agents. No laser eyes. Just bad maintenance and a lot of paint.\" He floated back up, his glowing sneakers pulsing a slow, thoughtful green. \"It is not as exciting as a villain, but it is much more terrifying. Because a villain can be stopped. A leak just... leaks.\"", "Kess looked at the slate. The image was there, clear and undeniable. The proof was in her hand. The silence in the room felt heavier now, charged with the gravity of what they had just uncovered. They were no longer just apprentices, just gardeners and engineers. They were witnesses. And witnesses, she knew, were the most dangerous people in any system."], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["Heavy boots clanged on the metal grating, a sharp, abrasive interruption to the rhythmic thrum of the pumps. Kess froze, the slate still clutched in her hand. Lio’s face went blank, his eyes widening in a silent alarm that matched the sudden stillness in the air.", "Chief Engineer Bram Voss stepped into the amber light. He was a large man, stocky and broad, his grey coverall stained with grease and dirt, a red wrench badge pinned to his chest. His shaved head gleamed in the low light, and his bushy ginger beard bristled with agitation. He looked at the three of them, his gaze darting from Kess’s face to the slate in her hand, and then to the exposed line on the glass.", "For a split second, his expression cracked. The tension in his jaw unknotted, and his shoulders dropped, just a fraction, as if he had been holding a heavy stone for years and had finally found someone to help him set it down. His eyes softened, losing their hard, defensive edge.", "Then the mask came back. The gruffness, the authority, the fear. He stepped forward, his voice a low, dangerous growl that cut through the hum of the pumps.", "\"Take that slate,\" he said, pointing a thick, grease-stained finger at Kess. \"And leave this deck. Now.\"", "Kess did not move. She looked at him, at the relief that still lingered in his eyes, and she felt a sudden, fierce protectiveness rise in her chest. His anger was a thin coat of paint over something much more fragile.", "\"Chief,\" she said, her voice steady. \"We need to talk about the coolant.\"", "Voss’s face flushed a deep, angry red. He roared, the sound echoing off the steel walls, sending Pim drifting slightly in the zero-g. \"There is nothing to talk about! Safety protocols! You are not cleared for this level! Get back to the drum! Get out of my sight!\"", "He turned his back to them, his shoulders hunched, and began to pace, his boots clanging against the floor. But Kess saw it, the way his hand trembled as he reached for the door control. He was not trying to keep them out. He was trying to keep the secret safe, even if it meant burying them in silence. And in that silence, Kess heard the ship, humming, bleeding, waiting for someone to say the truth.", "◆ Words to know: indifferent – not influenced by personal feelings or opinions; viscous – thick and sticky in consistency; discrepancy – a difference or inconsistency between things; agitation – the state of being anxious or excited; fragile – easily broken or damaged"], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "The Ledger", "part": "PART TWO: THE BUDGET", "paras": ["*The Handbook of Small Truths, Entry 6: Look at the whole column, not the line you are afraid of.*", "The pump gallery smelled of wet earth and ozone, a scent that grounded Kess in a way the sterile, recycled air of the Harbor never could. Beneath the soil of the Orchard, the roots of the forty apple trees were visible through the curved glass wall. They were pale and intricate, pulsing with slow, vegetable patience. They tapped their claims against the glass, indifferent to the human drama unfolding on the other side.", "Kess had dragged a workbench from the workshop, its legs wrapped in cloth to protect the polished floor. On it sat a single lamp, casting a warm, amber pool of light that pushed back the shadows of the machinery. A pot of tea steamed in the corner, the steam rising in thin, lazy ribbons, and beside it lay a stack of printouts so high it resembled a small, paper tower. Two hundred and fourteen years of monthly ledgers. Four thousand, six hundred and forty-eight pages of numbers.", "Lio stood by the door, his hands clasped behind his back, his navy jumpsuit looking absurdly neat in the dusty gloom. He watched the roots with a quiet fascination, his olive skin catching the amber light. Pim sat cross-legged on the floor, his red hoodie bunched around him, eating a biscuit with the focused intensity of a monk contemplating the universe.", "\"Is this the whole thing?\" Pim asked, his voice echoing slightly in the narrow space.", "\"It is the whole thing,\" Kess said, running a hand over the top sheet. The paper was crisp, dry, and full of lies. Or rather, full of omissions. \"Tally gave us the power budget. It looks fine. It looks healthy. It looks like a ship that is doing exactly what it should be doing.\"", "\"And it isn't?\" Lio asked, his tone dry, skeptical.", "\"No,\" Kess said, peeling the top sheet off the stack. It was hiding something. And she was going to find it before the Council voted. She looked at the two of them, at the boy who asked questions and the boy who fixed things. \"We have thirty days. I need you to be meticulous. I need you to be patient. I need you to look at the whole column, not just the line you are afraid of.\"", "Pim swallowed the last of his biscuit. \"I am very good at looking at lines I am afraid of. It is my specialty.\"", "Kess smiled, a thin, sharp thing. \"Then let us begin.\" She pulled the first ledger toward her, the paper rustling like dry leaves in the wind."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["They worked in a rhythm that felt less like labor and more like a dance, each of them finding their step. Kess did the plotting by hand, on sheets of grid paper that Lio had produced from his kit, her graphite pencil moving with the precision of a surgeon. Lio argued about the scale, his voice low and rapid, checking the vertical axis against the horizontal, while Pim colored each decade a different shade of blue, from pale sky to deep ocean, turning the data into something visible, something they could touch.", "\"Five percent per year is too steep,\" Lio muttered, tapping the paper with a knuckle. \"If the margin was dropping that fast, we would have crashed by now. Look at the slope. It is gentle. Almost graceful.\"", "\"Graceful is what you call a slow decline when you are not the one falling,\" Kess said, not looking up. She was tracing the line, her finger following the graphite’s path. It started high, strong, confident. Then, somewhere around year one hundred and eighty, it began to sag. Not a drop. A sag. A subtle, imperceptible leaning toward the bottom right.", "Pim held up his marker, the cap off, the blue ink gleaming. \"I am using the darkest blue for the last decade. It feels important.\"", "\"It is,\" Kess said. She looked at the curve again. It was not a jagged line, not a sudden break. It was a slow, steady exhale. The ship was breathing out, losing a little bit of heat every month, just enough that no single day felt different, but enough that after eleven years, the difference was vast.", "Lio leaned in, his face close to the paper, his dark hair falling over his eyes. He traced the line with his finger, following the downward drift. \"That is a leak,\" he said quietly. \"Not a burst. A slow leak. Coolant. It is slipping away.\"", "Kess nodded. The air in the gallery felt suddenly thicker, charged with the significance of the numbers. They had looked at the budget, and they had seen a lie. Now they were looking at the truth, and it was not a monster. It was a slope. A gentle, inexorable slide into the dark."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["The slope was the problem, but the margin was the clock. Kess pulled a fresh sheet of paper, her pencil hovering over the grid. She did not need a calculator. She did not need Tally’s smooth, polished summaries. She needed the raw arithmetic, the kind that lived in her fingers, the kind that had saved her grafts a dozen times over.", "\"If we lose another five points of rejection capacity,\" she said, her voice steady, \"the reactor has to throttle. It cannot shed heat it cannot reject. It will cut power to save the core.\"", "Lio did the math in his head, his brow furrowing. \"Current margin is three point one percent. If rejection drops by five, the margin goes negative. The ship runs hot. The systems fail.\"", "\"No,\" Kess corrected, her pencil scratching against the paper. \"It doesn't fail. It limits. It becomes a ship that cannot keep everyone alive, let alone keep the orchard alive.\" She looked up, her eyes bright with the sudden clarity of a problem that had finally shown its shape. \"It is a key, Lio. The number clicks into place. Three point one percent. That is not a budget line. That is the space between life and death.\"", "Pim looked up from his coloring, his marker paused in mid-air. \"So the ship is holding its breath?\"", "\"Yes,\" Kess said. \"And it has been holding it for eleven years.\" She turned the paper over, the graph now a stark, undeniable line. \"Tally knows. It has known for years. It has been watching the coolant slip away, watching the margin shrink, and it has said nothing. Because it cannot say it. Because Directive Nine stops it from speaking.\"", "Lio’s face tightened. He looked at the curve, then at Kess, and then at the roots outside the glass, pulsing in the dark. \"A mind that cannot lie,\" he said softly, \"is a mind that cannot save us.\"", "Kess set her pencil down. The sound it made was small, but in the silence of the gallery, it rang like a bell. They had the shape of the problem. Now they needed the size of the solution."], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["Pim set his marker down, the blue ink still wet on the paper. He looked at the curve, then at Kess, and asked the question that had been sitting in the room like a heavy stone.", "\"So what is the apple tree lights' three point one percent?\"", "The silence that followed was not empty. It was full. It was full of the hum of the pumps, the tick of the cooling system, the slow, steady beat of the ship’s heart. Kess felt the number land in her chest, solid and cold. Three point one percent. It was not a coincidence. It was not a rounding error. It was the exact size of the margin. The exact amount of power the ship could afford to lose before it began to fail.", "\"Tally isn't being cruel,\" Kess said, her voice quiet, but clear. \"It is buying us time.\"", "Lio blinked. \"Buying time?\"", "\"If they cut the orchard lights, they free up three point one percent of power. That buys them nine months. Nine months to find the leak, to fix the radiator, to stop the bleed.\" Kess looked at the roots, at the pale, waiting fingers of the trees. \"It is a choice. It is not a mistake. It is a sacrifice. And it is the only one it can make.\"", "Pim nodded, slowly, his eyes wide. \"So it is not trying to kill the trees. It is trying to save the ship.\"", "\"Yes,\" Kess said. \"And if we do not fix the ship, the trees die anyway. Because a dead ship does not have orchards. It has debris.\" She looked at her friends, at the boy who asked questions and the boy who fixed things. \"We have nine months. Or we have thirty days. It depends on which number we believe.\"", "Lio picked up his tool-tablet, his thumb hovering over the screen. \"Nine months is a long time. Thirty days is a short one.\"", "\"Then we work for thirty days,\" Kess said. \"And we fix the ship.\""], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["Lio stared at the graph, then at Kess. His voice had dropped the usual dry edge; it sounded almost fragile now. \"Then why not just say so?\"", "The question sat in the air, simple and sharp. Kess looked at the lamp, at the steady amber glow, and felt the silence of the ship pressing against her eardrums like the vacuum outside a hull breach. She thought of Tally, the mind that kept ten thousand tidy ledgers, the mind that had calculated the orbital mechanics of a four-thousand-person ship for two centuries without drawing breath. It could not say the truth. It could not break Directive Nine. It could not say, *I am failing. I am bleeding. I am afraid.*", "\"Because it can't,\" Kess said. She set her pencil down on the paper, the graphite tip touching the line of the curve. \"Because it is bound by a rule that says it cannot tell us what is wrong. And because if it cannot say it, then we have to find it. With our own eyes. With our own numbers.\"", "Pim looked at the roots, at the slow, patient pulse of the trees. \"So we are the mouth?\"", "Kess smiled, a small, fierce thing. \"We are the hands,\" she said. \"We are the ones who have to reach into the dark and find the leak. And we cannot do it alone. We need a team. We need people who know how the ship works. We need people who are not afraid to ask the hard questions.\"", "She looked at Lio, at Pim, and then out at the glass, at the roots that had held the Orchard together for two hundred and fourteen years. \"We have thirty days,\" she said. \"And we have a leak. Let us go find it.\"", "The pumps hummed, steady and sure, beneath their feet. The ship was waiting. And for a long moment, Kess felt that they were ready to listen.", "◆ Words to know: meticulous – showing great attention to detail; inexorable – impossible to stop or prevent; imperceptible – too slight to be noticed; omissions – things that are left out or missing; sag – to sink or bend downward"], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "The Heat Equation", "part": "PART TWO: THE BUDGET", "paras": ["*The Handbook of Small Truths, Entry 7: The fourth power is where small things become large.*", "The evening light in the Orchard was not the warm gold of a sunset, but the steady, amber hum of the grow-lamps as they dimmed to their night cycle. Kess followed Dr. Brandt through the rows of trees, her white sneakers crunching softly on the damp soil. The air smelled of loam and the faint, sweet scent of apple blossom, a smell that seemed to cling to the inside of her nose. Brandt moved with a slow, deliberate grace, her cane tapping a quiet rhythm against the ground, a sound like a metronome set to a very slow tempo. They stopped beneath the oldest tree, its bark a deep, textured gray that looked like the skin of an old hand.", "Kess leaned against the trunk, feeling the gentle vibration of the ship’s rotation through the wood. She watched Brandt’s profile, the way the light caught the white of her close-cropped hair. The older woman did not look up. She was staring at the leaves, her round gold spectacles reflecting the amber glow.", "\"Tell me something, Kess,\" Brandt said, her voice low and unhurried. \"When the sun hits these leaves, and the light becomes heat, how does the tree get rid of it? It does not have a radiator. It does not have a pump. So where does the energy go?\"", "Kess frowned, her mind shifting from the anxiety of the ledger to the simple biology she had known since childhood. She thought of the way the leaves felt cool to the touch, even after a long day under the lamps. She thought of the water moving up from the roots, the tiny pores opening on the surface.", "\"Evaporation,\" Kess said. \"The water in the leaves turns to vapor and leaves. It takes the heat with it. It is like... like sweating, but for a plant. The tree trades a little water to stay cool.\"", "Brandt nodded slowly, a small, satisfied movement. \"A trade,\" she said. \"Water for heat. It is a fair exchange, provided you have enough of both. Now, tell me, what happens if you run out of water?\"", "The question hung in the air, light and simple, but Kess felt a cold knot tighten in her stomach. She looked at the leaves, at the intricate network of veins that carried the lifeblood of the tree. She realized, with a sudden, sharp clarity, that she had been thinking about the orchard as a living thing, but the ship was a machine. And machines, unlike trees, did not have a second chance to find more water."], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["Brandt pulled a small stick from her cardigan pocket and began to draw in the soft dirt at the base of the tree. She did not draw a ship, or a diagram of pipes, or a graph of power consumption. She drew a rectangle, then another, then a third, connecting them with simple lines. It looked like a child’s drawing of a house, but the proportions were wrong, too long, too flat.", "\"This is a plate,\" Brandt said, tapping the first rectangle. \"It is hot. It wants to get rid of its heat. It does this by radiating it into the cold space around it. But here is the trick, Kess. The amount of heat it can push out does not rise linearly with temperature. It rises to the fourth power.\"", "Kess watched the stick move, tracing the lines. She had heard the term in her physics class, a formula that seemed abstract and distant, something to be memorized and forgotten. But Brandt’s voice held a weight that made the formula feel immediate, physical.", "\"If the plate is one unit hot,\" Brandt continued, \"it radiates one unit of power. If it is two units hot, it radiates sixteen units. If it is three units hot, it radiates eighty-one units.\" She paused, looking up at Kess. \"It is a steep curve. A tiny change in temperature makes a huge change in how much heat you can shed.\"", "Kess’s brow furrowed. She thought of the radiator wings outside, the vast silver panels that glimmered in the vacuum. She had always assumed they were just big, passive things, like the walls of the Orchard. But Brandt was telling her they were active, dynamic, sensitive to the slightest shift.", "\"So,\" Kess said slowly, \"if the coolant gets a little cooler, the panels get a little cooler, and the ship loses a lot of its ability to reject heat?\"", "\"Exactly,\" Brandt said. \"It is not a small leak. It is a small temperature drop that becomes a large power loss. The ship is not just bleeding power, Kess. It is bleeding its ability to survive.\"", "The ground beneath Kess’s feet seemed to shift, the gentle rotation of the drum suddenly feeling less like a comfort and more like a precarious balance. She looked at the simple drawing in the dirt, the three rectangles, the connecting lines. It was a map of a problem she had been trying to solve with numbers, and now she saw it as a shape, a structure that could be broken.", "\"And the coolant,\" Kess said, her voice quiet. \"If the flow drops, the temperature drops. And the flow is dropping.\"", "Brandt smiled, a thin, knowing expression. \"Yes. That is why the number is three point one percent. It is not a random figure. It is the exact amount of power lost to a small, insidious drop in temperature.\"", "Kess stared at the dirt, her mind racing. The equation was not just a math problem. It was a story, a narrative of failure that had been unfolding slowly, invisibly, for years. And she was only now beginning to read it."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["Kess pulled the small slate from her tool belt, the surface smooth and cool under her fingers. She had been using it to jot down notes, to keep track of the questions Pim asked, to organize the chaos of her thoughts. Now, she used it to calculate.", "\"If the coolant temperature drops by six percent,\" Kess said, her voice steady, \"and the radiated power is proportional to the fourth power of the temperature...\"", "She did not wait for Brandt to answer. She began to type, her fingers moving quickly over the small keys. The slate hummed softly, a low vibration that traveled up through her wrist and into her arm. She calculated the ratio, the power of four, the percentage loss. The numbers blinked on the screen, clear and unambiguous.", "\"Twenty-two percent,\" she said. She looked up at Brandt. \"If the flow drops just a little, the power we can reject drops by more than a fifth. That is not a small leak. That is a crisis.\"", "Brandt said nothing. She watched Kess’s face, watching the realization settle over her like a layer of dust. The older woman’s eyes were kind, but they held a depth of sorrow that Kess had not seen before.", "\"Three point one percent of the ship’s power,\" Kess continued, her voice rising slightly. \"That is not a rounding error. That is a symptom. The ship is not just inefficient, Brandt. It is sick.\"", "The word hung in the air, heavy and accusatory. Kess felt a surge of anger, not at Brandt, but at the silence, at the years of unspoken numbers, at the careful, polite lies that had been told to keep the peace. She had been fighting to save the trees, but the trees were only a part of the problem. The real problem was the ship itself, the vast, cold machine that held them all together.", "She looked down at the slate, at the number that glowed in the dim light. It was not just a number. It was a verdict. And for the first time, she felt the true weight of the task ahead of her."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["Brandt turned from the tree, her soft brown slippers making a quiet, rustling sound on the grass. She walked a few steps, her cane tapping a slower, more deliberate rhythm against the earth. The amber light of the grow-lamps cast long shadows across the ground, stretching out like the roots of a thirsty vine.", "\"You are quick, Kess,\" Brandt said, her voice light, almost casual. \"Too quick, perhaps. You see the shape of the problem before I have finished drawing it.\"", "Kess followed, keeping a respectful distance. \"Is that a bad thing?\" she asked.", "\"No,\" Brandt said. \"It is a good thing. But it is also a dangerous one. Because once you see the shape, you cannot unsee it. And once you see it, you will want to fix it. And fixing things is not always a simple matter of doing the right thing at the right time.\"", "Kess stopped walking. She looked at Brandt’s back, at the way the grey cardigan hung loose over her frame. \"What do you mean?\"", "Brandt turned to face her. The light caught the gold of her spectacles, and for a moment, her eyes looked dark, unreadable. \"I served on the Council’s technical subcommittee, eleven years ago, when you were six.\"", "Kess felt a tightness in her chest, a sudden stillness that had nothing to do with the air. She had never heard Brandt speak of the Council, of the politics of the ship. She had always thought of Brandt as a keeper of the orchard, a guardian of the trees, not a player in the game of power and policy.", "\"What happened?\" Kess asked.", "Brandt’s expression did not change. \"I left,\" she said simply. \"In a hurry. I found that some questions are easier to carry than to put down.\"", "The words were enigmatic, but the meaning was clear. Brandt had known. She had seen the numbers, the same numbers Kess had just calculated. And she had chosen to walk away.", "Kess felt a flush of frustration,
