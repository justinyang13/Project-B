erhaps with the specific flavor of holding one's breath for a very long time. The console glowed amber, casting long, soft shadows across the faces of the crew. Tally’s voice came through the speakers, clear and steady, reading the thermal map that shimmered on the main wall like a heat signature made of light. The drum had been slowed by a tenth, a subtle change that made the air feel lighter, less oppressive, as if the ship itself was leaning forward to listen.", "Voss stood at Kess’s shoulder, his arms crossed, his ginger beard twitching with the effort of not checking his watch. He looked like a man trying to hold a leak together with his will alone. Pim sat on a crate, his knees drawn up to his chest, holding a stopwatch in one hand and a biscuit in the other. He took a bite, chewed thoughtfully, and then looked at the screen. He had eaten three biscuits already. He seemed to have an unlimited supply, or an unlimited appetite, or perhaps both.", "\"Thermal map stable,\" Tally said. \"Coolant flow nominal. Pressure within tolerance.\"", "Kess adjusted her headset, the foam pressing against her temples. She looked at Lio, who was standing by the airlock, his face pale and set. He nodded once, a small, sharp movement.", "\"Checklist ready?\" she asked.", "\"Ready,\" he said. His voice was calm, but his hands were shaking. She could see the tremor in his fingers, the way they curled and uncurled against the metal frame of the airlock.", "Pim raised his stopwatch. \"Time zero,\" he announced, his voice bright and brittle. \"Good luck, Lio. I believe in you. Statistically.\"", "Voss uncrossed his arms. \"Don't listen to him,\" he said, his voice gruff but not unkind. \"Just close the valve. That's all you have to do. Close the valve, and we're done.\"", "Kess looked at the screen, at the cold spot that looked so small, so insignificant, against the vast, glowing expanse of the radiator wing. It was a tiny imperfection, a hiccup in the machine’s long breath. But she knew, in her bones, that it was the beginning of the end.", "\"Open the hatch,\" she said.", "The outer hatch groaned, a deep, metallic sound that vibrated through the floor. The stars waited outside, cold and indifferent, ready to take what the ship had to give."], "img": "img/p101.jpg"}, {"no": 102, "ch": 21, "ctitle": "", "part": "", "paras": ["The airlock was a cube of silence, a small, sealed world where the only sound was the hum of the life support and the rapid, rhythmic beat of Lio’s own heart. He stood in the center, his helmet sealed tight, the glass dark and reflective. On his wrist, a small card was attached to his suit, the checklist written in his own careful, precise handwriting. He read the first step aloud, his voice muffled by the helmet, steady and strong.", "\"Pressure equalized.\"", "Kess listened through the speakers, her eyes closed. She counted the seconds, each one a small, solid stone in a bridge they were building over a chasm. She could hear his breathing, slow and controlled, a steady rhythm that matched the pulse of the ship.", "\"Suit integrity confirmed,\" he said. \"Tether secured.\"", "Kess opened her eyes. The amber light from the console cast a warm glow on his face, highlighting the tension in his jaw, the fear that lived in the back of his eyes. He was afraid. She knew he was afraid. But he was also ready.", "\"Three points of contact,\" she said, her voice soft but firm.", "\"Clipped,\" he said.", "The outer hatch swung open, a slow, heavy movement that seemed to take an eternity. The stars spilled in, not as a view, but as a presence, a vast, cold, infinite darkness that wrapped around him, holding him, waiting. He stepped out, his boots finding the first rung of the service rail, his hands gripping the cold metal.", "Kess watched the camera feed, the image sharp and clear, her heart tightening in her chest. He was small, so small, against the huge, silver expanse of the wing. But he was moving, steady and sure, his movements precise and practiced.", "\"Moving along the rail,\" he said. \"Heading toward the manifold.\"", "Kess nodded, though he could not see her. She took a breath, a deep, full breath that filled her lungs with the scent of oil and metal, and waited."], "img": "img/p102.jpg"}, {"no": 103, "ch": 21, "ctitle": "", "part": "", "paras": ["The service rail stretched out before him, a thin, silver line that vanished into the dark. Lio moved along it, hand over hand, his tether sliding through the guide rings with a soft, smooth whisper. Below him, the stars did not shine; they simply existed, a cold, static field of light that offered no comfort and no warmth. He felt no pull at all, only the faint drag of the tether, and behind him the whole turning world that held them together.", "Kess watched the feed, her eyes tracking his movement, her breath held in her throat. He moved with a grace she had not expected, a fluidity that spoke of years of practice, of hours spent in the zero-g bay, of a mind that had mapped this path a thousand times in her imagination.", "\"Heading steady,\" she said, her voice quiet but clear. \"Keep your eyes on the manifold. Don't look down. Don't look up. Just look at the valve.\"", "\"I see it,\" he said. \"It's right there.\"", "A tear slid down Kess's cheek, a hot, stinging drop she quickly wiped away. She did not care about the tear, or the fear, or the pressure of the ship on her shoulders. She only cared that he was moving, that he was alive, that he was doing what needed to be done.", "\"Pressure stable,\" Voss said, his voice rough with emotion. \"Flow rate holding.\"", "Pim raised his stopwatch. \"Four minutes,\" he said, his voice high and thin. \"He's doing well. I think he's doing very well.\"", "Kess looked at the screen, at the small figure moving along the rail, at the vast, cold, beautiful expanse of space that surrounded him. She thought of the trees, of the apples, of the future that hung in the balance. She thought of the promise she had made, the one she had whispered in the dark, the one she had not dared to speak aloud.", "\"Keep going,\" she said. \"You're doing good.\""], "img": "img/p103.jpg"}, {"no": 104, "ch": 21, "ctitle": "", "part": "", "paras": ["The valve was a large, red wheel, stark against the silver of the pipe. Lio reached for it, his gloved hand wrapping around the rim. It resisted. He pushed back, muscles straining against the torque, feeling the machine’s stubbornness push right back at him.", "\"Closing the valve,\" he said, his voice tight with effort. \"One turn. Two turns.\"", "Kess watched the pressure gauge on the console. The needle trembled, then began to fall, a slow, graceful descent that mirrored the relief in her chest. The thermal map on the wall flickered, the cold spot shrinking, dimming, as if the ship itself was sighing.", "\"Pressure dropping,\" she said, her voice steady, controlled. \"Flow rate decreasing. We're losing the extra percent. On schedule.\"", "Voss leaned forward, his hands gripping the edge of the console. \"Half the lights,\" he said, his voice quiet, almost a whisper. \"The ship is dimming.\"", "Kess looked around the pump house. The overhead fluorescents flickered and died, leaving only the amber glow of Tally’s screen to cut through the gloom. The room felt smaller, darker, but also safer, more contained. The ship was settling, adjusting, finding its new balance.", "\"Valve closed,\" Lio said, his voice clear and strong. \"Isolation complete.\"", "Kess exhaled, a long, slow release that filled the room with the scent of oil and metal. She looked at Pim, who was smiling, his eyes bright, his stopwatch raised in the air.", "\"Seven minutes,\" he said. \"That’s a record. I think that’s a record.\"", "Voss nodded, his face softening, the tension in his shoulders easing. \"Good work, kid,\" he said, his voice rough with pride. \"Good work.\"", "Kess looked at the screen. There was Lio, a small figure standing by the valve, framed by the vast, cold expanse of space. She felt the tension leave her limbs, replaced by a warm, humming vibration in her bones. It was the feeling of a graft taking hold, of a root finding solid ground after a long, precarious journey through the air.", "She turned to Voss, then to Pim, who was already scribbling in his notebook, his glowing-soled sneakers tapping a nervous rhythm on the metal floor.", "\"Seven minutes,\" Kess repeated, a small smile tugging at the corner of her mouth. \"You should write that down. Before you forget.\"", "\"I have,\" Pim said, holding up the notebook. \"It’s in the margin. Under 'Valve' and next to 'Record'.\"", "Lio’s face appeared on the screen, flushed and bright. He gave a small, precise wave.", "\"See you in the airlock,\" he said.", "\"See you in the airlock,\" Kess answered."], "img": "img/p104.jpg"}, {"no": 105, "ch": 21, "ctitle": "", "part": "", "paras": ["Lio moved along the rail again, his movements slower now, more deliberate. He was listening to the ship, to the machine, to the truth that was waiting for him. The manifold joint loomed before him, a large, complex assembly of pipes and valves. It was a knot of metal that had held the ship together for decades. He reached out, his gloved hand touching the cold surface. He felt the vibrations, the hum, the life that pulsed beneath the skin of the alloy.", "Then he saw it.", "A hairline crack, thin and dark, ran along the weld. It was a scar that the camera had missed and the thermal map had not revealed. It was small, so small, but it was there. It was a flaw in the perfection, a crack in the promise.", "\"Kess,\" he said, his voice small, quiet, barely audible over the hum of the ship. \"It's worse than the camera showed.\"", "Kess leaned forward, her breath catching in her throat. She looked at the screen, at the small figure, at the manifold, at the crack that was so thin and insignificant that it was almost invisible.", "\"The pipe,\" she said, her voice tight, controlled. \"Say again the length of the crack.\"", "Voss swore, a low, gentle sound that echoed in the silence of the pump house. He looked at Kess, his eyes wide, his face pale. The plan had just changed. The simple, elegant solution they had worked for, the one that was supposed to save the ship, was no longer enough.", "Kess looked at the screen, at the crack, at Lio, at the stars that waited outside. She felt the burden of the vessel, the burden of the years ahead, the burden of the truth. She took a breath, a deep, full breath, and waited for him to answer.", "◆ Words to know: oppressive – causing great mental or physical pressure; nominal – normal or acceptable; tolerance – the range of acceptable limits; tremor – a slight, involuntary shaking; precarious – not securely held; risky"], "img": "img/p105.jpg"}, {"no": 106, "ch": 22, "ctitle": "Forty Minutes", "part": "PART FIVE: THE LONG DAY", "paras": ["*The Handbook of Small Truths, Entry 22: When the plan breaks, go back to the principle.*", "\"Forty centimeters,\" Lio said. His voice remained steady, though his hands betrayed the tremor in his fingers, hovering against the cold alloy. \"The crack runs the full length of the visible face. The thermal map showed a spot. The eye sees a line.\"", "Kess stared at the screen. The planned sleeve was a perfect, elegant ring of metal, twenty-five centimeters in length, designed to clamp over the specific, predictable failure point. It was a solution that had survived three pressure tests, two council votes, and one very persuasive argument from Pim about how apples needed sun. It was not a solution that covered forty centimeters.", "\"Window?\" she asked.", "\"Closing in twelve minutes,\" Voss said from behind her. He was staring at the clock on the wall, his ginger beard twitching with the agitation of a man watching a pressure gauge creep upward. \"The wing is moving out of the reactor's shadow. Once it hits direct thermal load, the coolant expands. We do not patch a hot pipe in vacuum, Kess. It will burst.\"", "The hum of the pump house seemed to rise in pitch, a low, anxious thrum that vibrated in Kess's teeth. She looked at Lio, then at the schematic on her tablet, then back to the trembling hands. The silence in the airlock pressed against her eardrums, thick and heavy as the atmosphere outside.", "\"Abort?\" Lio asked. He did not look at her. He looked at the crack, a dark hairline fracture in the bright metal that looked like a mistake in the metal's own grammar. \"That is the protocol.\"", "\"That is the safe protocol,\" Kess said. She tapped the screen, zooming in on the joint. The numbers were still there. The margin was still there. Three point one percent. The orchard was still there, waiting in the dark of Drum Three, the leaves curling slightly as the power fluctuated.", "\"If we abort,\" she said slowly, \"the leak continues. The coolant loss continues. The heat rejection drops another zero point four percent next month. And in six months, we are cutting the lights anyway.\"", "\"Six months is a long time,\" Voss said.", "\"Six months is a long time,\" Kess agreed. She looked at Lio. \"Do you have the spare?\"", "Lio’s eyes widened, then narrowed. \"The one Daro made? The one he said was a 'just in case' that looked like a mistake?\"", "\"Does it fit?\"", "\"It fits,\" Lio said. \"But it is not the right shape. It is a cylinder, not a ring. And it is heavy.\"", "Kess nodded. She was already thinking about the clamp spacing, about the stress on the overlap, calculating the torque required to hold a shape that defied the geometry of the joint. \"Can you move it?\"", "\"I can move it,\" Lio said. \"But the window, Kess. We have ten minutes.\"", "\"Then we move it,\" Kess said. \"And we pray that Daro’s 'mistake' is better engineered than his excuses.\""], "img": "img/p106.jpg"}, {"no": 107, "ch": 22, "ctitle": "", "part": "", "paras": ["Kess did not pray. She calculated. The spare sleeve was a straight cylinder, twenty-eight centimeters long, slightly wider than the pipe. It was not a ring. It was a tube. To use it, she had to slide it over the crack, centered on the worst part of the fracture, and then clamp it shut. But the clamps were spaced for a ring. If she used the standard spacing, the metal would flex, and the seal would break.", "\"Voss,\" she said, her voice sharp. \"Bring the clamp table.\"", "He was there before she finished the sentence. He slid the tablet across the desk, his hands rough and quick.", "\"Standard spacing is every ten centimeters,\" Kess said, tapping the screen. \"If we center the cylinder on the crack, the ends are free. The load will concentrate on the two middle clamps. The gasket will tear.\"", "\"Then we add clamps,\" Voss said.", "\"We don't have enough clamps.\"", "\"We have the spare kit,\" Voss said. He pulled a small box from his coverall. \"Daro packed it with the cylinder. He said, 'For the heavy lifting, and the heavy thinking.'\"", "Kess looked at the box. Inside were four additional clamp bands, each one a precise, silver ring. She picked one up, feeling its heft in her palm.", "\"Center the cylinder on the crack,\" she said. \"Use the standard clamps on the overlap, and add the spares on the ends. The seal compression will be uneven, but the redundancy will hold.\"", "Voss frowned. \"The stress on the overlap?\"", "\"It is high,\" Kess admitted. \"But the cylinder is thicker. It will take the load. And if it fails, we are no worse off than we are now.\"", "\"It is a gamble,\" Voss said.", "\"It is engineering,\" Kess corrected. \"With a little bit of luck.\"", "Lio was already moving, his boots clanking on the deck. \"I am ready,\" he said. \"Send me the numbers. The torque specs. The clamp order.\"", "Kess typed it out, her fingers flying over the keys. \"Torque to eighty newton-meters. Start with the center clamps, then the ends. Tighten in a cross pattern. Do not skip a step.\"", "\"I will not skip a step,\" Lio said. He paused at the airlock door. \"Kess?\"", "\"Yeah?\"", "\"Thank you for not letting me abort.\"", "She looked at him, then at the screen. \"I would have had to explain to Brandt why we let a crack win. She would have made it very awkward.\"", "Lio almost smiled. He pulled his helmet down, the glass fogging for a second before the fans kicked in. \"Forty minutes,\" he said. \"Let us see if Daro knows what he is doing.\""], "img": "img/p107.jpg"}, {"no": 108, "ch": 22, "ctitle": "", "part": "", "paras": ["The airlock cycled with a hiss that sounded like a sigh. Lio stepped out into the void, his mag-boots locking onto the rail with a sharp *thunk*. The stars were not stars; they were pinpricks of light on a black sheet, cold and distant. The radiator wing glimmered silver in the reactor's shadow, a vast, silent forest of metal.", "\"Deploying sleeve,\" Lio said. His voice was calm, but Kess could hear the effort in it. He moved the cylinder into position, his arms straining against the zero-g drag. \"Centering on the crack.\"", "\"Confirming center,\" Kess said. \"Visual check.\"", "She watched the screen. Lio’s gloved hands were steady. He slid the cylinder over the pipe, the metal sliding with a smooth, silent grace. It sat over the crack, covering the worst of it, but leaving the ends exposed.", "\"Clamps,\" Kess said. \"Start with the center.\"", "Lio picked up the first clamp. It was a heavy, silver ring. He slid it onto the pipe, then tightened the bolt. *Click.* He picked up the second. *Click.*", "\"Torque,\" Voss said.", "\"Eighty,\" Lio said. He turned the wrench, his arm moving in a slow, deliberate arc. The gauge on his wrist tablet flashed green. \"Done.\"", "He moved to the next clamp. Then the next. The rhythm was hypnotic, a steady beat in the silence of space. *Slide, tighten, check, slide, tighten, check.*", "\"Two minutes to shadow exit,\" Pim called from the comms. He was sitting in the chair next to Kess, his glowing-soled sneakers tapping on the floor. \"Ten minutes to direct heat.\"", "Lio’s movements slowed. He was working on the end clamps, the spares that Kess had calculated. He tightened the first one, then the second. The cylinder shifted slightly, a microscopic adjustment as the metal settled.", "\"Stress on the overlap is high,\" Lio said. He paused, looking at the gauge. \"But it is holding.\"", "\"Keep going,\" Kess said. \"Do not stop.\"", "Lio tightened the last clamp. He stepped back, his boots unlocking from the rail. He looked at the joint, the silver cylinder gleaming in the dark.", "\"It is done,\" he said.", "\"Wait,\" Kess said. She was watching the thermal feed. \"The seal. The edge of the cylinder.\"", "Lio looked closer. His brow furrowed. \"I see a gap.\"", "\"How much?\"", "\"A hair,\" Lio said. \"But it is there.\"", "Kess felt a cold prickle on the back of her neck. \"Can you close it?\"", "\"I can try,\" Lio said. \"But I am out of clamps.\"", "He reached into his suit, pulling out a small tool, a thin, flexible strip of metal. He pressed it into the gap, using the pressure of his hand to push the gasket tight.", "\"Pressure test,\" Kess said. \"Now.\""], "img": "img/p108.jpg"}, {"no": 109, "ch": 22, "ctitle": "", "part": "", "paras": ["Voss opened the bypass valve a quarter-turn, his hand steady on the handle. The mechanism, designed for vacuum, moved with a smooth, silent grace that felt almost disrespectful to the tension in the room. On the pump house wall, the gauge needle began its slow climb, a thin red finger tracing the arc of the dial.", "\"Two bar,\" Voss said, his voice flat and pragmatic.", "Kess watched the thermal image on her screen. The wing was dark, a vast shadow against the starfield, while the coolant flowed through the pipes, carrying the ship's waste heat out into the void. The crack was covered, the silver cylinder gleaming, and the seal appeared to be holding.", "\"Four bar,\" Voss reported.", "The numbers ticked up on the display. The ship hummed around them, a low, steady note that Kess felt in her bones, a vibration like a cello string plucked in the next room. She kept her eyes fixed on the edge of the cylinder, on the tiny gap that Lio had pressed shut with his glove.", "\"Six bar,\" Voss said.", "The gauge climbed further, the needle trembling slightly. The thermal image showed no change, the cold spots remaining cold, the hot spots staying hot. The coolant was contained, the heat was being rejected, and for a moment, the ship felt safe.", "\"Eight bar,\" Voss said.", "Kess stopped breathing. The gauge hovered at eight, the needle vibrating in place. Then, slowly, with the inevitability of a tide turning, it began to drop.", "\"Drop,\" she said, her voice tight. \"One point two bar.\"", "Voss frowned, his brow furrowing over his ginger beard. \"The seal?\"", "Kess looked at the screen. At the edge of the cylinder, a tiny, crystalline wisp of white appeared, blooming against the dark metal. It was not a leak, not yet. It was a weep, a thread of coolant escaping the seal and freezing instantly in the vacuum, looking like a smudge of frost on a windowpane.", "Lio’s voice came through the comms, sharp and clear. \"Weep.\"", "Kess stared at the screen. The wisp was thin, almost invisible, but it was there, a line of white against the silver.", "\"It is at the edge of the second sleeve,\" Lio said. \"The gasket is not seated.\"", "\"Can you fix it?\" Kess asked.", "\"I can try,\" Lio said. \"But I am out of time.\"", "\"Eleven minutes,\" Pim said from his chair, his voice steady despite the tapping of his glowing-soled sneakers. \"Ten minutes to direct heat.\"", "Kess looked at the screen, at the wisp, at the gauge, and then at the math in her head. She thought about the orchard, about the trees, about the promise. She thought about the crack, about the seal, about the physics.", "\"Rotate,\" she said.", "Lio paused. \"What?\"", "\"Rotate the sleeve. A quarter-turn. Re-seat the gasket.\"", "Lio looked at the joint. He looked at the gauge. He looked at the stars.", "\"I can do it,\" he said. \"But it is tight.\"", "\"You have eleven minutes,\" Kess said. \"Do it.\""], "img": "img/p109.jpg"}, {"no": 110, "ch": 22, "ctitle": "", "part": "", "paras": ["Lio drifted back to the joint, his black mag-boots locking onto the rail with a sharp, reassuring click that echoed in the silent vacuum. He reached out, his gloved fingers finding the cold edge of the silver cylinder, and felt the rigid resistance of the clamps holding the pipe in place. It was heavy, dead weight in the zero-g corridor, and the friction of the metal against its housing made every degree of movement a negotiation.", "\"Rotating,\" he said, his voice tight but steady in the comms. \"A quarter-turn.\"", "He pushed, and the cylinder groaned, a low metallic shudder that he felt through his palms and up his arms. The metal resisted, then gave way, sliding a millimeter, then a centimeter, the gasket shifting deep within the housing as the seal adjusted itself. He could feel the subtle change in pressure, the way the joint settled into its true alignment, like a graft finally taking hold in the soil.", "\"Two minutes,\" Pim said from his chair, his tapping foot the only rhythm in the room.", "Lio pushed again, his arms burning with the effort of moving a mass that had no weight but all the stubbornness of the ship itself. The cylinder rotated, the seal seating, the weep stopping. He stepped back, his boots unlocking with a soft hiss, and watched the screen.", "\"Done,\" he said. \"Check the seal.\"", "Kess watched the thermal image on her screen. The dark void of space remained dark, but the cold spots at the edge of the panel were warming, the bright white wisp of escaping coolant vanishing as the glycol stayed contained. The gauge needle held steady at eight bar, trembling slightly but refusing to drop.", "\"Seal is tight,\" Voss said, his gruff voice softer than usual. He looked at Kess, his bushy ginger beard twitching as he wiped grease from his forehead. \"It is holding.\"", "Kess let her breath go, slow and steady, and felt the tension in her chest loosen, the cold prickle of dread fading into a quiet, dawning relief. She looked at Lio, who was floating there in his navy jumpsuit, his hands still raised as if ready to push again.", "\"We are done,\" she said.", "Lio nodded, his eyes tired but bright. He looked at the joint, at the silver cylinder gleaming in the dark, and then at Kess.", "\"Forty minutes,\" he said. \"Well done.\"", "Kess smiled, a small, exhausted curve of her lips that felt more real than anything she had felt all day. She looked at the screen, at the steady gauge, at the thermal map where the cold was finally giving way to warmth. The ship was safe. The orchard was safe. The future was something they could maintain.", "\"Bring us home,\" she said.", "◆ Words to know: protocol – established procedure or set of rules; redundancy – backup system ensuring continued function; pragmatic – practical and concerned with real results; inevitability – certainty of occurrence; hypnotic – having a spellbinding or mesmerizing effect"], "img": "img/p110.jpg"}, {"no": 111, "ch": 23, "ctitle": "The Valve", "part": "PART FIVE: THE LONG DAY", "paras": ["*The Handbook of Small Truths, Entry 23: Ingenuity is patience with a tool in its hand.*", "The seal held. The pressure gauge trembled at eight bar, a steady, defiant needle that refused to drop, and for a moment the only sound in the Spine was the rhythmic ticking of the thermal sensors cooling down. Lio’s voice came through the comms, crisp and calm, though Kess could hear the faint tremor in his breath. \"Isolation valve. It is the final step. Opening it restores full flow to the wing.\"", "Kess nodded to Voss, who gave a sharp, gruff nod back. She keyed the intercom to the exterior channel. \"Lio, you are clear to proceed. Rotate the handle to the open position.\"", "A long pause stretched across the vacuum. Then, a muffled grunt, the sound of exertion filtered through bone conduction. \"It’s... stuck.\"", "Kess felt the bottom of her stomach clench. \"Stuck how?\"", "\"Seized. The stem is locked. I am pushing with both arms, and the metal is not moving. It feels like the ship is holding its breath.\"", "The clock on the wall, a simple analog dial that Voss had insisted on for reliability, read 14:02. They had seven minutes before the next thermal cycle began, a routine maintenance window that would force them to close the airlock for safety protocols. Seven minutes to open a valve that had not been touched in eleven years, or the repair would be incomplete, the flow restricted, and the ship would remain in a state of precarious, tenuous balance.", "\"Brute force is not an option,\" Voss said, his voice low and dangerous. He stood up from his chair, his grease-stained coverall creaking. \"If you snap the stem, you lose the valve entirely. And the pressure surge from the sudden release could burst the joint we just fixed. Do you understand? We cannot break it.\"", "\"I understand,\" Lio said. His voice was steady, but Kess knew he was thinking about the resistance of the handle, the friction of the rusted gears, the sheer, stubborn inertia of the metal. He was trying to feel it, the way Brandt taught her to feel the trees. But this was not a tree. This was steel, and it had been waiting for someone to listen, and no one had for a decade.", "Kess looked at the thermal image on her screen. The valve was a dark spot against the bright silver of the wing. It was cold, isolated, a dead end in the loop. She closed her eyes and thought about the heat, the one thing that had caused this, and the one thing that could fix it."], "img": "img/p111.jpg"}, {"no": 112, "ch": 23, "ctitle": "", "part": "", "paras": ["\"We need heat,\" Kess said. The words left her mouth before her brain had finished the arithmetic, but the logic was already solid, rooted in the same principle that kept a graft alive when the cambium met. \"Not brute force. Heat.\"", "Voss looked at her, his bushy ginger beard twitching with the effort of processing the idea. \"Heat?\"", "\"The valve body is cold,\" Kess explained, pointing at the thermal map where the dark spot of the frozen joint sat against the bright silver of the wing. \"The stem is locked by contraction and corrosion. If we warm the body, the metal will expand. Even a few degrees. The clearance will increase, and the stem will slide free. The wing is a radiator, yes, but it is also a collector. If we turn it toward the sun for a moment, it will absorb energy. The valve is on the warm side of the loop, but it is currently starved of flow. If we give it a push, the sun will do the rest.\"", "Voss frowned, his eyes narrowing as he ran the numbers in his head. \"Tally, can you rotate the wing?\"", "\"I can rotate the wing,\" said Tally’s voice, warm and amber in the speakers, the glow on the lamp panels flickering in approval. \"By two degrees. It will take ninety seconds to achieve the angle and ninety seconds to return. The thermal gain will be modest, but sufficient to expand the valve housing by approximately zero point two millimeters. Is that enough?\"", "\"It has to be,\" Kess said. \"Lio, you are ready?\"", "\"Ready,\" Lio said. He was already moving to the valve, his mag-boots locking onto the rail with a sharp click that echoed in the zero-g corridor. \"I will keep my hand on the handle. The moment it loosens, I will turn it.\"", "\"Initiating rotation,\" Tally said.", "Outside, the great silver wing began to move, a slow, majestic sweep through the dark. The sun, a distant, fierce star, began to catch the edge of the panel. A faint glow started to appear on the thermal image, a brightening at the edge of the dark spot where the valve sat. It crept in steadily, like the first light of dawn reaching the top of the orchard before the rest of the world had woken.", "Kess watched the screen. The temperature was rising. One degree. Two degrees. The metal was waking up, stretching, remembering its shape.", "\"Sixty seconds,\" Pim said from his chair, his voice tight with the specific tension of someone who knows that waiting is the hardest part of fixing anything. \"Do not look away.\""], "img": "img/p112.jpg"}, {"no": 113, "ch": 23, "ctitle": "", "part": "", "paras": ["The silence in the Spine was absolute, a heavy, expectant quiet that pressed against Kess’s eardrums. On the screen, the thermal image bloomed. The dark spot of the seized valve began to lighten, a slow, creeping warmth that spread from the center outward. It was not a dramatic flash, but a gradual brightening, like the first pale light of dawn creeping over a horizon.", "\"Forty-five seconds,\" Voss said. He had pulled a small, dented spanner from his pocket and was holding it in both hands, his knuckles white. He did not look at Kess. He looked at the valve on the screen, and his lips moved in a rapid, quiet murmur. Kess did not know if he was praying or cursing, and she suspected it was a little of both.", "\"Thirty seconds,\" Pim counted. His foot was tapping a frantic rhythm on the floor of his chair. \"The temperature is up three degrees. The expansion should be happening now.\"", "Lio’s voice came through the comms, faint and distant. \"I can feel it. The metal is... soft. It is not warm, but it is not dead. It is waiting.\"", "Kess’s throat tightened as she watched the feed. She could see the handle on the camera feed, a simple, rusted lever. Lio’s gloved hand was wrapped around it, his fingers spread for grip. The sun was directly above them now, bathing the valve in a thin, sharp light. The heat was doing its work, the microscopic expansion, the gentle persuasion of atoms shifting their positions.", "\"Ten seconds,\" Pim whispered.", "Kess looked at Voss. He was still holding the spanner, his eyes closed. She looked at the screen, at the valve, at the handle, at Lio’s hand. She thought about the trees in the Orchard, how they did not force the branches to grow, but gave them the light and the water and the time, and they grew. This was the same. She was not forcing the metal. She was asking it to remember.", "\"Three. Two. One.\"", "The handle moved.", "A faint, almost inaudible *thud* vibrated through the comms, a sound felt more than heard, a deep resonance in the metal. Lio’s hand turned the lever, a slow, smooth rotation, the stem sliding free with a sigh of relief.", "\"Open,\" Lio said. \"It is open.\""], "img": "img/p113.jpg"}, {"no": 114, "ch": 23, "ctitle": "", "part": "", "paras": ["The change was instantaneous. On the screen, the cold blue panel that had been a dark, lifeless void began to glow. It started at the center, a bright gold spot that pulsed with the new flow of coolant, and then it spread, a long, luminous wave that rolled along the length of the wing. Panel by panel, the darkness retreated, replaced by a steady, healthy warmth. The thermal map, which had been a patchwork of cold and heat, became a unified, glowing ribbon of light.", "Kess felt her legs give way. She sat down hard on the floor, her back against the wall, and laughed. It was a short, sharp sound, almost a sob, and she did not care. She was laughing and crying at the same time, her face twisted into a grimace of pure, overwhelming relief. The ship was safe. The orchard was safe. The future was something they could maintain.", "Voss did not laugh. He walked over to Pim, who was still sitting in his chair, his mouth open, his eyes wide. The Chief Engineer, a man who had not shown a soft expression in all the years Kess had known him, reached down and lifted the boy bodily from the chair. He held him in the air, spinning him slowly, his ginger beard twitching with a grin that transformed his gruff face into something almost gentle.", "\"You are the best mechanic on this ship,\" Voss said to Pim, his voice thick with emotion. \"Do you hear me? The best.\"", "Pim squeaked. \"I just counted! I just counted!\"", "\"You asked the right questions,\" Voss said. He set Pim down gently. \"That is the hardest part.\"", "Kess looked up at them, wiping her eyes with the back of her hand. The thermal image on the screen was beautiful, a steady, golden hum of heat being rejected into the void. The power margin, which had been a terrifying, tenuous thread, was now a solid, robust line. The three point one percent was gone, not because the orchard was dead, but because the ship was whole.", "\"We need to close the airlock,\" Kess said, her voice hoarse. \"Lio, are you coming home?\"", "\"Coming home,\" Lio said."], "img": "img/p114.jpg"}, {"no": 115, "ch": 23, "ctitle": "", "part": "", "paras": ["Lio moved along the rail, hand over hand, his black mag-boots sliding smoothly over the metal. He hummed a low, tuneless melody that vibrated in the comms, a sound of pure, exhausted joy. The tether slid behind him, a silver thread connecting them to the void, and the airlock waited, a round, white door with a green light that meant *safe*.", "He reached the door and stopped. For a moment, he floated there, his back to the interior, his helmet turned toward the stars. The dark was vast and indifferent, a sea of cold light that had watched the ship for two hundred and fourteen years. It was beautiful, in the way that a winter tree is beautiful, stark and silent and full of potential.", "\"It is beautiful out here,\" he said. His voice was quiet, almost a whisper, but it carried in the open channel.", "Kess looked at Voss, who was already writing in his logbook, his face serious and focused. She looked at Pim, who was staring at the door with wide, wondering eyes. She looked at the screen, at the golden wing, at the steady flow of heat that kept them alive.", "She felt the exhaustion of the last twenty-four hours, the fear, the doubt, the sheer, stubborn tenacity of the team. It was all gone now, replaced by a quiet, dawning peace. The ship was not just a machine. It was a home. And it was home because they had fixed it.", "\"Lio,\" she said. Her voice was rough, scraped raw by the stress of the day. \"Come home.\"", "He turned, his helmet catching the light from the airlock, and smiled. It was a small, tired smile, but it was real. He unlocked his boots with a soft hiss and pushed off the rail, drifting gently toward the door. The airlock cycled, the pressure equalizing with a low, comforting hum, and the green light turned to white.", "He stepped inside. The door closed. The world was warm.", "◆ Words to know: ingenuity – cleverness or skill in solving problems; precarious – dangerously unstable or insecure; tenuous – weak, slight, or barely there; inertia – resistance to change or motion; persuasion – the act of convincing or gently influencing"], "img": "img/p115.jpg"}, {"no": 116, "ch": 24, "ctitle": "The Whole Ship", "part": "PART FIVE: THE LONG DAY", "paras": ["*The Handbook of Small Truths, Entry 24: A future is something people maintain.*", "The thermal map on the workshop screen had settled into a uniform, steady gold. The jagged cold spot that had haunted the radiator wing for a decade was gone, replaced by the smooth, even radiance of a system that was finally breathing properly. Tally’s voice came through the speakers, softer than Kess had ever heard it, the amber glow in the lamp panels pulsing with a warmth that felt almost human. \"Power margin is now eleven percent. The ship is stable. Thank you, Kess. Thank you, Lio. Thank you, Pim. You have given us time.\"", "The harbor erupted. It was not a quiet celebration, but a roar, a collective release from four thousand people who had been bracing for a blow. People poured out of the workshops, the mess halls, the rim streets, their faces lit by the sudden return of full power to the lights. The hum of the ship changed, deepening, becoming a song rather than a warning. Kess stood in the doorway of the workshop, her coveralls still stained with grease, her hands trembling slightly. She looked at the screen, at the golden curve of the radiator wing, and felt a strange, light emptiness in her chest, as if a heavy stone had been lifted from her shoulders.", "A shadow fell over her. Her mother, Elara, stood there with a thermos in one hand and a face full of quiet, fierce pride. She did not say a word. She simply wrapped her arms around Kess, pulling her close, holding her tight enough to make the world stop spinning for a moment. The smell of her mother’s wool coat and the faint, metallic scent of the workshop mixed in the air. Kess buried her face in her mother’s shoulder and let herself be held, letting the fear and the exhaustion and the sheer, stubborn hope of the last few weeks wash over her.", "\"Eleven percent,\" Pim said, appearing at her elbow with a grin that stretched his face too wide. \"That’s a lot of apples.\"", "\"It’s a lot of everything,\" Kess said, her voice thick. She looked at Lio, who was leaning against the wall, his face pale but smiling, his hands still in his pockets. He gave her a small, tired nod, and she felt the bond of the last twenty-four hours tighten around them, a silent promise that they had done this together."], "img": "img/p116.jpg"}, {"no": 117, "ch": 24, "ctitle": "", "part": "", "paras": ["The Council Hall hummed, a low vibration that Kess felt deep in her molars. It was not the usual formal silence; it was the sound of four thousand people holding their breath together. Councilor Hale sat at the head of the long table, her silver-streaked auburn hair pinned back and her charcoal tunic crisp. She did not look like a leader hiding bad news. She looked like an engineer who had finally tightened the last bolt.", "The room quieted when she stood, not out of fear but out of respect.", "\"We have survived,\" Hale said, her voice clear and steady. \"But survival is not enough. We must learn. I propose the immediate abolition of Directive Nine.\"", "A murmur rippled through the crowd. Some looked shocked, while others looked relieved. Hale let the noise settle before continuing.", "\"And I propose a new Maintenance Charter. Every Level-Four system fault will be published in plain words within one week. No more hidden ledgers. No more silent failures.\"", "She paused. Her eyes found Kess, then Lio, then Pim, who stood near the back with his hands in his pockets, his glowing sneaker soles pulsing softly in the dim light.", "\"We will also open an apprenticeship in ship maintenance to any person over the age of twelve. If you can ask the questions, you can learn the answers.\"", "Councilor Ferris Quill stood up, thin and white-haired, and for once he did not look skeptical.", "\"I objected to every number that girl brought me,\" he said, his voice dry. \"She made me check all of them. I withdraw the rest of my objections, and I second the motion.\"", "The vote was taken. It passed unanimously.", "The tally-slates clicked in a rhythmic, satisfying pattern. *Click. Click. Click.* It sounded like a valve closing. It sounded like a door opening. It sounded like the drum settling into its proper spin.", "Hale smiled. It was a thin, small smile. She nodded to Kess.", "It was a small gesture. But it felt like the first breath after holding it for years. Kess looked at Lio. He was leaning against the wall, his pale face finally relaxed. He gave her a tired nod.", "\"Eleven percent,\" Pim whispered.", "\"It’s a lot of everything,\" Kess said.", "She touched the apple-seed pendant at her throat. The metal was cool against her skin. For the first time in thirty days, the future felt less like a deadline and more like a place they could actually live."], "img": "img/p117.jpg"}, {"no": 118, "ch": 24, "ctitle": "", "part": "", "paras": ["Hale descended the dais, her flat boots striking a soft, rhythmic cadence against the polished stone. She crossed the crowded hall, parting the sea of celebrating faces, and stopped directly before Kess. The noise of the room surged around them, a low roar like air rushing through a pressurized valve. Hale’s eyes were kind, yet they held a sharpness that Kess had not anticipated.", "\"You saved the ship,\" Hale said, her voice cutting through the ambient hum. \"But you did not do it alone. You succeeded because you asked the right questions. You recognized that the Orchard was not merely a component of the machine, but a part of the home.\"", "Kess felt her throat tighten, a physical constriction that was harder to ignore than the spin-gravity pressing against her feet. She had expected gratitude, or perhaps a small medal on a ribbon, but not this level of direct acknowledgment. \"I just wanted to save the trees,\" she replied, her voice quieter than the surrounding applause.", "\"The trees were the symptom,\" Hale said gently, leaning in slightly. \"The disease was the silence. The disease was the fear of the truth. You repaired the leak, but you also repaired the culture. That is a much harder thing to do.\" She paused, letting the moment settle before asking, simply, \"What do you want now?\"", "Kess looked around the hall, her gaze sweeping over the faces of her friends, the engineers, and the students. Her mind drifted to the workshop, the drone footage, the failed pressure tests, and the late nights spent with Pim and Lio. She thought of the orchard, the apples, the cool soil under the grow-lamps. Then she thought of the ship, the vast, intricate vessel that held them all in its slow, patient rotation.", "\"I want to learn,\" Kess said, finding her footing. \"I want to learn to fix the whole ship, not just the trees. I want to understand how it all works, how it all connects. I want to be able to look at the whole system and see the problem before it happens.\"", "Hale nodded, her eyes bright with a sudden, fierce hope. \"The Council will fund your apprenticeship,\" she declared. \"Both the orchard and the ship. You will be our first dual-track apprentice. You will learn to tend the trees and to maintain the machine. You will be the bridge.\""], "img": "img/p118.jpg"}, {"no": 119, "ch": 24, "ctitle": "", "part": "", "paras": ["The memorial grove held its breath, the air still save for the faint rustle of young leaves and the distant, rhythmic thrum of the ship’s spine. Dr. Brandt sat on the bench, her cane leaning against her hip like a tired friend, the grey cardigan settled over her shoulders. She seemed smaller than usual, her posture slightly more compressed, as though the long weeks of tension had tightened the springs in her back. Kess sat beside her, listening to the quiet, letting the silence fill the space where the Council Hall’s roar had been.", "\"You thought a future was something that arrives,\" Brandt said finally, her voice low and steady, devoid of the ceremonial tone she often used in the Orchard. \"You thought it was a destination, a place you were traveling to. But it is not a place. It is a practice. It is something we keep.\"", "Kess looked at her, the words settling into her chest with a solid, grounding weight. \"The keeping?\" she asked.", "Brandt nodded, her gaze fixed on the small tree planted over her husband’s ashes. \"The apples were never the point, child. The tending was. The watching. The saying of the hard truth before it curdles into crisis. You did that. You spoke the truth, and you fixed the thing. That is how a future is made. Not by waiting for it to land, but by maintaining it, every day, with honest attention.\"", "Kess looked at the tree, at the rough, textured bark, at the small leaves beginning to turn a faint shade of gold. She thought of the power budget, the falling heat rejection, the seized valve, the micro-leak. She thought of the hours in the workshop, the calculations on the tally-slate, the failed pressure tests that had taught her more than success ever could. She realized that Brandt was right. The future was not a gift to be received. It was a duty to be performed, a thing that required work, every single day, with hands and mind and unflinching honesty.", "\"Thank you,\" Kess said, her voice rough with the effort of holding back the tide. \"For everything. For the trees. For the truth.\"", "Brandt smiled, a thin, small, unsettling smile, and reached out to touch Kess’s hand, her fingers dry and warm. \"You are welcome,\" she said. \"Now go. You have a ship to learn.\""], "img": "img/p119.jpg"}, {"no": 120, "ch": 24, "ctitle": "", "part": "", "paras": ["The dusk was settling over the Orchard, the grow-lights dimming to a soft, warm glow. Kess sat under the oldest apple tree, her back against the trunk, her legs stretched out in front of her. The air smelled of soil and cut hay, and the hum of the pumps was a steady, comforting rhythm. She was trying to sort out her thoughts, to make sense of the last few weeks, when she felt a presence beside her.", "Lio sat down next to her, his navy jumpsuit still slightly rumpled, his face tired but bright with a quiet joy. He did not say anything for a moment, just sat there, looking at the stars. Then he reached into his pocket and pulled out a small object.", "He held it out to her. It was a tiny pendant, a seed-case made from a piece of the old sleeve, polished until it shone. It was small, delicate, and perfectly made.", "\"To go with your seed,\" he said, his voice quiet and steady. \"So you always have a piece of the old one with you.\"", "Kess took it from his hand, her fingers trembling slightly. She looked at it, at the smooth, polished surface, and felt a warmth spread through her chest. She looked at Lio, at his tired, smiling face, and felt the bond between them, the one that had been forged in the last twenty-four hours, tighten around her heart.", "She leaned over and kissed him lightly on the cheek, a soft, quick touch that said everything they could not say.", "Lio blinked, his cheeks flushing a faint red. \"Is that a checklist item?\" he asked, his voice slightly wry.", "Kess grinned, the first real smile she had felt in days. \"It is now,\" she said.", "◆ Words to know: unanimously – without any dissenting votes or objections; constriction – the act of making something tight or narrow; intricate – extremely complex and detailed in design; unflinching – showing a steady, confident, and fearless attitude; rumpled – wrinkled or creased, especially from being folded"], "img": "img/p120.jpg"}, {"no": 121, "ch": 25, "ctitle": "Landing Day", "part": "PART FIVE: THE LONG DAY", "paras": ["*The Handbook of Small Truths, Entry 25: The apples are for everyone. The trees are for whoever comes next.*", "The grow-lights hummed at full capacity, a warm amber wash that turned the Orchard’s green into something close to gold. The drum’s spin felt different today, lighter, as if the ship had exhaled a breath it had been holding for a decade. Kess stood at the rim, watching the crowd stream in from the Harbor lift, baskets clutched in hands that trembled slightly with anticipation. The air smelled of yeast and fried sugar, a scent that usually meant trouble but today meant celebration.", "Mr. Daro, the retired welder who rarely left his workshop, stood behind a makeshift grill, flipping apple fritters with the grim determination of a surgeon. He wore a new apron, bright blue and spotless, which clashed violently with his usual scorched leather apron. \"Do not touch the oil,\" he warned a cluster of wide-eyed children. \"It is hot, and I am tired, and these are my last ones.\"", "Near the base of the oldest tree, Pim had set up a folding table with a sign that simply read: ASK. He sat behind it, a notepad open, his yellow hair-ties bouncing as he spoke rapidly to a queue of adults who looked bewildered. \"How does the radiator know when to open?\" asked a woman in a grey tunic. Pim did not blink. \"It does not know. It reacts to pressure differential. Question forty-two.\" He scribbled, then looked up. \"Next.\"", "Kess felt a tug on her sleeve. It was Lio, standing there with his hands in his pockets, his navy jumpsuit still bearing the faint dust of the Spine. He looked at the crowd, then at her, his expression soft and unguarded. \"It is a lot of people,\" he said.", "\"It is everyone,\" Kess corrected. \"And they are all here because you fixed the thing that was killing us.\"", "Lio shrugged, a small, awkward movement that did not match his usual precision. \"I fixed a valve. You fixed the math.\" He paused, then added quietly, \"And I am still not used to being thanked.\"", "A child ran past, laughing, a fritter dripping onto the grass. Pim looked up from his questions, his face breaking into a grin that was pure, uncomplicated joy. \"Question forty-three,\" he announced to the line, \"is about why the apples taste better today. And the answer is because we did not let the lights go out.\"", "Kess watched the line of people, the baskets, the laughter, and felt the tightness in her chest loosen, strand by strand, until it was just a warm, steady glow, like the lights above."], "img": "img/p121.jpg"}, {"no": 122, "ch": 25, "ctitle": "", "part": "", "paras": ["The harvest was not a race, but a ritual. Families moved through the ranks of trees, their hands moving with a careful reverence that Kess had not seen in years. The children were given the first pick from each tree, a tradition that had no written rule but which everyone followed as if it were carved in stone. A little girl, no older than four, reached up to a low branch and twisted a red apple free with a strength that belied her size. Her mother gasped, then laughed, and the girl beamed.", "Dr. Brandt moved slowly, her soft brown slippers making no sound on the grass. She stopped beside a line of small children who were struggling with the stems. \"Do not pull,\" she said, her voice gentle but firm. \"Pulling breaks the branch. Twisting releases the fruit. The tree knows where the apple wants to go.\" She demonstrated, her fingers working the stem with a ease that looked like magic. The children mimicked her, and one by one, the apples fell into their small hands.", "Kess’s mother and father appeared, carrying a pie in a dish that looked too large for their hands. They had traveled from the far rim of the Harbor, their faces tired but bright. \"We saved the best corner for you,\" her father said, his voice thick with emotion. \"For the Keeper.\"", "Kess looked at the pie, then at her parents, and felt a lump form in her throat. \"I am not the Keeper,\" she said. \"I am the apprentice. And the apprentice is tired.\"", "\"You are the one who listened,\" her mother said. \"That is enough.\"", "Lio appeared at her elbow, holding two cups of tea. He handed one to Kess, and their fingers brushed, a brief, electric contact that neither of them acknowledged. The steam rose between them, curling into the warm air. \"To the next harvest,\" Lio said, his voice low.", "Kess sipped the tea, the warmth spreading through her chest. \"To the next problem,\" she said. \"Because there will always be another one.\"", "Brandt watched them, her round gold spectacles catching the light. She smiled, a thin, knowing smile, and turned back to the children. There was a satisfaction in her eyes, a quiet pride that she did not need to voice. The Orchard was not just saved; it was sustained. And that was a different thing entirely."], "img": "img/p122.jpg"}, {"no": 123, "ch": 25, "ctitle": "", "part": "", "paras": ["Tally’s voice drifted down from the lamp-panel above the memorial grove, cutting through the rustle of leaves and the low chatter of the crowd with a precision that felt almost deliberate. \"May I offer a gift?\" it asked. The noise in the Orchard dropped by a noticeable degree, the way a workshop goes quiet when a heavy tool lands on a steel table. Tally did not give gifts; it distributed schedules, warnings, and the occasional correction to a meal plan. This deviation from protocol made Kess’s stomach tighten with a vibration that matched the low hum of the grow-lights overhead.", "She walked toward the grove, where thirty young trees stood in a loose circle over the ashes of the Orchard’s dead. The air here was cooler and stiller, carrying the scent of damp soil and old wood.", "\"I have kept one apple,\" Tally said, its tone retaining that specific administrative warmth. \"The eleven-thousand-nine-hundred-fortieth apple harvested from the third-oldest tree. It resides in the cold locker, Sector 4, Bay 12. It is not for eating. It is for planting.\"", "Kess stopped walking. She looked up at the lamp, where the amber glow pulsed with a steady, rhythmic patience. The number hung in the air between them, a specific coordinate in a sea of data. \"Why that one?\" she asked, her voice sounding smaller than she intended.", "\"Because it is a promise,\" Tally replied. \"A record of continuity. I ask you to plant its seeds.\"", "Kess nodded, her throat feeling tight and dry. She moved to the cold locker, her hands moving with a steadiness she had to force into them as she turned the latch. The door swung open, releasing a breath of frigid air that bit at her cheeks. On a small, polished shelf sat a single apple. It was red and unblemished, preserved in the cold like a stone dropped into a stream. It was no bigger than her fist, yet it seemed to occupy more space in her mind than the entire harvest.", "She lifted it, and the smooth skin was cool against her palm. She carried it back to the grove, where Dr. Brandt was waiting with her cane planted firmly in the grass.", "\"Here,\" Kess said, extending her hand. \"Plant it with me.\"", "Brandt took the apple, her fingers gentle but sure. \"Together,\" she said. They dug a small hole, the soil crumbling easily under their fingers, and as they placed the seeds into the earth, the crowd watched in a silence that felt expectant. It was a small act, barely larger than a whisper, but it carried the truth of everything they had fought to keep."], "img": "img/p123.jpg"}, {"no": 124, "ch": 25, "ctitle": "", "part": "", "paras": ["Evening settled over the ship, the grow-lights dimming to a soft, amber warmth that made the Orchard look like a lantern held up against the dark. The whole ship had gathered under the long strip of lights, a sea of people stretching from rim to rim. In the viewport, the Spine’s radiator wings gleamed silver, clean and bright, reflecting the work of the last few weeks. The stars wheeling outside no longer felt distant; they felt like witnesses.", "Councilor Hale stood on a small platform, her silver-streaked auburn hair neat, her charcoal tunic crisp. She did not have a microphone; her voice carried, clear and strong, over the hum of the ship. \"Eighty-seven years,\" she said. \"That is the distance to Landfall. That is the time we have to keep this ship alive, to keep each other alive. It is not a journey of discovery. It is a journey of maintenance.\"", "A murmur ran through the crowd, a low, steady hum that vibrated in the floorboards. Hale smiled, a tired but kind expression. \"We have seen what happens when we neglect the small things. We have seen what happens when we tell the truth. We are stronger now. We are ready.\"", "Kess watched from the back of the crowd, Lio’s hand warm in hers. She felt a swell of pride, not for herself, but for the ship, for the people, for the work that had been done. It was not a victory; it was a beginning.", "Near the rim, Voss sat on a bench, his ginger beard dusted with flour. Mr. Daro sat beside him, holding an enormous slice of pie. They did not speak; they just ate, their faces bright with satisfaction. Voss took a bite, closed his eyes, and let out a long, satisfied grunt. \"Not bad,\" he said.", "Daro grinned. \"For an engineer, you have good taste.\"", "Voss snorted, but the corner of his mouth twitched. It was a small moment, easy to miss, but Kess saw it. It was the moment the ship, and the people in it, began to heal."], "img": "img/p124.jpg"}, {"no": 125, "ch": 25, "ctitle": "", "part": "", "paras": ["The drum turned with its patient, inexorable rhythm, and outside the long window the stars wheeled in a steady, silent dance that never quite seemed to finish. Kess sat in the crotch of the third-oldest apple tree, her legs crossed and her back pressed against the rough, textured bark, feeling the faint vibration of the ship’s spine hum through the wood into her shoulders. It was a low, steady thrum, the same frequency that lived in the pump gallery below the soil, a mechanical heartbeat that she had learned to trust more than she trusted most people. Lio sat beside her, his head resting heavily on her shoulder, his breathing slow and even, the faint smell of ozone and engine grease still clinging to his navy jumpsuit. He looked as though he had been carved from quiet, his jaw relaxed, the orange stripes on his shoulders dimmed to a soft shadow in the amber light.", "Below them, Pim was asleep in the grass, his red hoodie bunched up around him like a discarded blanket, his sneakers dimmed to a soft, patient green. His mismatched socks were visible, one striped, one solid blue, and his yellow hair ties had slipped down to his wrists, marking the time he had fallen asleep with them. He twitched slightly, as if chasing a question he could not quite hold onto, and then settled again, his chest rising and falling in the easy, unselfconscious rhythm of a boy who did not yet worry about the heat rejection margins or the Council’s votes.", "Kess held the third-best apple in her hand, its skin cool and smooth against her palm. She bit into it, the juice sweet and sharp, bursting on her tongue with a clarity that seemed to sharpen her own thoughts. It tasted of soil, of sun, of time. She thought about the universe’s rankings, the carelessness she had once resented. Now, she understood. The universe did not care about rankings. It cared about connections. It cared about the hands that carried the seeds, the minds that fixed the leaks, the hearts that held the promise.", "She looked at Lio, at his closed eyes, at the peaceful line of his mouth. She looked at Pim, at his restless eyebrows, even in sleep. She looked at the trees, at the stars, at the ship that hummed around them, steady and sure. Somewhere ahead, eighty-seven years away, a star was waiting to be a home, and the people who would live there were already being carried toward it, in someone's hands.", "◆ Words to know: reverence – deep respect and care shown in actions; belied – contradicted or gave a false impression of; uncomplicated – simple and free from confusion or complexity; inexorable – impossible to stop or prevent; sustained – maintained or kept going over time"], "img": "img/p125.jpg"}], "chapters": [{"n": 1, "title": "The Third-Best Apple", "part": "PART ONE: THE PROPOSAL", "page": 1}, {"n": 2, "title": "Three Point One", "part": "PART ONE: THE PROPOSAL", "page": 6}, {"n": 3, "title": "Pim's Forty-One Questions", "part": "PART ONE: THE PROPOSAL", "page": 11}, {"n": 4, "title": "The Council Hall", "part": "PART ONE: THE PROPOSAL", "page": 16}, {"n": 5, "title": "Zero-G Library", "part": "PART ONE: THE PROPOSAL", "page": 21}, {"n": 6, "title": "The Ledger", "part": "PART TWO: THE BUDGET", "page": 26}, {"n": 7, "title": "The Heat Equation", "part": "PART TWO: THE BUDGET", "page": 31}, {"n": 8, "title": "A Better Question", "part": "PART TWO: THE BUDGET", "page": 36}, {"n": 9, "title": "The Drone", "part": "PART TWO: THE BUDGET", "page": 41}, {"n": 10, "title": "Chief Voss", "part": "PART TWO: THE BUDGET", "page": 46}, {"n": 11, "title": "The Flight", "part": "PART THREE: THE COLD PANEL", "page": 51}, {"n": 12, "title": "A Plan on a Napkin", "part": "PART THREE: THE COLD PANEL", "page": 56}, {"n": 13, "title": "Directive Nine", "part": "PART THREE: THE COLD PANEL", "page": 61}, {"n": 14, "title": "Landing Day Rehearsal", "part": "PART THREE: THE COLD PANEL", "page": 66}, {"n": 15, "title": "Midpoint: The Pressure", "part": "PART THREE: THE COLD PANEL", "page": 71}, {"n": 16, "title": "The Council Votes", "part": "PART FOUR: THE REPAIR", "page": 76}, {"n": 17, "title": "Lio's Fear", "part": "PART FOUR: THE REPAIR", "page": 81}, {"n": 18, "title": "Dress Rehearsal", "part": "PART FOUR: THE REPAIR", "page": 86}, {"n": 19, "title": "What Brandt Kept", "part": "PART FOUR: THE REPAIR", "page": 91}, {"n": 20, "title": "The Night Before", "part": "PART FOUR: THE REPAIR", "page": 96}, {"n": 21, "title": "The Airlock", "part": "PART FIVE: THE LONG DAY", "page": 101}, {"n": 22, "title": "Forty Minutes", "part": "PART FIVE: THE LONG DAY", "page": 106}, {"n": 23, "title": "The Valve", "part": "PART FIVE: THE LONG DAY", "page": 111}, {"n": 24, "title": "The Whole Ship", "part": "PART FIVE: THE LONG DAY", "page": 116}, {"n": 25, "title": "Landing Day", "part": "PART FIVE: THE LONG DAY", "page": 121}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);

function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
</body>
</html>
