<script>
const D = {"title": "The River Cousins", "sub": "Two Cousins, One Rising River and One Very Long Night", "pages": [{"no": 1, "ch": 1, "ctitle": "Fourteen Floors Down", "part": "PART ONE: TWO WAYS OF KNOWING", "paras": ["*Jun's phone says: 32 degrees, sunny, arrival 2:10. Nari's river says: not yet.*", "On the fourteenth floor of a tall grey building in Seoul, Jun had lived for twelve years without once being asked to carry anything heavier than a backpack, and now his mother was zipping a suitcase the size of a small refrigerator.", "\"Three weeks,\" she said. \"Your grandparents' house. Clean air. Ice-cold watermelon.\"", "\"I have hagwon,\" said Jun. Hagwon was the name for the classes he went to every afternoon after school, and he was good at them.", "\"Hagwon is closed for the summer break,\" said his mother, \"and I checked.\"", "She had checked. That was the trouble with his mother, who checked everything twice and then a third time for luck. Jun pushed his round glasses up his nose and looked around his room for a way out. There was none. The suitcase sat on the floor like a very large, very calm dog."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["He packed his own bag of important things, since nobody could be trusted with it. Charger. Backup charger. Notebook. Vacation homework, in a plastic folder. A jar of his mother's kimchi, which she had wrapped in three plastic bags and told him to hold upright like a baby.", "\"Be nice to your cousin,\" said his father on the phone, from the office where he was going to be until late, as usual. \"Nari is a good kid.\"", "\"I'm always nice,\" said Jun.", "There was a small silence on the line. Jun had the feeling that somebody, somewhere, had almost laughed.", "At the bus terminal his mother pressed a bag of cut pear into his hands, kissed the top of his head and said, \"Call me every night.\" He promised. Then he climbed onto the bus in his brand-new white sneakers, found a window seat, and watched the concrete world slide away."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["For the first hour there were buildings, then smaller buildings, then a factory, then a field. Then, suddenly, there was nothing but green.", "Rice paddies lay in the valleys like bright wet mirrors. Hills stood in rows, each a little paler than the last, and a river shone far below the road. Jun watched all of it out of the corner of his eye, because his real attention was on his phone.", "Four bars. Then three. Then two. He checked the weather, which said sunny, ten percent chance of rain. He checked the map, which said he was doing very well. When the bus went through a long tunnel, he came out the other side with one bar, and a small, cold feeling he did not have a name for.", "He had never been anywhere he could not search for. He held the phone a little tighter, like a railing, and told himself that three weeks was only twenty-one days, which was only five hundred and four hours, which was only a lot."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["The bus dropped him at a rusty shelter on a dusty road in the middle of a hot afternoon. Then it drove away with a wheeze, and the silence it left behind was not silence at all. Cicadas screamed from every tree, so loud that Jun's teeth hummed.", "There were no grandparents. There was no taxi, no station, not even a sign. There was a bench, a road going two ways, and a lot of sky.", "Jun checked his phone. Two-oh-six, it said. Four minutes early, which was exactly how he liked to be. He had a plan for this part: grandparents, hugs, watermelon. He stood very straight, in case someone was watching, and pulled his suitcase upright by the handle. One of its little wheels fell off.", "Then he noticed the wheelbarrow. It sat under a tree, green and dented and splashed with mud, and behind it, half hidden by the shade, stood a girl with a long braid and a straw hat hanging down her back by a string."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["The girl looked at his suitcase. She looked at his sneakers. She looked at the phone in his hand, and then, for rather a long time, at his face.", "\"You're four minutes late,\" she said.", "\"The bus was early,\" said Jun. \"I'm four minutes early. Your clock is wrong.\"", "\"I don't have a clock.\" She squinted at the sky and sniffed the air like a dog. \"You're late. And you brought all that?\"", "Jun opened his mouth to explain about the bus schedule, and the wheel, and the difference between early and late. But the girl had already picked up his suitcase, which he had needed both arms to lift, and dropped it into the wheelbarrow as if it were a bag of feathers.", "\"I'm Nari,\" she said, in the voice of someone who has already made up her mind about you. \"Try to keep up.\"", "Then she set off down the road, pushing his entire suitcase in a wheelbarrow, and did not look back once to see if he was coming."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Wheelbarrow", "part": "PART ONE: TWO WAYS OF KNOWING", "paras": ["*Jun's phone says: 1 bar of signal, 91% battery. Nari's river says: warm and slow.*", "The road to the farmhouse was not a road at all. It was a ribbon of packed dirt that wiggled between the corn stubbles and the sweet potato vines. Jun walked in a straight line, his white sneakers striking the dust with precise, rhythmic taps. Nari rolled the wheelbarrow in a zigzag, dodging every root and stone without looking. She hummed a tune that had no name, a steady, low sound that kept her mouth from opening.", "Jun did the opposite. He opened his mouth. He pointed at the corn. He held up his phone to the sky. He explained the difference between a corn tassel and a silage plant, citing a video he had watched last Tuesday. He was trying very hard to be interesting. He was also getting very hot, and his round glasses had fogged up.", "Nari did not look at him. She looked at the braid over her shoulder. She looked at the mud on the wheelbarrow. She looked at the way Jun kept stepping on the grass, as if he thought the earth would bite him if he looked away. She hummed louder."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["The valley opened up around them, a hundred houses tucked into the green hills like seeds in a pod, while rice paddies stretched out in neat, shiny squares to reflect the bright sky. Corn stalks stood tall and thick, their leaves rustling in a breeze that smelled of wet earth and growing things.", "\"Red peppers,\" Nari said, nodding at a row of plants by the fence. \"They’re turning color early this year.\"", "\"I know,\" Jun said, tapping his screen. \"I saw it on a map. They grow them in this region.\"", "Nari stopped the wheelbarrow. She looked at him, then at the sky, sniffing the air until her nose crinkled slightly as the scent grew heavy with humidity.", "\"Rain by the end of the week,\" she said. It was not a question.", "Jun checked his weather app. The little sun icon grinned back at him. \"The app says ten percent,\" he said. \"Ten percent is almost zero.\"", "Nari snorted, a short, sharp sound like a cat hissing, and pushed the wheelbarrow forward until the wheels crunched over the gravel. \"The app doesn’t smell the air,\" she said. \"It doesn’t listen to the cicadas.\"", "The cicadas were screaming. They were so loud the air seemed to vibrate. Jun looked at his phone, then at the sky, and for the first time, he did not know which one to believe."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["The farmhouse was low, built of wood and stone, with a wide porch that shaded the door. A pump stood by the wall, its handle worn smooth by years of use. In the yard, straw mats lay out in long rows, and on them, hundreds of red peppers were drying in the sun. They looked like a bright red carpet, waiting for someone to step on it.", "Then a door opened.", "\"Aigoo!\"", "The sound came from a small, round figure in a bright floral top and a purple sun visor. Halmoni wiped her hands on her apron and rushed down the porch steps. She was small, so small that Jun felt like he was looking at a doll, but her energy was huge.", "\"Aigoo! My baby! Look at you! Aigoo, you are so thin!\"", "She did not wait for an answer. She grabbed Jun by the shoulders and hugged him. It was a tight, fierce hug, the kind that squeezed the air out of his lungs. His glasses slipped down his nose and fell off, bouncing onto the dusty ground.", "\"I can’t see!\" Jun squeaked.", "Halmoni pulled back, but she did not let go of his arms. She looked at his face, then at his shoes, then at the suitcase in the wheelbarrow. \"Aigoo,\" she said again, but this time, it sounded like worry."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["Inside, the floor was cool, covered in woven mats. Shoes were left at the door. Jun looked down at his white sneakers. A brown line of mud traced the sole, a dirty border around the clean white rubber. He stepped over the threshold, trying not to drag the dirt further in.", "Halmoni was already at the low table. She set out bowls with a clatter. Cold buckwheat noodles in icy broth. Kimchi, bright red and crisp. A bowl of white rice, steaming gently. And in the center, a watermelon the size of a bowling ball, cut into thick red half-moons.", "\"Eat first,\" Halmoni said. \"Talk later.\"", "Jun reached for his phone. He raised it over the table, framing the noodles, the kimchi, the watermelon. He wanted to show his mother how real this was. He wanted to prove that the village was not just a map.", "Nari, who had sat down beside him, rolled her eyes so hard it looked like it hurt. She picked up a chopstick and began to eat, her mouth full, her eyes on the watermelon.", "Jun lowered his phone. The noodles looked good. They really did look good. But the photo in his head did not look as good as the real thing. He took a bite. The broth was cold, the noodles chewy, and the taste was something he did not have a name for."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["The door creaked, and Harabeoji stepped in from the yard. His faded green baseball cap sat low over a face weathered by sun and wind. He wore a striped short-sleeved shirt and tall black rubber boots caked in dark mud.", "He did not look at the food. Nor did he look at Jun.", "Instead, his gaze swept past the boy to Nari, and finally settled on the woven mat between their legs.", "He sat down on the edge of the mat. His posture was rigid. But he did not touch the bowls.", "He simply watched them eat. His eyes were dark and steady.", "The silence stretched. It was filled only by the sharp clink of chopsticks against ceramic and the high, buzzing hum of cicadas outside the window.", "When the last noodle was gone and the bowls lay empty, Harabeoji spoke. His voice was low and dry. It sounded like old leaves skittering across a dusty path.", "\"Rules of the river,\" he said. \"Vests on. Never alone. Stay with the boat.\"", "Nari nodded without looking up. The rhythm of the words was familiar as a heartbeat. She had known them since she could walk, a part of her as natural as breathing.", "Jun reached for his notebook. The pen hovered for a second. Then he began.", "He wrote the words down carefully. Then he underlined them twice. He pressed hard enough to make an indent in the paper.", "It felt important. Like a promise he had not yet made, but was about to."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "Shoes at the Door", "part": "PART ONE: TWO WAYS OF KNOWING", "paras": ["*Jun's phone says: 2 bars at the window, 88%. Nari's river says: the frogs are loud tonight.*", "The room was low. The ceiling was not really a ceiling; it was a roof of dark wooden beams, close enough to touch if Jun stood up. There were no chairs. There was a low table, a wooden chest, and a woven mat that smelled of dried grass and something sweet, like old sugar.", "Jun sat down, because there was nowhere else to go. His knees popped. His white sneakers were already scuffed at the toes. He looked around for a chair, then at Halmoni, who was arranging bowls on the low table with the efficiency of a general placing troops.", "\"Sit,\" she said, pointing to the mat. Jun sat as neatly as he could. His shoes were already lined up by the door, toes pointing in, the way his mother lined them up at home. Harabeoji came in, and Jun scrambled to his feet and bowed. He bowed too far, too fast. His glasses slipped, caught on the edge of the table, and clattered to the floor.", "\"Aigoo!\" Halmoni’s hand was already there, catching the frames before they hit the wood. She pinched his cheek, hard enough to sting. \"So polite. You will break everything.\"", "Jun rubbed his cheek. His phone buzzed in his pocket. He did not look at it."], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["The food arrived in waves, starting with rice mounded high in a white bowl, followed by small dishes that lined up one after another until the table looked like a chaotic mosaic of bright orange peppers, dark green beans, and red paste.", "Jun’s phone sat heavy in his pocket. He could feel its weight, but he could not ask it what to do, because there was no app for \"which small dish is the main course.\" He picked up his chopsticks and looked at Nari, who was already eating with her head down and her braid swinging over one shoulder.", "\"Which one?\" he asked, gesturing vaguely at the sea of food.", "\"Just eat,\" Nari said, without looking up.", "\"I’m working out a method,\" Jun said, tapping the table. \"I need to know the order.\"", "Nari stopped chewing. She looked at him with one eyebrow raised. \"A method is what you do when you are afraid.\"", "\"I am not afraid,\" Jun said, his voice rising slightly. \"I am efficient.\"", "\"You are afraid of anything without a screen,\" Nari said. She picked up a piece of pepper. \"I’m not afraid of anything.\"", "There was a pause, broken only by the buzz of cicadas outside the window.", "\"Except tall buildings,\" Nari added quietly. \"But that’s not fear. That’s common sense.\""], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["Uncle entered, broad and quiet, wearing a straw hat slightly too large for his head and a navy work shirt with dirt on the sleeves. He did not sit. Instead, he stood by the door, looking at the food, then at the two cousins.", "\"Bus or truck,\" Nari said suddenly. She pointed her chopstick at Uncle. \"Which is faster?\"", "Uncle blinked. \"Both are right.\"", "\"That doesn't make sense,\" Jun said. He pulled his phone out. \"The bus is 45 kilometers per hour on average. The truck is 60. But the bus has stops.\"", "\"The truck has mud,\" Nari said. \"I know the road.\"", "Uncle smiled. It was a small, dry smile. He sat down, took a bowl of rice, and ate. He did not answer the question. He just ate, and the silence that followed was heavy and warm.", "Jun looked at Nari. Nari looked at the rice.", "\"He's not choosing,\" Jun whispered. \"That's cheating.\"", "\"He's my father,\" Nari whispered back. \"He's not choosing. He's hungry.\""], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["Night fell on the village in slow, amber waves. It did not snap dark like a light switch. The light turned brown, then grey, then finally gone. The cicadas started up. They were so loud Jun could feel them vibrating in his teeth.", "He sat on a thin mat in a small room next to the kitchen. The floor was cool under his palms. He rubbed his hand on the weave, confused by the chill.", "\"Ondol,\" Halmoni had said earlier, rapping her knuckles on the wood. \"In winter, it is warm. In summer, it is cool. The earth remembers.\"", "Jun pulled out his phone. The screen glowed bright in the dark room. He searched for the word. *Underfloor heating system.*", "That was not very poetic.", "He flipped the phone over. His own face stared back, pale and tired. He held it up to the window. One bar of signal. He typed one word: *Arrived.*", "He hit send. A tiny check mark appeared. Then the screen went black, and the cicadas screamed."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["Through the thin wall, he heard Nari moving. She was not sleeping. She was talking, or maybe thinking out loud. Her voice was low, muffled by the wood.", "\"He’ll last two days,\" she said.", "Jun lay still. His heart beat in his ears. He could hear the river outside, a distant, steady sound, like a breath he couldn’t quite catch.", "He pulled his phone out of his pocket. The screen was black. He did not turn it on. He looked at the ceiling, at the dark beams.", "Two days. That was a number. He could work with a number. He could beat a number. He could be the one who lasted three days, four days, the whole three weeks.", "He put the phone under his pillow. It felt like a stone. He lay awake, listening to the river, waiting for the first mistake to happen."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "The Long River", "part": "PART ONE: TWO WAYS OF KNOWING", "paras": ["*Jun's phone says: 33 degrees, sunny, 85%. Nari's river says: brown-green, easy, low.*", "The path through the corn was green and tight, and Jun’s white sneakers remained spotless, a fact he held onto like a small, bright shield. Nari did not look at them. She walked ahead, her braid swinging, her straw hat bouncing on her back.", "\"Keep up,\" she said, without turning.", "They emerged from the leaves onto a wide bank of pale sand, where the Long River lay ahead, brown-green and slow. It did not rush. It slid, smooth and heavy, carrying the light of the sun in a long, shining sheet. Sandbars rose from the water like the backs of sleeping animals, their edges soft and rounded.", "Jun’s phone showed a map. The map said he was at the river. The river said nothing.", "Nari stopped at the edge. She looked down at the water, squinting, while the air filled with the smell of wet earth and algae.", "\"It’s low,\" she said. \"Today it’s easy.\"", "Jun pushed his glasses up. \"My app says the flow is steady. Moderate current.\"", "Nari looked at him. She looked at the water. She looked at his clean shoes.", "\"Your app,\" she said, \"doesn’t have feet.\""], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["Nari pointed at the surface of the water, which looked like a sheet of dark, glossy plastic that had been smoothed flat by a careless hand.", "\"Brown-green,\" she said, her voice dropping to a serious, instructional tone. \"That means calm. No mud coming down.\" She moved her finger along the air, tracing a line that matched the current. \"See where it slides? Smooth, fast, no ripples? That’s a channel. Deep water.\"", "She pointed to a patch where the surface was broken, the skin of the river wrinkling into small, circular folds.", "\"Wrinkles,\" she said. \"Stones underneath. Shallows.\"", "Jun nodded, feeling like he was supposed to understand this, though his brain felt like a browser with too many tabs open. He opened his notebook, then closed it again. It felt ridiculous to write down things that were just... water.", "\"And if I see sticks?\" he asked. \"Floating sticks?\"", "Nari’s eyes sharpened. \"Rain. Upstream. A lot of rain.\"", "Jun looked at the calm water. It looked like nothing was happening.", "\"How do you know all this?\" he asked. \"Where did you learn it?\"", "Nari shrugged, her shoulders rising and falling in a lazy, unbothered way. She kicked a pebble into the shallows, watching it skip twice before it vanished into the brown-green depth.", "\"I looked,\" she said. \"For eleven years.\""], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["Tied to a rusty iron ring in the mud sat the boat, small and flat-bottomed, painted a faded color that had once been green but was now just the memory of it.", "\"The Pear,\" Nari said.", "Jun walked around the hull, noting how the wood was thick and scarred by oars and sun, until he found two orange life vests tucked into the shadow under the seat, looking bright and new like pieces of fruit left too long in the sun.", "Harabeoji had mentioned the boat, and he had mentioned the rules. \"Vests on,\" he had said, his voice dry as a twig. \"Never alone. And if you are lost, stay with the boat.\"", "Jun felt a spark of delight because in Seoul the rules were apps, full of Terms and Conditions and User Agreements, but here the rule was simple enough to hold in his pocket.", "Nari watched his face, seeing the way his eyes lit up as he found order in the chaos, and she frowned because she did not like that he was happy. She liked the river because it was hard, and she liked that it did not make sense to anyone who had not lived beside it.", "\"You think it’s a game,\" she said.", "\"It’s a rule,\" Jun said. \"A good rule.\"", "\"Rules,\" Nari said, \"don’t float.\""], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["Jun did not argue back. Instead, he pulled his phone from his pouch, where the battery sat at eighty-five percent, and swiped the screen open to show her the sky's view.", "\"Look,\" he said.", "He held the device up. On the glass, the world appeared from above. The river was a thin, dark line winding through the green valley, while the far field held rows of red peppers drying on mats. The sandbar they stood on looked like a long, pale finger pointing downstream.", "Further along that line sat a bridge, and below it, a small, angular shape: a weir.", "Nari leaned in close, her nose almost touching the cool glass. She saw the full length of the sandbar, which she had walked past every day for a decade, but had never seen in its entirety. She watched the river curve around the far hill in a way her eyes had missed.", "She did not move or speak. For a full minute, she just studied the pixels, the satellite truth of the place she knew by heart.", "Jun watched her face change. It was not anger, nor was it boredom. It was a kind of stunned stillness, like a paused game.", "\"Wow,\" he said, softly.", "Nari’s jaw tightened. She did not say wow. She did not say anything at all."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["Nari pulled back, her face settling into that flat, final look she got when a test was over. She looked at the phone, then at the river. The water slid past the stepping stones, brown-green and patient, completely ignoring the glass screen.", "\"That’s not the river,\" she said.", "\"It is,\" said Jun, pushing his glasses up. \"It’s the same river. Just from above.\"", "\"The river’s not a picture,\" Nari said. Her voice was quiet, and it cut through the heat like a cold knife. She turned and walked back toward the corn, her shadow stretching long in the grass.", "Jun looked at the river again. The water moved, smooth and deep, carrying the smell of wet earth and old mud. He looked at his phone. The map was still there, clear and correct, showing the world in neat little boxes.", "He put the phone away. He did not understand why the river felt so heavy, so real, when the map said it was just a line. He did not tell Nari that he was going to look at that picture again tonight. He did not tell her that he was already trying to memorize the shape of the bend, the place where the water would go if it wanted to run away.", "The cicadas screamed. The river slid."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "The Score", "part": "PART ONE: TWO WAYS OF KNOWING", "paras": ["*Jun's phone says: 10% chance of rain. Nari's river says: something is coming.*", "Jun opened his notebook to a fresh page. He drew a line down the middle. On the left, he wrote NARI. On the right, he wrote JUN. He underlined both names in thick blue ink.", "This was necessary. In Seoul, facts were facts. If he dropped a ball on the left side of the line, it went left. If he dropped it on the right, it went right. The world did not argue back. Here, the world seemed to have opinions.", "Nari sat on the porch step, her chin resting on her hands. She watched him draw the line. She did not look impressed. She looked bored, in the specific way that only farm girls who have watched ten hundred seasons can be bored.", "\"What is that?\" she asked.", "\"A scoreboard,\" said Jun. \"To see who is right. It is fair.\"", "Nari rolled her eyes so hard it looked painful. \"I’m always right.\"", "\"Then the score will be very high for you,\" Jun said. He picked up his pen. \"First contest. Go.\"", "Nari snorted. She leaned back on her palms, balancing her weight on the rough wood. \"Fine. But you’re keeping it. If I lose, I’m taking the notebook.\"", "\"You can’t take my notebook,\" Jun said.", "\"Watch me,\" Nari said.", "The air between them tightened, crisp and electric, like the moment before a thunderclap."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["The first contest was the watermelon, a large green sphere sitting on the low table. Jun tapped it with his knuckle, listening for the hollow sound his phone’s ripeness chart said meant ready. It thumped back at him, uncertain and flat.", "Nari tapped it once, a single solid thud that sounded heavy and deep, like a drum being hit inside a closet.", "\"Ripe,\" she said.", "\"Maybe not,\" Jun replied, pulling up the app to check the skin texture, which suggested the color was slightly too dark.", "Halmoni sliced it open. The inside was bright red, juicy, and perfect. They each ate a slice, and the first tick went under Nari’s name.", "Next was the table. It wobbled, shaking a bowl of soy sauce.", "Jun reached for his phone to find a video on leveling furniture, but Nari had already reached into her pocket and pulled out a folded scrap of cloth. She wedged it under the leg, and the table stopped shaking.", "\"Jun,\" Nari said. \"You didn’t even use your hands.\"", "\"I used strategy,\" Jun said. \"And I know which way is north.\"", "Nari squinted at the moss on the tree. \"That’s south.\"", "Jun pointed to the moss. \"It grows on the wet side. In this valley, that’s north.\"", "Nari stared at the moss, then at Jun, then at the moss again. She grunted. The third tick went under Jun’s name."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["By supper, the notebook on the low table showed Nari 3, Jun 2.", "Halmoni sat cross-legged nearby, mending a straw mat with a needle and thick thread. Her small hands moved in a steady rhythm while she listened to the cousins argue about the chickens. Nari had identified the sick hen by its drooping wing; Jun had read about avian flu symptoms on a forum. Nari was right.", "Jun had explained the science of boiling eggs at different temperatures. Nari had eaten hers perfectly soft, without asking a single question. Jun was right.", "Halmoni stopped mending. She looked at the notebook, where the numbers stared up at her, bright and stubborn.", "\"Aigoo,\" she said softly. It was a quiet sound, the kind of sigh that gets saved up for a long time. She did not look happy, nor did she look sad. She looked like she was watching two stray cats try to share one narrow windowsill.", "She turned her head slowly toward the kitchen, where Harabeoji sat drinking barley tea.", "\"These two,\" Halmoni said.", "Harabeoji set down his cup. He looked at Jun, then at Nari, then at the notebook.", "\"They are alike,\" he said. His voice was dry, like old leaves scraping against stone.", "\"We are not,\" Jun said.", "\"We are not,\" Nari said.", "They spoke at the exact same moment, in the same tone, with the same glare.", "Harabeoji took another sip of tea. He did not look surprised."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["The evening air stopped moving. Heat pressed down on the yard, heavy and thick, settling over the grass like a wet wool blanket no one had folded away. The cicadas, which had been screaming since dawn, cut out all at once. The silence was so sudden and loud that Jun’s ears popped.", "Nari stood up. She walked to the edge of the yard, ignoring Jun. She looked up.", "Her face was flat. Her eyes were narrowed against the darkening sky. She sniffed the air, then sniffed it again.", "\"Tomorrow,\" she said.", "Jun looked at his phone. The battery was at eighty percent. The screen showed the sun icon.", "\"Rain,\" Nari said. She pointed at the west. The clouds there were not white. They were purple, swollen, and low, hanging over the hills like a bruise. \"A lot.\"", "Jun pushed his glasses up. \"It’s sunny.\"", "\"It’s going to rain,\" Nari said. She turned her back on him. \"Go inside. Bring the laundry.\"", "Jun watched the sky. It was beautiful. It was terrifying. It was definitely not sunny."], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["Jun refreshed the weather app, then checked the local station, then the satellite view. The screen stayed stubbornly bright, refusing to change its mind.", "Ten percent chance of rain. Sunny.", "He thrust the phone toward Nari. She did not look at the screen. Instead, she watched the sky, where the light was bending down from the clouds in a dusty, yellow haze.", "\"Ten percent,\" she said. \"That means it could happen.\"", "\"It means it probably won't,\" Jun insisted.", "\"Or it could,\" Nari replied.", "Jun looked up. The purple bruise was spreading, and the air already smelled of wet earth, even though the ground was still dry. He opened his notebook and held his pen over the page. He wanted to write a tick under his name. He wanted to be right.", "But he hesitated.", "Nari watched the sky with a seriousness that made his stomach feel tight. The clouds were moving faster now.", "Then a single, fat drop of rain hit the notebook. It splattered on the paper, blurring the ink of the letter N in NARI.", "Jun stared at the blue smudge."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "Ten Percent", "part": "PART TWO: RAIN", "paras": ["*Jun's phone says: sunny, 10% chance of rain. Nari's river says: rising a finger.*", "The first drop hit the tin roof of the shed with a sharp *thwack*. Then another. Then a roar, loud enough to shake the window glass in its frame.", "\"Peppers!\" Halmoni shouted from the yard.", "Jun grabbed the nearest sheet of plastic. It was a tarp, bright blue and slippery. He ran to the drying rack where Uncle’s first red peppers of the year lay out on straw mats. He threw the tarp over them, but because he was holding it upside down and wet with rain, it slid right off one end.", "Nari was there in two strides. She grabbed the corner, while Halmoni grabbed the other.", "\"Aigoo!\" Halmoni yelled, not at Jun, but at the sky.", "Jun tried to hold the tarp down, but it flapped wildly, whipping his face. He fell into a puddle of mud. His white sneakers were now bright brown. He stood up, sputtering, with the blue tarp tangled around his ankles.", "Nari bit her lip. Her eyes were crinkled. She looked away, but her shoulders were shaking. She did not laugh. She would never say she had laughed. But her face was very red, and her braid was swaying.", "The tarp held. The peppers stayed dry."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["The rain hammered on the tin roof with a steady, loud rhythm that made the window glass rattle in its frame. The air smelled of wet earth and frying onions, because Halmoni was already inside, moving fast.", "Jun stood on the porch, dripping. He held out his phone, and the screen glowed bright and defiant against the grey afternoon.", "\"Ten percent,\" he said, though his voice sounded very small in the storm. \"It said ten percent.\"", "Nari looked at the phone. Then she looked at the sky, which had turned the color of old tea.", "\"It’s wrong,\" Jun said, looking stunned, like a boy who had just discovered that the map was not the territory.", "Nari wanted to say something. She wanted to point at the purple bruise in the clouds and tell him she had seen it an hour ago. But she looked at Jun’s face, and he was not angry. He was confused, holding the phone as if it had betrayed him.", "She shrugged, a small, quiet movement.", "\"Maybe the cloud was shy,\" she said.", "Jun blinked. He pushed his glasses up his nose. He did not write a tick next to his name. Instead, he closed his notebook, and the pen made a soft click in the humid air."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["Inside, the kitchen was a warm, golden cave. Halmoni stood over a flat griddle, flipping a round, golden pancake. It hissed and bubbled, filling the room with the sharp, green smell of scallions.", "\"Pajeon,\" she said. \"When it rains, pajeon. The sound matches. It has always been so.\"", "The sizzle in the pan was exactly like the rain on the tin roof outside. It was a conversation between two kinds of water.", "Nari sat on the ondol floor, cross-legged, waiting. Jun sat next to her, still dripping. He reached for his phone to take a picture of the pancake, a golden circle with green flecks. But the smell hit him first. It was warm and savory and real.", "He put the phone down.", "Halmoni cut a triangle and held it out. Jun took it with two hands, because that was the rule, even if he had forgotten it for a second. He took a bite. The crust was crisp, the inside soft. The scallions were fresh.", "It was better than the picture. He ate the whole piece, and then another."], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["The village hall was a square building with a tin roof that rang in the wind. Inside, the air was thick with damp wool and barley tea.", "Uncle stood by the door, arms crossed, his jaw tight. He said little, but his eyes stayed fixed on the front of the room where Harabeoji spoke to the other men.", "\"The levee is old,\" Harabeoji said. His voice was dry, like dry leaves scraping on stone. \"The sluice gate needs checking. The water is coming early. It is coming long.\"", "Nari leaned against the wall, watching her father. He did not look angry. He looked tired, like a man who had seen this rain before, many times, and knew it would not stop.", "Jun stood behind her, his phone tucked away. He did not check the weather. He did not check the map. He just listened to the rain tapping on the windows, a steady, impatient tap-tap-tap.", "The meeting went on for an hour. Nari’s legs ached. Her mouth was dry. But she kept her eyes on her father’s jaw, which never once relaxed."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["That night, the river sounded different.", "It was no longer a gentle murmur. It was a low, heavy growl, a sound that came from deep in the earth. The water was brown, swollen, and angry.", "Nari stood on the porch, barefoot. The wood was cool under her toes. She listened with her mouth open. The river was speaking, and it was not happy.", "Jun came out. He stood beside her, in his muddy sneakers. He did not say the app was wrong. He did not say he was sorry. He just stood there, in the dark, in the rain.", "They did not talk. They did not need to.", "The river swelled, and the two of them listened, side by side, to the sound of the water coming.", "For a while, being wrong did not matter. The river did not care who was right. It only cared that they were there, listening."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "Three Days of Rain", "part": "PART TWO: RAIN", "paras": ["*Jun's phone says: 64% battery, no signal. Nari's river says: brown and fast.*", "Rain fell on the tin roof for three days, not as a drizzle but as a hammer, a drum, a thousand tiny fingers tapping until the whole house vibrated. The air inside smelled of wet earth and frying oil, a thick, warm mix that stuck to the back of Jun's throat.", "Jun sat at the low table, his vacation homework spread out before him, the paper feeling damp under his fingers while his pen moved slowly across the lines. Across the room, Nari sat on the floor mending a net, not looking up as she hummed a tuneless melody before letting out a sharp, rhythmic breath.", "In, out, *huff*. In, out, *huff*. It sounded like a metronome counting down to something bad, a steady tick that matched the drumming of the rain.", "Jun checked his phone, seeing sixty-four percent battery and no signal, then turned the screen off and put the device face down in his crossbody pouch. He rationed it now, like water in a desert, conserving the last bits of power for things that truly mattered. He looked at his notebook, and the score sheet stared back, showing Nari: 3, Jun: 2.", "He pushed his glasses up, watching the water run down the glass, feeling small and dry and very far from a place where he could check if he was doing it right."], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["Harabeoji sat on the porch, listening to the rain with a cup of cold barley tea in his hands. In the shed next to the house, his old radio sat silent. It had died two days ago, and he had not fixed it, having chosen to listen to the water instead.", "Jun walked past the shed and stopped. He looked at the radio, then at Harabeoji, and back at the device again. \"Harabeoji's radio,\" he said to no one. He stepped inside, where the air was cold and smelled of rust. He picked up the radio, which was heavy, and searched the shelf for a small screwdriver. Nari was already there. She did not say hello. She just watched.", "Jun pried the back cover off to find a wire that had come loose, dangling there like a tiny black tail. He took a paper clip from his pocket and bent it, then used a scrap of foil from a candy wrapper. He twisted the wire back to its place, wrapping the foil around the connection tight and neat.", "Nari leaned closer, watching his hands move with a focus she usually reserved for mending nets. She said nothing, but her eyes were wide, tracking every small adjustment he made."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["Jun plugged the radio in and turned the dial. A wash of static hissed, then a voice cut through, clear and calm.", "\"River forecast. Heavy rain upstream. The dam will release water tomorrow night. Level expected to rise.\"", "The static crackled, and the voice was gone.", "Jun stood very still in the shed. He looked at the radio, then toward the open door where Harabeoji sat on the porch, listening to the rain. The old man did not move, but his shoulders, hunched tight for three days, straightened. He turned his head just an inch to look at Jun.", "\"Good,\" he said.", "One word. Dry. Simple.", "Jun’s ears went hot, and his chest felt tight and warm, like a balloon being inflated in a small room. He wanted to say \"Thank you,\" or \"I did it with a paper clip,\" or \"I am not useless.\" But the words stuck in his throat, and he just nodded. Harabeoji turned back to the rain. The radio hummed softly, alive again."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["Nari had been waiting.", "For three days, she had wanted that word, carrying water, feeding chickens, and mending the net with a rhythm that sounded like patience, while Harabeoji saved his praise for the boy with the paper clip.", "She stood up, her knees cracking in protest, and stared at the door.", "\"I am going to the coop,\" she said, her voice flat as a wet pancake.", "\"The rain,\" Jun started.", "\"I know,\" she said.", "She walked out, and the door slammed behind her, the sharp sound cracking the humid air. Jun heard the wet slap of her feet on the porch, then the rush of rain on the path. He did not go after her.", "He went back to the low table, opened his notebook, and picked up his pen. He looked at the score sheet, which said Nari: 3 and Jun: 2. He wrote a small tick under his name, but it did not feel like a win; it felt like a scratch on a clean glass table. He closed the notebook, and the rain kept falling."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["Halmoni found him there, sitting in the silence with the notebook closed on his lap. She did not ask about the radio or the rain. She just stood over him for a moment, her purple sun visor casting a deep shadow across her face.", "Then she reached out and rubbed the top of his head. Her hand was warm and rough, like the inside of a wooden spoon.", "\"She is good at things too,\" Halmoni said, quietly. \"You will see.\"", "It was the first time anyone in the house had told him to look. Not to count, not to check, not to fix. Just to look.", "Jun sat very still. The rain tapped on the tin roof, a steady, hollow sound. Somewhere outside, he could hear the wet splash of Nari’s feet, still going, still working. He pushed his glasses up. He opened his notebook, but he did not write a number.", "He just watched the pen hover over the paper. For the first time in three days, he listened to the sound of the water, and not the sound of his own worry."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "The Color of the Water", "part": "PART TWO: RAIN", "paras": ["*Jun's phone says: 60%, dam release tomorrow night. Nari's river says: brown as tea, sticks and foam.*", "Nari was annoyed at herself for being annoyed. She stood in the doorway, watching Jun struggle with his borrowed rubber boots. They were too short, so the cuffs hung loose around his ankles, flapping every time he stepped.", "\"You're doing it wrong,\" she said. \"You don't pull them up. You step into them.\"", "Jun looked at her, then down at the boots. \"I'm fine.\"", "He was not fine. He looked like a penguin trying on new legs. Nari let out a long, tired sound that ruffled the wet hair escaping her braid. She grabbed the brim of her straw hat and pushed it down.", "\"Come on. The river is talking.\"", "Outside, the air smelled of wet dust and crushed grass. The rain had let up for an hour, leaving the world bright and slick. The Long River was not the gentle, slow green thing it had been three days ago. It was a churning, thick brown. Sticks spun in the current like tops. Foam piled up against the banks, white and angry. A whole tree branch, heavy and leafy, turned slowly in the middle of the stream.", "Nari pointed. \"Look. Brown. Fast. Loud.\"", "Jun squinted. He pushed his glasses up. \"Brown. Fast. Loud,\" he repeated. It sounded like a lesson he was failing to memorize."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["Back on the porch, the dry air felt like a reward. The tin roof dripped a steady rhythm onto the stone path. Jun pulled out his phone, the screen still wet, and opened the map app.", "\"See this?\" he said, tapping the blue line that wound through the green valley. \"The blue line is the river. The little bumps are the bends.\"", "He traced the line with his finger, moving it slowly down the valley. Nari leaned in. She watched his finger, not the screen.", "\"That's the bend by the willows,\" she said.", "Jun stopped. \"How do you know that? The map just says 'river'.\"", "\"That's the Lower Landing,\" Nari said, tapping a small dot further down. \"And that spot right here, where the line gets wider, is the sandbar.\"", "Jun looked at the screen. He looked at her. He had scrolled past that spot a dozen times. He had never seen a sandbar. He had only seen a blue line.", "\"I didn't know it had a name,\" he said.", "Nari shrugged, her shoulders lifting under her yellow shirt. \"It has lots of names. You just have to ask.\""], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["They stood there for a long time, the rain tapping a quiet song on the leaves above them. Jun turned the phone so the map faced them both, then pointed to a sharp turn in the blue line, a place where the river seemed to pinch in before widening out again.", "\"Here,\" he said. \"The map says there's a sharp bend. If the water is high, it pushes hard against the outside of the curve.\"", "Nari nodded slowly. She did not look at the screen. She looked at the river, which was still churning and brown. \"Yes,\" she said. \"And the water goes faster there. I can hear it. It sounds different. Thinner.\"", "Jun frowned and pushed his glasses up. \"The map doesn't say anything about sound.\"", "\"Maps don't have ears,\" Nari said. She did not smile, but the corner of her mouth twitched. \"You know what it does far away. I know what it is doing right now.\"", "Jun looked at the phone. He looked at the river. He closed his eyes for a second, thinking. When he opened them, he didn't argue. He just nodded."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["Uncle stood on the porch, his back to them. He wore a navy raincoat, the hood down, his hands in his pockets. He was looking at the river, but he did not seem to be seeing it. He seemed to be listening to it.", "Auntie moved behind them, her lilac apron tied tight. She was packing a cloth bag. She folded rice rolls into it with quick, precise hands. Boiled eggs, wrapped in paper, went in next. Kimchi, a few pieces of dried tofu. She did not speak. She just packed.", "Nobody said the word that was hanging in the air. They all knew it. It was the word that meant the river would take the field. It was the word that meant the water would rise higher than the top of the porch steps.", "Nari watched her father. She had never seen him stand so still. He was not a man who wasted movement. Every step he took had a purpose. Now, he was just standing there, letting the river look at him.", "Jun felt a cold spot in his stomach. He looked at his phone. Sixty percent battery. The signal was strong. The map showed the river level rising. But looking at Uncle, he realized the map was a picture of yesterday. Today was happening now, and Uncle was the only one who knew how fast it was moving."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["That night, the rain came back. It did not tap. It hammered. The tin roof sounded like a thousand small drums being played by angry hands. The wind pushed against the house, making the windowpanes rattle in their frames.", "Nari lay on her thin mat, eyes open. The cool air of the room felt heavy. She listened to the roof. She listened to the wind. And underneath it all, faint but steady, she heard the river. It was lower than it had been in the afternoon, but it was deeper. It was moving with a slow, powerful rhythm.", "Through the thin wall, she heard Jun. He was awake. She could hear the soft rustle of his mat. The faint scratch of a pen on paper.", "She did not call out to him. He did not call out to her. They were both awake, and they were both listening. The rain filled the space between them, and the river filled the space beyond the rain. Something was changing. The air felt different. The smell of wet earth was stronger. They were waiting for the next sound, the one that would tell them what to do next."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "The Meeting in the Hall", "part": "PART TWO: RAIN", "paras": ["*Jun's phone says: dry for the next three hours. Nari's river says: a pause, then a push.*", "The village hall smelled of wet wool and hot rice. It was a low, wide room with a dirt floor swept clean, and every family in Pine Ford was there. Rain dripped from hoods and hats, pooling on the mats. The air was thick with the sound of voices, a low hum that Jun found hard to hear over.", "He stood near the door, his white sneakers damp at the toe, feeling very small. He knew no one. He knew how to say hello to the baker, the bus driver, the man who fixed phones. He did not know how to say hello to Auntie’s cousin’s neighbor, who was currently arguing about the price of beans with a man Jun had never met.", "Halmoni moved through the crowd like a current. She was given a bowl the size of a basin, filled with rice and stew. She sat on the floor, not at a table, and ate with a speed that made Jun’s stomach growl. He watched the elders. They were served first, always first. A young man brought Halmoni a ladle of soup; she nodded, and he bowed.", "Jun pushed his glasses up. He wanted to check his phone, but his hand stayed in his pocket. There was no signal here. There was only the room, and the noise, and the feeling that he was a fly in a jar of honey."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["\"Stay home,\" said Harabeoji. His voice was quiet, but it cut through the noise.", "The men were already putting on their boots. They spoke of the levee, of sandbags, of the sluice gate at the lower fields. The water was rising, they said. The river was angry.", "Halmoni stood up. Her face was calm, but her eyes were hard. She looked at Jun, then at Nari, who sat beside her, picking at a piece of scallion.", "\"You two,\" Halmoni said. \"The door is shut. You stay inside. You do not go out. You do not go near the water.\"", "Jun nodded. He wanted to say he wasn’t going. He wanted to say the map said it was safe. But he looked at Halmoni’s face and kept his mouth closed.", "Halmoni turned to Nari. \"Eat something. You look thin.\"", "Nari shrugged, but she picked up another piece of food. Halmoni’s hand touched her cheek for a second, a quick, warm brush. Then she turned back to the men, who were leaving one by one into the rain.", "The room felt emptier without them, but it was not quiet. The rain still hammered on the roof. The adults were safe, or so they thought. Jun looked at Nari. She looked at the door."], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["The farmhouse sat in a sudden, ringing stillness. The rain did not fade or taper off; it simply cut out, as sharply as a video game losing its connection. One moment the tin roof was screaming, and the next, there was only the wet drip of water falling from the eaves.", "Jun sat on the wooden porch, knees pulled up to his chest. His phone screen glowed in the dark, the only light in the yard. Battery: 59%. Signal: two bars. The forecast promised dry weather for the next three hours.", "He looked out at the pepper mats, safely covered in the yard. But the far field remained a dark, unguarded shape across the river. The sun had been out this morning, turning the crops red and bright and waiting.", "Nari stood beside him. She sniffed the air, then squinted up at the sky where the clouds were slowly drifting away.", "\"Three hours,\" she said.", "Jun checked his screen again. \"Three hours.\"", "They both stared at the river. The water was brown and high, moving with a slow, deep power that felt less like a stream and more like a sleeping animal. The Pear, tied to the post near the bank, rocked gently in the current.", "A strange, cold pull tugged at Jun’s chest. He looked at Nari. She was not looking at the boat. She was looking at the peppers."], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["\"If we go now,\" Nari said, her voice dropping under the sound of the dripping roof, \"we can cover them. We can get back before the rain returns.\"", "\"We were told to stay,\" Jun said. He pushed his glasses up his nose, and his hand was shaking slightly against the fabric of his shirt.", "\"We were told to keep the peppers,\" Nari said. She turned to him, and her eyes were bright in the dark, catching the faint glow of the phone screen. \"Think, Jun. Uncle's whole year is in those peppers.\"", "Jun opened his mouth to quote the rule, or perhaps to check the app again, but the app said dry and Nari said dry, which meant that for the first time all week, they actually agreed. It felt strange, like stepping into the exact same muddy footprint someone else had left behind.", "\"An hour,\" Nari said. \"Straight across. Straight back. No stopping.\"", "Jun looked at the river, which was wide and deep and moved with the slow, heavy power of a sleeping animal, and it looked like a very big problem, but it was also the only way.", "\"I'll write it down,\" he said, pulling his notebook from his pocket. His hand was steady now, and he uncapped his pen with a click that sounded much too loud in the quiet yard."], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["\"Plan: cross, cover, return. One hour. Vests,\" Jun wrote.", "He looked up to find Nari already moving toward the tin-roofed shed. She returned with two orange life vests that seemed impossibly bright against the darkening yard, almost glowing like emergency exit signs.", "\"Stay with the boat,\" she said softly, repeating Harabeoji’s rule like a quiet prayer.", "Jun pulled his vest over his head. It felt tight across his shoulders, yet somehow it made him feel safer, and also a little foolish, and completely ready at the same time. Nari zipped hers shut and gave him a quick, serious look.", "\"Let's go,\" she said.", "The walk to the riverbank was short, but the air felt heavy and wet, carrying the sharp, earthy scent of mud and recent rain. Jun held his phone in his left hand, while Nari gripped the thick rope tied to the boat's bow with both hands.", "They stood for a moment, not looking back at the house, and not looking up at the sky. They looked only at the water, which was wide and dark and moving with a slow, heavy power.", "And then, together, they stepped into the boat."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "Across the Water", "part": "PART TWO: RAIN", "paras": ["*Jun's phone says: 58%, one bar. Nari's river says: fast in the middle, quiet at the edges.*", "The water was not the same river they had looked at an hour ago. It was darker, broader, and it moved with a heavy, lazy force that made the small wooden hull of the Pear rock gently. Nari sat in the stern, her hands locked around the oars, her knuckles white. She pulled the boat away from the bank with a steady rhythm, dipping the blades into the current and drawing them back.", "Jun sat in the bow, his knees pressed together. He held the flashlight, though he did not turn it on yet. In his other hand, he gripped the edge of the loose tarp. The rain was light, just a mist that smelled of wet earth and cold stone. He expected the far bank to be close. It looked close, just a strip of dark green grass and reeds across the water.", "But the river was wide.", "Nari did not look back. She did not check her phone. She simply watched the water, her eyes narrowed against the dim light. Jun wanted to tell her to be careful. He wanted to tell her that the current looked strong. Instead, he sat very still. He watched her hands. He watched the way the oars cut the water. For once, he did not say a single word."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["The far bank was soft mud, and Jun’s white sneakers sank into it with a squelch that he could feel in his teeth. The field was a sea of green stalks, and in the middle of it, the pepper plants stood in neat rows. The tarp was only half over them. Half of the red peppers were safe under the plastic. The other half were exposed to the rain, their bright skins glistening with water droplets.", "They did not talk about who would do what. They just started.", "Nari grabbed the heavy plastic sheet and pulled. Jun ran to the opposite side and grabbed it too. The tarp was slick and heavy. They pulled it taut, stretching it over the top of the pepper plants. Nari dropped to her knees in the mud, her dark green trousers instantly soaked to the knee. She began to look for stones.", "Jun found a rock, then two. He placed them on the corner of the tarp. Nari followed. They worked in a blur of motion, shaking off rain, pulling plastic, weighing stones. It was faster than either of them expected. When the last corner was anchored, the peppers were safe, hidden under a shield of grey plastic. They stood up, breathing hard, and looked at each other. Neither smiled. Neither spoke."], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["The rain had stopped, but the air still felt thick and heavy. The Pear drifted a little away from the bank, bobbing in the gentle current. They had to tie it up. Nari took the thick rope from the bow and walked to the wooden post at the water's edge. She began to wrap the rope around the post, her movements quick and sure.", "\"Let me do it,\" Jun said.", "Nari did not stop. \"You don't know how.\"", "\"I saw a video,\" Jun said, pushing his glasses up his nose. \"It's a bowline. It's stronger than a hitch. It won't slip.\"", "Nari tied the knot she knew, the one Harabeoji had taught her a thousand times. It was a simple, tight wrap. Jun stepped forward and tried to take the rope from her hands. Nari pulled back. The rope stood between them, taut and waiting.", "\"Your grandfather does it this way,\" Jun said, trying to sound reasonable.", "\"Your internet does it that way,\" Nari said. \"It's a boat, not a car. You need a knot that holds when it's wet.\"", "\"You need a knot that holds when it's fast,\" Jun countered. \"We're going to be stuck out here if it slips.\"", "Nari looked at him. She looked at the rope. She looked at the water, which was moving faster than it had an hour ago."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["Nari let go of the rope. Jun took it. He began to tie the bowline, his fingers clumsy in the cold air. Nari watched him. She saw a mistake, a loop that was too loose. She reached out and adjusted it. Jun frowned. He tried to pull the loop tight, but Nari was already tying the second part of her hitch over his knot.", "It was a mess. It looked like a pretzel that had been left in the rain. It was part bowline and part hitch, a tangled knot that belonged to neither of them. It was not beautiful. It was not efficient. But it was thick, and it was tight, and it was holding.", "Jun stepped back. \"It's fine,\" he said.", "Nari wiped her hands on her trousers. \"It's fine,\" she agreed.", "They both looked at the knot. It squatted at the base of the post, looking slightly offended. Neither of them said it was strong. Neither of them said it was weak. They just looked at the boat, which was now securely tied, and the dark water that lapped at the hull. The rain had started again, a soft, steady drizzle that turned the air into a cool mist."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["The last corner of the tarp remained loose, slapping wet against the pepper plants. Jun grabbed one edge of the plastic while Nari took the other, and they hauled it tight together. They pressed down on the final stone, anchoring the sheet.", "Then the wind changed.", "It no longer blew from the north or the south. Instead, it rushed down from upstream, carrying a chill that smelled of deep water and mud. Nari stopped pulling. She stood very still, sniffing the air and squinting up the valley where the hills disappeared into the dark sky.", "A sound came down the river. It was not a crash or a roar. It was a long, low hush, rolling over the water, the field, and the two of them.", "Nari turned to Jun. Her face was pale in the dim light.", "\"Jun,\" she said. \"Look at the river.\""], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "Loose", "part": "PART THREE: THE RIVER", "paras": ["*Jun's phone says: 55%, no signal. Nari's river says: rising, fast, now.*", "The low hush turned into a roar. The noise was not steady; it tore across the valley like a zipper ripping down the front of a heavy winter jacket. At the base of the bank, the water lifted. It did not creep. It climbed. Brown, thick, and fast, the current surged up the muddy slope, swallowing the grass, the small stones, and the roots of the willow tree.", "Jun watched the level rise. It moved faster than his eyes could track. The rope tied to the wooden post began to vibrate. It hummed, a tight, dangerous note, like a violin string tuned too high. The boat, the Pear, pulled against the knot. The strange half-hitch, half-loop they had made in their hurry began to slide. The wood of the post ground against the wet earth.", "Nari did not look at the water. She looked at the rope. Her face was tight, her jaw set. She knew the sound of a knot that was not meant to hold. She knew how water does not ask permission. The air smelled of mud and deep, cold earth. The boat groaned. The rope squeaked.", "Jun looked at his phone. No signal. The screen was just a black mirror, reflecting the dark sky. He looked at the water. It was coming for them."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["\"Run,\" Nari said.", "They did not run; they slid, the ground slick and treacherous under their shoes. Nari reached the boat first, her fingers digging into the wet rope with a grip that refused to let go. Jun scrambled to the stern, grabbing her wrist in an instinct faster than thought or pride.", "The knot gave way. It did not break, but slipped with a small, dry sound, like a cough in a quiet room, and the tension vanished in a heartbeat. The Pear swung out into the current, the wooden hull groaning against the force of the water.", "Nari was half aboard, one foot on the gunwale, the other churning in the brown river. Jun was in the water to his knees, the cold biting through his shorts. He held the stern with both hands, knuckles white, as the boat began to spin.", "\"Nari!\" Jun shouted.", "She did not look down. She looked at the water, then reached out, grabbed the orange strap of his life vest, and hauled. She pulled with a strength that surprised them both. Jun scrambled up, his sneakers slipping on the wet wood, and landed on his hands and knees in the middle of the boat.", "The rope lay in the water, trailing away into the dark."], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["The boat spun out into the middle of the river. The current took hold of the Pear and did not let go. The water hit the side of the boat with a heavy slap, then another, then a steady, rushing push. The Pear tilted, correcting itself, and then straightened, pointing downstream.", "Jun looked at the rowlocks. One oar was still wedged in its socket, sticking up like an antenna. The other was gone. He saw it for a second, a pale sliver of wood floating away in the white foam, looking very small and very far away. Then it was gone.", "He turned to look back at the far bank. It was already shrinking. The green field with the red peppers, the tarp they had just secured, the path they had walked. It was sliding away, getting smaller, getting darker. The trees blurred together. The sky above it darkened.", "Nari sat in the center of the boat, her hands on the gunwale. She did not reach for an oar. There was no oar to reach for. She watched the water, her eyes tracking the flow, the color, the speed. Her braid hung over her shoulder, swaying with the motion of the boat.", "Jun pushed his glasses up his nose. His hands were on the wet wood. The boat was moving. They were moving. The far bank was gone."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["Neither of them spoke. The silence was full of water hitting wood. *Slap. Slap. Slap.* It became a rhythm, then a heartbeat.", "Jun’s hands shook on the gunwale, pale fingers curling tight against the wet grain. The air had shifted. It was no longer the heavy warmth of the afternoon but something cool, smelling of wet leaves and deep earth. He was more afraid than he expected, his chest feeling tight as if a band were wrapped around it.", "He looked at Nari. She watched the water, her face still and ready. Not afraid.", "\"This is my fault,\" Jun said. His voice was small, swallowed by the river. \"It was my knot.\"", "Nari did not look at him. She watched the current.", "\"It was mine,\" she said.", "\"It was ours,\" said a small voice in Jun’s head. It sounded a lot like Halmoni, or the clatter of a pot being lifted off a stove. It was a voice that knew things.", "Jun closed his eyes for a second. He breathed in the cool air, then out. The shaking in his hands slowed down. He opened his eyes, looking at the water, then at Nari. He was still afraid, but he was not alone in it."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["The dark did not fall; it poured. The sky shed its last deep blue, fading into a heavy grey that quickly turned black. No stars appeared. The clouds hung so low and thick that they seemed to press down on the valley, like a blanket pulled over a sleeping child.", "The shore blurred into a long black line. The trees became mere shadows, and the hills lost their edges. The world had shrunk to the size of the boat. The Pear drifted with the current, not fighting the water but moving with it, gentle and steady. The cousins sat very close in the middle. Their shoulders touched. The orange life vests made them look like two bright, strange fruits floating in the dark.", "Jun looked at his phone. The screen stayed dark. He did not turn it on. He could feel the boat shifting beneath him. He could feel the water rushing past the hull. He could feel Nari breathing beside him, a small, steady rhythm.", "The river was loud. The night was deep. Yet in the center of the Pear, in the middle of the current, there was a strange quiet. It was safe. For now, it was enough."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "Stay With the Boat", "part": "PART THREE: THE RIVER", "paras": ["*Jun's phone says: 48%, one bar, blinking. Nari's river says: wide and fast; no bottom to stand on.*", "Nari’s mind felt sharp, like a knife she had just sharpened on a stone. The darkness outside was heavy, but inside the boat, her thoughts were bright and organized. She did not look at the black water. She looked at them.", "\"Vests,\" she said. Her voice was low, almost a whisper, but it carried weight. She checked her own orange strap, then reached over and pulled Jun’s tight. It was buckled. Good.", "She swept her hand across the space between them. One oar, leaning against the gunwale. No bailer. Just the wooden hull and the sloshing sound of the current. One small flashlight, dim but working. One phone, dark and silent. And Halmoni’s cloth bundle, tied with a thick string, resting on the seat between their knees.", "Nari listed them again, softer this time. \"Vests, oar, light, phone, rice.\"", "It was a small inventory. It was also everything they had. By naming it, the terrifying emptiness of the night seemed to shrink, becoming a manageable list of things they could hold."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["\"The bank is right there,\" Jun said. He pointed to the shadowy line of trees on the left. \"See? It’s not far. We can swim to it. The current is pushing us, but we can fight it.\"", "Nari looked at him, then at the black water. \"No.\"", "\"But the map...\"", "\"The map doesn’t tell you how fast the water is,\" Nari cut in. She leaned forward, her elbows on her knees. \"The river in the middle is fast and deep. The bank looks close because the trees are tall, but the water is wide. And if we get out, we are small. The boat is big.\"", "Jun opened his mouth, but Nari kept talking, her voice steady in the dark. \"Harabeoji’s rule. Stay with the boat. People look for boats, Jun. They don’t look for boys in the water.\"", "The silence that followed was loud. Jun stared at the black water, listening to the rush of it against the hull. He wanted to argue. He wanted to point out that his phone had a compass. But the water sounded hungry."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["\"Your rule is just tradition,\" Jun whispered fiercely. \"My map says the bank is forty meters away. That is not swimming distance. That is a short walk.\"", "\"Forty meters of fast water is a long way,\" Nari said. \"The map shows lines. It doesn’t show the current.\"", "Jun frowned, pushing his glasses up. \"It shows the distance.\"", "\"It doesn’t show the speed.\" Nari looked at him, and for the first time, Jun did not have a counter-argument. He looked down into the water. A stick, dark and long, raced past the bow. Then another. Then a whole bush, tangled and green, slid by in a blur.", "The water was not moving. It was running.", "Jun looked back at Nari. She was watching the water, her eyes wide and bright in the dark. She knew. He could see it in her face. The map was right about the distance. Nari was right about everything else. The fear in his chest twisted, but it was a different kind of fear now. It was the fear of being wrong."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["\"Okay,\" Jun said. The word felt heavy in his mouth, like swallowing a stone. \"We stay.\"", "Nari relaxed, her shoulders dropping slightly. She waited for him to ask what to do, but he did not. Instead, he looked at the oar, then at the flashlight, then at her.", "\"I want to do something useful,\" he said.", "Nari blinked. She had never asked a city boy for anything in her life. She had never expected one to offer. She looked at the oar in her hands, then at Jun, who was sitting very straight, waiting for an order.", "\"Fine,\" she said, and her voice was softer than before. \"You hold the flashlight. You read the map. I will steer.\"", "It was a job. It was a real job, and for the first time since the rope slipped, Jun felt the knot in his stomach loosen. He had a part in this. He was not just a passenger."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["Jun clicked the flashlight on.", "A small yellow circle of light cut through the darkness. It landed on the water, and suddenly the river looked very black, very fast, and very big. The light trembled in his hand. He adjusted his grip, steadying the beam on the churning surface.", "He could see the water moving in lines, dark and rushing. He could see the hull of the boat cutting through it. He had a job. He had to watch for the bends. He had to read the map when the light allowed.", "The fear was still there, cold and quiet in the back of his throat. But it was smaller now. It sat beside him, not on top of him. Jun looked at the water, then at Nari, who was watching the current with her eyes. He breathed in. He breathed out. He was not alone in the boat."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "The Bend", "part": "PART THREE: THE RIVER", "paras": ["*Jun's phone says: 41%, a sandbar 1.2 km ahead on the left. Nari's river says: the tongue swings left after the bend.*", "Jun held the phone with both hands, shielding the screen from the wet mist. The battery read 41%. He dimmed the brightness until the map glowed a soft, pale green. It was a sacred text, this tiny glowing rectangle, and he read it with the intensity of a monk deciphering an ancient scroll.", "\"Right,\" he whispered, tracing the line with his finger. \"Bend to the right. Then... a long sandbar on the left. And then a bridge.\"", "Nari was leaning out over the side, her braid whipping behind her. She pulled her head back, squinting into the dark. \"Where's the tongue?\"", "Jun blinked. \"What tongue?\"", "\"The smooth part,\" she said, pointing at the water. \"That’s the channel. The rest is teeth.\"", "The boat rocked. The water slammed against the hull with a wet, heavy thud, over and over, like a giant fist pounding a table. Jun looked at the map, then at the black water. He did not know what a tongue was. But he knew exactly where the left was."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["Nari took the single remaining oar. She did not pull it through the water like a normal person. She held it out to the side, her whole body leaning into the pressure, her palms flat against the wood. She felt the current with her fingers, the way a pilot feels the wind on a control yoke.", "\"It’ll push us right,\" she said, her voice calm and low. \"Then it swings left. If we let it, we land on the sandbar.\"", "Jun looked at the map. The line curved right, then swept long and straight to the left.", "\"The map says the same,\" he said.", "They looked at each other in the narrow beam of the flashlight. The yellow light caught the rain on their faces. For a second, neither of them moved. It was a strange feeling, like finding a secret door in a house you thought you knew completely."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["They did not argue, and they did not score it. They just did it. Nari angled the oar, letting the current take the bow, while the boat groaned a long, wooden complaint as it began to slide off the fast water. Jun watched the map, his finger tracking the blue line through the dark.", "\"Right now,\" he said. \"Left. Hold it.\"", "Nari dug the oar in, and the boat turned, smooth and obedient. They were drifting now, the roar of the main channel fading behind them, replaced by a softer, rushing sound. The water under them changed, growing shallower and lighter in color.", "*Scrape.*", "Something ground under the bottom, sending a long, shuddering friction up through the seat and into Jun’s spine. The momentum died. The boat stopped, hanging in the dark, trembling like a leaf in a stiff breeze."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["\"Out!\" Nari said.", "The water at their feet was ankle-deep, cold and clear. Jun slid over the side, his white sneakers instantly brown with mud. He waded to the hull and grabbed the gunwale. Nari was already there, her strong arms bracing the side.", "\"Push!\" she shouted.", "They pushed. The boat was heavy, soaked and stubborn. It scraped across the sand with a gritty hiss. They pushed, and pushed, and it inched forward. Their arms burned. Their legs shook.", "Then, suddenly, it was on the dry part. They stood there, dripping, out of breath, staring at the Pear.", "\"We did it,\" Jun said, his voice shaking.", "Nari looked at him, and then she laughed. It was a short, sharp laugh, breathless and bright. \"We did it,\" she repeated, and laughed again, because it was the only thing to do."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["They could not leave it loose. The water was still rushing past, and the sandbar was narrow, so if the current caught the bow, the boat would be gone. Nari pulled a thick rope from under the seat and tied a hitch around a willow root, her hands moving fast and sure.", "\"It needs a loop,\" Jun said. \"If the water rises, the hitch slips. A loop holds.\"", "Nari frowned. \"The loop drags.\"", "They tried it his way. The rope slipped. They tried it her way. The root shifted. They looked at each other, rain plastering their hair to their foreheads.", "Jun made the loop. Nari tightened the hitch inside it. They pulled together, hard, until their knuckles turned white. The rope held. The boat did not move. It held better than either alone."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "Night on the Sandbar", "part": "PART THREE: THE RIVER", "paras": ["*Jun's phone says: 34%, one bar, message sending. Nari's river says: still fast, but our side is quiet.*", "The rain stopped, leaving the air thick and heavy with the smell of wet earth. The Long River roared low and steady, a sound like a large engine idling in the dark. Above them, the clouds tore apart to reveal a sky that was washed clean and terrifyingly bright.", "Jun stared up. In Seoul, he had counted the stars once, on a clear night, and found only three. Here, there were thousands. They sparkled in the black void, cold and distant.", "\"I have never seen that many,\" Jun whispered. He pushed his glasses up, though the lenses were clear. \"I could count them.\"", "Nari laughed, a dry, short sound. \"You would run out of fingers.\"", "\"I have a calculator app,\" Jun said.", "\"Your phone is dark, Jun.\"", "\"It is not dead. It is resting.\" He looked at the screen, then back at the sky. \"One, two, three... ten... forty. Where did the rest go?\"", "Nari pointed a finger at the water. \"They are down there. Reflecting. Do not count them. Just look.\"", "Jun looked. For the first time in twelve years, he did not check the time, the temperature, or the battery percentage. He just watched the light bounce off the brown-green water, and the silence felt less like an absence and more like a room they were sharing."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["Nari reached under the seat and pulled out a cloth bundle. It smelled of sesame oil and salt. She unfolded the cloth on the overturned hull of the Pear. Inside were two rice rolls, tightly wrapped, a boiled corn cob for each of them, a small bottle of barley tea, and a handful of pickled radish slices.", "\"Eat,\" Nari said. She did not offer the food. She simply placed a corn cob in Jun’s hand and broke the other one in half.", "Jun took a bite. The corn was sweet and still warm from the day's heat. The rice roll was chewy, packed with spinach and egg. It tasted better than the convenience store sandwiches he usual
