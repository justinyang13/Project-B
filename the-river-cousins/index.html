ly ate at his desk.", "\"This is good,\" he admitted.", "\"It is better when you are scared,\" Nari said, chewing slowly. \"And when someone else is eating it too.\"", "They leaned against each other, their shoulders touching. Neither of them moved away. The river roared past their feet, and the cold seeped up through the soles of their shoes, but the warmth between them was solid and quiet. Jun took a drink of the barley tea. It was cold and clear. He realized he had not thought about his phone for a full minute. That was a record."], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["Jun picked at the pickled radish, trying to find something to say that did not feel too heavy. The silence was getting loud again.", "\"In Seoul,\" he said, his voice flat, \"I go to hagwon seven classes a week. Math. Science. English. It is until eleven. Every day.\"", "Nari stopped chewing. She looked at him, her eyes wide in the starlight.", "\"My parents are there late,\" Jun continued. \"The apartment is quiet. It is on the fourteenth floor. I can see the whole city. But nobody is home to see it with me.\" He shrugged, a small, jerky motion. \"I am good at hagwon. I get high marks. But I do not know what else I am good at.\"", "He said it as if reading a weather report. *Low chance of joy. High chance of silence.*", "Nari did not say \"That is sad.\" She did not say \"You should be with your family.\" She just handed him the bottle of tea again.", "\"I would hate that,\" she said finally.", "\"I know,\" Jun said. \"It is not that I hate it. It is just that I am good at it, and I do not know what I would be if I stopped.\""], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["Nari was quiet for a long time. She pulled her knees up to her chest, her braid falling over one shoulder. The wind shifted, and the willow branches brushed the water with a soft whisper.", "\"I want to see Seoul,\" she said. The words came out fast, as if she were confessing to a crime. \"The tall buildings. The subway. The trains that go under the ground.\"", "Jun waited for her to make a joke of it. He waited for the sneer, the \"I am not a city person\" line. It did not come.", "\"I will take you,\" he said.", "Nari snorted. \"You will get lost. You cannot even find the bus stop without a map.\"", "\"I never get lost. I just take the scenic route.\"", "They both started laughing. It was a sudden, sharp sound that echoed off the water. Nari’s laugh was loud and full; Jun’s was quieter but just as real. They laughed until their sides hurt and their eyes stung, until the fear of the river and the dark felt smaller, and the distance between the farm and the city felt like something they could cross together."], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["The laughter faded, leaving them breathless and warm, the kind of tired that comes after running a long race. Jun pulled his phone from his pouch, and the screen glowed like a small blue square in the darkness.", "\"Signal,\" he said, pointing at the top corner. \"One bar.\"", "Nari leaned in, her face half-lit by the light. \"Is it enough?\"", "\"Maybe.\" His thumb hovered over the glass, trembling slightly. He picked Uncle, because Uncle was closest, and added Eomma. He did not know what to say. *We are lost* was too scary, but *We are fine* was not the whole truth.", "He typed carefully, his thumbs clumsy in the dark: *We are on a sandbar. Both fine. Boat is fine. Vests on. We stayed with the boat.*", "He hit send. The little circle spun. And spun. And spun.", "\"Sending,\" the screen said, patient as a teacher waiting for a student to finish a sentence.", "The battery icon blinked: 30 percent.", "They sat in the glow of the screen, watching the circle turn, waiting for the world to answer while the river roared on, indifferent and vast, carrying them both toward the unknown morning."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "The Water Comes Up", "part": "PART THREE: THE RIVER", "paras": ["*Jun's phone says: 12%, message not delivered. Nari's river says: the sandbar is getting smaller.*", "Jun woke up because his sneaker was floating.", "He blinked. The sandbar, which had been a wide, dry island the night before, was now a narrow strip of wet gravel, barely wider than the boat. The Long River had swallowed the rest. The water was brown and angry, churning against the hull with a sound like a deep, continuous groan.", "Rain tapped on the seats of the boat. It was a cold, grey dawn, the kind that felt less like morning and more like the world had forgotten to turn the lights on. Jun pushed his glasses up his nose. They were fogged. He wiped them on his shirt, leaving a grey smudge on the white fabric.", "He looked at Nari. She was still sitting where she had fallen asleep, her back against the wooden seat, eyes closed. But her hands were moving, tracing the edge of the floorboard, checking something.", "\"Jun,\" she said. Her voice was rough, like gravel in a cup. \"The water is touching the bottom rail.\"", "Jun looked down. The brown surface was inches from the lowest part of the boat. If it rose another foot, they would be in the water. If they were in the water, the vest was all that stood between them and the current.", "\"Aigoo,\" he whispered, though no Halmoni was there to hear it."], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["Nari was already on her feet. She stood on the edge of the boat, her white rubber shoes slipping slightly on the wet wood, and looked at the river with her whole body. She sniffed the air, then squinted at the grey sky, her face a map of sudden, sharp decision.", "\"It's rising a finger every ten minutes,\" she said. She pointed to the water line on the hull, a dark stain from the night before. The new water was far above it. \"We have an hour. Maybe less.\"", "Jun stared at the empty space where their second oar had been. \"With one oar?\" he said. \"We lost the other one. We have almost nothing.\"", "Nari turned to him. Her eyes were hard and bright. \"We have whatever we've got.\"", "\"We have a flat-bottomed boat with a loose floorboard and a phone with no signal.\"", "\"Then we row,\" she said, as if that solved everything. \"We have to go. The current is pushing us toward the deep channel. If we stay, we go under.\"", "Jun looked at the brown water. It was moving faster than it had been an hour ago. He thought of the sandbar shrinking, the rain falling, the cold seeping into his socks. He pushed his glasses up again.", "\"Okay,\" he said. \"But we need a plan. One oar only turns us in circles. We need a second paddle.\""], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["Jun knelt in the center of the boat, his knees pressing against the wooden planks where the loose floorboard slid back and forth with a dry scrape. It was a single, long piece of wood, wider at one end and tapered at the other, clearly part of the seat or perhaps a panel from the side. He pulled it up, feeling its solid weight and the smoothness worn by years of use as he turned it over in his hands.", "\"That's a paddle,\" he said.", "Nari leaned over the side, watching the water ripple. \"It's a floor,\" she said. \"It belongs here.\"", "\"It's both,\" said Jun. \"It's a floor when it's down. It's a paddle when it's up.\"", "He set it down in the middle of the boat, the wood clacking against the hull. \"I have never been so happy to be wrong about a floor,\" he added, running his hand along the smooth edge that felt like a spoon handle. \"It fits the shape of the boat. It's the right size.\"", "Nari looked at him. She looked at the plank. She looked at the water.", "\"Try it,\" she said."], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["Nari took the plank and swung it in a heavy, clumsy arc that looked more like a shovel than a paddle. She tried to push it into the water, but the wood skidded across the surface, buying them no speed and only a lot of sideways drift.", "\"Like a spoon,\" Jun said, reaching over to adjust her grip. \"Angle it. Don't push. Cut.\"", "Nari frowned, the muscle in her jaw tightening. \"It's heavy.\"", "\"Then use your legs,\" Jun said. \"Lean into it.\"", "Nari tried again, leaning her weight forward with arms straight and pushing the plank into the current. The water resisted, and for a second the boat moved away from the sandbar before stopping dead.", "\"Against the current,\" Nari said, shaking her head. \"You can't fight it.\"", "She took the plank back, turning it so the wide end faced down. Instead of pushing, she let the current take the edge, then pulled back, using the water's own force to slide the boat forward. It was smooth. It was fast.", "\"Like that,\" she said.", "They took turns. Four tries. On the fourth, the boat was moving, steady and strong, cutting through the brown water. Both of them were wet to the elbows, their sleeves dark with river water. They were breathing hard, smiling without knowing it."], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["One thing was left to do. The rope still ran from the bow to the willow root, tied in the knot they had made together the night before. It belonged to neither of them, yet it had held all night.", "Jun gripped the loose end while Nari held the loop tight.", "\"Ready?\" he asked, his voice shaky.", "\"Ready,\" she said, her eyes fixed on the water.", "He gave a sharp jerk. The knot did not slip. It did not snag. With a single, clean motion, it came apart, and the rope slid free. Jun coiled it fast and stowed it in the bow.", "\"Best knot ever,\" Jun said, though he was out of breath and his cheeks felt hot.", "Nari looked at the empty line, then at the wide, grey river ahead of them. \"It was both,\" she said.", "She pushed the boat off the sandbar. The wooden hull scraped against the gravel, making a rough, gritty sound that vibrated up through their shoes. Then they were fully in the current, the grey morning stretching out before them. Jun glanced at his phone one last time; the battery icon read twelve percent.", "They paddled into the dark water, two small shapes against the vast, moving river."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "One More Bend", "part": "PART FOUR: HOME", "paras": ["*Jun's phone says: 9%, old weir 800 m ahead. Nari's river says: the water is smoothing, then dropping.*", "Dawn broke pale and pearl-colored over the water. The heavy rain had softened into a drizzle, misting the far hills until they looked dim and enormous, like giant shadows behind a curtain. Nari paddled with long, steady strokes, her arms burning. The current pushed the Pear forward, but the water felt strange. It was smooth under the bow, yet wrinkled and choppy far ahead.", "\"Something's coming,\" she said, her voice tight.", "Jun hunched over his phone, the screen glowing faintly in the grey light. He traced the blue line of the river with his thumb. The map showed a jagged shape where the water widened.", "\"It's an old weir,\" he said. \"A low stone wall across the river. There's a drop.\"", "Nari stopped paddling for a second. The boat drifted sideways. She squinted at the water, watching the ripples.", "\"Stone walls are hard,\" she said. \"They don't bend.\"", "Jun swallowed. His throat felt dry. \"How hard is it to go over?\"", "Nari did not answer. She looked at the dark water ahead, where the current seemed to be gathering its strength."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["Then the sound came. Not a splash or a crash, but a steady roar, deep and constant, with the hiss of white water at the bottom of it. It sounded like a washing machine spinning its final cycle, except the drum was the size of a swimming pool.", "Nari’s arms began to shake. She knew what a weir could do. Every child in the valley knew. The water would grab the boat and pull it down into the stone teeth, or spin it until the hull cracked.", "\"I can't steer against this for long,\" she said. Her voice was thin, barely loud enough to be heard over the growing noise.", "Jun looked at her. He wanted to say something about the safety manual on his phone, or the engineering specs of the weir. But the fear in her eyes was so plain that the words died in his mouth.", "He did not say a word about tradition. He did not say a word about being right. He just looked at the water, waiting for her lead."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["Jun studied the satellite image in the failing light of the phone. The battery icon blinked red. He tilted the device, trying to match the dark shapes on the screen with the real world. There, on the far left, a narrow line broke off from the main flow. It was a side channel, a gap in the weir wall where the water went through quiet, smooth, and dark.", "\"There,\" he said, pointing a trembling finger at the screen. \"Left.\"", "Nari did not look at the phone. She looked at the river. She saw it too: a smooth tongue of water, distinct from the roaring chaos, leading into the shadows of the bank.", "\"That's the tongue,\" she said.", "She grabbed the oar with both hands. Her knuckles were white.", "\"Left,\" she repeated."], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["They paddled hard. Both on the left side. Both leaning their bodies against the current, fighting for every inch of space. The boat groaned under the strain, the wood creaking like an old chair.", "\"Harder!\" Nari shouted.", "The roar was right beside them now, a wall of white foam and thunder. Jun’s ears rang with the noise, so loud it felt like a static charge. He saw the gap, the dark mouth of the channel, and he rowed until his lungs burned.", "The bow hit the edge of the stone wall with a bump. The boat swung wildly, sliding across the wet rock. For one second, they were stuck, suspended between the roaring drop and the quiet channel.", "Then the stern followed. The boat slid into the dark water, and the roar went past on the right, a deafening rush of white noise.", "Silence returned. The water was smooth."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["Behind them, the weir boomed, a distant thunder that seemed to fade into the hills. Ahead, the river opened up into a wide, slow reach. The water was calm, reflecting the grey sky.", "A small concrete pier jutted out into the stream. At the end of it stood a stooped shape, wearing a wide-brimmed hat, holding a long fishing rod that dipped low into the water.", "\"Landing,\" Nari said. Her voice was shaky, but steady.", "Jun looked at his phone one last time. The battery icon read eight percent. He felt a strange lightness in his chest, a relief so strong it made him dizzy.", "The screen flickered. And then it went dark.", "Jun looked at Nari. She was looking at the pier, and then she looked at him. She smiled, a small, tired smile.", "\"Good,\" she said. \"It lasted long enough.\""], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "The Lower Landing", "part": "PART FOUR: HOME", "paras": ["*Jun's phone says: 0%, screen dark. Nari's river says: calm; someone is waiting.*", "The man was not fishing. He sat on the wet concrete with his legs crossed, holding a long rod that dipped low into the water. He wore a wide-brimmed hat and a vest with so many pockets it looked like a beehive. When the pear-green boat bumped gently against the pier, he did not jump. He simply turned his head, slowly, tracking the light.", "\"Good morning,\" said Jun. His voice sounded thin in the quiet air.", "The man looked at the two orange life vests. He looked at the muddy white sneakers. He looked at the wooden plank that had served as a paddle. Then he looked at their faces, which were pale and tired and still holding on to each other.", "\"Aigoo,\" he said. It was not a shout. It was a soft, heavy sound, like a bag of grain being set down carefully on a table.", "\"Are you lost?\" the man asked. His voice was dry and cheerful, completely out of place with the grey sky.", "\"We are found,\" said Nari. She was still gripping the gunwale. Her knuckles were white.", "\"Found is good,\" the man said. \"Lost is bad. Come. The corn is almost ready.\""], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["He hauled the boat to the edge of the pier with one strong pull, then reached down a thick arm to lift Jun out first. Jun’s wet sneakers slapped the concrete as Nari landed with a small thump, immediately straightening her braid.", "\"Are you hurt?\" the man asked. It was not a question that needed an answer, but it was the right one to ask in the damp quiet.", "\"No,\" said Jun.", "\"No,\" said Nari.", "\"Good,\" said the man. \"Are you hungry?\"", "Jun opened his mouth, closed it, and looked at Nari, who was already staring at the man with the intensity of a cat watching a mouse hole.", "\"Yes,\" they said at the same time.", "The man nodded and led them past a small shed where a gas burner hissed under a dented pot. Steam rose into the air, carrying the sweet, starch-heavy smell of corn. The rain had stopped, but the world still felt thick and heavy.", "\"Sit,\" the man said, pointing to a wooden bench under the shed’s overhang. \"I am Mr. Cho. I wait for the fish, and the fish do not come. I wait for you, and you came.\""], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["Jun sat on the bench, his legs dangling over the edge while the wood warmed the backs of his legs. Nari settled beside him, close enough that their shoulders touched, and she did not pull away.", "\"My name is Jun,\" he said, the words tumbling out like a dam breaking. \"I am from Seoul. I live on the fourteenth floor. I go to hagwon every day, even when I do not want to.\" He took a breath. \"This is my cousin, Nari. She lives here. In the village. With her grandmother, who is also my grandmother. And her grandfather, who is also my grandfather. They have a big farm. With peppers.\"", "Nari leaned in, correcting him with the precision of a teacher marking a test. \"The farm is the Choi family farm. And the boat is the Pear.\"", "Mr. Cho nodded, as if he had been expecting this exact conversation for a long time. \"The one who says four words a year?\"", "Nari raised her head, her eyes sharp. \"Five. He says 'Stay with the boat.' That is one. He says 'Eat.' That is two. He says 'Good.' That is three. He says 'Aigoo.' That is four. And he says 'Go.' That is five.\"", "Jun pushed his glasses up his nose. A strange, warm pride settled in his chest, not because he was right, but because Nari was so specific, and he liked that."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["Mr. Cho reached into his many-pocketed vest and pulled out a phone with a cracked screen, older than anything Jun had ever seen. He dialed a number and held it to his ear.", "\"Hello? It is Mr. Cho. I have the cousins. They are here. They are... safe.\"", "He listened, then held the device out to Jun. The boy took it with both hands, a habit Halmoni had drilled into him.", "\"Uncle,\" he said, his voice sounding tiny in the quiet air.", "A voice on the other end broke. It was not loud, but it was cracked, like a dry twig snapping in the wind. Then there was silence, and from a long way away, Uncle’s voice came through, clear and hard and shaking.", "\"Are they there? Are they whole?\"", "Mr. Cho took the phone back and looked at Nari. \"Your father wants to talk.\"", "Nari took it. She held it to her ear, closing her eyes as she listened to the breathing on the other end, the sound of a man who had been running, waiting, and afraid.", "\"Appa,\" she whispered.", "She could not manage anything else, so she just held the phone tighter, her shoulders trembling just a little."], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["The corn arrived in a large metal bowl, still steaming, the bright yellow kernels glistening in the dim light. Mr. Cho handed them a blanket each, thick wool that smelled of camphor and old wood. They wrapped themselves up, huddled together against the cool air.", "Jun bit into a kernel. It was sweet and hot and real. He chewed slowly, looking down at his feet. His white sneakers were brown now, splattered with mud from the river, the sandbar, and the journey. He had been so worried about them getting dirty, about being clean, and being right, and being perfect.", "Now they were just shoes. Muddy, warm, and safe.", "\"My phone died,\" Jun said softly.", "Nari bit into her corn. She looked at him, her eyes bright.", "\"Good,\" she said. \"Now we're even.\"", "And Jun did not mind at all that his phone was dead. He just sat there, in the drizzle, with the person who knew the river. The worry lifted, just a little, like a heavy backpack finally set down on the grass."], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "The Long Way Back", "part": "PART FOUR: HOME", "paras": ["*Jun's phone says: charging. Nari's river says: brown, but going down.*", "The sound came before the truck. A low rumble, then a bounce, a thud, a bounce. The gravel road shook. Uncle’s blue truck rounded the bend at speed, its tires spraying mud that hit the concrete pier. He did not slow down. He stopped, the engine still growling, and jumped out before the truck had finished rocking.", "He was broad and wet. He smelled of rain, wet earth, and the river. He opened his arms.", "Nari went first. She collided with his chest, and he lifted her off the ground, one arm around her waist, the other bracing her back. He held her there, tight, his face buried in her messy hair.", "Then Jun. He stepped forward, stiff at first, unsure. Uncle’s arms wrapped around him, lifting him too. Jun’s muddy sneakers dangled in the air. He could feel the rapid thud of Uncle’s heart against his ribs. It was faster than his own.", "Uncle said nothing. He just held them, both of them, shaking slightly. The rain dripped from his straw hat onto Jun’s glasses. Jun looked up. His father’s brother was crying."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["They climbed into the back of the truck. The Pear sat on top, secured under a heavy canvas tarp that had flapped in the wind. Nari tied her braid tighter. Jun pulled his knees up to his chest.", "The truck bounced over the ruts. Rain drifted sideways, blurring the world into grey streaks. They passed the rice paddies, where the water was high and brown. They passed the levee.", "It stood.", "It was a wall of sandbags, stacked high, reinforced with wood and wire. Dozens of neighbors stood along it, holding the line, their boots squelching in the mud. As the truck passed, several waved. One man lifted a thumb.", "They drove past the village hall. Every light was on. Through the windows, Jun saw the shapes of adults, moving, talking, checking phones. The door was open. Voices drifted out, sharp and worried.", "Then the road turned, and the house appeared.", "The porch light was on. It cut a warm, yellow cone into the grey morning. The door was closed. But the gate at the front of the yard was swinging open, banging softly against the post.", "Jun’s phone, dead and useless, sat in its pouch. He did not reach for it. He watched the gate."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["Halmoni was already at the gate before the truck engine even coughed to a stop. Her purple sun visor sat crooked on her head, and her grey perm was wild, damp, and sticking out in every direction from the rain. Mud splattered her floral blouse, and she did not wait for the tires to crunch into the gravel.", "She ran.", "Her rubber slippers slapped loudly against the wet ground, and she moved faster than Jun had ever seen her move, her knees bending and her arms stretching out wide. She hit them like a sudden, heavy wave breaking against a low wall.", "Jun and Nari were folded completely into her. Her face pressed against Nari’s shoulder, then against Jun’s cheek, and her whole body was shaking.", "\"Aigoo!\" she said, and the word came out as a sob. \"Aigoo, aigoo!\"", "She pulled back, her hands gripping their shoulders tightly. Her eyes were wet, and she looked at them, really looked at them, until the scolding rushed out mixed with tears.", "\"Foolish children,\" she said. \"So foolish. Do you know what I did? I stopped cooking. I stopped breathing. I was counting your steps!\"", "She slapped their backs, though it was not really a slap at all, but a hug delivered with the full force of a grandmother who had just lost everything and found it again. Nari looked at Jun, her eyes wide, because she had never seen her grandmother cry before."], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["Harabeoji stood on the porch, his striped shirt dark with rain and his thin white moustache damp. He did not run, nor did he shout, but simply watched the truck stop and Uncle unload the cousins.", "His eyes moved to the boat.", "He walked down the steps, his tall black rubber boots making a heavy, rhythmic sound on the wood. Stopping in front of the Pear, he saw the tarp tied tight and the rope knotted securely. It was the knot they had made together.", "His finger traced the loop of the rope. Then he looked at the two orange life vests hanging from the gunwale, and finally at the plank they had used as a paddle.", "The rain dripped from his cap as he waited, his face unreadable.", "\"Vests on?\" he asked, his voice low.", "\"Yes,\" said Nari.", "\"Stayed with the boat?\"", "\"Yes,\" said Jun.", "Harabeoji nodded once, a single, sharp motion. He did not hug them, nor did he scold them. Turning, he walked inside, the screen door sliding shut behind him with a sigh."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["Halmoni made food.", "It was bibimbap, bowls of rice piled high with warm vegetables and a fried egg on top, finished with a generous spoonful of red pepper paste. The smell filled the small dining room, warm and spicy and safe.", "Jun sat on the mat in the warmest corner of the room. The ondol floor was cool under his shorts, but the air was thick with steam. He ate until his stomach was full and his hands were still shaking.", "Halmoni sat across from him. She watched him eat. Then she picked up his bowl.", "\"Grounded,\" she said.", "Jun froze.", "\"No screens,\" she said. \"No questions. Three days.\"", "She put the bowl down. Her face softened.", "\"And I love you,\" she added.", "Nari, from the next mat, looked up. She had a piece of scallion hanging from her mouth.", "\"You're not grounded,\" she said. \"You're loved.\"", "Jun looked at Halmoni. He looked at Nari. He pushed his glasses up his nose.", "\"Both,\" he said.", "Halmoni smiled. It was a small, tired smile. But it was real."], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "What Harabeoji Said", "part": "PART FOUR: HOME", "paras": ["*Jun's phone says: 100%. Nari's river says: calm.*", "The sun broke through the grey ceiling of clouds and hit the yard, feeling like a warm hand on a cold shoulder.", "\"Peppers,\" Nari said. She did not shout, and she did not need to.", "They ran. Jun’s white sneakers, now the color of wet tea, slapped against the mud as they skidded, stumbled, and burst into the yard where the straw mats lay flat under the sky.", "The red peppers were safe.", "They were spread out in neat, bright rows, drying in the fresh air. The tarp was tied back. The neighbors had been there at first light, using the bridge while the water was low enough.", "Nari sank to her knees in the dirt. Her knees were already scabbed, but she did not care. She looked at the red rows. Then she looked at Jun.", "Jun sat down in the mud next to her. He did not wipe his pants. He just laughed. It started as a small giggle and grew into a whoop that shook his ribs. Nari laughed with him, her head thrown back, her braid swinging.", "Then Halmoni came out. She stood in the doorway, watching them. She saw the safe peppers. She saw the muddy cousins. She saw the sun.", "\"Aigoo,\" she said, and joined them."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["Uncle and Auntie called them in an hour later, and they did not shout, which was worse. Shouting is loud and over quickly. This quiet sat in the room like a heavy stone.", "Uncle sat on the edge of the mat while Auntie stood behind him with her arms crossed, their faces not angry but tired.", "\"You should not have crossed,\" Auntie said, her voice flat.", "\"We should not have left you,\" Uncle said, looking at the floor before adding, \"But you went.\"", "Jun opened his mouth to explain the weather app, the wind, or the timing, but he closed it.", "\"We decided,\" Jun said.", "Nari nodded. \"Together.\"", "Uncle looked up, his eyes hard but holding something else, something complicated.", "\"That,\" he said slowly, \"is the part I cannot decide whether to be angry about.\"", "Auntie rubbed her forehead while the silence stretched thin and tight, until Harabeoji cleared his throat from the doorway."], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["Harabeoji sat on the porch, the wood damp under his weight. He held his faded green baseball cap in his hands, turning it over and over. His eyes stayed fixed on the river, which was still wide and brown.", "\"A boat with two good rowers pulling different ways goes nowhere,\" he said, his voice low and rough. \"Yesterday, you pulled together.\"", "Jun stopped breathing for a moment.", "Harabeoji looked at the boy. \"The radio. The map. Good.\"", "He turned his head to Nari. \"The river. The rule. Good.\"", "He put the cap back on his head, adjusting the brim carefully.", "\"The knot,\" he said. \"Half and half. Not good. Then good.\"", "He stood up, his knees cracking loudly, and walked inside without another word, leaving the cousins sitting on the wet wood to stare at the water."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["The punishment was work, of a specific and exhaustive kind.", "\"Two weeks,\" Halmoni announced, not looking up from the table she was scrubbing with a damp cloth. \"Washing the boat. Hanging the vests. Sweeping the porch. Filling the pump bucket. Together.\"", "Jun flinched at the list, thinking of his feet, which had already lost the war against the mud. His white sneakers were the only shoes he had brought, and there was not much white left on them.", "\"Can I wear shoes I do not care about?\" he asked.", "Halmoni stopped wiping. She looked at him, then down at her own feet, which were buried in old, thick rubber slippers that had long since lost their shape.", "\"Aigoo, that boy,\" she said.", "She walked to the shed and came back holding a pair of brown rubber shoes, lumpy and soft from years of use.", "\"Here,\" she said. \"These have seen everything. They do not mind.\"", "Jun slid his feet inside. They were warm and loose, like a pair of tired slippers. Nari watched him, then offered a small, secret smile."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["That night, the house was quiet. The cicadas had finally stopped.", "Jun lay on his thin mat. The ondol floor was cool against his back. He reached into his crossbody pouch and took out his notebook.", "He opened it to the score sheet.", "Nari 9. Jun 8.", "He looked at the numbers. They were just ink on paper. They were not the mud on his knees. They were not the smell of the river. They were not the way Nari had held the oar, or the way he had held the map.", "He took a breath.", "Slowly, carefully, he tore the page out.", "He folded it in half. Then in half again. He put it in his pocket, where it felt small and light, like a secret he no longer needed to keep."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "The Last Day of Summer", "part": "PART FOUR: HOME", "paras": ["*Jun's phone says: home. Nari's river says: home.*", "The sun was hot and dry, the kind that made the air shiver above the dirt road. The Long River lay quiet below the bank, its water a clear, bright green that reflected the blue sky without a single ripple. The red peppers in the yard stood in neat rows on the straw mats, glowing like rows of small, bright tomatoes that had forgotten they were spicy.", "Jun stood by the door of the farmhouse. His suitcase leaned against the wall. It was no longer clean. A thick layer of brown mud had settled on the wheels and the sides, baking into the fabric and plastic. He looked at the stain. He reached out a hand, then pulled it back. If he brushed it off, the summer would be gone. If he left it, the summer was still in his pockets, in his sneakers, in the mud caked under his fingernails.", "Halmoni was in the kitchen, the smell of sesame oil and rice drifting out to meet him. The house was quiet, except for the hum of a single cicada in the tree outside."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["Halmoni emerged with a basket that seemed to contain the entire summer. She packed rice rolls in seaweed, then a whole watermelon, which did not fit and had to be balanced precariously on top. A jar of kimchi, wrapped in plastic and tied with string, went in next.", "\"Eat first. Talk later,\" she said, but she was already talking. \"Chuseok is coming. In the autumn. The whole family will be here. You will come back.\"", "Jun nodded. He felt a tightness in his chest, a feeling that was not quite sadness but was close to it.", "Harabeoji stepped forward. He wore his faded green cap and his striped shirt. He did not say a lot of things, but when he did, they landed like stones in a still pond. He took Jun’s hand with both of his. His grip was dry and firm.", "\"Come back,\" he said.", "Two words. It was a lot. It was enough."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["The bus stop was under the rusty shelter, where the heat rose in waves. The cicadas screamed, a sound so loud it felt like it was inside Jun’s teeth. Nari stood there, her braid bouncing as she looked at him.", "Jun reached into his pocket and pulled out a folded piece of paper. He had taped the torn score sheet back together. The ink was smudged, but under the old numbers, he had written a new heading.", "\"Look,\" he said, holding it out.", "Nari took it. She unfolded it carefully. Under the line that had said *Nari 9, Jun 8*, there was a new line.", "*US: 1*", "Nari laughed. It was a real laugh, the kind that made her eyes crinkle. She reached into her pocket and pulled out a smooth, flat stone. On it, in black pen, was the faintest curve of a boat.", "\"For your window in Seoul,\" she said. \"So the river can watch the city.\""], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["The bus horn honked in the distance, a sharp blast that cut through the endless hum of the cicadas.", "Jun took a step forward, his muddy sneakers leaving a dark print on the dusty road. \"I'll take you to Seoul,\" he said, pushing his glasses up his nose. \"Winter break. You'll see the subway.\"", "Nari tilted her head, her braid sliding over her shoulder. \"I'll check it out first.\"", "\"You'll hate the buildings,\" Jun said, trying to sound casual. \"They're too tall. Too loud.\"", "\"I'll love the buildings,\" Nari said, and she grinned. It was a challenge, but it was also a promise. \"Then I'll tell you why they're wrong.\"", "Jun grinned back, feeling the heat in his chest. He picked up his suitcase, the mud still heavy on the wheels. He looked at the girl who had once thought he was helpless, and the boy who had once thought she was stuck in the past. They were not those people anymore. They were the people who had pulled the boat through the dark.", "\"See you in the autumn,\" he said.", "\"See you,\" she said."], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["The bus pulled away, kicking up a cloud of brown dust that hung in the air for a long time. Jun’s face was at the window, watching until the trees and the valley and the girl with the long braid were all hidden by the swirl of dirt and light.", "Nari stood still for a moment. Then she turned and walked home along the riverbank. The water was clear and moving, carrying leaves and small twigs downstream. She put her hands in her pockets. In one, the smooth stone sat against her palm. In the other, a small piece of paper with Jun’s phone number, written in his neat, careful handwriting.", "She stopped. She sniffed the air and squinted at the sky.", "\"Clear till Thursday,\" she said to nobody.", "She looked at the paper. She smiled. Then she walked on, her shadow long and thin on the hot ground."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "Fourteen Floors Down", "part": "PART ONE: TWO WAYS OF KNOWING", "page": 1}, {"n": 2, "title": "The Wheelbarrow", "part": "PART ONE: TWO WAYS OF KNOWING", "page": 6}, {"n": 3, "title": "Shoes at the Door", "part": "PART ONE: TWO WAYS OF KNOWING", "page": 11}, {"n": 4, "title": "The Long River", "part": "PART ONE: TWO WAYS OF KNOWING", "page": 16}, {"n": 5, "title": "The Score", "part": "PART ONE: TWO WAYS OF KNOWING", "page": 21}, {"n": 6, "title": "Ten Percent", "part": "PART TWO: RAIN", "page": 26}, {"n": 7, "title": "Three Days of Rain", "part": "PART TWO: RAIN", "page": 31}, {"n": 8, "title": "The Color of the Water", "part": "PART TWO: RAIN", "page": 36}, {"n": 9, "title": "The Meeting in the Hall", "part": "PART TWO: RAIN", "page": 41}, {"n": 10, "title": "Across the Water", "part": "PART TWO: RAIN", "page": 46}, {"n": 11, "title": "Loose", "part": "PART THREE: THE RIVER", "page": 51}, {"n": 12, "title": "Stay With the Boat", "part": "PART THREE: THE RIVER", "page": 56}, {"n": 13, "title": "The Bend", "part": "PART THREE: THE RIVER", "page": 61}, {"n": 14, "title": "Night on the Sandbar", "part": "PART THREE: THE RIVER", "page": 66}, {"n": 15, "title": "The Water Comes Up", "part": "PART THREE: THE RIVER", "page": 71}, {"n": 16, "title": "One More Bend", "part": "PART FOUR: HOME", "page": 76}, {"n": 17, "title": "The Lower Landing", "part": "PART FOUR: HOME", "page": 81}, {"n": 18, "title": "The Long Way Back", "part": "PART FOUR: HOME", "page": 86}, {"n": 19, "title": "What Harabeoji Said", "part": "PART FOUR: HOME", "page": 91}, {"n": 20, "title": "The Last Day of Summer", "part": "PART FOUR: HOME", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
