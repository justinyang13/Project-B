ixpence, her grey pigeon with the white patch on her chest, panting, her feathers ruffled and damp. Tied to her leg was a small, rolled tube of waxed cloth.", "Tam untied it with shaking fingers. Her breath came in short, sharp bursts. She unrolled the paper. Master Finch’s handwriting was there, shaky but clear.", "*My hands will not hold a straight line, Tam. I tremble. I am losing the trade to age. But this is not a tragedy. It is a season.*", "Tam read on, her eyes stinging. Finch wrote of her first map, the one that was a disaster, the one she had hidden in a drawer for years. *I was not trying to be the best mapmaker in Aldermere. I was trying to be a better one than I had been the day before. I have been doing that for sixty years. It has been enough.*", "The words floated in the firelight, warm and steady. Tam looked at the trembling hand she held the paper with, and then at her own. The fear was still there, but it was smaller now. Smaller, like a knot in a rope coming loose under steady pressure."], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["The letter ended with a final instruction. *Tonight you cannot draw the whole map. Draw one small line. Tomorrow, draw another. That is all of it.*", "Tam read it once, then twice, letting the words settle deep into her bones before folding the paper carefully and tucking it into her coat. She pulled out her Yesterday Book, the leather soft and worn from months of handling. Uncapping her ink pot, the sharp, familiar smell of oak-gall rose to meet her nose. She dipped her quill, and to her surprise, her hand was steady.", "She drew the river, that same wobbling stripe with two bends in the middle. It was small, and it was simple, but it was the straightest line she had ever managed. Beneath it, in tiny, careful letters, she wrote: *Dark night. Small line. Better.*", "Odd read it over her shoulder. He did not smile, and he did not say it was good. He simply watched her for a long moment, then looked away, giving her the quiet space she needed. It was the kindest thing he could have done, and Tam felt the tension loosen in her chest, like a tight knot finally coming undone under steady pressure."], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["Tam closed the book.", "The night was deep, and the stars hung above the cliffs like cold, hard buttons sewn onto a vast, dark coat. The wind picked up, whistling through the rocks with a sound that was almost rude. It carried the crash of the sea against the Hollow Cliffs, a steady, thumping rhythm that vibrated in Tam's teeth.", "She took a deep breath. The air tasted of salt and peat. She looked out past the fire, past the jagged edge of the stone, to the distant, glowing city of Verrin. The lights there were far away, small and steady, like the eyes of sleeping cats.", "\"I'm not too far behind,\" she said. Her voice was quiet, but it did not waver. \"I'm exactly where I am. And tomorrow I'll be one line further.\"", "The wind blew. The stars wheeled slowly in their tracks.", "Tam leaned back against the rock. The fire threw a warm, orange patch across her face, while the rest of her stood in the cool, blue dark. Her bones ached from the walk, a deep, honest tiredness that settled into her muscles. But the heavy knot in her stomach was gone. She closed her eyes and listened to the sea, counting the waves until the counting turned into sleep."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "The Hollow Cliffs", "part": "PART FOUR: THE TRUE LINE", "paras": ["*The Fifteenth Rule of Mapmaking: Look up from the paper.*", "The sun rose over the Hollow Cliffs, hanging in the sky like a raw egg dropped onto white porcelain. Below, the sea was a churning grey mess, throwing itself against jagged rocks that jutted out into the water like broken teeth. Gulls screamed, a sharp, angry sound that scraped against the silence. The path leading down to the water was no path at all; it was a ledge, a sliver of stone perhaps two feet wide, balanced precariously on the edge of the drop.", "Tam stood at the start of it, her knuckles white on the surveying chain. To map this coast honestly, she had to see the full curve from the edge. She had to walk it.", "Odd stood beside her, very pale. His red hair looked like it was trying to escape his head. He stared down at the water, then back up at the sky, then down again, his hands shaking violently.", "\"I can do it,\" Tam said. Her voice sounded thin in the wind.", "\"Can you?\" Odd asked. He swallowed hard, his throat moving visibly. He looked green, truly green, the color of sea-glass in a tide pool."], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["Tam went first. She dropped to her belly, the rock cold and damp against her cheek, while the chain trailed behind her in the grass. It was hard work, and her arms began to burn. The wind tugged at her braid, and the blue string brushed her neck.", "She could see, but not far. The curve of the coast bent away from her, hidden by the height of the cliff. If she drew it from here, the line would be wrong. It would be a guess. And a guess is just a lie wearing a nice hat.", "She scrambled back up, her knees knocking together. She turned to Odd. He was still standing there, rooted to the spot, his eyes fixed on a single point on the rock face.", "\"I need a second set of eyes,\" Tam said. She didn't ask, and she didn't beg. She just stated it, like the weather.", "Odd looked at her, then at the ledge, and finally at his own hands, which were still trembling slightly. He nodded.", "Tam pulled her knotted rope from her satchel. It was thick, rough, and smelled of fish oil. She tied it around her waist. Then she handed the other end to Odd.", "\"Trust the rope,\" she said. \"Trust me. Don't trust the ground.\"", "Odd took the rope. His grip was loose at first, then tight. He took a breath that rattled in his chest."], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["They went out together, one foot at a time, with Odd close behind Tam, his hand gripping the rope and his eyes wide as saucers.", "\"Drop is forty feet,\" Odd called out, his voice thin and high. \"Stack is... ten yards. Maybe twelve.\"", "Tam marked the distance on her paper. Her hand shook, but the line remained steady, like a pencil held by a very stiff teacher.", "\"Count the waves,\" Tam said. \"Don't look down. Count the waves.\"", "Odd started counting. One. Two. Three. The rhythm of the sea became a drumbeat in his ears. One. Two. Three. He stopped staring at the drop and began watching the rocks.", "A small, shaky laugh escaped him, sounding like a kettle beginning to boil.", "\"I'm on a cliff,\" he said, breathless. \"I'm on a cliff and I'm fine.\"", "At the end of the ledge stood the old lighthouse. It was stubby and half-fallen, with a broken stair spiraling up into the dark. Tam climbed it, and Odd followed, his face tight with fear but his feet sure.", "From the top, the world opened up. The entire coast stretched out before them, a long, sweeping curve of white and grey and green. It was all there. All of it.", "Tam uncapped her ink. She didn't draw a line. She drew the shape. It was the best thing she had ever drawn."], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["They descended the broken spiral stairs first, then faced the ledge, where Odd moved with the caution of a cat crossing a busy market street. He fixed his eyes on the grass below, ignoring the dizzying drop, and when his boots finally thumped onto solid ground, he did not run. He simply sat down.", "He buried his face in his hands, then looked up at Tam, his cheeks streaked with salt spray and something else.", "\"Nobody in my family has touched a cliff in a hundred years,\" he said, his voice cracking like a dry twig. \"My father insists the sea is a place you stay away from.\"", "Tam sat beside him and unrolled her paper. The line she had drawn from the top was there, long and true and strong.", "\"Then we will prove him wrong,\" Tam said.", "She pulled a tiny piece of red chalk from her satchel. At the edge of the map, near the lighthouse, she drew a small figure with red hair and arms outstretched, waving to no one in particular.", "Odd stared at the red mark, then at Tam. A smile spread across his face, wide and gap-toothed, the kind of grin that appears only after a terrible ordeal has ended. It was the smile of a boy who had just conquered a monster."], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["The sun climbed high, and the wind settled into a low, contented hum, while Tam and Odd packed their kit with the smooth, practiced rhythm of two hands rowing the same boat. Tam counted on her fingers, flexing them once, twice, three times. Three days left. If the world behaved itself, they were two days' walk from Verrin. That left one day for the river crossing. A tight margin. A risky margin.", "Odd turned his head east, where the sky was not blue but a heavy, bruised line of purple cloud, low and angry, looking exactly like the back of a father's hand after he has finished scolding the dog. He frowned. His eyes dropped to the dry dirt beneath their boots, then back up to the swelling dark above.", "\"The Aln,\" he said.", "He did not have to finish the sentence. They both knew what rain did to the river, how the water rose to swallow the stones, and how a swollen river turned a sturdy bridge into a slithering, dangerous thing. The cloud line crept closer, silent and slow, pressing down on the cliff edge like a thumb on a bruise."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "The Broken Bridge", "part": "PART FOUR: THE TRUE LINE", "paras": ["*The Sixteenth Rule of Mapmaking: A bridge is a map you can stand on.*", "The rain did not fall; it hammered. By evening, the River Aln was a brown, roaring beast that had swallowed half the valley. The water rushed past the bank, churning white and angry, carrying broken branches and the smell of deep, cold mud.", "On the near side stood the old timber bridge at Marwick. It was not so much broken as it was gone. Half the planks had been washed away, leaving a jagged gap that looked like a mouth missing its teeth. The remaining supports groaned in the wind. They swayed against the current.", "A crowd had gathered on the muddy bank, shivering under oilskin cloaks. There was Lucan Ravel, his green coat splattered with brown mud. His two assistants, Bram and Ines, stood beside him. Behind them, three other Academy teams clutched their instruments. Their faces were pale. A lost peddler held his wares tight. A cheese merchant stood by his cart, looking as if he might cry.", "They were trapped. The Guild Hall was a night and a morning’s hard march away in calm weather. In this storm, across this river, it seemed like a distance measured in years. The cloud bank above was dark and heavy, pressing down on them all."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["Lucan stood at the front of the group, wiping rain from his spectacles. He spoke clearly, though his voice was tight. \"We have no rope, no planks, no means to cross. The current is too strong for swimming. We are stuck.\"", "The other apprentices shifted their weight, looking at their maps, then at the water. One suggested using their surveying rods as a pole. Another suggested waiting for the rain to stop, which everyone knew was a lie. They had brilliant plans on paper, but paper does not hold weight, and ink does not float.", "Tam stood at the back, leaning against a tree. Her fingers traced the thick rope coiled in her satchel. The old flat feeling tugged at her chest, the one that whispered she was too small, too poor, too slow. She looked at the water, at the jagged gap in the bridge, and at her own hands.", "This was not a map problem. This was a dock problem.", "She pushed the feeling aside, hard, like shoving a stubborn door open. She stepped forward, her boots squelching in the mud. She did not shout. She did not need to. She simply looked at Lucan, and then at the water, and waited for them to be quiet."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["\"I know how to tie a bridge line,\" Tam said. Her voice cut through the hum of the rain, steady and sure. \"On the Lowtide Docks, we did it every storm season. When the ferry broke, we tied the line.\"", "Silence fell over the group, heavier than the wet leaves on the ground. The Academy apprentices stared at her, at her ink-stained fingers, at her coat that hung off her shoulders like a sail on a becalmed boat. Lucan blinked, then looked at the water, and then back at her.", "\"Tell us what to do,\" he said quietly.", "Tam nodded. \"Odd, you know the eddies. You swim a light line across. First, find the slow water near the stones. Then, Bram, you and the merchant haul the heavy cable. It is thick, but it will hold. Ines, measure the sag. It must be taut, or it will snap. Lucan, you calculate the tension. You have the best head for numbers.\"", "She uncoiled her rope, checking the knots with quick, practiced fingers. She did not look at them as if they were rivals anymore. She looked at them as hands.", "\"Who is strongest?\" she asked.", "Bram stepped forward, his face serious, his broad shoulders squared. \"I am,\" he said.", "\"Good,\" Tam said, tightening the last knot. \"Then we begin.\""], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["It took all night. The water roared around them, a constant, deafening drumbeat. They worked by the light of lanterns, hanging them from the broken bridge supports. Odd, the ferryman’s son, swam the light line across, his red hair sticking out in the spray, laughing with the effort.", "Bram and the cheese merchant hauled the heavy cable, their arms straining, their boots slipping in the mud. Ines measured the sag, her face grim, calling out inches. Lucan did his sums, his gold compass swinging on his chain, his mind sharp and quick.", "Tam tied the knots. She worked fast, her fingers remembering the muscle memory of the docks. She tied a double bowline, then a clove hitch, then a figure-eight. Each knot was a small victory against the chaos of the storm.", "When the line was finally taut, it hummed in the wind. Dumpling the mule crossed first, muttering under her breath, guided by Tam’s hand. Then the peddler, then the merchant, then the apprentices, one by one, clinging to the line, their faces white with fear, their hands shaking.", "They crossed. One by one. The line held."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["Tam crossed last. She had the Yesterday Book clamped between her teeth, keeping the rain off its pages. The line hummed under her fingers, tight as a fiddle string. She stepped off the far bank, her boots sinking into the soft earth.", "Lucan was waiting. He held out his hand, and she took it. He pulled her up the bank, his grip strong and sure.", "\"That was very good knotting,\" he said. His voice was soft, almost respectful. He took off his gold compass, looked at it for a moment, and then hung it around her neck.", "\"You’ll need it. Yours is bent.\"", "Tam touched the cold metal, surprised. The compass was heavy, and warm from his hand. She looked at him, and he smiled, a small, tired smile.", "Dawn was breaking. The purple cloud was thinning, and the first grey light was touching the tops of the trees. It was the last day of the Survey. Verrin was seven miles away."], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "The Guild Hall", "part": "PART FOUR: THE TRUE LINE", "paras": ["*The Seventeenth Rule of Mapmaking: Sign your work only when it is true.*", "The last seven miles were a blur of mud and breath. They had borrowed a cart from a farmer who did not ask questions, but the wheel jammed on the third mile, and they pushed. Dumpling walked with the stubbornness of a mule who knows he is right about everything. Odd ran alongside, his red hair flying, his mouth open in a laugh that sounded like a hiccup. Tam clutched the map case to her chest. It was wrapped in oilcloth twice, heavy and slick against her ribs. Her lungs burned. The air tasted of wet stone and horse sweat.", "Then the trees broke. The wall of Verrin rose before them, grey and solid against the sky. The bells began to toll. One. Two. Three. They ran the last stretch on foot, the cart clattering behind them. Tam’s boots slapped the cobbles. The crowd was already gathering, a sea of faces turned toward the Guild Hall. The smell of baking bread and wet wool filled the air. She could hear her own heartbeat, thumping against the oilcloth like a trapped bird."], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["The Guild Hall was a cavern of polished stone, its white marble floor inlaid with a compass rose so vast that Tam had to wade across the northern arm just to find the needle's tip. Shelves climbed the walls, stacked high with rolled maps that resembled sleeping snakes, while the long table at the far end held twenty unrolled sheets glowing in the high window light. They were beautiful, indeed. Gold leaf shimmered, serpents guarded the coastlines, and colors bled into one another with a soft, perfect smoothness that made Tam’s hands itch.", "The judges sat in a row, their dark robes swallowing their bodies until they looked less like people and more like shadows with elbows. At the center sat Guildmaster Aurelio Quint, tall and stately, his silver compass chain catching the light as he read from a scroll. His voice was deep and clear, cutting through the silence.", "\"Lucan Ravel,\" he called. A boy in a green coat stepped forward with his back straight as a ruler. \"Bram Hale. Ines Vane. Then...\"", "Quint paused. He looked up, scanning the crowded room with eyes that seemed to search for a specific smudge. \"Tamsin Marrow?\"", "Tam stumbled into the room. Her knees were muddy to the top, her hair was full of reeds and twigs, and she was breathing like a bellows. The marble floor was clean, and she could see her own footprints, dark and wet, leading from the door to the table."], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["Tam unrolled her map on the table. It was not beautiful. The ink was brown and black and grey, and the lines were thick. The compass rose was a wobbly circle that looked like it had been drawn by a hand that had been shaking. There was no gold leaf, and no serpents. In the corner sat a blot that looked suspiciously like a fish hook.", "The hall went silent. It was a heavy quiet, the sort that settles over a room when a drop of water falls into a still pond. The Academy maps glowed beside hers, bright and perfect. Hers looked like work. Honest, tired, real work.", "One of the judges leaned forward and squinted. He cleared his throat, making a sound like a dry twig snapping, while another judge leaned in to examine the blot. They did not look at the gold leaf.", "At the back of the room, Lucan stood with his hands folded. He watched Tam. His face was smooth. He did not smile, and he did not frown. He simply watched, his eyes steady and bright."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["Tam felt a presence in the corner and turned to find a wooden chair propped up on a stool, occupied by a figure wrapped in a lavender scarf. A white bun of hair stuck with pencils sat atop the head, and a hawthorn cane rested across the knees. Master Finch had come by cart, ignoring every piece of advice given to her. Her ankle was bandaged, swollen, and purple.", "She did not wave, nor did she smile. She simply met Tam’s eye from across the vast, echoing hall. Then she nodded once, a small movement that spoke the language of one craftsman to another. It said, *I see you. I see the line. It is straighter than yesterday.*", "Something filled Tam’s chest, expanding until it took up the whole room. It was not joy, and it was not pride, but a feeling that made the air inside her lungs feel solid and heavy, like a bag of wet sand. She swallowed, her throat dry, and looked at the map, then at Finch. She straightened her back, standing as tall as the ink on the page."], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["Guildmaster Quint stood. The room hushed. He walked to the center of the table, his robes sweeping the floor with the soft thud of a heavy book falling on a desk. He looked at the twenty maps. He looked at the twenty apprentices.", "\"Each of you,\" he said, his voice low and serious, \"will now explain how you made your map.\"", "He paused. He looked at Tam, then at Lucan, then at the others. A hint of a smile touched his lips. It was a small thing, barely there.", "\"And also,\" he added, \"how you improved in the making of it.\"", "A murmur went through the hall. It started as a whisper and grew into a rustle. Heads turned.", "In the corner, Master Finch closed her eyes. A smile spread across her face, slow and deep. It looked like she had just won a very long argument."], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "The Judging", "part": "PART FOUR: THE TRUE LINE", "paras": ["*The Eighteenth Rule of Mapmaking: Let the reader check your work.*", "Runners in blue livery swept across the hall, their feet slapping the stone floor with a rhythmic thud that echoed off the high vaulted ceiling. They carried the two most contested maps, Tam’s rough, ink-stained parchment and Lucan’s pristine, gold-leafed sheet, toward the massive oak shelves at the rear of the room. There, rolled in dust and time, lay the Guild’s oldest sketches of the Marches, drawn by hands long dead.", "Guildmaster Quint unrolled the ancient papers with a reverence that made the air feel thinner. He held Lucan’s map up to the light. It showed a flat, green meadow where the Greywater marsh squelched. He looked at the old sketch. It showed mud. He looked at Lucan. He did not smile.", "Then he turned to Tam’s map. It was crooked, blotchy, and smelled faintly of pine resin. It showed a sunk road, a cluster of broken stones, and a dark, reedy expanse that matched the old sketch perfectly. The truth was there, ugly and undeniable, while the beauty was a lie. The hall held its breath, waiting to see which map would be called a map."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["Before anyone could speak, Lucan Ravel stepped forward. His green coat was immaculate, but his hands were trembling at his sides. He looked at his father, Lord Ravel, who sat in the front row with his face tight as a drum. Then Lucan looked at the Guildmaster.", "\"My map is wrong,\" Lucan said. His voice shook, but it carried to the back of the room. \"I drew the Greywater from the ridge. I never walked it. I trusted the old charts because they were pretty.\" He swallowed, his throat working. \"My team nearly drowned. Tamsin Marrow pulled us out.\"", "A murmur rippled through the apprentices, a sound like wind through dry reeds. Lord Ravel went pale, then a strange, slow softening spread across his stern features. He did not look away from his son. He did not look at Tam. He simply sat there, holding the truth in his lap, a burden heavier than any gold compass he had ever owned."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["\"The Guild has always valued craft,\" Quint said, his voice low and steady. \"But today, we ask for growth. Show us how you improved.\"", "The Academy apprentices stepped up one by one. They spoke of lens glass, of new inks that did not bleed, of geometric perfection. Their maps were beautiful, flawless, and static. Then it was Tam’s turn. She walked to the table, her patched coat rustling. She did not take out a ruler. She took out the small, stitched notebook.", "The Yesterday Book.", "She opened it on the judges' table, her ink-stained fingers careful and gentle. She turned to the first page, a week after the Survey began. A river wobbled there, crooked and thick, like a snake that had fallen off a cart. She turned the page. Another river, slightly straighter. She turned another. The lines grew cleaner, the bends more deliberate. She showed them the week the rain ruined her work, where the pages were damp and the lines smudged. Then she showed them the last page."], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["\"This is not a map of the land,\" Tam said. Her voice was small, but it did not waver. \"It is a map of me.\"", "She looked up, her cheeks burning red. \"I am not a good mapmaker yet. I blot. I crook. I started further behind than anyone in this room. I learned to read at nine, on the docks, with a man who smelled of fish glue. I have no silver buttons. I have no gold compass.\"", "She closed the book, not with a thud, but with a soft click. \"But I am a better one than I was on the first day. And I will be a better one tomorrow. That is the only promise I can keep.\"", "The silence in the great hall was heavy, like a wet wool blanket dropped over a head. It was the quiet that follows when a child stops reciting a lesson and simply tells the truth. The Guildmaster stared at the small stitched notebook, then at Tam’s ink-stained fingers, and for a moment the room seemed to hold its tongue, waiting to see if the girl would say something more. She did not. She simply stood there, her patched coat rustling faintly in the still air, and the beautiful, flawless maps of the Academy apprentices suddenly looked very much like drawings of birds that had never learned to fly."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["Guildmaster Quint reached out, his hand steady despite his age, and picked up the Yesterday Book. He did not look at the judges. Nor at the other apprentices. His gaze fixed instead on the old woman in the corner, the one with the bandaged ankle and the lavender scarf, who watched with eyes that were suddenly, sharply bright.", "He turned the pages slowly. One. Two. Three. The crooked river appeared, then the straighter one, followed by the smudged week. Finally, there was the clean line. He traced the ink with his fingertip, a whisper of a gesture, touching the respect that lay beneath the surface. For a long, long moment, he said nothing. The dust motes danced in the shaft of light falling from the high window.", "Then he looked up, his gaze finding Odalys Finch.", "\"Odalys,\" he said quietly, and the word hung in the air, warm and heavy. \"You were right.\""], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "The Finch Prize", "part": "PART FOUR: THE TRUE LINE", "paras": ["*The Nineteenth Rule of Mapmaking: The best prize is the distance you have come.*", "Guildmaster Quint rose. The scraping of his chair was the loudest sound in the room, sharper than the gulls outside, sharper than the wind rattling the high panes. He adjusted the silver compass on his chain, and the metal clicked against his doublet.", "\"The Royal Chartery,\" he said, his voice rolling over the heads of the crowd, \"is awarded to the finest craft. That place goes to Lucan Ravel.\"", "A murmur swept through the hall. Lucan stood. His face was pale, but his spine was straight as a measuring rod. He bowed deeply, his gold compass swinging against his chest.", "\"However,\" Quint continued, and the word hung in the air, heavy and cold, \"the judges have noted a discrepancy in the Greywater marsh. The map you submitted shows a meadow. The ground, as we all know, is mud. You are to re-draw that section. You are to walk it first. Then, and only then, will the place be yours.\"", "Lucan straightened. His ears were pink, the color of the crier’s hat, but his chin was lifted.", "\"I would be honored,\" he said."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["Quint turned back to the judges, but his eyes drifted to the corner of the room. He paused, a long, deliberate beat, while the dust motes danced in the slant of afternoon light.", "\"Fifty years ago,\" Quint said, \"a young woman argued before this Guild that skill is not the highest measure of a mapmaker. She said that improvement is the true craft. She was laughed out of this room. Today, we are correcting that error.\"", "He reached into his robe and pulled out a small, silver case. It was not a medal. It was a pen, slender and bright, engraved with a simple, twisting line.", "\"We name this the Finch Prize. It is for the greatest distance traveled between the first day and the last. For the one who drew the straightest line not with their hand, but with their heart.\"", "Quint looked past the crowd, past the judges, until his gaze locked onto a tall, thin woman in a lavender scarf.", "\"It goes to Tamsin Marrow.\""], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["The hall erupted, a sound like the river slamming against the Lowtide pilings. It was not polite applause. It was a roar, thick and wet, filling the rafters. Odd whooped so loudly that a pigeon, startled from the beams, shot down into the middle of the room and flapped its wings in utter confusion, looking for a branch that was not there. Sixpence, safe in her basket, cooed indignantly and puffed out her white chest patch.", "Tam could not breathe, because her lungs had apparently forgotten their job.", "A steward placed the silver pen in her hand. It was cold, then warm, and then it was just part of her, settling into her palm like a key. The scroll was unrolled on the table. The Guild would publish her map as the official chart of the Marches. Tamsin Marrow and Odd Brannock.", "Odd stared at the scroll, his gap-toothed grin gone, his eyes wide and unblinking, fixed on the ink.", "\"My name,\" he whispered.", "He sat down, though he had not meant to, for his legs simply stopped working and he dropped to the marble floor with a thump that echoed in the sudden silence."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["Lucan, ever the gentleman, offered his arm to Master Finch. She took it, her hawthorn cane tapping a steady rhythm on the stone as they moved through the parting crowd. Tam ran to them, her boots slipping on the marble.", "Finch stopped. She took both of Tam’s hands. Her own fingers trembled, a fine, constant vibration, but her grip was firm. She held Tam’s steady hands in her shaking ones.", "\"I cannot draw a straight line any more,\" Finch said softly. Her voice was gravel and honey. \"But look. I have left one behind.\"", "Tam looked at the silver pen in her hand. She looked at the scroll. She looked at Finch, who was smiling with her eyes, her face crinkling like a piece of old paper.", "Tam cried. She cried into the lavender scarf, which smelled of hawthorn and dried ink. Finch patted her hair with her free hand, the cane tapping gently against the floor, keeping time, keeping her there."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["Later, on the steps, the city noise rushed up to meet them. Gulls screamed overhead, and carriage wheels clattered against the cobblestones. Lucan found Tam sitting on the lowest stone, the silver pen tucked safely into her coat pocket.", "He stood there, shifting his weight from one boot to the other. He looked uncomfortable, like a cat that had accidentally walked into a sunbeam.", "\"I have never had a friend,\" he said, finally, \"who didn't want something from my father.\"", "Tam looked up. She wiped her nose on her sleeve, a very un-noble gesture.", "\"I only want your gold compass back,\" she said.", "Lucan stared at her. Then, slowly, the corners of his mouth turned up. It was a real grin, wide and a little crooked, nothing like his usual polite smile.", "\"No,\" he said, reaching up to untangle the chain. He held it out to her, then pulled it back. \"No, I think I will keep it. For now.\"", "He extended his hand. She took it. It was a deal."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "A Better Line", "part": "PART FOUR: THE TRUE LINE", "paras": ["*The Twentieth Rule of Mapmaking: Tomorrow, begin again.*", "The sky over Ink Lane was the color of weak tea, and the gulls were already arguing about the same stale crust of bread they had argued over yesterday. Half past five. The baker’s oven was glowing orange through the brickwork, and the street smelled of yeast and river mud.", "Tam Marrow stood at the stone bowl, grinding ink. She hummed. It was a small, tuneless sound, more vibration than melody, but it did not feel like work anymore. It felt like a conversation. The pestle moved in a slow circle, crushing the burnt raisin into grey powder. It was no longer a chore. It was a rhythm. Her fingers, stained black to the knuckles, moved with a grace that would have surprised the girl who had once thrown the pestle at the wall.", "In the narrow yard behind the shop, Dumpling the mule stood chewing an apple, his ears twitching at the sound of the gulls. On the window sill, Sixpence the pigeon cooed softly, her white chest patch rising and falling with every breath. Tam paused, wiped her nose on her sleeve, and smiled at the bird."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["The stairs at the back of the shop creaked in three places, which was how Tam knew Master Finch was coming, and also how Master Finch knew Tam was pretending not to be happy.", "Odalys Finch descended one step at a time, tall and thin as a heron, her white hair bun bristling with pencils. She tapped her hawthorn cane on the last stair and peered over her round spectacles.", "\"Forty letters,\" she said, dropping a thick stack of parchment onto the table. \"Forty young people who wish to learn 'the Yesterday Book.'\"", "Tam blinked. \"Forty?\"", "\"Forty,\" Finch confirmed, her hands trembling as she smoothed the papers. \"They say it is the only method that works. I suppose I shall have to charge them. Or perhaps they must pay in apples. Dumpling is getting fussy about his diet.\" She looked around the cluttered shop, her eyes soft. \"We shall begin with the ink. No one draws a straight line if they cannot grind a good black. It is the foundation. Everything else is just decoration.\""], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["A loud thump against the door shook dust from the beams.", "Tam opened it.", "Odd Brannock stood there. His red hair stuck up like he had just emerged from a storm. He grinned so wide his gap-toothed smile threatened to split his face.", "In his arms he held a small, hand-carved model of a ferry boat, polished until it shone.", "\"Me da saw the map,\" Odd said, his voice cracking slightly. \"The one with the river and the marsh. He saw my name on it, in the corner. He cried into his beard for a full hour. Then he told me I could stop rowing in the winter and start drawing in the spring.\"", "Tam laughed, a real, belly-deep laugh. \"Winter drawing? That’s a new one.\"", "Before she could answer, the door opened again. Lucan Ravel stood in the frame, his green coat slightly rumpled, his usually neat hair falling over his forehead. He held a paper bag from the baker.", "\"Pastries,\" he announced, looking mildly embarrassed. \"For the ink-grinders.\""], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["Evening settled over Verrin, soft and grey, thick as porridge left too long on the stove. The shop emptied. Apprentices shuffled out with their notebooks, their questions, and the smell of fresh bread still clinging to their cuffs. The door clicked shut. Only the creak of floorboards and the scratch of a pen remained.", "Tam sat at the slanted table. A single candle burned, its flame steady in the still air. Before her lay the Yesterday Book, open to a fresh page. She uncapped her ink. She did not look at the grand charts on the wall, the coasts and mountains that looked as far away as the sky. She looked only at the line she had drawn yesterday.", "She drew the river. Two bends in the middle. A simple thing. But her hand moved differently now. It moved with the memory of mud, of flood, of rope bridges and rain. It moved with the knowledge that a line was not a mistake waiting to happen. It was a choice made in the present moment.", "She held the pen still for a second, watching the ink settle. It was a whisker straighter than yesterday’s. That was enough. That was everything."], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["She dipped her pen and wrote the single, honest sentence beneath the line.", "*A whisker better. Tomorrow, another.*", "From the stairs, a soft tap of the hawthorn cane echoed. Master Finch stood there, watching in the candlelight. She said nothing. She did not need to. There was a look in her eyes, a quiet pride that spoke louder than any praise, a recognition of the distance Tam had traveled from the lowtide docks to this room.", "Tam closed the book with great gentleness. The lamp burned low, the wick hissing softly. Outside, the gulls had gone to sleep, and the river Aln murmured under its bridges, steady and deep. The whole kingdom lay on the table, a vast, waiting shape, full of lines not yet drawn.", "Tam set down her pen. She smiled, a small, satisfied curve of her lips, and stretched her aching fingers, ready to begin again."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "The Burnt Raisin", "part": "PART ONE: THE SHOP AT THE END OF INK LANE", "page": 1}, {"n": 2, "title": "The Grand Survey", "part": "PART ONE: THE SHOP AT THE END OF INK LANE", "page": 6}, {"n": 3, "title": "The Worst Line in Verrin", "part": "PART ONE: THE SHOP AT THE END OF INK LANE", "page": 11}, {"n": 4, "title": "Dumpling and the Chain", "part": "PART ONE: THE SHOP AT THE END OF INK LANE", "page": 16}, {"n": 5, "title": "The Thornwood", "part": "PART TWO: THE MARCHES", "page": 21}, {"n": 6, "title": "The River Aln", "part": "PART TWO: THE MARCHES", "page": 26}, {"n": 7, "title": "Master Finch Falls", "part": "PART TWO: THE MARCHES", "page": 31}, {"n": 8, "title": "Lucan on the Ridge", "part": "PART TWO: THE MARCHES", "page": 36}, {"n": 9, "title": "The Greywater", "part": "PART TWO: THE MARCHES", "page": 41}, {"n": 10, "title": "The Village That Wasn't There", "part": "PART THREE: LOW GROUND", "page": 46}, {"n": 11, "title": "Rain", "part": "PART THREE: LOW GROUND", "page": 51}, {"n": 12, "title": "Starting Over", "part": "PART THREE: LOW GROUND", "page": 56}, {"n": 13, "title": "Lucan's Mistake", "part": "PART THREE: LOW GROUND", "page": 61}, {"n": 14, "title": "The Darkest Night", "part": "PART THREE: LOW GROUND", "page": 66}, {"n": 15, "title": "The Hollow Cliffs", "part": "PART FOUR: THE TRUE LINE", "page": 71}, {"n": 16, "title": "The Broken Bridge", "part": "PART FOUR: THE TRUE LINE", "page": 76}, {"n": 17, "title": "The Guild Hall", "part": "PART FOUR: THE TRUE LINE", "page": 81}, {"n": 18, "title": "The Judging", "part": "PART FOUR: THE TRUE LINE", "page": 86}, {"n": 19, "title": "The Finch Prize", "part": "PART FOUR: THE TRUE LINE", "page": 91}, {"n": 20, "title": "A Better Line", "part": "PART FOUR: THE TRUE LINE", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
