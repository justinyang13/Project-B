<script>
const D = {"title": "The Mapmaker's Apprentice", "sub": "A Quest Across the Uncharted Marches", "pages": [{"no": 1, "ch": 1, "ctitle": "The Burnt Raisin", "part": "PART ONE: THE SHOP AT THE END OF INK LANE", "paras": ["*The First Rule of Mapmaking: A map is a promise.*", "Nobody in the city of Verrin was awake yet, except the gulls, the baker, and Tam Marrow, who was grinding ink and hating it.", "There is a way of grinding oak-gall ink that Master Finch called \"listening,\" and a way that Tam called \"trying not to throw the pestle at the wall.\" It involved a stone bowl, a lump of something that looked like a burnt raisin, and a great deal of patience, and Tam had exactly as much patience as an eleven-year-old has at half past five in the morning, which is to say, none. She ground. The raisin crumbled. Grey powder puffed up her nose, and she sneezed a black freckle onto her wrist to keep the other freckles company.", "Outside the shop window the sky was the color of weak tea. Somewhere below, the river Aln was muttering under all its bridges. Tam scowled at the pestle, and the pestle, being a pestle, said nothing."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["The stairs at the back of the shop creaked in three places, which was how Tam always knew Master Finch was coming, and also how Master Finch always knew Tam was pretending not to have been sulking.", "Odalys Finch came down them one step at a time, tall and thin as a heron, with her white hair in a bun stuck all over with pencils and her lavender scarf trailing behind her like a slow purple comet. She tapped her hawthorn cane on the last stair, peered over her round spectacles, and dipped one trembling finger into the bowl.", "\"Better,\" she said.", "\"It's terrible,\" said Tam.", "\"It is better than yesterday's, which was better than the day before's. That is how one arrives at a good ink.\" She wiped her finger on her scarf, which explained the scarf. \"Do go on grinding. I shall stand here being encouraging.\"", "The shop around them was crowded with maps: maps rolled in racks like sleeping cats, maps pinned to the beams, maps of coasts and moors and mountain passes, and one very large brass globe with a dent in the north where somebody had once dropped a cheese."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["Now, you should know where Tam came from, because Tam never stopped knowing it.", "She came from the Lowtide Docks, where the mud was deep and the gulls were rude and nobody's mother ever seemed to be at home. She had sorted fish before she could properly count them. She had run errands for six different net-menders and tied forty kinds of knot by the age of seven. She had learned her letters at nine, from a one-eyed man who mended nets and read the shipping notices aloud in a voice like a rusty hinge, and she had learned them fast, because she had been terrified of being the last person on the docks who couldn't.", "Then one grey morning she had repaired a cracked compass for a stranger, using a fish-hook and a bit of wax, and the stranger had turned out to be Master Finch.", "\"I don't need an apprentice with clever hands,\" Finch had told her afterward. \"I need one who doesn't say 'it can't be done.' You said it four times and then you did it anyway. That will do.\""], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["On the table by the window lay the small stitched notebook that Finch called the Yesterday Book.", "Every evening before supper, Tam drew exactly one thing in it: a river, a wobbling stripe of ink with two bends in the middle, the same river every night. Beneath it she wrote one honest sentence. *Straighter at the top. Blot at the corner.* *Too fast. Ugly.* That was the whole exercise, and Tam thought it was the most boring thing in the kingdom of Aldermere, and she had done it for seven months.", "Finch turned the pages now, slowly, with her shaky fingers. The rivers went by, page after page, each one a whisker straighter than the one before it, like a person very slowly learning to walk.", "Tam saw only how crooked the last one still was. She said, to the ceiling, \"The Academy children could draw that in their sleep.\"", "Finch didn't answer. She merely closed the book with great gentleness, the way you close a door on a room where something is growing."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["A bell began to ring in the street outside, a big flat brass handbell, clanging over the sound of the gulls, and a voice came rolling down Ink Lane like a barrel down a hill.", "Tam went to the window with the pestle still in her fist. Below, the town crier was planting himself in front of the shop in his red coat and feathered hat, puffing out his chest.", "\"By order of the Mapmakers' Guild of Verrin,\" he bellowed, \"hear ye, hear ye! The Grand Survey of the Uncharted Marches is proclaimed!\"", "Behind her a pencil hit the floor. Tam turned. Master Finch was standing very still with her hand at her collar, and on her long, lined face was a smile Tam had never seen before: the smile of a person who has been waiting a very, very long time for a particular door to open."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Grand Survey", "part": "PART ONE: THE SHOP AT THE END OF INK LANE", "paras": ["*The Second Rule of Mapmaking: Start where you stand.*", "The crowd in Ink Lane was thick and noisy, a tangle of wool coats and leather boots pressing against the damp cobblestones. A large sheet of parchment was nailed to the town post, fluttering in the cold breeze. Tam pushed through, her patched brown coat brushing against a merchant’s sleeve, and began to read.", "She read it three times. The first time, her eyes slid over the words because they were too big and important. The second time, she sounded out the letters, moving her finger under each word as if it were a row of teeth. The third time, she let the meaning settle. Twenty-one days. The Uncharted Marches. Every apprentice in the kingdom.", "A girl in a blue velvet cloak, her hair pinned with pearls, stood directly behind Tam. Tam felt the girl’s eyes on her ink-stained fingers, on her worn shoes, on the blue string in her braid. Tam did not turn around. She just read the word *winner* again, feeling a hard, cold knot tighten in her stomach, the kind that happens when you drop a full jar of pickles."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["The Marches were the part of the kingdom nobody liked to talk about. They were wild, tangled, and stubborn, a place of thornwood that snagged your clothes, marshes that swallowed your boots, and moors that stretched out until you forgot where the sky started. No honest map had ever covered them. They were the last blank spot on the royal charts, a hole in the world’s face.", "The Academy apprentices were already there, standing in a tight circle near the fountain. Their coats were crisp, their boots polished to a mirror shine. They spoke in low, confident voices, pointing at the parchment as if they had already drawn the lines.", "Tam stepped back, her shoulders hunching. \"It is not for me,\" she said. Her voice cut through the mist. \"I am not even a proper apprentice. I am the ink grinder. I belong in the shop.\"", "She looked at her hands. They were rough, calloused, and permanently stained black. They were the hands of a dock worker, not a mapmaker. The thought settled in her stomach, cold and heavy."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["Back in the shop, the smell of dried oak-gall hung in the air, sharp and old. The door banged open, bringing in a gust of wind and three figures. Lucan Ravel stepped in first, his fair hair combed neatly back, his green coat buttoned to the neck. A gold compass swung on a chain at his hip, catching the grey light.", "Behind him came Bram, a large boy with gentle eyes, and Ines, small and quick, clutching a stack of papers. Lucan’s eyes swept the room, landing on Tam, who was wiping her hands on her apron.", "\"Ah, the grinder,\" Lucan said. His voice was smooth, polite, and sharp as a blade. He did not look at her face. He looked at her hands. \"I suppose you will be enjoying the holiday? Of course, there is no question of entering. The Survey is for those who have the training.\"", "Bram shifted uncomfortably, looking at his polished boots. Ines stared at the ceiling. Tam said nothing. She just watched Lucan’s compass swing, back and forth, back and forth, like a pendulum counting down to something she was not ready for."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["Master Finch did not turn around. She stood at her desk, back to the door, a quill in her trembling hand. She dipped the nib. She paused. She wrote a single line on thick cream paper.", "The scratch of the quill was the only sound.", "She blew on the ink. A tiny puff of air, useless against the wetness. Then she turned and handed the sheet to Lucan. He took it, surprised. He read.", "Under the heading *Apprentice*, in Finch’s sharp, precise hand, were the words: TAMSIN MARROW.", "Lucan’s face went through a series of expressions. It moved across his face like a storm front rolling over a small town. He looked at the name. Then at Tam. Then back at the name.", "He folded the paper with excessive care. He tucked it into his coat pocket. It sat there, heavy and undeniable, like a stone in a shoe.", "\"I will deliver this to the Guild clerks,\" he said. His voice was tight. \"At once.\""], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["The door clicked shut. The silence that followed was heavy, pressing against Tam’s ears. She looked at Finch, the sound of her own pulse loud in her head, like a drum being beaten inside a tin can.", "\"You can't,\" Tam whispered. \"I am not... they will laugh at me. They will see I am nothing. I started too far behind.\"", "Finch leaned on her hawthorn cane, her eyes kind and steady. \"Rule the Second. Begin where you stand. You are standing in my shop. You have ink under your nails and a story in your hands. You will do.\"", "Tam looked down at her own fingers. The black stains were deep in the whorls of her skin. She thought of the docks, the mud, the years of running errands while other children learned to draw. She was afraid. She was very afraid that she was right, and that the blank space in the map was too big for her to fill."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "The Worst Line in Verrin", "part": "PART ONE: THE SHOP AT THE END OF INK LANE", "paras": ["*The Third Rule of Mapmaking: Compare your line only with yesterday's.*", "The afternoon light fell in slanting bars across the drawing table, catching dust motes that drifted with an annoying precision. Tam sat before a lumpy piece of driftwood, which Finch had placed there to represent the coastline of the island of Crag.", "\"Draw what you see,\" Finch said from her chair, watching with a stillness that felt like being measured.", "Tam uncapped her ink pot. She dipped the nib and hesitated. The paper seemed to hold its breath. She made the first stroke. It was shaky. The second stroke was worse. Then, as if the ink had decided to rebel, the nib caught a fiber in the paper. The pen jumped. A splatter of black hit the middle of the sea, expanding into a dark, wet circle the size of a plum.", "Tam stared at it. The blot gazed back.", "She tore the sheet off, picked up a new one, and drew again. The line wavered like a reed in a gale. The blot returned, larger this time. She tore it up, then kicked the wooden stool, sending it skidding across the floorboards with a loud, accusing scrape.", "\"Steady,\" Finch said, not looking up from her book.", "\"It is not steady,\" Tam muttered, her cheeks burning. \"The ink is steady. The island is not.\""], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["A knock at the door interrupted the silence. Finch nodded toward it. Tam opened the door to find a young servant in a green livery, holding a sealed envelope with the wax crest of House Ravel. He handed it over with a polite bow and scurried away, his shoes clicking rapidly on the cobbles.", "Finch broke the seal. Inside was a sheet of heavy, cream-colored paper. It was Lucan Ravel’s sample map, sent as a courtesy to the participating masters.", "The coast was perfect. It was not just accurate; it was elegant. The lines flowed with a confidence that made Tam’s own scribbles look like the work of a blind mouse. In the corner, a tiny sea serpent curled around the compass rose, its scales rendered in minute, precise dots.", "Tam picked up her own sheet. The plum-sized blot stared up at her. She looked at Lucan’s serpent. She looked at her blot. The air in the shop seemed to drain away, leaving a hollow, ringing quiet.", "\"I'll never draw like that,\" she whispered.", "The whisper was so soft that Finch, who had been turning her spectacles in her hands, stopped and looked at her. The fear in Tam’s voice was colder and sharper than any shout could have been."], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["Finch did not offer comfort. She did not offer a lecture. She stood, tapped her cane once on the floor, and climbed the crooked stairs. The steps groaned. A familiar complaint.", "When she returned, a rolled bundle sat under her arm. It was tied with a fraying ribbon. She unrolled it on the table.", "The map was yellowed. Brittle at the edges. Mice had chewed two distinct holes in the corner. The coastline was a tangle of wobbly brown lines. It looked less like a shore and more like a spilled plate of noodles. The compass rose leaned to the left. It looked tired. In the middle of the land, a single crude tree stood. Next to it, in shaky letters, was the label: \"Big Tree (?).\"", "Tam stared. A giggle bubbled up in her throat. Unwanted. Sudden. She clamped her hand over her mouth. It slipped out anyway. A dry, startled sound. Then she laughed harder, until she sat on the edge of the bench to keep from falling over.", "\"Sixty years ago,\" Finch said. A genuine smile broke across her lined face. \"Look how far a person can travel.\""], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["\"The trouble with looking at Lucan’s map,\" Finch said, her voice low and steady, \"is that you are comparing your beginning to his middle.\" She tapped the mouse-nibbled parchment, then moved it aside to make room for the small, stitched notebook. \"You will always find someone who is better, and you will also always find someone who is worse. Neither one helps you draw the next line.\"", "\"Open it,\" she said, pointing with her hawthorn cane.", "Tam flipped through the pages. At first, the rivers looked identical, just a series of crooked, wobbly, imperfect brown lines. But as her eyes moved from page to page, a pattern emerged. The first river was jagged. The second was slightly smoother. The third had a bend that was just a fraction more controlled, like a child learning to write their name without shaking.", "\"It is a staircase,\" Finch said. \"A slow, stubborn staircase going upward. You do not need to reach the top today. You only need to step one rung higher than yesterday.\"", "Tam looked at the lines again. She did not see a failure. She saw a path. Each line was a proof that she had tried, and that the trying had changed the shape of the ink."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["That evening, the shop was quiet. Candles burned low, casting long shadows against the walls. Tam sat at her table, uncapped her ink, and picked up her pen.", "She drew the river. The two-bend river. The same one she had drawn every night for seven months.", "Her hand moved slowly. She did not look at the wall. She did not think of Lucan’s serpent. She thought only of the line before her, and the line she had drawn yesterday.", "When she finished, she held the new sheet up. She placed it beside the previous night’s drawing.", "The new line was a hair straighter. The bend was a little more deliberate. The blot at the corner was there, but it was smaller, less aggressive.", "Tam picked up her fine-point pen. She wrote beneath the drawing, in small, careful letters: *Straighter by a whisker. Blot at the corner, but smaller.*", "She looked at it for a long time. The shop was still. The candles flickered. It was the first time she had ever been proud of a line that was still crooked."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "Dumpling and the Chain", "part": "PART ONE: THE SHOP AT THE END OF INK LANE", "paras": ["*The Fourth Rule of Mapmaking: Pack less than you fear you'll need, and more than you hope you will.*", "The trunk at the back of the shop had not seen the light of day in three years. It opened with a groan. It sounded exactly like a bear clearing its throat before demanding breakfast. Inside lay the dust of the past, and the tools of the present.", "Master Finch lifted a folding table wrapped in oiled cloth. She unwrapped it with the slow precision of a surgeon. Then came the measuring chain. It was heavy. It was cold. Tam held it up. It clinked and jangled, a small, noisy orchestra of brass links that seemed to have strong opinions about being touched.", "\"Good,\" said Finch. \"It needs to be heavy. A light chain lies.\"", "In the yard outside, Dumpling the mule was chewing a piece of hay. He had the distinct air of a person who had been asked to do a favor and had decided to do it very slowly. He turned one large, dark eye toward the window. Then he looked back at his hay. It made it perfectly clear that he had heard nothing about leaving."], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["Sixpence sat on the sill, ruffling her grey feathers and fixing Tam with a look that suggested she was already planning her escape.", "\"Strict instructions,\" Finch said, tapping the wicker basket she had set on the table. \"You carry a note. You fly home. You do not nap in the treetops. Do you understand?\"", "Sixpence cooed, a low, rumbling sound that vibrated in the air.", "Finch reached into her coat pocket and pulled out a small, shiny apple. She dangled it in front of Dumpling’s nose. The mule’s ears pricked forward. He stopped chewing. He looked at the apple, then at Finch, then at the apple again.", "\"One does not go into the wild without apples,\" Finch said, her voice dry as old parchment. \"For the mule. And for morale.\""], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["The ferry landing was a sucking mess of mud that smelled strongly of low tide and old salt. A boy stood there, tall and gangly, his red hair sticking up in three distinct directions that defied any known law of nature. He wore a coat too large for his frame and boots that were far too wet for the day, suggesting he had spent the morning walking through the river and then simply gave up trying to dry off.", "His grin was so wide and gap-toothed that Tam suspected his jaw might have been a separate piece of machinery.", "\"Odd,\" Finch said, not bothering to introduce him as if the name were a brand of cheese. \"This is Tam. She draws the lines. You know the rivers.\"", "Odd extended both hands at once, shaking Tam’s right and left simultaneously.", "\"Heard you’re the one who blots,\" he said, laughing at a cloud that was passing overhead. \"That’s a good thing. Means you’re trying. I’m Odd. I know where the water goes. Mostly.\""], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["The road out of Verrin was a churn of mud and ambition. Academy apprentices filed past in neat rows, their horses polished until the coats reflected the sky like a puddle on a sunny day. Trumpets blared a tune that made Tam’s teeth ache.", "Lucan Ravel sat in the window of a carriage lacquered green. It gleamed. He looked like a beetle’s shell that had decided to go to school. His fair hair was perfect. A gold compass swung gently against his chest, ticking with every bump in the road.", "He paused. His eyes dropped to Tam’s small cart, the mule, and the pigeon in the basket. He raised his hand to his forehead. A mock salute. His expression was one of polite, exaggerated pity, the kind a cat gives a mouse that has just fallen off the table.", "Tam felt heat rise in her cheeks. She did not look away. She looked at the green paint. Then at her own dusty wheels. Something settled in her stomach. Heavy. Cold."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["The city walls slid past, the stone gray and indifferent. The last chimney smoke of Verrin fell behind them, a thin ribbon dissolving into the morning air.", "Ahead lay a land of green and grey, vast and unmarked. No roads. No signs. Just the blank promise of the Uncharted Marches.", "Tam’s stomach gave a lurch that had nothing to do with hunger. She pulled the small, stitched notebook from her satchel. The pages were thin, filled with crooked rivers and honest mistakes.", "Finch, jolting gently beside her on the cart, did not speak. She merely reached over and tapped the cover of the book once, a soft, firm knock.", "\"Well,\" said Tam, closing the book and gripping the cart’s edge. \"There’s the promise. Let’s see if we can keep it.\""], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "The Thornwood", "part": "PART TWO: THE MARCHES", "paras": ["*The Fifth Rule of Mapmaking: Draw what is there, not what you wish were there.*", "The Thornwood did not welcome them. It greeted them with a wall of green so thick and tangled that it looked less like a forest and more like a giant had spilled a box of salad greens all over the ground. Brambles clawed at the hem of Tam’s coat. Twisted oaks stood with their heads bowed, whispering in the damp dark.", "Tam left the cart at a smallholding where an old woman traded a basket of apples for the promise of a map. Then they walked. Dumpling carried the kit, his ears swiveling like satellite dishes, while Tam dragged the heavy surveyor’s chain behind her.", "\"Here,\" said Finch, stopping at a bend in the mud. \"Set up the table.\"", "Tam unfolded the wooden legs of the folding table, which immediately sank an inch into the soft earth. She laid her paper flat, smoothed the wrinkles with her ink-stained palms, and began to count the links of the chain. One, two, three. The air smelled of wet leaves and old rain.", "She set her first point. The line was ready. The wood was waiting to be drawn, but Tam could feel the brambles watching her, sharp and silent, promising that the truth would be much harder to capture than the promise."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["Tam picked up her quill. She wanted the path to be graceful. She wanted it to curve like a ribbon tied by a careful hand. So, with a confident sweep of her wrist, she drew a neat, flowing line that wound gently through the green. It looked beautiful. It looked like something from a book.", "She was admiring her own work when a red head popped up over her shoulder.", "Odd Brannock leaned in, his gap-toothed grin spreading wide. He squinted at the paper, then at the wall of thorns directly in front of them.", "\"That’s a lovely line, Tam,\" he said, his voice bright with amusement. \"But I don’t think there’s a path there.\"", "Tam stiffened. \"There is. I saw it.\"", "\"You saw a hole in the hedge,\" Odd corrected gently, pointing a muddy finger at the dense brambles. \"That’s a bramble hedge. It bites. I know this hedge. I’ve walked it a hundred times. There is no track. Just mud and thorns.\"", "The color rose in Tam’s cheeks, hot and prickly. She looked at her smooth, elegant curve. Then she looked at the tangle of sticks and dirt. He was right. She had not drawn the path. She had drawn the idea of a path. She had drawn what was easy to draw, because the truth was messy, and mess was scary."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["Finch sat on a mossy stump, her hawthorn cane resting across her knees, and watched Tam’s shoulders hunch tighter with every second that passed.", "\"A lovely sweep,\" she said, her voice dry as old paper. \"And no truth in it.\"", "Tam snatched the sheet from the table. The ink was still wet, so she crumpled it into a tight ball and stuffed it into her satchel, her chest heaving as if she had just run a long hill. She felt small, and foolish, and very much like the girl who had once tried to tie a knot in a single strand of wool.", "\"Get the chain,\" Finch said.", "Tam grabbed the links. They walked back into the thicket, and the brambles scratched her arms, leaving red welts that stung like nettles. She moved slowly, counting the links as she went, forcing herself to see the actual ground. It was a mess: left, then right, then a dead end, then a sharp turn left. It was jagged and ugly and real.", "When she finally sat down to draw it, her hand shook. The line on the page looked like a squiggle made by a child. It was awful. It was correct. Tam stared at it, and for the first time, she did not reach for the eraser."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["They were halfway back to the campsite when Dumpling stopped.", "He stopped in the middle of the trail, planted his hooves firmly, and sat down.", "\"Dumpling, move,\" Tam said, pulling on his reins.", "The mule did not move. He looked at the thicket to his left with an expression of profound, unshakeable disappointment.", "\"Bribery,\" Finch suggested, reaching into her pocket. She held out a large, shiny apple.", "Dumpling sniffed it once, then turned his head away.", "Odd laughed, a big, rolling sound that echoed off the trees. \"Wait a minute,\" he said, stepping closer. He pointed at a small, dark hole in a low branch. \"I hear them.\"", "A low, angry buzz filled the air. A cluster of hornets, yellow and furious, was clustered around the nest.", "Dumpling let out a long, judgmental snort. He did not want to go near the hornets. He had made his decision, and he was sticking to it.", "Finch smiled, a thin, sharp smile. \"Mules,\" she said, \"are the finest surveyors of all. They will not lie to save face.\""], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["That night, the fire crackled in the hollow of the trees. The wind had died down, leaving the air still and cool. Tam sat on a log, her arms crossed, watching the sparks rise into the dark.", "She took out the Yesterday Book. The pages were thin and soft. She uncapped her ink pot and drew the river. Two bends. Simple. Honest. She made the line straighter than it had been yesterday. Just a whisker.", "Beneath it, she wrote: *Drew what was there. Ugly. True.*", "She closed the book and tucked it under her arm. The forest was quiet, but then, from far away, a sound cut through the night. A trumpet. Thin, proud, and clear. It rang out once, then again, echoing off the trees.", "Somewhere in the dark, Lucan’s team was making camp. Tam listened to the note fade into the silence, and felt a small, sharp ache in her chest that was not quite fear, and not quite envy."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "The River Aln", "part": "PART TWO: THE MARCHES", "paras": ["*The Sixth Rule of Mapmaking: Measure with what you have.*", "The River Aln did not run so much as it argued. Wide, brown, and quick, it churned over stones that glinted in the grey light. Odd Brannock stood at the water's edge, his red hair whipping across his face. His gap-toothed grin stretched so wide it looked like it might snap.", "\"Home,\" he whispered, his voice dropping to a tone of pure delight. He knew every ripple. He could tell you which one carried a dead leaf to the next bend. This was his country, more than Verrin, more than the Academy.", "Tam heaved her satchel from her shoulder and dumped the contents onto the muddy bank. The brass surveying chain clattered out, a heavy, precious thing. She picked up the first link. Then the second.", "They were bent. Not broken, but twisted into ugly, stubborn shapes, the metal warped from Dumpling’s unfortunate roll in a ditch two days prior. She held the chain up. It sagged, refusing to lie straight. It could not measure a river. It could barely measure a puddle.", "Odd’s grin did not waver. He simply pointed upstream, where the water whitened over a submerged shelf. \"Ferry crossing,\" he said. \"Right there. My father used to haul the rope for it.\""], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["Tam stared at the bent metal, her stomach turning over cold and heavy like a stone in a pocket. The deadline was twenty days away, the river was wide, and the chain was ruined.", "\"What have you got?\"", "Master Finch’s voice cut through the rising panic, quiet and steady. She did not tremble now; she simply stood with her hands behind her back, watching the water ripple.", "Tam looked around. She had a length of hemp rope, thick and stiff as a winter branch. She had her hands. And she had the forty knots learned tying fish crates on the Lowtide Docks, back when she thought she would be a net-mender for life.", "She untied the satchel and pulled out the rope. Tying one knot, then another, she measured against the last straight inch of the broken chain, marking each arm’s length with a tight, secure bowline.", "When she held it up, the rope hung heavy and true. It was a docker’s trick, rough and unpolished, but it worked.", "Odd whooped, a bright, startling sound that echoed off the trees. Finch’s eyes crinkled behind her spectacles."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["They waded in. The water found every gap in their boots instantly, and Tam’s teeth ached with a sour chill.", "The current was manageable. Odd led the way, his gangly legs finding the submerged stones with the easy confidence of a cat walking a fence. Tam followed, counting her steps to keep from thinking about the far bank, which seemed to be drifting further away with every splash.", "Dumpling had different opinions about the whole affair.", "Finch held an apple on a long stick, dangling it just out of reach to coax the mule forward. The grey animal sniffed the air, huffed a cloud of steam, and then stepped into the water with the slow, deliberate dignity of a general inspecting a new trench.", "Midway across, where the current pulled at their ankles, Odd slowed down.", "\"My father wants me on the ferry,\" he said, his voice sounding very small against the rush of the river. \"He says the water is the only thing that doesn't lie to you.\"", "Tam held the rope tight, feeling the hemp twist in her damp hands.", "\"Everybody starts somewhere,\" she said. \"It doesn't decide where you end up.\"", "Odd looked at her, surprised. Then he grinned. It was a smaller grin this time, lacking the usual wild bounce, but it was a real one."], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["On the far bank, mud clung to their boots. Tam wrung out her sleeves, her fingers stiff and blue from the cold. She pulled out her quill and her paper.", "The river stretched before them, brown and wide and indifferent. She tied her knotted rope to a post on one bank and walked to the other, counting the knots. One, two, three. She marked the width in the margin.", "Then she drew it.", "She did not try to make it beautiful. She did not try to make it look like the Academy maps. She drew the curve of the bank where the mud slumped. She drew the angle of the current where it swirled around a submerged rock. She drew the truth, line by line, knot by knot.", "When she stepped back, her chest felt tight with a sudden, sharp anticipation. It was not elegant. But it was exact.", "She opened the Yesterday Book. The first page was a wobbly, hopeful scribble. This line was different. This line was the river.", "She laughed out loud, a short, surprised burst of air."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["Finch wrapped her lavender scarf tighter around her neck, the fabric bunching against her chin as the wind picked up with a sudden, icky gust that carried the smell of wet earth and distant wood-smoke. She watched Tam for a long moment, her eyes sharp behind her round spectacles.", "\"You are at your best,\" Finch said, her voice gravelly and warm, \"when you use the tools you were born with.\"", "Tam blinked, wiping a streak of mud from her cheek with a dirty thumb. \"You knew the chain would bend?\"", "\"I knew you’d know what to do.\" Finch tapped her hawthorn cane on a flat stone with a dry, rhythmic click. \"A map is a promise. You just made a very good one.\"", "Before Tam could reply, a sound cut through the air, thin and far away and sharp. It was a shout. Then another. Underneath the voices came the metallic clatter of something heavy hitting the ground, like a bucket dropped down a well. Tam’s face fell, the color draining out of her cheeks faster than water from a tipped pail. She looked at Odd, and he looked at the river."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "Master Finch Falls", "part": "PART TWO: THE MARCHES", "paras": ["*The Seventh Rule of Mapmaking: A good map has more than one hand in it.*", "The shout was only a heron. The clatter, a loose rock tumbling down the scree slope. But the sound had hit the ridge with such force that Master Finch was already moving before her brain caught up with her feet. Her hawthorn cane struck the wet stone, skidded, and vanished into a patch of moss. Then came the stumble. Her foot twisted sharply against the slick ground. A sharp cry, brief and bright, followed by the dull thud of her shoulder hitting the earth.", "\"Master!\" Tam shouted, the word tearing out of her throat before she could think.", "She ran, her boots slipping on the damp leaves, but Odd was faster. The ferryman’s son had already dropped his pack and was half-kneeling beside Finch. His red hair was wild in the wind, his face pale, but his hands were steady. He moved with the quick, fluid grace of a boy used to balancing on narrow planks. He slid one arm under her shoulders and the other under her knees.", "\"Easy, easy,\" he said, his voice low and urgent. \"Don’t fight me. I’ve got you.\"", "Finch made a sound that was half groan, half sigh, and closed her eyes. She did not scream. She did not thrash. She simply went limp, trusting the boy who had only known her for three days to hold her entire weight. Odd lifted her with a grunt of effort, his knees bending, and began the long, slow climb toward the ridge."], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["The shepherd’s hut was a low, grey hump of stone that seemed to grow out of the heather. Inside, the air smelled of peat smoke and damp wool. A large, sleepy dog with a patchy brown coat lay curled on a bed of dried grass, watching them with one heavy-lidded eye. It did not bark. It merely yawned, showing a pink tongue that looked like a soft, red leaf.", "Finch sat on the edge of the bed, her face the color of old parchment. Her ankle was swollen to the size of a large loaf of bread, the skin tight and shiny over the bone. She looked at it with the detached curiosity of a mapmaker studying a difficult coast.", "\"I cannot go on,\" she said. Her voice was gravel in a jar, rough but clear. \"The bone is not broken, thank the gods, but it is angry. And I am stubborn.\"", "Tam knelt beside her, her hands hovering, afraid to touch the swelling. \"Then what do we do? The survey is in two weeks.\"", "Finch’s eyes snapped to the pigeon cage in the corner. Sixpence ruffled her grey feathers, the white patch on her chest glowing in the dim light.", "\"Sixpence flies,\" Finch said. \"She carries news. We send her to the Guild. We tell them I am safe, and that the work continues.\" She leaned forward, her chin resting on her cane. \"Tam goes. Odd guides. I stay here, stubborn and comfortable, until the shepherd’s wife comes home with her soup.\""], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["\"No,\" Tam said.", "The word dropped onto the floor like a heavy stone. It was not a shout. It was a refusal that filled the small, smoky room.", "\"The map belongs to you,\" Tam said, her voice trembling only slightly. \"You built the team. You know the land. I am only the ink-grinder. I grind the ink. I hold the quill while you think. If you cannot walk, we turn back. We go home. It is the sensible thing.\"", "Finch did not answer immediately. She reached for her hawthorn cane, braced it against the uneven stone, and pushed herself upright with a grunt of effort. She swayed, her face the color of old parchment, but she did not fall. She looked at Tam, and for a moment, the old woman seemed taller than the hut.", "\"You are listening to the wrong voice,\" Finch said.", "\"I am listening to my feet,\" Tam whispered.", "\"No,\" Finch said, tapping the cane on the stone. \"You are listening to your fear that you began too late. That you are not enough.\" She took a step, then another, wincing but not stopping. \"I did not enter you for my sake, Tam. I entered you for yours. Because I watched you grind that ink for seven months. Because I watched you draw that river, crooked and wobbly, and you kept trying. I believe in your hands. I believe in your eyes. The map is yours. It always was.\""], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["Finch reached into the deep pocket of her coat. Her fingers, trembling slightly, pulled out a small, round object. It was her spectacles, the ones with the round lenses and the thin gold frames. Tam gasped. Those were Finch’s. She had seen them only when the old woman read the finest charts, the ones with letters so small they looked like a swarm of black ants.", "\"Keep them,\" Finch said, pressing them into Tam’s ink-stained palm. \"You need to see the small things. The tiny bends. The hidden currents.\"", "Then she took out the brass sextant, heavy and cold, and placed that in Tam’s hand too. But her last offering was different. She reached into her satchel and pulled out a small, oilcloth bundle. It was old. The cloth was faded to the color of weak tea. She opened it carefully, revealing a map. It was drawn on thin parchment, the lines wobbly, the ink faded, the coastline a chaotic squiggle that looked more like a child’s scribble than a survey of the coast.", "\"This is my first map,\" Finch said. Her voice was softer now. \"I drew it sixty years ago, when I was eleven. I was terrified. I thought I had started too far behind. I thought I would never catch up.\" She looked at Tam, her eyes bright behind the empty space where her glasses had been. \"Carry it. When you feel you are too slow, look at what I drew at eleven, and look at what I draw now. That is the whole of the trade.\""], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["Tam closed the oilcloth bundle. It felt heavy, heavier than the brass sextant, heavier than the spectacles. It felt like a promise.", "\"Let’s send Sixpence,\" Tam said. Her voice was steady.", "She took the pigeon from its cage. Sixpence hopped onto her outstretched hand, her grey feathers soft and warm. Tam tied a small scrap of parchment to the bird’s leg. The message was short: *Master Finch is safe. The survey continues. Do not worry.*", "Sixpence fluffed her feathers, the white patch on her chest standing out in the dim light. With a flick of her wings, she launched herself from Tam’s hand, spiraling up through the small window of the hut, a grey dart against the grey sky.", "Outside, the wind had died. The ridge was quiet. Odd slung his pack over his shoulder, checking the straps. Dumpling, the mule, stood patiently, chewing a mouthful of dried apples, his ears twitching.", "Tam picked up her satchel. She held the oilcloth bundle tightly against her chest. She looked back at the hut door, where a small figure in a lavender scarf was waving her cane, a silent, stubborn wave.", "It was the first time in Tam’s life that anyone had trusted her with the whole thing."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "Lucan on the Ridge", "part": "PART TWO: THE MARCHES", "paras": ["*The Eighth Rule of Mapmaking: Fast is a fine speed, but true is a finer one.*", "The mist on the ridge was thick and tasted of wet wool. Tam and Odd climbed over a low stone wall, their boots squelching in the damp grass. Dumpling followed. He moved with the heavy, deliberate air of a creature who had seen many walls and respected none of them.", "A hundred yards away, a camp gleamed in the grey light. Three striped tents stood perfectly square. A brass table folded open like a metal flower. A telescope sat on a tripod, pointing at the sky as if it were waiting for an answer. Servants in clean blue aprons stirred a large cauldron that smelled of roasting onions and good bread.", "In the center, Lucan Ravel stood in his spotless green coat. His fair hair was combed back, not a strand out of place. He was speaking to Ines, who scribbled notes with quick, sharp strokes. Bram, large and gentle, held a coil of rope nearby.", "Odd leaned down, his red hair sticking up in a wild halo. \"They look like they are about to have a garden party,\" he whispered, his gap-toothed grin widening. \"I bet the mud there is polite.\"", "Tam adjusted her satchel. Her patched brown coat hung loosely on her frame. She looked at the brass telescope, then at the small, dented compass in her own pocket.", "\"Let's see if the mud is as polite as it looks,\" Tam said."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["Lucan turned as they drew near. His gaze drifted over Tam’s ink-stained fingers and Odd’s caked boots before landing on the mule. He offered a small, precise nod.", "\"Master Finch’s team,\" he said. His voice was cool, like water from a deep well. \"You are ahead of schedule.\"", "\"Hard to fall behind when the path is a straight line,\" Odd muttered, his grin widening.", "Lucan unrolled a map on the brass table. It was exquisite. Tiny trees stood distinct, each one separate. The coastline breathed with a delicacy that felt alive. Hills were shaded with fine, parallel lines. It was a map made by someone who had never had to guess.", "Tam unrolled her own map on the damp grass. It was a sheet of rough paper, ink-stained at the corners. The lines were thick, sometimes wobbly. The trees were blobs. The river was a squiggle.", "Side by side, Tam’s map looked like a fence that had lost a fight with a goat.", "Lucan studied the difference, his gold compass catching the faint light. He did not smile, but he did not frown either.", "\"Efficient,\" he said to Ines. \"But precise. I wonder if the Guild will prefer speed or truth.\""], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["The cold feeling settled in Tam’s stomach, settling with the same heavy weight it had when the Academy children drew their first lines while hers smudged into a mess. It was the feeling of being small in a room full of giants, though perhaps that was just the way the world felt when you were eleven and holding a crooked line.", "Lucan looked at her, and his tone was not unkind. \"It is very brave of you to have entered, Tam Marrow. Truly. Most would not try.\"", "Brave. Not good. Not skilled. Just brave.", "Bram, without a word, broke off a slab of fresh bread and slid it across the table toward Tam, a kind, silent offering that smelled of yeast and warmth. Ines, meanwhile, was watching Tam’s measuring rope, which was a thick cord knotted at regular intervals and worn smooth by use.", "\"What is that?\" Ines asked, her eyes bright. \"A standard surveyor’s line?\"", "\"It’s a dock rope,\" Tam said. \"Knots for measuring.\"", "Ines nodded, her interest piqued. She looked at the knots, then at Tam, as if she were seeing something new.", "Tam took a breath. The cold was still there, but she reached into her satchel and pulled out the small, stitched notebook. The Yesterday Book.", "She opened it to the last page. The two-bend river. She compared it to the one before. It was straighter. A little cleaner.", "It was enough."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["\"It's not for me to be as fast as you,\" Tam said, her voice steady even though her fingers still trembled slightly. \"It's for me to be better than I was on the Thornwood.\"", "Lucan blinked, the word hanging in the air between them. He looked at the notebook, then back at Tam, a small, sharp doubt flickering across his face. He had a gold compass, and he had a name, and he had a father who expected victory, but he had no record of his own small, quiet victories.", "Odd grinned at Tam, a wide, sun-drenched smile that lit up his red hair. He patted her shoulder once, firmly.", "Lucan turned away sharply, the moment passing. \"My team must press on to the marsh,\" he said, his voice clipped. \"We have much ground to cover.\"", "He rolled up his map with swift, practiced movements, and the brass table folded back into itself. The camp began to disassemble, a machine unwinding. Tam tucked the Yesterday Book back into her satchel. The cold was still there, but it was no longer heavy. It was just cold. And she was warm."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["As Lucan’s team packed their tents, Ines slipped a small piece of paper into Tam’s hand. It was a diagram, quick and neat, showing a way to estimate slope without a full instrument.", "Tam looked at Ines. Ines shrugged, a small, quick motion, and turned back to her work.", "Tam hid the paper in her satchel, right next to the Yesterday Book. She gave Ines a look, a nod of thanks that said more than words could.", "Lucan’s team set off at a brisk trot toward the silver-grey flats on the horizon. The tents were gone, the brass table was folded, and the camp was empty.", "Odd watched them go. His grin had faded. He looked at the distant flats, where the grass seemed to shimmer with moisture.", "\"That's the Greywater,\" he whispered. \"Nobody in my family will go in there. The map says meadow. My father says otherwise.\"", "Tam looked at the horizon. The flats were beautiful, and they were waiting."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "The Greywater", "part": "PART TWO: THE MARCHES", "paras": ["*The Ninth Rule of Mapmaking: When you are lost, stop, look, and draw where you are.*", "The Greywater did not look like a marsh. It stretched out, bright and still, holding the fading light of dusk until it looked like a bowl of spilled metal. Silver reeds stood in dense rows, trembling so slightly that the air seemed to shiver above them. The smell hit Tam first: cold, metallic, like licking a wet penny.", "\"North,\" Odd said, pointing a long finger at the treeline. \"We keep to the north edge. My father says the south is soft. Soft means gone.\"", "But there was a channel. A long, shining strip of water cut through the reeds to the south. It looked inviting. It looked like a shortcut that would save them an hour of walking.", "Tam looked at the channel. She looked at the reeds. She looked at Odd, who was already shifting his weight toward the open water, his gap-toothed grin wavering.", "\"The map says meadow,\" Odd said softly. \"But the map is old.\"", "They followed the shine. By the time the sun slipped below the horizon, the reeds all looked the same. The north edge had vanished into the grey twilight. Tam stopped, her boots sinking into mud that squelched wetly against her soles.", "\"Where is north?\" she asked.", "Odd did not answer. He was looking at the water, and his hands were shaking."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["The panic began in Tam’s chest and worked its way down to her fingertips. Her throat closed up, making each breath feel like pulling a thread through a tight needle eye. The reeds rustled around them, a dry, rasping sound that tickled the back of her neck like a cat’s rough tongue.", "\"Run?\" Odd suggested. The word was barely a whisper.", "Dumpling let out a high-pitched snort, her nostrils flaring wide. The mule shifted her heavy weight, refusing to take another step forward.", "Tam wanted to shout. She wanted to throw her satchel into the water. She wanted to be anywhere but this silent, drowning place. Her hands trembled so badly that the quill in her pocket felt like a splinter.", "Then, in the back of her mind, clear as a bell, came Master Finch’s voice.", "*Stop. Look. Draw where you are.*", "Tam forced her legs to work. She sat down on a dry tussock of grass, her knees knocking together. She took a deep breath, which rattled in her lungs. She pulled out her paper. She did not think. She did not worry. She looked at the world in front of her, and she began to draw."], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["The drawing was hardly beautiful. The lines jagged, the ink blotchy, but the shape was true. Tam turned the paper over and stared. There were three willows, all leaning to the right. The black pool was fed by a stream entering from the same side. The reeds were thick on the left but thin and sparse on the right.", "\"Odd,\" Tam said. Her voice was steady.", "He looked at her, eyes wide, his red hair sticking up in tufts.", "\"The wind,\" she said, tapping the paper with her quill. \"It blows from the left. The water feeds from the left. But look at the reeds here.\" She pointed to the right side of her sketch. \"They are thinner. The ground must be firmer there.\"", "Odd stared at the paper, then at the reeds surrounding them, then at the right side of the channel. He chewed his lip, a nervous habit that always meant he was thinking hard.", "\"Thinner,\" he repeated. \"Yes. I see it.\"", "Tam did not know if she was right. She was not certain the path would hold their weight. She was only a little surer than she had been yesterday, and that was enough. They began to move, stepping carefully toward the thinner reeds, testing the ground with the toes of their boots before committing to each step."], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["They found a reed island the size of a barn just as the stars came out, and the ground there was hard, which was a mercy. The air was cold, biting at Tam’s cheeks, but they did not make a fire. Dry reeds were precious, and the water was too close for comfort, so they shared a hard cheese and some crusts of bread instead. Dumpling ate a mouthful of reeds with great dignity, chewing them slowly as if they were expensive hay.", "Odd sat with his back against a clump of grass. \"My grandmother,\" he began, his voice low, \"crossed this marsh in a storm. She had an egg basket on her head. She said the water was angry, but she was angrier. She got to the other side with only three eggs broken.\"", "Tam laughed. It was a small, shaky sound, but it broke the tension. She pulled her wet blanket tighter around her shoulders. Sixpence the pigeon was tucked under her arm, warm and silent, her white patch glowing faintly in the starlight.", "She opened the Yesterday Book. The page was blank. She dipped her quill.", "*Was lost. Stopped. Drew. Was less lost.*", "She wrote it, and the letters felt straighter than they had any right to be."], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["The marsh settled into a thick, listening silence, broken only by the distant, complaining call of a night bird. Tam felt her eyelids growing heavy, her head nodding against her shoulder, while Odd sat with his eyes closed, his breathing slow and steady.", "Then she heard it.", "A splash. Faint, wet, and far away.", "Tam’s eyes snapped open, and the drowsiness vanished. She leaned forward until her nose almost touched her knees, her hands planted flat on the cold grass. The splash came again, followed by a sound that was definitely not a bird. It was a voice, thin and frantic, tearing through the still air.", "\"Help!\"", "The cry drifted across the black water, desperate and swallowed by the dark. Odd sat up abruptly, his face pale in the starlight, his hands gripping the wet grass as if the ground might sink.", "\"Someone's in the water,\" he whispered, his voice shaking.", "Tam looked out into the void. The shouting had stopped. The only sounds left were the soft lapping of water against the reeds and the loud, thumping rhythm of her own heart."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "The Village That Wasn't There", "part": "PART THREE: LOW GROUND", "paras": ["*The Tenth Rule of Mapmaking: Never trust a map you did not walk.*", "The light in the marsh was the color of old dishwater. Tam moved forward first, her boots squelching with every step, while Odd followed, his red hair damp and sticking to his forehead like wet seaweed. They searched the black water until their fingers ached, and found nothing but a single leather boot floating upside down and a broken surveying pole bobbing in the reeds.", "\"It was a heron,\" Odd said, pulling the boot from the water with a stick. The leather was stiff and dry, smelling of old rain. \"A very loud heron.\"", "Tam did not laugh. She dropped the boot into her satchel. It made a dull thud. She pointed toward the grey shapes ahead. \"Dry ground. Let’s walk.\"", "They climbed a small rise of solid earth, and the silence changed. The air smelled of wet stone and decay. Before them stood a ring of broken houses. The roofs were gone, leaving the wooden beams to poke out into the sky like broken teeth. In the center, a church stood half-collapsed, its bell lying on its side, choked with thick green ivy.", "\"That is Saltmere,\" Tam said, though she had only seen the name on Finch’s map.", "The village was empty. It was dead. It was waiting for them."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["Tam unrolled the map she carried for luck. The paper had grown brown and soft, feeling like a well-worn sock against her ink-stained fingers. On the parchment, Saltmere was drawn in careful, confident ink: a bustling town with a wide, straight road leading directly to the coast. It looked safe. It looked important.", "\"Here,\" Tam said, tapping the line with a knuckle. \"The road goes that way.\"", "They walked into the gap between the houses, expecting the solid ground the map had sworn them to. Instead, their boots sank into a deep, sucking peat bog that stretched out into the distance, hiding its dark water under a skin of wet grass. The map had promised a journey. The ground had offered a trap.", "Tam sat down on a broken wall, her legs dangling over the void, and felt suddenly as small as a button on a coat that didn't fit. She felt foolish, too. For the first time, the idea that maps could be wrong did not seem like a theory. It felt like a fact that could swallow a person whole.", "\"The map is lying,\" she whispered.", "Odd sat beside her, his face pale. \"Or it is remembering a world that is gone.\""], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["Tam remembered Finch’s voice, gravelly and kind. *A map is a promise.* If the promise was broken, someone had to draw the truth.", "She pulled her pen from her satchel. Her hands trembled, so she braced her knee against the stone to steady them. She did not draw a town. She did not draw a road. She drew what was there. She sketched the jagged beams of the ruined houses. She outlined the dark, wet mouth of the bog. She captured the silence.", "It was the most honest line she had ever made. It was not pretty. It was not grand. It was true.", "She wrote a small note beneath the drawing, her letters careful and slanted. *Old road drowned. Do not walk here.* It was a tiny thing, just a few lines of ink on a scrap of paper. But if a stranger ever came to this place, trusting a map that had forgotten the water, they might stop. They might live.", "Tam rolled the paper tight and tucked it into her pocket, next to her heart."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["Inside the ruined church, the air was cold and smelled of damp moss. Odd found a section of stone wall that had survived the collapse. On it, scratched deep into the rock with a sharp nail, were names and dates.", "\"Look,\" Odd said, his voice hushed.", "Tam leaned in. The scratches were old, the stone worn smooth by time. *Aldis, 1402. Elowen, 1415.* And near the bottom, written with great urgency: *GOD KEEP THE GREYWATER OFF THE ROAD.*", "Tam took a piece of charcoal from her kit. She looked at Odd, who nodded, his gap-toothed grin soft and serious. She scratched their names next to the old ones. *Tam. Odd.* Then, with a steady hand, she drew a tiny compass rose.", "For a moment, she was not alone. She was part of a long line of people who had walked through this dark place, needing the ground to hold, needing the truth to be found. She felt a warmth in her chest that had nothing to do with the weather."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["They climbed the ridge above the ruins to get a better view of the marsh. The sky was a pale, washed-out blue. Empty. Still. Tam was wiping ink from her fingers when a grey shape dropped out of the air.", "Sixpence landed on her shoulder. Her white chest patch flashed. Her little feet gripped the thick wool of Tam's coat. A small note was tied to her leg. Tam untied it. Her hands trembled with sudden hope.", "*Ankle mending. Shepherd's wife makes better soup than I do. How is the line today?*", "Tam grinned. The sound of it broke the quiet.", "But then the ground beneath her boots gave a low, slow shudder. From the western horizon, a dark line of clouds was rolling in. The air began to taste of metal and rain. Thunder rumbled, deep and slow, like a giant turning over in his sleep."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "Rain", "part": "PART THREE: LOW GROUND", "paras": ["*The Eleventh Rule of Mapmaking: Ink runs. Memory doesn't, unless you let it.*", "The rain did not fall; it arrived. A heavy grey curtain dropped from the sky to the mud, not a shower, not a drizzle, but a full siege. For three days, the water drummed against the oilcloth and hammered the tents, turning the high moor into a wet, sucking sponge that swallowed every footstep.", "Tam and Odd worked until their fingers cramped. They tied the surveying kit down with every knot she knew from the docks: double hitches, bowlines, and reef knots held the boxes tight. Dumpling, the mule, wore a burlap sack over her head and back, secured with a rope that Tam had to keep re-tightening. Her ears twitched inside the cloth. She gave Tam a look of such profound, aristocratic betrayal that Tam had to turn away to hide her smile.", "It was cold. It was wet. It was the kind of weather that made you wish you were a stone, because stones did not have to worry about their ink. But mostly, it was just raining. And raining. And raining."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["By the third day, the stream had become a river, and the river had become a threat. The water was brown and angry, churning over stones that no longer wanted to be footing.", "\"Easy, Dumpling,\" Tam whispered.", "Dumpling, who had been walking with the dignity of a queen, suddenly found that dignity incompatible with the slick, mossy rock beneath her hoof. With a shocked grunt that vibrated in her chest, the mule sat down. Hard.", "Her left side went under. The satchel, slung over her flank, slipped beneath the surface.", "Tam did not think. She plunged in. The water was icy, shocking her lungs with a cold breath. She grabbed the wet canvas of the satchel, hauled it out, and scrambled up the bank, gasping, shivering, and absolutely furious.", "She ripped the oilcloth open. Water poured out in a thick, ropy stream. Her hands trembled as she held the bag over the mud.", "\"Right,\" she said to the mule, who was now licking a stone. \"We are going to need a better strategy.\""], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["They found a hollow under a rocky overhang, a small dry pocket in the side of a hill. Tam sat on a flat stone, the satchel in her lap. Her hands shook so badly she could barely untie the laces.", "Inside, the maps were there. But they were no longer maps.", "She unfolded the largest sheet, the one she had spent seven days measuring and drawing. The ink had run. The careful lines of the coast had bled into a dark, jagged river. The Thornwood, which had been a neat pattern of hatching, was now a large, dark bruise on the paper. The colors had smeared together until the land looked less like a place and more like a mess made by a blind mouse.", "Odd stopped talking. He had been making jokes about the mud, but now he watched her hands.", "Tam stared at the page. The grey, blue, and black swirled together, a chaotic smear of what had once been truth. She held it up to the dim light.", "\"It's gone,\" she said. Her voice was very quiet. It did not sound like her."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["The cold feeling crawled back into her chest, settling with the same flat, heavy thud that lived in her bones whenever she saw the Academy children’s work. She began too far behind. That was the fact. She started at the bottom, and she could not climb fast enough.", "Lucan was somewhere ahead, holding a dry map. He had a dry team, a method that worked, and he was drawing the world clearly while Tam held a wet, ruined mess.", "She thought of the Yesterday Book. She reached for it, hoping for the small comfort of her own progress. But even that was damp. Last night’s river, drawn with such care, had run into a dark, wobbly blur. Even her small, daily victories had been washed away.", "The rain tapped against the rock above them. *Tap. Tap. Tap.*", "Tam put her head on her knees. Her braid, tied with its bit of blue string, hung down over her face. She did not cry. She just sat there, letting the burden sink into her shoulders."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["Odd sat down beside her, his red hair sticking up in the damp air, his usual gap-toothed grin completely gone. He did not laugh, nor did he make a joke about the mud or the mule.", "\"My grandfather,\" he said softly, \"lost his whole net in a storm once. The whole thing. Gone.\"", "Tam kept her head down, her blue string hanging loose.", "\"He sat on the dock,\" Odd continued, \"and looked at the water for one hour. I watched him. Then he took out his knife.\"", "Tam lifted her eyes slightly.", "\"He started a new one,\" Odd said. He reached into his pocket and pulled out a crust of bread, dry and hard as a dock plank. He broke it in half and held a piece out to her.", "\"You don't have to start today, Tam,\" he said. \"But you do have to start again.\""], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "Starting Over", "part": "PART THREE: LOW GROUND", "paras": ["*The Twelfth Rule of Mapmaking: The second try is not the first failing twice.*", "The rain had stopped, leaving behind a grey mist that clung to the thornbushes. It looked like a cold, damp sock. Tam stared at the wet, ruined map on the mud floor. The ink had run into black rivers. Her careful lines had smeared into a mess that resembled a toddler's practice in mud. Beside it lay the one sheet of good paper left. It was dry, white, and terrifyingly large.", "She had six days. One sheet.", "Odd sat on a dry log, watching her with wide eyes. He did not laugh. He did not make a joke. He just watched the girl with the blue string in her braid, who looked smaller than she ever had.", "Tam took a breath that felt like pulling a rope out of deep water. She smoothed the paper against the flat stone. The surface was rough under her fingertips. She dipped her pen. The ink was dark and ready. She did not look at the ruin. She looked at the blank space.", "She began."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["Her hand moved, and to her surprise, it did not shake.", "She drew the Thornwood path first. The bends came to her naturally, not as rules she had memorized, but as the shape of the ground itself. She remembered the smell of the wet bark, the way the light filtered through the high leaves. Then came the River Aln. She drew the crossing where they had hauled the mule across, marking the shoals with small, precise dots.", "She had walked every step. She had looked hard at every bend. The map was in her, more real than the paper.", "Each line came easier than the first. The strokes were quicker, straighter. She was not copying what she thought a map should look like. She was drawing what was there. The hills leaned the right way. The coast curved exactly where it had curved when she had stood there and watched the water lap against the rocks.", "Odd leaned forward, his gap-toothed grin returning, small and quiet."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["\"It's better,\" Odd whispered, his eyes wide. \"It's a lot better.\"", "Tam held the ruined map from yesterday beside the fresh one. The old lines, which she had been so proud of, looked childish now. Crooked and hesitant. The new map breathed. The curves were smooth. The measurements of the bends were truer, sharper.", "She laughed. It was a short, surprised sound that startled a bird from a nearby branch.", "\"I walked it,\" she said, her voice cracking slightly. \"I actually walked it.\"", "She looked at the two maps, the failure and the success, side by side. The ruin had not wasted her time. It had stripped away the pretense, the wish to be seen, the fear of being behind. It had left only the land. And the land, she was learning, did not care who drew it. It only cared that it was drawn true.", "She capped her pen with a click that sounded like a small, hard promise."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["Tam pulled the small stitched notebook from her satchel. The dampness had made the edges soft, like bread that had been left in the rain. She opened it to the first page, then to the last.", "The first river was a wobble. It was a shaky line that trembled under the pressure of her worry. The river from a week ago was straighter, but it still had a blot at the corner. And there, on the final page, was today's line. It was strong. It was sure.", "It was a staircase going up.", "She had come a long way. She could see it now, not as a comparison to the Academy children with their gold compasses, but as a journey she had taken herself, one careful step at a time. Even the ruin had taught her. It had taught her that failure was just a draft.", "She picked up her pen and wrote beneath the new line, her hand steady:", "*Lost a week. Gained a week. Better.*"], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["Sixpence, the grey pigeon with a white patch on her chest, landed on Tam’s shoulder with a soft, dusty thud. She carried a small, dry note tied to her leg, and Tam read it quickly, then nodded once before scribbling a tiny reply. The sketch of the new coast was neat and clear, and she tied the paper to Sixpence’s leg, pointing upward into the mist.", "Sixpence launched away, a grey dart against the grey sky.", "As they began to pack their satchels, Odd squinted through the thinning fog toward the far edge of the marsh below. His red hair stuck up in the damp air, and his gap-toothed grin had vanished.", "\"Tam,\" he said, his voice tight and low. \"Look.\"", "Tam followed his gaze. On the distant mud, a line of small figures was moving slowly. A green flag waved frantically in the damp air. Someone was waving. Hard. Fast.", "Odd grabbed her arm, his fingers digging into the sleeve of her patched coat. \"It’s them,\" he said. \"It’s the Ravel team.\""], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "Lucan's Mistake", "part": "PART THREE: LOW GROUND", "paras": ["*The Thirteenth Rule of Mapmaking: A map that drowns a traveler is no map at all.*", "The mud did not care about green flags or silver buttons. It simply held them. The cart sat low, its wooden wheels buried to the rims, while the horses stamped and snorted, their breath misting in the cold air. Bram, the large assistant, stood waist-deep in the black slurry, his knees locked and his face pale. Ines was perched on a tuft of wet sedge, her small boots dangling over the water, looking as if she might float away.", "And Lucan. Lucan stood on a narrow hummock of reeds, his green coat soaked through to the skin, his fair hair plastered to his forehead. He clutched a rolled map to his chest, his knuckles white.", "Tam unrolled her own sheet. There, in her shaky ink, was a thick brown band of danger. Beside it, Lucan’s map showed a bright green field, dotted with little trees. The land around them was a brown, sucking void.", "\"The meadow,\" Odd said, his voice flat. \"That’s a very nice meadow, Lucan.\"", "Lucan did not look up. He stared at the water, his face tight with a fury that had nowhere to go."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["The reeds swayed in the damp wind, whispering against Tam’s ear. She could smell the rot of the marsh, thick and sweet, mixed with the sharper scent of wet wool. She looked at the mud, then at Lucan. He was trembling, not from the cold, but from the fear of being seen in such a state.", "She remembered the ridge. She remembered the green coat and the gold compass, and the way he had looked at her crooked line as if it were a personal insult. She could turn away now. She could walk back to the cart and let the mud take them. It would be easy, and perhaps fair, in a way.", "Odd waited. He did not push her. He just stood there, his red hair sticking up in the wind, his gap-toothed grin finally gone.", "Tam rolled her map and tucked it into her satchel. She looked at Odd.", "“We’re going in,” she said.", "Odd exhaled sharply, a sound like a sail catching the wind. He looked at her, then at the mud, then back at her. “Right,” he said. “I’ll get the rope. Dumpling, you stay with the horses. You’re too heavy.”", "The mule brayed, which was not an argument, but it was an opinion."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["Odd knew the mud better than he knew his own mother. \"Don’t step on the dark patches,\" he instructed, wading out with surprising grace for a boy so gangly. \"The light ones are solid reed. The dark ones are soup.\"", "He threw a coil of thick hemp rope across the slurry. It landed with a heavy splash. Tam grabbed the end and hauled. The rope bit into her palms, rough as fish scales. She pulled, and Odd pulled, and the water sloshed violently.", "Bram came out with a sound like a giant boot being pulled from a puddle. He collapsed on the solid ground, gasping, his boots caking the clean earth. Ines was next, small and shivering, her boots dripping black water.", "Then the horses. This was harder. They kicked. They snorted. The mud sucked at their hooves with a sticky, relentless pull.", "\"Pull!\" Odd shouted, his face red. \"Pull like you mean it!\"", "Tam grunted, her arms burning. The blue string in her braid whipped against her neck. She thought of the Lowtide Docks, of the tides that pulled the boats out, of the heavy nets. She pulled with her whole body.", "With a final, wet squelch, the lead horse broke free."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["Lucan sat on a dry stone, his knees drawn up to his chest. His coat was ruined, his hair a mess, and he looked remarkably small. He gazed at his map, the beautiful one with the green meadow. Then he looked at Tam’s map, the one with the brown, ugly, true band of mud.", "\"It said meadow,\" he said, his voice quiet. \"It said meadow because I drew it from the ridge. From a distance. I never walked it.\"", "He did not look at her. He looked at his hands, stained black to the wrist.", "\"Rule the Tenth,\" Tam said. It came out softer than she meant.", "Lucan’s head snapped up. His eyes were wide. \"I didn’t know there was a rule.\"", "\"There are twenty,\" she replied. \"I’m still learning them.\"", "He stared at her. For a moment, the air between them was very still. The mud dripped from his boots. He looked at the map in his hand, then at the ground beneath his feet. The green meadow was a lie. The mud was the truth.", "He slowly rolled the map up. He did not throw it away. He just held it tighter."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["The sun was sinking now, turning the marsh into a field of dark water and rust-colored reeds. They had lost a whole day, gone into the mud, the rescue, and the silence.", "Five days remained. Three days’ walk separated them from Verrin. The Guild Hall waited, and with it the Grand Survey and the judging.", "Lucan’s team could not map. No dry paper, no dry ink, and no time. They would go home, pack the cart, load the horses, and ride back to the city of bridges and steep lanes.", "A cold weight settled in Tam’s stomach. She watched Odd check the rope for damage, then looked at Lucan, who was staring at the water.", "\"Your map’s better than mine,\" Lucan said.", "He did not look up. He did not smile. He did not make it a joke or a compliment. He just said it, plain and flat, like a fact about the weather.", "Tam blinked. She had expected anger. She had expected pride. She had not expected this. It was the first thing he had ever said to her that wasn’t polite."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "The Darkest Night", "part": "PART THREE: LOW GROUND", "paras": ["*The Fourteenth Rule of Mapmaking: On the darkest night, draw the smallest line.*", "The fire popped, spitting orange sparks into the dark. Around them, the world was black and silent, save for the distant, rhythmic thrum of the sea far below the cliff edge. Tam sat on a flat rock, her knees drawn up to her chin. She had the sum written out in her head, and she had checked it twice, and both times the answer was the same: not enough time.", "Lucan’s team had vanished into the night, their lanterns bobbing like distant, confused stars as they searched for the old road back to Verrin. That left Tam and Odd with the Hollow Cliffs. Two days’ work. Four days left.", "Odd did not look at her. He sat by the fire, poking a knot with a stick, sending up a thin trail of white smoke. His red hair was matted with ash, and his gap-toothed grin was gone, replaced by a tight, serious line. He knew the math. He always knew the math. He just knew it differently than she did, perhaps, because for him, the distance was measured in miles, and for her, it was measured in lines she hadn’t drawn yet.", "Tam watched the smoke curl upward and disappear. The air was cold, biting at her nose, carrying the sharp, salty scent of the cliffs. She looked at her hands, ink-stained and trembling slightly, and wished they were somewhere else. Anywhere but here, on this rock, staring at the impossible."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["Tam dragged her satchel close, the leather creaking against her chest. Inside, the maps lay in a damp, crumpled heap, their ink smudged into unreadable blots. But her mind kept pulling her back to Lucan’s charts. They were neat. They were precise. They were perfect.", "She pictured the gold compass swinging on his chain, catching the firelight, and a heavy, cold weight settled in her stomach. It felt exactly like the feeling she had every time she watched the Academy apprentices draw straight lines with the ease of tying their boots.", "*You began too far behind,* the old whisper hissed, quiet and familiar. *You learned your letters at nine. You draw crooked lines. You will never catch up.*", "It was a lie, she knew. Yet the tightness in her throat suggested it might be true.", "She glanced at Odd. He was still poking the fire, his red hair matted with ash, his gap-toothed grin replaced by a serious, tight line. He didn’t offer comfort. He didn’t try to fix the problem. He simply sat there, solid as a dock piling, letting the silence hang in the cold air.", "\"I'm not going to make it,\" Tam said. Her voice sounded thin, scraped raw by the wind. \"I've done the sums, Odd. Twice. It's not possible.\"", "Odd stopped his stick. He looked at her, eyes wide and dark, then back at the flames. He didn’t argue. He didn’t say it would be fine. He just sat, and the fire crackled, and the night stretched out before them, long and dark and waiting."], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["A soft thump landed on the fire-ring stones. Tam flinched, then froze. It was S
