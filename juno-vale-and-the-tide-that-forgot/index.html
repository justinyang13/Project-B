ht.", "*Clang.*", "It was the sound of home.", "Teo shook his head, still staring at the water. \"I can’t believe it,\" he said. \"I fixed the gears. I oiled the hinges. I didn’t even know what I was doing until the end.\"", "Juno put a hand on his shoulder. \"You did the work. I just listened.\"", "Teo looked at her, then at the sea. \"Yeah,\" he said, a small smile breaking through. \"I guess that’s why it worked.\"", "Grandpa Ozzie tapped his driftwood cane on the floor. \"Go down, children. The town needs to see their keeper.\""], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["They took the stairs two at a time. Juno’s yellow raincoat flapped in the draft. Teo’s green cap was gone, his messy black hair sticking up in the dark.", "When they burst out of the lighthouse door, the bay was transformed. The water was deep now, black and shiny, reflecting the moon and the lanterns carried by the townspeople.", "The crowd was silent for a moment, then they cheered. It was a soft, happy cheer, full of relief. Mrs. Marchetti was there, tears in her eyes, clapping. Mayor Pruitt was holding his doughnut, looking stunned.", "And there, at the very back, near the silver car, was Mr. Grubb.", "He was not cheering. He was standing very still, his shiny grey suit looking out of place in the muddy, wet night. He looked at the water, then at the boats, and then at Juno.", "Juno felt a spike of fear. But she held her breath and listened. The sea hummed against the lighthouse base, a low, steady song.", "Mr. Grubb’s shoulders dropped. He reached into his pocket and took out a small, brass object. It was the Moon Gear.", "He looked at it, then at the sea. He didn’t throw it. He didn’t sell it.", "He put it back in his pocket.", "Then, slowly, he walked to the bakery cart. He took a plain doughnut from the display, paid the baker with a crisp note, and took a bite. He chewed, swallowed, and looked at the water.", "\"I think,\" he said, his voice small, \"that the parking lot is a bad idea.\""], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["A car door opened on the harbor road. The headlights cut through the mist.", "Mom stepped out of the car. She was holding a suitcase, her work bag over one shoulder. She froze when she saw the water.", "\"Juno?\" she called out. Her voice was thin, worried. \"What is going on?\"", "Grandpa Ozzie walked down the steps, his cane tapping against the wet stones. He didn’t say a word. He just pointed at the sea.", "Mom followed his gaze. She stared at the *Dolly Marigold*, rocking gently in the new water. She looked at the boats, at the crowd, at the lighthouse.", "\"I thought...\" she started, then stopped. She looked at Juno. \"You did this?\"", "Juno nodded.", "Mom dropped her suitcase. It hit the ground with a thud. She ran to Juno, hugging her tight. Juno held on, smelling the rain and the salt.", "\"I missed you,\" Mom whispered.", "\"I missed you too,\" Juno said. \"But the sea missed the bay more.\"", "Grandpa Ozzie laughed. It was a loud, bright sound that broke the tension. \"Ivy,\" he said, looking at the water. \"She would have laughed too.\"", "Biscuit, the fat orange cat with the chewed left ear, walked out of the shadow of the lighthouse. He stretched, yawned, and then walked straight to the water’s edge. He looked at the waves, then at Juno.", "\"I suppose,\" Juno said, \"he’s happy too.\"", "Barnacle sighed from Juno’s hand. \"Honestly. The cat is more dignified than the humans.\""], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["The next morning, the sun rose over a bay that was alive.", "Gulls were back, squawking and diving. The fish market smelled of fresh catch, not rot. The boats were bobbing, ready to work.", "Juno sat on the porch of the bait shop. The green Tide Keeper’s Log was open in her lap. The brass clasp was undone. She uncapped her pen.", "Her hand trembled slightly. This was new. This was different.", "She wrote: *Day One. The sea remembers. We are still here.*", "She looked out at the water. Old Fathom, the giant turtle, was swimming in the distance, his mossy shell barely visible above the waves. He was free.", "Barnacle crawled onto the porch railing. \"So,\" he said, adjusting his chipped blue teapot shell. \"What now, Keeper? Do we wind the clock again? Do we fix the world?\"", "Juno smiled. She looked at Teo, who was fixing a net with Grandpa. She looked at Mom, who was washing her face in the basin. She looked at the sea.", "\"No,\" Juno said. \"We just listen.\"", "The sea lapped against the shore, gentle and steady. It was not a command. It was a conversation. And for the first time in a year, Saltmarsh Harbor was part of it.", "Juno closed the log. She was not just loud anymore. She was home."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "The Town That Stopped Breathing", "part": "PART ONE: THE MUD", "page": 1}, {"n": 2, "title": "The Attic", "part": "PART ONE: THE MUD", "page": 6}, {"n": 3, "title": "Barnacle", "part": "PART ONE: THE MUD", "page": 11}, {"n": 4, "title": "Teo Marchetti", "part": "PART ONE: THE MUD", "page": 16}, {"n": 5, "title": "Mr. Grubb Makes an Offer", "part": "PART ONE: THE MUD", "page": 21}, {"n": 6, "title": "What the Log Said", "part": "PART TWO: THE THREE KEYS", "page": 26}, {"n": 7, "title": "The Old Lighthouse", "part": "PART TWO: THE THREE KEYS", "page": 31}, {"n": 8, "title": "Old Fathom", "part": "PART TWO: THE THREE KEYS", "page": 36}, {"n": 9, "title": "The Wreck of the Dolly Marigold", "part": "PART TWO: THE THREE KEYS", "page": 41}, {"n": 10, "title": "The Silver Car", "part": "PART TWO: THE THREE KEYS", "page": 46}, {"n": 11, "title": "The Deep Court", "part": "PART TWO: THE THREE KEYS", "page": 51}, {"n": 12, "title": "Gull Rock", "part": "PART THREE: THE STORM", "page": 56}, {"n": 13, "title": "Grandpa Forgets", "part": "PART THREE: THE STORM", "page": 61}, {"n": 14, "title": "Grubb's Office", "part": "PART THREE: THE STORM", "page": 66}, {"n": 15, "title": "The Falling-Out", "part": "PART THREE: THE STORM", "page": 71}, {"n": 16, "title": "The Storm Bell", "part": "PART THREE: THE STORM", "page": 76}, {"n": 17, "title": "Two Keepers", "part": "PART FOUR: THE GRAND LOW", "page": 81}, {"n": 18, "title": "Borrowed Time", "part": "PART FOUR: THE GRAND LOW", "page": 86}, {"n": 19, "title": "The Grand Low", "part": "PART FOUR: THE GRAND LOW", "page": 91}, {"n": 20, "title": "The Tide Comes Home", "part": "PART FOUR: THE GRAND LOW", "page": 96}]};

const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
</body>
</html>
