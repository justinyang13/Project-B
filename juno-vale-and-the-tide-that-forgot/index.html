<script>
const D = {"title": "Juno Vale and the Tide That Forgot", "sub": "A Saltmarsh Harbor Adventure", "pages": [{"no": 1, "ch": 1, "ctitle": "The Town That Stopped Breathing", "part": "PART ONE: THE MUD", "paras": ["The rain fell in heavy, grey sheets, blurring the world into a watercolor smudge. Juno pressed her nose against the cold glass of the silver car, watching Saltmarsh Harbor shrink into the mist. It didn't look like the postcards Mom had sent. It looked tired. The harbor mouth, usually a churning throat of blue-green water, was a flat, silent expanse of grey mud. Boats sat tilted at drunken angles, their hulls half-buried like old teeth in a dirty gum.", "\"Sorry, babe,\" Mom said, her hands tight on the steering wheel. \"I know it’s a lot. But I have to leave for that conference tomorrow morning. You’ll have fun with Grandpa, won’t you?\"", "Juno pulled her yellow raincoat tighter. It was too big for her shoulders, the cuffs hanging like sad wings. She hadn’t spoken much since they’d left the city three hours ago. In the city, things were loud and bright and had rules. Here, the air smelled of low tide and regret.", "\"Nine days,\" Juno murmured, mostly to herself. \"Just nine days.\"", "Mom glanced at her, her eyes soft and guilty. \"You’re strong, Juno. You’ll be brave.\"", "Juno bit her lip. Brave. That word felt like a stone in her shoe. She wasn’t brave. She was just loud, and she was terrified of being a suitcase nobody unpacked. She looked out the window again. A gull sat on a bollard, looking profoundly grumpy, as if it had been waiting for the sea to return for a very long time."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["The car turned onto Harbor Road, the wheels crunching over wet gravel. The house appeared through the rain: tall, narrow, and leaning slightly to the left, like an old man trying to stay upright. It was painted a faded peacock blue, the white trim peeling in strips. Below the front door, a sign hung by a single rusty nail: OZ’S BAIT & TACKLE. CLOSED.", "Juno’s stomach gave a little flip. It felt like walking into a museum of things that no longer mattered.", "\"Stay right here,\" Mom said, stepping out into the drizzle. She opened the trunk and began pulling out suitcases. Her movements were quick, efficient, the way she did everything when she was trying to be kind but didn’t have time for it.", "Juno sat in the back seat, watching the rain drip off the roof. A fat orange cat with a chewed left ear sat on the windowsill, watching them back. It blinked slowly, its tail twitching. It looked like it had been waiting for this moment, too.", "\"Hello,\" Juno whispered to the cat.", "The cat yawned, revealing a tiny pink tongue, and then turned its back on her to groom its paw. Juno felt a pang of sadness she couldn’t name. She was the new kid again. Only this time, there was no teacher to distract her, and the walls were made of salt and silence."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["The front door opened before Mom even reached for the key. A tall figure stepped out, leaning heavily on a cane made of driftwood. He was enormous, draped in a heavy wool coat, with a bushy white beard that looked like it had never seen a comb. He wore a blue knitted hat that was slightly too small for his head.", "\"Ozzie!\" Mom called out, her voice brightening.", "\"Ah, Lena,\" Grandpa Ozzie said. His voice was deep and scratchy, like a shell scraped against stone. He squinted through the rain. \"And the little storm cloud arrives.\"", "Juno climbed out of the car. The mud sucked at her boots. Grandpa Ozzie looked her up and down, then out at the silent harbor. He sighed, a long, rattling sound that seemed to come from his very bones.", "\"It’s been quiet lately,\" he said, rubbing his bad left knee. \"The sea doesn’t talk to me anymore. I miss her, Lena. I really do.\"", "Mom touched his arm gently. \"I’m only here for tonight, Dad. Juno’s staying with you until I get back.\"", "Juno stood by the car, her yellow raincoat glowing against the grey world. She felt invisible. She felt like a stain on the glass. Grandpa Ozzie finally looked at her, his eyes kind but distant, like a man looking through a window at a different room.", "\"Juno, my dear,\" he said. \"Come in. It’s cold.\""], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["Inside, the house smelled of dried fish, old paper, and lemon polish. It was warm, but a strange, heavy warmth, like a blanket that had been folded too many times. Grandpa Ozzie led them up the narrow stairs, his cane tapping a slow rhythm on the wooden steps: *tap, tap, tap*.", "Biscuit the cat followed them, weaving between their legs. He jumped up onto a shelf of empty jars, looking out the window with profound indifference.", "\"Sorry about the mess,\" Grandpa said, shaking water off his coat. \"I haven’t had reason to clean. No fish to sell. No customers. Just... waiting.\"", "Mom moved quickly to the kitchen, unpacking a bag of groceries. She hummed a tuneless song. Juno stood in the middle of the living room, feeling the weight of the silence. The harbor bell, which usually rang every hour, hung outside like a dead bell. It did not ring. The rain did not fall. It just hung in the air, suspended.", "\"Grandpa,\" Juno said. Her voice sounded small in the big room.", "\"Yes?\"", "\"Is it always this quiet?\"", "Grandpa Ozzie looked at her, then out the window at the grey void where the sea should have been. He smiled, a sad, crooked thing. \"Quietness is just the sea thinking,\" he said. \"It’s been thinking for a long time, Juno. I hope it finds the right answer.\"", "Juno watched the rain. It didn’t look like thinking. It looked like giving up."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["Later, after Mom had kissed Juno’s forehead and promised to return in nine days, Juno sat on the edge of her bed. The room was small, tucked under the slanted roof. The ceiling beams were dark and rough. Outside, the rain had stopped, leaving the world washed clean but empty.", "She heard a sound from the hallway. *Tap. Tap. Tap.*", "Grandpa Ozzie stood in the doorway, leaning on his cane. He looked smaller now, somehow.", "\"Sleep well, little storm,\" he said softly. \"Don’t worry. We’ll figure it out. We always do.\"", "Juno nodded, but she didn’t believe him. She looked out the small window. The harbor was black and still. No water lapped at the shore. No gulls cried. The world had held its breath, and it had forgotten to exhale.", "She pulled her knees to her chest. She was only eleven. She was only loud. And the sea was gone.", "Juno closed her eyes, but she couldn’t sleep. In the dark, she could almost hear the silence screaming. It was a low, thrumming hum, deep in the floorboards, deep in the bones of the house. It wasn’t just quiet. It was waiting.", "And waiting, Juno knew, was a lot harder to survive than rain."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Attic", "part": "PART ONE: THE MUD", "paras": ["The silence in the house was not empty. It was heavy, like a wet wool blanket draped over Juno’s shoulders. She lay awake, staring at the dark knot of a ceiling beam that looked suspiciously like a sleeping whale. Her stomach rumbled, a low, distinct sound in the quiet. She hated being the new kid. She hated that her mom was already packing. And she hated that the sea outside her window was just a flat, grey sheet of mud that didn’t even have the decency to splash.", "Juno swung her legs off the bed. The floorboards creaked under her socks, a sound that felt too loud, too intrusive. She padded to the window, pulling back the thin curtain. The harbor was dark. No lights on the boats. No gulls hooting about nothing. Just the smell of low tide and old rope.", "She turned back to the room. It was small, cramped by the slant of the roof, but it had a nook in the corner that was hers. A pile of books. A half-finished model of a ship. And there, tucked behind a stack of encyclopedias, a dented tin box. It was painted seafoam green, the color faded to a pale, washed-out mint. She hadn’t touched it since Mom moved the boxes from Grandma’s old study before the funeral.", "Juno crawled onto the small rug. The tin box was cold to the touch. She lifted the lid. The hinges groaned, a rusty sigh that seemed to wake the room.", "Inside, there was no money. No old coins. Just a green cloth notebook with a brass clasp, and a shell."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["The notebook was thick, the cover soft with age. The brass clasp was shaped like a wave, curled and smooth. Juno’s fingers traced the letters stitched in faded gold thread on the spine: *Ivy Vale’s Log*.", "Grandma Ivy. The name felt like a stone in Juno’s throat. She missed her so much it hurt, a dull ache behind her ribs. Grandma had smelled like salt and lavender, and she always knew what to say when the world felt too big.", "Beside the book lay the spiral shell. It was white, with a deep pink swirl inside, like a frozen whirlpool. It was warm, which was strange. Juno held it up to the light. It didn’t look like a toy. It looked like it had been waiting.", "She opened the notebook. The pages were filled with tight, slanted handwriting. There were sketches of fish, stars, and a large, intricate clock face. Most of the entries were dated years ago.", "Juno skipped forward to the last page. The ink was fresh, darker than the rest.", "*The tide is a promise,* Grandma had written. *If you break it, the sea forgets your name.*", "Juno’s breath caught. She turned the page. There was only one line written on the blank side, just before the end.", "*When the whistle is blown by someone listening, the sea will answer.*", "Juno looked at the shell in her hand. She didn’t know how to blow into it. She didn’t know who to ask. But for the first time since arriving in Saltmarsh Harbor, the silence in her ears didn’t feel like waiting. It felt like an invitation."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["Juno sat back on her heels. The shell felt heavy, not with weight, but with purpose. She remembered Grandma Ivy sitting on the porch, swinging her legs, watching the water.", "\"Grandma,\" Juno whispered to the empty room. \"What does that mean?\"", "The only answer was the creak of the house settling.", "Juno looked at the window again. The mud of the harbor was dark and still. She thought about the boats stuck in the silt, the grumpy gulls, the smell of the fish market that made her nose wrinkle even from here. The town was holding its breath.", "She picked up the shell. It was smooth against her palm. She brought it to her lips, not to blow, but to feel the cold edge of the aperture. It was like touching a secret.", "\"Someone listening,\" she murmured. \"Who listens to the sea? Everyone ignores it. Everyone wants to build on it or catch fish from it or just look at it from a safe distance.\"", "She thought of her mom, packing her bag downstairs. She thought of Grandpa Ozzie, leaning on his cane, saying they would figure it out. But Grandpa didn’t know. He was just a man who missed his wife and told bad jokes about cod.", "Juno closed her eyes. She tried to listen. Not to the shell, but to the room. To the floorboards. To the air.", "At first, there was only the hum of the refrigerator downstairs. Then, faintly, a sound. A low, rhythmic thumping. Like a heart.", "It was coming from outside."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["Juno opened her eyes. Her heart was beating fast, a rapid flutter against her ribs. She stood up, her knees shaky. She pulled on her yellow raincoat, the bright yellow startling in the dim attic. She didn’t put on shoes. She just grabbed her sneakers and ran to the door.", "The hallway was dark. The stairs creaked under her weight. She took them two at a time, careful not to wake Grandpa. She reached the front door and pushed it open.", "The air hit her face. It was cool and smelled of wet earth and something else. Something alive.", "She stepped out onto the porch. The yard was small, just a strip of grass before the road. Beyond that, the harbor. The mud was black and glistening under the moonlight. It looked like a vast, silent ocean that had been drained.", "Juno walked to the edge of the property line. She could see the tilted masts of the boats. They looked like broken bones sticking out of the ground.", "She took a deep breath. The air tasted of salt, even though the sea was gone.", "She lifted the shell to her lips. Her hands were trembling.", "*When the whistle is blown by someone listening,* she thought.", "She didn’t know if she was listening. She didn’t know if she was brave. But the sound in her head was loud, and the silence outside was louder.", "She blew."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["The sound that came from the shell was not a whistle. It was a hum. A deep, resonant vibration that traveled through the air and straight into Juno’s bones. It was warm, like sunlight, and cold, like deep water.", "For a second, nothing happened.", "Then, the mud in the harbor shivered.", "It wasn’t a wave. It was a tremor. A low, rolling bump that moved across the surface of the silt. The water that had been gone for eleven months was stirring. It was not coming in, not yet. But it was remembering.", "Juno’s mouth fell open. She dropped the shell. It clattered onto the wooden planks of the porch.", "From the black mud, a sound rose. It was not a wave. It was a voice. Small. Grumpy. And extremely, incredibly rude.", "\"Honestly! Is someone trying to wake the dead? It is the middle of the night! Do you have any idea how hard it is to sleep in a teapot? The acoustics are dreadful!\"", "Juno stared at the mud. The voice had come from there. From the darkness. From the place where the water used to be.", "And then, from the shadows of the harbor, a tiny blue shape lifted from the silt."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "Barnacle", "part": "PART ONE: THE MUD", "paras": ["Juno woke with the shell whistle clutched in her hand, her heart hammering against her ribs. The attic room was dark, but the air felt different. It tasted like salt and old stone. She swung her legs over the side of the bed, her yellow raincoat still on from the night before. It was a weird thing to sleep in, but she hadn’t wanted to be unready.", "Downstairs, the house was quiet. She tiptoed past the kitchen, where a single bulb flickered, and out the back door onto the porch. The mud was still there, thick and grey, but it looked... softer. Less angry. She stepped down into the silt. It squelched under her boots, a sound that usually made her stomach turn. Today, it sounded like a greeting.", "She raised the spiral shell to her lips. She didn’t blow it. She just held it there, listening. The wind died. The gulls on the masts stopped their grumbling. The world held its breath.", "\"Honestly!\"", "The voice came from her left. Juno spun around, her puffs of curly dark-brown hair bouncing. There, sitting on a driftwood log in the grey muck, was a hermit crab. He was tiny, no bigger than a marble, and he wore a chipped blue teapot shell. He was waving one claw frantically.", "\"Don't gawk,\" the crab said, his voice high and reedy. \"It’s undignified.\""], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["Juno blinked. She looked at the crab. She looked at the empty air. She looked at the crab again.", "\"Did you... did you just talk?\" she whispered.", "\"I am Barnacle,\" the crab said, straightening his teapot shell with a piece of kelp. \"And yes. I talked. It is a very common occurrence, although I suspect you are not used to it. Most humans just see a bug and stomp. I prefer conversation.\"", "Juno took a shaky step back. Her mind was racing. *Sea creatures. Only the Keeper hears them.* Grandma Ivy’s note flashed in her memory. *When the whistle is blown by someone listening, the sea will answer.*", "\"You’re a crab,\" Juno said, her voice trembling.", "\"I am a hermit crab,\" Barnacle corrected, offended. \"And I was formerly the Royal Consultant to the Deep Court, or at least I was until the whole... catastrophe. Which you seem to have caused, or at least, failed to prevent.\"", "Juno frowned. \"I didn’t do anything. The tide stopped a year ago. Before I got here.\"", "Barnacle sighed, a sound like a deflating balloon. \"Oh, you sweet, stubborn child. You think you are the first to arrive? The tide stopped when the last Keeper died. No one has wound the Clock since. The sea is not gone, Miss Vale. It is sleeping. And it is getting very, very grumpy.\""], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["Juno sat down in the mud, not caring about her boots. The dampness soaked through her jeans, but she didn’t notice. Her brain was trying to make sense of the impossible. A talking crab. A sleeping sea. A magic shell.", "\"Grandma Ivy,\" she said softly. \"She was a Keeper.\"", "Barnacle’s eyes widened. He looked up at the sky, as if checking for spies. \"She was the best. Elegant. Precise. She knew how to handle the Moon Gear. She knew how to sooth the Salt Compass. And you?\" He looked Juno up and down. \"You are wearing a raincoat in the morning. It is a lovely coat, but it is not a tide-keeper’s garment.\"", "Juno hugged her knees. \"I’m not brave, Barnacle. I’m just loud. And I’m new. I don’t even know how to open the front door without getting stuck in the hinges.\"", "Barnacle hopped off the log. He walked over to Juno, his tiny legs clicking on the driftwood. He stopped right at her boot.", "\"Bravery is not about being silent,\" he said, his voice losing some of its bite. \"It is about showing up. You showed up. You listened. The sea remembers that. That is why it answered you, and not the Mayor, or the Mayor’s dog, or that man in the silver car who parks his car in the mud.\"", "Juno looked at the crab. \"What do I do?\"", "\"You wind the Clock,\" Barnacle said. \"At the Grand Low. In nine days.\""], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["\"Nine days?\" Juno’s stomach dropped. \"Why does it have to be that specific night?\"", "Barnacle climbed up her leg, a sensation like a cold pebble moving up her sock. He climbed onto her shoulder and settled into the collar of her yellow raincoat. It was a strange feeling, but not unpleasant.", "\"The Tide Clock is not just a machine,\" Barnacle explained. \"It is a heart. It beats with the moon. The Grand Low is the night the moon is highest and the pull is strongest. If the Clock is not wound then, the sea will forget this bay. It will forget the boats, the fish, the mud. It will become a dry hole in the earth. And I will be a very, very thirsty crab.\"", "Juno rubbed her eyes. \"That’s... that’s a lot of pressure for an eleven-year-old in a raincoat.\"", "\"It is a lot of pressure for anyone,\" Barnacle agreed. \"But it is a very specific kind of pressure. You have to find the keys. Three of them. The Moon Pearl, the Salt Compass, and the Storm Bell. Your grandmother hid them. She was clever. She knew that if one person had them all, they could be stolen. So she split them up.\"", "\"Where?\" Juno asked.", "Barnacle shook his head. \"She did not tell me. She told *her* log. The green one. The one you found in the attic.\"", "Juno’s heart skipped a beat. The green cloth notebook with the brass clasp. She had read the first page. *When the whistle is blown by someone listening, the sea will answer.* But the rest? She hadn’t read the rest."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["Juno climbed down from the log. Her legs were wobbly. The world felt bigger and more dangerous than it had that morning. But it also felt... alive. The mud was not just dirt. It was the skin of the ocean. And the ocean was waiting for her.", "\"I need to read the log,\" she said.", "\"Beg your pardon?\" Barnacle said, adjusting his teapot shell.", "\"The log. Grandma Ivy’s log. It has to have the map. Or the clues. Or...\" Juno trailed off. She didn’t know what else it could have. A recipe? A joke? A list of people who owed her money?", "Barnacle looked at her with a mix of skepticism and something else. Hope, maybe. Or just a desire for the tide to return so he could stop feeling so dry.", "\"Go on, then,\" he said. \"But hurry. The sun is coming up, and I have a reputation to maintain. I am not a crab who runs around in the daylight. It is simply bad for the shell.\"", "Juno turned and ran back toward the house. Her boots squelched with every step. She didn’t look back. She couldn’t. If she looked back, she might see the mud swallowing the world, and she couldn’t afford to be afraid yet. She had a job to do. She had a sea to wake up. And she had exactly nine days to figure out how to do it."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "Teo Marchetti", "part": "PART ONE: THE MUD", "paras": ["The bell above the bakery door didn’t ring. It clattered, a dull, heavy sound that matched the grey morning. Juno pushed through the door, her yellow raincoat squeaking against the wet concrete floor. The smell hit her next: yeast, warm butter, and the sharp tang of burnt sugar. It was the best smell in the world, and it made her stomach growl loud enough to echo off the tiled walls.", "A boy stood behind the counter, hunched over a bicycle wheel. He was tall for twelve, with messy black hair sticking out from under a green cap and round glasses sliding down his nose. A canvas tool belt hung loosely at his waist, filled with wrenches that jingled softly. He didn’t look up.", "\"Closed,\" he said, his voice flat. \"We open at eight. It is seven-thirty.\"", "Juno looked at the clock on the wall. It was seven-thirty.", "\"I need help,\" Juno said. \"Big help. The kind that involves saving the world, or at least the harbor. And I’m out of money, but I have a very loyal crab.\"", "The boy finally looked up. His eyes were dark and tired, framed by smudges of grease. \"I don’t help people who talk to crabs,\" he said. \"Unless it’s a joke. Is it a joke?\"", "Juno looked down at the blue teapot shell nestled in her raincoat pocket. Barnacle was silent, but she could feel his irritation vibrating against her hip.", "\"No,\" Juno said. \"It’s not a joke. And I’m not asking for a loan. I’m asking for a mechanic.\"", "The boy sighed, a long, deflating sound. He picked up a rag and began wiping his hands. \"You have five minutes to explain why I shouldn’t throw you out. And then I’m making a croissant for myself, so don’t block the oven.\""], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["Barnacle was not a subtle creature. He was, in fact, the opposite of subtle. He was a hermit crab the size of a thumb, living in a chipped blue teapot that looked like it had been left in a dishwasher for a century. He was currently sitting on the counter, tapping one claw against a glass jar of blueberries.", "Tap. Tap. Tap.", "\"Is that a bug?\" Teo asked, staring at the shell.", "\"No,\" Juno said, trying to keep her voice steady. \"That is Barnacle. He is my advisor. And he is very angry because you are blocking his view of the jam.\"", "Teo adjusted his glasses. \"He’s a crab. Crabs don’t have views. They have legs. And that shell is chipped. It looks like it fell off a shelf.\"", "Barnacle let out a noise that sounded like a tiny, angry hiccup. \"Honestly!\" he snapped. \"I have survived three shipwrecks and a very rude seagull, and now I have to deal with a grease monkey who can’t even appreciate a vintage teapot.\"", "Teo blinked. He looked at Juno. Then he looked at the crab. \"I didn’t hear anything,\" Teo said. \"Did he... did he move?\"", "\"He spoke,\" Juno said. \"He insulted your shoes. They’re ugly.\"", "\"My shoes are vintage work boots,\" Teo said, offended. \"And I didn’t hear a thing. You’re either very young or very lost. There is a difference, though I can’t tell which one you are right now.\"", "Juno took a deep breath. She was going to lose this. She could feel it. Her secret fear, the one that lived under her ribs, was starting to poke its head out. *You are just loud. You are just a girl talking to herself in a bakery.*", "\"Okay,\" Juno said. \"Proof. Barnacle, spell it out.\"", "\"Spell what?\" Barnacle asked, crossing his tiny arms. \"I am not a parrot. I am a dignified crustacean.\"", "\"Spell his fear,\" Juno whispered. \"The one he thinks no one knows.\"", "Barnacle looked at Teo. A slow, smug grin spread across his face. \"Oh, he’s got a fear, does he? Good. Let’s see how brave he is now.\""], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["Teo crossed his arms. \"This is getting ridiculous. I have customers coming in. I have a reputation to maintain. I am not going to listen to a girl and a bug play charades.\"", "Barnacle picked up a small, smooth pebble from the counter. There were three others sitting in a row, like dominoes. He nudged the first one with his claw. It rolled to the side.", "\"W,\" Barnacle said.", "\"Water,\" Teo said, his voice dropping an octave. \"Why is he saying water?\"", "Barnacle nudged the second pebble. \"T.\"", "\"T?\" Juno prompted. \"Keep going, Barnacle.\"", "\"E,\" Barnacle said.", "Teo’s face had gone pale. He stared at the pebbles. W. T. E.", "\"Deep water,\" Juno said softly. \"He can’t swim well. He’s terrified of it. He thinks if he goes in, he’ll sink and never come back. And he’s never told anyone. Not his mom. Not his friends. Not me.\"", "Teo didn’t move. He didn’t breathe. The bakery was silent, except for the hum of the refrigerator and the ticking of the clock.", "\"How...\" Teo started. His voice cracked. \"How did he know that?\"", "\"He listens,\" Juno said. \"The sea listens. And Barnacle listens for the sea. He heard you, Teo. He heard you practicing your breathing exercises in the bakery at night, pretending you were counting croissants. He heard you shaking.\"", "Teo looked at his hands. They were trembling. He had always kept it secret. He was the fixer. He was the one who understood gears and engines. He was not the boy who cried in the bathroom when the shower got too loud.", "\"He’s a crab,\" Teo whispered.", "\"He’s a friend,\" Juno corrected. \"And he knows things. He knows that the tide is broken. He knows that if we don’t fix it, the sea will forget this bay forever. And he’s offering you a job. You’re the best mechanic in town. I need you.\"", "Teo looked at the pebbles. Then he looked at Barnacle, who was currently grooming his whiskers with an air of supreme satisfaction.", "\"If you are lying,\" Teo said, \"I will make you a sandwich made of old bread and despair.\"", "\"I accept the challenge,\" Barnacle said. \"But I prefer my sandwiches with extra cheese.\""], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["Teo was quiet for a long time. The rain tapped against the window, a steady rhythm that usually helped him think. Today, it just made the world feel smaller. He picked up his wrench, then set it down. He picked it up again.", "\"Nine days,\" he said. \"That’s what you said. Nine days until it’s too late.\"", "\"Grand Low,\" Juno clarified. \"The night of the full moon. If the Clock doesn’t wind, the tide stops. Forever.\"", "Teo shook his head. \"It’s a clock. It’s brass. It’s a machine. Machines break, but they don’t stop breathing. Breathing is for people. And crabs.\"", "\"Exactly,\" Juno said. \"And crabs are dying because the mud is drying up. Barnacle’s shell is cracking. I can see it. It’s not just about the boats, Teo. It’s about the life. The salt. The rhythm. If it stops, everything dies. The fish, the gulls, the mud, the... the feeling of the town.\"", "Teo looked out the window. The street was grey and wet. The bakery was warm and safe, but it felt like a bubble. He could stay here. He could fix the bicycle, eat his croissant, and pretend the world wasn’t ending. Or he could go out into the mud and try to save a sea that he was terrified of.", "The thought made his stomach turn. But then he looked at Barnacle. The little crab was watching him with a kind of stubborn respect. It wasn’t pity. It was expectation.", "\"I don’t believe you,\" Teo said. \"But I’m coming. If you’re wrong, I’m suing you for emotional damages.\"", "\"You won’t be able to afford the lawyer,\" Barnacle said. \"I checked. You have four dollars and a half in your pocket.\"", "\"Shut up, Barnacle,\" Teo said, but he was smiling. It was a small, crooked smile, but it was there. He pulled a wrench from his belt and tucked it into his pocket. \"I need to pack. And Juno? If this is a dream, I’m going to be very angry.\"", "\"It’s not a dream,\" Juno said. \"It’s worse. It’s real.\"", "Teo nodded. He grabbed his green cap from the hook by the door. \"Meet me at the lighthouse. In an hour. Bring your crab. And Juno?\"", "\"Yes?\"", "\"Bring a flashlight. I hate the dark.\""], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["They walked out into the rain. The air was cold and smelled of wet stone and brine. Teo walked fast, his boots splashing through the puddles. Juno followed, her heart pounding. For the first time since she had arrived, she didn’t feel like a suitcase nobody unpacked. She felt like a captain with a crew.", "Behind them, the bakery door swung shut. Through the glass, they could see the boy’s reflection in the window, distorted and small. Then he was gone.", "Juno stopped at the corner of the harbor road. The mud was thick and grey, stretching out to the low-tide line. The boats lay tilted in the silt, their masts pointing accusingly at the sky.", "\"So,\" Juno said. \"What do we do first?\"", "Barnacle, who had been riding in her pocket, climbed out and sat on the wet pavement. He looked out at the harbor, his eyes bright and hard.", "\"We go to the Lighthouse,\" he said. \"But we do not go alone. There are others. Creatures. Old ones. They remember the Keeper. They will not like you, girl. You are too loud. You are too bright. You smell like bread and fear.\"", "\"I do not smell like fear,\" Juno said.", "\"You smell like salt,\" Barnacle said. \"And that is dangerous. The sea is angry, Juno. It has been waiting for a year. It is not going to forgive you easily. So listen. And for the love of all that is salty, do not let it hear you think.\"", "Juno looked at Teo. He was staring at the water, his jaw tight. He was scared. But he was here.", "\"We’re going to the lighthouse,\" Juno said. \"Right now.\"", "\"Beg your pardon?\" Barnacle said, adjusting his teapot. \"I said listen. Not run. The sea does not answer the loud. It answers the listening.\"", "Juno took a deep breath. She let the rain hit her face. She let the cold seep into her bones. And then, she started to walk."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "Mr. Grubb Makes an Offer", "part": "PART ONE: THE MUD", "paras": ["The next morning, the rain had stopped, but the sky remained a heavy, bruised purple. The air in Saltmarsh Harbor felt thick, like trying to walk through cold honey. Juno pulled her yellow raincoat tighter, the fabric stiff with dampness. She clutched the spiral shell whistle in her pocket, feeling its smooth curve against her thumb. Beside her, Teo adjusted his round glasses, his messy black hair sticking up despite his green cap. He looked like he had slept in his shoes.", "They walked past the silent fish market. The stalls were empty, the ice long melted into grey slush. The smell of old fish and wet rot hung in the air, a scent that made Juno’s stomach turn. She missed the clean, salty smell of the ocean, the kind that meant life was moving. Here, the water was stagnant, trapped in the mud, refusing to breathe.", "A crowd had gathered outside the market. It wasn’t a friendly crowd. They stood in small, tight clusters, their shoulders hunched against the chill. Their faces were tired, lined with worry. They looked at the muddy harbor, then at each other, then back at the harbor. The silence was louder than the rain had been.", "Juno stopped near the front, peering through the gap in the crowd. She saw Mayor Pruitt, jolly and tired, holding a half-eaten doughnut. He looked smaller than usual, his smile thin and brittle. Next to him stood a man in a shiny grey suit. He was tall and thin, with a tiny mustache that seemed to vibrate with impatience. His shoes were polished to a mirror shine, reflecting the grey mud around him.", "Juno’s heart skipped a beat. She recognized the man. She had seen him in the bakery yesterday, looking at the bakery’s sign with the same hungry look he now gave the harbor. He was the one who had offered to buy the land."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["The double doors of the fish market groaned open. Warm light spilled out onto the wet cobblestones, carrying the scent of frying onions and old wood. The crowd parted, not out of respect, but out of curiosity. They wanted to see who would speak.", "Mr. Grubb stepped out first. He brushed an invisible speck of dust from his lapel, his movements precise and cold. He didn’t look at the people. He looked at the harbor. He looked at the boats stuck in the mud. His eyes were like pieces of cold glass, scanning the damage, calculating the cost.", "\"Good morning,\" he said. His voice was smooth, like oil poured over stone. It didn’t belong in this place of mud and rust. \"I trust you’ve all been waiting for me.\"", "Mayor Pruitt stepped forward, his doughnut crumbled in his hand. He looked like he wanted to run away, but his feet were rooted. \"Mr. Grubb. We... we were hoping you could help.\"", "\"Help is a generous word,\" Grubb said. \"I prefer solutions. The harbor is dead. The tide is gone. The boats are rotting. This is not a problem that can be fixed with hope and prayer. It is a problem that needs capital.\"", "Juno felt a chill that had nothing to do with the weather. She looked at Teo. He was staring at Grubb’s hands. They were clean, manicured, and completely empty.", "\"What do you want?\" someone asked from the back of the crowd. It was an old woman with a shawl wrapped tightly around her neck.", "Grubb smiled. It did not reach his eyes. \"I want to buy the land. All of it. The harbor, the shops, the lighthouse. For a price that will put food on your tables and jobs in your hands. In exchange, you let me build what this town needs. Progress.\""], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["A murmur rippled through the crowd. It wasn’t anger, not yet. It was the low, rumbly sound of a stomach growling. Of fear. Of hunger.", "Juno heard a voice, dry and cracked, from the left. Grandpa Ozzie.", "The old man pushed his way through the crowd. He was tall, though he seemed to shrink when he walked. His bushy white beard was wild, and his blue knitted hat was slightly askew. He leaned heavily on his driftwood cane, his bad left knee protesting with every step. Biscuit, the fat orange cat with the chewed left ear, was perched on a crate nearby, watching the scene with one unblinking yellow eye.", "\"Ozzie,\" Mayor Pruitt said, his voice softening. \"Sit down, Ozzie. You don’t have to stand.\"", "\"I’m fine,\" Grandpa said. He looked at Grubb, and for a second, his eyes were sharp. \"You want the lighthouse, Mr. Grubb?\"", "Grubb’s smile tightened. \"The lighthouse is part of the package. It’s a beautiful piece of history. We would preserve it. Turn it into a luxury guest house. Mini-golf on the grounds.\"", "\"Mini-golf,\" Juno whispered. The words felt ridiculous in her mouth. How could anyone think of mini-golf when the sea was dying?", "Grandpa Ozzie took a step forward. He raised his hand, as if to point at Grubb, to say something important. Something that would stop this. His face was flushed, his eyes bright with emotion. He opened his mouth.", "But then, his eyes went distant. He blinked. He looked around, confused. \"Yes,\" he said softly. \"Yes, that’s right. Mini-golf. Very good for the community.\"", "The crowd sighed. It was a heavy, tired sound.", "Juno’s heart sank. She knew that look. It was the look Grandpa got when the world was too loud, too fast, too much. He forgot. He always forgot when it mattered most."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["Grubb nodded, satisfied. \"Excellent. We can have the contracts drawn up by the end of the week. The Grand Low is in nine days. After that, the value of the land drops. You know this. I know this. We are all practical men.\"", "Practical men. Juno’s hands curled into fists. She wanted to scream. She wanted to throw the shell whistle at his shiny shoes. She wanted to say that the sea wasn’t dead, it was sleeping. That it was waiting.", "But she was quiet. She remembered Barnacle’s words. Do not let it hear you think.", "Teo tugged her sleeve. \"Juno,\" he whispered. His voice was tight. \"Look at his pocket.\"", "Juno looked. Grubb was checking his watch, a large, gold thing that gleamed in the grey light. As he moved, something caught in the pocket of his shiny grey suit. It was a glint of brass. Not gold. Brass. And it wasn’t a watch. It was a gear. A single, toothed gear, shiny and new.", "Juno’s breath caught. She had seen that shape before. In the log. In the drawing of the Tide Clock.", "It was the Moon Gear.", "He had it. The man who wanted to build mini-golf had the missing piece of the machine that kept the sea alive.", "\"Mr. Grubb,\" Juno said. Her voice was small, but it cut through the air. \"What is that in your pocket?\"", "Grubb looked down. He froze. For a second, his face was a mask of shock. Then, the coldness returned. He touched the pocket, and the gear disappeared.", "\"Nothing,\" he said. \"Just a coin.\""], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["\"Coin,\" Teo repeated, his voice flat. He stepped forward, his tool belt clinking softly. \"That’s not a coin, Mr. Grubb. Coins are round. That was a gear.\"", "Grubb’s eyes narrowed. He looked at Teo, then at Juno. He didn’t look angry. He looked amused. Like a cat watching a mouse.", "\"You children are imaginative,\" he said. \"But imagination doesn’t pay for the roof repairs. It doesn’t fix the nets. It doesn’t bring the tide back.\" He turned to the crowd. \"I’ll have my lawyer call you. For now, I suggest you go home. It’s getting late. And the mud is getting deeper.\"", "He turned and walked back into the fish market. The doors closed behind him with a heavy thud.", "The crowd didn’t move. They stood in the silence, looking at the closed doors. Then, slowly, one by one, they turned and walked away. They didn’t look at Juno. They didn’t look at Teo. They just walked, their boots sinking into the grey slush.", "Grandpa Ozzie was still standing there. He looked at Juno, and for a second, his eyes were clear. \"Juno,\" he said. \"What did he have in his pocket?\"", "Juno looked at the closed doors. She looked at the mud. She looked at Teo, who was staring at the ground, his jaw tight.", "\"He has the gear, Grandpa,\" Juno said. \"He has the Moon Gear.\"", "Grandpa’s face fell. He leaned on his cane, his shoulders slumping. \"Oh,\" he said. \"Oh, no.\"", "The rain began to fall again, a fine, cold mist that settled on their shoulders. The harbor was silent. The sea was gone. And the clock was ticking."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "What the Log Said", "part": "PART TWO: THE THREE KEYS", "paras": ["The rain tapped a frantic rhythm on the attic window, a sound like tiny fingers demanding to be let in. Juno sat on her bed, her yellow raincoat still zipped to her chin despite the warm air inside. The green cloth notebook lay open in her lap, its brass clasp cold against her palm. Teo stood by the window, his messy black hair damp, round glasses fogging up as he stared at the grey sky.", "\"So,\" Teo said, his voice echoing slightly in the small room. \"We need three keys. And a gear. That’s four things. That’s a lot of things.\"", "Juno turned a page. The ink was faded, Grandma Ivy’s handwriting looping and delicate. \"It says the Moon Gear is the heart,\" she read aloud. \"Without it, the clock stops. And without the clock, the sea forgets us.\"", "Barnacle, perched on the edge of the tin box, clicked his claws. He was a small, grumpy hermit crab in a chipped blue teapot shell, his eyes like black beads of irritation. \"Honestly!\" he squawked. \"I am a creature of the tide, not a librarian. This is tedious. Do we have any snacks? I require snacks to process this existential dread.\"", "\"We have half a stale bagel,\" Teo offered.", "\"I am not a dog,\" Barnacle said, with great dignity.", "Juno smiled, a small, tired thing. She pointed to the next entry. The paper was yellowed, smelling of salt and old paper. \"Here it is. The first key. The Moon Pearl.\"", "Teo leaned in, his tool belt clinking softly. \"What does it say?\"", "Juno’s eyes scanned the words. \"Where the tide goes to sleep, look for what the moon keeps.\"", "Teo frowned. \"That’s not a location. That’s a riddle. Grandma was a poet, not a navigator.\"", "Barnacle waved a claw. \"She was a Keeper. It’s different. It’s... atmospheric.\""], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["Juno rubbed her temples. Her freckles seemed to darken in the low light. \"Okay,\" she said. \"Let’s break it down. 'Where the tide goes to sleep.' That’s the mudflats, right? Where the water used to be.\"", "\"Probably,\" Teo said. He pulled a small screwdriver from his belt, turning it over in his fingers. A nervous habit. \"But 'what the moon keeps'? That could be anything. A reflection? A shadow? A ghost?\"", "\"It’s a pearl,\" Juno said firmly. \"It’s a Moon Pearl. So it’s a physical thing.\"", "Barnacle clicked his claws together. \"I can translate this old sailor’s gibberish,\" he announced proudly. \"Though I warn you, my translation is... interpretive.\"", "\"Please,\" Juno whispered.", "Barnacle cleared his throat, a tiny, raspy sound. \"The moon keeps what it sheds. The tide sleeps in the dark. So... you look for the dark spot that shines? No, that’s silly. You look for where the light is trapped?\"", "Teo sighed. \"He’s making it up.\"", "\"Am I?\" Barnacle looked genuinely hurt. \"I was Grandma Ivy’s friend. I know things. I know that the moon pulls the water. If the water is gone, maybe the moon is holding it back? Or maybe the pearl is the key that tells the moon to let go?\"", "Juno stared at the crab. \"That’s... actually kind of logical.\"", "\"See?\" Barnacle puffed out his tiny chest. \"I am brilliant. And also hungry. Still no bagel?\"", "Teo looked at Juno. \"So, the mudflats. At night. When the moon is out.\"", "\"Grand Low,\" Juno said. \"The night of the full moon. That’s in nine days.\"", "\"Eight days left,\" Teo corrected. \"And we need to find this pearl before someone else does.\""], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["The clock on the mantelpiece ticked. It was the only sound in the house. Biscuit, Grandpa’s fat orange cat with a chewed left ear, was asleep on the rug, his tail twitching in a dream. He did not look up. He did not care about pearls or tides or the fate of the bay. He cared about his nap.", "Juno felt a pang of worry. She looked at the window. The rain was easing up, but the air still felt heavy, thick with the scent of wet stone and old wood.", "\"Grandpa knows,\" Juno said suddenly.", "Teo stopped turning his screwdriver. \"What?\"", "\"Grandpa Ozzie. He’s Ivy’s husband. He must know about the keys. Or at least the gear.\"", "\"Barnacle said Grandpa doesn’t know anything,\" Teo said. \"He said he’s forgetful. And also, he was standing in the fish market looking like he’d seen a ghost.\"", "\"Maybe he’s pretending,\" Juno said. \"Maybe he’s trying to protect us. Or protect the town.\"", "Teo shrugged. \"Or maybe he’s just confused. Old men are often confused. It’s a feature, not a bug.\"", "Juno ignored the sarcasm. She pulled the notebook closer. \"There’s another entry. Right under the first riddle.\"", "She pointed to a smaller line of text, written in a different ink. It was darker, more urgent.", "\"Listen,\" she said. \"It says: 'The Gear is the heart. If the heart is taken, the body will fail. Guard the Gear. It is not a toy. It is not an antique. It is life.'\"", "Teo’s jaw tightened. \"Grubb.\"", "\"Yes,\" Juno said. \"Grubb. He had it in his pocket. He thought it was a valuable part. He’s going to sell it. Or keep it. And then the clock will stop forever.\"", "\"So we need to get it back,\" Teo said. \"From a man in a silver car who has lawyers.\"", "\"We’re eleven and twelve,\" Juno said. \"We have a crab and a cat. We’re perfect for the job.\"", "Barnacle snorted. \"I am a hermit crab. I am not a cat. And I am certainly not perfect. I am merely... adequate.\""], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["Juno sat on the edge of the bed, her knees pulled up to her chest. The yellow raincoat was bunched under her arms. She felt small. She felt like a suitcase nobody had unpacked, just like in the car on the way here. But now she had a map. Or a riddle. Or a nightmare, depending on how you looked at it.", "\"Teo,\" she said. \"Do you think we can do this?\"", "Teo was leaning against the wall, his tool belt hanging loose. He looked tired. Not sleepy-tired. Soul-tired. \"I think,\" he said slowly, \"that we are going to do this. Whether we can or not is a secondary concern.\"", "Juno almost laughed. It was a dry, brittle sound. \"You’re funny.\"", "\"I’m practical,\" he corrected. \"There’s a difference. Funny gets you in trouble. Practical gets you out of it. Usually.\"", "Barnacle had crawled onto Juno’s knee. He was cold, his shell rough against her jacket. \"Honestly,\" he muttered. \"This is a lot. For one day. I require a moment of silence to reorganize my thoughts. And possibly a crumb.\"", "Juno reached into her pocket and pulled out a piece of dried seaweed she’d found on the shore earlier. She broke off a tiny piece and held it out. Barnacle ate it with frantic, tiny chomps.", "\"Better?\" she asked.", "\"Adequate,\" he said. \"Now, about the Moon Pearl. I have a feeling it’s not in a box. I have a feeling it’s in a place that’s hard to find. And Grubb is going to look for it too, if he’s smart. And he’s not smart, but he’s greedy. Greedy makes people look.\"", "Juno looked at the notebook. The ink seemed to shimmer in the dim light. \"Where the tide goes to sleep,\" she murmured.", "\"Where the water used to be,\" Teo said. \"The mudflats. But it’s night. And it’s dark. And there are crabs. And possibly worse things.\"", "\"Worse things?\" Barnacle asked, his eyes wide. \"Like... sharks? In the mud? That’s absurd. I live in the mud. I know the mud. It is mostly silent. Occasionally, a gull drops a fish. It is not a shark zone.\"", "Juno stood up. She needed to move. She needed to think. She walked to the window and looked out at the rain-slicked street. The streetlights were blurred halos of orange.", "\"We start tomorrow,\" she said. \"We find the pearl. Then we find the gear. Then we wind the clock.\"", "Teo pushed off the wall. He straightened his green cap. \"Tomorrow,\" he agreed. \"But tonight, we sleep. Even heroes need sleep. Especially small, angry heroes.\""], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["The next morning, the rain had stopped. The sky was a pale, washed-out blue, like the inside of a seashell. The air smelled of wet stone and distant salt. Juno stepped onto the harbor road, her yellow raincoat bright against the grey world. The boats were still tilted in the mud, their masts pointing accusingly at the sky. The harbor bell hung silent.", "Grandpa Ozzie was already outside. He was tall, with a bushy white beard and a blue knitted hat. He leaned on his driftwood cane, his bad left knee stiff in the cool air. He looked up as Juno approached.", "\"Morning, Juno,\" he said. His voice was gentle, but tired. \"Did you sleep?\"", "\"I did,\" Juno said. \"Teo and I talked about the tide.\"", "Grandpa’s eyes flickered. For a second, a shadow passed over his face. He cleared his throat. \"The tide,\" he said. \"Yes. It’s been... quiet. I’ve been thinking about that. The sea is sad, I think. When Ivy was here, it was different. It breathed. Now it just sits there.\"", "Juno studied him. He didn’t look like he knew about the Moon Gear. He didn’t look like he knew about the keys. He looked like a man who missed his wife and was trying to find a reason for the silence.", "\"Grandpa,\" Juno said. \"Do you remember where Grandma Ivy hid the Moon Gear?\"", "Grandpa blinked. He looked at the mud, then at Juno. \"Moon Gear?\" he repeated. \"I don’t... I don’t remember a gear, Juno. I remember the lighthouse. I remember the view. But a gear?\"", "He leaned on his cane, his shoulders slumping. \"Maybe it’s just a part of the clock. An old part. Something Grubb found.\"", "Juno felt a cold knot in her stomach. He didn’t know. Or he was hiding it. Either way, they were on their own.", "\"Come on,\" she said softly. \"Teo’s waiting. We have work to do.\"", "Grandpa watched them go. He stood there, alone in the grey morning, looking at the silent sea. Then he turned and walked back inside, his cane tapping a slow, lonely rhythm on the stone.", "Juno did not look back. She had a pearl to find, and a clock to save, and only eight days left."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "The Old Lighthouse", "part": "PART TWO: THE THREE KEYS", "paras": ["The lighthouse door was iron, rusted shut, and smelled of cold stone. Juno pushed it with her shoulder, the yellow raincoat creaking. It groaned open with a sound like a whale’s sigh. Inside, the air was thick, damp, and ancient. A single beam of daylight cut through a high window, illuminating dust motes that danced like lost spirits.", "\"Okay,\" Juno whispered, her voice sounding too loud in the silence. \"Don't be scared. Be curious.\"", "Teo adjusted his round glasses, his messy black hair falling over his eyes. He tightened the straps of his canvas tool belt. \"It’s not scary,\" he said, though his voice cracked slightly. \"It’s just... very tall. And very old. And why are there no footprints? How do people get up here without getting lost?\"", "Barnacle, perched on Juno’s shoulder in his chipped blue teapot shell, clicked his claws. \"Honestly! It’s drafty. And it smells like regret. And old socks. I hate old socks.\"", "Juno ignored him. She held the spiral shell whistle tightly in her pocket. The log lay heavy in her bag. They stepped into the darkness. The stairs spiraled upward, narrow and steep, carved from the living rock of the cliff. Each step echoed, a hollow thud that seemed to bounce back at them.", "\"Count the steps,\" Teo muttered. \"One, two, three. If we lose count, we’re stuck. If we’re stuck, we’re lunch for the bats.\"", "\"There are no bats,\" Juno said.", "\"Please don’t make that promise,\" Teo said, pulling out a flashlight from his tool belt. The beam sliced through the dark, revealing the rough texture of the wall. \"Bats are polite, but they are sticky.\"", "Juno looked up. The top of the lighthouse was a starry void, impossibly far away."], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["They climbed. The air grew colder with every turn. The walls wept condensation, leaving wet handprints on the stone. Juno’s breath formed small clouds in front of her face.", "\"Teo,\" she called out. \"Do you hear that?\"", "\"Hear what? My own heartbeat? It’s very fast. Probably from the exercise.\"", "\"No,\" Juno said. She stopped. She pressed her hand against the wall. It was vibrating. A low, rhythmic hum, like a giant engine idling. \"The building is breathing.\"", "Barnacle scuttled down her sleeve. \"It’s not breathing. It’s holding its breath. There’s a difference. Breathing is polite. Holding your breath is passive-aggressive.\"", "Teo shone his light on the wall. There, carved into the stone, were faint grooves. Not random. They formed a pattern. A spiral.", "\"Grandma Ivy,\" Juno whispered. \"She lived here. She listened to this.\"", "\"Listen to what?\" Teo asked.", "\"To the silence,\" Juno said. \"Before the sound.\"", "A shadow detached itself from the corner of the landing. It fluttered, silent and black, and landed on the railing. It was a bat, small and grey, with ears like little petals. It blinked at them, then unfolded its wings and flew back into the darkness.", "Teo froze. \"I told you. Sticky.\"", "\"It’s gone,\" Juno said, but her heart was hammering. She looked at the spiral carving again. It seemed to twist deeper into the rock, leading upward. \"Keep going. Don’t look down.\""], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["The climb took an hour, or maybe a minute. Time felt slippery here. Juno’s legs ached, and her knees popped. Teo was quiet now, his breathing ragged. He kept touching his tool belt, checking that his wrenches were still there.", "\"Almost there,\" Juno said, though she didn’t know that. She just felt it. A pull in her chest, a tug behind her eyes. The air changed. It smelled of salt and brass.", "The door to the top room was heavy oak, banded with iron. Juno pushed it open.", "The room was vast. The ceiling was a dome of glass, open to the sky. But the sky was dark, even though it was afternoon. The clouds were low and grey, pressing against the glass like wet wool.", "In the center of the room stood the Tide Clock.", "It was enormous. A cage of brass gears and springs, rising from the floor to the ceiling. It was intricate, beautiful, and completely still. The largest gear in the center was missing a piece. A jagged gap where a tooth should have been.", "\"Oh,\" Teo breathed. \"Oh, that’s... that’s a lot of gears.\"", "\"It’s broken,\" Juno said. She walked toward it, her yellow raincoat bright against the dim brass. \"Someone took a part.\"", "Barnacle crawled out of the teapot shell. He looked at the clock, then at the gap. \"Honestly,\" he said, his voice small. \"That’s not just a part. That’s the heart.\""], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["Juno reached out and touched the cold brass. It was smooth, but cold, like a stone in winter. She looked around the room. There was a desk, cluttered with papers and empty inkwells. On the desk sat a green cloth notebook.", "The Tide Keeper’s Log.", "Juno picked it up. The brass clasp was warm. She opened it to the last page. The handwriting was her Grandma Ivy’s, neat and looping.", "*The Moon Gear is gone. Taken by a hand that does not listen. The Clock is silent. The tide is frozen. I have hidden the Keys. If you are reading this, child, you are the next listener. Do not trust the shiny things. Trust the salt.*", "\"Grandma,\" Juno whispered. \"You knew.\"", "\"Knew what?\" Teo asked. He was rummaging through a drawer, pulling out dusty tools. \"Knew it was broken? Yeah, I figured that out. It’s missing a tooth. Like my missing incisor. But this is bigger.\"", "\"It’s not just broken,\" Juno said. She read the note again. \"Someone took it. On purpose. And they didn’t know what they were doing.\"", "\"Who?\" Teo asked.", "Juno looked out the glass ceiling. The clouds seemed to swirl, forming shapes. \"Someone who wanted an antique. Someone who thought it was just a pretty gear.\"", "Barnacle clicked his claws. \"A greedy man? With a shiny suit? And a tiny mustache that looks like a piece of toast?\"", "Juno closed the log. \"Mr. Grubb.\""], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["Juno felt a surge of anger, hot and bright. She had imagined Grandpa Ozzie hiding the truth, or the sea being mean. But it was just a man. A man who liked shiny things. A man who didn’t know that a gear could hold the ocean in its teeth.", "\"We need to get it back,\" Juno said.", "\"From his office?\" Teo asked. He looked at the clock, then at the window. \"That’s a long way down. And he probably has a security system. Or a dog. Or a cat that bites.\"", "\"We don’t need to break in,\" Juno said. She thought of the town meeting. Grubb had offered to buy the harbor. He wanted the land. He wanted the quiet. \"We need to make him give it back. Or we need to find out where he put it.\"", "\"Or,\" Barnacle said, crawling onto the desk, \"we could just steal it. I know a guy. A very small, very fast guy. He’s a hermit crab, but he knows some very nice seagulls who steal shiny things.\"", "\"We are not stealing it,\" Juno said firmly. \"We are listening. And we are going to find the other keys first. If we have the keys, we can force the Clock to run, even without the Moon Gear. Maybe.\"", "\"Maybe,\" Teo said. He didn’t sound hopeful. He sounded tired.", "Juno looked at the empty space in the clock. The silence was heavy. It was pressing against her ears.", "\"Day three,\" she said. \"Seven days left. We start with the Moon Pearl.\"", "She put the log in her bag. The room felt colder now, the silence louder. The lighthouse was waiting for a breath that might never come."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "Old Fathom", "part": "PART TWO: THE THREE KEYS", "paras": ["The mudflats stretched out like a giant’s abandoned breakfast. Grey and wet, it smelled of rot and old fish guts. Juno squinted through the rain, her yellow raincoat bright against the gloom. Beside her, Teo adjusted his round glasses, wiping the water from his messy black hair. He kept one hand on his tool belt, even though there was nothing to fix here.", "\"Where are we going?\" Teo asked, his voice tight. \"This isn’t a place for shoes. Or dignity.\"", "Barnacle scuttled across a piece of driftwood, his chipped blue teapot shell bobbing. \"Honestly! It’s a mudflat. It’s where things go when they’re tired of being alive. Or useful. You know how it is.\"", "Juno ignored him. She was looking at the horizon. There, a dark shape lay half-buried in the silt. It was huge. It looked like a boulder with a face.", "\"Is that a rock?\" Teo asked.", "\"No,\" Juno said. Her heart gave a strange thump. \"It’s a turtle.\"", "Teo blinked. \"A turtle. Like a pet shop turtle?\"", "\"Bigger,\" Juno said.", "She pointed. The shape shifted. A long, mossy head rose from the mud. Two eyes, ancient and kind, blinked slowly at them.", "\"Oh, dear,\" Barnacle muttered. \"That’s Old Fathom. He’s been down here since the tide stopped. He’s dry. He’s sad. He’s also enormous. Try not to step on him.\"", "Juno knelt in the wet muck. The turtle’s skin was rough, like tree bark. He looked at her, and a low rumble started deep in his chest. It vibrated through the mud and into her knees."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["The turtle’s voice was like the sound of a cello being played underwater. Deep, slow, and warm.", "\"The water... is gone,\" the turtle rumbled. \"The breath... is stopped.\"", "\"Hello,\" Juno said, trying to keep her voice steady. \"We’re Juno. This is Teo. And this is Barnacle, who is being rude.\"", "Barnacle hissed. \"I am being honest!\"", "Old Fathom’s eyes closed for a long moment. When he opened them, they were misty. \"Ivy... she came here. In the green boat. She poured the water from her bucket. She said, 'Fathom, you must stay wet for the dance to begin.'\"", "Juno looked at Teo. \"He’s thirsty. And he’s stuck.\"", "Teo’s face went pale. \"I don’t swim well. I can’t go in the water. I can’t save a turtle that’s the size of a van.\"", "\"We don’t need to swim,\" Juno said. She looked around the muddy shore. \"We need buckets. Lots of buckets.\"", "\"Buckets,\" Barnacle repeated. \"You want to fill a turtle the size of a house with water. Using buckets. This is the most insane plan I have ever heard. I approve.\"", "Juno stood up. \"Teo, you know Mrs. Marchetti, right? Your mom?\"", "Teo nodded, looking terrified. \"Yes.\"", "\"Go get her. Tell her we need the whole bakery. Every bucket, every jug, every mop. Tell her it’s an emergency.\"", "\"An emergency?\" Teo squeaked. \"They’ll ask questions!\"", "\"Tell them the tide is sick,\" Juno said. \"And that I’m a doctor.\"", "\"Barnacle, can you talk to the seagulls?\"", "Barnacle puffed out his little chest. \"I can talk to many things. But the seagulls are busy stealing shiny things. However...\" He looked at Teo. \"If you promise not to laugh at me, I will try.\"", "Teo looked at the giant turtle, then at Juno. He took a deep breath. \"Okay. I’ll go. But if I get mud on my shoes, I’m blaming you.\""], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["Within ten minutes, the bakery doors burst open. Mrs. Marchetti stood there, flour on her apron, holding a broom. Behind her was a line of staff, customers, and a confused delivery driver.", "\"What is going on?\" Mrs. Marchetti demanded.", "\"Emergency,\" Juno said, not blinking. \"Turtle. Thirsty. Big.\"", "Mrs. Marchetti looked at the turtle. Then at Juno. Then at Teo, who was hiding behind a bucket.", "\"He’s my friend’s client,\" Teo said weakly.", "Mrs. Marchetti sighed. She looked at Old Fathom. The turtle blinked at her. Something in her eyes softened. She dropped the broom. \"Everyone! Buckets! Now!\"", "It started with a trickle. Then a stream. The staff of the bakery, wearing their white coats, marched to the edge of the mudflats. They carried buckets, jugs, and even a large silver tea urn.", "Juno joined them. She carried a small bucket, filling it from a nearby puddle. She poured it over the turtle’s shell. The water hissed as it hit the dry skin. Old Fathom let out a long, shuddering sigh.", "Teo stood back, arms crossed. He watched a baker named Marco pour water from a fire extinguisher. It was not water, but it was wet.", "\"This is ridiculous,\" Teo said. \"We are watering a rock.\"", "\"He’s not a rock,\" Juno said, though her arms were tired. \"He’s a friend.\"", "Barnacle was on a high spot, directing traffic. \"More water on the left! No, the other left! You’re going to give him an earache!\"", "Mrs. Marchetti looked at Juno. \"You’re a strange girl, Juno Vale.\"", "\"I’m a Tide Keeper,\" Juno said, though she kept her voice low.", "\"Of course you are,\" Mrs. Marchetti said. She picked up another bucket. \"Now stand back. We have a job to do.\"", "The mud was slippery. Juno slipped, catching herself on the rim of a bucket. Her raincoat got muddy. She didn’t care. The turtle was waking up. His eyes were brighter. His shell was glistening."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["The turtle’s skin was no longer dry. It was slick and dark. He stretched his long neck, and the sound was like a deep groan of relief.", "\"Thank you,\" he rumbled. \"The water... it tastes of salt and kindness.\"", "\"Kindness?\" Teo asked, stepping forward. \"We just poured tap water on you.\"", "\"Not just tap water,\" Old Fathom said. He looked at Juno. \"I remember when the tide was young. I remember when the first Keeper climbed the lighthouse. She had a whistle like a spiral shell. She listened. The sea answered.\"", "Juno felt a warmth in her chest. \"Grandma Ivy?\"", "\"She was the last,\" Old Fathom said. \"But the sea remembers. It waits for the next voice. The voice that listens, not the one that shouts.\"", "Juno looked at Barnacle. The crab was silent for once. He looked down at his teapot shell.", "\"Ivy was my friend,\" Barnacle said softly. \"She used to bring me crumbs. I complained, but I liked it.\"", "Old Fathom shifted his weight. The mud squelched. \"You need the Moon Pearl. It is in the wreck of the Dolly Marigold.\"", "Juno frowned. \"Where is that?\"", "\"Where the tide goes to sleep,\" Old Fathom said. \"Look for what the moon keeps. It is in the mud. It waits for the one who hums.\"", "Teo scratched his head. \"That’s a riddle. I hate riddles. They’re just puzzles with no instructions.\"", "\"It’s not a riddle,\" Juno said. \"It’s a map.\"", "Barnacle crawled over to her. \"The Dolly Marigold sank fifty years ago. It’s a pile of rust and barnacles. You’ll need a map. Or a very good guess.\"", "Juno looked at the log in her bag. She thought of Grandma Ivy’s handwriting. *Where the tide goes to sleep.*", "She looked at the mud. It was grey and still. It looked like sleep.", "\"We go now,\" she said.", "Teo groaned. \"It’s raining. And I have shoes.\"", "\"You have a tool belt,\" Juno said. \"You can fix anything. Even your fear.\"", "Teo looked at her. For a second, he looked afraid. Not of the water, but of being the one to fail. Then he straightened his green cap.", "\"Fine. But if I get stuck, you’re pulling me out.\""], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["They walked toward the darker part of the bay. The rain had stopped, but the air was thick with mist. The mud was deeper here. It sucked at their boots.", "Teo tried to keep his feet dry. He failed. Mud splashed onto his green cap. He looked like a swamp creature.", "\"Barnacle,\" Teo said, \"do you have a map?\"", "Barnacle was on his shoulder. \"I have a memory. And a grudge. The Dolly Marigold was owned by a man who stole my favorite seagull. I remember the hull. It has a hole in the side.\"", "\"A hole?\" Juno asked.", "\"A big one,\" Barnacle said. \"It’s where the pearl sleeps. Or hides. Pearls are sneaky.\"", "Juno looked at the horizon. The lighthouse was a dark silhouette. The Dolly Marigold should be nearby.", "They walked for an hour. The mud got thicker. Teo’s boots squelched with every step. He was miserable.", "\"I’m going to die in this mud,\" he muttered.", "\"You’re not,\" Juno said. \"You’re just wet.\"", "\"Wet and dying.\"", "Barnacle yawned. \"Honestly, the drama is exhausting.\"", "Juno stopped. She looked at the water. It was calm now. The mist was lifting. And there, in the distance, she saw it. A dark shape. A broken mast. The wreck of the Dolly Marigold.", "\"There,\" Juno whispered.", "Teo looked. \"That looks like a skeleton.\"", "\"It’s a ship,\" Juno said. \"And it’s waiting for us.\"", "She took a deep breath. The air smelled of salt and old wood. She felt a pull, gentle but strong. Like a hand reaching out from the water.", "\"Ready?\" she asked.", "Teo wiped mud from his glasses. \"No. But I’m here.\"", "Juno smiled. She reached into her pocket and took the spiral shell whistle. She didn’t blow it. She just held it. She listened.", "The sea was quiet. But it was listening back."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "The Wreck of the Dolly Marigold", "part": "PART TWO: THE THREE KEYS", "paras": ["The hull of the Dolly Marigold rose from the mud like a sleeping giant. It was black with age, its wood twisted and gnarled, reaching up into the grey sky. Juno stood at the base, her yellow raincoat splattered with brown streaks. She felt a strange vibration in her chest, a hum that matched the silence of the bay.", "Teo adjusted his round glasses. His face was pale, and his hands trembled slightly as he gripped his tool belt. \"I can’t go inside,\" he whispered. \"It’s dark. It’s deep. What if the floor falls out?\"", "Barnacle scuttled down Juno’s sleeve to her shoulder. \"Honestly, you are overthinking the structural integrity of a rotten plank. It is a ship, not a trap.\"", "Juno looked at Teo. She didn’t mock him. She remembered the first time she had blown the whistle, how the sea had felt like a giant eye watching her. She knew he was scared of the deep. But he was here.", "\"You don't have to go deep,\" Juno said softly. \"Just the wheel. Can you do that?\"", "Teo swallowed hard. He looked at the jagged hole in the side of the hull, where Barnacle said the pearl slept. He took a shaky breath and stepped onto the lowest plank. The wood creaked, a long, groaning sound that echoed in the mist.", "\"I'm just going to touch it,\" Teo said, his voice small. \"Just to see if it's solid.\"", "He reached out. His fingers brushed the cold, wet wood. It held."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["Teo climbed higher. The air inside the wreck was thick with the smell of salt and old varnish. It was cooler here, and the light from outside was dim, turning the interior into a cave of shadows. Juno stayed on the deck, holding the spiral shell whistle tight in her palm. She could feel the warmth of it, pulsing gently against her skin.", "\"I can see the wheel,\" Teo called out. His voice echoed strangely, bouncing off the curved ribs of the ship. \"It’s… it’s green. Covered in slime?\"", "\"Not slime,\" Barnacle corrected from Juno’s shoulder. \"Algae. Very dignified algae. Probably judging your hair.\"", "Teo ignored him. He reached the center of the cabin. The ship’s wheel was massive, its spokes thick and heavy. But it wasn’t just sitting there. It was locked. A strange mechanism of brass gears and wooden pins held it in place.", "\"It doesn’t turn,\" Teo said, frowning. He tried to push the spokes. They didn’t budge. \"Juno, it’s stuck. I think it’s frozen.\"", "Juno closed her eyes. She listened. The wind was still. The mud was quiet. But there was a sound, very faint. A ticking. Not from the clock in the lighthouse, but from somewhere deeper. From the sea itself.", "\"Don't push,\" Juno said. She walked closer to the edge of the deck, peering into the darkness of the cabin. \"Listen, Teo. What does the wheel sound like?\"", "Teo paused. He pressed his ear against the cold wood. \"It sounds… hollow.\""], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["\"Hollow like a drum,\" Juno murmured. She remembered her Grandma Ivy’s log. *Where the tide goes to sleep, look for what the moon keeps.* The moon didn’t keep things by force. It kept them by song.", "\"Teo,\" Juno said. \"Can you hum? A low note. Like the wind.\"", "Teo looked at her, confused. \"Hum? Why?\"", "\"Just do it. Make the air move.\"", "Reluctantly, Teo placed his hand on the top of the wheel. He took a deep breath and hummed a low, steady note. It wasn’t a pretty song. It was wobbly and a little bit squeaky.", "But as the note vibrated through the wood, something clicked.", "The brass gears inside the wheel shifted with a satisfying *thunk*. The wheel groaned, then spun freely. Behind it, a hidden panel slid open with a sigh of trapped air.", "Teo stared. \"Did I just… fix it with a bad voice?\"", "Barnacle grinned. \"You provided the resonance. I provided the confidence. Mostly confidence.\"", "Juno felt a rush of pride. She hadn’t solved it with strength. She had solved it with listening. The sea had answered.", "Inside the panel was a small box, made of driftwood and sealed with wax. It was dry, perfectly preserved. Juno held out her hand.", "\"Bring it here,\" she said.", "Teo carefully lifted the box. It was lighter than he expected. As he handed it over, the mist outside began to swirl, dancing around the edges of the wreck."], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["Juno broke the wax seal. It snapped clean, releasing a scent of lavender and sea salt. Inside the box, resting on a bed of soft blue velvet, lay the Moon Pearl.", "It was not a standard pearl. It was large, the size of a tennis ball, and it swirled with shades of silver and deep indigo. It looked like a piece of the night sky had been captured and frozen.", "Juno lifted it. It was cool to the touch, smooth as glass. As soon as her fingers touched its surface, the pearl began to glow. A soft, pulsing light spread from its center, illuminating the dark cabin.", "Teo gasped. \"It’s… it’s alive.\"", "\"Not alive,\" Barnacle said, though his voice was hushed. \"Awake.\"", "Juno looked at the pearl. It was beautiful, but it felt heavy. Not with weight, but with purpose. She could feel the hum of it, matching the rhythm of her own heartbeat.", "\"It’s the Moon Pearl,\" she whispered. \"The first key.\"", "Teo adjusted his glasses, squinting at the light. \"So, what now? Do we wind it? Do we put it in the clock?\"", "\"Not yet,\" Juno said. She tucked the pearl into her pocket, close to the shell whistle. The two objects seemed to vibrate together, a duet of magic and memory. \"We need the other keys. Without them, the clock won’t accept the gear.\"", "She looked out at the misty bay. The sun was beginning to set, painting the clouds in shades of orange and purple. The silence of the harbor felt different now. It felt expectant.", "\"We have eight days,\" Juno said. \"And three more things to find.\"", "Teo looked at the pearl’s glow fading in her pocket. \"That’s a lot of stuff to find in a town that has no tide.\""], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["They climbed out of the wreck. The mud had dried slightly, making the surface harder to walk on. But the air was colder now, carrying the first chill of the evening.", "Barnacle had climbed up to Juno’s collar, peeking out from her raincoat hood. \"For a piece of jewelry, it has a lot of attitude,\" he muttered.", "Juno smiled. It was a small smile, but it reached her eyes. She felt lighter. The fear that had been sitting in her stomach since they arrived had shifted, turning into something solid. Determination.", "They walked back toward the harbor. The boats were still tilted in the mud, their masts pointing accusingly at the sky. But as they passed the bait shop, Grandpa Ozzie’s light was on.", "Juno stopped. She looked at Teo. He looked at the light.", "\"Your grandpa is awake,\" Teo said. \"It’s early.\"", "Juno nodded. She touched the pocket where the Moon Pearl glowed softly. \"Maybe he’s not sleeping,\" she said. \"Maybe he’s listening.\"", "She took a step toward the house. The harbor bell, silent for eleven months, seemed to vibrate in the wind. Or maybe it was just her imagination.", "Or maybe it was the start of something new.", "Juno pulled her yellow raincoat tighter and walked forward. The sea was quiet, but it was waiting. And for the first time in a year, Juno wasn’t afraid to let it speak."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "The Silver Car", "part": "PART TWO: THE THREE KEYS", "paras": ["The headlights cut through the dusk like two angry eyes. Juno froze. The silver car was parked right where they had been digging, its chrome bumper gleaming in the fading light. The door slid open, and Mr. Cornelius Grubb stepped out. He smoothed his tiny mustache and looked at them with a smile that didn’t reach his eyes.", "\"Well, well,\" he said, his voice smooth as oil. \"Little scavengers. I see you’ve been poking around my property.\"", "Juno stepped in front of Teo. She touched her pocket. The Moon Pearl hummed against her fingers, a warm, rhythmic beat. \"It’s not your property,\" she said. Her voice shook, but only a little. \"It’s a wreck. It’s been here for a hundred years.\"", "Grubb tilted his head. \"A hundred years of neglect,\" he said. \"But I have offers that are very good. I’m talking about a full renovation. New paint. New docks. Maybe a parking lot where that old lighthouse stands. It’s a shame to let it rot.\"", "He looked at Juno, really looked at her, and his gaze dropped to her hand. \"And that? Is that a pretty pearl?\"", "Juno’s heart hammered. She pulled her hand behind her back. \"It’s a rock,\" she lied.", "\"Is it?\" Grubb took a step closer. He smelled of expensive cologne and stale coffee. \"I have a collection. I’d pay a fair price for a unique find. For a girl who wants to be home in time for dinner.\"", "Teo shifted his weight. His tool belt clinked. \"My dad says you can’t buy history, Mr. Grubb.\"", "\"History is expensive, son,\" Grubb said softly. \"But the future is convenient.\""], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["Juno didn’t want to be greedy. She didn’t want to sell Grandma’s secret to a man who wanted to build mini-golf holes on sacred ground. But she also didn’t want to be rude.", "\"No, thank you,\" she said. \"We’re just cleaning up.\"", "Grubb sighed, a long, theatrical sound. \"Disappointing. I suppose I’ll just have to file the paperwork tomorrow. The harbor is mine, legally speaking, as soon as the banks approve the loan.\" He paused, his eyes narrowing. \"Be careful out there, children. The mud is deep.\"", "He got back into the car. The engine purred, a low, predatory growl. As the car pulled away, the headlights swept over the mudflats, illuminating the dark water and the silent boats.", "Teo let out a breath he seemed to have been holding for an hour. \"Did you see that?\"", "\"See what?\" Juno asked, her legs feeling like jelly.", "\"The door,\" Teo said. He pointed a shaking finger at the retreating silver car. \"The driver’s side door. There’s a mark.\"", "Juno squinted. The car was already a speck in the distance, but in that final flash of light, she saw it. A small, dark scrape on the silver paint. It wasn’t a dent. It was a missing piece. A tooth-shaped void.", "\"It looks like a gear,\" Juno whispered.", "\"A gear?\
