" Teo adjusted his round glasses. \"Grubb’s office is full of clocks. I saw it once when I dropped a wrench. He had a brass gear on his desk. Big one. Heavy.\"", "Juno’s blood went cold. The Moon Gear. It was missing from the Tide Clock.", "\"He took it,\" she said. The words fell out of her mouth before she could catch them. \"He took it from the lighthouse.\"", "Teo stared at her. \"That’s... that’s a big accusation, Juno.\"", "\"Look at the car,\" she insisted. \"Why would a developer have a mark on his car that looks exactly like the missing part of the sea’s heart?\""], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["\"Maybe it’s a scratch from a key,\" Teo suggested, though he didn’t sound convinced.", "\"Maybe,\" Juno said. She felt a strange mix of anger and fear. If Grubb had the Moon Gear, he didn’t know what it was. He thought it was an antique. But he had it. And he wanted to buy the harbor.", "\"Why does he want the harbor?\" Teo asked.", "\"Money,\" Juno said. \"He thinks the tide is dead. He thinks the land is worth more as a parking lot than a harbor. If the tide comes back, the land is worth more, but he wants it cheap. He wants it broken.\"", "Teo looked at the mud, then at the sky. \"So we fix it. We get the other keys. We put the gear back.\"", "\"We have to,\" Juno said. \"But we can’t let him know we know.\"", "They turned to leave, but a strange sound stopped them. A high-pitched squeak. Then a muffled thud.", "Biscuit, Grandpa’s fat orange cat with the chewed left ear, was standing in the middle of the road. But he wasn’t looking at them. He was looking at the silver car, which had stopped again a few feet ahead.", "\"Get away from there, Biscuit!\" Juno hissed.", "Biscuit hissed back. He batted at the air near the car’s rear bumper. Then, with a confused look, he jumped up and squeezed himself into the gap between the car and the curb. It was a tight squeeze. The fat cat wriggled, his orange fur fluffing up, and slipped under the chassis.", "\"Did he just... enter the car?\" Teo asked.", "\"No,\" Juno said, her stomach dropping. \"He went under it. And now he’s stuck.\"", "They ran to the car. Biscuit’s eyes were visible under the bumper, wide and green. He was trapped in the tight space between the undercarriage and the mud, his tail twitching in irritation.", "\"Mr. Grubb!\" Teo called out. \"There’s a cat under your car!\"", "Grubb rolled down his window. He looked annoyed. \"I don’t have time for animals. I have a meeting in ten minutes.\"", "\"He’s stuck!\" Juno shouted.", "Grubb sighed. \"Fine. Give me a moment.\" He stepped out, not to help, but to check his watch."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["\"Can you help us?\" Juno asked, trying to keep her voice steady.", "Grubb looked at Biscuit, then at them. \"I’ll call a professional. It’s safer that way.\"", "\"No!\" Juno said. \"He’s fine. He just needs a nudge.\"", "Grubb raised an eyebrow. \"You want to get under my car? In the mud?\"", "\"We can manage,\" Teo said. He rolled up his sleeves.", "Juno knelt down. She didn’t want to touch the car. She didn’t want to be near Grubb. But Biscuit was her friend. And Biscuit looked back at her with a face of pure disdain.", "\"Go on, Biscuit,\" she whispered. \"Out.\"", "Biscuit meowed, a sound like a rusty hinge. He tried to back out, but his back legs got tangled in the mud. He stuck.", "\"Teo, get his tail,\" Juno said.", "Teo knelt down, his knees sinking into the soft earth. He reached under the car. \"It’s tight,\" he muttered. \"I can barely see.\"", "\"Push him forward,\" Juno instructed. \"Gently.\"", "Teo pushed. Biscuit squirmed. For a second, nothing happened. Then, with a squeak of protest, the fat orange cat popped out from under the chassis, landing on his feet with a thump. He shook himself off, spraying a fine mist of mud over Teo’s green cap.", "Teo froze. A single drop of brown mud sat on the brim of his cap.", "\"Teo,\" Juno said slowly.", "Teo looked at his cap. He looked at Biscuit, who was licking his paw with an air of superiority.", "\"I’m getting mud off my cap,\" Teo said quietly.", "Grubb, who had been watching, snorted. \"Cats are messy creatures. I’m glad I’m not a pet owner.\"", "Juno stood up. She wiped her hands on her yellow raincoat. \"Thank you, Mr. Grubb. For stopping.\"", "\"It’s not a problem,\" Grubb said, checking his watch again. \"But do be careful. The tide is low. The mud is deceptive.\"", "He got back into the car. The engine started. But this time, he didn’t drive away. He sat in the car, the engine idling, the headlights cutting into the dark."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["Juno stared at the car. Why was he staying?", "\"Juno,\" Teo whispered. \"He’s not leaving.\"", "Grubb rolled down the window again. He didn’t look at them. He was looking at the lighthouse in the distance. The dark silhouette of the tower loomed against the twilight.", "\"I saw you climb it,\" Grubb said. His voice was low. \"Two days ago. I have cameras in the bay. For security. For my future... parking lot.\"", "Juno’s heart stopped.", "\"I didn’t care,\" he continued. \"Who cares about a few kids playing in a ruin? But today, I saw you take something from the wreck. I saw the light. A blue light. Unnatural.\"", "Juno’s hand went to her pocket. The Moon Pearl was pulsing. She could feel it.", "\"I’m not a thief,\" she said. \"It belongs to the sea.\"", "\"Everything belongs to the highest bidder,\" Grubb said. \"And the sea is gone. It’s dead. You’re just picking bones.\"", "He started the car. The tires spun in the mud, throwing dirt over their boots.", "\"Wait!\" Juno yelled. \"If you take the gear, the tide won’t come back. Everyone will lose their homes. The fish will die. The boats will rot.\"", "Grubb’s head turned, just slightly. \"That’s a lot of pressure for two children.\"", "He drove away. The silver car disappeared into the night, leaving only the smell of exhaust and the sound of the wind.", "Juno stood still. Her hands were shaking.", "\"He knows,\" she said. \"He knows we have it.\"", "Teo took off his muddy cap and looked at it. \"He has cameras. He knows where we are. He knows what we’re doing.\"", "Juno looked at the lighthouse. The dark shape of it seemed to lean toward them, waiting.", "\"Then we’re faster,\" she said. \"We have to get the second key. Tonight.\"", "Biscuit yawned and walked away, unbothered by the drama."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "The Deep Court", "part": "PART TWO: THE THREE KEYS", "paras": ["The summons came not as a knock, but as a hum. It vibrated in Juno’s teeth, a low, resonant thrum that tasted like copper and cold air. She was sitting on the rotting dock, her yellow raincoat dripping, when the water at her feet began to swirl. It didn’t splash. It drew inward, forming a perfect, shimmering circle in the black mud.", "\"Honestly!\" Barnacle screeched, his tiny claws scraping against the chipped blue teapot shell. \"I told you she was punctual to a fault. Now, if you’ll excuse me, I have a very important meeting with my own dignity.\"", "Juno gripped the rail. Her heart hammered against her ribs. She looked at the swirling pool. It was no larger than a dinner plate, but the light coming from it was deep violet, pulsing like a slow heartbeat.", "\"Go,\" Barnacle urged, his voice trembling slightly. \"Do not be late. The Queen does not wait for latecomers. Or children. Or crustaceans who complain about the humidity.\"", "Juno took a breath. The air smelled of salt and something older, something vast. She leaned over the edge. The water didn’t look like water anymore. It looked like a door.", "She whispered, \"I’m listening.\"", "The pool widened."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["The transition was like falling through velvet. One moment Juno was standing on wet wood; the next, she was kneeling on sand that felt warm and dry, though she was still damp. The air was thick, pressing against her ears, heavy with the scent of deep ocean and ancient stone.", "She was in a cavern, but it wasn’t dark. Columns of translucent coral rose around her, glowing with soft bioluminescence. They formed a grand, arched hall. In the center, on a throne of polished pearl, sat Queen Nautilia.", "The nautilus was enormous. Her shell spiraled in elegant, iridescent curves, shifting colors from blue to gold. Her eyes were large, dark, and ancient. She did not blink.", "Juno’s knees felt like jelly. She wanted to speak, to introduce herself, to explain that she was new and a bit scared. But the Queen’s gaze pinned her in place.", "\"You are the one who blew the whistle,\" the Queen said. Her voice was not a sound. It was a vibration that Juno felt in her chest. \"The one who thinks she can wake the sea.\"", "Juno swallowed. Her throat was dry. \"I just want the tide back. Please.\"", "The Queen tilted her massive head. \"The sea does not *want*. It *is*. And right now, it is forgetting. It is forgetting this bay. It is forgetting us. You carry the key, child, but do you carry the weight?\"", "Juno looked down at her hands. They were shaking. \"I don’t know how,\" she whispered. \"I’m just... I’m just an eleven-year-old girl.\""], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["Queen Nautilia rose. The movement was slow, majestic, like a mountain shifting. The water around the throne rippled, sending out waves of cold mist that settled over the sand.", "\"To rule the tide, one must first understand its absence,\" the Queen said. Her voice echoed, bouncing off the coral walls. \"You claim to listen. But listening is not hearing noise. It is hearing the space between the notes.\"", "The Queen waved a tentacle. The bioluminescence in the cavern dimmed. The soft hum of the ocean, which had been a constant background to Juno’s thoughts, faded.", "Silence rushed in. It was not empty. It was heavy. It pressed against Juno’s eardrums. The silence felt sharp, like a blade. It tasted of salt and regret.", "Juno closed her eyes. She tried to find the sound, but there was only the thumping of her own heart. She tried to remember Grandma Ivy’s voice, but it was gone. She tried to remember Barnacle’s complaints, but he was silent.", "\"Name what is missing,\" the Queen commanded. The silence pressed harder. It was suffocating.", "Juno opened her eyes. Tears pricked the corners of her eyes. She looked at the Queen, who waited with patience that spanned centuries.", "\"I hear... the moon,\" Juno said, her voice barely a whisper."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["The Queen’s eyes narrowed. The bioluminescence flickered, responding to the shift in the air.", "\"The moon’s song,\" Queen Nautilia said. The words were heavy, weighted with truth. \"The moon does not shine, child. It *sings*. And the sea answers that song. Without the song, the sea forgets how to breathe. Without the breath, the tide dies.\"", "Juno blinked, stunned. She had felt it, a pull in her chest, a rhythm she couldn’t name. It wasn’t just gravity. It was music.", "The Queen sat back down. The pressure in the room eased, just a fraction.", "\"You are not brave,\" the Queen said, her voice softer now. \"You are not loud. You are... attentive. That is rarer. And more dangerous.\"", "Juno let out a breath she didn’t realize she had been holding. \"So... can you help me? I need the Salt Compass. It’s the second key.\"", "The Queen’s tentacles curled slightly. \"The Salt Compass is not a gift. It is a test. It waits where the sea meets the sky, where the gulls scream their warnings. Gull Rock. A bell-buoy stands there, singing to the wind. The compass is inside the bell.\"", "Juno’s mind raced. Gull Rock was at the edge of the bay, a jagged piece of rock that jutted out into the deep water. It was where the current was strongest.", "\"It’s far,\" Juno said. \"And the water is low. We can’t swim to it. Not with the tide gone.\"", "\"The sea is shrinking,\" the Queen said, her eyes hard. \"But it is not gone. Not yet. Find the compass, Keeper. Before the silence becomes permanent.\""], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["Juno stood on unsteady legs. \"How do I get back?\"", "The Queen didn’t answer. She simply raised one long, elegant tentacle. The floor beneath Juno’s feet began to dissolve, turning into mist.", "\"Honestly!\" Barnacle’s voice echoed from somewhere above, though he wasn’t there. \"I told you this was a one-way trip for my dignity!\"", "Juno grabbed a handful of the warm sand. It slipped through her fingers, turning into sea spray. The cold air rushed back in, sharp and salty.", "She was back on the dock. The night was colder now. The mud beneath her boots was wet again. The swirling pool was gone, leaving only a dark stain in the earth.", "Juno looked at her hands. They were still shaking, but the fear had changed. It was no longer a cold dread. It was a hot, bright determination. She could hear it now. A faint, distant hum. The moon’s song.", "It was waiting for her to answer.", "She turned to the lighthouse, then back to the bay. Gull Rock was a black silhouette against the stars.", "\"Teo,\" she said. \"We need to go to Gull Rock.\""], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "Gull Rock", "part": "PART THREE: THE STORM", "paras": ["The rowboat groaned against the mud like a tired old dog. It was Day Four, and the sun hung low and heavy over Saltmarsh Harbor. Juno sat in the bow, her yellow raincoat buttoned tight against the damp chill. She hugged her knees, watching the water lapping at the hull. It was thin, barely enough to float them, but it was there.", "\"Steady,\" Teo said from the stern. He was standing on a wooden cart wheel, his green cap pulled low over his messy black hair. His tool belt clinked with every movement. He looked less like a sailor and more like a mechanic who had taken a wrong turn into the sea. \"If you look at the water, you’ll get sick. Look at me. I’m very boring.\"", "\"I’m not looking at the water,\" Juno lied. Her stomach gave a nervous flip. \"I’m looking at the gulls. They’re very aggressive today.\"", "Above them, a white shape circled in lazy, predatory loops. *Admiral Squawk*, as Barnacle had dubbed him in the log. He let out a shriek that sounded like a rusty hinge.", "\"Honestly!\" Barnacle’s voice came from inside Juno’s pocket, where he clung to the hem of her raincoat. \"That bird has the grace of a dropped spoon. Tell him to go away, Juno. Tell him his feathers are matted.\"", "Juno smiled, the tension in her shoulders easing slightly. \"I can’t talk to him, Barnacle. I just have to listen.\"", "The cart wheels squelched in the mud as Teo pulled the boat forward. The transition from land to water was a wet, sucking sound that made Juno’s teeth chitter. She took a deep breath, tasting salt and rust."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["The current was gentle, a slow push against the boat’s side. They had left the muddy shore and entered the narrow channel toward Gull Rock. The air smelled of brine and cold iron.", "Teo pushed the oars with careful, rhythmic strokes. His hands were wrapped tightly around the wood, knuckles white. Juno could see the vein in his neck pulsing. He was scared. She had seen it before, the way he hovered at the edge of pools, never quite stepping in.", "\"You’re doing great,\" she said softly.", "\"I’m doing fine,\" Teo corrected, his voice tight. \"I’m just... calculating the buoyancy.\"", "\"Barnacle says you’re sweating through your tool belt,\" Juno said.", "\"Does he?\" Teo didn’t look back. \"Well, Barnacle is a crab. He’s wet all the time. He doesn’t understand dry skin.\"", "Juno grinned. She reached into her pocket and felt the small, hard shape of the shell whistle. It was warm, as if it had been sitting in the sun. She hadn’t blown it yet. Not here. The Queen had said to listen. So she closed her eyes and let the sound of the water wash over her.", "There was a rhythm to it. *Hush-hush, hush-hush.* Like a heartbeat.", "\"Juno,\" Teo said, stopping the oars. He pointed ahead. \"There.\"", "Gull Rock rose from the water like a jagged tooth. It was dark and jagged, covered in patches of green algae. Perched on top, a single, rusted bell-buoy sat silent. It looked lonely.", "\"He looks grumpy,\" Barnacle muttered. \"Probably hasn’t been polished since the last century.\"", "Juno nodded. \"He’s waiting for us.\""], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["The boat scraped against the rocks with a sharp *screech* that made both kids jump. Juno scrambled up the side of the boat, her boots finding purchase on the wet wood. She leaned out, her yellow raincoat bright against the grey stone.", "\"Teo, hold the boat!\" she called out.", "\"I am holding it with the force of my will!\" Teo shouted back, bracing himself against the oars. \"Don’t let go! If you fall in, I will not save you. I will document it.\"", "Juno laughed, a bright, sharp sound. She climbed onto the rock face. The stone was slick with algae, cold and slippery under her boots. She had to be careful. One wrong step and she’d be in the water, and she knew, with a sinking feeling, that Teo was watching her every move.", "She reached the top of the rock just as the sun dipped lower. The bell-buoy loomed over her. It was massive, painted a faded red that had chipped away to reveal rust underneath. A thick rope was tied around its neck, frayed and weak.", "\"Okay,\" Juno whispered to herself. \"Listening.\"", "She closed her eyes. The wind died down. The gulls fell silent. In the quiet, she heard it. A faint, metallic hum. *Ting-ting-ting.*", "It wasn’t a sound. It was a feeling. A vibration in the air.", "\"The compass,\" Barnacle whispered. \"It’s inside. The Queen said the Salt Compass is in the bell. You have to ring it.\"", "Juno opened her eyes. She looked at the heavy, iron bell. It was out of reach, hanging just above her head. She would have to climb the pole."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["Juno’s fingers found a crack in the rock. She pulled herself up, inch by inch. The air grew colder. The bell hung above her, swaying gently in the breeze.", "\"I can see it,\" she said, her breath fogging in the air. \"It’s glowing. Just a little.\"", "A soft, blue light pulsed inside the dark interior of the bell. It was beautiful and terrifying.", "\"Teo, are you seeing that?\" she asked.", "\"I’m seeing a blue light, yes,\" Teo’s voice came from below, tinny and distant. \"I’m also seeing you about to fall. Please don’t fall.\"", "Juno ignored him. She reached up, her hand closing around the cold iron of the bell’s rim. The metal was freezing, biting into her skin. She pulled herself higher, her boots sliding on the wet stone.", "\"Honestly,\" Barnacle complained from her pocket. \"You’re shaking. It makes my shell rattle. It’s very undignified.\"", "\"Shh,\" Juno whispered. \"I’m almost there.\"", "She swung her leg over the pole and dangled there, her toes just touching the ground below. The bell was right in front of her. She could see the Salt Compass inside, a small, intricate device made of brass and silver, spinning slowly in the air.", "It was beautiful. It was also very, very high up.", "Juno swallowed hard. She reached for it. Her fingers brushed the cold brass. For a second, she froze. The height. The drop. The water below.", "*You are not brave, only loud,* the voice in her head whispered.", "*No,* she thought back. *I am listening.*", "She grabbed the compass. It was warm, like the shell whistle."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["Juno’s fingers slipped.", "The Salt Compass tumbled from her grasp, spinning wildly in the air. It didn’t fall into the water. It landed with a soft *clink* in a narrow crack in the rock face, just below the bell.", "\"Oh, no,\" Juno breathed.", "\"OH, NO!\" Barnacle shouted. \"It’s in the crack! The crack is wet! If it gets wet, it rusts! And if it rusts, we are all doomed! Honestly, Juno, this is a disaster!\"", "Juno looked down. The crack was deep, dark, and out of reach. She dangled from the bell’s rim, her arms trembling. The water below was black and deep.", "\"I can’t reach it,\" she said, her voice shaking.", "\"Let me,\" Teo said.", "Juno looked down. Teo was standing on the rock, his face pale. He was looking up at her, then at the crack, then at the water. His jaw was tight.", "\"Teo,\" she said. \"You don’t have to—\"", "\"I’m fixing it,\" he said firmly. He reached into his tool belt and pulled out a small, silver wrench. \"I’m going to lever it out. It’s physics. I’m good at physics.\"", "He climbed up, his movements stiff and careful. He didn’t look at the water. He looked at the crack.", "Juno watched him, her heart pounding. She realized, with a sudden, sharp clarity, that he was doing it for her. He was scared. He was terrified. And he was still climbing.", "She felt a surge of warmth in her chest. A hot, bright determination.", "She wasn’t alone."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "Grandpa Forgets", "part": "PART THREE: THE STORM", "paras": ["The rowboat scraped against the muddy bank, leaving a long, wet streak that looked like a tear in the earth. Juno hopped out, her legs shaking, but her chest felt light. For the first time since Grandma Ivy died, she didn't feel like a suitcase nobody had unpacked. She felt like a girl who knew a secret.", "She walked up the harbor road, the Salt Compass tucked safely in her pocket. It hummed against her hip, a low, warm vibration like a purring cat. The air smelled of salt and old oil, but today it smelled like possibility. She could almost hear the tide breathing, a slow, rhythmic *in-out* that matched her own heartbeat.", "At the top of the hill stood the house, tall and narrow, with its windows dark against the twilight. The bait shop sign hung limp, its letters peeling. Juno kicked a pebble and smiled. She was going to tell Grandpa. He was going to be proud. He was going to help her.", "She grabbed the door handle, her fingers trembling with anticipation. The wood was cold and rough under her touch. Inside, the house was quiet. Too quiet. The only sound was the tick of the clock in the hallway and the soft breathing of Biscuit, who was asleep on the kitchen rug, his tail twitching in a dream.", "Juno pushed the door open. \"Grandpa? I have news. Big news. We found the compass!\"", "No answer.", "She took a step inside, her sneakers squeaking on the floorboards. \"Grandpa?\"", "From the living room, a voice came, soft and confused. \"Ivy? Is that you, my love?\"", "Juno froze. The smile died on her lips. Her heart gave a painful thud against her ribs."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["Juno stood in the doorway, her hand still on the cold brass handle. The name hung in the air, heavy and sharp. Ivy. Not Juno. Ivy.", "Grandpa Ozzie was sitting in his armchair, the blue knitted hat pulled low over his eyes. He was holding a cup of tea that had gone cold hours ago. His face was turned toward the door, but his eyes were unfocused, drifting past her as if she were a ghost.", "\"Grandpa?\" Juno whispered.", "He blinked, slowly, like a man waking from a deep sleep. \"Yes? Yes, Ivy, I remember. The tea is always cold. You always said I was a bad waiter.\"", "Tears pricked at Juno’s eyes. She wanted to scream. She wanted to shake him. But she saw the pain in his face, the confusion, the gentle sadness. She wasn't angry. She was heartbroken.", "She walked into the room, her steps soft on the carpet. \"It’s me, Grandpa. It’s Juno.\"", "He looked at her then. Really looked at her. But something was missing behind his eyes. A light that had burned out.", "\"Juno,\" he said, and the name sounded strange in his mouth, like a word he had forgotten. \"Oh. Juno. Hello, my little storm.\"", "He reached out and touched her cheek. His hand was warm and rough. \"You look just like her. You have her hair. And her stubbornness.\"", "Juno leaned into his hand. \"I missed you, Grandpa. And I missed the sea.\"", "He sighed, a long, weary sound. \"The sea missed us too, I think. It’s been very quiet since Ivy went.\""], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["Juno sat on the edge of the sofa, her knees pulled up to her chest. Grandpa poured more tea, his hands shaking slightly. He placed a mug in front of her, the steam curling up in the cool air.", "\"Why did you stop the shop?\" Juno asked, wrapping her hands around the warm mug. \"Why did you let the town slide? The boats are stuck, Grandpa. The fish are dying. The gulls are angry. Why didn’t you do something?\"", "Grandpa sat down heavily, his bad knee cracking. He looked at the empty harbor through the window. \"Because I was afraid,\" he said.", "Juno looked up. \"Afraid of what?\"", "\"Of being alone,\" he said. \"Ivy kept the sea. I kept the shop. When she was gone, I didn’t know how to do either. I thought if I stopped, maybe the pain would stop too. But it didn’t. It just got bigger.\"", "He looked at Juno, his eyes glistening. \"I thought if I waited, maybe she would come back. Or maybe the sea would come back on its own. But it didn’t. And I didn’t have the courage to try.\"", "Juno felt a lump in her throat. She had been so angry at him for being passive, for being forgetful. But now she saw the fear underneath. He wasn’t lazy. He was broken.", "\"I’m not afraid,\" Juno said, but the words felt thin.", "\"You are,\" Grandpa said gently. \"We all are, Juno. Being brave isn’t about not being afraid. It’s about doing the thing anyway. Even when your hands shake. Even when you don’t know the way.\"", "Juno looked down at her tea. She thought about the crack in the rock. She thought about Teo climbing up, his face pale, his hands tight on the wrench. She had been scared. She had almost fallen. But she hadn’t."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["\"I think I’m just loud,\" Juno said, her voice small. \"I think that’s all I’m good for. Talking. Shouting. Being the new kid who doesn’t know anything. I’m not brave, Grandpa. I’m just noisy.\"", "Grandpa reached out and squeezed her hand. \"No, my love. You are listening. You heard Barnacle. You heard the Queen. You heard the turtle. That’s not noise. That’s music. The sea doesn’t answer the loud. It answers the listening. You know that, don’t you?\"", "Juno nodded, a single tear escaping and rolling down her freckled cheek. She wiped it away with her sleeve. \"I know. But what if I forget? What if I get scared and I run?\"", "\"Then you come back,\" Grandpa said. \"And we try again. That’s what family is. We are the net that catches you when you fall. You don’t have to be perfect. You just have to be there.\"", "He stood up, using his driftwood cane for support. He walked to the window and looked out at the dark bay. \"I’m sorry, Juno. I’m sorry I let things get so bad. But I’m here now. And I’m not going anywhere. Not while you’re fighting for the sea.\"", "Juno felt a warmth spread through her chest. It wasn’t the hot, bright determination she had felt on the rock. It was softer. Steadier. Like the tide coming in, slow and sure.", "\"Thank you, Grandpa,\" she said.", "He turned back to her, his face softening. \"Now, tell me about this compass. And this 'Barnacle.' I’ve heard a lot about him. He’s a grumpy old crab, but I think he’s got a good heart. Under all that complaining.\""], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["Juno wiped her eyes and took a deep breath. She pulled the Salt Compass from her pocket. It glowed faintly, a soft blue light that pulsed in time with her heartbeat.", "\"It’s real, Grandpa,\" she said. \"The log was right. The keys are out there. And we have to find them before the Grand Low. In five days.\"", "Grandpa looked at the compass, then at Juno. \"Five days,\" he repeated. \"That’s a long time. And a short time. We need to be careful. We need to be smart.\"", "\"We have Teo,\" Juno said. \"And Barnacle. And me.\"", "\"And me,\" Grandpa added, smiling faintly. \"I may be forgetful, but I’m not useless. I know the tides. I know the rocks. I know where the best bait used to be. And I know this town. Every street. Every secret.\"", "He extended his hand, palm up. \"Come on. Let’s go. We have work to do. And I’m going to need help. I’m getting too old for this, and my knee is acting up.\"", "Juno took his hand. It was strong, despite the frailty. She felt a surge of hope. They were a team. A small, strange team. A girl, a boy, a crab, a turtle, a nautilus, and an old man with a bad knee.", "But it was enough.", "\"Come on, Grandpa,\" she said. \"Let’s go wind the clock.\"", "Grandpa nodded, and for the first time in a year, he didn’t look tired. He looked ready."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "Grubb's Office", "part": "PART THREE: THE STORM", "paras": ["The air above the hardware store smelled of sawdust and old motor oil. It was Day Six, and the rain had finally stopped, leaving the town slick and grey. Juno adjusted her yellow raincoat, though she didn’t need it. She just liked the feeling of being covered.", "\"Are you sure about this?\" Teo whispered. He adjusted his round glasses, which were slightly crooked. His messy black hair stuck up in the back, and his green cap looked like it had survived a hurricane. He tugged at the hem of his canvas tool belt, a nervous habit that made him look even more anxious.", "\"He’s not coming back for at least an hour,\" Juno said. She pointed to the glass door of the office above the hardware store. \"And he left the back door unlocked. I heard the latch click.\"", "Barnacle, hidden in a burlap sack tucked under Juno’s arm, let out a muffled groan. \"Honestly! The acoustics in this sack are terrible. I can’t even hear myself think, which is a problem because I have so much to think about. And to complain about.\"", "\"Quiet,\" Teo hissed, though he didn’t turn around. He looked terrified. \"If he sees us, he’ll call the police. Or worse, he’ll ask us for advice on his parking lot.\"", "Juno grinned. It was a sharp, determined smile. \"We need the Moon Gear, Teo. Without it, the clock doesn’t work. And if the clock doesn’t work, the sea forgets us. So, are we doing this, or are we standing here smelling like floor wax?\"", "Teo looked at the door, then at the empty street. He took a deep breath, his shoulders hunching up toward his ears. \"Fine. But if I drop my tools, I’m blaming you.\"", "Juno pulled the burlap sack tighter against her chest. Barnacle shifted, his chipped blue teapot shell knocking softly against the fabric. \"Ready when you are, child. Try not to be too loud. The silence of the office is sacred. And expensive.\"", "They slipped through the back door, the hinges creaking softly in the quiet afternoon."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["The office was colder than the street. It smelled of polished wood and expensive leather. Mr. Grubb’s desk was a massive slab of mahogany, gleaming under the harsh fluorescent lights. Papers were stacked in perfect, square piles. Not a single thing was out of place. It was the kind of order that felt like a trap.", "\"Look at this,\" Teo whispered, pointing at a row of trophies on a shelf. \"Do you think he actually won any of these? Or does he just buy them?\"", "\"Don't touch anything,\" Juno said. She scanned the room. Her eyes landed on the corner, where a large glass display case sat on a pedestal.", "Inside the case, resting on a velvet cushion, was a brass gear. It was huge, with intricate teeth that caught the light. It looked exactly like the one Juno had seen in the lighthouse. The Moon Gear.", "Juno’s heart hammered against her ribs. She took a step forward, but Teo grabbed her sleeve.", "\"Wait,\" he said, his voice trembling. \"Look.\"", "He pointed to the floor. A long shadow stretched across the room, falling over the desk. The shadow was moving.", "Juno froze. The sound of a key turning in the lock echoed through the silence. It was a small, sharp sound, but in the quiet office, it sounded like a gunshot.", "\"Run,\" Teo whispered.", "\"Where?\" Juno hissed. \"There are no windows!\"", "\"Anywhere! Just not here!\"", "Juno’s eyes darted around the room. She spotted a heavy oak cupboard behind the desk, used for storing files. It was narrow, but it was the only thing tall enough to hide them.", "\"Go!\" she urged.", "They scrambled behind the desk just as the front door swung open. The click of heels on the tile floor was rapid and precise. Mr. Grubb was coming in."], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["Juno and Teo squeezed into the cupboard. It was dark and smelled of old paper and pine oil. They huddled together, shoulders touching, trying to make themselves as small as possible. Barnacle’s shell bumped against Juno’s hip.", "\"Quiet,\" Juno mouthed.", "The door closed with a soft thud. The light from the hallway was cut off, leaving them in total darkness. They could hear Mr. Grubb’s footsteps, slow and deliberate, moving across the room.", "He stopped in front of the desk.", "\"Ah,\" he said. His voice was smooth, like oil on water. \"There we are. A very interesting day, indeed. The harbor vote is coming up, and I have a feeling I’m going to win. It’s almost too easy.\"", "Teo’s hand found Juno’s in the dark. He squeezed it, once, hard.", "Juno held her breath. She could hear the rustle of a jacket being taken off. The creak of a chair. And then, a silence that felt heavy and wrong.", "\"I don’t understand this gear,\" Grubb said, his voice lower now. \"The lighthouse keeper said it was just a decorative piece. A relic. But it doesn’t feel like a relic. It feels... important. Like it’s waiting for something.\"", "Juno’s eyes widened in the dark. He knew it was special. He just didn’t know why.", "She looked at Teo. He was staring back at her, his eyes wide in the faint sliver of light coming from under the cupboard door.", "\"He doesn’t know,\" she whispered. \"He thinks it’s just a part.\"", "\"Then we have to get it,\" Teo whispered back. \"But not like this. Not while he’s here.\"", "Juno nodded. She could feel the Moon Pearl in her pocket, pulsing with a faint, warm light. It was a beacon. A promise. But right now, it was just a small, glowing dot in the dark.", "She looked at the gap under the door. Grubb was still standing there, his silhouette sharp against the light.", "\"We wait,\" she said. \"And we listen.\""], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["The minutes stretched out like taffy. Juno’s legs were cramping. Barnacle had settled into a comfortable spot on her shoulder, his claws ticking softly against the fabric of her raincoat.", "\"I’m bored,\" Barnacle whispered. \"And I’m getting a cramp in my shell. It’s a very dignified cramp, but still.\"", "\"Shh,\" Juno hissed.", "Grubb was talking on his phone. His voice was distant, muffled, but Juno could make out the words.", "\"Yes, Mayor Pruitt. The vote is Friday. I expect the land to be mine by then. Yes, the parking lot. Yes, the mini-golf. It’s a win for everyone. Progress.\"", "Juno felt a cold knot form in her stomach. Friday. That was only two days away. If Grubb got the harbor, the lighthouse would be torn down. The Tide Clock would be scrap metal. And the sea would forget them forever.", "\"We have to stop him,\" Teo whispered. His voice was tight, strained. \"We can’t let him take the harbor.\"", "\"But how?\" Juno asked. \"He has money. He has lawyers. He has a silver car that can outrun the wind. What do we have?\"", "We have the truth, Juno thought. We have the log. We have the keys. And we have a girl who is not brave, only loud. But sometimes, loud is enough.", "She looked at Teo. He was frowning, his lips pressed into a thin line. He was thinking. She could tell by the way his fingers drummed on his knee.", "\"I have an idea,\" Teo said. \"But it’s risky.\"", "Juno’s heart skipped a beat. \"Tell me.\"", "Teo leaned in, his breath warm against her ear. \"We don’t steal the gear. We make him give it to us.\"", "Juno frowned. \"How?\"", "Teo’s eyes sparkled with a dangerous, brilliant light. \"By making him think he needs it.\""], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["Just then, a loud crash echoed from the other side of the cupboard. Papers flew across the room. Grubb’s chair scraped back.", "\"Who’s there?\" he called out, his voice sharp and angry.", "Juno and Teo froze. Their hearts were pounding so hard they could hear them in their ears. Barnacle went completely still, even his claws stopped ticking.", "Silence.", "Then, a sigh. Grubb’s voice came back, softer now. \"I must have imagined it. The stress of the deal is getting to me.\"", "Juno exhaled, a shaky breath that fogged in the cold air.", "\"We have to go,\" she whispered. \"Now. Before he checks the corners.\"", "Teo nodded. \"On three. One... two...\"", "Before he could say three, the light under the door flickered. A long, thin beam of light swept across the floor, moving slowly, methodically.", "It was a flashlight.", "Juno’s blood ran cold. He was looking for them. He was looking right there.", "The beam stopped. It hovered in the gap, just an inch from their toes.", "Juno looked at Teo. He looked back, his face pale, his glasses reflecting the light.", "\"Go,\" he whispered.", "But the door handle turned."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "The Falling-Out", "part": "PART THREE: THE STORM", "paras": ["The handle turned with a heavy clunk. Juno’s heart hammered against her ribs like a trapped bird. She grabbed Teo’s sleeve, her fingers digging into the canvas of his tool belt. \"Don't breathe,\" she whispered.", "The door swung open.", "Juno squeezed her eyes shut, waiting for the shout, the arrest, the end of the world. Instead, she heard the creak of expensive leather shoes. Then, a polite, confused sigh.", "\"Goodness me,\" Mr. Grubb said, his voice echoing in the small room. \"I really need to lock up better. These drafts are terrible.\"", "Juno cracked one eye open. Mr. Grubb was standing there, holding a silver flashlight, his shiny grey suit immaculate. He looked past the cupboard, down the hallway, and then back at the door. He was looking for a draft, not for them.", "\"Lost children, I suppose,\" he muttered, shaking his head. \"Or perhaps very small mice with very large ears.\"", "Teo’s shoulder nudged Juno. His face was a mask of pure, white terror. He mouthed the word, *Run.*", "But they were trapped. The only exit was the door he was guarding. If they burst out now, he would see them. He would call the police. He would take the Moon Gear, and maybe the keys, and the tide would die for good.", "Juno’s mind raced. She needed a distraction. Something loud. Something silly. Something that would make Mr. Grubb think this was a joke, not a crime.", "She looked at Barnacle, who was hiding in the crook of her elbow, his claws trembling.", "\"Honestly!\" Barnacle hissed, his tiny voice loud in the silence. \"If you do something stupid, I am suing your ancestors!\"", "Juno didn't answer. She just smiled."], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["Juno’s brain worked fast. She needed to be invisible. She needed to be quiet. She needed to be... herself. But being herself usually meant talking too much.", "She looked at Teo. He was shaking. He was the best person she knew. He could fix a bike engine with a toothpick. He could climb a tree in the rain. But right now, he was freezing.", "\"We have to go,\" Juno whispered.", "\"Go?\" Teo hissed back, his eyes wide behind his round glasses. \"He's right there! We go, we get caught. We stay, we wait it out.\"", "\"We can't wait it out!\" Juno hissed back, her voice cracking. \"He’s going to call the Mayor. Do you understand? He’s going to tell them we were here. He’s going to take the pearl. And then what? We sit in this cupboard until he forgets us?\"", "\"He won't forget us!\" Teo whispered, his voice rising in panic. \"He’ll check the corners! He’ll check the vents! You’re impulsive, Juno! You always charge in without a plan. You just *do* things!\"", "Juno felt a hot spike of anger in her chest. \"At least I’m doing something! You’re just standing there, shaking, being afraid of everything! You’re so scared of getting wet that you can’t even think straight!\"", "The words hung in the air between them, sharp and ugly.", "Teo stared at her. His face went pale, then red. \"Me? Scared?\" he whispered, his voice trembling. \"You think I’m the one who’s afraid? I’m the one who climbed into that wreck with the mud up to my neck. I’m the one who fixed that bell buoy. I’m not afraid, Juno. I’m trying to keep us alive.\"", "\"You’re trying to keep yourself safe!\" Juno shot back.", "Teo looked at her, and for a second, the anger vanished from his eyes, replaced by something cold and distant. He let go of her sleeve.", "\"Fine,\" he said, his voice flat. \"Stay. Get caught. Be brave. I’m out.\"", "He pushed past her, moving with a speed that surprised her. He slipped out of the cupboard door while Mr. Grubb was still looking at the hallway.", "Juno heard the floorboards creak, then the front door open, then close.", "She was alone."], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["Juno slumped against the back of the cupboard, sliding down until she hit the floor. Her knees felt like jelly. Her hands were still shaking.", "She waited for the anger to fade. It didn’t. It just turned into a cold, heavy stone in her stomach.", "*Be brave,* she thought. *But what if brave is just loud? What if I’m only loud because I’m scared?*", "She looked at Barnacle. He was staring at the floor, his little legs twitching.", "\"Well?\" Juno said, her voice small. \"Are you going to tell me what to do? Are you going to tell me how to be a hero?\"", "Barnacle blinked. \"Honestly? I’m telling you to stop talking. You’re being very quiet at last. It’s rather unsettling. But also... nice.\"", "Juno frowned. \"Nice?\"", "\"Yes,\" Barnacle said, climbing up her arm to sit on her shoulder. \"When you stop shouting, when you stop filling the air with noise, I can hear you. And when I can hear you... I can hear the sea.\"", "Juno stopped breathing. The sea. It had been silent for months. Or so she thought.", "She closed her eyes. She stopped trying to think. She stopped trying to fix. She just listened.", "At first, there was only the hum of the fridge from the room next door. The tick of the clock.", "Then, beneath it, a low, rhythmic thrum.", "*Thump-thump. Thump-thump.*", "It was like a heartbeat. Slow, deep, and patient. It came from everywhere and nowhere. It was the sound of the water waiting in the bay, pressed against the rocks, holding its breath.", "\"It’s still there,\" Juno whispered.", "\"It never left,\" Barnacle said softly. \"It’s just waiting for someone to listen without shouting.\"", "Juno opened her eyes. The fear in her chest was still there, but it was smaller now. It was just a feeling. And underneath it, there was a strength. A quiet, steady strength that hadn’t been there when she was yelling at Teo.", "She stood up. Her legs were still shaky, but her hands were steady.", "\"I’m not going to hide,\" she said.", "\"No,\" Barnacle agreed. \"You’re going to be heard.\""], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["Juno pushed open the cupboard door. The office was empty. Mr. Grubb was gone.", "She ran to the window and peeked out. The silver car was still there, parked by the curb, but the driver’s seat was empty. He must have gone to his car to call someone.", "Juno’s heart sank. If he called the Mayor, they would come. If they came, they would find the Moon Gear. And then they would take it, and the tide would die.", "She had to get it back. Now.", "But she couldn’t do it alone. Not with Teo gone. Not with her hands still shaking.", "She needed help. But who?", "Her mind raced through the town. Grandpa? He would forget where the office was by the time he got there. Mrs. Marchetti? She would bake a cake, which would be nice, but not helpful.", "Then, a thought hit her.", "The Mayor.", "If Mr. Grubb was going to call the Mayor, then the Mayor was going to be in the town hall. And if the Mayor was in the town hall...", "Juno grabbed her yellow raincoat from the hook by the door. She pulled it on, the bright yellow fabric standing out against the grey afternoon.", "\"I’m going to the town hall,\" she said to Barnacle, who was still on her shoulder.", "Barnacle sighed. \"Honestly, I had a feeling about this. You’re going to talk to the Mayor. And he’s going to think you’re a child. And he’s going to send you home.\"", "\"Maybe,\" Juno said. \"But maybe he won’t.\"", "She ran out of the office, down the stairs, and out the front door. The air was cool and smelled of salt and rain.", "The town was quiet. The boats were still tilted in the mud. The gulls were still grumpy. But Juno didn’t feel quiet. She felt loud. She felt loud in a good way.", "She ran down the harbor road, her yellow raincoat bouncing with every step.", "She was going to be heard."], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["The town hall was a big, brick building with a clock tower. The clock didn’t work, of course. It was stuck at 4:15.", "Juno pushed open the heavy wooden door. Inside, it was dark and smelled of dust and old paper.", "\"Hello?\" she called out.", "Her voice echoed.", "\"Who’s there?\" a voice called back.", "It was Mayor Pruitt. He was sitting at his desk, eating a doughnut. He looked up, his eyes wide.", "\"Juno?\" he said. \"What are you doing here?\"", "\"I need to talk to you,\" Juno said. She walked to the desk and put her hands on it.", "\"About what?\" Mayor Pruitt asked. He took a bite of his doughnut. \"Is it about the parking lot? Because Mr. Grubb is very persuasive. He says it will bring in tourists. He says we can have mini-golf. He says—\"", "\"Mr. Grubb has the Moon Gear,\" Juno said.", "Mayor Pruitt stopped chewing. He looked at her.", "\"What?\"", "\"The Moon Gear,\" Juno repeated. \"It’s in his office. And he’s going to sell the harbor. And if he does, the tide will never come back.\"", "Mayor Pruitt stared at her. Then he looked at the clock on the wall. It was still stuck at 4:15.", "\"Juno,\" he said slowly. \"Are you feeling okay? Did you have lunch?\"", "\"I’m fine,\" Juno said. \"But the tide isn’t. And I can hear it. Can’t you?\"", "She closed her eyes. She listened. The low, rhythmic thrum. The heartbeat of the sea.", "She opened her eyes.", "\"Listen,\" she said.", "Mayor Pruitt frowned. He leaned forward. He listened.", "For a second, nothing.", "Then, he stopped breathing.", "His eyes went wide. He dropped his doughnut.", "\"I... I hear it,\" he whispered.", "Juno smiled."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "The Storm Bell", "part": "PART THREE: THE STORM", "paras": ["The sky turned the color of a bruised plum. Then, with a crack that shook the jam jars on Grandpa’s windowsill, it started to rain. It wasn’t the gentle drizzle Saltmarsh Harbor was used to. It was a wall of water, roaring down from the sea like an angry giant. The town, which had been dry and dusty for eleven months, panicked. People scrambled to cover their fish stands. The gulls huddled under the eaves, looking confused and wet.", "Juno stood on the porch in her bright yellow raincoat, watching the drops hit the dry earth. She felt a strange pull in her chest, a humming vibration. It was Day Eight. One day until the Grand Low. One day until the sea forgot them forever.", "She grabbed her bag. Inside was the shell whistle, the Moon Pearl, and the Salt Compass. She needed the last key. The Storm Bell.", "\"Grandpa,\" she called out, not waiting for an answer. \"I’m going to the pier.\"", "\"Biscuit!\" Grandpa Ozzie shouted from the window, holding up the fat orange cat. \"He’s stuck in the soup pot again!\"", "Juno ran. The wind whipped her yellow coat around her legs. The air smelled of ozone and wet stone. For the first time in over a year, the world was loud. And for the first time, she didn’t mind. She wasn’t loud. She was listening."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["The stone pier was slick and treacherous. Juno gripped the rusted railing, her boots sliding on the wet rocks. The rain was so thick she could barely see ten feet ahead. She followed the riddle from Grandma Ivy’s log: *Where the thunder sleeps, the voice wakes.*", "The old boathouse at the end of the pier was leaning dangerously to one side. Its door was swollen shut. Juno shoved it. It groaned, then cracked open.", "Inside, it was dark and smelled of mold and old rope. Barnacle was waiting for her. He sat on a bucket, his chipped blue teapot shell glistening.", "\"Honestly!\" he shouted over the thunder. \"You’re late. I’ve been pacing. My shell is damp. Do you know what damp does to the paint?\"", "\"Quiet, Barnacle,\" Juno whispered. She held up the shell whistle. She blew softly. The sound was small, but in the silence of the boathouse, it felt like a command.", "From the corner, a deep, metallic hum vibrated through the floorboards.", "\"The bell,\" Barnacle said, his voice dropping to a serious whisper. \"It’s down there. In the reef. Under the water that isn’t there. It’s a trick, Juno. The tide is gone, but the water is still deep. You have to dive.\"", "Juno looked at the black hole in the floor where the stairs used to be.", "\"I can’t swim,\" she said."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["Barnacle’s claws twitched. \"You don’t need to swim. You need to listen. The water is holding its breath. If you listen, it will hold you.\"", "Juno looked at the dark opening. Her heart hammered against her ribs. She was afraid. She was so afraid her knees felt like jelly. But she thought of Grandma Ivy, standing in the rain, telling her that the sea answers the listening.", "She climbed over the edge.", "The water was cold. So cold it burned. It swirled around her ankles, then her knees. It wasn’t like swimming in a pool. It felt like sinking into a cold dream. The mud at the bottom was thick and heavy.", "She reached out. Her fingers brushed something smooth and round. She pulled it up. It was the Storm Bell. It was small, no bigger than her fist, and covered in green algae.", "When she lifted it, the bell let out a single, clear tone. *Ding.*", "The sound cut through the thunder.", "Juno froze. The water around her suddenly moved. It wasn’t a wave. It was a push. The current, which had been dead, roared to life. It grabbed her leg and pulled her down."], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["Juno kicked, but the mud was like glue. She couldn’t breathe. The bell clutched in her hand felt heavy. The wind howled above, a shriek of fury. She was trapped.", "Then, she heard it. A paddle splashing.", "\"Juno!\"", "The voice was ragged, scared, but strong. Teo.", "He was in the rowboat, fighting the wind. His green cap was gone, his messy black hair sticking up. His round glasses were cracked, but his eyes were wide and determined. He didn’t look at the water. He looked at her.", "\"I brought the ropes!\" he shouted, his voice barely audible over the storm. \"Grab them!\"", "He threw a thick, knotted rope into the water. It landed near her head. Juno reached out, her fingers closing around the wet fiber.", "\"Pull!\" Teo yelled.", "He rowed with every ounce of strength he had. The boat rocked violently. Juno pulled. The bell was heavy, but her arms were stronger. Inch by inch, she was dragged toward the edge of the boathouse.", "She climbed out, gasping, dripping, and holding the bell tight. Teo collapsed into the mud, shaking.", "\"You’re an idiot,\" Teo said, his voice trembling. \"A very loud, beautiful idiot.\"", "Juno looked at him. For the first time, she didn’t feel alone. She felt seen."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["They huddled in the doorway of the boathouse, the wind screaming around them. Juno wrapped a blanket around Teo’s shivering shoulders. He didn’t pull away.", "\"It’s okay,\" she said softly. \"You saved me.\"", "\"I didn’t do it for you,\" Teo muttered, though he looked at her with a softness that surprised them both. \"I did it because Barnacle said if you drowned, he’d have to live in a puddle. And his shell doesn’t like puddles.\"", "Barnacle, dry and furious, scuttled between them. \"Honestly! The drama. The mud. I thought you two were done for. I was about to start a will.\"", "Juno laughed. It was a small, wet sound, but it cut through the storm. She looked at the Storm Bell in her hands. It was warm now, vibrating gently.", "\"We have it,\" she said. \"All three keys.\"", "Teo looked up. \"And the gear?\"", "Juno’s face went pale. She touched the shell whistle at her neck.", "\"Grubb,\" she said. \"He has it. And he’s going to sell the harbor tomorrow.\"", "The bell let out a low, ominous hum, as if it agreed. The storm was just beginning."], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "Two Keepers", "part": "PART FOUR: THE GRAND LOW", "paras": ["The wind howled outside, rattling the peeling paint of the boathouse. Inside, the air smelled of wet rope and old salt. Juno held the Storm Bell, its metal surface slick with rain. It was heavy, but it felt alive, humming against her palms. Teo sat on a overturned bucket, his green cap askew. His hands were shaking, not from the cold, but from the adrenaline of the climb.", "\"I still can't believe you went down into the dark,\" Teo said, his voice barely a whisper. \"I thought I’d have to drag your body out.\"", "\"Please don't visualize it,\" Barnacle squeaked from Juno’s sleeve. The hermit crab in his chipped blue teapot shell looked thoroughly offended. \"Honestly! The gall. I was right there. I provided moral support and a tiny, sharp opinion about your swimming technique.\"", "Juno looked at the bell, then at Teo. The storm was getting louder, a low rumble that seemed to come from the earth itself. \"It’s almost time,\" she said. \"The bell needs to be rung for the town to hear. Grandma said the sea answers the listening, but the town needs to wake up.\"", "Teo pushed his round glasses up his nose. \"And if they don’t wake up? If they just keep selling the harbor?\"", "Juno touched the spiral shell whistle at her neck. \"Then we make sure they can’t miss it.\""], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["They stepped out into the gale. The rain hit their faces like cold needles. The boathouse door groaned as they pushed it open. The pier stretched out into the black water, the planks slick with mud and spray. Across the bay, the lights of Saltmarsh Harbor were dim, the town huddled under blankets, too afraid of the first storm in a year to go outside.", "\"Wait,\" Teo said, stopping short. He pointed to the edge of the pier where the wood met the air. \"The bell is too heavy to carry all the way to the tip. We need to ring it here, where the sound carries over the bay.\"", "Barnacle scuttled onto Juno’s shoulder. \"A bold strategy. Risky. But I suppose if you drop it, I will be very angry. And possibly wet. Do you know how hard it is to dry a teapot shell?\"", "Juno nodded. She lifted the Storm Bell. It was heavier than she expected, but her arms held. She looked at Teo. \"Ready?\"", "Teo swallowed, his eyes wide behind his glasses. He looked at the churning water below, then back at Juno. \"I’m ready.\"", "Juno pulled the rope tied to the bell’s clapper. She didn’t swing it like a weapon. She listened. She closed her eyes and listened to the wind, to the rain, to the distant, silent hum of the sea that felt like a held breath. She waited for the moment the wind paused, just for a second, between two howls."], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["She swung the bell.", "The sound was not just a noise. It was a voice. A deep, resonant *CLANG* that rolled across the bay, shaking the raindrops from the air. It vibrated in Juno’s bones, in the soles of her feet, in the tips of her fingers. The bell rang again, and again, each strike louder than the last, as if the metal were remembering what it was to be heard.", "On the shore, windows lit up. First one, then ten, then fifty. Doors creaked open. People stepped out into the rain, wrapped in towels and blankets, their faces pale and wide-eyed. They stood in the street, looking toward the pier, their mouths open in silent awe. The grumpy gulls on the roofs ruffled their feathers and hissed, but they didn’t fly away. They listened.", "Teo let out a breath he seemed to have been holding for days. \"They’re coming,\" he whispered.", "Barnacle’s antennae twitched. \"Yes, yes, the audience is arriving. Try to look less like you’re going to faint. It’s unbecoming for a Tide Keeper.\"", "Juno smiled, a tired, wet smile. She looked down the pier toward the town. The lights were like stars fallen onto the mud. For the first time in eleven months, the harbor felt like it was breathing again."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["A silver car purred out of the dark at the end of the harbor road. Its headlights cut through the rain, blindingly bright. It stopped at the edge of the crowd, the engine ticking as it cooled. The door opened, and Mr. Cornelius Grubb stepped out. He did not have an umbrella. He adjusted his shiny grey suit, his tiny mustache twitching with irritation.", "He looked at the crowd, then at the pier, then at the two small figures standing there. He didn’t look angry. He looked confused. He tilted his head, listening to the lingering echo of the bell, a sound that seemed to vibrate in the wet air.", "Juno wiped the rain from her eyes. She saw him. He saw her.", "He walked toward the pier, his shoes crunching on the gravel. He stopped a few feet away, his face in the harsh light of the car’s headlights. He looked at the bell in Juno’s hands. He looked at the shell whistle at her neck.", "\"That is a very old bell,\" Grubb said. His voice was smooth, polite, but his eyes were sharp. \"I believe it belongs to the town. Or to me, by tomorrow.\"", "Teo stepped forward, his tool belt clinking. \"It belongs to the sea,\" he said.", "Grubb’s eyebrows raised. \"The sea cannot own property,\" he said. \"The sea is water. Water is free.\"", "Juno felt a chill that had nothing to do with the rain. \"Not if it’s listening,\" she said."], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["The bell gave one final, low hum, fading into the storm. The rain began to ease, the heavy drops turning into a mist that clung to the air. The crowd murmured, a sound like a distant tide. They moved closer to the pier, drawn by the mystery, by the sound, by the strange, hopeful feeling that something had changed.", "Juno tightened her grip on the bell. She looked at Teo, who gave a small, uncertain nod. She looked at Barnacle, who was trying to dry his shell with a strand of seaweed. She looked at Grubb, who was still watching her, his face unreadable.", "\"Tomorrow,\" Juno said, her voice steady despite the trembling in her hands. \"We’re coming for the gear.\"", "Grubb smiled, a thin, tight expression. \"I’d like to see how you do that, child. You’re just a kid. And a kid with a broken bell.\" He turned and walked back to his car. The door closed with a soft *thud*.", "Teo let out a shaky breath. \"Well,\" he said. \"That was polite. And terrifying.\"", "Juno looked down at the shell whistle. It was warm now, pulsing gently against her skin. The sea was listening. The town was listening. And the clock was waiting.", "\"Let’s go home,\" Juno said. \"We have a lot to prepare.\""], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "Borrowed Time", "part": "PART FOUR: THE GRAND LOW", "paras": ["The sun hung low and orange, painting the grey mudflats in shades of apricot and rust. It was Day Nine. The air smelled of brine and impending magic. Juno stood at the edge of the harbor, her yellow raincoat bright against the dull landscape. She clutched the spiral shell whistle. It was warm, almost hot, like a stone left in the sun all day.", "\"I'm going alone,\" she whispered to herself. Her voice shook, but her hands did not.", "Behind her, Teo adjusted his round glasses, his messy black hair sticking up despite his green cap. He held the Storm Bell tightly against his chest. It was heavy, cold, and smelled of rain. \"You're going to get caught,\" he said. \"Again. And this time, there will be no cupboard to hide in.\"", "Juno looked at him. He looked terrified. Not of the water, today. Of failure.", "\"If I bring the bell,\" Juno said softly, \"I can't listen. The bell is loud. The gear needs quiet.\"", "Teo frowned, his lips pressed into a thin line. \"It’s a gear. It’s metal. It doesn’t care about listening.\"", "\"It’s part of the Clock,\" Juno insisted. \"It breathes. I can hear it trying to turn. It’s lonely.\"", "Barnacle, tucked safely inside Juno’s pocket, poked his long, feathery antennae out. \"Honestly! The child has a point. The gear is dramatic. It likes attention. But mostly, it likes being put back where it belongs.\"", "Teo sighed, a long, rattling sound. He looked at the silver car parked by the fish market, gleaming under the dying light. He looked at his own hands, which were still wet from the pier. Then, slowly, he nodded.", "\"Go,\" he said. \"But if you come back with a ticket, I’m throwing the bell into the bay.\"", "Juno smiled, a small, fragile thing. \"Deal.\" She turned and walked toward the silver car, her boots squelching in the mud. The sea was silent, but she could feel it watching."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["The silver car was a smooth, cold beast. It sat in the gravel lot, its windows dark and reflective. Juno stopped ten feet away. She could see her own reflection in the door: two puffs of curly dark-brown hair, freckles, eyes wide with fear.", "She didn’t shout. She didn’t bang on the glass. She took a deep breath, the kind that pulled her belly tight, and she listened.", "The whistle in her hand hummed. It wasn’t a sound, exactly. It was a vibration, a low thrum that traveled up her arm and settled in her chest. The air around the car seemed to thicken. The dust motes in the evening light slowed down, hanging suspended.", "The driver’s side door opened.", "Mr. Cornelius Grubb stepped out. He was tall and thin, his shiny grey suit unwrinkled, his tiny mustache perfectly trimmed. He looked at Juno, then at the empty street, then back at her.", "\"Miss Vale,\" he said. His voice was smooth, like oil. \"You’re back. I expected you to be crying, or running. Not standing there looking like you’re about to negotiate a treaty.\"", "Juno didn’t move. \"I’m not here to negotiate, Mr. Grubb.\"", "\"Then why are you here?\"", "\"Because you have something that doesn’t belong to you.\"", "Grubb’s eyes narrowed. He shifted his weight, his polished shoes clicking on the gravel. \"I have many things that don’t belong to you. My time. My patience. My parking spot.\" He gestured vaguely at the car. \"What do you want, child?\"", "Juno thought of the glass case in his office, and of the Moon Gear sitting on its velvet cushion, a small, perfect circle of brass. It had looked dead. It had looked like a toy.", "\"Tell me why you took it,\" Juno said."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["Grubb stared at her. For a moment, his professional mask slipped. His jaw tightened. He looked tired. Not the tiredness of a long day, but the deep, bone-weariness of someone who had been holding a wall up for a very long time.", "\"Why do I take things?\" he repeated. He let out a short, dry laugh. \"Because when I was small, I had nothing. Not even a lake.\"", "Juno waited. The silence stretched between them.", "\"My father had a boat,\" Grubb said, his voice dropping. He looked at the water, or the mud where the water used to be. \"A little blue rowboat. We lived on a lake. It was beautiful. But the water went away. Not all at once. Just... slowly. One day, the boat was on grass. The next day, it was on dirt. And then, it was just a boat on a hill.\"", "He shuddered, a tiny, involuntary movement.", "\"I was seven. I thought I had done something wrong. I thought if I was quiet, if I was good, the water would come back. It didn’t. So I learned something. If you can’t control the water, you control the land. You buy it. You pave it. You make it safe. You make it predictable.\" He looked back at Juno. \"I didn’t know what that gear was. I saw a valuable antique part in a broken lighthouse. I took it because I was afraid it would be sold for scrap. I wanted to keep it. To keep it safe. Like the boat.\"", "Juno felt a pang of sadness. He wasn’t a monster. He was just scared.", "\"I know,\" she said.", "Grubb blinked. \"You know?\"", "\"You’re afraid of being poor again,\" Juno said gently. \"Afraid of losing what you have.\"", "He didn’t argue. He just looked down at his shoes."], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["\"Can I show you something?\" Juno asked.", "Grubb hesitated. He wanted to say no. He wanted to get back in his car and drive away from this strange, stubborn girl. But the air was still thick with that humming vibration.", "\"Show me,\" he said.", "Juno took a step closer. She didn’t reach for the gear. Instead, she held up the shell whistle. She didn’t blow it. She just held it out, letting the warmth radiate from it.", "\"Listen,\" she said.", "Grubb frowned. \"I’m listening to you.\"", "\"No. Listen to the sea.\"", "Grubb looked at the muddy shore. \"The sea is gone, child. You know this.\"", "\"Not gone,\" Juno said. \"Waiting.\"", "She turned to the side of the car. There, in the gravel, was a small puddle of rainwater, left over from the storm earlier. It was clear and still. Juno pointed to it.", "\"Look at the water,\" she said.", "Grubb crouched down. He was a man in a grey suit, kneeling in the dirt. It looked ridiculous. He looked into the puddle.", "At first, he saw only his own reflection: his grey suit, his mustache, his worry. But then, the reflection changed. The water rippled, though there was no wind. The image in the puddle shifted, becoming deep and blue. He saw the shadow of a giant, elegant shell. He heard a sound, low and resonant, like a cello playing in a distant room.", "It was the voice of the Deep Court. It was the voice of the sea, calling out to him.", "Grubb gasped. He stared at the puddle, his eyes wide. \"What... what is that?\"", "\"That’s the tide,\" Juno said. \"It’s not angry. It’s just trying to tell you something. The gear belongs to the Clock. The Clock belongs to the sea. If you keep the gear, you keep the sea away. You keep the mud.\"", "Grubb’s hand trembled. He reached into his pocket and pulled out a small key."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["He unlocked the driver’s side door. He didn’t get in. Instead, he walked to the trunk and popped it open. Inside, wrapped in a velvet cloth, was the Moon Gear. He had been carrying it around all day, he admitted later, because he could not stand to leave it alone in the empty office.", "He picked it up. It was heavier than he expected. In his hand, it didn’t look like a valuable antique. It looked like a piece of a puzzle that had been taken from a very old, very important machine.", "\"I don't understand it,\" Grubb said, his voice rough. \"I don't understand how it works. I don't understand why it matters to you. But...\" He looked at the puddle. The blue reflection was fading, but the echo of the deep voice still lingered in the air. \"But I remember the boat. And I remember the silence.\"", "He extended his hand. The gear sat in his palm, gleaming in the last light of the day.", "Juno reached out. Her fingers brushed his. His hand was cold, but steady. He let go.", "The gear settled into Juno’s palm. It was warm. It hummed. It felt like a heartbeat.", "\"Thank you,\" Juno whispered.", "\"Don't thank me,\" Grubb said, straightening up. He smoothed his suit, his face returning to its usual smooth mask, but his eyes were different. Softer. \"Just... make sure it works. I'd hate to think I kept it for nothing.\"", "Juno nodded. She tucked the gear into her pocket, next to the shell whistle. The vibration was stronger now. The sea was close.", "\"Tonight,\" Juno said, \"we go to the lighthouse.\"", "Grubb looked at the horizon, where the stars were beginning to appear. \"Tonight,\" he repeated. He got into his car. The door closed with a soft *thud*. He started the engine, but he didn’t drive away. He sat there, watching Juno walk back toward the harbor.", "Juno walked with a new confidence. The bell was with Teo. The gear was with her. The sea was listening. And the clock was waiting."], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "The Grand Low", "part": "PART FOUR: THE GRAND LOW", "paras": ["The moon hung in the sky like a full, silver plate. It was the night of the Grand Low, the highest tide the bay had seen in eleven months. The air was crisp and smelled of salt and cold iron.", "Juno adjusted the bright yellow raincoat that was far too warm for the season. Her curly dark-brown hair was in two tight puffs, and her freckles stood out against the pale light. She held the spiral shell whistle in one hand and the heavy, warm Moon Gear in the other.", "Behind her, a line of lanterns stretched up the winding path to the Old Lighthouse. Grandpa Ozzie led the way. He was tall, his bushy white beard glowing in the moonlight, his blue knitted hat pulled low. He tapped his driftwood cane against the cobblestones. *Tap. Tap. Tap.*", "\"Keep close,\" Grandpa called, his voice gentle. \"The steps are old. They don't like to be rushed.\"", "Teo walked beside her. He wore his green cap and his canvas tool belt, though he had no tools. He looked nervous. His round glasses reflected the lantern light. \"If this doesn't work,\" he muttered, \"I'm blaming the tide. And possibly the gulls.\"", "Barnacle, tucked safely in Juno’s coat pocket, let out a dramatic sigh. \"Honestly! I am carrying the emotional weight of this entire town on my tiny, exoskeletal shoulders. And my shell is chipped. It’s undignified.\"", "Juno smiled, despite her fear. \"Be quiet, Barnacle. We’re almost there.\"", "The lighthouse stood at the tip of the bay, a tall white finger pointing at the stars. The door was unlocked. It waited for them."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["The climb was long. The spiral staircase creaked under their feet. Biscuit, the fat orange cat with the chewed left ear, refused to go above the first landing. He sat on a coil of rope, purring loudly, watching the sea creatures through the high windows.", "Juno felt the hum of the Moon Gear growing stronger. It buzzed against her thigh, like a cat purring.", "\"Grandpa,\" Juno said softly. \"Do you remember how it used to sound?\"", "Grandpa paused on a step. He leaned on his cane. \"It sounded like breathing,\" he said. \"In. And out. Like the whole world was taking a nap.\"", "Teo checked his watch. \"It’s almost midnight. If the clock doesn't start, we’re stuck here until the sun comes up. I have a bakery to open. Mrs. Marchetti will be furious if the bread is cold.\"", "\"Teo,\" Juno said, \"the bread can wait. The sea can't.\"", "He rolled his eyes, but he smiled. \"Yes, your Majesty. The sea is more important than carbohydrates.\"", "They reached the top floor. The door to the Clock Room was heavy brass, cold to the touch. Juno pushed it open. The room was vast and circular. Dust motes danced in the moonlight. And in the center stood the Tide Clock.", "It was enormous. Brass gears the size of cars sat in a dormant state. The center was empty, a dark hole waiting for its heart.", "Juno’s heart stopped. She looked at the Moon Gear in her hand. Then she looked at the three empty slots around the center.", "\"Oh no,\" she whispered."], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["Juno ran to the workbench in the corner. Her hands trembled as she rummaged through the drawers. There, wrapped in green cloth, were the other pieces.", "The Moon Pearl, glowing with a soft, silvery light. The Salt Compass, a needle that pointed not north, but down. And the Storm Bell, a small, bronze chime that still smelled of rain.", "She held them up. \"Okay,\" she said, talking to herself. \"One, two, three. And the gear. Four pieces. Four slots. It’s a puzzle. I can do puzzles. I’m good at puzzles.\"", "Barnacle peeked out of her pocket. \"You are terrible at puzzles. You once put a square peg in a round hole and complained about the hole.\"", "\"Shh!\" Juno hissed.", "She placed the Moon Pearl in the top slot. It clicked into place. She placed the Salt Compass on the left. It hummed. She placed the Storm Bell on the right. It sang a tiny, clear note.", "Finally, she placed the Moon Gear in the center.", "It fit perfectly.", "Juno stepped back. She held her breath. She waited for the big gears to turn. She waited for the sound of the sea returning.", "Nothing happened.", "The clock was silent. The gears were still. The room was dead.", "\"Did... did I do it wrong?\" Teo asked. His voice was small. He pushed his glasses up his nose. \"Maybe the alignment is off. I have a tool for that. A very specific tool. I can fix it.\"", "\"Teo, the log said it was simple,\" Juno said, her voice shaking. \"It said 'listen'.\"", "\"Listening is not a mechanical process,\" Teo argued. \"This is a machine. It needs a spring. Or a lever. Or a—\"", "\"It’s not a machine,\" a small voice said.", "Juno looked down. Barnacle was on the workbench. He was looking at the green cloth notebook sitting next to the clock."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["Juno picked up the green cloth notebook. The Tide Keeper’s Log. It was heavy with history. She flipped to the very last page. The paper was old, the ink faded.", "There was only one line.", "*You must say who you are.*", "Juno stared at it. \"Who I am?\" she said. \"I’m Juno. I’m eleven. I’m from the city. I hate mud.\"", "She looked at the clock. It was still silent.", "Teo was already taking tools out of his belt. \"Maybe the mainspring is snapped. I can jump-start it if I have a wire and a battery. Do you have a battery?\"", "\"Teo, put the screwdriver down,\" Juno said. She felt a lump in her throat. \"It’s not broken. It’s just... lonely.\"", "She thought of Grandma Ivy. She thought of how her grandmother would sit by the window, listening to the rain. She wasn’t fixing the rain. She was just being there for it.", "Juno took a deep breath. She held the shell whistle to her lips. She didn’t blow it. She just held it.", "\"I am Juno Vale,\" she said, her voice trembling. \"I am the new kid. I am loud. I am scared. But I am here. And I am listening.\"", "She looked at the clock. She looked at the moon, shining through the round window.", "\"I am the Tide Keeper,\" she said."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["For a second, nothing happened.", "Then, a tiny *tick* echoed in the room.", "Juno’s eyes went wide. She looked at Teo. He dropped his screwdriver. *Clatter.*", "\"Did you hear that?\" Teo whispered.", "Another *tick*. Louder.", "The Moon Gear began to turn. Slowly. Then faster. The Moon Pearl glowed brighter. The Salt Compass needle spun, then locked in place. The Storm Bell chimed, a clear, ringing note that filled the room.", "*Tick. Tick. Tick.*", "The big gears began to move. The room came alive with the sound of brass grinding against brass. The air grew heavy with the scent of salt and deep water.", "Barnacle let out a long, dramatic sigh. \"Honestly! I knew it would work. I told you. I am a genius. A tiny, chipped-shell genius.\"", "Grandpa Ozzie stood in the doorway. He was smiling. He tapped his cane on the floor. *Tap. Tap.*", "\"It’s breathing,\" he said softly.", "Juno felt the vibration in her chest. The sea was coming back. She was ready."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "The Tide Comes Home", "part": "PART FOUR: THE GRAND LOW", "paras": ["The tick became a thud. The thud became a roar.", "Juno gripped the railing as the air in the lighthouse room grew thick and wet. The scent of salt hit her face, sharp and sweet, like the smell of Grandpa’s bait shop before the rain. Outside, the moon hung low and huge, a pale coin pressed against the black sky.", "\"Here it comes,\" Barnacle whispered from Juno’s sleeve. His little claw tapped her yellow raincoat. \"Try to stand straight. You look like a startled chicken.\"", "Juno didn’t answer. She was listening.", "A low hum started in the ground, vibrating up through her boots. It was a sound so deep it felt like a heartbeat. Then, with a sound like a great, long sigh, the water moved.", "It did not crash. It rolled.", "The grey mud of the harbor floor, which had been dry and cracked for eleven months, began to glisten. A ribbon of black water, smooth as glass, crept over the stones. It licked the base of the tilted boats.", "\"Oh,\" Teo breathed. His round glasses fogged up. He pressed his hands against the window. \"It’s... it’s breathing.\"", "Grandpa Ozzie turned to them, his blue knitted hat askew. \"That’s right,\" he said, his voice thick with emotion. \"It’s remembering us.\"", "Juno watched the water rise, inch by inch, until it touched the hull of the first boat. The wood creaked, a sound of relief.", "\"The Dolly Marigold,\" Juno said softly. \"She’s awake.\""], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["The boats lifted.", "It was slow, a gentle lifting, as if the sea was offering them a hand. The *Dolly Marigold*, once stuck in the silt, rose until her keel cleared the mud. The water swirled around her, washing away the grime of the last year.", "On the harbor road, people were waking up. Juno saw lights flicking on in the windows of the houses along the quay. Doors opened. Feet hit the wet cobblestones.", "Barnacle peeked out from Juno’s pocket. \"Honestly! Look at them. They’re all running. I hope they have umbrellas. I look terrible when I’m wet, and I refuse to be involved in this mess.\"", "Juno smiled, but her eyes were wet. \"It’s okay, Barnacle. It’s good.\"", "Down below, the harbor bell, which had hung silent for a year, suddenly swung. It was not wind. It was the water, pushing against the structure, waking the bell.", "*Clang.*", "The sound rolled across the bay, clear and brig
