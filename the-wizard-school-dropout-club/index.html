 grid with a ruler. \"We need data,\" he announced, adjusting his gold-rimmed glasses. \"Marnie, grow the pea plant.\"", "Marnie raised her wand. \"Grow!\"", "The pea plant shuddered, and a single, damp, lavender-scented sock popped out of the soil to land directly on Toby’s shoe. The gold glitter wave, visible through the shed window, ignored it completely, keeping on rolling toward the village as if it had not noticed.", "“Interesting,” Toby said, writing *Wonky magic = invisible to the hex* in his neat handwriting. “The inspectors cast one correct spell and were gnomed on the spot. You cast a wrong one and the hex does not even look up. It eats perfection. Wonky does not interest it.”", "“So it is rude to be correct,” Lulu said very quietly, “and polite to be wrong.”", "“It is a theory,” said Toby, and he underlined it twice.", "Bunt sneezed, a tiny *ah-CHOO*, and the wave rippled but did not retreat, continuing its slow, steady approach."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["The wave reached the bakery first. Mrs. Humphreys ran to the window, flour on her nose. \"The bread is flat,\" she wailed. \"It won’t rise! It’s just... bread.\"", "Next, the lamppost at the corner of Crumb Lane tried to announce the time. It creaked, clicked, and fell silent. The village was losing its magic, one perfect little trick at a time.", "Mayor Fenwick arrived in a puff of dusty wind. Her tall pink hat was straight, but her eyes were wide. She looked at the four of them, then at the creeping gold light.", "\"Can you fix it?\" she asked. Her voice shook. \"Please. With respect, given nobody else can.\"", "Marnie looked at her hands. They were shaking. She looked at Bunt, who was holding a biscuit so tightly it was cracking. She looked at Lulu, who was hugging her knees.", "\"We don't know how,\" Marnie said.", "But the wave was already licking at the bakery door. And the clock in the square had stopped ticking."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["\"I have to tell you something,\" Marnie said. The words felt like a spoon stuck in the back of her throat. \"The hat.\"", "She told them about the rehearsal, the crooked tilt, the whisper, and the sudden *honk* that had silenced the Great Hall.", "Silence stretched in the shed. It was the kind of quiet that happens right before a teacher asks a question nobody wants to answer. Gerald tilted his head, looking deeply offended at the mention of his former self.", "Lulu reached out and squeezed Marnie’s hand. Her mismatched socks crunched on the straw. \"I am so sorry,\" she said, though it wasn't her fault. \"It is not your fault.\"", "Toby pushed his glasses up his nose. His fingers were steady. \"You made a wrong spell,\" he said carefully, ticking them off on his fingers. \"Cassius made a bad plan. The Principal told a lie about the hat being ordinary. Everybody did one thing.\"", "Bunt nodded slowly, his moss-green tuft bobbing. \"Ah... yes. The hat was crooked. That was the school. Not you.\"", "Marnie wanted to believe them. She wanted to believe that a sneeze wasn't a crime. But the gold wave was still glowing outside. And her hands were still shaking. And the memory of the goose landing in the punch bowl was brighter than the light."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["A squeaky voice cut through the guilt. Professor Quillfeather, the gnome librarian, waddled onto the table. She wore a tiny cardigan and spectacles so large they covered half her face, giving her the look of a confused owl who had just woken up in a library.", "\"Psst,\" she said, adjusting her glasses. \"Do not cry. Crying ruins the ink.\"", "She pointed a tiny, bony finger at the window. \"The Founding Charter. Third shelf. Founders' Section. Great Library. There is an answer. There always is.\"", "Marnie blinked. \"The Great Library? It’s... it’s full of gnomes.\"", "\"Yes. And the hex is spreading.\" Quillfeather’s eyes were sharp. \"By midnight, it will cross the lawn. Then it will be permanent. We are all going to become garden decorations, Miss Pennywhistle. I have a very nice spot in mind for myself, by the way. Near the ferns.\"", "She hopped off the table. \"Go. Hurry. I will keep the gnomes from waddling into the road. Try not to step on me.\"", "The clock on the wall, the one that never ticked, seemed to hold its breath."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["\"Back way,\" Toby said, pulling a crumpled map from his vest. \"Through the hedge, up the kitchen stairs, along the Longest Corridor.\"", "Bunt began packing. He placed three sandwiches in his barrel-boot pocket, wrapped in wax paper. Lulu packed a bag of socks, just in case they needed to apologize to the furniture.", "Marnie picked up Gerald. He squawked and tried to hide a stolen pencil under his wing. \"Come on,\" she said. \"We’re going to a library.\"", "They stepped out into the twilight. The shadows of the school stretched long and thin across the glittering lawn, like fingers reaching for them. The Mayor stood at the gate, her hand raised in a stiff salute.", "\"Good luck,\" she whispered.", "Marnie took a breath. The air smelled of lavender and impending doom. She walked forward, her red sneakers crunching on the gravel, and for the first time in two years, she didn't feel like a failure. She felt like a tool."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "The Longest Corridor", "part": "PART THREE: THE GREAT GNOMING", "paras": ["*From the Dropout Club Handbook, Rule 14: Never trust a staircase that is too polite.*", "Humbleton Academy was quiet in a way that made Marnie’s teeth ache. The cobwebs in the corners were stretched into perfect, taut lines, like spider silk on a drum. Inkpots sat full to the brim, not a single drop spilled. It was too tidy. It was the kind of neatness that felt like a held breath.", "They tiptoed past the kitchens. Inside, a row of gnomes stood at the stoves, stirring pots with wooden spoons. They wore bright blue jackets and pointed red hats, and they all had fixed, cheerful smiles. One gnome turned its head to look at Marnie. It did not blink. It simply smiled harder.", "\"I'm so sorry,\" Lulu whispered, bowing to each one as they passed. \"We mean no offense. We're just passing through.\"", "Bunt’s nose twitched. A sneeze was building in his chest, a big, rumbling thing. He clamped his mouth shut, his face turning pink. The gnome in the blue jacket tilted its head, confused by the lack of a polite greeting. Marnie grabbed Bunt’s elbow, gently pulling him forward before the sneeze could fizzle the hex.", "\"Keep moving,\" she hissed. \"The library is that way.\"", "The school felt like it was watching them. Not with eyes, but with the rigid, unblinking attention of a museum."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["The staircase to the library was made of white marble, polished to a mirror shine. It was beautiful, and it was also completely useless.", "Marnie took one step. The stairs slid smoothly to the left, moving out of her way.", "\"After you,\" said a polite, echoing voice from the wall.", "\"I wasn't asking you to move!\" Marnie cried. She tried to climb, but the steps kept sliding away, like a cat trying to catch a laser pointer.", "Toby adjusted his glasses. He looked at the stairs, then at Marnie, then back at the stairs. He opened his mouth and said, \"Come back!\"", "He said it backwards. *Kc-ebmoc!*", "The stairs froze. They locked into place with a satisfying click, perfectly still and perfectly obedient.", "\"They like to be told what they don't want to hear,\" Toby explained, writing a note in his pocket notebook. \"Precision requires resistance.\"", "Lulu pulled a lavender-scented sock from her bag and tied it to the first step, then another to the second. \"So nobody slips,\" she said.", "Bunt, whose nose was still itchy, let out a small, suppressed sniffle. The stairs remained perfectly, stubbornly still."], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["The Longest Corridor was long. Marnie tried to look to the end of it, but the wall simply continued on, and on, and on. It was the sort of hallway that made you feel very small and very lost.", "Lined with the walls were portraits of past Principals. But they weren't portraits anymore. They were gnomes, trapped inside their frames, wearing their old robes and hats, and shouting.", "\"Left!\" shouted a gnome in a frame near the door.", "\"No, right!\" yelled a gnome further down.", "\"Up! No, down!\"", "Marnie winced. The noise was like a bad choir practice. She walked carefully, trying to ignore the shouting. Then she saw it. A large, ornate frame on the left wall. Inside was a stern-looking woman with a tall purple hat. The plaque beneath it read: *Wilhelmina Humbleton, Founder.*", "The hat was crooked. It was crooked in exactly the same way the Principal’s hat had been before Marnie had accidentally turned it into a goose.", "Marnie stopped. Her heart did a strange flip. The gnome in the frame was not shouting. It was just looking at her, with a fixed, cheerful smile, and a hat that looked very, very familiar."], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["At the end of the corridor stood the Great Library door, and in front of it stood a suit of armor that had clearly never met a day it didn't like. It was tall, shiny, and perfectly polished, holding a long pike while its helmet gazed out through a narrow slit with the judgment of a headmaster.", "\"Unauthorised persons,\" the armor said, its voice metallic and cold. \"Step aside.\"", "Marnie didn't step aside. \"We need to get in,\" she said, because she was the only one in the room with the audacity to be wrong.", "\"Unauthorised,\" the armor repeated, raising the pike with a clank.", "Bunt’s nose began to itch. It was a bad itch, the kind that starts behind your eyes and feels like a pencil being slowly pushed into your forehead. He looked at the armor, then at Marnie, then at his own massive hand, which was twitching.", "\"Ah... ah...\" Bunt said, his eyes widening.", "The armor braced itself, expecting a spell. It did not expect a sneeze.", "\"AH-CHOO!\"", "The blast of air hit the armor square in the chest. The enchantment holding it together popped, fizzled, and died. The suit collapsed to the floor with a loud, clattering crash, its pike rolling away into the dark like a discarded broom.", "\"Oh, dear,\" the armor said from the floor, its voice now very small. \"That was a bit too much. My shoulders.\"", "Lulu quickly stuffed a cushion, made of three mismatched socks, under its head. \"There,\" she said. \"That's better.\"", "\"Much better,\" the armor agreed. \"Thank you.\""], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["The library door was made of heavy, dark oak that looked as if it had been sanded by a grumpy librarian. There was no handle to grab, only a small, round lock sitting in the center like a button on a very stiff jacket.", "Carved into the wood above the lock was a riddle: *I open only to those who cannot open.*", "Marnie squinted at the words, her brain feeling like a blender full of cold porridge. \"I am a key,\" she offered. The door stayed shut.", "\"I am a lock,\" she tried next. Nothing happened.", "\"I am a door,\" she said, which was a bit of a lie, but desperation makes you creative. The wood remained stubbornly silent.", "Toby stepped forward, adjusting his glasses with a careful, precise movement. He looked at the riddle, then down at the lock, and a small, dry smile appeared on his face.", "\"Lock!\" he said.", "The door swung wide with a happy, creaking sound, as if it had been waiting for exactly that excuse to let them in.", "Gerald, who had been waiting patiently by Marnie’s leg, let out one loud, confident honk. He marched into the library first, his purple ribbon bobbing up and down, looking as if he owned the place and had just arrived to inspect the dust.", "Marnie looked at Toby, then at Lulu, then at Bunt, and they followed the goose into the dark, their footsteps echoing in the silence."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "The Founder's Hat", "part": "PART THREE: THE GREAT GNOMING", "paras": ["*From the Dropout Club Handbook, Rule 15: Normal is a setting on the oven, not a way to live.*", "The Great Library was not a room. It was a canyon of books that had forgotten how to stand straight. Shelves rose higher than the village church steeple, connected by ladders that slid up and down with a soft, wooden whisper. Reading lamps floated nearby, drifting in lazy circles like fireflies that had lost their sense of direction.", "Lulu leaned close to a shelf of thick, leather-bound encyclopedias. Several of them were snoring softly, a low, rhythmic rumble that vibrated in her teeth.", "\"I'm so sorry,\" she whispered, her voice trembling slightly. She adjusted her mismatched socks, one striped, one polka-dot, and tried to look apologetic.", "Bunt, the troll, tiptoed behind her. His barrel boots were wrapped in soft cloth, and a red-spotted handkerchief the size of a tablecloth was stuffed firmly over his nose. His eyes were watering. The dust here was ancient and magical, and his allergies were screaming a silent, green-shouting alarm. He looked ready to sneeze, but he held it in with the focus of someone trying to catch a falling biscuit.", "Marnie held a floating reading lamp high. The light caught the dust motes dancing in the air.", "\"Shh,\" she hissed, though her voice was as quiet as a mouse in a shoebox. \"We are looking for the Charter.\""], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["They found the Founders' Section in a corner where the air smelled of old paper and dry leaves. A glass case stood on a pedestal of polished marble, gleaming under the lamplight, with a scroll of vellum inside that was so large it had to be rolled like a rug.", "Toby stepped forward, his polished brown shoes clicking a steady rhythm on the stone. Click. Click. He adjusted his gold-rimmed glasses with a precise, delicate motion.", "\"Permission to inspect,\" he said, to no one in particular.", "The glass case hummed, then unlocked with a soft click. He unrolled the scroll with the care of someone handling a sleeping cat. The ink was faded and brown, brittle as a dry leaf, but the words were clear.", "\"I, Wilhelmina Humbleton,\" Marnie read aloud, her voice echoing off the high ceiling, \"in founding this school, enchant my hat to catch the overflow of perfect magic.\"", "Lulu blinked. \"Catch it?\"", "\"For perfect magic has no room in it for wonder,\" Marnie continued, her eyes scanning the lines, \"and will turn on itself.\"", "Toby frowned, a small crease appearing between his eyebrows. \"Turn on itself?\" he said. \"That sounds like a curse. Or a very bad joke.\""], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["Marnie’s finger traced the final line of the text. The ink seemed to glow faintly, as if it remembered being wet.", "\"Only magic that is a little wrong can balance magic that is entirely right.\"", "She read it once. Then she went very still. The air in the library felt thicker, charged with a sudden, electric silence. She looked at the scroll, then slowly turned her head to look at Gerald.", "The goose was standing on the pedestal, his purple-and-silver-star ribbon bobbing. He looked at Marnie with a deep, offended dignity, his orange beak slightly open as if he were about to make a very reasonable point.", "\"He's not just a goose, is he?\" Marnie whispered.", "Toby lowered the scroll. \"No,\" he said, his voice dry and flat. \"He’s not.\"", "Lulu gasped, her lavender-scented socks fluttering around her teal rain boots. Bunt lowered his handkerchief, his eyes wide and bright. The goose honked once, a short, sharp sound that cut through the silence like a knife through butter."], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["\"The Principal's hat,\" Toby said, his mind working at full speed. \"The tall purple one with the silver stars. He wore it for forty years. Every single day.\"", "Marnie felt a cold prickle at the back of her neck. \"It wasn't a hat. It was a sponge.\"", "\"A magical sponge,\" Lulu added, her voice barely a whisper. \"For perfect magic.\"", "Bunt nodded slowly, his moss-green hair tuft shifting. \"Ah... it absorbs the overflow. The school was safe because the hat was there. Quiet. Invisible.\"", "Marnie looked at Gerald. \"I turned him into a goose. I took the sponge out of the machine.\"", "Toby stepped closer, his expression serious. \"You didn't ruin the hat, Marnie.\"", "She looked up, her eyes wide. \"I ruined everything.\"", "\"No,\" Toby said firmly. \"You hid it. You changed its form. The magic is still inside. It’s just... wearing feathers right now.\""], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["Marnie straightened her cloak, her hands trembling slightly. \"I can fix it.\"", "The words fell out of her mouth before she could catch them. \"I can turn him back. Properly. Once and for all. I just need to cast a perfect spell.\"", "Toby’s face went pale. \"No. If you cast a perfect spell, the hex will trigger. The gold wave will start again.\"", "\"I don't care,\" Marnie snapped, her voice sharp. \"I care about fixing this. I care about being right for once.\"", "Lulu and Bunt exchanged a worried glance. The goose honked, a low, rumbling sound that seemed to carry a weight of understanding.", "The four of them stood in the dark library, the distance between them growing wider with every second. Gerald, standing between them, looked from Marnie to Toby, and back again. He honked quietly, a sound that was not quite a complaint, but not quite a promise either. It was the sound of a goose who knew he was in the middle of something very, very wrong."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "The Normalizing Tonic", "part": "PART FOUR: WONKY MAGIC", "paras": ["*From the Dropout Club Handbook, Rule 16: When a friend falls, catch them. Then put socks under them.*", "The sun had barely cracked the horizon, painting the sky in shades of bruised plum and dusty orange. Inside the Potting Shed, the air smelled of damp earth and cold ash. Marnie paced the narrow space between the stove and the workbench. Her red sneakers squeaked on the wooden planks.", "Toby sat on an upturned bucket, his gold glasses catching the weak light. He looked tired. His navy vest was buttoned to the very top.", "\"You don't need the right way,\" Toby said, his voice careful and flat. \"You need the wonky one.\"", "Marnie stopped. She turned on her heel, the forest-green cloak flaring around her knees. \"Easy for you to say. You’ve got a way that works.\"", "The words hung in the air, sharp and cold. Toby’s face closed up. His mouth became a thin, straight line. He looked down at his hands, which were folded neatly in his lap. He did not blink.", "Marnie grabbed Gerald’s neck. The goose let out a sharp, offended honk and scrambled for balance on her sneakers. She marched to the door, her chest heaving. She pushed it open. The cold morning air hit her face, smelling of wet leaves and distant bread.", "She did not look back. She knew, with a sinking certainty in her stomach, that she had just broken something that could not be glued."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["The Principal’s office was as quiet as a library during exam week. The portraits on the walls had gone to sleep, their painted eyes shut and mouths set in permanent frowns that seemed to judge anyone who walked past. A single beam of sunlight slashed through the tall window, sending dust motes dancing in the air like tiny, lazy dandelion seeds.", "Marnie set Gerald on the carpet. He preened his feathers with great dignity, glaring at a potted fern as if it had personally insulted his family. She walked to the desk, which was massive and made of dark oak, covered in polished silver paperweights that reflected her wild copper-red hair. She pulled open the top drawer.", "Inside sat a small glass bottle in a velvet-lined tray, glowing with a faint, pearlescent shimmer. A label was stuck to the side in neat, golden script. It read: *Normalizing Tonic. Makes any spell go exactly where it is pointed.*", "Marnie picked it up. The glass was warm, like a mug of hot chocolate left on the stove too long. She uncorked it and sniffed. It smelled of nothing at all. It smelled of plain, boring, ordinary porridge. She took a sip. It tasted exactly like that. Bland. Safe. Correct.", "She set the bottle down, her hand trembling slightly. She looked at Gerald. He looked at her. He blinked one orange eye, slowly and deliberately, as if to ask what she was doing.", "\"Okay,\" she whispered. \"Just once.\""], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["Marnie raised her wand, and it felt heavy in her hand, like a lead pencil that had swallowed a brick. She pointed it directly at Gerald, who ruffled his feathers and adopted the posture of a bird preparing to argue with a weather forecast.", "\"Revert,\" she said.", "The word left her mouth without wobble or hiccup. It flew straight, clean and true, a white beam of pure intention.", "Gerald gasped. His white feathers dissolved into swirls of purple smoke. His body stretched, elongated, and folded. The orange beak flattened into a wide brim, while the purple ribbon around his neck tightened and smoothed into a band.", "In her hands, she held a tall, elegant purple hat spangled with silver stars.", "Marnie stared. She turned it over, checking the stitching, which was flawless, and the shape, which was mathematical. It was the most correct thing she had ever touched.", "She laughed. It started as a giggle, then a snort, then a full, bright laugh. She spun around in the empty office, the hat spinning on her head, feeling absolutely, perfectly right."], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["The laughter died in her throat.", "The hat in her hand began to hum. A low, vibrating buzz, like a telephone ringing underwater. The silver stars began to shimmer, then flare. A wave of gold light erupted from the brim. It did not spread. It exploded.", "Marnie dropped the hat. It skittered across the floor, morphing back into a goose with a startled, high-pitched honk.", "She tried to move. Her legs wouldn’t obey. She looked down.", "Her forest-green cloak was stiffening, turning into a bright, painted blue jacket. Her red high-top sneakers were shrinking, hardening into flat, clay feet. A white beard was growing out of her chin, thick and stiff and itchy. A pointed red hat was forming on her head, squeezing her copper-red buns.", "She tried to scream, but all that came out was a tiny, squeaky *hoo*.", "The one correct spell of her life had made her a garden gnome."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["The door burst open. Lulu stood in the frame, her orange hoodie flapping in the draft while her knees knocked together like two hollow wooden blocks. Behind her stood Toby and Bunt.", "They stopped. They stared.", "Lulu’s mouth opened, but no sound came out. Then she made a small, wet noise, and her shoulders began to shake. \"Oh,\" she whispered. \"Oh, Marnie. I’m so sorry. I’m so sorry we weren’t there.\"", "Bunt bent down until his moss-green hair brushed the floorboards. He reached out with two fingers as thick as tree trunks and lifted Marnie. She weighed less than a biscuit. He held her at eye level, his huge, kind eyes wide with worry.", "Toby did not move. He sat down on the floor, his polished brown shoes scuffing the wood. He took off his gold glasses and rubbed his eyes with trembling hands. He looked at the tiny gnome in Bunt’s hand, then at the wand, which now lay on the floor, too big for her hand to hold.", "He said nothing. He just watched the tears roll down his cheeks, silent and fast."], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "Four Wonky Wizards", "part": "PART FOUR: WONKY MAGIC", "paras": ["*From the Dropout Club Handbook, Rule 17: A plan is a wish with a schedule.*", "Marnie sat on a chipped blue flowerpot, her tiny pointed red hat resting squarely on her head. She crossed her arms, which were now as thick as darning needles, and refused the biscuit Bunt held out. It was a shortbread, still warm, with a crack down the middle that looked suspiciously like a smile.", "\"I don't want it,\" she said, her voice squeaking like a rusty gate hinge. \"I am useless. As a wizard, I am a catastrophe. As a gnome, I am merely small.\"", "Gerald, the goose, sat in her lap. He preened a wing, then looked at her with the heavy, offended dignity of a tax auditor who has been denied a lunch break. He did not offer comfort. He offered a stolen pencil, which Marnie dropped.", "Toby sat on the floor, his gold glasses fogged. He looked at the list of failures he had written on his knee, then at the list of things only he could do. The second list was longer.", "\"I once thought I was useless too,\" he said quietly. He pushed his glasses up his nose. \"I made a list. It was very long. And then I made another: things only I can do. It was longer.\""], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["Toby stood up and brushed the dust from his grey trousers, his mind working with the quiet, precise hum of a well-oiled door hinge.", "\"The hex is perfect,\" he said. \"It pushes back against anything that tries to fix it. My backwards spell only worked for a moment because the perfection is too strong. But what if we don't fight the perfection? What if we remove it?\"", "He looked at Bunt. \"Your sneeze. You are allergic to magic. You sneeze the magic out. That removes the perfection.\"", "He looked at Lulu. \"The hex is gold glitter. Glitter is messy. Socks are wool. Wool absorbs everything. If you throw them, the glitter sticks. It becomes just... lint.\"", "Lulu’s eyes went wide. She clutched the pile of lavender-scented, mismatched socks in her arms, one hundred and four of them, none of them a pair.", "\"A four-part spell,\" Toby continued. \"Nobody has ever tried a spell like that. It is entirely wrong. Therefore, it is the only thing that can work.\"", "Lulu bit her lip, then nodded. \"I’m so sorry in advance if it goes wrong.\""], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["Bunt inhaled. The air in the shed sucked in, pulling the loose papers on the table toward him. His nostrils flared, wide and green.", "\"Ah...\" he started.", "Marnie, tiny and trembling, raised her wand. It was too big for her, so she held it like a toothpick. She aimed it at herself, with the most ridiculous determination she had ever felt.", "\"Ah...\" Bunt’s face reddened, turning the color of a ripe tomato.", "\"Now!\" Toby shouted.", "Bunt’s nose twitched. \"AH-CHOO!\"", "A blast of wind hit the air. The golden shimmer of the hex cracked, like a pane of glass hitting the floor. Simultaneously, Lulu hurled the mountain of socks. They burst into the air, a lavender storm, and drank up the falling gold glitter. The air went grey and dusty.", "Marnie, small and brave, pointed her tiny wand at her own chest.", "\"Straighten,\" she whispered. It was the most wrong spell in the book. And it was a hundred percent right."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["There was a sound like a balloon popping, followed by the wet *thwack* of a body landing on the floor.", "Marnie was there, fully grown and solid, wearing her mustard-yellow cardigan with the mismatched buttons and her red high-top sneakers, though her hair was a little singed and a bright blue hem had appeared on her sleeve that hadn't been there before.", "Lulu let out a squeak and hugged her so hard Marnie’s ears pressed against her hoodie, while Toby took off his glasses and cleaned them three times with shaking hands. Bunt, overcome with emotion, blew his nose into his red-spotted handkerchief with a sound that rattled the teacups on the shelf.", "Marnie looked at Toby, and her face was wet.", "\"I'm so sorry I said that, Toby,\" she said. \"About being useless.\"", "Toby put his glasses back on and smiled, which was a crooked, brilliant thing. \"Never mind that. I was just wrong. We're all just wrong. It's brilliant.\""], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["They walked to the back wall of the shed, where the rafters were carved with names from three hundred years ago. Marnie pulled a piece of chalk from her pocket. She was tall enough to reach now.", "\"Plan,\" she said, writing in big, wobbly letters. \"Restore Gerald to the Hat. Place it on the founder's statue in the Fountain courtyard. Before the clock runs out. In the middle of the hex wave.\"", "Toby pointed to the line. \"It will take all four wrongs together. The sneeze. The socks. The backwards spell. And the crooked hat.\"", "The clock on the wall, which had stopped when the Gnoming started, suddenly began to tick. The hands moved. There was less than a day left.", "The door creaked open. Gran Pennywhistle stood there, holding a steaming flask of cocoa. She took one look at the plan on the wall, and then at the four of them, and nodded once.", "\"Good,\" she said, pouring the cocoa into four mugs. \"A shed is the proper place for important thinking.\""], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "The Fountain", "part": "PART FOUR: WONKY MAGIC", "paras": ["*From the Dropout Club Handbook, Rule 18: Everything is useful if you stand in the right place.*", "Dawn broke over Dimblewick in shades of bruised purple and pale gold. In the Potting Shed, the air smelled of damp earth and stale biscuits. The gnomes stood in a stiff line along the flowerbeds, their bright blue jackets buttoned to the chin, their painted smiles fixed in permanent cheer.", "Principal Thistlewood, now two feet tall, stood on a stack of old magazines. He held a tiny scroll and spoke with the gravity of a man delivering news of a flood.", "\"Precision,\" he squeaked, his moustache lifting slightly, \"is the only path to glory. Do not let the wave catch you. It is rude, but it is inevitable.\"", "Nobody listened. Professor Quillfeather, the librarian, was scribbling notes on a leaf. Mayor Fenwick, wearing her tall pink hat, approached Marnie with great ceremony. She presented Marnie with a silver spoon, no larger than a thimble.", "\"For stirring the chaos,\" the Mayor said, her voice tinny. \"A professional necessity.\"", "Marnie took the spoon. It was cold. She put it in her pocket.", "Cassius Pomeroy stood at the end of the line. His golden hair was still perfect. His arms were folded across his royal-blue blazer. He said nothing for a long time. Then, as they turned to leave, he stepped forward. His voice was quiet, but it cut through the chatter.", "\"The incantation needs a first line,\" he said. \"'To the Founder, a little wrong.' Say it as you place the hat.\"", "Marnie looked at him. He did not look away."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["The lawn was a river of gold. The hex wave rolled across the grass in thick, syrupy sheets, catching the morning light and scattering it into blinding sparks. It was beautiful and utterly terrifying.", "Bunt walked first. He was nine feet tall and grey-green, his barrel-boots crunching loudly on the gravel. He sniffed the air, his nose twitching violently.", "\"Ah...\" he started.", "\"Ah...\" he continued.", "\"Ah-CHOO!\"", "The sneeze blasted a clear path through the glitter. Where the gold wave touched the air, it fizzled into harmless dust. Bunt adjusted his massive red-spotted handkerchief and kept walking.", "Lulu followed, her orange hoodie bright against the gold. She pulled a pair of lavender socks from her pocket and tossed them onto the wave. The wool absorbed the sparkle with a soft *shhh* sound. She dropped another pair. And another. The socks piled up, forming a fluffy barrier that slowed the glitter's advance.", "Toby tiptoed backwards, his gold glasses reflecting the shimmer. He narrated their progress in a dry, precise voice. \"Distance to the Fountain: four hundred yards. Visibility: low. Danger level: high. Sock supply: adequate.\"", "Marnie carried Gerald in her arms. The goose was plump and white, his orange beak tucked into his feathers. He looked profoundly offended by the cold. Marnie held him tight, feeling the warmth of his chest against her own."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["The Great Hall clock boomed, a deep sound that vibrated right through Marnie’s teeth.", "\"Twenty minutes!\" it announced, in a voice that sounded suspiciously like the Vice-Principal’s.", "The wave surged forward, rearing up high as a house, a wall of liquid gold shimmering with malicious intent. It crashed against the line of socks, but there were not enough, and the glitter leaked through the wool to spill onto the grass, ready to turn the world into a garden.", "Lulu ran out. She stood there with empty hands, her own mismatched socks visible in her teal rain boots.", "\"Oh dear,\" she whispered.", "She closed her eyes. For the first time in her life, she did not apologize, nor did she say sorry for being herself. She focused on the feeling of the wool, the smell of lavender, and the sheer, stubborn weight of her magic.", "When she opened her hands, a heap of socks erupted from the air. Three hundred, maybe four hundred. It was a mountain of mismatched lavender, striped, and polka-dot wool that landed with a soft, heavy thud, absorbing the wave’s momentum instantly. The golden wall bumped into the wool and sagged, deflating like a pudding left too long in the oven.", "It held."], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["The Founders' Fountain stood in the center of the courtyard, its water sparkling gold in the dim light while the bareheaded, stern statue of Wilhelmina Humbleton kept her stone gaze fixed on the horizon.", "Marnie set Gerald down on the edge, where he shook himself and sent a spray of golden droplets into the air before letting out one sharp, demanding honk.", "Toby stepped forward with shaking hands and gold glasses askew, taking a deep breath and then another to steady his nerves.", "\"Gerald,\" he said softly, \"I’m going to say the opposite now. It’s the only way.\"", "He raised his wand, its tip glowing with a faint, backward purple light that hummed with quiet potential.", "\"Goose,\" Toby whispered.", "Gerald began to shimmer, his feathers rippling and stretching as he grew taller and his white plumage darkened into a rich purple, while the silver stars on his ribbon wove themselves into the fabric of his new form.", "Marnie knelt beside him, taking his beak in her hands to feel its warmth, and whispered, \"Thank you. For being a goose.\"", "She meant it, every bit of it."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["The golden wave surged back, louder and wider than before, stretching from the mud to the swirling glitter of the sky while the clock ticked away the final minute. Gerald was halfway changed, a hat now, but a hat that still had goose feet, honking a sound that was half bird and half the rustle of stiff fabric. Marnie looked up at the statue, which stood fifteen feet tall, and felt her head swim.", "Lulu stepped forward and pulled a pair of socks from the mountain, tying them together with another to build a ladder, a wobbly knotted rope of wool that reached just barely to the statue’s head. Toby steadied the base while Bunt stood guard, his nose twitching, ready to sneeze if the wave tried to sneak around.", "Marnie climbed, her red sneakers gripping the wool while the hat grew heavy in her arms and the wind howled like a thousand whistles blowing at once. She reached the top, where the statue’s bare head waited right there. She took the first step."], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "The Hat", "part": "PART FOUR: WONKY MAGIC", "paras": ["*From the Dropout Club Handbook, Rule 19: Always bring a spare handkerchief to the end of the world.*", "The change finished with a final, satisfying *whoosh*. Marnie held the Founder’s Hat, tall and purple and spangled with silver stars. It still felt slightly goose-shaped, curved upward on one side as if it were trying to honk.", "The golden wave slammed into the wall of socks Lulu had piled against the fountain. The wool drank the glitter like a thirsty sponge, absorbing the light, the perfection, and the rigid shine. The courtyard fell silent. The wind stopped. Even the clock on the tower held its breath in respect.", "Marnie stood at the base of the statue, clutching the hat. It was heavy not with weight but with purpose. Bunt trembled. Lulu hugged her knees. Toby checked his watch, which was running backwards, naturally.", "\"We have to go up,\" Marnie said. Her voice sounded small in the quiet.", "She looked at the statue, which was fifteen feet tall. Then she looked at her own hands, which were not. But she had a hat that wanted to be on a head and a mountain of socks that had just saved the world. So she figured she could manage a ladder. After all, she had managed a goose.", "Marnie bit the brim of the hat between her teeth. She grabbed the top of the wool ladder.", "She began to climb."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["Bunt stepped forward. He was nine feet tall, grey-green, with a tuft of moss-green hair and a red-spotted handkerchief the size of a tablecloth. He raised the fabric like a flag of surrender, or perhaps a flag of war. It was hard to tell with Bunt.", "\"Ah,\" he said softly.", "The whole school seemed to lean in. In the windows of the Great Hall, a hundred gnomes with painted smiles gasped. In the bakery, the bread stopped rising. In the village, the lamppost froze at 11:59.", "\"Ah,\" Bunt said again. His nose twitched. The red spots on his handkerchief seemed to vibrate.", "The golden wave was still there, pulsing, waiting for the next perfect spell to make it permanent. It was a beautiful, terrible thing. It waited for Bunt to finish.", "But Bunt did not finish. Bunt sneezed.", "It was not a normal sneeze. It was a seismic event. A tectonic shift of air. A hurricane made of mucus and dignity.", "\"AH-CHOOOOOOO!\"", "The sound blew straight up. His moss-green hair stood on end, defying gravity. The handkerchief snapped taut, a red and white blur. The golden wave shattered."], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["The ladder was wobbly, which was a problem because it was made of socks, and socks are notoriously bad at load-bearing. Marnie climbed with her arms, her red sneakers slipping on the polka-dot wool.", "Halfway up, she realized she was not alone.", "Cassius Pomeroy was there. He was a gnome, two feet tall in a bright blue jacket, with a white beard and a fixed smile that looked like it had been glued on. He had somehow scrambled up behind her, his tiny boots slipping on the lavender-scented wool.", "He held the ladder steady with both hands. His face was stiff, and his perfect golden hair, now a tiny tuft of gold, was blowing in the wind.", "\"Pennywhistle,\" he said, and his voice came out squeaky, like a door hinge that needed oil. \"Don't look down.\"", "Marnie looked down. She did not look at him.", "\"I'd recommend not looking at me either,\" Cassius said, adjusting his tiny blue jacket. \"It is undignified. For both of us.\"", "Marnie climbed higher, the hat in her teeth tasting like purple ink and old magic, while the statue’s cold stone shoulder pressed against her back.", "\"Thanks,\" she mumbled.", "\"You're welcome,\" Cassius said. \"But do keep your eyes on the hat. And for the love of precision, do not drop me.\""], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["Marnie reached the top, and there she was: Wilhelmina Humbleton, bareheaded and serene, waiting with the patience of a statue that had seen three centuries of wrong turns. Marnie set the hat on the stone ledge, taking a breath that filled her lungs with the sharp bite of ozone and the thick, woolly scent of Lulu’s socks.", "Cassius watched her from the ladder, his tiny blue jacket straining, while he gave one precise, rigid nod.", "Marnie lifted the hat. It felt light, and eager, like a puppy waiting for a walk.", "\"To the Founder,\" Marnie said, her voice clear in the silence, \"a little wrong.\"", "She placed it on the statue’s head. It sat centered. Correct. Exactly where it should be.", "But Marnie had a spell stuck in her throat, and it felt like a fish bone she couldn't swallow. She whispered the smallest word she knew.", "\"Straighten.\"", "The hat obeyed. Not correctly. It tilted to one side, jauntily, defying the center and the precision of the world.", "The gold glitter in the air spun, then swirled, rushing toward the hat in one great whirl of light and laughter."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["*Pop.*", "It was a soft sound, like a cork releasing from a bottle, or a sneeze that finally lands after hanging in the air for an hour.", "Then came another pop. And another.", "Across the lawn, in the Great Hall, and even in the bakery, a thousand of these sounds went off in quick succession, popping like the bubbles in a glass of fizzy soda. Mrs. Humphreys popped back into a woman covered in cream, wiping her nose with a flour-dusted towel. Mayor Fenwick popped back into a tall figure in a pink hat, straightening her sash with a sharp tug. Professor Quillfeather popped back into her usual size, adjusting her spectacles with a squeaky *click*.", "And in the Potting Shed, where the gnomes stood lined up beside the flowerbeds, Principal Thistlewood popped back.", "He was tall, and thin, and thoroughly furious. His moustache, which had been stuck straight up for three days, finally sprang out. It curled, then curled back down, settling into its perfect, curled shape.", "He looked across the lawn at the hat on the statue. He looked at the goose-feather brim. He looked for Marnie.", "He did not say anything. He just nodded.", "It was the most perfect nod Humbleton had ever seen. And it was slightly, wonderfully, incorrectly, tilted."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "The Dropout Club", "part": "PART FOUR: WONKY MAGIC", "paras": ["*From the Dropout Club Handbook, Rule 20: There are no dropouts. There are only students whose school hasn't been built yet.*", "The sun rose over Dimblewick to find the courtyard buried under a sea of lavender-scented socks and gold confetti. It looked less like a schoolyard and more like a cat had been wrestling with a laundry basket.", "Principal Thistlewood stood before the Great Hall, wrapped in a thick wool blanket that had once been a classroom rug. He clutched a mug of tea with both hands, his moustache drooping so far it hung damp and defeated to his chin.", "The whole school stood in the square. The Golden Circle was silent. Even the portraits in the windows leaned forward.", "\"I was wrong,\" the Principal said. His voice cracked, so he cleared his throat and tried again. \"I was wrong about the hat. And about you, Marnie.\"", "He pointed a trembling finger at the Founders' Fountain. There, Wilhelmina Humbleton stood bareheaded, save for the tall purple hat perched on her stone head. It was crooked. It was tilted to the left by exactly the width of a thumb.", "\"It is on the statue where it belongs,\" the Principal announced. \"Slightly crooked, as it turns out it prefers.\"", "Marnie blinked. She looked at the hat, then at the goose, who was asleep on a pile of socks with his purple ribbon tied neatly around his neck. She did not smile. She just nodded, once, and she was fairly sure her head tilted a little to the side."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["Cassius Pomeroy approached the Fountain, his golden hair flopped to one side where a single strand of confetti was stuck in his blazer pocket. He looked as though he had been in a storm and lost the map, which was a new kind of terrible for a boy who always knew where everything was.", "\"I am sorry,\" he said, and his voice was stiff, like a gate that needed oiling.", "Marnie waited. She did not move.", "\"I am truly sorry,\" he said, and his eyes went wide with the specific panic of a student who has just realized the test was on a topic they skipped. He had never done this before. Being sorry, it seemed, was a very new and difficult spell.", "\"It's okay to be wrong, Cassius,\" Marnie said. She kept her voice low. \"You'll get used to it.\"", "Cassius swallowed. He pulled out his silver wand, his hands shaking enough to make it look like he was trying to catch a fly. He aimed it at a puddle on the flagstones and whispered, \"Dry.\"", "The puddle got wetter. A single, soggy lavender sock popped out of the water and landed squarely on his shiny black shoe.", "Cassius stared at the sock. He picked it up and squeezed it, watching water drip onto his polish. He looked at Marnie, his lower lip trembling. He did not cry, but he came very, very close."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["A letter arrived from the Ministry, thick and heavy, smelling strongly of official ink. The Principal read it aloud to the club, who were sitting on the fountain steps.", "\"Marnie is offered reinstatement,\" he announced. \"Full honors. A new desk. A new cloak.\"", "Marnie felt a warm glow in her chest, which was nice, but it felt small, like a thimble inside a teacup, and too small for a whole room.", "\"I'll come back,\" she said. \"But only if the others come with me.\"", "The Principal cleared his throat, stroking his moustache as he looked at Bunt, then at Lulu, and finally at Toby.", "\"Very well,\" he said, taking a deep breath. \"We are opening a new Department. The Department of Wonky Magic.\"", "Bunt blinked, pulling a biscuit from his pocket. \"Assistant Professor of Sneezing?\" he asked.", "\"Bunt as Assistant Professor of Sneezing,\" the Principal confirmed. \"Lulu in charge of Applied Socks. Toby as Professor of Reversal. And Marnie... Head of Sideways Studies.\"", "Toby adjusted his gold glasses, looking down at his list. He crossed out the word \"failure\" and wrote \"tool\" in its place."], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["The celebration in Dimblewick started with a bang, or rather, a very loud thump that made the teacups rattle in their saucers.", "Gran Pennywhistle was dancing. She held a broom in one hand and a cup of tea in the other, spinning in circles until her lavender apron flapped like a nervous flag. The broom swept the floor with aggressive enthusiasm, knocking over a stack of mops that tumbled down the lane like clumsy dominoes.", "Mrs. Humphreys stood by the bakery door, her hair piled high with flour that stuck to her eyebrows like snow. She was juggling three buns, which was impressive considering one of them immediately flew over the street and was caught by a child who took a warm, sticky bite before even looking up.", "A banner hung above Crumb Lane, painted by Lulu in wobbly letters that said \"WELCOME BACK.\" She had apologized to the wall twelve times while doing the job, treating the plaster with more care than she treated her own socks.", "Gerald stood on the cobblestones. Today was an odd day, which meant he was a goose. He honked at the sky, puffing out his chest. He was free, and he was making a point of it at lunchtime, ignoring the fact that he had been a hat just yesterday.", "Marnie watched them all. She felt light, like a balloon that had finally been let go of the string and was drifting toward the roof."], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["Evening settled over the Potting Shed, where the stove hummed a low, cozy tune and the air thickened with the scent of lavender and woodsmoke. Marnie opened the Handbook, picked up her pen, and wrote Rule 20 in ink. The letters were neat, and they were certain.", "*There are no dropouts. There are only students whose school hasn't been built yet.*", "She closed the book and looked around at her friends, who were busy in their own way. Toby was checking his list, Lulu was counting socks, Bunt was eating a biscuit, and Gerald was asleep on the windowsill, his beak tucked under his wing like a secret.", "Then, there was a knock.", "It was a small, nervous tap, tapping, tapping, like a finger trying to remember which side of the door it was on. Marnie opened the door.", "In the doorway stood a boy. He was small, his wand was bent, and he looked like he had just lost a fight with a very opinionated tree.", "\"I heard you take people who can't,\" he whispered.", "Marnie remembered the morning she had been expelled. Fourteen minutes past nine. A Tuesday. The cold. The shame.", "She reached into her pocket and pulled out a biscuit.", "\"We take everyone,\" she said. \"Come in.\""], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "The Goose Incident", "part": "PART ONE: THE GOOSE INCIDENT", "page": 1}, {"n": 2, "title": "The Broom Mender", "part": "PART ONE: THE GOOSE INCIDENT", "page": 6}, {"n": 3, "title": "The Backwards Boy", "part": "PART ONE: THE GOOSE INCIDENT", "page": 11}, {"n": 4, "title": "A Great Many Socks", "part": "PART ONE: THE GOOSE INCIDENT", "page": 16}, {"n": 5, "title": "The Troll Who Sneezed", "part": "PART ONE: THE GOOSE INCIDENT", "page": 21}, {"n": 6, "title": "Meetings Begin With Biscuits", "part": "PART TWO: THE DROPOUT CLUB", "page": 26}, {"n": 7, "title": "Practice Makes Something", "part": "PART TWO: THE DROPOUT CLUB", "page": 31}, {"n": 8, "title": "The Golden Circle Comes to Tea", "part": "PART TWO: THE DROPOUT CLUB", "page": 36}, {"n": 9, "title": "A Bad Spell in the Right Place", "part": "PART TWO: THE DROPOUT CLUB", "page": 41}, {"n": 10, "title": "Founders' Day", "part": "PART TWO: THE DROPOUT CLUB", "page": 46}, {"n": 11, "title": "Perfectly Gnomed", "part": "PART THREE: THE GREAT GNOMING", "page": 51}, {"n": 12, "title": "Gnomes Are Terrible at Taking Orders", "part": "PART THREE: THE GREAT GNOMING", "page": 56}, {"n": 13, "title": "The Rules of the Hex", "part": "PART THREE: THE GREAT GNOMING", "page": 61}, {"n": 14, "title": "The Longest Corridor", "part": "PART THREE: THE GREAT GNOMING", "page": 66}, {"n": 15, "title": "The Founder's Hat", "part": "PART THREE: THE GREAT GNOMING", "page": 71}, {"n": 16, "title": "The Normalizing Tonic", "part": "PART FOUR: WONKY MAGIC", "page": 76}, {"n": 17, "title": "Four Wonky Wizards", "part": "PART FOUR: WONKY MAGIC", "page": 81}, {"n": 18, "title": "The Fountain", "part": "PART FOUR: WONKY MAGIC", "page": 86}, {"n": 19, "title": "The Hat", "part": "PART FOUR: WONKY MAGIC", "page": 91}, {"n": 20, "title": "The Dropout Club", "part": "PART FOUR: WONKY MAGIC", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
