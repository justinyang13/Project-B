<title>The Wizard School Dropout Club</title>
<style>
:root{
  --desk:#2a3b4a; --paper:#fbf6ea; --ink:#2b2a28; --muted:#7a6f5d; --accent:#c8871a; --edge:#e4d9bf;
  --shadow:rgba(0,0,0,.35); --bar:rgba(20,30,40,.88); --barink:#f4ecd8; --fs:20px;
}
:root[data-theme="sepia"]{ --desk:#3a2f24; --paper:#f1e2c2; --ink:#3a2c1a; --muted:#8a7454; --edge:#d9c6a0; }
:root[data-theme="night"]{ --desk:#0d141b; --paper:#1d2630; --ink:#e6e1d3; --muted:#93a0ac; --accent:#f0b34a; --edge:#2b3846; --shadow:rgba(0,0,0,.6); }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 20%,color-mix(in srgb,var(--desk) 82%,#fff) 0,var(--desk) 70%);
  color:var(--ink);font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;-webkit-font-smoothing:antialiased}
#app{min-height:100%;display:flex;flex-direction:column}
.stage{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:22px 12px 96px}
.book{display:flex;gap:0;max-width:1180px;width:100%;justify-content:center;filter:drop-shadow(0 18px 30px var(--shadow))}
.book.single .leaf{max-width:640px}
.leaf{flex:1 1 0;min-width:0;max-width:590px;background:var(--paper);padding:38px clamp(22px,4.2vw,54px) 46px;position:relative;min-height:calc(100vh - 150px);
  display:flex;flex-direction:column}
.book.spread .leaf:first-child{border-radius:6px 0 0 6px;background:linear-gradient(to left,color-mix(in srgb,var(--paper) 88%,#000) 0,var(--paper) 7%)}
.book.spread .leaf:last-child{border-radius:0 6px 6px 0;background:linear-gradient(to right,color-mix(in srgb,var(--paper) 88%,#000) 0,var(--paper) 7%)}
.book.single .leaf{border-radius:6px}
.leaf.blank{background:transparent}
.leaf.cover{padding:0;background:#10202c;min-height:0;border-radius:6px;overflow:hidden;max-width:520px;flex:0 1 520px}
.leaf.cover img{display:block;width:100%;height:auto}
.pageno{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:.8rem;color:var(--muted);letter-spacing:.1em}
.part{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);text-align:center;margin:0 0 4px}
.chnum{font-size:.85rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:6px}
h2{font-family:"Baskerville","Palatino Linotype",Georgia,serif;font-weight:700;font-size:clamp(1.5rem,3.2vw,2rem);text-align:center;margin:4px 0 16px;line-height:1.15}
.orn{text-align:center;color:var(--accent);letter-spacing:.6em;margin:-6px 0 14px;font-size:.9rem}
.pic{width:clamp(150px,44%,230px);aspect-ratio:1;border-radius:10px;object-fit:cover;box-shadow:0 2px 8px var(--shadow);border:4px solid #fff8;background:var(--edge)}
.pic.f-right{float:right;margin:4px 0 10px 18px}
.pic.f-left{float:left;margin:4px 18px 10px 0}
.pic.center{display:block;margin:0 auto 18px;width:clamp(170px,52%,260px)}
.txt{font-size:var(--fs);line-height:1.62;hyphens:auto;text-align:left}
.txt p{margin:0 0 .85em;text-indent:0}
.txt p+p{text-indent:0}
.first p:first-child::first-letter{font-family:"Baskerville",Georgia,serif;float:left;font-size:3.6em;line-height:.82;padding:.06em .1em 0 0;color:var(--accent);font-weight:700}
.txt::after{content:"";display:block;clear:both}
/* chrome */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--barink);display:flex;align-items:center;gap:10px;padding:10px 14px;z-index:20;backdrop-filter:blur(6px)}
.bar button{background:transparent;color:inherit;border:1px solid #f4ecd855;border-radius:999px;padding:8px 14px;font:600 .9rem system-ui,sans-serif;cursor:pointer;min-height:40px}
.bar button:hover:not(:disabled){background:#f4ecd822}.bar button:disabled{opacity:.35;cursor:default}
.bar input[type=range]{flex:1;accent-color:var(--accent);min-width:60px}
.bar .lbl{font:.8rem system-ui,sans-serif;opacity:.85;min-width:74px;text-align:center}
.tools{position:fixed;top:10px;right:12px;z-index:21;display:flex;gap:6px}
.tools button{background:var(--bar);color:var(--barink);border:0;border-radius:999px;padding:8px 12px;font:600 .85rem system-ui,sans-serif;cursor:pointer;min-height:38px}
#toc{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:center;justify-content:center;padding:14px}
#toc.open{display:flex}
#toc .box{background:var(--paper);color:var(--ink);border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px}
#toc h3{margin:0 0 10px;font-family:Baskerville,Georgia,serif;font-size:1.5rem}
#toc a{display:flex;gap:12px;padding:9px 6px;border-bottom:1px solid var(--edge);color:inherit;text-decoration:none;cursor:pointer;align-items:baseline}
#toc a:hover{background:var(--edge)}
#toc .n{color:var(--accent);font-weight:700;min-width:1.7em}#toc .t{flex:1}#toc .p{color:var(--muted);font:.85rem system-ui}
#toc .partname{margin:14px 0 2px;font:700 .72rem system-ui;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.hint{position:fixed;top:12px;left:14px;z-index:5;color:#f4ecd8aa;font:.8rem system-ui,sans-serif}
@media (max-width:899px){.stage{padding-top:58px}.leaf{min-height:calc(100vh - 140px);padding:34px 22px 44px}.hint{display:none}.bar .lbl{min-width:58px}}
@media print{.bar,.tools,.hint{display:none}body{background:#fff}}

<script>
const D = {"title": "The Wizard School Dropout Club", "sub": "A Story About Finding Your Own Kind of Magic", "pages": [{"no": 1, "ch": 1, "ctitle": "The Goose Incident", "part": "PART ONE: THE GOOSE INCIDENT", "paras": ["*From the Dropout Club Handbook, Rule 1: A hat is only a hat until it is a goose.*", "Marnie Pennywhistle was expelled from Humbleton Academy of Practical Wizardry at fourteen minutes past nine on a Tuesday morning, which she thought was rude of them, because she hadn't even had breakfast.", "To be fair, there was a goose involved.", "The goose was sitting on the Principal's desk. He was a plump white goose with an orange beak and a purple ribbon around his neck, spangled with silver stars, and he was honking at a paperweight as if it owed him money. Around him the Principal's office went on being as stately as ever. The portraits on the walls tutted whenever anybody sneezed. A clock ticked in the careful way of a clock that has never once been late. And on every shelf sat a hat, because Humbleton collected hats the way other schools collect trophies.", "Marnie stood in the middle of the carpet in her forest-green cloak, with her copper-red hair coming out of its two buns and a pencil sticking out of one of them, and tried to look like a person who could not possibly have done it."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["It had happened ten minutes earlier, at the Founders' Day rehearsal in the Great Hall.", "The whole school had been standing in rows, the choir had been warming up, and Principal Thistlewood had been giving a speech about precision. He wore his tall purple hat with the silver stars, as he had every day for forty years. And the hat, as Marnie noticed halfway through the second paragraph, was crooked.", "It was crooked by about the width of a thumb. It was the sort of crooked that gets under your skin like a splinter. Marnie knew she should leave it alone. She knew it the way you know you shouldn't poke a sleeping bear. But the hat tilted, and tilted, and the Principal said the word \"perfect\" for the ninth time, and her wand was already in her hand.", "\"Straighten,\" she whispered. It was only the smallest spell in the book.", "There was a puff of purple smoke. The hat went *hoo*, and then it went *honk*.", "The goose flew once round the Great Hall at roof height. It knocked over the entire choir, bit the Vice-Principal on the toe, and landed in the punch."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["Now Principal Ambrose Thistlewood sat behind his desk, tall and thin, with a long white moustache curled up at the ends like two question marks, and read out the charges from a very long piece of paper.", "\"One goose,\" he said. \"Fourteen pecked toes. Three flattened choirs. One punch bowl, which was a gift from the Ministry. One Vice-Principal, who is now in the infirmary, being brave.\"", "By the door stood a boy in a crisp royal-blue blazer with gold buttons. His name was Cassius Pomeroy, he was the head of the Golden Circle, which was what Humbleton called its very best students, and his golden hair was perfect. It was perfect in the Great Hall and perfect on the stairs and, as far as anyone could tell, perfect in a hurricane. He was not laughing. That was the worst of it. He wore the smile of a freshly ironed shirt.", "\"Perfectly sad, really,\" he murmured, to nobody, but loudly enough."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["Marnie knew the list by heart. She had been at Humbleton for two years, and in that time her candle spell had made a fish, her levitation spell had made Professor Dunmore's moustache stand straight up, and her Tidy spell had turned the dust bunnies under her bed into rabbits, real ones, with real opinions.", "It was never the spell in the book. It was always something close to it, in the way that a cousin is close to you, but wearing a different hat.", "\"It appears,\" the Principal said, \"that the goose is permanent. Which is highly irregular.\" His moustache twitched. \"Miss Pennywhistle, some people are simply not suited to magic. It is no shame. But it is a fact.\"", "\"I'm sorry,\" said Marnie. And she was. She was sorrier than she had ever been about anything. But sorry, it turned out, doesn't fit back into a goose.", "The Principal folded the long paper into a very small square, and the clock ticked, and the portraits tutted, and Marnie understood that she had not been sent home for a day or for a week. She had been sent home for good."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["She left the way people leave when they are not allowed to come back: slowly, with her trunk.", "The trunk had a wheel that squeaked at every second step. The goose followed her down the corridor, because nobody else in the entire school wanted him and he seemed to have decided, in his goosey way, that she would do. At the great front doors, Cassius appeared at her elbow without making a sound.", "\"Goodbye, Pennywhistle,\" he said. \"Do try to stay… correct.\"", "The big doors boomed shut behind her.", "Marnie stood on the top step in the cold morning, with her trunk and her cloak and a goose, and no school. The goose turned and honked at the doors, long and loud and deeply offended, as if to say that Humbleton could do with a few more geese, and fewer hats.", "And Marnie laughed. It was a small, wet laugh, and it surprised her very much.", "She did not know it yet, but it was the best thing that would ever happen to her. It was only the beginning, and it had feathers."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Broom Mender", "part": "PART ONE: THE GOOSE INCIDENT", "paras": ["*From the Dropout Club Handbook, Rule 2: Gran is always right, especially when she is wrong.*", "The walk down the hill to Dimblewick felt very long for a girl with no future. The village sat in the crook of the land, a tangle of chimney pots that leaned over one another like they were sharing a secret. The air smelled of yeast and woodsmoke. At the bakery, loaves of bread were actually rising, puffing up through the oven doors with a soft, rhythmic *pop*.", "Marnie dragged her trunk. The wheel squeaked on every second step. *Squeak. Thud. Squeak. Thud.* It was a rhythm that matched her heart.", "The lamppost at the corner cleared its throat.", "\"Twenty to ten,\" it announced in a voice like a rusty hinge. \"Cloudy. Good luck.\"", "Villagers peeked through their curtains, whispering and pointing. \"That is the Pennywhistle girl,\" they said. And then, louder: \"And a goose. They say a goose.\"", "The goose, who was sitting on Marnie’s trunk, turned his head. He honked at a ginger cat. The cat hissed. The goose honked again, with more dignity."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["Pennywhistle’s Broom Mending was at the bottom of Crumb Lane. The sign hung crooked on a single nail. Inside, the air was thick with the scent of dried straw and linseed oil. Brooms hung from the ceiling in great bunches, looking like upside-down onions with feathers.", "Gran was elbow-deep in a twig bundle. She was round and rosy, with a grey bun held in place by a single broom-straw. She looked up. She saw Marnie. She saw the trunk. And then she saw the goose.", "Her mouth opened. Her eyebrows rose so high they nearly touched her hairline. She tried to say something, but what came out was a giggle. Then a cackle. Then a wheeze.", "She slipped off her stool and sat heavily on a wooden bucket, wiping her eyes.", "\"That,\" she wheezed, pointing a twig at the bird, \"is the most ridiculous thing I have ever seen in forty years of mending brooms.\"", "The goose tilted his head. He looked at Gran with an expression of deep, offended judgment."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["\"Ambrose Thistlewood has been wearing that hat for forty years,\" Gran said, finally catching her breath. She set down her twigs. \"I always said it looked like a goose. I told his mother. I told the Ministry. But no one listens to a broom mender.\"", "She poured tea, which was strong and hot, with a splash of milk that looked like it had been poured by a horse. On Marnie’s plate went three slices of toast, spread with so much jam that the jam was the main character.", "Marnie ate, because her tummy was empty and her heart was full of a sour, sticky feeling that tasted like burnt toast.", "\"I ruined everything,\" Marnie said. \"I turned his hat into a goose. I’m expelled. I’m a failure.\"", "Gran refilled her cup, the steam curling up from the rim. \"A spell is like a sneeze, Marnie. You can’t tell it where to go.\"", "\"But everyone else’s goes where they point it,\" Marnie said. \"Mine just... wanders.\"", "Gran smiled, a small, sharp smile. \"Everyone else is pointing at where it was already going. You are just letting it decide.\""], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["The goose hopped off the counter and landed on the table with a heavy *thump*, his feathers ruffling indignantly as he inspected the toast, then Marnie, and finally bit the corner of her slice before she could stop him.", "\"Excuse me,\" said Marnie.", "The goose hissed at the stove, a low, dangerous sound that made the kettle jump, and then he waddled to the bread bin to peer inside as if checking the price of the loaves.", "\"He has the look of a Gerald,\" Gran said, leaning on her counter. \"A proper, stuffy, important Gerald.\"", "\"I’m sorry,\" Marnie said. She said it again, because it felt safer. \"I’m so sorry. I should have been correct. I should have been precise.\"", "\"Sorry is for dropped eggs,\" Gran said firmly, pointing a floury finger. \"You have not dropped an egg. You have created a bird. Eat your toast, girl. And do not let him steal your pencil.\"", "The goose blinked, his orange eyes widening with sudden, sharp interest, and looked directly at Marnie’s pencil case."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["The attic room was a cramped little box of sloping beams where Marnie had to hunch her shoulders just to stand up. It smelled of old paper and dust, and she sat on the narrow bed with her legs tucked tight under her knees.", "She took out her practice wand, a plain stick of hawthorn, and pointed it at the candle on the nightstand.", "\"Light,\" she whispered.", "The candle did not light. Instead, a tiny trout, no longer than her finger, popped out of the wick and landed on the wooden table with a soft *plip*. It looked around, very confused.", "Marnie put her face in her hands and cried, a quiet, shaky sound that made her shoulders bounce. Gerald hopped onto the bed and looked at her, but he did not honk. He simply stood there, his orange beak pointed at the ceiling, waiting with perfect patience.", "Then Marnie stopped. She sat up, her eyes red and her nose running.", "Her real wand, the one with the silver tip, was in the confiscated-things box. It was in the Potting Shed. At the school.", "And the groundskeeper locked the garden gate at dawn."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "The Backwards Boy", "part": "PART ONE: THE GOOSE INCIDENT", "paras": ["*From the Dropout Club Handbook, Rule 3: If a spell goes the wrong way, check which way you were facing.*", "The back gate was locked, which was a problem, because Marnie Pennywhistle did not possess a key. She did, however, possess a goose. Gerald marched up to the latch with the grim determination of a general inspecting a weak fort. He honked once, sharply, and the latch clicked open. Marnie stepped inside, trying to look like she belonged there, which was difficult given that she was wearing only one sock.", "The kitchen garden was a place of quiet judgment. Rows of stone gnomes sat on their pedestals, their painted smiles fixed in a permanent, suspicious grin. A pumpkin patch loomed in the dark, its vines twisting like knotted fingers. Marnie felt watched. She was sure of it. The air smelled of damp earth and old compost.", "A scarecrow stood at the end of the row. It had a straw hand raised in a salute. Marnie had not noticed it before. It did not lower its hand. It just stood there, rigid and attentive, as if waiting for her to say something clever. She did not. She walked past, her red high-top sneakers squeaking on the gravel path. Gerald followed, his purple ribbon catching the faint moonlight. He looked offended. He always looked offended. It was part of his charm."], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["At the far end of the garden stood the Potting Shed. It was a crooked little building of weathered wood, with a roof that sagged in the middle like a tired cat. The windows were fogged up from the inside, breathing out warmth. Marnie pressed her nose against the glass.", "Inside, a lantern hung from a nail, glowing a bright, cheerful yellow. A boy stood in the center of the room, surrounded by a mountain of flowerpots. He wore a navy knitted vest over a white shirt, a red bow tie, and large round gold glasses. His hair was short and black, and he looked as if he had just calculated the exact angle of the lantern’s heat.", "\"Illuminate,\" he said. His voice was calm and precise.", "The lantern went out. Complete darkness.", "A beat of silence. Then a soft sigh.", "\"Drat,\" said the voice from the dark. \"Dark again.\"", "Marnie froze, her fingers gripping the wooden frame. She could hear the boy moving. A clatter of pots. A shuffle of feet. Then, from the blackness, a new voice, slightly louder.", "\"Extinguish.\"", "The lantern blazed back to life, brighter than before. The boy adjusted his glasses and stared at the light with the same expression he had worn in the dark. It was a look of profound, irritated acceptance."], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["The door creaked open before Marnie could even raise her knuckles. She froze, but the boy did not flinch or jump. He simply turned his head, his round glasses catching the lantern light, and looked at her with the mild curiosity of a scientist observing a particularly slow snail.", "\"You're the girl who made the hat,\" he said. It was not a question.", "\"I'm Marnie,\" she replied.", "\"Tobias Abara,\" he said. \"Toby to my one friend, which is to say, I am mostly Toby.\" He stepped back, making room for her to enter. The air inside smelled of wet soil and lavender. \"If you are here to laugh, I suggest you save your breath. You will need it for the exit.\"", "Marnie stepped inside. The shed was warm and filled with pots of every size, stacked in precarious towers that defied gravity. Toby moved around them with the ease of someone who had memorized the map. He picked up a small, dusty book from a shelf.", "\"My magic works backwards,\" he said, not looking up. \"Everything. Perfectly. I am the most consistent wizard in the school. And I have never once been given a grade for it.\" He closed the book with a soft thud. \"It is a bit like being good at everything, except everything is the wrong thing.\""], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["Marnie’s eyes scanned the room. There, on a high shelf, sat a small wooden box. The Confiscated Things Box. She could see the silver tip of her real wand sticking out. Her heart gave a little kick.", "\"Is that...\" she started.", "\"Yours,\" Toby said. \"Yes. Take it. You look like you need it.\"", "She reached up and pulled the wand down. It felt heavy and real in her hand. She turned back to Toby, a grin spreading across her face.", "\"Watch this,\" she said. She pointed the wand at a chipped blue flowerpot on the table. \"Straighten!\"", "There was a puff of blue smoke. The pot vanished. In its place sat a duck. It was very small, very blue, and it looked absolutely furious. It squawked once, a sharp, indignant sound.", "Toby stared. Then he laughed. It was a real laugh, surprised and bright.", "\"You're not even backwards,\" he said, his eyes wide behind his glasses. \"You're sideways. That is far more interesting.\"", "Gerald, who had followed them inside, honked loudly. It was a sound of pure, unadulterated superiority. The duck squawked back. They stared at each other, two small, angry things in a warm shed."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["Toby leaned against a stack of pots, watching the duck and the goose argue. \"It’s not just us, you know,\" he said softly. \"There are others who come here at night. People who don’t fit. People who are a bit... irregular.\"", "Before Marnie could ask who, the lantern flickered. The light dimmed, then went out completely, plunging the shed into total darkness.", "Marnie gasped. A sudden, heavy weight landed on her shoulders, warm and soft, smelling intensely of lavender. She tried to push it off, but it was heavy, and it was moving.", "\"I'm so, so sorry,\" said a small voice from the heap on top of her.", "Marnie froze. She could feel soft hair brushing her cheek and a small, quick heartbeat against her chest. In the dark, she could hear Toby breathing, and the duck squawking, and the goose honking, all in the same warm, lavender-scented pile."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "A Great Many Socks", "part": "PART ONE: THE GOOSE INCIDENT", "paras": ["*From the Dropout Club Handbook, Rule 4: Socks are not a spell. Socks are a lifestyle.*", "Marnie and Toby scrambled up through a drift of wool that felt suspiciously like a snowdrift, except it smelled of laundry soap and regret. There were stripy socks, polka-dot socks, and one grey sock with a hole shaped exactly like the country of France.", "Marnie pulled a striped sock off her head. She was now looking at a girl who was slowly climbing down from a rafter.", "The girl had a black braid that reached her knees, tied with a pink ribbon. She wore an orange hoodie and mismatched socks, one striped and one dotted, which was odd given the situation.", "\"I'm so, so sorry,\" the girl said, her voice trembling. \"I'm so, so, so sorry. I was trying to make a candle. It was a candle yesterday too. And the day before. It's always a candle I mean to make.\"", "Marnie looked at the pile of socks. She looked at the girl. She looked at the one sock with the French hole.", "\"A candle,\" Marnie repeated. Her voice climbed to a pitch she did not recognize as her own.", "\"Yes,\" said the girl, hanging upside down from the rafter. Her hair defied gravity with a dignity that seemed personally offensive to Marnie. \"A very nice, bright, useful candle.\""], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["Her name was Lulu Vasquez. She was ten years old, which made her the youngest student Humbleton Academy had ever admitted, a fact that usually came with a plaque in the lobby. Instead, it had come with a hammock and a steady diet of cheese sandwiches.", "\"Rain spell?\" Marnie asked, holding up a wet, lavender-scented sock.", "\"Socks,\" Lulu said. \"Flying spell? Socks. I cast 'Ignis' once, just to be polite, and I got a heap of lavender socks that smelled like my aunt’s garden.\"", "Toby adjusted his glasses, looking at the socks with the critical eye of an auditor reviewing a bad invoice. \"Your teacher,\" he said, \"did not find this polite.\"", "Lulu winced. \"She said, 'Miss Vasquez, this academy is not a laundry.'\" She shrank into her hoodie. \"I was too embarrassed to go home. So I’ve been sleeping in the hammock for nine days. Toby brings me sandwiches. He’s very good at that. He doesn’t even complain about the socks.\"", "Toby picked up a polka-dot sock, sniffed it, and dropped it. \"It is very consistent,\" he said softly. \"That is rare.\"", "Marnie looked at her own hands. They were still sticky from the cheese. She felt a strange, warm feeling in her chest, like a cat sleeping in a sunbeam."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["The socks were never pairs, a fact for which Lulu apologized with the same regularity she produced them, as if she were personally responsible for the invention of mismatching. Toby, however, pointed out with quiet precision that consistency was a form of magic. If your spells always produced socks, then you were a sock wizard. It was a niche, certainly, but it was yours.", "Above them, the rafters were carved with names. Marnie reached up and traced the deep scratches in the wood, her finger following the grooves where other students had marked their time in the shed.", "\"Ermintrude, 1743: turned my own nose into a turnip,\" she read aloud.", "\"Barnaby: my wand exploded (twice),\" Toby added, reading the next one.", "There were hundreds of them. Three hundred years of students who had been told their magic was wrong, and who had come here, to this shed, to sit in the dark and be wrong together. The shed had always been the place for the failures, yet the air inside felt less like a punishment and more like a refuge.", "Marnie looked at the carvings, then at Lulu, then at Toby. The feeling in her chest shifted, settling into something solid and warm, like a stone that had finally found its spot in a wall. She was not a mistake. She was simply different."], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["Marnie laughed. It was a real laugh, the kind that starts in your belly and ends with a wet snort. She laughed until her eyes stung and her ribs ached from the sheer effort of it.", "Lulu watched her, her long black braid swinging gently against her orange hoodie. Then, with great solemnity, she reached into the lavender-scented heap and pulled out a single sock. It was a soft, mossy green, with a hole right in the toe.", "\"For you,\" Lulu said. \"A welcome gift. It’s all I can do.\"", "Marnie took the sock. It was soft and warm. She looked at the hole, then at Lulu, and then she said, \"It’s the nicest present I’ve ever had.\"", "And she meant it. It tingled in her teeth and her fingertips. She tucked the sock into her cardigan pocket, right next to her pencil.", "Toby nodded, pushing up his glasses with approval. \"Acceptable,\" he said.", "Marnie smiled. For the first time in two years, her magic didn’t feel like a curse. It felt like a tool. A strange, socks-and-geese kind of tool, but a tool all the same."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["The silence in the shed was thick and comfortable, broken only by the soft tick of the clock and the occasional squawk of the goose. Marnie was just about to suggest a rule about who got the last biscuit when the door creaked.", "It wasn’t a normal creak, though. It was a groan, a deep, wooden protest that shook the dust from the rafters. The entire shed tilted to the left, just slightly, as if someone enormous had leaned against it.", "Lulu went pale. \"Oh,\" she whispered. \"That’ll be Bunt.\"", "A hand pushed through the door. It was the size of a coal shovel, grey-green, and holding a silver tray. On the tray sat a tower of biscuits, stacked so high they defied gravity. The hand wiggled, and the biscuits clattered pleasantly.", "Marnie looked at Toby. Toby looked at Lulu.", "\"We’re not alone,\" Marnie said, her voice small.", "No. They were definitely not alone. And the door was opening wider."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "The Troll Who Sneezed", "part": "PART ONE: THE GOOSE INCIDENT", "paras": ["*From the Dropout Club Handbook, Rule 5: When in doubt, stand upwind of the troll.*", "The door did not open so much as it surrendered. A hand, grey-green and the size of a coal shovel, squeezed through the gap, holding a silver tray. On the tray sat a tower of ginger biscuits, stacked so high they defied gravity. The hand wiggled, and the biscuits clattered pleasantly.", "Then the rest of Bunt followed. He was nine feet tall, with skin the color of wet moss and a tuft of hair that looked like it had been pulled from a garden shed. He wore a patched brown vest that was the size of a tent, and boots made from two old barrels. In his other hand, he clutched a red-spotted handkerchief large enough to serve as a tablecloth.", "He ducked, his mossy head bumping the rafters with a soft *thump*.", "\"Sorry,\" Bunt said. His voice was deep and slow, like a stone rolling down a gentle hill. \"Ceiling is low. I forget.\" He looked around the small shed, then at the three children huddled by the stove. \"Biscuit? They're ginger. I made them. They're a bit hard. You can dunk.\"", "Marnie stared. Toby adjusted his glasses. Lulu blinked.", "\"Biscuits,\" Lulu whispered, as if the word were a magic spell she hadn't learned yet.", "Bunt placed the tray on the table, nudging a flowerpot aside with the toe of his barrel-boot. He sat down, which involved the shed shaking again, and waited."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["Marnie needed to do something, and sitting too small and too wrong in this tiny shed with a troll was not doing it. So she did what she always did: she pulled out her wand and aimed it at the biscuit tower.", "\"I'll make them glow,\" she said. \"Just a little light. To make them look... perfect.\"", "She whispered, \"Illuminate.\"", "A warm, golden light began to rise from the biscuits. It was beautiful. It was exactly right.", "Bunt’s nose wrinkled, then twitched, the way a cat's whiskers twitch before a sneeze.", "\"Ah,\" Bunt said, his eyes closing. \"Ah... ah...\"", "The light flickered, and the biscuits hummed, while Bunt’s face scrunched up into a tight, knotted mess.", "\"AH-CHOO!\"", "The sneeze was a physical force that exploded the air outward in the shed. Every sock Lulu had ever conjured there vanished in a single, sharp *pop*, and the small blue duck on the shelf turned back into a clay flowerpot. The golden light fizzled out like a candle in a storm.", "And for one heartbeat, just one, the plump white goose on the stove stopped moving. He looked less like a bird and more like a tall, purple hat with a ribbon. Then he honked, loud and offended, and was a goose again.", "Marnie blinked, rubbed her eyes, and decided it was the dust."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["Bunt wiped his nose with a handkerchief the size of a dining tablecloth. \"I apologize,\" he rumbled, his voice shaking the dust motes in the air. \"That was rude. The magic itches. It feels like a bee sting, but on the inside of my nostril.\"", "Marnie tilted her head, her copper-red buns shifting. \"Why does it itch?\"", "\"Because I am Bunt,\" he said simply. \"Trolls are not good at magic. It is like trying to eat soup with a fork. It gets everywhere. And it itches.\"", "He took a biscuit and dunked it in a mug of tea he poured from a flask in his vest. \"At Humbleton, I was the groundskeeper. I carried stones and mended fences. I was very good at being quiet. But the teachers cast spells near me. To clean, to light, to fix.\"", "He mimed a tiny sneeze. \"Ah-choo. And the spell fizzes. Poof. Gone.\"", "\"They said I disrupted the Wizarding Order,\" Bunt continued, his voice dropping to a low rumble that vibrated the flowerpots. \"They said I was too irregular. They asked me to stay three fields away from the classrooms. I am allowed to stay here, as long as I am quiet. And unmagical.\"", "He shrugged, a movement that rustled the rafters above them. \"Which I am, mostly.\"", "Toby took a biscuit and chewed it with precise, careful bites. \"So, you are not expelled?\" he asked, his round glasses reflecting the weak stove light.", "\"I was moved,\" Bunt corrected gently. \"To a quieter place.\""], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["The shed felt different now. The stove hummed, warming the air until it smelled like ginger and old wood. Bunt’s size made the small space feel less like a hiding spot and more like a room with a view.", "Marnie broke a biscuit in half. It was crunchy, spiced, and perfect.", "\"You know,\" she said, chewing, \"I think we’re all the same.\"", "Toby looked up. \"We are?\"", "\"Expelled,\" Lulu said softly. \"Or moved. Or just... not quite right.\"", "Marnie looked at the four of them. There was the girl with the wrong spells, the boy with the backwards magic, the girl with the socks, and the troll who sneezed magic away. They sat among the flowerpots, eating hard ginger biscuits, and nobody was looking at them with disappointment. It was just a room, and it was theirs.", "\"We should have a club,\" Marnie said.", "Toby raised an eyebrow. \"A club for people expelled from a school for wizards?\"", "\"A Dropout Club,\" Lulu said, and her eyes lit up. \"Yes. A Dropout Club.\"", "Bunt looked between them, his mossy hair swaying slightly. He asked, gravely, his voice low and serious, \"Do clubs have biscuits?\"", "Marnie grinned. \"Only if we decide they do.\""], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["They shook hands. Bunt offered only one finger, which was a wise choice, as his hand would have swallowed Marnie’s entirely. Gerald honked from the stove, and they agreed he was Secretary.", "Marnie found a piece of chalk and a dusty board by the door. She wrote, in wobbly letters: *Rule 1: A hat is only a hat until it is a goose.*", "Outside, the fog was rolling in off the hill. Through the small, grime-streaked window, the lights of Humbleton Academy shimmered in the distance, bright and golden and perfect. A brass band began to play, loud and brassy, practicing for the Founders' Day Ceremony in three days’ time.", "The music drifted through the glass, cheerful and precise. Inside the shed, the four dropouts looked at each other, and then at the goose. They had no idea that the biggest spell in Humbleton’s history was about to go wrong. They had no idea that it would be their problem.", "But Bunt was eating another biscuit, and Lulu was counting socks, and Toby was making a list, and Marnie was smiling.", "For now, that was enough."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "Meetings Begin With Biscuits", "part": "PART TWO: THE DROPOUT CLUB", "paras": ["*From the Dropout Club Handbook, Rule 6: Meetings begin with biscuits.*", "The sun was just a thin pink line on the horizon when Marnie Pennywhistle tiptoed out of the broom shop. Her basket clinked with eight jam sandwiches, heavy as bricks. One spare broom leaned against her hip, bristles stiff. A note in Gran’s shaky script said, *Good luck with whatever this is.* Marnie tucked it into her cardigan pocket, next to her heart, which felt slightly too large for a Tuesday morning.", "The Potting Shed waited in the dark, smelling of wet earth and old roses. Dew beaded on the clay pots, catching the first light. And there, standing outside in the grey shadows, was Bunt. He was holding a kettle the size of a small cauldron, his barrel-boots silent on the grass. He did not sneeze. He had not cast a spell. He was just standing there, which, for Bunt, was the most magical thing of all.", "“Morning,” Bunt rumbled, his voice like a cello string being plucked gently. “I brought tea. And biscuits. And a mild suspicion that we are about to do something very silly.”", "Marnie looked at the kettle, then at the troll, then at the sky, which was turning from grey to a hopeful, bruised purple.", "“Silly is better than sad,” she said, and unlocked the door."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["Toby pointed at a rickety wooden bench. “Demolish,” he said, in his precise, clipped voice.", "The bench groaned, stretched, and popped itself together into a cozy sofa with a tufted back. Marnie blinked. Toby shrugged. “It works backwards, but it works.”", "Marnie pointed at the dust bunnies under the stove. “Tidy,” she whispered.", "Poof. Three real bunnies sat on the floor, looking deeply confused. One, a grey one with a smudge of soot on its nose, stayed. “Dust Bunny,” named Lulu, before apologizing to the rabbit for naming it.", "Lulu, feeling generous, pointed at the window. “Please clean,” she said.", "One hundred and four lavender-scented socks appeared in a heap. They stretched and draped themselves into curtains, cushions, a rug, and a hammock that sagged precariously over the stove.", "“It’s functional,” Toby said, adjusting his glasses.", "“It’s a disaster,” said Marnie.", "“It’s home,” said Bunt, taking a biscuit from the sock-cushion."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["Marnie hauled out a thick slab of chalk. It looked like a single white toothpick in Bunt's massive, grey-green hand. Toby held the board steady.", "Rule 1 was already on the door in Marnie's wobbly chalk, so Toby copied it into the Handbook in neat, slanted letters, and went on without being asked. “Rule 2: Gran is always right, especially when she is wrong.”", "“She will be thrilled,” said Marnie.", "Lulu raised a hand. “I’m sorry, but I think we need a rule about socks. Socks are not a spell. Socks are a lifestyle.” She apologized to the board for suggesting it.", "Toby scribbled. “Rule 3: If a spell goes the wrong way, check which way you were facing.” He looked very pleased with himself. Lulu’s rule became Rule 4. Bunt cleared his throat and added, in his slow voice, “Rule 5: When in doubt, stand upwind of the troll.”", "Gerald, the goose, waddled over. He snatched the chalk from Bunt's fingers, held it in his orange beak, and honked loudly. The sound was sharp and demanding.", "Bunt blinked his slow, mossy eyes. “He wants a biscuit.”", "Marnie traded a chocolate digestive for the chalk. When Gerald finally dropped it, she wrote the last rule of the morning: “Rule 6: Meetings begin with biscuits.” They elected Gerald Honorary Chair, because he cannot be argued with, being a goose.", "Toby nodded solemnly, adjusting his glasses. “A fair legal precedent.”"], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["The first official meeting began with a question hanging in the air. It smelled faintly of lavender and damp wool.", "“If your magic ever worked correctly,” Toby said, tapping the board with his finger, “what would you do?”", "Lulu raised her striped sock. It looked lonely. “A pair. Just one perfect pair. No more heaping. I could wear them without explaining to everyone why I have fourteen toes.”", "Bunt cleared his throat. The sound was like a large rock rolling down a gravel driveway. “Stand in a classroom. Not sneeze. For ten minutes. That would be a personal victory.”", "Marnie looked at her hands. They were still dusty from the chalk. She did not want a pair of socks, and she certainly did not want a quiet classroom. She wanted to cast one correct spell, just once, so that nobody could ever say she couldn’t. She wanted the fish to be a candle, the moustache to stay down, and the goose to be a hat.", "Nobody said she shouldn’t want it. That was the most surprising part of the morning. Toby simply added it to the list. His pen scratched softly against the wood.", "“One correct spell,” he said, nodding to himself. “Goal achieved. Biscuits all round.”", "Marnie felt a small, warm weight settle in her chest."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["Evening fell, and with it, a strange, glittering mist drifted down the hill from the Academy.", "Bunt sniffed the air. His nose twitched. “Ah... ah... AH-CHOO!”", "A wave of pure, quiet force blew across the garden. It pushed the dust, the socks, and the fear all the way to the far side of the shed. In the silence that followed, the world felt very still.", "Far above, on the hill, a golden light bloomed. It was the Golden Circle, rehearsing. The light was so bright and perfect it made every shadow in the garden stand up straight and point at the sky. The flowers stopped swaying. The wind held its breath.", "Marnie felt a chill, not of cold, but of wrongness. She looked at the perfect light, then at the messy, sock-filled shed, and for the first time, she was glad to be on the side that was a little bit crooked."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "Practice Makes Something", "part": "PART TWO: THE DROPOUT CLUB", "paras": ["*From the Dropout Club Handbook, Rule 7: Practice makes... something. Not always perfect.*", "Toby stood in the center of the shed, holding a thick textbook open like a map of a place he had never been.", "\"I have deduced,\" he said, adjusting his gold-rimmed glasses, \"that if I say 'Extinguish,' the light turns on. If I say 'Illuminate,' it goes out. It is consistent. It is beautiful. It is entirely wrong.\"", "He snapped his fingers. The lamp above their heads did not turn on. Instead, the window shutters slammed shut with a crack that shook dust from the rafters.", "\"Consistent,\" Marnie said, picking a piece of dried flower petal out of her copper hair.", "Lulu tried next. She aimed her wand at the pot-bellied stove. \"Float,\" she whispered. A single lavender sock, smelling faintly of regret, drifted up and stuck to the ceiling.", "Bunt, who was holding the textbook like a lectern, suddenly sneezed. It was not a normal sneeze. It was a weather event. A blizzard of paper pages erupted from his nose, swirling around the room until the shed looked like it had been attacked by a very literary snowstorm.", "The teapot on the table, which Marnie had been trying to charm into a frog, had already succeeded in becoming a frog. Then, because Marnie’s magic was a bit like a cat with a butterfly, the frog turned into a wheel of cheddar cheese.", "\"Practice makes something,\" Toby said, watching the cheese roll under the stove. \"Not always perfect.\""], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["Toby fetched a piece of chalk. He sketched a grid on the back wall. He labeled the top \"Progress,\" using the same dry tone he reserved for words like \"disaster.\"", "Marnie’s column was a sad little stack of errors: three fish, one duck, two mice, and a wheel of cheddar. It was still hiding under the stove, judging by the pungent smell drifting up. Lulu’s column featured a single, massive number: 212. Two hundred and twelve socks. None of them a pair. All of them lavender.", "In Toby’s section, the \"Correct Spells\" box held a lonely zero. The \"Opposite Spells\" list ran long and neat. It included a door that opened when commanded to close. It also included a bowl of water that curdled into dry sand. Bunt’s entry was simply: 31 Sneezes.", "\"We are excellent at being wrong,\" Lulu said softly. She eyed the sock pile that now towered over her head. \"And miserable at being right. I’m sorry, scoreboard.\"", "The scoreboard did not apologize. It just sat there, chalky and quiet. It held their failures up for inspection like a very confused museum exhibit. Marnie felt a strange prickle in her chest. It wasn’t quite pride. It was more like the feeling of finding a loose tooth under your pillow, except the tooth was made of chalk and the pillow was a wall.", "\"Same time tomorrow?\" Toby asked.", "\"Obviously,\" Bunt replied. He wiped his nose with a handkerchief the size of a tablecloth."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["The shout came from the lane, sharp and high-pitched.", "\"NOT THE SPONGES!\"", "Marnie’s head snapped toward the window. Through the dusty glass, she saw a broom. It was the sturdy Dimblewick bakery delivery broom, its bristles worn thin, flying. It was not floating; it was towing a wooden cart full to the brim with cream buns, golden and glistening.", "Mrs. Humphreys was running after it. She was a small woman covered in so much white flour that she looked like a cloud that had decided to take a walk. Her apron whipped behind her, and her face was a mask of pure panic.", "\"Stop it! Stop the buns!\" she yelled, waving her rolling pin.", "The broom did not stop. It galloped down the hill, the wheels of the cart spinning so fast they were blurs, while the buns bounced inside like a golden avalanche waiting to happen.", "\"Oh dear,\" Lulu said.", "\"Oh my,\" Bunt replied.", "Marnie grabbed her wand, and Toby grabbed his. Bunt grabbed a biscuit from his pocket, just in case. Then the four of them were out the door, running down the slope toward the chaos."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["They reached the bend just as the broom did, the cart wobbling like a ship in a storm. Marnie raised her wand, not knowing what to do, so she did what she always did. She aimed.", "Toby stepped forward, his brown lace-up shoes squeaking on the gravel. \"Fly,\" he said, his voice calm and precise.", "Because Toby’s magic works backwards, the broom instantly remembered it was a stick. It stopped dead. The momentum, however, did not.", "Lulu didn't think. She grabbed a pile of socks from her hoodie pocket and threw them. A mountain of lavender wool hit the road. The wheels gripped the soft fabric. The buns bounced once, twice, and settled into the wool, cushioned and safe.", "Bunt reached out with one massive hand and caught the back of the cart. He stopped it with a gentle *thud*.", "Marnie, still aiming, felt a tingle in her wand. She tried to calm the broom, but it slipped. A puff of purple smoke hit the wheel. The wood vanished. In its place sat a large, round wheel of cheddar cheese.", "It was slippery. It was perfect. The cart glided to a stop, silent and smooth, the cheese wheel acting as an excellent, edible brake."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["Mrs. Humphreys stood over the cart, rolling pin poised. She surveyed the cheese wheel, the mountain of socks, and the four of them.", "\"Well,\" she said, wiping flour from her forehead. \"That was either very clever or very lucky.\"", "\"Probably both,\" Marnie replied.", "Mrs. Humphreys reached into the cart and pulled out a seed cake, still warm. She pressed it into Marnie’s hands, then handed over a sack of buns. \"For the... club,\" she said.", "They sat on the bakery wall, the sun warming their faces. The cheese wheel was gone, consumed by Bunt in a single crunch. The socks remained on the road, a lavender trail leading away from the bakery.", "Toby sat with his knees pulled up to his chest. He looked at Marnie, then Lulu, then Bunt. \"That was...\" he started, then stopped. He adjusted his glasses. \"That was all of us.\"", "Marnie smiled. It was a small smile, but it reached her eyes. She didn’t need to say anything. She didn’t need to be perfect. She just needed to be there, with the cheese, the socks, the sneezes, and the boy who made things do the opposite of what they should.", "Behind them, at the top of the lane, a boy in a royal-blue blazer watched. He held a golden notebook. He did not smile. He wrote something down, then closed the book."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "The Golden Circle Comes to Tea", "part": "PART TWO: THE DROPOUT CLUB", "paras": ["*From the Dropout Club Handbook, Rule 8: Never invite a Golden Circle student to anything with a floor that can open.*", "The wind picked up, rattling the flowerpots on the shelf. It was a stiff, chilly breeze that made the dust dance in the air, but when the Potting Shed door creaked open, it did not touch the hair of the boy standing on the threshold.", "Cassius Pomeroy stood there, his golden hair slicked back so smoothly it looked like it had been poured from a mold. Behind him stood Dahlia, with her long braids of gold beads, and Rex, whose round glasses reflected the muddy yard. Their cloaks were trimmed in gold, not a single wrinkle visible, and their shoes were so shiny they could have been used to check for a spot on a face.", "Cassius looked around the shed. He sniffed, a tiny, precise motion that suggested the smell of wet earth and old manure was personally offending him.", "\"How cozy,\" he said, his voice smooth as polished stone. \"Like a hamster cage.\"", "He reached into his blazer pocket and pulled out a card. It was gold-edged and thick, heavier than a book. He held it out to Marnie with two fingers, as if it might be contagious.", "\"You are invited,\" he said, \"to watch the Founders' Day ceremony from the very back. Please do not bring anything that squeaks.\""], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["Marnie did not take the card. She kept her wand at her side, feeling the wood warm and solid against her palm while the wind rattled the broken pots behind her.", "Cassius’s gaze slid past her to Toby, who was attempting to look casual by leaning against a shelf of chipped terracotta.", "\"I hear your magic is... unique,\" Cassius said, smiling with his mouth but not his eyes. \"You say 'Light,' and it goes dark. How... irregular.\"", "Toby adjusted his gold-rimmed glasses, a precise, deliberate motion. \"It’s a matter of perspective.\"", "Then the golden eyes landed on Lulu, who sat on a crate with her knees pulled tight to her chest. A heap of lavender-scented socks spilled from her lap, a tangled mess of stripes and polka dots.", "\"A laundry,\" Cassius observed, tilting his head. \"How modern. Do they match?\"", "Lulu shrank into her orange hoodie. \"I’m so sorry, I didn’t mean to...\"", "\"Is he supposed to be indoors?\" Cassius interrupted, nodding at Bunt, who had been carefully balancing a shortbread biscuit on his massive grey-green nose. The troll stopped chewing.", "But it was when Cassius turned to Gerald that Marnie’s temper flared.", "\"And that,\" Cassius said, pointing a silver wand at the bird. \"That unfortunate hat. I assume you are trying to straighten it?\"", "Gerald opened his orange beak. He did not honk. He hissed, a loud, sizzling sound that shook the air like a kettle boiling over. Rex dropped his glasses. They clattered onto the floorboards. Cassius blinked, his perfect smile faltering for just a second."], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["Cassius straightened his blazer, refusing to acknowledge the fallen glasses or offer an apology. Instead, he reached into his other pocket and produced a notebook bound in gold leather, thick, heavy, and smelling faintly of cinnamon.", "\"Since you are invited to witness the Founders' Day,\" he said, snapping the cover open with a sharp crack, \"I shall explain the showpiece. My invention. The Perfectly Perfect Spell.\"", "He turned the page, revealing script that was tiny, elegant, and terrifyingly neat.", "\"It will make every last thing at Humbleton flawless,\" he explained, his voice rising with pride. \"No wobbles. No mistakes. No... irregularities.\" He looked at Marnie. \"It will last forever. The Principal has approved it as the centerpiece of the ceremony.\"", "Marnie watched his hand. For half a second, just a flicker, his fingers trembled. He looked at the shaking hand, then back at the group, and smiled so hard his cheeks hurt.", "\"Steady as a rock,\" he said. \"Precise as a clock.\"", "Toby watched the trembling hand, watched it stop, and watched Cassius close the book with a force that cracked the gold clasp.", "\"It is not a clock,\" Toby said quietly. \"It is a very large soap bubble.\""], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["Bunt sniffed.", "It was a small sound at first, a polite little noise that happens right before you scratch an itch, but Bunt’s nose was enormous, and the air in the shed was thick with the scent of wet soil, old manure, and Lulu’s lavender socks.", "\"Ah...\" Bunt started.", "Cassius frowned and turned around. \"What is it, you large...\"", "\"Ah... ah... AH-CHOO!\"", "The sneeze hit like a full-scale hurricane made of sneezes. It was a gale that swept across the shed, blowing dust into the corners and knocking over a stack of empty jars. It struck Cassius squarely in the chest.", "The golden shimmer in the notebook died. The light reflecting off the pages vanished. And then, for the first time in recorded history, Cassius Pomeroy’s hair flopped. It fell forward, covering his eyes, his nose, and his mouth. He looked, for a brief and terrible moment, like a child who had just lost a very bad fight with a hairbrush.", "Cassius shrieked. He grabbed Dahlia’s hand. Dahlia grabbed Rex’s sleeve.", "\"Out!\" Cassius shouted. \"Get out of this... this... shed!\"", "They bolted for the door. Rex, still blind without his glasses, stumbled into the doorframe. Cassius, in his shiny black shoes, lost his grip on the muddy ground.", "*Whoosh.*", "The entire Golden Circle slid down the muddy slope outside, a bright streak of gold and blue, until they hit the bottom with a thud and a shower of mud."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["When the dust settled, the shed was quiet, save for the ticking of the stove clock and the sound of Lulu picking up a lavender sock.", "Toby walked to the spot where a page had fallen, his polished shoes careful on the mud, and picked up the single page that had torn loose and flapped against the floorboards. He smoothed it flat with the precision of a surgeon, though his hands were trembling slightly.", "He read the last line, and his face went pale.", "\"It says...\" he whispered, adjusting his round gold glasses. \"It says it requires a balance.\"", "He looked up at the others. \"And then there is a word. It is scribbled out. He crossed it out.\"", "\"He crossed out the balance?\" Marnie asked, leaning closer.", "\"He crossed out everything,\" Lulu said softly, holding her sock up like a trophy. \"He made it perfect. But there is no perfect without... without the rest.\"", "\"We should tell the teachers,\" Toby said, his voice thin and reedy. \"Now. Immediately.\"", "\"They won’t listen to dropouts,\" Marnie said, and her voice was flat as a pancake left out in the rain.", "Toby looked at her. He looked at Lulu, who was still holding the sock. He looked at Bunt, who was still wiping his nose with a handkerchief the size of a beach towel.", "\"Then we’ll watch,\" Marnie said, crossing her arms. \"If something goes wrong...\"", "Toby straightened his red bow tie, the fabric crisp against his navy vest.", "\"We’ll know exactly who to blame,\" he said. \"And exactly what to do.\"", "He should not have said it. But he did. And for a moment, none of them smiled."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "A Bad Spell in the Right Place", "part": "PART TWO: THE DROPOUT CLUB", "paras": ["*From the Dropout Club Handbook, Rule 9: A bad spell is only a good spell in the wrong place.*", "The next week, Dimblewick discovered that dropouts were actually quite handy, provided you did not expect them to follow instructions.", "Bunt unclogged the village well by leaning his nose against the stone rim, sniffing deeply at the murky water, and then letting out a sneeze that blasted three hundred years of autumn leaves, a rusted bucket, and one very surprised duckling out of the hole and onto the cobblestones. The Mayor stood in her pink hat, watching the duckling quack indignantly, and decided not to ask questions.", "Toby started the town clock. It had been silent for a month, ticking backward in a confused manner. He stood before the great brass face, adjusted his glasses, and shouted, \"Stop!\" The clock shuddered, let out a long, relieved *tick*, and began to move forward with the confidence of a man who has just remembered his umbrella.", "Lulu padded the sagging roof of the bakery with her socks. One hundred and forty-two lavender, polka-dot, and striped socks, packed tight under the shingles. The rain stopped leaking. The baker cried.", "Marnie traded her accidental fish for a week of free jam. The cat owner was delighted. Marnie was suspicious."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["By Friday, the shed had a reputation.", "Lulu painted the sign herself. She used purple paint and a troll finger for the letters, because Bunt’s hand was the only thing large enough to hold the brush. \"THE DROPOUT CLUB,\" it read, in wobbly capital letters. Underneath, in smaller script: \"ODD JOBS & ODDMENTS (NO SPELLS GUARANTEED).\" She apologized to the paint three times. It did not help.", "The villagers began to leave gifts. A jar of pickles appeared on the step, smelling of vinegar and hope. A knitted hat, bright red with a yellow pompom, sat on the stove for Gerald. He ate it. He ate it with the dignity of a prince consuming a crown, and then honked at the empty space where his headgear had been.", "A blanket, thick and woolly, was draped over the crooked sofa. And then, tucked behind the stove, very small and very old, was a teapot. It was green, with a chip on the spout, and it looked like it had been waiting for this exact shed, for this exact moment, for three hundred years."], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["That night, the stars were out in a way that made the shed look less like a shed and more like a small, crooked star of its own, hanging in the dark.", "Marnie sat on the roof, her red sneakers dangling over the edge. Toby climbed up after her, his polished brown shoes squeaking on the shingles with every step. He sat down stiffly, keeping his back straight and his knees together, the way a student sits when the teacher isn't looking.", "\"I still want one real spell,\" Marnie said. She did not look at him. She looked at the moon, which seemed very far away and very judgmental. \"One that goes the way it should. So no teacher could ever say I can't.\"", "Toby took off his glasses. Without them, he looked younger, and a little softer. He wiped them on his shirt, a gesture so careful it seemed like a ritual, before putting them back on.", "\"I’d like to light one candle forward,\" he said quietly. \"Just once. Not backward. Just forward. So I could see your face in the flame, not just the dark where the light used to be.\"", "They sat in the silence, listening to the wind move through the leaves, which made a sound like a thousand small, shy whispers.", "\"We could be wrong about what wrong is,\" Toby said finally.", "Marnie did not answer. She was not ready to believe it. But she did not move away."], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["Gran Pennywhistle arrived with a broom under her arm and a pie in her apron pocket. She did not knock, but simply opened the door, which was propped open with a sock, and walked in as if she owned the place.", "She inspected the crooked sofa, poked the sock curtains, and sniffed the air, which smelled of lavender, woodsmoke, and goose.", "\"In forty years,\" she said, her voice warm as the pie, \"I have mended ten thousand brooms. This is the best-made hideout I have ever seen.\" She set the pie on the stove, where it was still warm.", "Marnie looked up. \"Gran, why does that broom wobble?\"", "Gran smiled, the kind that had seen a lot of wobbles and loved them all.", "\"The best broom is always the one with the little wobble,\" she said. \"It’s the only one that dances.\" She patted Marnie’s head. \"A stiff broom just drags. A wobbly broom flies.\""], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["The night before Founders’ Day, the shed settled into a quiet hum while the socks were folded and the stove was banked, leaving Gerald asleep with his purple ribbon tucked neatly under his wing.", "A piece of paper slid under the door without a rustle, lying there smooth and gold-edged like a slice of expensive butter.", "Marnie picked it up to find handwriting that was spidery and precise, the kind of scrawl that looks like it was done by a spider who had been to finishing school.", "\"Humbleton Academy cordially invites the Dropout Club to the Founders’ Day Ceremony, in the interest of public relations.\"", "They read it three times, with Bunt’s nose twitching while Lulu stopped fidgeting with her braid ribbon and Toby straightened his bow tie, his hands trembling just a little.", "\"He means he wants us where he can see us,\" Toby said.", "Lulu stood up and smoothed her orange hoodie, looking at the pile of socks before turning to the door.", "\"I’ll wear my good socks,\" she said."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "Founders' Day", "part": "PART TWO: THE DROPOUT CLUB", "paras": ["*From the Dropout Club Handbook, Rule 10: Sit at the back, near the exit, and close to the snacks.*", "The morning air at Humbleton smelled of lavender and polished brass. Bunting hung so low it brushed the noses of the early arrivals. A brass band played on a platform. They were playing three different tunes at once. It made everyone around them look slightly dizzy.", "The Dropout Club arrived together. They felt very small and very important. Toby wore his bow tie. He had polished it with a cloth until it shone like a wet river stone. Lulu had on her one matching pair of socks. It was a miracle she had been humming about since breakfast. Bunt had tied his giant red-spotted handkerchief over his nose. He looked less like a student and more like a very large, mossy outlaw.", "Marnie walked with her head high. Her heart was doing somersaults. Perched on top of her copper-red buns was Gerald. He sat there with his orange beak tucked into his feathers. He looked every inch the hat Marnie had accidentally made him. He looked dignified. He looked ready for a ceremony. He did not look like a goose, unless you knew him well. Marnie did."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["Principal Thistlewood stood on the stage, looking deeply uncomfortable. His tall purple hat was there, but it was far too small. It sat on his head like a lid on a saucepan, held in place by seven shiny silver pins that stuck out at odd angles.", "\"Precision above all!\" he announced, his voice booming. \"The art of magic is the art of never, ever being wrong!\"", "As he spoke, his moustache lifted off his lip. It hovered there for a second, twitching, before he quickly pressed it down with his finger. Marnie watched the movement and felt a strange prickling in her chest. It was not fear. It was the sharp, cold feeling of knowing you have broken a precious thing. She looked up at the hat. This was not the hat that had turned into a goose. This was the ordinary, stiff hat that had been there before.", "A flicker of guilt crossed her face, quick and quiet, like a shadow passing over a sunbeam. She looked away, focusing instead on the cake table behind him, where pastries were arranged in perfect rows of size. She tried to remember why she felt so bad about a piece of purple wool."], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["The Great Hall was packed with students in gold-trimmed cloaks. They sat in rows that were so straight you could have drawn a line through them with a ruler. Cassius Pomeroy was at the front. His hair was slicked back, his blazer was crisp, and he held a golden notebook in his hands like a sacred text.", "The Hall went silent. The silence was so heavy it felt like wool.", "In the back, near the exit, Bunt shifted his weight. He was rubbing his nose with one massive finger. A tiny itch was starting to crawl up his nostrils. He looked at Toby, his eyes wide and worried.", "Toby reached out and gently held Bunt’s arm. He did not say a word. He just squeezed, his grip firm and steady.", "\"Not yet,\" Toby whispered, his eyes fixed on the stage. He knew what was coming. He could feel the air in the room growing thick and perfect, a stillness that demanded attention. Bunt stopped rubbing his nose. He took a deep breath through his mouth, trying to keep the sneeze at bay."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["Cassius stepped forward. He raised his silver wand, and for a moment, the only sound was the tick of the clock on the wall.", "\"Perfectus Universalis,\" he said.", "A wave of gold glitter swept through the Hall. It moved like a slow, shimmering tide. Where it touched, things changed. The bunting straightened itself until it was taut and level. The brass band, which had been playing three different tunes, suddenly fell into perfect, synchronized harmony. Crumbs vanished from the floor. Every shoelace in the room tied itself into a neat, double bow.", "The crowd gasped, then erupted in applause. It was the most beautiful thing they had ever seen. The Principal’s moustache rose again, this time staying up, curling into a perfect question mark of delight.", "Marnie stood in the back, watching the glitter dance. She should have felt proud. She should have felt part of it. But as the gold light bathed her face, she felt a strange vibration in her bones, a hum that was not quite music and not quite sound."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["But the wave did not stop. It lingered in the air, a thick, golden mist that settled over the heads of the students. Then, with a soft *bong*, like a spoon striking a silver bell, something strange happened.", "Little pointed red hats popped onto every head in the Hall.", "Marnie blinked. She looked at where the Principal had been standing. There was no tall, thin man in a purple robe. Instead, there was a two-foot-tall figure with a long white beard, a bright blue jacket, and a fixed, cheerful smile painted on its face. It looked up at her with wide, surprised eyes.", "He had become, quite perfectly, a garden gnome.", "Marnie looked around. Every student, every teacher, every person who had been touched by that perfect gold light was now a small, smiling statue of clay. The only things that remained real were the four of them, standing in the back, looking very, very ordinary."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "Perfectly Gnomed", "part": "PART THREE: THE GREAT GNOMING", "paras": ["*From the Dropout Club Handbook, Rule 11: If everyone suddenly turns into a gnome, stay calm and take notes.*", "The Great Hall was silent, except for the sound of hundreds of tiny feet waddling. The students sat in neat rows, their bright blue jackets shiny, their red hats perfectly straight. They were all smiling. Every single one of them had the same cheerful, painted smile, fixed in place as if they had just won a prize they didn’t understand. A tray of tiny cakes slid off the hand of the Head Boy, shattering into a glittering pile of crumbs.", "In the front row, a very short figure with a brass hat that covered his entire head was trying to lift his tuba, which was now the size of a dinner plate. He looked confused. He looked happy. He looked exactly like a garden gnome that had wandered into a music lesson.", "Marnie stared. She looked at Toby, who was pushing up his glasses with one finger. Lulu was tugging at her sleeve, looking terrified. Bunt stood in the doorway, his enormous boots taking up half the floor, and he sniffed the air. His nose twitched.", "Gerald, the goose, landed on the stage. He honked once, a loud, satisfied sound, and settled his purple ribbon. He seemed to think this was the best day of his life."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["Toby pulled a small notebook from his pocket. He wrote down: *Observation 1: They are alive. Observation 2: They cannot cast spells.* He tested this by waving his wand at a gnome. Nothing happened. The gnome did not even blink. It just smiled its fixed smile and waddled a step to the left.", "Cassius Pomeroy was on the stage. He was no taller than a teacup. His golden hair stuck out from under his red pointed hat like a stiff brush. He held his silver wand, but it was so long it looked like a pike. He stared at it with an expression of pure, unadulterated horror.", "\"How?\" he squeaked. His voice was very small. \"I am perfect.\"", "Marnie flinched at the word. It sounded like a crack in a plate. Cassius looked at his hands, then at his wand, then at the sky. He tried to cast a spell. A small puff of air came out. He went pale. His lower lip began to tremble. He looked ready to cry, but he had no tears.", "Toby wrote: *Observation 3: Cassius is upset. This is irregular.*"], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["\"Fix it,\" the Principal-gnome squeaked. He was standing on a stack of tiny chairs. His moustache was standing straight up, defying gravity, like two stiff whiskers. \"This is highly irregular. I demand a solution. Immediately.\"", "Marnie took a step forward. Her heart was beating in her throat. She raised her wand, her hand shaking. \"Straighten!\" she whispered.", "There was a puff of grey smoke. The Principal’s wand, which he had been holding stiffly, turned into a sausage. A very good-looking sausage. It fell to the floor with a soft *thud*. The Principal-gnome stared at it. His painted smile did not change.", "Toby stepped in. \"Backwards, Gnome!\" he said.", "For one second, the Principal-gnome grew two inches tall. Then, with a pop, he shrank back down. He looked at Toby with wide, surprised eyes. It was the first real expression anyone had seen on a gnome face."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["Suddenly, a flying carpet zoomed through the windows, trailing silk ribbons that whipped around the chandeliers. Two men in grey suits landed on the stage, looking like accountants who had wandered into a very colorful dream. They scanned the room with cold, sharp eyes, checking for anything out of place.", "\"A minor incident,\" one said, raising his wand with a snap. \"Restore!\"", "The spell hit the air, clean and precise, exactly right. A wave of gold glitter rippled out from his wand, catching the dust motes before they could settle. It struck the second inspector before he could blink.", "The second man froze. A red hat popped onto his head, fitting as snugly as a lid on a jar. He became a gnome, complete with a bright blue jacket and a smile that looked painted on.", "The first inspector looked at his hands, then at his friend, and finally up at the ceiling. His mouth opened, but no sound came out. He tried to cast another spell, but the air shimmered, and a red hat popped onto his head too.", "Toby’s pencil stopped moving. He watched the two new gnomes waddle in place, their little feet clicking on the wooden stage. \"It feeds on perfection,\" he said quietly. \"The more perfect the spell, the more it spreads.\""], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["A huge golden clock appeared on the wall of the Great Hall. It had no numbers, only a single hand that began to move, slowly, toward the top. The face of the clock ticked with a sound like a heavy drop of honey falling.", "Seventy-two hours. That was how long they had before the gnomes became permanent. Before the school, the village, perhaps the whole world, became a garden of smiling, blue-jacketed statues.", "The golden wave was spreading out the doors now, rolling across the lawn like a slow tide of light. It touched the stone steps, and the stones shimmered. It touched the hedge, and the leaves turned bright, perfect green.", "Marnie felt very small. She looked at the clock, then at the gnomes, then at her friends. Her voice was very quiet. \"We need a plan.\"", "Toby closed his notebook. He looked at Bunt, who was reaching for a biscuit tin that was the size of a bathtub. \"We need a great deal of biscuits,\" Toby said.", "Bunt did not answer. He was already pouring tea from a kettle that had appeared out of nowhere. He looked, for the first time, very calm."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "Gnomes Are Terrible at Taking Orders", "part": "PART THREE: THE GREAT GNOMING", "paras": ["*From the Dropout Club Handbook, Rule 12: Gnomes are terrible at taking orders.*", "Bunt’s vest pockets were the size of small rooms, and he filled them with dignity. He walked across the Great Hall in slow, creaking steps, his barrel-boots thumping against the marble. Inside his left pocket, two fishmongers argued about the draft. Inside his right, a vice-principal demanded a chair. In the back, a choir section hummed a low, annoyed note.", "\"Gnome Relocation Services,\" Bunt announced softly, his voice like a boulder rolling under a rug. \"Please remain seated. Or standing, if you prefer. Or hovering, though I suspect that is difficult for clay.\"", "A gnome in a blue jacket popped his head out. \"It is draughty!\" he squeaked.", "\"I am sorry,\" Bunt said, reaching into his pocket with a hand the size of a dinner plate. \"I will adjust the airflow.\" He did not know how to adjust the airflow. He simply pinched his nose and blew gently, which made the gnomes cough.", "Marnie watched him go. It was absurd. It was also the only thing that was working."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["The Potting Shed smelled of lavender and old wood. Lulu had built a nest of socks in the corner, hundreds of them, mismatched and soft, piled into a warm mountain for the gnomes to sleep in. The Principal-gnome sat on a flowerpot, his white beard stiff with dust. He looked furious, though he was only two feet tall.", "\"Tea,\" he squeaked. \"Now. And where is my hat?\"", "Marnie blinked. The goose was sitting on the Principal’s head. He had not moved since they arrived. He looked as if the small, round head was a very good place to sit, and he was not going to leave.", "Cassius-gnome stood apart from the group, his golden hair still perfect despite the chaos. He folded his arms. He refused to look at any of them. He simply stared at the wall, his painted smile fixed, his tiny body rigid with the effort of not screaming.", "Lulu offered him a sock. He slapped it away."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["Marnie had to get the notebook. She could feel the hex humming in the floorboards, a low vibration like a plucked string that hadn’t finished ringing. The Great Hall was empty now, except for the shimmer. The gold glitter wave had passed, leaving the floor bright and shiny and utterly, terrifyingly correct.", "She walked backwards. Toby had taught her that. If you walked forward, your feet might accidentally cast a \"Step\" spell, and if it worked, you would be gnomed on the spot. Walking backwards, she was just a girl in red sneakers, clumsy and slow.", "Gerald stood in the doorway. He did not honk. He did not steal a pencil. He just watched her with one orange eye, as if he knew exactly what she was doing and was waiting to see if she would be brave enough to finish it.", "She reached the stage. The notebook was there, golden and gleaming."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["The notebook’s last pages were scorched, the edges black and brittle. Marnie stood very still, though she knew breathing was safe. It was the magic that was the enemy. She turned the page, and a cloud of gold dust puffed out, drifting toward her face.", "\"Ah... ah... AH-CHOO!\"", "Bunt’s sneeze hit the dust like a hurricane. It blew the glitter clean off the page, settling it into his red-spotted handkerchief. The words were clear now. Cassius’s handwriting was tiny and precise, the way he cut his sandwiches.", "*The Perfectly Perfect Spell requires a Balance Anchor: use the Founder's Hat, see Principal.*", "And in the margin, in smaller, shakier letters: *Principal says replacement hat is fine?? It is NOT enchanted!*", "Toby read it once. Then he read it again, his lips moving silently. His glasses fogged up. He looked at Marnie, and for the first time, his face was not dry or calm. It was scared."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["\"What happened to the Principal's old hat?\" Toby asked, his voice thin and quiet, like a pencil snapping in a silent library.", "The silence that followed was heavy, the sort that sits on your chest when you know you have forgotten your homework and the teacher is about to turn around. Marnie stopped breathing for a second, then started again, her hands trembling in her lap like a deck of cards in a strong wind.", "Lulu watched her, her head tilted to one side, the pink ribbon at the end of her braid swinging gently against her orange hoodie. She did not ask. She just waited, her eyes wide and patient, offering the kind of quiet support that felt safer than words.", "Bunt, meanwhile, was staring at Gerald with the intense focus of someone watching a very dangerous insect. Gerald, completely unaware of the gravity of the situation, sneezed with a violent *honk* and snatched a polka-dot sock from Lulu’s pile, tucking it under his wing with the pride of a squirrel burying an acorn.", "Marnie closed her eyes, counting to three in her head. She opened them.", "\"I turned it into a goose.\""], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "The Rules of the Hex", "part": "PART THREE: THE GREAT GNOMING", "paras": ["*From the Dropout Club Handbook, Rule 13: Test your theory on something that can't sue you.*", "Toby unrolled a piece of parchment on the wobbly flowerpot table, where he had drawn a
