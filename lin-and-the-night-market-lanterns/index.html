the paper.", "Mr. Tsai, in his cardigan, handed me a small bundle of spices. \"For the light,\" he said. \"So the air smells like home.\""], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["Ms. Wu handed out small tags of red paper and string. \"Write a wish,\" she said. \"Something you hope for. Tie it to the string.\"", "I pulled a tag from my pocket. It was the one I had used to write the temple keeper’s message. My pencil felt heavy. I thought about Ama’s wrist. I thought about the shame I had felt. I thought about the smell of star anise that was not a smell, but a feeling.", "I wrote: I want to be proud, out loud.", "I walked to the end of the lane, where the temple tree stood. Its branches were heavy with other wishes, fluttering in the cold wind. I tied my tag to a low branch. It sat there, bright red against the dark leaves.", "It did not feel like a secret anymore. It felt like a promise.", "I turned back to the lane. The lights were starting to glow, casting long, warm shadows. The lane was no longer empty. It was full of light."], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["Yi-Chen was packing her bag, her pink vest now covered in specks of white paper and glue. She looked at the lanterns, then at me.", "\"Can I help?\" she asked. \"With the stall?\"", "I looked at her. She had been so careful, so precise. I had been so messy, so loud.", "\"Can you carry bowls?\" I asked.", "\"I have never carried a bowl in my life,\" she said.", "I brought a bowl from the counter. It was hot, filled with the clear broth Ama had made that afternoon. I placed it in her hands.", "She held it with both hands, like it was made of glass. Like it was a treasure. She did not spill a drop. She looked at me, and her eyes were bright.", "\"Okay,\" I said. \"Let’s go.\"", "We walked toward the stall, the lanterns glowing above us, the lane humming with the sound of a hundred small lights."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "Nine Broths", "part": "PART FOUR: LANTERN NIGHT", "paras": ["*Ama's Stall Ledger, Night 58. Bowls sold: 33. Broths tested: 9. Broths thrown out: 8.*", "We needed one more thing. The lane was full of noise and light, but one friend still stood outside, holding her nose politely. Hui-Ting could not eat here. Her grandmother was Buddhist, and on the fifteenth of the lunar month, and often other days, she ate only vegetables. No meat, no fish, no garlic, no onion, no scallion.", "Ama sat on a plastic stool, her wrist in a white brace. She looked at the empty corner of the stall where the small gas burner lived.", "\"Go on, then,\" she said. She did not offer advice or help. She just looked at me, and then she said the words she always said, but this time they felt like permission. \"Taste first. Talk later.\"", "I filled a small aluminum pot with water. I dropped in dried shiitake mushrooms, a dark strip of kelp, and a chunk of white daikon. I turned the flame to low. The water began to bubble, just barely, like a secret being told very quietly.", "Two hours passed. The lane got louder. The steam got thicker. I was ready to taste."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["Broth one was thin. It had the texture of weak tea and tasted like water that had completely forgotten it was supposed to be soup. I poured it down the drain.", "Broth two was worse. I had boiled the kelp too hard, and now the liquid tasted exactly like the ocean, specifically like a fish had been napping in the sink. That went out, too.", "Broth three was a disaster. It tasted like a swamp. I do not have a better word for it. It was muddy, brown, and deeply sad.", "Ama tasted each one. She did not make a face. She just nodded.", "\"Almost,\" she said.", "I wanted to groan. Then I wanted to hug her. \"Almost\" is a good word. It means you are not done. It means you are right on the edge.", "My fingers were stained brown from the mushrooms I was slicing. My hair smelled like a soup pot. I sniffed my sleeve and exhaled slowly. I did not care. I was not scrubbing my hair three times a day. Not anymore."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["Hui-Ting came over to taste, because she is honest to the bone. She took a sip of broth six and frowned immediately. \"Too sweet,\" she said before I could even ask. For broth seven, she shrugged her shoulders and picked at the loose end of her braid. \"Weird,\" she announced.", "I looked at Jun. He was carrying trays of empty bowls, his spiky hair damp with sweat, and he leaned in with a spoon to try broth eight. He made a short, sharp sound, like a squeaky toy getting stuck in a zipper.", "\"This is the worst soup in the history of soup,\" he declared.", "I laughed until my stomach hurt. I had to sit down on a plastic stool, which wobbled dangerously under my weight, and I nearly toppled over into the drain. Ama poked my shoulder with her braced hand.", "\"Laughing?\" she asked.", "\"Just a little,\" I wheezed.", "\"It is not a little,\" she said firmly. \"It is a lot.\""], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["I stopped and set the spoon down, suddenly remembering Mr. Tsai’s abacus. He had told me the blend was like an orchestra, where you do not just add more instruments, but find the one that is missing.", "What was missing? It was not salt or sugar. It was something round, dark, and slow.", "I scanned the vegetables until my eyes landed on two ripe tomatoes and a cob of corn. Holding them over the flame, I let the skins char until they turned black, sweet, and smoky. Then I peeled them and dropped them into the pot.", "Next, I reached into the wooden box for Ama’s eight-spice pouch. I remembered the rule for Hui-Ting: no onion, no garlic, and no scallion. Just star anise, cinnamon, and the others.", "I dropped the pouch in, and the smell changed immediately. It was deep, warm, and grounded. It smelled like home, but different, like a new kind of home.", "I waited while the water bubbled again. This time, it sounded different. It sounded like it was thinking."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["Broth nine.", "Ama took the spoon, but she did not eat. Instead, she closed her eyes and let the steam hit her face. The lane was quiet except for the water bubbling and Uncle Feng laughing far down the row. She held a single curl of tangerine peel in her hand, and when she finally opened her eyes, she dropped it into the pot.", "She handed the spoon back to me.", "I passed it to Hui-Ting. She took a sip and stopped chewing. Her eyebrows shot up, and her mouth hung open a little.", "\"It tastes like your stall,\" she whispered.", "I looked at my notebook and started writing. Dried shiitake, kelp, and daikon. Charred tomato, corn, and the pouch. Then, in the margin next to the numbers, I added a small note: (or whatever the weather wants).", "Holding the pen, I felt a warmth in my chest that had nothing to do with the soup."], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "The Night Before", "part": "PART FOUR: LANTERN NIGHT", "paras": ["*Ama's Stall Ledger, Night 60. Bowls sold: 40. Days until the review: 2. Wrist brace: off.*", "Two days before the Lantern Festival, the lane looked less like a market and more like a construction site. Uncle Feng was building a ladder out of bamboo poles, shouting at the joints to hold steady. Auntie Ping sat on an overturned crate, painting paper lanterns in bright rainbow colors. Her glittery nails clicked against the paper, and she complained about the blue paint being too blue. Old Mr. Gao’s grandchildren were tying little tags to the strings, arguing about whose knot was tighter.", "I was wiping the tables, because someone had to keep the ground clean. Then I heard the rumble of a truck backing into the lane. It was Ba. He climbed down, his boots muddy, and pushed a cart loaded with long, straight bamboo poles.", "\"I took the long way round,\" Ba said, breathing hard. \"I wanted to be sure they were straight.\"", "He looked at the ladder Uncle Feng was building, then at me.", "\"That is a lot of bamboo,\" I said.", "Ba shrugged. \"It is for the lane.\" He looked at the string of lights and the empty spots where the big lanterns would hang. \"We need them to be perfect.\""], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["The clinic room smelled of soap and waiting. The doctor removed the brace from Ama’s wrist, and she held her hand up in the air. It shook a little, stiff as a door hinge that hasn't been oiled in a month, but it was still her hand. She curled her fingers one by one, then opened them wide, checking the mechanism of her own body.", "Walking back to the stall, Ama stopped in front of the great pot. It sat on the stove, heavy and full of brown broth. She looked at the pot, then at me.", "\"You lift it,\" she said.", "It was a test, and it was also a gift. I stepped forward and slid my arms under the handles. My knees bent. The pot was heavier than I remembered, wobbling like a bowl of soup that had been turned too quickly. Ba stepped in behind me, his big hands hovering near my elbows, ready to catch it if it slipped.", "We lifted. We set it down on the bench with a dull, solid thud.", "Ama laughed. It was a small sound, but it was loud in the steam. It sounded like a kettle finding its voice after a long, quiet afternoon.", "\"Good,\" she said. \"The wrist is okay. The memory is okay.\""], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["That night, we sat on the plastic stools with the two pots between us. One was Ama’s classic beef broth. The other was my Lantern Broth, with its dried shiitake and charred tomato.", "Ama showed me how to skim the foam. She used the old brass ladle, the one with the dent from her mother’s era. She moved in small, careful circles. I watched. Then I took the ladle and did the same in my pot.", "I showed Ama how I roasted the corn. I used a small pan and a lot of patience. She watched the kernels pop and turn golden. She did not speak. I did not speak. The steam rose around us, mixing the beef and the vegetable smells into one thick, warm cloud.", "It felt like an old song. Not a new one. Not a complicated one. Just a song we both knew, but had never sung together this way before.", "\"Good,\" Ama said, finally. She pointed to the foam in my pot. \"One more circle.\"", "I did one more circle. The broth looked clear. The broth looked ready."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["In the afternoon, Ms. Xu walked down the lane in sensible shoes, a notebook tucked under her arm. Her face was serious but not unkind, and she stopped at every stall to ask about permits, fire extinguishers, and drainage.", "She did not eat anything. She did not even smell the oyster omelets or the beef noodles. She just wrote, her pen moving across the page with a steady scratch.", "Uncle Feng whispered to me, \"She is going to close us.\"", "Auntie Ping whispered back, \"No, she isn't.\"", "Neither of them believed their own whisper. I watched Ms. Xu take a business card from her bag and leave it on the counter of Mr. Tsai’s spice shop. He nodded to her, and she walked toward the temple.", "The lane was quiet. The lanterns were still unlit, hanging like empty eyes. We all stood there, holding our bowls and our ladles, waiting for her to turn the corner."], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["The forecast said rain, which meant the market's smell would wash away and every plastic stool would turn as slippery as a wet eraser on a school desk. Hui-Ting and I sat on the stone steps of the small temple at the end of the lane, our backs against the cold brick. The unlit lanterns hung above us, heavy and dark, swaying in the damp air.", "Hui-Ting's braids were tied back neatly, and she tilted her head to look at the paper circles with her soft, quiet eyes. \"My grandmother says a lantern is a wish you can see,\" she said.", "I watched the unlit shapes shift in the wind. \"I am scared of hoping too loudly,\" I said. \"What if it doesn't work?\"", "Hui-Ting turned to me and put her hand over mine on the wet stone step. Her fingers were warm from the tea she brought earlier, a small comfort against the chill. \"Then hope in a small voice,\" she said. \"The lantern will do the rest.\"", "I looked up. The wind picked up, pushing the paper lanterns gently against one another until they bumped and swayed. Even in the dark, they held a faint, waiting light, like a phone screen glowing under a blanket."], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "Rain", "part": "PART FOUR: LANTERN NIGHT", "paras": ["*Ama's Stall Ledger, Night 61. Bowls sold: 0 (rain). Umbrellas borrowed: 63. Lanterns saved: all but one.*", "The rain did not arrive. It crashed. By four o'clock, the gutters were running brown with silt and the sound was a solid wall of noise that swallowed every other sound in the lane. I stood in the middle of the wet asphalt, holding Jun's half-melted rooster lantern. The paper was soft and heavy in my hands, the red paint running down the wire frame in long, ugly streaks. It looked less like a bird and more like a sad, wet leaf caught in a drain.", "Around me, the strings of lanterns sagged. The rain hammered against the paper, turning the bright colors into muddy smears. I took a step forward, then back. The water in my boots was cold and deep. I looked up at the dark sky, waiting for it to stop, but the clouds only grew heavier. The air smelled of wet dust and fear. I was alone with a melting bird and a sky that did not care."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["Ama did not shout. She did not panic. She simply walked to the edge of her stall and began pulling the heavy canvas tarp down over the tables. Her movements were quick and sure, despite the rain soaking through her floral vest. Then she turned to the sky, looked at the hanging lanterns, and started climbing the small ladder by the pot.", "Uncle Feng saw her. He bellowed for ladders, his voice cutting through the rain like a knife. Auntie Ping was already on her phone, talking fast, coordinating umbrellas from every stall. Jun, Yi-Chen, and Hui-Ting ran out from the arcade, splashing into the lane. We formed a line. Jun held the first lantern, passing it to Yi-Chen, who passed it to Hui-Ting, who passed it to me. It was a chain of hands in the rain, moving fast, keeping the light dry."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["For three hours, the lane turned into a wet, muddy river of people. Shop owners and school kids worked side by side, passing lanterns from hand to hand. Yi-Chen’s mother arrived in a clean coat, holding a tray of towels that looked like they had never seen dirt. Even Jun’s father came, still wearing his white Sky Mall apron. His face was serious. He was taking this very seriously.", "Ama stood at the end of the line, near the temple. She wore her plastic sandals, and the rain swirled around her ankles. A bright yellow lantern was passed down to her. She held it gently, checking the wires with her damp hands. Then she looked at me. Across the rain. Across the wet lane.", "She smiled. It was a small smile, but it was there.", "I felt the knot in my chest loosen, just a little. She passed the lantern to the next person, and the line kept moving."], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["By eight o'clock, the rain had thinned into a fine mist. The lane was quiet, except for the dripping water and the soft hum of the electric heaters. Sixty-three umbrellas were leaned against the temple wall, a colorful pile of red and blue and yellow plastic.", "We gathered in the dry space of Mr. Tsai’s shop. The air smelled of old wood and dried spices. Jun held up his rooster lantern. It had melted into a mild abstract shape, the red and yellow mixed into a single, blurry blob. He looked at it, then at the group.", "\"It looks better this way,\" he said, shrugging.", "Nobody argued. Hui-Ting nodded. Yi-Chen laughed. I picked up my own lantern, which had come through the storm intact, and held it next to Jun's. It was strange, and it was perfect."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["I went home with wet hair plastered to my forehead and a drip running down the back of my neck. The apartment was warm, but I could not sleep. I lay on the balcony, looking out at the dark lane. The air smelled of wet stone and star anise.", "I held the old brass ladle. It was dented and heavy, Ama’s mother’s ladle. I had been afraid today, but the fear was gone. Tomorrow, the stranger would come. I would serve two bowls of soup. One would be Ama’s, the classic, the river that had flowed for forty years. The other would be mine, the one I had learned to make. Both were real. Both were mine. I closed my eyes and listened to the last drops of rain hitting the pavement."], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "Lantern Night", "part": "PART FOUR: LANTERN NIGHT", "paras": ["*Ama's Stall Ledger, Night 62. Lantern Festival. Bowls sold: I lost count. Weather: lanterns.*", "The clouds snapped open right as the sun hit the horizon. It was not a slow fade. It was a blink. One moment the lane was gray and quiet, the next it was alive with light.", "Hundreds of lanterns blinked on, red and gold, hanging in long rivers over the stalls. Some were round, some were shaped like roosters with painted combs. Riddles were pinned to strings of beads, swaying in the warm air. The smell hit me all at once: tangyuan, oyster omelets, burnt sugar, and the deep brown scent of star anise.", "I had lived here my whole life. I knew every stall, every step, every crack in the pavement. But standing there, looking up at the glowing shapes, I felt like I was seeing it for the first time. It was a river of light, and we were standing in the middle of it.", "A group of children from school ran past, stamp cards in hand, shouting as they chased each other toward the temple. The air was thick and sweet. My apron felt tight. I took a breath. It smelled like home."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["The crowd did not arrive all at once. It trickled in, then rushed. Families from the new mall, tourists with cameras, old friends, whole classes. The lane buzzed with voices and the clatter of plastic stools.", "At stall nineteen, the line curled around the corner. Ama stood at the pot in her floral vest, her silver curls neat, her towel over one shoulder. She did not look surprised. She looked ready.", "I ladled beside her. My hands shook, just a little. Yi-Chen carried bowls with steady hands. Jun ran trays, his spiky hair bouncing. Hui-Ting and her grandmother took the first table. They ordered two bowls of my Lantern Broth.", "I watched Hui-Ting’s face as the steam rose. She closed her eyes. My stomach did a nervous flip, the kind that happens before a pop quiz. If she hated it, I would have to hide in the bathroom. But she opened her eyes and smiled.", "\"Taste first,\" she said, softly. \"Talk later.\""], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["At eight o'clock, Ms. Xu arrived, wearing sensible shoes and a neat coat that looked like it had been ironed by a very serious person. She walked slowly down the lane, pausing to look at the swaying lanterns, the ring-toss games, and the faces of the people eating. Finally, she stopped at our stall, where the air was thick with the smell of ginger and roasted tomato.", "She did not order immediately. Instead, she stood still and watched Ama work, then watched me wipe down the tables, and finally watched the steam rise from the pot in slow, lazy curls. Only then did she sit down at table two, placing her notebook neatly on the surface.", "I brought her two bowls. One was Ama’s classic beef noodle soup, rich and dark like a deep pot of ink. The other was my Lantern Broth, clear and golden, filled with shiitake mushrooms and daikon. Ms. Xu tasted the first one, closing her eyes for a brief moment as if she were solving a difficult math problem. Then she tasted the second.", "\"They are not the same,\" she said.", "\"No,\" I replied. \"They are family.\"", "She looked at me, then at Ama. She did not smile, but her eyes were soft, like the light from a paper lantern in a dark room. She took a third sip of the broth and waited."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["Ms. Xu asked who had taught me. I thought for a second, my mind drifting to the notebook, the measuring spoons, and the failed broths. Then I remembered the river.", "\"Me,\" I said. \"And Mr. Tsai. And a river.\"", "Ms. Xu smiled. It was a small smile, but it reached her eyes. She opened her notebook and wrote something down. I could not see what it said, but she wrote it carefully, then closed the book.", "When she stood up, she did not leave. She turned to Ama, across the steam, and bowed a little. It was a small bow, respectful and warm. Then she said she would have a third bowl.", "Ama nodded. She did not speak. She just ladled.", "I felt a warm feeling spread through my chest, like hot broth. I had been afraid this would be the end. But it felt like the beginning."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["The night was almost over, and the crowd had thinned until the lane felt more like a long hallway than a market. The lanterns still glowed, but the wind had picked up, pushing the paper shades gently to one side.", "Ama took the old brass ladle from my hand. It was dented and heavy, the kind of weight that makes your arm ache, and it belonged to her mother. She held it out to me, palm up, waiting. For the first time in forty years, she stepped back from the pot.", "I ladled the last bowl of the night. It was Ama’s classic, with a curl of tangerine peel floating on top like a little orange boat. I handed it to her.", "\"Chia̍h-pá-buē?\" I said.", "Ama laughed. It was a bright, happy sound, the kind that makes you want to smile back even if you are tired. \"Not yet,\" she said. \"I was waiting for you to ask.\"", "She ate it standing at her own stall, as if it were the first bowl she had ever tasted. I watched her face, then looked at the empty pot. The steam rose, then faded. It was not the end. It was just the next step."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "Night Sixty-Three", "part": "PART FOUR: LANTERN NIGHT", "paras": ["*Ama's Stall Ledger, Night 63. Bowls sold: 90. Lane: kept (for now). Ama's mood: (she told me to write \"proud\"; I wrote it myself).*", "The morning after the Lantern Festival, the lane looked like a giant had sneezed. Red paper scraps clung to the wet pavement. The lanterns drooped, their strings limp and heavy with rain. A stray dog sniffed a discarded balloon and yawned, showing teeth that looked like tiny white buttons. The air smelled of burnt sugar and cold smoke, a sticky, sweet haze that clung to the nose.", "We were all standing in the middle of the aisle, still wearing our aprons. Uncle Feng was scratching his back. Auntie Ping was peeling a piece of tape off her glittery nail. I stood between them, watching the market association’s office at the far end.", "At noon, a letter arrived. It was thick, cream-colored, and smelled of office ink. The chairman read it once, then twice. He did not say a word. He just held it up.", "The crowd leaned in. Uncle Feng’s elbow accidentally bumped my shoulder. I didn’t move. I was waiting. The silence was loud, like the hum of the tea machine before it clicks on. I could hear my own heart beating in my ears, a steady, thumping drum against the quiet."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["\"Kept,\" the chairman said. \"For a year. On trial.\"", "A cheer went up, though it was quiet and surprised. Then he read further. \"The city invites the cooks to record their recipes for the heritage archive. In whatever way suits them.\"", "Uncle Feng roared, a loud, booming sound that made the nearest lantern string shake. A single red lantern popped off its wire and tumbled to the ground with a soft thud, but he did not care. He was laughing, his round face bright red and his hands slapping together.", "\"Whatever way suits them,\" he repeated, nodding at me. \"That means you can write it down, Lin. Or you can taste it until it’s right. Your call.\"", "I looked at Ama. She was smiling, but her eyes were sharp. She tapped the ground with her plastic sandal. \"Taste first,\" she said softly. \"Talk later. But now, we can talk.\"", "The lane felt lighter. The tension of the last sixty nights seemed to lift, like a heavy blanket finally taken off a bed. We were still here, and the pot was still hot."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["Auntie Ping clapped her hands so hard her glittery nails clicked. \"I am taking the Sky Mall booth on weekday afternoons,\" she announced, looking very serious. \"And I keep the tea stall at night. Both. A person can have both.\"", "Mr. Tsai, who had been silent, stepped forward holding a small, plain lantern. He hung it in the window of his empty spice shop, and the glass began to shine in the dark.", "\"Lin,\" he said, his voice slow and careful. \"I am retiring. But I am not gone. We will roast the spices together in the back of Stall 19, every month. I will sit in the boss chair. I will supervise. It is a very good chair.\"", "I felt a sudden, warm pressure in my chest, like holding a hot cup of tea for too long. Then I heard a voice from the back of the crowd. It was Jun’s father, standing near the shrimp pond and looking very shy.", "\"Uncle Feng,\" he said. \"Is there room... at the end of the lane? For a fried-chicken cart?\"", "Uncle Feng stopped laughing and looked at Jun, then at his father, his face softening into a big, kind smile.", "\"I thought you would never ask,\" he said."], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["Later, the crowd thinned. Ama and I sat on our plastic stools, counting the takings. The coins clinked, a small, bright music. Ama’s wrist was bare now, and she turned it with ease.", "\"I am going to teach you Hokkien,\" she said. \"One word a night. You will write it in the ledger.\"", "I looked at the red notebook. It was full. Every page was dense with numbers and weather notes. \"Ama,\" I said. \"There is only one column left. And it’s for the bowls sold.\"", "Ama looked at me, then at the notebook. She shrugged, a small, decisive movement. \"Then make a new one.\"", "I took my pencil. I used a ruler to draw a straight line down the right side of the page. It felt wrong, and right, all at once. I wrote at the top of the new column, in my best handwriting: *A word a night.*", "Ama nodded. \"Good,\" she said. \"Now, the first word. *Chia̍h-pá-buē?*\"", "I wrote it down. The ink glistened for a second, then dried. It was a small mark, but it felt heavy with meaning. It was the beginning of a conversation that had lasted forty years, and would last for many more."], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["That evening, the lane was quiet. The lanterns were off, but the memory of their light remained. I sat at the stall table, the red notebook open before me. I wrote the final line of the season.", "*Night 63. Bowls sold: 90. Lane: kept (for now).*", "I paused. My pencil hovered over the line for *Ama’s mood*. I wrote: *proud.*", "Then, in smaller letters, I added a line no one had ever seen before. *Lin’s mood: the same.*", "I closed the notebook. The rubber band snapped shut with a soft click. I leaned back in my chair. My hair was still damp from the rain, and it smelled of star anise and ginger. I lifted my sleeve and sniffed it.", "The scent was warm, deep, and familiar. It was not a smell to hide. It was not a mistake. It was home. I smiled, and I did not worry about the next night. I was ready for the next word."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "Eighty-Four Bowls", "part": "PART ONE: STEAM", "page": 1}, {"n": 2, "title": "The Girl Who Smelled Like Soup", "part": "PART ONE: STEAM", "page": 6}, {"n": 3, "title": "A Handful", "part": "PART ONE: STEAM", "page": 11}, {"n": 4, "title": "The Wrist", "part": "PART ONE: STEAM", "page": 16}, {"n": 5, "title": "The Boss Chair", "part": "PART ONE: STEAM", "page": 21}, {"n": 6, "title": "The Recipe Project", "part": "PART TWO: SIMMER", "page": 26}, {"n": 7, "title": "Hui-Ting Can't Eat Here", "part": "PART TWO: SIMMER", "page": 31}, {"n": 8, "title": "Shrimp, Rings and Balloons", "part": "PART TWO: SIMMER", "page": 36}, {"n": 9, "title": "The Reunion Dinner", "part": "PART TWO: SIMMER", "page": 41}, {"n": 10, "title": "The Man Who Made the Pouch", "part": "PART TWO: SIMMER", "page": 46}, {"n": 11, "title": "The Abacus", "part": "PART THREE: BOIL OVER", "page": 51}, {"n": 12, "title": "Sky Mall", "part": "PART THREE: BOIL OVER", "page": 56}, {"n": 13, "title": "Words", "part": "PART THREE: BOIL OVER", "page": 61}, {"n": 14, "title": "What Ama Never Said", "part": "PART THREE: BOIL OVER", "page": 66}, {"n": 15, "title": "One Hundred and Twelve Lanterns", "part": "PART THREE: BOIL OVER", "page": 71}, {"n": 16, "title": "Nine Broths", "part": "PART FOUR: LANTERN NIGHT", "page": 76}, {"n": 17, "title": "The Night Before", "part": "PART FOUR: LANTERN NIGHT", "page": 81}, {"n": 18, "title": "Rain", "part": "PART FOUR: LANTERN NIGHT", "page": 86}, {"n": 19, "title": "Lantern Night", "part": "PART FOUR: LANTERN NIGHT", "page": 91}, {"n": 20, "title": "Night Sixty-Three", "part": "PART FOUR: LANTERN NIGHT", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
