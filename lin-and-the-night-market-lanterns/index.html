<script>
const D = {"title": "Lin and the Night Market Lanterns", "sub": "One Big Pot and Sixty-Three Nights", "pages": [{"no": 1, "ch": 1, "ctitle": "Eighty-Four Bowls", "part": "PART ONE: STEAM", "paras": ["*Ama's Stall Ledger, Night 1. Bowls sold: 84. Weather: cold and steamy. Ama's mood: fine.*", "Before you see the Lantern Lane Night Market, you smell it. First comes the smoke from Uncle Feng's oyster omelets, then sugar burning on Auntie Ping's tea machine, and then, underneath everything, a deep brown smell like a warm coat. That is star anise, soy sauce, ginger and beef, plus forty years of my grandmother refusing to write anything down.", "That last smell is our stall.", "I was eleven that winter, and I want it on the record that I loved the market. I loved the long lane of stalls under strings of red and yellow lanterns. I loved the way it woke up at five o'clock like a giant yawning, and the way it did not go to sleep until nearly midnight. I only did not love smelling like it at school.", "But that comes later. On the night this story starts, I still thought the smell was just the smell of home."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["Our stall is number nineteen, halfway down on the left, and it has four small tables, a lot of plastic stools and one enormous pot. Chen Ama's Beef Noodles. Ama has run it every night since before my father learned to drive.", "Ama is my father's mother. She is small and sturdy, with short silver curls, a flowery padded vest, socks inside plastic sandals and a towel permanently over one shoulder. When she cooks, she hums an old song that has no words, or if it has any, she has never told me.", "She says hello to every single person the same way. \"Chia̍h-pá-buē?\" she says. It means *Have you eaten yet?* in Hokkien, which is the language Ama grew up speaking. She says it to regulars, she says it to the mailman, and she says it to people who have plainly just finished a whole omelet.", "\"Ama,\" I tell her, \"you can't ask everyone if they've eaten.\"", "\"Why not?\" says Ama. \"It is the only question that matters.\""], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["My jobs at the stall are simple. I wipe the tables, carry the bowls, count everything, and keep the ledger. The ledger is a fat red notebook with a rubber band around it, and I write down how many bowls we sold, what the weather was like, and, because Ama insists, how she was feeling.", "That night was the Winter Solstice, the shortest day of the year. Ama says that on the solstice a person becomes a year older, no matter when their birthday is, so between customers she gave me a bowl of tangyuan, which are little round rice balls in hot ginger syrup, pink and white and chewy.", "\"Round,\" said Ama, tapping the bowl with her chopstick. \"So the family stays together.\"", "I counted the tangyuan, out of habit. There were nine. I ate seven slowly, because they were hot, and two quickly, because they were delicious, and I did not think about anything at all. I would like to say it was the last time I felt that way for a while."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["It was a good night, one of those nights when the lane seems to hum. Uncle Feng, who is round and loud and makes oyster omelets at stall seventeen, shouted a joke across the aisle that I am not allowed to repeat. Auntie Ping, who sells bubble tea with glittery nails and a headband with two tiny pom-poms, slid a free tea onto our counter \"for the accountant\" and winked at me. Old Mr. Gao's shrimp-fishing pond splashed at the end of the row, and a tourist with a camera pointed at our pot.", "Ama ladled a small taste into a paper cup and held it out. \"Taste first,\" she said. \"Talk later.\"", "The tourist tasted. Then she took another cup. Then she sat down at table two and ordered a whole bowl, which is what happens to almost everybody.", "By nine o'clock I had written 84 in the ledger, which was the best number of the month. I remember being so proud of it that I nearly forgot to be tired."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["At closing time, when the lanterns were starting to sway in the cold, the chairman of the market association walked down the lane with a piece of paper and a roll of tape. He pinned it to the board outside the little temple at the end of the row, and stepped back, and did not say a word.", "I read it over the shoulder of an old man in a woolly hat. It said that a big new mall called Sky Mall would open after the New Year, and that, after the Lantern Festival, the city would review whether Lantern Lane Night Market should be allowed to stay open.", "Review is a polite word. I knew that even then.", "I turned back to look at our stall. Steam rose from the pot into the cold air and the lanterns, and for the first time in my whole life, I felt the entire lane hold its breath."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Girl Who Smelled Like Soup", "part": "PART ONE: STEAM", "paras": ["*Ama's Stall Ledger, Night 3. Bowls sold: 71. Weather: drizzle. Times Lin washed her hair: 3.*", "Class five-two smelled of dry chalk and wet wool. Ms. Wu was writing fractions on the blackboard, her pencil moving in quick, angry scribbles. I sat between Hui-Ting, who was tall enough to touch the ceiling tiles with her braids, and the window. The window was a bad choice. It let in the cold and the smell of the street.", "Jun leaned over from the next row. He had spiky hair that stood up like a startled hedgehog and a grin that never left his face. He sniffed the air near my elbow. Then he sniffed again, louder.", "\"Chen Yun-Lin smells like beef noodles,\" he announced to the class.", "Half the room laughed. The other half tried not to. I pulled my sleeve to my nose. It smelled of soy sauce and star anise. My face went hot, the kind of heat that starts in the ears and moves to the forehead. I did not say anything. I just looked at my shoes and counted the holes in the rubber soles. One, two, three."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["That night, I decided the problem was the shampoo, or perhaps a serious lack of it. I reached for Ma’s lavender bottle, the expensive one with the pump top, and washed my hair once. Then twice. I washed it a third time because my scalp felt like it was still wearing a hat.", "The bathroom filled with a mist that smelled like a flower shop losing an argument with a soup pot. It was a confusing scent, neither clean nor beef, just heavy, purple lavender hanging in the air.", "Ma leaned against the doorframe, her glasses sliding down her nose while a clip held back her dark hair. She looked at the steam, then at me.", "\"Star anise is not a shame,\" she said quietly.", "She did not wait for an answer. Instead, she closed the door gently, though I heard her footsteps retreating down the hall. I looked in the mirror. My hair was clean. It still smelled like home."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["The next day, a new girl sat in my row. Her name was Yi-Chen. She wore a pink puffy vest that looked brand new and shoes so clean they reflected the fluorescent lights. She had come from Taipei, she said. She lived near where the new mall was going up.", "\"Is it true,\" she asked, looking around the classroom with wide eyes, \"that you eat food from carts? With plastic stools?\"", "I nodded.", "Yi-Chen frowned. \"That sounds so old-fashioned,\" she said. \"In Taipei, everything is clean and digital. You order on a screen. You don't have to talk to the cook.\"", "I opened my mouth. I had a whole sentence ready. It involved the taste of the broth and the way the steam rises. I wanted to say it was warm. I wanted to say it was real.", "Instead, I closed my mouth.", "\"Oh,\" I said.", "It was a very small sound. It felt like a pebble dropped into a deep well."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["After school, the lane was already waking up. Plastic stools stood stacked in the aisles, and the canvas tarps were being unrolled with a heavy, rustling sound. I walked to stall number nineteen, but this time I did not look at the steaming pot. I looked at it with Yi-Chen’s eyes.", "The rims of the bowls were chipped. The wooden tables were scratched deep enough to catch chopsticks, and the air felt thick with smoke and the sharp, greasy tang of frying oil. It was messy. It was loud. It was definitely not clean.", "I pulled my notebook from my bag and uncapped my pencil. I began to draw a sleek white counter, the kind you see in those glossy magazines, followed by a large screen where the menu would appear. Then I sketched a machine that dispensed little numbered tickets. It looked perfect. It looked modern. It was exactly what Yi-Chen would like, and a part of me wanted to believe it, too.", "Ama shuffled past, carrying a stack of bowls that wobbled dangerously high. She saw the notebook and I quickly turned the page to a blank sheet, my heart giving a small, guilty hop. She did not ask. She just set the bowls down with a clatter and went to the pot."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["Ama stood by the large pot, her hands moving in a steady rhythm. She was humming. It was the same song she always hummed, one with no words that went up and down like the steam rising and falling.", "I looked at my drawing of the white counter and the digital screen. Then I looked at Ama’s hands. They were stained with soy sauce. They were strong. They were the reason the soup tasted right.", "My song. My drawing. My modern idea.", "I could not draw the song. I could not measure the steam. I could not put the way she hummed into a white counter.", "I tore the page out of my notebook. I folded it into a small, tight square. I put it in my jacket pocket. It stayed there for weeks. I did not pull it out. I just felt it there, like a secret I was keeping from myself."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "A Handful", "part": "PART ONE: STEAM", "paras": ["*Ama's Stall Ledger, Night 6. Bowls sold: 79. Weather: cold. Star anise: a handful. Which handful: unknown.*", "I decided to be a scientist, at least for the next hour, because if this stall was going to survive, somebody had to understand how it actually worked. The mall was coming, the city was looking, and Ama had absolutely no notes.", "I sat on a plastic stool right next to the great pot, my notebook open on my knee while the pencil stayed tucked behind my ear, just where it always was. I watched the steam curl up from the lid in slow, lazy loops.", "Ama was wiping the counter with a rhythm I could almost hear, a steady thump-swish, thump-swish, and she just kept watching the pot without adding anything. I wrote down the time, 5:42 PM, then guessed the temperature was cold, and noted that the air smelled deeply of beef and soy. I was ready, patient, and for once, very still.", "Ama stopped wiping and looked at me, then at the pot, before picking up the ladle.", "\"Yun-Lin,\" she said, \"you are going to stand there all night?\"", "\"I am observing,\" I said.", "\"Good,\" she said. \"The soup needs a witness.\""], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["Ama lifted the lid, and the steam rushed out hot and heavy, filling the space between us before she even looked my way. She reached for a bowl on the counter and poured a dark stream into the pot. It hissed like an angry cat.", "\"Soy sauce,\" I said, scribbling it down.", "\"Until it is the right brown,\" Ama replied.", "I wrote that down verbatim. That was not a measurement; that was a mood. She grabbed a chunk of ginger, roughly the size of my thumb, and dropped it in with a wet clatter.", "\"Ginger,\" I announced.", "\"This big,\" she said, holding up her hand to show me the scale.", "I stared at her hand, broad and strong with short, clean fingernails, then I looked at the ginger, which was tiny. When I looked at her hand again, it seemed to be the size of a small shovel.", "\"A handful of star anise,\" she said, reaching for the jar.", "She poured them into her palm, and it was a lot, more than I had expected. I wrote: HANDFUL (AMA'S). I tried to draw her hand, but it ended up looking like a claw.", "\"Salt?\" I asked.", "\"Taste first,\" Ama said. \"Talk later.\""], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["Ama ladled a small amount of broth into a paper cup and held it out to me. The steam hit my face, carrying the scent of deep, dark earth and sweetness.", "I took a sip. It was hot and rich, but something was missing. It felt round, but not quite finished, like a song that stopped right before the last note.", "\"Salt?\" I asked.", "Ama shook her head. \"Wait.\"", "I waited, watching the steam rise off the cup. I tasted it again, this time closing my eyes. I let the flavor move around my mouth, searching for the edge of it.", "\"Still not,\" I said.", "Ama reached into a jar on the shelf and pulled out a thin, dry curl of something orange. It looked like a piece of a dried leaf, and she dropped it into the pot.", "\"Try now,\" she said.", "I sipped again, and my eyes opened wide. It was sharp and bright, cutting through the heavy beef flavor. It was exactly what was missing.", "\"How did you know?\" I asked.", "\"My tongue told me,\" she said."], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["Ama reached under the counter and pulled out a small cloth bag tied with red string. It looked like a pouch of sand, but it felt heavier in her hand.", "\"This goes in next,\" she said.", "She untied the knot, and the smell hit me before the sight did. It was deep and warm, smelling exactly like the inside of a wooden cabinet in a house you used to visit in summer. I leaned in and sniffed hard. For a second, I forgot the stall, the mall, and the city review. I was just breathing.", "\"Mr. Tsai makes this,\" Ama said. \"Every month. He lives by the temple.\"", "She tipped the bag onto her palm, and eight things spilled out. Star anise, cinnamon bark, fennel seeds, Sichuan peppercorns, licorice root, tangerine peel, bay leaf, and clove.", "I picked up a star anise. It had eight points, just like the sign on the market board. I looked at the others. They were all different, yet they fit together like pieces of a puzzle I had never seen before.", "\"Who is Mr. Tsai?\" I asked.", "\"He knows things,\" Ama said. \"About smells.\""], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["Ama reached for the pot lid. Her right hand found the handle, but then it wobbled. It was a tiny shake, like a leaf trembling in a gust, but I saw it clearly. The steam swirled on the left side of the pot, but her fingers were on the right, where there was no vapor to blur her vision.", "She lifted the lid anyway. Hot cloud poured out.", "Ama did not look at her hand. She stared at the soup.", "\"Steam in my eyes,\" she said.", "I watched her wrist. It stayed still as she set the lid back down and turned to wipe the counter. I looked at my notebook. I had listed the spices and drawn a diagram of the pot, but I had not written this part down. I pulled my pencil from behind my ear. In the bottom corner, in letters so small they looked like ants, I wrote: ASK MA."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "The Wrist", "part": "PART ONE: STEAM", "paras": ["*Ama's Stall Ledger, Night 9. Bowls sold: 0 (stall closed). Ama's wrist: 1. Ama's mood: not fine.*", "It happened on Night 9, over before I could even blink. Ama was draining the beef bones into the bucket, and she gripped the heavy steel pot, her forearm muscles tightening as she lifted it. A sound like a dry twig snapping under a boot cut through the steam. She did not drop it, but she set it down on the concrete with terrifying care, her hands trembling but steady.", "She said nothing at all, only breathed out once through her nose, and my stomach dropped as if I had missed a step on the stairs.", "Uncle Feng dropped his spatula, and Auntie Ping put down her phone. The lane, which usually buzzes with chatter and sizzling, went quiet for exactly one breath. Then the noise rushed back in, louder than before, a wave crashing against a wall.", "Ama looked at me. She did not wince, she just waited for the soup to settle."], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["Ma took us to the clinic where she works. The doctor was a man with kind eyes and no patience for drama. He wrapped Ama’s right wrist in thick white tape, checking for swelling, pressing gently until Ama’s eyebrows knitted together.", "\"Bad sprain,\" the doctor said. \"And a hairline fracture. No lifting for three weeks.\"", "Ama stared at the ceiling tile. \"Nineteen has never been closed on a Saturday in forty years,\" she said. Her voice was flat.", "\"Ama,\" Ma said, her voice tight. \"You are seventy-four. You cannot carry a hundred-kilo pot.\"", "Ba was on a long delivery route, six hours away. I held my phone out to the doctor. Ba’s voice came through the speaker, distorted and far away. He was quiet for a moment, listening to the background hum of the clinic.", "\"Ama,\" Ba said. \"Please. Sit.\"", "Ama looked at the phone, then at the tape on her wrist. She did not look at me."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["We sat at the dining table, where the air always smells of lemon cleaner and old wood. Ma pushed a glass of water toward Ama, her hand steady.", "\"We close for three weeks,\" Ma said. \"Simple. Clean. Done.\"", "\"The regulars will forget me,\" Ama replied, picking at a loose thread on her sleeve. \"They will go to the new place, or the mall. They will forget the taste.\"", "I opened my mouth, closed it, then opened it again because silence felt wrong.", "\"I can run it,\" I said.", "The room stopped. Ma looked at me, and Ama looked back, both of us waiting. I had to say it again, louder this time, like a command I had not given myself yet.", "\"I can run it. I know the ledger, the tables, and the pot. I even know where the tangerine peel is.\"", "I stopped there. I did not list what I did not know, because I did not know how to taste the broth until it was right, nor how to listen to the steam. I just sat there, my hand resting on the spiral notebook in my lap."], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["The doorbell rang before Ma could answer. Uncle Feng and Auntie Ping stood in the hallway, holding a bag of oranges that clanked against each other. They had drifted in without an invitation, which is what they do when the air feels heavy.", "\"Who is cooking?\" Feng asked, grinning, though his eyes were worried.", "\"I am,\" I said. It felt strange to say it. It felt like claiming a space that didn't belong to me yet.", "Feng looked at Ama’s taped wrist. He nodded slowly. \"I will lift the pot. The heavy stuff is my job.\"", "Auntie Ping slid a cup of hot tea onto the table. \"And I will send tea. Good tea. For the boss.\"", "Ama stared at the ceiling for a long time. The light from the hallway bulb made her silver curls shine. Finally, she looked at me.", "\"I will sit in the boss chair,\" she said. \"I will supervise.\" She said it with the same serious tone she used when discussing the weather, or the price of beef. She said it like a general handing over a fortress that is currently on fire."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["That night, I lay in the narrow bed and rehearsed the steps instead of sleeping. I counted the four tables, then the plastic stools, the ladles, and the bowls.", "First, light the fire. Second, add the water. Third, the ginger. Fourth, the beef. Fifth, wait.", "I had done this a hundred times as an assistant. I had wiped the counter, carried the bowls, and written the numbers. But I had never been the one who decided when the soup was ready. I had never stood there, steam rising around my face, waiting for the moment when the smell changed.", "I lifted my sleeve to my nose. It smelled of star anise and soy sauce. Usually, I would scrub it off or try to hide it. This time, I breathed it in. It smelled like home. It smelled like Night 9. It smelled like a job that was now mine."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "The Boss Chair", "part": "PART ONE: STEAM", "paras": ["*Ama's Stall Ledger, Night 10. Bowls sold: 23. Bowls spilled: 4. Bowls praised: 1.*", "The burner sputtered. The flame died with a soft *phut*, leaving only the smell of unburnt gas. I flicked the switch again. It popped back to life, roaring like a startled cat.", "\"Not so much gas,\" Ama said from her plastic stool, her wrist wrapped in white tape. \"More.\"", "She said both things in the same breath. I stood there, turning the knob left, then right, feeling like a pilot trying to land a plane in a hurricane. Uncle Feng, who was passing by with a tray of oyster omelets, stopped. He looked at the pot, then at me. With a grunt that vibrated through his forearms, he reached down and lifted the heavy steel lid, letting the steam escape in a long, white sigh.", "I tied my red-and-white checked apron around my waist. I pulled it tight. Then I tied it again, just to be sure. It turned out that was one time too many. The knot sat high on my lower back, uncomfortable and tight, but it felt like armor. I adjusted my pencil behind my ear. The market was waking up."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["The first family arrived, five of them, carrying the scent of cold air and high expectations. Behind them stood a man in a crisp suit, checking his watch with the impatience of someone waiting for a bus. My hands went numb. I reached for the noodles, but my brain had forgotten the step. I dropped the bundle into the pot too early. They turned into a gluey, trembling lump that looked like a mistake I had made in a math test.", "I ladled the soup, but my hand shook so badly the bowl tipped, sending a splash of dark broth onto the man’s shiny shoe. I grabbed the sugar jar, my fingers clumsy, and dumped a spoonful into the pot instead of the salt shaker.", "From her chair, Ama did not shout. She just sniffed the air, her nose twitching once.", "\"Taste, Lin,\" she said quietly.", "I dipped my finger in. It was sweet. It was wrong. I wanted to sink into the broth and disappear. The man in the suit looked at his shoe, then at me, and walked away. The family sat down, but they did not order."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["By eight o'clock, four bowls had been spilled. Twenty-three were sold. The queue that had formed at seven was mostly gone, leaving only a thin line of hesitant faces who glanced at our empty tables and moved on to the oyster omelet stall.", "I turned my face to the wall where the steam was thickest. It was the only place in the market where nobody could see my eyes. I breathed in the star anise, trying to keep my face still. I was not crying. I was just sweating. Probably.", "A voice, soft and familiar, cut through the steam.", "\"Lin?\"", "Hui-Ting was standing at table two. She wore her glasses and her two long braids. Beside her stood her grandmother, a quiet woman in a gray coat. Hui-Ting's grandmother did not say a word. She simply sat down on the plastic stool, folded her hands in her lap, and waited patiently to be sad on my behalf."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["Old Mr. Gao arrived late, his straw hat tilted low over his eyes. He was the shrimp-fishing man, the one who told jokes so bad they made you want to hold your ears. He slid onto a stool and ordered his usual.", "When the bowl arrived, he did not eat immediately. He slurped. He paused. He slurped again. His eyes were closed, and his lips moved slightly, as if he were counting something.", "\"Tastes like your Ama,\" he said finally, opening one eye. \"A little slower.\"", "I felt a pang of hurt. \"That is not a compliment,\" I said, wiping a speck of broth from the counter.", "Mr. Gao laughed, a dry, rattling sound. At his age, he said, being a little slower was the best compliment there was. It meant the soup had time to think. He finished the last drop, leaving the bowl empty and shiny."], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["The last customer left, taking the cold air with him. The lane was quiet, save for the hum of the refrigerators and the distant laughter from the bubble tea stall. I stood by the counter, my arms aching from carrying bowls.", "Ama stood up. She walked over to the shelf where the tools hung. She took down the old brass ladle. It was dented, the handle worn smooth by decades of hands. It had been her mother’s. She handed it to me. It was warm from the pot.", "I took it. My fingers curled around the handle. It was heavy, but it felt right in my grip.", "\"Again tomorrow,\" Ama said. She did not smile, but she nodded.", "I opened the red ledger. I picked up my pencil. I wrote the number 23. It was the worst number I had ever written. And it was the one I was proudest of."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "The Recipe Project", "part": "PART TWO: SIMMER", "paras": ["*Ama's Stall Ledger, Night 14. Bowls sold: 52. A handful: 31 grams (approximately). Ama says: stop weighing my hands.*", "I stole a digital kitchen scale from Ma’s cabinet and a set of plastic measuring spoons from the drawer. I hid them under the counter, right next to the soy sauce, because secrets feel safer when they are close to salt.", "My plan was simple. Ama sat in her boss chair, the one with the wobbly leg she refused to fix. Every time she called out \"a handful,\" I would catch it in a tin bowl and weigh it. I thought if I could just find the number, the mystery would stop.", "Ama watched me weigh the star anise. She leaned forward, her elbows on her knees, watching the little screen change numbers. She looked at me the way a cat watches a mouse trying to explain the concept of being eaten.", "\"Lin,\" she said softly. \"Are you counting my teeth?\"", "\"No,\" I said, my voice very small. \"I am checking the math.\"", "\"Math does not cook,\" she said, turning back to the pot."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["The numbers refused to behave. On Tuesday, a handful of star anise weighed thirty-one grams. On Wednesday, it dropped to twenty-two. By Thursday, it had jumped to thirty-eight. I was losing my mind, and I was definitely losing my faith in the universe.", "I slammed the tin bowl onto the counter. The clatter made Uncle Feng look up from his oysters. \"Which one is right?\" I demanded, pointing at the digital scale. \"There has to be a right number.\"", "Ama did not look up from her ladle. She was stirring the broth with that slow, circular motion that never hurried. \"The one the weather wants,\" she said.", "\"The weather is not an ingredient.\"", "\"It is,\" she replied, finally turning to face me. \"When it is colder, the beef needs more ginger to wake it up. When the air is heavy with humidity, too much sugar makes the broth feel like mud. You do not add the same thing every day. That is why it tastes alive.\"", "I looked down at my neat little notebook. My lines were straight. My numbers were tidy. And yet, the pot was doing something messy and wonderful that my list could not catch. It was like trying to measure the length of a joke with a ruler. The water kept moving."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["I stopped trying to force the numbers to match and started listening to the pot instead. The water changed pitch when the beef got tender, and I noticed that the rain tapping on the tarp meant the customers would be tired and want something warm. Even the beef itself seemed to have an opinion. Sometimes it arrived tough from the butcher and needed an extra hour of patience, while other times it yielded quickly, like a shy classmate finally answering a question.", "It was not a list. It was a conversation.", "I opened my spiral notebook and crossed out the column for \"exact grams.\" The pencil tip snapped under the pressure, leaving a small graphite shard on the paper. I did not care. I wrote a new heading in big, careful letters.", "RECIPE = LISTENING.", "I underlined it once, then realized that one underline was not enough for a truth this important, so I underlined it again. The pencil broke completely this time. I did not care. For the first time, I felt like I was actually learning how to cook, not just how to measure. I was learning how to listen."], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["Ama clapped her hands together and nudged me toward the pot. \"Now, the nose. Smell the foam. What does it want?\"", "I leaned in close. The aroma was rich and deep, with a sharp edge that felt like the last bite of a good snack. My brain was still trying to calculate minutes, but my nose already knew. It understood that the broth was too thick and needed a little more water to let the flavors breathe.", "\"It wants space,\" I said.", "Ama nodded. \"Good. Now, skim the top.\"", "She showed me how to use the ladle to scoop away the grey foam floating on the surface. \"Gently,\" she whispered. \"If you rush it, the broth turns cloudy. Cloudy is sad. Clear is happy.\"", "I practiced, but I scooped too hard once and pulled up a whole chunk of braised beef. Panic flared in my chest, but Ama just pointed at my mouth.", "I ate the beef. It was the best piece of meat I had ever tasted, better than any school-cafeteria meatball I had ever eaten, and I did not even need to count the seconds."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["By the end of the week, people in the lane started talking.", "\"Does it matter if I have the girl's bowl or Ama's bowl?\" asked a man in a wool coat.", "Ama shrugged. \"Ask the girl.\"", "I pretended to be busy wiping a table. I did not look at them. I did not smile. I certainly did not feel a warm glow of pride spreading through my chest, which was definitely not happening.", "Ama watched me for a long moment. Then she reached for her red ledger. She wrote the bowl count. Then, in her own careful pencil, she added a small tick in a new column she had drawn herself.", "I peeked over her shoulder. \"What is that?\"", "\"Good,\" Ama said, turning away to wipe a table that was already clean. \"Now go count the stools. They keep wandering.\""], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "Hui-Ting Can't Eat Here", "part": "PART TWO: SIMMER", "paras": ["*Ama's Stall Ledger, Night 18. Bowls sold: 60. Vegetarian customers turned away: 1. Lin's mood: bad.*", "Hui-Ting had been walking with me down the lane for six years. She is tall and quiet, with two long braids and glasses that catch the lantern light. Every Friday, she walks past stall nineteen. Every Friday, she never stops.", "On Night 18, the first day of the lunar month, she stopped. She stood in front of our counter, looking at the steam rising from the great pot. Her stomach let out a sound that was very loud and very honest.", "I held out a bowl. \"You must be hungry. Take this.\"", "Hui-Ting shook her head. She looked at the bowl, then at my face, then back at the bowl. \"I can't eat this, Lin.\"", "I frowned. \"It is just beef noodles. I made them. They are good.\"", "\"They are good,\" she agreed softly. \"But today is the first day. My grandmother says I have to eat *su shi*.\"", "I stared at her. I had known Hui-Ting since we were in first grade. I knew she liked rainy days and always had two spare erasers. I did not know that she had a secret rule about soup.", "\"I thought vegetarian meant no meat,\" I said.", "Hui-Ting smiled, a small, patient smile. \"It is a little more than that.\""], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["\"You have to understand,\" Hui-Ting said, leaning on the counter. \"My grandmother's family believes in being very calm. She says some foods stir up the senses. They make you too excited, or too angry, or too loud.\"", "I thought of Uncle Feng shouting jokes. I thought of my own heart beating when I burn a scallion.", "\"Which foods?\" I asked.", "\"Garlic. Onion. Chives. Leeks. And green onions,\" she listed, tapping her fingers on the steel counter. \"Her family calls them the five pungent things. They are strong. They wake you up. But on the first and fifteenth days of the moon, my family wants to be still.\"", "I looked at our stall. The air was thick with the smell of ginger and soy sauce. I remembered the basket of green onions behind the pot. I remembered how Ama chopped them, fast and sharp, into the oil until they sizzled.", "I had spent my whole life thinking vegetarian meant \"no beef.\" I had never thought about the onions. I had never thought about the garlic. I looked at the kitchen, and for the first time, it did not look like a kitchen. It looked like a wall.", "\"So,\" I said, my voice very small. \"You can't eat the soup.\""], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["I felt heat climb up my neck and wiped my dry hands on my apron anyway. \"I can make you plain rice,\" I offered quickly. \"And pickled vegetables from the pickle stall at the end of the lane. They have good pickles.\"", "Hui-Ting nodded, not looking disappointed but kind, which was somehow worse. I walked to the end of the lane and brought back a small bowl of white rice with a plate of crisp, purple pickled cabbage. I set it in front of her, then returned to my table to pick up my own bowl of beef noodles.", "The broth was dark and rich. I lifted my spoon and took a sip, letting the tangerine peel release a sharp, sweet scent that hit the back of my nose. It tasted like pride, like work, and like being the best at what I did.", "Across the table, Hui-Ting ate her plain rice and chewed slowly, looking happy. I swallowed, and the soup felt heavy in my mouth. It felt like I was eating the wall all by myself."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["I put my spoon down and watched the steam curl out of my bowl, twisting into shapes that looked like questions.", "\"What if,\" I said, and the word came out louder than I meant it to, so I clamped my mouth shut immediately.", "Hui-Ting turned to look at me, her eyes wide behind her glasses.", "\"What if there was a broth,\" I whispered, moving my hands as if I were mixing an invisible pot. \"No beef. No onions. No garlic. Just dried shiitake mushrooms, and kelp, and roasted tomatoes, and... the eight-spice pouch from Mr. Tsai.\"", "I looked at her, feeling like I was trying to catch a slippery eel in a net made of smoke.", "\"It would be clear,\" I said. \"And warm. And it would smell like the market, but not like beef.\"", "Hui-Ting was quiet for a long moment while the noise of the market swelled around us, with Uncle Feng laughing and Auntie Ping pouring tea. Then she leaned forward, her voice soft but very steady.", "\"I would come every week,\" she said."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["I didn't wait for a response. I ran to the back of the stall, where Ama was wiping down the metal shelves with a rag that was almost as gray as the floor. She was humming that old song with no words, the one that sounds like a kettle just before it boils.", "\"Ama,\" I said, still catching my breath. \"What if we made a vegetarian broth? Just mushrooms and kelp and tomatoes? For Hui-Ting?\"", "Ama stopped humming. She turned to look at me, her face calm and serious, holding the cloth in both hands.", "\"Beef noodle soup without beef,\" she said slowly. \"That is a fish without water.\"", "\"It is not beef noodle soup,\" I said, trying to keep my voice even. \"It is something new. A new kind of soup.\"", "Ama set the cloth on the shelf. She looked at me, and then she looked at the great pot, which was still bubbling quietly in the dark.", "\"Something new,\" she said. \"That is how you lose something old.\"", "She turned back to her work and picked up the cloth again. She did not hum. I stood there, holding my apron strings, and I did not hum either. The silence between us felt thick, like day-old rice."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "Shrimp, Rings and Balloons", "part": "PART TWO: SIMMER", "paras": ["*Ama's Stall Ledger, Night 25. Bowls sold: 66. Shrimp caught: 2. Prize won: one pink plastic whistle.*", "Ma caught my wrist at the door, still wearing her dental clinic lanyard, which meant she had been working late. \"You are moving like a machine,\" she said. \"Machines need rest.\" I protested that the pot needed watching and the ledger needed counting, but Ma pointed a finger down the market lane. \"Go. Play. It is Saturday. The shrimp are not going anywhere.\"", "So I went to the games, and Hui-Ting, who had been sitting on a stool drinking cold lemonade, stood up and came with me. The end of the lane is loud, with Old Mr. Gao standing behind a big square tank of water that glows under strings of tiny light bulbs. Next to him is a ring toss game where the red and yellow rings look exactly one millimeter too small for the glass bottles, which is a beautiful trap.", "I watched a boy try, throwing a ring that hit the bottle and bounced off, then another that hit the ground. \"Easy,\" I said. Hui-Ting looked at me, then at the ring. \"It looks heavy,\" she said. I wanted to prove her wrong, so I picked one up. It felt light, but my hand was shaking a little because I was too busy thinking about the angle to care about the weight."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["Out of nowhere, Jun appeared. He was loud, as usual, and his spiky hair looked like he had just won an argument with a brush.", "\"Research,\" he announced, pointing at the shrimp tank. \"My teacher said I need to observe aquatic life in a commercial setting.\"", "\"You want to catch shrimp,\" I said.", "\"Correct,\" said Jun. He looked at Hui-Ting. \"Is this your thing? You look like you know how to do this.\"", "Hui-Ting shrugged. She always shrugs. It is her way of saying she is not sure if she wants to be there.", "We rented three rods. They were blue plastic, and they smelled like old fish. Mr. Gao handed us our tickets.", "Hui-Ting did not move. She just waited. Five seconds passed, then ten. A shrimp, bright pink and fuzzy, bumped against her bait. She lifted the rod. One catch.", "She tried again. Another shrimp. Two catches. She did not look excited. She just looked tired.", "I moved my rod left and right. I splashed water. I almost caught a shoe.", "Jun tried to be smooth. He flicked the rod. The line went high. Then it went low. It wrapped around his own sleeve.", "\"Oops,\" said Jun."], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["Mr. Gao took the two shrimp from Hui-Ting and placed them on a small black grill, where the salt hissed and sent up a cloud of sweet smoke. We stood there waiting, watching the flesh turn pink and crisp, and it felt like the longest commercial break in history.", "When they were ready, Mr. Gao handed them over. Two halves. One for each of us. Jun ate his half with his eyes closed, chewing slowly as if he was trying to memorize the flavor for a report.", "\"Good?\" I asked.", "\"Yeah,\" he said, opening his eyes. \"It’s like... fried chicken. But better. And smaller.\"", "Then he stopped chewing. He looked at the grill, then at the water, then at me.", "\"My dad had a stall here,\" he said quietly. \"Fried chicken. Corner of the lane. Until last year.\"", "He said \"closed\" like a word he was trying not to touch, similar to how you handle a hot pan you forgot you were holding. The lane was still loud around us, with balloons popping and someone laughing, but the air between us got quiet.", "\"I’m sorry,\" I said.", "Jun shrugged. \"It’s fine. It’s just... different now.\""], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["I remembered that time in class, and the memory felt like a cold draft on my neck. I had laughed, and I had laughed hard, because Jun was making a joke and I thought he was the funniest person in the room. I never stopped to ask why he was always so loud, or why the jokes never really stopped.", "Now he looked at me, and the air between us went quiet, like the moment before a fire drill.", "\"You teased me about the soup,\" he said, his voice flat. \"You said I smelled like it. You said it was embarrassing.\"", "My face heated up, a flush of shame rising from my chest to my ears. I wanted to say it was just a joke, but the words felt too small to cover what I had done.", "\"I was jealous,\" Jun said, and he did not look away. \"Your stall is still open. Mine isn't. That’s why I said it. Because it’s still there, and it smells good, and you’re proud of it.\"", "Hui-Ting didn’t say a word. She just reached into her jacket pocket and pulled out the prize we had won from the ring toss. It was a pink plastic whistle, shiny and new.", "She held it out to Jun.", "He took it, wiped his mouth on his sleeve, and put the mouthpiece in his teeth.", "*PEEP-PREEEP.*", "It was a horrible sound, and also a wonderful one. Every stall keeper in the lane turned around. Uncle Feng dropped his spatula with a loud clatter, and Auntie Ping finally stopped scrolling through her phone to stare at us.", "Jun grinned. It was the same grin he always wears, but this time, it looked lighter."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["We walked home under the still-glowing lanterns, the steam from the beef noodle pot thinning into the cold air as the night settled in.", "I kept thinking about Jun’s face, and the specific, quiet way he said the word *closed*, while my own fear of the lane disappearing sat in my stomach like a wet sock.", "Shame is a strange thing to wear. From the outside, it just looks like a kid who is a little bit too quiet, but from the inside it feels like a heavy coat that will not come off.", "I reached into my jacket pocket and found the crumpled paper, my redesign with the clean, modern logo and the \"Chen Ama’s\" written in a font that looked like it came from a website.", "Holding it up under the soft yellow streetlamp, I stared at the lines for a long time, though I did not throw it away.", "I was not ready for that, so I simply put it back in my pocket, where it felt different now.", "Not lighter, just more real."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "The Reunion Dinner", "part": "PART TWO: SIMMER", "paras": ["*Ama's Stall Ledger, Night 47. Market closed. Bowls sold: 0. Dumplings eaten: too many. Red envelopes received: 1.*", "The market was dark. The lane sat in a silence so thick it felt like a forgotten school hall after the last bus had left. We had to clean the apartment top to bottom before the New Year. Ma sprayed the windows with a mist that smelled of pine, and I wiped the ancestor shelf at the end of the corridor. It was a small wooden box, but it felt like the center of the room.", "We placed fresh oranges there, their skin bright and waxy. Ma lit the incense, and the thin white smoke curled up, vanishing into the air. Then we put out Agong’s photograph. He looked young in it, smiling with a gap in his teeth. I wiped the dust from the glass frame, careful not to touch his face.", "The doorbell rang. Ba was home. He stood in the hallway, huge and tired, his face red from the wind. He held a bag of oranges in one hand and a whole silver fish in the other. He smelled of diesel and cold air.", "\"I am hungry,\" he said, dropping his keys in the bowl. \"And the goat story is ready.\""], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["\"Nián yè fàn,\" Ma said, pointing at the empty table. \"We must fold dumplings for wealth.\"", "I rolled out the dough, but it stuck to my fingers like wet glue. Ama stood in the corner with her arms crossed, watching us with a critical eye. She did not help with the rolling. She only folded. Her hands moved so fast they were a blur, while my single dumpling looked like a sad, lumpy pillow. Ama had already made forty. They sat in a row like little white boats ready for a race.", "Ba sat on a stool, peeling an orange. He began his story about his truck. A goat had run into the highway, unafraid and proud. It jumped onto the bumper, and Ba drove for ten kilometers with a passenger in the front seat. The goat ate his sandwich.", "\"The goat did not pay for the sandwich,\" Ba said seriously.", "Ama stopped folding. She looked at Ba, then at me, and started to laugh. It was a deep, rumbling sound that shook her whole body.", "\"More fish,\" she said. \"We need the surplus.\""], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["Ba and Ama started talking, not in Mandarin but in the faster, softer Hokkien that Ama had been speaking to me my whole life. It rolled over smooth vowels and sounded a lot like the water running off our plastic stools when we hosed them down. They discussed the fish, the price of oranges, and the ache in Ba’s bad back.", "I tried to listen, but the words slipped through my fingers like wet sand. I wanted to join in, so I opened my mouth, but my tongue felt thick and clumsy, like it had been stuffed with cotton. I tried to say *xièxie*, but it came out as a squeaky *shii-shii*. I closed my mouth immediately, and my face began to burn hot.", "Ama looked at me. She did not smile, exactly. She just waited, her eyes kind but firm, watching me the way I watched a dumpling that refused to seal.", "\"Ama,\" I said, in my best Hokkien, which sounded like a cat clearing its throat. \"I want to learn.\"", "Ama stopped chewing. She looked at me for a long second, then burst out laughing so hard she had to put down her chopsticks and lean on the table to catch her breath.", "\"Not now,\" she wheezed. \"Eat your fish.\""], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["After the bowls were cleared, Ama reached into her vest pocket. She pulled out a red envelope. It was bright, the color of luck. She held it out with both hands, palms flat, a perfect gesture I had seen in photos but never practiced.", "I took it with both hands, mirroring her. My fingers felt stiff. Inside, there was money. It was an even number, a lucky amount. But tucked behind the bills was a small slip of paper.", "I unfolded it. Two characters were written in ink that had slightly smeared. They were shaky, but bold.", "*Chia̍h-pá.*", "Eat until you are full.", "I looked up. Ama was already looking away, pretending to arrange the fruit on the table. But I saw her hands shaking, just a little. It must have taken her an hour to write that. She does not like to write. She does not like to say the big things.", "So she wrote the small thing. The most important thing."], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["I sat on the balcony wrapped in my green jacket. The city was loud. Fireworks popped and hissed over the rooftops, turning the night sky purple and gold. The market lanterns still hung above the street, dim but bright enough to see the cars passing by.", "I held the red envelope in my pocket. I could feel the paper against my thumb.", "I had never told Ama that the stall smelled like the best thing in the world. I had not told her I loved the steam. I had not told her I liked the noise or the counting. I had only said I wanted it to look modern. I had only said I was embarrassed.", "I breathed in the cold air. It tasted like gunpowder and old wood.", "I will tell her tomorrow, I thought. I will say it all tomorrow.", "I did not know that tomorrow was a long way away. Some things do not wait for the right day."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "The Man Who Made the Pouch", "part": "PART TWO: SIMMER", "paras": ["*Ama's Stall Ledger, Night 50. Bowls sold: 88. Mr. Tsai's shop: closing. Ama's mood: (she would not let me write it).*", "The lane was dressed for the New Year. Red banners hung from every stall, and the lanterns had been doubled, making the light thick and golden, like a jar of honey tipped over the street. People wore their new clothes, and the air smelled of roasted peanuts mixed with the sharp bite of cold wind.", "Stall nineteen was busy. I ladled the soup while Ama stood with her wrist in a white brace. She was not cooking; she was supervising.", "\"Yun-Lin, the scallions are too long!\" she shouted over the noise.", "\"They are exactly as I cut them,\" I said.", "\"They are decorative, not edible!\"", "I cut them shorter. I did not argue. It was strange to see her standing still, because without the pot steaming in front of her, she looked smaller, like a doll pulled from a box. But her voice was still the boss. It filled the lane, pushing back the cold. By ten o'clock, I had written eighty-eight in the ledger. It was a good number. It was enough."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["The rush settled into a hum. The steam rose, and the lanterns swayed. I was wiping a table when I saw him.", "Mr. Tsai shuffled toward us. He wore his thick cardigan and his glasses were smudged. In his pocket, the wooden beads of his abacus clacked softly. He stopped at our counter. He did not look at the soup. He looked at the counter.", "He took a small cloth pouch from his pocket and set it down. It smelled of earth and dried fruit.", "\"This is the last one,\" he said. His voice was slow and quiet. \"I am eighty-four. My hands are tired. My son wants me to come to the city. To live with them.\" He touched the pouch, then pulled his hand back. \"The shop closes at the end of the month.\"", "The noise of the market seemed to drop away. The steam curled around his words."], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["Ama stood perfectly still, her eyes locked on the small pouch resting on the counter. She did not reach for it immediately. Instead, her free hand, the one not trapped in the brace, drifted forward until her fingers brushed the rough cloth. She kept her hand there, as if expecting it to dissolve into the steam.", "\"Forty years,\" she said. Her voice dropped so low that only the three of us could hear it. \"You never mentioned you were stopping.\"", "Mr. Tsai adjusted his smudged glasses, his movements slow and careful. \"I did not know how to say it.\"", "Ama looked up. Her eyes were bright and sharp.", "\"You just did.\"", "She did not pick up the pouch, nor did she tuck it away. She simply turned back to the great pot, her shoulders remaining stiff and high.", "I watched her hand. It was trembling, just a little, like a loose leaf caught in a draft. I had never seen her tremble before. I wanted to say something, to fix it, but there was nothing to fix. There was only the pouch, the silence, and the heavy scent of star anise hanging in the cold air."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["Later, after the last customer left and the plastic stools were stacked upside down on the tables, I wiped the counter. The wood was cold against my palm, a sharp, clean chill that seemed to travel up my wrist.", "\"Ama,\" I said, not looking up from the rag. \"What will happen to the soup? Without the pouches?\"", "She was drying the ladle. She dried it slowly, her hand moving in long, deliberate circles that made a soft *shhk* against the metal. \"I will find another spice shop,\" she said, her voice flat and final.", "\"No one makes it like Mr. Tsai,\" I said, dropping the rag on the counter. \"The blend is different. It is the heart. It’s like trying to eat cereal with a fork. It’s all wrong.\"", "Ama stopped drying. She looked at the ladle, then she looked at me, her eyes wide and serious.", "\"I know,\" she said.", "It was the first time I had ever heard her sound afraid. It was a small, quiet sound, like the river behind our house changing course in the night. I looked at the pouch on the counter. It sat there, waiting. I did not know what to do or say, so I just wiped the counter, over and over, until the wood was shiny and reflected the dim light of the lanterns."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["I picked up the cloth pouch and untied the knot. Inside were tiny things: star anise, dark and sharp; cinnamon bark, curled and brown; fennel seeds, pale and sweet; a single peppercorn, black and hard; a piece of licorice root, dark and rough; tangerine peel, dried and orange; a bay leaf, green and thin; and a clove, small and brown.", "Eight things.", "I held them in my palm, feeling how they were light, yet somehow heavy. If I knew exactly what was in it, and Mr. Tsai knew how much, then maybe.", "I took my pencil from behind my ear and opened my spiral notebook. I wrote: ASK MR. TSAI.", "Ama was humming, oblivious to my thoughts. I added one more line below the first. DON'T TELL AMA YET.", "Then I closed the notebook, tucked it into my pocket, and looked at the pouch one last time before putting it back in the cloth."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "The Abacus", "part": "PART THREE: BOIL OVER", "paras": ["*Ama's Stall Ledger, Night 52. Bowls sold: 74. Spices pounded: 4 kilos. Lin's fingers: orange.*", "I left the house at five o’clock, when the streetlights were still buzzing and the air tasted like cold dust. The herb shop across from the temple was dark, so I knocked anyway, and the bell above the door jingled with a small, sharp sound that cut through the silence.", "Mr. Tsai was already inside, sitting on a low stool. He was clicking his wooden abacus, the beads snapping against each other with a rhythm that sounded like rain on a tin roof. The air in the shop was thick, heavy with the smell of licorice and old wood and a hundred tiny drawers waiting to be opened.", "He looked up, and his thick glasses slid down his nose.", "\"Chen Yun-Lin,\" he said. \"You are early.\"", "\"I need to learn the blend,\" I said. I did not ask, and I did not explain; I just stood there, holding my notebook, my fingers cold and stiff.", "Mr. Tsai stopped clicking. He looked at me for a long moment, then he smiled. It was a slow smile, the kind that seems to have been waiting a very long time for a specific reason to appear.", "\"Forty years,\" he said softly. \"I have been waiting forty years for someone to ask.\""], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["He pulled a brown book from under the counter. The leather cover was soft from handling, the edges worn smooth like river stones. He opened it to a page that was yellowed and thin.", "\"This is the ledger,\" he said. \"My father’s hand. Then my hand. And here,\" he tapped a corner of the page, \"Ama’s hand. She came to this shop when she was young, with her mother’s list.\"", "I leaned in. The writing was different on every page. In 1988, the amount of cinnamon was a little less. In 1993, the licorice was heavier. In 2004, a new clove appeared, written in a shaky but determined hand.", "\"I thought it was a secret,\" I whispered. \"A code.\"", "Mr. Tsai shook his head. \"There is no secret,\" he said. \"There is only what the pot wanted that year. The spices change. The heat changes. The people change. You must listen to the pot, not just the paper.\""], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["\"Roast first,\" he said. He handed me a small wok. \"Peppercorns and fennel. Dry heat. Until they smell like sunshine on a hot road.\"", "I turned the heat low. The seeds popped and spat, tiny black sparks of scent filling the air. It was sharp and bright. Then he gave me a heavy stone mortar. \"Pound the cinnamon,\" he instructed.", "I struck the pestle down. Once, twice, ten times. My arms began to shake, the muscles burning with a dull ache. The bark broke into dark, fragrant dust. I could feel the effort in my shoulders, a strange, satisfying weight.", "Finally, it was time to blend. I mixed the ingredients with my hands. The dried tangerine peel was oily and bright. As I worked, my fingers turned a deep, vivid orange. I held them up to the light, surprised by the color, feeling like I had been dipped in the spice itself."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["\"You are mixing,\" Mr. Tsai said, \"but you are not listening.\"", "He took a pinch of star anise and dropped it into my palm. \"This is for sweetness and warmth. It holds the center.\" He added a piece of cinnamon. \"This is depth. It goes to the bottom.\" Then he sprinkled in a few Sichuan peppercorns. \"This is the lift. It tingles. It wakes you up.\"", "\"A blend,\" he said, \"is a small orchestra. Nobody plays too loud. If one instrument is too big, the whole song falls apart.\"", "I thought about music class, which I hated with every fiber of my being. I hated the noise, the confusion, and the way everyone played at the wrong time. But this was different. This was quiet. This was precise. I thought I might actually like this. I thought I might have been wrong about the whole idea of working together."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["I tied the cloth pouch tightly and held it up to my face. The scent was strong, but it felt flat. It was close, but not quite right. There was a gap in the middle, a silence where the music should have jumped.", "Mr. Tsai leaned in and sniffed the air. He closed his eyes, breathing deeply, then nodded slowly.", "\"Almost,\" he said. \"That is the word for a beginning.\"", "He reached into his cardigan pocket and pulled out his wooden abacus. He pressed it into my hands. It was heavier than it looked, solid and warm from his pocket.", "\"Not for the blend,\" he said. \"For the rest of your life. Count everything. Then trust your nose anyway.\"", "I held the abacus, the wooden beads cool against my palms. Looking at him, then at the pouch, then at the door, I realized I had a lot of counting to do. And a lot of listening."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "Sky Mall", "part": "PART THREE: BOIL OVER", "paras": ["*Ama's Stall Ledger, Night 54. Bowls sold: 19. Sky Mall: open. Ama's mood: quiet.*", "The streetlights flickered, and then the world turned white. Sky Mall had opened. The lights were so bright they washed out the red lanterns on our lane, making them look like faded fruit. I stood on the sidewalk, feeling small and dusty.", "Auntie Ping ran over, her pom-pom headband bouncing. Her eyes were wide, reflecting the glass. \"Look at that,\" she whispered. \"Free bubble tea for the first thousand people. And the food court. Did you see the screens?\"", "She looked at me, really looked at me. \"Lin, it looks exactly like the future.\"", "I felt a cold spot open in my stomach. I reached into my jacket pocket and touched the folded paper where I had drawn my own plans for modernizing our stall. Clean lines. Digital menus. I had wanted this. I had wished for this. But standing there, in the cold, smelling only of damp pavement and distant exhaust, I did not want it at all."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["By seven o'clock, the lane had emptied out completely. It felt like a bathtub draining, the water pulling away fast until only the scum and the silence remained. We sold nineteen bowls that night. I wrote the number down, and the ink looked too black and too loud against the paper.", "Uncle Feng’s griddle sat cold and silent. It did not hiss or sizzle, just resting there as a dark disc of metal under the harsh lights. Old Mr. Gao sat by his shrimp pond, talking to the water.", "\"Hello, shrimp,\" he said to an empty bowl. \"Do you like jazz?\"", "He waited for an answer, but there was none. Then I saw him. Jun’s dad was walking through the mall’s glass doors, wearing a crisp white apron that did not match anything in this lane. He was carrying a tray of plates. He looked thin. He looked like he was walking in a dream that didn’t belong to him."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["A car pulled up to the curb. The door opened, and Yi-Chen stepped out. She was wearing a pink puffy vest and holding a shiny paper bag that crinkled loudly in the quiet air. Her mother stood behind her, adjusting a scarf.", "\"It’s a shame, really,\" Yi-Chen said, looking at the dark stalls. \"But I guess that’s how things are. The food court has everything in one place. So convenient.\"", "She looked at me, waiting for me to agree. I wanted to agree. I wanted to say yes, it is convenient, it is clean, it is better. But the words that came out of my mouth were sharp and cold.", "\"The food court has everything,\" I said. \"Except a grandmother.\"", "Yi-Chen blinked. Her mouth opened slightly. For one second, I felt a hot spark of victory. Then the spark died, and I felt the cold of the street again."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["Auntie Ping did not leave. She stood by her machine, the plastic cups stacked high and untouched, and for the first time in my life, I heard her silence. It was a very different kind of quiet than the pause between customers.", "\"Lin,\" she said softly. \"They called me.\"", "We did not turn around. Uncle Feng stopped wiping his hands on his apron, and Old Mr. Gao forgot to check his shrimp pond. The air felt heavy, like the moment before a rainstorm that never actually starts falling.", "\"They offered me a booth,\" Auntie Ping said. \"Inside. With air conditioning. And the lights are always on.\"", "She touched the top of her tea machine, her glittery nails brushing against the cold metal with a faint click. I looked at the steam rising from the vents, wondering if it would ever stop.", "\"I won't decide until after the Lantern Festival,\" she said. But she was not looking at us. She was looking at the machine, and her eyes seemed to belong to somebody else, somebody who had already packed her bags and left for a warmer room."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["Ama did not speak, and she did not hum, which was the worst part. The silence from her was heavier than the traffic on the main road. She wiped the same table, the one by the window, three times in a row. She dried it, wiped it, and dried it again, her towel moving in small, tight circles.", "The great pot was cold. I could see it. The steam had stopped rising, and the surface of the broth was still and dark, like a bowl of soup that had forgotten how to be hot.", "I looked at the folded paper in my pocket. My plans. My modern stall. My clean lines. I realized, with a horror that made my knees feel like wet noodles, that I had not been dreaming of change. I had been dreaming of leaving. And now, the thing I had wished for was standing at the end of the lane, glowing, waiting for us to walk away."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "Words", "part": "PART THREE: BOIL OVER", "paras": ["*Ama's Stall Ledger, Night 55. Bowls sold: 21. Words said: 1 (too many).*", "The next night, the lane felt longer. Stretched out like a piece of taffy I had pulled too hard. The stalls were set, the lanterns lit, but the air was thin. Quiet. It lacked the usual hum of plastic stools scraping the pavement and the sharp clatter of chopsticks hitting bowls.", "I stood on my stool to see over the counter. My knees bent under the weight. Ama was wiping a table. Her movements were slow. Careful. She was not humming.", "\"Ama,\" I said, tapping the counter with my pencil. \"We need to adapt.\"", "I took the folded paper from my pocket. It was a drawing I had made at school during math class, using the grid lines to make everything look neat. It showed our stall, but different. The tables were square and white, like the ones in the cafeteria. There was a small screen where the cash box used to be, and the bowls were smaller.", "\"Customers like fast,\" I said, unfolding the paper on the counter with a sharp snap. \"And clean. And modern. We can have a menu board. No one has to ask what is in the soup. They can just look.\"", "Ama stopped wiping. She looked at the paper, then she looked at me. The pot behind her was silent, and the steam had stopped rising."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["Ama picked up the paper and held it with both hands, her rough, dry fingers resting on the white squares I had drawn for the tables. She looked at the little rectangle I had labeled as the screen, then she looked at me. Her voice was very soft. It was not angry, but it was quiet.", "\"You want it to be like everywhere,\" she said.", "My stomach dropped. I tried to fix it. \"I mean, we can keep the soup. Just the... the speed. And the look. It is just efficiency, Ama. It is business.\"", "But the words came out fast and stupid. I felt the heat rising in my face, and I thought of Jun, and the way he had sniffed the air near my desk. I thought of the three times I had scrubbed my hair that week.", "I snapped. \"I am embarrassed, Ama.\"", "The word hung in the cold air."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["The silence that followed was so loud I could hear my own ears popping. It was not the quiet of an empty room, but the thick, heavy pause before a test starts when everyone is too afraid to move.", "Across the aisle, Uncle Feng was still cooking. The sizzle of his oyster oil was very loud. *Hiss. Pop. Hiss.* The smell of frying batter drifted over, sweet and hot.", "Ama put the ladle down. She did not throw it, and she did not yell. She just placed it on the counter with a heavy *clank* that sounded like a dropped dinner plate.", "\"I see,\" she said.", "She turned away to face the big, dark pot. I looked at her back. Her shoulders were hunched, and for a second they looked smaller than I have ever seen them, like a pair of small, tired birds trying to hide under a wing that was too big for them.", "\"I wanted to disappear,\" I whispered. I did not mean to say it, but the words were already out in the cold air. \"I wish, sometimes, we were different.\"", "Ama’s hands, which had been resting on the edge of the pot, stopped moving completely."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["My legs moved before my brain caught up. I ran down the empty lane, past the shrimp-fishing pond where the water lay still and black. The balloon-darts booth sat silent, its bright colors looking dusty and tired under the streetlights.", "I ran until my lungs burned, then stopped at the red roof at the end of the lane.", "The little temple to Mazu was open. The wooden door was worn smooth by years of hands. I pushed it open.", "Inside, the air was cool and dark. Red lanterns hung from the beams, and coils of incense smoke drifted up, thick and grey. On the offering table, three oranges sat next to a cup of tea that had gathered a thin layer of dust.", "I knelt on the cool stone floor. I did not know how to pray. I just sat there, breathing hard, my chest rising and falling under my green jacket.", "\"I didn't mean it,\" I said to the statue. \"I did mean it. I don't know.\""], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["The silence broke with a *swish*. A broom was sweeping near the door.", "The temple keeper stood in the corner, still wearing his straw hat. He stopped and looked down at the stone floor, not at me. Then he picked the broom back up and began to sweep again, sending dust motes dancing in the thin beam of light that cut through the window.", "\"Every family has a smell,\" he said, his voice dry as old toast. \"Some of us hide it. Some of us hang it on a lantern.\"", "He reached into his pocket and pulled out a small paper tag and a pen, holding them out to me. I took them, my fingers trembling as I held the tag for a long time, looking back and forth between the pen and the blank space. I wrote nothing.", "I walked home very slowly through the cold air, stopping at the corner to press my sleeve to my nose. The smell was there: beef, star anise, and ginger. This time, I cried."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "What Ama Never Said", "part": "PART THREE: BOIL OVER", "paras": ["*Ama's Stall Ledger, Night 56. Bowls sold: 30. Stories told: 1. Ama's mood: talking.*", "Sunday was the worst day to be awake. The sun was too bright, and the apartment was too quiet. I sat at the small wooden table, my dark green jacket still on, my shoes still laced. My feet hung over the edge of the chair, toes tapping a rhythm I did not choose.", "The balcony door creaked. Ama stood there, her silver curls slightly mussed, her right wrist wrapped in a white brace. She had been out there since dawn, sitting on the little plastic stool with her knees drawn up. The air smelled of cold concrete and old tea.", "She looked at me, then at the notebook open on the table. The pages were blank. I had not written a single number.", "\"Come,\" she said, her voice rough from the dry air. \"Bring your notebook.\"", "I shook my head. My throat felt tight. \"I do not want to write anything down, Ama. I do not want to measure your soup. I just want it to stop.\"", "Ama stepped over the threshold. She did not look angry. She looked tired, the way the market looks at eleven p.m. when the last stool is being tucked under the table.", "\"Bring it anyway,\" she said."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["Ama pulled out a plastic stool and sat down. She did not sit across from me. She sat beside me, close enough that I could feel the warmth of her shoulder. She began to speak, and her words came out in a slow, low mix of Mandarin and the Hokkien she used with Ba. I had to lean forward, my chin in my hands, just to catch the sounds.", "\"When I was eleven,\" she said, \"my mother had a cart. It was not a stall. It was a cart with four wheels and a tarp that smelled of rain.\" She paused, her left hand rubbing the edge of the table. \"She sold pork bone soup. Beef was too expensive. We had no money for beef.\"", "I looked at her. I could not remember ever asking about before the stall.", "\"I hated the cart,\" Ama said. Her eyes were fixed on a spot on the floor. \"When the girls from school walked by, I hid behind the stove. I pretended I did not know her. I thought if I did not look at it, it would not be me.\" She turned to me, her square face serious. \"You know what that is, Lin? It is the same feeling you have now. It is not about the smell. It is about being seen.\""], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["\"My mother did not have a recipe,\" Ama continued, her voice steady. \"She had a feeling. When winter came and the whole lane caught colds, she put in more ginger. When summer came and sugar cost too much, she used less. The broth changed every year. It was never the same soup two winters running.\"", "She reached out and tapped the table with one finger, making a soft knock that sounded like a pencil on a desk.", "\"When Agong's factory closed, I opened Stall 19. People asked for beef, so I used beef. But the method was hers. There is no recipe, Lin. There is only a river.\"", "Her voice dropped, almost to a whisper, as if she were sharing a secret about a forbidden snack.", "\"My mother stepped in first. I stepped in second. Somebody has to step in third. The water will not look the same, and that is how you know it is still running. A river that does not move is a pond. And ponds get stagnant.\""], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["I swallowed, the taste of salt rising in my throat. \"Nobody told me that. Nobody told me it was supposed to change. I thought it was broken because I couldn't copy it.\"", "Ama shook her head slowly. She lifted her right hand, the one in the brace, and held it up in the light. It trembled, a small, quiet shake like a leaf caught in a draft.", "\"My hand is not what it was,\" she said. \"It will heal, but it will not be the same. I am afraid that the stall will not survive me. I am afraid that if you change it, if you add your own thing, it will stop being mine.\"", "She looked at me, her eyes bright and wet.", "\"I was wrong. A thing that cannot change is a thing already gone. I was trying to keep it safe. I should have been trying to keep it alive.\""], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["I looked down at the notebook. The pencil behind my ear felt heavy. For weeks, I had reached for it without thinking. Now, I did not want to measure. I did not want to count. I just wanted to sit there.", "\"I am sorry,\" I said. The words felt small in the big room. \"I am sorry I thought it was embarrassing. I am sorry I ran to the temple.\"", "Ama reached over and took my hand. Her fingers were rough and strong, even with the brace. \"I am sorry too,\" she said. \"I am sorry I made you carry it all by yourself.\"", "We sat there in the noon light. The smell of star anise and ginger hung in the air, thick and warm. It did not smell like soup. It smelled like us. Then, very quietly, Ama began to hum. It was that old song with no words. I listened, and I let the sound fill the room."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "One Hundred and Twelve Lanterns", "part": "PART THREE: BOIL OVER", "paras": ["*Ama's Stall Ledger, Night 57. Bowls sold: 34. Lanterns made: 112. Volunteers: everyone.*", "The bell above the office door was still ringing when I burst through. Ms. Wu was sharpening a pencil, her bun tight and neat. I explained the whole plan in one breath: hundreds of lanterns, stories, games, and a trail of riddles. We needed Ms. Xu, the city inspector, to see that the lane was more than just stalls. It was a living thing.", "Ms. Wu stopped sharpening. She looked at me, then at the empty classroom, and finally at the cupboard by the door.", "\"I have wanted to do this for three years,\" she said. Her voice was quiet but firm. She opened the cupboard. Inside, stacked neatly like a pile of math textbooks, was a bag of bamboo strips. She pulled them out with a heavy thud. \"I was waiting for someone to ask.\"", "I stared at the bamboo. It smelled faintly of dried grass and sun. \"We can start now,\" I said.", "\"We will need paper,\" Ms. Wu said, turning to the whiteboard. \"And glue. And you will need to be very quiet while I explain how to bend the wood without snapping it.\"", "I nodded, my hands shaking a little from the cold. We had one night to build a dream, and we had the materials."], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["The room turned into a workshop. Bamboo clicked and crunched under our fingers. We dipped strips in water to make them soft, then bent them into squares and circles. The air smelled of wet wood and sweet glue.", "Jun sat at the back, his spiky hair sticking out in every direction. He was building a rooster. Or, at least, he said it was a rooster. It had a long, drooping neck and a crest that looked like it had given up on life.", "\"It’s a chicken who has met a tragedy,\" Hui-Ting whispered to me.", "Jun looked up, his face bright with delight. \"Exactly,\" he said. \"It’s a chicken who has seen the dark side of the oyster omelet.\"", "Yi-Chen stood by the window for a long time, watching us fumble with the paper. She wore her pink puffy vest, which was already getting sticky at the elbows. Finally, she stepped into the circle of desks.", "\"I can draw the designs,\" she said softly. Her voice was small but clear.", "She took a stack of paper and began to sketch. Dragon scales, flowing ribbons, stars. When she held up the first drawing, the class went silent. It was beautiful. It was perfect."], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["By the next night, the lane had transformed. Uncle Feng stood on a stool, hanging a golden omelet lantern the size of a bicycle wheel. \"It’s a symbol!\" he shouted. \"Of our golden, crispy future!\"", "Old Mr. Gao, his straw hat tilted back, was testing his shrimp lantern. He hung it over the fishing pond. \"Now,\" he said, adjusting his spectacles, \"who wants to hear the riddle? Why did the shrimp cross the road?\"", "No one answered.", "\"Because the fish were swimming the other way!\" he announced. The crowd of children burst into laughter, even as they tried to solve the next one.", "Auntie Ping emerged from her tea stall. She held a small, elegant lantern. \"I will run a Lantern Tea tent,\" she said. She did not mention the mall. She did not mention the empty tables. She just smiled, her glittery nails clicking against
