<script>
const D = {"title": "Wren and the Library at the Bottom of the Sea", "sub": "A Story About Reading Out Loud", "pages": [{"no": 1, "ch": 1, "ctitle": "The Words That Swim", "part": "PART ONE: LOW TIDE", "paras": ["*Rule 1 of the Library at the Bottom of the Sea: Every book is a door. Knock gently.*", "The trouble with words, Wren Tidewell had decided, was that they would not stay still.", "They swam. On the page they looked perfectly ordinary, black and small and lined up in rows like well-behaved children, but the moment she looked straight at them they began to wriggle, like minnows in a tide pool, and by the time she had caught one, three more had darted away.", "It was a great pity, because Wren loved stories more than anything in the world.", "She lived in Saltmarrow, a small grey harbor town at the edge of a very large sea, where the fishing boats bobbed at the dock and an old white lighthouse stood on the rocks like a chess piece nobody had moved in years. She was ten. She wore a coral-red sweater, dark-blue overalls and a pair of yellow rubber boots that squeaked. And she had heard, by her own careful count, more than four hundred stories, and could tell every one of them back, word for word."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["In Room 4, on Monday morning, it was reading-aloud time.", "Ms. Alvarez went round the room the way she always did, in a slow circle, and the children read one paragraph each. Ravi Nair went first, because he always did. Ravi read the way a stone skips across water: fast, flat and without a single splash. He finished a whole page before the clock had ticked twelve times, and sat down looking pleased and a little bit lonely, the way he usually did.", "Then it was Wren's turn.", "She looked at the page. The words began to swim. \"The ship sailed into the har...\" she said. \"The har...\" The letters wriggled. Somebody's chair creaked. \"The har-bor.\"", "Nobody laughed. That was the worst part. Room 4 was a kind room, and it went quiet in a kind way, which is the quietest sort of quiet there is, and it lasted for as long as it took Wren to read four more sentences.", "At the end she put up her hand and said she had a stomachache. She didn't. It was only the quiet."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["After school Wren sat on the end of the ferry dock with her boots swinging over the water, waiting for the last boat of the day. Ravi Nair sat down on the other end, a careful yard away, with his brown canvas satchel on his knees. Ravi and Wren had lived next door to each other for six years without ever quite becoming friends.", "\"It's really not hard,\" he said, after a while, in the stiff voice of somebody trying to be kind. \"You just read the words. I read forty-one books this summer.\"", "\"Forty-one,\" said Wren.", "\"Forty-one,\" said Ravi. \"I keep a list.\"", "Wren did not say that she had heard four hundred stories, or that she could still tell him the one about the lighthouse keeper's goat. She did not say that telling a person to \"just read the words\" was like telling a person to \"just swim.\" She only nodded, and looked at the water, and wondered how a person could read forty-one books and still look so alone doing it."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["The last ferry of the day was called the *Gull*, and it was the smallest and most crooked boat in the harbor, white with a blue stripe and a funnel that puffed. Wren's dad was its pilot. His name was Ben Tidewell, and he was a tall, brown, bearded man in a green wool cap, and he knew the tides the way other people know their own front doors.", "On the ride home across the bay the *Gull* rocked and the gulls wheeled, and Wren sat in her usual place on the wooden bench by the wheelhouse, and her dad told her a story.", "It was about a crab who thought he was a captain and a captain who thought he was a crab. Wren listened with her whole body. She tapped the rhythm of it on her knee. By the time the boat bumped the dock she knew it by heart, every word and every pause, and it was hers forever.", "\"Dad,\" she said, \"why can I remember everything I hear and nothing I read?\"", "He thought about it all the way to the mooring rope. \"Stories aren't in the words, Wren-bird,\" he said. \"The words are only the boat.\""], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["That night Wren lay in her attic room under the sloping roof with the window open a crack, listening to the sea.", "On the wall beside her bed hung the tide table, a long chart of numbers that her dad updated every month in his slow careful handwriting. High tide, low tide, high tide, low tide, the sea breathing in and out, day after day. Wren knew what every number meant, because he had sung her the rhymes.", "Every few seconds the beam of the old lighthouse swept across her ceiling, white and slow and silent.", "She lay there and wished, not out loud, because wishes are shy, for one place in the world where words held still. Just one. A place where she could read as slowly as she liked, and nobody would ever go quiet.", "Far out beyond the harbor, and far down under all that dark, something enormous and patient turned over in its sleep."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Upturned Boat", "part": "PART ONE: LOW TIDE", "paras": ["*Rule 2 of the Library at the Bottom of the Sea: A library is only closed when its last reader stops coming.*", "The Saltmarrow Library lived in an old customs house that looked exactly like a giant upturned boat. It sat on the cobblestones with its curved roof rising like a hull, and the door creaked with a long, wooden sigh every time it opened. Inside, the air smelled of old paper and dried salt, a scent Wren loved more than any chocolate biscuit.", "Mrs. Pell stood by the desk, her white curls puffing like sea foam. Her tortoiseshell glasses slid down her nose on a beaded chain. She saw Wren, who was still in her yellow rubber boots, and gave a small, silent nod. She did not ask about homework. She did not ask about the stomachache. She just pointed to the reading nook, tucked safely in the curve of the hull, and went back to stamping a return with a heavy *chunk*.", "Wren slipped into the nook. The wood was warm and smooth, shaped by years of small backs leaning against it. She tapped the rhythm of her heartbeat on her knee and settled in, feeling the whole world fall away."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["Mrs. Pell did not make Wren read aloud. Not once. Not even when the words swam and wriggled like minnows in the shallow end. Instead, she would climb into the nook with a book under her arm, settle her long grey skirt, and read to her. Her voice was soft and dry, like sandpaper on a smooth stone, but it made the stories land right in the middle of Wren’s chest.", "When Mrs. Pell finished, she would close the book and wait.", "Then Wren would tell it back. Every word. Every pause. The way the goat blinked. The way the lighthouse keeper coughed. She could do it without looking at the page, without a single letter swimming away.", "Mrs. Pell would smile, a tiny crinkle appearing by her eyes. \"That is reading too, dear,\" she would say, tapping the cover of the book. \"It is just reading by ear first.\" And Wren would feel her shoulders drop, the knot in her stomach loosening just enough to let her breathe."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["On the door, pinned right at eye level, was a notice. It was yellow, official, and very flat. It said that the Harbor Council would vote on the last day of summer. If they voted yes, the library would close. The building would be sold.", "Mr. Hollis Grubb, the chair of the Council, stopped to tie his shoelace. He was heavyset, with a big grey mustache that twitched when he was worried. He wore a brown tweed suit that looked too small for him, and a gold watch chain that clinked against his belt.", "\"Terrible leak in the roof,\" he said, not looking up. \"Costs are up. It is a budget thing, really.\" He stood up, brushed a speck of dust from his knee, and walked away without waiting for an answer.", "Mrs. Pell straightened her cardigan. She did not say anything. She just picked up a stray thread and held it between her fingers, her face as calm as the surface of the harbor at noon."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["In the poetry corner, a small bucket sat on the floor, catching the steady, cold drips from the ceiling with a sound like *plip, plip, plip*. The water smelled of rain and old wood, and it had been there for weeks, growing heavier until the bucket was nearly full. Wren watched the ripples spread and settle, then spread again, while a single drop hovered on a beam of dust, waiting. She wanted to ask Mrs. Pell if they could fix it, but she knew the answer before she asked because the money was in the Council’s pockets, or the Mayor’s, or somewhere else where Wren’s yellow boots couldn’t reach.", "\"Books don’t close, dear,\" Mrs. Pell said quietly. She was shelving a book, her movements slow and sure, and she did not look at the bucket. \"People just stop opening them.\"", "Wren looked at the bucket again. It was full now. One more drop, and it would spill over the poetry, and the words would swim away for good."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["Wren walked home along the sea wall, the wind pulling at her coral-red sweater. The old white Saltmarrow Light stood on the rocks, silent and tall. Her boots squeaked on the wet stones. She was angry. She was sad. She was ten years old, and she had no idea how a girl who couldn’t read could save a library.", "But she tapped the rhythm on her knee anyway. One for the leak. Two for the vote. Three for the words that swam.", "She promised herself, right there on the wall, that she would fix it. She didn’t know how. She didn’t have money. She didn’t have a magic wand. But she had her ears, and she had her memory, and she had a secret she was just beginning to suspect: the sea had heard everything, and maybe, just maybe, it had something to say back."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "The Storm Tide", "part": "PART ONE: LOW TIDE", "paras": ["*Rule 3 of the Library at the Bottom of the Sea: Anything borrowed must be returned, however long it takes.*", "The storm did not knock; it simply arrived, a grey wall of wind that pressed its flat face against the attic windows.", "Inside, the rain hammered the slate roof with a sound like a thousand tiny fists, and the attic room shuddered beneath Wren’s head. She lay in bed, her ears pressed flat against the pillow, counting the seconds between the white flash and the crack of thunder. One, two, three, four.", "She was good at counting, and she was also good at being brave, though it felt a lot like being scared and refusing to admit it. The lighthouse beam swept past her window, stumbling through the rain, long and pale and lonely.", "Down in the kitchen, she could hear her dad. He was checking the mooring lines on the *Gull*, ensuring the little ferry was tied up tight. The boat would not go out tonight, because the sea was too angry, and the sea, Wren knew, did not like to be told what to do.", "Wren tapped the rhythm of the storm on her knee. Tap, tap, tap. It was a scary rhythm, but it was a steady one. She closed her eyes and listened to the house hold on, and the sea hold on, and her hold on."], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["When the thunder finally rolled past, her dad climbed the attic stairs. He smelled of salt and wet wool, like a sock left on the deck. He sat on the edge of her bed, careful not to kick the wooden footboard.", "\"Big one,\" he said. His voice was low and warm, settling into the room like a heavy quilt. \"The kind that washes things clean.\"", "Wren sat up, her curls bouncing. \"Dad, do you think the sea is angry?\"", "He smiled. It was a small, tired smile, the kind he gave after a long day of mooring ropes. \"The sea is not angry, Wren-bird. It is just loud. It has a lot to say, and it forgets how to whisper.\"", "He began to tell her a story. It was not one she knew. It was old, older than her, and it smelled of damp paper. It was about a ship that sailed off the map with a cargo of stories, and a library that sank with it, settling into the deep sand where the current runs slow.", "\"Did they find it?\" Wren asked.", "Her dad shook his head. \"No. Nobody ever found it.\" He paused, looking out the window at the churning dark. \"But nobody ever stopped looking.\""], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["Dawn arrived in soft grey layers, the storm having washed the world clean.", "Wren pulled on her yellow rubber boots. They squeaked. *Squeak-squeak* went her left foot, then *squeak-squeak* her right. It was a rhythm she had mastered by age six.", "She stepped over the threshold into air that tasted of salt and wet stone.", "The beach was a new place, rearranged by the night’s fury.", "Kelp lay in dark, tangled ribbons, sticky and heavy. Driftwood, pale and smooth, stuck out of the sand. Shells, small and white, scattered across the wet surface like spilled sugar that had refused to dissolve.", "Wren walked the tideline.", "She always did after a storm. It was a ritual, as important as brushing her teeth, only less likely to end with a tooth in the sink. She looked for things the sea had lost, or things it had found. She tapped her knee as she walked, keeping time with her own footsteps. A secret beat. Only she could hear it.", "The sea wall stood tall and white. The lighthouse was silent above it. The water was flat now, a mirror of grey.", "There was no sound but the drip of water from the rocks and the distant cry of a gull.", "It felt like the world was holding its breath."], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["Halfway along the wall, where the white stone met the damp sand, something caught her eye. It was not a shell, and it was not a piece of driftwood. It was a shape, a thick rectangular block that sat half-buried in the wet surface.", "Wren crouched down and brushed the sand away with her palm. A cover emerged. It was green, worn, and smooth, the color of deep water, and it felt heavy in her hands, like a loaf of bread made of stone.", "She pulled it free. It was warm.", "That was the strange thing. The water had covered this spot all night, and the storm had been violent, yet when she turned the book over, the pages inside were dry. Perfectly, impossibly dry.", "She looked at the cover. There was no title. No author. Just a smooth, green surface that reflected the grey sky.", "Wren’s heart beat fast. She tapped her knee. One. Two. Three. She was not supposed to be curious, because curious things usually broke, but this thing felt like it was waiting for her."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["She opened it.", "The smell hit her first, not the dry dust of the library or the brine of the harbor, but the sharp, clean scent of rain on hot pavement mixed with something green and growing, like a garden after a storm.", "Wren looked at the first line, bracing herself for the usual chaos, ready to chase the letters as they darted away into the white margins.", "They did not move.", "The words lay there, black and small, lined up in neat rows that refused to break, holding their places with a patience that felt almost rude. They were still. They were quiet. They were waiting for her to be ready, not for her to be fast.", "Wren stared, her breath hitching in her chest as she reached out a hand to hover over the page, her fingers trembling slightly in the cool morning air.", "The words did not swim. They did not blink or wriggle or hide in the tide pool of the paper. They just sat there, solid and sure, like boats tied up at a dock, keeping their promises.", "For the first time in her life, the words stayed exactly where they were."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "The Book That Held Still", "part": "PART ONE: LOW TIDE", "paras": ["*Rule 4 of the Library at the Bottom of the Sea: Fines may be paid in stories.*", "Wren sat back on her heels, the wet sand cold against her knees. She took a breath, held it, and let it out in a slow stream. \"There is a kind of rain,\" she whispered, her voice small in the morning air, \"that falls only on Tuesdays.\"", "The letters did not care. They stayed put. Black ink on cream paper, stubborn as little nails. Wren leaned forward, her nose almost touching the page. She read the next line. Then the next. The words waited for her, patient and solid, not darting away or hiding in the margins. They just stood there, holding their places so she could catch them one by one.", "She read a whole paragraph. Then a whole page. The sun climbed higher, warming the damp wool of her coral-red sweater. She read another page, her eyes moving slowly, carefully, like a turtle crossing a smooth stone. The tide, which had been receding, turned its mind. A thin ribbon of sea water crept up the beach, lapping gently at the toes of her yellow rubber boots. She did not notice. She was too busy falling into the story, page by slow, happy page."], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["The book was called *A Book of Small Weathers*. It was not about big storms that broke windows or waves that swallowed boats, but about the little moods of the sky. There was a short story about a drizzle that sulked for three days because the sun had been rude to it, and a fog that had fallen in love with a lighthouse and refused to let go of its beam.", "Wren read the part about the sulky drizzle out loud. Her voice shook with laughter. \"It was so wet,\" she giggled, \"it was actually embarrassed to be wet.\"", "A grey heron stood on one leg in the shallows, its long neck jerking as one round, orange eye blinked in deep offense.", "Wren clamped a hand over her mouth, but it was too late.", "The laugh came out anyway, a small, high squeak. The heron tilted its head and judged her before wading away into the mist, leaving a trail of muddy footprints in the sand. Wren wiped her eyes. It was the best thing she had ever read. The words felt like warm bread."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["When she finished the last small story, Wren turned the page.", "There was nothing there but a blank space, save for a rectangular bookplate pasted firmly in the center of the front cover. The lettering was deep purple, elegant and old-fashioned. THE LIBRARY AT THE BOTTOM OF THE SEA.", "Below it, a stamp had been pressed into the paper, faded to a rusty brown. OVERDUE.", "A small card, yellowed and curled at the edges, was tucked under the stamp. The handwriting was looping and faded, written in ink that had turned brown with age. *Please return to the Returns Door at the foot of the Saltmarrow Light, at the lowest tide. Fines waived for the honest.*", "Wren read it twice. The words held still.", "She read it a third time. Her heart began to beat a steady, heavy rhythm against her ribs. A library at the bottom of the sea. A door at the foot of the light. And a fine.", "Fines are serious business.", "Which meant she had borrowed something. Or rather, someone had borrowed something, a very long time ago, and never brought it back."], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["\"Hey.\"", "The voice came from behind her, sharp and close. Wren jumped, the book slipping out of her hands. She snatched it up and shoved it behind her back, then quickly pulled it down under her coral-red sweater, pressing it against her chest.", "Ravi Nair stood at the edge of the dunes, his blue-and-white striped shirt bright in the morning light. He held his brown canvas satchel in one hand, the other hand tucked into his khaki shorts pocket. He had been walking the beach line, his red sneakers dusty, his eyes scanning the sand with the intensity of a detective.", "\"What have you got?\" he asked. He did not look at the sand. He looked at her chest, where the book was now creating a noticeable bump under her sweater.", "Wren’s mouth went dry. She had never lied to Ravi. They had lived next door to each other for six years, sharing the same sky and the same tide, and lying to him felt like stepping on a landmine. But she could not tell him about the library at the bottom of the sea. Not yet.", "\"Just a piece of driftwood,\" she said, her voice thin and squeaky."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["Ravi frowned. It was a small frown, the kind a child makes when trying to solve a math problem they do not want to solve. He knew a lie when he heard one. He had heard them all, from the teachers, from the council, from the wind. He knew the specific sound of someone trying to hide something important.", "\"Driftwood,\" he repeated, slowly. \"In August. On a high tide beach.\"", "Wren nodded, her face burning hot. She pulled her hood up, even though the sun was warm, and turned away from him. She began to walk back toward the town, her boots crunching loudly in the sand. The book was heavy against her chest, warm and solid. It felt like carrying a bird that was ready to fly.", "She felt like a thief. She also felt like a treasure-finder. She walked faster, her curls bouncing, the words in the book humming softly against her skin, holding their places, waiting for the lowest tide."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "The Lowest Tide", "part": "PART ONE: LOW TIDE", "paras": ["*Rule 5 of the Library at the Bottom of the Sea: The lowest tide opens the smallest door.*", "The flashlight beam cut a yellow tunnel through the dark attic. Wren lay on her stomach, the *A Book of Small Weathers* propped open on a stack of pillows. She read one line. Then another. The words stayed put. They did not wriggle or dart or swim away. They sat there, black and stubborn and kind, like cats asleep on a warm doormat.", "She read two whole pages before her eyes grew heavy. When she finally closed the book, her heart was beating a fast, happy rhythm against her ribs. She tapped the spot on her knee where the story had lived, just to make sure it was still there. It was.", "Then she sat up and crawled to the wall. The tide table hung there, a long strip of paper with her father’s careful handwriting. She traced the numbers with her finger, looking for the lowest mark. There it was. The morning after next.", "\"Full moon, low moon,\" she whispered, remembering her dad’s rhyme from the *Gull*. \"The sea goes far to see.\"", "The beam of the lighthouse swept across the ceiling, white and slow, sweeping over her face as she watched the numbers."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["Wren crept down the stairs, her yellow boots making a soft, squeaking whisper on the wooden steps. In the kitchen, the air smelled of cold salt and yesterday’s tea. She found a scrap of paper on the counter and wrote three words in her best handwriting: *Checking the rocks.*", "She slipped the book into her satchel. It was heavier than it looked, solid and warm against her hip. Outside, the sky was the color of wet slate, a pale pearl-grey that promised rain but delivered only mist. The street was empty. The shops were closed. The harbor was quiet, except for the low, rhythmic breathing of the water.", "As she walked toward the headland, the sea pulled back. It drew itself away from the sand, exposing patches of dark weed and smooth, wet stones. She had never seen the water so far away. It felt as if the ocean had taken a deep breath and was holding it, waiting for something.", "The rocks of the lighthouse loomed ahead, dark and sharp against the grey sky."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["The wind smelled of brine and old stone. Wren climbed the slippery rocks, her fingers digging into the crevices for balance. The lighthouse stood above her, tall and white and silent, its beam cutting through the morning fog. But she was not looking up. Her eyes were fixed on the very base of the tower, where the stone wall met the ancient rock.", "There, hidden in a shadow, was a door.", "It was small, no bigger than a barrel lid, and painted a deep, faded green. The frame was thick with barnacles, hard and white and clustered like tiny teeth. In the center of the door sat a brass slot, polished bright by years of hands. The slot was shaped exactly like an open book, its pages curved and waiting.", "Wren stared at it. Her mouth went dry. The sea, just a few feet away, lapped gently against the stone with a soft, patient sound. It was a door for stories."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["Wren pulled the book from her satchel. It felt warm in her hands, a steady heat that didn't match the cold morning air. She lifted it to the brass slot. The metal was smooth and cool against her palms.", "She took a trembling breath. Slid the book in.", "It went in with a soft sigh.", "Then came the sound. A deep, resonant *chunk* that vibrated through the rocks and into her bones. It sounded exactly like the head stamp on the desk in Mrs. Pell's office, only ten times larger. The green door swung open on silent hinges, releasing a rush of air that smelled of salt and old paper.", "Behind the door, a spiral of water held itself up in the air. It glowed with a soft, inner light, a pale blue that looked suspiciously like the light from a flashlight under a pillow. It wound down into the dark, a staircase made of glass and moonlight.", "Wren stared. She tapped her knee.", "A small white shell on a cord dropped into her waiting hand. It was heavy, heavier than it looked, and a note was tied to it with a piece of kelp."], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["The shell was cool, smooth, and heavy, with ridges that fit into her palm like a puzzle piece. It felt like holding a cold stone from the creek bed. The note was written in a neat, elegant hand. Wren read it twice. The words held still. That was a new thing. Usually, they swam away when she looked at them, but here they stayed put, patient and black.", "She looped the cord around her neck. The shell rested against her chest, over her heart. It ticked softly against her skin. A second beat. A secret rhythm that matched the sea.", "Wren looked at the Spiral. The water glowed, deep and blue. She did not know what waited at the bottom. She did not know if she was ready. But she knew the book had found her. She had stopped hiding.", "She took a breath. The salt air filled her lungs.", "\"Right,\" she said to the water. Her voice was steady. \"One page.\"", "She stepped onto the first glowing step."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "The Returns Desk", "part": "PART TWO: THE LIBRARY AT THE BOTTOM OF THE SEA", "paras": ["*Rule 6 of the Library at the Bottom of the Sea: Whisper. The deep carries every sound.*", "The Spiral wound down through water that was green and thick, full of drifting lights. Wren kicked her yellow boots against the glowing steps. Each step hummed under her weight, a low, steady note. The water closed over her head, but she could still breathe. It was strange. It was wonderful. It felt like walking into a room where the doors had been taken off their hinges.", "The air in her lungs felt cool and clean, like the first sip of cold water on a hot day. She opened her mouth to say hello, but her voice came out small and echoing, a bubble that popped before it finished.", "At the bottom of the Spiral, the water cleared. A door stood there, round and enormous, made of white coral and old brass. It had no handle, only a large, smooth button in the center. Wren pushed it with her whole body. The door groaned, a deep, wooden sound that vibrated in her teeth."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["The door swung open with a sigh, and Wren stepped into a hall that rose far above her head, vanishing into a ceiling of glowing glass. Shelves lined the walls, packed with books that seemed to breathe, and the air smelled of salt and old paper, a scent so strong it made her eyes water.", "Behind a desk the size of a dining table sat Madame Ottoline. She was a huge plum-purple octopus. Eight arms were busy with work. One held a book. Another held a stamp. A third gripped an inkwell. A fourth was already pressing a return slip. She wore pearl pince-nez spectacles and a silver ribbon draped over her head like a sash.", "Ottoline did not look up. She stamped, *chunk*, turned the book, and stamped again, *chunk*. It was the steady rhythm of someone who had done this a million times before.", "\"Overdue,\" she said. Her voice was smooth and formal.", "She finally looked at Wren. Her eyes were dark and deep.", "\"By two hundred and twelve years.\""], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["Wren clutched the book to her chest, where it felt heavy, warm, and solid against her ribs. \"I found it,\" she said, her voice small in the large room. \"On the sand. It was dry.\"", "Ottoline tilted her head, her pince-nez sliding slightly down her beak. From behind the desk, a small cuttlefish darted out into the open space. He was teal and gold, with wavy pupils that looked like ripples in a pond. As he stared at Wren, he turned a bright, shy pink, the color spreading across his skin like blush on an apple.", "\"The borrower is Wren Tidewell,\" Ottoline said. She adjusted her spectacles with one careful arm. \"The fine, however, is waived for the honest. We ask only for one story, told aloud. A story from the surface. Something true.\"", "Wren felt her stomach drop into her boots. Told aloud. She looked down at her yellow rubber boots, which seemed to vibrate against the cold stone floor.", "\"Any story?\" she whispered.", "\"Any story,\" said Ottoline, her tone gentle but firm. \"Even a small one.\"", "Squib the cuttlefish floated closer, his color shifting to a curious gold. He watched Wren with wide, wavy eyes, waiting to see if the girl would speak or swim away."], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["Wren’s throat tightened. The words swam in her mind, but here, in the quiet of the hall, they seemed to freeze. She looked at the shelves. Thousands of books. Thousands of stories. And she could only read them slowly, painfully, with her finger under the line.", "\"I... I can't read well,\" she said. The words came out tiny, like a mouse squeaking. \"The words swim. I’m the slowest reader in Room 4. I hide it. I make up stomachaches.\"", "The hall went very quiet. The glowing glass above seemed to dim. Ottoline’s eight arms went still. The stamp hovered in the air. The inkwell stopped moving.", "Ottoline leaned forward. Her voice was gentle, softer than the water. \"A story does not have to be read, child. It only has to be told.\"", "Wren blinked. The fear in her chest did not leave, but it made room for something else. Something smaller. Braver."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["Wren took a breath. She thought of the *Gull*, rocking in the dark. She remembered the storm that night, the waves breaking over the rail. She saw her dad, Ben, standing at the wheel, his green wool cap pulled tight against the wind.", "She told the story. She spoke it word for word, exactly as he had told it to her in the boat. She did not read it. She did not chase the words. She let them flow out of her, like water slipping over a smooth stone. She described the rain, the sharp smell of salt, the low rumble of the engine. She talked about the fear, and then the sudden, deep calm.", "When she finished, the hall was silent. The glowing glass above shimmered. Squib, the small cuttlefish, turned the bright gold of a happy sun.", "Ottoline dabbed one eye with a silver bookmark. She picked up the stamp.", "\"Fine paid in full,\" she said.", "She stamped the book one last time. *Chunk.*"], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "The Growing Stacks", "part": "PART TWO: THE LIBRARY AT THE BOTTOM OF THE SEA", "paras": ["*Rule 7 of the Library at the Bottom of the Sea: Books grow best when they are read.*", "Squib hovered beside Wren’s boot, his color shifting from a cautious teal to a bright, excited gold. He had never met a surface child. He had read about them, in the archives, but reading about a person is very different from watching one wobble in yellow boots.", "\"Follow me,\" he said, his voice squeaking slightly with enthusiasm. \"The Growing Stacks. They are not like your dry, dusty piles. Here, books are alive.\"", "Wren followed him into a wide corridor where the water was clear and warm. The floor was not sand, but a soft, green moss. And there, sprouting from the sea floor, were the books.", "They looked like coral. Thick, sturdy stems rose up, and from them burst the covers. Some were wide and flat, like the shells of clams. Others were tall and thin, like the fronds of a sea fan. They swayed gently in the current, not with wind, but with a slow, rhythmic pulse, as if they were breathing.", "Wren reached out. Her fingers brushed a blue cover. It felt warm. It felt like holding a hand.", "\"They grow,\" Squib said, turning a proud pink. \"They need the story to stretch them. Without a reader, they stay small. They stay shy.\""], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["Squib led her to a row of particularly large books. They were the size of dinner plates, their covers thick and textured.", "\"Look,\" he whispered.", "One of the books was glowing. A soft, amber light pulsed from its pages, a gentle heartbeat of light.", "\"It is ripe,\" Squib said. \"A new story has finished growing. It takes a year for one page to unfurl. Sometimes longer.\"", "A silver hook, thin and delicate, drifted down from above. Squib caught it with one sucker. He carefully plucked the glowing book from its stem. It detached with a soft *pop* and drifted into Wren’s hands.", "It was light. Surprisingly light, for something so heavy with story.", "Wren brought it to her nose. It did not smell like old paper and dust. It smelled like salt, and warm sun, and the crisp air of a morning sail. It smelled like the best part of a story, right before the twist.", "The book hummed against her palm. A single line of text shimmered on the first page, visible through the cover. It whispered, just for her, the first word of its name.", "Wren felt a small, sharp ache in her chest, like a bubble rising to the surface."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["A shadow moved in the water ahead, huge and green and covered in white barnacles. Wren froze, her breath catching in her throat.", "Squib turned a worried grey, his little body stiffening. \"Do not move. Do not speak. That is Bartleby.\"", "The turtle blinked, a process that took a full minute for his heavy eyelids to lower and rise again. \"Excuse me,\" he said, his voice deep and rumbly like a boat engine starting up in the dark. \"I am looking for a book about... patience. I have been looking for it for three years. It is still on the shelf.\"", "Squib poked Wren’s arm with a gentle suction. \"He is the Slow Shelf,\" he whispered. \"He carries the books that need the most time. He is very wise. And very, very slow.\"", "Bartleby tilted his head, looking first at Wren’s yellow boots, then at the glowing book in her hands. \"You are holding a new one,\" he observed.", "\"Yes,\" Wren said.", "\"Good,\" Bartleby replied. \"There is no hurry in a good book.\"", "He spoke so slowly that Wren had to wait a full minute to hear the last word. In that minute, the water seemed to stand still, and the anxiety in her chest, the fear of the swimming words, just settled."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["Squib guided Wren away from the Slow Shelf and into a vast, round room where the ceiling vanished into the dark blue water above. Strings of small, amber-gold fish hung from the heights, draped in long, swaying chains.", "They looked like lanterns, hundreds of them, though most were dim. Their light flickered faintly, like a candle struggling against a draft, while others curled their little bodies up to sleep.", "\"The Lantern Hall,\" Squib said, his voice quiet as he faded to a dull, worried grey.", "Wren looked up. The pale glow cast long, soft shadows on the water below, making the room feel beautiful and a little bit sad. It was like looking at a town where everyone had gone to bed except for the streetlights that were running out of oil.", "\"Why are they so dim?\" she asked.", "Squib drifted closer but kept his eyes fixed on the fish.", "\"Because they are hungry,\" he said. \"They feed on sound. On stories. On the sound of a voice reading aloud.\"", "He paused, letting the silence settle around them.", "\"And nobody has read to them for a very, very long time.\""], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["Wren stared at the dim fish. They swayed in the current, their tiny lights barely visible against the dark water. It was a strange kind of quiet. Not the quiet of a library, where the silence is full of waiting. This was the quiet of a held breath. The quiet of a door that has been closed for so long that the hinges have rusted shut.", "She felt a strange feeling in her chest. It was not fear. It was not sadness, exactly. It was a tightness. A pressure, like the water pushing against her eardrums. It felt like the lowest tide, when the sea pulls back and leaves the rocks bare and cold.", "She looked at Squib. He was watching the lights, his wavy pupils wide.", "\"Can they be woken up?\" she asked. Her voice sounded small in the big, round room.", "Squib turned a hopeful pink, then quickly back to grey. \"Yes,\" he said. \"But you have to give them something to shine on. You have to read.\"", "He looked at her, then at the dim, sleepy lights above.", "\"It is not hard,\" he said, but his voice wavered. \"It is just... lonely. To be the only voice.\"", "Wren looked at the book in her hands. It was still warm. It was still glowing, just for her."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "Never Chase a Word", "part": "PART TWO: THE LIBRARY AT THE BOTTOM OF THE SEA", "paras": ["*Rule 8 of the Library at the Bottom of the Sea: Never chase a word. Sit still and let it settle.*", "The reading room was round and soft, the walls lined with shelves that curved like the inside of a clam. In the center sat a circle of chairs shaped like open shells, their edges worn smooth by centuries of tiny feet. Madame Ottoline arranged her eight arms around a small, plain book. It was not glowing. It was not growing. It was just a book, and it looked tired.", "\"Read one line,\" Ottoline said, her voice a low, gentle rumble. \"Any line. I will be very quiet.\"", "Wren picked up the book. The paper smelled of salt and old rain. She looked at the first line.", "The words swam.", "They wriggled and slipped past her eyes, sliding off the page and into the water. Her ears burned hot, a prickly heat that crawled up her neck. She closed the book and opened it again. The letters danced.", "\"I cannot,\" Wren whispered.", "Ottoline did not move. She did not blink. She simply waited, her three hearts beating a steady, patient rhythm in her chest.", "Wren looked at the small, cuttlefish apprentice hovering by her shoulder. Squib was grey, his wavy pupils wide with worry.", "\"The words,\" Wren said, her voice shaking. \"They won't stay still.\"", "It was the first time she had ever said it out loud to anyone. The air in the room held its breath."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["Ottoline’s arms shifted, a soft rustle of ink and paper. She did not look disappointed, nor surprised. She looked at Wren the way a tide looks at a stone: with a deep, slow understanding.", "\"Of course,\" Ottoline said. \"They are water creatures, after all. They prefer to swim.\"", "She leaned forward, and for a moment her pince-nez slipped down her nose. \"In my first century of service, I knew a reader who could not sit still. His legs kicked. His eyes darted. He called the words 'busy bees.' He was my best friend, Wren. He read the deepest books in the archive.\"", "Wren’s knees felt weak, and she sank into her shell chair, the cushions cool against her overalls.", "\"Many of my best readers began as swimmers,\" Ottoline continued, her tone dry and kind. \"The words are not broken, dear. They are simply... energetic. We do not need to stop them. We need to give them a place to land.\"", "Squib turned a hopeful pink, his little brass key jingling softly. \"Yes,\" he said. \"A place to land. Like a bird. But... a word-bird.\"", "Wren looked at the book. The words were still swimming, but they seemed to be waiting now, their little strokes pausing in the water. They were looking at her.", "\"Show me,\" Wren said. \"Please.\""], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["Ottoline reached out with two arms and pulled a curved piece of green sea glass from behind her back. It was smooth, thick, and glowing with a faint, inner light. She placed it flat over the first line of the book.", "The other lines faded into the background, blurring into a soft grey haze. Only the line under the glass remained sharp and clear. The words slowed, then stopped wriggling, settling into their rows, black and small and quiet.", "\"Never chase a word,\" Ottoline said softly. \"Put a small window round it and let it come to you.\"", "Wren looked through the glass. The letters were still. They were waiting for her, like guests at a table who had been asked to sit down and wait for the host.", "\"Read it,\" Ottoline said. \"Slowly. Take your time. The glass will move when you are ready.\"", "Wren’s chest felt tight, her breath coming in short, sharp rushes. She took a deep breath, tasting the salt air. She looked at the first word.", "\"Th,\" she said.", "The word held. It did not swim. It stayed right there, under the green glass, waiting for the next one."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["\"Th... e,\" Wren said.", "She slid the glass one letter to the right, and the word settled. Moving it again, another word landed.", "It was strange, like trying to catch a cold jelly bean while wearing mittens, except here the jelly bean was a letter and the mittens were her own hands. The glass was the only thing that made the sea hold its breath for her.", "Wren read the next word, then the next, while five minutes passed in the silent water around them. Ottoline did not move, and Squib stayed perfectly still, his teal skin turned a calm and steady gold. Time seemed to stretch and thin, like a piece of taffy pulled slowly between two fingers.", "Wren’s fingers trembled on the edge of the page, but the words did not swim. They waited for her. One by one, they lined up, and one by one, she caught them without a single splash.", "When she finished the paragraph, she looked up to find the glass at the bottom of the page.", "It had taken five minutes. It was the slowest five minutes of her life, and it was the happiest."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["Ottoline’s eight arms arranged themselves into a polite clap, making a soft, wet sound like rain tapping gently against a windowpane.", "\"Well done,\" she said, her voice smooth as polished shell. \"Bravely done.\"", "She picked up the piece of green sea glass and placed it gently into Wren’s palm, where it felt warm and hummed with a tiny, low vibration that traveled up her arm and settled deep in her chest.", "\"On permanent loan,\" Ottoline said, adjusting her pince-nez. \"You may keep it. It is yours, as long as you need it. And Wren?\"", "\"Yes?\"", "\"You do not have to finish a book in a day, nor in a week. There is no hurry in a good book.\"", "Wren looked down at the glass in her hand, then back at the page. She had finished one paragraph. It was a start, a door she had just walked through.", "Squib turned a bright, happy gold. \"I will get the stamp,\" he said."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "The Deep Stacks", "part": "PART TWO: THE LIBRARY AT THE BOTTOM OF THE SEA", "paras": ["*Rule 9 of the Library at the Bottom of the Sea: A book no one opens slowly turns to sand.*", "Squib’s colors flickered, a nervous patchwork of pink and grey. He tapped his brass key against his cuttlebone. *Click. Click. Click.*", "\"Rule six,\" he whispered, \"says we should stay in the bright places. But you need to see where the silence lives.\"", "Wren followed him down a spiral stair. It had no bottom. The warm, amber glow of the Lantern Hall faded behind them, replaced by a cold, flat grey. The air here did not smell of salt and old paper. It smelled of damp stone and dust. It felt heavy, pressing against her ears, as if the water above were thicker, denser, refusing to let her breathe easily.", "They walked for a long time. Wren counted her steps, tapping the rhythm on her knee, but the sound was swallowed instantly by the vast, hollow silence. The shelves on either side were tall and narrow, stretching up into a darkness she could not fathom. There were no lanterns here. Just the dim, lifeless light of the deep.", "\"This is the Deep Stacks,\" Squib said, his voice thin and reedy. \"Where the books go when they have been waiting a very, very long time.\""], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["The deeper they went, the more the color drained from the world. The vibrant blues and greens of the coral gardens were gone. Instead, everything wore a uniform, pale grey.", "A slow cloud of silt drifted along the shelves. It was a lazy, silent fog that settled on the books like a dusty blanket.", "Wren reached out and touched one. It was a thick volume with a cover that had once been deep blue. Now it was the color of oatmeal. As her fingers brushed the edge, a fine dust of pale sand trickled down her wrist.", "She opened it.", "Expecting words, she found nothing. The pages were loose, dry flakes. A story about a whale, she realized, though she could not see the title.", "The words were not swimming here.", "They were simply gone.", "The book crumbled in her hands. It collapsed into a pile of soft, white sand that slipped between her fingers and settled on the stone floor.", "It was not a tragedy, exactly. It was just a quiet ending. Like the last note of a song fading into the wind."], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["\"Nobody reads them,\" Squib said. He had turned the color of a storm cloud, his W-shaped pupils wide and dark. \"So the Drift takes them. One shelf a year. It is not mean. It is just... patient.\"", "A clatter, loud and sharp, shattered the quiet. *Click-clack. Click-clack.*", "From the shadows of the next aisle emerged Captain Clack. He was as big as a wheelbarrow, his red-orange shell gleaming dully in the dim light. He wore a small blue captain's cap, tilted slightly to one side. One of his claws was tipped with a brass cap that clicked against the stone floor with every step.", "\"Who goes there?\" he barked, his voice like two stones grinding together. He looked at the pile of sand, then at Wren. \"You are in the Deep Stacks. This is restricted. The silt is active today.\""], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["\"Captain Clack, please,\" Ottoline’s voice floated down the aisle, smooth and unbothered. She glided between the shelves, her eight arms carrying a heavy, leather-bound book. The silver ribbon bookmark draped over her head shimmered in the gloom. \"We are merely observing the Drift.\"", "Clack clicked his jaws, a warning sound, but he stepped aside. Ottoline approached Wren, her pince-nez adjusting with a soft *click*. She opened the heavy book. The pages were thin, like pressed leaves, and the ink was faded, brown and brittle.", "\"May I show you something, Wren?\" Ottoline asked. She turned to a page near the back. The handwriting was old, the loops of the letters shaky and uncertain.", "Wren looked closer. Her breath caught in her throat.", "The name in the faded ink was her own. *Wren Tidewell, aged ten.*"], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["Wren stared at the name. It looked exactly like her own scrawl, that messy, hurried sort she used in her school notebooks when the bell was about to ring. Beside it, in a different, smaller hand, was a list of items.", "*Borrowed: A Book of Small Weathers.* *Returned: Never.*", "\"I didn't know,\" Wren whispered. Her voice sounded very small in the big, quiet room, swallowed by the shadows of the shelves. \"I didn't know I was supposed to be here.\"", "\"Anyone can return a book, child,\" Ottoline said. Her voice was gentle, and firm, like a heavy door closing softly. \"That is the whole point of a library. It is not about who you are. It is about what you choose to open.\"", "Wren looked up from the ledger. The dim, grey light of the Deep Stacks seemed to pulse, rising and falling in a slow, rhythmic fading. The Drift hovered nearby, indifferent and eternal, waiting for something to happen. She realized then that saving this place was not just about one book, or one fine, but about keeping the door open for everyone who might need it, even if they were slow."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "Squib's Question", "part": "PART TWO: THE LIBRARY AT THE BOTTOM OF THE SEA", "paras": ["*Rule 10 of the Library at the Bottom of the Sea: Every reader was once a beginner.*", "Squib perched on the edge of a book that was sprouting new leaves of text, his tiny brass key swinging gently as he shifted the color of a bruised peach.", "\"What is a school?\" he asked.", "Wren tapped her knee, finding the rhythm of the answer. \"It is where we go to learn, but mostly it is where we sit in circles and wait for the bell.\" She leaned forward to explain. \"The bell is very loud. It sounds like a crab snapping its claws, but meaner.\"", "Squib turned a shade of worried grey. \"And the ferry? You said your father pilots one.\"", "\"The *Gull*,\" Wren said, thinking of the smell of salt and diesel and her dad’s old wool cap. \"It is white with a blue stripe. It is small and crooked. It goes to Gannet Island, which is just rocks and gulls and a very stubborn sheep.\"", "Squib blinked his W-shaped pupils. \"And rain? From underneath?\"", "Wren smiled, because this was her favorite question. \"From underneath, it looks like the sky is washing its face.\" She described the thousands of silver threads falling into the water. \"And when it hits the dock, it sounds like applause, but for a very boring play.\"", "Squib turned a bright, happy gold. \"I would like to see that,\" he said. \"But I am afraid of the sky. It is very far away.\""], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["Wren told him about the Saltmarrow Library. She described the shape of the old customs house, which looked like an upturned boat resting on the cobblestones. She described the smell of dust and dry paper, and the way the light came through the high windows in the afternoon, turning the dust motes into slow, golden snow.", "She told him about Mrs. Pell, who wore a plum-purple cardigan and never rushed anyone. She told him about the vote. The Harbor Council was deciding whether to close the library at the end of summer.", "Squib went from gold to a flat, muddy grey. His wavy pupils widened.", "\"A library that closes?\" he whispered. \"Then where do the stories go?\"", "Wren did not know. She had thought about it every day since she heard the news. She had imagined the books stacking up, or being burned, or being put in boxes in the attic. But none of those answers felt right. Stories were not things you could box up. They were air. They were light. If you closed the door, did they just stop?", "\"I don't know,\" Wren said. Her voice sounded thin in the quiet of the Growing Stacks. \"I hope they don't.\"", "Squib floated closer to her, his little arms twitching. \"That is a very bad thing,\" he said. \"A library that closes is a heart that stops beating.\""], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["A deep, rumbling sound came from the shadows near the Slow Shelf. Bartleby the turtle blinked one slow, ancient eye. He had a small bookcase strapped to his shell, and he was dozing with his eyes half-closed.", "\"The tide is turning,\" Bartleby said. His voice was like gravel shifting in a bucket. \"You must go before the Spiral closes. I am always on time, child. Even if I am very slow.\"", "Wren scrambled to her feet. She realized she had been sitting there for an hour. She had forgotten the time, which was a new and terrifying experience for her.", "Madame Ottoline emerged from behind a shelf of encyclopedias. She was enormous, her plum-purple arms wriggling with books. One arm held a small, round stamp. Another held a card the size of a postage stamp.", "\"Your visit is over,\" Ottoline said. She stamped the card with a soft *chunk*. \"A borrower's card. One only. Use with care.\"", "Wren took the card. It was warm, and it hummed slightly in her hand, like a bee trapped in a jar.", "\"The door is waiting,\" Ottoline said. \"Do not be late. The sea does not like to be kept.\""], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["The Spiral was not a staircase. It was a rush of silver water that pulled at Wren’s boots and lifted her up, up, up. The water was cold and clear, and it hummed against her ears. The moon-shell around her neck let her breathe, so she simply floated, letting the current carry her toward the light.", "She saw the surface above her, a bright, shimmering disc. It got closer until it was all she could see. Then, with a gentle *pop*, she was out.", "Wren stumbled onto the wet sand. The air was thick and salty, and the sun was high and hot. The sea was coming back in, a long, slow wave lapping against the base of the Returns Door. The brass slot was empty.", "She looked down at her yellow rubber boots. They were perfectly dry. There was not a single drop of water on them. Not even on her socks.", "She laughed. It was a small, surprised sound. She was underwater, and she was dry. That was impossible. That was wonderful.", "The tide was rising, and the door was disappearing into the foam. Wren had to run."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["The dock was empty, except for Ben.", "He stood by the mooring rope of the *Gull*, his back to her. His green wool cap and navy sweater were damp, and he watched the water with the stillness of a man waiting for a very long bus.", "He turned when he heard her boots on the planks. His face was tight, but his eyes were warm.", "\"Where were you, Wren-bird?\" he asked. His voice was gruff, with a thread of worry in it, like a loose rope.", "\"Shell hunting,\" Wren said.", "It was the first real lie she had ever told him. It felt heavy in her mouth, tasting of salt and iron.", "Ben looked at her boots. He looked at her face. He said nothing, just nodded slowly, and went back to checking the rope.", "Wren stood there, holding her hand over her heart, feeling the lie settle in her pocket like a heavy stone. It was smooth and cold, and it would stay there until she found a way to set it down."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "The Lanterns Flicker", "part": "PART THREE: THE DRIFT", "paras": ["*Rule 11 of the Library at the Bottom of the Sea: The Glimmers do not grade. They only glow.*", "For seven days, Wren visited at low tide. She checked the chart on her wall, counted the hours, and walked to the lighthouse with her boots squeaking in the damp grass. Each time, the sea opened its mouth, and she slipped through.", "The Library was quiet, but it was a waiting quiet. Madame Ottoline’s arms moved in a blur of silver and ink, stamping returns with a satisfying *chunk*. Squib hovered nearby, his wavy pupils wide, changing from gold to teal and back again.", "\"Shelf-mark,\" he said, holding up a tiny book with a blue cover. \"Where does it go?\"", "Wren tapped the rhythm on her knee. She looked at the number. \"Section four, row two.\"", "Squib turned pink. \"Correct. You are very good at this.\"", "It was true. With the sea-glass guide laid over the page, the words settled. They did not swim. They just sat there, patient and black, waiting for her to catch them. She read a page with pictures of kelp forests. She read it again. The second time, it felt like home."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["\"Ready?\" Ottoline asked. Her pince-nez glinted in the dim light, and she pointed one of her eight arms toward the Lantern Hall.", "Wren swallowed hard, her throat tight with nervousness. The air in the hall was thick and cold, smelling strongly of salt and old paper. Strings of Glimmers hung from the ceiling, dim and amber, looking like lanterns that had forgotten how to shine.", "She walked to the center of the room, her boots feeling heavy on the sandy floor. She opened the book, finding the story about a whale who had lost his song.", "\"The whale,\" Wren said, her voice coming out as a thin, shaky thread. \"The whale went out to sea.\"", "For a second, nothing happened at all. Then, far above, a single Glimmer flickered to life. It brightened into a warm, steady gold, and the light spooled down soft and warm, touching her face. It felt like sunlight, even though she was deep underwater.", "Wren looked up at the gentle glow. It did not judge her mistakes. It just shone. She felt a happiness so big it made her chest ache, a brightness that spread through her like the last warm moment of a sunny afternoon."], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["She turned the page, her fingers trembling against the damp paper.", "\"And the whale sang a song that was...\" Wren stumbled. The word ahead was long, with too many syllables. It wiggled on the page, not swimming, but resisting, like a stubborn knot in a rope that refused to loosen.", "She tried again. \"A song that was... loud.\"", "The Glimmer above her flickered. It dimmed, then flared, and finally went dark. A string of ten more followed, extinguishing in a row as if they had been snipped by invisible scissors.", "Silence rushed in, heavy and pressing against her eardrums. Wren looked up to find the dark Glimmers hanging motionless. They hung there as if watching, and in the dark she was sure she could feel them judging her.", "She shut the book, her face burning as hot as a kettle. Without waiting for a stamp or a single word of explanation, she turned and ran. Her yellow boots slapped against the stone floor, leaving the warm gold light behind in the gathering dark."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["She found a gap behind a tall shelf of encyclopedias and slid down until she sat on the cool stone, pulling her knees tightly to her chest so no one could see her face.", "Squib drifted through the narrow space, his body a worried grey that looked exactly like the sky before a rainstorm. He hovered in front of her, his wavy pupils spinning as he watched her.", "\"You left,\" he said.", "\"They were laughing,\" Wren whispered, her voice barely loud enough to be heard over the hum of the water. \"They saw me stumble.\"", "Squib changed color, shifting from grey to teal and finally to a hesitant pink. \"No,\" he said gently. \"They do not laugh. They are lights. Lights do not have mouths.\"", "He tapped one of his fins against her knee with a soft *tap-tap*. \"I have watched a hundred readers, and the Glimmers flicker whenever a reader takes a breath. It is not a mistake, it is just the light blinking. It is how they say, 'I am here.'\"", "A shadow fell over them, and Ottoline’s arms hovered in the air, holding a wobbly stack of books. She adjusted her pince-nez with a delicate touch.", "\"They do not grade,\" she said, her voice smooth and firm. \"They only glow. A stumble is not a failure, dear. It is just a pause in the song.\""], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["Wren looked at the dark gap behind the shelf. It was still there, but the heaviness had lifted, and now it felt like a door waiting to be opened rather than a wall blocking the way.", "\"I...\" she started, her voice thin.", "\"Take your time,\" Ottoline said, adjusting her pince-nez. \"The tide is turning. You have one hour.\"", "Wren stood up. Her legs felt weak, like the legs of a chair that had been sitting in the rain for too long. She walked back into the Lantern Hall where the Glimmers hung above her, silent and waiting. She opened the book and placed the curved sea-glass guide over the line.", "The words settled. They stayed still.", "She read the next line. It was short, and it was simple.", "The light came back. It was not a flash, but a slow, steady warmth that spilled down over her hair and shoulders. It held. It did not flicker, and it did not fade.", "Wren closed her eyes. The happiness was still there, but now it was mixed with a small, sharp fear that it might stop. She opened her eyes, checking carefully. The light was still there.", "\"I am going home,\" she said, her voice small.", "\"Good,\" Ottoline said. \"A good story does not need to be finished today.\""], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "Ravi Follows", "part": "PART THREE: THE DRIFT", "paras": ["*Rule 12 of the Library at the Bottom of the Sea: Secrets weigh more underwater.*", "The classroom smelled of chalk dust and warm plastic, a heavy scent that made Wren’s eyelids feel like they were weighted with wet sand. She tapped the rhythm of a story on her knee, but the story was about yesterday’s tide, not the poem on the page. The words swam, as they always did, blurring into grey fish that darted away before she could catch them. She looked down. Ravi Nair sat three desks away, his side part perfectly straight, his red sneakers still on the floor. He was reading, and he was always reading. He turned a page with a snap that sounded like a dry twig breaking.", "\"Stomachache again?\" he said. It was not a question. He did not look up from his book.", "Wren straightened her back. \"I didn't say that.\"", "\"You didn't need to,\" Ravi said. He closed his book. The sound was small, but it landed heavily in the quiet room. \"You just look at the page, Wren. You look at it like it owes you money. Then you go quiet. It’s getting old.\"", "Ms. Alvarez rubbed her temple, a slow, tired gesture. \"Ravi, please. Wren, would you like to try the next line?\"", "Wren opened her mouth. The words on the page wriggled and fled."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["That night the moon was a thin sliver, a knife cutting the sky. Wren sat at her desk, the tide table spread out before her. Low tide at half past six. The numbers were clear, black and obedient. She picked up her pencil. She wrote *Tell Ravi* in the margin. Then she wrote *Tomorrow*.", "She looked at the word *Tomorrow*. It swam.", "She pushed the pencil away. The room was quiet, save for the tick of the clock and the distant, rhythmic sound of the sea against the pier. Outside her window, the lighthouse beam swept across the dark water, white and slow. She lay in bed, listening to the waves. They sounded like they were whispering a secret she couldn't quite catch.", "The secret was heavy. It sat in her chest, a stone in a shoe. She rolled over. The pillow was cool. She thought of Ravi’s face, stiff and sharp. She thought of the lanterns in the deep, glowing soft and warm. She thought of the words that held still.", "She slept, and the dream was of water, and the water was kind."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["Dawn was the color of wet paper when Ravi laced up his red sneakers. He had been counting. Seven mornings. Seven times Wren had vanished before the sun was fully up. Seven times he had watched her door close, and seven times she had come back with salt in her hair and a secret in her eyes.", "He followed her, keeping a careful distance. He stepped over the pebbles on the sea wall so he made no sound, while Wren walked fast, her yellow boots splashing in the shallow pools left by the ebbing tide. She did not look back, but she reached the foot of the lighthouse, where the rocks were slick with algae and the air smelled of salt and old stone.", "Ravi ducked behind a pile of drying fishing nets, the rough twine scratching his nose. He watched her stop at the sea wall, not looking at the water, but staring fixedly at the stone itself. The wall was grey and solid, just a wall, with no sign of a door or a handle.", "Then Wren reached into her pocket. She pulled out something small and white, a moon-shell that caught the early light. She held it up, and her hand was trembling, holding that tiny, bright thing against the dark, cold grey of the rocks."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["Wren held the shell to her ear. She listened for a long, careful moment, until the faint hum of the tide matched the beat of her own heart.", "Then, with a soft click, a seam appeared in the stone.", "It was not a crack. It was a door. Small, round, and framed in brass that glowed with a thin, blue light, like a nightlight left on in a hallway.", "Wren stepped forward. The water rose around her yellow boots, cold and clear, but she did not wade. She stepped onto a staircase of liquid, spiraling down into the dark. It was solid beneath her feet, a bridge made of glass.", "Ravi’s mouth opened. He took a step forward. His sneaker slipped on a pebble.", "He grabbed the rough twine of the drying nets, knuckles white, and watched the girl he knew, the one who hid her reading trouble with jokes, walk down into the sea.", "The water closed over her head. The door clicked shut. The brass ring settled with a heavy, final *chunk*.", "The wall was solid again. The water lapped at the rocks, indifferent and cold.", "Ravi stood there. His hand still gripped the twine. His heart beat in his ears, a loud, rushing sound that drowned out the gulls. He looked at the wall, then at the water, and finally at the sky, which was turning from grey to gold."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["He waited while the sun climbed higher and the gulls began their noisy circling. In his head, Ravi ran through the list of forty-one books he had finished that summer. He had read them to finish, to check them off his list, to be done. He had never paused to listen.", "The door clicked.", "Wren emerged, dry from her boots to her hair. She stepped onto the rocks and shook her head, water flying from her curls like beads. She looked at him.", "\"I know you followed me,\" she said. Her voice was small. It did not sound like a challenge. It sounded like a wound.", "Ravi wanted to say *I saw the door*. He wanted to say *Please tell me*. But the words swam in his mouth, and he knew, with a sudden, sick certainty, that he could not catch them. He could not explain why he had followed her. He could not explain why it mattered.", "He turned and walked away, his red sneakers pounding a loud, angry rhythm on the gravel.", "Wren stood alone on the rocks, the sea breathing out behind her."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "The Notice", "part": "PART THREE: THE DRIFT", "paras": ["*Rule 13 of the Library at the Bottom of the Sea: Do not lock away what you love.*", "The Saltmarrow Library smelled of cardboard and salt. Mrs. Pell stood on her tiptoes, stacking a box onto a pile that already reached the top of the reading nook. Her tortoiseshell glasses trembled slightly on their beaded chain as she adjusted a cover that did not fit.", "\"Three buckets,\" she murmured, nudging a red pail. The poetry corner, once a single bucket of dog-eared volumes, had multiplied. Now it was a small army of red plastic, spilling over with verses that needed homes.", "Wren sat in the corner, her yellow boots squeaking against the wooden floor. She watched Mrs. Pell wrap a thick atlas in brown paper. The librarian’s hands were steady, but her shoulders were hunched, like a child trying to hide under a desk.", "\"Mrs. Pell?\" Wren asked.", "Mrs. Pell paused. She looked at the box, then at Wren. \"We are being thorough, dear. Just in case. A library does not simply leave. It packs its things.\" She smoothed the paper with a sigh that sounded like a wave pulling back from the sand."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["The front door creaked open, letting in a gust of hot air and the smell of frying onions. Mr. Grubb stepped inside, his gold watch chain glinting in the dusty light. Behind him stood a man with a long tape measure draped around his neck.", "Mr. Grubb did not look at the books. He looked at the walls. He tapped the plaster with a knuckle. \"Good acoustic,\" he said, his voice soft and polite. The man with the tape measure pulled the ribbon out, sliding it across the floorboards.", "\"It's only a building,\" Mr. Grubb added, as if this were a comfort. \"And a very leaky one, at that. The roof is a worry.\"", "Mrs. Pell went very still. She did not turn around. Her fingers tightened on the brown paper until her knuckles whitened. Wren felt the air in the room grow heavy, thick with the scent of old glue and quiet dread. The man’s tape measure clinked against a bookend, a small, metallic sound that seemed to echo in the sudden silence."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["That night, Wren lay in her attic room, listening to the sea breathe outside her window. She tapped a rhythm on her knee, the steady beat of a question she could not answer.", "The Library at the Bottom of the Sea was dimming. The lanterns flickered when Wren made a mistake, and the Deep Stacks were turning to grey sand. The Saltmarrow Library was boxing itself up. Two libraries, one on each side of the sea wall, both fading because no one was opening the doors.", "\"Books don't close, dear,\" Mrs. Pell had said. \"People just stop opening them.\"", "Wren closed her eyes. She could see the Glimmers, those little amber fish, dimming in the dark water. She could see the cardboard boxes in the reading nook. It was the same problem. It was the same silence. And silence, she knew, was a weight that could crush a story."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["Dad was mending a net when Wren told him. She did not say all of it. She just said there was a place that needed her. It was wonderful, and it was broken, and she had to help.", "Ben stopped working. He took off his green wool cap and turned it over in his hands, slow and careful. He did not ask where the place was. He did not ask if it was safe. He only listened, his dark eyes steady and warm.", "\"The sea keeps her own hours,\" he said finally. His voice was low, rough with kindness. \"If you have to go, you go. But you come back. The tide brings everything home, Wren-bird. Even the lost things.\"", "He squeezed her shoulder, a small, solid weight. Wren felt the fear in her chest loosen, just a little, like a knot in a rope giving way."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["Wren looked at the tide table on her wall. The numbers were black and clear, a promise written in ink. The lowest tide was in three days.", "She would go back. She would find Madame Ottoline, that enormous purple octopus with her pince-nez, and she would ask the question that had been growing in her mind like kelp in the current.", "How many readers did it take to keep the lanterns bright?", "It was not a math problem. It was not a list to check off. It was a question about light. And if the light was fading, then perhaps the answer was not one person, or two, or ten. Perhaps the answer was everyone. Wren picked up her moon-shell necklace and held it in her palm, feeling the cool weight of the deep against her skin."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "The Warden", "part": "PART THREE: THE DRIFT", "paras": ["*Rule 14 of the Library at the Bottom of the Sea: You cannot save a library by locking it.*", "The Deep Stacks were darker than usual. Grey silt hung in the air, thick and heavy, tasting of old dust. Captain Clack scuttled out from behind a row of fading books, his red-orange shell clicking against the stone floor. He was the size of a wheelbarrow, and he wore a small blue captain’s cap that sat slightly askew.", "He slammed his brass-capped claw onto the Returns Desk. The sound rang out, sharp and final.", "\"We cannot wait for readers who never come,\" Clack said. His voice was a low rumble that vibrated in Wren’s teeth. \"The Drift has taken another shelf. I have counted them. I will seal the Deep Stacks with stone doors. We save what remains. That is the only logic left.\"", "Madame Ottoline did not move. Her eight arms were folded neatly over her pearl-rimmed pince-nez, and her silver ribbon bookmark draped lazily over her head. She looked at Clack, then at the grey cloud swirling in the distance, and finally at Wren, who stood clutching her moon-shell.", "\"Logic,\" Ottoline said softly, \"is a dry word for a wet problem.\""], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["Clack shifted his weight. *Click-clack, click-clack.*", "\"Two hundred and twelve years,\" he said. \"The last borrowers stopped coming. I watched half the library turn to sand. I do not intend to watch the rest disappear. It is better to lose half than all.\"", "Ottoline unfolded one arm, then another, until all eight were spread wide.", "\"You are counting pages, Captain. You are not counting stories. The Deep Stacks hold the oldest tales. The ones about the first tides and the first words. If you lock them away, they do not just fade. They forget how to be.\"", "\"You worry about memory,\" Clack snapped, his eyes narrowing. \"I worry about survival. A library that is empty is not a library. It is a ruin. And I will not let my home become a ruin.\"", "Wren listened to the hard, sharp edges of his words. She thought of the Saltmarrow Library, the boxes Mrs. Pell was packing, and the quiet silence growing in the reading nook. She thought of the words that swam in her eyes, the ones she could not catch.", "A sinking feeling settled in her stomach.", "Clack was not wrong about the silence. He was only wrong about the cure."], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["Wren opened her mouth, then closed it. She looked at the grey silt, then at Clack’s hard, red eyes. She remembered the rule Ottoline had taught her, the one about doors.", "\"You can't save a library by locking it,\" she said, and her voice came out louder than she intended, carrying across the water like a stone skipping across a pond. \"That's the whole point of one.\"", "Clack froze. His claw, still raised from his bang on the desk, hovered in the air. The blue cap tilted further.", "\"What do you mean?\" he said, and for the first time, his voice was not a rumble. It was small. It was the sound of someone who had been carrying a heavy weight for a very long time and was suddenly afraid it might drop.", "Wren looked at her moon-shell. It was cool and smooth in her hand. She thought of the words that held still in the book she had found on the sand. She thought of the lanterns that only glowed when someone read to them.", "\"I mean,\" she said, \"that a door is only a door if someone is on the other side waiting to open it. If you close it, it’s just a wall.\""], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["Clack did not answer. He scuttled forward, his legs a blur of red segments, until he was looming over her. He was so big that the water displaced by his movement pushed against Wren’s chest. His eyes were huge and black and full of a worry that looked like anger.", "\"You are a surface child,\" he said, his voice low and dangerous. \"You read like a fish swimming upstream. You stumble. You fumble. You make mistakes.\"", "Wren’s throat tightened. She wanted to argue. She wanted to tell him about the words that held still, about the sea-glass guide, about the way her dad read the ship’s log with a finger under each line. But the words caught in her throat, just like they always did.",
