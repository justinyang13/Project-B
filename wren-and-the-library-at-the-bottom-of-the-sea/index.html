 "\"And you will leave,\" Clack continued, his claws clicking together. \"They always leave. The tide turns, and you go back to your world of noise and light. What use are you? You cannot keep the lanterns bright. You cannot stop the Drift. You are just a child who cannot even read her own name without stumbling.\""], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["The words landed in Wren’s chest, heavy and cold, like a stone dropped into deep water. She looked down at her boots, the yellow rubber now dull in the dim light. She wanted to shout back. She wanted to say that she could read, that she was learning, that she loved stories more than anything.", "But she couldn't.", "The Glimmers, the strings of amber-gold fish hanging from the ceiling, flickered. Their light wavered, then dimmed, reacting to the silence that stretched between them.", "Wren opened her mouth. Her lips trembled. The truth came out, plain and quiet and sharp.", "\"I'm not any use,\" she whispered. \"I can barely read.\"", "The Glimmers went dark.", "Wren turned. She did not look back at Clack, or at Ottoline, or at the grey cloud swirling in the distance. She ran. Her yellow boots squeaked against the stone floor, a small, lonely sound in the vast, fading dark."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "What Dad Said", "part": "PART THREE: THE DRIFT", "paras": ["*Rule 15 of the Library at the Bottom of the Sea: Slow readers read deepest.*", "The sea wall was cold and wet under her boots. Wren scrambled up the rocks, slipping once, her yellow soles squeaking against the slick stone. Her eyes stung. The salt air hit her face, sharp and clean, but she could not breathe properly.", "Ben Tidewell sat on the edge of the wall, his legs dangling over the water. He held a thermos in one hand and a small, warm cup in the other. He did not look surprised to see her. He just looked tired, and sad, and ready.", "\"Hi, Wren-bird,\" he said. His voice was low and steady, like the water lapping at the rocks below.", "\"I didn't go far,\" he added, turning to face her. \"I just waited. I saw the light on the water. It looked... worried.\"", "Wren slid down beside him. Her knees knocked together. She wanted to cry, but her throat felt tight, as if a knot had formed there and refused to loosen. She looked at the horizon, where the dark blue sea met the darker sky.", "\"Dad,\" she whispered.", "\"I'm here,\" he said. He passed her the cup. It was tea, hot and sweet, with a slice of lemon floating in it.", "She took it. The warmth seeped into her palms, pushing back the chill that had settled in her bones."], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["Wren drank the tea. It tasted like home, and like safety, and it made her stomach ache less. She told him about the words. Not just the ones that swam, but the ones that ran away, the ones that hid in the corners of the page, and the ones that whispered she was slow.", "She told him about the stomachaches, the lies, and the quiet in Room 4 that felt heavier than any wave. And then, because he was her dad and he had the thermos and the patience of a stone, she told him about the door in the sea wall. She told him about the octopus with the pince-nez, the fish that glowed only when you read to them, and the crab who said she was useless.", "Ben listened. He did not ask questions. He did not fix it. He just watched the gulls wheeling above the harbor, their wings beating the air in slow, sure circles.", "\"I'm not any use,\" Wren said, and the words came out smaller than she wanted them to.", "Ben nodded. He looked at the gulls, and then at her. \"Tell me about the crab,\" he said. \"What did he say, exactly?\"", "\"He said I can't save them. He said I'm too slow. He said the books are turning to sand because I'm useless.\""], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["Ben reached into his navy sweater and pulled out a thick, leather-bound book, the ship's log for the *Gull*, its cover worn smooth and its edges frayed from years of salt and use.", "\"Look,\" he said, opening it to a recent entry.", "The words were cramped and slanted, written in ink that had faded to a soft, tea-stained brown. Ben did not just look at them. He placed his index finger under the first line, then the second, moving it slowly and deliberately to track each word as if he were counting steps in the dark.", "\"I was the slowest reader in my class, Wren-bird,\" he said, his finger stopping on the date. \"I still am. I learned the tide tables as rhymes because it was quicker than reading the columns. I still do it that way.\"", "Wren stared at his finger. It was steady and strong, and it was not hiding.", "\"You read with a finger?\" she asked.", "\"Sometimes,\" he said. \"It helps the words stay still. Just like yours, maybe, if you find the right way to hold them.\"", "He closed the book. \"I didn't tell you. I was afraid you'd think I was broken.\"", "\"I didn't think you were broken,\" Wren said. \"I thought you were magic.\""], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["Ben leaned back against the stone, the roughness pressing through his navy sweater. He looked at Wren, and his face held an expression she had not expected. It was not pity, and it was not surprise. It was a deep, quiet pride, settled in him like sand on the sea floor.", "\"Slow readers see everything,\" he said. \"Fast readers skim. They miss the texture. They miss the weight. Slow readers stay with each word. They let it sink in.\"", "He gestured to the dark water beyond the wall. \"That is why you remember every story. You do not just listen. You live inside it. You let it breathe.\"", "Wren blinked. The tight knot in her throat loosened, just a little.", "\"So I am not useless?\" she asked.", "\"No,\" he said. \"You are thorough. That is a very different thing. And much more useful, if you ask me. Useless people do not notice when the light changes color.\"", "Wren looked at the sea. The faint pulse of the lantern below was still visible in the dark. She thought of the Glimmers, silent and dim, and the books slowly turning to sand.", "She took a breath. It felt easier than the last one."], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["Wren leaned her head against his shoulder. His sweater smelled of salt and diesel and warm wool, a scent that felt as safe as the bottom of a sleeping bag.", "A small, rusty laugh came out of her, like a gate hinge that had been stuck for a whole summer.", "\"I'm going back down,\" she said.", "Ben didn't look surprised. He just nodded, his beard brushing her hair. \"Of course you are.\"", "\"I'm going to bring the truth. Not just the book. Me. The slow me. The me who stumbles.\"", "Ben put his arm around her shoulders, pulling her close. Behind them, the ferry *Gull* rocked gently in the harbor, creaking its wooden joints in the dark. Above, the lighthouse beam swept across the sky, white and slow and patient, searching for something that wasn't lost, only waiting.", "Wren closed her eyes. She didn't need to see the words right now. She just needed to know they were there, holding still, ready for her.", "\"Right,\" she said. \"One page.\""], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "Ravi Sees the Library", "part": "PART FOUR: THE SPRING TIDE", "paras": ["*Rule 16 of the Library at the Bottom of the Sea: Two readers see more than one.*", "Lunch was a blur of clattering trays and the smell of fish stew. Wren found Ravi at the far end of the cafeteria, his brown canvas satchel on his lap. He ate his sandwich with surgical precision, taking small, careful bites.", "Wren sat down opposite him. She did not tap her knee. She did not joke.", "\"You were right,\" she said.", "Ravi stopped chewing. He looked at her, eyes wide and bright under his side-parted hair. \"About what?\"", "\"The lie,\" Wren said. \"I lied. I'm hiding something. And I'm sorry.\" She held his gaze, her heart beating a steady rhythm against her ribs. \"Come with me tomorrow at half past six. To the lighthouse. I'll tell you the truth.\"", "Ravi set his sandwich down. He did not ask what the truth was, nor why she was hiding it. He simply nodded, once, stiffly, like a pine tree bending in the wind.", "\"Okay,\" he said.", "He picked up his sandwich again but did not eat it. He just held it, watching Wren with a quiet intensity that made her feel both seen and safe. For the first time in six years, the space between them felt less like a gap and more like a bridge."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["The lighthouse rocks were wet and cold, the tide out. The sea was a flat sheet of silver under the moon. Wren stood by the small round door in the sea wall, the brass slot glinting.", "Ravi arrived on time. He wore his striped shirt and red sneakers, his satchel hugged to his chest like a shield. He looked at the door, then at the sea, then at Wren. He did not ask if this was real. He had never believed anything he could not read in a book, and this door was right there, solid and salt-stained.", "The brass slot gave a small cough, as if the sea had been expecting company, and a second white moon-shell dropped into Wren's hand, cool and smooth as a pearl. She held it out.", "\"For you,\" she said.", "Ravi took it. His fingers were trembling slightly. He put it on the cord around his neck, the way Wren had.", "\"Ready?\" she asked.", "Ravi nodded. He stepped onto the Spiral, the glowing water stair that descended into the dark. His red sneakers made no sound on the wet stone. He looked back once, his face pale but determined, and then he stepped down into the deep."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["The Library at the Bottom of the Sea was not dark, but lit by the soft, amber glow of the Glimmers, those lantern fish hanging in strings that looked like beads on a necklace. The air smelled of old paper and salt.", "Ravi stood in front of the Returns Desk, frozen stiff, while his eyes jumped from the book gardens to the Slow Shelf, and finally to the eight arms of Madame Ottoline, who was stamping a return with a heavy brass thud.", "Squib hovered beside Wren, turning every color in the rainbow before settling back to teal and gold, and then to a shy, blushing pink.", "Ottoline looked up, her pince-nez slipping down her nose, and smiled a wide, tentacled expression of delight.", "\"A fast reader!\" she said, her voice bubbling. \"We have not had one in ages. Fast readers are exactly what the Growing Stacks need to sort the ripe books. Welcome, young scholar.\"", "Ravi opened his mouth, closed it, and opened it again. He looked at Wren, his eyes wide with wonder, and for the first time, his stiffness seemed to melt away."], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["Ottoline extended a single arm, presenting a small volume with a blue cover. She placed it gently into Ravi’s hands.", "\"This is *The Lighthouse Keeper’s Goat*,\" she said. \"A classic. Tell me, young reader, what was it about?\"", "Ravi’s face fell. He stared at the cover, then at the title, his mind drawing a blank. He remembered finishing it, sliding it back onto his shelf, and counting it as book forty-one. But the story itself? It had slipped through his fingers like wet sand.", "\"I...\" he started. \"It was... good?\"", "Wren stepped forward. She had never opened the book, yet the rhythm of it lived in her bones.", "\"It was about a goat who was afraid of the dark,\" she said quietly. \"And a keeper who was afraid of the quiet. They were afraid of each other, until they realized they were just lonely.\"", "Ravi looked at Wren, then at the book, and finally at his own hands, which felt strangely empty.", "\"I don't think I've ever really read a book,\" he whispered. \"I've only finished them.\""], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["The words hung in the water, heavy and true. Ravi’s shoulders slumped, and the stiffness that had defined him for six years cracked to reveal something fragile and young underneath. Wren looked at him without feeling superior or even a little bit triumphant. Instead, a strange, warm kinship settled over her, like finding the last missing piece of a jigsaw puzzle she hadn’t known she was solving.", "She reached out and gently took the book from his hands, then held it out to him again, not as a test, but as an invitation.", "\"Then read one with me,\" she said.", "It was not a command, nor a lesson. It was simply an offer, a door left open. Ravi looked at the book, then at Wren, and finally at the Glimmers, which were glowing a little brighter, as if listening.", "He nodded. He sat down on the edge of the Returns Desk, his red sneakers dangling over the glowing water, and opened the book to the first page.", "\"Okay,\" he said. \"But you go first.\""], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "Two Readers", "part": "PART FOUR: THE SPRING TIDE", "paras": ["*Rule 17 of the Library at the Bottom of the Sea: One voice makes a candle; a thousand make a sun.*", "Ravi cleared his throat, refusing to meet Wren's eyes. His gaze skimmed across the line with the frantic speed of a hawk spotting a field mouse.", "\"The... lighthouse... keeper... fed... the... goats,\" he announced, then immediately looked up, waiting for a mark to be placed next to his name.", "Wren tapped the rhythm on her knee. Once. Twice. \"Wait,\" she said. \"Read it again. Slower.\"", "Ravi blinked. \"I read it. It was correct.\"", "\"Read it to me,\" she said. \"Not to the clock.\"", "He hesitated, the water around the desk remaining still and dark. Then, with the stiff precision of someone operating a complicated machine, he began again. He stretched each word out, letting them hang in the air.", "As he finished, a small string of Glimmers, no longer than a finger, drifted down from the ceiling. It pulsed once with a soft amber glow, then hummed. It was not a sound, but a warmth.", "Ravi stared at the light, having never seen a book do that. He looked at Wren, and for the first time, his face was not trying to be something else. It was just listening."], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["\"Now you,\" Wren said.", "She held her sea-glass over the next line. The curved piece of glass did not change the words, but it changed the way they moved. Under its shadow, the letters settled. They stopped wriggling and sat down, like students in a quiet class waiting for their turn.", "Wren read. It was slow, and it was very slow. She stumbled over the word \"mossy\" and had to start the sentence again.", "Ravi did not look away. He did not check the time. He listened to the sound of the words, the way they bumped into each other, the way \"salt\" tasted dry and \"sea\" tasted cold.", "Then Wren read the joke about the crab who wore a brass cap.", "Ravi snorted. It was a short, sharp laugh, surprising in the quiet water. He looked at the page, then at Wren. \"I didn't catch that the first time,\" he admitted. \"I just saw the word 'crab' and moved on.\"", "\"Go back,\" Wren said.", "He went back. He read the joke again, just to hear it. He did not do it because it was required. He did it because it was funny, and because it was there."], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["They read together, not racing but talking, trading lines back and forth until the water held every word.", "It was like passing a bowl of soup back and forth across a table, no one dropping a spoon, no one rushing. Wren read a sentence, and the water kept it. Ravi read the next, and the water caught that one too.", "Above them, the Glimmers did not just glow; they bloomed.", "One amber fish lit up. Then ten. Then a hundred. The Lantern Hall, which had been dim and grey for over two hundred years, began to shine. The light spread out in a wide, golden swath, washing over the books, the desks, and the spiral stairs. It was warm and bright, the color of honey, smelling faintly of old paper and salt.", "Far away, in the deep, dark corner of the Deep Stacks, the grey silt that was slowly turning the books to sand paused. It curled in on itself, shrinking back from the nearest shelf, retreating from the light.", "The Library was breathing again."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["Squib, the small teal cuttlefish, floated near the ceiling. He was bright gold. His wavy pupils were wide with joy. He did a little loop in the water, his tiny brass key swinging.", "Then he saw the edge of the light.", "The gold stopped at the door. Beyond it, the Deep Stacks were still grey. The silt was still there. The books were still fading.", "Squib turned grey. His colors faded, one by one, until he was the color of the silt. He drifted closer to Wren and Ravi, hovering just above their heads.", "\"It is not enough,\" he said. His voice was small and watery. \"There are three hundred shelves in the Deep Stacks. We have read one chapter.\"", "Ravi looked at the grey silt in the distance. \"I can read fast,\" he said, but his voice lacked its usual stiffness. He sounded worried. \"I can read forty more books. I can read all of them. I will count them.\"", "\"You are counting,\" Squib said gently. \"But the books do not want to be counted. They want to be heard.\"", "Ravi looked at his hands. He was still holding the book, but he was not looking at the page."], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["Madame Ottoline drifted into the pool of lantern-light, her eight arms busy. One held a stamp, one an inkwell, and one a silver ribbon bookmark. The other five simply rested, tired but satisfied. She looked at the two children.", "\"You are both very brave,\" she said. \"And you are both very good.\"", "\"But,\" she continued, her voice rolling in like a deep tide, \"a library is not saved by one or two voices. It is saved by a room full of them. By a town. By everyone who has ever felt that a word was too hard or too slow.\"", "Ravi frowned. His fingers twitched on his knee, an old habit from counting pages. He had always counted everything to keep the world in order. But this time, the numbers did not feel like books. They felt like people.", "He looked at Wren. Then he looked at the door.", "\"Saltmarrow,\" he said slowly. \"There are forty children in Room 4. And Mrs. Pell. And my dad. And your dad.\" He paused. \"And the ferry.\"", "He looked up at Ottoline. \"How many children are there in Saltmarrow?\""], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "The Plan", "part": "PART FOUR: THE SPRING TIDE", "paras": ["*Rule 18 of the Library at the Bottom of the Sea: Read it anyway.*", "\"The deep carries every sound,\" Wren said. She sat on the edge of the Returns Desk, her yellow boots dangling over the water. The thought bloomed in her mind like a sudden bubble, rising fast and bright. If the sea carried sound down to the lanterns, then a voice on the shore would carry it all the way down to the bottom.", "Ravi frowned and tapped his knee in a nervous rhythm. \"The water is thick,\" he said, trying to be helpful. \"It absorbs noise. That is how we know the sea is quiet.\"", "\"Only if it is quiet,\" Wren replied. \"But what if it is listening?\"", "She looked at Ottoline. The octopus tilted her head, her pince-nez sliding down her snout. One arm reached out to gently tap the water near Wren's boot. A small ripple spread, carrying the sound of the tap down into the dark.", "\"Rule Six,\" Ottoline said, her voice soft and rolling. \"The deep carries every sound. Even the ones that are small. Even the ones that are afraid. The water does not forget a voice. It keeps it until someone is ready to hear it.\"", "Wren looked at Ravi. \"Forty children,\" she said. \"That is not a whisper. That is a wave.\"", "Ravi stared. His fingers stopped tapping. For the first time in his life, he did not have a number to count. He only had a feeling, big and heavy and warm, sitting in his chest."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["Back on the surface, the attic room held the scent of salt and old paper. Wren spread a long sheet of white paper on the floor; it was not fancy, just the kind Mrs. Pell used for wrapping returns, soft and slightly crumpled from handling.", "Ravi produced a list, written in his neat, tight handwriting. \"Room 4. Ms. Alvarez. The fishermen at the dock. The baker. The boy who lives next to the lighthouse.\" He looked at the list, then at Wren. \"We need to tell them.\"", "\"We don't need to tell them,\" Wren said. She picked up a pencil, a stubby one worn down to a point like a crayon she had already finished. \"We need to invite them.\"", "She wrote one line in the center of the paper. Her letters were wobbly, but they were hers. *Bring a book. Bring your voice. Low tide, sunrise, the Saltmarrow Light.*", "Ravi stared at the words. He had never written an invitation before, only lists, checking boxes and counting pages. He looked at the attic door, then at the paper.", "\"It is very simple,\" he said.", "\"Yes,\" Wren said. \"That is the point.\"", "Ravi picked up the pencil. He did not add anything, just holding it and feeling the quiet promise of the invitation rest in his hand."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["Squib arrived hovering in the air, his teal skin flickering with gold speckles of excitement. He held out a small, smooth shell sealed with a message, extending a single careful arm to offer it to Wren.", "\"From the head librarian,\" Squib said, his voice squeaking like a rusty hinge. \"She says the whole Library will be listening. Every arm. Every heart. Even the slow ones.\"", "Wren took the shell, feeling its warmth against her palm, and broke the seal. Inside lay a tiny scrap of paper folded small as a petal, covered in handwriting that was elegant, looping, and precise.", "*We shall be delighted. Please do not chase any words.*", "Wren laughed, a sound rising from deep in her belly where the funny parts of stories live. She held the note up for Ravi to see.", "\"She is teasing us,\" Ravi said, though a small, shy smile pushed through his expression.", "Squib shifted to a soft, happy pink. \"I am very proud,\" he admitted. \"And also slightly terrified. Do you think the lanterns will break?\"", "\"No,\" Wren said. \"They will glow.\""], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["Mrs. Pell stood in the center of the room, holding a brown box that looked as sturdy as her own back. It was full of books, and she was staring at the empty shelf where they had once lived with the quiet, serious face of a woman who has just finished a very long homework assignment.", "\"Mrs. Pell,\" Wren said, stepping closer. \"Can we use the reading nook? Just for a minute? We need to plan something.\"", "Mrs. Pell turned. Her eyes, behind their round tortoiseshell glasses, were kind but deeply tired, like a lamp that had been burning since dawn. She looked at the box in her hands, then at Wren.", "\"I am packing,\" she said.", "\"We know,\" Ravi said, refusing to look away, though his hands were tucked firmly into the pockets of his khaki shorts. \"But the library is not just the books. It is the people who read them.\"", "Mrs. Pell was silent for a long time. Dust motes drifted through the afternoon light from the high windows, swirling slowly like flour in the air. She set the box down on the floor. It made a soft, heavy thud that seemed to settle the room.", "Then she reached out and unfastened the flap. She pulled out a single book, a hardcover with a cracked cover, and held it against her chest.", "\"Dear,\" she said, her voice thin and bright as a bell. \"I have waited a long time for someone to ask me to open a door.\""], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["Dad was standing on the dock, checking the ropes on the *Gull*, his green wool cap tilted to one side. He looked up when Wren walked onto the planks, his beard messy with salt air.", "\"Dad,\" Wren said. \"I need the ferry lantern. And the foghorn.\"", "He looked at her. He did not ask why, just nodded. \"The foghorn wakes the whole bay,\" he said. \"And the lantern... that is a special light.\"", "\"It is perfect,\" Wren said.", "That night, Wren lay in bed and looked at the tide table on the wall. The numbers were small and black, but they were clear. The lowest tide of the summer was tomorrow morning, right at dawn.", "Her stomach flipped, a cold, sharp feeling like swallowing an ice cube. But underneath the fear, there was something else, something warm and rising.", "She took a deep breath. The sea outside her window was dark and quiet.", "\"Right,\" she whispered to the moon. \"One page.\""], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "The Reading on the Beach", "part": "PART FOUR: THE SPRING TIDE", "paras": ["*Rule 19 of the Library at the Bottom of the Sea: The bravest sentence in any language is \"I was wrong.\"*", "The sea had drawn back. It sat far out in the bay, leaving a long, dark stretch of wet sand that gleamed like wet ink. Wren and Ravi stood at the edge, their boots sinking into the cool silt. Wren tapped her knee, a nervous rhythm. Ravi held his satchel tight, his knuckles white.", "\"Maybe we should go,\" he whispered. \"Before it gets awkward.\"", "Wren shook her head. \"They are coming.\"", "The first sound was the crunch of sand. A woman in a yellow raincoat walked out, balancing a wicker picnic basket. Behind her, a whole class of children spilled out of the school van, Ms. Alvarez leading them with a rolled-up map. Then came the fishermen, dragging a battered book of poems in a wheelbarrow. One by one, they gathered, a small army of readers, waiting for the light to reach them."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["Mrs. Pell sat on a driftwood log, her plum cardigan bright against the grey morning. She adjusted her tortoiseshell glasses on their beaded chain and looked out at the water, calm as the tide itself. The children spread their books on their laps, while the fishermen opened their battered poems. The air smelled of salt and old paper, a scent Wren knew better than her own socks.", "Then, stiff as a board, Mr. Grubb arrived. He wore his brown tweed suit, the fabric looking too thin for the sea breeze, and clutched a clipboard against his chest. He stood at the very edge of the crowd, his mouth slightly open, his big grey mustache trembling a little in the wind. He looked at the books, then at the sea, then at Wren. He did not sit. He just stood there, a heavy grey stone in a field of flowers, waiting for someone to tell him he could stay."], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["Wren took a breath that made her ribs ache. She held the book high, her fingers gripping the cover with a care that felt like holding a soap bubble. In her other hand, the sea-glass guide waited, cool and smooth against her palm. She laid it gently over the first line of *A Book of Small Weathers*, pressing it down as if she were placing a lid on a jar of secrets.", "\"The ship sailed into the har...\" she started. Her voice was steady, but the word wobbled on the tip of her tongue, refusing to settle. She stopped. The crowd held its breath. The silence hung thick and heavy around them. Then Wren pushed the word forward, gently, like guiding a small boat through choppy water toward a safe dock.", "\"Harbor,\" she said.", "And she kept going. Her voice rose to meet the others.", "One by one, the others began to read. A child nearby. A fisherman with salt in his beard. Even Ms. Alvarez, who usually kept her voice low. The voices rose together, a low hum that grew into a roar. It was a sea of sound that poured out over the sand and into the waiting water, washing over the stones and the boats and the quiet fear that had lived in Wren's chest for so long."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["Below, in the Lantern Hall, the Glimmers blazed.", "They did not just glow; they surged. The amber-gold light shot up the Spiral, bright and warm, chasing the grey silt. The Drift shrank. It curled away from the shelves, thinning out until it looked less like a cloud and more like a faint stain on a white shirt.", "Madame Ottoline stood perfectly still. Her pince-nez reflected the glow. She let a single drop of ink fall from her eye. It hit the stone floor with a soft *tick*.", "At the Returns Door, Captain Clack pressed his brass-capped claw against the wood. He listened.", "The sound of a hundred voices vibrated through the stone. It was a deep, thrumming rattle, the way a kettle sings right before it boils. Clack’s eyes, small and dark, blinked slowly. He had not opened that door in two hundred and twelve years. The latch was stiff. The wood was dry.", "He reached for the handle.", "The creak it made was long and slow, sounding exactly like a sigh that had been held for a very, very long time."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["The door groaned open with a long, wooden shudder. A red claw, tipped with polished brass, reached out to steady the frame. Then another claw appeared, gripping the edge. Captain Clack climbed up the Spiral, his legs clicking on the wet steps with a rhythm like a heavy metronome. He emerged onto the beach, dripping seawater from his shell, and stood before the hundred readers.", "The crowd went silent. Wren stopped reading. Ravi stopped breathing.", "Clack looked at Wren, then at the sea, then at the books resting in their laps. He straightened his tiny blue cap with a precise pinch of his pincers. He bowed, a deep, formal dip of his shell that seemed to take great effort.", "\"I was wrong,\" he said, his voice clear and strong over the waves. \"Please forgive an old crab. Please keep reading.\""], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "The Returns Slot", "part": "PART FOUR: THE SPRING TIDE", "paras": ["*Rule 20 of the Library at the Bottom of the Sea: Every book is a door. Knock gently, then go in, and bring a friend.*", "The Harbor Council met in the library’s main hall, under a bucket that caught a steady drip from the ceiling. Mr. Grubb stood before them, his tweed suit damp, his gold watch chain swinging with every nervous gesture. He looked at the bucket, then at the shelves, then at the children who had been told to stay quiet but were clearly listening.", "\"The roof is leaking,\" he said, clearing his throat. \"The budget is tight. But the town needs this place more than it needs a new roof. I move to keep it open.\"", "A murmur went through the room. Mrs. Pell adjusted her tortoiseshell glasses. Someone nodded. The vote was taken, and it was unanimous, including Mr. Grubb’s own hand, which rose slowly, as if lifting a heavy anchor from the sand.", "The bucket caught one last drip. It sounded like a coin falling into a jar."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["By noon, the roof was being mended. Fishermen in waders carried buckets of tar up the ladder, their boots slapping the wooden steps. The children ran back and forth with buckets of water to wash the brushes, their laughter echoing off the stone walls. Ravi stood on a stool, holding a list he had written in his neat, stiff hand.", "\"Three more shingles on the east side,\" he called down. \"And someone needs to fetch the hammer.\"", "Mrs. Pell sat on a chair in the doorway, wiping her eyes with a handkerchief. Her beaded glasses trembled slightly on her chain.", "\"It is the finest day,\" she said, her voice thick. \"Better than the day we opened. Better than the day we bought the first book.\"", "Wren looked up from her bucket of water. The tar smelled warm and sticky, like melted chocolate, but better. It smelled like staying."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["In the Deep Library, the air was no longer grey. The Drift had retreated, leaving only a single dusty shelf in the corner, where a few unread books still turned slowly to sand. Madame Ottoline sat at the Returns Desk, her eight arms arranging a row of shiny stamps. Captain Clack stood beside her, his red shell polished bright. Squib hovered nearby, his color shifting from shy pink to happy gold.", "Bartleby, the turtle with the bookcase on his shell, blinked slowly. \"There is no hurry,\" he said, but there was no need for hurry now.", "Ottoline picked up a small card and held it out to Wren. \"Borrower’s Card,\" she said. \"Number One Thousand.\"", "Wren took it. Then Ottoline turned to Ravi. \"And you, young man. Number One Thousand and One.\"", "Ravi took the card. He looked at it, then at Wren, and for the first time, he did not count the pages. He just held it."], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["The door in the sea wall at the foot of the Saltmarrow Light was no longer just a returns slot. Beside the brass slot, there was a second opening, small and round, marked with a carved shell.", "It was a shared door.", "Every low tide, a child from Saltmarrow would come down to the rocks. They would post a book through the brass slot, a story they had loved and finished. And then, they would wait.", "The water would shimmer. A small, glowing light would appear in the second slot. A book would float out, dry and warm, waiting for its next reader.", "Wren stood on the rocks, her yellow boots squelching in the wet sand. She watched a boy from Room 4 take a book from the sea. He looked at it, then at the door, and smiled.", "The two libraries were sisters now, bound by the tide and the trust of the children who kept them alive."], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["That night, the attic room was quiet. The lighthouse beam swept across the ceiling, white and slow. Wren sat on her bed, a book in her lap. It was *A Book of Small Weathers*, one of the ones she had borrowed from the sea.", "Her dad sat in the chair by the window, his green wool cap on his knees. He held his own book, the ship’s log, his finger tracing the lines.", "\"Read with me,\" he said.", "Wren opened her book. She placed her finger under the first line. The words did not swim. They settled, like dust in a sunbeam. She read the first page, slowly, her voice soft and clear.", "Her dad read the next page.", "The sea listened from beyond the window, breathing in and out, keeping time with their words. And in that quiet room, nobody had to be fast to be a reader."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "The Words That Swim", "part": "PART ONE: LOW TIDE", "page": 1}, {"n": 2, "title": "The Upturned Boat", "part": "PART ONE: LOW TIDE", "page": 6}, {"n": 3, "title": "The Storm Tide", "part": "PART ONE: LOW TIDE", "page": 11}, {"n": 4, "title": "The Book That Held Still", "part": "PART ONE: LOW TIDE", "page": 16}, {"n": 5, "title": "The Lowest Tide", "part": "PART ONE: LOW TIDE", "page": 21}, {"n": 6, "title": "The Returns Desk", "part": "PART TWO: THE LIBRARY AT THE BOTTOM OF THE SEA", "page": 26}, {"n": 7, "title": "The Growing Stacks", "part": "PART TWO: THE LIBRARY AT THE BOTTOM OF THE SEA", "page": 31}, {"n": 8, "title": "Never Chase a Word", "part": "PART TWO: THE LIBRARY AT THE BOTTOM OF THE SEA", "page": 36}, {"n": 9, "title": "The Deep Stacks", "part": "PART TWO: THE LIBRARY AT THE BOTTOM OF THE SEA", "page": 41}, {"n": 10, "title": "Squib's Question", "part": "PART TWO: THE LIBRARY AT THE BOTTOM OF THE SEA", "page": 46}, {"n": 11, "title": "The Lanterns Flicker", "part": "PART THREE: THE DRIFT", "page": 51}, {"n": 12, "title": "Ravi Follows", "part": "PART THREE: THE DRIFT", "page": 56}, {"n": 13, "title": "The Notice", "part": "PART THREE: THE DRIFT", "page": 61}, {"n": 14, "title": "The Warden", "part": "PART THREE: THE DRIFT", "page": 66}, {"n": 15, "title": "What Dad Said", "part": "PART THREE: THE DRIFT", "page": 71}, {"n": 16, "title": "Ravi Sees the Library", "part": "PART FOUR: THE SPRING TIDE", "page": 76}, {"n": 17, "title": "Two Readers", "part": "PART FOUR: THE SPRING TIDE", "page": 81}, {"n": 18, "title": "The Plan", "part": "PART FOUR: THE SPRING TIDE", "page": 86}, {"n": 19, "title": "The Reading on the Beach", "part": "PART FOUR: THE SPRING TIDE", "page": 91}, {"n": 20, "title": "The Returns Slot", "part": "PART FOUR: THE SPRING TIDE", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
