<script>
const D = {"title": "The Garden at the Edge of the Concrete", "sub": "One Year, Forty-One Seeds and a Very Slow Tortoise", "pages": [{"no": 1, "ch": 1, "ctitle": "Ninety-Two Steps", "part": "PART ONE: EDGE", "paras": ["*Garden Log, Day 1: Growing: nothing. Waiting: everything.*", "I would like to say I found the garden because I am curious and brave. What actually happened is that I was hiding from a stack of moving boxes.", "Lowell Court is eleven concrete blocks around a car park, and I had been living in Block C for nine days, which is enough time to know exactly how long the lift takes (forty seconds, if it feels like it) and how many steps lead up to our flat on the fourth floor (ninety-two), and not nearly enough time to know a single person. The blocks are the color of old chewing gum. The car park has one tree, and the tree has a fence around it, as if it might try something.", "I am Sana Haddad. I am eleven. I have round glasses, a green pencil that lives in my hair, and a serious problem with waiting, which I did not know was a problem until I moved somewhere with nothing else to do."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["Our flat was full of boxes. Mama, who is a night nurse, was asleep in the middle of the day with a pillow over her head and a sign on the door that said IF YOU WAKE ME, YOU BECOME THE PATIENT. Baba, who is a baker, had left at three in the morning and would be home at noon with a bag of warm bread and flour in his eyebrows. My brother Yusuf, who is six and has not yet lost the habit of speaking at the volume of a fire alarm, was explaining to the empty living room exactly how a dinosaur would carry a sofa.", "I wanted the flat to feel like home. I wanted this by Friday. I had made a list of what needed to happen, and unpacking was only the first line. The other lines said things like *know where the bus goes* and *have one friend*.", "It was Tuesday. I had unpacked four boxes and I had not yet found the kettle."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["Here is the proof that I am not a patient person. Four days earlier I had pushed a bean into a yogurt cup of soil on the windowsill, and I had checked it every hour since with a ruler.", "Nothing had happened. Nothing usually does, for the first week. I knew this. I had read it in a library book called *Beans: A Beginner's Guide*. But knowing a thing and being able to leave it alone are two different animals, and on the third night I had dug the bean up with a teaspoon to make sure it was working. It was working. It had a small pale root, like a whisker. I had put it back and felt terrible, and the following morning I had done it again.", "The bean now looked slightly offended. I understood the feeling.", "\"You are not being helpful,\" I told it.", "The bean, as beans do, said nothing at all."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["The lift was out of order, so I took the stairs, and on the second landing I met Mr. Osei.", "Mr. Osei is the caretaker of Lowell Court. He is very tall and very quiet and has a grey moustache and a ring of keys on his belt as big as a dinner plate, and he mops the same six square meters of lift floor every morning as if he were painting it. That day he was leaning on his mop looking at nothing in particular. He nodded at me. I nodded at him. We had done this eleven times already, and I was keeping count.", "\"The bean,\" he said, unexpectedly, \"will not grow any faster for being looked at.\"", "I opened my mouth to ask how he knew about the bean. Then I remembered that everybody in Block C knew everything about everybody's windowsills.", "\"I know that,\" I said. I did not.", "He gave me a long, mild look. Then his eyes went past me, out through the stair window toward the loading bay at the back of the block, and something crossed his face that I did not have a name for yet. He went back to mopping."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["I meant to go straight up to the flat. I really did. But there were the boxes waiting for me, and the list, and Yusuf's dinosaur, and I could not face any of it, so I went down instead, and out, and round the back of the block to the loading bay, where nobody ever goes.", "It smelled of bins and diesel and old rain. There was a row of overflowing bins, a broken pigeon feeder, and a chain-link fence along the far edge, where the pavement stopped and the world seemed to give up. I was about to turn back when I noticed two things. The first was that the bottom of the fence had been pulled up, just enough to fit a person, if the person was small and did not mind mud.", "The second was the smell. It was very faint, and completely wrong for the place: wet earth and mint and something like lemons, thick and green and alive, drifting through the gap like a whisper that had been waiting for someone to lean in.", "I looked back at the bins. Then I got down on my hands and knees and crawled through."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Green Behind the Fence", "part": "PART ONE: EDGE", "paras": ["*Garden Log, Day 2: Growing: a suspicion.*", "The air changed the moment I crossed the gap. It was no longer the smell of diesel and old rain. It was thick, green, and damp, tasting like mint leaves crushed in a fist. I stood up and brushed the dirt from my knees. My denim jacket was torn at the pocket, but I did not care.", "In front of me was a wall of brambles, thorny and wild, blocking the direct path. But there was a gap, a dark mouth in the green, just wide enough for me to slip through sideways. I squeezed through, my glasses fogging slightly from the humidity.", "On the other side, the world stopped.", "It was a garden, but it had been sleeping for a long time. Tall grass swayed in a breeze I could not feel. A pear tree stood in the center, its branches heavy with fruit that looked like pale lanterns. A brick path crumbled into the weeds, leading to a bench covered in ivy.", "There was no sound. No cars. No lift humming. No Yusuf shouting about dinosaurs. It was so quiet that I could hear my own heartbeat thumping in my ears, loud and clumsy, like a fist knocking on a door. I took a step forward, and the grass whispered against my shoes."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["I am a girl who likes things to make sense. Numbers help. If I can count it, I can understand it, and if I can understand it, I can control it. So I did what I always do. I measured.", "I took my tape measure out of my jacket pocket. The brick path from the gap to the bench was exactly fourteen steps. I counted them twice, tapping my foot on each brick to make sure. Fourteen.", "I stood up straight and held my arms out to the side. The wall on the left was three of my heights. I climbed up on a stone to check, then jumped down, my knees knocking. Three.", "I walked to the pear tree. I looked up. I counted the pears visible from the ground. One, two, three... it took me a minute, but I did not rush. One hundred and six.", "I pulled out my notebook and wrote it down. *Fourteen steps. Three heights. One hundred and six pears.* I looked at the list. It was not a schedule. There were no times attached to it. The pears were not ripe, and they did not care when I came to look. For some reason, this was both the most annoying and the most calming thing I had ever seen."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["The bench was covered in ivy, but I brushed the leaves aside and sat down. The wood was cold, then suddenly warm.", "A hum started. It was low, vibrating through the boards and up into my back, like a cat purring under a blanket. It felt heavy and warm, settling into my bones. I closed my eyes and let it wash over me. It was the first time in nine days that I felt still.", "Then I realized I was alone.", "I opened my eyes. The hum stopped. I sat there, frozen, my hands pressed flat against the wooden slats. Was I imagining it? I sat back down, slowly, carefully. The hum returned, gentle and steady.", "I took a breath. My throat felt tight. I looked at the empty path, the silent grass.", "\"I don't have any friends here,\" I said. My voice sounded small in the quiet air.", "The hum pulsed once, a soft, warm vibration that seemed to say, *I hear you.* Then it faded, leaving only the sound of the wind in the grass."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["I reached under the bench, not for a lost item, but because my hand found something hard and cold. It was a tin, rusted brown and green, the size of a shoebox. I pulled it out. The metal was cold against my fingers, and the rust flaked off onto my denim sleeve.", "The lid was scratched. Not printed, not painted. Scratched into the metal with a nail, or maybe a key. The letters were jagged and deep.", "I wiped the dirt away with my thumb and read them.", "*One seed a day.* *Plant it with one true thing, said aloud.* *Water morning and dusk.* *Never hurry a root.*", "I read them again. My eyes moved over the words, but my brain did not quite catch up. *One true thing?* What does that mean? Does a seed need a confession? I turned the tin over in my hands, the rust staining my fingers. It felt important. It felt like a test I had not studied for."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["I lifted the lid. The smell was sharp and dry, like a library book that had spent a decade in a cupboard. Inside, forty-one seed packets lay in neat rows. The handwriting on them was faded, looping, and elegant. *Patience Pea. Honest Basil. Whisper Sweetpea.*", "Beside them lay a tiny brass trowel, tarnished to a dull gold. I picked it up. It was light, almost weightless, like a plastic canteen spoon that had somehow been polished into metal. I reached for a packet of *Patience Pea*.", "As my fingers brushed the paper, a voice came from the tall grass at my ankle. It was slow, dragging, like honey moving through a spoon.", "\"Mm. Not... yet.\"", "I jerked my hand back, knocking the tin onto the grass. I looked down. The grass was just grass, but I was not alone. I could feel eyes on me, heavy and old."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "A Tortoise Named Gherkin", "part": "PART ONE: EDGE", "paras": ["*Garden Log, Day 2, later: Growing: a tortoise. Also a headache.*", "I did not scream. I made a sound that was mostly air and slightly less dignity, and my feet left the ground.", "In the grass sat a tortoise. It was the size of a hat, with a shell that looked like a mossy cobblestone and eyes the color of wet raisins. It blinked. The blink took longer than I cared to count.", "\"Mm,\" it said. The voice was deep and dry, like a leaf rustling in a windless room. \"My name is... Gherkin.\"", "I stared. He stared back. I counted. It took eleven seconds for him to finish the word.", "\"I am... three... hundred... years... old,\" he continued. His head moved forward, an inch at a time. \"More... or... less.\"", "Nine seconds. I was still holding the seed packet. My fingers were trembling.", "\"And you have... picked up... the wrong... seed.\"", "Forty seconds. I looked at the packet in my hand. *Patience Pea*. I looked at Gherkin. He was already looking at the grass again, waiting for me to realize the conversation had ended."], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["Gherkin moved. Or rather, he suggested movement. His front left leg extended, an inch, then another, then a pause that lasted long enough for me to check my watch.", "\"You are the sort,\" he said, \"who digs up... a seed... to see... if it is... working.\"", "I felt heat rise in my neck. \"I did that,\" I said. \"Twice.\"", "\"Twice,\" he repeated. The word dragged out like taffy. \"That is... quite... a lot... for... one... week.\"", "He turned his head. It was a full rotation, but it felt like it took an hour. I wanted to say that I was actually very careful. I wanted to say that I had read the book. I wanted to say that I was not the kind of person who ruins things because they are bored. But he was looking at me with those wet raisin eyes, and I knew he knew I was lying. Not because I lied, but because I had done it. Twice.", "\"The bean,\" I said, trying to sound casual, \"is fine now.\"", "\"Mm,\" said Gherkin. \"We shall... see.\""], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["I dropped onto the grass, my knees still trembling from the earlier jump. A three-hundred-year-old tortoise sat three feet away, and I had absolutely no idea what to do with my hands.", "\"This garden,\" Gherkin said, \"has been... waiting... a long... time... for... somebody... to come... through... the fence.\"", "\"Did you mean a gardener?\" I asked.", "\"Not a gardener,\" he replied. \"Anybody... would do.\"", "\"Really?\"", "\"Really,\" he confirmed. \"It has... only one... requirement.\"", "My heart did a little flip. \"Patience?\"", "\"Patience,\" he said.", "I looked down at my hands, then at the seed packet in my lap. The bean in its yogurt cup came to mind, along with the list taped to our fridge. *Know where the bus goes. Have one friend.* I wanted those things by Friday, the bean to sprout by tomorrow, and to be good at this by now.", "\"That is... possibly,\" I said, \"a problem.\"", "Gherkin blinked. It took four seconds.", "\"Mm,\" he said. \"Possibly.\""], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["I picked up the brass trowel. It felt different now, heavier, or maybe I was just heavier.", "\"The tin,\" I said. \"The rules. Are they real?\"", "Gherkin lifted his head. \"The rules... are real.\"", "\"What happens if I break them?\"", "The tortoise let out a sound that might have been a sigh. \"The garden... does not punish... anybody.\"", "\"Then what does it do?\"", "\"It exaggerates,\" he said.", "I frowned. \"Exaggerates?\"", "\"A seed... planted in a hurry... grows in a hurry,\" he said. \"And wrong.\"", "\"A true word... makes it grow right.\"", "I looked at the *Patience Pea* packet, then at the dirt. The sun was warm on the back of my neck, and the trowel sat heavy in my hand. I could feel the impulse to just dig, to plant, to see, to have, to be done.", "\"It’s not that simple,\" I said.", "\"Mm,\" said Gherkin. \"No. It is... much... simpler.\""], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["I set the seed packet down, then picked it up again, my thumb rubbing the printed image of the green pea.", "\"Okay,\" I said. \"I want to plant one. Right now.\"", "Gherkin remained perfectly still. \"You may... plant one... seed... a day... and no more.\"", "\"I’m not planning to plant forty-one,\" I clarified. \"I am going to plant exactly one.\"", "I chose the *Patience Pea*. It seemed like the right choice, which was ironic given my current state. I dug a small hole with the brass trowel, the soil loose and smelling strongly of recent rain. Placing the seed in the center, I patted the earth down with my thumb.", "I did not say a true thing. I had completely forgotten the second rule.", "Standing up, I brushed the dirt from my knees and stared at the spot I had just covered. It looked like ordinary dirt, nothing more, holding nothing but a small brown object that expected me to remember what I had just broken.", "Gherkin watched me. His eyelids lowered slowly, a process that took six full seconds to complete.", "\"Mm,\" he said. \"We shall... see.\""], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "One True Thing", "part": "PART ONE: EDGE", "paras": ["*Garden Log, Day 3: Growing: a problem.*", "I came back after breakfast expecting a small green shoot. What I found was a mistake.", "The pea was already a foot tall, its stem crooked and the color of bruised skin, twitching without any wind to explain it. Another inch grew while I blinked, then two more when I blinked again. Gherkin was eating a lettuce leaf, taking one bite every ten seconds and chewing with the deliberate slowness of a machine that had been told to stop.", "\"Mm,\" he said.", "I waited.", "\"Ah,\" he finished, fifteen seconds later.", "I stared at the vine, which was wrapping around the brass trowel I had left behind until the metal bent like a sad, twisted spoon.", "\"I forgot,\" I said. \"I didn't say a true thing.\"", "Gherkin swallowed the lettuce. \"Mm. The garden... does not forgive... lies.\"", "\"It wasn't a lie,\" I said. \"It was an omission.\"", "\"Same thing,\" Gherkin said. \"To the root.\""], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["The vine was winning. It had wrapped the garden fork in a tight spiral and climbed the pear tree, which now leaned dangerously to the left. It stretched across the brick path, dragging the rusted seed tin behind it like a heavy bag of sugar being pulled by a dog.", "I pulled out my tape measure. It felt like a weapon, or a tool, or both. \"Stop,\" I commanded the vine.", "It grew four centimeters. I measured it. Sixty centimeters. I breathed in, then out, and measured again. Ninety centimeters. The tin was now three inches from the hedge.", "\"Please,\" I said. \"I am trying to help.\"", "The vine whipped around and slapped the tape measure out of my hand. It landed in a puddle. I picked it up, dripping, and watched it reach one meter twenty. It had found the bench. It was trying to eat it.", "I measured the distance to the hedge. Two meters. Then one and a half. Then one.", "I was losing. I could feel the speed of it in my stomach, a heavy, sinking feeling, like dropping a stone into a deep well and waiting for the splash."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["\"How do I stop it?\" I asked, watching the green chaos spread.", "Gherkin was still chewing a piece of lettuce. He lifted one claw and pointed it at the vine. \"Say... a true word.\"", "\"I did,\" I said, my voice cracking. \"I said I am trying to help. That is true.\"", "\"The vine... grows,\" Gherkin said slowly. \"It needs... a truth... that costs.\"", "I tried again, keeping my voice steady. \"I am patient.\"", "The vine snapped up three inches in a single jerk. Thorns appeared along the stem. They were sharp and black, exactly like the plastic tips of broken ballpoint pens.", "\"I like it here,\" I tried next.", "More thorns erupted. The vine wrapped tighter around the fork, and the metal made a high-pitched squealing sound, similar to a school bell being rubbed with sandpaper.", "\"I am fine,\" I said, because I was an eleven-year-old girl and \"I am fine\" was the safest sentence in the world.", "A small pea flower appeared on the tip of the vine. It was perfect, with white petals and a yellow center. Then it wilted, turned brown, and fell off to hit the ground with a tiny, sad thump.", "The vine hissed, sounding exactly like a kettle boiling over.", "I sat down on the bench, which was vibrating under my jacket. I did not want to look at the vine. I wanted to go home and hide in the bath with the taps running, letting the water wash away the smell of failure."], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["The vine was coiling around my ankle. It was not hurting me. It was just holding me. Waiting.", "I looked at the hedge. Two inches away. The tin would break. The seeds inside would spill out. And I would have to explain that I had broken a rule because I forgot a sentence.", "My throat was tight. I swallowed. It felt like swallowing a pebble.", "\"I didn't want to move here,\" I said.", "The vine stopped twitching.", "\"I was really angry at Mama and Baba,\" I said, and my voice was small, smaller than I wanted it to be. \"And I still am. A bit.\"", "The bench hummed. It was a low, warm sound, like a bee trapped in a jar.", "The vine shuddered. It began to shrink. Not suddenly. Slowly. The thorns retracted. The crooked stem straightened. It pulled back from the fork, the tree, the tin. It retreated into the soil, leaf by leaf, until all that was left was a small, neat pea sprout.", "It was about the length of my hand. It was green. It was alive.", "I looked at my hands. They were shaking. I had said it out loud. I had said it to a tortoise. But it was out."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["Gherkin blinked. It took eight seconds.", "\"Mm,\" he said. \"There. Now... it's growing.\"", "I stared at the sprout. \"It's tiny.\"", "\"Three weeks,\" Gherkin said. \"To flower.\"", "I groaned. It was a loud, ugly sound. I did not care who heard. Three weeks meant I would have to come back every day, water it, and wait.", "The bench hummed again, softer now.", "I stood up, my legs feeling wobbly, and looked at the sprout, then at the tin, which was safe. I picked up my tape measure. I did not put it back in my pocket. I held it in my hand.", "I walked to the gap in the fence. I paused.", "I wanted to go home and hide from the boxes and the list and the dinosaur. But I also wanted to come back. I wanted to see if the sprout had grown two centimeters.", "I climbed over the fence. My breath was in my chest, tight and full. I had promised, without deciding to, to be here tomorrow.", "And for the first time in nine days, I wanted to keep it."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "The Rules of the Tin", "part": "PART TWO: ROOTS", "paras": ["*Garden Log, Day 8: Growing: pea (4.5 cm). Patience (0.1 cm).*", "Seven days is a long time for a pea. I counted the seconds. I measured the light. I watered it at dawn, before the sun hit the concrete, and again at dusk, when the sky turned the color of a bruised plum. Gherkin watched me with eyes that did not blink. He pointed a claw at a rusted watering can sitting in the corner.", "\"Always been there,\" he said. \"Use it.\"", "The can was bent in the middle, like a tired knee. The handle was smooth from years of hands. I filled it from the tap behind the loading bay. The water tasted like metal and rain. I poured it slowly, watching the soil darken. Then I took out my tape measure.", "Four and a half centimeters. That is not much. But it is a lot for a pea. I opened the notebook Mama bought me for schoolwork. The cover said *English*. I crossed out the word with a black pen and wrote *Garden Log*. My handwriting was messy. I did not care. It was the first thing I had made that was mine."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["School was louder than Yusuf’s fire alarm. I sat in the back row near the window, watching dust motes swirl in the sunbeams. I never put my hand up, not because I didn’t know the answers, but because I didn’t want to say them out loud where everyone could hear.", "Theo Kowalski slid into the seat next to me, a skateboard tucked under his arm. He wore a beanie and a hoodie with the sleeves pushed up. He looked at me, then at the clock, then at me again.", "\"You look like you have been up at dawn,\" he said. \"Doing crime.\"", "I did not look at him. \"Gardening.\"", "He laughed. It was a short, sharp sound, then he laughed again, harder. He had to sit down on his skateboard to stop himself from falling over, and the board screeched against the linoleum floor like a dying cat.", "I hated him. I counted the seconds. One, two, three. Nine. He was still laughing. I turned back to my window. The dust motes were dancing still."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["I wanted the pea to grow faster, so I decided to help it along with some science that was only half-scientific. I took a spoonful of Yusuf’s crushed cornflakes and poured them onto the soil, then dragged an extension lead across the concrete and plugged in a desk lamp. I stood there and sang, not because I had a song, but because I felt like I was supposed to.", "The pea did nothing. So I planted a tomato seed and told it a true thing, which was \"I am tired of waiting.\"", "It grew. It grew so fast that the air around it seemed to buzz with effort. In one hour, it had seventeen tomatoes, red and heavy and shiny, and the stem bent under their weight until the whole plant groaned and fell over. It lay on the ground, a heap of red fruit and green leaves, looking thoroughly exhausted.", "Gherkin blinked slowly. \"Mm,\" he said. \"Show-off.\""], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["The tomato was a disaster, mostly red and mostly broken. I picked up the pieces, feeling the guilt settle into my chest like heavy wet sand. Then I took out the tin and read the rules again, my finger tracing the words: one seed a day, one true thing. I chose a new seed, small and brown, and held it in my palm until it warmed up.", "\"I get scared when people look at me,\" I said.", "My voice was tiny and wobbly, shaking like a phone signal with one bar left, but I did not stop. I planted it.", "Three days later, a flower appeared. It was blue and tiny, shaped exactly like a school bell. I whispered to it, asking it to be quiet.", "It rang.", "It was a faint sound, a single sharp note that cut through the air. It was the best thing I had ever grown, not made, but grown, and it was mine."], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["I read the tin again, turning it over in my hands until the metal felt warm. The scratches on the bottom were deep, much deeper than I had noticed before, and the letters were smaller than the rest.", "*Someone must speak for it when the day comes.*", "I looked at Gherkin, who was chewing a piece of lettuce with the speed of a glacier. \"What day?\" I asked.", "\"Mm,\" he said, and then, much later, \"Not yet.\"", "The air in the garden went still, and the blue flower stopped its faint ringing. My neck went cold, a feeling like I had just realized I forgot my homework. I did not know what day he meant, or what I would have to say, but I knew I would have to say it. I took out my tape measure and held it against the stem. Two centimeters. I wrote the number down in my notebook, closed the cover, and walked to the gap in the fence."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "Yusuf Cannot Keep a Secret", "part": "PART TWO: ROOTS", "paras": ["*Garden Log, Day 15: Growing: pea (8 cm). Problems: Yusuf.*", "Yusuf has been following me for three days, which he does with the subtle grace of a marching band, stomping his small rubber boots on the concrete as if he is trying to knock on a door that is already open. I did not hear him until he squeezed through the gap in the fence, which is tight even for me, and let out a shout that startled a sparrow off the pear tree.", "\"THERE IS A TORTOISE,\" he announced, his voice cracking on the word like a dry twig snapping underfoot.", "I covered my mouth, but it was too late. Gherkin stopped chewing his lettuce and turned his head, very slowly, toward the noise. Yusuf was grinning, his missing front teeth making his smile look like a stage with no actors on it, and he did not stop shouting. He just started shouting louder, about the green leaves and the rusty tin and the fact that a bird was looking at him with judgment.", "I looked at Gherkin. Gherkin looked at Yusuf.", "\"Mm,\" Gherkin said.", "\"Can I keep it?\" Yusuf asked.", "\"No,\" I said.", "\"I can keep the secret,\" Yusuf promised, which was not what he was asked."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["Yusuf had one hundred questions, and he fired them off like a machine gun loaded with curiosity. \"How old are you? Do you eat lettuce? Do you like lettuce? Is that lettuce? Is that a hat? Can I touch the hat? Why is it green? Is it moss? Is moss alive? Do you have a family? Do you have a name? What is your name? Is it Gherkin? Why is it Gherkin?\"", "Gherkin blinked, chewed his lettuce, and then stopped moving entirely. He looked like he was waiting for a bus that would never come.", "\"Mm,\" he said.", "\"That's it? Just Mm?\"", "\"Not yet,\" Gherkin added, after a pause that felt longer than a math test.", "Yusuf was delighted by this. He loved the slow pace and my visible panic. He vibrated in the middle of the Spring Room while I explained the tin's rules to a boy who treated them like suggestions. I made him promise, putting my hand out for a deal. He put his hand in mine, and we performed a spit-shake, which is a handshake where you spit in your palm first. It was gross, but legally binding.", "\"I will tell no one,\" Yusuf whispered, his eyes wide and bright.", "\"Good,\" I said.", "He grinned, his missing teeth catching the sun."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["Yusuf kept his secret for exactly four hours, which is impressive for a six-year-old who treats silence like a video game level he is trying to skip.", "I found out because Mrs. Ilves stopped me on the stairs, coming down with her knitting bag, the one that always has a ball of wool hanging from it like a pendulum. She looked at me with eyes that had seen everything, including probably the time Yusuf tried to hide a broken plate under the sofa.", "\"So it's still there,\" she said, and it was not a question.", "My stomach dropped to the floor. \"Mrs. Ilves, I can explain.\"", "\"You don't have to explain,\" she said, patting my arm with fingers that were dry and quick as a card trick. \"I know. Yusuf told me. Then he told the man at the bakery. Then he told your mother. He is very good at this. Being a boy. He is very good at being a boy.\"", "I felt heat rise up my neck, burning my face until I wanted to sink into the carpet and stay there.", "\"Yusuf cannot keep a secret,\" I said, my voice small.", "\"No,\" Mrs. Ilves agreed, adjusting her bag. \"He cannot. But you can. You have the tape measure. You have the patience. Or you think you do.\" She smiled, and it was not unkind. \"See you in the lift.\""], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["Mrs. Ilves lived on the fourth floor, where her window looked out over the car park and she watched everything from it. As she walked past me, she mentioned that the garden used to be the pride of Lowell Court.", "\"Mr. Osei built it,\" she said. \"With his wife, Ada. They grew food for half the estate. Tomatoes, beans, herbs. The air smelled like summer even in the winter.\"", "I thought of the pear tree, and then the blue flower.", "\"Then why did it stop?\" I asked.", "Mrs. Ilves stopped walking and looked at the stained grey wall of the stairwell.", "\"Ada died,\" she said. \"And Mr. Osei shut the gate. He could not open it. So we stopped talking about it, and we stopped going behind the fence. It was easier that way.\"", "She started walking again, her heels clicking on the concrete.", "\"Do not tell Mr. Osei I said this,\" she added. \"He is a kind man. He does not need to feel guilty again.\"", "I stood on the landing, my hands shaking behind my back so she would not see."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["Mama came home at four. She smelled of soap and tiredness. She did not ask about the garden. She did not ask about Yusuf. She just put her bag down and sat on the edge of my bed.", "\"You're smiling,\" she said.", "I was. I had been smiling all day. I tried to stop, but it was too late. The smile was already there, stuck to my face like a sticker.", "\"I'm fine,\" I said.", "\"You're not fine,\" Mama said. \"You're smiling when you talk about it. I hadn't seen that in a while.\"", "I looked at her. Her eyes were dark circles, but they were bright. She was looking at me like I was something she had lost and found again. I felt caught. I felt kept.", "\"I found a garden,\" I said.", "Mama nodded. She did not ask for more. She just sat there, on the edge of my bed, in the quiet room, while the sun went down outside. I lay awake for a long time. I did not check the seed. I did not measure the steps. I just listened to the wind."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "Mr. Osei's Keys", "part": "PART TWO: ROOTS", "paras": ["*Garden Log, Day 22: Growing: pea (13 cm). Questions: several.*", "The lift was broken again, which was annoying because it had been broken for two hours, but it meant I had to take the stairs. I was on the third landing, counting the grey steps under my trainers, when I heard the scrape of a mop.", "Mr. Osei was there, leaning on his handle and staring at a water stain on the floor that looked suspiciously like a map of nowhere. I stopped. I had wanted to ask him about the garden for six days, but every time I opened my mouth, my brain went quiet, which was a new and annoying habit.", "\"Mr. Osei,\" I said, and my voice came out thin. I cleared my throat. \"Do you know about the garden?\"", "He did not look up, just kept scrubbing the same circle of concrete.", "\"There is nothing behind the loading bay,\" he said, his voice soft like the rustle of dry leaves. \"Just a fence.\"", "I waited, but he did not move, and the mop squeaked once, a long, sad sound, before stopping completely."], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["I did not leave. Standing there, I gripped my bag straps until my knuckles went white, while the stairwell air grew thick with the smell of old paint and dampness.", "\"The bench,\" I said. \"It hums.\"", "Mr. Osei’s hand stopped moving. He looked at me, then down at his keys, the big ring jingling softly against his belt. He stared back at the floor.", "\"Ada liked that bench,\" he said.", "It was the first time I had heard a name in this building that wasn’t Mrs. Ilves or the mailman. Ada. The name hung in the air, light and fragile. He picked up his bucket. He did not look at me again. He walked past me, his shoes squeaking on the wet patch of floor, and disappeared around the corner.", "The lift dinged. It was an awful sound, sharp and brassy. I rode up alone, my face burning. I had asked. I had not answered."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["I took the stairs up from there, mostly because I needed to move my legs and less because I was tired. On the ninety-second step, I found Theo Kowalski.", "He was sitting there, legs crossed, wearing a beanie and a hoodie with the sleeves pushed up to his elbows. He was doing nothing, just looking at the wall, and I realized with a shock that this was what he did when he was lonely. He sat on the highest step and watched the concrete.", "\"You followed me,\" I said. It wasn't a question.", "He shrugged, one shoulder going up. \"Yesterday. The fence.\"", "\"I said no,\" I said.", "\"I know.\" He picked at a loose thread on his sleeve. \"I don't want to tell anyone. I just want to see. And I know about peas.\"", "\"Nobody knows about peas,\" I snapped.", "\"Grandmother grew forty types,\" he said, his eyes still on the wall. \"In Kraków. On a balcony. She was very strict about the soil.\""], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["I stood there. The air in the stairwell felt thick, like the sticky residue left on a spoon after eating cold honey. I thought about the yogurt cup. I thought about the bean I had dug up with the teaspoon. I thought about how I had never let anyone see anything that was mine. Not the list. Not the seed. Not the way my heart beat when I counted steps.", "I took a breath. It was a huge breath, the kind that pulls your ribs wide, similar to the gasp before a dive into the school pool in January. The whole body tenses at once. You do not think about the temperature. You just go.", "\"Yes,\" I said.", "Theo looked at me. He did not smile. He just nodded, once, and stood up. He stretched his back, popping a knuckle with a sound like a dry twig snapping. The concrete under my feet felt solid and real. I felt lighter, and also heavier, as if I had picked up a bag of flour that I would have to carry home."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["We went down, out, and through the gap, where the mud was cold and thick on my knees. Theo stopped in the doorway and stood there for a full minute, his hood down and his mouth open. He was looking at the pear tree, the mossy wall, and the rusted tin on the bench.", "\"It's not a dump,\" he said, his voice rough. \"It's a garden.\"", "The bench hummed, a low, warm sound that vibrated through the wood into the air. It felt like the vibration of a phone on a table, but steady and alive. From under the pear tree, a shadow moved. A mossy shell turned, and a slow, ancient eye blinked.", "\"Mm,\" said Gherkin.", "He paused. I counted. One. Two. Three. Four. Five. Six. Seven. Eight. Nine. Ten. Eleven.", "\"Another one,\" he finished."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "The Pumpkin That Ate a Bicycle", "part": "PART TWO: ROOTS", "paras": ["*Garden Log, Day 29: Growing: pea (19 cm). Also: a pumpkin. (See below.)*", "Theo did not wait for the soil to settle. He had a seed in his hand, a small, wrinkled orange pumpkin, and he shoved it into a hole in the dirt with the speed of someone trying to hide a crime. He patted the earth flat, stepped back, and looked at me with eyes that were bright and very uncertain.", "\"I'm... good at plants?\" he said.", "It was the true thing. It had to be.", "\"It has to be true,\" I said. \"Actually true.\"", "Theo shrugged. He looked at the dirt, then at Gherkin, who was watching from under the pear tree with the intensity of a teacher checking for missing pencils.", "\"Mm,\" Gherkin said.", "I counted. One. Two. Three. Four. Five.", "\"Is it,\" the tortoise finished, taking his time as if he were chewing a particularly tough leaf.", "Theo’s face went the color of the pumpkin. He looked like he wanted to un-say it, which, I was learning, was impossible."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["We went home. I told myself the garden would be sensible. I told myself the rule was one true thing, and we had given it one. I did not check the seed. I did not check the sky. I slept for four hours and woke up with the sound of tearing fabric.", "I ran out the back door. Theo was already there, standing in the path, his hands in his pockets, looking at the green wall that used to be a path.", "The pumpkin vine had erupted. It was a green fountain, a thick, muscular rope of leaves and tendrils that had swallowed the wheelbarrow, half the gravel path, and the rusted tin. It had also swallowed Theo’s skateboard, which he had left leaning against the wall.", "At the center of the mess sat the pumpkin. It was the size of a small car. It was perfectly round, deep orange, and it was, unmistakably, sulking."], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["\"We cut it,\" Theo said, pulling a pocket knife from his hoodie. He saw me shaking my head and put it away, though the blade had already made a small, sharp promise in the air.", "\"Rule four,\" I said, my voice flat. \"Never hurry a root.\"", "\"We pull it,\" he suggested, as if this were a reasonable alternative to waiting for the sun to move. He grabbed a thick tendril and yanked with both hands. The vine snapped back like a rubber band, slapping him squarely in the face. He rubbed his cheek, wincing, while the green wall rustled with what I chose to interpret as amusement.", "A small head popped up from behind the pumpkin. Yusuf. He had no idea how he had gotten there, which is to say he had likely climbed, jumped, or simply appeared, because he was six and the rules of physics seemed to be suggestions to him. He looked at the giant orange sphere, then at us, then back at the pumpkin with the serious concentration he usually reserved for finding lost socks.", "He lay down on the grass, pressed his ear against the cool skin of the pumpkin, and whispered, \"Sorry.\"", "It did nothing. The vine did not shrink. The pumpkin did not apologize. But it was the sweetest thing anyone had said to anything all week, and the air around us felt slightly less tangled, or maybe I was just tired.", "\"Mm,\" Gherkin said from the shadows, his voice slow and thick like molasses. \"Not... that.\""], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["Theo stared at the pumpkin. His face was red, not from anger, but from the effort of holding something back. He looked at his knee, then at the sky, then at me.", "\"I'm not good at plants,\" he said. His voice was very small. \"My grandmother died in March. I never learned. I've been sitting on staircases for three months because it's the only place nobody asks me about it.\"", "The air in the garden went still. The wind stopped. Even the birds seemed to hold their breath.", "The green muscle of the vine began to retract. It pulled itself back, inch by inch, like a tide going out. The wheelbarrow dropped with a clang. The skateboard slid free and landed gently on the grass, as neatly as a waiter setting down a plate.", "The pumpkin shrank. It stopped at the size of a cabbage. It sat there, solid and real, no longer a monster, just a vegetable."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["Nobody spoke. It was a good silence, the kind that settles over a room after the thunder stops. I watched Theo scuff his shoe against the dirt, tracing lines in the gravel like he was drawing a map of somewhere he wanted to be.", "\"I'm sorry about your grandmother,\" I said.", "The words came out before I could stop them. They felt different in my chest than usual, solid and true, like they had been waiting for me to find them.", "Theo looked up. He glanced at the pumpkin, then back at the ground. He didn't say thank you. He didn't say it was okay. He just gave a small, sharp nod.", "Behind us, the bench began to hum. It was a low, warm vibration that traveled through the wood and into the air, exactly the way a fridge works when the door is closed tight. It felt like the bench had been waiting a very long time for someone to say the right thing."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "Ada's Roses", "part": "PART TWO: ROOTS", "paras": ["*Garden Log, Day 36: Growing: pea (26 cm). Discovering: a door.*", "The pea had grown twenty-six centimeters in three days. It was impressive, if you measured it, which I did, every hour, with my tape measure. But it had not flowered. It was just a long green rope of leaves that smelled like cut grass and nothing else. I was bored. Boredom is a dangerous thing when you are eleven and have a secret garden.", "I followed a vine of honeysuckle behind the pear tree. It smelled sweet, heavy, and sticky, like the air before a storm. The hedge was thick, knotted with brown stems and sharp thorns that caught my denim jacket. I pushed through, tearing a small hole in the sleeve, but I did not care.", "\"Stop that,\" Gherkin said.", "I froze. He was on his rock, looking exactly as bored as I felt.", "\"Mm. You found it,\" he said.", "He said it quickly. That was what worried me. Gherkin never said anything quickly. He usually took four minutes to finish a sentence, often starting it in one breath and ending it in the next hour. But this time, there was no pause. No sigh. No \"Mm.\" Just the words, rapid and crisp, like snapping dry twigs.", "I looked past him. There, set into the heart of the hedge, was a door. It was small, painted a dull, fading green, with a brass handle shaped like a leaf. It looked like it had been there for a hundred years and was expecting me."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["I turned the handle. It did not squeak. It opened with a soft, heavy click, like a lock releasing a secret.", "The air that hit my face was warm and smelled of pollen and old stone. It was late October outside, grey and damp, but inside the door was a room that had forgotten the season. Sunlight, thick and golden, slanted down through the leaves. Bees buzzed lazily in the air, fat with nectar.", "The far wall was covered in roses. Not just a few, but hundreds. Red and white, climbing in spirals up the bricks. They were in full bloom, petals open and bright, defying the cold. The scent was so strong it made my head spin, like drinking too much milk.", "At the foot of the wall, half-buried in the soil, stood a small stone. It was smooth and grey. On it was carved a single word: ADA.", "I reached out to touch it, but my hand stopped in the air. The stone was cold, but the word felt warm. I looked at the roses, then at the stone, then at Gherkin, who was watching me with his unhurried, raisin-colored eyes.", "\"This is a lie,\" I whispered. \"It’s October.\"", "\"Mm,\" Gherkin said. \"Is it?\""], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["Gherkin blinked. Once, then twice, before he began to speak. It took him four minutes to finish, which is a long time for a tortoise and an eternity for me.", "\"Ada was the first,\" he said, his voice low and slow. \"She came to this garden on a Tuesday. It was raining. She met Mr. Osei. He was mopping the lift. She said one true thing.\"", "\"What did she say?\" I asked.", "\"You do not need to know the words,\" Gherkin said. \"You need to know the weight. Every rose on this wall is a true word. They bloom when someone in this garden tells the truth. When Ada died, they bloomed all at once. A burst. And they have not stopped since.\"", "I stared at the flowers. \"Why hasn’t Mr. Osei told anyone? He made this place. He has the keys.\"", "Gherkin let out a long, dusty exhale, like leaves dragging across pavement. \"Because he lost his nerve. He loved her. He kept the garden. But he forgot how to speak for it. He cannot bring himself to say it out loud. So he mops. And waits.\"", "I looked at the door, then at the roses. The beauty felt heavy, like a coat I wasn’t wearing."], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["\"I want to tell him,\" I said, my voice coming out thinner than a sheet of pastry. I cleared my throat and tried again. \"I want to tell him about the roses. About Ada. About the rules.\"", "Gherkin looked at me. He moved his head to the left, slowly, like a camera panning.", "\"Not yet,\" he said.", "I felt the heat rise in my cheeks, a sudden, uncomfortable flush. I was furious, the kind of hot, buzzing anger that makes you want to throw a shoe. I had never been so furious at a tortoise, or a person, or anything, really, except my mother when I wanted the last slice of bread.", "\"Why?\" I demanded. \"He is right there. He has been right there for years. We can tell him now. I have the tape measure. I can show him the growth. I can show him the rules. I can do it all in one go.\"", "Gherkin blinked. \"You cannot hurry a root, Sana. And you cannot hurry a person. People cannot be made to enter a garden. They have to open the gate themselves. If you push, they close the door. If you wait, they might walk in. Even if it takes a year.\"", "I looked at the stone. ADA. I wanted to shake the whole hedge, to rattle the bricks until they fell down and revealed the secret."], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["I walked out of the garden with my shoulders hunched and my fists tight. The air outside was cold again. The grey sky pressed down on the concrete blocks, making the whole estate feel small and trapped.", "I climbed the stairs to the loading bay, my legs feeling heavy and leaden. I had to tell him. I had to say it. I was about to burst.", "Mr. Osei was at the top of the stairs, holding a bucket. He looked tired. Not sleepy-tired, but the kind of tired that sits in your bones, like a stone you can’t shake out. He was mopping the same six square meters of floor.", "\"Mr. Osei,\" I said. My voice cracked.", "He looked up. He nodded.", "\"I wanted to tell you something,\" I started. \"About the garden. About Ada. About the roses. I know you know. I know you made it. I know you—\"", "\"Good evening, Sana,\" he said.", "He did not look at me. He looked at the floor. He squeezed the mop. Water dripped onto the concrete.", "I stood there. I could see the words in my mouth, bubbling up, ready to spill. But I saw the way he held the mop, the way his shoulders were slumped. I saw that if I pushed, he would close the door.", "\"Good evening,\" I said.", "It felt like the biggest thing I had ever held back. It hurt. It felt like swallowing a stone. But I kept my mouth shut."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "The Notice on the Door", "part": "PART THREE: THE NOTICE", "paras": ["*Garden Log, Day 60: Growing: pea (flowering!). Bad news: a notice.*", "The pea flower opened on a Tuesday, unfolding a center the color of a bruised plum. It was no bigger than my thumbnail, and I had measured it every day for sixty days, writing the numbers in my logbook with a precision that made my hand ache.", "Theo and Yusuf were there, and we stood in a tight circle around one small flower, silent. It felt like a christening, except nobody was holding a baby and we were all holding our breath.", "Yusuf leaned in until his nose was almost touching the petals. He did not sneeze. This was a miracle.", "Gherkin stretched his neck out from the moss, looking at the flower, then at us.", "\"Mm,\" he said. \"Nicely done.\"", "I wanted to jump, or spin in a circle, but instead I took my tape measure out of my jacket pocket and measured the stem again. Fourteen centimeters. I wrote it down, and I would do it again tomorrow, and the day after that."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["On the way home, the car park was full of people. Not cars, but people. They stood in clusters around the door of Block C, their faces turned toward the glass. The air smelled of wet wool and anxiety.", "I pushed through the crowd, my backpack banging against my hips. A woman in a yellow coat held a clipboard. She was pointing at something on the door. I stopped.", "The notice was bright yellow, stuck to the glass with four silver pins. The heading was bold: GREENFIELD HOMES PLC. Below it, in smaller, colder letters, was the title: LOWELL COURT REGENERATION SCHEME.", "I read the first line. My eyes slid over the words, trying to skip them, but they refused to move. The land to the rear of the loading bays was to be sold. Cleared.", "A forty-space car park. Work to begin this time next year.", "The woman in the yellow coat turned. She did not look at me. She looked at the crowd, as if checking that everyone had read it yet."], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["I read it three times. The phrase \"derelict land\" made my hands shake. I wanted to throw a bin at the wall. I wanted to throw the notice off the door and rip it into confetti.", "\"Derelict,\" I said. My voice was too loud. \"It is not derelict.\"", "\"Hm,\" said a voice at my elbow.", "Mrs. Ilves stood there, her knitting needles still, her grey scarf wrapped tight around her neck. She did not look at the notice. She looked at me. Then she looked back at the glass.", "Around us, the neighbors were talking. A man was complaining about the noise of the drills. A woman was counting the spaces. \"One hundred and forty,\" she said, as if the number were a personal insult.", "Nobody was asking what was behind the fence. Nobody had asked, because nobody had looked. They were angry about the parking, the dust, the change. But they were not angry about the loss. They did not know there was anything to lose.", "I touched the glass, right over the word \"cleared.\" It was cold."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["The garden was quiet when I arrived, the wind having dropped until the pear tree leaves hung perfectly still. I sat on the bench that usually hums, though today it remained silent, just a slab of wood waiting for me to make something happen.", "I told Gherkin everything. I recited the yellow paper, the phrase \"derelict land,\" and the number one hundred and forty spaces. I described the woman with the clipboard and the way the neighbors complained about the drills instead of asking what was behind the fence.", "Gherkin did not say \"Mm.\"", "He sat on a large flat stone, his head resting heavily on his front legs, his eyes closed or perhaps just moving very, very slowly. I counted the seconds, one, two, three, continuing until I reached eighty, then four hundred and eighty.", "Eight minutes passed.", "Then he opened one eye, looking at me with a slowness that felt like watching a single snowflake melt on a hot sidewalk.", "\"The last line,\" he said, his voice sounding like dry leaves scraping across stone. \"Was true.\"", "I frowned, tilting my head. \"Which line?\"", "\"The one about speaking,\" he said. \"Someone must speak for it, when the day comes.\" He blinked, once, very slowly. \"It appears the day is this one.\""], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["\"I can't,\" I said, my voice coming out small and flat. \"I am terrible at speaking. I have never put my hand up in a class. I freeze, forget what I am going to say, and sound like a robot that has been programmed to panic.\"", "Gherkin watched me. He did not offer comfort, nor did he offer a plan. He simply watched, with the patience of a creature that had outlived several civilizations, his head resting heavily on his front legs.", "\"Mm,\" he said. \"Not... yet.\"", "I waited for him to explain, for the \"not yet\" to mean \"no,\" or for him to tell me to go away and hide in a box. But he just kept watching. Slowly, the tight knot in my chest began to loosen. It did not disappear. It just changed shape, becoming a question instead of a wall.", "\"Not yet,\" I repeated, testing the words.", "I looked at the pea plant. Fourteen centimeters. Sixty days. It had not hurried, nor had it hidden. It had just grown, one centimeter at a time, until it could open its flower to the world. Maybe I could learn that too."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "The Summer Room", "part": "PART THREE: THE NOTICE", "paras": ["*Garden Log, Day 74: Growing: tomato (2 m). Sweating: me.*", "The second door was not a door. It was a gap in the hedge that looked like it had been cut with a dull knife. I pushed through the leaves, which smelled of sun and green sap, and stepped into heat that hit me like a physical wall. It was November, but here the air was thick and wet and buzzing. Cicadas droned in the branches, a sound so loud it felt like it was coming from inside my own ears.", "Rows of tomato plants stretched out before me, staked to wooden poles that stood in perfect, rigid lines. There was a lemon tree in the center, its branches heavy with bright yellow fruit that looked hard enough to dent. The vegetable bed was enormous, easily the size of the school hall, and every single inch of it was covered in deep green leaves.", "I stood there. My mouth was open. I forgot to count the seconds. I forgot to check if anything was growing too fast. For nearly an hour, I just walked. I touched the leaves. I smelled the dirt. I did not rush. The garden did not ask me to. It just was."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["The Summer Room had a thirst that made math look cruel. My can held four liters, but one hundred plants needed four liters each, twice a day. That meant eighty trips, which is a lot of running for a girl who usually walks.", "On the first day, I sprinted. I filled the can, dumped the water, and ran back, feeling like the main character in a movie where nobody asks you to stop. By day five, my legs ached and my back felt like I had been filled with wet cement from a construction site. By day ten, I was grumpy, and my smile had the quality of a forced customer service script.", "Theo arrived with a backpack and a look of supreme confidence, having been watching me from the fence with the stillness of a cat waiting for a treat. He held up two fingers. We split the work. We made it a game: if we finished before the sun hit its high point, we won.", "Yusuf was not invited to the game. He was appointed Chief Puddle. He had his own small watering can, a red plastic one that leaked like a broken faucet. He watered his shoes first. Then he watered the air. He declared the puddle on the path \"perfect\" and moved on to the next plant, spraying half the water directly onto my socks."], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["Mr. Osei was at the loading bay again, his blue overalls bright against the grey concrete. He did not look at me, but his hands were clasped behind his back, fingers interlaced so tightly that his knuckles turned white.", "I watched him from my window, holding the heavy can. I wanted to go down and ask him why he stood there, or if he could see the tomatoes and the lemon tree, the life I was feeding every morning. He stood for an hour. Then he turned and walked away without a sound.", "I filled the can again. My arms shook, and I thought about the notice on the door. One year. That is three hundred and sixty-five days of watering. That is one thousand and forty-five trips, which is more steps than I have taken since we moved here. I looked at the fence. I looked at the can. The number felt very large, like a math problem in a book I would rather not open."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["I took the stairs because the lift was out of order again, which meant ninety-two steps instead of forty seconds of standing still. Mrs. Ilves was on the landing, knitting a scarf that had already grown longer than I was tall, her needles clicking with a steady, rhythmic sound that cut through the quiet of the stairwell.", "\"You are tired,\" she said.", "\"I am doing the math,\" I replied.", "She stopped knitting and looked at me, her eyes sharp and kind. \"People who have lost someone often cannot go near the thing they loved,\" she said. \"It hurts too much. It isn't lack of caring. It is an excess of it.\"", "She went back to her knitting. I stood there, holding the can. The water inside sloshed gently against the metal, a small, heavy churning that felt less like a liquid and more like a debt I had signed up for without reading the fine print. I carried it to the bottom of the stairs and walked out to the garden, trying to keep the surface level, trying not to spill a single drop."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["The tomato was the size of a marble, red and smooth and warm from the sun that seemed to exist only inside these walls. I looked at it, then at Gherkin, who was asleep on a patch of moss near the humming bench.", "\"Can I pick it?\" I asked the plant.", "It said nothing. The leaves did not move, and the cicadas hummed their low, droning song. I reached out, my fingers closing around the stem, and it snapped with a clean, soft click. I held it in my palm. It was perfect. I bit into it, and the juice was sweet and thick, tasting like the middle of July, a memory of heat that shouldn't be possible in November.", "I broke it in half and held one piece out to Yusuf, who was watching from behind the hedge. I held the other out to Theo, who was pretending to be asleep. I ate the stem, which was bitter, but it was mine. This was what the waiting was for."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "The Party", "part": "PART THREE: THE NOTICE", "paras": ["*Garden Log, Day 90: Growing: nothing. Wilting: everything. (My fault.)*", "Nadia Okafor tapped her pen on my desk. She had a bright blue hair clip and a smile that looked like it had been tested for accuracy. \"Friday,\" she said. \"Sleepover. Your parents are okay?\"", "I looked at my hand. I was holding a ruler, measuring the width of my math book, which was a useless thing to do but my hands needed to be busy. \"Yes,\" I said. \"Mama is on night shift, but she leaves at six. Baba is at the bakery until noon.\"", "\"Great. I'll bring the board games.\" She moved on to the next kid.", "I stood up, my knees feeling wobbly, like they had forgotten how to support a body. \"Yes,\" I said again. \"I mean, that sounds good. Friday is fine.\"", "I walked to the window. The car park was grey and empty. My heart was doing a strange, fluttering thing in my chest, like a moth trapped in a tin. I had a friend. A real one. In this city.", "Then I remembered the clock.", "Friday dusk is a watering. Saturday dawn is a watering.", "I looked at the ruler in my hand, then at the grey sky. I did the math. I had two waterings to miss. Two times the garden would go thirsty. Two times I would be the one to blame.", "I put the ruler back in my pocket. My hand was shaking."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["I told Theo I would handle it. He was leaning against the hedge, pushing his sleeves up over his elbows. He looked at me, then at the wilting basil in the corner. \"You sure?\" he asked. His voice was flat.", "\"I am,\" I said. \"I have a schedule. I wrote it down.\" I showed him the note on my denim jacket pocket. It was just two lines: *5 PM. 5 AM.*", "He nodded slowly. \"Okay.\"", "The party was loud. It was not like the movies. It was messy and sticky and smelled of pizza and sweat. We played charades. I did not know the words. I flapped my hands and made faces, and I was terrible at it. But then, for one minute, Nadia laughed at my bad guess, and Theo snorted, and the sun came through the window and hit my shoulder, warm and golden.", "I stopped breathing. The noise of the room faded. I was not thinking about the clock or the roots. I was just there, in the circle of people, feeling the heat on my skin. It was perfect. It was the best minute of my life.", "Then someone yelled \"Sana, it's your turn!\" and the minute was gone."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["Saturday morning was cold. The wind cut through my jacket, which still smelled like pizza and other people's shampoo. I walked home, my boots crunching on the wet leaves, tired in a way that sleep would not fix.", "I reached the gap in the fence and crawled through. The air in the Summer Room was wrong. It did not smell like lemons and heat. It smelled like dust and dryness.", "The tomato plants were brown, their leaves hanging limp and dead to touch the soil. A lemon lay on the ground, dry and wrinkled. The whole room looked thin, as if the color had been drained out of it.", "Theo was there. He was on his knees, holding a watering can. He looked exhausted, his hands black with dirt. He did not look up.", "\"I tried,\" he said, his voice rough. \"I came early. I watered them. But it was too late for half of them.\"", "I looked at the dead plants, then down at my shoes. I had forgotten."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["\"I am sorry,\" I said. The words came out small and flat, which was not how I had planned to sound at all.", "Theo shrugged, a quick, sharp movement that looked like he was snapping a dry twig. \"It is fine,\" he said, though the tightness in his jaw said otherwise. He looked at the broken stems, then at me, and he did not look angry. He just looked tired, the way I look when I have run out of juice boxes.", "Gherkin was on the bench. He moved his head very slowly toward us, blinking with a deliberate, heavy slowness, like the shutter of a cheap camera closing on a bad photo.", "\"Mm,\" he said, his voice low and dry. \"This is what happens.\"", "I waited for him to be mad, or for a punishment to arrive, but he did not even look at the brown plants. He looked at me.", "\"The garden did not punish you,\" Gherkin said. \"The water did not come. The plants did not drink. It is only arithmetic.\"", "He turned his head back to the sun. \"Mm. Not yet.\""], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["I sat down in the dust. My knees hit the dry earth. I picked up a brown leaf. It crumbled under my fingers.", "I did not cry loudly. I did not make a sound. But my eyes burned, and my chest felt tight, like a zipper stuck halfway down a jacket. I looked at the dead tomato plants. They were not broken because I was bad. They were broken because I was not there.", "I thought about the minute at the party. The warmth on my shoulder. The laughter. I had let that minute matter more than the roots.", "Responsibility does not feel like being good. It feels like carrying a full bucket of water when your arms are shaking. It feels like the silence after you forget.", "I put the leaf back on the ground. I looked at Theo. He was still kneeling. I reached out and touched his sleeve. He did not pull away.", "The garden was quiet. The magic was not gone, but it was waiting. And I was the one who had to make it happen."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "Second Chances Are Slow", "part": "PART THREE: THE NOTICE", "paras": ["*Garden Log, Day 91: Planted: 12 seeds. Forgiven: 1 (not by me).*", "I cancelled the park trip. Yusuf stared at me with his missing front teeth, waiting for an explanation. I handed him a sandwich, and he stopped asking.", "The Summer Room was a graveyard of green. I pulled the dead stalks, and they snapped with a dry crack like the brittle ends of old bread crusts. I buried them in the soil, pressing the earth down with my knees. Theo sat on the bench, his knees pulled up, watching dust motes dance in the light. He did not help, but he did not need to; he was just there, which was more than I had been.", "Gherkin moved between the rows. He was slow, but he was everywhere. He stopped near a dead tomato plant and looked at me, letting out a low, rumbling sound that felt like a sigh from the bottom of a well.", "\"Mm,\" he said.", "It sounded disappointed. I picked up another stalk, my hands shaking because I wanted to fix it, to make it green again right now. But the earth was dry and hard, and the plants were gone. I could not bring them back. I could only make room for new ones.", "\"Mm,\" Gherkin said again, softer this time.", "I kept pulling."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["Twelve seeds sat in my pocket, heavy with promise, but I wanted the green back before the light failed, so I dumped them onto the dirt and started digging holes with frantic, scraping speed.", "\"Stop.\"", "Gherkin’s head rose. His eyes were flat and dark.", "\"One a day,\" he said.", "\"No,\" I snapped. \"The garden is dying. I can't wait. I don't have time.\"", "He blinked, a process that took a long time, like an old dial-up connection loading.", "\"The garden is not dying,\" he said. \"It is resting. One at a time is the only speed there is. You cannot buy time, Sana. You can only spend it.\"", "I dropped the seeds back into the dirt and picked up just one, a bean, then dug a small hole and put the seed in, my hands finally still. I looked at the lemon tree by the wall, brown and brittle, and my throat tightened.", "\"I let it die,\" I said aloud, my voice sounding thin and cracked, like a dry piece of toast. \"Because I wanted to be liked more than I wanted to be dependable.\"", "The air changed, and a single yellow leaf dropped from the lemon tree, landing on the dirt with a soft thud, then, right beside it, a tiny green bud pushed out from a branch, small and stubborn and new."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["Theo stood, brushing dirt from his jeans. His eyes moved from the new bud to my face.", "\"Grandma says you can kill a plant two ways,\" he said. \"Starve it. Or love it only when it is easy.\"", "He picked at a loose thread on his hoodie. The fabric frayed under his thumb.", "\"She said that to me when I was small,\" he continued, his voice dropping. \"I thought she meant don't water it too much. Like, not enough.\"", "He looked at the brown, brittle leaves. Then at the single green bud.", "\"I think she meant you have to show up when it is quiet. When nobody is watching.\"", "He sat back down on the bench. He looked at the hedge, not at me.", "\"It is the best thing she ever told me. I just didn't get it until this week.\"", "I looked at the bud. It was small. It was there because I had spoken the truth. I had not fixed the garden. I had just admitted where I had failed. And that was enough to start."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["I could not sleep. The flat smelled of old bread and dust, and Baba and Yusuf were asleep. I lay on my back staring at the ceiling, watching the clock tick through midnight, then one, then two.", "My chest felt hot. I put on my shoes, skipping the coat. The air was cool, but my impatience was not. I took the stairs, counting every single step because the rhythm kept me grounded. Ninety-two steps down. Then out to the loading bay.", "The fence was cold against my knees as I crawled through the gap. Under the moonlight, the dead plants in the Summer Room looked silver and brittle. I grabbed the heavy watering can from the porch and filled it at the tap.", "I poured the water over the roots, the new seed, and the dead leaves. I did not stop. I went back for more. One can. Then two. Then ten. My arms began to shake as water dripped down my wrists, but I kept going.", "I was not doing it because I had to. I was doing it because the roots were dry, and I was there, and that was what mattered."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["I finished the forty-second can, my arms having long since surrendered to gravity, so I let go of the metal handle. It clanged against the stone with a sound exactly like a dropped set of keys, startling me in the quiet.", "My hair was loose, and my glasses were fogged over, blurring the moonlight into a soft, useless glow. My legs felt like they had been turned into warm, wobbly jelly. I walked back toward the fence, ready to crawl out, when I saw a light.", "Mr. Osei was standing by the gate, his blue overalls dark in the night, his ring of keys jingling softly as he shifted his weight. He did not say anything, just watching me. I did not say anything either, just stood there holding the empty can.", "Then he stepped aside, making room for me to pass. As I walked by, he spoke, his voice low and smooth, sounding like the hum of the bench in the Spring Room.", "\"Someone's been watering,\" he said.", "I stopped and looked at him.", "\"Yes,\" I said.", "He nodded, neither smiling nor frowning, just giving a slow, thoughtful nod.", "\"Good,\" he said.", "He turned and walked toward the caretaker's office, the door opening to spill light onto the path. He stepped inside, and the door closed.", "I stood in the dark, holding the empty watering can, trying to work out if I had just been thanked. I think I had."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "The Meeting at the Hall", "part": "PART THREE: THE NOTICE", "paras": ["*Garden Log, Day 105: Practicing: speaking. Results: none.*", "The Community Hall smelled of damp carpet and instant coffee. Three hundred chairs faced a white screen where a pie chart rotated slowly. Ms. Vandermeer stood at the front in a grey suit that fit so well it looked like a second skin. Her hair was pinned up with a clip that caught the light.", "\"We are proposing a comprehensive redevelopment,\" she said, her voice crisp and bright. \"Parking for two hundred vehicles. Green spaces. A much-needed tidying of the estate's periphery.\"", "A woman in the front row nodded vigorously. A man in a beanie checked his phone. The pie chart turned. It showed the garden as a small, grey sliver labeled *LAND*. It was not grey because it was empty. It was grey because it did not matter.", "I gripped the plastic arms of my chair until my knuckles turned white. The plastic creaked. It was a small sound, but in the silence between Ms. Vandermeer’s sentences, it sounded like a crack in a glass plate."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["I had a plan written in purple ink on the back of my hand, the letters slightly smeared from the humidity. It said: *Say the garden exists. Ask them to look.*", "I had practiced this in the mirror of our flat, and I had even said it to Yusuf, who had looked bored, and to the bean in the yogurt cup, which had not responded, as usual. I felt ready, which is a word I use too often, but tonight it felt true.", "Ms. Vandermeer clicked to the next slide. It was a render of cars, silver and identical and gleaming.", "\"Does anyone have questions?\" she asked.", "My hand went up. It rose above the heads of the people next to me, thin and brown and trembling just once. Every head in the room turned toward me, and I counted three hundred faces, then realized that counting was not the point.", "My mouth opened. The words were there, waiting in the purple ink on my skin."], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["\"I... it... never mind.\"", "The words came out dry and flat, like a biscuit that had fallen off the counter and been picked up from the carpet. I lowered my hand. I sat down. The plastic chair squeaked under my weight, a sound that seemed to hang in the air long after I had stopped moving.", "A man in the row behind me coughed. It was a polite cough, the kind that says *I heard that, but I am choosing to ignore it*.", "Ms. Vandermeer turned to me. Her smile did not waver. It was professional, warm, and utterly empty.", "\"Perhaps after the meeting, dear,\" she said.", "It was the worst thing anyone had ever said to me. Not because she was unkind, but because she believed me. She believed that I was a child who had been confused. She did not see the garden. She did not see the rules. She saw a grey sliver on a chart.", "Theo sat next to me. He did not look at me. He did not leave. He just watched the screen, where the silver cars were still gleaming, and said nothing."], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["At the back of the room, near the fire exit, Mr. Osei stood holding his cap in both hands. He turned it over and over, the brim rubbing against his palms until the wool looked worn. In the dim light of the hall, he was very tall and still, looking like a shadow that had forgotten how to move.", "His eyes were fixed on the screen. The grey sliver of *LAND* was still there, bright against the dark. I watched his face closely. It was not angry, and it was not sad, but it was the face of a man watching a boat leave a harbor that he had spent thirty years repairing.", "He did not raise his hand. He did not speak. He just stood there, his keys jingling softly against his belt, a sound like a distant, quiet bell.", "The meeting ended with polite applause. The lights came up, harsh and white, and the grey sliver vanished into the darkness of the projector."], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["The air outside was cool and carried the sharp, damp smell of wet concrete, which settled in my nose as I sat on the steps, legs dangling over the edge. I watched the streetlights flicker on, one by one, like a row of tired eyes opening slowly after a long nap.", "Mrs. Ilves came down the steps in her slippers, the soft *thwap-thwap* of them against the pavement keeping a quiet, rhythmic beat. She was eighty-something, knitted to the chin in a thick wool shawl, and she looked at me with eyes that seemed to see right through my skin and into the messy room behind it.", "\"It's easier to bloom in the dark than under a lamp,\" she said.", "I shook my head. \"I don't know what that means.\"", "\"I don't either,\" she said, sitting down beside me with a heavy sigh that rustled her knitting. \"But it sounded good.\" She patted my knee, her hand dry and warm against my denim jacket. \"I have known you for one hundred and five days, Sana. And I think you are very brave.\"", "I looked at the dark fence at the end of the road, where the pavement ended and the rail cutting began. \"I froze,\" I said.", "\"Yes,\" Mrs. Ilves said, pulling a strand of yarn through her fingers. \"Then you'll thaw.\""], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "The Winter Room", "part": "PART FOUR: WINTER", "paras": ["*Garden Log, Day 130: Growing: nothing visible. (That's the point.)*", "It snowed on a Wednesday. Not the grey, dusty flakes we get in London, but real, white, heavy snow that landed on the car park and turned the concrete the color of old milk. For one day, Lowell Court looked like a place where things might actually grow. The bins were white caps. The broken pigeon feeder wore a hat. Even the rail cutting looked soft.", "I went to the garden. The outdoor beds were blank slates, buried under a quiet, white silence. I pulled my collar up and walked past the Spring Room, past the Summer Room where the wilting plants were tucked under frost cloth. At the back, behind the last hedge door, which wa
