s stuck tight with ice, I found the glass.", "It was a small house, all panes and iron frames, dark inside. I pushed the door open. The air rushed out, warm and thick, smelling of wet earth and cold clay. Inside, rows of clay pots sat in neat lines. There were a hundred of them. Two hundred. I lost count. And in every single one, there was nothing. Just dark soil, waiting."], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["Gherkin was on his usual log, which meant he was about to be unhelpful. He looked pleased, and a tortoise looking pleased is a specific kind of danger that usually precedes a lecture.", "\"This,\" he said, his voice heavy in the warm glass air, \"is the most important room.\"", "I looked at the rows of empty pots. \"It’s empty.\"", "\"It is full of waiting,\" Gherkin corrected. He blinked one eye slowly. \"Every seed here has been planted. Nothing shows. You cannot see them. You cannot measure them. You must believe they are there, even when you cannot prove it.\"", "I crossed my arms over my chest. The glass reflected my face back at me, round glasses and all, making me look like a very serious librarian. \"That sounds dreadful. It’s just... dirt.\"", "\"Mm,\" said Gherkin. He took a long, slow bite of lettuce, chewing with the distinct rhythm of someone who has never once been in a hurry. \"Yes. That is the point, Sana. It is dirt. And it is alive. And you cannot rush it. Not here. Not ever.\""], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["The Winter Room ran on a different set of rules. There was no audience to perform for, and no one to show off to. I planted the seed, spoke my true thing, and then I simply waited. Water in the morning, water at dusk. Do nothing else until spring. I might never actually see it grow.", "I pulled a small brown seed from my pocket. It was a poppy, tiny and rough like a single grain of coarse sand. I dug a shallow hole in the dark soil of the clay pot, dropped the seed in, and covered it up.", "I closed my eyes. I did not say the true thing out loud, because out loud it felt too big and might break. Instead, I said it only inside my head, where it was safe and small and didn’t need to be perfect. I could feel Gherkin’s eyes on me, heavy and warm like a cat sleeping on a notebook. He did not speak. He did not ask. He just watched me cover the seed with my thumb, pressing the soil down, down, down, until my thumb was red and the seed was gone."], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["Day one, I watered. Day two, I watered. Day three, I watered. Nothing happened, which was exactly what the rules said should happen, so that was good.", "On day four, I stood over the pot and my hand started to twitch. I reached in with one finger, just to poke the soil, just to see if it had moved or if it was even there anymore. I didn’t want to dig, not really. I just wanted to check.", "My finger hit the cold earth. I froze.", "I pulled my hand back and shoved it into my pocket, where my heart was beating fast and loud, like a drum in a small room. I walked out of the glass house and went to find Theo, who was mending the fence with a roll of wire. I didn’t tell him I’d almost broken the rule. I just handed him the wire cutter and helped him twist the metal. I had beaten myself, and it was the first time."], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["I sat on the bench outside the Winter Room, watching snow settle on the glass. Above me, from the window of Block C, a red scarf hung over the railing. It was so long it almost touched the pavement.", "Mrs. Ilves was leaning over her window, knitting. The needle clicked, and the yarn pulled, and the scarf grew.", "\"Four meters,\" she called down. Her voice was thin in the cold air. \"I started it the day the garden was shut. Thirty years ago. One row a day.\"", "I looked at the red wool, stretching across the grey concrete, a bright line against the white snow. \"Who is it for?\" I asked.", "She didn’t answer. She just pulled the yarn through, adding another row to the long, red wait. I went back inside, checked the pot, and watered it."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "Gherkin's Story", "part": "PART FOUR: WINTER", "paras": ["*Garden Log, Day 150: Listening: for about an hour. (Gherkin's fastest ever.)*", "The frost was thick enough to squeak. I had been awake for four hours, staring at the ceiling, counting the tiles in the bathroom. I could not sleep. The silence in the flat was too loud, so I grabbed my torch and my denim jacket and went down the stairs. Ninety-two steps. I counted them all.", "The garden was a held breath. The air was sharp and cold, and the glass of the Winter Room was white with ice. I walked to the Spring Room, where the bench usually sat. It was empty, except for Gherkin.", "He was awake. His mossy shell caught the beam of my torch. He did not move. He did not blink. I stood there, holding the light, and waited. One minute passed. Then two. I checked my watch. I have never once in my life been so happy to be doing nothing.", "\"Good evening,\" I whispered.", "He turned his head. It was a slow, deliberate rotation, like a camera panning across a view.", "\"I want to tell you a story,\" he said.", "I looked at my watch. It was four minutes later. I put the watch away."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["\"Three hundred years ago,\" Gherkin said, \"there was a boy. He was much like you. Thin. Impatient. He planted an apple pip in this spot.\" He tapped the ground with a claw. \"It was a good pip. From a good tree.\"", "The boy dug it up every morning. Once, then twice, then every hour. He wanted to see the root. He wanted to know if it was working.", "\"It died,\" Gherkin said. The voice was flat. Not sad. Just a fact.", "The boy was so sorry he planted another one. But this time, he did not dig it up. He sat beside it. He sat there in the sun, and in the rain, and in the cold. He did nothing. For one whole year, he did absolutely nothing but wait.", "The tree grew. It grew tall and strong, and it dropped apples that were sweet and heavy. The boy grew old beside it, and his hair turned white, and his hands got rough, but he never once rushed it again."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["\"That boy,\" Gherkin said, \"had a very long life. And he never once hurried it.\"", "I looked at the tortoise. \"You were here?\"", "\"I was his tortoise. I was already old when he was born.\"", "He turned his head again, very slowly, to look at the glass roof above us. The stars were coming out, one by one, through the thin ice.", "\"When he died, the garden asked me to stay. I have been waiting since then. For someone to tell the truth in it. And to mean it. Most people talk. They shout. They lie about how much they love things. But they do not mean it.\"", "He looked at me. His eyes were dark and deep and still.", "\"I am waiting for a true word,\" he said. \"Not a loud one. Just a true one.\""], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["I sat down on the bench, the stone cold through my jeans, and asked if he minded being slow, or being stuck here watching things grow.", "Gherkin did not answer immediately. The silence stretched out until it felt like a held breath, and the familiar itch to fill it began to burn in my chest. I wanted to check my watch, or say something else, or move my legs, but I forced my hands to stay still in my lap and I waited.", "\"Mm,\" he said at last. The sound was small, barely louder than the wind in the glass.", "\"I mind the world's being fast,\" he said. \"Not myself.\"", "He turned his head to look at me, his eyes dark and deep.", "\"It is not that you are slow, Sana. It is that you keep leaving before it grows.\"", "I opened my mouth because I had so many things to say, a whole list of reasons about why I was impatient, why I checked the bean every hour, and why I counted the ninety-two steps up to our flat. I wanted to argue, to explain, to prove that I was trying, but the words felt heavy in my throat, like a mouthful of dry bread that would not go down."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["The cold moved into my legs as I leaned back, watching stars that held still like a paused video. I did not mean to sleep. I only wanted one more minute of quiet. Then my eyelids got heavy, like wet biscuits.", "When I woke, the light was pale blue. The torch lay on the ground, its beam making a cone of dust. My jacket was draped over Gherkin’s shell. He had not moved. He had not taken it off.", "I sat up. My neck cracked, a sound like stepping on a crisp. The bench was humming. It was a low vibration, deeper than a purr, and the stone was warm under my hand.", "Beside my fingers, in a crack in the paving, a single white flower had opened. It was a snowdrop. That is not a plant that lives here. It is not a plant that lives in winter. But it was there, quiet and white and true."], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "Practicing on Plants", "part": "PART FOUR: WINTER", "paras": ["*Garden Log, Day 190: Practicing: speaking. Results: getting better.*", "I cannot look people in the eye. I can, however, look a rose in the eye. It is a distinction I am choosing to make.", "I stood in the Spring Room, facing the pear tree. My hands were shaking, so I held my tape measure tight to stop them from flapping. \"This garden is not a car park,\" I said to the leaves. My voice came out thin, like a wire pulled too tight. I stopped. I took a breath that tasted of cold air and dirt. I tried again. \"It has history. It has life. It is worth saving.\"", "The roses did not laugh. The pear tree did not drop a fruit on my head. Nothing happened. The silence sat on my shoulders, heavy as a wet wool blanket. I straightened my glasses. I was not done. I said it again, louder this time, pushing the words out of my chest and into the air. \"We need this place to breathe.\"", "On the third try, I felt the hair on my arms stand up. The air in the room changed. It got thick and sweet. I looked at the rose bush nearest to me. A bud, tight and green, was opening. Not all at once, but slowly, petal by petal, unfolding in the cold light.", "I want to say I felt proud. I felt mostly relieved that the plant had not judged me."], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["Theo sat on the humming bench, skates tucked under one arm, having listened for twenty minutes without turning his head. His beanie was pulled low, and his hoodie sleeves were pushed up to his elbows, revealing pale forearms that looked like they had never seen the sun.", "\"You kept saying sorry,\" he said, staring at the concrete. \"Why do you keep apologizing for existing?\"", "\"I was being polite,\" I replied, adjusting my glasses.", "\"You were wasting time.\" He pointed a finger at my denim jacket. \"Drop the 'just.' Stop looking at your shoes. You are talking to the ground, and the ground cannot save you.\"", "\"That is very rude,\" I said, \"for someone who has never spoken in class either.\"", "He shrugged, a small, sharp movement. \"Exactly why. I know how it feels to freeze. So stop freezing and start talking.\"", "We practiced until the streetlights flickered on outside the wall, turning the sky the color of old dishwater. I got better. Not great, but better. My voice stopped shaking, and my words stopped stumbling over each other like Yusuf’s toys in the hallway. Theo finally looked at me, his eyes bright and unreadable.", "\"Okay,\" he said. \"That was less terrible.\"", "It was the highest compliment I had ever received, and I accepted it with a nod."], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["Yusuf is a leaky faucet. You cannot plug him. You cannot cover him with a cloth. He simply tells the truth, loudly, and everywhere.", "\"Did you hear about the tortoise?\" he announced to Mrs. Ilves, who was hanging her washing. \"He is three hundred years old. He eats lettuce. He is very wise. He says 'Mm. Not yet.' It is very funny.\"", "By Friday, the rumor had traveled from Block C to Block A. It moved through the estate on the old-fashioned network of windowsills and open doors. People stopped me in the lift. They stared at my patched pockets, which held seed packets. They looked at my green pencil. They asked, with a suspicion that was almost funny, if I was trying to sell them something.", "I did not sell them anything. I only pointed toward the loading bay.", "That evening, a crowd gathered at the gap in the fence. There was Mrs. Ilves, knitting a scarf. There was Nadia Okafor, holding her mother’s hand. There were three men from Block A who wore coats that had seen better decades. They stood in a line, arms crossed, eyes narrowed.", "\"A tortoise,\" the tallest one said. \"In this mess?\"", "\"Impossible,\" said Mrs. Ilves.", "\"Ridiculous,\" said Nadia’s mother.", "I opened the gate. The hinges creaked, a sound like a knee bending. The crowd stepped forward. They stopped. They looked at the mossy shell. They looked at the green leaves. And then, one by one, they went quiet."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["The garden did not explain itself; it simply reacted.", "As the neighbors stepped onto the paving, the roses in the Spring Room began to bloom. It was not a sudden explosion. It was a slow, deepening of color, green turning to pink, then pink turning to red. The air smelled of wet earth and lemon zest. The bench, which usually hummed only when I told the truth, began to vibrate. It was a low, steady note, like a single, gentle hand playing a church organ.", "Mr. Osei stood by the door, his ring of keys jingling softly as he shifted his weight. He did not speak, and he did not need to. The garden was speaking for him.", "The three men from Block A looked at each other. Their suspicion drained out of their faces, replaced by something softer, sadder.", "\"I was here,\" one of them said, his voice rough. \"Before the fence went up. I played here. I had a bike.\"", "\"Me too,\" said the second man. \"We caught beetles.\"", "\"I remember the pear tree,\" said the third. \"It was smaller. Or I was smaller.\"", "They did not laugh, and they did not make jokes. They stood in the circle of green, surrounded by the blooming roses, and for a moment, the concrete estate behind them seemed very far away."], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["They started bringing things. Not gifts, exactly, but words.", "A woman from the ninth floor walked to the edge of the Summer Room, looking at her hands, then at the dirt. \"I am afraid I will fail my exam,\" she said, and her voice was small. A tomato vine, heavy with red fruit, turned toward her. The fruit ripened, turning from green to bright red in the space of a breath.", "A boy, maybe ten, stood by the pear tree. \"I do not like the new school,\" he said. The leaves rustled, a sound like applause.", "An old man from Block A said nothing for a long time. He stood by the iron gate, his hands in his pockets, while the wind blew his grey hair across his forehead. He did not move, and the garden waited, refusing to rush him.", "Finally, he looked at the tortoise. \"I miss her,\" he whispered. \"My wife. She used to come here.\"", "The bench hummed with a deep, resonant warmth. Mr. Osei stood by the gate, his hand on the iron, his eyes shut and his shoulders shaking just slightly. He did not step inside. He did not have to. The garden had heard him."], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "Someone Must Speak", "part": "PART FOUR: WINTER", "paras": ["*Garden Log, Day 220: Growing: everything. Someone came.*", "The rain tapped against the glass of the Winter Room, a steady, rhythmic sound that usually helped me think. I was watering the ferns, counting the drops as they fell, when the heavy door creaked open. I dropped the can. Water splashed onto my boots, cold and sudden.", "Mr. Osei stood in the doorway. He was wearing his blue overalls, and his cap was in his hands, held loosely at his sides. His shoulders were hunched, and he looked as if he had been standing there for a very long time, waiting for the rain to stop. It was not stopping.", "He blinked, looking at the ferns, then at me, then at the wet floor. He shook his head, a small, slow movement, like a dog drying off, but slower.", "\"I heard the bench,\" he said.", "His voice was rough, unused, like a lock that had not been turned in months. He did not step inside. He just stood in the doorway, letting the rain drip from his hair onto the concrete threshold. The garden hummed, a low, warm vibration that I could feel in my teeth. He looked at the ferns again. One of them, the tallest, was shaking its leaves, dropping water into the air."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["He stepped inside. Rain dripped from his boots, then stopped at the threshold. He moved slowly, hands hanging by his sides. He touched everything he passed. Fingers brushed the rough bark of the pear tree. A hand trailed along the ivy climbing the wall. He did not speak. He did not look at me. He was looking at the things, really looking, checking if they were still there.", "In the Spring Room, he stopped.", "There was a stone there, simple and grey, set into the earth. I had never seen him look at it before. He stood before it for a long time. The wind picked up outside, rattling the glass.", "Then, the roses bloomed.", "It was mid-January. Snow fell outside, soft and white against the dark. But inside, under the glass, every single rose on every bush opened at once. It was a sudden burst of red and pink, petals unfurling in a wave that moved from the far wall to the near one. The smell hit me first, thick and sweet, like the sugar in Baba’s bread mixed with rain. Mr. Osei stood very still, his hand flat on the stone."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["\"They are late,\" he said, his voice barely louder than the water dripping from the ceiling. \"They are always late.\"", "I didn't answer. I remembered Mrs. Ilves on her sofa, her knitting needles clicking like a fast metronome. She had told me that some people build walls instead of doors because they think keeping things safe will stop them from breaking, but things break anyway, just quieter. Mr. Osei looked at his hands, rough and stained with old soil and oil.", "\"I couldn't come,\" he said. \"Every time I looked at it, I saw what was missing.\"", "He pressed his palm flat against the stone, his fingers spreading into the cold granite. \"I built it so somebody would use it. I closed it so nobody could hurt it. I got it backwards.\"", "The roses rustled, making a dry, papery sound. I wanted to tell him it was okay, but my mouth felt full of dirt. I just nodded, and he nodded back, slowly turning away from the stone."], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["Gherkin was on the path. He had likely been there the entire time, though I had not seen him. He sat there as a small, mossy lump, his head raised and his eyes half-closed, watching Mr. Osei with a kind of bored patience.", "\"Mm,\" Gherkin said.", "Mr. Osei stopped. He turned slowly, his boots scraping against the gravel, and looked down at the tortoise.", "\"I have been waiting for you,\" Gherkin said. \"For thirty years.\"", "Mr. Osei stared. His mouth opened, then closed again, leaving a small, silent gap.", "\"You are late,\" Gherkin continued. His voice carried a tone of mild annoyance, like a teacher checking a watch during a lesson, but not anger. \"It is good to see you.\"", "It was the longest sentence I had ever heard him say. It took him six minutes to finish. I counted the seconds, just to be sure.", "Mr. Osei laughed. It was a short, sharp sound, like a crack in the glass. Then he cried. He laughed and cried at the same time, his shoulders shaking and his face crumpling in a way I had never seen before. It was messy and loud and completely real. He wiped his eyes with his sleeve, which was already covered in mud.", "\"I am sorry,\" he said to the tortoise. \"I am sorry, Gherkin.\"", "Gherkin blinked. \"Mm. Not yet,\" he said, as if this were the only logical response."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["Mr. Osei sat on the bench, which hummed under him with a low, warm note that seemed to steady his breathing. He stayed there for a long time, just listening to the rain fill the silence.", "Finally, he looked at me.", "\"What do you want me to do?\" he asked.", "I took a breath, feeling my heart beat like a drum in my chest. I thought about the Council meeting, the notice on the door, and the fact that I was eleven and did not know how to save a garden.", "\"The Council is meeting in two weeks,\" I said. \"They need to hear it. They need someone who built it. Someone who was here. Someone who knows what it is worth.\"", "I looked down at my hands, which were dirty.", "\"I can't do it,\" I said. \"I tried. I froze.\"", "Mr. Osei looked at me. \"My English,\" he said. \"It is not good enough for meetings. I speak slowly. I make mistakes.\"", "He paused, looking at the roses, then at the stone, then at me.", "\"I will try,\" he said.", "It was the first true thing he had said to me, and the bench hummed louder for just a second before going quiet."], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "The Council Meeting", "part": "PART FOUR: WINTER", "paras": ["*Garden Log, Day 234: Speaking: yes. Shaking: also yes.*", "The Council Chamber smelled of cold wood and floor wax. The ceiling was high enough to hang a kite from, if you had a very long string. Twelve wooden chairs faced a curved desk where the clerk sat behind a glass partition. He looked at the room, then at the floor, then at the room again.", "We had taken the number 4 bus. It had been full. Mrs. Ilves had brought a basket of tomatoes so red they looked like alarm lights. Theo held a pear branch that had fallen off the Autumn wall. And in a shoebox, with a towel and a bit of lettuce, was Gherkin. The clerk’s eyes slid over the tortoise as if it were a smudge on the table.", "Ms. Vandermeer walked in last. She wore a grey suit and carried a laptop bag. She stopped. She looked at the tomatoes. She looked at the tortoise. She looked at the forty people standing in the back, most of them wearing the same kind of coat. Her lips moved, but no sound came out. She plugged in her laptop and started typing."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["Mr. Osei stood up, holding his cap in his hands and turning the brim over and under while the room went quiet, that specific silence that happens when a teacher stops talking to see if you are actually listening.", "\"My name is Kwame Osei,\" he said, his voice low but filling the whole space. \"Thirty years ago, I made a garden on the land behind the bins. With my wife, Ada.\"", "He looked at his cap, then at the clerk.", "\"It fed half the estate. We had tomatoes. We had beans. We had peace.\" He paused, and the silence stretched out like a taffy pull. \"I closed it because I was sad. I was wrong.\"", "He sat down, and for a second there was nothing. Then the room erupted. Mrs. Ilves clapped, Theo cheered, and even the clerk looked up. I looked at Mr. Osei, who was wiping his hands on his overalls, but his shoulders were straight for the first time I had ever seen."], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["Then it was my turn.", "My knees had turned to that marshmallow fluff I hate, and my mouth felt like the back of a shampoo bottle, all dry and useless. The speech was written on the back of my hand, a tiny scrawl that blurred when I tried to read it. My heart was thumping against my ribs. I walked to the front, where the microphone stood up at me, impossibly tall, so I had to stand on my tiptoes just to see its face.", "I looked at the clerk, then at Ms. Vandermeer, then up at the high ceiling, counting the tiles because counting helps when you are terrified.", "\"My name is Sana Haddad,\" I said, and my voice wobbled. \"I am eleven. And I am shaking.\"", "The room laughed. It was not a cruel laugh; it was a soft, warm sound. I looked at them, and the knot in my chest loosened, and I found the rest of my sentence hiding in that laughter.", "\"I am here to talk about a garden,\" I said. \"And I am still shaking.\""], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["\"I planted a seed in that garden,\" I said, my voice steadier than my legs. \"It took sixty days to flower. I watched it every day. I measured it. I waited for it.\"", "I took a breath, trying to remember how lungs work without shaking.", "\"You cannot see a garden from a chart. You cannot see it on a screen. Your paper calls it 'derelict land.' It is not. It is the opposite. It is alive.\"", "I looked at Ms. Vandermeer. She had stopped typing, and her fingers were still on the keys, hovering like they didn't know what to do next. She was looking at me.", "\"I invite you to come and look,\" I said. \"Not with a map. With your hands. Say one true thing. And see what happens.\"", "I stepped back from the microphone, which felt much less tall now that I wasn't standing on my tiptoes. My legs felt like they had been filled with cold jelly, but I was standing upright. The room was silent. I could hear the rain tapping on the glass above the windows. It sounded like applause, but slower. Much slower."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["They did not cheer, and nobody stood up to clap. Instead, the room erupted into a debate about \"risk assessments\" and \"community engagement,\" terms that sounded like video game loading screens that never finished loading. I stood by the wall, counting the cracks in the concrete floor while they discussed \"trial periods\" for forty minutes.", "Finally, the clerk read the decision aloud. The land sale was postponed for one year, and a formal site visit would be arranged. It was not a victory, nor was it a defeat. It was just a pause, a long, held breath.", "I felt dizzy. For the first time in my life, I was grateful for the words themselves, and even more so for the wait they promised. I looked toward the door, knowing I was going back to the garden.", "\"Not yet,\" I whispered.", "And for once, it was enough."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "Day 365", "part": "PART FOUR: WINTER", "paras": ["*Garden Log, Day 365: Growing: everything. Waiting: still. (Better.)*", "A week later, the rain had stopped, but the air still felt heavy and wet, pressing down on the concrete like a damp towel. Ms. Vandermeer stood at the gap in the fence, her yellow raincoat looking too bright for the grey evening. She had no charts and no clipboard, only her hands clasped in front of her while she watched the moss on the wall.", "I was there with the watering can, coming out of habit because the sky was clearing and the soil looked thirsty.", "\"Ms. Vandermeer,\" I said.", "She turned, and her hair was plastered to her face in thin, dark strips, making her look smaller than she does in the council chambers.", "\"I saw you leave,\" she said, her voice quiet and stripped of its usual brisk efficiency. \"I wanted to see what you were protecting.\"", "I shifted the heavy can in my hands. \"The rules are simple. One true thing, said aloud. And then you sit down.\"", "She looked at me, then at the bench under the pear tree. \"I have planned for twenty years,\" she said. \"I have never once gone to look at what I planned.\"", "She walked in without asking permission and sat on the bench, where the wood hummed with a low, warm vibration that I could feel in the soles of my boots. She put her hands on her knees and stayed there, breathing, while the rain started again, soft and steady."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["Spring did not arrive with a bang, but it crept in, one green shoot at a time, like a student who arrives late and hopes nobody noticed the delay. The concrete of Lowell Court seemed to soften as the grass in the car park turned a vivid, impossible green, while the single fenced tree bloomed with white flowers that hung low and smelled of honey and old paper.", "We had one hundred and fifty volunteers for the first day. Mrs. Ilves was there, her knitting done, holding a scarf nine meters long, a thick tangle of red and green wool that she draped over Mr. Osei’s shoulders with the firmness of a general presenting a medal.", "\"For the cold,\" she said, her voice sharp with pride.", "Mr. Osei, who had not entered his own garden in thirty years, stood in the Spring Room holding a trowel. He looked like a man trying to remember how to hold a tool without breaking it, his hands hovering just above the soil as if they might be electric.", "Ms. Vandermeer signed the trial agreement. It was a simple document: one year, a community allotment, no parking, just dirt. She signed it with a pen that clicked twice when she was done, a small, satisfying sound in the quiet air."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["The Winter Room was under glass, and the light came in sideways, golden and dusty. I knelt by the third row of clay pots. My knees ached, but I did not care.", "I had forgotten the true thing I had said when I planted it. I remembered the seed, a small, hard thing, but the words were gone. I had said them to the soil, and the soil had kept them.", "I waited.", "A tiny shape broke the surface of the dirt. It was brown-green, wet, and incredibly small. It looked fragile, like a hair. Then it straightened. It was about the height of my thumbnail.", "I pulled out my tape measure. My hands were shaking, just a little. I held the metal tape against the shoot. Two centimeters.", "It was nothing. It was everything. It was the most enormous thing I had ever seen."], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["They were standing in a half-circle around me. Yusuf, Theo, Nadia, and Mr. Osei. They were silent. Even Yusuf, who usually made a noise like a static-filled radio, was still.", "Gherkin was at my elbow, moving with the slowness of a glacier, his mossy shell catching the light. He opened his mouth, then closed it, then opened it again. It took a full minute.", "\"Mm,\" he said.", "I waited.", "\"There,\" he finished.", "It was the shortest thing he had ever said to me, but it was also the most important. He had not said \"Mm. Not yet.\" He had said \"There,\" as if he were pointing at the only fact that mattered.", "I looked up at him. \"It took a year,\" I said.", "He blinked, slowly. \"Mm. Yes,\" he said. \"And?\""], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["That night, the window stood open, letting in the raw smell of wet earth from beyond the concrete. It mingled with the yeast-heavy scent of Baba’s warm bread, which was cooling on the table. I sat on the floor with my notebook in my lap and read the first entry again. *Growing: nothing. Waiting: everything.*", "I laughed, a small, dry sound that felt like shaking out a bag of stale chips. The paper was crisp under my thumb as I flipped the page.", "*Day 366. Planted: one seed. True thing: I can wait.*", "I closed the notebook, stood up, and walked to the door. I took the stairs down ninety-two steps, counting each one in the dark until my feet hit the cold concrete of the ground floor.", "I went out to the garden. I poured the water. It was enough."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "Ninety-Two Steps", "part": "PART ONE: EDGE", "page": 1}, {"n": 2, "title": "The Green Behind the Fence", "part": "PART ONE: EDGE", "page": 6}, {"n": 3, "title": "A Tortoise Named Gherkin", "part": "PART ONE: EDGE", "page": 11}, {"n": 4, "title": "One True Thing", "part": "PART ONE: EDGE", "page": 16}, {"n": 5, "title": "The Rules of the Tin", "part": "PART TWO: ROOTS", "page": 21}, {"n": 6, "title": "Yusuf Cannot Keep a Secret", "part": "PART TWO: ROOTS", "page": 26}, {"n": 7, "title": "Mr. Osei's Keys", "part": "PART TWO: ROOTS", "page": 31}, {"n": 8, "title": "The Pumpkin That Ate a Bicycle", "part": "PART TWO: ROOTS", "page": 36}, {"n": 9, "title": "Ada's Roses", "part": "PART TWO: ROOTS", "page": 41}, {"n": 10, "title": "The Notice on the Door", "part": "PART THREE: THE NOTICE", "page": 46}, {"n": 11, "title": "The Summer Room", "part": "PART THREE: THE NOTICE", "page": 51}, {"n": 12, "title": "The Party", "part": "PART THREE: THE NOTICE", "page": 56}, {"n": 13, "title": "Second Chances Are Slow", "part": "PART THREE: THE NOTICE", "page": 61}, {"n": 14, "title": "The Meeting at the Hall", "part": "PART THREE: THE NOTICE", "page": 66}, {"n": 15, "title": "The Winter Room", "part": "PART FOUR: WINTER", "page": 71}, {"n": 16, "title": "Gherkin's Story", "part": "PART FOUR: WINTER", "page": 76}, {"n": 17, "title": "Practicing on Plants", "part": "PART FOUR: WINTER", "page": 81}, {"n": 18, "title": "Someone Must Speak", "part": "PART FOUR: WINTER", "page": 86}, {"n": 19, "title": "The Council Meeting", "part": "PART FOUR: WINTER", "page": 91}, {"n": 20, "title": "Day 365", "part": "PART FOUR: WINTER", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
