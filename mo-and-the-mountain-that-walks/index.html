<script>
const D = {"title": "Mo and the Mountain That Walks", "sub": "A Village, a Very Large Friend and the Wrong Road", "pages": [{"no": 1, "ch": 1, "ctitle": "The Morning the Mountain Turned", "part": "PART ONE: THE TURN", "paras": ["*From the Walk-Book of Highstep, Day 1 of the Long Walk. Weather: fair. Distance: three miles. Direction: (an ink blot).*", "Most mornings on the mountain began with a bell, and this one did too, though it was the wrong sort of bell: a single cracked clang from the rope tower, the kind you ring when a goat has got into the cheese.", "Highstep was a village of two hundred and twelve people, forty goats, one bell tower and a great many ropes, and it sat among the pines on the shoulders of a mountain called Tor. This is not the usual arrangement for a village. But then Tor was not the usual sort of mountain. She had four legs, each the size of a hill. She had a long low head with two grey stone horns, and a back so thickly furred with moss and pine that you could live on it for years without noticing she breathed. And every spring, for as long as anyone had kept a Walk-Book, she had woken up and walked the same great circle of the land, three miles a day, with the whole of Highstep riding along and complaining about the bumps."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["Mo Ferreira did not need the bell. Mo was already awake, because Mo was always awake for the first step of the Long Walk. He stood on the flat stone of the Footpost in the middle of the village, barefoot, with his eyes shut and his toes spread, waiting for the whole of Highstep to lean the way it had leaned every spring of his life.", "He was eleven, small and wiry, in a patched green poncho with a rope belt and a brass plumb-bob that knocked against his knee. He was never seen in shoes. When people asked why not, he said shoes were like wearing mittens to read.", "Because Mo could feel Tor. Everyone in Highstep felt her walk, the way you feel a cart on a bad road, but Mo felt more. Through the soles of his feet he could tell when she was sleepy, or pleased, or itching where a squirrel had settled. It was called the Footsense. His Gran said there had been one in every other generation for eleven hundred years, and that it was a great gift, and that it did not excuse him from washing.", "Under his heels, this morning, the mountain was waking. He felt the slow roll of her great shoulders. He felt a deep, warm hum in his teeth."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["\"She's awake,\" said Junie Achebe, arriving in a hurry with a hammer in her belt, which was normal, and a piece of Mo's washing in her teeth, which was not.", "\"That's mine,\" said Mo, without opening his eyes.", "\"It was on the goat.\"", "Junie was eleven, too, and tall, with a great round puff of dark curls tied up in a yellow scarf, and a leather tool-belt so full of nails and pegs that it clinked when she walked. She was Mo's best friend, which meant she was allowed to be rude to him before breakfast. She fixed things. It was a family habit: her father built houses and her mother wove them curtains, and in all of Highstep there was nobody who could tell you as quickly what was crooked.", "\"My floor's tipped again,\" she said, handing over the sock. \"Three degrees. I measured. One day,\" she said, and here she looked at the stone, and then away, \"I'm going to live in a house that doesn't lean.\"", "\"It leans because we walk,\" said Mo.", "\"I know why it leans,\" said Junie. \"That's not the same as liking it.\"", "Behind them, Admiral the goat, who was huge, brown and white and owned one crooked horn and a tin bell, ate the rest of somebody's shirt."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["The village got ready as it did every spring. On the rope tower, Mo's father Tomás, who was large and gentle and mended the ropes that held Highstep up, checked knots and whistled through his teeth. Down in the cheese caves Mo's mother Marisol was carrying wheels of cheese as big as cartwheels down to the cellar, three at a time, with a look on her face that said she would be glad if nobody spoke to her. Mayor Marsh, round and brisk in a tall hat with a green sash, hurried across the Green with a clipboard, ringing the Starting Bell and reminding people that a village is only as orderly as its lists.", "And in the middle of it all, at her tall desk by the Footpost, sat Mo's Gran, the Stepkeeper. Ada Ferreira was tiny and upright, with a white braid to her waist, spectacles as big as saucers and a walking staff with a small brass bell on top. She kept the Walk-Book, which was the story of every day Highstep had ever walked. She wrote it down in ink. She had a thumb permanently stained blue.", "\"Weather,\" she said, licking her pen. \"Fair. Distance, three miles, as ever. Mo, are you ready?\"", "\"I'm always ready,\" said Mo.", "\"That,\" said Gran, \"is exactly what worries me.\""], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["Tor took her first step.", "It was a good step, a big slow ordinary step that rolled through the whole village like a wave through a bathtub. The goats leaned. The washing swung. Somebody's teacup slid gently to the end of its table, as it did every year, and was caught by somebody else, as it did every year.", "Then Tor took her second step, and Mo's eyes flew open.", "It had come down a little to the left.", "He knew it before anyone. He knew it in his heels. The Old Road ran to the right, through the birch gap, down toward the Spring Meadows, and it always had. He looked; there was the gap in the trees, pale and green and expecting them. And the mountain, calmly, unhurriedly, was not going to it.", "By the third step everybody could feel it. A wheel of cheese rolled off a table. The Starting Bell clanged by itself. The Mayor's hat slid over one eye. On the Footpost, Gran, with her pen still in the air, went completely still, and where the word for the direction should have gone, a single drop of ink fell and spread.", "Ahead of Highstep, for the first time in a thousand years, lay a road that nobody had ever walked."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Walk-Book Says Right", "part": "PART ONE: THE TURN", "paras": ["*From the Walk-Book of Highstep, Day 1, evening. Weather: fair, then loud. Distance: three miles. Direction: left. The Mayor has asked me not to write \"left.\"*", "By noon, the sun was high and the road was still going left. The village did not know what to do with a mountain that had made a choice, so they stood on the Green and made a committee. Mayor Marsh climbed onto a crate of aged cheddar, which was the highest thing available that did not involve climbing the rope tower, where Mo’s father was currently whistling and refusing to look down.", "\"Item one,\" said the Mayor, tapping her clipboard with a finger that did not quite fit in the space between the pages. \"The mountain is off the Road.\"", "\"It is not off the Road,\" said a voice from the back. It was Mrs. Pell, holding a basket of eggs that wobbled dangerously. \"It is merely... lateral.\"", "\"It is left,\" said the Mayor. \"Item two: Panic. Item three: Solution. We are currently at Item One.\"", "Tor took another step. The whole village swayed. Admiral the goat, who was chewing on the corner of the Mayor’s sash, let out a low, dignified baa, as if to say that this was all very improper, and then continued eating."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["\"Mountains do not have opinions,\" said the baker, wiping flour from his hands onto his apron. \"It is a tremor. A ground-shake. The earth is settling.\"", "\"The earth does not settle in circles,\" said Mo’s father, still up in the tower. \"It settles down.\"", "Gran stepped forward. She did not shout. Gran never shouted. She simply opened the Walk-Book, a heavy thing bound in leather that smelled of ink and old paper, and cleared her throat. The crowd went quiet, because when the Stepkeeper cleared her throat, you listened.", "\"Eleven hundred and four Long Walks,\" she read, her blue-stained thumb holding the page flat. \"Every single day, the direction is the same. Right, down, left, up. The Winter Hollows hold the hay. The Spring Meadows hold the seeds. If we go left, we go into the wild. There is no hay there. There are no seeds. There is only... wind.\"", "Mo looked at the birch gap, still visible to the right, pale and empty. Tor was not looking at it. Tor was looking at something else."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["\"Mo,\" Gran said. \"What do you feel?\"", "The crowd turned. Mo stood at the back, barefoot, his dusty toes gripping the grass. He pressed one heel into the earth, a habit he did when he was thinking hard.", "\"She is not lost,\" Mo said.", "The silence was sudden and very loud.", "\"Mo,\" said the Mayor, her voice soft and careful, the way one speaks to a kitten that has found a candle. \"I am sure you feel things. That is a gift. But a mountain is a mountain. It does not decide. It goes where the road goes. The road goes right.\"", "\"The road is a line,\" Mo said. \"She is a living thing. She can decide.\"", "Someone laughed. It was a gentle laugh, the kind you make when a child says the sky is blue and you know it is, but it is also green sometimes. Mo did not like it. It was worse than anger. Anger you could argue with. Laughter just rolled over you and kept going."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["Junie stepped forward into the space between the people, her yellow scarf tied tight against the breeze. She looked at Mo, then swept her gaze across the crowd before settling back on him again.", "\"If she goes left,\" Junie said, her voice sharp, \"and she does not come back, then we can leave.\"", "The crowd murmured.", "\"We can stay,\" Junie added, before anyone could stop her. \"We can build a house on the ground. One that stays still.\"", "Mo stared at her. Junie looked down at her boots, her tool-belt clinking softly as she shifted her weight from one foot to the other.", "\"You cannot just leave Highstep,\" Mo said.", "\"Nobody said we would,\" Junie replied, though her eyes were fixed on something far away. \"I said it could be a possibility.\"", "It was not a possibility. It was a dream. And dreams, Mo knew, were dangerous things to have when you were standing on a moving mountain."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["That night, the moon hung high and the pines stood perfectly still, while Mo lay awake on the flat stone of the Footpost, pressing one bare heel hard into the rock to listen.", "Tor walked. Step, step, step.", "It was a slow, patient rhythm, nothing like the hurried, anxious shuffle of a creature in pain or the confused stumbling of a lost thing. It was a walk with purpose. It was a walk with a destination.", "*I know where I am going,* the steps said, speaking plainly in the language of his soles.", "Admiral the goat, who had followed Mo to the stone, was chewing on the hem of his poncho, and Mo did not stop him.", "\"Where?\" Mo whispered.", "Tor paused. The silence stretched, thick and warm, until slowly, she took two long steps.", "It was the first answer she had ever given him."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "Two Long Steps", "part": "PART ONE: THE TURN", "paras": ["*From the Walk-Book of Highstep, Day 3. Weather: mist. Distance: three miles. Direction: still left. The goats have stopped believing in the Road.*", "The rope tower smelled of hemp and old sweat, and Gran stood on the highest platform, looking busy while she tightened a knot that was already tight, then tightened it again just to be safe.", "\"We have been doing this for two days,\" Mo said.", "\"I am inspecting the tension,\" Gran said, her voice very flat. \"A loose rope is a dangerous rope. A loose mind is worse. Tell me, Mo. What does she feel?\"", "Mo stepped to the edge and pressed his bare heel into the rough wood. Below, the pines rustled, soft and green, and he closed his eyes.", "\"Content,\" he said. \"Like a cat in a warm box.\"", "\"And?\"", "\"Curious. She is looking at the trees. Not through them. At them.\"", "Gran exhaled a sharp, hissing sound, like a kettle just before it boils, and unclenched her jaw.", "\"She is not lost,\" Gran said, which was the first time she had admitted it. \"She is going somewhere. And I do not know where.\"", "She took his hand, her dry, warm fingers closing around his, and her ink-stained thumb brushed his knuckles.", "\"Come,\" she said. \"Let us ask her properly.\""], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["The Footpost was cool against Mo’s bare soles, and Gran sat on a nearby stump with her staff balanced across her knees. She did not look at him; instead, she stared at the stone as if it might confess a secret if she looked hard enough.", "\"Stepkeepers have words,\" she said quietly. \"Not for what we say, but for what she says. We call them the step-words.\"", "She tapped her staff once on the rock.", "\"Two long steps mean yes. A pause means wait. A shiver, like a shrug, means itch.\"", "Mo frowned, remembering years of feeling those things without knowing their names. He had just called them good or bad.", "\"Three light steps,\" Gran continued. \"That means she is thinking. It is not a decision. It is a question in her head.\"", "Mo pressed both feet flat against the stone, feeling the low hum rise through the soles of his feet.", "\"It is like being handed a dictionary,\" he said. \"For a language I already speak.\"", "Gran smiled, a small, sharp thing. \"It is also a warning. If you cannot name it, you cannot fix it. And if you cannot fix it, you must follow it.\""], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["\"Are you all right?\" Mo asked the mountain.", "He felt it before he heard it. Two long steps rolled through the stone, smooth and sure.", "\"Yes,\" Mo whispered.", "He waited for the village to shout. He waited for the Mayor to run over with a clipboard. But the pines only swayed, and the goats only chewed.", "\"Are you sick?\" he asked.", "Tor paused. The silence felt like holding your breath while waiting for a spoon to fall in the kitchen.", "\"Are we lost?\"", "A shiver ran through the ground, quick and ticklish, followed by a tiny, quick step. It was so silly, so distinctly like a goat kicking a fly, that Mo laughed. The sound surprised them both.", "Admiral the goat, who had been sleeping on the rock next to Mo’s heel, butted him hard in the shins.", "\"Ow! I was talking to the mountain!\"", "Admiral blinked, then continued chewing a piece of lichen with absolute indifference."], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["The bell library was a hushed place, mostly, unless the wind decided to play the bells for a few rings. It was small, crammed with leather-bound books that smelled of dust and the particular mustiness of old paper.", "Gran walked to the shelf nearest the door and pulled a volume free. It was thick and heavy, its leather cracked and peeling like the skin on a dry riverbed.", "\"Eleven hundred and four years,\" she said, her voice steady. \"Every walk. Every step. Every turn.\"", "Mo reached for the book and opened it. The pages were thick and yellowed, the ink faded to a rusty brown rather than the usual black. He turned them slowly, his fingers tracing the edges.", "Then he saw it. A gap. A clean, sharp line where a page should have been, cut out with a knife very neatly, long ago.", "Mo stared at the empty space.", "\"Gran,\" he said. \"What was on that page?\"", "Gran put the book back on the shelf, moving a little too quickly.", "\"Books lose pages,\" she said, and her voice was tight. \"Time does that. And mice. Mostly mice.\"", "She turned away, picking up her staff and checking the brass bell on top, though she had no reason to."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["Mo closed the book with a soft thud and turned to look at Gran, then toward the window where the birch gap had shrunk to a pale smudge behind them. It was already far away, a memory of the road they used to walk.", "\"I will find out where she is going,\" Mo said, pressing one bare heel into the dust. \"If I have to ask every rock on her back.\"", "Gran did not argue. She reached into her pocket and pulled out a small, blank notebook, thin and bound in green cloth with no title on the cover. She pressed it into his hands, her ink-stained thumb brushing his knuckles.", "\"Write it down,\" she said. \"Then worry about it.\"", "Mo looked at the notebook, feeling its weight, then out to the horizon where the sky met the empty, wild country ahead.", "\"Right,\" he said.", "He tucked the notebook into his poncho. Outside, the mountain took another step, long and sure, into the unknown."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "The Missing Page", "part": "PART ONE: THE TURN", "paras": ["*From the Walk-Book of Highstep, Day 4. Weather: drizzle. Distance: three miles. Direction: left. Admiral has eaten Tuesday.*", "The rain tapped a steady, impatient rhythm on the glass of the bell library. Inside, the air smelled of old paper and wet wool. Mo sat cross-legged on a rug, his bare feet tucked under him, while Junie hauled a ladder out of a stack of crates.", "\"Careful,\" Mo whispered. \"Don't wake Bittle.\"", "In the corner, Mr. Bittle, the librarian, was buried under a pile of ledgers, snoring with a rhythm that matched the rain. He wore a cardigan with buttons that did not all match, and his spectacles were perched precariously on his nose, fogged over.", "Admiral the goat, who had followed them in for the warmth, had found something better than conversation. He was standing on his hind legs, his one crooked horn hooked over a high shelf. In his mouth was the corner of a map, an eleven-hundred-year-old chart of the Old Road.", "\"Admiral, no!\" Mo shouted.", "The goat chewed, swallowed, and burped with the confidence of a general. They scrambled up the ladder. Mo grabbed the edge of the parchment. Junie yanked the other side. With a sound like a tearing leaf, they pulled the map free, leaving Admiral with a mouthful of dust and a look of profound offense. He stamped his hoof once, then turned his back on them to lick the dust off his nose."], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["Junie climbed down and sat on the floor, her knees pressed into her chest. She reached into the leather tool-belt at her hip and pulled out a small book. It was bound in smooth leather, the color of river stones.", "\"Look,\" she said. Her voice was quiet.", "She opened it. The pages were filled with drawings. Not maps, not knots, but houses. They were neat and square, their floors flat as tabletops. In one drawing, a garden stayed exactly where it had been planted, not sliding to the left or tipping to the right. In another, a schoolhouse stood with no ropes holding it up, just solid walls and a door that opened with a handle, not a pulley.", "Mo leaned in. He had never seen her draw.", "\"I found these in the scrapbook,\" Junie said, tapping a drawing of a door. \"Still towns. Places that don't move.\"", "Mo looked at the steady lines. \"It is a good book,\" he said.", "Junie’s cheeks flushed a bright pink, the color of the dried berries on the windowsill. She closed the book and tucked it back into her belt, but she did not move away. She looked at Mo, and for a second, her eyes were very bright. Then she looked down at her hands, which were still dusted with map powder."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["They returned to the shelves, the rain still tapping a steady rhythm against the roof. Mo ran his fingers along the cracked leather covers, searching for a year when the mountain had turned the wrong way. None existed. The volumes were thick and heavy, smelling of old ink and dust.", "Junie reached for a book on the bottom shelf. As she lifted it, a loose sheet slid out and fluttered to the floor. Mo caught it before it hit the dust.", "It was a drawing, faded and thin. It showed a shape like a mountain, but it was lying down. It was stretched out beside a wide, flat glitter that stretched to the horizon. At the feet of the shape, there were tiny houses. There were no words. The edge of the paper was torn, jagged and rough.", "Junie pointed at the drawing. \"Look at that,\" she said, her voice rising. \"It works. They live there.\"", "Mo looked at the lying-down shape. He felt a hum in his teeth, low and deep. He looked at the flat glitter, which looked like a sea. He looked at the village at the feet, which looked like home."], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["\"It proves it,\" Junie said, grabbing the corner of the drawing with one hand while her tool belt jingled. \"We can leave. We can find a place that stays put. A still town. I can build a house where the floor doesn't tilt.\"", "Mo held the other corner, his bare fingers digging into the paper. \"It proves she is going somewhere. This is where she is going. It is not a place for us. It is a place for her.\"", "\"It is a place for everyone!\" Junie insisted, her yellow scarf twitching as she spoke. \"Look at the houses! They are built for people, not goats!\"", "\"They are built for stillness,\" Mo said, feeling the low hum in his teeth again. \"Tor is not still. She is walking. She is going to that glitter.\"", "\"She is old,\" Junie said softly. \"Maybe she is tired.\"", "\"She is not tired,\" Mo said, and his voice came out sharper than he meant it to be. \"She is going.\"", "They stood there, pulling gently on the paper, the rain tapping a steady rhythm on the glass above them. Mr. Bittle stirred in his pile of ledgers, his snoring rising high and thin, sounding almost like the whistle of a kettle. He lifted one hand, blinking, and looked at the two of them."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["Mr. Bittle blinked, rubbed his eyes, and looked at the drawing, then at them. \"Is that a map?\" he asked, his voice thick with sleep.", "\"No,\" said Mo.", "\"Yes,\" said Junie.", "Mr. Bittle shrugged, a movement so slow it was almost a yawn, and went back to sleep. Mo and Junie let go of the paper. The silence in the library was heavy, filled with the smell of dust and the sound of rain.", "Mo folded the drawing carefully. He did not give it to Junie. He tucked it into his green cloth notebook, the one Gran had given him, and tied the string tight.", "\"I am going to the Ear-Keeper,\" Mo said. \"He hears the hum. He will know where she is going.\"", "Junie looked at him. \"You are going to climb the Ridge? In the rain?\"", "\"I have to know,\" Mo said.", "He walked to the door. Junie stood still, her hands in her pockets, watching him go. Outside, the rain was falling harder, washing the dust from the steps. Mo stepped out into the wet air, and did not look back."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "The Ear-Keeper", "part": "PART ONE: THE TURN", "paras": ["*From the Walk-Book of Highstep, Day 6. Weather: clear, cold. Distance: three miles. Direction: left, and confident. Mo is missing from supper. Again.*", "The rain had stopped, leaving the Ridge slick and smelling of wet pine resin. Mo pulled his green poncho tighter against the chill. The ridge was a long, grey band of rock that ran down the center of Tor’s back, slick with moss that clung to the stone like a stubborn sock. He walked slowly, careful of his bare feet.", "Behind him, Admiral the goat trotted with a tin bell that clinked in time with Mo’s steps. The goat had not asked to come. He had simply decided that if Mo was going to climb the mountain, so was he. It was a very logical plan, in goat terms.", "Far below, the lights of Highstep twinkled in the dark. They looked like a spilled jar of sugar, tiny and sweet and scattered across the dark green blanket of the forest. Mo paused, pressing one heel firmly into the cold rock. He waited. The mountain breathed, a slow, deep exhale that ruffled the tips of the pines.", "He looked up. The ridge disappeared into the shadow of the pines, leading toward the head of the mountain. The air was cold and smelled of old wood and stone."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["The head of the mountain was a place of deep shadows and old roots. The pines here were ancient, their branches heavy with needles that dropped like soft, green snow. Among them, Tor’s great ear lifted out of the trees. It was not quite an ear, not really, but a curve of stone and skin that folded back on itself like a cupped hand.", "Mo climbed over a low wall of roots and found the cave. It was a hollow in the rock, warm and dry. A single lantern burned on a shelf, casting a circle of orange light against the dark stone.", "Old Hale sat on a wooden stool in the center of the light. He was lean, with a beard that looked like a snowdrift that had decided to stay on his chin. He wore a knitted cap with earflaps that hung down to his shoulders. His eyes were closed. He was humming.", "It was a low sound, a vibration that Mo felt in his chest before he heard it with his ears. Hale hummed back at the mountain. It was a conversation, one-sided and gentle.", "\"Evening,\" said Mo, stopping at the edge of the light.", "Hale did not open his eyes. He did not stop humming."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["\"You fidget,\" said Hale. His voice was dry, like leaves skittering on stone. \"I can hear it in your toes.\"", "Mo stood very still, refusing to blink even though his eyes burned, and waited for the hum to finish, but it went on and on, a long winding melody that seemed to have no end. Admiral, the goat, had found a flat rock and lay down with his head on his paws, and the tin bell stopped clinking.", "Mo’s legs ached, and his poncho itched, and he wanted to ask why, what, and where, but he kept his mouth shut. He listened to the hum, and he felt it change. It was not the walking hum, the steady roll of the Long Walk. It was softer. Rounder.", "After a long time, the humming stopped. The silence settled in, smelling of woodsmoke and old stone.", "\"Better,\" said Hale.", "Mo exhaled, and his knees felt like water."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["Hale opened one eye, bright and sharp, and looked at Mo with an intensity that made the boy want to stand up straighter. \"The song has changed,\" he said.", "Mo nodded. He had felt the shift in the soles of his feet, a subtle difference from the usual steady rhythm. The mountain was not just walking; she was pausing, testing the ground before each foot landed.", "\"For fifty years,\" Hale said, leaning back on his stool and resting his knitted cap on his knee, \"it was a walking song. Forward, forward, and around. Steady as a heartbeat.\" He tapped his finger once on his shin. \"But this spring, it is slow. Rounder. And there is a long, low note at the end of each line, the way you hold the last crumb of a scone you really like.\"", "Mo looked at the stone wall, watching a patch of moss sway gently in the breeze. \"What does it mean?\"", "Hale smiled, a small and sad expression that crinkled the corners of his eyes. \"It sounds,\" he said, \"like a song about going home.\"", "Mo felt a little jump in his chest. Home. They were home. They were on the mountain, in Highstep, with the cheese caves and the rope bridges. That was home. But the word felt different in Hale’s mouth. It felt like a place that was very far away, and very close, at the same time.", "\"Whose home?\" Mo asked.", "Hale looked at him, and his smile faded into the shadows of the cave."], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["\"That,\" said Hale, \"is the question, isn't it?\"", "He closed his eye again. The lantern flame wavered, casting long, dancing shadows against the rock walls.", "\"I will say no more tonight,\" Hale said. \"Some things you have to hear for yourself. You have to feel the ground under your own feet, Mo. Not mine.\"", "Mo stood up. His legs were stiff, but he felt lighter, somehow. As if a weight he had not known he was carrying had been set down.", "He walked to the entrance of the cave. The night air was cold and crisp. Far below, in the valley of the village, a very small bell rang. It was a quick, anxious sound. Someone in Highstep had started to pack.", "Mo looked down at the lights. They seemed smaller now. Dimmer. He turned back to the dark ridge, and began to climb."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "The Vote", "part": "PART TWO: THE WILDS", "paras": ["*From the Walk-Book of Highstep, Day 8. Weather: fair. Distance: three miles. Direction: left. There will be a vote. There is always a vote.*", "The wild country did not look like a place to live. It was a long grey range of jagged peaks, sharp and silent. No road. No farm. No one waving from a window. The air smelled of cold stone and pine sap, not of cheese and woodsmoke.", "Mayor Marsh stood on the Green. Her clipboard was held like a shield. She adjusted her green sash, then cleared her throat. The village leaned in, listening to the wind that had suddenly started to blow.", "\"The Old Road is gone,\" she said. Her voice was flat, the way it got when the numbers didn't add up. \"Our winter stores are for one circle, not for wandering. In fifteen days, we reach Stony Pass. The gap is narrow. Tor will have to squeeze through.\"", "She pointed a thin finger at the rocky ridge ahead.", "\"Below that pass hang the Last Ladders. They drop straight down to the plain, to Lowbrook. It is solid ground. It does not move. It does not turn.\" She looked around the Green, her eyes hard and bright. \"Anyone who wishes to descend to solid ground may do so at the Pass. This is a vote.\""], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["Gran did not raise her hand. She sat on her stool, her staff resting against her shoulder, the brass bell on top catching the light. She watched the Mayor with a look that said she had seen this argument before, in a different life, perhaps.", "\"The Stepkeeper keeps the book,\" Gran said, her voice dry as old paper. \"She does not decide the walk. Tor walks. We ride. That is the arrangement.\"", "But the hands went up. One by one, then in clusters. Mo counted them with the same part of his brain that counted his heartbeats. Not everyone. But a great many. The cheese-makers. The rope-menders. Half the goat herd’s owners.", "Junie’s family were among the first. Her father, Papa Achebe, stood with his arms crossed, looking at the ground. Her mother, Mama Achebe, nodded once, a small, decisive nod. And Junie, standing between them, looked down at her boots. Her boots were muddy, and the dirt was packed into the soles. She did not look at Mo. She did not look at the mountain. She looked at the solid ground below, imagining it."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["Dinner at the Ferreiras’ was quiet. The table held bread, salted fish, and a wedge of sharp cheese that still smelled of the caves. Mo’s mother, Marisol, wiped her hands on her apron. Her forearms were strong, dusted with white flour that never quite washed out.", "\"My back,\" she said, not looking at Mo. \"I have carried cheese wheels up and down for ten years. It feels like a knotted rope.\" She picked up a piece of bread, tore it, and ate it slowly. \"A house that stays still would let me rest. I would like to feel the floor under my feet. Not just the tilt.\"", "Mo’s father, Tomás, was mending a coil of rope on his knee. He did not look up. His hands moved with a steady rhythm, pulling the fibers tight.", "\"Highstep is people who walk together,\" he said softly, whistling through his teeth. \"If we leave, we are not Highstep. We are just people in a town. I cannot picture a Highstep on the ground. It would be like a boat stuck in the mud.\"", "Mo looked from one to the other. They were two halves of the same worry, cut in different places.", "\"You should ask her,\" Mo said. \"Tor. She knows why she is turning.\"", "They both looked at him. At the same moment, in perfect unison, they said, \"Mo.\""], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["Mo went to his bed, which was a narrow frame with a mattress that smelled of dried lavender and wool. He did not sleep. He lay in the dark, counting.", "One hundred and ten hands up. Ninety-eight down. Four people who could not decide and had gone home to argue with their mirrors.", "It was the first time in his life the village had not agreed about anything. In Highstep, they agreed on the weather, on the cheese, on which goat was the ugliest. They agreed because they were on the same back, moving in the same direction. Now, for the first time, they were moving in two directions.", "The room was dark, but he could feel the slight tilt of the floor. It was a gentle lean, a reminder that the ground was not solid. It was a living thing, breathing under his head. He pressed his bare heel into the wood, waiting for a step. Waiting for a sign. But there was only the slow, steady creak of the timber, and the silence of a village that had split in half."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["He was still counting when Admiral climbed onto the bed. The goat was heavy, and the frame groaned. He settled himself with a sigh that sounded like a deflating tire, his crooked horn resting against Mo’s shoulder.", "\"You’re not supposed to be here,\" Mo whispered.", "Admiral blinked his large, golden eyes. He looked at Mo, then at the corner of the room, where the Mayor’s cheese crate sat. His mouth twitched. Mo realized, with a slow, dawning horror, that the goat had eaten the ballot slip.", "\"You ate the vote,\" Mo said.", "Admiral chewed. A small piece of paper, soft and brown, fell from his mouth onto the blanket. He looked entirely unrepentant. He looked, in fact, pleased with himself. Mo opened his mouth to shout, to be angry, to be the person everyone expected him to be. But then, because he was eleven and tired and the goat had the audacity to lick his ear, he laughed. It was a small, broken sound. Then he stopped, because the laugh felt wrong in the quiet, split world of Highstep."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "The Goat Stampede", "part": "PART TWO: THE WILDS", "paras": ["*From the Walk-Book of Highstep, Day 10. Weather: wet, then wetter. Distance: two miles and a swim. Direction: left, across a river nobody has named.*", "The river was brown and wide and very loud. It stretched across the path like a barrier made of mud and noise. Tor did not stop. She did not hesitate. She simply walked into it.", "The water rose around her stone-grey legs, swallowing the lower pines, swallowing the first step of the Old Road. Silver sheets of river water poured off her flanks, catching the grey morning light. Highstep, perched safely on her shoulders, jolted and tilted. The villagers shrieked, some of them grabbing the pine branches, others laughing with a terrified, breathless delight.", "Mo stood barefoot on the wet moss, his toes curling against the cold. He felt the displacement in her bones, a deep, shifting weight. Tor hummed, a low vibration that rumbled through the soles of his feet and settled in his teeth. She was not afraid. She was curious.", "On the side of the mountain, a rope bridge swayed in the wind, hanging loose like a hammock that had forgotten its purpose. Mo looked at the far bank, then at the water, then at the mountain’s head, which was already deep in the current.", "\"Gran,\" Mo called out, his voice thin over the roar of the water. \"She’s not stopping.\"", "Gran’s voice came back, small and dry, from the rope tower. \"That is what we are here to see.\""], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["The goats were not as brave as the mountain.", "They were panic. Forty brown and white streaks of terror, their tin bells clattering in a frantic rhythm, they had smelled the water before Tor touched it. They had seen the brown current and the rushing foam, and made a decision that required no voting.", "Admiral, the large goat with the crooked horn, was at the front. He was not running away from the water. He was running toward the Tail.", "The Tail was where the mountain’s own stream tumbled down from her hindquarters, a roaring waterfall that crashed into the river below. The herd bolted along the swaying rope bridge, their hooves pounding the wooden planks. The bridge groaned and swung.", "Mo and Junie were meant to be mending a fence. Instead, they were chasing forty goats across a swinging rope bridge in the middle of a river.", "\"Get back here, you stubborn beasts!\" Junie yelled, her yellow scarf flapping wildly in the wind. She held a hammer in one hand and wore a very serious expression.", "Mo did not yell. He was too busy keeping his balance. The bridge dipped. Water splashed up and soaked his poncho. He felt the mountain’s steps below, slow and steady, while above them, the goats were a storm of wool and noise.", "\"Admiral, wait!\" Mo shouted.", "Admiral did not wait. He reached the end of the bridge and leaped onto the wet rock, leading the herd straight toward the roar of the waterfall."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["Junie stopped running. Without a word, she dug into her leather tool-belt, pulled out a large wooden peg, and tossed it to Mo.", "He caught it. He looked at the peg, then at the loose rope hanging from the bridge’s anchor point, and finally at the goats vanishing into the mist of the Tail.", "Junie pointed to the rope, then to the loose knot, and finally at the ground.", "Mo understood. She had worked it out in a second. The goats would run to the waterfall, but the mist would blind them. The loose rope, if tied to the anchor and dropped, would create a barrier of water and noise that they would not want to cross. They would turn back. They would have to turn back.", "Mo looked down. He closed his eyes and pressed his bare heel into the wet stone.", "He felt Tor’s tail. It was a long, slow movement, a shift of weight deep in the mountain’s body. He counted the beats in his feet. One. Two. Three.", "\"Now,\" he said.", "Junie did not ask why. She tied the peg to the rope while Mo pulled. The rope snapped taut, and the water from the Tail splashed down, creating a white curtain between the bridge and the rocks.", "The goats stopped. They looked at the water. They looked at Mo. Then they looked at each other.", "It worked like a pair of hands clapping. Clean. Simple. No words needed."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["The herd turned. They retreated up the bridge, confused and wet, their bells ringing a confused rhythm while Mo and Junie herded them using their voices and hands, guiding them into the safe hollow of the Fold.", "The Fold was a mossy alcove under the mountain’s shoulder. It was dry there, protected from the river spray, and the goats piled up against each other to form a giant woolly cushion of brown and white. They bleated and jostled, but they were safe.", "Mo and Junie stood in the middle of the moss, dripping wet, their ponchos and clothes soaked through. They were laughing, a tired, breathless laugh that comes after you have chased something you did not want to catch.", "\"Admiral,\" Junie said, scanning the pile of goats. \"Where is Admiral?\"", "They looked. They counted. Thirty-nine.", "\"Missing,\" said Mo.", "A bell clanged from above.", "They looked up. Admiral was sitting on the very top of the mossy mound, high above the others. He had a piece of the rope in his mouth and looked down at them with his large, golden eyes. He looked entirely unrepentant, or perhaps, in fact, as if he had planned the whole thing.", "He chewed on the rope. He blinked.", "\"That was his idea,\" Mo said, and he was not joking."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["The quarrel about leaving vanished. The rain had stopped. The mist was thinning. The goats settled to chew their cud.", "Mo looked at Junie. She was wiping water from her eyes, though her cheeks were wet from the river, not tears. She glanced at the pile of goats, then at the rope, then at Mo.", "\"This,\" she said quietly. Her voice was small, lost in the quiet of the Fold. \"This is what I will miss.\"", "Mo frowned. \"Miss?\"", "Junie looked away. She tucked a strand of dark curls behind her ear. \"I’m not going to talk about it.\"", "They both looked at their wet boots. The leather was dark and heavy. The moss under their feet was soft and green. The mountain hummed, a low note that they could feel in their bones.", "Mo felt something sink in him, slow and heavy, like a stone dropping into a pond. The water in his chest rippled. He did not know what to say. He did not know how to fix this. He only knew that the mountain was still walking, and the road was still ahead, and Junie was right there, shivering in the damp air.", "He reached out and took her hand. She did not pull away."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "The Storm on Her Back", "part": "PART TWO: THE WILDS", "paras": ["*From the Walk-Book of Highstep, Day 12. Weather: a storm of the old sort. Distance: one mile. Direction: down, mostly.*", "The wind did not arrive; it invaded. It came down from the grey range with a sound like a thousand sheets tearing. The sky turned the color of a bruise, a deep, angry purple that hurt to look at. Mayor Marsh’s clipboard clattered as she slammed it shut. \"Storm cellars! Now!\" she bellowed, her tall hat already fighting for its life against the gale.", "Dad and the rope crew were already moving. They scrambled along the swaying bridges, hands flying, tying down shingles and securing the cheese racks. The air smelled of wet pine and fear. Mo stood on the Footpost, bare feet pressed into the cold stone. He did not need to look up. He could feel it in his heels.", "Tor was stopping.", "It was a heavy, deliberate halt, a grinding of ancient joints. The mountain was not running from the storm. She was waiting. Mo’s toes curled. The thunder was far off, just a rumble in the distance, but the wind was screaming closer, a wild and hungry thing. He knew, with the certainty of bone and root, that they were about to be hit."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["Then the storm hit like a hand.", "The rain did not fall; it flew, sideways and stinging. The pines bent until their tips touched the ground. The bell tower swayed, the ropes singing a high, thin note of distress. On the Green, a roof tore loose from the cheese caves. It sailed into the grey air, carrying with it a single, tall hat with a green sash.", "\"Mo! Get inside!\" Gran shouted, her voice barely audible over the howl of the wind. She was huddled under her cloak, the Walk-Book clutched to her chest.", "Mo did not move. His feet were planted. The stone under him was vibrating, a low, deep thrum that matched the heartbeat of the world. He looked at the swaying roofs, at the terrified faces of his neighbors, at the roof flying away. He looked at his Gran.", "\"Gran,\" he said, his voice surprisingly steady. \"She’s not done.\"", "He turned and ran toward the Footpost, the wind tearing at his poncho, the rain soaking his hair in seconds."], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["Mo pressed his heel to the stone. He closed his eyes.", "Under his foot, the mountain groaned. It was a sound like a hundred heavy doors opening at once, a deep, tectonic shift that shook the dust from the eaves. He felt her muscles, vast and slow, engage. Tor was turning.", "It was a movement so large it seemed to take an hour, though it was only minutes. The great shoulder of the mountain swung round, slowly, deliberately. She angled her back into the wind. The village, which had been on her shoulder, was now in the lee of her body, protected by her massive, moss-covered flank.", "The wind still screamed, a furious, relentless shriek. But the rain no longer stung. It fell straight down, around them, not on them. The swaying stopped. The ropes went slack. The village sat in the shadow of the mountain, dry and still, while the storm raged just outside the circle of her protection."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["In the storm cellar, the noise of the wind seemed muffled, as if the air itself had thickened. The families sat in the dark, listening to the rain hiss against the stone walls. It was quiet, a strange and sudden calm.", "Gran sat on a wooden crate, the Walk-Book open on her knees. Her spectacles were fogged. She looked at Mo, who stood in the center of the room, his feet still dusty, his hair wet.", "\"Ada,\" Mayor Marsh said, her voice small. \"What is she doing?\"", "Gran did not look at the Mayor. She looked at Mo. \"Eleven hundred and four years,\" she said, her voice dry and crisp. \"I have kept the book. I have never seen a mountain shelter her people. I have never seen her turn.\"", "Mo looked at the ceiling, where the rain was drumming a steady rhythm. He felt the vibration in his teeth, a low, steady hum.", "\"She’s saying something,\" Mo said.", "\"What?\" Gran asked. She leaned forward, her eyes wide behind her glasses.", "Mo looked at her, and then at the others. \"I’m here,\" he said."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["By the time the sky cleared, it was scrubbed and bright, a pale blue that felt new. The villagers emerged into a world of dripping pines and silence. The air smelled of clean rain and crushed moss.", "A cheese wheel, large and yellow, was lodged in the branches of a pine tree, swaying gently. Somebody laughed, a short, surprised sound that echoed off the rocks. The tension that had held the village together for days seemed to dissolve with the steam rising from the wet ground.", "Mayor Marsh found her hat. It was perched on the crooked horn of Admiral the goat, who was chewing on a piece of rope with the air of a general who had just won a battle. She reached up and took it. The hat was wet, the green sash dark with rain. She held it for a long moment, looking at the mountain, then at the hat, then at her people.", "She did not say anything. She put the hat back on her head, straightened the brim, and walked away. But as she passed Mo, she did not call the mountain \"the problem.\""], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "What Tor Carries", "part": "PART TWO: THE WILDS", "paras": ["*From the Walk-Book of Highstep, Day 14. Weather: fair. Distance: three miles. Direction: left. The goats are unpacked. The Mayor is not speaking to the goats.*", "The errand was simple, which was why Mo did not like it. Mrs. Pell’s knees ached from the storm, and she wanted a sack of the soft, spongy moss that grew only in the Fold. Getting there meant climbing down a narrow chute of rock between the pine roots. The rope bridges avoided this place for good reason. It was damp, dark, and smelled of wet stone and old rain.", "Mo went first. His bare feet found purchase on the slick lichen. Junie followed, her tool-belt clinking against the rock face. \"Careful,\" she said, her voice echoing weirdly in the hollow space. \"If you slip, you’ll go all the way down. I don’t think there’s a net.\"", "\"There’s no net,\" Mo agreed, pressing one heel into the groove of a root. He felt a faint vibration, a low thrum from deep within the mountain’s shoulder. Tor seemed calm here, almost sleepy, her heat radiating up through the rock. \"She likes it down here. It’s like a pocket.\"", "The air grew warmer as they descended, thick with the scent of crushed ferns. Glowing blue lichen dotted the walls, pulsing softly in the dim light. It was quiet down there. A silence that felt held in, waiting. Mo looked back at the shaft of daylight far above, then at Junie, who was checking her nails for sharpness. She looked nervous. He wanted to say something to make it better. But the moss was calling to him, soft and green and waiting."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["They dropped onto a bed of ferns so dense it swallowed their boots, if they had worn them. The Fold was a hidden room in the mountain’s side, a cavern of dripping stone and ancient shadow. But it was the walls that stopped Mo cold.", "Carvings. Dozens of them, scratched deep into the grey rock.", "Junie ran her hand along the surface, her fingers tracing the grooves with a builder’s precision. \"Tally marks,\" she said, her voice hushed. \"Groups of five. Hundreds of them.\" She turned to Mo, her eyes wide behind her spectacles. \"That’s not decoration. That’s a count.\"", "Mo stepped closer. He did not read the marks; he felt them. He pressed his palm flat against the stone, feeling the vibration of the cuts. They were old, worn smooth by time, but the intent was there, sharp and deliberate. And there were other things, too. Handprints. Tiny ones, no bigger than a child’s palm, pressed into the rock.", "\"Somebody was here,\" Mo whispered. \"Before us.\"", "Junie looked at the handprints, then at the small, intricate figures carved beside them: stick people with tools, with ropes, with goats. \"They were just like us,\" she said. \"Living on the back. Keeping count.\""], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["The row of handprints stretched along the wall, one for every year of the Long Walk, creating a long, unbroken line of history that felt heavier than any stack of books. Mo followed it with his eyes, counting the gaps where the stone was too worn to see, until the shapes seemed to flow into the dark like a river of small, silent voices. Then, at the very end of the row, the carving changed completely.", "It was not a handprint. It was a scene.", "A mountain, huge and grey, lay down. Not walking, not standing, but resting. Above it, a wide curve of water was drawn with a single, confident line. In the foreground, a crowd of tiny figures stood on the shore, holding hands in a circle that looked familiar, like the way Gran and Mo held hands when they walked the rope bridges at dusk.", "Junie stared. Her breath hitched, a small, sharp sound in the quiet cave. \"Mo,\" she said, her voice barely a whisper. \"This is the drawing.\"", "Mo looked at the carving, then at Junie. The image in his mind from the library, the faded drawing with its strange, unfinished edge, matched the rock perfectly. The mountain was not lost. It was going somewhere. Somewhere with a shore."], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["\"Maybe that’s what happens,\" Junie said. She did not look at Mo. Instead, her eyes stayed fixed on the carving, her face tight and careful, like a child trying not to cry in front of a teacher. \"When it stops. It gets a shore. A house that stays.\"", "Mo felt a cold prickle at the back of his neck. \"I don’t want a shore,\" he said, pressing one bare heel into the stone floor to steady himself. \"I want Highstep.\"", "\"Highstep is just a word,\" Junie replied, and this time she turned to face him. Her voice was sharp, but her hands were trembling against her leather tool-belt, the nails clinking softly. \"It’s just a group of houses on a moving thing. If the thing stops, the houses are still there. But they’re different. They’re... still.\"", "Mo heard the words, but he did not hear the shake underneath, the fear that lived in her throat, the terror of a floor that would finally stop tilting. He wanted to reach out and hold her hand, to tell her that Highstep was the people, not the place. But the words stuck in his mouth, heavy and useless, like a mouthful of dry hay. The mountain hummed, low and deep, a sound that vibrated in his bones. It was not sad. It was waiting."], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["They climbed back up the chute in silence. The air grew cooler as they ascended, the smell of the deep Fold fading, replaced by the scent of pine needles and wet earth. When Mo emerged into the light, the sun was high and bright, the sky a pale, washed-out blue.", "Admiral was waiting on a flat rock above them. He was chewing on something. He looked at Mo, his one crooked horn tilted, and swallowed. Then, with a soft *thump*, a crumpled piece of paper fell from his mouth.", "Mo frowned. He walked over and picked it up. It was torn, stained with grass and goat drool. But it was not just scrap. It was a map. A map of the ground ahead. A river, a plain, and far away, a thin, blue line that looked like water.", "Junie took it from him, her hands shaking. \"He’s been eating it,\" she said. \"He’s been saving it for us.\""], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "Halfway to Nowhere", "part": "PART TWO: THE WILDS", "paras": ["*From the Walk-Book of Highstep, Day 16. Weather: bright and hard. Distance: three miles. Direction: left. Supplies: I have counted them twice. Once was enough.*", "Mayor Marsh stood on an overturned cheese crate, her green sash flapping in the dry wind. She held a clipboard so high it nearly blocked the sun. \"We have enough oats for fourteen days,\" she announced, her voice cracking on the number. \"After that, we eat what Tor eats. And Tor, as we have observed, is eating the dirt.\"", "The village Green was quiet, save for the low, collective rumble of forty goats who had smelled the empty feeders. Mo watched Mrs. Pell, usually so blunt, pick at the hem of her straw hat. \"Well,\" she said, loud enough for the whole Green to hear, \"if we had gone right, we’d be grazing on clover by now.\"", "It was a small thing, a few words in a dry wind, but it hung in the air. People who had shared cheese and rope knots for a lifetime suddenly looked at each other with the cold calculation of strangers. A man named Pim stepped forward, pointing a finger at a sack of barley near the rope tower. \"That is mine,\" he said.", "\"Everyone’s,\" said the baker.", "\"Mine first,\" Pim insisted.", "Before the argument could turn into something worse, Mo’s father stepped in. He did not shout. He simply uncoiled a thick length of hemp rope from his shoulder and wrapped it around Pim’s wrist and the baker’s elbow, tying them together with a firm, gentle knot. \"Hold,\" Dad said, whistling softly through his teeth. \"We are all in this.\""], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["The Achebe house was a cloud of dust and wood shavings. Mo watched from the shadow of the rope tower, his bare feet pressed flat against the stone, feeling the vibration of saws and hammers from below. It was a different rhythm than the walk. It was the rhythm of leaving.", "Junie climbed the ladder, her yellow scarf fraying at the edges. She looked thinner. Her tool belt, usually clinking with confidence, hung low and heavy. She held out a hand. \"I need my mallet,\" she said.", "Mo did not move. \"Junie.\"", "She stopped on the third rung. Her eyes were bright, but she did not look up at him. Not yet. \"It’s in the kit bag,\" she said.", "\"You’re going,\" Mo said. It was not a question. He felt it in his soles, a sudden, sharp absence, as if a stone had been plucked from the path of his life.", "Junie climbed the last rung. She did not take the mallet. She just stood there, looking at the dust motes dancing in the shafts of light. \"We are,\" she said. \"We have to.\""], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["\"Since when?\" Mo asked. His voice came out thin and squeaky, like a bird trying to sing through a jar.", "Junie turned. The morning sun caught the dust motes swirling around her curls. \"Since the morning she turned,\" she said. Her voice was steady, though her hands were trembling so much she had to wrap her arms tightly around her waist to keep them from shaking. \"I’ve wanted a floor that doesn’t tilt. A house that is still there in the morning. A place I can find again. My mama is scared, Mo. And I am too.\"", "Mo looked down at the plain below, where the wild and empty country stretched out like a drawing left half-finished by a careless hand. \"But Tor is alive,\" he said. \"She’s going somewhere.\"", "\"She’s going somewhere we don’t know,\" Junie said. \"And I can’t keep guessing. I can’t keep fixing what is broken because the ground is moving. The vote was right.\" She held out her hand again, this time to him. \"Come with us. We can fix the house. We can make it still.\""], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["Mo pulled his hand back. He looked at the map in his pocket, the one Admiral had saved. He looked at Junie. He could not hear the fear. He could only hear the leaving.", "\"You’re giving up,\" he said, and his voice was hard, edged with an anger he didn’t understand. \"On Tor. On Highstep. On me.\"", "Junie flinched. The light in her eyes went out, replaced by a cold, flat surprise. \"You can hear a mountain,\" she said, her words sharp and quick. \"You can feel her mood, her itch, her yes. But you cannot hear one single word I say. You only hear what you want to hear. And right now, Mo, you are not listening to me.\"", "She did not wait for an answer. She reached into her belt, pulled out her mallet, and climbed down. The clink of her tools sounded like a countdown. Mo stood alone on the tower, the wind picking up, carrying the smell of pine and dry earth and the sudden, heavy silence of a friendship torn in two."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["Mo sat on the edge of the tower until the light failed. He did not move. He did not eat. He sat with his bare feet on the cold stone, trying to feel the hum in his teeth, but there was only the silence of the wind.", "Far below, in the gathering dark, Admiral bleated. It was a long, low sound, a question without an answer. The small tin bell on his neck rang once, a clear, lonely note that cut through the evening air.", "Mo closed his eyes. He knew, with a certainty that settled in his bones like cold water, that Junie was right. He had listened to the mountain, to the steps, to the hum. But he had not listened to the boy who was there, the one who wanted a floor that did not tilt. He pressed his heel into the stone, but the stone did not answer. For the first time in his life, Mo Ferreira felt truly, deeply alone."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "Hale's Story", "part": "PART THREE: WHAT THE MOUNTAIN KNEW", "paras": ["*From the Walk-Book of Highstep, Day 17. Weather: fair. Distance: three miles. Direction: left. I have not slept. The book is heavier than it looks.*", "The ridge was cold before dawn. It was the kind of chill that settled into the wool of your poncho and refused to leave. Mo climbed without the usual stumbling. His bare heels found each rock with a confidence that surprised him. Admiral huffed beside him, the tin bell on his neck clinking a quiet rhythm against the silence. They reached the cave mouth where the air smelled of old dust and dried pine needles.", "Old Hale sat on a flat stone. His wild white beard was tucked into his knitted cap. He watched the stars fade. He did not look up when Mo stopped, breathing hard. He simply poured a mug of tea from a clay pot and slid it across the ground. The liquid was dark and steamed. It tasted of resin and something sharper, like crushed bark.", "Mo drank. It burned in a good way.", "\"The vote went badly,\" Mo said, his voice rough. \"Junie left. My parents are shouting. I tried to tell them Tor knows where she is going, but they just look at me. They look at me like I am the one who is lost.\"", "Hale nodded slowly. He took a sip of his own tea. His eyes were bright and watchful in the gloom.", "\"She is not lost,\" Hale said, his voice low and rumbling. \"She is remembering. And that is a much harder thing to explain to people who only want the road to stay where they left it.\""], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["Hale leaned forward, his knuckles whitening on the stone. \"You think Tor is the only one of her kind? She is not. There were nine once, great and grey and slow, walking their circles across the whole world. Two have gone. Now there are seven.\"", "Mo frowned. \"Gone where?\"", "\"To the sea,\" Hale said. \"To the Gathering.\"", "The words hung in the air, heavy and strange. Mo tried to picture it, but the image kept slipping away, like trying to catch water in a cupped hand.", "\"Every thousand years,\" Hale continued, his tone brisk and matter-of-fact, as if describing the weather. \"The seven mountains come together at the water's edge. They stand still for one single dawn, humming a note so low you feel it in your bones. And then, the one who is very old walks out of the water and lies down.\"", "Mo stared at the old man. \"Lies down?\"", "\"Yes.\"", "\"For how long?\"", "Hale smiled, a thin, sharp curve of his mouth. \"For the rest of her life. Which, for a mountain, is a very long time.\""], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["\"She does not die,\" Hale said, answering the question in Mo's eyes. \"She rests. Her legs grow tired, her heart grows slow. So she walks to the water, and when the last mountain leaves, she sinks into the sand. She becomes an island.\"", "Mo felt the ground tilt beneath him, even though he was sitting. \"An island?\"", "\"A place where the sea laps at her feet and the wind moves through her pines forever. The villages on her back do not fall. They become shore villages. They stay. For ever. On a mountain that does not walk.\"", "Hale took another sip of tea. \"People have a choice. Always have. Some pack their bags and walk down to the plain. Some stay on the shoulder, watching the tide. It is not a tragedy, boy. It is a changing of seasons.\"", "\"But...\" Mo started.", "\"But what?\" Hale’s voice was gentle now. \"Why do you think your Gran’s book has a gap in it? Why do you think the Stepkeepers before her stopped writing after a certain year? Because they could not bear to write the end. They tore the page out. And then they forgot. And then they were afraid to ask.\""], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["Mo’s mouth felt like he had been chewing dry grass. He touched his lip, then his teeth. \"Tor is old?\"", "\"Very old,\" Hale said. He looked at Mo with a seriousness that cut through the morning chill. \"You have felt it, have you not? The steps are slower than they were last spring. The pauses are longer. The hum is lower. You felt the storm, Mo. You felt how she turned her whole body to shield you from the wind.\"", "Mo nodded, his throat tight. He had felt the effort of it, the great strain, the way her muscles had locked to hold the rain away. He had thought she was just strong. He had not thought she was tired.", "\"She gave that strength away to keep you dry,\" Hale said softly. \"A mountain does not do that for a goat. Or for a village. Not unless it knows its walk is nearly over. Not unless it loves you enough to spend its last breath on a single night of rain.\"", "Mo closed his eyes. He pressed his heel into the rock. He could feel it now, deep down, a vast, slow, aching warmth. It was not a machine. It was not a rock. It was a heart, beating once every few minutes, and it was getting slower."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["The walk down the ridge felt different. The rocks under Mo’s feet were not just stone; they were the surface of something alive. He moved slowly, carefully, letting his weight settle with every step. He was not climbing down a mountain. He was walking down the side of a friend.", "Admiral sniffed the air, his head high, as if he understood the change in the wind. Mo did not correct him. He did not need to.", "Mo reached the tree line where the pines began to thin and the sky turned pale gold with the early sun. He stopped. He looked back up at the ridge, then out toward the horizon, where the land stretched flat and wide and empty.", "Tor was not lost, sick, or confused. She was going home, and she was bringing them with her.", "Mo took a breath, the cool air filling his lungs. He adjusted his poncho, checked his rope belt, and began the walk back to the village. He had a lot to say. And for the first time, he knew exactly what to say."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "What Gran Knew", "part": "PART THREE: WHAT THE MOUNTAIN KNEW", "paras": ["*From the Walk-Book of Highstep, Day 18. Weather: fair. Distance: three miles. Direction: left. I have been a coward in ink for forty years.*", "The rope tower smelled of dust and dried hemp. Mo climbed the ladder, his bare feet finding the rungs by memory, a habit as automatic as breathing. At the top, Gran sat at her desk, the Walk-Book open before her, but the pages were blank. She held her pen suspended in the air, staring at the wood grain of the table as if looking for a door.", "Mo did not say hello. He did not ask how she was. Instead, he dropped his rope belt onto the table with a clatter that made her jump, the brass plumb-bob ticking against the wood.", "\"You know what she is doing,\" Mo said. \"You know about the sea.\"", "Gran’s hand trembled, and the pen hovered without moving. She did not look up.", "\"Who told you?\" she asked. Her voice was thin, scraped raw like a chalkboard rubbed too hard by a lazy hand. She finally raised her eyes behind her huge spectacles. For the first time in Mo’s life, he did not see his sharp, brisk, ink-stained Gran. He saw a woman with deep lines around her mouth and eyes that looked very tired. She looked old. She looked small."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["Gran set the pen down. She did not touch the book. Instead, she reached for her walking staff, the one with the brass bell that she carried everywhere. Her hands were steady now, but her movements were slow, as if she were handling something broken.", "She unscrewed the top cap. A faint whiff of old paper drifted out. She slid a rolled page from the hollow shaft. It was brittle, yellowed, and cracked along the folds. It was not the ink of the current Walk-Book. The script was ancient, looping and faded.", "\"I found it forty years ago,\" Gran said. \"In the back of a drawer in the Stepkeeper’s office. I didn’t read it right away. I put it back in the staff.\"", "She unrolled the page on the desk. The words were clear, written by a hand that had been confident and calm. It described a meeting. It described a resting. It described an ending that was not an end.", "At the bottom, in smaller letters, was a single note: *Do not fear it. It is a good ending.*"], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["\"Why didn't you tell us?\" Mo asked. He wanted to be angry, and he wanted to shout, but the words stuck in his throat, heavy and dry, like a spoon full of cold porridge.", "Gran looked at the page, then at the blank book. \"Because I am the Stepkeeper,\" she said. \"I have kept the record of the Walk for forty years, and I am supposed to keep it going.\" She tapped the staff against the floor, and the brass bell gave a single, dull note. \"If I told you, the Walk would end. I would be the one to write the last entry, and I did not want to be that person.\"", "She picked up the staff, and her hands trembled just a little. \"I was afraid of what the village would do,\" she admitted. \"I was afraid of losing the life I know, so I thought if I didn't say it, it wouldn't be true.\" She looked at Mo, her expression tight and serious. \"I thought the ink would stop the water. I thought I was protecting you.\""], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["Mo did not reply. He walked to the corner of the tower, where the floorboards were worn smooth by centuries of feet. He sat down, crossing his legs, and he did nothing. He did not fidget. He did not check his plumb-bob. He just sat there, feeling the wood under his knees, feeling the hum of Tor far below, a low vibration in the air.", "It was the hardest thing he had ever done.", "Gran watched him. The silence stretched, filling the small space between them. It was not an empty silence. It was a full one, heavy with everything they had not said for days.", "Finally, Mo spoke. His voice was quiet, but it cut through the air like a knife through cheese.", "\"You could have told me.\"", "Gran closed her eyes. She opened them, and her face was soft, stripped of its usual briskness. \"I should have,\" she said. Her voice was small, dry, and cracked. She reached out and placed her hand on the top of his head. It was the same gesture she had used when he was three and afraid of the dark."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["Gran lifted the brittle page from the staff. She did not tuck it away. She extended her arm, offering the paper to Mo.", "\"Keep it,\" she said. \"You must keep it. And you must tell them. The whole truth, not the half-truths I have been hiding.\"", "Mo took the page. It felt light, lighter than a cheese rind, yet it sat on his palms with a heaviness that made his shoulders ache. \"They won't believe me,\" he said. \"I am eleven. I am barefoot. I am no one.\"", "\"Exactly,\" Gran replied. She stood up, straightening her long white braid. \"No one would believe an old woman who hid the end of the world for forty years. But they might listen to a boy who knows where they are going.\"", "Mo stared at the faded ink, then looked up at Gran. Being listened to was far more frightening than being ignored. He had spent the entire week trying to be heard. He was not sure he could bear the noise of it."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "Nobody Believes a Barefoot Boy", "part": "PART THREE: WHAT THE MOUNTAIN KNEW", "paras": ["*From the Walk-Book of Highstep, Day 20. Weather: cloud. Distance: three miles. Direction: left. The village has been told. The village has views.*", "The cheese crate was wobbly, which was the first bad sign. The second was that Mo’s hands were shaking so hard the paper rustled, sounding like a dry leaf in a gale. He stood up, his bare feet gripping the wooden slats, and held the brittle page out in front of him. It looked fragile, as if a strong breath might turn it to dust.", "\"Tor is old,\" he said. His voice cracked on the second word. He cleared his throat, pressed one heel hard against the crate, and tried again. \"She is very old. And she is walking to the Gathering.\"", "A silence fell, heavy and thick.", "\"She will rest there,\" Mo continued, his eyes scanning the sea of faces. \"She will lie down. And Highstep will stay. We will not walk anymore.\"", "Nobody cheered. Nobody clapped. A woman near the front, holding a bundle of mending, simply stared at him as if he had grown a second head. Mo lowered his arms, the page trembling between his fingers."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["A low murmur rippled through the crowd, starting near the back and moving forward like water over stones. Someone laughed, a short, sharp bark, and then another voice joined in, softer this time.", "\"Children's tales,\" said a farmer, shaking his head. \"My grandfather said the same thing before the cheese caves flooded. Do not credit the barefoot boy with a mountain’s mind.\"", "Mama Achebe stepped forward. Her face was tight, but kind. She did not look angry. She looked tired, the kind of tired that comes from weaving too many patterns in one day.", "\"I have no room in my heart today for one more story, Mo,\" she said gently. \"We have cheese to make and ropes to mend. Please.\"", "Mayor Marsh adjusted her green sash. She did not scold. She simply nodded, her clipboard clutched to her chest.", "\"I am grateful you tried,\" she said, her voice brisk and official. \"But a village cannot be planned around a page that could have been written by anyone.\"", "Mo felt the ground beneath the crate tilt, just slightly, as if Tor herself was shrugging."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["Gran stood up. She was so small next to the other adults that she seemed to vanish into the crowd, but her voice did not. It cut through the murmur, sharp and clear as the bell on her staff.", "\"The page is real,\" she said.", "The quiet that followed was different. It was not the quiet of disbelief. It was the quiet of a held breath, of a room where everyone is waiting to see if the floor will give way.", "\"Stepkeeper,\" Mayor Marsh said, her voice dropping. \"Gran.\"", "\"Ada,\" said a man from the rope guild, his arms crossed. \"You are seventy-three. Your eyes are bad. You write in a book for the fun of it. How do we know this is not another one of your... games?\"", "Mo looked at his father. Tomás stood with his back to the crowd, his large hands resting on his rope coil. He was whistling through his teeth, a low, tuneless sound. He did not turn around. He did not look at Mo. The silence of his father was louder than any shout, and it settled in Mo’s chest like a stone."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["The argument did not end with a verdict. It ended with a count. Mayor Marsh began to tally the families on her clipboard, and the number of those who wanted to descend at the Last Ladder grew by the minute. It was a slow, quiet tide, pulling people away from the future.", "Mo looked around for Junie. He expected to see her, tall and stubborn, arguing or defending. But her spot in the crowd was empty. The yellow scarf that usually bobbed above the heads was gone.", "He climbed down from the crate, his legs unsteady. He walked to the Footpost, the flat stone in the center of the Green, where he had stood every morning of his life. There, resting on the stone, was her scrapbook. It was open.", "Inside, tucked between a drawing of a square window and a sketch of a straight horizon, was a note. The handwriting was sharp and slanted.", "I am not leaving you. I am leaving the tilt.", "Mo picked up the book. It was warm, as if she had just set it down. He closed his eyes and pressed his bare heel to the stone. Under his foot, Tor was walking. Steady. Patient. Unwavering."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["Words were light things. They scattered on the wind like loose leaves. Seeing was different. Seeing was heavy, like a stone you could hold.", "Mo needed the crowd to see. He turned to the rope store. A coil of thick hemp waited on the shelf. The fibers were rough against his palms. He took a lantern from the hook. The glass was clean. From the bakery table, he grabbed a heel of stale bread. It was hard enough to last two days.", "He shouldered the rope. The lantern went into his poncho. He bit into the bread.", "Admiral was already there. His tin bell jingled softly as he chewed a piece of straw. The goat did not look at Mo. He did not ask where they were going. He simply lifted one ear. Then he stepped forward, waiting for Mo to follow."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "The Crown", "part": "PART THREE: WHAT THE MOUNTAIN KNEW", "paras": ["*From the Walk-Book of Highstep, Day 21. Weather: clear, and very large. Distance: three miles. Direction: left. Mo is up the mountain. So is the goat.*", "The pines stopped dead.", "Then came the bare grey stone, shimmering in the moonlight. It was warm under Mo’s bare feet, not the cold chill of rock, but a deep, living heat. He pressed his heel into the stone, testing it. The pulse was there, slow and steady. It felt like resting on a sleeping dog’s flank, where the breath rises in a heavy sigh.", "Admiral followed close. His hooves clicked on the hard surface. The goat did not complain about the heat. He did not complain about the dark. He simply moved with a purpose that Mo had learned to respect, his tin bell silent in the cold air.", "Mo climbed over a ridge of wind-flattened grass. The blades brushed his shins. Then he faced the final ascent to the Crown. The air smelled of pine resin and cold stone, a sharp, clean scent that made his head ache in a good way.", "He took a breath. He filled his lungs.", "Then he climbed."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["The Crown was not a peak in the way a mountain peak should be. It was a hollow, a shallow basin of rock that held the wind and the stars. Mo stood in the
