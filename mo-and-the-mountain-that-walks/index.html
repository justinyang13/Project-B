center of it, his feet spread wide, feeling the full weight of the world above him. The night was immense, a dome of black velvet studded with diamonds so bright they seemed to burn. There was no horizon, only a curve of sky that went on forever.", "He looked down. The village was a speck of light in the distance, a cluster of lanterns clinging to the side of the mountain. He could not see the people, but he could feel them, a faint vibration in the air, a hum of life that connected him to every soul in Highstep. Admiral lay down at his feet, tucking his nose under his tail. The goat was warm, a solid mass of brown and white fur that radiated heat into Mo’s cold ankles. Mo leaned back against a stone, closing his eyes. He did not feel afraid. He felt watched."], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["Mo blinked, certain he had fallen asleep on the cold rock and dreamed this. A single golden point of light burned low in the eastern dark, steady as a candle in a window, though there were no windows out here. It did not twinkle like a star; it moved, sliding across the blackness with the slow, deliberate grace of a heavy cart rolling over cobblestones.", "He rubbed his eyes with his sleeves and looked again. The light was still there. Then a second glow appeared to the north, and a third to the west. They were not stars at all. They were lanterns. Or rather, they were villages, distant clusters of warm light clinging to the backs of other walking mountains, just like Highstep. Mo counted them carefully, his breath misting in the cold air. One, two, three. They were drifting closer, drawn by some quiet force he could not see but could feel humming in the deep bones of the earth beneath his bare feet."], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["The hum changed pitch.", "It stopped being just a rumble in the moss and climbed up, a deep, resonant note that vibrated in Mo’s ribs and settled hard in his teeth. It was a song, ancient and sad, waiting a thousand years to be sung.", "Then the dark answered.", "Seven notes, clear and bright, wove together into a chord so pure Mo’s eyes stung. It sounded like a family calling across a long distance. A greeting. Coming home.", "Mo stood still. His bare feet pressed into the warm rock, grounding him against the wind. He felt the mountain’s pulse beneath him, steady as a drum in a schoolyard.", "He didn’t need to understand it.", "He didn’t need to believe it.", "He just needed to hear it. The sound filled the hollow, then his chest, until he was certain he was not alone. He had never been alone."], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["A tear rolled down Mo’s cheek, and he did not bother to wipe it away. It was not a sad tear. It was a tear of relief, of wonder, of a truth that had finally found its way to the surface. He grinned, a wide, sharp smile that showed his teeth. If Highstep could not believe a barefoot boy, they could believe their own eyes. They could see the lights. They could hear the song.", "He kicked Admiral awake. The goat blinked, shook his head, and stood up, his tin bell jingling softly. Mo took the lantern from his poncho and lit it. The flame was small, but it was enough. It was enough to see the path down. It was enough to show them the way. He turned and began to climb down, his bare feet finding the stone, step by step, guided by the mountain that loved him."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "The Last Ladder", "part": "PART THREE: WHAT THE MOUNTAIN KNEW", "paras": ["*From the Walk-Book of Highstep, Day 23. Weather: fair. Distance: two miles, through a gap. Direction: left. The ladders are down. I am not writing the rest yet.*", "Mo reached the Green just as the sky turned the color of wet plaster. The stone beneath his bare feet trembled, a deep, grinding shudder that rattled his teeth. The ridge ahead loomed, two sheer cliffs of grey rock with a narrow gap between them, barely wide enough for Tor’s head. She slowed. The whole village held its breath.", "Then Tor groaned, a sound like boulders sliding over gravel, and squeezed through. Ropes creaked. The pines bent. Every child in Highstep clutched a goat, their knuckles white, their eyes wide with the sudden, terrifying reality that their world was just a very large animal trying to fit through a door.", "Mo ran to the Footpost, his plumb-bob swinging wildly. Gran stood there, her staff planted firm, her face pale but steady. She did not look at the cliffs. She looked at the horizon, where the light was just beginning to fade.", "\"Day 23,\" she whispered, her voice dry as old paper. \"Write it down, then worry about it.\"", "Mo opened his mouth to speak, but the ground lurched. The last of the goat herd stumbled into the gap. Tor’s head cleared the far cliff. She was through. She was walking on."], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["The Last Ladders unrolled from Tor’s side like long, thick tongues of rope. They dropped down into the green plain below, where the smoke of Lowbrook farms curled lazily into the air. Mayor Marsh stood at the base of the ropes, her clipboard clutched to her chest. Her hands shook so badly that the pencil in her fingers drew small, jagged lines across the paper.", "\"Form a line,\" she called out, her voice thin and reedy. \"Families first. Bundles only. No cheese.\"", "Mo ran along the line. He held up the torn page, though he knew it was useless in the bright daylight. \"You can’t go,\" he shouted, his voice cracking. \"You have to see where she’s going. You have to stay for the Gathering.\"", "A woman looked at him, then at the empty sky. There were no lights. There was only the sun, high and indifferent. She turned her back on him and picked up her bundle. The line moved forward, one person at a time, a steady stream of people choosing the solid ground over the moving mountain."], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["Junie Achebe was near the front of the line. She held her scrapbook against her chest, the yellow scarf tied tight around her curls. She did not look at Mo. She looked at the ladder, then at the plain, then at her family waiting behind her.", "\"Junie,\" Mo said. He stopped. His heart felt too big for his chest. \"I’m sorry. I’m sorry I didn’t listen. I heard you. I hear you. Please.\"", "She finally looked at him. Her eyes were bright, but they were not angry. They were tired.", "\"I believe you, Mo,\" she said softly. \"I believe everything you said. But I need a floor that doesn’t tilt. That’s what I need. It’s not the same thing as not loving you.\"", "She reached out and touched his arm, a brief, firm pressure. Then she turned away, her back straight, her chin lifted. She was not leaving because she didn’t believe him. She was leaving because she was afraid. And Mo, who could hear a mountain, had no words for fear that lived in a child’s bones."], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["She hugged him. It was a hard hug, the kind that leaves marks on your shirt, and the handle of the mallet in her tool-belt dug sharply into his ribs. He gasped, but he did not pull away. He held her, feeling the solid weight of her, the reality of her, before she released him and stepped onto the first rung.", "Her family followed. Mama Achebe, Papa Achebe, baby Obi in his sling. Then the others. One by one, they disappeared down the ropes. Sixty-three people. Mo counted. He watched until they were small dots on the green. Then he watched until they were nothing. The plain stretched out before him, vast and empty and still.", "Tor took another step. The ground rolled. The ladders swung. Mo stood on the Footpost, his bare feet pressed flat against the stone. He could feel her sadness. It was a heavy, slow thing, like a stone settling into the deep water. He did not cry. He just stood there, listening to the silence left behind by the people who had chosen to stay on the ground."], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["The ladders were hauled up, the ropes coiled neatly on the Green, and the village looked smaller, the air suddenly thinner. Tor walked on, each step slow and careful, a deliberate choice that Mo felt in his bones. She knew. The mountain knew exactly what she had left behind, and she did not look back.", "Gran sat at her desk by the Footpost. She dipped her pen in the ink, her hand steady while her eyes glistened. She wrote the date, then the number.", "\"Day 23. Sixty-three left.\"", "She paused, the pen tip hovering. Then she pressed her ink-stained thumb against the blot, and the dark stain spread. It was not just ink, but a tear mixed with the dust of the road. She looked at Mo, and for the first time, she did not say a word. She just nodded.", "The mountain walked on toward the sea."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "The Half-Empty Mountain", "part": "PART FOUR: THE GATHERING", "paras": ["*From the Walk-Book of Highstep, Day 24. Weather: fair. Distance: three miles. Direction: left, downhill. The Green looks very big.*", "The silence was the loudest thing. It was not the quiet of a library, but the hollow quiet of a room after the furniture has been carried out. Highstep was smaller now. The shadows on the Green were wider. Mo walked past the Achebes’ cottage, and the loom stood in the doorway, its threads stretched taut and waiting for hands that were no longer there. The wood was pale in the sun, a frozen spider’s web of wool and intention.", "Children were playing a game in the space where Junie’s house used to be. They skipped over the outline of the floorboards, pretending they were rivers. Mo stopped. He watched a girl kick a stone across the empty plot. The stone bounced, rolled, and stopped at the threshold. Mo picked up a pebble from his pocket. He did not throw it. He put it back, carefully, as if dropping it might break the shape of the place. He walked on, his bare feet dusty and heavy, leaving prints that the wind began to fill almost immediately."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["Mo tried to fix the rope on the cheese rack, but he tied it in a knot that would slip in a breeze. He pulled it tighter, and it slipped. He sat down on a crate and watched his mother stir the curds. She did not look up. She hummed a low, tuneless note, a sound that used to mean she was happy, but now sounded like a question she had forgotten how to answer.", "Mo pressed his heel into the stone. Tor walked on. Her steps were steady, a slow, deep rhythm that he could feel in his bones. She was fine. She was strong. But the village was not. He listened harder. He heard his father whistle through his teeth, a sharp, broken sound. He heard the Mayor in the dark, talking to herself, her voice thin and reedy. She was counting. Mo counted with her. He realized he was listening to the people now, not just the mountain. He was catching the words they did not say, the ones that hung in the air like dust motes in a sunbeam."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["It was late, and the cheese cave smelled of salt and old milk, a cold that settled in the nose. Mo was sweeping, or pretending to, when the Mayor climbed down the ladder. She did not hold her clipboard. She sat on a crate, her tall hat still on, and looked at him. Her eyes were dry, but her face was tired in a way that sleep did not fix.", "\"I have been listening to a child,\" she said. Her voice was quiet. \"Because I have run out of adults. I have run out of answers. I have run out of... certainty.\" She looked at the dark water in the vats. \"Mo, what does she need? Not what we need. What does *she* need?\"", "Mo stopped sweeping. He thought about the steady steps under his feet. \"She needs us to trust her,\" he said. \"She needs the village to still be a village when we get there.\""], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["The next night, Tor walked off the wild hills and onto the great plain, where the ground was flat and endless and the air felt cool and still. The darkness stretched out ahead of them, tight and heavy, like a tablecloth pulled smooth over a dining table. From the side of the mountain, Mo could see Lowbrook. It was a small cluster of gold lights by the river, fragile and bright against the dark.", "He knew Junie was there, and he knew Obi was there. He knew the smell of fresh sawdust and the sound of a weaver’s shuttle was miles away, in a still town that did not tilt.", "Gran climbed the rope tower with him. She did not say anything, which was unusual for her, and simply handed him the lantern. They lit it, and the flame flickered for a moment before steadying. Mo pulled the cord. The light flashed twice, long and slow. Then once, short and sharp. *I’m here.*", "He stood very still, watching the black river below. Minutes passed. Then, far away, a tiny spark of light blinked. Two long. One short."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["They did it again the next night. And the next. The signal became a ritual, a secret conversation across miles of empty grass. Mo learned that distance did not mean absence. Junie was far away, yes, but she was also right there, in the rhythm of the light. He could feel her presence in the steady beat of Tor’s steps, in the hum in his teeth, in the fact that someone, somewhere, was looking up at the same sky and waiting for him to blink.", "He was not alone. He was not lost. He was part of a village that was moving, changing, and holding on. The mountain walked on, but the heart of Highstep was not on the rock. It was in the people who chose to stay, and the people who chose to watch from afar. And the light, when it came, was always there."], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "The Flood", "part": "PART FOUR: THE GATHERING", "paras": ["*From the Walk-Book of Highstep, Day 27. Weather: rain, for three days. Distance: one mile, and I will not say how. Direction: toward the lanterns.*", "The rain did not fall so much as it hung. It was a grey curtain, thick and cold, that had been drawn across the world for three days straight. Tor moved through the mud with the slow, deliberate grace of a barge in a swamp. Her stone-grey legs churned the brown earth, sending up clouds of wet silt that settled on the pine needles and the roofs of Highstep. The village was wet. The cheese caves smelled of damp wool. Nobody complained, mostly because complaining required breath, and everyone was too busy wringing out their ponchos.", "Mo stood on the Footpost, his bare feet sinking into the slick stone. He felt the plain below them, a flat expanse of mud and grass that usually felt quiet and still. Today, it felt restless. He pressed one heel down, testing the ground. It gave way, soft and heavy. The Slow River, which ran along the edge of the plain like a lazy cat, was not lazy anymore. It was angry.", "At dusk, the rain slowed to a drizzle. Mo wiped his eyes with his sleeve and looked down into the low valley. There, in the bend of the river, was Lowbrook. And there, flickering against the dark water, was a light. It blinked. Two long flashes. Three short ones. Fast. Frantic. It was not the signal for \"I am here.\" It was the signal for \"I am here, but I am in trouble.\" Mo’s stomach dropped."], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["The river had become a wall. It was not water; it was brown muscle, churning and roaring, swallowing the fields of Lowbrook whole. Farm carts floated in the current, bumping against each other with hollow knocks. Chickens clung to fence posts, their feathers plastered to their bodies. The people of Lowbrook were on their roofs, huddled under tarps, their faces pale in the lantern light.", "Mo could feel them. Through his feet, the vibration of their fear traveled up through Tor’s bones, a high-pitched tremor that made his teeth ache. He saw Mrs. Cobb, stout and stubborn, holding a wheelbarrow full of potatoes on her roof. He saw Junie’s family. Junie herself was not on the roof. She was in the water, waist-deep, holding her baby brother, Obi, up above the water. Her yellow scarf was dark with mud.", "\"Mo!\" shouted a voice from the crowd. It was Mayor Marsh, her tall hat secured with a rope. \"We need to get down there. Now.\"", "Mo did not wait for the Mayor. He did not wait for the rope ladders to be unhooked. He looked at Tor’s massive, mossy flank, then at the rising water, and then at the terrified faces on the roofs. He knew what had to be done. He also knew it was impossible. Mountains did not kneel. Mountains did not save. But this mountain was walking toward the sea, and she had not forgotten how to carry."], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["Mo ran to the Footpost, his bare feet finding the slick stone with the surety of a cat on a windowsill. The rain hammered the poncho, but Mo did not hear it; his ears were tuned only to the thin, cracking voice of the Mayor shouting from the Green. He pressed both heels hard into the center of the stone, deeper and harder than Gran had ever taught him, using a strength that made his legs shake like loose hinges.", "*Turn,* he thought. *Turn toward them. Lower your side.*", "He felt Tor hesitate. It was a physical slowing, a heavy pause in her steps, like a teacher stopping mid-sentence because she had forgotten the next word. She was confused. She was afraid. This was not the Old Road. This was not the plan.", "Mo closed his eyes and stopped thinking like an apprentice. He thought of Junie’s yellow scarf, bright and stubborn in the mud. He thought of her scrapbook, full of drawings of still towns where the floorboards never creaked. He thought of her voice, sharp and kind, saying, *I’m going to live in a house that doesn’t lean.* He did not ask her as a Stepkeeper. He asked her as a friend. *Please.*", "The pause lasted a heartbeat. Then, a deep, resonant groan rolled through the ground, a sound he felt in his bones rather than heard with his ears. Two long, slow steps. Then, a third. Tor was turning."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["Tor moved into the river. It was a sound like a landslide, a crash of water and stone that sent a wave of foam rolling up the bank. The villagers of Highstep cheered, a ragged, terrified sound. Tor sank until the water lapped against her mossy flank, then deeper, until the brown water was almost at the level of the rope bridges.", "\"Lines!\" the Mayor shouted, and for once, everyone listened. Ropes were thrown, coiling in the air. Lanterns were dangled from the branches. Blankets were unrolled, dry and bright against the gloom.", "They climbed. First came Mrs. Cobb, wheelbarrow and all, her face grim but her hands shaking as she gripped the rope. Then came the chickens, screeching and flapping. Then came the cow, who looked surprised and then resigned. One by one, they hauled themselves up the ropes, their feet slipping on the wet wood. The rain hammered down, a steady drumroll on the pine needles.", "Mo stood on the rail, pulling ropes with all his might. His arms burned. His poncho was soaked through. But he did not stop. There were so many of them. And then, in the water, a splash. A face, dark and determined, looked up at him. It was Junie. She was holding Obi. She was holding the scrapbook."], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["Junie was in the water up to her waist, her hair plastered to her face like wet clay on a potter's wheel, while a yellow scarf knotted tight around her wrist burned as a splash of color in the grey. She held Obi high with one arm and the scrapbook in a sack with the other, ignoring the crowd and the Mayor to look only at Mo.", "Mo reached down, his arms aching and his fingers slipping on the wet wood. \"Grab the rail,\" he said, his voice rough.", "Junie reached up. Her hand found his. He hauled, using every ounce of strength he had left, and with a grunt that was more effort than sound, he pulled her up over the rail. She collapsed on the wooden platform, gasping, Obi clutched tight to her chest. The scrapbook was dry. The scarf was dry.", "She looked up at him. Her eyes were wide, dark, and clear. \"You came,\" she said.", "Mo looked back at the water, where the last of the Lowbrook families were climbing up. He looked at Tor, the great, silent mountain, streaming with rain, her head low, her eyes kind. \"She came,\" Mo said.", "Tor rose from the water. The flood parted around her, a quiet, respectful thing. She carried them both, Highstep and Lowbrook, two villages on her back, walking toward the light in the east."], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "Everyone on Board", "part": "PART FOUR: THE GATHERING", "paras": ["*From the Walk-Book of Highstep, Day 28. Weather: fair, and steaming. Distance: three miles. Direction: left. Population: three hundred and ninety-one. Goats: forty-one, including one from Lowbrook.*", "The morning after the flood smelled of wet wool and warm goat, with clothes hanging on every rope bridge like a giant's laundry line. Lowbrook’s farm animals wandered through the pines, looking with the confused dignity of people who had just lost their map.", "Mrs. Cobb, stout and straw-hatted, stood on a flat rock near Tor’s knee. She looked up, then down, before reaching out to pat the mossy flank of the mountain.", "\"That big lump,\" she announced to the crowd. \"You're a bit damp today.\"", "Highstep held its breath, waiting for a disaster that never came. Tor, who did not speak, gave a low, rumbling shiver that rolled through the soles of Mo’s bare feet. It was not a tremor of fear, but a deep, earthy chuckle that started in her belly and finished in her horns.", "Mo grinned. Admiral the goat, who had followed them out of the river, bleated in agreement and tried to eat Mrs. Cobb’s shoe."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["Mayor Marsh and Mrs. Cobb stood on a cheese crate, their voices rising in a chorus of logistics. They were two very large voices in small bodies, arguing over who controlled the salt supply.", "\"My people have been in one spot,\" said Marsh, adjusting her hat. \"We know how to store things.\"", "\"My people have been in one spot,\" Mrs. Cobb countered, \"and we know how to *eat* things. You can't ration a feeling.\"", "It was a stalemate. Mo’s father, Tomás, looked at his mother. Mo’s mother, Marisol, looked at the crate. Then, with a sigh that emptied the air right out of the room, Mayor Marsh stepped down.", "\"Salt for the soup,\" she said. \"And Mrs. Cobb, you tell the stories. We are all a bit thin on narrative.\"", "Mrs. Cobb nodded, satisfied. That evening, the two villages shared a pot of broth that tasted of rain and hope. It turned out that Highstep and Lowbrook needed exactly the same things: salt, warmth, and a good story. The only difference was that Lowbrook had more salt, and Highstep had better puns."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["Mo found Junie on the Footpost. She was sketching in her scrapbook, her yellow scarf tied tight, her curls damp from the river. She did not look up when he approached.", "\"I didn't know a mountain could be brave,\" she said, her voice quiet.", "Mo sat down next to her, pressing one bare heel into the stone. \"I didn't know I could be so bad at listening,\" he admitted.", "They both started to apologize at the same time, then stopped, looking at each other. A laugh bubbled up, tired and relieved, like the sound of a kettle finally finishing its boil.", "Junie turned the scrapbook toward him. On the page was a drawing of a still town, houses with square windows and no tilt. In the background, rising above the rooftops, stood a very large, shaggy mountain. It was not threatening. It was waiting.", "\"Is it... a home?\" Mo asked.", "\"I'm not sure yet,\" Junie said, tapping her pencil against her lip. \"But I think it's a start.\""], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["Mo told her everything. He did not rush, as he had with the village, but he spoke slowly and in order. He paused when she asked questions and stopped when her brow furrowed in confusion. Then he handed her the torn page, the one Gran had hidden inside her walking staff for forty years.", "Junie read it once. She read it again, her voice steady and clear. \"When a mountain grows old, she walks to the sea... and lies down to rest.\"", "She looked up at Mo, her eyes serious. \"A house that stays still might not be the same as a home that stays still,\" she said, tapping her pencil against her lip. \"I am not sure yet which one I want.\"", "Mo nodded, feeling the heavy weight in his chest shift, not disappear, but lighten just enough to breathe.", "\"I am glad you told it properly,\" she said.", "\"Me too,\" Mo replied. \"I think I forgot how to listen until I had to listen to you.\"", "Junie smiled, a small, sharp expression that reached her eyes. \"We are both learning,\" she said. \"One day at a time. Or one step at a time, depending on who is walking.\""], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["That night, the Green was full. Three hundred and ninety-one people crowded around a great communal fire, the light flickering on their faces. Gran stood on the cheese crate, her staff in one hand, the torn page in the other. She did not look old. She looked like the Stepkeeper she was.", "She read the page in her clear, dry voice. Nobody laughed. The air was still, heavy with the scent of woodsmoke and pine. When she finished, the silence stretched, long and warm.", "Then Mrs. Cobb cleared her throat. She was a woman who lived in one place all her life, a place with dirt roads and muddy boots. She looked up at Tor, who was resting her head low, her eyes half-closed, her hum a low vibration in the ground.", "\"Well,\" Mrs. Cobb said. \"I've lived in one place all my life. I would like to see the sea.\"", "The crowd murmured, a sound like wind through pines. Mo looked at Junie, who looked at the mountain. They were ready."], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "The Gathering", "part": "PART FOUR: THE GATHERING", "paras": ["*From the Walk-Book of Highstep, Day 33. Weather: gold. Distance: three miles. Direction: forward. At last I can write it.*", "The sand was soft and grey, and it stuck to Mo’s bare feet in thick, damp clumps that felt less like walking and more like wading through wet flour. The air tasted of salt and cold iron, a sharp sting in the back of the nose that had nothing to do with pine resin. Tor’s steps had changed. They were no longer the heavy, rolling thuds of the road. They were slow, deliberate, almost shy. The moss on her back swayed gently, as if she were trying not to wake the pines sleeping in her hair.", "Highstep moved in a long, quiet line. The rope bridges swayed without a sound. Nobody laughed. Nobody complained about the bumps, because there were no bumps, only a steady, rhythmic rocking that felt like being held. Gran walked at the front, her staff tapping the sand with a precise *tick-tick-tick*. Mo pressed his heel into the ground, feeling the vibration travel up through his bones. It was not a step. It was a note, low and deep, humming in his teeth.", "That night, the village did not sleep. They sat on the sand, wrapped in wool ponchos, watching the dark water lap against their toes. Mo stood on the Footpost, which they had carried down the Last Ladders and set in the mud. He felt the shiver. It was a chord so wide and so deep that the sand beneath his feet seemed to breathe."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["The mist pulled back like a curtain drawn by a giant hand, and the sea opened up, wide and silver-gold, stretching out to a horizon that looked like a drawn line. Then, out of the white haze, the others came.", "Six mountains. They moved with the same slow, ancient grace, their legs the size of hills, their backs heavy with life. One was capped in snow, bright and silent. Another wore a coat of red autumn trees, rustling with the wind. A third had a lake on her back, clear and still, with tiny fishing boats moored to her horns. They were all different, all shaggy, all carrying their villages in their hair and on their shoulders.", "The bells began to ring. Not all at once, but one after another, mountain to mountain, a sound that traveled across the water and settled in the chests of everyone on the shore. It was a greeting. It was a recognition. Mo looked at Tor, whose eyes were half-open, her small, kind gaze fixed on the others. She hummed. It was not a sound. It was a feeling, a deep, warm presence that filled the space between the mountains."], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["It was a festival that had no end and no beginning. Tents of bright wool and canvas popped up on the sand like mushrooms after rain. Banners snapped in the sea breeze, and long tables were set with bowls of soup, baskets of bread, and wheels of cheese that looked like gold coins. Pipes played a melody that went up and down the scale, and drums beat a steady, heavy rhythm that matched the pulse of the mountains.", "Children who had never met before ran together, their faces smeared with sand and berry juice. They chased each other around the legs of the mountains, which were as wide as streets. Junie’s yellow scarf was knotted around her wrist, a ribbon from a stranger was in her hair, and her curls were wild and free. She was laughing, a sound that Mo had missed more than he could say.", "Mrs. Cobb, stout and determined, held a single oyster on a silver plate. She looked at it. She looked at the other villagers. She took a bite, closed her eyes, and shook her head.", "\"Not for her,\" she declared, and put it back on the plate.", "Highstep’s cheese, however, was a great success. It was gone before the sun was high."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["Gran found him on a rock that looked like a broken molar, a very small, very old man with a beard that reached his knees. He was the Stepkeeper of the mountain with the red trees. His spectacles were so thin they looked like frost on a windowpane, and he held a book bound in leather so old it had worn soft as a favorite wool scarf.", "They sat down. They did not speak. They opened their books.", "Gran’s Walk-Book was thick, heavy as a sack of flour. The old man’s was thin, fragile, its pages soft as cloth. They read. They laughed at the same typos. They cried at the same storms. They traded a thousand years in an afternoon, passing pages back and forth like cards in a game.", "Mo stood behind them, listening. He heard a fragment, a whisper in the paper, a line that was the same in every book, for every mountain, for every Stepkeeper who had ever held a pen.", "\"Weather: fair. Distance: none. Direction: home.\""], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["The evening light turned the water into molten copper. The seven mountains gathered in a loose circle, their heads low, their horns touching the sky. Then, they sang.", "It was not a song of words. It was a chord, a low, resonant vibration that rolled across the water and lifted every hair on every head. It was a farewell, and it was a welcome. It was the sound of roots letting go, and the sound of roots growing deep.", "Mo stood on the Footpost, his bare feet pressed into the wet sand. He felt Tor’s answer through his heels. It was enormous. It was calm. It was a promise. He knew what came next. He did not fear it. He leaned forward, and for the first time, he did not need to listen with his feet. He listened with his whole self."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "Distance: None", "part": "PART FOUR: THE GATHERING", "paras": ["*From the Walk-Book of Highstep, Day 34. Weather: fair. Distance: none. Direction: home.*", "The sun spilled over the horizon, turning the shallow water into a sheet of hammered gold. Tor took her first step into the sea. Her massive stone-grey foot slid into the sand, making a sound like a heavy boot stepping on dry leaves. The village swayed gently. Mo stood on the Footpost, his bare feet flat against the stone. He felt a deep, asking hum in his molars.", "\"Sit down,\" Mo said. His voice was small against the vastness of the water, but he did not raise it. \"She asks that you sit.\"", "The villagers looked at him. Then they looked at Tor, who waited with her head low and her eyes closed. Mayor Marsh lowered her clipboard. One by one, then in pairs, the people of Highstep sat. Some on the grass, some on the deck of the cheese caves, some simply on the sand. They sat because they trusted Mo, and because Tor’s patience felt like a hand resting on their shoulders.", "Tor lowered herself. It took an hour. The moss and pines dipped toward the water. The air grew cool and salty. The mountain settled, not with a crash, but with a long, slow exhalation that ruffled the hair of everyone who was still standing."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["It took the rest of the day for the stillness to become real. The village was quiet, not because the people were holding their breath, but because the world had stopped moving. Mo sat cross-legged on the Footpost, his heel pressed firmly into the stone. He closed his eyes and listened with his feet.", "At first, the pulse was strong, a deep throb that matched his own heartbeat. Then it slowed. The rhythm stretched out, wide and slow, like a drum being played in a large, empty hall. He counted the seconds between beats. Ten. Twenty. Fifty. The hum did not stop, but it changed. It became less of a sound and more of a feeling, a warm pressure under the soles of his feet, like sitting on a heated stone after a long walk.", "Mo opened his eyes. He looked at the water, which lapped gently at the base of Tor’s legs. He looked at the pines, which were swaying slightly, as if in a dream. She was not gone. That was the important thing. She was resting. The fear that had lived in his chest for forty days began to unclench, finger by finger, leaving behind a strange, tender peace."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["Mo waited until the sun dipped below the horizon, painting the clouds in shades of apricot and plum. He stood up. His legs felt heavy, but his mind was clear. He looked at the great, still form of Tor, who was now half-submerged, her back a hill of green and grey against the sky.", "He placed his right foot on the Footpost. He pressed hard, feeling the warmth of the stone. Then he placed his left foot. He did not kick. He did not stomp. He simply put his weight down, slowly, deliberately. One long step with his right heel. One long step with his left.", "*Thud. Thud.*", "The sound was small. But beneath the water, something answered. It was faint, barely a tremor in the sand, but Mo felt it. Two long steps. A pause. Then, two long steps again. They came from very deep, from the bottom of the sea, from the place where Tor had settled her bones. Mo laughed. It was a wet, shaky sound, and he knew he was crying, but he did not care. Admiral, the large brown and white goat, lifted his head from the grass and rested it under Mo’s hand, his tin bell silent for the first time in Mo’s memory."], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["The next morning, the mist lifted to reveal a world that looked different, but was the same. The shore stretched out in a curve of white sand. There were boats in the water, their masts rising like sticks in a jar. Gulls circled overhead, shrieking and diving. Highstep was on solid ground.", "Papa Achebe and Mrs. Cobb, who had arrived with her wheelbarrow and a look of stubborn determination, were already building a wharf on the new shore. The planks were fresh, smelling of pine resin. Junie’s family had returned, their faces bright with a new kind of hope. Mama Achebe set up her loom facing the sea, the threads catching the light. The people from Lowbrook began to plant a field in the soft soil.", "Junie walked across the Green. Her floor did not tilt. She stopped in front of her own door, ran her hand over the wood, and smiled. It was a small smile, but it was real. Mo watched her, and then he looked at the mountain, which was no longer a mountain, but an island, green and peaceful in the water."], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["Gran sat at her desk, which was now on the edge of the Green, overlooking the water. The Walk-Book lay open. The final page was blank, save for the date: Day 35. She picked up her pen, the ink stained on her thumb. She did not write. Instead, she handed the pen to Mo.", "Mo took it. The wood was smooth under his fingers. He looked at the page, then at the village, then at the island. He dipped the pen and wrote.", "*This is the first day of Highstep by the sea.*", "He set the pen down. Under his bare feet, the stone hummed. It was faint, so faint that he might have imagined it, a vibration in his teeth, a warmth in his bones. He looked at the people moving around him, laughing, working, living. He thought, *Home is not the mountain. Home is everyone standing on it.*", "Gran nodded, once. She tapped her staff, and the small brass bell rang, a clear, bright note that hung in the air, joining the cry of the gulls and the sound of the waves."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "The Morning the Mountain Turned", "part": "PART ONE: THE TURN", "page": 1}, {"n": 2, "title": "The Walk-Book Says Right", "part": "PART ONE: THE TURN", "page": 6}, {"n": 3, "title": "Two Long Steps", "part": "PART ONE: THE TURN", "page": 11}, {"n": 4, "title": "The Missing Page", "part": "PART ONE: THE TURN", "page": 16}, {"n": 5, "title": "The Ear-Keeper", "part": "PART ONE: THE TURN", "page": 21}, {"n": 6, "title": "The Vote", "part": "PART TWO: THE WILDS", "page": 26}, {"n": 7, "title": "The Goat Stampede", "part": "PART TWO: THE WILDS", "page": 31}, {"n": 8, "title": "The Storm on Her Back", "part": "PART TWO: THE WILDS", "page": 36}, {"n": 9, "title": "What Tor Carries", "part": "PART TWO: THE WILDS", "page": 41}, {"n": 10, "title": "Halfway to Nowhere", "part": "PART TWO: THE WILDS", "page": 46}, {"n": 11, "title": "Hale's Story", "part": "PART THREE: WHAT THE MOUNTAIN KNEW", "page": 51}, {"n": 12, "title": "What Gran Knew", "part": "PART THREE: WHAT THE MOUNTAIN KNEW", "page": 56}, {"n": 13, "title": "Nobody Believes a Barefoot Boy", "part": "PART THREE: WHAT THE MOUNTAIN KNEW", "page": 61}, {"n": 14, "title": "The Crown", "part": "PART THREE: WHAT THE MOUNTAIN KNEW", "page": 66}, {"n": 15, "title": "The Last Ladder", "part": "PART THREE: WHAT THE MOUNTAIN KNEW", "page": 71}, {"n": 16, "title": "The Half-Empty Mountain", "part": "PART FOUR: THE GATHERING", "page": 76}, {"n": 17, "title": "The Flood", "part": "PART FOUR: THE GATHERING", "page": 81}, {"n": 18, "title": "Everyone on Board", "part": "PART FOUR: THE GATHERING", "page": 86}, {"n": 19, "title": "The Gathering", "part": "PART FOUR: THE GATHERING", "page": 91}, {"n": 20, "title": "Distance: None", "part": "PART FOUR: THE GATHERING", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
</body>
</html>
