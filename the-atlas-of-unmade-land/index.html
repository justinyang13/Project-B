<script>
const D = {"title": "The Atlas of Unmade Land", "sub": "A Novel of Maps, Bridges and Honest Numbers", "author": "Yang", "publisher": "Yang Ink", "pages": [{"no": 1, "ch": 1, "ctitle": "The Leaning Chimney", "part": "PART ONE: THE BLANK SHEET", "paras": ["*The Surveyor's Catechism, First Saying: A line is only as honest as the hand that holds it.*", "On the morning she was supposed to learn whether she had a future, Isla Corrin was lying flat on her stomach on the roof of the Meridian Guild with one eye pressed to a brass sightglass, trying to decide whether the chimney of the Royal Mint was leaning or whether the entire city of Vell was.", "It was not yet six. The sun had only just cleared the hills to the east, and the whole capital lay below her in a pearl-coloured haze of coal smoke and bread-oven steam, ten thousand chimneys exhaling at once like a congregation of sleepy giants. The Guild bells were working their way through the hour in the stately, slightly smug manner of bells that had never once been wrong. Isla did not look up at them. She was sixteen, her hair was coming out of its knot despite the two crossed brass pencils that were meant to hold it, there was ink to the second knuckle of every finger on her right hand, and the stone beneath her ribs had been cold enough overnight to leave a pattern on her sleeve.", "She turned the fine-adjustment screw a quarter of a degree and read the angle. She wrote it down. She turned the screw back, looked again, and wrote down a second number, which was not quite the same as the first, and which she found quietly insulting.", "Three readings, four seconds of arc apart. In a city of ten thousand chimneys, who would care? Isla would. It was, her father liked to say, her particular affliction: she could not leave a crooked thing crooked, and she could not leave a straight thing alone until she had proved it."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["Everyone at the Meridian Guild understood what a map was, and nearly everyone at the Meridian Guild understood it wrongly. To the public, a map was a handy picture of the country, much as a portrait was a handy picture of a duchess. To the Guild, a map was a binding contract with the ground. Drawn in guild ink from measurements that were both truthful and checked, a sheet could fix the land it described, so that a hill stayed where the chart said, a river kept its bed, and a road remained a road rather than wandering off in search of a more interesting county. The whole kingdom of Aster, from the sea-walls to the Marches, lay under such sheets, bound into the great Atlas like a quilt stitched over a restless sleeper. Where the sheets stopped, the land was loose, and loose land drifted.", "Isla had grown up on the edge of that idea, in the river town of Corrin Ferry, where her father forged the great iron chains that held the ferries to their crossing. A chain, he told her, is not strong because of its links but because every link has been tested. She had carried that sentence all the way to Vell, along with a letter of introduction, a second-hand coat, and the dubious distinction of being the only scholarship apprentice the Guild had admitted in forty years. The other apprentices were the sons and daughters of magistrates and shipowners. They had tutors, and they had surnames that opened doors; hers, for reasons nobody had ever explained to her, seemed to close them.", "\"Corrin!\" The voice came from the stairwell hatch behind her, light, fluting and delighted. \"Are you taking the same angle a fourth time, or have you finally decided to marry it?\"", "Dorian Pike, third-year, climbed out onto the roof in a tailored navy coat with a gold watch chain looped across it like a tiny, expensive hammock. He had a face that always seemed on the verge of being photographed."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["\"Four readings,\" Isla said, without lifting her eye from the glass. \"I haven't decided about the fifth.\"", "\"The Mint chimney has leaned since my grandfather was a boy. It is a landmark. People set their watches by it.\" Dorian leaned on the parapet and grinned at the city. \"Let me spare you the next hour. It leans. Everything old leans. That is how you know it is old.\"", "\"If it leans,\" said Isla, \"then something about the chimney is wrong. If it doesn't, something about the city is.\" She wrote the fifth angle down. \"I would like to know which of us is mistaken.\"", "\"Us? Heavens. You do realize that this is a hobby for you, and a career for the rest of us?\" He said it lightly, as though he were offering her a biscuit. That was the infuriating thing about Dorian: he never needed to be cruel, because he was so reliably, comfortably right about the way the world arranged itself. \"Third-year placements are posted at nine. Half of us know where we are going, and the other half of us are Corrin.\"", "Isla wrote the sixth reading in the margin, where it looked like a very small act of rebellion. Her hand did not tremble. It almost never did, and that, she suspected, was the only reason the Guild had kept her this long: a steady hand was a gift that could not be taught or bought, and even the most snobbish master could see the value of a line that came out true. She gathered her notebook, folded the tripod legs with a click, and said \"Thank you for the weather, Dorian,\" and went down the stairs before he could think of an answer."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["The Atlas Room lay at the heart of the Guild, under a vault so high that its far corners dissolved into the dim like the corners of a cathedral. The sheets of the Atlas hung there on brass rails, each as tall as a door and as finely worked as lace, and at this hour, with the lamps unlit and the first sunlight pouring through the clerestory windows in long, slanting columns, they looked like the sails of some vast and motionless fleet. The hush was the sort that is made of paper. Isla slowed in it, as she always did, and, as always, felt her pulse settle against the quiet.", "Master Orrin Vasht was asleep in a leather chair beneath the sheet of the Western Marches. He was sixty-three, with a close white beard, skin the deep brown of old walnut, a grey wool coat in which several decades of ink had settled like sediment, and a battered felt hat tipped over his eyes with a pencil tucked into the band. His walking stick lay across his knees. Isla had never learned whether he actually slept or merely found it the most convenient way to avoid listening to people he disagreed with.", "\"I am awake,\" said Master Vasht, without moving the hat. \"I am merely allowing the day to arrive in its own time. What have you got?\"", "\"A discrepancy,\" said Isla. \"On the Mint chimney. It might be in the chimney. It might be in the city. It might be in me.\"", "\"Then it is almost certainly in you,\" said Vasht, tilting the hat up with one finger to reveal two shrewd grey eyes, \"and we shall find out in a moment. Show me.\"", "She laid her notebook open on his knee. He read it slowly, running a thick forefinger down the columns, and she watched his face, which gave nothing away. It never did. After a very long time he grunted and said \"Six readings, from one tower, with one instrument.\" He did not say it unkindly. He said it the way a doctor says \"temperature.\""], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["By half past eight they had read it again, with the second sightglass, from the opposite tower of the Guild, and Vasht had made Isla run the figures twice more on a slate while he sat with his hat over his eyes and listened to her chalk. At the end of it he asked her to say the answer aloud, which was one of his habits, and she found her voice came out smaller than she had hoped.", "\"The chimney is straight. It does not lean at all. Which means,\" she swallowed, \"the Guild's own benchmark, the brass disc set in the floor of this very room, which the whole city of Vell is measured from, is off. By about the width of a hair.\"", "\"A hair,\" Vasht repeated. \"That is a very small thing, Isla Corrin. And a very large one.\" He said it quietly, and for a moment he looked at the long shelf at the end of the Atlas Room, where one sheet hung blank among the finished ones: a plain, patient, unmarked oblong of the Guild's best paper, framed like a window onto nothing. It was the Unmade, the stretch of loose country at the kingdom's edge that nobody had ever charted. Isla had walked past it every day for two years and had never once seen him look at it directly.", "A page boy burst through the double doors at a dead run, skidded on the polished floor, saved himself on a brass rail and gasped, \"Master Vasht! The Queen sends. Noon, at the palace. For you and,\" he squinted at a paper, \"your apprentice.\"", "Isla glanced down at her ink-stained fingers and her very much slept-in coat, and then, helplessly, back at the blank sheet. She had the sudden, dizzying feeling of having walked into a room where her life had already been drawn, and it was waiting, very politely, for her to find out where the lines went.", "◆ Words to know: discrepancy – a difference or inconsistency between two things; affliction – a persistent problem or difficulty that causes distress; parapet – a low protective wall along the edge of a roof; clerestory – the upper part of a wall containing windows; sediment – material that settles at the bottom of a liquid"], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Commission", "part": "PART ONE: THE BLANK SHEET", "paras": ["*The Surveyor's Catechism, Second Saying: Ask what the land is for before you ask what it is.*", "The streets of Vell were laid out in a grid that had been fixed, and refixed, so many times that the cobbles had worn into a gentle, uneven rhythm underfoot. Isla walked with her hand on the wall of the Meridian Guild, tracing the brickwork with one finger. She knew which streets had been surveyed first, in the days when the city was still arguing with the hill. The main avenue, the Long Mile, had been the first true line, measured in iron and sweat before the Guild had even learned to read angles.", "Master Vasht walked beside her, leaning heavily on his carved stick. He was complaining about the cobbles in a low, continuous murmur, as if the stones had personally offended his dignity. \"They have settled again,\" he said, tapping the stone with the tip of his stick. \"The drainage is poor here. I have written three letters. The city clerk says the stones are 'characterful.'\"", "\"They are not characterful,\" Isla said. \"They are uneven. And they are dangerous for your ankle.\"", "\"My ankle is fine. My patience is not.\" He paused, looking at her with a sideways glance. \"You are touching the wall again. Stop it. You will wear a groove in the history.\"", "Isla pulled her hand back, but she had already felt the slight dip in the masonry, a subtle shift in the plane that meant the building had moved, just a fraction, over the last decade. It was a small thing. A dangerous thing. She noted it in her mind, not on paper. She did not write things down in public. Not yet.", "The palace gates were iron, black and ornate, flanked by two footmen who stood with the rigid stillness of surveyors holding a sightglass steady for a crucial reading. As they approached, one of the footmen turned his head. He looked at Vasht’s grey coat, then at Isla’s mustard-yellow canvas, the ink stains on her cuffs, and the brass pencils crossed in her hair. His lip curled, a small, precise movement of disdain.", "\"Appointment?\" the footman asked, his voice flat.", "\"Master Vasht and his apprentice,\" said Vasht, producing a letter from his breast pocket. \"The Queen’s invitation.\"", "The footman took the letter, read it, and then looked at Isla again. This time, he did not curl his lip. He simply looked through her, as if she were a smudge on the glass.", "\"Enter,\" he said, turning his back on them to open the gate."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["The Queen’s study was not a throne room, but a plain space of high windows and a single large table draped in deep blue velvet that swallowed the morning light. Queen Cassia sat at the head of the table, her silver circlet catching the sun, her eyes sharp and direct. She did not rise, nor did she smile; she simply waited for them to sit.", "\"Sit,\" she said. \"I do not care if your knees crack. I care if you are honest.\"", "Vasht sat. Isla sat. The chair was uncomfortable, the kind that made you feel judged by the upholstery itself. Across the table sat Lord Chancellor Aldous Vane, a thin man with silver hair slicked back and a pearl-grey frock coat that fit him as if tailored to his specific brand of arrogance. He held a gold-topped cane, tapping it gently against the wood.", "\"Master Vasht,\" he said, his voice smooth. \"Apprentice Corrin. A pleasure. I trust the journey was pleasant.\"", "\"The cobbles were not,\" Vasht said.", "\"The cobbles are a matter of municipal maintenance,\" Vane replied. \"We are here for the Unmade.\"", "The word hung in the air, heavy and strange. Isla looked at the blue cloth. She could not see the map underneath, but she could feel its presence. The Unmade. The blank sheet. The land that drifted.", "\"The Unmade is not a place,\" Queen Cassia said. \"It is a process. It is the land leaving us.\"", "She tapped the table. \"Every year, the edge of the fixed kingdom moves closer to the Marches. Farms are lost. Fields that were tilled in spring are drifting by winter. The people are leaving. They do not blame the Guild. They blame the sky. I do not want them to blame the sky.\"", "\"Then we need to fix it,\" Isla said.", "\"We need to measure it,\" the Queen said. \"And then we need to fix it. Those are two different things, and you must not confuse them.\"", "Vane smiled, a thin expression that showed no teeth. \"The Queen is right. We have a deadline. Midsummer. Forty days.\"", "Vasht raised an eyebrow. \"Forty days.\"", "\"Forty days,\" Vane repeated. \"The harvest levy is due. The farmers are waiting. We need a sheet. A serviceable sheet.\""], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["\"A serviceable sheet,\" Vasht repeated. He said it slowly, as if testing the tension of the phrase on a wire. \"You are asking for an estimated survey.\"", "\"I am asking for a map that works,\" Vane said, tapping his cane with metronomic precision. \"We do not need perfection. We need function. We need to know where the rivers are, where the roads can be, where the land is stable enough to build on. The rest can be refined later.\"", "\"The rest cannot be refined later,\" Vasht said, his voice flat and final. \"If you fix a river in the wrong place, it does not move when you change your mind. It stays. If you fix a road that is too steep, it breaks. If you fix a field that tilts, the crops die. A map is not a sketch, Chancellor. It is a contract.\"", "\"A contract with what?\" Vane asked, leaning back in his chair.", "\"With the ground,\" Isla said.", "Vane looked at her. For a moment, his smile faltered, a crack in the porcelain. \"With the ground,\" he repeated. \"Yes. That is a poetic way to put it. But poetry does not pay the harvest levy.\"", "\"Perfection is dangerous,\" Vasht said, shaking his head slowly. \"Estimates are worse. A true survey of that size, that complexity, takes a year. We need to establish a baseline. We need to triangulate. We need to check every angle, every distance, every level. We need to close the traverse. We need to prove that the numbers agree.\"", "\"A year,\" Vane said, as if the number were a physical weight he had dropped on the table. \"We have forty days.\"", "\"Then you will have a map that lies,\" Vasht said. \"And a lie, once fixed, is harder to remove than a hill.\"", "Vane’s cane stopped tapping. The silence that followed was thick, charged with the static of two men who had been talking past each other for the better part of an hour. \"I have heard this before,\" Vane said, his voice low and dangerous. \"The Guild is slow. The Guild is proud. The Guild would rather be right than useful. I am offering you a chance to be useful.\"", "\"Serviceable is what we call a bridge before the flood,\" Vasht said. He leaned forward, his elbows on the blue velvet, and for the first time, the gentleness in his voice vanished, replaced by the cold clarity of a man who had seen the consequences of his own carelessness. \"I have seen what happens when you cut corners. I have seen the land bend. I have seen the rivers run uphill. I have seen the fields tilt until the water drains away and the soil cracks. I will not do that again. I will not let you do it.\"", "The room was silent. The blue cloth on the table seemed to darken under the pressure of their words, absorbing the light from the high windows. Queen Cassia watched them both, her eyes unreadable, her silver circlet catching the sun in a single, sharp glint.", "\"I am listening,\" she said."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["Queen Cassia turned to Master Vasht, her gaze steady and unblinking. \"What do you need to chart the Unmade?\"", "\"A baseline,\" he replied, his voice quiet but firm. \"A long, straight, and honest line across the loose ground. From that anchor, we can triangulate the rest. We require three pairs of careful hands, a steady hand, and sufficient time. I need to be left alone to do the work properly. No interference, no 'serviceable sheets,' and no haste.\"", "\"Time is a luxury we do not have,\" Vane said, tapping his gold-topped cane against the floor once, a sharp, rhythmic tick that cut through the silence.", "\"Time is a necessity for accuracy,\" the Queen countered. \"I will give you your baseline. I will provide the hands you request. I will allocate a hundred crowns for materials and provisions. And the Lord Chancellor has asked that one of his protégés assist your team.\"", "Vane’s smile returned, wider and more confident than before. \"Sera Quillon,\" he announced. \"The most efficient student in the Guild. She is fast, meticulous, and capable of helping you close the traverse well before our deadline.\"", "\"She is not an assistant,\" Vasht said, his eyes narrowing slightly. \"She is a competitor who has never had to answer for her errors.\"", "\"She is a resource,\" Vane corrected. \"Resources are not rivals. They are tools to be used.\"", "Isla felt a cold pull at the base of her skull, a sensation not unlike the sudden drop of the chain when the ferry slackens against the current. She knew Sera Quillon well. She had watched her in the Atlas Room, moving with a speed that felt like a blade slicing through still air. She had seen her cut corners, estimating angles from memory and guessing distances without a second check. She had seen her work, and she had known, with a certainty that settled in her chest like a misplaced peg, that the numbers did not hold.", "\"The Queen will inspect the field-book,\" Cassia said, her tone leaving no room for debate. \"When your survey is complete, you will bring it to me. Every reading. Every check. Every discrepancy, recorded and explained.\"", "Vane’s smile thinned to a precise line. \"The Queen is requesting access to a private Guild document. Field-books are confidential records of the Meridian.\"", "\"They are not private,\" the Queen said, her voice cool and clear. \"They are public. The land is public. The work that binds it must be visible to the people who live upon it. If you cannot show your work, you cannot trust your work.\"", "She rose from her chair, the fabric of her deep-blue gown sweeping the floor. \"The commission is yours, Master Vasht. You have until Midsummer. Do not make me regret this decision.\"", "Vasht stood, his movements slow and deliberate. He looked at Vane, then turned his grey eyes to Isla. \"We leave at dawn,\" he said."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["The palace doors swung shut behind them, cutting off the hush of the chamber and releasing Isla into a high, sharp sun. Vell glittered in the light, a mosaic of brass and stone that seemed to hum with activity. The air carried the sharp scent of coal smoke and heated slate, while the city bells struck the hour with that stately, smug confidence that always felt personally directed at her. The commission had settled onto her shoulders with the dull, aching drag of a poorly tensioned Gunter’s chain, pulling at the joints rather than resting on the bone.", "Vasht walked with his usual deliberate slowness, his felt hat tilted low over his eyes. He did not speak for a long time. They passed the Royal Mint, where the tall chimney stood perfectly true, a straight line of grey brick against the blue sky that Isla had sworn was leaning. Next, they passed the Guild, its brass domes catching the light, and then the river, which moved in its fixed, obedient bed, the water sliding over the stones with a smooth, practiced efficiency.", "\"Why me?\" Isla asked, her voice sounding small in the busy street.", "Vasht stopped. He turned to face her, his grey eyes sharp beneath the brim of his hat, but not unkind.", "\"Because you check things three times,\" he said. \"Because you do not trust your first reading. Because you know that the first reading is always wrong. Because you are afraid of being merely adequate.\"", "Isla looked away, feeling a flush of heat rise in her cheeks. \"My family name is unwelcome at the Guild,\" she said, keeping her voice flat and pragmatic. \"You know that. They do not like the Corrins. They do not like the ferry-chains. They do not like the river.\"", "Vasht did not answer. He looked at the river, at the water moving, at the fixed banks. He said nothing. He simply walked on.", "Isla noticed the silence. She had expected him to say something, to defend her, to explain, or to give her a reason, but he had said nothing, and that silence was louder than any explanation.", "She stopped walking, then took out her notebook and opened it to a fresh page. With a steady hand, she took out her pen and wrote: *Dear Father, I have been chosen. I am afraid. I am going to the Unmade.*", "She did not sign her name, for she did not need to, and he would know.", "◆ Words to know: triangulate – determine position using measured angles from known points; metronomic – moving with steady, precise, mechanical regularity; meticulous – showing extreme care and attention to detail; discrepancy – a difference or inconsistency between facts; pragmatic – dealing with things sensibly and practically"], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "Mags and the Pot", "part": "PART ONE: THE BLANK SHEET", "paras": ["*The Surveyor's Catechism, Third Saying: A chain is only as long as its weakest link, and a crew is only as good as its quietest member.*", "The yard behind the Meridian Guild smelled of damp wool and iron shavings. Moonlight pooled in the cobblestones, turning the wet patches into scattered coins. Isla stood before the open wagon, which groaned under the load: two sightglasses wrapped in thick felt, a level resting on its staff, and crates of chains that clinked softly when the wind stirred the canvas cover.", "Vasht sat on an overturned crate, his walking stick leaning against his knee. He held a sheaf of paper, reading aloud in a tone that suggested he was reciting a menu for a very picky guest. \"Gunter’s chain, one hundred links. Steel tape, fifty feet. Plumb bobs, three. Staff, one. Level, one. Chronometer, one. Field-book, two. And for the cook, who has not yet arrived, a pot. One iron pot.\"", "Isla counted the items as he spoke, her fingers tapping the rim of the crate. \"You missed the tension spring,\" she said.", "Vasht did not look up. \"I missed nothing. I am testing your attention.\"", "\"I missed the pegs,\" Isla said, a small flush rising in her neck. She looked back at the wagon. The crates were stacked with a precision that bordered on obsessive, but the small leather pouch that held the wooden pegs and the tension spring was absent from the pile. \"The pegs, and the spring. They are in my coat.\"", "She reached into her mustard-yellow coat, feeling the familiar brass compass against her chest. She produced the pouch and set it on the wagon bed. It made a small, definitive clatter that seemed to settle the air.", "\"One more thing,\" Vasht said. \"The mule.\"", "Isla looked at the animal hitched to the front. It was a sturdy, grey creature with ears that twitched independently, as if it were listening to two different conversations. Its name, according to the stable boy, was Ledger. It looked at Isla with a flat, unimpressed stare that she knew well.", "\"Ledger,\" Isla said, testing the name.", "The mule blinked. It did not seem to like the name any more than it liked the idea of carrying four hundred pounds of brass and glass to the edge of the world.", "\"Good,\" Vasht said. \"Sleep well. Tomorrow we begin the list again.\"", "Isla watched him climb the stairs, his felt hat casting a long shadow. She felt a strange lightness in her chest, a sensation like the first step onto a bridge that has not yet been tested. She touched the brass pencils in her hair, feeling their cool weight. The Unmade waited beyond the Marches, a blank space on the map, and she was going to fill it."], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["The sound came first: a rhythmic, metallic clanging that echoed off the stone walls of the Guild. It was the sound of iron striking stone, steady and assured, like a heartbeat that had no intention of stopping. Isla turned from the wagon and saw a figure emerging from the shadows of the dockyard gate.", "It was a girl, no older than fifteen, with deep-brown skin and short black twists tied back with a bright blue scarf that flapped in the evening breeze. She wore a teal jacket that was too large for her, patched cream trousers, and red canvas shoes that were scuffed at the toes. Slung over her shoulder was a pack, and tied to the front of it, with a coil of rope that looked like it had seen better days, was a large iron cooking pot.", "\"Excuse me,\" the girl said, her voice bright and clear. \"You are Master Vasht’s apprentice, are you not?\"", "Isla nodded, feeling slightly out of her depth. \"I am.\"", "\"I am Mags Okoro.\" She stepped closer, her eyes scanning the wagon with a quick, practical assessment. \"I am your cook, your chain-bearer, and your counter. In that order of importance.\"", "Mags Okoro. Isla had heard the name mentioned in the Guild hall, usually in the context of mental arithmetic that left the other apprentices looking foolish. Mags dropped her pack onto a crate, the iron pot clattering against the wood.", "\"Can you add a column of figures?\" Mags asked, not waiting for an answer. \"No. Wait. Let me ask it properly. A barge makes three miles an hour in still water and must go upstream, against a current of two miles an hour, to a lock five miles away. How long does the trip take?\"", "Isla blinked. It was a simple problem, but the way Mags had delivered it, with that easy, challenging smile, made it feel like a test. Isla thought for a moment, her mind moving through the numbers. The barge moves at three miles an hour through the water, but the water carries it back at two. The net speed upstream is one mile an hour. Five miles at one mile an hour is five hours.", "\"Five hours,\" Isla said.", "Mags smiled, a sharp, satisfied expression. \"Faster than most. But can you show the working?\"", "Isla hesitated. She took out her notebook and pencil. \"The relative speed is the difference between the barge’s speed and the current. Three minus two is one. Distance over speed is time. Five miles divided by one mile per hour is five hours.\"", "Mags nodded, her eyes bright. \"You’re the sort who shows the working.\"", "\"Always,\" Isla said.", "\"Good. I’m the sort who checks.\""], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["Mags settled onto the wagon axle, her red shoes dangling over the cobblestones, and watched Isla with an intensity that felt more like a level being checked than a person being met. The night air was cool, carrying the scent of river mud and the faint, acrid bite of distant coal smoke. Isla felt a strange sense of being observed, as if Mags were measuring her with some invisible, precise instrument that had nothing to do with numbers.", "\"So,\" Mags said, leaning forward, her blue scarf fluttering in the breeze. \"You go to the Unmade. The loose country. The place where the land drifts because it has been left out in the rain.\"", "Isla stiffened. \"It is not a place where the land drifts. It is a place where the land is not yet fixed. It is a problem to be solved, not a joke to be told.\"", "Mags raised an eyebrow. \"A problem to be solved. Yes. That’s what I said. I was just being poetic.\"", "Isla looked at her, surprised. Mags Okoro, the girl with the iron pot, was being poetic. It was an unexpected turn, and Isla found herself smiling despite herself.", "\"Tell me about the Unmade,\" Mags said. \"What does it look like? Is it fog? Is it mist? Or is it just empty?\"", "Isla thought back to the blank sheet in the Atlas Room, the plain, patient frame that hung on the rail. \"It is empty,\" she said. \"But not in the way you think. It is empty because it has not been measured. It is a space waiting for a shape.\"", "Mags nodded slowly. \"A space waiting for a shape. I like that. It sounds like a pot waiting to be filled.\"", "Isla looked at the iron pot, then back at Mags. \"You cook with it?\"", "\"Everything,\" Mags said. \"Porridge, soup, stew. It’s a good pot. It holds heat well. It’s like a person, really. You have to know how to work with it.\"", "Isla felt a strange warmth in her chest. Mags was different from the other apprentices. She was not trying to impress her, or to outdo her. She was simply present, here with her pot and her questions and her sharp, quick mind.", "\"Will you be my counter?\" Isla asked, the words coming out before she had fully thought them through.", "Mags grinned, a wide, unguarded smile that transformed her face. \"Already am.\""], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["The sound of heavy boots on the cobblestones announced the arrival of the third member of their party before he actually appeared. He came around the corner of the Guild, his shoulders hunched, his hair damp and sticking up in untidy tufts. He was tall, pale, and freckled, with a rust-red work shirt that was rolled up to the elbows and a brown leather apron that was stained with sawdust. Over his shoulder hung a coil of rope, thick and sturdy, and in his hand he held a half-eaten pie, the crust flaking onto his trousers.", "\"Joss Harrowgate,\" he said, his voice cheerful and slightly out of breath. \"Bridge-wright’s apprentice. Sent by Master Alder, who owes Vasht a favor. I assume that’s why I’m here.\"", "Isla looked at him, then at the pie, then back at him. \"You’re soaking wet.\"", "\"River,\" Joss said, taking a bite of the pie. \"I fell in. Or the river fell on me. Hard to say. It was a bit of a struggle.\"", "Mags looked at him with a mixture of amusement and skepticism. \"You’re a bridge-wright’s apprentice? Do you know how to survey?\"", "Joss shrugged, a casual, easy movement. \"Not a clue. I know about loads and forces. I know how to hold things up. If you can measure the hole, I can build the bridge. That’s the deal.\"", "Isla studied him. He was different from Mags, and different from her. He was practical, physical, unafraid of getting his hands dirty. He looked at her, and his eyes drifted to the brass pencils in her hair.", "\"Those,\" he said, pointing at the pencils. \"They’d make a decent truss.\"", "Isla blinked. \"A truss?\"", "\"Yeah. Triangles. Strong shapes. You use them to hold things up. Your pencils are crossed. That’s a triangle. Very strong.\"", "Isla felt a strange flicker of something in her chest. Amusement, maybe. Or recognition. Joss was looking at her work, her tools, and seeing them as something useful, something that could hold up a bridge. It was a different way of seeing, but it was not wrong.", "\"Thank you,\" she said, and meant it more than she expected to.", "Joss grinned, and for a moment, the rain seemed to fade, the night to warm. \"No problem. I’m good at holding things up.\""], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["The yard was quiet now, save for the soft clink of the mule’s harness and the distant, thrumming hum of the city. Isla, Mags, and Joss sat in a loose circle around the packed wagon, their faces turned upward. The stars were out, bright and steady, scattered across the dark like a field of white pins pushed into a black felt board.", "Isla pointed to a single star, bright and blue, that hung high in the northern sky. \"That’s the Pole Star,\" she said. \"It doesn’t move. It stays in the same place, night after night. It’s the fixed point.\"", "Mags frowned, scratching a twist of hair. \"How do you know it’s fixed?\"", "\"Because it is,\" Isla said. \"It’s the only star that doesn’t appear to move as the sky turns. It’s the anchor. When you can find it, you know where north is. True north. Not magnetic north, which can drift, but true north, the axis of the earth.\"", "Joss looked up, his head tilted, a smear of pie crust still on his jaw. \"So if I’m lost, I just look for the Pole Star and I know which way to go?\"", "\"Exactly,\" Isla said. \"It’s the one thing that doesn’t change. It’s the honest line.\"", "Mags nodded slowly, her eyes reflecting the starlight. \"I like that. The honest line. The one that doesn’t lie.\"", "Joss laughed, a soft, warm sound. \"You know, I’ve always been a bit lost. My father says I’m good at getting lost, but I’m terrible at finding my way back.\"", "Isla looked at him, and for a moment, she felt a pang of sympathy. Joss was not lost in the way that the Unmade was lost. He was lost in the way that a person is lost when they are trying to find their place in the world.", "\"Getting lost is the beginning of a map,\" Vasht said, his voice quiet and clear, coming from the doorway behind them. He stood in the shadows, his felt hat tipped low, his eyes bright in the dark. \"It’s the first step. You have to know where you are before you can know where you’re going.\"", "Isla looked at him, and felt a surge of gratitude. He was not just their teacher. He was their anchor. Their fixed point.", "\"Thank you, Master,\" she said.", "Vasht nodded, and disappeared back into the shadows, leaving them alone with the stars and the promise of the morning.", "◆ Words to know: catechism – a collection of questions and answers on a subject; chronometer – a highly accurate timekeeping instrument; acrid – having a harsh, stinging taste or smell; unguarded – open and honest without hiding feelings; truss – a framework of beams used for support"], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "The Pale Road", "part": "PART ONE: THE BLANK SHEET", "paras": ["*The Surveyor's Catechism, Fourth Saying: The country does not care what you think of it. Measure it anyway.*", "The mule’s name was Ledger, and he had the temperament of a retired accountant who had finally decided to stop working. He stood on the first slope of the old stone bridge, his ears pinned flat, refusing to acknowledge the gravity of the situation. Isla leaned against the wagon wheel, her ink-stained fingers drumming a rhythm on the wood, while Mags sang a low, mournful tune about a lock-keeper who never opened his gate. The song was not about the mule. It was about the fact that they were late, and that the road to the Marches was long, and that the sun was already high enough to dry the dew on the grass, which meant the day was going to be hot and dusty and entirely their fault.", "\"Come on, Ledger,\" Joss said, scratching the mule’s neck with a gentle, practiced hand. \"We have a schedule. The Chancellor has a deadline. The Queen has a question. And I have a very strong suspicion that this mule is holding us hostage for a better wage.\"", "Ledger blinked, slowly, at him. It was a look of profound indifference. Isla exhaled and stepped forward. She did not shout. She did not pull. She simply placed her hand on the mule’s shoulder, feeling the muscle tense beneath the hide, and waited. It was a surveyor’s tactic: apply steady pressure, observe the reaction, adjust the angle. After a minute, Ledger exhaled, a sound like a deflating tire, and took a single, reluctant step forward.", "The wagon creaked, a long, groaning protest that seemed to come from the wood itself. As they crossed the bridge, Isla looked back. The city of Vell lay behind them, a sprawling hill-city of chimneys and clocktowers, the domes of the Meridian Guild catching the morning light and shining like brass buttons sewn onto the grey fabric of the hills. It was a beautiful view, orderly and fixed, every stone where it was supposed to be. She had spent two years trying to earn a place in that order, and now she was leaving it. The feeling was strange, a tenuous blend of pride and panic, like standing on the edge of a cliff that was actually quite solid, but which your feet insisted was not.", "Mags broke the silence with a snort. \"He’s not refusing, you know,\" she said, her voice bright with amusement. \"He’s negotiating. Mules are unionized in my head. It’s the only way to explain them.\"", "Isla turned back to the road ahead. It was straight, well-paved, and it led away from the only fixed point she had ever known. She adjusted her coat, checked the brass pencils in her hair, and climbed into the wagon seat beside Vasht, who was already reading a field-book with the calm assurance of a man who knew exactly where the road ended, even if none of them did."], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["The road through the fixed farmland was a lesson in geometry that no one had bothered to teach them in the Guild. The hedgerows ran straight as ruled lines, their tops clipped into perfect, unyielding rows. The barns stood square, their corners sharp and precise, as if they had been laid out with a compass and a straightedge by a god with a particular fondness for right angles. Isla watched the landscape pass by, her eyes tracing the boundaries of the fields, and she realized that she had been looking at the wrong things. She had been looking at the land, but she had not been reading it.", "\"Look,\" Vasht said, his voice quiet but carrying the authority of the room. He pointed his walking stick at a milestone on the side of the road, a simple stone pillar with a number carved into it. \"That is not just a marker. It is a benchmark. It is a point of known position. Every measurement in this kingdom starts from a point like that. If that stone moves, everything else becomes a guess.\"", "Isla looked at the stone. It was weathered, mossy, and utterly still. She thought of the Unmade, where the stones did not stay still, where the land itself was a suggestion rather than a fact. She felt a sudden, sharp clarity. This was what they were here to do. To make the suggestions into facts. To turn the loose, drifting world into a fixed one.", "Joss, who had been silent until now, leaned out of the wagon window. He was staring at a stone arch bridge that spanned a narrow creek. The arch was a perfect semi-circle, smooth and strong. \"See that?\" he said, his voice filled with a kind of reverent excitement. \"The load path. The road's weight goes down through the arch, into the keystone, and then out into the abutments on either side. It’s a triangle in disguise. Strong shapes. You can’t argue with a triangle.\"", "Isla smiled. Joss thought in loads and forces, in the physical reality of things. She thought in numbers and lines. They were different languages, but they were speaking the same dialect. Mags, in the corner, was quietly calculating the distance to the next inn, her lips moving as she did the math. The wagon rattled on, the fixed world passing by in a steady, reliable rhythm, and Isla felt, with a quiet, settling certainty, that she was not just an apprentice, but a part of something."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["The inn at the edge of the Marches was called The Drifter, a name that seemed ironic given that the building itself was the most stable thing in the county. The farmers who gathered around the fire did not talk about the weather, or the price of grain, or the Queen’s taxes. They talked about the drifting. A man with a scarred face and hands like tree bark told them about his barn, which had moved forty yards in a year. \"It was in the middle of the field,\" he said, his voice flat and tired. \"Now it’s in the ditch. I had to build a new one. I don’t know where it will be next.\"", "A woman, her face lined with a worry that looked carved into the skin, spoke of a pond that had wandered into her neighbor’s field. \"It used to be on our side of the fence,\" she said. \"Now it’s his. The water doesn’t care about the fence. The land doesn’t care about the fence. Only the people do.\"", "Isla listened, her hands clenched in her lap. She had heard the stories, of course. Everyone had. But hearing them from the people who lived with the consequences, who watched their homes and their fields slide away like sand through their fingers, made the abstract become real. The Unmade was not just a blank sheet on a map. It was a loss. It was a grief. It was a future that was being stolen, inch by inch, by a land that refused to stay still.", "She looked at Vasht, who was sitting quietly, his hat tipped low over his eyes. He was not listening. He was remembering. His face held a look of profound sorrow, a sorrow that was not for the present, but for the past. Isla wondered what he was remembering. She wondered if he, too, had lost something to the drift. She decided that she would ask him later. For now, she had a job to do. She pulled out her field-book and opened it to a fresh page. She did not write anything down. She just looked at the blank space, and the responsibility settled onto her shoulders, heavy as a chain over her neck."], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["Cairn Fell was the last ridge before the Unmade, a sharp, rocky spine rising out of the fixed world to look out over the loose one. They climbed in silence, the air thin and cold, the wind whipping at their coats. At the top, the view stopped Isla’s breath in her chest.", "The Pale was a vast, soft plain of pale gold haze stretching to the horizon. It was not empty. It was full of hills, but they were not fixed. They were adrift, moving slowly, imperceptibly, across the landscape. The fog pooled in the valleys, soft and white, and the light was diffuse, almost dreamlike. It was the most beautiful and unsettling thing Isla had ever seen.", "Mags, who had been chattering the entire climb, went quiet. She stood at the edge of the cliff, her blue scarf flapping in the wind, her eyes wide.", "\"It looks like the world forgot to finish,\" Joss said softly. His voice was low, almost a whisper. \"Like a drawing where the surveyor ran out of ink.\"", "Isla felt a surge of wonder, a feeling that was not quite fear, but not quite excitement either. It was awe. It was the feeling of standing at the edge of the known and looking out into the unknown. She could see the drift, the slow, lazy movement of the hills, the way the fog shifted and changed. It was a landscape in constant motion, a living, breathing thing that did not care about the lines they were trying to draw.", "She looked at her companions. Mags was staring at the haze, her face pale. Joss was rubbing his hands together, as if to warm them, but also as if to steady himself. Vasht was standing apart, his hat covering his eyes, his face unreadable. Isla felt a sudden, sharp urge to speak, to say something that would make the world make sense, but the words stuck in her throat. The Pale was too big, too soft, too full of a mystery that she was not yet ready to unravel. She simply stood there, and watched, and felt the task ahead of her settle into her bones."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["The wind died as the sun slipped below the ridge, and they made camp on the fell. Mags built a fire with the efficient, cheerful speed of someone who had cooked on moving water her whole life. The smell of stew rose from the iron pot, rich and thick, anchoring them to the earth in a way the cold air refused to. They ate in silence. The darkness closed in, heavy and total, wrapping around the firelight like a hand over a lamp.", "Vasht spoke of the Guild’s founding sheet, the first map ever drawn in guild ink. He described the surveyor who had made it, a man who had spent ten years measuring the same field, again and again, until the numbers agreed.", "\"He didn’t draw the land,\" Vasht said, his voice quiet and clear against the crackle of the fire. \"He listened to it. He waited for it to tell him the truth. Only then did he put it on paper.\"", "Isla turned the words over in her mind. She thought of her own work, the six readings on the Mint chimney, the hair-width error that had humiliated her and, she suspected, worried her master. She thought of the Pole Star, that fixed point in the sky that did not drift, did not wander, did not care if you were looking at it or not. She looked out into the darkness.", "And there it was.", "A faint line of lights, far inside the Pale. A thin thread of smoke rising into the night sky. It was so small, so fragile, that it looked like a speck of ink on the back of a field-book page. She blinked. It stayed. It was not a trick of the firelight, nor a reflection off her brass compass. It was there.", "Her heart gave a single, sharp kick. Hope. Or perhaps just a question. She pulled out her field-book and opened it to a fresh page. The ink was still wet from her last entry, a little smear of black on the paper. She wrote down the time. She wrote down the date. She wrote down the direction, calculated from the stars she could see above the ridge.", "She did not write down what she had seen.", "She did not write down the lights, or the smoke, or the feeling that the Pale was not empty at all. She wrote only the time. Because the time was sure. The lights were a surmise. And surmise, she was learning, was not a measurement. It was a risk. And risk, in the end, was what the Unmade was made of.", "◆ Words to know: indifference – lack of interest or concern; tenuous – weak or slight; diffuse – spread out over a wide area; surmise – a guess based on incomplete information"], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "The Edge of the Sheet", "part": "PART ONE: THE BLANK SHEET", "paras": ["*The Surveyor's Catechism, Fifth Saying: Write it down at the moment you see it. Memory is a flatterer.*", "The dawn did not break so much as it arrived, pale and tentative, like a surveyor stepping onto a roof that might not hold his weight. The fixed land of the Marches ended abruptly at a shallow ditch, no wider than a boot, lined with white stones that looked less like natural rock and more like the teeth of a jaw that had been pulled and left on the table. Beyond that ditch, the ground changed. It was not rough, nor was it smooth. It was still.", "Isla stood at the edge, her boots planted firmly on the firm earth of the known world, and looked out at the Unmade. The grass beyond the ditch did not sway. It lay flat, rigid, and perfectly silent, resembling a sheet of green glass left on a table. There was no wind there. The air above it did not shimmer with heat or cold. It simply existed, waiting.", "Master Vasht walked to the ditch. He leaned on his carved stick, his grey coat brushing the white stones. He reached into his pocket and produced a smooth, river-worn pebble, dark and heavy with the memory of the water that had shaped it. He did not throw it. He placed it gently on the surface of the loose land, right at the boundary where the fixed soil met the drifting ground.", "For a moment, nothing happened. Then the pebble sank.", "It did not crunch into dirt. It did not roll. It dipped downward, slow and deliberate, sinking about the depth of Isla’s thumbnail before stopping. It hung there, suspended in the yielding earth, as if the ground were considering the question and had not yet decided on the answer.", "\"The land is thinking,\" Vasht said. His voice was dry, lacking the usual warmth of his lectures. \"It does not know what it is. It is asking us to tell it.\"", "Isla watched the pebble. It remained suspended, neither rising nor falling. The silence in the Unmade was not empty. It was attentive. She felt the hair on her arms rise, not from cold, but from the sudden, visceral sense of being observed by something vast and indifferent. The fixed world behind her was safe, solid, and boring. The world ahead was blank, waiting, and hungry for a definition.", "She took a step back. Her boot heel struck the edge of the ditch. The sound was sharp, a tiny crack in the quiet. The pebble did not react. It stayed where it was, a small dark dot in a field of pale green, waiting for the truth to be written."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["\"Rule one,\" Vasht said, not turning from the edge. \"A map is not a picture. A picture is a guess. A map is a promise.\" He turned to her, his grey eyes sharp behind the brim of his hat. \"And a promise only holds if the numbers are honest. And checked.\"", "He reached into his pack and withdrew a small glass vial. Inside, a liquid the color of old blood swirled slowly. \"Guild ink,\" he said. \"Oak gall, river iron, a pinch of salt. It dries hard. It does not smudge. It does not forgive.\" He held it up to the light. \"If you put a lie in this ink, the land will feel it. It will bend. It will sag. It will run uphill just to spite you. The ink does not care about your intentions. It cares about your arithmetic.\"", "Isla took the vial. It was heavy, denser than it looked. \"And if the arithmetic is right?\"", "\"Then the land settles,\" Vasht said. \"It stops drifting. It becomes what you wrote.\" He pointed a finger at a small hillock a few dozen yards into the Unmade. It was modest, barely ten feet high, with a few stiff blades of grass clinging to its side. \"That is a mistake. A small one. The land has not decided what shape it wants to be. It is wobbling. You are going to fix it.\"", "Isla looked at the hillock. It looked fragile, like a soap bubble about to pop. \"I am to fix it? I am an apprentice.\"", "\"You are the one with the steady hand,\" Vasht said, and the compliment was so dry it barely registered as one. \"Set up the plane-table. Measure it. Twice. And then, because I am not a fool and neither are you, you will measure it a third way. If the numbers agree, you draw. If they do not, you find your error. Do you understand?\"", "Isla nodded. Her hands were already moving, unpacking the brass instruments from her canvas bag. The sightglass, the level, the staff. They clicked and clacked together in a rhythm she knew as well as her own heartbeat. She set up the tripod in the loose ground, the legs sinking slightly, and she had to drive pegs beneath each foot to anchor them to the earth. The work was tedious, physical, and demanding. She did not mind. Tedious work was safe. Tedious work did not require you to be right. It only required you to be careful.", "She checked the level, then the bubble, then the screw, and then the bubble again. The hillock waited, silent and still, offering no clues, no comfort, no reassurance. It was just a lump of dirt in a blank sheet of world. And she was going to have to tell it what it was."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["The setup took twenty minutes. Isla checked the plumb bob, adjusted the height, and took her first reading. The numbers came out clean, crisp, and unobjectionable. She wrote them in her field-book, her pen scratching against the paper. Then she moved the station, taking a second reading from a different angle. The numbers matched, to the nearest second of arc. She took a third, from a third position, closing the triangle. The angles summed to one hundred and eighty degrees. Perfect.", "A strange, cold calm settled over her. It was not confidence, but the absence of doubt. The numbers sat there, solid and undeniable. She picked up the pen. The ink was ready. She began to draw.", "The line was thin, black, and precise. It traced the outline of the hillock, the slope, the peak. It was a small thing, a minor detail on a vast sheet, but it was a truth. She finished the outline and paused. The pen hovered over the paper. This was the moment. The point of no return. If she sealed it, the hillock would stop drifting. It would become fixed. It would be part of the Atlas. It would be real.", "Her thumb was stained with ink, a dark crescent on her skin. She pressed it to the corner of the paper, then took the guild stamp, a heavy brass disc, and pressed it into the center. The ink dried instantly, hard as stone.", "Nothing happened.", "One second. Two. Ten. A minute passed. The hillock stood there, unchanged. The grass did not ripple. The air did not move. Joss, who had been watching with his arms crossed, let out a low, skeptical mutter. \"Well,\" he said, scratching his sandy hair. \"That’s it? That’s the big fix? It’s just sitting there.\"", "Isla ignored him. She waited. The silence stretched, taut and thin.", "Then, it happened.", "It began as a sound, low and deep, like a long, slow breath being exhaled from the earth itself. The grass on the hillock rippled, a wave of light passing through the blades, shimmering gold and white. The hillock settled. It did not move, but it *settled*, sinking slightly into the ground, solidifying, becoming heavy. The light faded, and the hillock stood there, fixed, real, and permanent.", "Isla stared at it. Her hands were shaking, just barely, a tremor she could not control. She had done it. She had taken a piece of the unmade world and made it real. The air around her felt different, sharper, cleaner. The hillock was no longer a suggestion. It was a fact."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["Mags let out a whoop that sounded like a ship’s horn. \"Did you see that? It *settled*! It’s fixed! It’s actually fixed!\" She grabbed Isla’s arm, her grip strong and warm. \"We did it! We actually fixed a hill! I can believe it! I can finally believe it!\"", "Joss, however, did not whoop. He stepped forward, his work boots crunching on the dry grass. He looked at the hillock, then at Isla, then back at the hillock. \"Is it... solid?\" he asked.", "\"I believe so,\" Isla said, her voice still tight.", "\"Prove it,\" Joss said. He stepped onto the hillock, placed one foot on the slope, and jumped.", "It was not a graceful jump. It was a heavy, deliberate bounce, the kind a bridge-wright uses to test the integrity of a timber truss. The hillock did not sink. It did not wobble. It held. The grass bent under his boot and sprang back. Joss grinned, a wide, crooked thing that transformed his face. \"Holds weight,\" he said. \"Good. Now, Master Vasht, I assume we are not done with the day’s entertainment.\"", "Vasht had been watching, his expression unreadable. He walked to the edge of the hillock, his stick tapping the ground. \"Again,\" he said. \"With the second hillock. And this time, lie to me by a hand’s width.\"", "Isla blinked. \"Lie?\"", "\"A small lie,\" Vasht said. \"When you measure the angle, add ten degrees. Just ten. See what the land does.\"", "Isla hesitated. \"But that would be dishonest. The ink...\"", "\"The ink will show you,\" Vasht said. \"Do it. Measure the second hillock. Draw it. Seal it. And then, when you are sealing it, change the number. One degree. Two. Ten. Let’s see how the land handles a small untruth.\"", "Isla looked at the second hillock, a slightly larger mound of earth further into the Unmade. She set up the plane-table again. She measured. The numbers came out clean. She wrote them down. She drew the outline. She reached for the stamp.", "Her hand trembled. This was the test. Not of skill, but of conscience. She pressed the stamp. The ink dried.", "The hillock did not settle. It sagged.", "It sank, slowly, like a cushion losing its air. The grass drooped. The peak lowered, slumping inward, as if the earth had lost its conviction. It was a subtle change, barely an inch, but it was unmistakable. The hillock was wrong. It was lopsided, weak, and tired.", "Isla stared at it. The land had bent to her error. It had accepted the lie and shaped itself to fit it. She felt a cold pit in her stomach. It was not just a mistake. It was a corruption. She had drawn a shape that did not exist, and the world had obeyed.", "\"See,\" Vasht said, his voice quiet. \"The land does not judge you. It only listens. And if you lie, it will believe you. And then it will break.\""], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["The silence following the sag felt dense, like the air in a sealed vault. Isla stood before the lopsided hillock, her chest tight with a discomfort she could not name. She had expected the land to reject the error, to snap back into place or correct itself through some inherent stubbornness. It had not done so. Instead, it had simply accepted the falsehood and become weaker for accepting it. The lesson was clear, and it was terrifying. Precision was not merely a matter of accuracy in the abstract. It was a matter of integrity. It required caring enough to get it right, even when no one was watching to verify the work.", "Vasht watched her, his eyes soft but demanding, the pencil in his hat band catching the fading light. \"Choose,\" he said. \"Your first baseline site. You have seen the old sheets. You know the terrain. Where do we start the real work?\"", "Isla looked out at the Unmade. The pale, drifting landscape stretched before her, infinite and empty, a blank page waiting for a first word. She thought of the Salt Flat, that long, dead-flat place she had seen on the maps, a stretch of ground that did not drift, that was stable enough to hold a chain without sagging. It was thirty miles in. It was the only place that made sense.", "\"The Salt Flat,\" she said.", "Vasht nodded. \"A good choice. Flat is honest. Flat is easy to measure. We go there at first light.\" He turned and walked back toward the camp, his stick tapping a steady rhythm on the ground, a metronome for the day to end.", "That night, by the light of a small oil lamp, Isla sat at the field desk. The wind had picked up, whistling through the tent seams, but the light in the Unmade was still, still, and waiting. She opened her field-book. The pages were full of numbers, angles, and lines. She looked at the entry for the sagging hillock. The numbers were there, recorded, honest in their notation. But the land was broken.", "She took a pen and, in the margin of the page, drew a tiny triangle. It was small, just a few lines of ink, but it was perfect. The angles summed to one hundred and eighty degrees. It was a strong figure. A true shape. She looked at it for a long time, tracing the lines with her eyes, checking the closure in her mind.", "It was a promise. A small, fragile promise on a piece of paper. But it was true. And in the Unmade, truth was the only thing that mattered. She closed the book. The lamp flickered. Outside, the wind whispered, and the land waited, patient and silent, for the next line to be drawn.", "◆ Words to know: tentative – uncertain or hesitant; visceral – felt deeply in the body; unobjectionable – not likely to be criticized; integrity – the quality of being honest; metronome – a device that keeps steady time"], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "Thirty Miles of Nothing", "part": "PART TWO: THE BASELINE", "paras": ["*The Surveyor's Catechism, Sixth Saying: A compass points to somewhere, but the Pole Star points to the truth.*", "The Pale did not arrive with a sharp border; it accumulated. One moment the air held the clear, sharp blue of the Marches, and the next it thickened into a haze that smelled faintly of wet wool and old dust. Isla sat in the back of the wagon, her knees pressed against her chest, watching the world dissolve into a warm, opaque milk. The horizon had vanished, and the sky had followed, leaving only the grey, churning surface of the fog and the steady rattle of the axle.", "Ledger, the mule, had already stopped twice. The first time, Isla had thought he was shy; the second, that he was being stubborn. When he balked for the third time, refusing to step forward into the white void, she realized he was afraid. He was a sensible animal, after all, and he knew that things in the Pale did not stay where they were.", "Joss, who had been coiled in the front seat with the reins, leaned over the side. \"Hold on,\" he said, his voice calm though his hands were white-knuckled on the leather. \"The ground’s soft. It’s like walking on bread dough.\"", "Isla looked down. The wheels were sinking an inch with every rotation, the mud churning up in thick, grey ribbons. The wagon groaned, a low, wooden complaint that vibrated through her bones. She felt a sudden, sharp vertigo, as if the vehicle were not on the ground at all, but suspended in the air by nothing more than habit.", "\"Joss,\" she said. \"The tent is still behind us. We’re losing the line.\"", "He grinned, a tight, nervous thing. \"I figured that. Tying a rope is the engineering solution.\" He hopped down, grabbed a coil of hemp from the pile, and lashed one end to the wagon’s rear axle and the other to the wooden pole of their shelter. \"Now we’re a single, long, unwieldy shape. It’s elegant, in a way.\"", "Isla watched the knot. It was a bowline, tied with a speed that belied his clumsy reputation. She respected it. The rope stretched taut, linking the two parts of their expedition into a single, fragile organism. Ledger snorted, sensing the new tension, and took a step. Then another. The fog swallowed them, inch by inch, and the world became nothing but the sound of their own breathing and the tick of the wheels."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["By midday, the compass had given up. Isla held the brass sighting compass up to the light, but the needle wandered like a drunk in a market, spinning slowly to the left, then to the right, never settling. It was not broken. She had checked the jewel, the suspension, the balance. It was simply that the land itself was not fixed. The magnetic field here was a suggestion, not a law.", "Vasht sat on a bale of straw, his hat tipped over his eyes. He did not look up when she showed him the needle. \"Magnetic declination,\" he said, as if reciting a menu. \"The compass points to magnetic north. The star points to true north. In fixed land, the difference is a constant. Here, the constant is a liar.\"", "\"Then how do we steer?\" Isla asked.", "\"Geometry,\" Vasht said. He tapped the ground with his stick. \"The sun is a fixed point, Isla. It does not drift. It does not care about our loose hills. Drive a stick into the ground. Watch its shadow. Mark the tip of the shadow every ten minutes. The line that bisects the arc is true north.\"", "Isla drove the stake in. It was a simple task, but in the Pale, simple tasks felt like negotiations. She waited. The shadow moved slowly, a black finger creeping across the pale dust. She marked it with a scratch. Ten minutes. Another scratch. The sun was high, but the haze diffused its light, turning the shadows soft and indistinct. She had to be meticulous. If she misjudged the tip by a fraction of an inch, her line would be wrong, and in the Unmade, wrong was dangerous.", "When she finished, she drew the bisector with her pencil. It was a straight line, sharp and honest. She looked at Vasht, who was finally removing his hat. He looked at the line, then at the sky, then at her. He said nothing. He did not need to. He simply nodded, once, and pointed toward the east, where the shadow had been longest.", "Dusk came quickly, a bruise spreading across the grey. The stars emerged, one by one, piercing the haze like pins through cloth. Isla looked up. The Pole Star was there, steady, bright, and utterly indifferent to the chaos below. She aligned her staff with it, feeling a sudden, fierce gratitude for the cold, hard fact of it. It was the only thing in the world that had not moved since she was born."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["Mags was counting paces. It was her way of measuring, her private arithmetic that ran in her head like a metronome. *One, two, three, four.* She walked beside the wagon, her red shoes kicking up small clods of mud, her blue scarf snapping in the wind. She was fast, light, and utterly convinced of her own accuracy.", "\"Two hundred and forty paces to the last tree,\" she announced to no one in particular. \"That’s about a quarter mile. We’re making good time.\"", "Isla checked her notes. They had been walking for three hours. The pace count should have been consistent. But something was wrong. The trail they had cut through the grass was not straight. It was a gentle, sweeping curve. Isla pulled out the compass, then the field-book, then the star chart. She looked at the trail, then at the compass, then at the stars.", "The compass said they were heading northeast. The stars said they were heading east. Mags said they had gone straight.", "\"They disagree,\" Isla said, her voice flat.", "Joss leaned over the side of the wagon. \"That’s usually a problem with the compass.\"", "\"The compass is a liar,\" Isla said. \"The paces are a lie. I was watching the grass. It’s moving. The hill we passed an hour ago is now behind us. We are circling.\"", "Mags stopped. She looked at the trail behind them, a faint, winding line in the tall, pale grass. The hill, a low, rounded bump of earth, was indeed visible in the distance, but it was not where it had been. It had drifted.", "\"So,\" Mags said, her voice very quiet. \"Which do we trust?\"", "Isla looked at the three sources of information. The compass, twitching and unreliable. The paces, measured on ground that was itself in motion. And the star, hanging high and still, a point of light that could not be pushed, pulled, or drifted.", "\"The star,\" Isla said."], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["\"The star is far,\" Isla said, tracing the line in the air. \"It is so far that nothing we can do, nothing the land can do, matters to it. It is a fixed point. The compass is local. It is affected by the iron in the ground, the drift of the earth, the chaos of the Unmade. The paces are measured on a surface that is not fixed. If the ground moves, the distance changes. But the star does not move. It is the only honest witness.\"", "Vasht, who had been cleaning his spectacles, looked up. A small smile played at the corner of his mouth. He said nothing, but his eyes were bright. He was enjoying this. He was enjoying the fact that his student was thinking in three dimensions, not just two.", "Joss scratched his head, his sandy hair falling into his eyes. \"So the thing furthest away is the one that doesn’t lie.\"", "\"Essentially,\" Isla said.", "\"But it’s cold,\" Joss added, wrapping his arms around his chest. \"And it’s a long way up. I prefer things I can kick.\"", "\"You can kick the ground,\" Vasht said, \"and the ground will kick you back. It is loose, Joss. It is not a foundation. It is a tide. You must measure against the sky, not the earth.\"", "Isla pulled out her sighting compass, but she did not use the needle. Instead, she aligned the brass sighting arm with the Pole Star. The star was a small, bright point, steady and unwavering. She locked the arm in place. The instrument now held a line of truth, a vector that pointed along the axis on which the whole sky turns. It was a line that could not be argued with.", "She looked at Mags. \"Reset the count. We are changing course. We are going to the star, Mags, not to the ground.\"", "Mags nodded. She untied the rope that held the wagon to the tent, though the wagon was already moving. She began to count again, but this time, her eyes were fixed on the sky."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["The correction was not a dramatic turn. It was a subtle shift, a gentle realignment of the wagon’s wheels, a slight adjustment of the rope’s tension. But it was enough. The trail straightened. The drifting hill fell away, no longer a threat but a background detail, fading into the pale mist like a smudge of graphite under a ruler.", "Dawn broke not with light, but with a change in the texture of the air. The haze thinned, revealing a landscape that was not drifting. It was flat. Impossibly, beautifully flat. The Salt Flat lay before them, a pale sheet of glass stretching out to the edge of the world. There were no hills, no trees, no shadows. Just a smooth, white expanse, reflecting the first grey light of the morning.", "Isla stepped out of the wagon. The ground was hard, compacted salt, crunching under her boots with a sound like dry paper tearing. She walked to the edge of the haze, where the flat began. She could see the horizon now, a thin, sharp line where the white met the pale sky. It was the most beautiful thing she had ever seen. Not because it was grand, but because it was honest. It did not pretend to be something else. It was flat, and it stayed flat. It was a promise kept.", "She felt a strange lightness in her chest, a sense of rightness that she had not felt since she had drawn her first true line. This was what she was for. This was what the numbers were for. To find the truth in a world that was constantly trying to hide it.", "Vasht came up behind her. He did not speak. He simply stood beside her, looking out at the white expanse. For a moment, they were just two people, standing at the edge of a blank sheet, ready to write the first word.", "◆ Words to know: opaque – not able to be seen through; meticulous – showing great attention to detail; indifferent – not feeling or showing interest; unwavering – steady and not shaking"], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "The Baseline", "part": "PART TWO: THE BASELINE", "paras": ["*The Surveyor's Catechism, Seventh Saying: Everything is built on one line. Get the line right.*", "The Salt Flat did not have a horizon so much as an ending. It was a white void, seamless and terrifyingly empty, stretching out in every direction until the sky and the earth merged into a single, pale grey smear. Isla stood in the center of it, her boots sinking slightly into the crusted surface, and felt small in a way that had nothing to do with height and everything to do with scale.", "\"Stop staring,\" Vasht said. He was adjusting the leg of his tripod, his grey coat heavy with dust, and he did not look up. \"Staring is for tourists. We are here to make a line. A line is the only thing that matters here. Everything else is a calculation.\"", "\"A calculation,\" Mags repeated, tying the laces of her red canvas shoes with the focused intensity of a surgeon. \"So we’re measuring the flat.\"", "\"We are measuring the truth of the flat,\" Vasht corrected. \"The baseline is the spine of the survey. If it is wrong, everything built upon it is a lie. If it is right, it becomes the standard by which we judge every other distance in the Unmade. It must be measured with a precision that makes the devil weep.\"", "Joss was already unpacking the equipment. He moved with the brisk, purposeful energy of a man who preferred building things to explaining them. He pulled a coil of steel chain from the wagon, the links clinking softly in the thin air. \"Spring balance,\" he said, holding up a brass device with a coiled spring inside. \"Holds the tension constant. No matter how hard you pull, the spring gives, and the weight stays the same. That’s how we stop the chain from sagging.\"", "Isla watched him set the frame up. It was a simple tripod, but the mechanism at the top was elegant. A hook, a spring, a weight. \"It’s like a brake on a wagon,\" she said. \"You apply pressure, and it releases exactly enough to keep the wheel turning smoothly.\"", "Joss grinned, a quick, crinkling expression. \"Exactly. Except the wheel is the ground, and we’re trying to make sure it doesn’t move.\"", "Vasht pointed to the first peg, a sharp steel spike driven into the salt. \"Mark the zero. Then we go. One hundred links at a time. No shortcuts. No estimates. We are here to be scrupulous.\"", "Isla took the field-book from her coat pocket. The paper was crisp, the lines ruled in pale blue ink. She uncapped her pen. \"Zero,\" she said, writing the time and the temperature. \"Ready.\"", "The wind picked up, whispering across the flat. It sounded like dry parchment sliding over a drafting table. Isla steadied her hand, feeling the salt crystals crunch under her boots, and waited for the first link to be pulled taut."], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["The rhythm of the work settled into a mechanical pulse that beat through the thin, cold air, a steady drumbeat of *pull, stretch, mark*. The chain sang a high, thin note as it was drawn taut, a sound like a bow drawn across a string, while Isla counted the links, her eyes scanning the steel, her pen scratching on the page. One, two, three... fifty. The number felt heavy in her mouth.", "\"Chain!\" Joss called, his voice crisp and cutting through the wind.", "Mags, who had been carrying the chain over her shoulder, adjusted her grip. Her deep-brown skin was flushed with the cold, her short black twists tied back with a bright blue scarf that snapped in the breeze. \"Coming,\" she said. She walked the chain forward, her red shoes crunching on the salt crust.", "Isla watched the chain stretch out, a straight line of steel against the white ground. She recorded the reading. \"Mark!\" she called.", "Joss drove the peg into the salt with a sharp, decisive thump. *Thud.* The sound echoed faintly, then died. \"Tally!\"", "Isla wrote the number. Her hand was steady, though her fingers were numb inside her gloves. The sun was low, casting long, distorted shadows across the flat. The glare was intense, a white fire that made her eyes water. She squinted, blinking rapidly to keep the tears from blurring her vision.", "\"Break time?\" Mags asked, leaning on the chain. Her breath came out in small, white clouds.", "\"No,\" Vasht said. He was walking ahead, his walking stick tapping the ground. \"We have most of a mile to go. And the sun is not done with us.\"", "Joss wiped his brow with the back of his hand. \"I like the sun,\" he said, with a grin that was more exhaustion than joy. \"It’s warm.\"", "\"It’s a furnace,\" Isla said. \"And we are the coal.\"", "Mags laughed, a short, sharp sound. \"I prefer the furnace. At least it’s honest.\"", "They kept moving. The chain stretched, the pegs went in, the numbers were written. The landscape did not change. It was a white void, endless and indifferent. But the line grew, a thin thread of steel connecting the known to the unknown. Isla felt a strange sense of satisfaction in the repetition. It was not exciting, but it was solid. It was real.", "\"Another hundred,\" Joss said, his voice slightly hoarse.", "Isla nodded. \"Ready.\"", "The wind picked up again, swirling dust around their boots. Isla tightened her grip on the pen. The line was holding."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["The noon heat had altered the terms of the engagement. The salt, which had been crisp and cold under their boots until an hour ago, now radiated a dry, intense warmth that seemed to rise from the ground and seep directly into their bones. The air shimmered above the white crust, creating a heat haze that made the distant pegs wobble with the precarious instability of a candle flame in a draft.", "Vasht stopped. He held up a hand, and the chain slackened against the ground with a dull, metallic sigh. \"Thermometer,\" he said, his voice flat and commanding.", "Isla pulled the small brass instrument from her coat pocket. The mercury column rose, trembling slightly before it stopped. She read the number. \"Thirty-two degrees.\"", "\"Record it,\" Vasht said. \"And apply the correction.\"", "Isla frowned, tapping the pen against her thigh. \"The chain is steel. It expands when it is hot. That means it is longer than it should be. If we do not correct for it, we will be measuring too short.\"", "\"Precisely,\" Vasht said. \"A careless number is a lie. And a lie, in this field, bends the land. We do not want to bend the land. We want to hold it.\"", "Mags, who had been sitting on a rock, looked up, her blue scarf bright against the pale dust. \"So we add a little?\"", "\"Add,\" Isla said. \"A h
