. She verified the declination correction and the baseline projection. Then, with a scrutiny that felt almost surgical, she checked Isla’s work itself.", "It took the better part of the day. The villagers brought food, simple things: bread, cheese, and cold porridge that Mags had made the night before. They sat around the table, watching. They did not speak, but they were present, their stillness a steady force in the room. Their presence anchored the heavy barge in a strong current, a good weight that held the room together. Isla felt the trust in the air. It was not blind. It was earned. It was the trust of people who had been lost for forty-four years, and who were watching to see if this girl would make the same mistake again.", "Sera helped with the calculations. She used her silver rule to draw the new traverse on a large sheet of paper, spreading the error across the legs in a process she called the honest sharing of a mistake. The numbers balanced out with a precision that felt like a well-tuned instrument. The lines closed. The closure was not perfect, but it was true.", "When the schoolmistress finally nodded, the room exhaled. The relief was sharp, mixed with a quiet respect that settled into the air. Isla looked at the sheet, at the new lines, at the corrected traverse. The work was not as clean as she would have liked. It was not as fast. But it was honest. And for the first time in two days, she felt like she could breathe."], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["At dawn, the traverse closed.", "The total error was four feet over forty-one miles. It was a small number, yet a true one. Isla stood at the table, her hands resting on the edge, and looked at the final figure. A perfect closure was a zero, a myth she had chased through every textbook in the Guild. This was a number she could stand behind.", "Master Vasht, who had been brought forward in the wagon, sat in the corner, his ankle propped up on a pillow. He had been watching the work, his grey eyes sharp and focused. He picked up the slate and read the figures. He read them twice. Then he looked up.", "\"Four feet,\" he said. \"Over forty-one miles. That is a closure of one in fifty thousand.\"", "He looked at Isla, and for a moment, his face was unreadable. Then he smiled, a small, rare smile that reached his eyes. \"That is the best closure I have ever seen. In thirty years of practice, I have never seen a traverse close so tightly, with so many variables, under such difficult conditions.\"", "Isla felt a wave of pride, but it was tempered by humility. \"It is only so good because it was checked by eleven people,\" she said. \"Mags checked the arithmetic. Sera checked the geometry. The schoolmistress checked the logic. Joss checked the field notes. And I checked my own hand. No one of us was perfect. But together, we were true.\"", "Vasht nodded. He leaned forward, his walking stick resting on his knee. \"That is exactly why,\" he said. \"A single surveyor can make a mistake. But a team, a true team, with honest work and shared responsibility, can build a line that holds. That is the secret of the Guild, Isla. Not the ink. Not the instruments. The people. The care. The willingness to be checked.\"", "He looked at the villagers, at the apprentices, at the sheet on the table. \"You have fixed the land,\" he said. \"But more importantly, you have fixed the trust. And that is a harder thing to do.\"", "Isla looked at the sheet, at the new lines, at the corrected traverse. It was not just a map. It was a promise. And for the first time, she believed she could keep it.", "◆ Words to know: discrepancy – a difference or inconsistency between two things; meticulous – showing great attention to detail; transposition – the act of moving something to a different place; surgical – extremely precise and careful; tempered – moderated or softened by another influence"], "img": "img/p100.jpg"}, {"no": 101, "ch": 21, "ctitle": "The Benchmark in Vell", "part": "PART FIVE: THE HONEST LINE", "paras": ["*The Surveyor's Catechism, Twenty-First Saying: The proof is always in the place where nobody has looked.*", "The numbers in the field-book were honest. They were also useless. Isla stared at the column of corrections, the small, precise adjustments that had allowed the traverse to close over forty-one miles of drifting country. It was a triumph of teamwork, of patience, of Mags checking the arithmetic and Sera checking the geometry. But as she traced the final line with her ink-stained finger, a cold, tenuous feeling settled in her stomach, the kind that comes from sensing a flaw in a load-bearing wall.", "The network hung from a single point. Every angle, every distance, every fixed hill and held river in the Unmade, and indeed in the rest of the kingdom, derived its position from the brass disc set into the floor of the Atlas Room in Vell. If that disc was wrong, then the whole map was lying. Not with malice, not with haste, but with a quiet, structural error that had been baked into the ink for forty-four years.", "She looked at the marginal note she had copied from Hester Corrin’s old sheet. It was tiny, written in a firm, slanted hand. *Benchmark appears two links low. Check Vell.*", "Isla had dismissed it as a grievance, a bitter afterthought from a surveyor who had been blamed for a disaster. Now, looking at the closure of her own perfect traverse, she realized it was not a grievance. It was a diagnosis.", "She turned to the table where Sera Quillon was packing her instruments. Sera’s movements were brisk, efficient, the movements of a woman who trusted her own speed to solve problems before they had a chance to form.", "\"Sera,\" Isla said. \"I need to go to Vell.\"", "Sera looked up, her black bob catching the firelight. \"We have ten days until Midsummer. The Queen expects the sheet.\"", "\"Not the sheet. The truth of the sheet.\" Isla held up the page with Hester’s note. \"I think we are building on a crooked foundation. I need to check the benchmark.\"", "Sera stared at the note, then at Isla. Her expression did not change, but her hand stopped moving. \"You think the Guild’s primary reference is wrong?\"", "\"I think,\" Isla said, \"that a hair’s difference, over forty-four years, is enough to make a valley slide off the map. I think Hester was right. And I think we need to go and see.\""], "img": "img/p101.jpg"}, {"no": 102, "ch": 21, "ctitle": "", "part": "", "paras": ["The ride to Vell took all night. They took a detour through the Marches to keep the route unwatched, knowing that the Chancellor’s men had their eyes on every road leading to the capital. Isla sat on a small, stubborn pony that kicked at the grass with the distinct irritation of a creature that knew it was being used. Sera rode a tall, grey mare that moved with a fluid, expensive grace.", "They rode in silence for the first hour. The stars were bright above them, the Pole Star steady and fixed, a point of light that did not care about the errors of men or the ambitions of chancellors. Isla felt the satchel press hard against her chest, where she had tucked the copy of Hester’s note. It felt heavier than paper.", "\"You don't have to do this,\" Sera said. Her voice was quiet, stripped of its usual sharp, competitive edge. \"If the benchmark is wrong, it is a Guild issue. You will be punished for questioning the authority of the Atlas.\"", "\"If the benchmark is wrong, the map is a lie,\" Isla said. \"And I cannot seal a lie. I won't.\"", "Sera was quiet for a long time. The mare’s hooves clicked on the hard-packed earth of the road. \"I cut the corner in the northern valley,\" Sera said, her eyes fixed on the dark ahead. \"I estimated the fall of the water. I told myself it was a small error. A shortcut.\"", "Isla turned her head. In the moonlight, Sera’s face was pale, the silver rule in her pocket glinting. \"It was a flood,\" Isla said. \"It was a disaster.\"", "\"Yes,\" Sera said. \"And I was afraid.\" She looked at Isla, and for the first time, the rival was gone. There was only a young woman, tired and honest. \"I have always been quick, Isla. Fast at the sightglass, fast at the arithmetic. People called me brilliant. But I am not careful. I am not... steady.\"", "\"Speed is a talent,\" Isla said. \"Honesty is a discipline. One can have both. You just have to choose which one to trust when it gets hard.\"", "Sera looked away, back to the road. She did not argue. She did not defend her speed. She simply tightened her grip on the reins and urged the horse forward, as if the act of moving was a way to process the truth of her own failure."], "img": "img/p102.jpg"}, {"no": 103, "ch": 21, "ctitle": "", "part": "", "paras": ["The Meridian Guild at night was a different building. By day, it was a hub of activity, a place of chalk dust and heated debates. At night, it was a vault, silent and deep. The night porter, a heavy-set man named Thorne who had a face like a closed door, let them in without a word. He knew Isla. He knew what she was, and he knew what she was looking for. He led them through the dark corridors, his lantern swinging gently, until they reached the double doors of the Atlas Room.", "The room was vast and hushed. The sheets of the Atlas hung on their brass rails, pale and still in the darkness. Isla felt the presence of the paper in the air, the accumulated truth of the kingdom. She found the sightglass and the steel tape in the instrument locker, the keys cold in her hand.", "They set up the instrument in the center of the room, directly above the brass disc. The disc was small, no larger than a dinner plate, embedded in the polished stone floor. It was the point from which all of Aster was measured. Isla attached the plumb bob to the sightglass and adjusted the screw until the line was perfectly vertical.", "Sera held the steel tape. They worked in silence, the only sound the soft click of the fine-adjustment screw and the rustle of the tape. Isla read the angles to the four old reference towers outside the windows, the tall, stone spires that had stood for centuries. She wrote the numbers in the field-book, her hand steady, her breath held.", "When she finished, she looked at the numbers. They did not add up. Not to a zero, not to a small, acceptable error. They added up to a discrepancy that was impossible.", "\"The disc is off,\" Isla said. Her voice was flat. \"It has moved. Or the towers have moved. But the towers are old stone. They don't move. The disc has shifted.\"", "Sera looked at the tape, then at the disc. \"By how much?\"", "Isla did the math in her head, the numbers dancing before her eyes. \"Two links. Exactly two links. Hester was right.\""], "img": "img/p103.jpg"}, {"no": 104, "ch": 21, "ctitle": "", "part": "", "paras": ["\"Two links,\" Sera whispered. \"That is a large error.\"", "\"It is a small error,\" Isla corrected, tapping the page. \"But it is a systematic one. It affects every sheet drawn from this point. It has been there for forty-four years.\"", "They needed proof, and proof lived in the records. The Guild kept its inspection logs in a locked drawer in the master’s office, a room that smelled of old paper and lamp oil. Isla produced a thin piece of wire, a skill she had learned from her father, who had spent his life making chains and unlocking them.", "The drawer opened with a soft click. Inside lay a leather-bound book, its pages thick and yellowed. Isla flipped through the years, her fingers moving quickly until she found the entry for the survey of Ennis Vale, forty-four years ago. The inspector’s note was brief, dry, and damning. *Closing error beyond tolerance. Sheet rejected. Benchmark verified.*", "Isla frowned at the phrase. \"Benchmark verified.\" She looked at the next page. There was a log of maintenance. *Reset of primary disc due to foundation settlement. Date: two years prior to survey.*", "\"It was reset,\" Isla said. \"And then they checked the new position against the old records. They thought the old records were wrong. They thought Hester was wrong. But the building had settled. The disc had moved. And they blamed the surveyor.\"", "A cough sounded behind them.", "Isla spun around to find Dorian Pike standing in the doorway, his navy coat hanging off his shoulders, his face pale in the lantern light. He was supposed to be in the dormitory, sleeping.", "\"What are you doing?\" he asked, his voice shaky.", "\"Checking the benchmark,\" Isla said.", "Dorian looked at the open drawer, then at the book, then at the two of them. He was young, smart, and wealthy, with a future mapped out for him, a place in the Guild, and a life of comfort. He looked at Isla, and something in his face shifted. It was not respect, exactly. It was a sudden, sharp recognition of what he was standing in.", "\"I saw nothing,\" he said. \"I am going back to my room. Goodnight.\"", "He turned and left. The door closed softly behind him."], "img": "img/p104.jpg"}, {"no": 105, "ch": 21, "ctitle": "", "part": "", "paras": ["They copied the relevant pages onto a fresh sheet of guild paper, using a small pot of iron gall ink and a quill that had been cut from a goose wing. The strokes were deliberate, the script cramped but legible, a mirror of the original’s dry, damning syntax. Thorne the porter stood by the table, his face a mask of polite neutrality, though his fingers drummed a restless rhythm on the edge of the wood. When the last letter was dry, he took the pen, dipped it, and signed the bottom of the sheet. His hand was large and clumsy, the signature sprawling across the margin like a ship’s anchor dragging through sand.", "\"It is real,\" Sera said. She was looking at the copy, her fingers tracing the ink before it fully set. \"It’s real, isn’t it? She was right. Hester Corrin.\"", "\"She was right,\" Isla said, folding the paper with the care one might use for a finished chart. \"Now we have to get it to the Queen.\"", "They rode back in the dawn, the sky turning a pale, promising pink that matched the color of the wax seals on the Guild’s official dispatches. The satchel with the proof rode between them, heavy with the density of truth. They had ten days to Midsummer. Ten days to close the traverse, to build the bridge, to seal the sheet. And now, to clear the name of a woman who had been dead for twenty years.", "Isla looked at the horizon, where the sun was just beginning to break over the ridge of Cairn Fell. The land ahead was loose, waiting to be fixed. But for the first time, she did not feel the pressure of the deadline. She felt the clarity of the line.", "\"It is a long way to go,\" Sera said, her voice stripped of its usual briskness.", "\"Yes,\" Isla said. \"But we have the truth. And that is a much better map.\"", "◆ Words to know: tenuous – weak, thin, or lacking in strength; diagnosis – the identification of a problem or condition; discrepancy – a difference or inconsistency between things; systematic – done according to a fixed plan or procedure; deliberate – done intentionally and with careful purpose"], "img": "img/p105.jpg"}, {"no": 106, "ch": 22, "ctitle": "Gantry Gorge", "part": "PART FIVE: THE HONEST LINE", "paras": ["*The Surveyor's Catechism, Twenty-Second Saying: A bridge is a promise made out of triangles.*", "The gap was three hundred feet of sheer grey rock, and it had the audacity to be in the way.", "Isla stood on the lip of Gantry Gorge, her boots planted firmly on the loose scree, and looked down. The Wend river churned far below, a dark, muscular thing that had wandered from its bed twice that week and left no trace of where it had been. It was the final unclosed leg of the traverse, the last stubborn thread keeping the whole survey from snapping shut. If they could not cross, the numbers would not balance. The closing error would remain, and the Unmade would stay loose, drifting like a ship without a rudder.", "\"Three hundred feet,\" Joss said, standing beside her. He did not look down. He was looking at the far bank, his pale freckled face tight with concentration, a carpenter’s pencil tucked behind his ear. \"Maybe three hundred and fifty. The fog plays with your eyes.\"", "\"Then we measure,\" Isla said.", "She unrolled the steel tape, and Mags, with the grace of a gymnast who had never been asked to do anything graceful, anchored the zero mark on a flat outcrop. Joss crossed the gorge on a precarious rope swing, his boots skidding on the wet stone, until he reached the opposite rim. He held the tape taut, his face a mask of professional annoyance at the wind, and called out the figure.", "\"Four hundred and fifty links,\" he shouted, his voice thin in the cold air. \"Allowing for sag and the temperature of this wretched morning.\"", "Isla wrote it down. She checked the chronometer. She checked the angle of the sun. Then she took out a stub of charcoal and the back of a discarded map of the Western Marches, and began to sketch. Her hand moved with the steady, rhythmic certainty that had saved the survey more times than she could count. She drew the two abutments, the span, and then, with a quick, decisive stroke, the triangles.", "\"A timber truss,\" she said, holding the paper up to the light. \"We build the falsework in the river, raise the truss from both banks, and lock the center. No arch. Arch thrust will push the abutments apart and drop us into the water.\"", "Joss grinned, a wide, lopsided expression that crinkled the corners of his eyes. \"Triangles,\" he said. \"Yes. Strong shapes. I can do strong shapes.\""], "img": "img/p106.jpg"}, {"no": 107, "ch": 22, "ctitle": "", "part": "", "paras": ["The villagers of Ennis Vale did not ask questions. They simply appeared, moving with the steady, relentless pressure of a rising tide, bringing carts, axes, and a quiet, collective determination that seemed to vibrate in the cold air. They had waited forty-four years for something to happen, and they were not about to let a river stop it.", "Joss took charge of the timber. He stood on a boulder in the shallows, shouting directions with the enthusiasm of a man who had been waiting for an excuse to break something. \"Oak, not pine! Pine splinters under load. We need compression members that can take the burden of a wagon, a horse, and a very angry mule!\"", "Mags organized the supply line. She tied a rope to a post, then to a cart, then to her own pack, creating a pulley system of such elegant simplicity that Isla felt a pang of professional jealousy. Beams the size of tree trunks slid down the slope, rolling in the mud, and were caught by hands that looked like they had been made of rope.", "Perrin Ashdown, tiny and wiry in his patched green coat, climbed the boulder where Joss stood. He held a rope end with both hands, his knuckles white, his face set in a grim line of determination.", "\"I am holding,\" he announced, his voice thin but steady. \"I will hold until the end.\"", "\"You are seventy-eight years old,\" Joss said, not unkindly.", "\"And you are a fool if you think I am letting you do all the work,\" Perrin replied. He tightened his grip. \"I held the chain when the bridge fell in '42. I can hold a rope.\"", "Isla watched him, and felt a strange, warm pressure behind her eyes. This was what precision was for. Not just to fix the land, but to let people stand on it. To let them hold on. She picked up her level, set it on the tripod, and began to take readings for the falsework, her voice calm and measured as she called out the numbers to Mags, who scribbled them in the field-book with a speed that bordered on manic.", "The sun was setting, painting the water in shades of copper and blood. The truss was half-built, a skeletal bird crouching over the river, waiting for its wings."], "img": "img/p107.jpg"}, {"no": 108, "ch": 22, "ctitle": "", "part": "", "paras": ["The rain arrived from the high fells not as drops but as a grey, silent sheet, turning the world into a blur of water and stone. It did not fall; it hung, a cold, misty curtain that soaked through their coats and into their bones. The river, which had been a churning brown ribbon, began to swell, its edges creeping up the banks, swallowing the stones where they had been working that morning.", "Isla stood in the rain, her sightglass fogged, her hair plastered to her face. She held the staff, a long wooden pole with painted markings, and took readings. The water was rising. Not quickly, not dramatically, but with a steady, inexorable logic that was more terrifying than any sudden flood.", "\"Four feet,\" she called out, her voice thin in the wind.", "Mags, huddled under a tarpaulin, wrote it down. \"Time?\"", "\"Ten past six.\"", "\"Five feet,\" Isla said, an hour later. Her hands were shaking, not from the cold, but from the effort of keeping her eye steady on the bubble in the level. The number was climbing. The falsework, the wooden scaffolding they had built in the river to support the truss, was now submerged to the topmost plank. If the water rose another foot, it would push against the timber, and the truss, still incomplete, would tilt and snap.", "\"We have to clear the falsework,\" Joss shouted over the roar of the water. He was on the far bank, his boots slipping on the wet stone. \"We can’t fight the river! We have to let it pass through!\"", "\"Then we lose the truss,\" Isla said. Her voice was flat, devoid of hope. \"If we remove the support, the center drops.\"", "\"No,\" Joss said. \"We don't remove it. We lighten it. We take the load off the center members first. We let the river push the falsework out of the way before it breaks it.\"", "It was a mad idea. It was also, Isla realized, the only idea that respected the physics of the situation. The river was a force that could not be stopped, only directed. They had to yield, or break."], "img": "img/p108.jpg"}, {"no": 109, "ch": 22, "ctitle": "", "part": "", "paras": ["The night was cold and sharp, the rain replaced by a biting wind that cut through their cloaks. The river was high, a black, muscular torrent that roared in the dark, a constant, threatening presence that seemed to be pressing against the very stones of the gorge. The falsework was gone, swept away in a rush of splintered wood and foam, but the truss remained, a skeletal framework of oak and pine, half-finished, hanging over the abyss.", "The last member, the keystone equivalent, the central tie that would lock the two halves of the truss together, was waiting on the bank. It was a massive beam, twenty feet long, heavy as a cannonball. Joss and the miller’s sons, two broad-shouldered men with faces like hammers, set up the block and tackle. They hauled the beam into position, inch by inch, their muscles straining, their breath coming in white puffs in the cold air.", "Isla and Mags stood on the bank, calling out the river height. Every ten minutes, Isla took a reading. The number was climbing, but slowly. The water was at eight feet. Nine feet. Ten feet. The truss was at its highest point, the center just above the water, a fragile line of wood against the black chasm.", "\"It’s slipping,\" Joss shouted. He was on the truss, his boots on the wet timber, his face pale with exertion. \"The tackle is slipping! We need more hands!\"", "Perrin was there. He was holding the rope, his arms trembling, his face a mask of pain and determination. He was seventy-eight years old, and he was holding the tension of the line with his bare hands. Isla watched him, and felt a surge of pride so intense it made her dizzy. This was what they were for. Not just the numbers, not just the maps, but the hands that held the line.", "The beam dropped. It was not a gentle settling; it was a sudden, heavy thud, a deep, wooden knock that vibrated through the rock, through the water, through the bones of everyone who was there. The truss was locked. The bridge was whole."], "img": "img/p109.jpg"}, {"no": 110, "ch": 22, "ctitle": "", "part": "", "paras": ["Dawn broke over the gorge in a wash of pale gold, the mist burning off the water in thin, curling ribbons. The bridge stood, a taut line of timber against the grey sky. The river roared beneath it, a wild, untamed thing that had been checked. Not by force. But by the careful, patient work of hands that had measured twice and built once.", "Joss insisted on a load test.", "It was a tradition, he said, a bridge-wright’s superstition, but a necessary one. He loaded a wagon with stones, heavy, dense, unyielding stones, and walked it across. The wagon groaned. The wheels crunched on the timber. The horses whinnied in protest. Ledger, the mule, was blindfolded and furious. He stamped his hooves, refusing to look at the water below.", "Joss walked the wagon across at a crawl. His hands were on the reins. His face was set in a grim line of concentration. Isla watched the truss, her eyes tracing the triangles, the tension members, the compression chords. She listened for the creak. The snap. The groan of stressed wood. There was nothing. The bridge did not even creak. It held, steady and sure. A promise made out of triangles. A line that had been held true.", "When the wagon reached the far bank, Joss turned and looked at her. His face was flushed, not from the cold, but from the effort. From the pride of a job well done. Isla crossed the bridge. Her boots were silent on the timber. She kissed him on the cheek. It was quick. Light. A small, honest gesture that said more than any words could.", "Joss turned the color of a beet. His freckles disappeared under a flush of deep red. He looked at the bridge. Then at her. Then at the river. And said, very quietly, \"It holds.\"", "\"Yes,\" Isla said. \"It holds.\"", "◆ Words to know: audacity – boldness or nerve; precarious – dangerously unstable; inexorable – impossible to stop or change; skeletal – consisting only of the basic framework; tension – state of being stretched tight"], "img": "img/p110.jpg"}, {"no": 111, "ch": 23, "ctitle": "The Long Night of Closing", "part": "PART FIVE: THE HONEST LINE", "paras": ["*The Surveyor's Catechism, Twenty-Third Saying: The last reading is the same as the first. Give it all your attention.*", "The sun hung low and orange over the far cliff, a bruised coin pressed against the sky. Isla set the tripod legs into the packed earth, checking the level bubble until it shuddered into the center. The sightglass stood ready, its brass face dark in the dying light. This was the final station, the last angle, the reading that would close the traverse and tell them if the whole thing had held true, or if it had drifted into nonsense.", "Vasht sat in his wheeled chair, wrapped in a grey wool blanket that smelled of pine resin and old paper. His bad ankle was propped on a wedge of wood, the leg still stiff, but his eyes were sharp, grey, and utterly unblinking. He watched her adjust the fine screws.", "\"Your hands are shaking,\" he said. His voice was quiet, barely louder than the wind moving through the dry grass.", "Isla looked down. Her fingers were indeed trembling, a fine, rapid vibration that made the brass sight vibrate with it. \"I have been shaking for an hour,\" she admitted. \"It is the heft of the last one. It feels heavy.\"", "\"Heft is a misnomer,\" Vasht said. \"It is simply attention. Do not read it as if it is the last. Read it as if it is the first. As if you have never seen this view before, and you are merely learning where the mountain sits in relation to the river. The numbers do not care about your anxiety. They only care about the angle.\"", "Isla took a breath, let it out, and forced her shoulders to drop. She looked through the glass. The world resolved into a line. She locked the tangent screw. She read the circle. She wrote it down. She read it again. She wrote it down. The numbers agreed. They were honest.", "\"Three readings,\" she said, her voice steady. \"Two seconds apart. It holds.\"", "Vasht nodded slowly. He did not smile, but the tension in his jaw eased, a small, visible release of a knot held tight for forty days. \"Then we go inside,\" he said. \"The numbers are waiting, and they are very patient, but they are also very cold.\"", "Isla disconnected the plumb bob and coiled the cord. Her fingers remembered the motion, the muscle memory of a hundred nights. She did not look at the river anymore. She looked at the notebook. The work was done. The thinking was beginning."], "img": "img/p111.jpg"}, {"no": 112, "ch": 23, "ctitle": "", "part": "", "paras": ["The mill-house was warm, smelling of damp stone, woodsmoke, and the strong, yeasty scent of Mags’s emergency porridge. Candles guttered on the long table, their flames dancing in the drafts that slipped under the door. Eleven people crowded around the slates and the open field-books. The air was thick with the smell of ink and the quiet, desperate energy of people who had been awake for three days.", "Sera Quillon sat at the head of the table, her plum-purple coat crisp despite the dust. She was working the northern legs, her silver rule tapping a steady rhythm on the slate. Mags Okoro, with her blue scarf knotted tight, was on the southern stretch, her mental arithmetic a blur of speed and precision. Wynne, the schoolmistress from Ennis Vale, handled the eastern section, her pen moving with a careful, deliberate slowness that surprised everyone.", "\"Leg seven,\" Mags called out, her voice bright with the adrenaline of a puzzle solved. \"Closing on the western baseline. Check your convergence, Sera. I think you are missing the correction for the magnetic declination again.\"", "Sera froze. Her pen hovered over the slate. \"I applied the standard guild table,\" she said, her voice tight.", "\"Standard table is for Vell,\" Mags said, shrugging. \"This is the Marches. The earth is different here. I checked the Pole Star twice. You are off by a tenth of a degree.\"", "Isla watched them. She did not speak. She watched Sera’s face, the flush rising in her pale cheeks, the way her hand tightened on the pen. It was a small thing, a tenth of a degree, but in the world of the traverse, small things were the ones that ate you alive.", "\"Show me,\" Isla said.", "Sera looked up. For a moment, the rivalry flared in her eyes, a sharp, bright thing. Then she looked at the slate. She looked at the numbers. She exhaled, a long, shuddering sound. \"I will show you.\"", "Joss, who had been asleep against a stack of timber beams, woke up. He saw Isla staring at the slate, and he saw the tension in the room. He picked up a piece of charcoal and began to draw tiny, perfect triangles in the margin of her notebook. One by one. Each one a small, stable world. He drew them until her eyes softened, until the numbers stopped being a threat and started being a pattern."], "img": "img/p112.jpg"}, {"no": 113, "ch": 23, "ctitle": "", "part": "", "paras": ["Midnight arrived not with a clock, but with a silence. The candles had burned down to nubs, and the porridge was gone. Only the scratch of graphite on slate remained, punctuated by the occasional sharp intake of breath.", "Sera worked alone now, her chair pulled close to the table. Her elbows were braced, her face lit by the flickering flame. She was re-doing the calculation by hand, bypassing the tables to derive the correction from the raw angles. It was the slow way, the honest way, the method that demanded hours rather than minutes.", "\"Come on,\" she whispered to herself. Her pen moved in a blur of motion. \"You are not a machine. You are a surveyor. Check the sine. Check the cosine. Check the...\"", "Isla sat beside her, watching. She did not offer help, knowing that assistance, right now, would be an insult. This was Sera’s debt, the price of the corner she had cut in the valley and the lopsided dell she had tried to hide. She was paying it in the currency of time and attention.", "Mags leaned over, whispering, \"Do you want me to hold the light?\"", "Sera shook her head without looking up. \"No. I need the flicker. It keeps me honest.\"", "The room held its breath. Even Joss had stopped drawing triangles. He sat with his hands clasped, his eyes fixed on Sera’s pen, the air feeling thick and pressurized, as if the stone walls were leaning in.", "Finally, Sera stopped. She sat back, her hands shaking, but her face calm. She turned the slate around.", "\"Read it,\" she said.", "Isla read the numbers, checking them against her own, then against the field-book. The discrepancy was gone. The two feet of error had vanished, replaced by a perfect, clean zero. The traverse closed.", "\"Yes,\" Isla said, her voice small. \"It closes.\"", "Sera exhaled a long, steady sound that carried the exhaustion of the entire expedition. She looked at Isla, and for the first time, there was no rivalry in her eyes. Only a tired, grateful respect. \"It was the declination,\" Sera said. \"I was wrong. I was so proud of my speed that I forgot the ground.\"", "\"You are not wrong now,\" Isla said. \"You are right. That is enough.\""], "img": "img/p113.jpg"}, {"no": 114, "ch": 23, "ctitle": "", "part": "", "paras": ["The calculation was finished, and the numbers lay clean on the slate. The traverse had closed, but one final step remained: the closing error. This was the measure of their trust, the specific distance between where they thought the land was and where it actually stood. How far had the country drifted from the truth? How much weight could they place on their own steady hands?", "Vasht stood up.", "The room went still. His ankle, wrapped tightly in linen, was a swollen umber thing beneath the grey trousers. He took a single step, then another, moving toward the center of the table. His walking stick clicked on the stone floor with a rhythmic, deliberate sound, marking time like a slow pendulum. He did not sit back down. He stood there, in the middle of the circle of faces, and he looked at the final number written on the slate.", "\"Three point one feet,\" he said. His voice was dry, stripped of all excess. \"Over forty-one miles.\"", "A murmur went around the table. Three feet was a significant amount in any other context. It was a road that missed its destination, a bridge that did not line up with the abutments. But over forty-one miles, across a stretch of loose, drifting land that had defied measurement for decades, three feet was almost nothing. It was a whisper, a hair’s breadth of error in a vast expanse.", "Vasht reached up with his left hand and took off his battered brown felt hat. He held it in his lap, the pencil in the band glinting in the candlelight. He did not bow his head. He did not speak. He simply stood there, in the silence, with his hat in his hands, and he looked at the number.", "It was a gesture of such profound, solemn respect that it hit Isla in the chest. He was not celebrating. He was acknowledging. He was acknowledging that they had done something difficult, something honest. They had measured a moving world and caught it.", "Mags wiped her eyes with the back of her hand, while Joss looked at the floor, his face bright with a sudden, fierce pride. Sera stared at the slate, as if she could not believe her own eyes.", "\"It is within the limit,\" Vasht said. \"It is within the limit of trust. We can seal the sheet.\"", "He put his hat back on. He looked at Isla. \"You did this,\" he said. \"Not me. You.\"", "Isla looked at her hands. They were still ink-stained. They were still steady. But they felt heavy, and good, and true."], "img": "img/p114.jpg"}, {"no": 115, "ch": 23, "ctitle": "", "part": "", "paras": ["The lamp burned low, its flame a steady, golden eye. Isla sat at the drafting table, the final sheet of guild paper spread before her, a vast and patient white. She picked up her pen, the ink black, viscous, and alive.", "She did not start with the mountains, nor with the rivers. She started with the question. *What is this land for?*", "Her hand moved. She drew the road first, not the Chancellor’s straight, efficient line that cut through the orchard. Instead, she traced it where the ground wanted to go, winding gently around the mill and leaving the best pasture intact. She drew the river, holding it in its bed, giving it room to breathe, a wide and slow curve that would not flood the fields in spring.", "She sketched the commons, a large, open space unmarked by ownership, where the sheep could graze and the children could play. She drew the ferry crossing, a simple line across the gorge, free for everyone rather than a toll-bridge. Next came the mill-race, a delicate, precise channel that gave the water its fall, its power, and its purpose.", "And then she drew the space where the reservoir would have been. She left it blank. The dam did not appear, nor the spillway. She left the land as it was, wild, free, and unbound by the Chancellor’s hunger for grain.", "The lines were clean. The angles were true. The triangles were strong. She checked the scale, then the legend. She checked the north arrow, pointing steadily to the Pole Star.", "She set the pen down. The work was done, and the land was fixed. It was not just a map. It was a promise, a contract with the ground, a declaration that this place would be cared for, that it would be honest, and that it would hold.", "Isla sat back. Her hands trembled slightly, but her heart was steady. She looked at the sheet and saw not just lines and shapes, but a life. A life that would be lived under her pen, measured by her truth.", "She picked up her pen again. She signed her name.", "◆ Words to know: traverse – a surveying path where measurements close back to the start; convergence – the point where separate lines or paths meet; declination – the angular difference between magnetic and true north; discrepancy – a difference or inconsistency between two things; viscous – thick, sticky, and slow-moving"], "img": "img/p115.jpg"}, {"no": 116, "ch": 24, "ctitle": "Midsummer in Vell", "part": "PART FIVE: THE HONEST LINE", "paras": ["*The Surveyor's Catechism, Twenty-Fourth Saying: Show your work. A truth that cannot be checked is only an opinion with good posture.*", "The Great Hall of the Meridian Guild smelled of beeswax, polished brass, and the specific, nervous scent of people who had dressed for an occasion they did not understand. It was Midsummer morning, and the light fell in long, golden shafts through the high clerestory windows, illuminating dust motes that danced in the stale air like tiny, suspended stars. The floor was a vast expanse of grey marble veined with black, reflecting the assembled crowd. The Guild Masters wore their grey coats, while the nobles rustled in silks that spoke of expensive authority. In a corner slightly apart stood the farmers from the Marches in their Sunday best, looking as though they had wandered into a library and expected to find a loaf of bread.", "Isla stood at the head of a long, high table. She wore her mustard-yellow canvas surveyor's coat, the pockets bulging with the debris of forty days in the Unmade: a snapped lead pencil, a coil of twine, and a small, cold stone from the Salt Flat. Her hair was twisted high, the two crossed brass pencils holding it in place, though one was slightly askew. Beside her, Master Vasht leaned on his carved walking stick, his grey wool coat rumpled, his expression one of profound, dignified patience. To her other side stood Joss, his sleeves rolled up, a carpenter's pencil behind his ear, and Mags, her blue scarf tied tightly, her iron cooking pot secured to her back. Behind them, Sera Quillon stood with her hands clasped, her plum-purple velvet coat crisp, her face a mask of professional neutrality that Isla recognized as a very thin veil of anxiety.", "On the table before them lay two sheets of guild paper. One was the Chancellor’s fast sheet, a masterpiece of elegant, sweeping lines that promised order and profit. The other was Isla’s survey, a dense, intricate web of triangles, contours, and notes, a document that showed its work as clearly as a mathematician shows a proof.", "The Royal Surveyor, a man with a face like a cracked walnut, stood at the end of the table, his level and staff ready. He adjusted his spectacles, looked at the two sheets, and then at Isla, with an expression that suggested he was deciding whether to sigh or to faint.", "\"Your Majesty,\" the Guild Master began, his voice echoing in the vaulted space, \"we are ready to adjudicate the survey of the Unmade.\"", "The Queen, Queen Cassia of Aster, sat on a simple chair at the center of the room, her plain silver circlet catching the light. She did not look at the Guild Master. She looked at Isla.", "\"Begin,\" she said."], "img": "img/p116.jpg"}, {"no": 117, "ch": 24, "ctitle": "", "part": "", "paras": ["Lord Chancellor Aldous Vane stepped forward. He was a tall man, his pearl-grey frock coat immaculate, his silver hair swept back from a face that smiled with the ease of a man who had never once been told \"no.\" He gestured gracefully toward his sheet, and the hall leaned in, drawn by the sheer polish of his presentation.", "\"This,\" Vane said, his voice smooth as poured cream, \"is the future of the Marches. We speak of a reservoir that will irrigate three counties, turning the dry scrub into grain estates of unprecedented yield. We speak of a grand road, straight and true, cutting through the wilderness to bring the bounty of the Unmade to the markets of Vell. It is efficient. It is profitable. And, above all, it is done.\"", "He tapped the sheet with his gold-topped cane. \"The land is a resource to be managed, not a mystery to be solved. This sheet offers certainty. It offers growth.\"", "Murmurs rippled through the crowd. The farmers shifted, some nodding, others frowning. Isla felt a cold weight settle in her stomach, not of fear, but of the specific, heavy dread of watching someone lie beautifully.", "Vane turned his gaze to Isla. His smile did not waver, but his eyes were sharp, assessing.", "\"And this?\" he asked, nodding at Isla’s sheet. \"What do we have here, Miss Corrin? A charming hobby of unregistered apprentices? A drawing of hills that wandered off during the tea break? It is cluttered. It is indecisive. It is, in the language of the Guild, a failure to deliver.\"", "He spread his hands, a gesture of dismissive pity. \"You have spent forty days in the mud, measuring stones that move. I have spent forty days ensuring that the kingdom eats. I trust Your Majesty will not punish efficiency for the sake of sentiment.\"", "Isla looked at Joss. He gave a small, almost imperceptible nod. *Show your work,* his eyes seemed to say.", "She stepped forward, her boots clicking on the marble. The sound was small, but in the sudden silence, it rang like a bell.", "\"Your Majesty,\" Isla said, her voice steady, \"I would like to answer.\""], "img": "img/p117.jpg"}, {"no": 118, "ch": 24, "ctitle": "", "part": "", "paras": ["Isla did not speak immediately. Instead, she reached into the deep pocket of her mustard-yellow coat and withdrew a small, leather-bound book. Its spine was cracked, the pages soft with the friction of years and repeated use. She placed it on the marble table, right beside her own sheet, with the precise care one shows when setting down a fragile instrument.", "\"This,\" she said, her voice level and clear, \"is the field-book of Hester Corrin, my great-grandmother. She surveyed Ennis Vale forty-four years ago. Her work was condemned for a closing error. The valley was declared loose, and it was lost from the Atlas.\"", "She pulled out a second book, thicker and bound in grey cloth. \"This is the Guild’s own record of the benchmark in Vell. The brass disc set in the floor of the Atlas Room. It is the point from which the entire city is measured.\"", "With a final motion, she placed her own field-book down. It lay open to the pages where the transposed digit had been corrected, the error owned, and the truth restored. The ink was dry, the columns neat, the calculations redundant and checked.", "\"I am not asking Your Majesty to believe me,\" Isla said. The silence in the hall was thick, but her voice carried through it without strain. \"I am not asking you to trust my word, or my family’s name, or the eloquence of the Lord Chancellor. I am asking you to check it. Because a truth that cannot be checked is only an opinion with good posture.\"", "She looked up at the Queen, holding her gaze steady. \"I have shown my work. Every angle, every level, every correction is written down. The numbers are there. If I am wrong, let the numbers say so. If the Chancellor is right, let his sheet stand. But let us find out which one is true.\"", "The Queen’s eyes narrowed slightly. She looked at Vane, who had the grace to look slightly uncomfortable, shifting his weight from one foot to the other. She then turned to the Royal Surveyor, standing rigid by the wall.", "\"Set up the level,\" she said. \"Read the known points. And compare the two sheets.\"", "The Royal Surveyor bowed, a jerky, uncertain motion. He picked up his instrument, his face pale as paper. He looked at the two sheets, then at the Queen, and then at Isla, who met his gaze with a calm, steady eye. There was no hesitation in her posture, only the quiet confidence of a hand that has held a line true.", "\"Very well, Your Majesty,\" he said. \"We shall see.\""], "img": "img/p118.jpg"}, {"no": 119, "ch": 24, "ctitle": "", "part": "", "paras": ["The Royal Surveyor moved with the meticulous caution of a man attempting to repair a cracked lens rather than a broken reputation. He unfolded the tripod legs, screwed them into the marble floor until they bit, and leveled the bubble until it sat centered in its circle, a small, perfect eye. He raised the staff to the first point, the brass benchmark disc embedded in the floor, and read the number. Then he turned the instrument to the second point, a stone pillar near the heavy oak doors, and read that number too.", "He turned to the two sheets laid out on the table. On Vane’s sheet, the distance between these two points was marked by a single, confident line, drawn with the easy assurance of a man who had never once had to check his work. On Isla’s sheet, the same distance was embedded in a complex triangle, surrounded by angles, checks, and a small, neat column of calculations in the margin.", "The Surveyor did the arithmetic. He checked it. He checked it again, his finger tracing the numbers with the same slow, deliberate rhythm he used when tying a knot in rope.", "\"There is a discrepancy,\" he said, his voice tight and thin as wire. \"On the Chancellor’s sheet, the distance is off. By thirty feet. On the apprentice’s sheet, it is within the width of a thumb.\"", "Murmurs rippled through the hall, soft at first, then rising like wind in a rigging. The farmers leaned forward, their elbows on the table. The nobles exchanged glances that held no warmth. Vane’s smile faltered, just for a moment, a hairline crack in the porcelain of his composure.", "\"Impossible,\" Vane said, the smoothness draining from his voice. \"There must be an error in your reading.\"", "\"My reading is not the issue,\" the Surveyor said, his eyes fixed on the Queen, refusing to look at the Chancellor. \"The error is in the benchmark. The Chancellor’s sheet was measured from a point that does not match the Guild’s official record. It is a rigged point. A false anchor.\"", "The Queen’s face was unreadable, her silver circlet catching the light from the high windows. She looked at Vane, who had gone very still, his gold-topped cane gripped so tightly his knuckles had whitened.", "\"Lord Chancellor,\" she said, her voice quiet and precise, \"you mentioned the financing of the dam. You said it was a matter of efficiency. But if the benchmark is false, then the entire survey is built on a lie. And a lie, no matter how beautiful, does not hold the land.\"", "Vane’s mouth opened, then closed. He said nothing. The silence in the room was not empty; it was full, heavy, and waiting.", "Isla felt a surge of something that was not triumph, but a deep, quiet relief, the kind that settles in the chest after a long climb. The land had been measured. The truth had been checked. And the numbers, for once, had spoken without needing to shout."], "img": "img/p119.jpg"}, {"no": 120, "ch": 24, "ctitle": "", "part": "", "paras": ["Master Vasht stepped forward. The room hushed, not with the sudden stop of a struck bell, but with the held breath of a man waiting for a reading to settle. His voice was soft, yet it carried, cutting through the stillness with the quiet, undeniable precision of a compass needle finding north.", "\"Your Majesty,\" he said, \"I must speak. Forty-four years ago, I was a junior clerk at this Guild. I reported the survey of Hester Corrin as faulty. I followed the Guild’s finding. I did not check the benchmark. I did not question the numbers. I was wrong. And my haste has cost this kingdom a valley.\"", "He turned his gaze to Isla. His eyes were bright, carrying a grief that had been packed away in the corners of his memory for decades, only now to be unpacked in the open light. \"I am sorry. I am sorry to her. I am sorry to you.\"", "The silence in the hall was absolute. The Guild Master, a man whose face had turned the pale grey of old parchment, rose to his feet with a slow, deliberate motion.", "\"The Guild,\" he said, his voice trembling slightly, \"will reopen the sheet. We will review the benchmark. We will correct the record.\"", "A low hum moved through the crowd, a resonant sound of recognition and regret that seemed to vibrate in the floorboards. Isla looked down at her hands. She realized she had been gripping Joss’s hand so tightly that the skin of his knuckles had gone white beneath her fingers. He had not let go. He had not said a single word. He had just been there, steady and sure, acting as a counterweight to her own trembling, anchoring her to the ground as if he were a fixed point on a map.", "She squeezed his hand, just once. It was a small, silent acknowledgment, a promise made without the need for any further explanation.", "The Queen stood, her silver circlet catching the light from the high windows. She looked at Isla, then at Vane, and finally at the two sheets laid out on the table.", "\"Take the Chancellor’s sheet down,\" she said. \"And bring me the field-books. I want to see the work.\"", "Isla felt the responsibility of the moment settle onto her shoulders. It was not a burden, but a duty, clear and sharp-edged like a well-honed chisel. She had measured the land. She had shown her work. And now, at last, the land would hold.", "◆ Words to know: adjudicate – to make an official judgment or decision; immaculate – perfectly clean, neat, or without flaws; eloquence – fluent and persuasive speaking or writing; meticulous – showing great attention to detail; resonant – producing a deep, full, or reverberating sound"], "img": "img/p120.jpg"}, {"no": 121, "ch": 25, "ctitle": "What the Land Is For", "part": "PART FIVE: THE HONEST LINE", "paras": ["*The Surveyor's Catechism, Twenty-Fifth Saying: Draw as if someone will have to live there. Someone will.*", "The ink was still wet on the vellum when the Queen moved to sign. It was a heavy, ceremonial act, the sort of thing that usually involved three scribes and a very anxious Chancellor, but today the hall felt smaller, tighter, as if the walls had leaned in to listen. Isla’s thumb, stained to the second knuckle with the same guild ink that had bound the kingdom for centuries, hovered over the final line. Her hand did not tremble. It was steady, the way it had been steady on the roof of the Guild, the way it had been steady in the Pale, the way it had been steady when she had corrected the digit that had nearly broken the traverse.", "\"Your Majesty,\" Vane said, his voice thin and reedy, \"the timing is... unprecedented. The grain markets are volatile.\"", "\"The grain markets are not here,\" the Queen said. Her voice was dry, lacking the warmth of a hearth but possessing the clarity of a struck bell. \"The land is here. And the land is waiting.\"", "She signed. She pressed the royal seal into the soft wax with a crisp, decisive click that echoed off the vaulted ceiling. Then she stepped back, and Isla stepped forward.", "Isla placed her thumb on the sheet. She did not press; she simply let her weight settle into the motion, a final acknowledgment of the work done. The ink shone, dark and deep, a black so pure it seemed to pull the light into itself.", "And then the room exhaled.", "A vibration, low and sustained, started in the soles of Isla’s boots and traveled up through her bones, settling in her teeth. The air in the Atlas Room shimmered, a ripple of pale gold light that washed over the hanging sheets, over the faces of the court, over the stone floor. The smell changed instantly. The sterile, papery scent of the Guild was replaced by something damp and green, something alive.", "It smelled of rain on slate. It smelled of crushed grass and ripe apples. It smelled of a river that had finally remembered its bed.", "Far away, forty-one miles to the east, the fog over the Pale was settling. It was not being blown away; it was being resolved. The drifting hills were locking into their coordinates, the wandering streams were finding their gradients, and the loose country was becoming, for the first time in forty-four years, a place.", "Isla watched the light fade from the sheet. The paper was dry. The land was fixed."], "img": "img/p121.jpg"}, {"no": 122, "ch": 25, "ctitle": "", "part": "", "paras": ["The Queen’s ruling was delivered with the same brisk efficiency she applied to everything, from state dinners to the disposal of dishonest surveyors.", "\"Ennis Vale is restored to the Atlas,\" she said, her sharp eyes sweeping the room. \"The Guild’s apology is noted. Hester Corrin’s sheet is reinstated. The commons are fixed in law. The ferry at Corrin is free. The mill-race is a public utility, not a private asset.\"", "She paused, looking directly at Lord Vane.", "\"As for the Chancellor’s private estates and reservoir... those are struck from the record. The land belongs to the people who live on it, not to the men who wish to own it.\"", "Vane’s face was a mask of pearl-grey porcelain. He did not argue. He did not equivocate. He simply picked up his gold-topped cane, adjusted his silver hair, and walked out of the Atlas Room without a single backward glance. The heavy doors closed behind him with a sound like a book being shut.", "The hum in the room was different now. It was not the vibration of the sealing, but the murmur of a crowd that had just witnessed a correction of history. People were turning to each other, speaking in low, excited voices. The Guild Master, whose face had lost its parchment-like pallor, was shaking hands with the Queen.", "Isla stood still, her hand still raised, her fingers tingling. Beside her, Sera Quillon was leaning against a pillar, her sleek black bob slightly askew, her expression one of profound, quiet relief.", "\"Deputy Royal Surveyor,\" the Queen said, not looking at her, but addressing the room. \"Effective immediately. You will oversee the implementation of the new standards. And you will ensure that the field-books are open to any citizen who wishes to inspect them.\"", "Sera straightened, her silver rule catching the light. She looked at Isla, and for a moment, the rivalry that had defined their weeks together dissolved into something warmer, something that felt like respect.", "\"Deputy Royal Surveyor,\" Sera repeated, and the title seemed to fit her, crisp and authoritative, yet grounded in the same honest work Isla had done. \"I accept. But I want the best instruments. And I want the coffee to be hot.\"", "Isla almost smiled. Almost."], "img": "img/p122.jpg"}, {"no": 123, "ch": 25, "ctitle": "", "part": "", "paras": ["The Guild Master waited for Isla in the antechamber, appearing smaller now that the institution’s authority no longer shielded him. He looked like a man who had spent a lifetime hiding behind the bulk of his own title.", "\"We would like to offer you a master’s chair,\" he said, his voice careful and measured, as if he were reading from a script he had written in a different century. \"A title. A stipend. You have earned it, Isla Corrin. More than any of us.\"", "Isla considered this. She thought of the other apprentices, the sons and daughters of magistrates and shipowners, who had tutors and surnames that opened doors. She thought of her father, forging chains in Corrin Ferry, testing every link. She thought of Mags, calculating the fall of the water in her head while the rest of them hunched over slates.", "\"A master’s chair,\" Isla said. \"And a title.\"", "\"Yes.\"", "\"And what comes with it?\"", "\"Privilege,\" he replied. \"Access. A place at the table.\"", "Isla shook her head. It was a small motion, but it carried the gravity of the last forty days.", "\"I don’t want a place at the table,\" she said. \"I want the table to be open. I want an open apprenticeship. Any child, from any town, if they can show a good field-book, can sit in your vaults. No fees. No surnames. Just the work.\"", "The Guild Master stared at her. The silence stretched, thin and taut, like a surveyor’s chain pulled to its breaking point. He looked at the door, where the rest of the court was waiting. He looked at his hands, which had once held the quill that had signed Hester’s condemnation.", "\"If we do this,\" he said slowly, \"we cannot take it back.\"", "\"No,\" Isla said. \"You can’t.\"", "He took a breath, a long, shuddering intake of air that seemed to clear the dust from his lungs. Then he nodded.", "\"Who will be the first to sign the petition?\" he asked.", "From the doorway, a hand was raised. It was Dorian Pike, his face flushed, his gold watch chain jingling as he stepped forward. He looked terrified, and exhilarated, and very, very young.", "\"I will,\" he said."], "img": "img/p123.jpg"}, {"no": 124, "ch": 25, "ctitle": "", "part": "", "paras": ["The journey home was a procession. It was not a royal entry, with trumpets and banners, but a slow, rolling convoy of wagons and mules, carrying the instruments, the field-books, and the quiet pride of a job well done. The road to Ennis Vale was no longer a loose, drifting path. It was a road, fixed in the Atlas, running true and straight between the now-stationary hills.", "They passed the bridge at Gantry Gorge, the timber truss now hung with ribbons of red and blue cloth, tied there by the villagers who had watched it hold. The river below ran clear and steady, respecting the banks that Joss had helped define.", "When they reached the hamlet, the smell hit them before the sight. It was the smell of the orchard in full bloom, a sweet, heavy scent that made the air feel thick. The slate roofs of the houses gleamed in the afternoon sun, and the bell in the stone tower was still.", "Perrin Ashdown was waiting at the mill gate. He was tiny and wiry, his white whiskers trembling as he held the heavy rope. He looked at Isla, and his eyes were wet.", "\"Is it true?\" he asked.", "\"It’s in the book,\" Isla said. \"It’s in the Atlas. It’s fixed.\"", "Perrin pulled the rope. The bell rang out, a clear, bright sound that rolled over the orchard and into the valley. It was the first time the bell had rung in forty-four years. The sound was not just noise; it was a correction. It was the land remembering its name.", "Isla walked to the mill. The water in the race was moving smoothly, a steady fall of one in one thousand five hundred, just as she had calculated. She sat on a stone by the water and opened Hester’s old field-book. The pages were brittle, the ink faded, but the numbers were there, precise and proud.", "She found the last marginal note. It was written in a hand that was shaking slightly, but the letters were firm.", "*If someone finds this, the numbers were good.*", "Isla traced the words with her finger. She did not cry. She simply closed the book, and let the sound of the water and the bell fill the space."], "img": "img/p124.jpg"}, {"no": 125, "ch": 25, "ctitle": "", "part": "", "paras": ["Sunrise on the bell-tower was a slow affair, the light creeping up from the valley floor to kiss the slate roofs, then the orchard, and finally the parapet where they stood. Isla, Joss, Mags, and Sera leaned on the stone railing, watching the world wake up with the patience of surveyors checking a baseline.", "Below them, on the grass, Master Vasht sat in his chair, his walking stick across his knees. He watched them, his grey eyes bright in the dawn, and did not wave. Instead, he nodded, a small, respectful acknowledgment of the company he kept.", "Ledger the mule was in the orchard below, his head buried in a tree, eating an amount of blossom that seemed physically impossible for any creature of that size.", "Isla set up the sightglass, the small brass instrument light in her hands as she adjusted the screw to find the Pole Star. She watched it fade as the sun rose, the fixed point holding its promise that the sky would not drift and the world would hold.", "\"A land is a promise,\" she said, her voice quiet against the morning air. \"Made of true numbers.\"", "Joss leaned over the railing, still in his work shirt with sleeves rolled up and a carpenter’s pencil behind his ear. He looked at her, then at the valley, and back at her again.", "\"Well,\" he said, clearing his throat. \"It’s a pretty good promise. For a piece of paper.\"", "Mags, who was holding a pot of porridge that could hold up a bridge, grinned. \"The porridge is ready. And it’s honest.\"", "Sera adjusted her silver rule. \"I’ll inspect the porridge. For the record.\"", "Isla looked out at the valley, which was fixed now, and felt a strange, steady warmth settle in her chest. It was home.", "She took out her field-book, opened it to a fresh page, and wrote the time, then the date. Underneath, in her steadiest hand, she wrote her name.", "◆ Words to know: unprecedented – never done or known before; volatile – liable to change rapidly and unpredictably; equivocate – to use ambiguous language to conceal the truth; stipend – a regular sum of money paid as a salary; exhilarated – very excited and enthusiastic"], "img": "img/p125.jpg"}], "chapters": [{"n": 1, "title": "The Leaning Chimney", "part": "PART ONE: THE BLANK SHEET", "page": 1}, {"n": 2, "title": "The Commission", "part": "PART ONE: THE BLANK SHEET", "page": 6}, {"n": 3, "title": "Mags and the Pot", "part": "PART ONE: THE BLANK SHEET", "page": 11}, {"n": 4, "title": "The Pale Road", "part": "PART ONE: THE BLANK SHEET", "page": 16}, {"n": 5, "title": "The Edge of the Sheet", "part": "PART ONE: THE BLANK SHEET", "page": 21}, {"n": 6, "title": "Thirty Miles of Nothing", "part": "PART TWO: THE BASELINE", "page": 26}, {"n": 7, "title": "The Baseline", "part": "PART TWO: THE BASELINE", "page": 31}, {"n": 8, "title": "Triangles", "part": "PART TWO: THE BASELINE", "page": 36}, {"n": 9, "title": "A Hill Is Held", "part": "PART TWO: THE BASELINE", "page": 41}, {"n": 10, "title": "A Message and an Ankle", "part": "PART TWO: THE BASELINE", "page": 46}, {"n": 11, "title": "Chain of Command", "part": "PART THREE: THE TRAVERSE", "page": 51}, {"n": 12, "title": "The Drifting Hills", "part": "PART THREE: THE TRAVERSE", "page": 56}, {"n": 13, "title": "Smoke in the Haze", "part": "PART THREE: THE TRAVERSE", "page": 61}, {"n": 14, "title": "Hester", "part": "PART THREE: THE TRAVERSE", "page": 66}, {"n": 15, "title": "Midpoint: The Valley Remembers", "part": "PART THREE: THE TRAVERSE", "page": 71}, {"n": 16, "title": "The Fast Sheet", "part": "PART FOUR: THE CLOSING ERROR", "page": 76}, {"n": 17, "title": "Sera's Valley", "part": "PART FOUR: THE CLOSIN const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
