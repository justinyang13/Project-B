med. A high, dry shriek rattled the shutters against their frames. By morning, they banged with a steady, hollow rhythm. The air inside the shop tasted of dust and dryness.", "Kichi was running back and forth to the ink pot. \"It dries too fast,\" he complained, his voice thin in the howling air. He held a damp cloth over the paper, smoothing it down, but the ink seemed to evaporate before it could settle. His lips were cracked. He rubbed them with his sleeve, looking at the drying lines with deep suspicion.", "The sheets hung there, stiff and pale. They snapped in the gusts that slipped under the door. Haru watched them, her fingers trembling slightly as she held her brush. The woodsmoke from the brazier felt thin and weak against the cold that seeped through the wooden walls.", "\"I can't keep up,\" Kichi said, dropping the cloth. \"The paper is fighting me.\"", "Haru looked at the block on the table. The cherry wood looked pale, almost white, in the harsh winter light. She wanted to say something to make it stop. The wind only laughed louder. It shook the very frame of the house."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["By midday, the alley had changed. The noise of the wind was a constant drone, like a bee trapped in a jar. The neighbors came out, not to talk, but to check. They moved from house to house, lifting the lids of their water barrels to check the level, then slapping the sides to listen for the slosh of enough water.", "Haru helped her mother pack the family bundle. It was a large cloth sack, sturdy and brown. Inside went warm cotton jackets, a heavy lantern, and a tin of dried beans. Mother Okiyo also tucked in the family's important papers, wrapped in oilcloth, and tied the whole thing with a thick cord. She placed it by the door, right where it could be grabbed in a second.", "Then came the sound from the watchtower. *Clang.*", "It was a single, short stroke. A test.", "Every head in the alley snapped up. Kichi dropped his brush. Even Father, who had been carving with his eyes closed, opened them and looked toward the street. The sound was sharp and clear, cutting through the wind.", "\"Practice,\" said the fire lookout’s voice, muffled by the distance. \"Just practice.\"", "But nobody relaxed. They all stood there, listening to the wind howl outside, waiting to see if it would stop. It did not."], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["That evening, the cold pressed against the windows like a hand. Grandfather Tobei sat by the brazier, wrapped in a thick blue-grey blanket. He did not look at the fire; he looked at his hands, which were resting on his knees, still as wood.", "\"Sixty years ago,\" he said, his voice low and dry, \"the wind was just this loud.\"", "Haru sat cross-legged on the floor, close to the warmth. \"Was there a fire?\"", "\"Many fires,\" he said. \"One big one. I was a boy. We were printing a calendar. The blocks were in the back room.\"", "He did not raise his voice. He did not gesture. He spoke plainly, as if reading a list of ingredients. \"The sky was the color of a persimmon. The roar was not like thunder. It was like the earth itself was being torn open. We ran. The neighbors ran too.\"", "Haru shivered, though she was close to the fire.", "\"We had a barrow,\" Grandfather continued. \"We put the blocks on it. Children walked beside us. We pushed it through the smoke. The blocks survived. The house did not.\"", "He looked up then, his white eyebrows raised slightly. \"The blocks are not just wood, Haru. They are the memory of the work.\""], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["\"A house can be rebuilt,\" Grandfather said. \"A block cannot. If it burns, the pictures are gone, and the words are gone with them.\"", "Father Sota nodded, his knife resting on the table. He had been listening with a serious face, and now he said, \"We need a plan. If the bell rings, there is no time to think. We must know exactly what to grab before the smoke arrives.\"", "\"Me?\" Kichi asked, raising a hand like he was in the temple school. \"I am the printer. I stay with the paper?\"", "\"No,\" Father said. \"You take the tools. The knives, the brushes, the baren. Without them, the blocks are just wood.\"", "Kichi nodded, looking a little less hungry and a little more serious.", "\"Haru,\" Father said. He looked at her, and his eyes were kind but firm. \"You help Grandfather. He has the bad shoulder. You take his arm and guide him down the ladder.\"", "Haru felt a knot in her stomach, and she said, \"But I am the ears. I listen.\"", "\"Tonight, you are the hands,\" Father said. \"You help him out. That is your job.\"", "Nobody argued. It was not a debate; it was a fact, as solid as the cherry wood on the shelf. Haru looked at Grandfather, who was already pulling his blanket tighter around his shoulders."], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["That night, the wind was louder. It shouted against the roof, a deep, continuous roar that vibrated in Haru’s teeth. She climbed the ladder to the sleeping loft, her feet finding the rungs by memory. The air up there was thinner, colder.", "She unrolled her mat and lay down. The floor was hard. The wind pressed against the thin walls of the loft. She could hear the drying lines below, snapping and cracking like dry twigs underfoot. The water barrel in the kitchen sloshed, a low, restless sound.", "*Nothing will happen,* she told herself. *The roof is strong. The walls are thick. The ink is dry. The paper is safe.*", "But the wind did not stop. It seemed to be getting stronger, or maybe her ears were just too sensitive. She pulled her blanket up to her chin.", "*Nothing will happen.*", "She said it again, silently, over and over. She had always trusted what she saw with her own eyes. She had always believed that the world was what it was. But tonight, for the first time, she hoped she was wrong. She hoped the wind would die down. She hoped the bell would stay silent. She hoped the night would pass without a single spark.", "She closed her eyes, listening to the howl, waiting for the dark to take her."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "Captain Daigoro's Pole", "part": "PART THREE: THE SHARP KNIFE", "paras": ["*The Owl Alley Sheet, No. 15. Today's news: a firefighter came to see the print shop.*", "The wind died down just as the temple bell rang the late morning. Haru was brushing dust from the drying lines when the alley filled with the clack of heavy wooden geta.", "A square man marched down the center of Owl Alley. He wore a leather-hooded coat trimmed in black and carried a pole so tall it nearly scraped the eaves.", "He stopped in front of the shop. He tilted his head back to look at the owl on the indigo curtain. Then he grinned at Haru, showing teeth that were surprisingly white.", "\"Captain Daigoro,\" Mother Okiyo said, bowing from the counter. \"We did not expect you.\"", "\"I make rounds,\" he said. His voice was cheerful. It boomed like a drum that has just been tuned. \"To see if my neighbors are ready.\"", "He stepped inside. The hem of his coat brushed the floor. He looked at the shelves of cherry-wood blocks, then at the low carving table.", "\"A fire will eat a wooden shop in the time it takes to drink tea,\" he said happily. \"So I like to know where the tea is kept.\"", "Haru wiped her hands on her apron. She had never met a firefighter before. He smelled of leather and wood smoke. He looked as sturdy as the blocks on the shelf."], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["Kichi brought out a bowl of tea, but Daigoro did not drink it. He held it in both hands, watching the steam curl.", "\"Most people think we fight fires with water,\" he said, looking at Haru. \"Do you believe that is all we do?\"", "\"Of course,\" Haru replied. \"Buckets and rivers are how it works.\"", "Daigoro laughed, a short, sharp sound. \"Water is scarce, little printer. And a fire is fast. By the time you carry a bucket, the roof is already gone.\" He tapped the table with his knuckles. \"We fight with hooks and ladders. We pull houses down.\"", "Haru froze, and the brush in her hand slipped to tap against her teeth.", "\"You pull houses down?\" she asked, her voice small. \"Someone's house?\"", "\"Someone's house,\" Daigoro confirmed. He did not look sorry, but he looked serious. \"So that fifty others will stay.\"", "The room felt suddenly very cold, and the smell of ink seemed to sharpen. Haru looked at the drying lines, at the pale sheets hanging there. She thought of the tofu shop across the alley, where Umekichi’s forearms were always dusted with white, and then of the bathhouse with its tall chimney.", "\"If the fire jumps,\" Daigoro said, \"we cut the path. We leave the fire nothing to eat.\" He picked up the tea bowl again. \"It is a terrible job. And a necessary one.\"", "Haru watched the steam curl from the bowl. A house is more than just wood; it is a kitchen, a sleeping mat, and a memory. To pull it down felt like breaking a bone."], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["\"I will show you,\" Daigoro said. He did not wait for an answer. He hooked his pole over his shoulder and walked out.", "Haru looked at her father. He was carving, steady as always, but he nodded. She tied her apron tighter and followed him.", "The watchtower stood at the end of the ward, a tall wooden structure with a railing. Daigoro climbed the ladder with the easy grace of a cat. Haru followed, her knees knocking on the rungs.", "The air was thin and sharp up there. She leaned on the railing and looked out. The whole ward spread below her, a sea of grey tiles and dark chimneys. Thin ribbons of smoke rose from a dozen hearths, drifting in the still air.", "She scanned the roofs. There, near the canal, the bathhouse chimney stood up, a small dark finger pointing at the sky. She had seen the crack in the cap from the street. From here, it looked like a flaw in the stone, a small weakness in a strong thing.", "\"You see it too,\" Daigoro said softly. He was looking at the same place.", "Haru pulled her hand away from the railing. It was cold.", "\"It looks small,\" she whispered.", "\"Everything looks small until it is burning,\" he said. \"Then it is the only thing you can see.\"", "The wind picked up, just a little. The smoke from the bathhouse chimney wavered, leaning away from the alley. Haru watched it, her heart beating a little faster."], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["They stayed on the tower, watching the alley below where shadows tangled with bright patches of sunlight. A seller shouted down the street, and a dog barked three houses away, while the world went on completely unaware of the height they stood upon.", "Haru turned to Daigoro. She wanted to ask if he was brave, or if he feared the dark and the sound of wood snapping. Instead, she asked a different question.", "\"If you were to write about a fire,\" she said, \"what would you want it to say?\"", "Daigoro looked at the roofs, then at her. His face was calm, though his eyes were steady and hard.", "\"Where it started,\" he said. \"And how people helped. And who needs help afterwards.\"", "He paused, letting the wind pull at his coat.", "\"Not who to blame.\"", "Haru blinked. \"But the sheet tells the story. If it does not blame someone, who is right?\"", "\"A fire has a cause,\" Daigoro said. \"It is nearly always smaller than people think. A spark. A draft. A tired hand. Blame is easy, but it is heavy, and it burns people too.\"", "He looked at her, and for a moment, he did not look like a man who liked to joke. He looked like a man who had seen too many roofs fall.", "\"The truth is a tool,\" he said. \"Use it to build, not to break.\"", "Haru felt a tightness in her chest. It was not fear. It was something else. Something like a question she had not known how to ask."], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["They climbed down the ladder. The ground felt solid and close under their sandals. The wind had died down, leaving the air still and heavy.", "Haru walked back to the shop with her hands in her sleeves. Her booklet was tucked into her obi, a small bundle of folded paper. She touched it once, then let her hand drop.", "She had written down what she heard. Not the words, exactly. But the feeling. *Not who to blame.*", "It was a strange thing to carry. She had always trusted the sharp edge of the truth. She had always believed that if a sentence was accurate, it was safe. But Daigoro’s voice echoed in her ears, quiet and sure.", "*Use it to build, not to break.*", "She reached the shop door and paused. The wind was gone, but the cold remained. She could feel it in her fingers, in the back of her neck. She had something to think about now. Something that did not fit neatly into a line of brushstrokes.", "She pushed the door open. The smell of ink and wood greeted her. The familiar, safe smell. But it felt different now. It felt like a promise she had not yet learned how to keep.", "Haru tied her apron tighter and walked into the room."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "The Bell in the Night", "part": "PART FOUR: THE NIGHT OF THE NORTH WIND", "paras": ["*The Owl Alley Sheet, No. 16. Today's news: the bell rang in the night.*", "The sound did not start. It arrived.", "One moment Haru was sleeping in the loft, her body warm under the futon. The next, a deep, booming crash shook the wooden frame of the sleeping room. It was not the wind. It was not the canal. It was a bell, struck with all the force a person could give, and it did not stop.", "Haru sat up. Her heart beat in her ears, loud and hard. The shutters, which had been dark, now glowed with a faint, pulsing orange light. The shadows in the room stretched and bent like long, thin fingers.", "Across the loft, Grandfather Tobei was already at the head of the ladder. He did not look up. He rubbed his bad shoulder, then dropped his hand to grab the rung. His face was pale in the orange light, but his voice was steady.", "\"Go, go, go,\" he said. \"Do not wait for the lantern. The eyes are enough.\"", "Haru was already moving. She did not think about what to wear. She did not think about her hair. She kicked off the futon, took his good arm, and helped him down the ladder one rung at a time, her bare feet slapping against the cold wooden rungs. The bell rang again, closer now, or maybe louder. The whole shop seemed to lean into the sound."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["The alley was a river of noise.", "The air smelled of wet wood and cold ash. People moved in a blur of dark kimono and bright panic. A woman carried a child wrapped in a thick blanket, her face tight with worry. A man ran past carrying a bucket filled with water, the liquid sloshing over his hands and dripping onto the frozen mud.", "*Clack, clack, clack.*", "The wooden geta hit the hard ground. It was the heartbeat of the chaos. Haru pushed through the crowd. Her breath came in short, sharp bursts.", "She saw Father Sota. He was broad-shouldered and calm, carrying a heavy chest of wooden blocks on his back. Beside him, Kichi ran. His face was white. In one arm, he held a bundle of carving knives. In the other, he held a cat.", "The cat meowed. It was a high, thin sound that cut right through the roar of the bell.", "\"Captain Daigoro!\" a voice shouted from the far end of the alley.", "Daigoro stood in the center of the street. He wore his leather hood, the black trim standing out against the night. He raised his long pole, the paper tassel at the top whipping in the wind.", "\"Stay back!\" he bellowed, his voice ringing over the crowd. \"Stay back and listen! Do not run toward the fire!\"", "Haru looked at the end of the alley. The darkness was not empty anymore. It was breathing."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["Haru reached the bridge.", "The wooden planks were cold under her feet. She looked across the canal, toward the bathhouse. The noise stopped for a second, and in that silence, she saw it.", "It was not a mountain of flame. Not yet. It was a line.", "A thin, red line ran along the base of the tall brick chimney. It glowed with a fierce, angry light. The wind, which had been silent for so long, suddenly spoke. It pushed the air across the canal, and with it, it pushed the smoke.", "Haru watched, her hands trembling on the bridge railing, as a single spark leaped out of the ash door at the base of the furnace, which hung a little open, and rode the wind. It was a tiny, bright eye in the dark. It drifted over the water, over the stone wall, and landed on a pile of cherry-wood shavings that sat behind the furnace door.", "The shavings did not catch slowly. They burst.", "A whoosh of orange light erupted from the pile, licking up the side of the bathhouse wall. The wind caught the new flame and pulled it higher, stretching it into a long, thin tongue that pointed directly at the roof tiles. The sound of the fire was different from the bell. It was a hiss, a crack, a hungry roar.", "Haru stepped back. Her hands were shaking so hard she had to clench them into fists."], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["The door at the back of the bathhouse flew open.", "Shin ran out, small and skinny, his face a mask of black soot and white skin. His eyes were huge and wide in the dirt. He held a bucket of water, his arms shaking with the effort of lifting it.", "He ran to the pile of burning shavings. He did not look at the neighbors gathering in the street. He looked only at the flame.", "He threw the water.", "The liquid hit the fire and hissed into steam. But the wind was strong. It caught the vapor and the sparks and threw them back. The flame flared, doubling in size, leaping over the bucket Shin held.", "Shin did not stop. He ran back to the well, filled the bucket again, and ran back. He threw the water again. The wind threw the fire back.", "Hachi, the bathhouse owner, appeared from the shadows. His dark navy coat flapped behind him. He moved with surprising speed. He grabbed Shin by the collar of his soot-grey jacket and dragged him backward, away from the heat.", "\"Shin!\" Hachi roared, his voice cracking. \"Shin, come with me!\"", "Shin struggled, his feet skidding on the wet ground, but Hachi was stronger. He pulled the boy toward the street, his eyes fixed on the fire, but his body shielding the child."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["Haru stood frozen for one breath while the fire climbed past the shavings and licked the wall. Now it was on the roof, where the tiles glowed red, then orange, then white, turning the air into a thick black cloud that rolled over the alley and choked her lungs.", "She looked down at her hands, still clenched tight, and then back at the fire, which looked as hungry as Kichi before breakfast.", "Then she saw Okiku. The noodle stall was pulled up against the bathhouse wall, heavy with bowls and ingredients. Okiku stood in front of it, her face pale, her hands gripping the wooden handle so hard her knuckles were white. She could not move it. The weight was too much for one person.", "Haru ran. She did not think about the danger, or the heat already kissing her face, only the heavy wooden wheels. She reached the cart and grabbed the handle behind Okiku.", "\"Push,\" Haru said. Her voice was steady.", "Okiku pushed. Haru pulled. The wooden wheels groaned against the frozen ground, fighting the ice like a stubborn mule, and they moved the cart, inch by inch, away from the wall.", "Behind them, the roof of the bathhouse gave way. A long sheet of orange fire rolled over the edge and hung in the air for a second, suspended by the wind, before dropping toward the tofu shop next door."], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "The Tofu Shop Comes Down", "part": "PART FOUR: THE NIGHT OF THE NORTH WIND", "paras": ["*The Owl Alley Sheet, No. 17. Today's news: a tofu shop was sacrificed for a street.*", "Captain Daigoro did not shout. He did not need to. The wind was doing the shouting for him, tearing at the hem of his leather hood and snapping the paper tassels on his pole. He stood in the middle of the road, his square face grim, and pointed his thick finger at the tofu shop.", "The shop was narrow, tight against the bathhouse wall. It stood between the fire and the rest of Owl Alley. It was a wall of wood, and wood was the fire’s best friend.", "Umekichi stood on the other side of the street, his white headband askew, his huge forearms hanging loose at his sides. Osen clutched a heavy pot of broth to her chest, her face pale as the steam rising from it. Behind them, the rest of the alley watched, their breath pluming in the cold air.", "Daigoro walked toward the tofu maker. The crowd parted. He stopped an arm’s length away and placed a heavy hand on Umekichi’s shoulder. He looked at the man, then back at the shop.", "\"Umekichi,\" he said, his voice low and rough. \"It has to go. Now.\"", "Umekichi looked at his shop. He looked at the window where he had ground the soybeans for twenty years. He looked at the door where he had hung his lucky charm, now hidden by soot. He swallowed. His throat worked once, twice.", "\"Do it,\" he said."], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["The sound was not a crash. It was a long, thundering groan of timber snapping and sliding. The tofu shop did not fall so much as fold, crumbling in on itself like a wet paper crane. Dust billowed up, grey and thick, rolling over the road to settle on the shoulders of the firefighters.", "The hooks swung. The ropes pulled. With every tug, the wall shuddered. With every snap, the fire screamed. Then, with a final, heavy thud, the roof caved in. The gap between the bathhouse and the rest of the alley was empty. It became a wide, dark mouth of cold air and ash.", "The flames reached the edge. They licked at the nothing there, spat and hissed, but could not cross. They had no wood to eat. The wind, which had been howling, seemed to pause. It dropped a fraction, a small, tired sigh, as if the effort of blowing sparks across that gap had exhausted it.", "By the time the temple bell rang the morning, the alley was standing. It was grey. It was steaming. It was safe. The bathhouse stood as a black skeleton of beams. The tofu shop lay in a pile of splintered planks. But the print shop, the noodle stall, and the homes remained. Not one person was hurt."], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["Dawn broke over the alley in shades of wet slate and pale gold. The road was slick with ash and melted snow. The neighbors gathered, not in a crowd, but in a loose circle, their breath mixing with the steam that rose from the ruined bathhouse.", "Okiku was first. She had wheeled her cart, miraculously unscathed, to the center of the road. She ladled hot broth into bowls, passing them hand to hand. No one spoke. No one asked for money. The broth was thick with ginger and green onions, and it smelled like life.", "Mother Okiyo stood beside her, holding a bundle of cloth. She untied it and began to pass out rice balls, small and neat, wrapped in leaves. Haru watched them take them, her hands trembling slightly as she accepted one.", "Umekichi sat on the edge of the pile of planks that had been his shop. He did not move. In his lap, he held a tofu mold, the wooden frame with the cloth inside. He stroked it with his thumb, over and over, a quiet, repetitive motion. He looked at the mold. He looked at the empty space where the shop had been. He did not weep. He just held it, as if he were holding the last piece of something precious."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["Haru sat on the wooden bridge rail, her legs dangling over the canal. The water below was dark and still, reflecting the grey sky. In her lap lay her booklet, the pages soft and grubby from use. Her fingers were stained with ink, a deep black smudge that would not wash out for days.", "She opened the booklet. She uncapped her brush. Her hand shook, just once, and then it stilled. She began to write. The letters were small, careful, precise. She did not write about the roar. She did not write about the fear. She wrote about the spark.", "She wrote about the pile of cherry-wood shavings near the bathhouse furnace. She wrote about the cracked chimney cap, the hairline fracture she had noticed three days ago when the wind was rising. She wrote about the north wind, the dry, relentless wind that had blown for three days straight. She wrote about the shavings, how they had caught the spark, how they had caught fire, how the fire had climbed.", "It was true. Every word was true. She looked at the page, at the black strokes drying on the paper. The smell of ink was sharp and clean, cutting through the smell of ash.", "\"I will print this,\" she whispered to the empty air. \"I will print it today.\""], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["The voice started low, then rose. It cracked with the early morning cold, but it carried. It was a big voice, round and loud, the kind that could be heard from the other end of the alley.", "Haru froze. Her brush hovered over the page, a drop of ink trembling at the tip.", "It was Bunta. The seller was standing in the middle of the road, his deep straw hat pulled low, a fan in his other hand. He was reading from a sheet of paper, a fresh sheet, the ink still wet and glossy.", "\"Listen well, good people!\" Bunta boomed. \"The Turtle House has a story for you today! A story of a fire! A story of a blame! Listen to the words, for they are the words of the Turtle House!\"", "The crowd turned. The sound of feet shuffling on the wet road filled the air. Haru looked down at her booklet, then up at Bunta, who was waving the sheet high above his head. The paper fluttered in the wind, a white flag of something she had not yet expected."], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "The Wrong Sheet", "part": "PART FOUR: THE NIGHT OF THE NORTH WIND", "paras": ["*The Owl Alley Sheet, No. 18. Today's news: the wrong sheet reached the street first.*", "\"The fire started at the tofu shop!\" Bunta’s voice boomed, shaking the frost off the eaves. \"Sources say it began with the tofu maker’s careless brazier! The heat escaped, the wood caught, and the whole street is in ruins!\"", "Haru’s stomach dropped into her sandals. The wet ink on the sheet gleamed in the weak morning light. Bunta was not smiling. His face, hidden by the brim of his straw hat, was tight and serious. He looked down the alley, past Haru, toward the row of wooden houses. He had seen who was standing in front of him. He had seen the empty lot where Umekichi’s shop had been.", "The voice slowed. It did not crackle with excitement. It was flat, heavy, and final.", "\"Listen to the words,\" Bunta said, tapping the paper with his fan. \"The Turtle House knows the truth. The Turtle House always knows.\"", "Haru felt the cold bite through her sleeves. The air smelled of wet ash and burnt timber, a sharp, acrid tang that stuck to the back of her throat. She looked at the crowd gathering behind the seller. They were quiet. They were listening. And they were looking exactly where Bunta wanted them to look."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["The crowd turned. Slowly, like a single wave breaking against the shore, their faces shifted toward the end of the alley. Umekichi stood there, his white apron still on, his huge forearms hanging at his sides. He had not slept. He had been helping pull the shop down, and now he stood in the ash, waiting for help to build it back up.", "A woman in a grey kimono stepped back. Her hand went to her mouth. A man muttered something low to his neighbor. No one shouted. No one threw a stone. That was the worst of it. It was a quiet, collective turning away.", "Osen, small and quick in her dark green kimono, reached out and grabbed Umekichi’s sleeve. Her fingers were trembling. Umekichi looked at her, then at the crowd, then at the empty space where his life’s work had been. He stood as if someone had struck him with a heavy mallet, rigid and stunned. The silence in the alley was louder than any bell."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["Haru knew exactly who was wrong. She knew the wind. She knew the cracked chimney cap. She knew the tired boy who must have left the ash door ajar. But looking around the alley, she saw that nobody else knew what she knew. They only had Bunta’s loud voice and a fresh sheet of paper.", "She walked quickly. Her straw sandals slapped against the wet road, a sharp, rhythmic sound in the quiet street. She crossed the alley to the Turtle House, where the glossy door curtain hung still.", "Jiro was sitting on the step. He had not changed his yellow silk kimono, but it looked tired, creased and dull. In his lap sat a stack of unsold sheets. He did not look up when Haru approached. He looked at the paper in his lap, and then at her, his eyes red-rimmed and wide.", "\"Your father wrote this,\" Haru said. It was not a question.", "Jiro nodded. He picked up one sheet and held it out to her. \"He wrote it in the night,\" he said, his voice rough. \"From what people said in the crowd. I told him it was not confirmed. I told him to wait.\""], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["Jiro said no more. He looked down at his hands, which were clean and pale, a sharp contrast to the black smudges staining Haru’s fingers. He looked small, and he looked ashamed, really and truly ashamed.", "It startled her. She had expected anger, or pride, or a sneer, but not this quiet, heavy shame that seemed to sit on his shoulders like a wet wool blanket.", "Haru took the stack from him. She did not take just the top sheet; she took the whole pile, holding the thin paper against her hip.", "\"Help me print the truth,\" she said.", "Jiro swallowed, his throat moving once. \"My father will never allow it,\" he said softly. \"He sells excitement. He will not sell a correction. He will not sell a lie that was almost true.\"", "Haru looked at him for a moment, then reached out and placed the stack of papers back into his lap with a soft rustle. She did not ask for permission, and she did not ask for his father’s name, because she knew it would not matter.", "\"I am not asking your father,\" Haru said."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["Haru walked home through the ash. The air was still cold, but the wind had died down, leaving only the faint scent of smoke. She stepped into the shop, her breath coming fast.", "Father Sota was at the low table. He looked up, his face calm. He took the booklet from her belt. He did not look at her. He read the pages, from the first entry about the noodle rumor to the last line about the wind. He read slowly, his lips moving slightly.", "When he finished, he closed the booklet. He looked at Haru.", "\"Is that everything?\" he asked.", "Haru nodded. \"Yes. The wind. The chimney. The door.\"", "Father Sota leaned back. He rubbed the back of his neck, a small, unconscious gesture.", "\"Is that the whole truth?\" he asked.", "Haru stopped. Her hand went to her throat. She thought of Shin. She thought of the soot on his arms, and the yawn he had tried to hide, and the fact that he was only nine years old. The truth was there, in the booklet. But the whole truth was in the boy’s eyes."], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "What Haru Saw", "part": "PART FOUR: THE NIGHT OF THE NORTH WIND", "paras": ["*The Owl Alley Sheet, No. 19. Today's news: the whole truth is heavier than half of it.*", "The shop was so quiet that Haru could hear the snow settling on the roof tiles. The drying lines hung still, pale sheets motionless in the cold air. She stood in the center of the room, her fingers drumming against the edge of the printing bench. Her father, her mother, and her grandfather waited.", "\"The spark came out of the furnace door, and the wind carried it,\" Haru said. Her voice stayed steady, though her hands trembled inside her sleeves. \"I saw the crack in the cap. I saw the pile of cherry-wood shavings right next to the furnace. And I saw the ash door. It was open.\"", "She swallowed, the taste of dry paper dust in her mouth. The air felt heavy, thick with unspoken things.", "\"And I saw Shin,\" she continued, looking at her father. \"He was holding a bucket. He was so tired. He was only nine.\" She looked down at her feet. \"If I print this, everyone will know it was Shin. He left the door open. If I do not print it, then my sheet is only half a truth.\"", "Kichi, who had been sitting on the bench, stopped chewing his cold rice cake. He looked at Haru with wide eyes, the crumb forgotten on his chin.", "\"The half truth,\" Haru whispered, \"is still a lie.\""], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["Grandfather Tobei rubbed his bad shoulder. His eyes stayed fixed on the knife resting on the table.", "\"A half truth,\" he said, his voice dry as old wood, \"is a lie that has learned to be quiet. It is not better. It is just smaller.\"", "Mother Okiyo stepped forward. She placed a hand on Haru’s shoulder. \"The whole truth does not have to be the cruelest thing you can say,\" she said softly. \"You can choose what stands out in the light.\"", "Father Sota said nothing. He reached across the table and picked up the smallest carving knife. He held it out to Haru. The metal was cold and smooth.", "\"Cut away what does not belong,\" Father said. \"Leave what is true standing.\"", "Haru took the knife. It felt heavy in her palm, like a stone from the canal bed. She looked at the blank block of cherry wood beside it. She could carve the crack. She could carve the wind. She could carve the sparks. But she could leave out the boy. The truth could stand tall without a name."], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["But leaving a name out was not enough. Haru knew that. She thought of Hachi, the bathhouse owner. She could hear his voice in her head, loud and rough. If he saw the word \"furnace\" on the sheet, he would be ashamed. And shame, Haru knew, was a thing that looked for a place to hide. He might blame Shin. He might send the boy away. Or worse, he might say nothing, and let the whole street believe the boy had been reckless.", "Haru set the knife down. She picked up her little booklet. The paper was soft from her hands.", "\"I have to tell him first,\" she said.", "\"Tell him what?\" Kichi asked.", "\"Tell him the truth,\" Haru said. \"Before the ink touches the paper. Before the sellers go out. I have to stand in front of him and say it with my own mouth.\"", "She tucked the booklet into her apron. Her heart was beating again, but this time it was not from fear. It was from purpose. She knew what she had to do. She had to be the first to speak the hard part."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["The bathhouse looked like a dark, heavy shape in the grey morning light. Thin smoke still curled from the chimney. Haru pushed the door open, and it creaked loudly in the silence. The air inside smelled of wet stone and old water.", "Hachi sat on a low beam near the changing area, his head buried in his hands. He wore his dark navy coat, and his thick eyebrows were furrowed tight. He did not look up when the door slid.", "Haru took a step forward. Her voice came out small at first, barely louder than a mouse squeak.", "\"Master Hachi,\" she said.", "He did not move. Haru took a deep breath, stood up straighter, and looked at the floor.", "\"I saw the crack in the chimney,\" she said, her voice steadier now. \"I saw the wind push the sparks. I saw the ash door that would not close. And I saw Shin.\" She paused for a moment. \"They were small things that happened together. It was not one person's fault.\"", "Hachi lowered his head further into his palms, and his shoulders shook, just once, like a leaf in a sudden gust.", "\"It does not have to be one person's fault at all,\" Haru added."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["Hachi lifted his head. His eyes were red and swollen, the skin under them puffy and white. For a moment, he did not look like the big, loud man who ran the bathhouse. He looked like someone who had not slept in weeks.", "\"I have known about the crack since autumn,\" he said. His voice was rough, scraped raw by silence. \"I was waiting for the wind to die. I was wrong.\"", "He moved to stand, and then stopped. He looked past Haru, toward the shadowed corner by the wall where the light did not reach.", "Shin was there.", "The boy had been hiding in the dark. He stood up slowly. His soot-grey jacket was dusty, while his bare arms remained black with soot. He was trembling, his knees knocking together with a soft, wooden sound, but he stood very straight.", "\"It was me,\" Shin said. His voice was quiet but clear. \"I left the door open. I was so tired.\"", "He did not look at Haru. He looked at Hachi, and the old man looked back at him. The heavy silence in the room suddenly felt different. The weight lifted from Haru’s shoulders, leaving the air feeling thin and sharp."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "The Sheet That Told the Truth", "part": "PART FOUR: THE NIGHT OF THE NORTH WIND", "paras": ["*The Owl Alley Sheet, No. 20. Today's news: the ink did not freeze.*", "Hachi reached out and placed his large, rough hand on Shin’s head. He did not shake him. He held him there, steady, while the cold air bit at their faces.", "\"The fault is mine,\" Hachi said. His voice was not loud, but it carried across the wet ash. \"I asked a child to do a man’s work. I was wrong to let him stand alone in the dark.\"", "By now the neighbors had drifted to the doorway, and more stood behind them in the ash. He turned to them. Umekichi stood with his arms crossed, his white apron stained with soot. Osen stood very straight behind him, her jaw tight.", "\"And the tofu maker did nothing wrong,\" Hachi added, looking directly at Umekichi. \"The wind started it. Not his brazier.\"", "A murmur rolled through the alley, soft and confused, like dry leaves scraping against a stone wall. Umekichi lifted his face. The redness in his eyes was no longer anger. It was shock. Osen’s shoulders dropped. She let the tension leave her body. A single tear cut a clean line through the dust on her cheek. She did not wipe it away. She just looked at her husband, and then at the broken roof, and finally at Haru, who stood small and solid in the middle of the street."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["The shop door slid open, and the cold rushed in, followed by Jiro. He wore his yellow silk kimono, bright and clean in the dim light. Under his arm, he held two heavy wooden blocks.", "\"Use ours,\" Jiro said, nodding at Father Sota’s carving table. \"Ours are faster.\"", "Father Sota looked up. He looked at the blocks, then at Jiro’s serious face. He nodded once.", "For the next few hours, the Owl Alley print shop did not sleep. Father carved the correction, his knives clicking softly against the cherry wood. Grandfather Tobei stood at the printing bench, his hand steady on the baren, guiding the pressure. Kichi printed until his arms shook, his moss-green coat damp with sweat. Mother Okiyo mixed the black ink, stirring it until it shone like night sky.", "Jiro printed beside them, his yellow sleeve brushing against Kichi’s green one. They did not speak. They did not need to. The paper flew from the block, damp and black, and hung on the lines like a storm of wings. In the doorway, Master Kuroda stood for a long moment with his arms folded, reading the first wet sheet. Then, without a word, he stepped out of his geta and came in."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["At dawn, Bunta and Gohei were already in the street. Bunta’s voice boomed over the frozen ground, ringing off the wooden walls.", "\"Read it! The truth of the fire!\"", "He held up the sheet. It did not shout. It did not blame. It listed what began the fire, what stopped it, who lost a shop, and who needed help. It was simple, clean, and true.", "Master Ito, the ward headman, stood in the crowd. He wore his dark formal coat, looking stern and neat. He took a copy from Bunta and read it. His eyes moved slowly across the page. He looked at Umekichi, who stood with his head bowed. He looked at Hachi, who nodded once.", "\"This is fair,\" Master Ito said. His voice was quiet, but the street went silent. \"From now on, I will read the Owl Alley Sheet first. That is the price of being allowed to print.\"", "Haru understood. It was not a gift. It was a promise."], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["The weeks that followed smelled of fresh wood and sawdust. The neighbors raised a new tofu shop, board by board. Captain Daigoro, square and cheerful in his leather-hooded coat, lifted the biggest beam with a grunt that sounded more like a song.", "Hachi mended the chimney cap. He hired two new boys to help Shin. Shin worked half a day, then went to school in the afternoons. He was thinner, but he smiled more.", "Across the alley, Jiro and Haru began to trade sheets. His were wonderful now. They were true stories that sounded like wonders. A cat caught in a tree. A neighbor who lost a hat. Small things, written with care.", "Haru watched them fly across the gap between the shops, fluttering in the gentle wind. They were not weapons. They were bridges. She tapped her brush against her teeth, thinking about how small a piece of paper could be, and how heavy it could feel when it landed in the right hand."], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["On the eve of spring, the alley threw beans at the door.", "\"Demons out!\" they shouted. \"Good fortune in!\"", "Haru stood in the shop, her thumb healed, her fingers strong. She held a small block of cherry wood. It was not a calendar. It was not a news sheet. It was an owl, carved with care. She inked it, dampened the paper, and laid it down.", "Grandfather Tobei stood beside her, rubbing his shoulder. He looked at the block, then at her.", "\"The edge is truth,\" he said, his voice dry and soft. \"The hand is kindness. You have both at last.\"", "Haru pressed the baren, hard and even. The ink sank into the fiber. She lifted the paper and hung it on the line. It was a warm morning. The ink in the pot was soft and black. It did not freeze."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "The Ink Froze in the Pot", "part": "PART ONE: INK", "page": 1}, {"n": 2, "title": "The Fox Wedding on the Bridge", "part": "PART ONE: INK", "page": 6}, {"n": 3, "title": "Soot-Sweeping Day", "part": "PART ONE: INK", "page": 11}, {"n": 4, "title": "Buckwheat and Water", "part": "PART ONE: INK", "page": 16}, {"n": 5, "title": "A Small Coin for the Truth", "part": "PART ONE: INK", "page": 21}, {"n": 6, "title": "The Year-End Rush", "part": "PART TWO: FAST PAPER", "page": 26}, {"n": 7, "title": "The Girl Who Was Right", "part": "PART TWO: FAST PAPER", "page": 31}, {"n": 8, "title": "The Sharp Sheet", "part": "PART TWO: FAST PAPER", "page": 36}, {"n": 9, "title": "The Edge and the Hand", "part": "PART TWO: FAST PAPER", "page": 41}, {"n": 10, "title": "Soba at the End of the Year", "part": "PART TWO: FAST PAPER", "page": 46}, {"n": 11, "title": "A Thumb of Cherry Wood", "part": "PART THREE: THE SHARP KNIFE", "page": 51}, {"n": 12, "title": "Yaki-imo for a Rival", "part": "PART THREE: THE SHARP KNIFE", "page": 56}, {"n": 13, "title": "The Bathhouse Steps", "part": "PART THREE: THE SHARP KNIFE", "page": 61}, {"n": 14, "title": "The Wind That Would Not Stop", "part": "PART THREE: THE SHARP KNIFE", "page": 66}, {"n": 15, "title": "Captain Daigoro's Pole", "part": "PART THREE: THE SHARP KNIFE", "page": 71}, {"n": 16, "title": "The Bell in the Night", "part": "PART FOUR: THE NIGHT OF THE NORTH WIND", "page": 76}, {"n": 17, "title": "The Tofu Shop Comes Down", "part": "PART FOUR: THE NIGHT OF THE NORTH WIND", "page": 81}, {"n": 18, "title": "The Wrong Sheet", "part": "PART FOUR: THE NIGHT OF THE NORTH WIND", "page": 86}, {"n": 19, "title": "What Haru Saw", "part": "PART FOUR: THE NIGHT OF THE NORTH WIND", "page": 91}, {"n": 20, "title": "The Sheet That Told the Truth", "part": "PART FOUR: THE NIGHT OF THE NORTH WIND", "page": 96}]};

const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
</body>
</html>
