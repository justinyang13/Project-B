<script>
const D = {"title": "Haru and the Paper That Told the Truth", "sub": "One Print Shop, One Windy Winter and One True Sentence", "pages": [{"no": 1, "ch": 1, "ctitle": "The Ink Froze in the Pot", "part": "PART ONE: INK", "paras": ["*The Owl Alley Sheet, No. 1. Today's news: the ink froze in the pot.*", "On the coldest morning of the year, the ink in the Owl Alley print shop froze solid, and the first person to find out was Kichi, who put his brush into the pot and got it stuck there like a spoon in a bowl of ice.", "\"It is not my fault,\" Kichi announced to the whole room, which was already awake and already cold.", "Haru had come down the ladder from the sleeping loft in her thickest kimono, with her breath smoking in front of her like a small private cloud. She looked at the pot. She looked at Kichi. She looked at the brush standing straight up out of the black ice like a tiny flagpole.", "\"That,\" she said, \"is the truest thing I have ever heard you say.\"", "Everybody laughed except Kichi, who was fourteen, gangly and the printer's apprentice, and who had not eaten yet, and so was not at his best."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["Haru was eleven, and she had lived in this shop for every one of those years. She could have found her way through it with her eyes shut, and often did, on the mornings when the lamp had not been lit.", "It was one long room. At one end was a low carving table, worn smooth and dark by her father's elbows. Along the walls stood shelves of cherry-wood blocks, each one carved with a picture or a page of words, each one waiting for its turn. Across the ceiling ran the drying lines, and from them hung sheets of paper, hundreds of them, pale as laundry. The whole place smelled of ink, wet paper and the sweet, clean curls of wood that lay like pale ribbons on the floor.", "Her mother, Okiyo, was crouched by a small charcoal brazier with the ink pot in her hands, warming it slowly and laughing behind her sleeve at Kichi. Her father, Master Sota, sat at the carving table with a knife and did not look up at all. He carved the way other people breathe, steadily and without noticing."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["By the brazier, wrapped in a blue-grey quilted coat, sat her grandfather. Grandfather Tobei was thin and a little bent, with a bald head, a small white topknot and eyebrows so bushy that they seemed to have opinions of their own. He rubbed his right shoulder, as he did every cold morning.", "\"The best printer on Owl Alley,\" Haru's father liked to say, \"and it is the shoulder that stopped him.\" Grandfather Tobei always answered that it was not the shoulder, it was sixty years of rubbing paper with a baren, and that any shoulder would have complained.", "The baren was a flat round pad of coiled cord in a sheath of bamboo leaf. You pressed the back of a damp sheet of paper with it, hard and even, until the ink from the carved block sank into the paper. He was teaching Haru how to use it, a little each day.", "\"This shop makes calendars,\" he said now, holding out his hands to the fire. \"It makes greeting sheets, notices, and pictures for children. And now and then, when something truly happens, it makes a small news sheet. Which is the one that gets us into trouble.\"", "\"Only a little trouble,\" said Haru.", "\"That,\" said Grandfather Tobei, \"is how all trouble starts.\""], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["Haru had a job too, and she loved it more than anything. She was the shop's ears.", "Every morning, after the first sheets were hung, she tied her little booklet to her belt. It was made of folded paper sewn with string, and the pages were a little grubby and a little ink-stained, because she wrote in it with a small brush. Then she went out to the well, the bathhouse steps and the noodle stall at the canal end, and listened. People talked in front of children as if they were furniture. She had heard about lost cats, a wedding, three arguments over a fence and one very interesting secret about a pickle.", "She wrote down what she heard, and then she took the booklet home to her father, who read it slowly and asked the same question every single time.", "\"Did you see it with your own eyes?\"", "Sometimes the answer was yes. Often it was not. Then he shook his head and said the family rule, which was carved, in a way, into every one of them: \"We print what happened. We do not print what people say happened.\""], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["That morning she had nothing to tell him. No cat, no wedding, no pickle. But as she stood by the frozen pot with her hands tucked in her sleeves, a thought arrived.", "\"Father,\" she said. \"We could put it on the sheet.\"", "Master Sota looked up from his knife. \"Put what?\"", "\"The ink. The pot. The ink froze in the pot.\" She held up her booklet, with the words already written in small, stern brushstrokes. \"It happened. I saw it with my own eyes. I saw Kichi's eyes too, and they were very wide.\"", "There was a long silence, and then something happened at the corner of her father's mouth that in another man might have been called a smile. He drew a fresh block toward him and lifted his knife.", "He had just made the first cut when a door slid open across the alley, and a big voice began to shout something, very loudly, about foxes."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Fox Wedding on the Bridge", "part": "PART ONE: INK", "paras": ["*The Owl Alley Sheet, No. 2. Today's news: foxes were not seen at any wedding.*", "The voice was round and loud, bouncing off the wooden walls of Owl Alley.", "\"The foxes danced! The foxes danced on Willow Bridge!\"", "Bunta stood in the street, his deep straw hat pulled low over his eyes. He waved a paper sheet high above his head. Around him, a crowd had gathered. There were women with baskets, men with tools, and one very large cat who watched with unblinking interest.", "Haru squeezed through the legs of the people to get a better look. Bunta’s voice rose like steam from a pot. \"Lanterns! Silk robes! A wedding of spirits! All true!\"", "Beside him stood Gohei, thin as a reed. He did not wave. He did not shout. He watched the street corners. He watched the alley behind the tofu shop. He watched for men in dark coats, the magistrate’s men, who did not like unlicensed news.", "\"Why the hats?\" Haru whispered to Mother Okiyo, who was leaning out the shop door.", "\"Privacy,\" Mother said, smiling. \"And pairs. Two are harder to ignore than one. But harder to catch, too.\"", "Bunta turned the paper over. The ink was still wet. It smelled of pine soot and ambition."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["Haru dug into her sleeve and found a small copper coin that felt heavy and cold. She had saved it for three weeks, turning it over in her palm until the edges felt smooth. She pressed it into Bunta’s hand, and he handed her the sheet, which was thick paper that felt expensive.", "Haru looked down. The picture was beautiful. Two foxes sat on a bridge, wearing tiny, intricate robes with lanterns hanging from their paws. The carving was fine, the lines crisp, and the foxes looked soft and proud. It was not just news; it was art.", "Haru felt a hot prick in her chest. She wanted to be angry at the lies, and she wanted to be angry at the sellers, but mostly she was angry that it was so well made. Her father’s blocks were honest and sturdy, but they did not make her heart stutter. She tucked the sheet into her apron, and the paper rustled against her hip like a soft, dry whisper."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["Later, at the carving table, Master Sota was slicing a cherry-wood block, the knife making a soft scraping sound against the grain.", "\"Did you see it?\" he asked without looking up.", "\"Did I see the foxes?\" Haru asked.", "He nodded, the wood shaving curling away from the edge.", "\"No,\" Haru said. \"I crossed Willow Bridge last night on the way home from the bathhouse. It was foggy. I saw one cat that looked confused, and two broken lanterns hanging from a fence. I saw fog. I saw cold.\"", "Master Sota set his knife down and wiped his hands on his cloth, the motion slow and deliberate.", "\"Most people know a story when they see one,\" he said quietly. \"They buy it because it is warm. They do not check the wood grain.\"", "\"Not everyone,\" Haru said, her voice sharp as a chip. She tapped her brush against her teeth. \"Some people need to be told. Some people think the bridge is actually made of foxes.\"", "Master Sota looked at her, his eyes steady and calm. He picked up his knife again, the blade catching the light from the window.", "\"Then we must tell them,\" he said. \"But tell them true.\""], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["The door curtain slid aside, and Jiro stepped out onto the stone step of the Turtle House. He was twelve, neat and proud, wearing a bright yellow silk kimono with a black diamond pattern. His hair was tied in a small topknot, and he fanned himself with a silk handkerchief, though the air was biting.", "\"Haru,\" he said, his voice light. \"How did your sheet sell?\"", "Kichi, who was drying his hands on a towel, leaned over the counter. \"Eleven,\" he said. \"We had eleven buyers. Jiro, did you sell more?\"", "\"By noon, we were out,\" Jiro replied. He smiled, a thin, proud expression. \"The foxes are very popular. They are polite, too. They never complain about the ink.\"", "Kichi grinned. \"That is good. Foxes make excellent proofreaders. They catch every smudge.\"", "Jiro’s smile did not waver. He looked at Haru. She did not smile back, but her eyes stayed fixed on his bright yellow sleeve.", "\"Eleven is a lot for a lie,\" Haru said.", "Jiro’s fan stopped moving. He tucked it neatly into his obi. \"Eleven is a lot for a truth,\" he said. \"It depends on who is listening.\""], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["That night, Haru lay in the sleeping loft. The wood creaked above her. Below, she could hear the shop settling into sleep. The smell of dried ink and cherry wood curled around her.", "She held the fox sheet in her hands. The paper was smooth. The foxes looked up at her from the dark.", "Grandfather Tobei had come up to check on her. He sat on the edge of the loft, his bad shoulder rubbing against the wood.", "\"A fast paper runs,\" he said. His voice was low and dry. \"It moves quickly. It sells well. But it leaves no footprint.\"", "Haru looked at the blank sheet in her hand.", "\"A true paper lasts,\" he continued. \"It sits on a table. It is read again. It does not run. It stays.\"", "He stood up, his wooden stick tapping the floor.", "\"The question, Haru, is not whether you have the truth. You have it. The question is whether you have the hand to hold it steady.\"", "He left her in the dark. She turned the fox sheet over. The back was blank. She thought about what it would take to fill it with something that stayed."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "Soot-Sweeping Day", "part": "PART ONE: INK", "paras": ["*The Owl Alley Sheet, No. 3. Today's news: one hundred years of soot came down.*", "The brooms were made of dried bamboo, stiff and scratching. They hissed against the wooden floors. Today the whole house turned inside out.", "Haru’s job was the most dangerous task in the shop: cleaning the block shelves. She had to wipe the dust from the cherry wood without touching a single carved face. One slip, one smudge, and a week of work would be lost.", "Outside, the alley shook with laughter. Neighbors held a large, flour-dusted helper. They roared. They tossed him into the air. A cloud of white powder puffed around his head. He landed on a pile of mats, coughing and grinning.", "\"Look at him,\" Kichi laughed, wiping flour from his nose. \"He looks like a snowman that lost its carrot.\"", "Rice cakes were passed around, warm and slightly sticky. Haru bit into one. Sweet bean paste filled her mouth. The shop was bright. Dust motes danced in the light. The air smelled of clean wood and fresh rice."], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["The well at the end of Owl Alley was the heart of the street. By midday, half the neighborhood stood there. Buckets clanked. Voices rose and fell in the cold air.", "Okiku, the noodle maker, tied a white towel around her grey hair. She laughed at a story about a cat. Umekichi, the tofu maker, leaned on his wife Osen’s arm. His huge forearms rested on the stone rim. He was broad and cheerful, his white apron already stained with bean pulp.", "From the bathhouse came Hachi, the owner. He had thick eyebrows and a loud voice. He carried a towel over his shoulder. He looked as if he had just finished arguing with the wind itself. Beside him stood Shin, the furnace boy.", "Shin was small. Soot-streaked. He yawned so wide it seemed his jaw might unhinge.", "\"Sleepyhead,\" Hachi said. But gently.", "Shin yawned again. He rubbed his eyes with black fingers. The sun was warm on their faces. Haru listened. Her booklet hung at her belt. The street was a web of voices, smells, and lives intertwined."], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["Haru sat on the bathhouse steps, her brush tapping her teeth. She was listening.", "The conversation shifted. Okiku was not there, but her name was. A woman with a sharp voice leaned toward another. \"Did you taste the soba this week? It was grey. Not the nice, pale color.\"", "The second woman nodded slowly. \"My cousin said the same. She said it was rough. Like sand in the flour.\"", "A third voice, low and cautious, added, \"They say she mixes it with something else. Something cheaper. To save money.\"", "Haru’s hand moved to her booklet. She wrote the words down quickly. *Soba is grey. Rough. Mixed with sand.* Then she paused. Her brush hovered.", "None of them had said they had seen it. None of them had said they had tasted it themselves. They were repeating what they had heard. The words felt thin in her hand, like wet paper that might tear. She crossed out the sentence. The ink bled slightly into the fiber."], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["Back in the shop, the smell of ink was sharp and clean. Father Sota sat at the carving table, his knife still in his hand. He did not look up when Haru entered.", "\"I heard a rumor,\" Haru said, placing the booklet on the table. \"About Okiku’s noodles.\"", "Father Sota set his knife down. He wiped his hands on his dark brown coat. \"Three questions, Haru. Did you see it with your own eyes?\"", "Haru shook her head. \"No.\"", "\"Who said it first?\"", "\"I don't know. Several people said the same thing.\"", "\"And what does the person gain by saying it?\"", "Haru frowned. She had not thought of that. \"Nothing?\"", "Father Sota picked up a small block of wood. \"If you want to write about noodles, Haru, go and watch noodles. Not the talk. The work.\" He pointed to the door. \"The truth is not in the air. It is in the hands that make the thing.\""], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["Dusk turned the alley purple and orange. Haru walked to the canal end, where the air tasted of woodsmoke and boiling water.", "Okiku’s stall glowed under a single lantern. The broth hissed and steamed in thick white clouds, curling up into the cold. Okiku stood by the pot, her back to the street. She hummed a low, steady tune. Her hands moved with the rhythm of years.", "Haru stood at the edge of the crowd. Her booklet hung heavy at her belt. It felt like a stone. The women whispered around her, their voices soft and sharp. Haru had no questions for them. She had a question for the woman who worked.", "She took a slow breath. The cold bit her lungs. Then she stepped forward, her straw sandals clicking on the wet stone.", "\"Okiku-san,\" she said. Her voice was steady, though her heart beat like a drum in a festival. \"May I watch you make them?\"", "Okiku turned. Her face was unreadable. She looked at Haru’s ink-stained fingers. Then she looked at her eyes. The steam rose between them, blurring the world for a moment, like a breath on a cold mirror."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "Buckwheat and Water", "part": "PART ONE: INK", "paras": ["*The Owl Alley Sheet, No. 4. Today's news: noodles were found to be noodles.*", "\"Sit,\" Okiku said, pushing a low stool toward Haru. It wobbled, then steadied.", "Haru sat, and the wood was cold through her kimono. Okiku did not speak for a moment. Instead, she untied the rope on a heavy sack of flour. It was dark grey, almost black, with a dusty scent that smelled of earth and rain.", "\"This is the new flour,\" Okiku said, tapping the side of the bag. \"Stone-ground this season. It is grey because it is fresh. It is not sawdust.\"", "She mixed the flour with a little wheat flour and water, and the dough became sticky and soft. She kneaded it with her palms, pushing and folding in a steady rhythm. Haru watched the hands. They did not shake; they moved with the confidence of someone who had done this a thousand times.", "Okiku rolled the dough into a long, thin rope, folded it, and cut it. The pieces fell onto the tray, pale and grey and perfect.", "\"Look,\" Okiku said. She held up a single strand. \"It is only buckwheat. It is only water. It is only time.\"", "Haru reached out and touched the dough. It was cool and smooth. She smelled it. There was no sawdust, no trick, only the honest, dusty scent of the new season."], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["\"Who started the talk?\" Haru asked.", "Okiku stopped kneading. She leaned against the counter, letting her shoulders drop until they felt heavy with the day's labor. \"It does not matter who started it,\" she said, her voice dropping to a quiet, careful whisper. \"A rumor is a hard thing to sweep away. It gets into the cracks of the wooden floor, and then it gets into the soup.\"", "Haru watched Okiku’s hands resting on the edge of the counter. They trembled with a small, quick vibration, like a leaf caught in a sudden gust of winter wind.", "\"I saw the flour,\" Haru said, tapping her brush against her teeth to keep her voice steady. \"I saw the hands. I saw the water.\"", "Okiku looked at her. Her eyes were wet, but she did not cry. Instead, she picked up the ladle and poured the hot broth into a bowl, letting the steam rise up to hide her face for a moment.", "\"Then you know,\" Okiku said. \"And you will make them know.\"", "Haru stood up, and the stool scraped sharply against the stone floor. She felt a strange mixture of lightness and weight, as if she were holding something very small and very important in her ink-stained fingers.", "\"Goodbye, Okiku-san,\" Haru said.", "\"Go,\" Okiku replied. \"Before you change your mind.\"", "Haru ran. Her straw sandals slapped against the wet pavement, and the cold air hit her face, but she did not feel it. She was too busy thinking."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["The shop was quiet, and the lamp burned low against the darkening room. Haru rushed in, her cheeks red from the cold and her breath still smoking.", "\"Father,\" she said. \"We must print a sheet. Tonight.\"", "Master Sota did not look up from his carving. \"A sheet is three things,\" he said, his knife moving in a steady, smooth line. \"A picture. A headline. And the truth.\"", "\"In that order of difficulty,\" Haru replied.", "Father nodded, and the corner of his mouth twitched. \"Yes.\"", "Haru took out her booklet and her brush, but she did not write words first. She drew Okiku standing by the counter, then the heavy bowl of noodles, and the steam rising in a gentle swirl. She made the lines strong and clear, exactly like the ink strokes Grandfather Tobei used to correct her copywork.", "Then she wrote the headline.", "\"Okiku's noodles are grey because the flour is new. They are buckwheat, wheat and water. Nothing else.\"", "She held the paper up to the light. The words were small and neat, not sharp or loud, just true.", "Father looked up. He studied the drawing, then the words, and finally set down his knife.", "\"Good,\" he said. \"Now we carve.\""], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["Father set the block on the bench and picked up his knife, a small, sharp tool no bigger than a finger.", "\"Watch the wood,\" he said.", "He did not carve the lines. Instead, he cut away everything around them. Thin, pale ribbons of cherry curled up, smelling faintly of rain, and fell onto the floor in a soft, silent pile.", "Haru watched the blade move with a steady, sure rhythm. There was no waste in the motion, and no fear. He carved the outline of the bowl, then the rising steam, then Okiku’s face.", "Then he stopped, turned the block over, and made two tiny notches at the corner.", "\"What are those for?\" Haru asked.", "\"Kento marks,\" Father said. \"Registration marks. They keep every sheet in exactly the same place, so the steam stays in the same spot. So the truth stays in the same place.\"", "Haru looked at the small, perfect notches.", "\"Precision,\" she whispered.", "Father smiled, a small expression hidden behind his white headband.", "\"Yes,\" he said. \"Precision.\""], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["Kichi held the sheet over the steam from a small pot until it softened, then laid it gently on the inked block. He looked up at Haru and asked if she was ready.", "She nodded, reaching for the baren, but Grandfather Tobei was already there. He had said nothing, yet he placed his hand over hers, his fingers cold and dry against her skin.", "\"Even pressure,\" he murmured. \"No hurry. Let the ink sink. Let the paper listen.\"", "Haru moved the tool in a slow circle, feeling the cord rub the damp surface. She sensed the grain of the wood underneath and the lines her father had carved. When she stopped, she peeled back the corner carefully.", "The picture was there: Okiku’s face, the bowl, the rising steam. It was clear, sharp, and beautiful. Haru’s eyes stung, and she blinked hard before she could speak. The truth sat right there on the wet paper, and it felt heavy and wonderful all at once.", "\"Good,\" Grandfather Tobei said. \"Now we dry it.\""], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "A Small Coin for the Truth", "part": "PART ONE: INK", "paras": ["*The Owl Alley Sheet, No. 5. Today's news: the alley went back for noodles.*", "The sheets hung all night, stiff and pale, waiting for the cold to pass. At dawn, Haru and Kichi carried them in a woven basket to the canal end. The air tasted of frost and fish.", "Haru opened her mouth to call out the news. Her voice came out thin, like a mouse squeak behind a door. She tried again. Nothing.", "Kichi, who had eaten three rice cakes on the way, took a sheet and rolled it into a horn. \"News! News! The noodles are clean! The rumor is a lie!\"", "A woman stopped, clutching her straw hat. \"Is it true?\"", "\"I saw it with my own eyes,\" Haru said, loud and steady this time.", "Kichi added, \"It’s a real story. No foxes, no ghosts, just flour and water. Better than a rumor, and half the price.\"", "The woman laughed, a bright, startled sound. She pulled a small coin from her apron. \"I’ll take two. One for me, one for my sister-in-law who believes everything.\"", "Haru smiled, her cheeks hot. The truth had a voice, and it was Kichi’s."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["Bunta, the big seller with the deep straw hat, stopped mid-step. He did not buy a copy. He took one from the basket, unrolled it, and began to read.", "\"The Owl Alley Sheet,\" he boomed, his voice rolling over the packed earth of the alley. \"The claim: Okiku’s noodles are made with sawdust. The proof: none. The truth: pure buckwheat, wheat and water, witnessed by a girl with ink-stained fingers.\"", "He looked up. \"I have sold many sheets. This one is quiet. But it is right. I will not charge you. Read it yourselves.\"", "Gohei, thin and watchful, kept his eyes on the alley mouth, checking for officials. But the crowd did not move. They stood still, listening to the words hang in the cold air. For a moment, the noise of the street faded, and only the sound of Bunta’s voice remained, steady and clear.", "Haru watched the people’s faces. They were not laughing. They were thinking. The truth had landed, and it stayed."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["Okiku was waiting at her stall. She did not look surprised. She took the sheet from a customer, read it, and then stood very still. Her hands, usually quick and busy, rested on the counter.", "Then she turned to the pot, cut a fresh slab of noodles into a bowl, and set it before the first person in line. \"Eat,\" she said. \"No coin. The truth is free.\"", "The line grew. Haru stood at the back, watching. The broth was hot, the noodles slippery and strong. She tasted them. They were the best she had ever had, not because they were sweet, but because they were honest.", "Kichi slurped loudly. \"I was hungry,\" he said, as if that explained everything.", "Okiku looked at Haru, and for a second, her eyes were soft. \"You saved my name,\" she said quietly. \"That is worth more than a year of coins.\""], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["The whisper died. The man who had claimed his cousin heard the rumor came by, bought a bowl, and ate quickly without meeting anyone’s eyes. He paid with a heavy coin and slipped away into the crowd.", "Grandfather Tobei sat on the low step, his blue-grey kimono draped over his knees. He watched the street.", "\"A rumor,\" he said, \"takes a day to travel a street. It takes a year to leave it.\" He tapped his walking stick on the stone. \"But today is the first day of leaving. You pushed it out with your feet.\"", "Haru felt a warmth in her chest that had nothing to do with the soup. She looked at her hands. They were clean, except for the faint ring of ink around her nails. She had done this. She had seen, and she had spoken, and the world had changed, just a little.", "Kichi was already asking if there were more noodles."], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["From across the alley, on the high step of the Turtle House, Jiro watched. He stood in his bright yellow silk kimono, his hands tucked into his sleeves. He did not look angry. He looked bored.", "\"Nobody reads true things,\" he called down, his voice smooth and cold. \"They read exciting things. Foxes. Ghosts. Things that make their hearts beat fast.\"", "He tilted his head. \"In a month, you will see. The truth is quiet. Quiet doesn’t sell.\"", "Haru held her booklet against her chest. The paper was cool against her stomach. She wanted to argue. She wanted to say that quiet things last longer. But the words stuck in her throat.", "He might be right. The Turtle House sheets had sold out by noon, every single day. Haru looked at the empty space where the crowd had been. She did not believe Jiro. But she was not sure, either. And that doubt felt like a splinter under her skin."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "The Year-End Rush", "part": "PART TWO: FAST PAPER", "paras": ["*The Owl Alley Sheet, No. 6. Today's news: the shop has not sat down since dawn.*", "The bell had barely stopped ringing when the first customer appeared, followed by the second, the third, and the fourth. It was the year-end rush, and everyone in Edo suddenly needed a calendar. The Owl Alley shop had become a hive of wooden bees.", "Father Sota sat at the low table, his knife moving in short, sharp bursts against the cherry wood. Shavings curled up and fell like pale ribbons. Across the room, Kichi stood at the printing bench, his back hunched, rubbing the baren with a speed that made his arms blur. He was also eating a rice cake, one bite at a time, holding the brush with his left hand.", "Haru was the runner. She climbed the ladder to the loft, grabbed a stack of damp washi, and came back down. She laid a sheet, rubbed it, hung it, ran up, ran down. Her feet thudded on the wooden floor. The air was thick with the smell of wet paper and the sharp, clean scent of cut wood.", "\"Make it faster,\" Mother Okiyo called from the corner, where she was mixing pigments in small bowls. \"The Turtle House is already selling out!\"", "Haru wiped her brow. Her fingers were stained black up to the wrists. She did not stop. She could not stop. The paper hung from the ceiling like a white curtain, drying in the draft that slipped under the door."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["Between two deliveries, Mother Okiyo caught Haru by the elbow. Her grip was firm.", "\"Sit,\" she said. \"You are shaking.\"", "Haru sat on the low stool. Her knees were knocking together. Mother placed a small shell in front of her. Inside was a heap of bright orange powder, vermilion. Next to it were a small bowl of water and a jar of sticky paste.", "\"This is not just paint,\" Mother said. \"It is a promise. If you rush the color, it cracks. If you rush the paper, it smears. Colors, like people, need patience.\"", "She dipped a small brush into the water, then into the paste, and finally into the orange powder. She mixed them slowly, in small circles. The powder turned into a thick, smooth cream. It glowed on the white paper of the test sheet.", "Haru watched, her breath shallow. She wanted to grab the brush. She wanted to print. But her hands stayed in her lap, still and heavy. The orange was so bright it seemed to hum in the dim room.", "\"Ready?\" Mother asked.", "Haru nodded, but her eyes were still on the door, where the sound of voices grew louder."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["The customers did not leave. They stayed in the doorway, talking. A man with a heavy cart asked if the calendar had the correct moon phases. A woman with a lantern asked where the lost cat had been seen. And then a stranger, a woman with a dusty coat, stepped into the light.", "\"You are the girl,\" she said. \"From the noodle sheet.\"", "Haru stiffened. She had not expected anyone to remember.", "\"The whole street knows,\" the woman said, her voice warm. \"We used to think Okiku’s stall was dirty. Now we go there every day. Because you wrote that the noodles were honest. Because you said you saw it.\"", "She looked at Haru with soft, kind eyes. \"It made me feel that our street was worth writing about. That it was real.\"", "Haru felt a heat rise in her cheeks. It was not the cold of the morning. It was something warmer. She touched the booklet hanging from her belt. The paper was soft against her skin.", "\"Can I write this down?\" Haru asked, her voice small.", "The woman smiled and stepped back into the crowd. Haru pulled her brush from her sleeve. Her hand did not shake now. She began to write, faster than before, the strokes sharp and sure."], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["A loud cry cut through the room. Bunta, the big-voiced seller, stood in the street outside, holding up a sheet of paper while his face remained hidden beneath his deep straw hat.", "\"Ghosts! In the canal! At midnight!\" he bellowed. \"A white spirit rises from the water! Only a small coin!\"", "Haru’s stomach dropped. She knew the canal well, having walked it last night, and she knew there was no ghost, only a broken barrel, half-submerged, making a hollow knock against the bridge piling. A boy named Taro had been fishing there all night, trying to catch a pike, and he had told her about the barrel, seeing it with his own eyes.", "She ran to the window. Across the alley, the Turtle House had hung a huge new sheet from its eaves, the paper fluttering in the wind, bright and flashy and completely false. Jiro stood on the step, his yellow silk kimono catching the light, watching the crowd gather around Bunta without looking nervous. He looked happy.", "Haru’s hand tightened on the window frame until the wood creaked under her grip. She looked at the blank paper drying above, knowing she had the brush, the truth, and the anger of a broken barrel."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["\"I am going to print it,\" Haru said.", "The room went quiet so quickly that Kichi stopped eating, his rice cake frozen halfway to his mouth, a smear of sweet bean paste trembling on its edge. Father Sota lowered his knife, but he did not look up immediately; instead, he finished the cut, shaving a thin sliver of cherry wood off the block until it curled like a pale ribbon, and only then set the blade down on the worn table.", "Haru waited, the air in the shop feeling thick and heavy with the scent of ink and fresh wood.", "\"Say it,\" Father said, his voice low and steady.", "\"The canal,\" Haru replied. \"There is no ghost. There is a barrel. I saw it. Taro saw it. I will print it. Loud and clear.\"", "Grandfather Tobei, who had been dozing by the brazier, opened one eye. He rubbed his bad shoulder and watched her without speaking, his bushy eyebrows lifting slightly.", "After a long moment, Father Sota pushed the carved block aside and picked up a fresh, smooth piece of cherry wood, placing it directly in front of her.", "\"Pick up the knife,\" he said.", "Haru’s hand hovered over the wood, her pulse loud in her ears. She was ready. She was absolutely ready."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "The Girl Who Was Right", "part": "PART TWO: FAST PAPER", "paras": ["*The Owl Alley Sheet, No. 7. Today's news: a liar was called a liar in front of the class.*", "The temple hall smelled of cold incense and old paper. Rows of straw mats lay flat on the wooden floor, and on them sat the children of Owl Alley, their brushes resting on small inkstones. The air was still, heavy with the scent of dried pine soot and the quiet focus of twenty pairs of eyes.", "Haru sat second in her row, her indigo apron tied tight, her vermilion cord catching the dim light from the paper windows. Across the hall, in the front row, sat Jiro. His yellow silk kimono stood out like a bright coin in a pile of copper. His posture was perfect, his back a straight line, his hands folded neatly on his knees. He did not fidget. He did not shift his weight. He simply waited, as if he had been born knowing exactly how to sit.", "Teacher Ishida shuffled into the room, his grey coat brushing against the low shelf where his abacus sat. He was thin, his face long and serious, with round glasses that made his eyes look larger and more watchful. He adjusted his spectacles, clicked his tongue once, and began to call out names.", "\"Sabu. Tama. Okiyo’s daughter.\"", "Haru lifted her head. She tapped her brush against her teeth, a small, sharp click in the silence.", "\"Jiro,\" Ishida said, his voice flat.", "Jiro bowed, low and precise, and the rustle of his silk sleeve was the only noise in the room."], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["The lesson was a verse about the moon. It was old and soft, requiring a patience Haru did not have. Her brush moved quickly, slashing strokes down the page. The characters came out slanted and eager, like a cat running across a frozen pond. She liked the speed of them.", "Across the room, Jiro worked differently. His brush moved slowly, deliberately. Each stroke was measured, balanced, and clean. When he finished, he lifted his brush, and not a single drop fell from it.", "Teacher Ishida walked down the aisle, stopping at each mat. He looked at the paper, then at the child. At Jiro, he paused.", "\"Steady,\" Ishida said, a rare note of approval in his dry voice. \"Like water settling in a basin. Very good.\"", "Jiro bowed, his face calm, though his ears had turned a faint shade of pink. He smoothed his yellow sleeve and returned to his practice.", "Haru watched him. She looked down at her own paper. Her characters were jagged, leaning to the left. They were hers, she thought. But in the silence of the hall, they looked small. She gripped her brush tighter. The wood of the handle bit into her palm, a sharp pain that grounded her. She was right about the bridge. She had seen the barrel. She had seen the cat. Jiro had not. Why did it feel like his perfection was a wall she could not climb over?"], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["The break bell had not yet rung, but the children had loosened their collars and begun to whisper. Jiro stood in the center of the group, his voice carrying clearly over the quiet rustle of paper.", "\"The fox wedding,\" he said, smiling just enough. \"It was real. My father’s carver saw it with his own eyes. They danced on the bridge. It is in the sheet.\"", "A few children nodded, their eyes wide. It was a better story than the truth, after all. It was exciting. It was magic.", "Haru stood up. She pushed up from her mat so fast that her writing stand rattled, a harsh sound that cut through the chatter. Every head in the room turned toward her. She felt the heat rise in her cheeks, but she did not sit down.", "\"You are lying,\" she said. Her voice was loud, sharp, and it filled the cold air of the temple hall. \"I crossed Willow Bridge myself. I saw a cat. I saw fog. There was no fox. There was no wedding. The Turtle House sells lies to sell paper. And you, Jiro, are a liar.\"", "The words hung in the air, heavy and sharp. Jiro’s smile vanished. He looked at her, then at the other children, his eyes wide and bright. The room was so quiet you could hear the dust settling on the mats."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["For a moment, no one moved. Jiro’s face flushed a deep, angry red, the color spreading from his neck up to his ears. Then, as quickly as it came, the red drained away, leaving his face pale and tight. He looked at his hands, then at the floor, and finally at Haru. His jaw worked once, but he said nothing.", "A small girl in the back row, a child with a gap in her front teeth, let out a short, nervous giggle. It was a small sound, barely a breath, but it cracked the silence. Then another child snorted. Then more. The laughter rippled through the hall, quick and ugly, a string of sharp, staccato beats.", "Jiro did not wait for it to stop. He turned on his heel. His stockinged feet slapped on the boards. At the door he shoved them into his tall geta, and they clacked on the stones outside, *clack, clack, clack*, as he slid the door open and stepped out into the cold afternoon. He did not look back. The door slid shut with a heavy thud.", "The laughter died out, one by one, leaving the room in a thick, uncomfortable silence. The children looked at Haru. Some of them looked at the door. Haru sat down, her legs stiff, and picked up her brush. Her hand was shaking. She had said the truth. She had won. But the victory tasted like ash in her mouth."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["Teacher Ishida set down his abacus. The beads clicked softly as they settled, a quiet sound in the heavy room. He adjusted his glasses and looked at Haru. His eyes were not angry. They were tired, and they were very kind.", "\"Haru,\" he said.", "She did not look up. She stared at her paper, at the jagged, slanted characters she had written.", "\"You were right about the bridge,\" Ishida said. His voice was low, meant only for her. \"You saw the barrel. You saw the cat. That is the truth.\"", "Haru lifted her head. Her chin was high, but her eyes were downcast.", "\"Then why does it feel wrong?\" she whispered.", "Ishida leaned forward, his long face serious. \"Tell me. What did the class learn today? Did they learn that the fox wedding was false? Or did they learn that Jiro is a liar?\"", "Haru opened her mouth to answer, to say that the truth was the truth, that Jiro deserved to be called out. But the words stuck in her throat. She looked at the empty space where Jiro had been sitting. The air in the room felt cold, colder than the winter outside the paper windows. She had the right answer in her head, but in her chest, something had broken. She had won the argument, but she had lost something she could not name."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "The Sharp Sheet", "part": "PART TWO: FAST PAPER", "paras": ["*The Owl Alley Sheet, No. 8. Today's news: the Turtle House was called a fox.*", "The charcoal in the brazier was low, giving off a faint, sweet smoke that smelled of burnt cherry wood. Haru sat at the low table, her brush tapping against her teeth. She had not eaten. Her stomach growled, a hollow, angry sound, but she did not care. The paper was white and waiting.", "She wrote the facts first. *No foxes were seen on the bridge. No ghosts danced in the canal. One barrel was broken. The cat ran away.* These words were safe. They were true. They were also dull, like a stone at the bottom of a well.", "Then, a sliver of something sharp pricked the back of her mind. She remembered Jiro’s yellow silk sleeve, bright and mocking against the grey winter. She remembered the way he had smiled when she had corrected him. Her hand moved faster now, the brush scratching hard against the fiber.", "*And a certain boy, who wears yellow sleeves, tells stories as thin as his patience.*", "Kichi wandered in, rubbing his hands together. He saw the paper, then saw her face. He stopped.", "\"Haru,\" he said, his voice small. \"That last line...\"", "\"It is true,\" Haru said, not looking up. \"He has no patience.\"", "Kichi looked at Grandfather Tobei, who was dozing in the corner, his eyes hidden by his bushy eyebrows. The old man said nothing. He was too cold to speak, or perhaps too wise to interfere. Haru capped her brush. The line sat there, jagged and bright, waiting for the ink to dry."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["Dawn was a pale, watery thing when the first sheet was pulled from the block. The ink was still wet, shiny and black. Kichi printed two hundred of them. His arms ached, but his face was flushed with excitement. He had never printed so fast. He had never printed something so much fun.", "When Bunta arrived, he held the sheet up to the light. He read the first line. Then the second. Then he stopped. He read the last line three times. He grinned, a wide, round smile that hid all his teeth.", "\"This,\" Bunta announced, his voice booming down the narrow street, \"is the best thing I have read since the moon broke.\"", "He walked into the crowd near the canal, his straw hat hiding his face. He read it aloud, his voice rising and falling like a wave. He paused before the last line, letting the silence stretch, letting them lean in. Then he delivered the insult about the yellow sleeves.", "The street erupted. They laughed. They bought. They bought again. Haru watched from the doorway, her hands clenched at her sides. The sheets disappeared faster than she could hang them to dry. For the first time, the Owl Alley Sheet was not just read. It was chased."], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["By midday, Haru felt like a small star, though she could not quite name why. People nodded, and some even bowed. An old woman selling roasted sweet potatoes patted Haru’s head and whispered, \"You have a brave tongue, child.\" The praise warmed Haru, a heat that started in her ears and spread all the way to her toes.", "Kichi, who was crying, denied it with great dignity. \"It is the dust,\" he sniffled, wiping his eyes with his sleeve. \"Ink dust. It is very fine.\" He was beaming underneath, proud of her, and now prouder still.", "Mother Okiyo emerged from the back room holding the sheet, her fingers stained with color. She read it slowly, her lips moving silent and quick. When she reached the last line, her face went still, and the warmth drained from her eyes.", "She said nothing. Instead, she placed the sheet carefully on the counter, smoothing out the corners with her palm before looking at Haru. Her expression was not anger, but something heavier, a weight of worry that settled in the air.", "\"Go wash your hands, Haru,\" Mother said softly. \"The ink is drying.\"", "Haru went to the water barrel, where the water was cold. She scrubbed her fingers hard, but the feeling of victory still tingled in her fingertips, stubborn as a stain."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["Master Kuroda’s shadow stretched across the workshop floor before his voice arrived. He stood in the doorway, heavy and loud, wearing a gold-brown kimono and a black jacket. His wooden geta, which he had not removed, clacked against the floorboards with a sharp, rhythmic sound that made Kichi jump.", "\"You print this?\" he demanded. His face was red, and the veins in his neck stood out like old, knotted rope. \"You print this in my ward?\"", "Haru stepped forward. Her heart felt tight, but her chin stayed high. \"It is true,\" she said.", "Kuroda did not listen. He looked past her, into the alley where Jiro stood with his hands clasped tightly in front of him. The yellow silk of his kimono looked dull in the shadow. His eyes were fixed on the ground, and his ears burned a bright red against his pale skin.", "Kuroda turned and looked at his son. He said something low and muffled, words that Haru could not hear. Jiro flinched, a small jerk of the shoulders, as if he had been struck. He did not look up. He just stood there, frozen, while the man in the gold kimono turned back to the shop."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["Father Sota stood by the carving table, his knife resting still on the wood. He had not touched the sheet until now. He picked it up, read it, and read it again. He turned the paper over, searching for a smudge or a slip that might explain why it felt so wrong.", "He set it down. The paper made a soft, final sound against the table.", "\"Every line of this is true,\" Father said. His voice was quiet, steady as the bell in the tower. \"Except the one that is not about the truth.\"", "Haru waited for him to shout or throw the paper, but he did neither. He looked at her, and his eyes were tired.", "\"You printed the bridge and the barrel,\" he said. \"That is work. But that last line...\" He gestured to the paper. \"That is not work. That is a knife.\"", "He did not raise his voice, and he did not need to. The silence in the room pressed hard against her ears. Haru looked at her hands. They were clean, so clean that for the first time, the cleanliness felt like a stain."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "The Edge and the Hand", "part": "PART TWO: FAST PAPER", "paras": ["*The Owl Alley Sheet, No. 9. Today's news: a knife was put in a child's hand.*", "The candle burned low, its flame trembling in the draft from the window. Grandfather Tobei did not sit in his usual chair by the brazier. Instead, he stood at the low carving table, his white topknot catching the light. He placed a small block of cherry wood on the worn surface and pushed a knife toward Haru. It was wrapped in a strip of indigo cloth, the handle worn smooth by years of use.", "\"Cut one line,\" he said. His voice was dry, like the sound of dry paper rubbing together. \"Just one. Make it clean.\"", "Haru unwrapped the knife. It was smaller than she expected, the steel dark and quiet. She held the block steady with her left hand, feeling the grain beneath her fingers. She took a breath, held it, and pushed the blade forward. The wood gave way with a soft sigh, releasing a curl of sweet-smelling shaving. But the line did not go straight. It wavered, drifting to the left like a child who has lost its way home.", "She looked up, her face burning. Grandfather Tobei did not look at the line. He looked at her hand.", "\"The knife does not care what it cuts,\" he said, his eyes steady. \"It follows the force you give it. The hand must decide.\""], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["Haru set the knife down, her palm slick against the smooth wood. \"It was true,\" she whispered, her voice barely louder than the crackle of the candle. \"Every word was true. I saw it with my own eyes. The bridge, the barrel, the cat.\"", "Grandfather Tobei nodded slowly. He picked up the block and turned it over, examining the wavy line as if it were a splinter in his own thumb.", "\"I printed a sheet once,\" he said, his voice dropping to a murmur that seemed to settle into the dust. \"When I was young. A merchant had cheated the neighborhood. He took more than his share of the grain. I wrote it down. I printed it. It was accurate. Every number was correct.\"", "He set the block down, the wood feeling cold under his fingers.", "\"The merchant's wife stood in the street with the sheet in her hands,\" Grandfather continued. \"She was not there for the grain. When she read her husband's name, she did not shout. She did not argue. She simply wept. Her tears fell on the paper, blurring the ink. The truth was clear, but the woman was broken.\"", "He looked at Haru, his bushy white eyebrows lowering like curtains drawn against the wind.", "\"The edge is truth,\" he said. \"The hand is kindness. An edge with no hand cuts the wrong thing.\""], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["\"If the truth is dangerous,\" Haru asked, her voice thin, \"then should we say nothing? Should we let them believe the fox wedding was real? That would be kinder, wouldn't it? It is a story.\"", "Grandfather Tobei let out a short, dry laugh, a sound like a twig snapping underfoot.", "\"To stay silent is a far worse crime,\" he said firmly. \"If you do not speak, the lie grows teeth. It eats the truth. You must speak. But you must speak with a steady hand.\"", "He reached out and placed his rough hand over hers on the table. His skin was papery and warm, like the sun-bleached edge of a dried sheet.", "\"It takes a lifetime,\" he said. \"I am still learning. The knife is easy. The hand is hard. You must learn to hold the truth so gently that it does not tear the person holding it.\"", "He picked up the cloth and wrapped the knife again, tucking it into his sleeve with the care of a man packing a lunch for a long journey.", "\"Go to sleep, child,\" he said. \"Tomorrow, you must fix what you have broken. And you must do it with your eyes open.\""], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["The morning air bit at Haru’s nose as she crossed the alley. Her hands were cold, tucked deep in her sleeves, but her chest felt hot and heavy. In her sleeve lay a small slip of paper. It was not a sheet. It was not a headline. It was just a few words, written in her own shaking brushstrokes.", "*I am sorry. I was wrong to cut.*", "She reached the Turtle House. The door curtain hung heavy and glossy, dark green with a white turtle painted on it. It was closed. The shop was quiet. No voices, no laughter, no shouting about foxes. Just the silence of a house that had been hurt.", "Haru stood on the step. She could hear her own breathing. Behind the curtain a floorboard creaked and went still. She wanted to push the curtain aside. She wanted to say it out loud, so he could hear the sound of her voice and know she meant it.", "But her feet would not move. The slip of paper felt heavy, pressing against her thigh like a stone. She folded it smaller and smaller, creasing the corners until the paper became a tight, hard square. She tucked it back into her sleeve, her fingers trembling."], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["The curtain rustled and swung aside, by the wind, or perhaps by someone inside. Jiro stepped out.", "He wore his yellow silk kimono, the black diamond pattern bright against the grey morning. His hair was tied in a neat topknot. He looked tired, with dark shadows beneath his eyes. He saw Haru standing on the step.", "Neither of them spoke. The air between them felt thick, heavy with all the things they had not said. Jiro looked at her. He did not scowl, and he did not grin. He just looked at her, his eyes steady and sad.", "Then, very slightly, he nodded. Once. It was a small movement, barely a twitch of the head.", "He turned and went back inside. The curtain slid shut behind him, smooth and silent.", "Haru stood on the step for a long time. She did not know what the nod meant. It was not a welcome. It was not a forgiveness. It was something else, something she could not name. She touched the small square of paper in her sleeve. For the rest of the day, she could not stop thinking about how it pressed against her skin, a tiny, hard reminder of the words she had written."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "Soba at the End of the Year", "part": "PART TWO: FAST PAPER", "paras": ["*The Owl Alley Sheet, No. 10. Today's news: the old year ended with noodles.*", "The wind died by the evening bell. The air turned sharp. It was clean enough to slice.", "Owl Alley crowded around Okiku's stall. Nobody wanted to buy. They wanted to wait. Long bowls of buckwheat noodles sat on low tables. Steam rose in thick, white columns. It curled around the lanterns like a shy cat. These were the noodles that would carry the old year out. Long. Unbroken. A promise that the next one would be just as long.", "Umekichi and Osen carried a steaming pot of warm tofu. The blocks were pale and smooth. They looked like river stones someone had polished. Hachi, the bathhouse owner, arrived with a kettle. It was so large it looked like a small boat. The water inside was hot enough to singe the hair on his thick eyebrows. He set it down with a thud. The snow shook off the wooden roof. It landed on his hat.", "Shin, the young furnace boy, sat on the lowest step. He was tired. Hauling ash all day had drained him dry. His eyes were already closed. He held his bowl in his lap. His soot-stained fingers wrapped tight around the rim. He was dreaming of a soup that never came. The alley was quiet. Only the clink of chopsticks broke the silence. And the low murmur of neighbors sharing a meal."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["Haru sat between her parents, her hands wrapped around a small cup of amazake. The sweet rice drink warmed her from the inside out. She watched the faces around her. Okiku was telling a story about a cat that had stolen a fish, and Master Ito, the ward headman, was listening with his arms crossed.", "Then Okiku turned to Haru. The old woman’s eyes were bright. She held up her own empty bowl, the residue of broth still shining. \"This year's best thing,\" Okiku said, her voice rough but warm. \"She checked. She saw. She told the truth when it was easier to stay quiet.\"", "Haru felt her face burn. The heat spread from her neck to her ears, a sudden, sharp blush. She opened her mouth to say she had only done her job, but before she could, she heard her own name in the same breath as Jiro’s.", "\"He is a good boy,\" Master Kuroda said, not looking at Haru, but looking across the alley to the dark door of his own shop. \"He only wants to be seen.\"", "The heat in Haru’s face did not fade. It cooled, slowly, into a heavy, sinking feeling in her chest. She looked at her hands. They were steady, but they felt far away, as if they belonged to someone else who was not quite there."], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["Master Ito excused himself with a small bow. He walked to the edge of the gathering, where the snow lay deep and undisturbed. Father Sota followed, his heavy footfalls crunching in the white. They stood apart from the noise of the stall, shoulders almost touching.", "The headman did not shout. He spoke in a low, careful voice, the kind used for bad news that must be delivered gently. He mentioned the magistrate’s men. He mentioned the sheets sold by the street corner, the ones with no name, no permission, no register. He was not angry. His face was stern, but his eyes were worried.", "\"Printing is a craft,\" Master Ito said, his breath misting in the cold air. \"But news is a power. The magistrate does not like power that he cannot see. It will not be overlooked for ever, Master Sota. You must know that.\"", "Father Sota nodded once. He did not argue or apologize. He simply listened, his hands hanging at his sides, the small nicks on his fingers looking sharp in the lantern light. He was thinking of the blocks on the shelf, the ink in the pot, and the words that had already flown out into the city."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["Father Sota walked back to the stall. He said nothing to the neighbors, and he said nothing to Mother Okiyo. He only crossed the road to where Haru sat. For a moment, his arm went around her shoulder. It was a heavy, warm weight. He squeezed once. Then he moved away.", "Kichi, who had been listening from behind a stack of empty crates, finally came out. He sat down in the snow, knees up to his chest. Usually, Kichi would have made a joke about the cold, or his empty stomach. Tonight, he stayed quiet. It was the longest silence he had ever kept. It hung in the air like smoke.", "Grandfather Tobei, who had been watching the two of them, picked up his chopsticks. He took a single piece of tofu. He held it up. He looked at the others.", "\"So,\" he said, his voice dry and clear. \"The sheet has teeth.\"", "He took a bite. He chewed slowly. He swallowed. He did not look at Haru. He did not look away. He just kept eating, as if the world had not just shifted under his feet."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["The temple bell began to toll. A slow, deep sound rolled over the tiled roofs and settled into the snow. One stroke. Two. Three.", "Haru counted them, just as she always did. Each note felt like a piece of the old year breaking off and falling away. Her mind drifted to the knife in her father’s hand, then to the words she had written, sharp and bright and cruel. She reached into her sleeve and touched the small, folded square of paper hiding there. It was an apology, one she had written but never given.", "The bell sounded again. Outside, the wind picked up, carrying the scent of woodsmoke and ink. The alley grew quiet, the laughter faded, and steam rose into the dark sky. Haru waited for the last stroke, for the old year to end, for the new one to begin. She waited, too, to find words that were kind, and true, and enough."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "A Thumb of Cherry Wood", "part": "PART THREE: THE SHARP KNIFE", "paras": ["*The Owl Alley Sheet, No. 11. Today's news: a thumb was bandaged.*", "The new year arrived wrapped in pine branches and bamboo stalks, leaning against the shop door like quiet green sentries. In the entryway stood the kagami-mochi, two round white rice cakes stacked neatly, a small bitter orange resting on top. The air inside smelled of clear dashi soup and the faint, sweet aroma of mochi.", "Haru sat on the tatami mat, her hands tucked into the sleeves of her rust-orange kimono. The shop was closed for three days. No ink to grind, no paper to dampen, no wood to carve. Her fingers twitched, itching for the smooth resistance of a baren or the sharp bite of a knife. She looked at the small paper envelope on the table. Inside was a few coins, an otoshidama gift from her grandfather. She turned it over in her hands, the paper crinkling softly.", "\"Father,\" she said, her voice echoing slightly in the quiet room. \"I am bored.\"", "Master Sota did not look up from his tea. He sipped slowly, the steam rising and curling into the cold air. \"Boredom,\" he said, \"is just wood waiting to be cut.\"", "Haru frowned. She looked at her hands. They were clean. Too clean."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["Master Sota set down his tea bowl and crossed the room in two long steps, pulling a small, rough block of cherry wood from the shelf before placing it in the center of the worn carving table.", "\"Sit,\" he said.", "Haru sat cross-legged, her knees cracking softly as she adjusted her rust-orange kimono, while her father pulled a small knife from his belt, its short, sturdy blade and handle worn smooth by years of grip.", "\"Draw a line,\" he said.", "Haru picked up a thin brush, dipped it in water, and made a single, faint mark across the wood, which was straight or so it looked.", "\"Now,\" Master Sota said, picking up the knife without cutting, touching the wood with the flat of the blade to feel for the grain. \"Cut beside it, never on it, and let the wood tell you which way it goes.\"", "Haru watched his hand, which was steady and silent, showing her how the grain ran invisible but strong, like a river under the surface.", "\"The wood is not dead,\" he said. \"It is still listening.\"", "Haru’s heart beat a little faster, for she had never before been allowed to hold a real carving knife."], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["Haru gripped the knife. It felt heavy, then light, and heavy again. She made the first cut. A thin sliver of cherry wood curled away, smelling sharp and sweet. She made a second cut. Then a third.", "It was easy. Too easy. The wood seemed to want to be cut, to yield to her will. She cut faster, her breath coming in short, quick bursts. The little curls piled up on the table like tiny ribbons.", "\"Haru,\" Master Sota said.", "She did not stop. She was close. She could see the shape forming. She wanted it to be perfect. She wanted to be done.", "On the twelfth stroke, the knife slipped.", "It was not a big slip. Just a tiny shift, a flicker of the hand. But the edge caught. It slid into the base of her thumb, just below the nail.", "A sharp, hot sting bloomed. Then, startlingly, a drop of bright red blood welled up, mixing with the pale wood shavings.", "Haru gasped, her hand flying up.", "Mother Okiyo was there in an instant. She had not called out. She had simply moved, swift and silent. She wrapped a clean strip of white cloth around the cut, her fingers gentle but firm.", "\"It is just a scratch,\" Okiyo said, though her eyes were wide.", "Haru stared at the red dot on the white cloth. It looked impossibly bright."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["Grandfather Tobei sat in the corner, rubbing his bad shoulder. He watched the blood, then the bandage, then Haru’s face. He did not say \"I told you so.\" He did not say \"Be careful.\"", "He leaned forward, his white bushy eyebrows rising.", "\"Now you know what the edge is,\" he said.", "Haru looked at her bandaged thumb. The pain was a dull throb, a steady pulse against the silence.", "\"The edge is truth,\" Grandfather said. \"It cuts. It does not care who it cuts. It only cuts.\"", "He tapped the table with his wooden stick. *Thock. Thock.*", "\"The hand is kindness,\" he continued. \"It holds the knife. It decides where the cut goes. It decides how deep.\"", "Haru looked at her father. Master Sota was watching her, his expression unreadable.", "\"An edge with no hand,\" Grandfather said, his voice low, \"cuts the wrong thing.\"", "Haru understood. Not in her head, but in her hand, in the ache of her thumb. She had held the truth, but she had forgotten the hand. She had let the truth cut where it pleased.", "The room was very quiet. The only sound was the tick of the cooling brazier and the distant hum of the city."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["Later, the throbbing in her thumb had faded to a dull, persistent ache, and Haru sat at the table again to face the small block.", "She picked up the knife. Her hand trembled, just slightly. She drew another line, faint and straight.", "She did not rush, nor did she try to be fast. Instead, she felt the grain again, that invisible river running through the cherry wood. She held the knife steady, her breath slow and even.", "She cut.", "One line, slow and steady, emerged from the wood.", "The sliver curled away, perfect and clean. It did not jump or slip; it went exactly where she wanted it to go.", "Haru put the knife down without a sound. She held her bandaged hand in her lap, feeling the strength settling back into her fingers.", "Master Sota looked at the cut. He looked at the line on the wood. Then he looked at her.", "\"Yes,\" he said.", "It was a small word. But in the quiet of the shop, it sounded like a bell."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "Yaki-imo for a Rival", "part": "PART THREE: THE SHARP KNIFE", "paras": ["*The Owl Alley Sheet, No. 12. Today's news: a sweet potato was carried across the alley.*", "The yaki-imo seller had his cart parked near the canal, where the smell of burning sugar and earth hung thick in the cold air. Haru’s mouth watered so hard she felt like she was swallowing a peach. She counted the last of her New Year otoshidama, then bought two that were still glowing faintly from the coals.", "Tucking one under each arm, she began to walk. The heat burned through her sleeves, turning her fingertips red as the snow crunched softly under her sandals. It was a clumsy game of catch against her own arms, a private game in the quiet street. She took a deep breath, and it puffed out in a small white cloud that drifted away.", "Across the alley, the Turtle House door was closed, but the step was visible. A figure was sitting there. Haru tightened her grip on the hot sweet potatoes and adjusted her indigo apron. She began to cross. The snow made a soft, rhythmic sound that marked her approach."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["Jiro sat on the wooden step, his yellow silk kimono a bright splash of color against the grey stone. He blew on his fingers, his breath thin in the cold air, and looked up as Haru approached with wide eyes.", "Haru stopped and held out the sweet potato.", "Jiro stared at it, then at Haru, then at the potato again, as if he expected it to snap its teeth. He did not reach for it.", "\"Is it poisoned?\" he asked.", "\"It is a sweet potato,\" Haru said, holding it out further. \"I saw it with my own eyes.\"", "Jiro snorted, a small, sharp sound, but a smile twitched at the corner of his mouth. He reached out and took it. His fingers brushed hers for a second, a brief, warm contact that felt like a secret.", "\"It is not poisoned,\" he said, sounding surprised. \"It is just hot.\"", "\"No,\" Haru said. \"It is kind.\""], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["They sat side by side on the wooden step, the potatoes cooling in their laps while Haru’s ears turned bright red against the grey morning air. \"I am sorry,\" she said, the words feeling clumsy in her mouth like a stone she was trying to smooth with her tongue. \"About the fox wedding. At school.\"", "Jiro tore off a piece of the hot skin and let it dangle. \"My father called me a soft-hearted fool,\" he said, his voice flat and steady. \"He said I let a girl make the Turtle House a joke. He said I was weak.\"", "Haru bit her lip, the sweet potato still warm in her hands. \"The fox wedding was not true.\"", "\"I know,\" Jiro replied, chewing slowly as he watched the water move beneath the ice in the canal. \"I know it was not true.\"", "\"Then why did you print it?\"", "Jiro looked at the dark water, then back at her, a small, honest sadness in his eyes. \"Because I wanted it to be true,\" he said quietly. \"For one day.\"", "Haru said nothing, watching the steam rise from her own potato in thin, lazy curls that drifted away into the cold. The air between them felt heavy, but not cold at all."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["Jiro peeled the skin off his potato, the layers of flesh pale and soft. \"My father only smiles at sheets that sell,\" he said. \"He does not care if they are true. He cares if they are fast.\"", "He held up a piece of the potato. \"I have tried to carve. I have tried to copy his blocks. But he never praises them. He says they are stiff. He says they do not move.\"", "Haru listened. Her fingers were still warm from the potato.", "\"So I write wonders,\" Jiro continued. \"Foxes. Ghosts. Two-headed carp. Nobody can say I got it wrong.\" He looked at Haru, his eyes bright and a little sad. \"Because it never happened.\"", "Haru felt a small, sharp pang in her chest. It was the first time she had heard a liar explain himself. He did not look like a villain. He looked lonely. He looked like a boy who wanted to be seen, and had found a way to be seen by making things up."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["Jiro stood up, brushing crumbs from his yellow sleeve. He reached into the pocket of his kimono and pulled out a small copper tag. It was round, with the Turtle House mark stamped on it.", "He held it out to Haru.", "\"In case you need to get in fast,\" he said. He did not look at her. He looked at the snow, or the canal, or anywhere but at the tag in his hand.", "Haru took it. It was small and heavy in her palm. She closed her fingers around it.", "\"Thank you,\" she said.", "Jiro nodded once, a small, stiff movement. He turned and walked back toward the Turtle House door. He did not look back.", "Haru held the tag against her chest as she crossed the alley. The copper was cool, but it felt like it held a memory of his warmth. She tucked it into her sleeve, next to her heart."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "The Bathhouse Steps", "part": "PART THREE: THE SHARP KNIFE", "paras": ["*The Owl Alley Sheet, No. 13. Today's news: a boy fell asleep on a wood pile.*", "The afternoon light fell pale and thin on the bathhouse steps. Steam curled up from the high windows, mixing with the cold air to form a low, white fog that smelled of wet cedar and hot water. Haru sat on the stone step, her straw sandals tucked under her, holding a small clay cup of sweet amazake. The liquid was warm against her palms, a small circle of comfort in the biting chill.", "She had her booklet open in her lap. The paper was soft from handling, the edges worn. She did not write yet. She waited.", "Grandfather Tobei had taught her this in the shop, while they hung the drying sheets. \"People talk like they are fishing,\" he had said, tapping the baren against the table. \"They throw a line in to see what bites. They say half a thing to see if you repeat the other half. You must listen to the water, not just the splash.\"", "A woman in a thick quilted coat stepped out onto the veranda. She was drying her hands on her kimono, shaking the water off her fingers. She looked tired, the kind of tired that sits deep in the bones.", "\"The bath is full,\" she said to no one, or perhaps to the street. \"Hachi-san is shouting again. His voice is like a cracked bowl.\"", "Haru turned a page in her booklet. She watched the woman’s hands. They were red and chapped."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["Another customer, an older man with a towel draped over one shoulder, stepped down the stairs. He walked slowly, leaning his weight on a wooden cane, and paused near Haru while looking past her at the bathhouse door.", "\"Shin is inside,\" the man said quietly. \"He has not eaten since the morning bell.\"", "Haru’s brush hovered over the paper. \"Shin?\"", "\"The furnace boy. He is nine, but he works like a man of thirty. Hachi’s wife is ill. Has been for a week. The fever will not break, so Hachi runs the counter, and Shin feeds the fire.\"", "The man shook his head. \"I saw him yesterday. His eyes were dark, like he had not slept in a month. He was shoveling ash so fast his hands were a blur. I wanted to give him a coin, but I did not know how to ask.\"", "Haru wrote: *Hachi’s wife ill. One week. Hachi runs counter. Shin feeds fire. Eyes dark.*", "She looked up, and the man was already walking away, his cane tapping a steady rhythm on the wooden planks. Haru stared at the words in her booklet. They were true, but hearing was not the same as seeing. She closed the cup, the warm liquid sloshing gently against the clay. She needed to see for herself. She needed to know if the boy’s hands were shaking, or if he was just strong."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["Haru walked around the back of the bathhouse. The street here was narrow, the houses close together, their eaves almost touching. The smell of woodsmoke was stronger here, thick and acrid.", "Behind the main building was a yard filled with stacked firewood. It was a chaotic pile, logs and branches tied together with rope. In the corner, next to the low brick furnace, lay a heap of pale wood shavings. They were dry and curled, looking like a nest of white ribbons.", "In the center of the shavings, curled into a tight ball, was a small figure.", "It was Shin.", "He was wearing a soot-grey short jacket, but his arms were bare and black up to the elbows. The skin was dark with charcoal dust, stark against the grey fabric. His hair was cropped short, dusty with ash. He was sleeping, his face buried in his knees.", "In his arms, held tight against his chest, was a pair of iron tongs. He held them like a doll, his fingers wrapped around the cold metal handles.", "Haru stood still. She did not want to wake him. She looked up.", "The chimney rose behind him. It was tall, made of dark brick and tile. But near the top, the clay cap was cracked. It was tilted slightly to the left, a thin line of white light showing through the break. It looked fragile. It looked like it might snap in the wind."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["A crackle from the furnace made Shin’s shoulder twitch. Then his eyes opened, wide and darting, black and deep-set. He scrambled to his feet, the iron tongs clattering to the ground. Brushing shavings from his legs, his movements were jerky and fast.", "\"I was only resting my eyes,\" he said, his voice rough and scraped thin.", "\"You have been here a long time,\" Haru said, holding out the clay cup that was still warm.", "Shin looked at it, then at Haru. For a second, he seemed confused, as if he had forgotten where he was. Then he took the cup. He drank the amazake in two large gulps, his throat moving with each swallow.", "Handing the empty cup back, his hands shook, just a little.", "\"The ash door sticks,\" he said, staring at the ground. \"I have to kick it. Master Hachi says the chimney can wait. He says spring will be better. He says it is not my job to worry about the roof.\"", "He paused, rubbing his soot-stained eyes with his sleeve and smearing the black further.", "\"It is cold,\" he whispered. \"The wind is coming.\"", "Haru looked up at the cracked cap of the chimney. The wind was not coming. It was already there, thin and invisible, pressing against the bricks."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["Haru uncapped her brush and wrote quickly, the brush whispering a steady rhythm on the paper.", "*Crack in chimney cap. Tilted left. Ash door sticks. Boy sleeps on shavings. Holds tongs. Eyes dark. Master Hachi says wait for spring.*", "She looked up. The sky over the tiled roofs was hard and clear, the kind of blue that feels like a clean blade. The air was still, but it held its breath, waiting for something to happen.", "A thin draft brushed the back of her neck. It was not strong, just a cold touch, but it made the hair on her arms stand up as if she had just finished a long race. She looked at the cracked cap again. It sat so small against the empty sky, a tiny flaw in a perfect drawing.", "She tucked the booklet into her sleeve, next to the copper tag from Jiro. The metal was cool against her skin, while the paper pages were warm from her hands. She stood up, and though her legs felt wobbly, she straightened her back. She had seen it with her own eyes. The crack was there. The boy was tired. The door stuck.", "Turning, she walked back toward the front of the bathhouse. The street was quiet, with the wind moving through the eaves in a soft, dry rustle. Haru knew what she had to do. She did not know how to do it yet, but she knew the truth was waiting, and it was getting colder."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "The Wind That Would Not Stop", "part": "PART THREE: THE SHARP KNIFE", "paras": ["*The Owl Alley Sheet, No. 14. Today's news: the wind has not stopped for three days.*", "The wind arrived on the second day without warning. It did not blow so much as it screa
