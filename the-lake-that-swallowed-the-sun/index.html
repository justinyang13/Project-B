I need to tell someone on the pier something, I tell Han, and Han tells A-Bao, and A-Bao runs.\"", "A-Bao’s eyes widened. He looked at his sister, then at the chalk lines, then at Dumpling. \"Official Runner,\" he said, and the title seemed to settle on his shoulders like a coat.", "\"Ouyang is on the water gauge,\" Shu continued. \"She reads the numbers. Uncle Liu is on the lever. He turns the wheel. And A-gong.\" She looked at her grandfather, who had been standing in the shadow of the pillar, his cane held loosely in his hand. \"A-gong stays at the Sun Dragon. Where the water first comes through. He watches the flow. He is the first to see if it is right.\"", "A-gong did not speak. He looked at the chalk drawing, then at Shu, and for a moment his face was very old and very tired, and then it was just his face, calm and steady. He nodded, once.", "\"The plan is set,\" Shu said. \"Now we wait for the rain.\""], "img": "img/p102.jpg", "pw": false}, {"no": 103, "ch": 21, "ctitle": "", "part": "", "paras": ["The honor of being the Official Runner was not something A-Bao had expected, and he did not know quite what to do with it. He stood by the temple door, his chin high, higher than it had any right to be for a boy of eleven, and Dumpling, who had been cooing softly, began to squawk. The duckling wanted to be out. The duckling wanted to be free. The duckling, in its small, yellow, desperate way, wanted to be the Runner.", "\"No,\" A-Bao said firmly, holding the basket tighter. \"You are a duck. I am a runner. We are different.\"", "Dumpling clucked, a sound of profound disagreement, and began to flap its wings, creating a small, localized weather event in the basket. A-Bao’s attention, which had been divided between the duty of running and the duty of not dropping his sister’s trust, was now entirely consumed by the duck. He spent the next quarter of an hour in a heated, silent argument with the bird, trying to explain that the storm was coming, that the water was rising, and that he could not carry a duck and a message at the same time. He failed. The duck remained unconvinced.", "While A-Bao negotiated with poultry, Shu and Han stood on the dock, the planks wet and slick under their feet. The air was still, but it felt heavy and pressing, like a held breath before a shout. Han held an umbrella, its canopy dark and sturdy, and he held it over both of them, though the rain had not yet started. He held a plain bun in his other hand, the paper wrapper crinkled in his fingers. He did not eat it. He just held it, as if it were a talisman.", "\"You’re sure?\" he asked. His voice was quiet, stripped of its usual cheerfulness.", "Shu looked at him. Her hair was loose from its braid, strands sticking to her cheek. \"I’m sure,\" she said. \"The numbers are right. The plan is right. The water is patient. It will wait for us to be ready.\"", "Han nodded. He looked out at the water, at the dark, still surface of the Moon Basin. \"Whatever happens tonight,\" he said, and then stopped. He looked at her, and his eyes were serious, and there was no joke in them, no terrible punchline. \"You did all the hard parts. You measured it. You mapped it. You fixed the pin. I just... I row the boat.\"", "Shu reached out and took the bun from his hand. She broke it in half and handed him a piece. \"Then we eat,\" she said. \"And then we work.\"", "Han took the piece. He did not smile, not exactly, but the tension in his shoulders eased, just a little, just enough. He looked at the water again, and this time, he did not look afraid. He looked ready."], "img": "img/p103.jpg", "pw": false}, {"no": 104, "ch": 21, "ctitle": "", "part": "", "paras": ["The rain began at four in the afternoon, not with a crash but with a whisper. It was soft at first, a fine mist that landed on the upturned leaves of the tea plants and ran down in silver threads. Shu stood at the water’s edge, her eyes fixed on the bamboo staff that Ouyang had planted firmly in the mud of the Moon Basin shore. The staff was marked with black lines, every ten centimeters, and the water was rising to meet them.", "At first, the rise was slow. A centimeter here. A centimeter there. But the water was inexorable, a silent, patient force that did not care about the village or the plan or the mooncakes. It simply climbed. The mist thickened, swallowing the ridges, swallowing the sky, until the world was just the grey water and the grey air and the white lines on the bamboo.", "Shu held her plumb bob, the brass weight swinging gently in her hand. She waited for it to stop, for the world to be still, and when it did, she read the number. Two meters and forty centimeters. It was higher than the morning. It was higher than the afternoon. It was higher than it had been in thirty years.", "\"Ouyang,\" she said, her voice clear and sharp in the wet air. \"What do you see?\"", "Ouyang Min stood beside her, her yellow hard hat bright against the grey, her glasses fogged with the humidity. \"The gauge is matching the staff,\" she said. \"The flow is increasing. The head is building. We are at the first step threshold.\"", "Shu looked at the water. It was dark, almost black, and it moved with a slow, heavy purpose. She looked at the temple, where the lanterns were still unlit, and at the village, where the people were gathering, their faces serious and their hands holding their things tightly. She looked at A-Bao, who was running, his yellow raincoat a bright flash in the grey, his basket clutched to his chest.", "\"Time to move,\" Shu said. She turned to the group, to Han, to Uncle Liu, to Ouyang, to A-gong. Her voice was not loud, but it carried. \"Everyone to their places. Now.\""], "img": "img/p104.jpg", "pw": false}, {"no": 105, "ch": 21, "ctitle": "", "part": "", "paras": ["The dusk arrived not as a sudden darkening but as a slow, deliberate deepening of the grey into a bruised purple, the mist thickening until it hung in the air like wet cotton. The full moon remained hidden behind the heavy cloud cover, though its presence was undeniable, a pale, cold glow that filtered through the grey and turned the relentless rain into a thousand falling silver threads. One by one, the temple lanterns on the ridge ignited, their red flames steady and warm against the storm, casting long, trembling reflections across the wet stone and the dark, churning water below.", "The village stood at the water's edge, a quiet line of figures in heavy coats and raincoats, their faces turned toward the rising tide. They did not speak, for there was no need. The rain provided the soundtrack, a steady, rhythmic drumming on the tea leaves, the slate roof of the dock, and the surface of the Moon Basin, marking the passing seconds with an accuracy that felt mechanical. Shu stood at the center of the stone terrace, her hands resting at her sides, her breathing controlled and even. To her right, her grandfather stood rigid, his bamboo cane planted firmly in the wet ground, his face a mask of calm.", "She reached out and took his hand. His palm was rough, dry, and warm, the skin worn smooth by decades of gripping ropes and levers. It fit hers with the precise ease of a key sliding into a lock, a connection forged over sixteen years of shared silences and measured days.", "\"Ready, A-gong?\" she asked. Her voice was low, barely audible over the drumming rain, yet it carried a clarity that cut through the noise.", "He looked at her. His eyes were bright, clear, and held a strength she had not seen in them since before the flood, before the gates had jammed and the silence had set in. He squeezed her hand, once, firmly. A final transfer of weight, of responsibility, of trust.", "\"Ready, keeper,\" he said.", "The rain continued to fall, relentless and cold. The water continued to rise, inch by inexorable inch. In the heavy silence of the storm, the two of them stood together, their shoulders aligned, facing the lake, facing the storm, and facing the night that would decide everything.", "◆ Words to know: inexorable – impossible to stop or prevent; deliberate – done intentionally and carefully; talisman – object believed to bring luck; unconvinced – not persuaded or certain; rigid – stiff and unable to move"], "img": "img/p105.jpg", "pw": false}, {"no": 106, "ch": 22, "ctitle": "Staged Opening", "part": "PART FIVE: THE MID-AUTUMN NIGHT", "paras": ["*The Gatekeeper's Rules, Rule 22: Open in steps, and listen between them.*", "The lever bit into the stone socket with a sound like a heavy book closing on a finger. Uncle Liu braced his rubber boots against the wet terrace, his forearms corded with muscle, and heaved. The bronze axe-head of the lever swung upward, and for a moment the air between them seemed to hold its breath. Then, with a low, reluctant groan that vibrated through the soles of Shu’s green rain boots, the Sun Dragon’s gate began to rise.", "It came up five centimeters. No more.", "Ouyang Min stood by the bamboo staff she had lashed to the rock, her silver glasses fogged by the rain, her yellow hard hat gleaming in the lantern light. She squinted at the meniscus of the water in the clear tube, her lips moving as she calculated. \"Two millimeters of drop in the Moon Basin,\" she called out, her voice cutting through the drumming rain. \"Flow is slow. Very slow. We are moving water, not pushing it.\"", "Shu watched the water trickle through the channel. It was a thin, dark ribbon, sliding over the silt that had packed the gate for thirty years. She waited. The lake was breathing, she knew, a slow, deep exhalation that took time to settle. She watched the reflection of the red temple lanterns in the water, the way they stretched and snapped back, stretched and snapped back, until finally the ripples flattened into a still, dark mirror.", "\"Step two,\" Shu said.", "Uncle Liu wiped his forehead with a sleeve that was already soaked. \"Step two,\" he repeated, and heaved again.", "The gate rose another five centimeters. The trickle became a stream. The sound of it was different now, no longer a whisper but a steady, rhythmic hiss, like steam escaping from a kettle. Ouyang checked her gauge again. \"Head is dropping,\" she said. \"We are sharing the load.\"", "Shu looked at her grandfather. He stood with his cane planted firmly, watching the water. He did not smile, but the tension in his shoulders had eased, just a fraction. The lake was not empty. It was not overflowing. It was finding its level, and it was not impatient about it."], "img": "img/p106.jpg", "pw": false}, {"no": 107, "ch": 22, "ctitle": "", "part": "", "paras": ["Steps two and three went cleanly. The lever swung. The gate rose. The water flowed. It was a smooth mechanical rhythm that surprised them all, a kind of industrial poetry that Shu had not expected from a pair of bronze handles and a stubborn stone channel. The wind picked up, howling down from Elder Peak and rattling the red lanterns on the ridge, but the rain remained steady, a cold, constant drumming on the temple roof.", "The Sun Basin was waking up. From the stone terrace, they could see the water level creeping higher in the east, the dark mud of the cove disappearing under a thin sheet of rain-slicked water. It was a subtle change, barely visible in the gloom, but it was there. The lake was remembering how to be a lake, stretching its legs after thirty years of being pinned down.", "Then, in the beam of the lantern light, a fish jumped. Then another. A silver flash. A splash. The sound of water hitting water was bright and clear in the storm. The carp were back in the cove, leaping in the light as if to say hello. Or perhaps just to confirm the receipt.", "Han’s whistle cut through the noise, three short blasts from the ferry pier. The pier crews were moving, securing the boats, checking the lines. Everyone grew calmer with each step, the fear of the flood replaced by the satisfaction of the work. The village was not watching a disaster. They were watching a repair.", "A-Bao stood beside Shu, his yellow raincoat bright in the dark, holding Dumpling’s basket tightly. \"Look,\" he whispered, pointing at the water. \"The fish are dancing.\"", "\"They are not dancing,\" Shu said, though her voice was soft. \"They are swimming. There is a difference.\"", "\"Is there?\"", "\"Yes. Dancing is for later. Swimming is for now.\"", "The rain continued to fall, but it felt less like a threat and more like a witness. The lake was rising, sharing its burden, and the village was holding its breath, not in fear, but in anticipation."], "img": "img/p107.jpg", "pw": false}, {"no": 108, "ch": 22, "ctitle": "", "part": "", "paras": ["Step four was supposed to be the same. The lever swung, Uncle Liu heaved, and the gate rose. But at twenty centimeters, the motion stopped.", "It did not stop with a click or a snap. It stopped with a groan, a deep, grinding shriek that came from the stone itself, from the bones of the channel. Uncle Liu strained, his boots slipping on the wet rock, his face flushed with effort. The lever did not move. It was bound, stuck, locked in place by something that was not in the logs, not in the plans, not in the past.", "Shu felt the vibration through the soles of her boots. It was a shudder, a tension that traveled up the stone and into the ground beneath her feet. She looked at Ouyang, who was staring at the gauge.", "\"The Moon Basin is climbing again,\" Ouyang said, her voice tight. \"The head is not dropping. The flow is blocked.\"", "\"The typhoon is not waiting,\" Shu said.", "She looked at the rain, at the dark water of the Moon Basin pressing against the low bank, at the clock on the temple wall that ticked with a cruel, mechanical precision. The gate was stuck. The water was rising. And they had no time.", "Uncle Liu slumped against the stone, breathing hard. \"It’s the silt,\" he said. \"Or the wood. Something is in the channel.\"", "Shu closed her eyes. She could feel the pressure of the storm, the stubbornness of the stone. It was a problem with no answer. And yet, there was a question in the air, a question that had been waiting for thirty years to be asked."], "img": "img/p108.jpg", "pw": false}, {"no": 109, "ch": 22, "ctitle": "", "part": "", "paras": ["Han was already moving before Shu could find her voice. He had the safety line looped around his waist, the heavy lamp strapped tight to his chest, and a look of absolute, terrifying commitment on his face. He dove without hesitation, plunging into the black water with a splash that the rain instantly erased.", "Shu gripped the line until her knuckles whitened. She felt the dead weight of his body, the sluggish drag of the current, and the cold, solid presence of the channel beneath the surface. One minute stretched into two. Her fingers went numb, the rope slick and ungrateful in her grip, while she watched the rain hammer the lake and the lantern light scatter in confused, trembling shards across the ripples.", "Then Han broke the surface, gasping for air as water streamed from his hair. He hauled the line taut, and Shu leaned back, using her shoulder to bridge the gap, dragging him up onto the wet stone. He climbed out, dripping and shivering, his orange life vest dark and heavy with the lake.", "\"It’s the log,\" he said, his voice rough and scraped. \"The drowned log. It’s in the channel.\"", "He pointed into the dark, toward the place where the gate had seized. \"It was loose,\" he continued, spitting out the words. \"The first steps shook it free. But it turned. It’s broadside now. Wedged tight against the gate’s guide rail.\"", "Shu stared at the water. It was impenetrable, a solid sheet of black, but the geometry was clear in her mind. A ton of old camphor wood, smooth and dense, blocking the only path. It would not move. It was too massive, too heavy, and too firmly lodged in the silt to be shoved away by muscle alone.", "\"We need to lift it,\" Ouyang said, her voice tight and precise. \"But we can’t. The water pressure is too high.\"", "\"We need a way around it,\" Shu said, her mind racing. \"Or through it.\"", "Han shook his head, a sharp, negative motion. \"It’s solid, Shu. It’s like a wall.\"", "Shu looked at the gauge, then at the clock, and finally at the rain. The typhoon was still out there, indifferent and relentless, still raining. The water was still rising, inch by inexorable inch. And the gate was still stuck, holding the moon captive while the sun faded in the mud."], "img": "img/p109.jpg", "pw": false}, {"no": 110, "ch": 22, "ctitle": "", "part": "", "paras": ["The rain fell in grey sheets, turning the stone channel floor into a slick mirror. Shu checked the gauge one final time, watching the needle tremble against the red line, then glanced at the watch on her wrist. The typhoon was still out there, churning the air, pushing the water higher against the low bank of the Moon Basin. She turned slowly, her rain boots squeaking on the wet rock, and looked at her grandfather.", "A-gong stood apart from the group, his cane planted firmly in the stone. His straw hat was damp, his white beard a streak of silver against the grey of the storm, but his face held a stillness that seemed to hang in the air, untouched by the wind or the noise of the water. He did not look at the jammed gate. He did not look at the rising black water. He looked only at Shu, his eyes bright and patient, waiting for her to catch up to the question he had already asked.", "\"What does the tool want?\" he asked. His voice was quiet, barely louder than the drip of water from his hat brim, yet it cut through the storm with a clarity that made the noise around them fall away.", "Shu blinked, the question landing in her mind like a stone dropped into the cove. The tool. The golden axe, the bronze lever with its heavy head, the pair of dividers that had measured the lake for a hundred and fifty years. They were not just metal and wood, not just a mechanism to be forced or a lever to be pulled. They were a language, one she had been learning since she was old enough to hold the plumb bob. A language of force and angle, of water finding its level and of the precise point where motion became motion.", "She closed her eyes, blocking out the rain and the dark water. In the quiet behind her eyelids, the lever swung, its arc tracing a perfect curve. The log turned, its grain shifting against the silt, the way a stubborn gate binds before it yields. She thought about the water pressing against the gate, the pressure growing with every centimeter of depth, the force that could crush a pin or shear a bronze eye if met with brute strength alone. But the tool did not ask for brute strength. It asked for leverage. It asked for the right angle, the right point of contact, the right moment to apply the force.", "She opened her eyes and reached into her pocket, pulling out a small piece of white chalk she had used to mark the tea trays. She knelt on the wet stone, ignoring the cold seeping through her trousers, and began to draw. Not a picture of the gate, but a diagram of the forces at play. She sketched the channel, the curve of the guide rail, the position of the log wedged broadside. Then she drew the lever, not as a rigid bar, but as a line of action, extending from the pivot point through the head of the axe, finding the exact spot where the force would bite into the silt and break the log’s hold.", "The rain continued to fall, drumming a steady rhythm on the stone. The water continued to rise, inch by inexorable inch. Shu drew, her hand steady, her mind clearing as the lines took shape, finding the answer not in the strength of her arms but in the geometry of the lake.", "◆ Words to know: meniscus – the curved surface of a liquid in a narrow container; meniscus – the curved surface of a liquid in a narrow container; meniscus – the curved surface of a liquid in a narrow container; meniscus – the curved surface of a liquid in a narrow container; meniscus – the curved surface of a liquid in a narrow container"], "img": "img/p110.jpg", "pw": false}, {"no": 111, "ch": 23, "ctitle": "The Drowned Log", "part": "PART FIVE: THE MID-AUTUMN NIGHT", "paras": ["*The Gatekeeper's Rules, Rule 23: A hard problem is usually three easy problems standing close together.*", "Shu wiped the chalk dust from her knees, her trousers dark with rain and mud, and looked at the diagram one last time. The lines were clean, the angles sharp. It was not a picture of a jammed gate; it was a list of three small failures that had conspired to make one large one. The water was pressing too hard. The log was wedged too tight. The lever had no room to swing. She stood up, her joints popping in the cold, and pointed to the first line on her wet paper.", "\"First,\" she said, her voice steady despite the hammering of the storm against the stone arch. \"We cannot pull against the water. The hydrostatic pressure on that bronze frame is now equivalent to a small car parked on it. If we pull, the pin will shear, or the wood will split. We must relieve the head.\" She pointed to the Moon Basin, dark and swollen behind the island’s green rim. \"We build a siphon. From the high water to the channel. We drain a little, just enough to drop the pressure by half a meter. The water will do the work of unloading the gate.\"", "Han, who was shivering in his orange life vest, looked at the island wall, then at Shu. \"Over the wall?\"", "\"Over the wall,\" Shu confirmed. \"A hose is too thin. We need a pipe, or a chain of buckets if we are desperate. But we need volume. Ouyang.\" She turned to the engineer, who was hunching over her waterproof plans, her silver glasses fogged. \"Do you have a pump, or at least a flexible pipe? Something that can move water faster than a human arm can?\"", "Ouyang looked up, wiping her eyes with the back of a gloved hand. She nodded slowly, a professional calculation already moving behind her gaze. \"I have a heavy-duty irrigation line in the camp. It is rated for pressure. It will not break. But it needs a prime. It needs the suction started.\"", "\"Then we start it,\" said Shu. \"And then we float the log.\" She drew a second circle in the chalk. \"Empty drums. Oil drums. We lash them to the log, turning it into a pontoon. If it is buoyant, it will lift off the silt bed. It will stop biting into the channel floor.\"", "\"And the third?\" asked Uncle Liu, who had appeared in the shadows, his leather apron steaming in the cool air.", "Shu drew the final line, a long diagonal across the channel. \"We pull it out. But not with muscles. We use the temple pillars. Block and tackle. Eight strands. A mechanical advantage of eight to one. We do not pull the log. We pull a rope, and the rope pulls the log, and the log moves because the geometry says it must.\" She looked around the group, at the rain and the dark water and the frightened faces. \"Three easy problems. One hard one. We solve them in order. Who has the drums?\""], "img": "img/p111.jpg", "pw": false}, {"no": 112, "ch": 23, "ctitle": "", "part": "", "paras": ["The fishermen of Mistwater Landing did not argue. They had been born on that pier, and they knew that when the water rose, the only language that mattered was the language of hands and rope. Within ten minutes, a dozen men were wading through the slush of the dock, carrying the heavy, dented oil drums from the storage shed. They moved with the efficient, silent grace of men who have done this a hundred times, the drums clanking a dull, metallic rhythm against the wet stone.", "Han and Uncle Liu were already in the water, their boots submerged to the shin, the cold biting into their skin. Han was lashing the drums to the submerged log with thick hemp rope, his movements fast and practiced. Uncle Liu held the log steady with a pry bar, his muscles straining against the mass of the timber. The log was huge, a dark shape of rotted wood and silt, wedged broadside in the channel like a tooth stuck in a jaw.", "\"Ouyang, call it!\" Shu shouted over the rain. She was on the bank, directing the siphon line. Ouyang stood on the low wall, her voice clear and commanding. \"Prime the line! Fill the pipe! Now!\"", "A-Bao, in his bright yellow raincoat, was running up and down the dock, passing buckets of water from one end to the other, a human chain of liquid. The siphon hissed, a high-pitched whine that grew in volume. Then, with a sudden, violent gurgle, the line snapped taut. A rope of water, thick as a man’s arm, arced over the island wall and plunged into the channel.", "The sound was unmistakable. It was not a splash; it was a sigh. The water in the channel dropped, visibly, the black surface falling away from the stone rim. The pressure on the gate eased. The bronze frame, which had been groaning under the strain of the moon, settled.", "\"Did it work?\" Han called out, his face pale with cold and exertion.", "\"Look at the gauge,\" Shu said. She pointed to the needle, which had dropped from the red line to the yellow zone. \"The head is down by half a meter. The log is no longer fighting the water. Now we pull.\"", "The drums, now floating, bobbed gently around the log. The silt bed, disturbed by the change in pressure, released its grip. The log shifted, a small, grinding movement that sent a spray of muddy water over Uncle Liu’s boots.", "\"It's moving,\" Uncle Liu said, his voice thick with surprise. \"By itself.\"", "\"No,\" Shu said, her eyes fixed on the gate. \"It's ready. Now we give it a push.\""], "img": "img/p112.jpg", "pw": false}, {"no": 113, "ch": 23, "ctitle": "", "part": "", "paras": ["The block and tackle was a thing of beautiful, brutal simplicity. Eight strands of hemp rope, thick as a snake, ran from the anchor point on the temple’s stone pillar, down to the log, and back up. The mechanical advantage was eight to one. For every meter of rope Shu pulled, the log moved only twelve centimeters, but the force multiplied. What one person could not do, eight people could do, provided they pulled together, provided they pulled at the same time.", "The village lined up on the rope, not a line but a wave. Aunt Meng stood there, her hair net askew, her red apron tied tight. The fishermen stood shoulder to shoulder, their boots finding purchase on the wet stone. At the very end, A-Bao gripped the rope with small hands, his face set in a mask of determination.", "\"Heave!\" Shu called out.", "They pulled. The rope creaked, a sound like a bowstring under tension, while the log groaned with a deep, resonant vibration that seemed to rise from the earth itself. It did not move.", "\"Again!\" Shu shouted. \"Together! On the count of three! One, two, three, heave!\"", "Granny Hua, who had been sitting on a dry rock with a cup of tea, stood up. She did not pull. She beat time with her carved walking stick, tapping the stone with a steady, rhythmic clack. *Clack. Clack. Clack.* It was the beat of the village, the heartbeat of the landing.", "They pulled again. The rope stretched until it was taut as a wire, and the log shifted, an inch, then two. The silt gave way. The drums bobbed, the water lapping against them. The log slid, grinding against the stone floor of the channel, a sound like a giant clearing its throat.", "\"Keep pulling!\" Shu yelled, her voice raw. \"Do not let go! The momentum is your friend! Let it carry you!\"", "The log began to move with them, the water flowing around them rather than fighting. The rope sang a high, thin note of triumph. The village leaned, their bodies a single unit, their breath a single exhalation. The log slid, faster now, the drums bobbing, the water churning.", "\"Clear!\" Uncle Liu shouted. \"It's clear!\"", "The rope went slack. The log was free."], "img": "img/p113.jpg", "pw": false}, {"no": 114, "ch": 23, "ctitle": "", "part": "", "paras": ["The log shot out of the channel with a speed that surprised them all. It did not slide; it flew. The water, released from its confinement, rushed in to fill the void, pushing the buoyant drums ahead. The log hit the net of the Magpie, the ferry that was waiting just beyond the gate, with a splash that drenched Ouyang from head to toe.", "She sputtered, her white shirt soaked through, her glasses sliding down her nose. \"I am going to need a new shirt,\" she said, shaking her hair, a strand of black clinging to her forehead. \"And I am billing you all for it.\"", "Uncle Liu was already at the lever. He gripped the bronze handle, the cold metal biting into his palms. He did not pull. He waited. He felt the vibration of the water, the long, slow sigh of the basin as it settled. Then, with a steady, deliberate motion, he pulled.", "The gate lurching upward was a small, precise movement. But it was enough. The Moon Dragon, the carved stone head with its bronze eyes, opened by a whole step. The water, held back for thirty years, began to flow. It was not a surge; it was a stream. A steady, continuous flow, moving from the Moon Basin into the Sun Basin, sharing the weight, balancing the level.", "The Moon Basin gave a long, slow, grateful sigh. The water level dropped, just a fraction, but it was a drop that meant the difference between a flood and a lake. The low bank above Mistwater Landing was no longer threatened. The pressure was gone. The balance was restored.", "Shu leaned against the lever, her legs trembling. She looked at the gate, at the water flowing through it, at the faces of the people around her. They were wet, they were tired, they were alive.", "\"We did it,\" Han said, his voice quiet.", "\"No,\" Shu said. \"We started it. There are more steps.\""], "img": "img/p114.jpg", "pw": false}, {"no": 115, "ch": 23, "ctitle": "", "part": "", "paras": ["The tremor started in Shu’s fingers. It was a fine, irritating vibration that had been masked by the effort of the machinery. Now that the gate stood still, the cold of the bronze lever bit through her wet gloves. The shaking climbed up her wrists and settled in her shoulders, as stubborn as a knot in a bamboo joint. It was the physical echo of thirty minutes spent pushing against a wall that had turned out to be a door. The door had swung open onto a wind she had not expected.", "Han saw it. He did not comment on it. He simply shifted his weight closer, his boots sliding slightly on the wet stone. He placed his hand over hers on the cold metal of the lever socket. His palm was warm and dry, a small, solid block of heat against the chill of the bronze. He did not squeeze. He just held, his fingers long and steady. The trembling in her arms began to lose its argument. The rain continued to fall in sheets, drumming a dull rhythm on the stone channel. In the small circle of their joined hands, the world was quiet and fixed.", "A-gong was sitting on the wet rock nearby. His straw hat hung limp on the end of his cane. His white beard was dark with rain, dripping onto the stone. He was laughing. It was a wet, broken sound, a low rumble that seemed to come from the bottom of his lungs, from a place that had been dry and dusty for thirty years. He was crying too, the tears mixing with the rain on his face. He did not wipe them away. He just sat there, leaning on his cane, looking at the water flowing through the gate with an expression of bewildered relief.", "\"Again,\" he said, his voice thick and rough, barely audible over the rain. \"Again, from step five.\"", "Shu looked at him, then at the gate. The water was now flowing in a steady, measured stream, no longer a surge but a current. She straightened her back, feeling the stiffness in her spine. She wiped her hands on her khaki trousers, leaving dark streaks of mud on the fabric. She looked at Han, and he smiled, a small, tired smile. Then he let go of her hand.", "\"Step five,\" she said.", "The night went on. The rain kept falling. The water found its level, inch by careful inch. And they, together, found their way forward.", "◆ Words to know: siphon – a tube that moves liquid from a higher to a lower level; buoyant – tending to float or rise in a fluid; tension – the state of being stretched or pulled tight; deliberate – done consciously and intentionally; vibration – a rapid, regular back-and-forth movement"], "img": "img/p115.jpg", "pw": false}, {"no": 116, "ch": 24, "ctitle": "The Water Meets", "part": "PART FIVE: THE MID-AUTUMN NIGHT", "paras": ["*The Gatekeeper's Rules, Rule 24: A good decision is made with the numbers in one hand and the people in the other.*", "The lever groaned, a long, low complaint of bronze on stone, and then the gate swung. The water, held back by thirty years of silt and fear, did not rush so much as remember its destination. It poured into the channel with a steady, muscular force, and Shu felt the vibration travel up the lever, through her arms, and settle in her teeth.", "\"Step six,\" she called out, her voice sounding small against the roar of the flow.", "Ouyang Min was at the staff gauge, her silver glasses fogged, wiping them with the hem of her white shirt. She read the level, then looked at Shu. \"Moon Basin dropping. Fast. But stable.\"", "Shu watched the water. In the channel, the two currents, the deep dark water from the Moon Basin and the lighter, tea-colored water from the Sun Basin, met and swirled into a single, powerful stream. They mixed with the quiet certainty of tea leaves settling at the bottom of a pot. The seiche, that slow, terrifying sloshing of the basins against each other, began to dampen. The water in the Sun Basin, which had been a dry, cracked floor of mud that morning, was rising. It lapped at the first stone step of the cove. Then the second.", "\"Levels are converging,\" said Ouyang, her voice tight with the precision of a woman who loves a good equation coming true. \"The head is equalizing. We are within ten centimeters of the old mark.\"", "Shu looked across the channel, to the far bank. The water there was falling, too, gently, like a held breath finally let go. The two halves of the lake were no longer strangers. They were meeting in the middle, in the stone throat of the island, and finding a common ground. The air smelled of wet stone and ozone. The rain was still falling, but it was lighter now, a fine mist that turned the lanterns on the temple roof into glowing eyes.", "\"Step seven,\" Shu said.", "The lever moved again. The water exhaled. And for the first time in thirty years, the lake was whole."], "img": "img/p116.jpg", "pw": false}, {"no": 117, "ch": 24, "ctitle": "", "part": "", "paras": ["The rain stopped. It did not taper off or fade into a drizzle; it simply ceased, as abruptly as a tap being turned off at the source. The clouds, which had hung low and heavy over the ridges all day, began to tear open. It was a slow, majestic parting, like the heavy silk curtain being drawn back in a theater, revealing the sky beyond. And there, rising over the green peaks of Elder Peak, was the moon.", "It was enormous. It was orange, heavy, and real, hanging low enough that it seemed to touch the water. It sat in the Moon Basin, which was no longer a crescent of dark, threatening depth, but a full, rounded body of light. The light spread across the water, a path of silver and gold that reached all the way to the Sun Basin, connecting the two halves in a single, unbroken line.", "The village was silent. Every person who had been on the dock, on the steps, in the houses, had stopped what they were doing. The fishermen with their nets. The children with their lanterns. Aunt Meng, who had been frying taro balls, stood in her red apron, a wooden spoon in her hand, staring. The silence was so complete that Shu could hear the water settling in the channel, a soft, rhythmic lapping, the sound of a lake breathing.", "Then, from the top of the Lantern Temple, the bell rang. It was a deep, resonant note, clear and true, that rolled over the water and into the chests of everyone standing on the shore. It rang once. Twice. Three times. And then, the silence broke.", "It started as a murmur, a low hum of voices, and then it swelled into a roar. People clapped. They shouted. They called out to each other. The sound of cheering rose up around Shu, a warm, chaotic wave of relief and joy. She stood in the center of it, her hands still on the cold bronze lever, and for a moment, she could not move. The moonlight was on her face. The water was whole. And the village was alive."], "img": "img/p117.jpg", "pw": false}, {"no": 118, "ch": 24, "ctitle": "", "part": "", "paras": ["The temple hall was a mess of wet wool and damp wood. The floor was slick, and the air smelled of rain and incense. The villagers sat on low benches, their clothes dark with moisture, their faces bright with excitement. Elder Chen sat at the front, his brown wool vest soaked, his glasses on a chain around his neck. He looked at the crowd, then at Shu, who stood by the door with Han and Ouyang.", "\"We have two plans,\" Elder Chen said, his voice cracking slightly. He cleared his throat. \"The company plan, which means concrete and a dam. And the keeper plan, which means the gates, the pumps, and the lake staying as it is.\"", "He looked at Ouyang, who was standing quietly by the wall, her yellow hard hat under her arm. Then he looked at Shu. \"We vote by lanterns.\"", "They stood up, one by one, and lit a small red lantern. The light filled the hall, a sea of warm red. The vote was not close. It was not even a debate. It was a relief. The lanterns for the keeper plan outnumbered the others by a landslide. Elder Chen announced the result, his voice steady now, and the room erupted in applause again.", "Ouyang stepped forward. She looked at Elder Chen, then at Shu. She bowed, low and deep, in front of everyone. It was a gesture of respect, and of surrender, and of recognition. Shu stared at her. Ouyang straightened up, her glasses sliding down her nose, and smiled. It was a small, tired smile, but it was real.", "\"Your numbers,\" Ouyang said, her voice clear in the noisy room. \"They were better.\"", "Shu did not know what to say. She just nodded, her heart beating fast. The air in the room was thick with the smell of wet wool and the glow of the lanterns. They had done it. They had saved the lake. And they had done it together."], "img": "img/p118.jpg", "pw": false}, {"no": 119, "ch": 24, "ctitle": "", "part": "", "paras": ["Granny Hua stood up.", "The noise in the hall settled into a hush. The old woman was tiny, barely visible in her plum-colored quilted jacket, but her presence filled the space. She leaned on her carved walking stick, her silver hair neat in its bun, her jade pin catching the light from the red lanterns. She looked at the glow, then at the faces of the people. Her eyes were sharp, clear, and kind.", "\"You have your vote,\" she said, her voice thin but carrying. \"You have your plan. But I want to say one thing.\"", "She paused, looking at Shu, then at Ouyang, then at the young men and women who had built the pumps and fixed the gates.", "\"The old knowledge and the new numbers were never two languages. They are one language, and it took a lake to make us hear it. Keep what was built with care. Ask the ones who live with it. That is all the law there is.\"", "She sat back down. The room was silent. It was not the silence of shock, but of understanding. It was the silence of a truth that had been waiting to be spoken, and now that it had been, it settled into the hearts of everyone in the room. Shu felt a lump in her throat. She looked at her grandfather, who was sitting in the corner, his hat on his knee. He was nodding, slowly, his white beard twitching.", "Ouyang looked at her notes, then at the water outside the window. She picked up her roll of plans, and for a moment, her posture shifted. Her shoulders dropped the rigid line of the survey camp. She straightened, not to present, but to listen.", "\"Granny is right,\" she said softly. \"The gate is the heart. The pump is the muscle. The water is the blood. They all need each other.\"", "Shu smiled. It was a small, tired smile, but it was the best one she had felt in thirty days."], "img": "img/p119.jpg", "pw": false}, {"no": 120, "ch": 24, "ctitle": "", "part": "", "paras": ["Shu’s legs had turned to packed silt. Her arms still trembled, a fine vibration left over from wrestling the lever’s stubborn bronze. She slid down the wall until her back hit the cool timber, closing her eyes against the roar of the celebration. The noise was a dull, rhythmic thrum, like the cicadas in the bamboo grove that never truly stopped, even in the dark.", "Han appeared in her peripheral vision. He did not speak. He simply unclipped his orange life vest, shrugged it off his shoulders, and draped it over her. The fabric was damp. It carried the sharp, clean scent of lake water and rain. She pulled the collar up, tucking her chin into the bright nylon. It was a small gesture. But it anchored her to the room, to the people, to the night.", "Near the door, A-Bao stood in his soaked yellow raincoat, his face flushed with exhaustion. He clutched the bamboo basket to his chest, where Dumpling sat in a silent, feathered huddle, head tucked under one wing. The boy’s eyelids kept fluttering shut, his head bobbing against the basket’s rim. He swayed for a moment, a metronome winding down, before his knees buckled. He settled onto the floorboards and was asleep before his cheek touched the wood.", "A-gong’s cane tapped a slow, deliberate rhythm on the floor as he approached. He stopped just out of reach, looking down at her with eyes that held a sharp, clear light she had rarely seen. He reached out and placed his palm flat on the top of her head. The touch was light, dry, and steady.", "\"Keeper Tsai,\" he said.", "The title hung in the air, heavy with the history of thirty years of silence. It was not just a name; it was a transfer of duty, a bridge between the old stone and the new steel. Shu looked up, her eyes stinging, but she held her tongue. She did not offer a thank you, nor a promise. She simply let his hand rest there, feeling the warmth of it seep into her skin.", "Outside, the full moon hung high and silver, and the lake lay whole and breathing beneath it. The fear that had tightened her chest for a month finally uncurled, leaving only the quiet, satisfying ache of work well done.", "◆ Words to know: seiche – a standing wave in a body of water; converging – coming together from different directions; resonant – having a deep, full, and clear sound; rigid – stiff, inflexible, or unyielding; peripheral – relating to the edges or outer limits"], "img": "img/p120.jpg", "pw": false}, {"no": 121, "ch": 25, "ctitle": "Lantern Night", "part": "PART FIVE: THE MID-AUTUMN NIGHT", "paras": ["*The Gatekeeper's Rules, Rule 25: The lake keeps nothing for itself. It gives its level to everything it touches.*", "The morning sun poured itself out across the water, spilling gold over the Sun Basin and silver across the Moon, until the distinction between the two halves became a matter of opinion rather than physics. Shu stood on the stone steps of the cove, her rain boots squelching softly in the thin layer of algae that had returned to the rock, and watched the lake breathe. The forty-one carp that had been stranded in the mud were gone, swept back into the deep channel by the night’s surge, but the water they had left behind was a different water. It was clear, cold, and tasted of stone, even from the shore.", "Aunt Meng had set up her stall before the mist had fully lifted, a strategic decision that earned her a line of villagers stretching around the dock and down the hill. The air was thick with the scent of frying oil and scallions, a sharp, savory cloud that cut through the dampness of the rain-washed valley. Shu could hear the spatulas hitting the pans, a rhythmic clack-clack-clack that sounded like a heartbeat, and beneath it, the lower murmurs of people who had spent the last thirty days worrying and were now simply hungry.", "She walked along the pier, her hands tucked into the pockets of her indigo jacket, and counted the boats. Every hull was wet. Every net was coiled. The lake had not just returned; it had asserted itself. It had filled the gaps, smoothed the wrinkles in the earth, and reminded everyone, with the quiet authority of a fact, that it was the most important thing in the valley. A blue magpie landed on the railing, tilted its head, and complained about the humidity.", "Shu stopped at the end of the pier, where the water lapped against the wood with a gentle, persistent rhythm. She felt the plumb bob against her chest, a small, heavy anchor of brass and bamboo. It had been a tool, a measure of depth and direction. Now it felt like a promise. She touched it, just once, and smiled at the water. The water, in its way, smiled back."], "img": "img/p121.jpg", "pw": false}, {"no": 122, "ch": 25, "ctitle": "", "part": "", "paras": ["The house was quiet, a different kind of quiet than the one that had ruled the last month. It was the silence of a room after a long argument, where the air has been scrubbed clean of dust and anger. A-gong sat in his cane chair by the window, the tea leaves on the trays behind him drying in the warm light. He did not look at Shu when she entered. He looked at the wall, where the brass key on its cord hung, and then, with a movement that was slow but deliberate, he reached up and took it down.", "He stood, leaning on his cane, and walked to where Shu stood. He did not speak. He simply held out the plumb bob, the one that had belonged to the keepers for three generations, its surface worn to a high shine by hands that had been dust long ago. Shu hesitated. She already wore the plumb bob that had been his, worn smooth by his hand and then by hers. This was the first keeper's, older, kept in a drawer. It was heavier. It held the history of every decision, every measurement, every night the gates had been closed.", "A-gong bowed his head, a small, precise nod, and placed the old bob in her palm.", "\"This one has seen every night of the lake,\" he said, his voice dry and soft. \"It knows when to be still.\"", "Shu closed her hand around it. The brass was warm. She did not take it off her neck; instead, she tied the cord around the back of her neck, so that the first keeper's bob hung on her left side and her own on her right. Two weights, two measures, one level.", "The door opened. Uncle Liu stood there, holding a heavy iron key on a chain. He looked at Han, who was standing in the doorway, still in his orange life vest, his hair damp from the night’s rain. Uncle Liu did not smile. He simply held out the key.", "\"The Magpie,\" he said. \"She’s yours now. Don’t let her rust.\"", "Han took the key. His eyes were bright, but his face was serious. He tucked the key into his pocket, right next to his whistle. It felt, he thought, like the most important thing he had ever held."], "img": "img/p122.jpg", "pw": false}, {"no": 123, "ch": 25, "ctitle": "", "part": "", "paras": ["Ouyang Min stood at the end of the pier, her white shirt crisp against the humid air, the yellow hard hat tucked under her arm. She had stayed the night, not because she had been asked to, but because she wanted to see the lake level with her own eyes. Now, as the sun climbed higher, she was ready to leave. The roll of final plans was tight and secure against her side.", "She turned to Shu. There was no awkwardness between them, no lingering tension. Just the comfortable silence of two people who had solved a problem together.", "\"Spring,\" Ouyang said. \"I’ll be back in spring. We’ll build the microturbine. Not above the lake. With it.\"", "Shu nodded. She understood. The numbers had to match the water, and the water had to match the people. It was a simple equation, but it was the only one that mattered.", "A-Bao appeared at Shu’s side, holding out his hand. In his palm was a single, tiny tuft of fluff, yellow and soft. It was not a feather, exactly. It was something smaller, lighter, a piece of the duckling’s promise.", "\"For the engineer,\" A-Bao said, with the solemn gravity of a child delivering a state secret. \"So you don’t forget us.\"", "Ouyang looked at the fluff, then at the boy, and then at Shu. She took it gently, placing it in the pocket of her shirt.", "\"I won’t forget,\" she said.", "She extended her hand to Shu. Shu took it. The handshake was firm, professional, and lasted a second longer than necessary. Then, without warning, Ouyang pulled her into a brief, tight hug. It was quick, efficient, and warm. She smelled of coffee and rain.", "\"Good luck, Keeper,\" Ouyang said, releasing her.", "Shu smiled. She watched the engineer walk down the dock, her white sneakers crisp against the wet wood, and then she looked back at the lake. The water was still. The air was clear. The future was a thing they would build, one measurement at a time."], "img": "img/p123.jpg", "pw": false}, {"no": 124, "ch": 25, "ctitle": "", "part": "", "paras": ["The lanterns were out before the stars came up. Hundreds of them, red paper and warm light, drifting slowly across the water from the docks and the temple steps. They moved with a lazy, purposeful grace, carrying the prayers and the hopes of the village out onto the surface of the lake. The air was cool, the kind of crisp, clean cold that comes after a storm, and the smell of fried dough and tea lingered in the background.", "Han and Shu stood at the end of the pier, their hands clasped between them. He was taller, his orange vest now a familiar part of his silhouette, and she was looking up at him, her braid swinging slightly as she turned her head. The water below them was a dark mirror, reflecting the sky, the moon, and the drifting lanterns. The moon sat directly on the Moon Basin, a perfect silver disk, while the lanterns gathered in the Sun Basin, a cluster of warm, glowing points.", "It was the old coin, the sun and the moon, floating on the water.", "\"I told no jokes tonight,\" Han said, his voice low and quiet.", "Shu turned to look at him. He was smiling, a small, shy smile that she had not seen before, the kind of smile that appeared when someone was trying very hard to be serious but was failing.", "\"I noticed,\" she said.", "He laughed, a short, surprised sound. \"I was trying to be deep.\"", "\"You were trying to be quiet,\" she corrected. \"It’s a good thing. You should do it more.\"", "He looked at her, his eyes dark in the moonlight, and then he leaned in. The kiss was quick, a soft press of lips against her cheek, barely a touch. It was not a promise, exactly. It was an acknowledgment. A recognition that they were here, now, in this moment, with the lake and the moon and the lanterns.", "They stood there for a long time, watching the lights drift toward the island. The water was calm. The air was still. The world was balanced."], "img": "img/p124.jpg", "pw": false}, {"no": 125, "ch": 25, "ctitle": "", "part": "", "paras": ["At midnight, Shu climbed the steps of the Lantern Temple alone. The stone was cool under her feet, worn smooth by generations of visitors who had come before her. She carried her notebook, the one with the square handwriting and the underlined measurements, and sat down on the lowest step, her back against the carved wall.", "The lake was quiet. The lanterns had drifted further out, a field of red stars on the black water, stretching toward the horizon. The moon hung high, bright and steady, casting a path of silver light across the Moon Basin. The Sun Basin lay deep and dark blue, holding the warmth of the lights. The two halves were distinct, yet they belonged to the same body. They were part of the same story.", "Shu opened her notebook. She uncapped her pen and wrote, in her careful, precise hand:", "*Day 30. Moon Basin and Sun Basin: Level. Head: Zero.*", "She paused. The pen hovered over the page. She thought of A-gong’s hand on her head. She thought of Uncle Liu’s key. She thought of Ouyang’s hug. She thought of the forty-one carp, swimming in the deep water, carrying their small lives back into the flow of the world.", "She wrote, in smaller letters, below the numbers:", "*Rule 26: The lake does not own the water. The water owns the level. We are just the ones who learn to listen.*", "She closed the book. The sound was soft, a small click that seemed to echo in the quiet air. She looked out at the lake, at the moon, at the lanterns. The water breathed, a slow, rhythmic rise and fall that she could feel in the stone beneath her.", "She was the keeper. She was the listener. And the lake, for the first time in thirty years, was listening back.", "*Author's note. The lake in this story is invented, but it is inspired by a real one: Sun Moon Lake in central Taiwan, named for its shape, a round eastern half like a sun and a crescent western half like a moon. The old tale of two dragons that played with the sun and the moon in the lake, and of the golden axe and scissors waiting on a sacred mountain, is a legend of the Thao, the Indigenous people of that lake, who are few in number today and whose language is nearly lost. Mistwater Landing, Shu's family, the Dragon Gates and everything the characters do here are made up, and no real Thao rite, name or sacred place appears in these pages. If this story made you curious, please look for Thao voices and sources, and read the legend from the people who tell it.*", "◆ Words to know: assert – to state firmly or establish authority; deliberate – done consciously and with careful intention; persistent – continuing firmly or steadily over time; acknowledgment – a recognition or admission of a fact; precise – exact, accurate, and carefully defined"], "img": "img/p125.jpg", "pw": false}], "chapters": [{"n": 1, "title": "The Carp in the Mud", "part": "PART ONE: THE SUN GOES OUT", "page": 1}, {"n": 2, "title": "Aunt Meng's Weather Report", "part": "PART ONE: THE SUN GOES OUT", "page": 6}, {"n": 3, "title": "Granny Hua's Dragons", "part": "PART ONE: THE SUN GOES OUT", "page": 11}, {"n": 4, "title": "The Woman with the Plans", "part": "PART ONE: THE SUN GOES OUT", "page": 16}, {"n": 5, "title": "Twenty-Nine Days", "part": "PART ONE: THE SUN GOES OUT", "page": 21}, {"n": 6, "title": "A Level Made of Water", "part": "PART TWO: THE TWO DRAGONS", "page": 26}, {"n": 7, "title": "Bamboo Soundings", "part": "PART TWO: THE TWO DRAGONS", "page": 31}, {"n": 8, "title": "Under the Island", "part": "PART TWO: THE TWO DRAGONS", "page": 36}, {"n": 9, "title": "The Weir and the Flow", "part": "PART TWO: THE TWO DRAGONS", "page": 41}, {"n": 10, "title": "A-gong's Silence", "part": "PART TWO: THE TWO DRAGONS", "page": 46}, {"n": 11, "title": "The Trail to Elder Peak", "part": "PART THREE: THE GOLDEN AXE", "page": 51}, {"n": 12, "title": "The Camphor Forest", "part": "PART THREE: THE GOLDEN AXE", "page": 56}, {"n": 13, "title": "The Storm on the Ridge", "part": "PART THREE: THE GOLDEN AXE", "page": 61}, {"n": 14, "title": "The Shrine of the Keepers", "part": "PART THREE: THE GOLDEN AXE", "page": 66}, {"n": 15, "title": "A Hundred and Fifty Years of Water", "part": "PART THREE: THE GOLDEN AXE", "page": 71}, {"n": 16, "title": "Down the Mountain", "part": "PART FOUR: THE OLD KEEPER", "page": 76}, {"n": 17, "title": "The Night of the Great Flood", "part": "PART FOUR: THE OLD KEEPER", "page": 81}, {"n": 18, "title": "A New Pin", "part": "PART FOUR: THE OLD KEEPER", "page": 86}, {"n": 19, "title": "The Company's Better Idea", "part": "PART FOUR: THE OLD KEEPER", "page": 91}, {"n": 20, "title": "The Practice Open", "part": "PART FOUR: THE OLD KEEPER", "page": 96}, {"n": 21, "title": "Day Thirty", "part": "PART FIVE: THE MID-AUTUMN NIGHT", "page": 101}, {"n": 22, "title": "Staged Opening", "part": "PART FIVE: THE MID-AUTUMN NIGHT", "page": 106}, {"n": 23, "title": "The Drowned Log", "part": "PART FIVE: THE MID-AUTUMN NIGHT", "page": 111}, {"n": 24, "title": "The Water Meets", "part": "PART FIVE: THE MID-AUTUMN NIGHT", "page": 116}, {"n": 25, "title": "Lantern Night", "part": "PART FIVE: THE MID-AUTUMN NIGHT", "page": 121}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${p.pw?'pw':(first?'center':(p.no%2?'f-right':'f-left'))}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
</body>
