<script>
const D = {"title": "The Lake That Swallowed the Sun", "sub": "A Novel of Water, Gates and Old Promises", "author": "Yang", "publisher": "Yang Ink", "pages": [{"no": 1, "ch": 1, "ctitle": "The Carp in the Mud", "part": "PART ONE: THE SUN GOES OUT", "paras": ["*The Gatekeeper's Rules, Rule 1: Water always finds its level, and it is never impatient about it.*", "On the morning the sun went out of the east half of the lake, Shu Tsai was standing in her green rain boots in the middle of what had been a fishing cove, holding a bamboo pole upright in the mud and explaining to forty-one stranded carp that none of this was her fault.", "The carp, to their credit, listened. They lay in a scatter of shallow puddles with their gold-bronze sides heaving and their round mouths opening and closing like a council of very old men who have lost the thread of the argument. Behind them the lake, which had stood against the cove's stone steps at bedtime the night before, had drawn back a full hundred meters in the dark, as neatly as a tablecloth being pulled off a table, and left everything on it standing. There were upturned dinghies. There was a rope that had once held a boat. There was a single blue flip-flop, set at an angle that suggested it was still waiting for its owner to come back and finish the thought.", "It was barely six. The mist was lifting off Two-Light Lake in long slow sheets, and under it the camphor ridges stood up out of the whiteness like folded green paper, and somewhere in the bamboo above the terraces a blue magpie was complaining in a voice like a rusty hinge. Shu was sixteen. She had slept four hours, her braid was coming loose from its red cord, and she was in possession of exactly one fact, which she meant to protect: whatever had happened to the lake, it had happened to the *east* half only.", "\"What do carp eat,\" asked a small voice behind her, \"when there isn't a lake?\""], "img": "img/p001.jpg", "pw": false}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["Tsai Bao, who was eleven and went by A-Bao to everyone including his teachers, stood at the edge of the stone steps in a yellow raincoat that came down to his sandals, holding a bamboo basket in both arms as though it contained the crown jewels. It contained a duckling. The duckling was named Dumpling and had been awake for exactly as long as A-Bao had, which was too long, and it was peering over the rim of the basket at the mud with the expression of a creature who has been promised a swimming lesson and is beginning to suspect fraud.", "\"They eat what they always eat,\" said Shu. \"Mud and small things. But they need the water to carry the small things to them. It is the water that does the feeding. The carp only open their mouths.\"", "\"So the lake was the table,\" said A-Bao.", "\"Yes.\"", "\"And now there's no table.\"", "\"There is a table,\" said Shu. \"It has moved. Hold the pole.\"", "She took out of her collar the thing she carried everywhere, a brass plumb bob the size of a plum on a long cord, its bamboo handle worn smooth by her grandfather's hand and then her own, and hung it from the top of the pole. It swung once, steadied and hung perfectly still: the one object in the world, her grandfather liked to say, that never told a lie about *down*. Beside the cove's stone steps the old keepers had cut a line into the rock with a chisel, a notch the width of a thumb, and beside the notch a character so weathered that only the family could read it. *Level.* The notch was where the lake belonged. Shu knelt in the mud, set her folding rule against the stone, and read the distance from the notch to the place where the water now began, a long grey way across the cove. She read it twice and a third time. Then she read it a fourth time, because the number kept being absurd.", "\"Two meters and ten centimeters,\" she said. \"Below the mark.\"", "\"Is that a lot?\"", "\"It is a lot for a lake to lose in one night, when nobody has opened a gate.\"", "She wrote it in her notebook and underlined it twice. A-Bao looked at the underlining, then at his sister, and said with great seriousness that he would take notes on the notes."], "img": "img/p002.jpg", "pw": false}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["By seven the news had gone round Mistwater Landing the way news does in a village built on a hill above a lake, which is to say downhill, quickly and with additions. Fishermen in rubber boots came picking across the mud with nets and buckets. A woman who sold tea carried a kettle out of pure reflex and then stood in the cove holding it, unable to think what to boil it for. Aunt Meng arrived from the dock stall with a red apron over her nightclothes and a great flat net over one shoulder, a round and cheerful woman with a hair net and a voice that could hold a conversation across two ferry piers.", "\"The weather!\" she announced to nobody and everybody. \"It's the weather. It is always the weather. Last night the lake was a lake and this morning she is a puddle, and I, who have sold fish ball soup on that pier for twenty-six years, say the weather has done it. Pass me that carp. No, the other one, the sulking one.\"", "They carried the fish in buckets across the mud to the deep channel that still held water, a procession of wet and muttering people, passing the buckets from hand to hand while the sun climbed over the ridge. The carp went in with a slap and a flash and were gone. Somebody started a rumor; it was a good rumor, because it was short and frightening. The lake, it said, had swallowed the sun. It was the old story, the dragons, the two lights, and the east half of the lake, the half that was shaped like the sun, was dark now, wasn't it, and dry, and gone.", "\"That's not what happened,\" said Shu, to a fisherman who was standing very close to her with a bucket and a look of reverent dread.", "\"No?\" said the fisherman. \"Then what happened?\"", "She opened her mouth and, to her great annoyance, found that she did not know."], "img": "img/p003.jpg", "pw": false}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["She did know one other thing. It had occurred to her somewhere between the third bucket and the fourth, and it sat in the back of her mind like a stone in a shoe. When she was small, her grandfather had taken her out in the Magpie, the village ferry, and shown her the lake from the middle: two bays of water curving away on either side of Lantern Island, the east one round and wide, the west one a thin silver crescent, so that from the ridge above the whole thing looked exactly like the old coin of sun and moon on the temple door. East was the Sun Basin. West was the Moon Basin. Between them the island with its red lanterns, and under the island, somewhere, the channel where the two halves of the lake touched.", "She turned and looked west across the island. Then she stopped holding the bucket.", "The Moon Basin was *high*. Even from here, across the island's green back and the red lantern roofs of the temple, she could see how the dark water lay up against its far bank like a full cup that a nervous waiter is carrying across a room. It lapped at the foot of the Lantern Temple's lowest steps. It crowded the stone wall below the lower village. One half of the lake was empty, and the other was very nearly full, and a person with any common sense and a ruler would have wanted to know whether those two facts belonged together.", "\"A-gong,\" said A-Bao, and pointed.", "Her grandfather had come down to the water's edge, a slight lame figure in a faded grey padded vest and a straw hat, leaning on his bamboo cane, and for some time he stood quite still and looked at the mud as though it had insulted him. He did not look at the carp. He did not look at the people. He looked at the long, bare, shining floor of the cove where the lake had been, and Shu, watching his face, saw something cross it that she would later have trouble describing. It was not surprise. Nobody could have called it surprise.", "\"Go home,\" said A-gong, in his dry gentle voice, \"and eat.\""], "img": "img/p004.jpg", "pw": false}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["At home, in the courtyard behind the house with the tin roof, the tea leaves were drying on their bamboo trays in the new sun, and A-gong sat in his cane chair beside them with his hat on his knee and would not explain anything at all.", "Shu tried. She tried with rice porridge and with pickled radish, with a question about the notch in the stone and another about the old lake, in her most reasonable voice and then in her most pitiable one. Her grandfather ate his porridge. He wiped his bowl with a piece of bread. He said, once, that the tea would be ready by the end of the week if the rain held off, and the whole sentence was like a door shutting very softly at the far end of a long corridor. A-Bao, who understood the grammar of silence rather better than most eleven-year-olds, went to teach Dumpling to float in the washtub.", "She sat down on the doorstep with her notebook. *2.1 m*, it said, in her own square handwriting, and she underlined it a third time. Under it she wrote, because she had been taught to write down what she did not know as carefully as what she did: *West basin high. East basin low. Why both?* And under that, more slowly: *Who closed the lake?*", "The sun moved across the trays. Behind her grandfather's chair, hanging from a nail in the wall where it had hung for as long as she had been alive, was the brass key on its faded cord, the one she had never once seen him use. It looked, in the afternoon light, very much like a key that had been waiting a long time for someone to ask what it opened.", "She did not ask. Not yet. But she wrote *KEY?* on the corner of the page, and drew a small, careful circle around it, and counted the days on her fingers, though she did not yet know that there were thirty of them, nor what they were for.", "◆ Words to know: reflex – an automatic, unconscious reaction; reverent – showing deep respect or awe; pitiable – deserving or evoking pity; grammar – the underlying rules or structure"], "img": "img/p005.jpg", "pw": false}, {"no": 6, "ch": 2, "ctitle": "Aunt Meng's Weather Report", "part": "PART ONE: THE SUN GOES OUT", "paras": ["*The Gatekeeper's Rules, Rule 2: Write it down, and then write down how you know it.*", "By mid-morning, the dock at Mistwater Landing had become a parliament of the aggrieved, with Aunt Meng presiding over a steaming pot of fish ball soup and a griddle that spat out scallion pancakes with the aggressive crackle of a radio playing a song nobody wanted to hear. The pier, usually a bustling hub of boat repairs and haggling, now jutted out over a flat expanse of grey mud that stretched toward the horizon like a dried-out swimming pool after the drain had been left open for a month. A blue magpie sat on the edge of the pier, tilting its head, looking at the mud with the critical suspicion of a janitor who has just been told that the floor is now a permanent fixture of the building.", "Shu sat on a crate, eating a pancake that was too hot to chew immediately, and listening. The theories were arriving in thick, contradictory waves. Old Fong, who had fished these waters for forty years, insisted it was the plum rain, a delayed reaction to the storms last spring that had finally decided to empty the basin. Someone else, a young man with a net over his shoulder, suggested the lowland power company had opened a sluice to test a new turbine, leaking the water into the river below before it could reach the terraces. A third voice, quiet and dangerous, mentioned the dragons again, not as a story, but as a mechanism.", "\"It's the balance,\" said the quiet man, tapping his pipe on the pier's edge. \"The lake has two halves. One is empty. One is full. It is just a matter of time before the full one spills over, and then we will know which way the water wants to go.\"", "Shu chewed her pancake slowly. It was dense, layered with green scallions, and it tasted of salt and effort, which was a better way to describe the lake than \"drained.\" She looked at the mud. She looked at the deep channel that still held water, a narrow vein of blue in the middle of the grey. She looked at the Moon Basin, high and dark across the island, pressing against its banks like a bruise under the skin.", "\"The balance,\" she said, mostly to herself. \"Or the malfunction.\"", "Aunt Meng slid a second pancake onto the griddle. \"Eat,\" she said, with the brisk authority of a woman who had fed generations of hungry fishermen and intended to feed this one as well. \"You are thinking too hard. Thinking is for people who have not eaten. Eat first. The lake will still be there when you finish, and it will be just as confused.\"", "Shu took a bite. It was perfect. The oil crackled, the scallions were crisp, and for a moment, the problem of the lake felt small enough to fit inside her mouth."], "img": "img/p006.jpg", "pw": false}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["The ferry *Magpie* was a long, narrow boat with a white hull and a single wooden cabin, and it cut through the water with the smooth, confident glide of a creature that knows exactly where it is going and does not care what the land thinks. Liu Han stood at the stern, his orange life vest bright against the grey sky, his whistle hanging on a lanyard around his neck like a talisman against boredom. He was tall, wiry, and his black hair was messy in the way that suggested he had just rolled out of bed and decided that this was a perfectly reasonable state for a professional ferryman to be in.", "\"Ready?\" he called, his voice carrying over the water with the ease of someone who had spent his whole life shouting across a lake. \"Or do you need to consult your notebook one more time?\"", "Shu stood on the pier, her green boots muddy, her notebook tucked under her arm. \"I have already written down that the east basin is two meters and ten centimeters below the mark,\" she said. \"I am ready.\"", "\"Good. Then hold the rope. And stop frowning. You frown like a cat that has stepped on a lemon. It is unbecoming for a girl who is about to save the world, or at least the lake.\"", "Shu took the rope. It was thick, rough, and smelled of tar and salt, and it felt solid in her hands, a direct connection to the boat, to Han, to the water. She stepped onto the ferry, her boots finding their footing on the wet wood, and Han pushed off from the pier with a gentle shove of his oar. The boat glided away, leaving the mud and the parliament of the aggrieved behind, and heading straight for the deep channel that separated the Sun Basin from the Moon Basin.", "As they moved, Shu looked back. The dock was shrinking, the people becoming small dots, the pier a thin line of wood against the grey. She looked forward. The Moon Basin was waiting, dark and high, its surface rippling with a subtle, restless energy that she could feel in the boat’s hull, a vibration that was not quite a wave, but a pulse.", "\"What do you think it is?\" she asked, her voice quiet, almost lost in the sound of the water.", "Han looked at her, and for a moment, his face was serious, stripped of its usual jokes and easy charm. \"I think,\" he said slowly, \"that it is time to see how much higher it is.\""], "img": "img/p007.jpg", "pw": false}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["The Moon Basin was not merely high; it was swollen. The water pressed against the banks with a force that defied the gentle curve of the shore, its brown surface thick with sediment. It rolled in long, slow swells that broke against the stone wall with a dull, heavy thud. It looked less like a lake and more like a bicep that had been flexing for so long it had forgotten how to relax. Han guided the *Magpie* into the narrow channel. The water around the boat was dark and deep, the current pulling at the hull with a steady, inexorable tug.", "Shu stood in the center of the boat, her eyes fixed on the water. She reached into her pocket and pulled out her folding rule, the same one she had used to measure the drained cove the previous day. She held it up against the side of the boat, where the depth marks were painted in white. The numbers were slightly faded but still legible. She looked at the water line, then at the marks, and her brow furrowed.", "\"It’s higher,\" she said. \"Han, it’s higher than it was yesterday.\"", "Han adjusted his course, the oar dipping into the water with a smooth, practiced motion. \"How much higher?\"", "Shu thought for a moment, her mind working through the numbers, the distances, the angles. \"About a hand’s width,\" she said finally. \"Maybe more. The water line is right at the twelfth mark. Yesterday it was at the tenth.\"", "Han nodded, his expression thoughtful. \"That matches what I’ve seen. The water has been rising every day. Slowly, but steadily. It’s like the lake is trying to breathe, but something is holding its breath.\"", "Shu looked at the water, at the way it moved, the way it pressed against the banks. She thought about the two basins, the empty one and the full one, the difference in level, the head. She thought about the gates, the two carved dragon heads that she had seen from the shore all her life, but never truly looked at.", "\"We need to see them,\" she said. \"The gates. Now.\"", "Han looked at her, and a smile tugged at the corner of his mouth. \"You always want to see the thing that is broken,\" he said. \"It’s a bad habit, Shu. But I suppose that’s why you’re the gatekeeper’s granddaughter.\""], "img": "img/p008.jpg", "pw": false}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["The Lantern Island rose out of the mist like a green island in a bowl of white, its slopes covered in dense bamboo and camphor trees, their leaves dark and glossy in the dim light. The Lantern Temple sat on the highest point of the island, its red roofs visible even in the haze, the red lanterns hanging from the eaves like a string of ruby beads. The air was cool and damp, smelling of wet stone and old wood, and the sound of the water was a constant, low hum, a reminder that the lake was still there, still moving, still alive.", "They stepped off the ferry onto the stone dock, the wet wood creaking under their boots. The path to the temple was narrow, paved with flat stones that were slick with moss, and on either side, the bamboo grove stood tall and silent, their leaves rustling in a breeze that seemed to come from nowhere and everywhere at once. Shu walked quickly, her boots making a soft, rhythmic sound against the stones, her mind racing with thoughts of the gates, the water, the difference in level.", "Han walked beside her, his hand resting lightly on his oar, his eyes scanning the surroundings with the alertness of a swimmer who knows the water better than land. \"You know,\" he said, \"I’ve been on this island a hundred times. I’ve never really looked at the gates.\"", "\"Because they’re behind the temple,\" Shu said. \"And the temple is busy. And the gates are... well, they’re old. And stone. And nobody talks about them.\"", "Han laughed, a short, sharp sound. \"Nobody talks about them because they’re just decoration. Carved stone. Pretty eyes. That’s all.\"", "Shu stopped walking. She turned to him, her face serious, her eyes fixed on his. \"Liu Han. Nobody builds a carved gate to be decorative. Not in a place like this. Not with a lake like this.\"", "Han raised an eyebrow, amused. \"What do you suggest they are, then? Magic?\"", "\"I suggest,\" Shu said, her voice low and firm, \"that they are the reason the lake is the way it is. And I suggest that we go and look.\"", "Han stared at her for a moment, then shrugged, a gesture that seemed to say, *fine, if you insist*. He turned and walked on, and Shu followed, her heart beating faster, not with fear, but with a kind of electric anticipation, the feeling of someone who has just found the edge of a map and is about to draw the rest."], "img": "img/p009.jpg", "pw": false}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["Behind the temple, the stone channel opened into a narrow passage cut through the rock. The walls wore a coat of moss and lichen, their surfaces slick and dark with damp. At the far end, two gates stood facing one another. They looked like old neighbors who had forgotten what they were arguing about but refused to leave the kitchen. The Sun Dragon, on the east side, was carved from pale stone. Its mouth hung open in a silent roar, and its bronze eyes had turned green with age. The Moon Dragon, on the west, was darker. Its stone was grey and rough, and its bronze eyes sat in deep shadows.", "Between them, the channel lay empty. It was not dry, exactly, but it had lost the rush and roar of moving water. The air hung still and heavy, thick with the smell of wet stone and old earth. Shu walked forward, her boots slipping slightly on the wet rock. She stopped in front of the Sun Dragon and reached out to touch the cold surface.", "It was silent. There was no vibration, no hum, no movement. Only the solid weight of the stone and the stillness of water that was not there.", "Han stood beside her, arms crossed, his expression thoughtful. \"See?\" he said. \"It’s just stone. Pretty, maybe. But just stone.\"", "Shu pulled her hand back, her fingers tingling with the cold. She looked at the gate, then at the bronze eyes, and finally at the empty channel. Her mind moved to the water in the Moon Basin, high and swollen, pressing against its banks. She thought of the empty cove, the stranded carp, and the dry mill race. Then she remembered the key hanging on the wall in her grandfather’s house, the one he had never once used.", "\"No,\" she said, her voice quiet but clear. \"It’s not just stone. It’s a machine. And it’s broken.\"", "A bell rang across the water. The sound was clear and bright, cutting through the stillness of the channel. It echoed off the stone walls, bouncing back and forth before fading into the mist. Han looked up, listening.", "\"That’s Granny Hua,\" he said. \"She’s going to tell the story tonight. The dragon story.\"", "Shu looked at the gate, then at Han. \"Good,\" she said. \"Let her tell it. But we’re going to find out the truth.\"", "◆ Words to know: presiding – acting as the leader or moderator of a group; expanse – a wide, open area or stretch of land; inexorable – impossible to stop or prevent; sediment – material that settles to the bottom of a liquid; anticipation – the feeling of excited expectation"], "img": "img/p010.jpg", "pw": false}, {"no": 11, "ch": 3, "ctitle": "Granny Hua's Dragons", "part": "PART ONE: THE SUN GOES OUT", "paras": ["*The Gatekeeper's Rules, Rule 3: A story is a map that somebody walked.*", "The evening mist rolled off the water in heavy, grey folds, settling into the hollows between the tea terraces like a blanket dropped from a careless hand. On the broad stone steps of the Lantern Temple, the village had gathered. Paper cups of hot tea steamed in the cooling air, and the scent of taro balls frying in oil drifted from Aunt Meng’s stall, a rich, sweet smoke that cut through the damp. Lanterns hung from the eaves, their red paper glowing softly against the twilight, casting long, warm shadows across the wet stone.", "Shu stood near the front, her braid heavy against her back, watching the crowd. Beside her, A-Bao sat cross-legged on the cool rock, his yellow raincoat bright against the dark trousers of the adults. In his lap, Dumpling the duckling preened a wing with intense concentration, ignoring the festival entirely. A-Bao was eating a taro ball, holding it with the solemnity of a diplomat breaking bread.", "At the back of the crowd, half-hidden in the shadow of a camphor tree, stood A-gong. He held his straw hat in his hands, his fingers gripping the brim tightly. He did not sit. He did not drink tea. He simply stood there, a still figure in the grey vest, watching the lanterns flicker in the breeze.", "Granny Hua took her place on the small wooden stool in the center of the steps. She was tiny, wrapped in her plum-colored quilted jacket, her silver hair pinned up with a jade ornament that caught the lantern light. She held her carved walking stick like a scepter, tapping it once against the stone floor. The sound was a sharp, dry crack that silenced the chatter.", "\"Silence,\" she said, her voice thin but carrying the authority of eighty years. \"The moon is not up yet, but the story does not wait for it.\"", "Shu looked at her grandfather at the back. He had not moved. He had not blinked. His face was a mask of careful neutrality, but his shoulders were hunched as if he were carrying something invisible and very heavy."], "img": "img/p011.jpg", "pw": false}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["\"Long ago,\" Granny Hua began, her voice dropping to a low, rhythmic hum that seemed to settle into the wet stone, \"the sky was empty. Not empty like a room after a party, but empty like a page before the first word is written. The sun and the moon had wandered down to the lake, tired of their jobs, wanting a place to hide from the world.\"", "The children leaned in, their faces bright in the lantern light. Even Dumpling lifted its head, pausing mid-preen to watch the old woman.", "\"They found two dragons,\" she continued, tapping her stick against the step with a dry crack. \"Not real dragons, of course. The lake is full of things that look like dragons but are only stone. But these two... these were the gatekeepers. They held the water in their mouths. The sun, which is round and hot, sat in the east basin. The moon, which is thin and cold, curved in the west. And the dragons played with them, tossing them in the water, making ripples that became the waves you feel on the ferry.\"", "A murmur went through the crowd, soft and respectful. Shu remembered the empty channel she had seen that afternoon, the silence of the stone heads staring out of the rock.", "\"One day,\" Granny Hua said, her eyes shifting to the dark water beyond the temple steps, \"a young couple came to the shore. They were not looking for a story. They were looking for a way to live. The water was too high in one place and too low in the other. Their rice was drowning in the west and dying in the east. They asked the dragons why.\"", "Granny Hua paused. The silence stretched. It felt like a rope pulled taut.", "\"The dragons did not speak. They only pointed to the bottom of the lake, where a man sat in chains. He was old, his hair white, his hands bound. He had been kept by the water for so long that he forgot his name. When the couple asked him what had happened, he said, 'I closed the gates. I closed them to save the village from a flood. But I forgot how to open them. And the water forgot how to flow.'\"", "Shu felt a chill that had nothing to do with the mist. She looked back at A-gong, who stood rigid at the edge of the shadows. His hands were still gripping his hat, but his knuckles had turned white."], "img": "img/p012.jpg", "pw": false}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["\"Then the old man gave them a secret,\" Granny Hua said. \"He said, 'On the peak above us, where the camphor trees grow so tall their tops touch the clouds, there is a shrine. In the shrine is a chest. In the chest are two things: a golden axe and golden scissors. The axe is for the force. The scissors are for the precision. Take them. Cut the chains. Free the water.'\"", "The couple climbed, she said. Seven days they climbed. Through the mist that tasted of pine and rain. Through the bamboo groves where the wind sounded like whispering. They found the shrine, a small stone house with a red door. They took the tools. The axe was heavy, its bronze head worn smooth. The scissors were fine, their blades sharp as a thought.", "They came down. They walked to the channel. And with the axe, they broke the seal. With the scissors, they cut the silt. The water rushed, not with a roar, but with a sigh, a long, deep breath of relief. The sun rose in the east, round and warm. The moon curved in the west, silver and calm. The lake took its shape, the shape it has held ever since: two lights, one body, balanced by the gates that held them together.", "\"And the old man?\" someone asked from the back.", "Granny Hua smiled, a small, sharp expression. \"He stayed. To watch. To remember. That is the job of the keeper. To hold the key. To keep the promise. To ensure the water finds its level, even when it is impatient.\"", "She tapped her stick one last time.", "\"Stories are not just words,\" she said, her voice dropping to a whisper that somehow carried to the very back of the crowd. \"Stories are maps. They show you where you have been. And where you must be careful where you are going.\"", "Shu looked at the lanterns. They seemed to flicker, as if the flame were trembling. She thought of the empty cove. She thought of the high water in the west. She thought of the key on the wall."], "img": "img/p013.jpg", "pw": false}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["When the story ended, the crowd did not disperse immediately. The lanterns buzzed with the low hum of insects, and the air smelled of charcoal and damp wool. Shu stood up, her green rubber boots squeaking on the wet stone steps. She walked toward Granny Hua, who was already reaching for her tea with the practiced ease of a woman who had held that cup for decades.", "\"Granny,\" Shu said, keeping her voice polite, but firm. \"You said the dragons were stone. But you said the old man closed them. And you said the tools are on the peak. If the gates are just stone, why do they need to be opened? And if the old man is the keeper, who is he?\"", "The village laughed. It was a gentle, rolling sound, the kind that comes when a child asks a question that is slightly too sharp for the evening. Aunt Meng waved a fan of scallions from her stall, the sharp green scent cutting through the sweetness of the mooncakes. \"Shu,\" she said, her voice warm with amusement, \"don't pick a fight with the lake. Or with the old lady. She has outlived three mayors and two typhoons. You are better off listening.\"", "Granny Hua did not laugh. She set down her tea, the ceramic cup making a soft clink against the stone table. She looked past Shu, her eyes sliding to the back of the crowd, to the shadow where A-gong stood. He had not moved. He had not changed his posture. But his face had gone still, a mask of stone, his white beard motionless in the night air.", "\"Ask someone who has held the key,\" Granny Hua said. Her voice was quiet, but it cut through the laughter like a blade through silk. \"Ask him why he stands in the dark. Ask him why he does not sit. The lake remembers who stands, and who walks away.\"", "Shu looked back. A-gong was gone. The space where he had been was empty, save for a faint indentation in the wet stone where his cane had leaned. The mist was curling around her ankles, cold and damp, and the silence that followed was louder than the laughter had been. She touched the brass plumb bob at her throat, feeling the cold metal against her skin."], "img": "img/p014.jpg", "pw": false}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["Shu ran down the stone steps, her green rubber boots squeaking against the wet surface, past the bamboo trays where the tea leaves still curled in the moonlight, and into the courtyard where the tin roof glinted above the drying racks. The air was thick with the smell of charcoal and damp wool, a scent that clung to her indigo jacket as she hurried toward the dock. The water lay dark and still, reflecting the red lanterns hanging from the pier in long, trembling strips of color that swayed like the tails of blue magpies.", "A-gong stood at the very edge, his back to her, a slight and still figure against the night. He was looking out at the empty cove, where the mud was black and shining under the moon, and he held his cane in one hand while the other rested lightly on the wooden rail. Shu stopped a few meters away, breathing hard, her braid loose over one shoulder.", "\"A-gong,\" she said, her voice still tight from the run. \"Granny asked. Who is he? Who is the keeper?\"", "A-gong did not turn. He looked out at the water, his face unreadable in the dim light, his white beard motionless in the cool air.", "\"The gates are not decorative,\" he said. His voice was dry, like leaves scraping on stone. \"They are the most important thing in this valley. They hold the life of the village in their stone throats. And they are broken.\"", "\"Then we fix them,\" Shu said, stepping closer. \"We climb the peak. We get the tools. Granny said they are in the shrine.\"", "A-gong turned then. His eyes were tired, deep-set in his pale tan skin, and he looked at her with an expression that she had never seen before. It was not anger, and it was not sadness. It was a quiet, precise fear, the kind that lives in the hands of a man who has failed to hold a heavy thing.", "\"I cannot open them,\" he said. \"I do not know how. I have tried. I have failed. And I am afraid that if I try again, I will break what is left.\"", "The ferry whistle sounded across the dark water, a bright, clear note that shattered the silence. Han’s voice called out, faint and distant, asking if the festival was over. Shu looked at her grandfather, then down at her own hand. The key was in her pocket. She had taken it without thinking, her fingers closing around it in the shadow of the crowd. It was cold, heavy, and real, pressing against her palm like a promise she did not yet understand.", "◆ Words to know: scepter – a short staff symbolizing royal or authoritative power; rigid – stiff and unyielding in posture or behavior; silt – fine sediment that settles at the bottom of water; dispersal – the action of spreading out or scattering; precision – the quality of being exact and accurate"], "img": "img/p015.jpg", "pw": false}, {"no": 16, "ch": 4, "ctitle": "The Woman with the Plans", "part": "PART ONE: THE SUN GOES OUT", "paras": ["*The Gatekeeper's Rules, Rule 4: Ask who built it before you ask who will rebuild it.*", "The ferry that cut through the morning mist did not look like the Magpie. It was white, angular, and hummed with a mechanical indifference that made the water part with a sharp, efficient snap. It docked with a thud that sounded more like a decision than an arrival. A woman stepped off, her white sneakers striking the wet timber of the walkway with a crisp, dry sound. She wore a yellow hard hat atop a high, sleek ponytail, and silver-framed glasses caught the morning light before she even looked up. In one hand she held a roll of blueprints, and in the other, a clipboard that she tapped once, twice, with a pen.", "Behind her, two men in matching grey vests carried a tripod and a long, segmented pole. They moved with the synchronized precision of a clockwork mechanism, their boots finding the planks without hesitation.", "Aunt Meng, who was leaning against the pier rail with a tray of steaming taro balls, straightened up and whispered to Shu, who stood nearby with her arms crossed. \"Very tall. Very efficient. Smells like ink and cold coffee.\"", "Shu watched the woman turn. Her face was pale and cool, her expression one of mild, pragmatic curiosity. She did not smile. She did not wave. She adjusted the collar of her white shirt, checked a digital watch on her wrist, and started walking up the slope toward the temple.", "Shu decided, with the full force of her sixteen years, that she did not like this woman. She liked the way the woman walked, which was to say she did not, because it suggested the ground beneath her feet was merely a temporary obstacle rather than a living place. The woman’s presence felt like a straight line drawn across a curved landscape, sharp and unyielding.", "The two surveyors set down their tripod and began to unscrew the legs, their movements quick and practiced. The woman stopped, looked at the muddy cove where the carp had been, and then at the dry stone steps leading up to the village. She pulled a small notebook from her pocket and wrote a single line, her handwriting small and precise.", "Shu took a step forward, her green rain boots squelching in the damp wood. \"You are not from here,\" she said. It was not a question.", "The woman looked up. Her eyes were dark behind the glasses, clear and assessing. \"Ouyang Min,\" she said. \"Taihe Power. I am here to look at the water.\"", "Shu felt a spike of irritation. She knew the water. She had spent her life measuring its moods, its silences, its sudden, capricious withdrawals. \"The water is not a thing you look at,\" Shu said. \"It is a thing you listen to.\"", "Ouyang Min smiled. It was a small, thin expression, not unkind, but utterly devoid of warmth. \"Listen to it,\" she said, turning back to her surveyors, \"and then let us measure it. That is how we keep the lights on.\""], "img": "img/p016.jpg", "pw": false}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["The Lantern Temple hall was cool, the air heavy with the scent of old wood and burnt sage. Elder Chen sat at the head of the long table, his brown wool vest rumpled, his glasses on a chain resting against his chest. The village elders formed a semicircle, their faces tight with worry and suspicion. Aunt Meng sat near the door, her hands folded in her lap, her red apron tied tight.", "Ouyang Min stood at the front. She did not use a pointer, nor did she use a slide. She unrolled her plans onto the table, smoothing them with her palms until the paper lay flat against the grain. The map was detailed, precise, and utterly alien to the soft, curved lines of the lake they all knew by heart.", "\"The current system is unstable,\" Ouyang said, her voice clear and steady, cutting through the murmur of the crowd. \"The east basin drains, the west basin rises. We propose a concrete dam at the narrows, a single, controlled reservoir. It will hold one steady level all year. No more mud. No more flooding.\"", "She pointed to a section of the map where a thick grey line crossed the channel between the basins. \"This is the spillway. It will allow us to release water as needed. We will build a small power station here, and a new road here, along the ridge. The village will have reliable electricity, and the terraces will have a constant supply of irrigation water.\"", "Elder Chen leaned forward, his eyes narrowing. \"And the gates?\" he asked. \"The Dragon Gates?\"", "Ouyang’s pen hovered over the map. \"The existing stone structure is... compromised. The silt, the damage. It is not safe. The new dam will replace the need for them. The water will be managed by the new infrastructure.\"", "A ripple of unease moved through the room. It was not anger, but the specific discomfort of a familiar tool being declared obsolete. Shu sat in the back, her notebook open on her knee, her pen hovering over the page. She watched Ouyang’s hand move across the map, pointing to the new road, the power station, the spillway.", "It was a good plan. That was what annoyed her. The numbers were right. The logic was sound. The concrete was strong, and the electricity was bright, and the road would bring cars and buses and people who had never seen a blue magpie. It was everything the village needed, and it was everything the lake did not.", "Ouyang looked up, meeting Shu’s eyes for a brief, curious moment, before turning back to the elders. \"This is not just a dam,\" she said. \"It is a future.\"", "Shu looked down at her notebook. She had written the word *future* in small, neat letters, and then, without thinking, crossed it out."], "img": "img/p017.jpg", "pw": false}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["A young boy in a yellow raincoat, A-Bao, raised his hand though no one had asked him to speak. \"Does the dam make the ducklings happy?\" he asked.", "A few people laughed, the sound brittle and nervous. Ouyang’s expression did not change. \"It makes the water safe,\" she said. \"Safety is what keeps everyone, and every creature, in the same place.\"", "Shu stood up. The chair scraped against the stone floor, a sharp grating noise that silenced the room. She walked to the front of the table, her green boots leaving small damp prints on the cool stone. She did not look at the elders. She looked at the map.", "\"The catchment area,\" she said. Her voice was steady, but her hands were not. She clasped them behind her back to hide the trembling. \"The plan says the catchment is twelve square kilometers. Is that right?\"", "Ouyang looked up, her brows lifting slightly. \"Yes. It is the total area of the watershed that feeds the basin.\"", "\"And the Moon Basin?\" Shu asked. \"The high water. When it rises, does it count in that number? Or does the water go somewhere else?\"", "The room went quiet. Elder Chen adjusted his glasses. Aunt Meng stopped chewing her taro ball.", "Ouyang Min paused. She looked at the map, then at Shu, and then back at the map. She picked up her pen and made a small, precise note in the corner of her notebook. \"That,\" she said, slowly, \"is a good question.\"", "Shu felt a strange, hot flush rise in her cheeks. It was not embarrassment. It was something else, something that felt like a key turning in a lock. She had expected to be dismissed. She had expected to be told to sit down, to be told that her questions were quaint, that her knowledge was old and irrelevant. Instead, she had been heard.", "It was unsettling. It was also, she realized with a jolt of surprise, satisfying. She liked being taken seriously. She liked the fact that her observation, her small specific knowledge of the lake’s moods, had a place in the conversation.", "\"Thank you,\" she said, and the two words felt strange in her mouth, too polite, too careful.", "Ouyang nodded, a small sharp movement. \"The water budget must account for all sources,\" she said. \"We will need to measure the inflow from the west basin more carefully. It is a variable we cannot ignore.\"", "Shu sat down. Her legs felt weak, but her mind was sharp, bright, and buzzing with a new unfamiliar energy. She had a question, and it had been answered. And that meant she had the right to ask another."], "img": "img/p018.jpg", "pw": false}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["Elder Chen cleared his throat, a dry, deliberate sound that cut through the low talk. He stood, smoothing the front of his wool vest, and looked around the room. The murmuring stopped. The air felt still, dense with the same heavy pressure that precedes a typhoon front over the highlands.", "\"We will vote,\" he said. \"On the night of Mid-Autumn. Thirty days from the first dry morning.\" He paused, glancing toward the window where the white mist had begun to thin against the glass. \"Twenty-nine days now. The village will choose. The dam, or the old way.\"", "A ripple of agreement moved through the group. It was a practical decision, a necessary one. The money offered by the Company was real, the electricity it promised was real, and the fear of the rising water in the Moon Basin was real. But the old way was also real, woven into the rhythm of their days, the way they measured the seasons by the height of the water against the stone notches.", "Granny Hua, who had been sitting in the corner with her silver hair pinned up by a jade stick, tapped her carved walking stick on the floor. The sound was sharp, clear, and final, like a hammer striking a rivet in the forge.", "\"Thirty days is long enough,\" she said, her voice thin but steady, \"for a lake to change its mind.\"", "The room fell silent. Elder Chen looked at her, his face unreadable. He nodded, a slow, deliberate movement. \"The vote will be at the temple. Everyone will be present.\"", "Ouyang Min was already rolling up her maps, her movements quick and efficient. She tucked the blueprints under her arm and looked at Shu, her eyes sharp and bright behind her silver frames. \"I will be here,\" she said. \"I will be measuring.\"", "Shu nodded. She did not say anything. She did not need to. She had a question in her head, a stone in her pocket, heavy and cold and real. And she had twenty-nine days to find the answer.", "She looked out the window. The mist was lifting, and the sun was breaking through, casting long, sharp shadows across the stone floor. The lake was there, dark and deep, and for the first time, it did not feel like a mystery. It felt like a problem. And problems, she knew, could be solved."], "img": "img/p019.jpg", "pw": false}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["The meeting broke up in a rush of chairs and footsteps, the air thick with the scent of incense and damp wool. Shu stayed behind, sitting on the stone steps outside the temple, her notebook open on her knee. The sun was setting, casting long, orange shadows across the stone. The lake was dark, and the mist was rising again, curling around the base of the temple like a slow, grey snake.", "Ouyang Min found her there. She was carrying a small, leather-bound book, its cover worn and soft. She sat down beside Shu, not too close, but close enough that Shu could see the faint lines of exhaustion around her eyes.", "\"I read the regional records,\" Ouyang said, her voice quiet, almost gentle. \"The old ones. The ones from before the dam was proposed.\"", "Shu looked up. \"And?\"", "\"I found nothing.\" Ouyang’s voice was flat, devoid of accusation. \"No mention of the Dragon Gates. No mention of their purpose. No engineering data, no maintenance logs, no anything.\"", "Shu felt a cold prickle of defensiveness. \"That is because nobody wrote it down,\" she said. \"Not in a place where engineers look. The knowledge is in the water. It is in the hands of the keepers. It is not in a book.\"", "Ouyang looked at her, her eyes sharp and bright. \"Then show me.\"", "The two words hung in the air, simple and direct. Shu stared at her, her mouth slightly open. It was a challenge, but it was also an invitation. It was an acknowledgment that her knowledge had value, that it was not just a quaint custom, but a form of expertise.", "\"I will,\" Shu said. The words came out before she could stop them, before she could consider the consequences. She looked down at her notebook, at the word *future* that she had crossed out. She uncrossed it.", "\"Tomorrow,\" Ouyang said, standing up. She brushed the dust from her trousers and looked out at the lake. \"Bring your plumb bob.\"", "Shu looked at her, and for the first time, she did not feel the sharp edge of irritation. She felt something else, something that felt like a door opening, slowly, carefully, into a room she had not known existed.", "◆ Words to know: capricious – unpredictable and subject to sudden changes; pragmatic – practical and focused on real results; obsolete – no longer used or needed; unyielding – firm and refusing to bend; inflow – the movement of water or material into a space"], "img": "img/p020.jpg", "pw": false}, {"no": 21, "ch": 5, "ctitle": "Twenty-Nine Days", "part": "PART ONE: THE SUN GOES OUT", "paras": ["*The Gatekeeper's Rules, Rule 5: A deadline is only a measurement of what you have not yet done.*", "The courtyard was quiet, save for the tick of the cooling metal on the tin roof and the distant, rhythmic clatter of the mill wheel, which had long since stopped turning. Shu spread a fresh sheet of paper across the low wooden table. It was heavy, textured, and perfectly flat, a surface that seemed to demand precision. She took a red marker, the kind used for pricing tea at the market stall, and began to draw circles. One for today. One for tomorrow. Twenty-nine red lanterns hung in a row, each one a day she did not have to waste.", "She wrote her first list item in the center of the page, the letters sharp and deliberate. *How high?* Underneath, *How low?* Then, *How fast?* And finally, *Why?* The questions hung there, stark and unadorned, waiting for answers that the lake had not yet offered.", "A-Bao appeared from the shadows of the porch, his yellow raincoat still on, though the rain had stopped hours ago. He held a small notebook, thinner than Shu’s, and looked at the red circles with an expression of mild suspicion.", "\"Who,\" he said, tapping the paper with a chubby finger.", "\"Who what?\" Shu asked, not looking up.", "\"Who closed it,\" he said. \"And what are the carp eating now? They are very hungry. Also, snacks.\"", "Shu paused, the marker hovering in the air. She looked at her brother, really looked, and saw the genuine concern beneath the childish phrasing. He was not being funny. He was asking the only question that mattered to a person who loved fish and fullness. She added *Who* to the list, right under *Why*, and drew a small, intricate sketch of a fish bowl next to *Snacks*.", "From the doorway, A-gong watched. He leaned on his bamboo cane, his white beard catching the pale light from the oil lamp. He did not speak. He did not need to. His presence was a heavy, silent weight in the room, a reminder that the past was not just history, but a living thing that breathed in the dark. He gave a single, slow nod, a gesture that contained decades of silence, and then turned and walked back inside, his footsteps soft on the wooden floor.", "Shu looked at the list again. The red lanterns stared back, bright and demanding. She uncapped the marker and added a final line, small and careful. *Tomorrow.*"], "img": "img/p021.jpg", "pw": false}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["Dawn arrived not with a light but with a fog, a thick, white curtain that erased the horizon and turned the world into a blurred sketch left out in the rain. Shu found Han on the dock, where he was coiling a thick hemp rope with the meticulous care of a surgeon preparing for an operation. He wore his orange life vest over a white t-shirt, the fabric damp with the heavy morning dew that settled on everything in the valley.", "\"You are here early,\" Shu said, climbing the stone steps. Her green boots squeaked on the wet wood.", "\"I have been here since the magpies started,\" Han said, not looking up from his knot. \"They are complaining about the lack of fish. It is a valid grievance.\" He finished his work, a complex figure-eight loop, and smiled. It was a sharp, quick expression, the kind that usually preceded a terrible joke. \"I heard you need arms. And jokes. My arms are strong. My jokes are even stronger.\"", "Shu suppressed a grin, though it felt like a leak in a dam. \"I need the ferry. And I need you to be serious. Mostly.\"", "Han shrugged, a fluid motion that suggested the effort was minimal. \"The ferry belongs to my father. The arms and the jokes are on the house. But I will warn you, the ferry is old. She has opinions.\" He stood up, stretching his tall, wiry frame against the rising light. \"So, what are we doing? Measuring the mud?\"", "\"Measuring the water,\" Shu corrected. She pulled a small notebook from her pocket. \"We need tubes. Clear plastic ones. Long enough to span the distance from the Sun Basin to the Moon Basin, with slack for the curve. We need poles. Bamboo, sturdy ones, to hold the tubes at both ends. We need ropes to secure the poles, and markers to show the level.\"", "Han listened, his eyes bright with the particular excitement of a boy who likes to build things. \"A water level,\" he said. \"Like a giant, lazy snake that tells us where the water wants to go.\"", "\"Essentially,\" Shu said.", "\"And the sounding line?\"", "\"A weighted rope,\" Shu said. \"We drop it into the deep spots. We measure how far down the bottom is. We map the shape of the lake floor. If we know where the water is, and where it goes, we can understand why it moved.\"", "Han nodded slowly, his expression thoughtful. \"Your grandfather would have hated the plastic tubes,\" he said. \"He liked bamboo. He said plastic was too impatient.\"", "Shu looked at him, surprised by the insight. \"He did say that,\" she admitted. \"But bamboo is not clear. And we need to see the water move.\""], "img": "img/p022.jpg", "pw": false}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["Uncle Liu was in his forge, the fire low and orange, casting long, dancing shadows across the stone floor. He stood over the anvil, a hammer in his hand, the metal glowing a dull, angry red. He did not look up as Shu and Han entered, his shoulders hunched, his shaved head gleaming with sweat.", "\"We need tubing,\" Shu said, stepping over a pile of scrap iron. \"Clear plastic. At least ten meters.\"", "Uncle Liu set the hammer down on a wooden block. He turned, his face a mask of quiet concentration, his brown skin flushed from the heat. He looked at Shu, then at Han, and then at the door behind them, where A-gong was visible in the distance, walking slowly toward the house.", "\"Your grandfather once borrowed this,\" Uncle Liu said. His voice was low, rough, like gravel in a stream. He walked to the shelf behind the workbench, where a coil of clear plastic tubing sat among spools of wire and jars of oil. He picked it up and held it out to Shu.", "Shu took it, the plastic cool and smooth against her palms. She looked at Uncle Liu, searching for the context, the history, the reason for the strange, heavy way he had said it.", "\"He never brought it back,\" Uncle Liu added. He turned back to the anvil, picking up the hammer again. The silence in the forge was thick, charged with a memory that neither Shu nor Han had been present for. Shu looked at the tubing, then at Han's father, her mind racing to connect the dots. A borrowed tube. A missing return. A silence that spoke louder than words.", "\"Thank you,\" she said, quietly.", "Uncle Liu did not answer. He struck the metal, the sound ringing out in the small, hot space, a sharp, clear note that seemed to cut through the tension, leaving only the scent of hot iron and old promises."], "img": "img/p023.jpg", "pw": false}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["Aunt Meng stood at the dock stall, her red apron tied tight around her waist and her hair net slightly askew. She packed rice balls into a woven basket, her movements quick and practiced, while the scent of sticky rice and sesame oil filled the air.", "\"For the journey,\" she said, not looking up. \"The water is cold. The mind is faster. You need something to eat that is slow to digest and hard to argue with.\" She pressed the basket into Shu’s hands. \"And Han, watch your step. The dock is slippery when it is wet, and you are clumsy when you are excited.\"", "Han grinned, a wide, boyish expression. \"I am always clumsy. It is part of my charm.\"", "Aunt Meng waved a hand, dismissing the compliment with a gesture that was both affectionate and exasperated. \"Save it for the fish. They are easier to impress.\"", "A-Bao tugged at Shu’s sleeve. \"Granny Hua said to measure first. Believe later.\" He looked up at her with wide, serious eyes. \"She sent the message. She is in the temple. She is praying. But she is also thinking. She says thinking is more important than praying.\"", "Shu nodded, the basket settling against her hip with a steady, reassuring pressure. \"She is right,\" she said. \"But we have to start.\"", "They loaded the Magpie, the small ferry boat, with the tubing, the poles, the ropes, and the basket of rice balls. The boat rocked gently on the calm water, its wooden hull dark and weathered. A-Bao sat in the bow, Dumpling the duckling clucking softly in its bamboo basket. Han stood at the stern, the oars ready.", "Shu held the tiller, her hand steady. She looked back at the dock, at Aunt Meng, who was wiping her hands on her apron, and at the mist that was beginning to lift, revealing the green ridges of the mountain.", "\"Ready?\" Han called out.", "Shu took a deep breath, the cool air filling her lungs. \"Ready,\" she said.", "Han pushed off, the oars cutting through the water, the Magpie sliding away from the dock and into the open lake, the mist curling around the bow like a slow, grey snake."], "img": "img/p024.jpg", "pw": false}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["The Magpie sliced through the calm surface, leaving a narrow white wake that trailed behind them like a strip of torn tea leaf. The mist had thinned, lifting off the water in long, slow sheets to reveal the stark difference between the two halves of the lake. To the west, the Moon Basin sat dark and deep, its water pressing against the stone bank with quiet insistence. To the east, the Sun Basin lay pale and shallow, the mud of the drained cove visible just beneath the surface.", "Shu stood at the side of the boat, her hand gripping the gunwale. She reached into her jacket pocket and pulled out the brass plumb bob, its bamboo handle worn smooth by her grandfather’s hand and then her own. She held it out over the water, letting it swing in the gentle motion of the ferry. The bob moved in a slow, rhythmic arc, steadying itself against the rocking hull.", "\"It is the one thing,\" she murmured, her voice low, \"that always tells the truth about down.\"", "Han watched her, his face serious. \"Your grandfather taught you that,\" he said.", "\"He taught me a lot of things,\" Shu replied. \"But this one is the most important. The water does not care about our feelings. It does not care about our legends. It only knows down. And if we know down, we can know everything else.\"", "She let the bob settle, watching it hang perfectly still, a vertical line cutting through the air and the lingering mist. She took out her notebook and wrote down the time, the temperature, and the position of the sun.", "\"Day two,\" she said.", "She underlined the words, her pen scratching against the paper, a sound that was sharp and clear in the quiet morning air. The boat moved on, the water lapping at the hull, the world waiting for them to understand it.", "◆ Words to know: deliberate – intentional and careful; stark – plain and unadorned; meticulous – showing great attention to detail; grievance – a complaint or feeling of injustice; reassuring – giving comfort or confidence"], "img": "img/p025.jpg", "pw": false}, {"no": 26, "ch": 6, "ctitle": "A Level Made of Water", "part": "PART TWO: THE TWO DRAGONS", "paras": ["*The Gatekeeper's Rules, Rule 6: Water in a tube cannot lie about level.*", "The tube was three meters of clear plastic, salvaged from a burst irrigation line on the terraces, and it was currently full of water, trembling slightly in the morning air, and extremely difficult to keep from spilling onto Shu’s boots.", "\"Here,\" said Shu, extending one end toward her brother. \"Hold this.\"", "A-Bao took it, gripping the slick plastic with the kind of reverence usually reserved for live snakes or unexploded firecrackers, his round face set in a mask of solemn concentration. The water inside shivered, catching the sun, and a single air bubble rose to the top with the slow, arrogant dignity of a thought that does not wish to be interrupted.", "\"Bad,\" said A-Bao. \"There is a liar in the water.\"", "\"There is an air bubble,\" said Shu. \"It wants to go up. We must let it. Hold the tube high and tap it gently. Make it go.\"", "A-Bao tapped the side of the tube with one finger. The bubble wobbled, hesitated, and then shot to the top, sticking to the ceiling of the plastic. Shu took the other end and set it on the ground. The water in the tube settled, finding its own level, a straight, unbroken line that connected the two ends despite the sag in the middle.", "\"Now,\" she said, \"look at the water line on my end. It is here.\" She marked it with her finger. \"Now look at your end. Where is it?\"", "A-Bao squinted. He tilted his head and moved the tube slightly, trying to see the meniscus from a different angle. \"It is... higher?\"", "\"It is the same,\" said Shu. \"It must be the same. Water does not care if the tube is bent or twisted or tied in a knot. It only cares about gravity. Gravity pulls down. So the water stays level. Always.\"", "A-Bao looked at the tube, then at Shu, then at the water. He picked up the tube and, in one swift motion, tied it into a severe, tight knot. The water sloshed violently, and the level line disappeared into the tangle of plastic.", "\"I proved it wrong,\" he announced, looking delighted.", "\"No,\" said Shu, untangling the knot with the patience of a woman defusing a bomb. \"You proved that you cannot read a knot. Untangle it.\"", "\"I am a scientist,\" A-Bao said, and began to pull."], "img": "img/p026.jpg", "pw": false}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["They carried the tube to the edge of the Sun Basin, where the mud was still damp and glistening. Shu drove a bamboo staff into the ground on the eastern bank, marking the current water line with a sharp pencil stroke. She then walked across the exposed lakebed, the mud sucking at her boots with every step, a soft, sticky sound that made A-Bao wince from the dry side.", "On the western side of the basin, near the low bank where the Moon Basin began, she drove a second staff into the ground. The water here was deep, black, and still. She held the tube against the first staff, reading the level. Then she held it against the second.", "Across the whole exposed lakebed the difference was small: two centimeters of slope. The Sun Basin was flat as a table, and low, but it was not the only problem.", "\"Why not use a laser?\" Han asked. He was sitting on a rock, his orange life vest draped over his shoulders, watching them with the bored interest of a boy who had never had to measure anything in his life. \"My phone has an app. It beeps. It is very accurate.\"", "\"Your phone app,\" said Shu, not looking up, \"has an accuracy of plus or minus ten centimeters. And it requires a battery. And it does not work when it is raining. And it does not tell you the truth about down.\"", "\"It beeps,\" Han said.", "\"I do not own a laser,\" Shu said, with the flat, final tone of a person who has ended a debate. \"I own a tube. And a pencil. And you. Now hold the staff. Do not move. The water is trying to tell me something, and you are vibrating.\"", "A-Bao nodded vigorously. \"The water is talking. It is a shy water. It speaks in whispers.\"", "\"It is hydrostatic pressure,\" Shu corrected, though her voice softened. \"It is simple. But it is true. And true is better than beeping.\""], "img": "img/p027.jpg", "pw": false}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["The walk across Lantern Island was a short, steep climb over roots and stone. The island was narrow, a green spine of bamboo and camphor trees connecting the two basins, and the air smelled of wet earth and the faint, sweet rot of fallen leaves. Shu carried the tube. A-Bao carried the notebook. Han carried his dignity, which he dropped at least twice when he tripped over a root.", "They reached the Moon Basin shore. The water here was high, pressing against the stone steps of the landing with a quiet, muscular insistence. Shu set the second staff in the mud at the water's edge. She held the tube against the staff in the Sun Basin, which was now a long, low, sagging line across the island.", "She looked at the water level in the tube. She looked at the staff in the Sun Basin. She looked at the staff in the Moon Basin.", "She did the arithmetic. She did it again. She did it a third time, because the numbers were too large to be real, too large to be a mistake.", "\"Three meters,\" she said. \"And fifty centimeters.\"", "Han whistled. It was a long, low whistle, the kind that meant *that is a lot*.", "\"Three and a half meters,\" Shu repeated, her voice tight. \"The Moon Basin is three and a half meters higher than the Sun Basin. The water wants to fall that far. It wants to rush through the channel, into the east, and fill the cove. But it cannot. Something is stopping it.\"", "She wrote it in the notebook. *HEAD = 3.5 m.* She underlined it three times. The pencil snapped against the paper, a sharp, decisive crack.", "\"Something is stopping it,\" she said again, and this time her voice was not tight. It was heavy. \"What is stopping it?\""], "img": "img/p028.jpg", "pw": false}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["They sat on the grass, the notebook open between them, the tube coiled like a sleeping snake. A-Bao was eating a taro ball, the sweet, sticky mass of it disappearing in three bites, and he was looking at Shu with the eager, hungry expression of a student who knows the answer but is waiting for the teacher to ask.", "\"Explain,\" he said. \"The door.\"", "Shu wiped her hands on her trousers. \"Imagine a door,\" she said. \"A very strong one. And imagine a hand pushing against it. If the hand is weak, the door stays shut. If the hand is strong, the door opens. But the hand is not just one hand. It is the water itself. The deeper the water, the harder the push.\"", "\"But the water is just water,\" A-Bao said.", "\"Yes. But it is a lot of water,\" Shu replied. \"And it is three and a half meters deep. The pressure at the bottom is... let us see.\" She pulled out her calculator. \"Density of water is one thousand kilograms per cubic meter. Gravity is nine point eight. Depth is three point five meters. Multiply them. One thousand, times nine point eight, times three point five.\"", "She typed it in. She looked at the number. She typed it in again.", "\"Thirty-four thousand three hundred,\" she said. \"Pascals.\"", "\"That is a lot of Pascals,\" A-Bao said.", "\"It is a lot of force,\" Shu corrected. \"If the gate is one square meter, that is thirty-four thousand newtons. That is... that is about three and a half tonnes of force. Pushing against the gate. Every second. Every minute. For thirty years.\"", "A-Bao dropped his taro ball. It rolled off the grass and vanished into the ferns. He did not chase it. He was looking at Shu with a new, serious respect.", "\"The gate is holding back three and a half tonnes,\" he said. \"Every second.\"", "\"Yes,\" said Shu. \"And if it breaks, the water will not ask permission. It will just go.\""], "img": "img/p029.jpg", "pw": false}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["The sun was lowering, turning the mist on the far shore into a soft, golden haze. On the opposite bank, the survey team from the Taihe Power Company moved with the brisk, purposeful energy of people who had a schedule, a cluster of white shirts and yellow hard hats crossing the water. Ouyang Min walked toward them, her white sneakers splashing through the shallow current while she kept her roll of plans tucked firmly under her arm.", "She stopped at the edge of the mud. Her gaze traveled over the clear plastic tube coiled on the grass, then drifted to the two bamboo staffs driven deep into the earth at opposite ends of the basin. Finally, her eyes settled on Shu, who sat with her notebook resting in her lap.", "\"That is a better level than the one my people brought,\" Ouyang said. Her voice was calm, precise, and entirely devoid of irony.", "Shu blinked. \"It is a tube.\"", "\"It is a level,\" Ouyang corrected. \"And it is accurate. Furthermore, it does not require a battery. Show me the numbers.\"", "Shu hesitated. The notebook was hers, and the measurements within it were hers, but the truth of the lake belonged to everyone. She glanced at A-Bao, who was nodding vigorously, and then at Han, who offered a shrug so vague and helpful it might as well have been a question mark drawn in the air.", "Shu opened the notebook and turned to the page with the three heavy underlines. She held it out.", "Ouyang took it. She read the numbers, then read them again, her lips moving silently as she calculated. She pulled out her own small, crisp notebook and scribbled a quick, sharp note. When she looked up, her expression was unreadable.", "\"Three point five meters,\" Ouyang said. \"That is a significant head. Your gates are under immense stress. If they are old, they are likely to fail.\"", "\"They are not old,\" Shu said. \"They are jammed.\"", "Ouyang looked at her. She did not smile, nor did she frown. She simply looked at the water, at the deep, dark, pressing surface of the Moon Basin, and then back to Shu.", "\"Jammed,\" Ouyang repeated. \"Then the water is still pushing. And the time is still running.\"", "◆ Words to know: salvaged – recovered from something damaged or discarded; meniscus – the curved surface of a liquid in a container; hydrostatic – relating to the pressure of stationary fluids; arithmetic – the branch of mathematics involving basic calculations; vague – not clearly expressed, defined, or understood"], "img": "img/p030.jpg", "pw": false}, {"no": 31, "ch": 7, "ctitle": "Bamboo Soundings", "part": "PART TWO: THE TWO DRAGONS", "paras": ["*The Gatekeeper's Rules, Rule 7: A map is a promise about what is under the surface.*", "The Magpie was not a large boat, but it was a boat that understood the water it was built for. Han stood at the stern, his orange life vest bright against the grey morning, holding the tiller with a casualness that belied the precision required to keep the vessel steady in the current. Shu sat in the bow, her clipboard balanced on her knees, the paper grid she had drawn in the courtyard already marked with the first three columns of numbers. A-Bao sat between them, his yellow raincoat crinkled, holding the weighted rope with the gravity of a priest holding a sacred scroll.", "\"Ready?\" Han asked. He did not look at her. He looked at the water, then at the distant red lantern of the temple, and finally at the camphor tree on the ridge behind it.", "\"Ready,\" said Shu.", "\"Drop it at ten meters. Call the depth. I’ll turn. Keep it straight.\"", "They began. The process was methodical, almost ritualistic. Han rowed in a straight line, the oars dipping and lifting in a steady rhythm that seemed to sync with the beating of Shu’s heart. Every ten meters, he stopped, and A-Bao let the rope go. It slid into the water with a soft *plip*, the weight pulling it down through the murky, tea-colored liquid until it hit the bottom.", "\"Two meters!\" A-Bao called, his voice surprisingly loud in the mist.", "Shu wrote it down. *10m: 2.0*.", "\"Three meters and fifty,\" he said for the next mark.", "*20m: 3.5*.", "The sun climbed, burning the mist off the surface of the Sun Basin. The water here was shallow, almost transparent in the bright patches, revealing the grey stones and the occasional tangle of dead reeds beneath. It was a landscape that had been underwater for centuries, now exposed to the air and the judgment of a clipboard. Shu wrote, and underlined, and checked her arithmetic. The numbers were consistent, but they were also, she realized with a growing sense of unease, too simple. A lake should have depth, variation, mystery. This was a flat plain with a few bumps, and it was stretching out toward the island like a hand reaching for something it could not quite touch."], "img": "img/p031.jpg", "pw": false}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["Han was good at this. He was, in fact, exceptionally good at this, and he did it with a kind of detached, cheerful efficiency that made Shu suspect he had been doing this for a very long time and had simply forgotten to tell anyone. He kept the line straight not by looking at the water, but by looking at the horizon, lining up the red lantern on the temple roof with the dark green peak of the camphor tree on the ridge. If the lantern moved left, he corrected right. If it moved right, he corrected left. His hands on the oars were steady as stone.", "Shu watched him. She watched the way his shoulders moved, the way his eyes tracked the tiny shift in perspective. It was a skill, a real one, the kind that could not be faked in a single morning. It was the skill of someone who knew this lake better than anyone in the village, including her grandfather. She felt a small, sharp pang of something that was not quite jealousy and not quite admiration, but a mixture of both, and she looked down at her notebook and pretended to be fascinated by the number 4.2.", "\"You’re staring,\" Han said. He was still rowing.", "\"I’m thinking,\" Shu said.", "\"You’re staring.\" He smiled, a quick, crinkling thing that did not reach his eyes. \"I’m good at straight lines. It’s a gift.\"", "\"You’re also good at making bad jokes,\" Shu said.", "\"Only when I’m nervous.\"", "\"You’re not nervous.\"", "\"I’m always nervous,\" Han said, and then he looked at her, and for a second, the playful mask slipped, and she saw something else in his face. It was a look of recognition, as if he had just realized that she had noticed. He looked away, back to the water, and rowed a little harder, as if to prove a point. Shu looked down at her grid. The lines were straight. The numbers were true. And there was a boy in the stern who knew more than he was saying, and she was not entirely sure if she was angry about it or relieved."], "img": "img/p032.jpg", "pw": false}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["By the time they reached the middle of the basin, the paper grid was half full, and the pattern was beginning to emerge. It was not random, nor was it the chaotic scatter of a natural depression. The structure was deliberate, with depths increasing in a smooth, predictable curve that formed a shallow bowl opening toward the island. Running through the center of that bowl, from the far shore to the water’s edge of Lantern Island, was a line. A long, straight, deep line.", "\"Look,\" Shu said, pointing at the grid. \"These numbers. Ten to fifty. They’re not just deep. They’re *deeper*.\"", "A-Bao leaned over her shoulder, his eyes scanning the column of numbers until his brow furrowed in a way that was far too serious for an eleven-year-old. \"It’s a hallway,\" he said.", "\"What is?\"", "\"A hallway. Like the ones in the temple, but for water.\" He tapped the paper with his finger. \"It’s the Dragon’s Hallway.\"", "Shu looked at the line. It was straighter than anything she had ever seen in the natural world, a channel cut into the bed of the lake by human hands. It ran directly toward Lantern Island, toward the place where the Dragon Gates should be. It was the old path, the one that had carried water from the Moon Basin to the Sun Basin for a hundred and fifty years, and now it was dry, or nearly so, a scar in the bottom of the lake that no one had thought to look at.", "\"It’s the channel,\" Shu whispered.", "\"It’s a promise,\" A-Bao said. \"A map is a promise about what is under the surface.\"", "Shu looked at her brother, and then at the water, and then at the island. The channel was there. The gates were at the end of it. And the water was still pushing, from the other side."], "img": "img/p033.jpg", "pw": false}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["The duckling did not wait for permission. It waited for an opening, and the opening came when A-Bao reached for his water bottle and the basket tipped. Dumpling, who had been sitting in the basket with the dignified patience of a small, yellow emperor, saw the water, saw the freedom, and launched itself. It hit the surface with a splash that was disproportionately loud, and then it paddled. It paddled with a frantic, wing-flapping energy that sent ripples across the still water, and it was gone, a yellow streak moving toward the mud of the drained cove.", "\"A-Bao!\" Shu yelled.", "\"Got it!\" A-Bao yelled back, scrambling for the edge of the boat.", "The recovery took twenty minutes. It took every bit of their patience, their skill, and their dignity. Han kept the boat steady while A-Bao reached out with a net, missing twice. Shu tried to lure it with a piece of bread, but Dumpling was hungry for adventure, not for crumbs. The boat drifted, the current, or what passed for a current, pushing them slowly toward the shore. And in that drift, Shu did something she had not done before. She dropped the plumb bob into the water.", "It hung there, still. Perfectly still.", "There was no current. There was no flow. The water in the Sun Basin was not moving. It was sitting there, dead and still, holding its breath, waiting for something to change. She looked at the bob, and then at the island, and then at the Moon Basin, which was full and high and pressing against the stone. The water was not flowing. It was trapped. And the gates were the only thing standing between the two.", "\"Dumpling is coming back,\" A-Bao said, holding the basket up. The duckling was inside, looking smug.", "Shu looked at the still water. \"We need to open the gates,\" she said."], "img": "img/p034.jpg", "pw": false}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["The dock was a place of noise and smell, of frying oil and salt air and the loud, comfortable murmur of people who had nothing else to do with their afternoon. Aunt Meng’s stall was a fortress of scallion pancakes and fish ball soup, the steam rising in great, fragrant clouds that smelled of green onions and sesame. Shu pinned the map to the wall with two chopsticks, and the crowd gathered. It was not a large crowd, but it was a serious one. The fishermen stood in a semicircle, their boots still muddy, their faces lined with the kind of worry that only comes from watching a lake change.", "They looked at the grid. They looked at the line. They looked at each other.", "\"The Dragon’s Hallway,\" said an old man, his voice raspy. He was leaning on a cane, his eyes sharp and bright. \"My grandfather said it
