. He said the lake used to breathe through the island. He said the water went in and out, like a lung.\"", "Shu looked at the old man. She looked at the map. She looked at the line, the straight, deep line that ran to the island.", "\"He was right,\" she said. \"It’s the channel. And it’s closed.\"", "The old man nodded. He did not say anything else. He did not need to. The silence in the dock was heavy, and it was full of a question that no one had asked yet, but everyone was thinking. If the lake had been breathing, and now it had stopped, who had held its breath? And how do you make it breathe again?", "◆ Words to know: belied – contradicted or masked the true nature of; methodical – done in a careful, orderly, and systematic way; deliberate – done intentionally and with clear purpose; disproportionately – out of proportion to the cause or size; dignified – having or showing a calm, serious, and self-respecting manner"], "img": "img/p035.jpg", "pw": false}, {"no": 36, "ch": 8, "ctitle": "Under the Island", "part": "PART TWO: THE TWO DRAGONS", "paras": ["*The Gatekeeper's Rules, Rule 8: Never go where the water has not been asked.*", "The Magpie rocked gently in the harbor, her white hull bobbing against the current that had not yet decided to go anywhere. Shu stood on the gunwale, holding a thick coil of hemp rope that smelled of tar and old rain. She had spent the morning braiding it, testing every knot with a weight that could break a thumb, and now she held it out to Han like a contract.", "\"Rule one,\" she said, her voice tight with a seriousness that made her feel taller than she was. \"The line is the only thing between you and the bottom. If the line stops, you stop. If the line tugs, you come up. Do you understand?\"", "Han, perched on the bow with his boots crossed, looked at the rope, then at Shu, and saluted with a hand that had just finished eating a taro ball. \"Crystal clear, Captain. I will obey the hemp. It is a very strict gentleman.\"", "\"Rule two. Depth. Three meters. No more. The pressure will not care about your curiosity, and neither will I.\"", "\"Three meters is a long way to fall,\" Han said, grinning. \"I will count the seconds. One, two, three. If I hit the bottom on the fourth, I will blame the lake for being too eager.\"", "\"A-Bao,\" Shu called out.", "The boy appeared from behind a stack of crates, holding his duckling, Dumpling, in a small wicker basket. He looked up with the solemnity of a junior auditor.", "\"Official Whistle Counter,\" Shu announced. \"If Han goes down, you count the seconds. If the count hits thirty, you blow the whistle. Once. If he is not up in ten more, you blow again. Do not blow for snacks. Do not blow for Dumpling’s opinions. Only for the emergency.\"", "A-Bao took the small brass whistle from Shu’s belt and held it up to the light. \"I am very serious about this,\" he said. \"I will not miss a beat.\"", "Shu looked at the water, dark and still as a mirror that had forgotten how to reflect. She looked at Han, who was already adjusting his life vest with the casual confidence of a man who had never once been wrong about water. She took a breath that tasted of salt and fried onions, and then she handed him the end of the rope.", "\"Go,\" she said. \"And remember. The lake does not hate you. It is just very, very deep.\""], "img": "img/p036.jpg", "pw": false}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["The water was cold in a way that felt personal, as if it had read Han’s name and decided to make him pay for it. He slipped over the side of the Magpie with a splash that was too loud for such a quiet morning, and the cold bit into his skin through the neoprene suit, which was two sizes too large and therefore very good at letting the lake in.", "He kicked his legs, finding the rhythm, and let his feet touch the muddy bottom. The silt stirred, rising in a cloud of brown sediment that obscured his view. He adjusted his snorkel, tasting the metallic tang of the air, and looked down.", "Shu’s voice came from above, muffled by the water and the distance. \"Count, A-Bao.\"", "\"One,\" the boy’s voice sounded, small and far away, like a coin dropped in a well.", "Han kept his lungs full. The light filtered down through the green water, turning the world into a murky aquarium. He could see his own hands, blue-tinged and trembling slightly in the cold. He could see the rope, a straight line going up into the brightness, connecting him to the boat, to the sun, to the world of dry boots and warm tea.", "\"Two,\" A-Bao counted.", "Han pushed off the silt. The water resisted him, thick and heavy, but he swam upward, kicking with steady strokes. He watched the line pay out from the boat above, a taut thread of safety in the green dark. The pressure built in his ears, a dull ache that he knew meant he was deep enough to be interesting.", "\"Three,\" A-Bao said.", "Han stopped. He hung in the water, suspended between the bottom and the boat, and waited for the fourth count. It did not come. He was not at the bottom yet. He was not at the limit. He turned his head to the left, where the shadow of the island lay thick and heavy, and saw a shape that did not belong in the mud.", "It was stone. It was old. And it was looking at him."], "img": "img/p037.jpg", "pw": false}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["Han breached the surface with a sharp intake of air that sounded less like a man and more like a kettle reaching its boil. The Magpie shuddered under the sudden weight, rocking hard as he hauled his dripping limbs over the gunwale. Shu caught his arm, her grip steady and cool, while A-Bao stood on the opposite bench, eyes wide, and released his held breath in a long, whistling whoosh.", "\"What?\" Shu asked, leaning forward. Her eyes were sharp. \"Is it a fish? A very large fish?\"", "\"No,\" Han managed. His teeth were chattering so violently that his consonants were turning into slurs. \"It is a... a mouth.\"", "Shu looked down at the water. The surface was calm, mirroring the bright sky, but the reflection was broken by a dark shape beneath them. The water here was clear enough that they could both see it without diving.", "It was a stone arch, rising from the silt in a perfect, ancient curve. In the center of the arch, half-buried in grey mud, sat a head. It was not a human head. It was carved from grey rock, with long, flowing ridges that suggested a mane and a snout curled back in what looked like a permanent sneer. The eyes were bronze, green with age, and they stared out into the green water with a patience that felt older than the mountain itself.", "Spanning the opening was a gate. It was made of wood, bound with strips of bronze that had turned black with rust and time, and it was jammed shut. Packed tight against the stone face of the gate was a dense plug of grey silt. Behind that obstruction, a dark, straight shape lay parallel to the stone. It looked suspiciously like a tree trunk.", "\"The Dragon,\" Han whispered. \"The Sun Dragon.\"", "Shu reached over and pulled the tether rope, tightening it to stop the boat from drifting further away. \"Describe it,\" she said. Her voice was steady, though her knuckles were white where she gripped the rail. \"Every detail. Write it down later. For now, just look.\"", "Han looked. He saw the grain of the wood, the dark bronze bindings, the grey silt, and the trapped log. He saw the way the water flowed around the arch, a slow, respectful current that seemed to bow to the stone. And he felt, for the first time, that the lake was not just water. It was a machine. And it was broken."], "img": "img/p038.jpg", "pw": false}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["\"Again,\" Shu said, before Han could offer to go back. \"I’m coming with you this time.\"", "Han blinked, water dripping from his nose. \"You? In that suit?\"", "\"I have a mask,\" Shu said, and pulled a rubber mask from her pocket. It was borrowed from a fisherman who had not noticed it was missing, and it fit her face with a snug, suffocating tightness. She adjusted the strap, feeling the rubber bite into her skin. \"If you can see it, I can see it. And I need to see the socket.\"", "They went down together. This time, Shu held the line, and Han guided her to the arch. The water was colder than before, and her breath came in short, sharp puffs through the snorkel. She could see the dragon’s jaw, a long, curved piece of stone that opened into a dark throat. And there, on the side of the arch, was the socket.", "It was a vertical slot, cut into the stone, deep and narrow. And in it, a bronze stub. It was not a pin. It was a broken piece, sheared off clean, as if someone had cut it with a sword. The metal was dull, covered in a thin layer of green corrosion, and it looked fragile, like a snapped bamboo stalk left to dry in the sun.", "Shu reached out and touched it. The metal was cold, and it vibrated slightly in the current. She felt the solid reality of the years in that small piece of bronze. Thirty years of stillness. Thirty years of water pushing against wood, of silt piling up, of the lake holding its breath.", "She pulled her hand back, and her eyes stung. She blinked, and when she opened them, she saw tears running down her cheeks inside the mask. She blamed the lake water. She blamed the cold. She blamed the salt air that had followed them in the boat. She did not blame the feeling that the bronze stub was a wound, and that she had just touched it.", "\"Three meters,\" A-Bao’s voice came from above, muffled and urgent. \"Time to come up.\"", "Shu nodded, and they kicked upward, rising through the green water, leaving the dragon’s broken pin behind them in the dark."], "img": "img/p039.jpg", "pw": false}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["The Magpie rocked gently in the harbor, its hull creaking against the pilings, while the dock remained empty save for the lingering scent of frying oil and the distant, rhythmic whine of a scooter engine. Shu and Han climbed onto the wooden planks, their clothes heavy and dripping, and stood there for a moment, catching their breath as their hearts settled. A-Bao stood by the railing, holding his duckling’s basket, his face serious and proud, watching them with an intensity that suggested he had been counting every second of their absence.", "They turned, expecting to see Aunt Meng with a plate of scallion pancakes, or Uncle Liu with a mop and a lecture. Instead, they saw A-gong.", "He was standing at the very end of the dock, leaning on his bamboo cane, his white hair thin and wispy in the cool breeze. He wore his faded grey vest and his straw hat, and he looked small against the vast, grey sky. He did not look at Shu, nor did he look at Han. He looked only at the water, at the dark, still surface that had just swallowed his granddaughter and his ferry boy.", "Shu took a step forward, her wet boots squeaking on the planks. \"A-gong,\" she said, her voice rough. \"We saw it. The gate. It’s broken. The pin is sheared.\"", "A-gong did not turn. His hand tightened on the cane, his knuckles white against the bamboo. The silence stretched out, thin and taut, like the rope they had just used to haul themselves up. Then he spoke, his voice low and dry, like leaves scraping across a stone path.", "\"You went under the island,\" he said. It was not a question. It was a statement of fact, heavy with a weight that Shu could feel pressing against her ribs.", "\"We had to,\" Shu said, her voice trembling slightly. \"We had to see it.\"", "A-gong turned away. He walked slowly toward the path that led up to the village, his cane tapping a steady, deliberate rhythm on the wet wood. He did not look back. And then, as he disappeared around the corner of the house, Shu heard him. His voice was quiet, barely a whisper, but it carried clearly over the sound of the waves lapping against the pilings.", "\"I told them not to ask the lake,\" he said.", "Shu stood on the dock, the salt drying on her skin, and felt the ground shift beneath her feet. Not the ground, she realized. The story. The story had just changed, and she was standing in the middle of it, with the water rising around her.", "◆ Words to know: gunwale – the top edge of a boat's side; neoprene – a synthetic rubber used in wetsuits; silt – fine sediment settling in water; obstruction – something that blocks or hinders passage; corrosion – the gradual destruction of metal"], "img": "img/p040.jpg", "pw": false}, {"no": 41, "ch": 9, "ctitle": "The Weir and the Flow", "part": "PART TWO: THE TWO DRAGONS", "paras": ["*The Gatekeeper's Rules, Rule 9: A number without its method is a rumor.*", "The mill race was a trench of cracked clay, a vein of the mountain that had forgotten how to bleed. The water-wheel stood in the center of the dry bed, its wooden paddles locked in a rigid pose, waiting for a flow that had not come in a season. Shu knelt in the dust, her knees pressing into the cool earth, and arranged the planks with the precision of a surgeon laying out instruments. Han held the tin sheet, a dented rectangle that had once covered a window in the ferry house, while she wedged the boards into the V-shaped slot they had cut into the riverbed.", "\"This is a weir,\" she said, tapping the edge of the tin. \"It forces the water to jump over a lip. If we measure the height of that jump, we know exactly how much water is flowing. It is a lie that cannot lie.\"", "Han looked at the thin thread of water trickling from the outlet above. It was so faint it looked less like a river and more like a spider’s web that had been caught in a draft. \"We are about to measure a whisper,\" he said, his voice flat with skepticism. \"Shu, there is nothing there. It is dust with ambition.\"", "\"Water has no ambition,\" Shu replied, adjusting the angle of the planks. \"It has momentum. And right now, the momentum is zero.\" She checked her plumb bob against the vertical edge of the channel. \"If the Sun Basin is draining, the outlet must be the only place the water can go. If the outlet is empty, then the water is not draining. It is being held.\"", "She stepped back to look at the setup. The V-notch was clean, sharp, and waiting. A single drop fell from the tin’s edge, hit the dry clay, and vanished. It was not a stream. It was a suggestion. The math in her head was simple, brutal, and entirely silent. There was no flow. There was only the absence of flow, and the heavy, humid silence of a mountain that had stopped breathing."], "img": "img/p041.jpg", "pw": false}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["The hum of the generator reached them before the figures did, a low, droning vibration that seemed to come from the ground itself. Ouyang Min walked down the bank of the dry race, her white sneakers surprisingly clean, a tablet tucked under one arm and a long pole in the other. She wore a yellow hard hat that looked too large for her, and her glasses caught the pale afternoon light with a flash of sterile blue.", "\"Hello,\" she said, stopping a few meters from the weir. Her voice was calm, professional, and entirely unimpressed by the dust. \"I saw the structure from the ridge. It is a V-notch. Classic.\"", "\"It works,\" Shu said, wiping her hands on her trousers.", "\"It should,\" Ouyang replied. She extended the pole, lowering a small, black sensor into the thin trickle of water. The device beeped, a sharp, digital chirp that sounded out of place in the quiet valley. \"Average velocity, zero point three meters per second. Cross-sectional area, negligible. Flow rate is approximately forty liters per hour.\"", "Shu frowned. \"That is half of what I calculated.\"", "Ouyang looked at her, and for the first time, something other than polite detachment crossed her face. It was curiosity. \"Your calculation?\"", "\"I measured the head over the notch,\" Shu said. \"Two centimeters. Using the standard coefficient, the flow is double your number. You are measuring the center. I am measuring the whole.\"", "Ouyang looked at the sensor, then at the weir, then back at Shu. She did not argue. She did not dismiss the girl’s claim with the easy confidence of someone who had never been wrong in public. Instead, she pulled a small notebook from her pocket and wrote down the number Shu had given her. \"Show me your method,\" she said. \"All of it. Do not skip the assumptions.\"", "Han, who had been leaning against a rock, straightened up. He looked from Shu to the engineer, his mouth slightly open. He had seen adults argue, usually about the price of tea or the speed of scooters. He had never seen them negotiate. This felt different. This felt like two people standing on opposite sides of a table, sliding a chess piece back and forth until it landed in a square that made sense to both of them."], "img": "img/p042.jpg", "pw": false}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["They stood side by side in the dry dust, the engineer and the gatekeeper’s daughter, looking at the same thin line of water. Ouyang held the pole steady, her eyes fixed on the digital readout, while Shu held her folding rule against the wooden lip of the weir. The numbers did not match, and they never did, but the error was not in the water itself. The error was in the perspective.", "\"You are measuring the centerline,\" Shu said, pointing to the sensor. \"The velocity there is the maximum. The water at the edges is slower. It is a parabola, not a line. If you take the average of the center, you are ignoring the drag at the banks. You are measuring the fastest part of the river and calling it the whole river.\"", "Ouyang blinked. She looked at her tablet, then at the sensor. \"I was using a simplified coefficient for a rectangular channel. I did not account for the irregular cross-section of the mill race.\"", "\"Then it is not a rectangular channel,\" Shu said.", "A short, sharp exhale came from Ouyang, a sound that was not a sigh but a laugh, sudden and bright, breaking the tension in the air. She looked at Shu, and her eyes were crinkled at the corners. \"You are right. I was wrong. I was measuring the peak, not the average. And I was using a standard coefficient for a channel that has been silted for thirty years. It is not a channel. It is a scar.\"", "Han stared at Ouyang. He had expected her to correct Shu, to explain that the tablet was smarter than the girl, to remind everyone that she had a degree and a company behind her. Instead, she had admitted it. She had written the correction in her notebook, her pen moving quickly, scratching away the old number and writing the new one. It was a small thing, a correction of a factor of two, but it felt enormous. It felt like a door opening in a room that had been sealed for a long time.", "\"So,\" Han said, his voice quiet. \"The weir is right?\"", "\"The weir is a physical truth. The tablet is a digital suggestion. The truth wins.\" She capped her pen. \"Thank you for the method, Ms. Tsai. I would like to learn it properly. My team does not measure this way. They take one reading and call it a day. You measure until you are certain. That is... rare.\""], "img": "img/p043.jpg", "pw": false}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["The sun began to sink behind the western ridge, stretching the light into long, orange bands across the dry dust of the mill bed. The air was cooling, and the shadows of the camphor trees reached out like long, dark fingers, while Ouyang settled onto an overturned bucket, crossed her legs, and prepared to explain the mathematics of the mountain.", "\"Water is not merely wetness,\" she said, tapping her pen against her knee with a rhythmic click. \"It is stored energy. When it sits high in the Moon Basin, it holds potential. Gravity is patient and does not rush. But if you allow that water to fall, the potential converts into kinetic force. It becomes motion. And motion, properly guided, can be converted into something entirely different.\"", "Shu leaned forward, her elbows resting on her knees. \"Electricity?\"", "\"Exactly,\" Ouyang said. \"A turbine is essentially a wheel that the water pushes. The greater the drop, the faster the wheel turns. The more volume flows, the harder it pushes. It is a simple exchange: height and volume for power. Your lake maintains a head of three and a half meters between the basins. That is a significant drop. If the gates were open, that flow could turn a small turbine. It could power the village.\"", "Shu ran the numbers in her mind, the figures tumbling over one another like stones in a stream. Three and a half meters of head, a constant flow rather than a sudden gush. \"How much power?\" she asked.", "\"Enough to light Mistwater Landing,\" Ouyang said, her voice softening with a kind of pragmatic hope. \"Enough to run the mill. Enough to charge the phones and the lights in the houses. It is not a grand industrial plant. It is a neighborly arrangement. The lake gives a little, and the village takes a little. It is a balance.\"", "Han looked at Shu, his eyes bright with the sudden clarity of a problem solved. \"So the dam is not just a wall,\" he said. \"It is a battery.\"", "\"A very expensive, concrete battery,\" Ouyang corrected gently, her tone carrying a quiet critique. \"And it does not ask the lake for permission. It just holds it still.\"", "Shu looked out at the water, at the thin, stubborn trickle that was still there, still moving, still finding its way down the mountain. It was not just a resource to be captured. It was a relationship. And relationships required more than just holding things still. They required listening."], "img": "img/p044.jpg", "pw": false}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["The sun dropped behind the ridge, turning the light from orange to a deep, bruised purple. The air went still, settling over the place after the wind died, leaving only the trickle of water and the distant call of a bird finding its roost. Ouyang closed her notebook and stood, brushing dry clay from her grey trousers. She looked out at the lake, at the two basins, the island, the jammed gates, and the village waiting in the dusk.", "\"My company sees this lake as a problem,\" she said, her voice low. \"They see the water as a variable that needs to be controlled. A number that must stay steady. They want to hold it still, to make it safe, to make it predictable.\"", "Shu stood up too. She looked at the Moon Basin, dark and deep, pressing against its bank, and then at the Sun Basin, dry and bare, waiting to be filled. \"The lake is not a problem,\" she said. \"It is a living thing. It has been moving for a thousand years. It was not asking to be held still. It was asking to be understood.\"", "Ouyang looked at her. There was no judgment in her eyes, no condescension, only a quiet recognition. She pulled out her pen and wrote a sentence in her notebook, not a number, and did not show Shu what it was. Then she closed the book and tucked it under her arm.", "\"Understood,\" she said. \"I will take that with me.\"", "She turned and walked up the bank, her white sneakers crunching on the dry clay. Han watched her go, then looked at Shu. He did not say anything, because he did not need to. The thirty days were ticking away like a clock, the gates were waiting to be opened, and the promise was waiting to be kept. They stood there in the cooling light, and listened to the water.", "◆ Words to know: skepticism – doubt or disbelief toward a claim; negotiate – discuss to reach a mutual agreement; perspective – a particular point of view; pragmatic – practical and realistic in approach; condescension – an attitude of superior superiority"], "img": "img/p045.jpg", "pw": false}, {"no": 46, "ch": 10, "ctitle": "A-gong's Silence", "part": "PART TWO: THE TWO DRAGONS", "paras": ["*The Gatekeeper's Rules, Rule 10: Some silences are only locked doors, and a door has a key.*", "The dinner table was a small square of lacquered wood, worn smooth in the center by years of elbows, and the air was thick with the sharp, green scent of pickled radish that A-Bao had chopped with aggressive efficiency. They ate in the warm, yellow light of the single bulb, while the tin roof above them ticked softly as the evening heat released itself into the cooling night. Outside, the cicadas were winding down their day’s work, their sound thinning out until it was just a faint, electric hum in the background of the silence.", "A-Bao sat with his knees up on his bench, his yellow raincoat still on despite the indoor heat, because he had a strict policy about leaving his armor on until the threat level dropped to zero. He held his chopsticks with the intensity of a man holding a scalpel. He pointed them at the empty bowl of congee, then at the wall where the map of the lake hung, pinned with four brass tacks.", "\"The pin,\" A-Bao said, his voice flat and factual. \"It is broken. I saw it. It is a sheared pin. I have named it Stubby. It is a very dignified name for a piece of metal that failed.\"", "Shu looked up from her bowl. \"A-Bao, we do not name broken things.\"", "\"We do,\" A-Bao said, stabbing a piece of radish. \"So that we remember to be sorry for them. Also, Dumpling has laid claim to a puddle in the cove. It is very serious about this. It has established a border with a twig. It is a territorial duck.\"", "In the corner of the room, A-gong’s chopsticks stopped.", "He held a single grain of rice suspended in the air. His fingers were still. His eyes were fixed on the grain as if it were a question he did not wish to answer. He did not look at A-Bao. He did not look at Shu. He looked at the grain, and then, with a slowness that felt engineered, he lowered it back into his bowl.", "He pushed the bowl away.", "He picked up his teacup, which was empty, and drank the last of the dust. The quiet that followed was not empty. It was full. A dense, pressurized silence that Shu could feel against her skin, a measurement of exactly how much she did not know. She looked at her grandfather, then at the empty room where her mother usually sat, the chair pushed back against the wall, untouched, waiting for a tea market that had not yet finished its business."], "img": "img/p046.jpg", "pw": false}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["Later, the house had settled into the heavy, velvet quiet of the highland night. The mist had crept back in, softening the edges of the courtyard and turning the bamboo grove into a blur of green and grey. Shu slipped on her sandals, the soles silent on the cool stone floor, and moved through the house without making a sound. She knew the layout of the dark as well as she knew the layout of the channel under the island: which floorboards creaked, which doors stuck, which shadows were harmless and which were not.", "She found her grandfather in the small room off the main hall, the place they called the altar room, though it smelled less of incense and more of old paper and dried camphor wood. He was sitting in the same cane chair, his hat off, his white hair thin and pale in the dim light of a single oil lamp. On the small table in front of him lay a photograph, not framed, just a rectangular piece of glossy paper that had yellowed at the edges.", "Shu paused in the doorway. The photograph showed three men standing on the stone channel of Lantern Island. The gates were behind them, their bronze-bound wooden faces visible, the carved dragon heads looking out with stone indifference. The water in the background was high, lapping at the stone walls, and the sky above them was a bright, clear blue, a color that seemed impossible after the grey, heavy days of the last month.", "One of the men was A-gong, thirty years younger. He was taller, his shoulders broader, and he was wearing a clean white shirt that looked stiff with starch. His face was unlined, his eyes bright with a kind of fierce, youthful pride. He was holding a tool, a long, thin metal rod, and he was smiling, a real smile, not the careful, polite mask he wore now. The second man was shorter, with a round face and a broad grin, wearing a leather apron. It was Han’s father, Uncle Liu, though he looked like a different person, younger and harder. The third man was tall, very tall, with a long face and a serious expression, standing slightly apart from the other two, his hands clasped behind his back. Shu did not know him. She did not know his name, and she did not know why he was in the photograph, standing on the island with the gates behind him, looking at the camera with an expression that seemed to hold a secret.", "A-gong did not look up when she entered. He kept his eyes on the photograph, his fingers tracing the edge of the paper, a small, repetitive motion that told her he was thinking hard, or trying not to. The oil lamp flickered, casting long, dancing shadows on the wall behind him, shadows that moved like the water in the Moon Basin, restless and deep."], "img": "img/p047.jpg", "pw": false}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["\"The third man,\" Shu said. Her voice was quiet, but it cut through the dimness of the room. \"Who is he?\"", "A-gong’s hand stopped tracing the edge of the glossy paper. He looked at the photograph, and then he looked at the floor. \"He was the keeper,\" A-gong said, his voice dry like leaves scraping over stone. \"Before me. And before him, there were others. The line goes back a long way, Shu. Longer than you think. Longer than the village.\"", "\"He is in the photo,\" Shu said. \"He is standing on the island. With you. With Uncle Liu.\"", "\"We were young,\" A-gong said, leaning forward until his elbows rested on his knees. \"We thought we understood the water. We thought we could control it. We measured it, we calculated it, we built the gates to hold it. We thought the lake was a machine. A beautiful machine, but a machine. And machines break. They always break.\"", "He clasped his hands together, the knuckles pale and prominent against his skin. \"The pin sheared,\" he continued, his gaze fixed on the small table. \"Not because of the water. Not because of the flood. It sheared because we did not listen. We forced the gates when we should have waited. We treated the water as a problem to be solved, not a partner to be kept. And when it broke, we were afraid. We were so afraid that we did not fix it. We just... stopped. We left it. We walked away. And the water waited. It always waits. It is very patient.\"", "A cold weight settled in her stomach, heavy and still. \"You left it?\"", "\"I kept it,\" A-gong said, and the word sounded different in his mouth, heavier, sadder. \"I kept it shut. I kept the sun in the west and the moon in the east. I kept the balance. Or so I thought. But the balance was not a balance. It was a jam. A jam is not a balance. A jam is a failure.\"", "He looked up at her then, and his eyes were wet, though his face remained dry and stoic. \"The chest is on Elder Peak,\" he said. \"The tools. The axe and the scissors. They are in the stone shrine, in the chest. That is the rule. The keeper climbs. The keeper fetches. The keeper opens. I never took you up, Shu. I hoped you would never need to. I hoped you would never have to see what I saw. I hoped you would never have to do what I could not do.\""], "img": "img/p048.jpg", "pw": false}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["The door creaked open, and Granny Hua stepped into the dimness, her carved walking stick tapping a steady rhythm against the stone floor. She was tiny, barely reaching Shu’s shoulder, yet she moved with the precise, economical grace of a heron taking off from the shallows. Her plum-colored quilted jacket was buttoned to the chin, and her silver hair was pinned up with a jade clip. In one hand she carried a paper bag of oranges, their bright rinds standing out in the gloom like a handful of suns brought in for safekeeping.", "\"A-gong,\" she said, her voice sharp and clear. \"You are sitting in the dark with a dead man’s face. It is undignified. And it is bad for the digestion.\"", "A-gong looked up, and his expression softened, just slightly, into something that might have been relief. \"A-ma Hua,\" he said.", "\"Give me that photograph.\" She did not ask. She reached out and took it, her thin fingers brushing his, and she studied it for a long time. She did not say anything. She did not need to. She had known the story before it was written. She set the photograph down on the table and poured a cup of tea for herself, the sound of the liquid hitting the porcelain soft and clean.", "\"The climb to the shrine,\" she said, her eyes on the tea, not on A-gong. \"It takes two days. The camphor forest is the hard part. The mist is thick there, and the paths are old. They do not mark the way. You must read the ground. You must read the water. The water always tells the truth, even when the men lie. The water does not lie. It only moves.\"", "She looked up at A-gong then, and her eyes were sharp, piercing. \"You are not a keeper,\" she said. \"You are a man who is afraid. And fear is a poor master. It makes a bad leader. And it breaks things. It breaks pins. It breaks gates. It breaks families.\"", "A-gong looked at the floor. He did not answer. He did not need to. The silence between them held the heavy, quiet pressure of thirty years. Granny Hua finished her tea, set the cup down, and picked up her bag of oranges. She paused at the door, looking back at them, the old man and the young woman, sitting in the dim light with the old photographs spread out on the table.", "\"Bring me an orange,\" she said. \"I am hungry. And A-gong, drink your tea. It will not fix what is broken, but it will keep you warm. And you will need warmth. The mountain is cold.\""], "img": "img/p049.jpg", "pw": false}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["The house settled into silence, but the quality of it had shifted. It was no longer heavy and oppressive; it was light now, thin as the skin of a fresh mooncake, waiting to be filled. Shu stood in the courtyard with her back to the door, tilting her head back to watch the sky. The stars were out, cold and bright, scattered across the black dome like a handful of silver beads dropped from a careless hand. The moon was not yet full, just a sliver of light, a promise, but it was there, steady and sure.", "She could hear the house behind her, the soft creak of the wood, the tick of the cooling metal, the faint sound of her grandfather’s breathing. She could hear the water, too, a low, constant murmur from the Moon Basin, a sound that had been there for a thousand years, patient and deep. She could hear the wind in the bamboo, a soft, rustling whisper, a sound that was almost like a voice, almost like a question.", "She took a breath, and it was cold, sharp, clean. She let it out, and it was warm, soft, gone. She stood there, in the dark, in the quiet, and she made a decision. It was not a big decision. It was not a dramatic decision. It was a small, precise, careful decision, like measuring the depth of the water, like checking the level of the gate. It was a decision to climb. To fetch. To open. To fix.", "She reached up and touched the brass plumb bob on her neck, the cool metal against her skin, a small, solid weight, a promise, a tool. She looked up at the stars, and she did not feel afraid. She felt ready. She felt ready to climb, to fetch, to open, to fix. She felt ready to be the keeper.", "Behind her, the cane tapped on the floor of the house, once. It was a soft, quiet sound, barely a sound at all. But it was there. It was a sign. It was a key. It was a door, opening.", "◆ Words to know: stoic – showing self-control and not revealing emotions; dignified – having or showing a calm, serious respectability; territorial – relating to the area an animal claims as its own; indifference – lack of interest, concern, or sympathy; pressurized – under intense pressure or tension"], "img": "img/p050.jpg", "pw": false}, {"no": 51, "ch": 11, "ctitle": "The Trail to Elder Peak", "part": "PART THREE: THE GOLDEN AXE", "paras": ["*The Gatekeeper's Rules, Rule 11: A path is a promise that the ground will hold.*", "The kitchen smelled of sesame oil and cold mountain air. Shu sat at the low table, wrapping rice balls in plastic wrap with the speed and precision of a surgeon packing an instrument. Beside her, A-Bao balanced a boiled egg on his nose, a feat of balance requiring more concentration than most adults managed with their jobs. He wore his yellow raincoat, though the sky was clear, because he was eleven and prepared for everything except joy.", "Aunt Meng stood in the doorway, holding a bamboo steamer. She looked at the two of them, then at the empty space where their mother would usually be standing, and her face performed a complex negotiation with itself that ended in a long, resonant hum.", "\"Eat,\" she said, setting the steamer down. \"The mountain does not care about your feelings. It cares about your sugar levels. I have added extra ginger. You will need the heat.\"", "Shu nodded. She picked up a rice ball, tore it open, and inspected the filling. It was perfect. She ate it in three bites. Outside, the mist was beginning to curl up off the lake, wrapping the world in a soft grey shroud. The ferry, the Magpie, rocked gently on the pier, its orange life vests bright against the pale water.", "A-gong stood by the door, leaning on his bamboo cane. He was dressed as always: his faded grey vest, his straw hat tucked under his arm, his black cloth shoes laced tight. He looked at Shu, and his eyes were calm, deep pools that reflected nothing but the morning light.", "He took a second, older bamboo cane from beside the door and laid it on the table between them. It was smooth, worn dark by decades of hands, the bamboo grain visible under the varnish.", "\"Keep your feet,\" he said, his voice dry and quiet, \"where the stones are older than the moss.\"", "Shu looked at the cane, then at her grandfather. He did not explain. He did not need to. The stones were the old way. The moss was the new growth, slippery and quick. She picked up the cane. It was lighter than she expected, solid and true.", "\"Thank you, A-gong,\" she said.", "He turned and walked out into the mist, his step uneven but steady. He did not look back. The door clicked shut behind him, a small, definitive sound. Shu looked at A-Bao, who was still balancing his egg.", "\"Ready?\" she asked.", "A-Bao dropped the egg. It bounced once, twice, and rolled under the table. \"I meant to do that,\" he said, with the solemnity of a general. \"It was testing the floor.\""], "img": "img/p051.jpg", "pw": false}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["The trail to Elder Peak began in the tea terraces, where the land was cut into stepwise shelves of dark earth and green leaves, each shelf held up by a stone wall that was low and curved and fitted together without mortar, the stones rounded by centuries of rain and touch. Shu walked the path, her boots clicking against the packed dirt, her fingers trailing along the cool stone.", "A-Bao walked beside her, counting.", "\"One,\" he said. \"Two. Three.\"", "\"Stop counting,\" Shu said.", "\"I can't. My brain is a counter. It doesn't have an off switch. Five. Six. Seven.\"", "Han, meanwhile, was carrying the bulk of the gear: a canvas bag of tools, a coil of rope, and three bottles of water. He was tall and wiry, his orange life vest hanging loosely over his white t-shirt, and he moved with the easy grace of someone who had spent more of his life on water than on land. But the pack was heavy, and the slope was steep, and his knees were complaining in a low, rhythmic groan that was almost a melody.", "\"Why do we climb,\" he asked, breathing through his nose, \"if the answer is at the bottom?\"", "\"Because the tools are at the top,\" Shu said.", "\"And the view is terrible,\" Han added. \"It is always misty. It is like living inside a cloud that owes you money.\"", "\"Ten. Eleven. Twelve,\" A-Bao continued.", "Shu paused at the crest of the terrace. Below them, the Sun Basin lay in a bowl of white mist, the water dark and still, the bare mud of the drained cove a grey scar on the landscape. The stone walls of the terraces ran down the hillside in long, curved lines, each one a tiny dam, holding back the earth, slowing the water, feeding the roots.", "\"They are not just walls,\" Shu said, her voice soft. \"They are the first lesson. Water wants to run fast. It wants to take everything. The walls say no. They make it slow down. They make it stay.\"", "A-Bao stopped counting. He looked at the walls, then at the mist, then at Shu.", "\"So the mountain is a dam?\" he asked.", "\"No,\" Shu said. \"The mountain is a teacher. The dam is just a student who hasn't finished the exam.\"", "Han looked at her, then at the walls, and the strain in his shoulders seemed to ease slightly. He adjusted his strap, took a deep breath, and started up the slope again."], "img": "img/p052.jpg", "pw": false}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["The bamboo grove began where the tea leaves ended, a sudden wall of green stalks rising high above their heads until the air thickened with the smell of crushed leaves and coming rain. Blue magpies flashed through the canopy, their long blue tails swinging like ribbons of ink, their calls sharp and bright against the sudden quiet.", "Shu stopped walking. She pulled the brass plumb bob from her neck and hung it from the top of her folding rule, which she had set upright against a bamboo stalk. The bob swung, steadied, and hung perfectly still. She adjusted the rule, measuring the angle of the slope against the bamboo.", "\"Thirty degrees,\" she said. \"Maybe thirty-two.\"", "Han leaned against a bamboo stalk, wiping sweat from his forehead. \"What does that mean?\"", "\"It means we have to climb for three more hours.\"", "\"Three more hours?\" Han’s face fell. \"I thought we were halfway.\"", "\"You are halfway in distance,\" Shu said. \"You are not halfway in effort. The mountain is not a straight line. It is a spiral. It goes up, and then it goes up again, and then it goes up some more.\"", "A-Bao, who had been silent for the last kilometer, looked up at the bamboo. \"The leaves are moving,\" he said.", "Shu looked up. The bamboo was bending, a slow, rhythmic sway that made the sound like a distant drum. The air was changing, the light dimming, the mist thickening.", "\"Rain,\" Han said.", "\"Storm,\" Shu corrected. \"We need to keep moving.\"", "She shouldered her pack, the weight solid and reassuring. The plumb bob was still in her hand, the brass warm from her fingers. She looked at the trail ahead, disappearing into the green.", "\"Ready?\" she asked.", "A-Bao nodded. Han took a deep breath and adjusted his pack. They walked on, into the shadow of the bamboo, the sound of the wind growing louder, the smell of rain becoming sharper, more urgent."], "img": "img/p053.jpg", "pw": false}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["The first rest shelter appeared just as the rain began to fall in long, fat drops that splattered the muddy path. It was a small wooden structure, open on three sides, with a roof of woven bamboo that had seen better days and now sagged in the middle like a tired shoulder. Inside, a group of people huddled around a small table, their heads bent over maps and notebooks, the paper yellowed and creased from use.", "One of them stood up. She was tall, with silver-framed glasses and a high ponytail, wearing a crisp white shirt under a yellow hard hat. She held a roll of plans under her arm, her posture precise, her expression wary, like a cat that has just noticed a dog.", "\"Ouyang Min,\" Shu said.", "The engineer nodded. \"Tsai Shu. I was wondering when you would appear. We are here to measure the inflow from the streams. The Company needs to know how much water is coming in before the dam is built.\"", "Shu looked at the maps on the table. They were detailed, precise, with lines and numbers that spoke a language she understood, though it was not the language of the lake. It was the language of the gate, of the lever, of the water pressure.", "\"We are here for the tools,\" Shu said.", "\"Yes. I know.\" Ouyang Min’s gaze was sharp, appraising. \"We are on the same trail. We are walking in the same direction. We do not have to be friends.\"", "Shu hesitated. She looked at Han, who was shrugging. She looked at A-Bao, who was looking at the maps with wide eyes, his mouth slightly open in wonder. She looked at the rain, which was beginning to streak down the bamboo leaves, a steady, persistent drizzle that smelled of wet earth and growing things.", "\"Walk with us,\" Shu said. \"We will go faster. We will be safer. And you can tell me what those numbers mean.\"", "Ouyang Min studied her for a long moment, her eyes moving from Shu’s face to the rain, then back again. Then she rolled up her plans and tucked them under her arm, the movement smooth and practiced.", "\"Alright,\" she said. \"But if you get stuck, I am not carrying you.\"", "\"I would never ask,\" Shu said.", "They walked out into the rain, the four of them, a strange and unlikely procession, the sound of their footsteps blending with the drumming of the rain on the bamboo roof."], "img": "img/p054.jpg", "pw": false}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["The tea terraces ended at a sudden drop, where the manicured rows of shrubs surrendered to the raw, ancient clutter of the camphor forest. Here the trunks stood thick and braided with moss, their bark textured like the old rope on the ferry. Above them, the branches wove together into a dense canopy that blocked the sky, filtering the daylight into a green, diffuse glow that seemed to come from the leaves themselves rather than the sun. The air was cool, damp, and heavy with the smell of wet earth and the sweet, rotting scent of fallen leaves.", "A-Bao stopped walking. He stood perfectly still, his yellow raincoat a bright, absurd spot of color against the dark green background. His eyes were wide, fixed on the mossy trunk of a tree before him. He had been counting steps, counting the rhythmic thud of their boots, counting the drops of rain, but now the counting had failed him. The silence of the forest was not empty; it was full, a physical weight pressing against his ears like the air before a storm breaks.", "Han walked beside Shu, his orange life vest tucked under his arm. He leaned in, his voice dropping to a whisper that struggled to survive the dampness. \"I think the mountain is listening.\"", "Shu did not tell him he was being dramatic. She did not point out that a mountain is stone and root, not a creature with ears and opinions. Instead, she felt a quiet certainty settle in her chest, a resonance similar to the hum of water moving through a sluice gate. The mountain was indeed listening. It was patient, and it was old, and it had watched them climb with the same unblinking attention that the lake paid to the stones at its bottom.", "She touched the brass plumb bob at her throat, the cool metal a small, solid anchor in the dimness. She looked up through the gaps in the canopy, where the rain still fell in a soft, continuous hush, threading the air with silver.", "\"Keep your feet,\" she said, echoing her grandfather’s rule, \"where the stones are older than the moss. And watch for roots.\"", "They climbed on, four figures moving into the green, into the silence, into the deep heart of the mountain.", "◆ Words to know: resonant – producing a deep, full sound that echoes; shroud – a covering that hides or conceals; varnish – a glossy protective coating applied to wood; solemnity – a serious, dignified manner of behavior; appraising – carefully assessing or evaluating something"], "img": "img/p055.jpg", "pw": false}, {"no": 56, "ch": 12, "ctitle": "The Camphor Forest", "part": "PART THREE: THE GOLDEN AXE", "paras": ["*The Gatekeeper's Rules, Rule 12: When you are lost, follow the water down; when you are found, follow it up.*", "The trail did not end so much as it forgot itself. One step on a flat stone, the next in a tangle of gnarled roots that gripped the mud like arthritic fingers. A-Bao stopped, his yellow raincoat bright against the dim green, and looked at Shu with the expression of a child who has been promised a straight road and given a maze instead.", "\"I don't see it,\" he said.", "\"Neither do I,\" said Shu. She pulled the folded paper from her pocket. It was Ouyang Min’s contour map, the one from the survey camp, printed on heavy stock that had survived the rain. She smoothed it against her knee, holding it up against the dappled light. The lines were thin and brown, winding across the page.", "\"Look here,\" Shu said, tapping a cluster of lines that were pressed so close together they looked like a single thick stripe. \"Where the lines are crowded, the ground is steep. Where they are far apart, it is a gentle slope. We are standing on a ridge. The map says the ridge drops sharply to the west.\"", "A-Bao squinted. \"So we should go west?\"", "\"No,\" said Shu. \"We should follow the line of the ridge. It is the spine of the mountain. Keep it under your right hand.\"", "She knelt in the soft earth and dragged a stick through the mud, drawing a series of concentric loops. \"Imagine you are a bug,\" she said, pointing to the innermost loop. \"You are at the top. If you crawl out to where the lines are close, you are on a cliff. If you crawl out to where they are wide, you are on a plateau. We want the middle. The shoulder.\"", "A-Bao watched the stick carve the curves, then looked up at the canopy. \"So the mountain has a skeleton,\" he said.", "\"Yes,\" said Shu. \"And we are walking on the ribs.\"", "Han, who had been checking his boots, looked up. \"That is the most poetic thing I have ever heard from a person who owns a water level.\"", "\"Save it,\" Shu said, folding the map back into her pocket. \"The mountain is not going anywhere. But the rain is still coming.\""], "img": "img/p056.jpg", "pw": false}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["The ground tilted more sharply than the map had suggested, the forest floor giving way underfoot as the ferns grew thicker, their fronds uncurling into the path with the insistent grip of green fists. After ten minutes of climbing, the air grew cooler and wetter, the smell of the forest shifting from the sweet rot of leaves to the sharp, metallic scent of wet stone.", "\"I see water,\" Han said.", "They crested a small rise and stopped. A stream cut across their path, not wide, but deep, the water dark and fast, tumbling over smooth, rounded rocks that glistened in the dim light. It was not a river, but it was certainly moving.", "\"Can we jump it?\" A-Bao asked.", "\"No,\" said Shu.", "\"Can we go around?\" Han asked.", "Shu looked up the slope. The tree roots were thick and tangled, and the ground was steep. \"It might take us an hour, or two. We have a deadline, Han. We are not here to hike. We are here to find a chest.\"", "Han rolled his shoulders. He walked to the edge of the stream and lowered his pole into the water. The pole disappeared halfway before it touched the bottom. \"Thirty centimeters,\" he said. \"Maybe forty. The current is strong.\"", "Shu pulled the rope from her pack. It was a thick, braided line, the kind used for the ferry, strong enough to hold a man and a duck. \"Tie it to my waist,\" she said. \"Then tie it to A-Bao. Then you.\"", "\"I am not tying myself to an eleven-year-old,\" Han said.", "\"You are tying yourself to a team,\" Shu corrected. \"If one of us slips, the others hold. That is the rule. Water always finds its level, and it is never impatient about it. Neither should we be.\"", "Han looked at the rope, then at the water. He grumbled something that sounded like a complaint about the weather, but he tied the knot. It was a bowline, tied tight and square. Shu watched his hands work, precise and quick.", "\"Ready?\" she asked.", "\"Ready,\" Han said. He looked at A-Bao. \"Don't fall in, little guy.\"", "\"I have a duckling,\" A-Bao said, with dignity. \"He is better at swimming than me.\""], "img": "img/p057.jpg", "pw": false}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["The crossing was done in single file, one hand gripping the taut rope, the other testing the slick, cold stones for a foothold. The water was shockingly icy, pressing against their shins with a persistent, muscular force that reminded Shu of the pressure gauge on the mill’s intake valve. Han went first, his boots finding purchase with the sure, rhythmic confidence of a man who had spent his life on the Magpie, while Shu followed, her eyes fixed on the grey surface ahead, her mind calculating the distance to the bank. A-Bao brought up the rear, his yellow raincoat flapping in the wind, his face set in a mask of such intense concentration that he looked less like a child and more like a very small, very serious engineer.", "When they were all on the far side, dripping and shivering, Shu untied the rope and coiled it with practiced efficiency. \"Good work,\" she said, though her hands were still trembling slightly.", "A-Bao sat down on a mossy log and immediately opened his lunch bag. \"I think I am hungry,\" he said, as if the hunger had only just occurred to him.", "\"You have been hungry for an hour,\" Han said, wringing water from his shoe. \"You just didn't have the words for it.\"", "\"I have a rice ball,\" A-Bao announced. He unwrapped it, revealing a perfect sphere of rice pressed tight inside plastic. He took a bite, chewed, and swallowed. Then he looked at the bag. It was empty.", "\"I ate it,\" he said. \"All of it. In one go.\"", "\"That was your dinner,\" Shu said.", "\"I know,\" A-Bao said, brushing a crumb from his chin. \"But it was delicious. And I was very hungry. It is a trade-off.\"", "Shu exhaled, a sound that was half laugh, half relief. She took out a small flask of tea, warm from the pocket of her jacket, and poured a little into the cap. She passed it to Han, then to A-Bao. The tea was strong and bitter, tasting of camphor and deep earth, and it warmed them from the inside out, chasing the mountain chill from their bones.", "\"Dumpling needs a swim,\" A-Bao announced, lifting the bamboo basket. The duckling was pecking at the plastic, looking profoundly bored. Shu nodded. A-Bao found a shallow puddle near the base of a camphor tree, set the basket down, and let Dumpling out.", "The duckling waddled into the water, splashing happily. It swam in a tight circle, dipping its head under, then up, preening its feathers with an air of supreme contentment. Then A-Bao gasped. \"Dumpling has a leech.\"", "A small, dark worm was attached to the duckling’s webbed foot, thick and wriggling with a slow, deliberate purpose.", "\"Salt,\" Shu said. She fished in her pocket and found a small packet. She sprinkled a pinch on the leech. It reacted instantly, curling up and sliding off the foot with a wet slip. A-Bao blew on the spot, then patted the duckling’s head with a gentle, reassuring stroke.", "\"That is a fact,\" he said. \"Leeches hate salt. It is a fact I will remember.\""], "img": "img/p058.jpg", "pw": false}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["The sun was sinking behind the camphor ridge, its light filtering through the high canopy in thin, golden shafts that felt more like dusty beams in an empty church than sunlight. The air grew cooler, and the mist began to rise from the valleys below, curling up the slope like steam from a kettle. Shu pulled her brass plumb bob from her pocket, the weight swinging gently on its cord before settling into a steady, vertical line.", "\"Look at the angle,\" she said. She held the bob up, letting it hang freely against the background of leaves. The shadow of the bob on the ground was long and thin, stretching out toward them. \"The sun is low. We have maybe an hour of good light left.\"", "Han looked up through the branches, his face half-lit by the fading gold. \"It is dark up there,\" he said.", "\"Yes,\" Shu replied. \"But the light is coming from the west. If we follow the water down, we will find the valley. If we follow the water up, we are climbing the peak.\"", "They heard it then, a low, constant roar that seemed to come from everywhere at once. It was not the gentle babble of the stream they had crossed an hour ago, but a louder, deeper sound, a physical presence in the air that vibrated in their chests like a drum struck inside a hollow log.", "\"We are not alone,\" A-Bao said quietly, his eyes wide.", "Shu shook her head. \"No. We are just listening.\"", "The roar grew louder as they walked, the sound wrapping around them, pressing against their ears with a steady, rhythmic pulse. The mist thickened, and the trees blurred into grey shapes, their bark indistinguishable from the fog. The path was gone again, replaced by a slope of loose gravel and tangled roots that grabbed at their boots with every step.", "\"I don't like this,\" Han said. His voice was tight, stripped of its usual easy confidence. \"The map said the peak was to the north. We are going west.\"", "\"The map is a projection,\" Shu said, brushing a wet leaf from her shoulder. \"It is a flat representation of a curved surface. It can be wrong. Or we are wrong. One of us is wrong.\"", "\"Or the mountain is moving,\" A-Bao suggested, with the serious tone of a boy who had learned that if everyone else is ignoring a fact, you have to say it.", "Shu stopped. She listened to the roar. It was close now, so close she could feel the vibration in the soles of her boots, a steady thrumming that matched the beat of her own heart. \"We are close to something,\" she said. \"Something big. Something that makes noise.\"", "Han looked at her, his expression wary. \"A waterfall?\"", "\"Maybe,\" Shu said. \"Or a gate.\""], "img": "img/p059.jpg", "pw": false}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["The roar sharpened into a crash. The mist tore open like a wet curtain, and the rock face stood there, sheer and dark, bleeding a torrent of white water into a pool below. Spray rose high enough to catch the last slant of sunlight, bending it into a faint rainbow that arched over the churning water. The sound was no longer a presence; it was a physical weight, pressing against their eardrums with a steady, rhythmic pulse that vibrated in Shu’s sternum.", "Half-hidden in the center of the rock face, just above the waterline, sat a small stone cairn. It was not a natural pile of scree. The stones were stacked with a meticulous care, each one balanced on the next with the precision of a gatekeeper setting a stone in the channel. It was a marker.", "Shu walked forward, her green rubber boots finding no purchase on the slick moss. She reached the base of the cairn and looked up. Tied to the top stone was a strip of faded red cloth, tattered and old, its color washed out by years of rain and sun, but the shape of the knot was clear and distinct.", "Shu recognized it instantly. It was a double bowline with a half-hitch, the exact same knot her grandfather used to secure the ferry’s mooring lines. It was a keeper’s knot, tied with the kind of muscle memory that lived in the hands rather than the head.", "She reached out and touched the cloth. It was dry, which was strange considering the constant spray that misted the air around them. The cloth had been protected, or perhaps it had been tied there more recently than the weathered fabric suggested.", "\"This is a marker,\" she said, her voice cutting through the roar. \"A trail marker. It means someone has been here. Recently.\"", "Han leaned closer, squinting at the knot through the mist. \"That is your grandfather’s knot,\" he said.", "\"Yes,\" Shu replied. \"It is my family’s knot. It means the way is here. It means we are on the right path.\"", "A-Bao looked at the waterfall, then at the cairn, and finally at his sister. \"So the mountain is listening,\" he said. \"And it is answering.\"", "Shu looked at the red cloth, then at the roar of the water, feeling a quiet strength settle in her chest. They had climbed for hours, crossed the stream, and shared their tea. And now they had found the marker.", "\"The way is here,\" she said. \"We keep climbing.\"", "◆ Words to know: contour – a line on a map connecting points of equal elevation; concentric – circles or rings sharing a common center; braided – twisted together to form a strong cord or rope; meticulous – showing great attention to detail and care; cairn – a pile of stones used as a trail marker"], "img": "img/p060.jpg", "pw": false}, {"no": 61, "ch": 13, "ctitle": "The Storm on the Ridge", "part": "PART THREE: THE GOLDEN AXE", "paras": ["*The Gatekeeper's Rules, Rule 13: Strength is borrowed from the shape of the tool.*", "The rain did not fall; it struck. The camphor leaves whipped sideways, turning the forest floor into a grey, churning river of mud and debris. The stream they had crossed an hour ago was now a roaring white wall, swollen by the sudden deluge until it spanned the entire narrow cut in the rock face. Shu stood in the downpour, her green rubber boots sinking into the slurry, and watched the water hammer against the two fallen logs that had served as their bridge. The foam boiled over the tops of the timber, swallowing the structure in a churning, relentless churning, and the sound was a physical weight, pressing against her eardrums with a steady, rhythmic pulse.", "On the far bank, stranded on a shelf of wet granite, stood three figures. Ouyang Min’s white shirt was soaked through, clinging to her frame, her silver-framed glasses fogged and useless. Beside her, two surveyors in yellow raincoats held a flat, black tablet case over their heads with both hands, their faces grim and set. They had tried to cross. The current had pushed them back. Now they stood in the spray, turning their backs to the roaring water, waiting for a miracle that the storm was not in a mood to provide.", "Shu looked at the water. She looked at her friends. Han was trying to keep A-Bao’s yellow raincoat from filling with sludge, while the boy clutched his bamboo basket to his chest, his eyes wide and unblinking. The air smelled of wet earth and ozone, sharp and metallic. Shu pulled her braid out of the rain and tied it tighter with the red cord, her fingers numb and clumsy. She could see the fear in Ouyang’s posture, a rigid, professional stillness that was far more frightening than panic. The storm was not going to stop. The water was not going to lower. They had to cross now, or they would be stuck here until the river rose another meter and took the bank with it.", "Shu took a breath, tasting the cold, and began to unroll the heavy hemp rope from her pack. The fibers were stiff and coarse, but they were strong, and she had a plan that relied on nothing more than tension, geometry, and the stubbornness of three teenagers."], "img": "img/p061.jpg", "pw": false}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["\"Han,\" Shu called, her voice cutting through the roar of the rain. \"Ferry kit. The pulleys.\"", "Han did not question it. He dug into his orange life vest pocket and produced three small, brass-fitted pulleys, their ropes short and tight. He handed them over, his tanned face serious, water dripping from the ends of his messy black hair. Shu nodded and pointed to two camphor trees, their trunks thick and stable, standing on opposite sides of the stream near the edge of the bank. The trees were heavy, their roots gripping the rock, and they would hold.", "She began to rig. The first pulley went on the near tree, anchored with a double bowline. The second pulley went on the far tree, a leap of faith across the churning water, attached to a branch that protruded just enough to catch the hook. The rope passed through the pulleys, creating a loop that doubled the force. She explained it as she worked, her hands moving with the speed of long practice.", "\"Mechanical advantage,\" she said, her voice low and steady. \"Force in, distance out. We pull twice as far, but we lift twice as hard. The load is split between two lines. The rope takes the tension, not our arms.\"", "A-Bao, who had been shivering under his yellow raincoat, stepped forward. He pointed a small, fair finger at the knot Shu had just tied at the anchor point. \"Is that a knot?\" he asked, his voice muffled by the hood.", "\"It is a double bowline with a half-hitch,\" Shu said, not looking up. \"Check it. If it slips, we all swim. If it holds, we cross.\"", "A-Bao inspected the knot with the meticulous care of a master jeweler examining a diamond. He ran his thumb over the fiber, feeling for the tightness, for the integrity. \"It is tight,\" he announced. \"It is good.\"", "Shu smiled, just barely, and moved to the next loop. The rain hammered against her jacket, cold and relentless, but her hands were dry, focused, and sure. She was building a bridge out of rope and logic, a temporary architecture that would hold against the fury of the stream. The tension in the rope hummed, a low, vibrating note that she could feel in her fingertips. It was a promise, fragile and strong, that they would get across."], "img": "img/p062.jpg", "pw": false}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["Han was first. He had been a ferry boy since he could walk, and the water was his old friend, even when it was angry. He stepped onto the wet rock, his black water shoes gripping the stone, and tied the rope harness around his waist and chest. The knots were secure, tested by Shu’s hand and A-Bao’s inspection. He looked back at them, his whistle hanging on a lanyard around his neck.", "\"Be back before the soup gets cold,\" he called out. His voice was cheerful, loud enough to cut through the storm.", "He stepped onto the rope. It sagged under his weight, dipping into the white foam. He leaned into it, his body low, using the tension to pull himself forward. The current grabbed at his legs, trying to twist him, to pull him under, but he fought it, his arms moving in a steady, rhythmic motion. The whistle blew, a sharp, high note that pierced the roar of the rain. He was not fighting the water; he was working with the rope.", "When he reached the far bank, he pulled himself up with a grunt of effort, his tanned skin glistening with water. He secured the far end of the rope to a rock, tying a knot that was even tighter than the one on his side. Then he turned and looked back at the stream, his face set and determined.", "\"Pack first,\" he shouted.", "Shu loaded the heavy packs onto a woven basket, securing them with straps. The basket swung on the pulley, dipping into the water but not touching, the rope humming with tension. The surveyors crossed next, one by one, their faces pale but their movements steady. They were engineers, after all, and they knew how to hold on. The last pack went across with a splash and a shudder, the water churning around the basket as it moved.", "Shu took a deep breath, the cold air filling her lungs. She looked at Han, who was waiting on the other side, his hand raised in a small wave. He was smiling again, that bright, brave smile, and for a moment, the storm seemed to hold its breath."], "img": "img/p063.jpg", "pw": false}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["Ouyang Min was last. She stood on the wet rock, her white shirt soaked and clinging to her frame, her silver-framed glasses fogged and useless. She looked at the rope, at the churning water, and then at Shu. Her face was pale, her lips pressed into a thin line. She was not afraid of the water; she was afraid of the unknown, of the variable that she could not calculate.", "Shu extended her hand. \"You can do this,\" she said, her voice calm and steady. \"The rope holds. The pulley holds. You just have to hang on.\"", "Ouyang took her hand. Her grip was firm, her fingers cold and wet. She stepped onto the rope, her white sneakers slipping on the wet timber. She leaned into it, her body low, her arms working in a steady rhythm. The current grabbed at her legs, but she fought it, her face set and determined. The whistle did not blow, but her breathing was steady, a rhythmic sound that cut through the roar of the rain.", "When she reached the far bank, she pulled herself up with a grunt of effort, her skin glistening with water. She stood there for a moment, her breathing ragged, her eyes fixed on the churning water. Then she turned and looked at Shu, her face serious and intense.", "\"I have designed bridges for ten years,\" she said, her voice low and steady. \"And I have never been so glad of a rope.\"", "Shu smiled, a small, tired smile. \"Welcome to the other side,\" she said.", "Ouyang nodded, her expression softening. She reached out and shook Shu’s hand, a formal, professional gesture that was also a gesture of respect. Then she turned and helped Han pull down the rope-way, her movements efficient and precise. The storm was still raging, the rain still hammering against the leaves, but the bridge was secure, and they were together."], "img": "img/p064.jpg", "pw": false}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["The storm quit as abruptly as it had started. One moment the rain was hammering the camphor leaves with the violence of Aunt Meng’s ladle against a wok, and the next the wind died, leaving the air still and wet. The mist rolled back in from the ridge, thick and white, erasing the trees until the world was nothing but damp green and the smell of crushed bamboo.", "They found the overhang. It was a stone shelf, high on the ridge, where the roots of an ancient camphor tree had dug into the rock and formed a natural wall against the wind. Inside, it was dry. It was warm. It smelled of wet earth and old moss. Shu gathered dead bamboo, splitting it with her knife to expose the dry pith inside, and coaxed a flame from it. The fire caught, hissing and popping, and sent up a cloud of acrid, comforting smoke that pushed the dampness away.", "Ouyang Min sat across the fire. Her silver-framed glasses were clean, her hair still plastered to her neck, but her posture had straightened. She looked at Shu with the same meticulous attention she had applied to her survey maps, but without the cold distance.", "\"I was wrong about one thing,\" Ouyang said. Her voice was low, stripped of its corporate polish. \"I thought you were just a girl who did not want a dam. I thought you were opposing the numbers because you did not understand them.\"", "Shu looked up. The firelight caught the red cord in her braid, turning it a bright, defiant orange. She shook her head, and the braid swung over her shoulder, heavy and solid.", "\"I was wrong about the same thing,\" Shu said. \"I thought you were just a dam. A wall. A thing that stopped water.\" She paused, watching a spark rise and die in the dark. \"But you are the water. You just haven’t found your level yet.\"", "Ouyang blinked. Then, slowly, the corner of her mouth twitched. It was not a smile, not exactly, but it was the beginning of one.", "\"A-Bao is asleep,\" she said quietly, looking aside.", "Shu glanced over. Her brother was curled up in his yellow raincoat, a small yellow ball in the grey dark. The duckling, Dumpling, was tucked into the bamboo basket beside him, pecking at a crumb of dried fish with single-minded determination. Han sat with his back against the stone, his whistle hanging loose on its lanyard, his eyes closed. He looked less like a ferry boy and more like a piece of driftwood that had finally washed ashore.", "The mountain was quiet now. Below them, the mist swirled over the two basins, hiding the lake. But Shu could feel it there, deep in the stone, the heavy, patient weight of the water waiting for the gates to open. She looked at Ouyang, then at Han, then at the fire. They had crossed the stream. They had crossed the line. And for the first time in thirty years, the people on the bank were sitting on the same side of the fire.", "◆ Words to know: deluge – a heavy, sudden downpour of rain; rigid – stiff and unable to bend or move; meticulous – showing extreme care and attention to detail; acrid – having a sharply bitter or stinging taste; defiant – showing resistance or opposition to authority"], "img": "img/p065.jpg", "pw": false}, {"no": 66, "ch": 14, "ctitle": "The Shrine of the Keepers", "part": "PART THREE: THE GOLDEN AXE", "paras": ["*The Gatekeeper's Rules, Rule 14: Gold is only what a tool looks like after a hundred years of the right hands.*", "The mist peeled back in slow, white strips, revealing the world one ridge at a time. Shu stood at the edge of the overhang, her breath pluming in the cold air, and looked down. The lake lay in the valley, entire and impossibly small. The Sun Basin, that broad round eye in the east, caught the first thin light of the dawn and turned it into something bright and sharp, a bronze disc resting on green velvet. The Moon Basin, the crescent in the west, held the shadow a little longer, a dark sliver of silver curving around the stone wall.", "Between them, Lantern Island sat in the middle, a green bump with red roofs. The two basins joined at a point so thin it looked like a scratch in the glass. Shu had measured the mud. She had mapped the depth. She had argued with an engineer about the flow rate of a weir. But seeing the whole thing from here, from the height where the camphor trees thinned out into bare rock, made it look less like a problem and more like a toy. A very large, very important toy, but a toy nonetheless.", "\"It looks like a map somebody drew while happy,\" Han said. He stood beside her, his orange life vest still damp, his hair sticking up in wild black spikes that the wind had not yet finished messing. He pointed a finger at the Sun Basin, then at the Moon, then at the island. \"Like a kid drawing the sun and the moon in the sky, but they put them in the water because they were bored.\"", "Shu laughed. It was a short, sharp sound, startled out of her by the sheer visual clarity of it. Below them, the village of Mistwater Landing was a cluster of grey tiles and red lanterns, tiny as seeds. The ferry, the *Magpie*, was docked so small it might have been a speck of dust. The terraces on the hillside were just green lines, neat and orderly, like the steps of a staircase that nobody was using.", "\"Wait,\" Shu said. She pulled her notebook from her jacket pocket, her fingers clumsy with the cold. She sketched the shapes quickly, the round sun, the curved moon, the island in between. She did not care about the scale. She cared about the relationship. The water was not just sitting there. It was held there. It was kept.", "\"Look,\" she said, tapping the paper. \"The sun is low. The moon is high. And the island is in the way. That is not an accident. That is a machine.\""], "img": "img/p066.jpg", "pw": false}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["The trail narrowed as it climbed. The camphor trees grew taller and thicker, their leaves dropping a fine green dust on Shu’s indigo jacket. The air smelled of resin and old stone. Han walked ahead, his long legs eating up the path, his whistle swinging gently against his chest. A-Bao hiked behind them, his yellow raincoat bright against the grey moss, his basket of Dumpling bobbing with his steps. The duckling had stopped quacking. It was too busy trying to keep up.", "After twenty minutes of climbing, the path ended at a break in the rock. There, set into the hillside like a tooth in a jaw, was the shrine. It was a low stone hut, its walls built from flat, dark slabs that had been fitted together with such precision that Shu could not find a line where one stone ended and another began. The roof was slate, black and steep, shedding the last of the rain. Over the door, carved in a style that looked older than the village, older than the tea terraces, was a dragon. It was not a fierce dragon. It was a patient one, its eyes closed, its body coiled around a single, perfect circle.", "Shu stopped. The others followed.", "\"Is that...?\" Han started.", "\"The gate,\" Shu said. She touched the stone, her fingers grazing the carved scales. The stone was cold, but not dead-cold. It felt like a sluice gate waiting for the water to rise. \"It is the gate. The one that lives in the water. This is where it sleeps when it is not working.\"", "A-Bao put his basket down. \"Is it scary?\"", "\"No,\" said Han. \"It is just stone. And a door.\"", "Shu looked at the door. It was heavy, iron-bound, and it had no handle. There was only a keyhole, small and square, set into the wood at chest height. She reached into the pocket of her work jacket. Her hand closed around the brass key. It was warm from her body heat, the metal smooth and familiar. She had taken it from the wall that night, and her grandfather, watching her do it, had said only, in a voice barely a whisper: *When you are ready. Not before. Not after. When you are ready.*", "She had not been ready. She had been scared. She had been measuring mud and arguing with engineers. But now, standing in front of the stone dragon, looking at the key in her hand, she felt the fear settle into something solid. Something useful.", "She turned the key. It clicked, a sound sharp and clear in the quiet forest. The door swung open on silent hinges."], "img": "img/p067.jpg", "pw": false}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["The interior was small, dry, and still, holding a faint scent of woodsmoke and old cloth. Against the back wall stood a simple wooden altar, its surface bare save for a clean, empty bowl and a bundle of incense sticks, their tips dark with age. There were no statues or offerings, only the quiet solidity of the stone and the polished wood.", "In the center of the room, resting on a raised stone platform, sat the chest. It was iron-bound, the wood dark and hard, the metal straps rusted in places but structurally sound. It looked capable of holding books, or tools, or both.", "Shu walked to it. She did not open it immediately, standing there with her hands at her sides while Han leaned over her shoulder and A-Bao sat on the stone floor, hugging his basket.", "\"Open it,\" Han said.", "\"It is heavy,\" Shu replied.", "\"Then we will lift it together.\"", "She nodded and placed her hands on the lid. The wood was cool and solid under her palms. She pushed, but the lid did not move. She pushed harder, her arms straining, her boots slipping on the slick stone. Han placed his hands on the lid too, his face serious, his jaw set. A-Bao stood up and put his small hands on the edge.", "Together, they lifted. The lid groaned, a low, wooden sound, and swung open.", "Inside, wrapped in oiled cloth, lay the tools.", "The first object Shu saw was the lever. It was bronze, dark and heavy, its head shaped like the head of an axe. It was not a small axe, but a big one, the blade broad and flat, the handle thick and ribbed. It was a tool for prying, for forcing, for moving things that did not want to move. Beside it lay a pair of long bronze dividers, their tips curved and sharp, like the blades of scissors. They were not for cutting cloth, but for measuring, for setting, for marking.", "Both tools were polished. Not shiny, not new, but polished by use. By hands. By years. They glowed in the dim light, a warm, honey-colored shine that came from the friction of care.", "\"The gold,\" A-Bao whispered
