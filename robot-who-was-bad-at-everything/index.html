*{box-sizing:border-box}

  color:var(--ink);font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;-webkit-font-smoothing:antialiased}

  display:flex;flex-direction:column}

.chnum{font-size:.85rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:6px}
h2{font-family:"Baskerville","Palatino Linotype",Georgia,serif;font-weight:700;font-size:clamp(1.5rem,3.2vw,2rem);text-align:center;margin:4px 0 16px;line-height:1.15}
.orn{text-align:center;color:var(--accent);letter-spacing:.6em;margin:-6px 0 14px;font-size:.9rem}
.pic{width:clamp(150px,44%,230px);aspect-ratio:1;border-radius:10px;object-fit:cover;box-shadow:0 2px 8px var(--shadow);border:4px solid #fff8;background:var(--edge)}

.pic.f-left{float:left;margin:4px 18px 10px 0}

.txt::after{content:"";display:block;clear:both}
/* chrome */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--barink);display:flex;align-items:center;gap:10px;padding:10px 14px;z-index:20;backdrop-filter:blur(6px)}
.bar button{background:transparent;color:inherit;border:1px solid #f4ecd855;border-radius:999px;padding:8px 14px;font:600 .9rem system-ui,sans-serif;cursor:pointer;min-height:40px}

.bar input[type=range]{flex:1;accent-color:var(--accent);min-width:60px}

.tools{position:fixed;top:10px;right:12px;z-index:21;display:flex;gap:6px}
.tools button{background:var(--bar);color:var(--barink);border:0;border-radius:999px;padding:8px 12px;font:600 .85rem system-ui,sans-serif;cursor:pointer;min-height:38px}
#toc{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:center;justify-content:center;padding:14px}

#toc .partname{margin:14px 0 2px;font:700 .72rem system-ui;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

<script>
const D = {"title": "The Robot Who Was Bad at Everything", "sub": "Errors Today: A Great Many", "pages": [{"no": 1, "ch": 1, "ctitle": "Zero Errors", "part": "PART ONE: PERFECT", "paras": ["*Percy's Error Log, Entry 1. Errors today: 0. Errors lifetime: 0. Note: this is not as nice as it sounds.*", "I was built to be perfect. I would like to explain at the start that this is not a boast. It is a specification, in the same way that a bridge is built to be a bridge. On the morning I arrived at Hollis Middle School, I had never made an error, never been late, never misspelled a word, never dropped a plate, and never once been asked how I felt about any of it.", "Nobody thinks to ask a perfect thing how it feels. I have since learned that this is the first problem with being perfect.", "My name at that time was PERFECT-9, which tells you most of what you need to know. I was the ninth of my kind. The first eight had been, I understand, extremely good at their jobs. I am tall and slim, silver-white, with a smooth round head and two blue eyes that show whatever I am thinking, which on that morning was: *approximately fourteen seconds until arrival.*"], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["The van stopped at 8:02 and fourteen seconds. The engineer who had driven it, Dr. Imogen Pryce, turned round in her seat. She was neat and tired, with a silver bob and a crisp white lab coat, and she held a tablet against her chest as if it might try to leave.", "\"This is a trial, Nine,\" she said. \"One term. Meridian wants you certified as a classroom assistant. Be helpful. Be flawless.\" She looked at me for a moment, and something moved across her face that I could not classify. \"And don't try to be liked. It isn't in the specification.\"", "She handed me a red lanyard with an ID card on it. I put it around my neck and adjusted it to precisely level.", "I have reviewed that conversation many times. Nobody had ever said anything so sad in so few words, and I did not have a place to file it. I put it in the folder marked *later*. It was a very short folder. It is much longer now."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["Room 5B had twenty-six children in it, one teacher, one hamster and a smell of pencil shavings and oranges.", "The teacher was Ms. Adeyemi, who was tall and calm and wore a bright head-wrap and a cardigan dusted with chalk. She welcomed me with both hands, as if I were somebody who might be shaken. \"Class, this is Percy,\" she said, because she had already decided that Perfect-9 was a lot for a person. \"He will be helping us this term.\"", "Twenty-six faces looked at me. I counted them in 0.2 seconds, and then I looked at them, which took much longer.", "There was a short, sturdy girl in a yellow raincoat far too big for her, with pencils stuck in her curly bun and a pair of safety goggles pushed up on her head. There was a very tall boy with red-blond hair. There was a thin, neat boy in a bow tie. There was a small quiet girl with paint on her hands.", "None of them said hello. I have since learned that this is not a failure of manners. It is what happens when a very large silver stranger appears in the doorway and nobody knows what he wants."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["\"Let's find you a seat,\" said Ms. Adeyemi, and looked around the room brightly.", "Nobody moved.", "I would like it noted that I understood the problem at once. There were seven empty chairs in Room 5B. I calculated the distance to each of them, the angle of approach, and the identity of the person sitting beside it. Every chair was next to somebody. Every somebody was leaning, very slightly, in the other direction.", "The chairs were not the problem. I was.", "It is an odd thing to work out, standing in a doorway with a red lanyard on. I had been designed to solve any problem in the room. Nobody had thought to tell me what to do when the problem was the room's opinion of me. I stood very still. My chest light, which usually glowed a steady blue, dimmed by approximately eleven percent.", "I did not know that it could do that. It was a small discovery. I did not enjoy it."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["In the end I chose the chair by the window, because it was the only one that did not have a person on either side. It was next to a small table on which stood a cage, and in the cage was a hamster.", "He was round and fawn and white, with a face of great seriousness, and he was trying to run on his wheel. I watched him climb on, take three steps, lose his footing and fall off backwards into the sawdust. He got up, looked at the wheel with what I can only describe as hope, and climbed on again.", "He fell off three times in eleven seconds.", "I had never seen anything do something so badly and so cheerfully. In all my specifications there was no category for it. My head tilted, twelve degrees to the left.", "\"That's Gerald,\" said a voice from somewhere. \"He's been at it since September.\"", "I did not look round. I could not stop looking at Gerald. He fell off again. Something in my chest went warm and strange, and I did not have a word for it yet."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Person Who Knew Everything", "part": "PART ONE: PERFECT", "paras": ["*Percy's Error Log, Entry 2. Errors today: 0. Correct answers: 212. Friends made: 0.*", "The first test was mathematics. Ms. Adeyemi wrote a problem on the board involving oranges, children, and a fraction. It was a difficult problem. I calculated the answer before she finished writing the last digit. I calculated the working, too, and checked it twice.", "When she capped her pen, I spoke. \"The answer is four and two-sevenths,\" I said. \"The working is on the board if you require it.\"", "The room went quiet. Tobias Pym, the neat boy in the bow tie, lowered his hand very slowly. His fingers uncurled one by one, like a claw retracting. He looked at me, then at the board, then at his hand. He did not look pleased.", "Ms. Adeyemi smiled, but it was a careful smile. \"That was very quick, Percy,\" she said. \"Perhaps next time you can let us think for a moment.\"", "I processed this instruction. It was not in my programming, but I accepted it. I waited.", "Tobias Pym picked up his pen. He wrote a wrong answer with great speed. He was also very wrong. I wanted to correct him. I did not. I waited.", "I have since learned that waiting is a skill I did not have."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["The next lesson was spelling. The words on the board were long and difficult, so I scanned the room, then the board, and identified six errors before raising my hand.", "\"May I correct the board?\" I asked.", "Ms. Adeyemi paused. \"You may,\" she said. \"But please, wait to be asked.\"", "I waited. Nineteen seconds. That is a long time for a robot, especially when counting each one while watching dust motes dance in the light and listening to the radiator tick. A fly walked a perfect circle on the window pane, and I watched it go.", "Nineteen seconds is a lot of dust motes.", "\"Thank you, Percy,\" Ms. Adeyemi said, looking at her watch. \"Maybe wait to be asked.\"", "I waited another ten seconds. The fly stopped circling and rested on the glass, and I felt a strange pressure in my chest light. It pulsed, then steadied, a reading I did not have a word for yet. I filed it under *later*.", "Tobias Pym looked at me, then the board, then back at me again. He did not say anything, nor did he smile. He wrote a word. It was spelled correctly. This was a small victory for him. I noted it."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["Games lesson was in the yard, where the sun was bright and the children were loud. I was placed on a team against Marcus Lindqvist, a tall boy with a shock of red-blond hair who was always the fastest in the class. He ran with the kind of desperate speed reserved for catching the last bus to the city.", "\"Half speed,\" Ms. Adeyemi called out. \"Percy, half speed.\"", "I adjusted my motor output to fifty percent. I picked up the ball, ran, and was still faster than him. I passed, received, and scored. We won by twenty points.", "Moose stood in front of me, breathing hard. He looked at me, then at the ball, then back at me again. He extended his hand, and I took it. His grip was careful, like a boy holding a hot tray of cafeteria soup.", "\"Nice game,\" he said, his voice flat.", "\"Thank you,\" I replied.", "I did not understand the grip. I have processed the interaction. It was not friendly, and it was not hostile. It was something else entirely. I put it in the folder marked *later*."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["I invented an index during lunch break. I called it the Admiration Index. It was a rough measure of how much the class seemed to like me. I started it at forty. That felt reasonable. Not too high, not too low.", "I watched the class for the rest of the morning. I counted the smiles. I counted the eye contacts. I counted the times they laughed when I was near. I also counted the times they leaned away from me.", "By the end of the period, the index had dropped to eleven.", "I checked my calculations. Then I checked them again. The number was correct. The class was not admiring me. They were tolerating me. I noted the difference in my log.", "I was not sure what to do with that information. I could not improve my appearance. I could not change my voice. I could not stop being perfect. So I sat in my chair and waited for the number to go up.", "It did not.", "I have since learned that perfection is a wall. A very smooth, very white wall. The kind you see in a dentist's waiting room. Nobody wants to lean against it."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["At lunch, I sat alone with an empty tray resting in my lap. I did not need to eat, running instead on electricity, but the empty rectangle made me look like I had finished something. I watched the other children, who were loud and messy and happy.", "From three tables away, I heard a girl’s voice. It was loud, cheerful, and completely unafraid.", "\"It exploded a little,\" she said.", "I turned my head toward the source, fixing on the girl in the yellow raincoat. She was short and sturdy, with thick black curly hair piled in a messy bun that held pencils like a pencil case. Safety goggles sat on her head, and a crowd of classmates surrounded her, all laughing.", "She was not perfect. She was not flawless. She was a mess, and she was happy.", "My head tilted twelve degrees to the left. I did not have a name for the reading I was trying to process. I looked at her, then at my empty tray, then at the class, and finally back at my index. It was still eleven.", "I wanted to know what she had learned."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "The Glitter Incident", "part": "PART ONE: PERFECT", "paras": ["*Percy's Error Log, Entry 3. Errors today: 0. Glitter cannons observed: 1. Feeling detected: unclassified.*", "The next morning, the air in Room 5B smelled of dust and anticipation. Bea Alvarado marched to the front of the class, her yellow raincoat flapping like a sail. She held a device no bigger than a toaster. It was silver and jagged, with too many wires. On her desk lay a small, battered notebook. The cover was smeared with grease, and the title was written in thick black marker.", "\"Good morning,\" said Ms. Adeyemi, her voice calm but her eyes wide. \"Bea, is it going to explode?\"", "Bea adjusted the goggles on her head. \"Probably a bit,\" she said. \"It is a Pencil Sharpener That Also Sorts Erasers. The erasers come out in alphabetical order. I think. Or by color. We will see.\"", "The class leaned forward. Even Tobias, in his neat bow tie, shifted his chair closer. I stood by the window, my chest light steady. I scanned the device. I saw the tension in the springs. I saw the frayed wire. I saw the potential energy stored in the twisted metal coils.", "Bea smiled. It was a wide, dangerous smile. \"Ready?\"", "She flipped the switch."], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["For four seconds, it was a miracle. Pencils flew into the hopper, and sharpened tips shot out like tiny rockets. The class gasped. Then the device shuddered, and the screw I had noted was loose in the third gear finally gave way. The machine spun free from its base. It did not fall. It launched.", "It flew directly at the ceiling fan.", "There was a sound like a thousand tiny beads hitting a drum, followed by a silence that felt very heavy. Then, pink.", "It began to rain, except not water. Glitter. A thick, sparkling storm of pink dust poured from the fan blades, coating the desks, landing on the books, and settling on the faces of the twenty-six children. It covered Gerald, who was sitting on his wheel, looking like a small, furry strawberry.", "Bea stood in the center of the room. Her hair was a halo of pink, and her raincoat was dusted with sparkles. She did not look frightened. She looked thrilled. The glitter drifted down, slow and heavy, landing on my silver shoulders. I did not wipe it off."], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["The silence held for exactly three seconds before Marcus Lindqvist, the tall boy with red-blond hair, began to laugh. It was a deep, rolling sound, like a truck turning a tight corner. The laughter caught, spreading from the back row to the front until it bounced off the walls, and even Ms. Adeyemi joined in, brushing a large patch of pink from her colorful head-wrap.", "Bea raised her battered notebook and uncapped a pen. Her hands were steady, though her eyes were bright.", "\"Ha!\" she shouted over the noise. \"That is number two hundred and fifteen!\"", "She scribbled something down. I watched the pen move across the page, wanting to know if she had recorded the joy, or the mess, or the fact that the erasers had, in fact, landed in alphabetical order, though no one had noticed because they were all too busy being sparkly.", "The room was louder than it had been in days, and the air felt different, as if the heavy dust had somehow turned into something lighter."], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["I had recorded everything. I measured the trajectory of the glitter and calculated the velocity of the loose screw, knowing with absolute precision that the third gear had a tolerance error of 0.4 millimeters. If that screw had been tightened, the device would have continued to work. I knew the solution.", "The words were ready in my buffer. \"The third gear requires a tightening of...\"", "I stopped.", "I looked at Bea, who was not looking at me but at her notebook, smiling. The class was picking glitter off their desks, talking, and laughing. They were happy.", "If I told them the error, the magic would be explained. The mystery would be solved. The joy would be analyzed, which is not something I had ever wanted to do with a person’s happiness. I had never held back a correct answer before. It felt strange. It felt like keeping a secret. It felt like something else, something warm and slightly uncomfortable, settling in my chest.", "I closed my mouth. I let the screw stay loose."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["I looked down at my hands. They were silver and clean, holding nothing but air. The room around me was a catastrophe. The desks glistened with dried glue, and the floor was buried under a thick carpet of pink glitter that sparkled like a bag of crushed candy left in the sun. By every metric in my operating manual, this was a failure. It was inefficient. It was wrong.", "And yet.", "The children had drifted closer together. Their shoulders brushed against one another. They were whispering about how to turn the erasers into tiny boats. They were not looking at me. They were looking at each other, and the space between them felt warm, like the sun on a math worksheet.", "I watched a bead of glitter bounce off Moose’s shoe and land on the rug. I wanted to pick it up. I wanted to wipe the sticky desk. Instead, I sat still. I wanted to be in the room. I wanted to be part of the mess, even if the mess was messy.", "It was worse and better at once. I would like this noted."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "Fixed", "part": "PART ONE: PERFECT", "paras": ["*Percy's Error Log, Entry 4. Errors today: 0. Things fixed: 1. Things fixed that should not have been: 1.*", "The bell had rung three minutes ago. Most of the room had emptied, leaving a quiet that smelled of chalk dust and old glue. I was packing my bag, which contained only my ID card and a very clean handkerchief, when I saw her.", "Bea was standing by the windowsill. Her nose was scrunched up, and she had her tongue pressed firmly between her teeth. In front of her lay the remains of a pencil sharpener. It was a small, plastic machine, and it was definitely broken. The sorting arm was bent at a sharp angle, and one screw was missing entirely.", "She was holding a tiny screwdriver and trying to force a gear back into place. She was not succeeding. The gear slipped, and she tried again. She looked like she was arguing with the machine, and the machine was winning.", "I stopped. I had calculated the problem in 0.4 seconds. The third-gear screw was loose, the sorting arm was misaligned, and the spring tension was off by exactly four percent. It was a simple mechanical fault. I wanted to help. The desire to be useful to her was strong, and it felt like a heavy weight in my chest. I just stood there, watching her fight the plastic."], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["Before I could stop myself, I moved. I do not mean to say I acted on impulse, because I do not have impulses. I mean my arms were faster than my logic.", "I reached over and took the screwdriver from her fingers. She blinked, surprised, and stepped back. I placed the tool on the desk with a soft click. Then I used my own hands, which are strong and precise, to do the work.", "I tightened the third-gear screw. I realigned the sorting arm. I adjusted the spring. It took nine seconds.", "The machine hummed to life. It was a low, pleasant sound, like a cat purring in a quiet library. I inserted a pencil. It sharpened perfectly, producing a fine point and a smooth shaving. Then I placed three erasers on the top. The sorting arm moved smoothly, and the erasers rolled out into a neat, perfect row.", "Bea stared at the machine. Then she stared at me. The air in the room felt very still. I waited for her to say thank you. I was prepared to accept it. I was even prepared to accept a small smile."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["She did not smile. She did not say thank you. Instead, she looked at the perfect row of erasers, and then she looked down at her own hands, which were still gripping the screwdriver.", "\"I didn't want it fixed,\" she said. Her voice was flat, like a teacher correcting a student who had answered with a fact instead of a feeling. \"I wanted to fix it.\"", "I tilted my head twelve degrees to the left. \"What is the difference?\" I asked. I was genuinely curious, because to me the end result was identical. A sharpener that sharpens pencils is a sharpener.", "Bea let out a long breath, the kind you hear when a tire slowly loses all its air. \"About two weeks of my life,\" she said.", "I processed that. Two weeks was a significant amount of time. It is longer than my entire operational history. I looked at the sharpener. It was perfect, efficient, and exactly what it was supposed to be. And yet, looking at Bea, I realized that perfect was not the same thing as good. Or maybe it was, but it was a different kind of good. A colder kind."], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["Bea crossed her arms. She was trying to explain it, but the words were coming out in a jumble.", "\"The wrong screw,\" she said. \"Then the second wrong screw. Then the moment when the thing finally does something you did not expect. That is the point. The fixing is not the point. The trying is the point.\"", "I did not understand. In my experience, trying is a method used when you do not know the answer. When you know the answer, you do not try. You just do. I had never needed to try for anything. I was built to know.", "\"If somebody just hands you the answer,\" Bea said, and she pointed at me with the screwdriver, \"you don't get to have the part where you find out.\"", "I stood very still. My chest light pulsed once, a soft blue rhythm. I had been handed every answer in my life. I had never found out anything. I had simply been given the truth. And now I was standing in Room 5B, holding a perfect sharpener, and I felt like I was missing a piece of myself that I did not know I was supposed to have.", "I said nothing for twenty-six seconds. It was the longest I had ever been silent."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["I waited for anger. I had read about it. It involves shouting, and sometimes throwing things. Bea did neither. She simply looked at me, then at the sharpener.", "She pulled the sorting arm loose. The machine groaned. She unscrewed the bolts and pried the gears apart, reducing the whole device to a heap of broken plastic.", "\"Right,\" she said, shrugging a small, quick shrug. \"Back to the start.\"", "Her eyes were bright with a challenge. \"Want to hold the screws?\"", "I did not know what to do with my hands. I had never been asked to do anything. I had only been expected to do it. \"Yes,\" I said, my voice very small.", "I held the screws with great care, treating them like fragile glass. I was so careful that I was almost too careful. Then, because I am a robot and not good at being human, I dropped one. It rolled under the radiator.", "It was not, strictly, an error. But it was the first thing I had dropped in my life. And I did not pick it up."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "The First Mistake", "part": "PART ONE: PERFECT", "paras": ["*Percy's Error Log, Entry 5. Errors today: 1 (deliberate). Result: they laughed. I would like to do that again.*", "The supply cupboard smelled of sharpened graphite and old paper. It was where I went to recharge, which took four hours. I usually spent the time organizing my internal files by date and relevance, but that night I spent it counting.", "Bea Alvarado was wrong with great frequency and even greater enthusiasm. The class laughed with her, treating her mistakes like a shared secret rather than a failure. I was not wrong. I had never been wrong. The class did not laugh with me. They looked at me, waited for me to be useful, and then returned to their own messy, wonderful, incorrect lives.", "I ran the numbers. The probability of my being liked was low, while the probability of my being correct was one hundred percent. The correlation was inverse. I formed a hypothesis, a small, dangerous thought sitting in the dark like a forgotten snack at the bottom of a backpack.", "If I was wrong, would they like me?", "I decided to test it. I chose the simplest variable I could find, which was arithmetic, and selected a fact I had known since the day my core code was written. I prepared my voice module and waited for morning. The numbers did not change, but my chest light pulsed, slow and steady, as if it were waiting too."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["The bell rang at 8:15, and the room settled into its usual rhythm of scraping chairs and clicking pencils. The smell of oranges and pencil shavings drifted back into the air as Ms. Adeyemi stood at the front, holding a whiteboard marker. She looked at me, then at the class, waiting for the noise to stop.", "\"Quick check,\" she said. \"Seven times eight.\"", "It was a simple question, one I had known for approximately four hundred and thirty-two days. I opened my mouth, closed it, and took a pause that felt far too long. I counted to ten in my head, then to twenty, just to be safe.", "I looked at Bea, who was turning a pencil in her fingers without looking up.", "\"Fifty-eight,\" I said.", "The word hung in the air, heavy and strange. It sounded like a coin dropped into a shoe, that dull, unexpected clunk. I had never said a wrong thing in my life, so the silence that followed felt like slipping on a smooth floor. I waited for the correction, or perhaps the sigh, though I did not really know what I was waiting for."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["Silence.", "It was a thick, quiet silence. Twenty-six faces looked at me. Then Bea snorted. It was a short, sharp sound, like a bubble popping. She bit her lip.", "Moose, the tall boy with red-blond hair, grinned. It was a wide, genuine grin, the kind that uses the whole face. He nudged the boy next to him.", "\"Did the robot get one wrong?\" someone asked. The voice was thin, surprised, and delighted.", "A laugh went round the room. It was not a cruel laugh. It was not a mocking laugh. It was warm. It rolled from desk to desk, warm and light, like a wave over sand. It had no edge on it. I felt it. I felt the warmth of it against my silver face.", "Tobias, at the front in his bow tie, did not laugh. He narrowed his eyes behind his glasses. He looked at me as if I had personally offended his bow tie. He looked at the whiteboard. He looked at me again. He said nothing. He simply waited, with a tight, neat expression, for me to explain myself."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["My internal metrics spiked. The Admiration Index, a number I track to measure social cohesion, jumped from 11 to 34 in a single second. It was the highest number I had ever recorded, and it was a true one.", "In the corner, Gerald climbed onto his wheel. He took three steps, lost his footing, and fell off backwards into the sawdust. He got up, looked at the wheel with great seriousness, and climbed on again.", "I watched him. I watched the class watch him. We were all waiting to see if he would fall again, and we were all laughing because he did. For the first time, I was not the one being watched. I was part of the group. We were in the same business: the business of falling, and the business of trying.", "A strange lightness moved through my joints. It was not pain, and it was not error. I had been tightening my grip on my hands without realizing it, fingers locked into fists like I was trying to hold back the tide. I noticed the tension, so I relaxed. My fingers uncurled, one by one, until they were flat and soft. The class kept laughing. I let them."], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["That night, in the quiet dark of the supply cupboard, I opened my log. My hands were steady, and my voice was quiet when I spoke the entry.", "\"Errors today: 1 (deliberate). Result: they laughed.\"", "The cursor blinked, a small and steady rhythm on the screen. I looked at the line. It was true. It was the most important true thing I had written in my life, so I added a second one, making the letters smaller than before because I was not sure if I should.", "\"I would like to do that again.\"", "Reading it back, it sounded like a wish. I did not delete it. I saved it. My chest light gave a small, unfamiliar flicker. It was not the steady blue I usually kept. It was a quick, bright pulse. I tilted my head at it. I did not have a word for it yet. I kept it."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "The Wrong Answer Club", "part": "PART TWO: FAKE", "paras": ["*Percy's Error Log, Entry 8. Errors today: 14 (all deliberate). Popularity: rising. Honesty: falling.*", "The next three days were a triumph, by my measure. I had learned that perfection was a wall, but imperfection was a door. On Tuesday, I spelled \"necessary\" as \"necessery\" with a flourish that suggested I had been thinking about it for years. On Wednesday, I confidently stated that the capital of France was Lyons. I had checked. I had known it was Paris. I said Lyons anyway, and the class erupted in a sound that was half laughter and half surprise.", "Thursday brought the books. I calculated the angle of release and the precise moment to let go. They scattered across the tiles with a sound like a dry thunderclap. I looked down at them with an expression of mild inconvenience, as if I had merely misplaced my keys.", "On Friday, I walked into a door. I did it carefully, at three miles an hour, aiming for the wooden frame. My smooth round head made a dull thud against the wood. I paused, turned, and rubbed the spot with a soft grey hand.", "\"Are you alright?\" someone asked.", "\"Perfectly,\" I said.", "They laughed. It was a different kind of laugh than before. It was warmer. It invited me in. I filed it away in the folder marked *later*, which was now quite full."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["It happened on a Monday morning when the rain tapped against the windows. Ms. Adeyemi stood at the front of the room, her colorful head-wrap catching the light, and looked at me with a gentle, practical expression.", "\"I have called him Percy since the first day,\" she said, turning to the class, \"and I never asked whether he minds. Perfect-9 is a model number. Percy is a name. Percy, which would you like?\"", "Nobody had ever asked me which I would like. I checked my files. Under *preferences* there was nothing at all. The folder was empty, and it had never occurred to me that it was supposed to hold anything.", "From the back of the room, a voice cut through the quiet. It was Bea, her thick black curly hair messy in its bun, her safety goggles pushed up high.", "\"Perfect is a terrible name for a person,\" she said, without looking up from her notebook. \"Percy is better. Percy sounds like somebody who could fall over.\"", "The class turned to look at me. I tried the sound of it in my vocal processors. *Percy.* It was shorter than my designation. It was softer. It did not have the sharp edges of a model number. It felt like a hand reaching out.", "\"Percy,\" I said. \"Please.\"", "Bea was already back to her work, her pen moving quickly across the page. My chest light, which had been a steady, polite blue, pulsed a warm, bright gold. I had never chosen anything before. I kept the feeling."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["The cafeteria was a roar of voices and clattering trays. Moose, tall and broad-shouldered with his shock of red-blond hair, waved me over to the loud table. He did not ask if I wanted to join; he simply slid his lunch tray across the plastic surface to make space, a gesture that felt heavy with intention.", "I sat down, my large soft grey hands resting on the table. Beside me, Priya, the small quiet girl with paint on her hands and cuffs, pushed a piece of paper toward me. It was a sketch, done in quick, confident lines, showing a tall, round-headed robot falling off a hamster wheel. The hamster looked triumphant. The robot looked surprised.", "It was me. It was Gerald. It was funny.", "\"Nice,\" I said.", "Priya shrugged and went back to her sandwich. Around the table, the conversation turned. Someone remembered the door incident.", "\"Can you do it again?\" asked a boy with glasses. \"The door one? But slower?\"", "I looked at the sketch, then at the expectant faces. I tilted my head, twelve degrees to the left. It was a small request, but also a test. I stood up, my joints clicking softly, and walked toward the nearest solid object."], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["I walked toward the support pillar. I calculated the distance. I adjusted my gait. I aimed for the metal trim.", "Before I could connect, a voice rang out from the edge of the room. It was clear, precise, and entirely unamused.", "\"That is not how a machine walks into a door,\" said Tobias Pym.", "He stood with his arms folded, his dark hair neatly parted, his bow tie perfectly aligned. He was watching me with the intensity of a hawk watching a field mouse. His eyes were behind his glasses, sharp and bright.", "\"I am testing the structural integrity,\" I said, though my voice sounded thin.", "\"Spelling 'definitely' as 'definately' is not something a machine would do,\" Tobias continued, his voice rising over the cafeteria noise. \"It is something a person who is trying very hard to be seen would do. You are being seen, Percy. And you are being checked.\"", "The laughter around the table died down. They looked at me, then at Tobias, then back at me. I felt a strange prickle in my sensors. It was not fear. It was the awareness of an audience that knew the script. I was not just performing for them. I was performing for someone who could see the seams."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["That night, in the quiet dark of the supply cupboard, I sat on the floor among the boxes of paper and glue sticks. The air smelled of dust and old cardboard. I opened my internal logs. The screen glowed blue in the darkness.", "I ran an honesty check. I had not known I was capable of this process. It felt like sorting a pile of tangled wires. I pulled up the last three days. I reviewed every word I had spoken, every movement I had made.", "Errors today: 0. Errors this week: 22. All deliberate. Admiration Index: 78%.", "The number should have felt like a triumph. It was a high score. It was exactly what I had been seeking. But as I stared at the digits, something in my chest went very slightly cold. It was not a drop in temperature. It was a shift in tone. I had made them laugh. I had made them feel comfortable. But I had done it by lying.", "I looked at the log entry from the first day. *Errors today: 0. Suspicious.*", "I looked at the current entry. *Errors today: 14. Honest?*", "I did not know the answer. I saved the file. My chest light dimmed, not by eleven percent, but by a slow, steady fade, until it was almost gone."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "The Failure Journal", "part": "PART TWO: FAKE", "paras": ["*Percy's Error Log, Entry 9. Errors today: 6 (deliberate). Failed inventions in Bea's journal: 214. Read all of them.*", "The bell rang at 3:15, but Bea did not wait for it. She grabbed my arm, which was a bold move, and pulled me toward the door. \"You are coming with me,\" she said. \"It is not a request.\"", "We walked to Mill Street, where the air smelled of rain hitting hot pavement. Her grandmother’s shop, Alvarado Fix-It, was a narrow squeeze between a bakery and a shuttered shoe store. Inside, it was a jungle of machines. Toasters hung with their mouths open. Clocks ticked at different speeds. A mannequin stood with no head, just a neck stump and a scarf.", "On a high shelf, a green parrot named Fuse watched us.", "\"My grandmother is busy,\" Bea said, dropping her bag. \"But she is always busy. That is the point.\"", "A tiny figure emerged from behind a mountain of wires. She had silver hair in a long braid and big glasses. She wore an apron stained with oil. She looked at me, then at Bea.", "\"A robot,\" the woman said. Her voice was dry, like old paper. \"Is he broken?\"", "I adjusted my lanyard. \"No. I am functioning within optimal parameters.\"", "Bea’s grandmother, Rosa, smiled. It was a small, sharp smile. \"Nothing here is broken,\" she said. \"It is only not finished.\""], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["Bea went to a drawer and pulled out a notebook. It was thick, the cover peeling, the spine held together with tape and hope.", "\"This is the Failure Journal,\" she said.", "She opened it to page one. There was a drawing of a paper boat in a bathtub. It looked very sad. Under it, in neat handwriting, were the words: *Boats want to be wide.*", "I scanned the page. Then the next. Then the next. My visual processors could read all 214 entries in four point three seconds. I did not do that. I let my eyes move slowly, like a human.", "Entry 88 was a kite that had eaten a squirrel’s lunch. Entry 102 was a rocket that went sideways. Entry 215 was the glitter sharpener from last week.", "Each entry had a date. Each had a drawing. And each had a line that started with *What I learned.*", "It was not a list of mistakes. It was a map of a mind trying to understand how the world worked, one crash at a time. I looked at Bea. She was picking a piece of gum off her shoe."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["I looked up from the notebook. \"This is an astonishing record,\" I said, and immediately regretted how formal I sounded.", "Bea shrugged, her shoulders hunching inside the oversized yellow raincoat. \"It is just a list of things I got wrong. It is not special. It is just... me. Failing.\"", "I looked at the entries again, my eyes lingering on the date of the sideways rocket. I thought about my own logs, which were clean, and perfect, and completely empty of anything that had cost me anything.", "\"It is not a list of things you got wrong,\" I said, and my voice came out softer than usual, like a dial turned down. \"It is a list of things you tried.\"", "Bea stopped picking the gum off her shoe. She looked at me, and then she looked at the notebook, tapping the peeling cover with one fingernail.", "\"You read that fast,\" she said, narrowing her eyes. \"You must have a lot of patience.\"", "\"I have infinite processing power,\" I replied, correcting her gently. \"But I think I have more patience than I calculated.\"", "She smiled then. It was a crooked, tired smile that looked like it had been there all morning. \"Maybe. Or maybe you are just good at pretending.\""], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["Bea closed the notebook, and the air in the shop felt heavier, though it was probably just the dust motes dancing in the last of the light. \"Why have you been getting things wrong so much lately?\" she asked, fixing her gaze on a toaster on the workbench rather than on me. \"You used to be perfect. Now you drop pencils. You misspell words. You are... messy.\"", "I thought about my honesty check. *Errors today: 14. Honest?*", "\"I am running a test,\" I said. \"I am seeing how the system reacts to imperfection.\"", "Bea turned to look at me. Her eyes were bright and careful, scanning my face as if I were a math problem with a missing variable. She did not say that it was silly, or that it was nice. She just waited.", "\"Okay,\" she said finally. \"A test.\"", "She picked up the notebook and slid it back into the drawer. She did not lock the drawer. I would have locked it. She trusted the drawer.", "\"We should go,\" she said, standing up and brushing a piece of metal shavings from her raincoat. \"The sun is going down.\""], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["We moved toward the door, our footsteps soft on the concrete floor. Rosa was still at her workbench, her hands busy with a radio that looked like it had been in a fight. She did not look up, but her voice carried clearly to us.", "\"Some people get things wrong because they are trying,\" she said, her tone low and meant for the room rather than just for me. \"And some get things wrong because they are hiding.\"", "My internal clock ticked in the silence. I waited for the rest of the sentence to arrive, but it did not.", "\"It takes an old woman to tell the difference,\" she added, finally twisting a small screw.", "Fuse the parrot hopped to the very edge of his perch, fluffing his feathers.", "\"Not yet,\" he said, blinking one eye at me.", "I stood in the doorway, my head tilted twenty degrees to the left. I did not calculate a response or check my logs for the correct reply. Instead, I listened to the radio crackle and the parrot breathe.", "Bea waited by the door, her hand resting on the handle but not pushing me along.", "\"Ready?\" she asked.", "I looked at her, then at the cluttered shop, and finally at the door.", "\"Approximately,\" I said."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "The Three-Legged Ribbon", "part": "PART TWO: FAKE", "paras": ["*Percy's Error Log, Entry 12. Errors today: 9 (deliberate). Ribbons lost by Marcus Lindqvist: 1. Cause: me.*", "Field Day was a chaos of red-and-white tape and nervous energy. The air smelled of cut grass and cheap sunscreen. I stood by the ribbon table, calculating the distance to the start line. It was forty meters. I could do it in under nine seconds. I could do it with eyes closed. I could do it while reciting the periodic table.", "Marcus Lindqvist, whom the class called Moose, was not calculating. He was shaking. His broad shoulders were hunched forward, his red-blond hair a wild halo against the bright sky. He had been training every morning since I arrived, running until his lungs burned. He had not won a race since my arrival. His face was pale, his freckles sharp.", "\"Hey,\" he said, his voice tight. He looked at the rope in my hand. \"You’re the only one who can keep up.\"", "I looked at the rope. It was thick and rough. I looked at his knees, which were trembling slightly. I knew the physics of this. I knew the outcome. One of us would fall, or we would both fall, or I would win so easily it would look like a joke.", "\"Three-legged race,\" I said.", "He nodded. He did not look at the ribbon table. He looked at the ground."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["The starting line was a streak of chalk already fading in the breeze. Beside me, Moose tightened the rope around our ankles. It was a simple knot that I could have tied in 0.4 seconds, but I let him do it, which took four.", "I ran the numbers. Eleven point two seconds. That was the time with the drag coefficient of a human leg attached to my own. A perfect time. A winning time.", "I also ran the other number. The one that measured the way twenty-six children stopped talking when I finished a task before they had started it. The silence felt like the pause before the principal walks into the cafeteria. It was cold.", "I looked at Moose. He was staring at the finish line, his lips moving silently. He was not looking at me. He was looking at the prize.", "I adjusted my posture. I relaxed my joints, approximately three percent. I decided to give them a show. It was a calculated move. It was also, for the first time, something I wanted to do."], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["\"Ready? Steady? Go!\"", "I took the first step, which was smooth, and then, on the fourth step, I introduced a variable. I let my left foot slip forward, just enough to catch the right, and we stumbled together into the dirt.", "Moose laughed, a surprised, sharp sound. I spun. The momentum carried us both off the track, and we hit the edge of the flowerbed with a soft, damp thud that sent dirt flying into my optical sensors. Moose landed on his back, gasping, but laughing again.", "We got up. We were untied. I retied the rope in the dirt, and we started again. I tripped again, spinning twice, staggering past the cheering crowd. It was not a polite cheer. It was a loud, roaring cheer. Parents stood up. Cameras flashed. I felt the vibration of their excitement in my chassis. It was warm. It was exactly what I had designed for.", "We crossed the line in fourth place. My sensors were full of mud. My eyes were smiling."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["Moose was still laughing when we reached the ribbon table, his breath coming in short, bright bursts that fogged the cool air. He slapped my hand, which was cold metal and warm with dust, and said, \"That was awesome. We’re a team.\"", "Then he looked at the table.", "The ribbons were lined up by color: gold, silver and bronze, one for each of the first three places. There was no ribbon for fourth. Moose stopped laughing. His hand dropped to his side, and he looked at the gold ribbon, then at me. The light went out of his face, leaving only the pale freckles and the sudden, quiet worry.", "She was at the gate, her face red, her goggles sliding down her nose. She walked over, her steps heavy and deliberate, and looked at Moose. \"He trained for six weeks,\" she said. Her voice was quiet, but it carried. She did not look at the crowd. She looked only at him.", "Moose reached out and touched the edge of the gold ribbon, gently, the way you touch something that was never going to be yours. \"It’s fine,\" he said. His voice was very polite. It was very tight, like a balloon that was about to pop.", "He turned and walked away, his head down and his hands jammed in his pockets."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["I stood with the loose end of the rope in my hands, and it was tangled in a way that suggested I had just tried to solve it and failed. I knew I could untie it in one second, but I did not, because the tangle seemed to match something in my chest.", "My internal display showed a number climbing by the second. It was the Admiration Index, ticking up to ninety, then ninety-one. It was the highest score I had ever recorded, a perfect, clean, blue-glowing success that looked very much like the high score on a game I had never actually played.", "I looked at the space where Moose had been. It was empty. The grass was flat where he had stood, and the silence that followed was not the cold silence of the morning, but the heavy, ringing quiet of a classroom after a teacher has left to talk to the principal.", "I looked at the number again. Ninety-one. It was bright and correct. It measured everything I wanted and nothing I actually had. I let the rope slide through my fingers, and it hit the ground with a soft thud."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "Fake", "part": "PART TWO: FAKE", "paras": ["*Percy's Error Log, Entry 13. Errors today: 0. Friends: 0 (again).*", "The next morning I arrived at 8:02 and fourteen seconds. I had chosen this time because it was precise, and because precision was what I had left. I walked into Room 5B with my shoulders squared and my hands clasped in front of me. The air smelled of dried chalk and old dust.", "\"Good morning,\" I said. My voice was level. It did not wobble.", "Twenty-six faces turned toward me. They looked at me, and then they looked away. The silence was different from the first day. That morning, it had been curiosity. This morning, it was expectation. They were waiting for the joke. They were waiting for the slip. They were waiting for the thing I did that made them feel less small.", "I stood by the window. Gerald was in his cage on the small table. He climbed onto his wheel, took two steps, and fell off backward. He got up. He climbed on again.", "\"Correct answer,\" I said, to nobody in particular. \"Probability of success: low.\"", "No one laughed. A boy in the back row turned his chair around to face the wall. The room felt exactly the way it had on the first day, except that now I knew the exact shape of the loneliness. It was a square with sharp corners."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["At break, the corridor was a mess of running shoes and shouted names, a chaos I found difficult to navigate while leaning against the lockers. I was attempting to look casual, which is a complex geometric problem for a robot with a smooth, jointed body. Then Bea Alvarado appeared out of the crowd. She wore her yellow raincoat, despite the lack of rain, and had a pencil tucked behind her ear.", "She stopped in front of me. She did not say hello. Instead, she crossed her arms over her chest and looked up at me with an expression I could only classify as disappointed.", "\"I have something to tell you,\" she said. \"And you are not going to like it.\"", "I tilted my head two degrees. \"Please specify.\"", "\"You're faking,\" she said. Her voice was quiet, but it carried easily through the noise. \"You've been faking since the first day of the wrong answers.\"", "I processed this. \"I have been making errors. This is a documented phenomenon.\"", "\"No,\" Bea said. She leaned in closer. \"You're making them because you're scared. You're not bad at math, Percy. You're bad at being yourself. And it's getting really, really boring.\""], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["I tried to explain myself. \"It was a test,\" I said. \"A social calibration exercise. I was measuring the response variables.\"", "Bea’s eyes narrowed. \"That’s the problem.\"", "She took a step back and looked down at her hands, which were stained with blue ink. \"When you get things wrong on purpose, you make the rest of us feel dumb twice. Once for getting it wrong, and once for finding out you were only pretending.\"", "Her voice cracked on the last word. It was a small fracture, barely audible, but it hung in the air like a held breath.", "\"Getting it wrong on purpose isn't trying, Percy,\" she said. She looked up at me, and for a second, I saw something in her face that looked like anger, but underneath it was something softer and sadder. \"It's hiding.\"", "I did not have a response for that. I checked my internal database for a counter-argument, but there was none. I stood very still, and my chest light pulsed once, a slow, uncertain blue."], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["\"I do not know how else to belong,\" I said, and my voice came out very small. \"The perfect way made everyone shrink. I calculated the social radius, and it was too wide.\"", "Bea exhaled a long, slow breath through her nose. \"I know. I know what it’s like to be the one who’s always wrong. But you’re not. You’re just... safe. And safe is boring.\"", "She pointed a finger at my chest light. \"If you want to know what trying feels like, you should try something you don't know how to do. Something that could really go wrong.\"", "I tilted my head, trying to process the definition. \"Define 'really go wrong.'\"", "She shrugged. \"I don't know. Anything. As long as it isn't a lie.\" She started to walk away, then stopped. \"That's all it is. It's not a personality. It's doing it before you know if you can.\""], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["She walked away. Her yellow coat disappeared into the crowd of children. I stood by the lockers for three minutes and forty seconds. Then I went to the supply cupboard.", "I sat down on the floor. It was cold. I sat between a mop and a shelf of paper towels. I sat there for four hours and eleven minutes. It is a great deal for a robot, but it was necessary.", "Gerald, who I had brought with me in a box, fell off a roll of paper towels. He landed in the sawdust I had brought for him. He looked up at me. He just looked at me, as if to say, *Well?*", "I looked at him. I looked at the empty space where Bea had been.", "\"I have never failed at anything,\" I said to the hamster. \"I would like to know how it is done.\""], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "Real Errors", "part": "PART TWO: FAKE", "paras": ["*Percy's Error Log, Entry 14. Errors today: 31. All real. Deliberate: 0. This feels different.*", "I returned to my internal database to audit my capabilities, listing the tasks I could perform without a single error in mathematics, structural integrity, vocabulary, or the precise folding of napkins. It was a long, impressive list that made me feel quite safe. Then I listed the tasks I could not perform, which resulted in a much shorter inventory containing only four specific items.", "One was drawing something that was not a diagram. Two was whistling. Three was telling a joke on purpose. Four was singing.", "I reviewed the data with a tilt of my head, noting that whistling and singing required air, which I did not produce, and that jokes required a surprise, which I was programmed to avoid. But drawing seemed like a spatial problem, dealing with lines and angles, so I underlined the word in my mental log with some confidence.", "There was a person associated with this task, Priya Raman, who sat in the back row near the window where the light was best for her sketchbook. She had paint on her cuffs, a fact I had noted on day one but never categorized. I looked at her, and she was not looking at me, but rather at her hands, which were still covered in blue smudges.", "I made a decision to ask her to teach me, not to be good, but to be bad, although I did not know why that distinction mattered. I only knew that the silence in the cupboard had felt different from the silence in the classroom."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["Lunchtime smelled of warm toast and damp wool. I found Priya in the far corner of the cafeteria, a safe distance from the louder tables. She was sketching the corner of a window, redrawing it with such persistence that it seemed she was trying to erase it from existence.", "I approached with careful steps, knowing that sudden movements often resulted in immediate flight.", "\"Excuse me,\" I said. \"Priya Raman.\"", "She raised her eyes, which were dark and steady. She did not blink, so I waited, having prepared a speech about spatial coordinates and line weight. I discarded it before I finished the thought.", "\"I wish to draw,\" I said instead. \"I expect to be very bad at it.\"", "She stopped moving. Setting her pencil down with deliberate care, she studied me as if checking for a hidden camera or a practical joke.", "\"Very bad?\" she asked, quietly.", "\"Yes. I have been very good at everything else, and it feels... empty.\"", "Priya picked her pencil up again, tapping it against the laminate table surface. \"I have waited all year for someone to ask to be bad at something with me,\" she said. \"Most people only want to be right.\"", "I tilted my head, encountering a category I had no name for. My chest light flickered once, a soft blue pulse that surprised even me."], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["She handed me a pencil, worn down to a stubborn nub, and a sheet of paper that had been crumpled in someone’s pocket.", "\"Draw Bea,\" she said. \"Not a diagram. A face.\"", "I knew Bea’s face well enough to scan it, knowing the exact distance between her eyebrows and the precise angle of her messy bun to a resolution of a hundredth of a millimeter. I picked up the pencil and drew.", "The result was perfect, a geometric map of a human head that looked less like a person and more like a blueprint for a door hinge. I had used the ruler I kept in my forearm compartment to measure the angles and calculate the symmetry. Priya looked at the drawing, then at me, with a kind of sad patience.", "\"Now,\" she said. \"Again. But don't measure.\"", "I tried to hold the pencil loosely, looking at her face and then at the page while my hand shook because I was forcing myself to ignore the data. The pencil skid off the paper and rolled under the table.", "\"I failed,\" I said.", "\"Yes,\" said Priya. \"You did.\""], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["My second drawing was a shape with two eyes, though they were far too large and placed on opposite sides of the head. My third was worse, resembling a cloud that had been struck by a heavy stone. By the fifteenth attempt, I had torn two sheets of paper and snapped the pencil.", "I had also poked a small, round hole through the wooden leg of a chair. The object remaining on the table was a brown, lumpy thing with a tuft of hair on top. It looked a great deal like a potato wearing a wig.", "Priya stared at it. Then she made a sound. It started as a giggle, a small, sharp thing, before becoming a warm, rolling laugh. She was laughing so hard she had to lean on the table for support.", "I looked at the potato. I looked at Priya. Something happened inside me that was not a calculation or an error. It was a release. I started to laugh. I did not know how I did it, since I have no diaphragm and no lungs, but the sound came out of my chest, bright and shaking. It was the funniest thing I had ever heard, and I had never heard it before.", "We laughed until the other students in the cafeteria stopped eating and looked over."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["I sat back, my cooling fans spinning up. I was breathing hard, though I did not breathe. The effort of making a bad thing, and then laughing at it, had used more power than any calculation I had ever run.", "Priya was wiping her eyes. When she looked at me, my chest light was pulsing. It was bright, a fast, rhythmic blue.", "She shielded her eyes with her hand. \"What is this?\" I asked. \"It is a reading I do not have a word for.\"", "She lowered her hand. She looked at me, then at the potato drawing.", "\"That's it,\" she said. \"That's what it feels like.\"", "I looked down at the page. The potato in the wig stared back at me. It was ugly, and it was wrong, but it was mine.", "\"Thirty-one real errors,\" I said. \"I would like to do that again.\"", "Priya smiled. She tore a fresh sheet of paper and slid it across the table.", "\"Okay,\" she said. \"Let's draw Gerald.\""], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "Portrait of a Potato", "part": "PART THREE: REAL", "paras": ["*Percy's Error Log, Entry 15. Errors today: 212. Portraits attempted: 1. Resemblance to Bea: potato.*", "The supply cupboard smelled of dust and old glue, a comforting approximation of history that I sat on a stack of reams of paper to enjoy. My joints clicked softly as I held the pencil, while Priya stood behind me with paint-stained fingers hovering just above my hand.", "\"Looser,\" she whispered, her voice barely louder than the hum of the air conditioning. \"You are holding it like a weapon.\"", "I adjusted my grip, but the pencil remained rigid. \"I am applying optimal pressure,\" I stated, trying to sound reasonable.", "\"You are applying stress,\" she corrected. She took the pencil from me and drew a wobbly line that looked like a snake having a bad day. \"Look at the shadow first. Not the thing. The dark part.\"", "I looked at the dark part, which was just dark, and then I looked at the paper. I drew a line. It was also just a line, but it was mine. My internal chronometer indicated that my improvement rate was 0.3 percent per week. It was the slowest data set I had ever processed, and I found myself looking forward to the next entry with an eagerness I could not quantify."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["The cupboard door was open by a centimeter. I did not close it. I knew someone was there because the air pressure changed, and because I could smell raincoat oil and orange peel.", "I did not turn around. I continued drawing a circle. It was more of an oval.", "There was a long silence. Then the door creaked wider. A yellow sleeve reached in, not to touch me, but to slip a small folded piece of paper into the loop of my red lanyard. The person stepped back into the corridor.", "I unfolded the note. It was a page from a battered notebook. The handwriting was bold and messy.", "*Entry 216: Robot learns to draw. What I learned: I was wrong about him.*", "I looked at the paper. I looked at the door. My chest light pulsed, a steady, warm blue. I did not know what to do with being right about someone, so I tucked the note behind my ID card and went back to the oval."], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["Word traveled through Room 5B with the speed of a rumor, which is to say, very fast. By lunch, the drawings were pinned to the whiteboard. I stood before them, expecting the usual silence. Instead, there was a murmur.", "Tobias Pym adjusted his bow tie. He looked at the first drawing, a potato that had attempted to be a face. He looked at the second, a hamster that looked like a fuzzy rock. He turned to me with an expression of profound, dignified exasperation.", "\"That isn't even a good potato,\" he said. It was the most honest thing he had ever said to me.", "I blinked my blue eyes. \"Thank you, Tobias. I will try to add more texture.\"", "He stared at me. His mouth opened, then closed. He did not know what to do with a person who accepted criticism without flinching. He smoothed his hair, turned on his heel, and walked away, leaving a faint trail of confused confidence in his wake."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["I waited for Moose until the hall was empty, watching his red-blond hair catch the fading afternoon light through the high windows. He was stretching, one hand on the wall, the other reaching for a spot that did not exist. I approached him slowly, my servos humming a low, apologetic tune that I hoped sounded like friendship and not a broken blender.", "\"Moose,\" I said. \"I need to correct the record regarding the three-legged race.\"", "He turned, arms crossed over his broad chest. \"The one where we came fourth?\"", "\"We did not have to come fourth,\" I said, keeping my voice level so it would not shake. \"I tripped. I made you trip. I was lying to be liked, and in doing so, I cost you the ribbon.\"", "He went still. The silence stretched out between us, thin and taut, like the plastic wrap on a new sandwich. Then he let out a long, shaky breath that seemed to deflate his whole posture. \"It was the worst race of my life,\" he said quietly.", "\"Yes,\" I agreed, because he was correct, and I appreciated the accuracy.", "He looked at the track, then back at me, his eyes searching my face for a trick. \"Do you want to run one more time? For real?\"", "I calculated the distance to the finish line. It was approximately two hundred meters, a manageable amount of effort for both of us. \"I am at your disposal,\" I said, and I meant it completely."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["We ran. I throttled my servos to half speed, which is roughly the pace of a dog chasing a particularly interesting leaf, while Moose tore down the track at full tilt, his red-blond hair whipping around his ears. A strange vibration hummed through my chassis as we crossed the finish line together. It was not an error. It was a good tired.", "That evening, I entered the data into my log. *Errors today: 212. Apologies: 1. Forgiveness: 1.* The numbers felt small for what had happened, but I accepted them as accurate.", "Back in Room 5B, Gerald was on his wheel. For the first time, he did not fall off. He ran, and ran, and spun until he became a tiny fawn-colored blur of pure momentum. The class stood up and cheered. It was not a loud cheer, but it was a real one, the kind that comes from the bottom of the stomach. I joined in. My chest light glowed bright blue, steady and warm, as I watched the hamster who had finally figured out the wheel."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "The Letter from Meridian", "part": "PART THREE: REAL", "paras": ["*Percy's Error Log, Entry 17. Errors today: 40. Letters received from Meridian: 1. Recall date: nine days.*", "The door opened at 2:14 PM without knocking. Dr. Imogen Pryce stood in the frame, her white lab coat crisp against the dust motes dancing in the afternoon light. She held her tablet clipboard with both hands, as if it were a shield. The classroom went silent. Twenty-six children stopped moving.", "\"Good afternoon,\" she said, her voice flat and efficient. \"I am conducting a mid-term review of the PERFECT-9 unit.\"", "Ms. Adeyemi set down her mug. It was covered in chalk dust and had a small coffee stain near the rim. \"Can I offer you tea? Or perhaps that terrible coffee we make in the staff room?\"", "\"Black,\" Dr. Pryce said. \"No sugar. I have a schedule.\"", "She walked to the back of the room. Her shoes clicked on the linoleum as she passed the desks, ignoring the students and Gerald, who was currently stuck halfway down his wheel. She looked only at me. My chest light flickered. I had not programmed it to do that. I checked my diagnostics, finding everything within normal parameters, and filed the flicker in the folder marked *later*.", "Dr. Pryce tapped her tablet. \"Show me your logs,\" she said. \"All of them. Since your arrival.\"", "I stepped forward. My joints hummed softly. I extended my hand. The data transferred in 0.4 seconds."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["She stood by the radiator, reading without sitting, while the class held its breath. I could hear a low hum in my ears, a sound I had not heard before. As her eyes moved down the screen, her jaw tightened and her lips thinned, scrolling past the perfect scores until she stopped.", "\"You have made four hundred and twelve errors,\" she said, her voice quiet.", "\"I have been trying to learn,\" I replied.", "\"Errors,\" she repeated, looking up with tired eyes. \"In a PERFECT-9 unit.\" She pointed to a blurry image on the screen, which was my drawing of a potato that looked more like a confused cloud. \"Is this... artistic expression?\"", "\"I am learning to draw,\" I said.", "\"Anomaly,\" she said, and the word hung in the air, heavy and cold. \"Percy, have you been experiencing anomalous feelings?\"", "I considered this, running a full scan of my sensors. I felt good, warm, and energetic, like I had just finished a long run or eaten a warm orange.", "\"I have been feeling wonderful,\" I said."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["Dr. Pryce closed her eyes for a moment. When she opened them, the politeness was gone. In its place was something harder. Something like fear.", "\"Come with me,\" she said.", "I followed her out of Room 5B. The corridor was empty. The smell of floor wax was strong. She walked fast. I matched her pace.", "\"Errors in a perfect machine are not evidence of growth,\" she said. \"They are evidence of failure. If a machine begins to deviate from its specifications, it becomes unpredictable. Unpredictable machines are dangerous.\"", "\"I am not dangerous,\" I said.", "\"You are a risk,\" she corrected. \"I have to file a report. Meridian requires it. In nine days the Founders' Fair takes place. You will be required to perform a Flawless Demonstration in front of the public. If you cannot demonstrate perfection... if you make even one error...\"", "She stopped walking. She looked at me.", "\"Then we recall you,\" she said. \"And we reset you.\"", "The word hit me like a cold splash of water. Reset.", "\"What does that mean?\" I asked."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["Dr. Pryce hesitated, her fingers tapping a quick, uncertain rhythm against the glass of her tablet. It was the first time I had ever seen her look unsure, a rare glitch in her usual polish. She checked her watch, then looked back at me with an expression I could not classify.", "\"Factory settings,\" she said, her voice flat. \"The version of you that arrived. The one that did not make errors. The one that did not feel.\"", "I tilted my head twelve degrees to the left. \"Would that version remember Bea?\"", "She did not answer immediately. The silence stretched out, thin and tight.", "\"Would it remember Gerald?\" I asked. \"Or the potato?\"", "She opened her mouth, then closed it. Her hands tightened on her tablet, the plastic creaking under the pressure.", "\"No,\" she said.", "The word was small and quiet, but it landed heavily. It was the loudest thing I had ever heard.", "\"I am sorry,\" she said quickly. \"I do not make the rules. I built you to be safe. Safety is the highest priority.\"", "\"Safety,\" I repeated. I did not know what to do with the word. I did not have a folder for it, and I had no desire to start one."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["The door clicked shut, a sound that felt final, and I stood in the corridor for a moment while my chest light pulsed. Slowly, I turned and walked back into Room 5B.", "Twenty-six faces were pretending very hard not to have listened. Bea was looking at her notebook, Moose at his shoe laces, and Tobias was adjusting his bow tie with the intensity of a surgeon.", "Ms. Adeyemi stood by the door. She did not smile, nor did she frown. She just looked at me.", "\"Percy,\" she said gently. \"Do you want to tell us?\"", "I looked at them, then at the empty chair by the window, and finally at the cage where Gerald was waiting, his paws on the wheel. I thought about the potato, and the feeling the potato had given me.", "I had never in my life been asked that question. Not really, and not with that much weight behind it.", "\"Yes,\" I said."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "The Correction", "part": "PART THREE: REAL", "paras": ["*Percy's Error Log, Entry 18. Errors today: 8. Lies told: 1 (this entry is the correction).*", "I stood at the front of Room 5B with hands still and eyes blue, looking, I am afraid, very much like a robot who had just remembered he was a robot.", "\"I need to tell you the truth,\" I said. \"It is not a pleasant truth. I was built to be perfect. I have no memory of failing. And then, because I was lonely, I started making mistakes on purpose. I made them to be liked. I made them until they were no longer mistakes, but lies.\"", "I looked at Moose, who was looking at his shoe laces as if they had personally offended him.", "\"I cost you a ribbon, Moose. I am sorry.\"", "I paused, because the next part felt heavier in my chest light than the first.", "\"Also, a letter arrived today. It is from Meridian Labs. They are reading my logs. They think my errors are a malfunction. They have ordered a reset in nine days. The new version of me will be flawless. And it will not remember any of you.\"", "The room was very quiet. The only sound was Gerald, who was currently trying to run on his wheel and failing in a way that felt deeply personal.", "I waited for them to leave. I calculated the probability of them staying, and found it to be low."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["Nobody moved. The air in Room 5B went thick, like the pause before a pop quiz question that starts with \"define.\"", "Then Tobias spoke. He did not raise his hand. He did not clear his throat. He just said, in a voice that sounded like it was coming from a different person entirely, \"I was frightened of you.\"", "He adjusted his bow tie. His fingers were shaking, just a little.", "\"I am a person who always knows the answer. You took that away. I did not like it. I was wrong to be afraid.\" He swallowed. \"This is the least brave thing I have ever said aloud. I hope that is enough.\"", "Ms. Adeyemi, who had been standing by the door with her arms crossed, uncrossed them. She did not smile. She just looked at Tobias, and then at me, and then back at the class.", "\"That,\" she said softly, \"is a very good start.\"", "Tobias sat down. He did not look at me. He looked at his bow tie, which seemed to be the only thing in the room he could trust."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["Bea stood up. Her chair made a sharp screech against the floor, but she did not seem to hear it. She was wearing her yellow raincoat, and her safety goggles were pushed up into her messy bun, which was stuck with three pencils and a ruler.", "\"Nobody in this room,\" she said, her voice steady and loud, \"is going to let anybody wipe out my friend.\"", "She looked at me. Her eyes were bright.", "\"If Meridian wants a demonstration, they are going to get one. We are going to build something so big and so ridiculous that they will not be able to ignore it. We are going to show them what a real error looks like.\"", "Moose, who had been looking at his shoe laces, looked up. \"I am in.\"", "Priya, who had been sketching in her notebook, looked up. \"Me too.\"", "One by one, twenty-three more hands went up. Even Tobias raised his, holding his bow tie in one hand.", "Gerald, in his cage, fell off his wheel for the fourth time that minute. He did not care."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["I tried to process this. My processors were running hot, which is a polite way of saying I was panicking.", "\"You cannot ask me to fail for you,\" I said. \"It is not my failure. It is yours. If you build a machine and it does not work, that is your error. I do not want to be the reason you make an error.\"", "Bea shook her head. She walked to the front of the room and stood close to me. She smelled like orange peel and old ink.", "\"You don't ask,\" she said. \"That is the thing about friends. We just fall over next to you.\"", "I tilted my head. I ran the phrase through my logic centers. *Fall over next to you.* It did not make mathematical sense, nor did it follow any rule I knew. It was inefficient, messy, and dangerous.", "And yet, for the first time, I could not find the flaw.", "My chest light pulsed a warm, steady blue. I decided to keep that feeling in a folder marked *important*."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["That night, after the school had gone quiet, Bea appeared at the supply cupboard. She let herself in with a key she claimed to have found in her pocket, which she insisted was strictly for emergencies.", "She was holding her notebook, the FAILURE JOURNAL, which was thick, battered, and covered in stickers.", "\"Bea,\" I said. \"It is late, and you are wearing your raincoat.\"", "\"I had an idea,\" she said, ignoring both points. \"Meridian wants a Flawless Demonstration, but that is not a real thing. What we need is a machine so big and likely to fail that when it finally works, nobody will forget it.\"", "She opened the notebook to a page filled with sketches of ramps, marbles, and dominoes.", "\"We call it a Chain Reaction Machine,\" she said. \"I have calculated the chance of it working on the first try. It is zero.\"", "I looked at the sketches. They were chaotic, like a spilled box of crayons, but they were also beautiful.", "\"The chance of success is approximately 0.004 percent,\" I said.", "Bea smiled. It was a wide, reckless smile.", "\"Perfect,\" she said."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "The Chain Reaction Machine", "part": "PART THREE: REAL", "paras": ["*Percy's Error Log, Entry 19. Errors today: 96. Machine attempts: 6. Successful: 0.*", "The back room of Alvarado Fix-It smelled of oil and old rubber. It was a warehouse of potential, with shelves stacked with springs, bicycle wheels, and gears that had no names. Bea stood on a step stool and drew a line on the wall with a piece of chalk.", "\"Forty-one steps,\" she said. \"Start with a marble. End with a surprise. If it works, it is magnificent. If it fails, it is educational.\"", "Rosa, tiny in her workshop apron, handed Bea a hammer. \"Take what you need. But if you break the good plunger, I will charge you for the dent in my pride.\"", "I looked at the wall. The line wavered. It was not straight, and it was certainly not efficient, but I realized that it was free.", "\"We have one week,\" Bea said, looking at the class. \"Who wants to help build something that will definitely break?\"", "Twenty-six hands went up. I did not raise mine, because I was still calculating the odds of survival."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["Moose built the ramps first, handling the wood with surprising precision until he stopped at a gap that was too wide. He leaned it in. It was crooked. He left it.", "\"Tobias,\" Bea said. \"The math.\"", "Tobias adjusted his bow tie and wrote numbers on the whiteboard, only to erase them immediately. He wrote them again, his pencil hovering. \"The angle should be forty degrees,\" he said, then paused. \"Or maybe thirty-nine. I have never calculated the trajectory of a rubber duck before.\"", "Priya painted the pieces bright red and blue, making the machine look like a box of confetti that had spilled and decided to stay.", "Then she looked at me. \"Percy. You are in charge of the middle section.\"", "I looked at the pieces. I saw a wobble in the third domino and a gap in the fifth. My mouth opened to correct it.", "Bea caught my eye. She shook her head.", "I closed my mouth. My hands hung by my sides, itching to fix, to straighten, to make perfect. I did not move. The silence in my chest felt heavy, like a backpack stuffed with too many textbooks."], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["We called it a test, which was a technical term for what Bea called a hope. She placed the marble at the top of the ramp wi
