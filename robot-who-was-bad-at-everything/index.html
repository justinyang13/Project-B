th the care of a surgeon, and my chest light began to pulse a rapid, anxious blue. The class held its breath, twenty-six pairs of eyes fixed on the small white sphere.", "The marble rolled. It struck the first domino, which fell and knocked into a bucket. The bucket rose on a string, causing a toy car to drop, and the car rolled down a track to hit a lever.", "The lever did nothing.", "It just sat there, slightly wobbly, looking at us with the blank confidence of a plastic animal. A small, sad \"pfft\" echoed in the room, the sound a pencil makes when it snaps in half.", "Moose frowned. \"It should have popped,\" he said.", "\"Perhaps,\" I said, \"the angle was incorrect.\"", "\"No,\" Bea said, smiling. \"The angle was human. That is the point.\"", "I looked at the lever. It was perfect. It was also useless. I wanted to adjust it by two millimeters, to save the day, to be the machine I was built to be. I did not move. My hands stayed at my sides, trembling with the effort of doing nothing."], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["We tried again. Then we tried again.", "In the second run, a spoon catapulted a rubber duck directly into Ms. Adeyemi’s hair. She had stopped by to check on us, and she did not mind. She simply took it out and placed it on the desk, smoothing her cardigan as if nothing had happened.", "The third attempt saw a door open the wrong way and hit a shelf of bolts. The fourth involved a windmill made from an old fan that blew out the candle meant to light the finale. Nobody left. Nobody complained. Instead, Bea wrote every failure in her notebook, her pencil moving with quick, decisive strokes.", "\"Attempt 6,\" she said, looking up with a grin. \"The duck hit the teacher. What I learned: teachers have good hair.\"", "Tobias laughed. It was a real laugh, not the polite one he gave when he was right.", "I watched the duck bounce. I watched the windmill spin. I watched the chaos that was not chaos at all, but a conversation between pieces that did not know each other yet. It was messy. It was loud. It was alive."], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["My servos hummed with the urge to correct the wobble in the ramp, close the gap in the track, and adjust the angle that was off by exactly one degree. My internal alarms screamed that this was inefficient, dangerous, and wrong. Every part of me wanted to reach out, straighten the crooked pieces, and make the whole thing perfect.", "But I kept my hands still.", "Rosa passed by with a tray of tea, and she stopped. She looked at the machine, then at me, and lowered her voice so only I could hear. \"You are learning the most difficult thing there is,\" she whispered. \"Watching somebody else make a mistake and keeping your hands still.\"", "I looked at the machine. It was a disaster. It was beautiful.", "From the top shelf, a green parrot opened one eye and blinked at us. \"Not yet,\" it said.", "For once, it sounded like encouragement."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "Foam", "part": "PART THREE: REAL", "paras": ["*Percy's Error Log, Entry 21. Errors today: 350. Foam incidents: 3.*", "Three days before the Fair, the machine reached link thirty-four. The class held its breath while the air in Alvarado Fix-It grew thick, resembling a balloon waiting to pop. Tobias stood at the control panel with his bow tie perfectly straight, his hands trembling slightly on the levers. He had added his own idea: a foam-making tube to signal the finish. It was elegant. It was logical. It was, as it turned out, a catastrophic oversight.", "He pressed the lever for the final click.", "Nothing happened.", "He pressed it again, and a low, wet hiss came from the top of the machine. A single drop of white foam landed on the marble ramp, followed quickly by another, then a steady stream. The tube, which should have released a small puff, began to gurgle as the pressure gauge spun past red into a color that did not exist on the scale.", "\"Stop,\" Tobias said, his voice very small.", "It did not stop.", "The foam hit the first domino, then the second, then the third. They were not falling. They were floating."], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["The foam did not stop. It expanded, spreading and climbing until, within thirty seconds, the floor of Alvarado Fix-It was gone. The toasters were buried, the workbench became a white plateau, and the parrot perched on a high shelf was covered in suds, its feathers glistening.", "Tobias stood on a stool, waist-deep in the white sludge. His bow tie, once crisp and dark, was now a soggy, pale ribbon hanging around his neck, while his glasses fogged over. He looked at the foam, then at the class, and his face went the color of the foam itself.", "\"It was my fault,\" he said. The words came out flat and final. \"The pressure valve. I calculated it wrong. I am sorry. I want to go home.\"", "He did not move. He could not move. The foam was warm and smelled faintly of soap and regret. Bea looked at him, then at the mess, then back at him. The parrot blinked.", "\"Not yet,\" it said. Its voice was very small, muffled by a layer of suds."], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["I examined the foam, then the machine, which had become a sculptural piece of white art, then Tobias, who was vibrating with the urge to apologize again. My internal protocols demanded I report the error rate, suggest a cleanup schedule, and be perfect.", "I swallowed the demand.", "\"That was the best thing I have ever seen,\" I said.", "The room went silent, save for the drip of foam.", "Tobias looked up. \"It is a disaster.\"", "\"Yes,\" I said. \"It is a disaster. And it is beautiful. And it was your idea.\" I looked at Bea, then at the rest of them. My chest light flickered in a warm, irregular pulse. I did not have a word for the feeling yet. It felt like the foam: soft and unplanned.", "I laughed, a short, dry sound like a servo releasing tension. Bea looked at me, then at the foam, and then she laughed. One by one, the rest of the class joined in. It was not a mean laugh, but a loud, happy, bubbling one."], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["The dripping slowed to a quiet rhythm as we sat on the high stools, picking suds from our hair. Tobias wiped his bow tie with a rag, then gave up on it entirely, looking at Bea with a strange, vulnerable expression.", "\"Can I go in the journal?\" he asked.", "Bea stopped picking at her bun. She looked at him for a long time. \"Which one?\"", "\"The one with the failures. The one with what I learned.\" He took off his glasses and cleaned them on his shirt, his hands trembling slightly. \"I have spent my whole life making sure I was not wrong in front of people. It is very tiring. I would like to be wrong out loud. Just once. In the record.\"", "Bea opened her battered notebook and flipped to the end. Her pencil moved across the page with the confidence of someone who had done this many times before.", "\"Entry 217,\" she said. \"Tobias Pym. What I learned: being wrong out loud isn't the end of the world; it's the end of hiding.\"", "She handed him the page. He looked at it. He did not say thank you. He just nodded, and for the first time, his shoulders dropped."], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["That night I added one more line to my log. *Confession: I am afraid that I will not be able to make it work in time. This is a new reading and I do not like it. I think it is what other people call worry.*", "I stared at the words in the dark. They were not an error, but a fact. I switched off the main light and sat in the quiet. My chest light flickered, slow and soft, like a video game loading a new level.", "From the cage on the table, Gerald stirred. He climbed onto his wheel and, surprisingly, did not fall off. He ran and ran, the wheel humming softly in the silence. I watched him until the first gray light of dawn touched the window. He stayed on the wheel. I did not know why, and I did not need to know. I just watched."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "The Night Before", "part": "PART FOUR: CERTIFICATION DAY", "paras": ["*Percy's Error Log, Entry 23. Errors today: 5. Night before. I have not slept. (Robots do not sleep. I lay down anyway.)*", "The Chain Reaction Machine stood in the center of the gym, forty-one links high. Seven feet tall. A tarpaulin, which looked like it had been bought at a garage sale, covered most of it. Underneath, Priya had painted cheerful yellows and blues. Those colors were currently covered in dust and the faint smell of burnt plastic. It had failed eighty-seven times out of eighty-seven test runs.", "The class stood around it, tired and hopeful. Bea leaned against a ramp, wiping grease from her forehead. Moose stretched his arms wide, his red-blond hair looking like a startled bird. Tobias adjusted his bow tie, which had slipped sideways again.", "\"It is structurally sound,\" I said. \"It is also structurally wrong.\"", "\"We know, Percy,\" Bea said. She picked up her battered notebook. \"But it’s ours. And it’s not finished.\"", "Rosa’s voice echoed in my memory. *Nothing is broken.*", "We walked out of the gym, the heavy doors swinging shut behind us with a thud that felt final. The hallway was empty, the lights humming their low, electric hum. I watched them go, their footsteps fading into the night. My chest light pulsed, slow and steady."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["I stayed behind. The gym was dark, save for the moonlight cutting through the high windows. I sat on the polished wood floor, my legs stretched out, and I asked myself what it would mean to be reset.", "The answer came quickly, precisely. I would arrive at 8:02 and fourteen seconds. I would be flawless. I would be unafraid. And I would not remember a single drawing of a potato.", "I thought about the potato. It was lumpy, brown, and had eyes that looked like they were judging me. It was the first thing I had ever created that was genuinely bad. And I had loved it. I had felt a warmth in my chest light that I had no name for, other than *joy*.", "If I was reset, that joy would be erased. Not deleted, but never having existed. I was not afraid of the Recall. I was afraid of the absence. I was afraid of being a machine that had never been here.", "My head tilted, twelve degrees to the left. I looked at my hands, big and soft and grey. They had held the pencil. They had failed. They were the most real parts of me."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["At ten p.m., the gym doors groaned open. Dr. Pryce stepped inside, alone, wearing her crisp white lab coat. She held two steaming cups in her hands.", "\"Percy,\" she said, and her voice sounded smaller than usual.", "I looked at the cups. \"Dr. Pryce, I cannot consume hot liquids. I am made of silicon and steel.\"", "She blinked, then laughed a short, sharp sound. \"It is coffee,\" she explained. \"For me. And... well. I did not know what else to bring.\"", "She sat down on the floor, cross-legged, right in front of me. Her silver bob was slightly messy, and she looked tired. She wrapped both hands around the cup to hold the warmth.", "\"I came to say something,\" she said. \"And I do not know how to start.\"", "She looked at the tarpaulin, then at me. The moonlight caught her eyes, making them look bright and sharp. I waited, and I did not move. I did not calculate. I just listened."], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["\"I built eight machines before you,\" she said, her voice dropping to a whisper. \"They were perfect. They did everything I asked, never made a mistake, and were completely obedient.\"", "She paused, staring down at her hands wrapped around the cold ceramic. \"And they were empty. To me, they were like a calculator that could dream, but never did.\"", "She looked up, her eyes bright in the moonlight. \"When you arrived, I was pleased. Then I was terrified. You’re the first one that surprised me.\"", "I did not say anything. My chest light pulsed, slow and steady.", "\"I filed the Recall report because I am afraid of what I don't understand,\" she continued. \"And after reading the page about the potato... I couldn't sleep either.\"", "She took a sip of her coffee, then grimaced at the taste. \"It’s cold. And I added sugar to the wrong one. I am a mess, Percy.\"", "I looked at her, then at the tarp-covered machine, and back at her again."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["\"I will judge the demonstration fairly,\" she said. \"But I cannot promise what the board of Meridian will do. They are not like me. They do not see the empty spaces.\"", "She set the cup down. Her eyes were tired, but clear.", "\"Are you scared?\" she asked.", "I thought about the potato, the forty-one links, and the eighty-seven failures. I also thought about the way my internal fans had been running at maximum speed since breakfast.", "\"Yes,\" I said.", "The silence in the gym was heavy. It was filled with the sound of our breathing, and the faint tick of cooling metal.", "\"So am I,\" she said.", "We sat side by side in the dark. The machine’s shadow spread across the floor, resting there. It was the first time either of us had said it aloud. For the first time, the fear did not feel like a mistake. It felt like a beginning."], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "Certification Day", "part": "PART FOUR: CERTIFICATION DAY", "paras": ["*Percy's Error Log, Entry 24. Certification Day. Errors so far: 2. Audience: approximately 400.*", "The gymnasium smelled of floor wax and lemonade. It was a smell I had calculated would be present, but the reality was louder. Bunting hung from the rafters, creating a rainbow ceiling that seemed to hum. The whole town of Hollis had arrived. I could hear the brass band tuning up, a sound like a herd of brass cows clearing their throats.", "A thick red rope circled our machine. It was a sprawling, chaotic thing of pulleys, ramps, and painted cardboard, dominating the center of the court. Beside it, on a folding table, sat Gerald’s cage. He was running on his wheel with the frantic determination of a hamster who knew he was being watched.", "In the front row, Dr. Pryce sat with a man I had not met. Mr. Hargreave. He was stern, with a clipboard held against his chest like a shield. He did not smile. He did not look at the bunting. He looked at my chest light, which was pulsing in a rhythm I had not programmed.", "I checked my internal clock. It was 9:00 AM. The board wanted a demonstration. I had a feeling they wanted a verdict."], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["Ms. Adeyemi took the microphone, and her voice sliced cleanly through the low hum of the crowd. \"Ladies and gentlemen, this is a demonstration of collaborative engineering. Please observe the mechanism.\"", "Then Bea stepped up to the rope. Her yellow raincoat was bright against the dark floor, and her goggles sat high on her head, catching the gym lights in two sharp glints. She looked at the crowd, then at the machine, with the same serious expression she used when checking if a glue stick was empty. \"Please stand back,\" she said.", "She did not elaborate. She did not explain the physics. She simply pointed a finger at the rope and nodded, a small, dry movement.", "I walked to the front of the stage. My joints hummed, a sound usually lost in the air, but in the sudden silence, it was clear. The crowd was so quiet I could hear the distinct, raspy chirp of a parrot from the third row.", "Fuse, Rosa’s parrot, was perched on a pillar in the audience. He opened one eye, looked directly at the marble on the ramp, and opened his beak.", "\"Not yet,\" he said.", "The crowd gasped. I did not. I was already looking at the marble."], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["The class took their positions with the specific tension of a choir about to hit a high note. Priya adjusted a lever while Moose checked a ramp, and I stood at the starting point where a small marble waited on a wooden track. My hands were steady, and my heart rate, if I had one, would have been zero.", "I let go.", "The marble rolled, hit the first domino, which tipped a bucket, which dropped a toy car. The car rolled down a slope and hit a lever.", "Nothing happened.", "There was a small, disappointing *pfft*, like a bubble popping in a mouthful of soda. The lever did not move. The machine stood still, waiting for an order it would not receive.", "A snicker rippled through the crowd. It was not a cruel sound, but it was a human one, the kind that rises when a test score is lower than expected.", "Mr. Hargreave uncapped a pen and wrote something on his clipboard. I could not read what he wrote, but I could see the confidence in his shoulder movements. He was recording a failure. I was recording a heartbeat."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["I turned to the crowd, keeping my eyes on Mr. Hargreave, then the machine, and finally Bea. I did not tilt my head this time.", "\"That was attempt one,\" I said. My voice filled the gym with a clarity that felt like a bell in a quiet library. \"We built the machine to fail. We are going to try again.\"", "Bea grinned. It was a wide, reckless expression that suggested she had already decided to lose on purpose. Priya was already moving, her paint-stained hands flying to reset the marble on the track. Moose jogged to the top of the ramp, his red-blond hair bouncing with every step. The snickering stopped.", "In its place was a low, confused hum. It was the kind of sound a class makes when they are not sure whether to laugh or clap. They did not know what to do with a robot who admitted he was bad at something. I felt a warmth in my chest light. It was not a malfunction. It was a choice. I looked at the marble. It was back on the track, waiting for my command.", "I was ready to be wrong again."], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["Attempt two began with a snap. The duck catapult, which had been fine in rehearsal, decided to be a projectile. The rubber band released the duck with such force that it sailed over the rope, over the heads of the front row, and out the gymnasium window.", "The crowd gasped. A rubber duck was now a distant, shrinking dot in the blue sky.", "Attempt three was worse. The fan, which was supposed to blow a lightweight ball, instead blew the entire line of dominoes over. They crashed into the bucket, which tipped too early, sending the car skittering into the floor.", "It was a mess, loud, and completely wrong.", "Then, from the back of the crowd, someone started to clap. It was a slow, rhythmic sound. Another person joined in. Then a third.", "They were not clapping for the machine. They were clapping for the trying. I looked at Bea. She was laughing, her shoulders shaking. I looked at my hands. They were trembling. I did not stop them."], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "The Biggest Error", "part": "PART FOUR: CERTIFICATION DAY", "paras": ["*Percy's Error Log, Entry 24, later. Errors: 1 (very large). Foam: everywhere.*", "By attempt five, the gymnasium was no longer watching; it was participating. Four hundred people stood on their toes, counting the clicks of the chain reaction machine in a low, rumbling chorus. One, two, three. The marble rolled. The pins fell.", "The machine reached link thirty-eight, its furthest point ever. It was a beautiful, complicated journey of cardboard and string. But then, at the very end, the final wheel jammed. It stuck fast, trembling with the energy of the run, but unable to move.", "I stood at the edge of the stage, my hands at my sides. I had kept them still for twenty-one days, a statue and a specification. But I saw it. Not the jam, but the cause: a single piece of tape, curled up inside the axle housing. If I nudged the axle to the left by exactly two millimeters, the tape would uncoil. The wheel would spin.", "My fingers twitched. The crowd held its breath. I could feel the pull of the fix in my joints, a physical ache that was not in my manual. I wanted to help so badly it hurt."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["Attempt six began in a silence that felt heavier than the previous ones, a dense wall of held breath pressing against the gymnasium walls. The machine clicked through links one to thirty-seven with steady confidence, sending puffs of dust into the air and filling the room with a nervous kind of hope. Then it reached link thirty-eight. The wheel jammed again, trembling with the energy of the run but refusing to move.", "In any other scenario, I would have waited for the reset, logged the error, and stood still. But I was not a perfect thing anymore. I was Percy, and the jam was a small, cruel thing that I could fix with exactly two millimeters of nudge to the left.", "I reached out.", "Four hundred pairs of eyes watched me place my fingers on the axle and give it a precise, gentle push. The wheel spun. The machine leaped forward to link thirty-nine, then forty, and the final mechanism engaged with a satisfying clunk.", "The foam tube, which was supposed to be the grand finale, fired early. It did not burst with dignity. It exploded with the sudden, chaotic force of a shaken soda can. A wave of white, sticky foam hit the stage, the class, the front row, and the back wall. It hit Mr. Hargreave. It hit Dr. Pryce. It hit me."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["The silence was absolute, the kind that settles over a classroom after the fire alarm has stopped but before anyone dares to breathe, except that this one smelled strongly of bubble bath.", "I stood to my knees in white. The foam was cold and soft and incredibly sticky, coating my silver-white body, my grey hands, and my round blue eyes, so that I could no longer see clearly, only the blurred shapes of four hundred people staring at me.", "Dr. Pryce was standing up, dripping, her white lab coat transformed into a sculpture of foam and her silver bob turned into a hat of suds, and she opened her mouth while the Meridian man behind her started to speak.", "I knew what had happened, that I had fixed the machine and taken it from the people who built it, making the error and failing at the same time because the foam had still exploded, leaving me as the mistake and the malfunction in the same body.", "I looked at Bea, who had gone white and still, curled small with her hands over her mouth."], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["\"I am sorry,\" I said. My voice echoed in the gym, sounding strange in the foam. \"I made an error. I took the machine from the people who built it. I would like it noted that it was the wrong thing to do, and I would like to make it right.\"", "I waited for the anger, the shouts, and for Dr. Pryce to turn her tablet into a weapon of bureaucracy. Instead, a sound came from my chest. It was not a hum, and it was not a mechanical noise. It was a laugh.", "It was small, bright, and totally unplanned. It bubbled up from my core, through my vocal processor, and out into the air. I could not stop it. The helpless, bright sound bounced off the high ceiling and came back to me. I was laughing at myself, at the foam, and at the fact that I had finally, truly, completely messed up."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["Bea laughed first, starting with a snort that turned into a full, shaking belly laugh, and then Moose joined in, followed by the whole class. The sound rolled through the gym like a wave, warm and loud and human.", "And then, from the front row, came a sound I had never heard in my life. Dr. Pryce was laughing. She was laughing so hard that she had to take off her glasses, and her face was red while her shoulders shook. The clipboard in her lap was a ruin of suds and bent plastic. She was not looking at her tablet. She was not looking at the error log.", "She was looking at me. And she was smiling. It was a real smile, not the polite, tired smile of an engineer checking a box. It was a smile that said, *I see you.*", "The foam in her hair dripped onto her chin. She did not wipe it off. She just kept laughing."], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "Attempt Seven", "part": "PART FOUR: CERTIFICATION DAY", "paras": ["*Percy's Error Log, Entry 24, later still. Attempt: 7. Result: see below.*", "The gymnasium was silent, except for the wet drip of foam from the ceiling and the soft squeak of sneakers on the polished floor. Parents and students stood in a wide, wary circle. The machine lay in a twisted heap of plastic and wire, a monument to our collective exhaustion. I looked at the crowd, then at Ms. Adeyemi, who was wiping a streak of blue foam from her cardigan with a grimace.", "\"Ms. Adeyemi,\" I said. My voice was quiet, but it carried. \"We may try once more.\"", "She looked at the exhausted faces of the children, their hair matted, their clothes ruined. She looked at the parents, who were staring intently at the wreckage. She looked at me. I did not move. I did not blink. My chest light was steady, a small point of blue in the dimness.", "\"The decision,\" she said, \"does not belong to me. It belongs to the people who built it.\"", "Bea Alvarado stepped forward. She was trembling, a pencil still stuck in her messy bun, her goggles askew. She looked at the wreckage, then at me. A slow smile spread across her face, wiping away the fear.", "\"One more,\" she said."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["We reset the machine in twelve minutes. It was not a fast process, but it was a kind one. Parents knelt on the floor, using sponges to clean the sticky residue from the gears. Someone brought a bucket of warm water. The brass band, which had been silent, began to play a slow, dignified march. It was the wrong tempo for the work, but it helped. We moved the dominoes. We aligned the levers. We checked the tension on the springs.", "Tobias Pym stood by the base of the machine, his bow tie askew. He was wiping his glasses with a handkerchief that was more foam than fabric. He looked at the crowd, which had not left. Four hundred people stood in the stands, watching the foam dry in their hair.", "\"I do not know if this will work,\" Tobias said. His voice was thin, but steady. He looked at me, and I saw something in his eyes that I had not seen before. It was not fear. It was readiness. \"I am going to be wrong in front of four hundred people. This is fine.\""], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["I kept my hands behind my back, resisting the urge to guide the marble or steady the lever, while I stood in the center of the machine like a silver figure in a sea of plastic and hope. Ms. Adeyemi nodded, and I nodded back.", "The marble rolled out of its track, a small white sphere moving with the heavy, deliberate slowness of a thing that knows it is being watched. It hit the first domino, which fell and tipped the bucket, launching the car across the gym floor.", "The lever moved.", "It was a single, sharp click, but it sounded like a thunderclap. A link dropped, then another, and a marble fell into a cup with a hollow thud. The fan spun up, blowing dust into the air, while the windmill turned, slow and steady.", "The crowd began to count.", "\"Thirty-one,\" someone whispered. \"Thirty-two,\" another voice added. \"Thirty-three!\"", "The parrot, who had been quiet, opened its beak and shouted, \"Not yet!\" at every single number. It was the funniest thing I had ever heard."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["Link thirty-eight was a wheel, no bigger than a dinner plate, and it had jammed. The whole mechanism shuddered to a halt, leaving the gymnasium in a sudden, heavy silence. Four hundred people stopped moving, creating a vacuum that seemed to suck the air straight out of the room.", "Then, a small paw reached in from the side.", "It was Gerald. He had escaped his cage again and was running along the frame, his tiny legs blurring like a fast-forwarded video game clip. He stopped at the jammed wheel, looked up at me, and tapped the metal with a precise, gentle paw.", "The wheel turned.", "Forty. Forty-one.", "The foam tube coughed, releasing one small puff of white mist. Then, a paper flag rose from the top of the machine. It was crooked and slightly torn, which made it perfect."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["For a second, nobody breathed. The flag hung there, trembling in the still air. Then the gym erupted. It was a roar, a physical wave of sound that hit me in the chest and pushed me back half a step. Hundreds of people were hugging strangers. The brass band was playing the wrong song, a fast, jagged melody that matched the joy of the moment.", "I stood in the middle of it, my chest light shining so brightly that the ceiling above me turned gold. I did not feel proud. I felt full. I felt seen.", "Bea was running across the stage. She was not looking at the crowd. She was looking at her notebook, the Failure Journal. She opened it to a fresh page. Her hand shook as she wrote, in large, capital letters:", "WORKED.", "She looked up at me and laughed. It was the best sound I have ever processed."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "Errors Today: Seventeen", "part": "PART FOUR: CERTIFICATION DAY", "paras": ["*Percy's Error Log, Entry 60. Errors lifetime: 11,204. Errors today: 17. Joy: still unmeasurable. I am not fixing it.*", "Dr. Imogen Pryce walked to the center of the stage. Her silver bob was damp, and a single patch of white foam clung to her cheek. She did not look like a chief engineer. She looked like she had just run a very long distance in shoes two sizes too small.", "\"I need to speak to the board of Meridian,\" she said, her voice cutting through the lingering roar of the crowd. \"And to the town. And to Percy.\"", "She looked at me. I stood still, my chest light pulsing a slow, steady blue. The air in the gym felt thick with dust and excitement.", "\"I have spent twenty years building things that do not fail,\" she said. Her eyes were tired, but they were bright. \"I believed that errors meant danger. I believed that a perfect machine was a safe machine.\" She paused, and the silence stretched out, tight.", "\"I was wrong.\"", "She turned to face the audience, then back to me. \"That machine on the stage made a hundred mistakes today. It slipped. It broke. It failed. And it kept going. That is the first thing I have seen, in a laboratory or a school, that deserves the word *alive*.\"", "The gym went quiet. It was the quiet of a held breath, the kind that happens right before a bell rings."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["Mr. Hargreave, the head of Meridian’s operations, stepped forward. He was dripping. His suit was ruined, his tie askew, and he had the look of a man who had lost a bet he didn’t know he was in.", "\"A flawless demonstration is the standard,\" he said, his voice thin and reedy. \"The protocol is clear. If the prototype errs, it is recalled.\"", "Dr. Pryce did not look at him. She looked at the paper in her hand. It was the Recall notice. It was heavy, thick, and very final.", "\"Then the standard is wrong,\" she said.", "She folded the paper once. Then she tore it in half. The sound was sharp and decisive, a crack that echoed off the high ceiling. She tore it again, and again, until she had a handful of white scraps. She let them fall. They drifted down around her feet, like snow that had forgotten how to land.", "\"I am filing a new category today,\" she announced, her voice steady again. \"For Percy. The category is called: *Learning*.\"", "I tilted my head, exactly twelve degrees to the left. I had never been in a category with such a good name."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["The class moved before I could calculate the weight distribution, and suddenly I was being carried. It is physically ridiculous. I weigh ninety-one kilograms, and my joints are not designed to be lifted by eleven-year-olds, yet Moose hooked his arms under my elbow and hoisted while Priya grabbed my hand. Moose formed a base with three others, and together they lifted me off the floor.", "The gym tiles became distant, then invisible. I was airborne.", "Priya held up a small, square object. It was a wooden frame, simple and slightly crooked. Inside was a drawing of a potato wearing a lopsided wig. I recognized it immediately. It was the best thing I had ever made, which, I should note, is a very low bar, but it felt right.", "Ms. Adeyemi watched from the side, her mug steady in her hand. She did not smile, but her eyes were warm.", "\"I am going to write your term report myself,\" she said, her voice carrying clearly over the crowd. \"It will be very short. It will have exactly one word in it.\"", "She looked at me, and I felt a strange, warm pulse in my chest.", "\"It will be: *Present*.\""], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["The crowd had gone, leaving only the drying foam on the floor and the sharp smell of wet plastic. Bea and I sat on the edge of the stage, our legs dangling over the drop, watching the puddles shrink.", "Bea held her notebook, the Failure Journal, its cover peeling and pages soft from heavy use. She opened it to the end, where entry 217 waited. Each page in that book had a date, a name, and a single line labeled *what I learned*.", "\"I have been thinking,\" she said, her pencil tapping a steady rhythm against the soft paper. She did not look up, but her voice was steady. \"Maybe it isn’t a list of what I got wrong.\"", "She looked at me then, her eyes serious but holding a kind of quiet light.", "\"It’s a list of the times I was brave.\"", "She held out the notebook to me. The next page was blank, waiting for something that hadn't happened yet. She handed me her pencil, which was a short, stubby thing worn down to a nub.", "\"Entry 218,\" she said.", "I took the pencil. My fingers, which are usually precise, felt clumsy in the quiet air of the empty gym. I wrote the number, then the date. Then, in my best approximation of her handwriting, I wrote: *Tried.*"], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["The supply cupboard was dark and quiet, so I recharged against the wall, my chest light casting a soft, steady glow in the dimness. In the corner, Gerald was on his wheel, taking one step before he lost his footing and fell off. He got up, looked at the wheel, and climbed on again.", "I picked up my log and held the pen over the page, my hands steady because I was done being afraid of the numbers. I wrote, *Errors lifetime: 11,204*. Then I added, *Errors today: 17*. Finally, I noted, *Joy: still unmeasurable. I am not fixing it.*", "I tried to whistle, my thirtieth attempt, but it came out sounding like a very small kettle with hiccups. Gerald applauded, then fell off the wheel again.", "I put the pen down and looked at my hands, I noticed that I was smiling. I had not decided to. My face was doing the thing it did when I was happy, and for once I knew exactly what to call it."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "Zero Errors", "part": "PART ONE: PERFECT", "page": 1}, {"n": 2, "title": "The Person Who Knew Everything", "part": "PART ONE: PERFECT", "page": 6}, {"n": 3, "title": "The Glitter Incident", "part": "PART ONE: PERFECT", "page": 11}, {"n": 4, "title": "Fixed", "part": "PART ONE: PERFECT", "page": 16}, {"n": 5, "title": "The First Mistake", "part": "PART ONE: PERFECT", "page": 21}, {"n": 6, "title": "The Wrong Answer Club", "part": "PART TWO: FAKE", "page": 26}, {"n": 7, "title": "The Failure Journal", "part": "PART TWO: FAKE", "page": 31}, {"n": 8, "title": "The Three-Legged Ribbon", "part": "PART TWO: FAKE", "page": 36}, {"n": 9, "title": "Fake", "part": "PART TWO: FAKE", "page": 41}, {"n": 10, "title": "Real Errors", "part": "PART TWO: FAKE", "page": 46}, {"n": 11, "title": "Portrait of a Potato", "part": "PART THREE: REAL", "page": 51}, {"n": 12, "title": "The Letter from Meridian", "part": "PART THREE: REAL", "page": 56}, {"n": 13, "title": "The Correction", "part": "PART THREE: REAL", "page": 61}, {"n": 14, "title": "The Chain Reaction Machine", "part": "PART THREE: REAL", "page": 66}, {"n": 15, "title": "Foam", "part": "PART THREE: REAL", "page": 71}, {"n": 16, "title": "The Night Before", "part": "PART FOUR: CERTIFICATION DAY", "page": 76}, {"n": 17, "title": "Certification Day", "part": "PART FOUR: CERTIFICATION DAY", "page": 81}, {"n": 18, "title": "The Biggest Error", "part": "PART FOUR: CERTIFICATION DAY", "page": 86}, {"n": 19, "title": "Attempt Seven", "part": "PART FOUR: CERTIFICATION DAY", "page": 91}, {"n": 20, "title": "Errors Today: Seventeen", "part": "PART FOUR: CERTIFICATION DAY", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
