 cold against my legs. I am not a captain, nor a player. I am a girl with an own goal, a statistic, a video.", "I put my head in my hands and wait for the feeling to go away. It does not. It sits in my chest, heavy and warm, like a rock that has been sitting in a pocket for too long."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["Footsteps crunch on the gravel behind me, though I keep my eyes fixed on the yellow paint peeling off the bus bumper. The door creaks open, flooding the entryway with the sharp, bitter scent of strong tea, probably Earl Grey or something even worse.", "\"Rafael’s daughter,\" a voice says. Calm. Flat.", "I lift my head to find Coach Gin standing there in her fluorescent windbreaker, holding two mugs. She hands me the ceramic one, which burns my fingers until I have to hold it like a slice of toast left too long on the stove. Then she simply says, \"Sit.\"", "She climbs the steps and lowers herself onto the edge of the doorway next to me. Her knees knock against the wheel well before she takes a sip and immediately spits it out.", "\"Too strong,\" I manage to say.", "\"Good. It wakes you up.\"", "She looks out at the empty lot, her silver braid swinging slightly as she turns her head. \"I drove a school bus for thirty-eight years,\" she tells me. \"Forty-one kids most mornings. Screaming. Throwing up. Dropping their lunch on the seat. Nobody ever asked me for the score. Nobody ever asked if I had won.\"", "She sips again, and this time she doesn't flinch. \"I lost things I loved. My husband. My job. My youth. None of them were games. But they hurt just the same.\""], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["I drink the tea. It tastes like dirt and lemon, which is terrible, and also perfect. \"I don't know who I am without a win,\" I say. My voice sounds small, like it is coming from someone else.", "Gin nods without looking at me. She stares at the bus key on her lanyard instead. \"That is the most honest sentence you have said all season,\" she says. \"Now we know what we are working on.\"", "She holds out her palm without a word. I dig into my sock and find the card, soft and curved from three weeks against my ankle bone, and I hand it over. She reads the front. On the front, in my shaky handwriting, is one word: captain. The back is blank.", "\"What did you do well against the Hawks?\" she asks.", "\"Nothing,\" I say.", "\"Try again,\" she says.", "I stare at the card, and the word captain looks back at me like it is mocking me. I feel my face heat up, and I want to put my head back in my hands and disappear."], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["The sky goes dark, and the streetlights buzz on with a sound like a mosquito trapped in a jar. They look ugly at this hour. Like broken teeth.", "My mind wanders to the Hawks, then the field, then Tank. He is huge, but he is always exactly where he needs to be.", "\"I saw where Tank was going to be,\" I say. My voice is quiet. Steady. \"I was already on the ball. I just didn't pass.\"", "Gin makes a low sound in her throat. \"Mm.\"", "\"I see the field before it happens,\" I say, the words tumbling out fast like marbles from a jar. \"I always have. I just never counted it because it doesn't show up on the board.\"", "I look down at the card. It is still white and blank, but it feels different now, like a heavy door waiting to be pushed open. I can almost hear the handle turn.", "My fingers find my pencil in my pocket. It is short, worn down to a tiny nub, just like my eraser when I was in fourth grade. I unscrew the cap and reveal the sharp, black lead."], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["The pencil scratches against the paper with a sound like a mouse sprinting across a shingled roof. I look down at what I just wrote. The words are small, but they hold weight.", "I read the sentence twice. Then a third time. It is true. It belongs to me, not the scoreboard. It doesn't care about Carter Boyle’s video or the crowd’s silence. It is just me, the field, and the empty space between the players.", "I fold the card up tight and tuck it into my sock, where it settles warm and solid against my ankle. It feels like a secret kept safe in a shoe locker.", "Gin taps the door frame with one knuckle. \"It will be there,\" she says, nodding toward the bench, three miles away. \"But first, you owe somebody an apology. And it isn’t me.\"", "She stands up, places her steel mug back in the bus cupholder, and looks down at me. Her eyes are sharp, but they are soft underneath.", "\"Go home, Dani,\" she says. \"Eat something. And fix what you broke.\"", "I nod, my legs shaking a little, though they are still my own. I climb down the steps into the cold night air."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "Sorry Is Not a Text", "part": "PART FOUR: THE OTHER KIND OF CONFIDENCE", "paras": ["*Way to Lose #43: Say you're sorry in a text.*", "The phone screen glows, bright and accusatory. I type: *I am so sorry Priya I was a jerk because I was having a nervous breakdown.* I delete it. I type: *My bad.* I delete that. It sounds like a guy who just crashed his car into a fence. I stare at the blinking cursor, a tiny digital heartbeat judging me.", "I grab the bag Ollie left on my desk. He gave me two bags of orange slices, which is suspiciously generous for a kid who usually hoards them. \"For the apology,\" he had said, grinning with his mouth full. \"They help with the talking.\"", "I put on my cleats. The left lace is green, the right is orange. They match my mood, which is currently a tangled knot. I ride my bike to Priya’s house, the wind hitting my face like a cold, honest slap. The street is quiet. Her yellow windbreaker hangs on the porch hook, empty.", "I knock. The door opens. It is not Priya. It is her mother, who looks at me with eyes that see everything, including the orange slices in my hand and the fact that I have nowhere to be.", "\"Go to the back,\" she says, stepping aside. \"She is in the yard.\""], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["Priya is in the backyard, throwing a tennis ball against the garage door. *Thwack. Catch. Thwack. Catch.* Her eyes are wide open, which is a new development, because usually the ball is a scary moving object and her eyes are closed, praying for a miracle.", "I stand by the fence, feeling like I am about to confess a crime I haven’t committed yet.", "\"Priya,\" I say.", "She stops. The ball hangs in her oversized glove, looking like a tiny orange planet in a white orbit. She turns, her glasses sliding down her nose.", "\"I said something mean,\" I start, then stop. My throat feels like it is filled with gravel. \"I said you were the reason we lost. And I said you should have caught that ball.\"", "I take a breath. The air tastes like autumn and regret.", "\"I was scared,\" I say, my voice coming out smaller than I want it to. \"I was scared of losing again. And I took it out on you. It was about me, not you. I am sorry.\"", "I don’t wait for a speech. I just stand there, hands in my pockets, waiting to be yelled at or ignored. The silence stretches, thin and taut."], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["Priya stares at the dirt, kicking a pebble into the soil with her cleat.", "\"I knew you were scared,\" she says, her voice steady despite the silence between us. \"You always get loud when you're afraid, like a car engine revving too high in a school parking lot.\"", "I don't have a response for that specific comparison, so I just nod, feeling the gravel in my throat settle.", "\"You were right about the goals,\" she continues, pulling one of her oversized gloves off. \"We let too many in. I should be better. I know I should be better.\" She looks up, her eyes sharp and clear behind her sports band. \"But you were wrong about who they belonged to. They aren't just my failures. They are ours.\"", "She tucks the glove under her arm. \"My true thing isn't just angles. It is this: Even when I let one in, I stay.\"", "My legs give out, so I sit down on the grass, the cool dampness seeping through my shorts and chilling my skin. Priya sits next to me, close enough that our shoulders touch and I can feel the warmth of her jersey.", "\"I stayed,\" she says, looking at the fence. \"Because of the team. And because of you, Dani. Even when you were being a mess.\""], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["We sit there for a minute, breathing the same air. Then Priya picks up the tennis ball.", "\"Watch,\" she says.", "She throws it at the garage door, but not straight. She angles it so it bounces off the siding and comes back to her hand. Then she throws it at a slant, hitting the corner of the door. It ricochets perfectly into her glove.", "\"It’s a map,\" she says. \"The field is not just grass. It is a map of slopes and angles. The ball wants to go certain ways. We just have to tell it where.\"", "I pull out my red notebook. For the first time, I don't write a way to lose. I draw an arrow. Then another. Priya leans over, her hair brushing my arm, and adds a little note in the corner of the page.", "It is not a loss anymore. It is a strategy."], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["My phone buzzes in my pocket, but I ignore it completely. Instead, I hear the low, steady rumble of my dad’s truck idling in the driveway, a sound that usually means he’s been waiting. Through the kitchen window, I can see his silhouette against the gray morning light. He’s still wearing his mechanic’s shirt, one hand resting on the wheel while he waits for me to finish my thoughts.", "I climb into the passenger seat, and the familiar scent of motor oil and stale coffee immediately wraps around me. It smells like the inside of a garage on a hot day, thick and warm.", "\"Dad,\" I say, my voice sounding smaller than I want it to. \"I have been afraid for a long time.\"", "He turns to look at me. His eyes are tired, dark circles under them, but they are steady and calm.", "\"That people only like me when I win,\" I finish, the words sticking in my throat. \"That I am only good when the scoreboard says so.\"", "He grips the steering wheel, and his knuckles turn white against the plastic. For a second, he says nothing, just watching the road ahead. Then he exhales, a long, rough sound that rumbles through the cab.", "\"I liked you when you were three,\" he says finally. \"You couldn't kick a ball. You kicked your own shoe. I still do.\"", "He doesn't say anything else. He puts the truck in gear, and the engine hums to life. It is exactly enough."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "The Hens' Own Plan", "part": "PART FOUR: THE OTHER KIND OF CONFIDENCE", "paras": ["*Way to Lose #45: Try to be somebody else's team.*", "The yellow bus hums, a low vibration that travels up through the vinyl seats and into my bones. The windows are down, letting in the smell of diesel and the sharp, green scent of the depot grass. I am sitting in the middle row. I am not wearing the yellow armband. It sits on the seat next to me, folded neatly like a piece of toast.", "Coach Gin stands at the front, holding a whiteboard marker like a sword. \"Dani,\" she says, not looking up from her notes. \"You are here. That is good. But the armband is not mine to give out. It belongs to the team. So we will decide.\"", "The team is silent. Priya’s hands are in her lap. Tank looks at his shoes. Josie opens her mouth, then closes it.", "\"Vote,\" Gin says. \"Socks. One sock, one vote. Throw them into the bin.\"", "Nobody moves. Then, one by one, they toss their socks into the plastic bin. They land in a soft, white pile. The armband is placed on the pile. It is back on my arm, but this time, it feels heavier. It feels earned."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["Gin writes the word GOOD on the whiteboard in big, block letters, then taps it with the marker to get our attention.", "\"Everyone,\" she says, her voice flat and steady, \"tell me what you are good at. Not what you want to be. What you actually do.\"", "Tank clears his throat, which sounds like a truck shifting gears. \"Standing in the right place,\" he says quietly. \"Most of the time.\"", "Josie raises her hand so fast it blurs. \"Seeing what's happening and saying it out loud so everyone knows.\"", "Leo and Mateo speak at the same time, their voices merging into one loud echo. \"Making noise on the left.\"", "Ahmed shrugs, looking bored by his own greatness. \"Going fast. And, apparently, passing.\"", "Priya looks down at her oversized gloves, fiddling with the velcro. \"Angles,\" she whispers, barely audible. \"I see where they are going.\"", "Ollie grins, holding up an orange slice he has been saving. \"Everybody else. I keep everyone happy.\"", "They all look at me. The marker squeaks against the whiteboard. I take the pen from Gin and write the last word, my hand steady for once. \"Seeing where it's going.\"", "The board is full now. It is not a list of skills. It is a map."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["The plan is simple. We do not fight the slope. We use it.", "\"The field slants left,\" Gin says, drawing a line on the board. \"So we push the ball to the left, let the slope carry it, and we wait for it to come back.\"", "Ahmed stays high and fast, ready to chase. The twins hold the left side, using a hand signal to switch positions. Priya calls the angles from her net, her voice clear and calm. Josie’s commentary is now a job title: Voice. She narrates the flow, keeping us honest.", "Ollie will come on for the last ten minutes. He brings orange slices. He brings energy. He is the secret weapon we did not know we needed.", "It is not fancy. It is not pretty. It is exactly what we are."], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["We practice until the sun drops low and the shadows stretch long across the grass. The first attempt is a disaster. The ball rolls left, straight into the duck pond. A single mallard floats by, staring at the sunken ball with the expression of a principal watching a student chew gum in class.", "Gin takes a sip from her thermos. \"Excellent data,\" she says.", "The third attempt is better. We pass the ball through four players. Ahmed makes a pass that is not fast, but it is there. The ball hits the post and bounces back into the net.", "Nobody cheers. We do not run and hug. We just look at each other. There is a quiet understanding in the air. We did not win a game. We did something harder. We played together."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["The sun is dropping behind the hills, painting the sky in shades of bruised purple and orange. The air feels cool against my scraped knees, a nice change from the heavy heat of the practice field. My legs ache, but it is the good kind of pain, the kind that means I actually did something with them today. I have had a whole afternoon behind me, and for the first time in forever, I do not have a single stat to worry about.", "I stop at the corner of Maple and 4th Street and check my sock. The card is there. It is just a card. It does not need to be anything else. It is not a trophy, and it is not a promise. It is just a piece of paper with my name on it, tucked safely away where the scoreboard cannot reach.", "Saturday is coming. The Northgate Wolves are coming. They are loud, they are polished, and they have never lost a game. But I am not afraid. Whatever the score ends up being, it cannot take the card out of my sock. It cannot change the fact that I am Dani Ruiz, I am the captain, and I am good."], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "Northgate Week", "part": "PART FOUR: THE OTHER KIND OF CONFIDENCE", "paras": ["*Way to Lose #47: Meet the other team's star and decide to hate him.*", "The Northgate Wolves arrive in a bus that has a bathroom. I know because I counted the windows, and one of them has a small sign that says Restroom, which is an insult to my bladder. They step out in matching white and blue uniforms, polished so they shine. They look like a commercial for a toothpaste.", "Josie is standing on the sidelines with her clipboard. She reads their stats aloud. \"Kai Brandt, twelve goals, three assists, zero fouls. Their keeper has a 98% save percentage. Their midfield averages 4.2 passes per minute.\"", "Tank puts his hand over her mouth. \"Josie,\" he whispers. \"Could you read something a little less loud? My ears are ringing.\"", "Josie pulls his hand away. \"It is just data, Tank. Data is neutral. Data does not have a volume knob.\"", "Coach Gin walks up to the bus. She looks at the vehicle, then at the polished shoes of the first Wolf to step off. She takes a sip from her steel thermos.", "\"Nice bus,\" she says. Her voice is flat. She does not sound impressed. Nor afraid. She sounds like she is commenting on the weather.", "The Wolves do not know how to handle a coach who is not intimidated. They just stand there, holding their sticks, looking very confused. I feel a weird little spark in my chest. It is not fear. It is something else. I do not have a name for it yet."], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["I go to the Dugout Diner to think. The milkshakes here are thick enough to stand a spoon in, provided the spoon is very strong and very desperate. I sit in a booth with cracked vinyl seats and try to work out what I am feeling. It is not excitement, and it is not dread. It is a tightness in my throat, like I swallowed a marble.", "A boy sits in the booth next to me. He wears a white and blue warm-up top, spotless, with a plain hamburger in front of him. No fries, no ketchup, just meat and bun. He looks like a person who has been told exactly what to eat, and when, and how many bites per minute.", "He looks at me. He knows who I am. Everyone knows who I am now, because the video is everywhere. It is on every phone, every laptop, and probably every smart fridge in the county.", "\"Kai Brandt,\" I say, trying to sound tough. I fail.", "He shrugs. \"I watched the own goal,\" he says, his voice quiet. \"I have done that. In fifth grade. Nobody filmed it. Lucky.\""], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["We talk for twenty minutes, and I have absolutely no idea how to stop the conversation. He tells me about his dad, Coach Brandt, who is not exactly a villain but is certainly a man with a clipboard and a voice loud enough to rattle the diner windows.", "\"Every game,\" Kai says, picking at a single crumb on the table. \"Every single one. If we win, it is because I executed the plan. If we lose, I have to explain why I did not.\"", "He looks down at his plain hamburger. \"I have not had a game in two years that I did not have to explain at dinner. My mom asks, 'Did you hold the line, Kai?' And I have to say yes. Even if I did not.\"", "I look at him. He looks tired, the kind of tired that comes from holding your breath for a long time. His eyes are dark, and he keeps rubbing the spot on his wrist where his watch used to be.", "\"You guys look like you are having fun,\" he says. He looks at me like I have just told him that gravity works differently on Earth, or that homework is optional on Tuesdays.", "\"We are,\" I say.", "He nods. He does not believe me, but he does not argue, which I guess is a start."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["The door slams open with a bang that makes the coffee in my cup jump. A man steps in. He wears a white polo shirt and dark pants, a whistle dangling around his neck. His face looks like it has never smiled in public. His eyes scan the room and lock onto Kai.", "The noise of the coffee machines and clattering plates drops away. It is just the hum of the fridge and the silence of everyone pretending not to look.", "\"Kai,\" the man says. His voice is short and hard. It hits the walls and comes back. \"It is time to go.\"", "Kai stands up so fast he knocks over his water glass. It splashes across the table. He does not even notice. His shoulders hunch as he rises, rigid as a board.", "\"Sorry,\" he mouths to me.", "I look at the water spreading across the table. I understand, suddenly, that his confidence is on loan, too. It is just a different kind of loan. He borrows it from his dad. I used to borrow it from the crowd. We are both just holding it, hoping it does not break."], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["Friday night. The last practice before the game. The field is dark, lit by floodlights that buzz like angry bees. The team is gathered in a circle, nobody saying anything as we wait for the speech.", "Coach Gin steps forward. She has no whistle in her mouth and no clipboard in her hand. Instead, she holds a single sheet of paper. It is white and clean.", "She hands it to me. I take it. I look down.", "There are only three words on the top line, printed in a simple, black font.", "Play the game.", "Underneath that, in tiny writing that is almost too small to see, is one more line.", "The scoreboard is not invited.", "I look up at Gin. She is drinking her tea, not looking at me but at the field. She looks like a lake. I fold the paper and put it in my sock, right next to the card. It feels heavy. It feels real. I am ready."], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "Game Twelve, First Half", "part": "PART FOUR: THE OTHER KIND OF CONFIDENCE", "paras": ["*Way to Lose #49: Let somebody else's dad tell you who you are.*", "Saturday morning arrives with humidity that makes the grass smell like wet socks and ambition. Marigold Park is packed.", "My dad holds his foam finger high enough to block the sun for a small flock of confused sparrows. Abuela sits in her folding chair, fanning herself with a newspaper. She looks ready to argue with the referee about offside, which she still thinks is a moral failing.", "Luz is beside her, a fresh crayon notebook in her lap. The title page says DEPUTY WIN LOG in bright purple. She is optimistic. She is dangerous.", "Carter Boyle is on the bleachers. He has his phone out, but he does not turn it on. He just watches. It is a small, quiet revolution.", "The Northgate Wolves are in their black and white kits, looking polished and expensive. Their coach, Mr. Brandt, looks like he has never lost a game, a bet, or an argument.", "He is shouting at his striker before the whistle has even blown. Kai Brandt nods. He is not arrogant. He is focused.", "The ducks gather at the edge of the pond to watch and wait. They know exactly what happens here."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["The whistle blows, and the Wolves move. They don't run; they glide. The ball slides between their feet with a smoothness that makes my stomach turn over like a spilled carton of juice. By the third possession, they have it in the box.", "Kai Brandt takes the shot. It is low, fast, and perfect.", "Priya sees it come. I watch her eyes track the angle, her tiny body shifting. Her glove touches the ball. It changes direction, but not enough. The ball kisses the back of the net. One to zero.", "Coach Brandt slams his hand against his thigh. He doesn't yell. He roars. It sounds like a heavy metal door being forced open.", "My stomach drops. The old empty feeling rushes in. The feeling that I am nothing.", "Then I feel the card in my sock. It is heavy. It is warm. It is mine.", "I am still here. I am still Dani. The score is one. I am zero. But I am still here."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["We do not panic. We do the thing Coach Gin taught us, which is to stop staring at the scoreboard and start looking at the grass.", "Ahmed has the ball. He is fast, always fast, but this time he holds it. He sees the twins. Leo signals. Mateo nods. Josie is already shouting, \"Space! Left side! Ahmed, LEFT!\"", "Ahmed does not run straight. He cuts. He passes to Josie, who flicks it to the twins, and they thread it to me.", "I have the ball. I see the gap. Two Wolves defenders are coming. I do not kick it hard. I thread it. I put my toe on the top of the ball and I lift it just enough to go over their heads and into the feet of Ahmed, who is already running.", "He shoots. It goes in.", "One to one.", "The park explodes. My dad is screaming. Abuela is standing up. Luz is writing GOAL in giant red letters.", "And I am not screaming. I am not jumping. I am just standing there, breathing. My hands are steady. The ball went where I wanted it to go. That is enough."], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["The Wolves reset, and the air in the park gets heavy. Kai Brandt wants the ball, and he comes down the wing with a purpose that feels like a math test I didn't study for. Tank is there, waiting.", "Tank is twelve, the size of a refrigerator, and the gentlest person I know. Kai goes for a dribble, but Tank does not lunge or flail. He simply steps in and puts his body in the way, like a door closing on a draft. It is a perfect, clean tackle. The ball pops loose, and Kai goes down.", "Tank stands over him. He does not say sorry.", "Kai looks up from the grass. He is staring at Tank, and then he grins. It is a real grin, not the fake one he wears on the scoreboard. He looks at Tank, and then he looks at the crowd.", "Tank offers a hand. \"Sorry,\" he says. \"For not apologizing sooner.\"", "The whole park laughs. Even Coach Brandt stops shouting for a second to check his watch. Coach Gin sips her tea. She does not say a word. She does not need to."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["The whistle blows, sharp and final, signaling the end of the first half.", "One to one.", "Northgate has not been level at half-time all season. Their coach, Coach Brandt, is in the far corner, lecturing his team with frantic hand gestures. He is drawing imaginary diagrams in the air, his face a mask of pure, undiluted anger. He looks like a teacher whose whiteboard was just erased by a student.", "On our side, it is quiet.", "Coach Gin walks over to Ollie, who is standing by the bench holding his bag of orange slices. He has brought hundreds, probably a thousand, and he looks like he is waiting to serve a banquet at a royal wedding.", "Gin takes a slice. She eats it in one bite. She looks at us.", "\"You're doing it,\" she says, her voice calm as the lake behind the park. \"Now the hard part.\"", "She gestures to the scoreboard. It glows red. One to one.", "\"Don't do anything different because of the score,\" she says.", "I look at the board. It has been showing one to one for ten minutes. My hands are steady. My heart is beating, but it is a good beat, a steady beat, like the metronome in music class.", "I am ready for the second half."], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "Game Twelve, Second Half", "part": "PART FOUR: THE OTHER KIND OF CONFIDENCE", "paras": ["*Way to Lose #51: Miss the last shot.*", "The second half kicks off with a thud, a hard, ugly sound that vibrates right through the turf. Northgate’s striker fires from close range. It isn’t a great shot, but Priya has already saved three in the last two minutes, and her arms feel like they are made of wet clay. The ball slips through her gloves and into the net. Two to one.", "The noise from the Northgate crowd rises like a sudden, sharp spike. Priya does not look at the net. Instead, she stares at the dirt under her cleats, her shoulders hunched so low she looks like she is trying to disappear into the grass.", "I jog back to her. I do not say \"It's okay.\" I do not say \"Shake it off.\" I stop right in front of her and tap her oversized gloves, just once.", "\"Angles,\" I say.", "It is the code we practiced, the one true thing she knows regardless of the score. Priya looks up. Her eyes are wide and wet behind her sports band. She takes a deep breath, her chest expanding, and straightens her spine.", "Then the next shot comes, a rocket from the left wing. Priya is there. She does not flinch. She tracks the ball, reads the line, and moves to the spot before the ball arrives. She tips it over the bar.", "The bench stands up. Ollie drops an orange slice. No one notices."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["We push, driving forward with our shoulders and our lungs.", "Josie is on the wing, and she is talking. She always talks, but this time it is different. This is not panic. This is a play-by-play.", "\"Ruiz has the ball,\" she shouts, her voice cutting through the wind. \"She is looking left. She is looking right. She is looking for a pass.\"", "I hear myself in her voice. For months, that voice in my head has been a sarcastic announcer, mocking every mistake and highlighting every flaw. But right now, as I control the ball and see the space open up, the description is just a description.", "There is no sarcasm. There is no judgment. There is only the fact that I am here, and the ball is moving.", "Ahmed is tracking back. He is actually tracking back. I see him check his shoulder, see me, and wait. He does not run. He holds his position. He is trusting me.", "The ball sits at my feet. It is heavy, but it is mine. I pass it to Josie. She takes it one touch and cuts inside. The Northgate defender slides. Josie steps over the legs. She is flying.", "The crowd gasps. It is a single, held breath.", "I am not watching the scoreboard. I am watching Josie. I am watching the game. And for the first time, the game is enough."], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["Minute forty-seven.", "Josie reaches the edge of the box and, instead of shooting, she whips a cross into the air. The ball hangs there, spinning slowly against the gray sky.", "Ollie is waiting for it. He has spent the whole game on the bench with his orange slices, but now he is in the box, eyes fixed upward. He isn't the tallest or the fastest, but he jumps exactly where the ball is going. His head connects with the leather, dropping it soft and sweet right to Ahmed’s feet.", "Ahmed looks at the goal. He has the speed to score the winner. He could end this right now.", "Then he looks at me.", "I am three yards away, in a better position, wearing the yellow armband. Ahmed smiles, a small, quick thing.", "\"Yours,\" he says.", "He taps it back to me.", "I don't think or calculate. I just swing. My leg comes around, clean and strong, and the ball hits the net.", "Two to two.", "The park does something I can't describe. It is not a cheer. It is a release, like the moment the last bell rings on a test you actually passed.", "Kai Brandt, the Northgate striker, stops running. He claps his hands slowly. He looks at me, and he nods.", "I want to cry. I want to scream. I want to run to the bench and hug Ollie. But I stay still. I breathe."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["Minute forty-nine. The final two minutes stretch out, and my heart beats like a drum solo I cannot stop. Northgate kicks a long ball down the left side, that slanted stretch where we have never defended well, but this time Tank is waiting for it. Leo and Mateo stand right beside him, the three of them forming a wall that actually stays put.", "The ball goes out for a throw-in. The crowd gets loud, and the Northgate coach is yelling, his hands wild as he draws diagrams in the air again. Then comes the corner kick. The ball flies in ugly, bouncing off the ground, then a shin, then a knee until it drops into Kai's feet.", "He strikes it. Three to two. The noise becomes a physical weight pressing against my ears, the vibration humming right through my chest. There is time for one more kick, the clock still reading forty-nine.", "The ball is cleared to midfield and comes to me, thirty yards out. I look at the goal, then at Priya, who stands tall and watches the ball with steady eyes. I take it up the middle, deciding not to curve it or aim for the corner, but straight for the center.", "I strike it. It is the cleanest shot I have ever hit, my leg snapping like a whip, the ball flying true. It hits the crossbar. *Clack.*", "The whistle blows. The ball bounces off the bar and lands in the grass. The game is over."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["I stand there, hands on my head, exactly where I stood after the own goal. I wait for the heavy feeling of worthlessness to sweep me off my feet, expecting to turn into nothing. It does not come.", "The minutes stretch out while the other teams walk off, and I find Priya. She is not looking at the ground, but at me, and she gives me a small thumbs up. Over by the bench, Tank is hugging the twins. Leo and Mateo are in his arms, and for the first time all season, they are not arguing. They are just being held.", "Josie is quiet. She is looking at her cleats, breathing hard, not talking. Coach Gin walks to the sideline, ignoring the scoreboard to look directly at me.", "\"Information,\" she says.", "Just that word.", "I laugh, and it starts in my chest, coming out as a happy sob that hurts my ribs. I laugh until I am crying.", "That night, in my room, I open the red notebook.", "Way to Lose #51: Miss the last shot.", "I look at the line, then at the loss. Underneath, in my own handwriting, I write: Also: the best game we've ever played."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "Way to Win", "part": "PART FOUR: THE OTHER KIND OF CONFIDENCE", "paras": ["*Way to Win #1: Show up.*", "The final standings are in. Mud Hens: two wins, ten losses. We are ninth out of ten teams, which means the Sunnyvale Sprouts, who have never once been sunny, finish last.", "We sit at a round table at the Dugout Diner, where the floor is sticky with a specific kind of glue that feels like it has been there since the invention of breakfast. My dad orders milkshakes for everyone, and they arrive in tall, sweating glasses that look like they are about to slide off the table. They taste like someone squeezed a carton of milk and a bag of sugar into a blender and forgot to turn it on. I take a sip. It is thick. It is gray. I take another sip.", "Abuela is leaning forward, tapping the table with a spoon. She has finally figured out offside, or at least she has decided what it means to her.", "\"I do not understand,\" she says. \"That boy stands where he should not stand. It is rude. It is like interrupting a sentence. I want to call the league office. I want to speak to the manager.\"", "\"Dada, it's a rule,\" Dad says, holding up his foam finger like a white flag.", "\"It is a moral failing,\" she insists. She looks at me with the serious intensity of a judge who has just eaten a bad sandwich. \"Did you stand where you should not stand, Dani? In the last game?\"", "I think about the final minute. I think about where I was standing. I was standing right where I needed to be.", "\"Yes, Abuela,\" I say. \"I was very rude. I will write a letter of apology to the referee.\""], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["My phone buzzes. It is Carter Boyle.", "He has posted a new video. It is the last minute of the game. You see me take the shot. You see the ball hit the crossbar. You see the ball bounce off the ground and roll into the duck pond.", "Then, the video changes. Carter has slowed it down. He has slowed down the moment Tank grabs the twins. He has slowed down the moment Josie hugs Priya. He has slowed down the moment I stand there, hands on my head, and then I look up and smile.", "The trombone is still there. It is the same sad trombone. But underneath it, you can hear us breathing. You can hear the ducks quacking.", "The comments are not mean.", "Nia, who I do not talk to but who I used to sit with in third period, has written: \"Best own goal ever.\"", "I look at the screen. My thumb hovers over the keyboard. I type: \"Best team ever.\"", "I send it. I close the app. I do not open it again. I pick up my milkshake. It is getting warm. It tastes like cold metal and regret."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["Coach Gin is at the bus depot.", "She stands by the door of her yellow bus, packing her things into a duffel bag. There is the steel thermos, the lanyard with the whistle and the bus key, and that fluorescent yellow windbreaker she never takes off.", "She does not say goodbye. She does not say I love you, Mud Hens. She does not even offer good luck.", "Instead, she zips the bag shut and looks directly at me.", "\"You did the work,\" she says.", "She means the practice. She means the Loss Log turning into a Strategy Log. She means the sock with the true thing inside. She means the silence during that scrimmage when we finally stopped shouting at each other.", "I reach into my pocket. I pull out the yellow armband. I have not taken it off since game one, not once, not even for sleep. I hold it out to her with both hands.", "\"Here,\" I say. \"You can have it.\"", "She looks at the fabric, then she looks at me.", "\"It is not the armband,\" she says. Her voice is quiet. It is the tone she uses when she is telling the truth. \"You know that.\"", "\"I know,\" I say.", "I put the armband back in my pocket."], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["It is dusk, and the light outside my window has turned the dull purple of a scraped knee.", "I sit in my room and open the red notebook. I have written fifty-one ways to lose, and I read them all.", "Way to Lose #1: Show up. Way to Lose #4: Kick the ball into your own net, then apologize to the ball. Way to Lose #51: Miss the last shot.", "These lines map out every time my worth depended on someone else, a catalog of every moment I was afraid, and a record of who I was when I felt empty.", "I turn to the last page, which is blank.", "I pick up my pen. I do not write a joke, a stat, or a rating. I write one sentence. It is plain. It is short. It is true.", "\"The score is what happened. I am who I am.\"", "I close the notebook. It feels heavy in my hand, solid and real, like a textbook I actually had to carry.", "I stand up and walk to my closet. I take out the red jersey and put it on. Then I take the yellow armband out of my pocket and slide it onto my arm. It fits. It is mine."], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["*Way to Win #1: Show up.*", "I step onto the grass, the dampness seeping through my cleats as the twilight swallows the slanted left side of the pitch. The duck pond is a black mirror in the distance, and the ducks are either asleep or pretending to be, which is hard to tell when you are the only one awake.", "I stand there, alone in the fading light, and the air tastes like cold mud and coming rain. For a long, quiet second, I am not the captain, not the star, and not the girl in the video. I am just Dani, and that feels enough.", "Then a ball rolls out of the darkness, sliding across the wet blades until it stops at my feet. I pick it up. It is cold, round, and real.", "\"Okay,\" I say to the empty field. My voice is steady. \"Next game.\""], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "The Official Scoreboard", "part": "PART ONE: EIGHT GAMES, ZERO WINS", "page": 1}, {"n": 2, "title": "Own Goal Dani", "part": "PART ONE: EIGHT GAMES, ZERO WINS", "page": 6}, {"n": 3, "title": "The Bus in the Parking Lot", "part": "PART ONE: EIGHT GAMES, ZERO WINS", "page": 11}, {"n": 4, "title": "Losing Is Information", "part": "PART ONE: EIGHT GAMES, ZERO WINS", "page": 16}, {"n": 5, "title": "The Autopsy", "part": "PART TWO: LOSING IS INFORMATION", "page": 21}, {"n": 6, "title": "The Sock", "part": "PART TWO: LOSING IS INFORMATION", "page": 26}, {"n": 7, "title": "The Silent Scrimmage", "part": "PART TWO: LOSING IS INFORMATION", "page": 31}, {"n": 8, "title": "What Priya Sees", "part": "PART TWO: LOSING IS INFORMATION", "page": 36}, {"n": 9, "title": "Game Nine", "part": "PART TWO: LOSING IS INFORMATION", "page": 41}, {"n": 10, "title": "Everybody's Favorite", "part": "PART THREE: THE HIGH AND THE HOLE", "page": 46}, {"n": 11, "title": "Hero Ball", "part": "PART THREE: THE HIGH AND THE HOLE", "page": 51}, {"n": 12, "title": "Game Eleven", "part": "PART THREE: THE HIGH AND THE HOLE", "page": 56}, {"n": 13, "title": "The Bench", "part": "PART THREE: THE HIGH AND THE HOLE", "page": 61}, {"n": 14, "title": "The Armband", "part": "PART THREE: THE HIGH AND THE HOLE", "page": 66}, {"n": 15, "title": "Sorry Is Not a Text", "part": "PART FOUR: THE OTHER KIND OF CONFIDENCE", "page": 71}, {"n": 16, "title": "The Hens' Own Plan", "part": "PART FOUR: THE OTHER KIND OF CONFIDENCE", "page": 76}, {"n": 17, "title": "Northgate Week", "part": "PART FOUR: THE OTHER KIND OF CONFIDENCE", "page": 81}, {"n": 18, "title": "Game Twelve, First Half", "part": "PART FOUR: THE OTHER KIND OF CONFIDENCE", "page": 86}, {"n": 19, "title": "Game Twelve, Second Half", "part": "PART FOUR: THE OTHER KIND OF CONFIDENCE", "page": 91}, {"n": 20, "title": "Way to Win", "part": "PART FOUR: THE OTHER KIND OF CONFIDENCE", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
</body>
