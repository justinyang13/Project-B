  color:var(--ink);font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;-webkit-font-smoothing:antialiased}

  display:flex;flex-direction:column}

h2{font-family:"Baskerville","Palatino Linotype",Georgia,serif;font-weight:700;font-size:clamp(1.5rem,3.2vw,2rem);text-align:center;margin:4px 0 16px;line-height:1.15}
.orn{text-align:center;color:var(--accent);letter-spacing:.6em;margin:-6px 0 14px;font-size:.9rem}
.pic{width:clamp(150px,44%,230px);aspect-ratio:1;border-radius:10px;object-fit:cover;box-shadow:0 2px 8px var(--shadow);border:4px solid #fff8;background:var(--edge)}

.txt::after{content:"";display:block;clear:both}
/* chrome */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--barink);display:flex;align-items:center;gap:10px;padding:10px 14px;z-index:20;backdrop-filter:blur(6px)}
.bar button{background:transparent;color:inherit;border:1px solid #f4ecd855;border-radius:999px;padding:8px 14px;font:600 .9rem system-ui,sans-serif;cursor:pointer;min-height:40px}
.bar button:hover:not(:disabled){background:#f4ecd822}.bar button:disabled{opacity:.35;cursor:default}
.bar input[type=range]{flex:1;accent-color:var(--accent);min-width:60px}

.tools{position:fixed;top:10px;right:12px;z-index:21;display:flex;gap:6px}
.tools button{background:var(--bar);color:var(--barink);border:0;border-radius:999px;padding:8px 12px;font:600 .85rem system-ui,sans-serif;cursor:pointer;min-height:38px}
#toc{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:center;justify-content:center;padding:14px}

#toc a{display:flex;gap:12px;padding:9px 6px;border-bottom:1px solid var(--edge);color:inherit;text-decoration:none;cursor:pointer;align-items:baseline}
#toc a:hover{background:var(--edge)}
#toc .n{color:var(--accent);font-weight:700;min-width:1.7em}#toc .t{flex:1}#toc .p{color:var(--muted);font:.85rem system-ui}
#toc .partname{margin:14px 0 2px;font:700 .72rem system-ui;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

<script>
const D = {"title": "Fifty-One Ways to Lose a Soccer Game", "sub": "A Season of Mud, Mistakes and Mud Hens", "pages": [{"no": 1, "ch": 1, "ctitle": "The Official Scoreboard", "part": "PART ONE: EIGHT GAMES, ZERO WINS", "paras": ["*Way to Lose #1: Show up.*", "Here is the official scoreboard of my soccer career so far. Games played: 7. Games won: 0. Goals we have let in: 43. That works out to six and a bit goals per game, which sounds like a lot until you see our goalkeeper, Priya, who is terrified of the ball, standing in front of the net like a small brave umbrella in a hailstorm.", "I am the captain. Nobody voted. It just kind of happened, the way a bruise happens.", "My name is Dani Ruiz, I am twelve, and I play central midfield for the Marigold Park Mud Hens, which is the worst under-13 team in the entire Harbor Valley Youth League. I know because I checked. I checked the standings on the league website every morning before school, the way some people check their own pulse, and every morning we were at the bottom, right underneath a team called the Sunnyvale Sprouts, who have never once been sunny."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["Here is our field. Marigold Park has one soccer pitch, and it slants to the left, so every ball you kick eventually rolls toward the parking lot like it has somewhere better to be. Behind the west goal there is a duck pond. The ducks have opinions. Twice this season a shot has gone over the crossbar and into the water, and both times a duck picked up the ball, looked me in the eye, and refused to give it back.", "Here is my team. In goal: Priya Nair, eleven, tiny, glasses strapped to her head with a sports band, gloves as big as boxing mitts. At defense: Tank Bell, who is twelve and the size of a refrigerator and apologizes to every player he tackles, and the Cruz twins, Leo and Mateo, who finish each other's sentences and argue all game about which of them is older. On the wing: Josie Kaplan, who has never stopped talking in her life. Up front: Ahmed Suleiman, the fastest kid in the league, who believes that passing is for people who are slow.", "And on the bench, holding a bag of orange slices and smiling like it's his birthday: Ollie Pratt, who has played eleven minutes all year."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["Game eight is against the Hollis Hornets, who are not even a good team, and by the ninth minute it is 3 to 0.", "Let me describe how a goal against us usually goes, for those of you who are lucky enough not to know. First, the other team does something perfectly normal, like passing to each other. Then Ahmed, who was supposed to be tracking back, is standing at midfield admiring his shoelaces. Then the twins both go for the same ball and bump into each other, and Tank says, \"Sorry, sorry, sorry,\" to nobody in particular. Then there is a very small, very quiet *pfft* as the ball goes past Priya, who has closed her eyes.", "\"And Ruiz has the ball,\" I say, in my head, in my announcer voice, the voice I use when things are going badly. \"She's looking left. She's looking right. She's looking for a way out of this entire situation.\"", "There is no way out. There is only forward."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["On the sideline, my family is doing what they do best, which is being loud. My dad, who fixes school buses at the depot and wears a foam finger to every game, is holding the finger high above his head and yelling, \"Come on, Mud Hens! That's all right! That's okay! Shake it off!\" He has yelled this exact sentence eight games in a row. It has never once worked.", "My abuela sits beside him in her folding chair with her arms crossed. She still does not understand offside. She thinks it is a kind of rude behavior. \"Why is that boy allowed to stand there and you are not?\" she asks my little sister, Luz, who is seven and busy writing in a crayon notebook. Luz calls it the Deputy Loss Log. She is thorough. She writes \"GOAL\" in big red letters every time it happens and draws a very sad duck.", "With four minutes left it is 7 to 0. I get the ball at midfield. I see a gap. I take off.", "And then, the way you can see your own shoe coming before you trip on it, I watch myself do it. I turn to pass back to Priya, so she at least has something to do, and I hit it a little too well."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["It goes straight past Priya. Straight into the net. Our net.", "The whole park goes quiet. Even the ducks look up.", "\"Own goal,\" says the ref, kindly, in the voice you'd use to tell a person they had spinach in their teeth.", "I stand there with my hands on my head. Eight to nothing, and all of it, I feel, is somehow my personal fault. Forty-three plus eight is fifty-one. I do the math right there on the field, because I can't help it. Tank comes over to pat my shoulder and says, \"Sorry, Dani,\" which is the worst part, because it wasn't even his fault to begin with.", "Then, when I look up, I see a boy from my school on the bleachers behind the goal. His name is Carter Boyle. He is holding up his phone. It is pointed straight at me, and the little red light on it is on.", "I do the only thing a captain can do. I pick the ball out of the net, I tuck it under my arm, and I say to it, very clearly, \"I'm sorry.\""], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "Own Goal Dani", "part": "PART ONE: EIGHT GAMES, ZERO WINS", "paras": ["*Way to Lose #4: Kick the ball into your own net, then apologize to the ball.*", "Sunday night, the video has four hundred views. I watched it eleven times. That is not a typo. Eleven is a specific number, like the players on a field, and I need to know exactly why it is funny. It is not funny. It is a disaster wearing a smile.", "The clip starts with me running. Then I hit the ball. Then it goes in. The wrong net. The sound is muted, but someone added a sad trombone. A *waa-waa-waa* that lasts exactly as long as my face crumples.", "Then comes the zoom.", "The video creator, who goes by \"HornetHunter99,\" slowed it down. He zoomed in tight on my face. I am holding the ball under my arm. I am looking at it. I am saying, \"I'm sorry.\"", "In the slow motion, my apology looks like a prayer. It looks like I am begging the leather sphere for forgiveness. It looks like I have no idea what I am doing.", "I close my laptop. I open it again. I watch it a twelfth time. I need to see if there is an angle where I look cool. There is no angle where I look cool."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["Monday morning, the hallway at Harbor Valley Middle smells like floor wax mixed with the distinct, metallic scent of nervous sweat. I walk with my shoulders hiked up to my ears, trying to look like a statue, because statues do not get whooped by other students.", "\"Whoops!\" a boy yells, doing the hand-over-shoulder motion without even looking at me. He does it to his friend.", "Another kid leans in, grinning. \"Need directions to the right net, Dani?\"", "I want to say something with teeth. I want to tell him my name is Dani Ruiz and that I have the fastest sprint time in the league. Instead, I say, \"I think I am lost.\"", "Carter Boyle is walking ahead of me. He turns, grinning. \"It's just a joke, Ruiz. Chill out.\"", "My best friend, Nia, bumps my shoulder. She is calm, and she is being kind. She hands me a juice box. \"They don't mean anything, Dan. It's just a video.\"", "I cannot stand it. I cannot stand her kindness. It feels like she is looking at a broken toy and saying, \"Oh, you are okay, little thing.\" I am not a broken toy. I am a captain."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["My room is quiet, except for the hum of the air conditioner and the heavy silence of the red notebook sitting on my bed. It is my Loss Log, and I keep it because if I do not write the failures down, they will eat me alive while I sleep.", "I open it to the very back, where the pages are thin and white.", "*Way to Lose #1: Show up.* *Way to Lose #2: Let the ball hit your foot and go in.* *Way to Lose #3: Be the best player and still lose.*", "I stare at the list. I have never written a way we played well. I have never once jotted down \"Great Pass\" or \"Good Tackle\" or \"Fast Run.\" In my head, a good game only counts if the scoreboard agrees. If the final number is 0 to 8, the good passes simply did not happen. The fast runs did not matter. The good tackles were just the exact moment before the bad goal.", "I pick up my pen. My hand hovers over the paper, trembling slightly, trying to find a stable surface on the shaking desk. I try to write *Good Tackle* next to game eight, but the ink smudges instantly. It looks like a mistake. It looks like a lie.", "I close the book. The red cover drops, hitting my chest with the dull, heavy thud of a wet towel."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["Dinner is a loud place because my dad is doing his thing. He holds up the foam finger, the one with \"GO\" written in blue marker, and waves it at me like a conductor trying to get the orchestra to play louder.", "\"You are the best player out there, *mija*!\" he announces. \"You have the heart of a lion! The speed of a cheetah!\"", "\"Dad,\" I say, staring at my plate. \"We lost eight to zero.\"", "\"Details!\" he waves his hand, dismissing the number as if it were a fly on the table. \"The spirit is what matters!\"", "Abuela, who is eating her rice with the precision of a surgeon, looks up from her bowl. \"She should have kicked the boy with the phone,\" she says. \"In the shins. He was recording. That is a crime.\"", "Luz, my little sister, slides a piece of paper across the table. It is a crayon drawing of a duck. The duck is wearing a yellow armband. It has a smile.", "I look at the duck, then at Dad, then at Abuela. I laugh. It is a short, sharp laugh, like a balloon popping in a quiet room. Then I stop. The silence in my chest is louder than the television."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["The email lands at 9:15 PM, right in the middle of my homework. It comes from the Harbor Valley League, and the subject line just says *Staffing Update*.", "\"Dear Parents, Mr. Dunphy has resigned his position to spend more time with his aquarium. We are looking for a new coach.\"", "I stare at the screen until the letters blur. An aquarium. A man who wants to watch fish. We are the Mud Hens, not a decorative feature for a living room. We do not need a guy staring at bubbles; we need someone who understands that we are the bottom of the league by a wide margin.", "I look down at my cleats. The laces are one green and one orange, tied tight and ready for a game that no longer feels worth playing.", "I open the team chat. My fingers hover over the keyboard, trembling a little.", "\"I think maybe I am done,\" I type.", "I read it back. It is the truth, but it is also a surrender, like waving a white flag in the wind. I do not send it. Not yet. I close the laptop with a sharp click, and the dark room suddenly feels like a closet."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "The Bus in the Parking Lot", "part": "PART ONE: EIGHT GAMES, ZERO WINS", "paras": ["*Way to Lose #7: Meet a new coach and decide in ten seconds that she's not the answer.*", "Tuesday practice is usually a ghost town, with brown grass and mud cracked like a dry riverbed while the wind whistles through the chain-link fence. I stand on the center circle holding the ball, waiting for a coach who will never come.", "Then the ground shakes. A low, rumbling moan rolls across the field, vibrating through my cleats and up into my teeth. I look up to see a yellow school bus, dented on the left side and covered in dust, rolling slowly into the Marigold Park lot. It moves with the heavy, deliberate grace of a turtle trying to cross the playground, stopping right in front of the dugout with the engine sputtering once before sighing into silence.", "The side door slides open. A boot steps down, followed by another.", "I squint at the figure emerging from the vehicle. It is not a person in a tracksuit, and it is certainly not a person in a windbreaker. It is a person who looks like she belongs on the bus.", "I grip the ball until my knuckles turn white. I have eight games of zero wins to explain, and my stomach is doing a slow roll downhill, like a marble trapped in a broken jar."], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["The woman climbs down the steps. She is short and square, with a silver braid pulled back tight. Sunglasses rest on top of her head. She wears a fluorescent yellow windbreaker that looks like it has seen better decades. On her neck hangs a lanyard with a whistle and a bus key. In her hand is a steel thermos, dented and serious.", "She walks to the field. She looks at the muddy pitch. She looks at the duck pond, where three ducks are preening their feathers. She looks at the team, who are standing in a row, nervous and silent.", "She does not say \"Hello.\" She does not say \"Let's win.\"", "She takes a long sip from the thermos, wipes her mouth with her thumb, and says, \"Well. That's a lot of information.\"", "I blink. I wait for the other shoe to drop. It does not. She turns to the ducks. \"You guys see that too, right?\"", "A duck honks. She nods, satisfied."], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["She walks down the line without asking for names, demanding details instead.", "To Tank, who is fidgeting with his cleats, she asks, \"What did you have for breakfast?\" \"Three pancakes,\" he says, then adds, \"I'm sorry, I didn't mean to eat them all.\" \"Good,\" she says.", "To Josie, who is mid-sentence about her dog's haircut, she holds up a hand. \"Stop. Count to ten.\" Josie stops. \"One, two, three, four, five, six.\" \"Good,\" Gin says. \"Six is enough.\"", "To Ahmed, who is leaning against a cone, she asks, \"What do you do when you have the ball?\" \"Run,\" he says. \"And the rest of the team?\" He shrugs. \"They're slow.\"", "Gin turns to Priya. \"Priya. What do you see?\" Priya opens her mouth. Her voice is a whisper, barely a breath. Gin waits. She does not ask her to repeat it. She just nods, as if the silence itself was the answer."], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["It is my turn. I am the captain, which means I have a job to do, so I step forward with my yellow armband tight on my arm.", "\"Coach,\" I start, my voice cracking slightly. \"We are last. We have lost eight games. We have let in fifty-one goals. There is a video of me scoring an own goal that is on every phone in school. We are a disaster.\"", "I am still talking. I am listing the failures, the statistics, and the pain, trying to give her the full weight of the situation so she understands why I am holding my breath.", "*Blow.*", "The whistle cuts through the air like a sharp, singular note. I stop.", "Gin looks at me. Her face is calm. She has not blinked.", "\"I didn't ask what the scoreboard says,\" she says. Her voice is flat, steady. \"I asked who's on my team.\"", "I open my mouth to argue, to explain the difference, but the words die in my throat. I look down at my cleats. The green and orange laces are tangled. I do not know who I am if I am not the scoreboard."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["\"Gather round,\" Gin says. She points at the bus. \"Get on.\"", "We climb the steps, our cleats thumping against the metal treads. The seats are hard and yellow, and the windows are open, letting in the smell of rain and cut grass. She pulls a cord, and a small TV screen flickers to life above the driver's seat.", "On the screen: game eight. Me. The own goal.", "I stare. I have watched that clip a hundred times, but never from this angle. I see Priya close her eyes tight, squeezing them until her eyelids turn red. I see Ahmed leave his position, running and running, seven times. I see myself. I never look up. I keep my head down, staring at the grass, as if the ground will swallow me whole.", "Gin taps the screen. \"Look at the angles. Look at the eyes. Now. That's data.\"", "The bus engine rumbles. I am sitting in the driver's seat of a vehicle that has been to a thousand places, and for the first time, I do not feel like I am alone in the mud."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "Losing Is Information", "part": "PART ONE: EIGHT GAMES, ZERO WINS", "paras": ["*Way to Lose #10: Ask the scoreboard how you're doing.*", "The bus engine cuts off, and the air inside is still thick with the smell of wet wool and old rubber. I stand up, my knees cracking a little, because I am twelve and I am angry.", "\"You said that was data,\" I say. My voice shakes, but I hold it steady. \"It’s not. It’s losing. We lost eight games. That is not information. That is a fact. A bad fact.\"", "Gin doesn’t look up from her thermos. She unscrews the cap, and the smell hits me first: black tea, strong enough to strip paint. She pours a cup, and the liquid is dark, almost brown, sloshing against the plastic rim.", "\"The scoreboard tells you what happened,\" she says. Her voice is low. It is the voice of someone who has driven six hours in the rain and seen a deer jump the median. \"It does not tell you who you are. Those are two different maps, Dani. You are looking at the wrong one.\"", "I cross my arms. I want to say that maps are just facts too. I want to say that losing means the map is wrong. But she is already drinking, and the steam from the cup fogs the glass, hiding her face."], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["\"That is easy for you to say,\" I snap. \"You are not the one standing in the mud while the whole school watches you fail. You just drive a bus.\"", "Gin sets the cup down with a soft thud. She taps the screen above the driver’s seat, and the video pauses on the moment before the own goal. My face is frozen in a grimace, looking like a deer that has realized it is about to be a statistic.", "\"I care about winning,\" she says, her voice flat and steady. \"I care more than you know. But I do not think it is the only thing worth measuring. Tell me. In that game, what did you do well?\"", "I open my mouth, then close it again. My brain scrambles through the highlights, searching for a save or a nice pass, but it only finds the noise, the whistles, and the laughter echoing in my ears.", "\"Nothing,\" I whisper, the word tasting like old pennies.", "Gin nods slowly. She does not look disappointed, or even surprised. She looks like she is waiting for me to finish a sentence I have not yet started, her eyes steady and unblinking. She reaches into her pocket and pulls out a small, worn whistle. It is silver and dented, looking like it has survived a lot of things.", "\"Then we start there,\" she says, tapping the metal against her thumb. \"Find the one thing. Just one.\""], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["The Dugout Diner is where time goes to hide, and the milkshakes taste like cold metal mixed with regret. We sit in the corner booth as a lump of red jerseys, elbows touching, knees knocking, while the sticky floor grabs at our shoes like it has a personal grudge against us.", "Tank picks at a single french fry. He looks at his plate, then at me. \"I think I can stop the winger,\" he says quietly. His voice is soft, like a dog breathing. \"If I stop apologizing first. The apologies make me slow. Sorry, sorry, sorry. It’s a habit. I am working on it.\"", "Josie shakes her leg without stopping. \"The coach is weird,\" she says. \"She watches us like we are ants in a jar. I like ants. But she is weird.\"", "Ahmed slurps his shake, making a loud, wet noise that echoes off the tile. \"The coach is weird,\" he agrees. \"And also wrong. Passing is slow. She wants us to pass. It is illogical.\"", "The twins finish each other’s sentence in perfect sync. \"Weird in stereo,\" Leo says.", "\"Weird in stereo,\" Mateo repeats.", "I look at my own shake. The foam is settling into a flat, gray circle that looks exactly like the puddle of glue I spilled on my math homework last Tuesday."], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["I am back at the bus. The rain has stopped, but the air is heavy. I take the yellow armband off my left arm. It feels lighter than it should. It feels like taking off a weight that was never mine to carry.", "I place it on the seat next to Gin’s thermos. The yellow fabric looks bright against the dull yellow plastic. It looks like a wound.", "\"I’m not the right captain,\" I say. My voice is flat. \"For a team that doesn’t care about winning. If you don’t care about the scoreboard, I don’t know who I am. I am just Dani. And Dani is bad at soccer.\"", "Gin looks at the armband. She does not move to take it. She looks at me for a long time. Her eyes are behind her sunglasses, so I cannot see them.", "\"Give me a week,\" she says. She reaches out and pushes the armband back toward me with one finger. It slides across the plastic. \"If it is still no, we will both quit. But not today. Today, we are just wet.\""], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["Abuela’s car is slow. It moves through the wet streets like a turtle dragging a shell. I watch the world go by, the houses blurring into gray shapes. The windows are fogged up. I press my nose against the glass. The smell of the inside of the car is old bread and pine cleaner.", "We pass the duck pond. The water is black and still. A duck is sitting on my ball. It is my ball, the one I kicked over the crossbar last week, and the duck is sitting on it at the water's edge like it paid for it.", "I watch it. It does not move. It looks at me. It does not give it back.", "I take out the red notebook. The pages are soft from my hands. I turn to a blank page. My hand hovers over the paper. I have written so many ways to lose. But I have never written a way to win. Or a way to stay.", "I write: *Priya stayed in the goal.*", "It is small. It is quiet. But it is true."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "The Autopsy", "part": "PART TWO: LOSING IS INFORMATION", "paras": ["*Way to Lose #13: Have a plan that only works if nobody else is on the field.*", "The bus smells like pine cleaner and old bread, a scent that somehow manages to be both refreshing and ancient all at once. Coach Gin does not sit in the driver’s seat; instead, she stands in the aisle, blocking the light, and slides fifty-one paper plates onto the bench in front of us. One plate for every goal we have let in, which is a lot of plates, clicking together like a stack of white teeth.", "“Pick one,” she says, her voice flat as a table. “Write down exactly how it happened. No excuses. No feelings. Just facts.”", "I pick a plate, then a marker, my hand trembling slightly but refusing to show it, and I write: *Own goal. My foot. My bad.*", "Josie is already narrating the scene. “And here we have the evidence,” she whispers loudly, leaning in. “The crime scene. The plate of shame. I am the detective. The duck is the witness.”", "Luz, who is sitting on my lap because the seats are too short for her, holds up her crayon notebook and points to a page where she has drawn a very sad duck and the word GOAL in red. “This is evidence,” she says, her face serious. “It proves the duck is guilty.”", "Gin looks at Luz, then at me. She does not smile. She does not laugh. She just nods, once, and turns to the next kid."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["The plates pile up on the dashboard, a white mountain that looks like it might collapse if you breathed on it too hard. Gin sorts them with quick, precise movements, her hands moving faster than a dealer in a movie who knows they are not being watched.", "“Fourteen here,” she says, tapping a neat stack. “Ball rolls left. Slant. Gravity. Parking lot.”", "“Seventeen here,” she says, tapping another pile. “Midfield. Lost. Too many touches.”", "“Eleven here,” she says, looking directly at Priya. Priya shrinks, pulling her oversized gloves into her lap like a shy turtle. “Goalkeeper. Eyes. Closed.”", "Priya looks like she is about to vomit. I want to say something, to explain that it was windy, or that the sun was in her face, or that she is tiny and the ball is big, but Gin does not let me. She puts a single plate in the corner, separate from the rest.", "“One here,” she says. “Duck.”", "“Which duck?” I ask.", "Gin shrugs. “The one that did not give it back.”", "Ahmed is fidgeting, picking at a loose thread on his jersey while he looks at the pile of seventeen, then the pile of fourteen, and finally at me."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["Ahmed stands up, and the bus lurches under his sudden weight. He is the fastest kid in the league, a fact he wears like a badge, proud and slightly smug.", "“Passing is slow,” he says, his voice hard as a brick. “I run. I score. That is the game.”", "Gin turns to him. She does not raise her voice. She just waits, her steel thermos catching the afternoon light.", "“Four goals,” she says softly. “Out of six. You scored them.”", "Ahmed nods, crossing his arms over his chest. “See? I am the solution. The rest of them are the problem.”", "Gin points to the pile of fifty-one plates, a white mountain that looks like it might collapse if you breathed on it too hard. “How many of these,” she asks, “happened when you were not near the ball?”", "Ahmed opens his mouth. He closes it. He looks at the plate in his hand, then at the pile, and finally at me. For the first time, he does not look like he knows the answer. He looks like a guy who just realized he forgot his wallet."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["I stand up too, though I cannot explain why. My legs just seem to decide on their own, pushing my chair back with a screech that sounds like a dying goose. “I was there,” I say, and my voice is so loud it bounces off the ceiling tiles. “For the midfield ones. I had the ball. I lost it. It is my fault. It is always my fault.”", "Josie stops narrating. She stops talking entirely, which is like watching the sun go out, and she looks at me with her mouth hanging open, waiting for me to stop. But I am not going to stop. I am going to keep going until I am a statue, or a mistake, or a lie.", "“I take the shots,” I continue, my chest tight like a shirt that is two sizes too small. “I make the passes. I cover the gaps. I am the captain, which means I carry the weight. If we lose, it is because I did not carry it enough.”", "Tank looks at me with wide, worried eyes. He opens his mouth to say sorry, the way he always does, but he doesn’t. He just looks at me, his big hands hovering uselessly in the air.", "Gin does not interrupt. She just watches me, her face calm and flat."], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["My chest still feels tight, like I just ran a mile in the wrong shoes. I want to quit. I want to go home and sit in my room and stare at the ceiling until the world fixes itself.", "Gin reaches into her pocket. She pulls out a single white plate. It is clean. It is blank.", "She writes one word on it in black marker. The letters are thick. They are bold.", "She hands it to me.", "“Loss Log,” she says. “Make a new page. Call it Strategy Log.”", "I take the plate. It is warm from her hand. The word is FIXABLE.", "I look at the word. I look at the pile of fifty-one failures. I look at the bus, which is pulling into the park.", "I put the plate on the dashboard. It is not a trophy. It is a map."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "The Sock", "part": "PART TWO: LOSING IS INFORMATION", "paras": ["*Way to Lose #16: Write down one true thing about yourself, then cross it out because it's not about soccer.*", "The field at Marigold Park is a swamp. The rain hasn't stopped in two days, and the grass looks like it has given up on being grass. So we are at the bus depot, standing in the cracked asphalt between the idling yellow buses. The air smells like diesel and hot rubber. It is loud. A bus engine shudders to life behind me, and I flinch.", "Coach Gin stands in front of us, her fluorescent windbreaker zipped to her chin. She holds a stack of white index cards. They are crisp. They have never been used.", "“Write one true thing about yourself,” she says. Her voice cuts through the engine noise. “A thing that a scoreboard cannot change. A thing that does not depend on the score. Fold it. Put it in your sock.”", "I look at the card. It is blank. It is terrifying. I take a pencil. My hand hovers over the paper. The bus engine sputters again, and the vibration travels through the soles of my cleats."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["Tank goes first. The small card looks like a ticket stub in his huge hands. He writes, “I can make a decent croissant.” He folds it carefully and tucks it into his right sock. He looks pleased.", "Josie writes, “I notice everything.” She does not fold it. She just shoves it into her pocket. Ollie smiles and adds, “I remember everybody’s birthday.” He is already humming a tune.", "The twins, Leo and Mateo, pass a single card back and forth. They both write, “We are the best at arguing.” Their handwriting is identical, which is weird, because they are supposed to be different.", "Priya writes something. She scrubs it with her eraser. She writes it again. She folds the card so tight it cracks. She hides it inside her glove, under the thick padding. No one sees it.", "Ahmed writes, “I’m fast.”", "Gin reads it over his shoulder. She does not blink.", "“Fast is a fact,” she says. “Try again.”"], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["I have held my pencil for eleven minutes, counting the seconds, the idling engines, and the lines on the card.", "I think about soccer. I am good at passing, or at least I am when the ball reaches my teammate, when they do not drop it, and when we happen to win. It feels less like a skill and more like a gamble.", "I think about being fast, which is just a fact, like Ahmed, and not a person.", "I think about being captain. I write the word. CAPTAIN. The letters are jagged. I hate them. Nobody voted. It just happened, the way a bruise happens. It is a title given to me by a team that cannot stop the other team from scoring.", "I cross it out, and the pencil snaps. A chunk of graphite shatters on the asphalt. I stare at the broken tip. I stare at the blank space where the truth should be.", "I do not have a truth. I have a record. And my record is a hole in the ground that keeps getting deeper."], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["Gin walks over. She does not ask what is wrong. She looks at the card, then at the blank space.", "“Is that true when you lose?” she asks.", "I open my mouth, but nothing comes out. My throat feels packed with dry autumn leaves.", "My dad walks out from between the buses, wearing his mechanic’s shirt stained with grease. He waves at the team, then spots me.", "“Hey, Dani!” he hollers. “Check your laces. One is green, one is orange. It’s a mess. You look like a broken traffic light.”", "I laugh. It is a small, dry sound.", "Dad stands beside me. He looks at the card. He does not ask what I wrote. He does not ask how I feel. He has never asked how I feel. He asks about the score. He asks about the standings.", "I realize I have never told him that the score is the only thing that makes me feel real. I realize he thinks I am fine. I am not fine. I am empty."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["The practice ends, and the drills blur into a repetitive haze of passing and running. The ball hits the asphalt, bouncing up with that hard, unpredictable snap that makes your feet flinch.", "I take off my right cleat, peel out the sock, and unfold the card. It is still blank. It is still a question waiting to be answered.", "I fold it carefully, then fold it again until it is small enough to fit in my palm. It feels sharp, like a piece of paper cut from a test I failed.", "I put it back in the sock and pull it up. The card sits under my ankle bone, scratchy and warm, a secret weight against my skin.", "I lace up my cleat, tying the green lace tight, then the orange one. As I stand, the bus engine roars to life, and the vibration hums through my legs like a low-frequency hum.", "I am ready for the next drill. The card is still there, waiting."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "The Silent Scrimmage", "part": "PART TWO: LOSING IS INFORMATION", "paras": ["*Way to Lose #19: Keep score of a game that has no score.*", "Coach Gin walks to the sideline where the little plastic scoreboard hangs from a wire, displaying a zero to zero score that feels heavier than the actual numbers. She looks at it, then at the team, and whistles. The sound is short and sharp, like the zipper on a heavy winter coat.", "\"New rule,\" she says, her voice calm as a lake in summer. \"We are not playing a game. We are playing a scrimmage.\"", "She takes the scoreboard down. It swings on its cord, clicking against the chain-link fence with a sound like loose change. She puts it in the back pocket of her windbreaker. The plastic digits are still there, glowing faintly in the sun, but no one is looking.", "\"Rule one,\" Gin says. \"If you keep score, you sit out.\"", "Josie gasps. \"But how do we know if we won?\"", "\"We don't care,\" Gin says. \"Rule two. Every single one of you has to touch the ball before anyone shoots.\"", "Ahmed crosses his arms. \"That's inefficient.\"", "\"Efficiency is for machines,\" Gin says. \"You are human. Touch it.\"", "She points to the field. The grass is muddy and slants to the left, just like always. I look at the empty spot on the fence where the scoreboard used to be. My brain tries to fill the gap with numbers, but it fails.", "The ball is in the air."], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["The first ten minutes are a disaster. Mostly because I am running, breathing hard, and counting touches, but I cannot count the score, which is the part I actually care about.", "I keep checking the sidelines to see if Dad is writing it down on his foam finger. He is not. He is just cheering, which is unhelpful. Josie is on the wing, vibrating with energy because she cannot say the score. So she has invented a new language. She whistles a high, thin note when things are good. A low, grumpy squeak when they are bad. Right now, she is producing a complex, buzzing chord that sounds exactly like a mouse trapped in a shoebox.", "I have the ball at midfield. I look left, then right, trying to remember who is supposed to be open. My brain is glitching. It is flickering with ghostly, angry numbers that refuse to load.", "\"Touched!\" Tank shouts. He has just bumped the ball gently into the mud.", "I feel a spike of irritation in my chest. Why does this feel so wrong? I am missing the thing that tells me if I am doing a good job. Without the number, I am just a girl kicking a ball. That is a terrifying concept.", "I pass to Priya. She is standing in the box with her eyes squeezed shut. I hope she likes the ball. And, more importantly, I hope she doesn't start counting."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["Something changes around minute twelve. I am watching Tank, who is usually so polite he apologizes to the grass if he steps on it. He faces off against the opposing striker, but he does not say \"Excuse me\" or \"Pardon my intrusion.\" He simply steps in, plants his feet, and uses his shoulder to win the ball without a single word of regret.", "I blink, wondering if I have accidentally entered a dream where Tank has become a shark. He looks around, and for the first time in my entire soccer career, he does not look like he is waiting for someone to say it is okay to exist.", "Then Priya does something even weirder. A cross comes in, high and hard, the kind that usually makes her flinch like she has been touched by a wasp. She does not close her eyes. She stands in the box, gloves up, eyes wide open. The ball bounces off her glove and out of play. She did not whisper. She did not shrink. She just stood there, looking at the ball like it had personally offended her.", "The twins, Leo and Mateo, are running together. They are not arguing. They are looking at each other. Leo points. Mateo nods. They pass the ball to each other, clean and fast, without checking their birth certificates to see who is older.", "The air in the park feels different. It is lighter. The mud is still mud, but it feels less heavy.", "I am still counting. But the numbers are quieter."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["I have the ball at midfield, and Ahmed is already closing in. He is fast, a human blur that never seems to have brakes, and usually he simply takes the ball and runs. Today, though, he takes it and stops abruptly.", "The opposing defender is right there, a wall of jersey blocking the only way forward. Ahmed looks trapped, his eyes wide with the specific panic of a kid who has forgotten his homework. He looks at me, and I yell, \"Move!\"", "He glances back at the defender, then back at me, before kicking the ball to me in a messy, desperate arc that is not great. I catch it. I am in the box, the goal is right there, and the net is empty. I kick it.", "It goes in.", "Silence falls over the park. Ahmed stands still, staring at the ball in the net, then looks at me with his mouth hanging open. \"Was that...\" he starts.", "\"Passing,\" I say.", "\"Yeah,\" he says, scratching his head. \"It was faster than I thought.\"", "I start to laugh, a sound I cannot stop, and I have to sit down on the wet grass to keep from falling over. My armband slips off my shoulder, but I do not care."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["The scrimmage ends when Gin blows her whistle, a sharp crack that cuts through the humid air. She walks over to us, thermos in hand, and takes a long sip. The tea smells like dirt and determination.", "\"Who won?\" she asks.", "We look at each other. Josie shrugs, then Tank shrugs, and even Ahmed looks confused, which is a new experience for him.", "\"I don't know,\" I say, because the truth is I really have no idea.", "\"Good,\" Gin says. \"That is the point.\"", "I walk back to the bus, my legs feeling like they are made of wet clay. My heart is beating in my chest, but it is not pounding with fear or panic. It is just beating, steady and strong, like a drum in a quiet room. I feel tired in a good way, the kind of tired that comes from running until you forget to worry about the score. It feels like finishing a math test and realizing you actually liked the numbers.", "I pull out my red notebook, the Loss Log, and flip to the back where the Strategy Log lives. I pick up my pen, my hand hovering over the page.", "I write: *Tired. Good.*", "I look at the line. It is small, but it is true. I close the notebook and shove it deep into my backpack, underneath the bag of orange slices. I am a little embarrassed, but I keep it there, safe and solid, like a secret I am ready to share."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "What Priya Sees", "part": "PART TWO: LOSING IS INFORMATION", "paras": ["*Way to Lose #22: Stand in front of a ball with your eyes closed.*", "I find Priya before the whistle blows, hunched in the grass like a secret. She is not practicing. She is drawing. Her toe carves lines in the mud, connecting the corner of the net to the center, creating a web of geometry that looks more like a spider’s trap than a soccer pitch. Tennis balls bounce off the crossbar with a dull thud, landing in the duck pond behind her where the water ripples with tiny, angry rings.", "I stand on the sideline, my cleats sinking into the dirt. My heart does a strange flip. I have never seen her do this. I have only ever seen her flinch.", "She stops. The silence stretches until I feel it pulling at my skin. She turns slowly, her glasses askew, her oversized gloves still on. Her face is pale, the way it gets when someone catches her talking to herself.", "\"You were supposed to be at the huddle,\" I say, my voice sharper than I intended.", "Priya shrinks, her shoulders rising to her ears. \"I know,\" she whispers. \"I forgot. I was just... looking.\"", "\"Looking at what?\"", "She looks down at the mud. The lines are still there, sharp and deliberate. \"The angles,\" she says."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["\"Where do goals come from?\" I ask. It is a stupid question, really, because I know the answer, and it usually involves bad luck or me being in exactly the wrong place.", "Priya does not look up. Her toe continues to drag through the wet earth. \"From the hip,\" she says, her voice barely a breath. \"The shooter’s hip tells you where it is going before the foot moves. The standing foot points. And the pitch slants left, so the ball wants to go left. It is not magic. It is physics.\"", "I blink, waiting for the punchline that isn't there. \"You knew?\"", "\"I always know,\" she says. A tear slips down her cheek, leaving a clean track through the dust on her face. \"I just... I cannot open my eyes. If I open them, I have to see it. And if I see it, I have to catch it. And if I miss, it is my fault.\"", "She looks at me then, her eyes wide and terrified behind the sports band holding her glasses. \"I saw that one last Tuesday. The one from the left wing. I saw the hip. I saw the foot. I knew exactly where it would go. I closed my eyes and let it hit the net. Because if I opened them, I might have failed.\""], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["\"Show me,\" I say.", "She flinches. \"No. Please, Dani. I am not ready.\"", "\"Five balls,\" I say, pulling three from the bag Ollie brought and finding two more in the grass. \"I will shoot. You keep your eyes closed. That is the rule. You do not have to save them. You just have to stand there.\"", "She nods, a tiny, jerky motion. I step back to the center circle, and the net looks smaller than usual, while Priya looks like a child standing in front of a hurricane.", "I kick the first ball, and it flies wide, but she does not move. The second hits the post and bounces into the pond, yet she remains frozen. The third, the fourth, and the fifth all miss, and my legs are burning with frustration because I want her to do something.", "\"Sixth ball,\" I say, my voice quiet.", "I place the ball on the grass and look at Priya, whose head is tilted down and whose lips are moving, though I cannot hear the prayer or the excuse or the fear. I kick the ball hard, aiming for the top right corner.", "It is a good shot. A real shot.", "And then I hear it. A sharp, high-pitched yelp, not of pain, but of shock. A thud. A slide in the mud.", "I look up, and Priya is on her knees with her gloves spread wide, holding the ball, which is sitting there, still and quiet, like a captured bird."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["\"I saved it,\" I say.", "Priya does not answer. She trembles so hard I can feel the vibration in the air, looking from the ball to me with a whisper that cracks. \"I did not miss. I did not miss.\"", "I kick another ball. She saves it. Her eyes are wide and bright, no longer afraid but intense, reading the trajectory before I even touch the leather. I kick again. Save. Again. Save.", "Eight in a row.", "I stop, my chest heaving as I look at the empty net, then at Priya sitting in the mud with her gloves resting on her knees. She is not smiling or cheering, but she is there, solid and real.", "A whistle cracks through the air.", "I turn to see Coach Gin standing on the steps of the yellow bus, holding her thermos, her gaze fixed on the goalkeeper rather than me.", "\"That is data,\" she says, her voice cutting over the quacking ducks in the pond. \"You have been collecting it all season. Now you are using it.\"", "I stand there, hands still raised from my last shot, feeling a strange lurch in my stomach as I realize the best player I have ever seen read a game is eleven years old. She is afraid of the ball, and I did not know because I was too busy watching the score."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["We walk back to the bus in silence, the mud cold on my legs while Priya’s steps stay light and quick beside me. She doesn’t look at me; instead, her eyes track the pebbles and grass on the path as if they are spelling out a secret code.", "\"Your true thing,\" she says. It is not a question. It is an accusation.", "I freeze, thinking of the card in my sock, the blank one I have been avoiding like a bad dream. \"It’s a secret,\" I say, hating how small my voice sounds before I can stop it.", "Priya stops walking and turns to me with a serious face, reaching into her own sock to pull out a small, folded piece of yellow paper from the bus. \"Mine is that I can see where things are going,\" she says, holding it out to me.", "I take the card, noting how stiff it is and how small, precise her handwriting appears. I look at the words, then at her, and reach into my own sock to find my blank card, which feels heavy like a stone I have been carrying for years without knowing.", "\"I will write mine,\" I say, my voice steady. \"But not today.\"", "Priya nods, turns, and walks toward the bus. I watch her go, and for the first time, I do not feel like I am losing. I feel like I am starting to look."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "Game Nine", "part": "PART TWO: LOSING IS INFORMATION", "paras": ["*Way to Lose #25: Get so used to losing that winning feels like a mistake.*", "The Sunnyvale Sprouts are the only team below us, and they look terrified. I am not. I am vibrating like a phone on a table. My cleats, one green lace and one orange, dig into the slanted turf. Coach Gin stands before us in her fluorescent windbreaker, holding her thermos like a gavel. She does not yell or draw Xs and Os. Instead, she looks at the duck pond behind our goal, where a single mallard is preening a feather with intense focus.", "\"Look. Pass. Trust. Duck,\" she says.", "That is it. No pep talk. No \"leave it all on the field.\" Just four words that make no sense together. I blink. I look at Tank, who is still holding his gloves. I look at Josie, whose mouth is slightly open.", "\"Duck?\" Josie asks.", "\"The bird,\" Gin says, sipping her tea. \"It is there. Do not kick it.\"", "The whistle blows. I step onto the pitch. The grass is wet, and the air smells like cut hay and fear. I take the ball at midfield. I look left, then right. For the first time, I do not look for the applause. I look for the gap."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["Half-time is a mystery. The score is zero to zero, a number so rare for the Mud Hens that it feels like holding your breath underwater and forgetting to breathe.", "But things are different. Ahmed, the fastest kid who hates passing, is standing in the midfield. He is not running. He is waiting. When a Sprout player comes at him, he does not sprint. He drops his shoulder and passes to Tank. Tank does not apologize. He just takes the ball and clears it with a heavy, gentle thud.", "The twins, Leo and Mateo, are on the left side. They are not arguing about who is older. They are taking turns holding the line. One steps up, the other drops back. It looks like they are dancing, except there is no music and everyone is sweating.", "Priya is in goal. Her glasses are strapped tight. Her eyes are open. All of them. She is not flinching. She is watching the angle. I watch her, and my heart does a weird flip, like a coin landing on its edge.", "\"Zero to zero,\" Josie whispers to me. \"Do you feel that?\"", "\"I feel like I forgot how to lose,\" I say. And that is the scariest part."], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["Second half. Minute twelve. Ahmed has the ball at the edge of the box, looking my way with that \"I am not running\" expression. He sends it low, cutting across the wet grass like a hockey puck on ice. I am there before I even decide to be. I strike it without thinking, my cleats finding the wet turf with a solid thud.", "The ball zips past the Sprout goalie, who is still staring at Ahmed. It hits the net. It goes in.", "The park explodes. Not a cheer, exactly. More like a roar. The ducks in the pond quack in genuine surprise. One to zero.", "Then, minute twenty, they score. A header. Ugly. Lucky. One to one.", "Minute twenty-four. Josie gets the ball on the wing. She kicks it hard, but it hits her own shoulder first. The ball bounces off the crossbar, hangs in the air for a split second, and drops into the net.", "The ref looks at the ball, then at Josie, then at his watch. He signals for the goal. Two to one.", "Josie is screaming. Tank is hugging her. I am standing still, my hands in my pockets, feeling the vibration of the crowd through the soles of my shoes. We are winning. Actually winning."], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["The final whistle blows. It is not a sound. It is a physical force that hits my chest and pushes the air out of my lungs.", "Tank, who is the size of a refrigerator, picks me up. He lifts me off the ground, and I kick my legs in the air like a happy dog. I cannot breathe, but I do not want to land.", "My dad is on the sideline. His foam finger is moving so fast it is a blur, a helicopter of support. He is shouting something, but I can only hear the rhythm of his voice.", "Abuela stands up from her folding chair. She does not stand up slowly. She launches. Her arms go up. Her mouth opens, and a sound comes out that I have never heard from her before. It is not a word. It is a roar. It carries across the parking lot. It probably carries across three counties.", "Luz is on the ground, cross-legged. She is writing in her crayon notebook. She holds up the page. It says \"WIN\" in gold, the letters shaky and thick. Below it, she has drawn a duck. The duck has a crown.", "I am still in the air. I am looking at the sky. For the first time, the scoreboard is not the only thing that matters. Or maybe it is. I don't know. I just know I am flying."], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["My phone buzzes, then again, and again.", "I check the screen. Carter Boyle has posted a video. It is not the own goal. It shows my shot, the net rippling, and the roar. The title reads \"MUD HENS WIN!!\" with that happy trombone sound from cartoons playing underneath.", "Streetlights flicker on outside, casting long orange shadows over the houses. Everyone will know by Monday. The hallway will be buzzing. I am the girl who scored. I am the captain who led us to our first win.", "I feel light, and I feel solid. I feel exactly who I have always thought I would be.", "I do not notice that this feeling is being lent to me by everyone else. I just keep watching the video, smiling, letting the phone vibrate against my palm. To me, this is what it feels like to be enough."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "Everybody's Favorite", "part": "PART THREE: THE HIGH AND THE HOLE", "paras": ["*Way to Lose #28: Forget to pass and remember to celebrate.*", "Monday morning, the hallway is not a hallway. It is a parade route, and I am the float. The air feels thicker, charged with the static electricity of a hundred people trying to be cool at once. Carter Boyle is waiting by the water fountain, his phone screen glowing like a predator's eye. \"One for the gram?\" he asks, his smile wide and slightly too white.", "I lean in. The flash pops. The noise level in the hallway spikes instantly. Kids I have never spoken to, kids whose names are just smudges in my memory, stop to stare. \"Captain!\" one girl shouts, pointing at my yellow armband. She says it the way you would say \"fire\" or \"ice cream.\" It is a title. It is a flavor.", "The morning announcements crackle over the speakers. \"The Marigold Park Mud Hens took their first win of the season against the Sunnyvale Sprouts. Well played.\" My name is attached to it. I am not a player anymore. I am a headline.", "Nia stops me at my locker. She is quiet. She looks at the photo on my phone. \"It's nice to see you happy,\" she says softly.", "I shrug, adjusting my bag. \"I'm not happy, Nia. I'm winning. Happy is for people who don't have a point to make.\" I say it lightly. It is a joke. A deflection. But the words land heavy in the air, and Nia does not smile back. She just nods, and walks away, leaving me standing there with my phone and my new, shiny, borrowed self."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["Practice smells like wet grass and old cleats. Coach Gin parks the yellow bus at the edge of the field, the engine ticking as it cools. We sit inside with our legs dangling over the doors, watching the grainy, shaky footage on the bus TV. It is me.", "\"Rewind,\" Gin says. She does not turn the wheel, only tapping the remote.", "The video plays. I see myself in the box, the pass coming, my foot connecting with the ball, and the net rippling. Then I see the bleachers. I see my dad jumping and the crowd roaring.", "I grab the remote. \"Pause. Rewind to the cheer.\"", "Gin looks at me, her sunglasses pushed up on her silver braid. She does not blink. \"What did you see in the pass before the shot?\" she asks, her voice flat and calm.", "I open my mouth, then close it. I try to remember the moment on the field, the ball in the air, the space, the angle. I do not remember any of it. I only remember the sound, the jump, and the noise hitting my ears like a wave of static.", "\"I was waiting,\" I say, my voice small. \"I was waiting for them to shout.\"", "Gin takes the remote back and turns off the TV. The screen goes black, reflecting my face. I look tired. I look empty."], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["I skip the Strategy Log on Tuesday because I have a math quiz, and on Wednesday because I am busy being famous. My locker has turned into a shrine, covered in sticky notes from teammates and stickers from fans, and I spend all my free time curating this specific image of myself.", "After practice, I sit on the bench and pull off my socks. My hand finds the index card tucked inside the right one. It is slightly creased. It is a tiny white square that feels heavier than it should.", "I pull it out. I look at it. Then I put it back without reading a single word. I do not want to be reminded of the girl who loses, because I have decided to be the girl who wins.", "I set the card on the blue plastic seat and stand up to stretch my hamstrings. The air is cold. The grass is dark. I keep my eyes on the field.", "I walk to the water fountain. I drink. I leave the card sitting there.", "It is just a small white square in the vast dark field. And I refuse to look back."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["The Dugout Diner floor is sticky, and the air smells like burnt coffee. We sit at the counter, stirring terrible milkshakes that are thick, sweet, and cloying. Ahmed leans across the table, his spoon clinking hollowly against the glass. \"Can I go back to not passing?\" he asks.", "I look at him. He is serious. \"Depends who's watching,\" I say.", "The words hang in the air, heavy and wrong. I hear how they sound, like a rule I am making up on the fly to keep him useful. Ahmed stops stirring. He looks at the shake, then at the spoon. He says nothing, just pushes the spoon away so the liquid sloshes against the glass.", "The diner is quiet, except for the other players laughing at a joke I missed. They are not laughing at me. They are laughing at the milkshake. I am not part of the laugh. I am the punchline."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["The garage is blindingly bright because my dad has hung a banner. It is hand-painted, the letters wobbly and red paint smeared until it looks like a scream. \"MUD HENS! 1 WIN!\" it proclaims.", "Abuela stands on a step stool, drawing a small number in the corner. \"9-12,\" she says without looking at me. She is focused on the line. \"Next year,\" she adds, \"we need a bigger banner. The ducks will need to see it.\"", "I grin, showing the reporter from the free weekly paper my teeth. I flash my armband. \"We just decided to be winners,\" I say with total authority.", "Behind me, in the shadow of the car, Priya stands. She holds her gloves, staring at the floor. Her face is pale, her eyes wide, trying to make herself small.", "I do not see her. My eyes are fixed on the camera lens, then on the banner. I am not looking at the girl who caught the ball in the air and saved us from ourselves. I am not looking at the person who is starting to disappear."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "Hero Ball", "part": "PART THREE: THE HIGH AND THE HOLE", "paras": ["*Way to Lose #31: Score three goals and lose count of your team.*", "The coin spins, landing on heads. I call it before it hits the grass, and I am right, because I have been winning lately. My legs feel like brand-new cleats, and my voice feels like a broadcast microphone. I look at Coach Gin. She is leaning against the yellow school bus, drinking tea. The vehicle is old, smelling strongly of diesel and stubborn determination.", "\"Coach,\" I say, pointing to myself and then to the field. \"I have a plan. It is simple. Me. Ball. Net.\"", "Gin lifts one eyebrow. A sunglass lens tilts up to reveal her eye. She does not blink, nor does she smile. She takes a long sip of her tea. The liquid sloshes in the steel thermos, sounding like rain hitting a tin roof.", "\"Losing is information,\" she says. Her voice is flat, the tone of a woman who has driven the same route for thirty years and knows exactly where every pothole lies.", "I do not hear her. I am already looking at the opponent. They are the Bayside Barracudas. They are sunny, green, and look surprisingly soft. I step onto the field. The grass is wet. It squelches under my cleats. I am ready. I am the plan."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["The whistle screams, and the game is on. I win the ball at midfield, my stomach doing a backflip. There is a gap. I take it.", "First defender: a boy in green. He slides in, but I step cleanly over his foot, the same effortless way I step over puddles on the way to school. Second: a red-haired girl. She rushes at me. I feint left, she goes left, and I cut right, leaving her tripping over her own shadow. Third: a big boy who tries to block my path. I dribble around his knee without looking up because I do not need to. Fourth: the last one. I leave him standing there, looking confused, like he just realized he forgot his wallet.", "Now I am alone. The net is right in front of me. The crowd goes silent, then loud. I strike the ball. It flies into the top corner. This is the best shot of my life.", "The cheer hits me. It is warm. It is sweet. It tastes exactly like the orange slices Ollie brings to the bench. I turn to scan the field. Ahmed is in the middle of the pitch. His hand is up. He is open. He is waiting for a pass. I do not look at him. I run to the corner flag. The noise is too good to stop."], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["Half-time. The bench is a long plastic chair, cold enough to make my butt go numb, and I sit in the middle like I own the whole league.", "Coach Gin walks over. She holds her thermos and does not yell, or smile, or even blink. She just looks at me with her one visible eye, steady as the bus mirror she probably used to drive with.", "\"How many passes did you make?\" she asks.", "I shrug because I don't count those. I count goals, and I count cheers, and I count the exact second the banner was unfurled.", "Gin nods, then looks to her left. Ahmed is sitting there, staring at his shoes like they have personally insulted him. He does not say a word, but his silence is loud. It is a gong.", "Priya sits next to Ahmed. She has her head in her gloves, her glasses fogged up, trying to disappear, trying to be small enough to fit inside her own elbows. I look at her, but I do not see her. I see the goal, and the banner, and the crowd.", "Gin takes a sip of tea. \"The scoreboard tells you what happened,\" she says.", "She turns and walks away. Her windbreaker flaps. It makes a sound like a flag. I do not understand why my stomach feels tight."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["Second half. The score is tied, 1 to 1, and I need more than just points. I need the world to know my name.", "I get the ball again. I dribble past one defender, then hesitate. I don't pass; I keep it, driving forward because they are tired and slow while I am fast.", "Goal two. The net ripples and the crowd roars.", "Goal three. I shoot from the side, the ball bending into the corner. It is a hat-trick. I am on fire, gold, the sun.", "Then, I have the ball in our own half. I am arrogant. I try a fancy move and lose the ball.", "Two Sprouts attackers are coming. They are fast and angry, running straight at Priya.", "She is alone, tiny, and shaking. The first shot comes; she dives and saves it, landing on the ground with wide eyes. The second shot is high and hard.", "She jumps. Her gloves touch the ball, sending it into the crossbar. It bounces down and into the net.", "I watch it happen. I do not move. I do not help. I am standing still, frozen in place. The score is 4 to 3. We are winning, but Priya is crying."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["The whistle blows. Full time. We won, 4 to 3.", "The crowd stands up, a wall of noise that chants, \"DA-NI. DA-NI. DA-NI.\" It hits me like a gust of wind in a locker room, pushing me forward until Tank, who is huge and smiling, lifts me onto his shoulders.", "I am up there. I can see the whole field, the ducks, the parking lot, and the bus.", "Coach Gin is by the bus. She isn't clapping or cheering. She slides into the driver's seat and starts the engine, the low hum vibrating through the asphalt, a quiet sound that feels out of place in all the noise.", "I look down at my team. They are hugging, shouting, and celebrating, but the chant is too loud, filling my ears and drowning out their voices.", "I spot Priya on the ground. She hasn't stood up. She is looking at her gloves, her head bowed.", "Ahmed is walking toward the bench, his eyes fixed on the dirt, not on me.", "The chant continues. DA-NI. DA-NI. I smile and wave, feeling like the only person who matters, the star of the show, the hero of the day.", "I don't hear a single teammate's voice. I don't know when they stopped talking or when they stopped looking at me. I only know that I am high, the noise is deafening, and the bus is waiting."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "Game Eleven", "part": "PART THREE: THE HIGH AND THE HOLE", "paras": ["*Way to Lose #34: Tell your goalkeeper exactly what you think of her.*", "The Hawks are not like the other teams. They do not run, and they do not shout; they pass. The ball moves between their feet in a smooth, endless loop, a river that never dries up. I am still riding the high of last week, which is a problem because I told the school paper we would finish undefeated, and I meant it. I think.", "Coach Brandt is in the stands, wearing a Northgate jacket that costs more than my cleats. He is watching us, though not the ball; he is watching me. He has a clipboard, and I can see his pen moving.", "\"Ruiz,\" I say to myself in my announcer voice. \"Ruiz is in her element. Ruiz is the queen of Marigold Park. The Hawks are just background noise.\"", "I take the ball, see a gap, and kick it. It hits the grass and dies. A Hawk player picks it up without running, passing it to his teammate with a touch so short and precise it feels boring, yet perfect. I am still smiling, still full of the chant. DA-NI. DA-NI. It is still in my ears, a ghost sound that refuses to leave. I think the noise is for me. I think the world is still clapping."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["By the tenth minute, the score is 3 to 0. The Hawks are not fast, but they are patient, passing the ball three, four, or even five times before they shoot. They shoot once. It goes in. Four goals in ten minutes, and every single one of them came because of me.", "I try to take it on myself. I run at their defender, but he steps aside, and I am too late. I kick the ball into the air, and it lands right on their winger, who scores without even looking. I lose the ball again, kick it too hard, and it sails over the bar, followed immediately by another goal against us.", "I am the leak in the hull, the hole in the bucket, the reason the water is in the boat.", "\"And Ruiz has the ball,\" I say in my head, my announcer voice sounding hollow. \"She is trying to be the hero. She is trying to be the savior. She is trying to be the thing that the crowd loves.\"", "The crowd is not cheering anymore. The Hawks are passing again, the ball moving in a smooth, endless loop. I am just a rock in the stream, and the water goes around me, does not stop, and does not wait."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["It is 7 to 0 in the second half. The Hawks are still passing, not celebrating, not shouting, just playing with a smooth, endless patience that makes us look like we are trying to juggle oranges while riding a unicycle. They are better at this than we are. They are better at everything.", "The eighth goal comes off a cross. It is a simple, perfect cross. Priya is in goal, tiny, her gloves as big as boxing mitts. The ball is coming at her. She sees it. I see her see it. She moves, but she is slow. The ball goes past her and into the net.", "I turn to her. I do not think. I do not feel. I just yell.", "\"You're supposed to stop them! That's your entire job!\"", "My voice echoes across the field. It is loud. It is clear. It is cruel.", "Priya stops. She looks at me. Her face is white, not pale, but the stark, blank white of a page in my red notebook that I never filled. She does not answer. She walks to the goal line and takes off her gloves. She sets them down on the grass, very gently, like they are made of glass. Then she steps out of the box, sits on the bench, and does not look at me."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["Coach Gin blows the whistle, a long, sharp sound that slices through the air and, more importantly, through my pride.", "\"Ollie,\" she says, her voice flat and steady. \"You're in goal.\"", "Ollie stands up, clutching his bag of orange slices, and smiles as he walks to the box. He puts on the gloves, which are still too big for him, making him look like a kid playing dress-up with his little sister’s costumes, yet he looks completely ready.", "I am taken off the field and sit on the bench, watching as Ollie faces a penalty kick. The ball is placed on the spot, the Hawk player runs, and kicks. Ollie dives and saves it.", "The bench erupts into chaos. Tank is shouting, Josie is screaming, and the twins are jumping while hugging Ollie, laughing and happy. Nobody looks at me. I am invisible, a chair, a bag of orange slices, a mistake that has been corrected. The noise is for Ollie. It was never for me."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["The final whistle blows on a 9 to 1 score. Our one goal was technically an own goal by the Hawks, so nobody even celebrates it. We walk off the field with our heads down. The ducks in the pond are silent, watching us go. They look like a jury that has already decided we are guilty.", "In the car, the air is thick. It smells like wet grass and shame. My dad is driving. He isn't yelling. He isn't holding his foam finger. He isn't saying, \"Come on, Mud Hens!\" He is looking at the road. He is breathing.", "My abuela is in the back seat. She is looking out the window. She says, \"Even the duck felt bad for you.\"", "I look down at my sock. I pull out the card. It says captain, and nothing else. Everything I have ever put on it, I borrowed.", "The video will be online by dinner. I can feel it, already on its way."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "The Bench", "part": "PART THREE: THE HIGH AND THE HOLE", "paras": ["*Way to Lose #37: Sit on the bench and count everyone else's mistakes but your own.*", "The new video is worse than the first. It has a title card that says \"Mud Hens Meltdown,\" followed by a slow-motion replay of me screaming at Priya. My face is twisted, my mouth open wide, looking like a goldfish that has been pulled from a bowl and left on a counter. It has two thousand views. That is a lot of people. That is a lot of eyes.", "I am sitting on the edge of my bed. My phone is buzzing on the nightstand. It is Nia. She sent a text at 7:04 AM. It just says, \"Call me?\" Two words. A question mark. It is the kindest thing I have seen all week. I look at the screen, then at the ceiling, then back at the phone again. I do not call.", "I pick up the phone and slide it under my pillow. The buzzing stops. The room is quiet. I grab the pillow and slide it under the bed. I sit there for a long time. The phone is hidden. The problem is not hidden. The problem is inside my head, and it is loud."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["Practice starts without music or drills, just the wind rattling the chain-link fence and the sudden, heavy silence. Coach Gin stands before the whiteboard, skipping her usual speech. Instead of shouting orders, she simply writes names on the board.", "Priya. Tank. Leo. Mateo. Josie. Ahmed. Ollie. Plus two substitutes.", "My name is missing.", "I step forward, my voice cracking. \"Coach, the team needs me. I am the captain. I am the engine. We cannot run without the engine.\"", "Coach Gin caps her marker. She looks at me with a calmness that feels like a locked door. She says, \"Take a week on the bench.\"", "\"But—\"", "\"Watch,\" she says. \"That is the first thing I have heard you say all season that isn't true.\"", "I stand there, my mouth open, wanting to shout and cry at the same time until my eyes sting. I walk to the bench and sit down, feeling completely empty inside."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["From the bench, the field looks bigger, but it is also quieter, which is strange because Josie is on the wing and she never stops talking. Today, however, her voice is different. She is calling out the space before it opens. \"Gap on the left! Space on the right!\" It sounds like the navigation app in my dad’s bus, guiding us exactly where to go without the usual screaming. I have never once heard her be this useful.", "Tank is in defense. He stops trying to chase the ball and stands tall instead, taking up space like a very polite refrigerator. He is a wall. A gentle wall, but a wall all the same. The twins have a signal. Leo taps his knee, and Mateo moves. It is invisible and it is perfect.", "Priya stands very still in the goal. Her gloves are on, and she looks at nothing, then everything. She is not terrified. She is waiting.", "I watch them. I watch the game. I watch myself. I am just a girl on a bench, not the captain, just a girl."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["Nobody yells at me, which is actually the worst part.", "I am waiting for it, really hoping someone will say, \"You are terrible,\" or maybe \"You don't belong here.\" I am braced for the anger because I know how to fight with a weapon. Anger is a shield, and I know how to hold it up.", "But no one does it.", "Ahmed is warming up beside me, stretching his hamstrings with the serious focus of a kid doing homework. He is quiet. He is definitely not admiring his shoelaces.", "\"I passed four times today,\" he says, not looking at me.", "\"That's because you were good,\" I say, my voice sounding very small.", "Ahmed looks at me, shrugs, and says, \"That's because I was on a team.\"", "He walks away. I sit on the bench, realizing I am not the engine, just one piece of the machine, and I have been acting like I am the whole thing."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["I get home, skip dinner, and go straight to my room. The red notebook is waiting on my desk, open to page one. I read the first few lines until the ink starts to swim and blur into a gray, muddy mess.", "*Way to Lose #1: Show up.* *Way to Lose #2: Let the ball hit your shin.* *Way to Lose #3: Trust the wrong person.*", "I keep reading. My handwriting looks different now. It looks smaller. I see the pattern hiding in the margins. Every line is about what someone else did to me. Or what I think they did. I have been writing down their applause. Their disappointment. Their love. None of it is actually mine. It is all borrowed.", "I pick up my pen. I try to write number thirty-seven. The tip hovers over the paper. It wobbles. It looks like a confused fly trying to find a spot on a window to land.", "*Way to Lose #37: ...*", "I stare at the blank space. I cannot finish the sentence. I do not know how to lose anymore. I do not know how to be anything else.", "The door creaks open.", "Luz stands in the doorway. She is holding a thick, very blue crayon. It is the kind that snaps if you breathe on it wrong.", "\"Deputy says try again,\" she says."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "The Armband", "part": "PART THREE: THE HIGH AND THE HOLE", "paras": ["*Way to Lose #40: Take off the armband and hope somebody asks you to put it back on.*", "Thursday smells like rain and wet asphalt. I leave the yellow armband on the bench. I do not say goodbye, nor do I look back. I simply peel it off my arm, where it has lived for twelve weeks, and set it on the plastic seat next to Ollie’s bag of orange slices. It looks heavy there. It looks like a dead thing.", "I walk to the bike rack, my legs feeling as if they are filled with wet sand. I ride home, eat a single cracker, and ride back out. The sun is setting, turning the sky the color of a bruised peach. I ride to the bus depot.", "The old yellow bus is parked in the shade. It is quiet. I open the driver’s side door and climb up the steps to sit in the doorway. The metal is
