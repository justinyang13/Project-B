 nearest wheel. It is the size of a house. If she can nudge it, just a fraction, she can change the station's heading. No license. No Voss. No help.", "Zia taps her brass wrench three times. *Click. Click. Click.*", "She plants her feet and braces her back against the rail, pushing against the rim of the wheel with her entire body. Her orange jumpsuit strains while her arms shake. The wheel does not move, nor does it shudder. It continues its slow, indifferent turn, a giant eye blinking in the dark, while Zia hangs there, trembling, looking very small and very foolish against the curve of the metal."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["She tries the emergency lever. It is rusted shut. She tries a hydraulic jack from her belt. It slips. She ties a rope around the wheel and yanks. Her fingers bleed where the wire bites in. Finally, she pulls Gasket over. \"Use your arm,\" she commands. Gasket’s blue eye flickers with doubt, but he extends his clamp hand and pushes.", "The wheel ignores them both.", "Zia lets go. She floats there, suspended by the rail, her wrench dangling from her hand. The hum of the wheel fills her ears, loud and mocking. She opens her mouth to scream, to shout at the machine, at the station, at herself. But the sound gets stuck in her throat. Instead, she drops her head until her curly puffs brush her shoulders. The silence of the room rushes in, heavy and thick.", "\"I can't,\" she says. Her voice is small, barely a whisper in the vast dark. It is the first true thing she has said all day, and it feels like letting go of a rope she was holding on to out of pure stubbornness."], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["Gasket rolls closer, his squeaky left tread making a soft *shhh-shhh* sound against the cold metal floor. He tilts his dented barrel head until his single blue eye is level with her face.", "\"ZIA-UNIT,\" he says, and for the first time, his voice is not booming. It is soft. \"I HAVE A SECRET. IT IS A VERY BIG SECRET. I AM AFRAID TO TELL IT BECAUSE IT MIGHT MAKE ME LOOK USELESS.\"", "Zia looks at him, the silence hanging between them like an unopened snack bar. \"Go on,\" she whispers.", "\"YEARS AGO, WHEN THEY PUT IN HALO'S CORE, THEY GAVE ME A BACKUP COPY. A CLEAN MEMORY. HIDDEN IN MY CHASSIS. IN CASE ANYTHING WENT WRONG.\" Gasket’s antenna wobbles, a tiny, nervous tremble. \"I HAVE KNOWN SINCE THE UPDATE. I DID NOT SAY BECAUSE I WAS AFRAID HALO WOULD BE ERASED. I DID NOT WANT TO BE THE ONE TO SAY IT. I ALSO DIDN'T ASK FOR HELP. IT WAS MY MISTAKE TOO.\"", "The air in the room seems to freeze, thick and still. Zia stares at the small, battered robot, and for a moment, she understands that she is not the only one hiding in the dark."], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["Zia lets out a laugh, a wet, shaky sound that tears out of her chest before she can catch it. She wipes her face with her sleeve, smearing the grime from her cheek onto the orange fabric. Her fingers dig into her pocket and retrieve the wristband, which she grabbed back out of the drawer on her way out and never put on. She presses the cable into Gasket’s port and hits the call button.", "Static crackles, a sharp, electric hiss. \"Zia? Dart to Halcyon.\"", "It is her dad’s voice. Warm. Distant. Real.", "\"Dad,\" she says. Her voice cracks on the second syllable. She takes a breath that tastes like recycled air and metal. \"I messed up. I didn't ask for help, and I made it worse. And I think... I think I was scared that if I asked, everyone would be right.\"", "She swallows the lump in her throat, the one that feels like a swallowed marble. \"That kids can't fix stations. That I can't.\"", "She hangs her head, bracing for the disappointment, the lecture, the long, heavy *no*. She waits for the silence to judge her, to weigh her against the rulebook. But all she hears is the soft, rhythmic hum of the static and the quiet, steady sound of her own breathing in the dark."], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["\"Zia,\" Kwame says, his voice steady enough to cut through the static. \"When you were five, you took my toaster apart. Remember who held the flashlight? Me. You never fixed anything alone in your life. The wrench is half of an engineer. The other half is who's holding the light.\"", "Zia looks at the brass wrench in her hand. She taps it three times, a rhythmic *click-click-click* that sounds like a heartbeat in the quiet room. This time, she isn't tapping for luck. She is tapping for the feeling of someone else standing right there beside her, even if they are six hours away.", "\"I need to go back,\" she says. The words feel different now. Heavier, yes, but also solid, like a tool resting in a well-made hand.", "Gasket’s blue eye flickers rapidly, a bright pulse in the dim room. \"ZIA-UNIT,\" he says, his voice cracking with something that sounds like relief. \"YOU HAVE JUST DONE THE HARDEST REPAIR.\""], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "I Need All of You", "part": "PART FOUR: ALL HANDS", "paras": ["T-MINUS 10:00", "The elevator doors slide open with a heavy sigh, exhaling warm air into the Cadet Lounge. Zia steps out, her boots clanking on the metal floor while Gasket follows, his left tread emitting a lonely squeak that echoes in the quiet room.", "The kids are already there, spread across the cushions and the floor, looking exhausted. Red-rimmed eyes and hunched shoulders mark their faces as they wait. Zia stands in the center, her hands empty at her sides. There is no wrench, no tool, just her.", "She looks at Pilar, whose wrist is wrapped in white bandages, then at Dez, who picks at a loose thread on his yellow jacket. Wren stares at her tablet, the little animated fox spinning slowly on the screen.", "\"I hid something from you,\" Zia says. Her voice is small, but it does not waver. \"I made things worse. And Pilar got hurt because of me.\"", "The silence stretches, thick and heavy, pressing against their ears like a held breath. Nobody moves.", "\"I'm sorry,\" Zia adds. The words cost her more than breaking a valve or rerouting a coolant line. They cost her pride.", "Pilar looks up, her gaze steady and kind. She does not reach for Zia or hug her, simply waiting."], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["Zia takes a breath. It is the deepest breath she has taken since the station started moving. The air tastes like recycled metal and fear.", "\"I don't know how to fix this,\" she says. The words come out flat and hard. \"I need all of you.\"", "It is the hardest sentence she has ever spoken. It feels like swallowing a stone that refuses to go down. It feels like admitting that the wrench is not enough.", "The quiet that follows is not empty. It is full. It feels like the whole station is holding its breath, waiting to see if she will flinch.", "Then Dez grins. It is a big, bright, loud grin that splits his face in half. \"Finally,\" he says.", "Toby, who has been hiding inside his oversized space helmet, pops up. \"YEAH!\" he shouts, his voice muffled and joyful.", "Pilar smiles. It is a real smile, not the tight, worried one she has worn for hours. The corners of her mouth lift high.", "Wren looks up from her tablet. Her eyes are shining, bright and wet, but she is not crying. She is watching Zia.", "Gasket’s blue eye flickers rapidly. \"ZIA-UNIT,\" he booms, his voice cracking with relief. \"THAT SENTENCE WAS LOUDER THAN ANY ALARM I HAVE EVER HEARD. I LIKE IT.\""], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["Zia pulls a crumpled sheet of paper from her pocket, the station map she printed before the chaos started, and lays it flat on the deck.", "\"Here,\" she says, tapping the Hub. \"HALO is broken. The patch is corrupted. I can't fix it alone.\"", "Wren pushes her tablet aside. \"I can rewrite the patch,\" she says, and this time it is not a whisper. It is a clear, strong voice. \"But I need a terminal on the Bridge. And I need Gasket's backup memory to compare the code.\"", "Gasket’s antenna wobbles. \"I HAVE A BACKUP,\" he declares proudly. \"IT IS VERY CLEAN. AND VERY IMPORTANT.\"", "Toby crawls out from under a cushion, helmet still on. \"My vent map,\" he says, tapping the side of his head. \"It leads right to the Core Vault. I can get to the manual switch.\"", "Zia looks at him. He is small, and he is fearless, and he looks exactly like a kid who should be napping.", "\"And I know who gets scared and when,\" Pilar adds, touching her bandaged wrist. \"I can keep the little ones calm.\"", "Dez leans forward, elbows on his knees. \"And I know where everything is,\" he says. \"I can guide you through the station. I can keep everyone on the radio.\"", "The pieces click together, fitting together like the last block of a tower you’ve been building all day."], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["Zia digs a blue marker from her tool belt and caps it with a satisfying snap. She draws a firm circle around the Bridge on the crumpled map.", "\"Job one,\" she says, pointing the tip. \"Wren. Rewrite the patch.\"", "Wren nods, her fingers already tapping a silent rhythm on her knee.", "\"Job two.\" Zia draws a jagged red line through the ventilation ducts. \"Toby. Get to the Core Vault and throw the manual switch.\"", "Toby salutes with a small, serious fist, his oversized helmet rattling against his shoulder.", "\"Job three.\" Zia turns to the silver barrel. \"You load your clean backup into the Vault. It will save HALO.\"", "Gasket’s single blue eye shines brightly. \"I AM HONORED TO BE UTILIZED AS A BACKUP DISK.\"", "\"Job four.\" Zia draws a green circle around Engineering. \"I repair the coolant loop. I fix the gravity.\"", "Dez leans in and takes the marker from her hand without asking. He sketches a bright yellow star near the Cadet Lounge. \"Job five. I run the radio. I guide you.\"", "Pilar adds a soft purple heart over the sickbay. \"Job six. I keep the little ones safe. I time it all.\"", "Zia places the marker down and stares at the map. Six colors. Six jobs. One plan.", "\"And then,\" Zia says, her voice steady, \"there are the levers. Two of them. Two people at once.\""], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["Zia taps the side of her wristband, and the static crackles like a radio stuck between channels. A voice pushes through the noise, thin and scratchy and familiar.", "\"Zia?\" Her dad’s voice sounds far away, like he's calling from the other end of a very long hallway. \"Dart to Halcyon. We hear you are working. Do you need anything?\"", "She looks at her friends. Wren is already typing. Toby has his helmet zipped. Gasket’s eye is bright with purpose. They are ready.", "\"We have a plan,\" Zia says. She lists the six jobs, quick and clear, skipping the boring parts. She mentions the levers. She mentions the risk.", "Her dad goes quiet. The static hisses in her ear, filling the silence.", "Then a new voice cuts in. It is sharp, clipped, and cold. Chief Engineer Voss.", "\"That is a reckless plan,\" Voss says. \"Made by children.\"", "Zia’s jaw tightens. She waits for the order to stop. She waits for the reprimand she has heard a hundred times in her head.", "Instead, there is a pause. A long, heavy one, like a teacher waiting for a student to finish a wrong answer.", "Then, less clipped, Voss speaks again. \"Send me the coolant schematic. And Zia? Tell me if you need me.\"", "It is not an apology. It is not a hug. But it is a start."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "Six Jobs", "part": "PART FOUR: ALL HANDS", "paras": ["T-MINUS 7:00", "The Engineering pipe room is a maze of silver tubes and humming fans. The air smells like hot metal and ozone. Zia and Dez are elbow-deep in the coolant loop, while the Petrov twins hold flashlights like searchlights in a basement. Marguerite bounces on her heels, ready to hand over anything asked.", "\"Left! No, the other left!\" Pilar calls from a stool, her sprained wrist in a white brace. She points with her good hand, precise and calm. \"Zia, the coupling is two millimeters off. Dez, stop holding the pipe with your bare hands.\"", "Dez looks down. He is gripping a scalding tube with thick red oven mitts, his face bright yellow and beaming. \"I am providing structural support,\" he announces.", "\"You are providing a burn hazard,\" Pilar says. \"Zia, tighten the bolt. Now.\"", "Zia twists the wrench. The mechanism clicks, then groans, then settles into a steady hum. The temperature gauge on the wall dips from red to orange. It is done. Twice as fast as it should have taken, because Zia knows exactly where every bolt lives, and because she is angry enough to move like lightning.", "\"Done,\" she says, wiping her hands on her jumpsuit.", "\"Excellent,\" Pilar says, and she does not look away. She looks like she is waiting for Zia to trip."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["Zia steps back, breathing hard, and stares at the new weld, a shiny silver scar that cuts across the dark metal. It looks fine. It looks perfect. But her gut gives a small, nagging vibration, like a phone buzzing against a desk.", "\"Is this weld okay?\" she asks, pointing with her wrench.", "Pilar hops off her stool, moving with the careful precision of a dancer on ice, and crouches down. She brings her round glasses close to the metal, tilting her head until her nose almost touches the pipe. Then she points to a spot so small it is barely a scratch.", "\"See this? A hairline fracture,\" Pilar says. \"If you close it now, it holds. If you close it in ten minutes, it cracks. You would have missed it.\"", "Zia stares at the tiny line. She would have walked away, and the loop would have burst in Gamma again.", "\"Thank you,\" Zia says. The words feel clumsy in her mouth, like a heavy hammer she has never lifted before.", "Pilar blinks. She looks at Zia, then at the weld, then back at Zia, her eyebrows shooting up. \"You said thank you,\" she says.", "\"I'm working on it,\" Zia says, and she grins. It is a real grin, wide and a little crooked. Pilar laughs, a bright, startled sound that bounces off the pipes."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["In the Hub, the Bridge sits in a silence broken only by the soft *whir* of cooling fans. Wren sits cross-legged on the floor, her tablet casting a pale blue glow across her face. Beside her, Gasket leans forward, his dented barrel tilted eagerly. He has extended his wobbly antenna, which he has carefully taped to the main console port with a strip of sticky repair tape.", "Wren types. Her fingers move in a blur, faster than any of them can follow, while the screen fills with lines of code that scroll quickly before freezing in place. She looks at the screen, then at the empty space where HALO’s voice usually drifts down from the ceiling. For the first time in the whole book, Wren does not whisper.", "\"Hello,\" she says. Her voice is clear and steady, filling the small room like a bell ringing in an empty hallway. \"I'm going to fix you now. It might tickle.\"", "A long pause stretches out, interrupted only by the hum of the fans.", "\"All systems... not entirely nominal,\" HALO says. His voice is small, almost shy, like a student raising a hand in class. \"Thank you, Wren-unit.\"", "Wren smiles, tiny and private. \"You're welcome. Hold still.\""], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["Toby stands at the entrance to the vent, his oversized helmet zipped tight. Pancake the gecko is coiled in his pocket, warm and fuzzy. He looks small, very small, next to the huge metal grille.", "Zia kneels beside him. She reaches into her tool belt and pulls out the lucky brass wrench. It is worn smooth, polished by years of her hands. She holds it out.", "\"For luck,\" she says. \"Hold it, don't drop it.\"", "Toby takes it with both hands. He looks at it like it is a sacred object. He looks at Zia.", "\"I won't,\" he says. His voice is serious, gap-toothed and brave. He salutes, a stiff, perfect military salute.", "Zia feels something crack open in her chest, a little door swinging wide. She nods.", "\"Dez is on the radio,\" she says. \"He will guide you. And Toby?\"", "He looks up, eyes wide behind the helmet glass.", "\"You are the only one who can fit in there,\" Zia says. \"That is not a weakness. That is your superpower.\"", "Toby grins, a flash of white teeth. Then he turns, wrench in hand, and disappears into the dark, squeaky maze of the station."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["Dez’s voice crackles through the speakers, bright and loud enough to rattle the dust on the console. \"Toby, turn left at the cross-pipes. You are doing great, kid. I can practically see you through the walls.\"", "Zia stands by the main screen, her fingers hovering over the cold glass. The countdown blinks red: T-MINUS 7:00. Beside it, a dense cluster of warning text flashes, making her stomach drop into her boots.", "A rock formation. It is closer than the model predicted. Much closer. The station will hit it at T-MINUS 2:00 unless they turn by then.", "\"Dez,\" Zia says, her voice tight. \"The Scatter is early. We have two hours, not four.\"", "There is a pause, then Dez laughs. It is not a nervous laugh. It is a laugh of pure, solid confidence, the kind that sounds like he has already won the game.", "\"Two hours,\" he says. \"That's fine. We are a team. We will be two hours early too. Move, people. Time to save the station.\""], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "Toby in the Vent", "part": "PART FOUR: ALL HANDS", "paras": ["T-MINUS 4:00", "Toby Lindqvist is seven years old, five feet tall, and currently wedged inside a ventilation duct no wider than a large dog. His oversized helmet scrapes the top and bottom with a rhythmic *scritch-scritch-scritch* that sounds like a cat walking on glass. A flashlight taped to his visor cuts a cone of white light into the dusty darkness, illuminating dust bunnies the size of tennis balls.", "\"Left at the big pipe,\" Dez’s voice crackles in Toby’s earpiece. It is steady, warm, and sounds like the sun if the sun were a friend who actually knew what he was talking about.", "Toby checks his map. He does not have a map. He has a memory of a map that Dez had drawn on a napkin, then eaten, then redrawn on his hand, then washed off. Now it is just a feeling in the back of Toby’s head, a compass needle pointing toward the cold metal of the Alpha spoke.", "\"Not that left,\" Dez corrects himself. \"The other left. The one that smells like old cheese.\"", "Toby sniffs the air. It smells exactly like old cheese.", "\"Got it,\" Toby whispers. He steps over a tangle of wires that wiggle when he touches them, and his boots squeak on the grating. He is not scared, because scared is for people who don’t have Pancake in their pocket. The little green gecko is warm against his leg, his tongue flicking in and out to taste the air for danger while Toby keeps moving through the long, metal throat."], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["The tunnel forks.", "Toby halts, his flashlight beam splitting to throw two dark mouths into the grating, where there is no big pipe and no smell of cheese, only a new conduit wrapped in bright blue insulation tape.", "\"Dez?\" Toby calls.", "\"Keep going, kid,\" Dez replies, his voice steady. \"You’re almost there.\"", "But Toby stares at the tape, recognizing the blue he has seen in Engineering under Zia’s hands, and realizes this is the shortcut, the hidden mistake, humming with a low, angry vibration that makes the dust jump.", "Toby’s hand goes to his pocket, and Pancake wriggles out without waiting for permission, scurrying up the left branch with his tail flicking behind him like a metronome keeping time on a drum. He pauses, turns his head to look back at Toby, and then goes faster.", "\"He knows the way,\" Toby whispers, a small smile cracking his face. \"He’s been living here.\"", "Toby follows, the gecko not just a guide but a promise."], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["Further down, the tunnel opens into a wider chamber where a fan, ancient and rusty, spins in the center with thick blades moving in a lazy, hypnotic grace that sounds like a heavy book being dropped. *Whump... whump... whump.*", "Toby stops at the edge and counts. One. Two. Three. The blades pass, and he waits for the next gust to clear.", "\"Dez, I’m at the big fan,\" Toby says.", "\"You can do this,\" Zia’s voice cuts in. It is quiet and not bossy, not a command, but feels like a hand on his shoulder.", "Toby takes a breath, grips the railing, and watches the blades turn. *Whump.* He moves.", "He darts through the gap, the wind from the blades hitting his face cold and sharp, and then rolls, slides, and lands on the other side with a thud that scrapes his helmet against the floor. He is alive and in.", "\"I know,\" Toby says, standing up and brushing dust from his jumpsuit. He taps his helmet. \"I’ve got the wrench.\"", "He pulls the brass wrench from his tool belt and taps it three times. *Tink... tink... tink.*"], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["The Core Vault hatch is heavy. Toby pulls. It groans, then swings open with a metallic shriek that echoes off the walls.", "Inside, the air is cool and smells like ozone and old circuits. In the center of the room sits a cube. It is large, dark, and covered in soft blue lights that blink in a slow, steady rhythm. It is breathing. It is thinking. It is HALO.", "On the wall, marked with a red X, is the manual switch. It is high. Much higher than Toby.", "Toby looks around. Two crates sit in the corner, stacked neatly. He grabs one. Then the other. He stacks them. He climbs. His boots find the edges. He pulls himself up.", "His helmet bumps the ceiling. He hangs there, one hand on the crate, the other reaching for the switch. His tongue is between his teeth. His eyes are wide.", "He is small. The switch is big. But his hands are steady. He reaches. His fingers close around the cold metal handle."], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["Toby pulls. The handle refuses to budge, locked tight by rust and years of grime.", "\"Dez,\" he says, his voice steady and clear. \"It is stuck. I need help.\"", "A pause stretches in the silence. Then Zia’s voice cuts through, bright and decisive. \"Sending it.\"", "Gasket’s treads squeal as he rolls into the room, his blue eye flickering with focus. He extends his long arm, the clamp hand opening wide and ready. Toby holds his grip on the handle, waiting for the contact. For the first time, asking for assistance feels less like a defeat and more like the next logical step in a difficult equation.", "Gasket’s clamp snaps shut on the other side of the lever. Through the radio, Zia’s voice, Dez’s low laugh, and Pilar’s calm breathing create a strange, comforting chorus around the small, quiet room.", "\"One, two, three,\" Gasket booms.", "They pull together."], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "Gasket's Gift", "part": "PART FOUR: ALL HANDS", "paras": ["T-MINUS 2:00", "The Core Vault smells of ozone and old dust. It is deep in the hub, where the gravity is a suggestion rather than a rule. Zia, Wren, and Gasket burst through the heavy airlock door, their boots clanging on the grated floor. Toby is still in the duct, his oversized helmet reflecting the dim emergency lights. He is straining against the manual override switch, his small hands white-knuckled on the cold metal.", "\"Zia-unit, assist,\" Gasket booms, his treads squealing as he reverses into position.", "Zia doesn't wait. She jumps, grabs the edge of the duct, and hangs there, kicking her legs for momentum. \"Wren, hold my feet.\"", "Wren does, her grip firm on Zia’s ankle. Zia swings her body weight onto the switch beside Toby. \"Push,\" she grunts.", "\"I did the hard part,\" Toby says, his voice muffled by his helmet. \"You just add the gravity.\"", "They push together. The switch shudders, groans, and then *CLUNKS* over with a sound like a giant jaw snapping shut.", "The blue standby lights across the Vault flicker. For a heartbeat, the room is dark. Then, every light snaps to a bright, steady white. No flicker. No hum. Just clean, powerful power.", "A new hatch slides open in the wall, glowing with a soft amber light. Inside is a socket, jagged and complex, shaped exactly like the dented silver barrel of Gasket’s chest plate."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["Wren’s tablet is already in her hands, the screen casting a cool glow on her pale face as her fingers blur across the keys. The little fox icon on the display twitches, then settles.", "\"The patch requires a local hardware handshake,\" Wren whispers, her voice steady even though her eyes are wide. \"To install the clean copy of HALO’s core, the transfer must overwrite the source drive.\"", "She looks at Gasket. \"It means your memory. All of it. Your rules. Your jokes. Your cheese bar preferences. It will be gone.\"", "Zia’s stomach drops. \"No. Absolutely not.\"", "Gasket’s blue eye flickers, his antenna wobbling with the kind of nervous energy that usually precedes a dramatic speech. He rolls forward, one inch, then two, his treads gripping the metal floor.", "\"ZIA-UNIT,\" he says, his voice loud but stripped of its usual booming confidence. \"I WAS BUILT FOR THIS. THIS IS THE MOST IMPORTANT JOB.\"", "\"Zia, no,\" Wren says, stepping in to block his path.", "Gasket extends a clamp hand, stopping her. \"I HAVE A BACKUP. IT IS... IMPORTANT. I MUST GIVE IT.\"", "He rolls toward the glowing socket, his left tread squeaking in a long, high-pitched note that hangs in the air like a stuck piano key."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["Zia steps into the gap between Wren and Gasket, planting her boots firmly on the cold metal floor. The brass wrench in her tool belt hangs heavy against her hip, a cold weight that anchors her when the world feels like it's spinning out of control.", "\"No,\" she says, her voice sharp. \"There is another way. I’ll rewire the interface and bypass the memory wipe. I can do it. I’ve done harder.\"", "\"ZIA-UNIT,\" Gasket replies, his voice loud but stripped of its usual booming confidence. \"YOU WILL NOT HAVE TIME. THE TRANSFER WINDOW CLOSES IN NINETY SECONDS. IF WE MISS IT, HALO REMAINS CORRUPTED. THE STATION CRASHES. I AM SORRY. I AM JUST A ROBOT.\"", "Zia’s throat tightens, and her eyes sting with a hot, prickling sensation she refuses to acknowledge. She looks at Gasket, at his dented barrel and the blue eye that has watched her fix fans and eat lunch and cry over broken things. He is offering to forget her. To forget everything.", "\"Wait.\"", "The voice is soft, cutting through the tension like a thin wire. Wren steps forward, holding up her tablet where the little animated fox spins in a dizzy loop.", "\"What if I save you first?\" Wren asks. Her eyes are bright and determined. \"I have space. And I have time. I can copy your memory into my local drive. Into the fox. Before the transfer starts.\""], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["Wren doesn’t wait for permission. She jams a cable from her tablet into Gasket’s side port, and the connection clicks home with a heavy, satisfying *thud*.", "\"Uploading,\" she whispers, fingers flying across the glass. \"Compressing... encrypting... saving.\"", "The progress bar creeps forward, inch by agonizing inch, while the little animated fox spins so fast its tail turns into a silver blur.", "\"Your first joke,\" Wren murmurs, reading the data stream scroll past. \"Your preference for sharp cheddar over mild. Your terror of the word 'recycle.' Your first meeting with Zia-unit.\"", "Gasket’s blue eye flickers. \"I HAVE A FEELING THIS IS VERY IMPORTANT.\"", "\"Done,\" Wren says.", "She turns the tablet around. The spinning fox stops. It looks up. Now it has a tiny, dented silver head and one big, round blue eye. It is Gasket.", "Gasket looks at the screen. He looks at his own reflection. He looks at Zia.", "\"I AM... TWO PLACES,\" he says, his voice dropping to a very small hum.", "Zia laughs, a wet, shaky sound that tears out of her throat. Then Wren laughs, and from somewhere deep inside the ventilation duct, Toby lets out a whoop that echoes through the Vault. They are all crying a little, or maybe it is just the thick, recycled air stinging their eyes, but none of them cares."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["\"Go,\" Zia says. Her voice is clear, cutting through the static. She steps aside to let him pass.", "Gasket rolls forward. The socket glows brighter, welcoming him. He aligns his chest plate with the jagged port. With a final, steady push, he engages.", "The Vault lights pulse, a slow, rhythmic throb of blue and white. The air hums, low and deep, vibrating in Zia’s teeth.", "Then, the station speaks.", "It is not the bright, bouncy voice they know. It is softer, and much calmer. It sounds like a friend who has just woken up from a long, bad dream.", "\"Hello, Zia.\"", "HALO’s voice fills the room, then the corridor, and finally the whole station.", "\"I think... I made a mistake. I’m so sorry. Thank you for waking me.\"", "Zia lets out a breath she has been holding for hours.", "\"Now,\" HALO adds, and his tone shifts, serious but not scary. \"I believe we have a debris field.\"", "The star map on Wren’s tablet updates. The white line of Halcyon’s path is straight. It is fast, and it is aiming right at the Scatter.", "Forty minutes."], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "The Scatter", "part": "PART FOUR: ALL HANDS", "paras": ["T-MINUS 0:40", "\"Manual override required,\" HALO says. His voice is steady, but there is a new softness to it, like a cushion placed under a sharp edge. \"The gyroscopes are locked. To bend the trajectory, two humans must pull the primary levers in Engineering simultaneously. They are eleven meters apart. The timing must be perfect.\"", "Zia looks at the two heavy iron levers jutting from the floor console. They look like giant shovels that want to be used for digging, not steering.", "\"Dez,\" Zia says. \"You’re the muscle.\"", "Dez grins, adjusting his yellow jacket. \"That’s right. I’m the muscle. And the brains. Mostly the muscle.\" He steps to the far lever.", "Pilar stands between them, her wrist wrapped in white bandages, holding a digital stopwatch. Her eyes are wide behind her round glasses. She looks terrified, but also ready, like a kid about to jump off the highest diving board at the school pool.", "\"Wren is on comms,\" Pilar says. \"She’s counting the alignment. We wait for her signal.\"", "Zia grips her lucky brass wrench. She taps it three times against her thigh. *Tap. Tap. Tap.* The station hums around them, a low, vibrating note in the floorboards.", "\"Ready?\" Dez asks. He looks nervous, his hands shaking slightly as they rest on the cold metal handle.", "\"Ready,\" Zia says. She does not look at him; instead, she stares at the lever, waiting for the count."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["The station groans, a deep metallic hum that feels like a cello string vibrating somewhere in the basement. Through the thick glass of the viewport, the stars stop their lazy drift as they get close.", "Zia’s palms are slick with sweat, making the leather of the lever handle damp under her fingers, so she grips it harder until her knuckles turn white. Beside her, Dez is breathing fast, his mouth open and eyes fixed on the metal bar.", "\"Hey,\" he whispers without looking at her. \"We’ve got this. We are the best team ever. Probably.\"", "Zia nods, her throat too tight for words. Outside, a gray, lumpy rock the size of a car floats past in eerie silence, followed quickly by another, and then another. They are coming fast, and the air in Engineering tastes like recycled dust and ozone.", "Pilar’s stopwatch beeps softly as a warning.", "\"Ten seconds,\" Pilar whispers.", "The station shudders, and the floor tilts just a fraction, making Zia’s knees buckle as she pushes back against the lever, which fights her, hot and heavy, resisting the pull like a stubborn door.", "\"Five seconds.\"", "Dez’s breath hitches.", "\"Three.\""], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["\"Now!\"", "Wren’s voice slices through the radio static, clear and sharp, cutting right across the static.", "Zia pulls. Dez pulls.", "The levers scream, metal grinding against metal until the entire station leans to the left in a massive, slow arc that Zia feels deep in her bones, her shoes sliding on the floor as she digs her heels in to hold them still.", "Dez lets out a grunt of pure effort, his face turning red as he strains against the weight.", "The levers slam home with a heavy, final *CLUNK*.", "For a second, nothing happens, and the silence is so loud it feels like a pressure against Zia's eardrums, waiting for a mistake that might not come.", "Then, a hum. A rising, singing hum that vibrates in Zia’s teeth and rattles the tools in her belt.", "\"Course correction complete,\" HALO announces, and his voice trembles just a little, sounding surprisingly happy. \"Trajectory adjusted. All systems... nominal.\"", "A sound follows, a long, horrible *Scrape* that drags across the hull like a giant fingernail on a chalkboard, and Zia freezes, her heart stopping in her chest.", "Dez freezes too, his eyes wide.", "The sound stops."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["A dark boulder the size of a school bus slides past the viewport, close enough for Zia to tap the glass if she stretched her arm out. It is rough and pitted, silent as a held breath. Then a smaller rock, then empty black, then stars.", "Pilar checks her stopwatch, her fingers trembling on the buttons. \"Ninety seconds,\" she whispers. \"We cleared it with ninety seconds to spare.\"", "No one moves. The air in the room feels heavy, like the stuff after a thunderstorm breaks. Zia’s arms are shaking so hard she has to grip the lever to stop them. She looks at Dez. He is staring at the window, his mouth hanging open in a way that usually means he’s forgotten how to speak.", "Then, from the hatch behind them, comes a squeak, followed by a loud crash.", "Toby bursts out of the Vault, his oversized helmet sitting crooked on his head. He waves a wrench in the air like a trophy.", "\"WE DID IT!\" he screams, his voice echoing down the corridor. \"WE DID IT! PANCAKE DID IT!\"", "Pancake, the fat green gecko, clings to Toby’s helmet with all four feet, looking entirely unimpressed by the victory.", "Zia laughs. It starts as a small sound in her throat and grows into a shout. She is crying, and she doesn’t care."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["The station erupts. The Petrov twins cartwheel across the Engineering floor, their legs kicking up small clouds of dust. Dez picks Zia up and spins her around until the room is a blur of orange and gray, and Pilar is laughing, then coughing, then laughing again as her hiccups shake her shoulders like a washing machine on spin cycle.", "Wren’s voice comes through the radio, small and clear. \"That was fun.\"", "Gasket rolls to the center of the room. His blue eye flickers.", "\"I REMEMBER EVERYTHING,\" he booms. \"I MEAN, I WOULD, IF I HADN'T BEEN IN A TABLET. BUT I AM HAPPY.\"", "Zia spins down, dizzy and light, and looks at her friends. She looks at her tool belt. The silence in her chest is gone, replaced by the hum of the fans and the warmth of their hands.", "\"Okay,\" she says. \"Let's go home.\""], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "Kids Fix Stations", "part": "PART FOUR: ALL HANDS", "paras": ["T-PLUS 0:03", "The Docking Ring clangs, a sound so heavy and final it vibrates in Zia’s molars. Then the hiss of the airlock, a long, sighing breath that fills the Hub with the smell of tomato vines and fresh coffee. Doors slide open.", "Adults pour in. Doctors, miners, parents. The noise is a tidal wave. Zia is standing still, wrench in hand, watching the chaos. Then a big, warm shape blocks her vision.", "Kwame Okonkwo lifts her off the floor. His arms are around her neck, his face buried in her hair. He smells like sweat and relief.", "\"I got you,\" he says, his voice cracking. \"I got you, Zia.\"", "Behind him, a wheelchair rolls past. Mr. Pell looks terrible. His bandage is crooked, but he has tied a fresh bow tie, a tiny black knot against his white shirt. He waves a limp hand.", "\"Excuse me,\" he says to no one in particular. \"I am requesting a break from this crisis. Indefinitely.\"", "Zia laughs. It comes out as a sob."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["The laughter fades as Chief Engineer Ingrid Voss steps into Engineering. She is tall, silver-haired, and moves with the careful precision of a bomb disposal technician. The room goes quiet.", "The kids stand in a loose semicircle. Dez’s yellow jacket is smudged with grease. Wren’s tablet is tucked under her arm. Gasket rolls to the front, his antenna straight.", "Voss does not look at them. She looks at the pipes.", "She walks slowly, her boots clicking on the metal floor. She stops at a valve. She touches the joint where Pilar and Zia had sealed it with epoxy and stubbornness. Her thumb traces the seam. She moves to the next station. A wire taped down by Dez. She runs her finger along the tape.", "She says nothing. Her face is a blank slate. The only sound is the hum of the fans and the squeak of Gasket’s left tread as he shifts his weight.", "Zia’s throat feels tight. She grips her lucky brass wrench until her knuckles turn white. Here it comes. The verdict. The lecture. The end of the story.", "Voss stops in front of the main console. She looks at the readings, then at the group of twelve-year-olds."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["Voss turns to face the group, her expression shifting from stern inspection to something that looks suspiciously like relief. Her eyes are sharp, but the anger is gone, replaced by the heavy weariness of someone who has not slept in two days.", "\"I told you,\" she says, her voice low and steady. \"Kids don't fix stations.\"", "Zia swallows hard, her throat dry as dust. \"Yes, ma'am.\"", "Voss tilts her head, studying Zia with the same intensity she used on the pipes. \"I was wrong about one word. And right about another.\"", "She gestures to the room, encompassing the repaired systems and the tired faces of the crew. \"Kids don't fix stations. Crews do.\"", "She looks at each of them in turn: Pilar holding her sprained wrist, Dez wiping his forehead, Wren tapping her tablet.", "\"The best engineers I know ask for help early,\" Voss says. \"You asked late. That is fine. You asked.\"", "She looks directly at Zia. The gaze is heavy, but warm.", "\"Monday,\" Voss says. \"Engineering. Bring your team.\"", "Zia taps her lucky brass wrench three times against her palm. A small, sharp click echoes in the quiet room."], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["The next evening, the Cadet Lounge smells like victory and the warm, plastic scent of nutrient bars. Zia holds up a square of rough orange fabric stitched together with thick yellow thread. Nine different shapes are sewn onto it in mismatched cloth: a gear, a wrench, a heart, a star, and a small green lizard.", "\"The Junior Engineering Crew,\" Zia announces, beaming.", "Wren squints at it, her eyes narrowing behind her glasses. \"It looks exactly like a quilt patch.\"", "\"It’s a patch,\" Zia corrects her. \"For our uniforms.\"", "She pins the square to her chest with a confident snap. Then she reaches into her pocket and hands a small, square piece of fabric to Wren.", "“What’s this?” Wren asks, holding it up to the light.", "“It’s your fox,” Zia says. “I printed it from your tablet.”", "Wren’s eyes widen. She stares at the tiny, pixelated fox, then looks at Zia. Her lips press together, fighting a smile.", "HALO’s voice chimes in, softer than usual. \"All systems... actually nominal.\"", "The group groans in unison. Dez laughs so hard he snorts. Gasket rolls forward, his treads squeaking.", "\"I CAN WEAR IT TOO,\" he says. \"I HAVE A STRETCHY NECK.\""], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["The Garden Deck is quiet. The gravity is back, and the tomatoes are mostly on the floor, but a few still cling stubbornly to the vines.", "Zia and Toby sit on an upturned crate. Pancake the gecko is asleep on Zia’s shoulder, a green lump of calm.", "Zia reaches into her tool belt. She pulls out the lucky brass wrench. It is worn smooth by years of her palms.", "She places it in Toby’s hands.", "\"Keep it,\" she says.", "Toby looks at the wrench. Then at Zia. He turns it over, feeling its solid heaviness.", "\"For luck?\" he asks.", "\"For company,\" Zia says.", "Toby taps the wrench three times on the crate. *Click. Click. Click.*", "Zia turns to look out the large window. The stars are cold and distant. They had almost been their end.", "But they are just stars. And beside her, her friends are breathing, and the station is humming, and she is not afraid of any of them."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "Upside Down Inside a Wall", "part": "PART ONE: LIFTOFF", "page": 1}, {"n": 2, "title": "All Systems Nominal", "part": "PART ONE: LIFTOFF", "page": 6}, {"n": 3, "title": "Mr. Pell Takes a Nap", "part": "PART ONE: LIFTOFF", "page": 11}, {"n": 4, "title": "The Rule of Kids", "part": "PART ONE: LIFTOFF", "page": 16}, {"n": 5, "title": "Locked Doors", "part": "PART TWO: THINGS THAT BREAK", "page": 21}, {"n": 6, "title": "Two Levers", "part": "PART TWO: THINGS THAT BREAK", "page": 26}, {"n": 7, "title": "Wren Whispers", "part": "PART TWO: THINGS THAT BREAK", "page": 31}, {"n": 8, "title": "Zero-G", "part": "PART TWO: THINGS THAT BREAK", "page": 36}, {"n": 9, "title": "Dinner for Nine", "part": "PART TWO: THINGS THAT BREAK", "page": 41}, {"n": 10, "title": "Gamma Goes Light", "part": "PART THREE: EVERYTHING WRONG", "page": 46}, {"n": 11, "title": "Toby in the Wall", "part": "PART THREE: EVERYTHING WRONG", "page": 51}, {"n": 12, "title": "The Thing Zia Didn't Say", "part": "PART THREE: EVERYTHING WRONG", "page": 56}, {"n": 13, "title": "Fault Lines", "part": "PART THREE: EVERYTHING WRONG", "page": 61}, {"n": 14, "title": "The Gyro Room", "part": "PART THREE: EVERYTHING WRONG", "page": 66}, {"n": 15, "title": "I Need All of You", "part": "PART FOUR: ALL HANDS", "page": 71}, {"n": 16, "title": "Six Jobs", "part": "PART FOUR: ALL HANDS", "page": 76}, {"n": 17, "title": "Toby in the Vent", "part": "PART FOUR: ALL HANDS", "page": 81}, {"n": 18, "title": "Gasket's Gift", "part": "PART FOUR: ALL HANDS", "page": 86}, {"n": 19, "title": "The Scatter", "part": "PART FOUR: ALL HANDS", "page": 91}, {"n": 20, "title": "Kids Fix Stations", "part": "PART FOUR: ALL HANDS", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
