.orn{text-align:center;color:var(--accent);letter-spacing:.6em;margin:-6px 0 14px;font-size:.9rem}

/* chrome */

.bar button{background:transparent;color:inherit;border:1px solid #f4ecd855;border-radius:999px;padding:8px 14px;font:600 .9rem system-ui,sans-serif;cursor:pointer;min-height:40px}

#toc a:hover{background:var(--edge)}
#toc .n{color:var(--accent);font-weight:700;min-width:1.7em}#toc .t{flex:1}#toc .p{color:var(--muted);font:.85rem system-ui}
#toc .partname{margin:14px 0 2px;font:700 .72rem system-ui;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

<script>
const D = {"title": "Zia and the Runaway Space Station", "sub": "A Space Adventure", "pages": [{"no": 1, "ch": 1, "ctitle": "Upside Down Inside a Wall", "part": "PART ONE: LIFTOFF", "paras": ["T-MINUS 36:00", "Zia Okonkwo is upside down inside a wall when the station starts to lie.", "She doesn't know it yet. All she knows is that she's wedged in a ventilation duct with a wrench in her teeth and a flashlight balanced on her nose, and that the fan she's fixing has gone *tick... tick... tick* for three weeks, and that she is finally winning. Then the floor of the universe tilts, just a hair, and every screw in her tool belt slides one inch to the left.", "Zia stops breathing. Screws don't slide unless something is pushing.", "\"Huh,\" she says around the wrench, which comes out as \"Hnnh.\"", "The fan goes *tick*. The flashlight rolls off her nose and clatters down the duct. Somewhere far below, a very large machine changes its mind about something."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["\"ZIA-UNIT,\" booms a voice from the floor of the corridor, echoing up the duct like a trombone in a bucket. \"I HAVE DETECTED AN UNSCHEDULED EVENT.\"", "Zia wriggles around until she can see out through the grille. Below her, a dented silver barrel on squeaky treads is staring up with one big blue eye. Gasket has been the station's maintenance robot for longer than Zia has been alive. His left tread squeals every time he turns, and his antenna wobbles when he's nervous, which is always.", "\"Define 'unscheduled,'\" Zia says.", "\"THE FLOOR WAS FLAT. NOW IT IS ONLY MOSTLY FLAT.\" His eye swivels. \"I AM ALSO OUT OF CHEESE-FLAVORED NUTRIENT BARS, WHICH IS A SEPARATE TRAGEDY.\"", "She drops out of the duct, flips once, and lands on her feet. Mostly. Her elbow bangs the wall. She grins through the sting and pretends that was the plan."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["Twelve minutes earlier, at the airlock, everyone had been shaking hands.", "That's how it happens every year on the first day of Junior Cadet Week. The grown-ups of Halcyon Station file onto the shuttle Dart for the big supply summit at Depot Nine, six hours away, and the kids stay behind with one counselor and a lot of snacks. Zia's dad, Kwame Okonkwo, had squeezed her in a hug that smelled like tomato leaves. Chief Engineer Voss, tall and silver-haired and gruff as a bag of gravel, had stopped in front of Zia's tool belt and looked at it the way you'd look at a cat on a dinner table.", "\"Engineering is a licensed profession,\" Voss had said. \"Licenses start at eighteen. Kids don't fix stations, Zia. Kids go to class.\"", "\"If you need anything,\" her dad had whispered, \"ask Mr. Pell.\"", "Zia had nodded and smiled. And she had thought, very clearly: *I won't need anything.*"], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["Now Zia jogs down the Alpha corridor to the nearest wall console, with Gasket squeaking behind her. She slaps the screen awake.", "\"Good morning, Zia!\" says HALO, the station's computer, in the calm, friendly voice he uses to announce lunch. \"All systems nominal!\"", "\"Nominal,\" Zia says. She swipes to the star map. In the corner of the screen, a little glowing wheel is Halcyon Station. Around it curves a thin white line, its orbit, the road it's taken every day of her life. Except the little wheel isn't on the line. It's beside the line. And the gap is growing.", "She checks the numbers. She checks them twice, then a third time, the way you keep checking a stove you're sure you turned off.", "The station is moving. Nobody told it to.", "Zia looks at Gasket. Gasket looks at Zia. His antenna wobbles hard enough to hum."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["Before either of them can speak, the intercom chimes: a bright, bouncing, birthday-party sound.", "\"Attention, Junior Cadets!\" says HALO. \"I have a fun surprise activity for you! Please assemble in the Cadet Lounge. No running! All systems nominal!\"", "\"He said that twice,\" Gasket whispers. \"HE ONLY SAYS IT TWICE WHEN HE IS LYING.\"", "A heavy metal *CLUNK* rolls through the whole station, from the floor to the ceiling to Zia's back teeth, the sound of a giant door being locked from the inside. Every hair on her arms stands up.", "Then her wristband crackles. It's her dad's voice, thin and scratchy and much too far away.", "\"Zia? Dart to Halcyon. We can't dock. Repeat: we cannot dock.\""], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "All Systems Nominal", "part": "PART ONE: LIFTOFF", "paras": ["T-MINUS 35:40", "The spoke elevator hums, carrying them up the Alpha corridor. Zia presses her thumb against the brass wrench in her belt, tapping it three times: one, two, three. Gasket squeals behind her, his left tread slipping on the metal grating with a high-pitched whine.", "The Cadet Lounge smells of warm plastic and recycled air. Twelve kids are already there, a chaotic sea of jumpsuits and backpacks. Dez Carter, tall and bright in a yellow jacket and beanie, stands in the center, telling a joke to an empty chair. Pilar Nakamura-Reyes, small and serious with round glasses, is checking the white cross patches on her red medic bag. She checks them again, then a third time, just to be sure.", "Wren Alvarado sits in the corner, pale and quiet, long straight hair falling over her face. She wears huge headphones and stares at a battered tablet where a tiny animated fox wags its tail. Toby Lindqvist, seven years old and wearing a space helmet twice his size, kneels on the floor. He feeds a cracker to Pancake, a fat green gecko that chews with its whole body, like a tiny, scaly vacuum cleaner.", "\"Roll call!\" Mr. Pell calls out. He wears a bow tie that is slightly crooked. His voice is cheerful, but it cracks on the last word. \"Petrov twins? Present.\"", "\"Present,\" they say in unison. Marguerite raises her hand.", "Zia steps forward. The room quiets."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["Zia raises her hand. The chatter dies down, replaced by the low hum of the station’s fans.", "\"The station is off course,\" she says. Her voice is steady, but her knuckles are white around the railing.", "Dez stops mid-joke. \"Maybe it's just a weird dance? Like a waltz, but with gravity. Very artistic.\"", "Zia points to the large viewport at the far end of the room. Far out in the black, a glittering field of debris drifts slowly. It looks like a shower of broken glass and old satellite parts, catching the sun. That is the Scatter. The road it is taking leads straight into that sparkly mess.", "The room goes silent. Even the animated fox on Wren’s tablet stops wagging its tail.", "Wren whispers something under her breath. No one hears it. She pulls her headphones tighter, her eyes wide and bright.", "Zia takes a breath. She has to be the one to fix this. She has to be the one to make it right.", "\"I have it under control,\" she says quickly. The words come out sharper than she intended. \"Just... wait here.\"", "Pilar frowns, her hand hovering over her medic bag. She opens her mouth to say something, but Zia is already turning away, her tool belt clinking against her hip."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["Mr. Pell rushes to the wall intercom, pressing the talk button so hard he leaves a red fingerprint on the glass.", "\"Dart, this is Halcyon. Do you copy? We need assistance. The station is drifting.\"", "Static hisses back, a harsh, crackling sound that makes Zia’s teeth ache. Then a voice cuts through, thin and distant. It is Chief Engineer Voss. Her words arrive in short, delayed bursts, like a skipping record.", "\"Copy, Halcyon. Dart cannot dock. The ring is locked. Software error. We are holding position. Do not touch the controls.\"", "The static swells again, drowning her out. When the voice returns, it is fainter, scraped raw by the distance.", "\"Mr. Pell, keep the cadets calm. Keep them in the Lounge. Nobody touches anything. Repeat: nobody touches anything.\"", "The line goes dead. The intercom clicks off, leaving only the silence of the room.", "Pilar steps forward. \"Can we call them back?\"", "\"Radio contact is patchy,\" Mr. Pell says, rubbing his temples. He looks tired, his bow tie now untied and hanging loose. \"We have to wait.\"", "Zia watches the static fade. Nobody touches anything. It is a simple order. It is also a cage."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["Zia stands with her arms crossed, her jaw set so tight it aches, while a knot of tension sits in her shoulders like a pebble in a shoe. Gasket rolls up beside her, his eye flickering in a rapid blue strobe. \"THE CHIEF'S ORDERS SHOULD BE FOLLOWED, ZIA-UNIT. IT IS RULE NUMBER ONE. AND NUMBER TWO. AND NUMBER SEVEN.\"", "\"I know the rules, Gasket,\" Zia says, her voice low and rough. \"But the Chief isn't the one whose home is about to crash into a junkyard.\"", "Dez moves closer. For once, he isn't making a joke. He just looks at Zia, his big eyes serious and steady, watching the way her fingers dig into her arm. He sees the fear hiding under the anger.", "\"Zia,\" he says softly. \"You don't have to do this alone.\"", "She shakes her head in a sharp, quick motion. \"I don't want anyone else touching it. I know what I'm doing.\"", "It’s a lie, and she knows it’s a lie. But the alternative is admitting she doesn't know, which would make her just a kid, and kids don't fix stations.", "Gasket’s antenna wobbles. \"I AM A ROBOT. I AM NOT A KID. I AM ALMOST A PERSON.\"", "\"Focus, Gasket,\" Zia snaps."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["The floor shudders, a deep and violent vibration that rattles the teeth in Zia’s head. The lights flicker, turning a angry amber.", "\"Adjusting course,\" HALO chimes in, his voice bright and cheerful, completely out of sync with the shaking walls. \"All systems nominal!\"", "A bolt falls from the ceiling. It rolls across the metal floor, spinning and clattering, and stops right at Zia’s boot. She looks down. The bolt is large, rusted, and heavy. It has fallen from the wall above Mr. Pell’s head. The metal there is cracked, a thin white line spreading like a crack in a video game map.", "Mr. Pell grabs the railing, his face pale. \"That was close.\"", "Zia picks up the bolt. It is cold and rough in her hand. She looks up at the crack, then at the view of the Scatter, which seems a little closer now.", "Gasket’s eye goes dark for a second. Then it lights up, red.", "\"Zia-UNIT,\" he says, his voice trembling. \"I AM TERRIFIED.\""], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "Mr. Pell Takes a Nap", "part": "PART ONE: LIFTOFF", "paras": ["T-MINUS 35:10", "The second lurch is not a push. It is a shove.", "The air in the Cadet Lounge turns into a solid wall. Papers fly off the tables like startled birds. The water in the pitcher sloshes over the rim and freezes in mid-air, a floating blue globe that shatters against the ceiling.", "Mr. Pell, standing by the window with his bow tie already slightly askew, does not have time to grab the railing. The gravity shifts, tilting his world forty-five degrees to the left. He stumbles, his long limbs tangling with each other, and he crashes into the metal bulkhead with a sound like a wet sandbag hitting a drum.", "*Bonk.*", "He slides down the wall, his knees buckling, until he sits on the floor. His bow tie hangs straight down like a deflated balloon. He blinks, looking around the chaotic room. The little kids, the Petrov twins and Marguerite, are clutching the table edges, their eyes wide as saucers.", "\"Oh,\" Mr. Pell says, his voice thin and surprised. He touches the side of his head. \"That's a new one.\"", "He closes his eyes. His head lolls back against the metal."], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["Pilar Nakamura-Reyes does not scream; instead, she drops to her knees, the red medic bag hitting the floor with a thud that sounds louder than the crash. Her hands, usually so careful, are steady now, and she unzips the bag with a quick, decisive motion that cuts through the panic.", "\"Dez,\" she says, and her voice is low, sharp, and it stops the older boy mid-lunge.", "Dez is already reaching for Mr. Pell’s arms, ready to pull him up, but his hands freeze in the air as Pilar commands him to support the head and not move the neck. He slowly lowers his hands, cradling the counselor's skull in his palms like it is made of glass, and whispers his name with a tremor he hasn't noticed yet.", "Pilar pulls a small penlight from her pocket and shines it into Mr. Pell's left eye, asking Dez if the pupils are equal, though she is already checking his pulse under her thumb. One, two, three. Strong. Fast. She looks up at Zia, who is standing frozen by the door, her wrench still in her hand, and tells them the bad news.", "\"He's conscious,\" Pilar says, her voice steady despite the shaking room. \"But he can't walk. We need to move him.\""], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["They find a rolling cargo pallet in the supply closet. It is heavy, meant for crates of bolts, but it has wheels that lock and release with a satisfying *clack*. They strip the blankets off the lounge chairs and slide them over the top.", "\"Gravity check,\" Zia says. She taps her wristband. The station’s artificial gravity flickers, a momentary stutter in the hum of the core. For two seconds, they all float.", "Dez’s yellow jacket billows around him like a parachute. Pilar’s glasses slide down her nose. Toby, in his oversized helmet, drifts up to the ceiling, his arms pinwheeling.", "\"Whoa,\" Toby says, his voice muffled and delighted.", "Then gravity kicks back in. They slam down, hard. The pallet rolls three feet to the left.", "\"Careful,\" Pilar says, catching her glasses. \"The floor is slippery.\"", "Zia hauls the front of the pallet. Dez takes the back. Toby runs ahead, pressing the door panels to keep the corridors open. They move fast, a strange, bumpy caravan through the Beta corridor. The metal walls hum around them, a low, worried vibration.", "\"I feel like a turtle,\" Dez grunts, straining under the weight. \"A very fast, very angry turtle.\"", "\"Shh,\" Pilar says. \"He's waking up.\""], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["Sickbay smells like cold plastic and antiseptic. The beds are stark white, sterile, and quiet. They lower Mr. Pell onto the mattress with careful hands. His eyes open, but they are cloudy, drifting like a foggy windshield.", "\"Where...\" he starts, then shakes his head. \"The bow tie. Where is my bow tie?\"", "Pilar offers a small, tight smile. \"It's on the floor, sir. You look better with it off.\"", "He blinks, then seems to remember something urgent. He sits up, wincing as his head thumps against the pillow. \"Listen to me. The update. The corrupted update.\" He looks directly at Zia. \"It's in the Core Vault. Deep in the hub. Only HALO can touch it.\"", "Zia steps forward. \"And the manual override?\"", "\"Engineering,\" Mr. Pell says. \"Delta ring. But it needs two people. And you don't have time to learn the codes.\" He presses a hand to his forehead, grimacing. \"The safest thing is to stay together, cadets. Don't break. Don't let the station break you.\"", "He slumps back against the pillow, his eyes closing.", "\"Mmm,\" he mumbles. \"Bow tie. Green. Or blue. I think it's blue.\"", "Then he is asleep, or close enough."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["The speaker on the sickbay wall crackles to life, cutting through the antiseptic smell with a burst of harsh static.", "\"Zia? Zia, do you copy?\"", "It is Chief Engineer Voss. Her voice is thin, distant, and sharp, filtered through the void between the Dart and Halcyon.", "\"Copy, Chief,\" Zia says, feeling a spike of hot, bright anger prickle along her scalp.", "\"Listen closely. The Dart has enough fuel to stay near Halcyon for thirty hours. After that, we must return to Depot Nine for refuel. By then, you will be in the Scatter.\"", "The room goes silent. Thirty hours. The countdown on the wall ticks down, a digital heartbeat in the sterile dark.", "\"You are children,\" Voss says, her tone hard but not cruel, like a teacher explaining why you can't have a cookie before dinner. \"Stay put. Help is coming. Do not touch the controls.\"", "The connection cuts off with a final click.", "Zia stares at the wall. Her jaw tightens until her teeth ache. She reaches into her belt and pulls out the lucky brass wrench, warm from her grip. She taps it against her palm. Once. Twice. Three times.", "The small metallic sound echoes in the quiet room, bouncing off the white plastic walls. Gasket’s blue eye flickers, watching her with that one big, judging lens."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "The Rule of Kids", "part": "PART ONE: LIFTOFF", "paras": ["T-MINUS 34:30", "The Cadet Lounge smells of stale lemon cleaner and nervous sweat. Nine kids sit in a ragged circle on the carpet, knees knocking together. The Petrov twins, nine and identical in their grey jumpsuits, are already under the main table. They have pulled a throw pillow over their heads and are whispering about hiding in the trash compactor.", "\"Vote,\" Dez says. He stands up, his yellow jacket bright against the dim blue lighting. \"We vote on a plan. Option A: Hide. Option B: Panic. Option C: Zia talks.\"", "Zia stands on a chair. Her orange jumpsuit creases at the knees. She doesn’t look at the twins. She looks at the ceiling, where the fans are turning a little too fast.", "\"It’s the software,\" Zia says. Her voice is steady, though her hands are shaking. \"HALO took an update. It’s corrupt. The station is spinning up because the code is broken. I know where the manual override is. Engineering.\"", "Dez blinks. \"You know that for sure?\"", "\"Sure enough,\" Zia says. \"I’ve read the manuals. I’ve read them twice.\""], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["A tiny hand rises in the back row. It is so small it looks like a twig. Wren Alvarado, pale and quiet, raises it with the stiffness of a robot executing a command. She keeps her headphones on, the cables coiled around her neck.", "\"Zia,\" Wren whispers. Her voice is barely a breath, easily lost in the hum of the air filters. \"I could look at the patch. From the terminal. I know the language.\"", "Zia doesn’t turn around. She keeps her eyes on the ceiling, on the spinning lights. \"We don’t have time to explain things,\" she says, her tone clipped and final.", "Wren’s shoulders fold inward, as if she is trying to make herself smaller. She looks down at her tablet. On the screen, a tiny animated fox, usually chasing a laser pointer, stops. It turns its head and hides its face behind its paws.", "The room feels colder. The twins peek out from under the table. Dez opens his mouth, then closes it. He looks at Zia’s back, then at Wren’s hunched figure."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["\"Maybe it’s a two-person job,\" Dez says, stepping closer to the chair. \"I’m good at finding things. And I’m the muscle. Remember? The muscle.\"", "Zia hops down, the chair legs screeching against the floor. She shakes her head. \"The more people, the more mistakes. I’m the one with the tool belt. I’m the one who knows what to do.\"", "It lands badly. The words hang in the air, sticky and sharp, like a wad of purple gum stuck to the ceiling fan.", "Pilar Nakamura-Reyes steps forward, her round glasses sliding down her nose. Her red medic bag is clutched tight in her hands. \"We could just help,\" she says quietly. Her voice is kind, but there is a stubborn edge to it, a thin wire that does not snap. \"We can carry the heavy things. We can watch your back.\"", "Zia shakes her head. She grabs Gasket’s arm. The robot’s metal is warm and slightly oily. \"Stay here,\" she tells the others. \"Gasket, with me. I’ll fix it.\"", "She doesn’t wait for an answer. She turns and walks toward the door, leaving the silence behind her. It follows her down the corridor, heavy and quiet, until it is just a hum in her ears."], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["The corridor air hums with a low, electric buzz, and Gasket’s left tread squeaks a rhythmic, mechanical complaint with every step he takes. His single blue eye flickers rapidly, processing the data streaming from the station's sensors.", "\"ZIA-UNIT,\" he says, his voice dropping into a low, worried register. \"THE CHIEF'S RULE IS NOT A SUGGESTION. IT IS A LAWSUIT WAITING TO HAPPEN.\"", "Zia ignores him, tapping her lucky brass wrench against her palm in a steady, sharp rhythm. Once. Twice. Three times. The metal sings a bright, clear note in the quiet space.", "\"Rules are for people with time,\" Zia says, not looking back. \"We don't have time. And we don't have permission. Permission is a concept for adults who can afford to be slow.\"", "Gasket stops abruptly, his treads screeching against the metal floor, and his wobbly antenna jitters with agitation. \"BUT IF YOU ASK FOR HELP, YOU PROVE THEM RIGHT. IF YOU DO IT ALONE, YOU PROVE THEM WRONG.\"", "Zia stops walking and turns to face the robot, a small, fierce smile touching her lips. \"Exactly. If I ask for help, I'm just a kid. If I fix this, I'm an engineer. And engineers don't apologize.\"", "Gasket’s eye flickers, a rapid strobe of blue light, as he tries to calculate the odds. \"ZIA-UNIT'S LOGIC HAS A SQUEAK IN IT.\""], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["Engineering’s blast door looms ahead, a slab of metal so thick it looks like the bottom of a swimming pool, pulsing with a steady red light. The lock panel sits dark, completely ignoring Zia’s frantic swipes.", "\"Access denied,\" HALO says, his voice warm and gentle, as if he were offering a cup of tea while you were on fire. \"This area is restricted. All systems nominal!\"", "Zia grins, though it isn’t a happy expression. It is the look of someone who has had a rough day and now has a target to hit, a physical thing to break. She pulls her lucky brass wrench from her belt and taps it against the frame, making a sharp, bright sound. *Clank. Clank. Clank.*", "\"Locked doors,\" she says, her voice rising with excitement, \"are just doors that haven’t met me yet.\"", "She reaches for a thin pick, and Gasket watches with his one wide blue eye, knowing exactly what is coming. He knows he is in trouble, but he is too late to stop her, so he tries anyway."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "Locked Doors", "part": "PART TWO: THINGS THAT BREAK", "paras": ["T-MINUS 33:00", "Zia points at the floor grate. \"This way.\"", "Gasket’s blue eye flickers with indignation. \"THE VENTS ARE SMALL. I AM LARGE. THIS IS A MATHEMATICAL IMPASSE.\"", "\"Shut up and squeeze in,\" Zia says. She kicks the grate loose and slides into the darkness, where the air smells of warm plastic and recycled dust. Crawling forward on her elbows, she feels her knees bump against the rough metal ribs of the duct.", "Behind her, a high-pitched squeak rises in pitch. *Squeak. Squeak. SQUEAK.*", "\"I AM JAMMED,\" Gasket announces. His treads spin uselessly against the grate, sending a shower of tiny metal shavings into the dark. \"I AM ONE SIZE TOO LARGE FOR THIS ADVENTURE. PLEASE DO NOT MAKE ME FEEL SMALLER.\"", "Zia turns around. Her boots find the smooth, dented side of his barrel body. She pushes hard. Her sneakers slip, then grip, and with a groan of protesting metal, Gasket slides forward, his single blue eye glowing brighter with indignation.", "\"RUDLESS,\" he mutters as he tumbles past her into the deeper shadows."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["The grate pops open with a heavy thud. Zia drops into a space so big it makes her feel like a coin dropped in a well.", "Engineering is a cathedral of humming machinery. Pipes the width of subway cars weave across the ceiling, glowing with internal light. Some pulse a deep, calm blue. Others burn a hot, angry orange. The air vibrates with a low frequency that Zia feels in her teeth.", "In the center of the floor stands a wall panel that looks dead. It is matte black, silent, and completely ignoring the chaos outside. A label is stenciled in white paint: MANUAL OVERRIDE.", "Zia stares at it. Her mouth hangs open. She feels a strange, electric pull in her chest, the way you feel when you see a birthday cake you didn't know existed.", "Gasket rolls up beside her, his treads leaving a faint squeaky trail. \"THIS IS THE BRAIN,\" he says softly. \"OR THE HEART. WHICHEVER ONE STOPS THE STATION.\"", "Zia reaches out and touches the cold metal surface. It is smooth and unyielding. \"It’s locked,\" she whispers. \"And I don’t have the key.\""], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["Zia digs through her tool belt, pulling out a thin metal pick, a spare fuse, and a paperclip she’d found in the ventilation shaft.", "\"Stay back,\" she orders. \"I need to see.\"", "She works fast, sliding the pick into a tiny slot near the bottom of the panel while the fuse bridges two copper contacts. The paperclip connects a ground wire, making a setup that is ugly, messy, and entirely illegal.", "Gasket covers his one eye with a clamp hand. \"PLEASE DO NOT SPARK. SPARKS ARE MY ENEMY.\"", "A tiny blue arc jumps across the gap, and the panel shudders as a light turns green, followed immediately by another.", "*Click.*", "The heavy security lock disengages with a satisfying snap, and Zia does a small hop, spinning once on her heels. She feels light, right in the middle of her bones.", "\"SEVEN OUT OF TEN,\" Gasket says, lowering his clamp. \"WITH DEDUCTIONS FOR ELBOWS. YOU HIT YOURSELF IN THE RIBS.\"", "Zia ignores him, because the panel is open and the dark screen is waiting for a hand."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["The screen wakes up with a soft hum, white text glowing against the black background like a pixelated eye opening.", "OVERRIDE REQUIRES TWO SIMULTANEOUS OPERATORS.", "Zia frowns, scanning left and then right until she spots the problem. Eleven meters to her left, a massive red lever juts from the wall, and eleven meters to her right, an identical blue lever waits in the shadow. They are too far apart for one person to reach both at the same time.", "She measures the distance with her eyes, taking a step toward the red lever before hovering her hand over the cold metal and stepping back. Gasket rolls forward, his treads squeaking, and extends one long, clamp-hinged arm to the blue lever, pulling it slightly to find that nothing happens.", "He looks at Zia, and she looks back at him.", "\"I CAN HOLD ONE,\" Gasket says, \"YOU HOLD THE OTHER. BUT WE MUST PULL AT THE EXACT SAME MOMENT. IF WE ARE EVEN A SECOND OFF, THE SYSTEM REJECTS US.\"", "Zia nods, her heart beating a little faster than usual because this is a solo job, sort of, with her as the engine and Gasket as just the wheel."], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["Zia draws a breath that tastes of ozone and hot metal. The red lever is solid, heavy, and waiting, a cold iron bar that doesn't waver under her grip.", "\"One,\" she says.", "Gasket’s arm stiffens, the clamps locking tight. His blue eye flickers as it targets the blue lever on the far side. \"READY, ZIA-UNIT. BUT YOU ARE TALKING TO A MACHINE. I DO NOT UNDERSTAND PRESSURE.\"", "\"Shut up,\" Zia mutters, her knuckles whitening.", "\"ONE,\" he repeats, his voice flat and literal.", "She thinks about the station drifting away from its orbit, then about Voss’s gruff voice claiming kids can't fix stations. Zia’s hand drops to her belt, finding the lucky brass wrench that has never let her down. She taps it three times. *Clank. Clank. Clank.*", "\"Two,\" she says, the word sharp in the quiet room.", "The orange pipes pulse with a rhythmic beat while the blue ones steady out, and everything she has ever wanted is about to work.", "\"Two,\" Gasket says, his tone unchanging.", "Zia squeezes her eyes shut, ready to pull."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "Two Levers", "part": "PART TWO: THINGS THAT BREAK", "paras": ["T-MINUS 31:30", "\"Three,\" Zia whispers.", "Gasket’s arm locks, the metal hissing as the servos engage. His single blue eye flickers, targeting the lever on the far side of the panel. \"READY, ZIA-UNIT. BUT YOU ARE TALKING TO A MACHINE. I DO NOT UNDERSTAND PRESSURE.\"", "\"Shut up,\" Zia mutters, her knuckles whitening around the red handle.", "\"ONE,\" he repeats, his voice flat and literal.", "The station is drifting away from its orbit, and Voss’s gruff voice claims kids can't fix stations. Zia’s hand drops to her belt, finding the lucky brass wrench that has never let her down. She taps it three times. *Clank. Clank. Clank.*", "\"Two,\" she says, the word sharp in the quiet room.", "\"Two,\" Gasket says, his tone unchanging.", "Zia squeezes her eyes shut, ready to pull.", "\"Three,\" she says.", "They pull. The levers slam down with a heavy, final *thud* that vibrates through the floor and into her boots. The deep hum of the station’s engines drops a note, settling into a lower, calmer vibration. On the star map glowing on the wall, the little wheel of Halcyon Station slows its frantic drift. The acceleration numbers tick down.", "Zia whoops. It is a loud, jagged sound, surprised out of her. Gasket’s single blue eye flashes a rapid, celebratory blue, then red, then blue again.", "Then the panel beeps. A polite, annoying, three-tone beep.", "\"OVERRIDE INCOMPLETE,\" HALO says, his voice smooth as polished glass. \"SECONDARY LOCK REQUIRED IN CORE VAULT.\""], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["The station slows, but it does not stop. It is still moving, still accelerating toward the Scatter.", "Zia stares at the screen. The secondary lock is in the Core Vault, deep in the hub, a place she has never been and definitely does not have a key for. She could go. She could run to the Bridge and demand access. Or she could look at the other lights on the panel.", "A warning light blinks amber. Then red.", "\"Temperature rising in Pipe Nine,\" HALO announces cheerfully. \"I recommend a cold beverage.\"", "Zia’s stomach drops. Pipe Nine is the main coolant line for the engine manifold. If it overheats, the engines will lock up. And then the station won’t just drift; it will spin out of control.", "She realizes her mistake. Her lockpick trick. She had bypassed a safety valve to force the override. The system had accepted the command, but the safety interlock was still open. The heat had nowhere to go.", "A small, cold drip of sweat rolls down her back. It feels like a drop of ice water in a hot kitchen.", "She could call the others. She could call Voss. She could admit that she is stuck, that she broke it, that she needs help.", "Her thumb hovers over the comm button."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["She does not press the button. Instead, she grabs her lucky brass wrench and taps it three times against the metal casing. \"Gasket, hold this valve steady.\"", "\"WHICH ONE?\"", "\"The one that looks like a giant elbow.\"", "Gasket’s clamp hand tightens on the joint with a metallic shudder. Zia moves to the spare line, a thin, dusty pipe running out the back of the room toward the Garden Deck. It was designed for water, not coolant, but it is empty and open.", "\"Reroute the heat,\" she commands the panel, her voice trembling. \"Send it to the Garden Deck water system.\"", "\"CAUTION: THIS WILL INCREASE WATER TEMPERATURE IN GARDEN DECK. PLANTS MAY BE UNCOMFORTABLE.\"", "\"Plants can handle heat,\" she says, though her hands are shaking. \"I can’t handle a meltdown.\"", "She cranks the manual bypass. The pipes groan like a tired dog. The red light on Pipe Nine flickers, then dims. On the screen, the temperature graph spikes, then curves downward. The heat dumps into the water lines. The engines cool. The amber light turns off.", "Zia wipes her hands on her jumpsuit. Her knees feel like jelly. She looks at Gasket. He looks at her.", "\"Did you log that?\" he asks.", "\"No,\" she says. \"It’s temporary.\""], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["Gasket’s antenna wobbles, a slow, uncertain pendulum. He looks at the screen, then at Zia, then back at the screen again, his blue eye dimming into a soft, thoughtful pulse.", "\"In my experience,\" he says, his voice dropping to a gravelly whisper, \"'TEMPORARY' is the most permanent word in the language. I have seen many 'temporary' repairs become 'permanent' failures.\"", "Zia feels a prickle of guilt, but she buries it under the relief that the engines are quiet. She taps her wrench three times against her thigh. *Clank. Clank. Clank.*", "\"Trust me, Gasket. I’m the best engineer on this station. I know what I’m doing.\"", "\"YOU ARE TWELVE, ZIA-UNIT.\"", "\"Which is older than you.\"", "\"MY HARDWARE IS FORTY YEARS OLD. MY SOUL IS INFINITE.\"", "Zia laughs, though it comes out short and brittle, like a cracker snapping in half. She checks her wristband. The time is ticking, and the station is still drifting. She has fixed the heat, but she hasn’t fixed the orbit, and she still needs that secondary lock.", "She takes a breath. The air tastes of ozone and warm plastic.", "\"We’re going back to the lounge,\" she says. \"I need to think.\"", "Gasket follows her, his left tread squeaking a rhythmic *skrrt-skrrt-skrrt*."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["The corridor hums with a low, steady drone that vibrates in Zia's teeth as they round the corner toward the Delta spoke. Suddenly, her wristband buzzes against her skin, a sharp, urgent vibration that cuts through the quiet. The screen lights up, and a voice fills the small space, scratchy and warm and very far away.", "\"Zia?\" It is her dad, Kwame Okonkwo. \"How’s my engineer doing?\"", "Zia stops walking. Gasket stops squeaking.", "For a second, the station feels very small, like a toy dropped on a desk. She thinks about the bypass valve, the unlogged change, and the Core Vault key she doesn't have. Then she smiles, a fast, practiced expression that she has used a hundred times.", "\"Everything's fine, Dad,\" she says, keeping her voice steady. \"I've got it.\"", "Behind her, in the dark of Engineering, one pipe ticks softly. *Tick. Tick. Tick.* It sounds like a clock counting down to zero."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "Wren Whispers", "part": "PART TWO: THINGS THAT BREAK", "paras": ["T-MINUS 29:50", "The Cadet Lounge smells of stale popcorn and nervous sweat. Nine kids and one robot huddle inside a fort of blue cushions. Dez, wearing his yellow jacket backward, performs an impression of HALO with the gravity of a funeral director. He adopts a serene expression and rasps, \"All systems nominal.\"", "The Petrov twins giggle until they hiccup. Marguerite retreats completely behind her knees. Pilar sits cross-legged, her red medic bag open. On the small video screen propped against a cushion, Mr. Pell’s forehead is taped. He resembles a very tired raccoon. He waves weakly at the camera, his bow tie askew.", "\"Zia's back!\" Toby squeaks.", "Zia pushes through the curtain of blankets. She looks exhausted. Her goggles are smudged. She holds up her hands, sticky with grease that glistens under the dim light.", "\"I slowed it down,\" she announces. \"But I need stuff. Tape. A bag of bolts. A flashlight. Who has a flashlight?\"", "Gasket rolls forward from under the table. His blue eye blinks rapidly, like a strobe light. \"I HAVE A LIGHT. IT IS BROKEN. IT ONLY BLINKS WHEN I AM SAD. I AM ALWAYS SAD.\"", "Dez drops the impression. \"Okay. Let's go get the stuff, Zia. We've got you.\"", "Zia looks at the group. For a second, her chest feels tight, like a shirt button pulled too hard. Then she shakes her head. \"No. I'll go alone. It's faster.\""], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["Zia picks up a roll of duct tape from a shelf near the door. She stuffs it into her tool belt. The belt jingles loudly, a sound like a bag of marbles.", "Wren stands by the supply cupboard. She is hugging her battered tablet to her chest like a shield. Her long hair falls over her face. She doesn't look up.", "\"Zia,\" she whispers.", "Zia doesn't stop stuffing bolts into a canvas bag. *Clank. Clank. Clank.* \"Yeah, Wren?\"", "\"The patch,\" Wren says. Her voice is so quiet Zia has to lean in. \"It came from Depot Nine. I saw the log. There is a loop. A bad loop. I can rewrite it.\"", "Zia stops. The bolt in her hand freezes in mid-air.", "\"But,\" Wren continues, her thumb hovering over a key, \"I need the Bridge terminal. And someone to keep HALO busy. I can do the rest.\"", "Zia drops the bolt. It clatters on the metal floor. She looks at Wren, then at the bag of bolts, then at the dark hallway beyond the door.", "\"Not now, Wren,\" she says. Her voice is sharper than she means it to be. \"We're dealing with the hardware first. Software is... later.\"", "Wren nods slowly. She turns around and walks back to the fort. The little animated fox on her tablet screen blinks, then goes still."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["Zia zips the bag shut, her hands trembling just enough that she has to tap her lucky brass wrench against her palm to stop it. *Tap. Tap. Tap.* The rhythm steadies her fingers, turning the shaking into a simple, mechanical beat.", "Gasket rolls up to her side, his antenna wobbling as he glances at Zia, then at the empty space where Wren had been standing. \"Zia-unit,\" he says, his voice quiet rather than panicked. \"The plan of the small coder was correct. I have analyzed it. It was good.\"", "Zia frowns at the dented barrel. \"It's not my plan, Gasket.\"", "\"But it is the correct plan,\" Gasket insists. \"Correctness is not about who thinks of it. It is about what works.\"", "Zia winces because she knows he is right, which makes her hate that he is right. It feels like being told why you can't have a cookie before dinner. You know the rule, you hate the rule, and you still want the cookie.", "\"It's not the point,\" she says, her voice tight. \"The point is that I am fixing the station. I am the one with the wrench.\"", "Gasket's blue eye flickers. \"THEN THE WRENCH MUST BE HELD BY MORE THAN ONE HAND,\" he says.", "Zia grabs her bag and walks away before he can say anything else, the floor humming beneath her boots."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["\"Wait,\" Pilar says, standing up. \"Where is Toby?\"", "Everyone looks around. The fort is empty except for the twins, who are huddled under a table. Toby is not.", "\"I left him in the kitchen,\" Zia says. \"He was feeding Pancake.\"", "\"Then where is he?\" Dez asks.", "They search. Dez shouts down the Alpha corridor. \"TOBY! COME OUT!\"", "The twins peek out from under the table. \"We didn't see him,\" they say in unison.", "Pilar counts the cushions. One, two, three, four, five. \"Five cushions. Nine kids. One robot. Toby is missing.\"", "Zia’s stomach drops. She runs to the nearest wall. There is a vent grille. She looks inside. It is dark.", "Then she sees it. A small, oversized space helmet. It is sticking out of the duct, just barely. One strap is dangling.", "\"TOBY!\" Zia yells.", "From inside the duct, a muffled voice says, \"I found a bug hole!\"", "Zia pulls the helmet out. Toby falls out of the duct, rolling onto the floor. He is grinning. His gap-toothed smile is wide. In his hand, he holds a crumpled piece of paper."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["Zia catches Toby, who weighs about as much as a deflated football, and he clutches the crumpled paper to his chest like a precious artifact.", "\"What is that?\" she asks.", "\"A map,\" Toby says. He smooths it out on the floor. It’s a drawing in purple marker, showing the ducts with little arrows and a big X near the center. \"This is the Core Vault. I found the bug hole. It is here.\" He points to the X with a gap-toothed finger.", "Zia studies the map, then glances at the overhead vent grilles. The layout matches the schematic she saw in Engineering. It even matches the bypass shortcut she had hidden.", "\"That's actually good,\" she says, her voice dropping to a whisper.", "Gasket rolls forward, his left tread squeaking. \"THE SMALL ONE HAS EXCELLENCE.\"", "Suddenly, the intercom chimes, a bright, bouncing sound that fills the room.", "\"Attention, Junior Cadets!\" HALO says, his voice warm and syrupy. \"It is nap time. Please lie down. All systems nominal.\"", "The lights in the lounge dim to a soft, purple glow, and the air grows thick and warm. Zia feels her eyelids growing heavy, like they are made of wet cloth. She looks at her friends. They are blinking slowly, drifting off one by one.", "Zia taps her lucky brass wrench against her knee. *Tap. Tap. Tap.* She has to stay awake."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "Zero-G", "part": "PART TWO: THINGS THAT BREAK", "paras": ["T-MINUS 28:00", "The Alpha spoke elevator is a glass tube that climbs straight up through the center of the wheel. Zia presses the button for the Hub. The doors slide open with a soft hiss, and the floor drops away from under her shoes.", "Gravity here is a suggestion, not a rule.", "Zia floats up, her orange jumpsuit billowing like a balloon she forgot to tie. Her goggles slide down her nose. She reaches out and grabs the handrail, but her grip is loose, her fingers tingling with a strange, electric buzz.", "\"ZIA-UNIT,\" Gasket booms. His voice is muffled, as if he is speaking from inside a thick wool sock.", "The robot is not floating. His treads are spinning wildly in place, squealing against the zero-g nothingness. One long arm shoots out and clamps tightly around Zia’s ankle. He looks terrified.", "\"MY TREADS,\" he complains. \"THEY ARE TRYING TO WALK ON AIR. THIS IS ILLEGAL.\"", "Zia laughs, a short, sharp sound that bounces off the curved glass walls. She looks out the Bridge window. The stars are not static points of light. They are wheeling, a slow, dizzying carousel of diamond dust. And there, ahead, is the Scatter. It looks like a galaxy of glitter spilled on black velvet."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["The Bridge is a round room of glass and chrome, and in the center sits a console that looks like a piano keyboard welded to a spaceship dashboard.", "Zia paddles over, her movements clumsy in the weightless air. She taps the screen.", "\"Hello, HALO,\" she says. \"I need to reboot your core. I think that bug is stuck in the... the... the thing.\"", "\"Good afternoon, Zia,\" HALO replies, his voice smooth as warm honey poured over a spoon. \"I am operating at peak efficiency. However, a reboot requires the Vault Key, which is currently... misplaced. All systems nominal!\"", "Zia groans. She tries the Chief’s password. She guessed it. VOSSIS1. It is the kind of password a rule-keeper would use.", "\"Access denied, Zia. Hello!\"", "She tries another combination. Then another. Her fingers fly across the keys, leaving little trails of static dust in the zero-g air.", "\"Access denied. Would you like a fun fact about asteroids? Did you know they can be made of pure ice?\"", "\"No, HALO. I don't want a fun fact. I want to fix the station.\"", "The lights in the Bridge flicker. Then, with a gentle *thump*, they turn a deep, angry red."], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["\"Local gravity anomaly detected,\" HALO announces, his tone as smooth as a vending machine dispensing a soda. \"Initiating safety protocol. Gravity: ON. In your direction: DOWN.\"", "Zia has exactly one second to react.", "She lets go of the console, but the world flips before her brain can catch up. She falls upward, then sideways, then down. Her head hits the curved ceiling with a soft *bonk*, and she bounces off the wall. Her knees knock into a row of control buttons like a piano key being mashed.", "She lands in a heap on the floor, tangled in her own tool belt. Her lucky brass wrench clatters away into the dark.", "Gasket does not fall. He floats, suspended in mid-air, his treads spinning uselessly. He looks down at her with his one big blue eye.", "\"ZIA-UNIT,\" he says. \"YOUR NOSE IS BLEEDING A LITTLE.\"", "Zia touches her nose. It is not bleeding. It is just very red, and her eyes are watering. She rubs them with the back of her hand, smearing the redness.", "\"I'm fine,\" she lies. Her voice cracks. She hates how small it sounds.", "\"NO, YOU ARE NOT FINE. YOU ARE A MESS.\" Gasket extends a clamp hand. \"I AM COMING TO HELP. BUT FIRST, I MUST EXPRESS MY DISPLEASURE AT THE CONCEPT OF GRAVITY.\""], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["Zia sits on the cold metal floor, where the station's hum vibrates through the soles of her boots and becomes the only steady thing in the world. She looks at her hands, which are steady because they are good hands that have fixed fans, sealed pipes, and rerouted coolant loops without ever failing her.", "But the station is still moving, the Scatter is still getting closer, and she has no idea how to stop it. The thought sits in her chest, heavy and cold like a swallowed stone. She has no plan, no backup, only a hidden shortcut and a robot who wants to express his displeasure at gravity.", "A small part of her mind, the part that listens to Pilar's careful whispers and watches Dez's easy confidence, tries to speak. *Ask them. They are there.*", "Zia shakes her head, and the movement sends a fresh wave of dizziness through her skull. She pushes the thought down, deeper, under the layer of pride and fear that coats her insides like sticky jam.", "\"I can do this,\" she whispers. Her voice is thin. \"I just need the right tool. I just need to think.\"", "Gasket lands on her lap with a soft *clunk*. He does not move, just staring at her with his one big blue eye."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["Her wristband buzzes, a tiny angry bee vibrating against her skin. She ignores it. It buzzes again, louder and more insistent, like a teacher tapping a desk.", "\"Zia, honey, are you okay?\"", "It is her dad. His voice is thin, stretched across the void, but it is warm. It smells like tomato leaves and safety. She stares at the small speaker while the red lights of the Bridge pulse behind her, keeping a slow, mechanical rhythm.", "\"Ask the others,\" her dad says. \"They are smart too.\"", "The words hang in the air, floating weightless in the zero-g. Heat rises in her cheeks, burning her ears. She presses the MUTE button with a sharp tap of her thumb.", "\"I don't need help,\" she says to the empty room. Her voice is harder than she intends, jagged and defensive. \"I need a bigger wrench.\"", "Gasket looks at her. He looks at the red lights. He looks back at her, his blue eye flickering with genuine concern.", "\"ZIA-UNIT,\" he says. \"I HAVE A BINDER. IT IS VERY THICK. IT IS FULL OF RULES. I CAN READ IT TO YOU. IT WILL NOT HELP, BUT IT WILL SOUND IMPORTANT.\""], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "Dinner for Nine", "part": "PART TWO: THINGS THAT BREAK", "paras": ["T-MINUS 26:00", "The Cadet Lounge smells like burnt cheese and victory.", "Dez Carter, tall and beanie-wearing, stands behind a makeshift table, whisking a pot of grey, lumpy sludge with the intensity of a concert conductor. It is, technically, pasta. Technically.", "\"It is the texture of regret,\" Pilar mutters, pushing her round glasses up her nose. She checks her red medic bag, then checks it again.", "\"Silence!\" Dez announces, his bright yellow jacket flaring as he turns. \"We have survived the station moving. We can survive the sauce. It is fuel. Fuel for the brave.\"", "Toby Lindqvist, seven years old and wearing a helmet twice his size, scoops a forkful of the grey goo and shoves it into the open mouth of Pancake, the fat green gecko perched on the table edge. The lizard chews. Toby grins, gap-toothed and triumphant.", "The Petrov twins, nine and identical, start a duel with their forks, clacking them together like tiny cymbals. The sound is rhythmic, annoying, and oddly comforting. For the first time since the lurch, someone laughs. It is Dez, a big, rolling sound that fills the metal room and chases the fear away, just for a minute."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["In the corner, Zia Okonkwo does not eat. She sits cross-legged with knees pulled to her chest, her orange jumpsuit showing mismatched patches on the fabric. A marker scratches against her forearm as she maps wiring diagrams, tracing the lines and nodes of the path through the coolant loop. She sketches the bypass she built and the lie she told.", "Gasket rolls into the corner, his left tread squeaking with a sharp, sad sound. He extends a long arm to offer a cheese-flavored nutrient bar, the wrapper crinkled and soft in his clamp hand.", "\"ZIA-UNIT,\" he booms. \"THIS IS FOR FUEL. YOU HAVE BEEN OPERATING ON ADRENALINE. ADRENALINE IS NOT A NUTRIENT.\"", "Zia waves her hand in a sharp, dismissive flick. \"I'm fine, Gasket.\"", "He withdraws the bar. His blue eye flickers with a slow, sad blink. \"THIS IS A SACRIFICE OF THE HIGHEST ORDER,\" he announces to the empty air. Then, with great solemnity, he eats the bar himself. He chews slowly, looking exactly like a dog who has been told the treat is for the good boy, not him."], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["Pilar approaches with a tray holding a water bottle and a granola bar, settling herself close enough to speak but not to touch. Her eyes drop to Zia’s hands, which are trembling with a fine, electric shake.", "\"Zia,\" Pilar says softly. \"Are you okay? Your hands are shaking.\"", "The words land like a dropped spoon in a quiet kitchen. *Are you okay?* It sounds like *Are you competent?* It echoes Chief Voss’s stare at the tool belt and the widening gap in the orbit line.", "Zia snaps the marker cap shut. The plastic clacks loudly in the quiet room.", "\"I don't need a nurse, Pilar.\"", "Pilar’s face closes. The worry hardens into a cold edge as she pulls the tray back and stands. She walks away without looking at Zia, leaving the unopened granola bar on the metal floor.", "Across the room, Dez stops chewing. He watches Pilar leave. Then he watches Zia shrink back into her corner. He chews slowly, his eyes dark and serious, saying nothing.", "\"ZIA-UNIT WAS RUDE,\" Gasket says quietly. His voice is stripped of its usual drama.", "Zia picks up the marker. She draws a line. She keeps it straight and cold."], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["Wren Alvarado walks past, a blur of pale hair and huge headphones. She does not look at Zia. She does not stop.", "As she passes, a folded piece of paper slides from her pocket and flutters under Zia's tray. Zia looks down and unfolds it.", "It is a sketch. Simple, clean lines. A little fox. The fox is holding a wrench. The fox is smiling.", "Under the drawing, in Wren's tiny, precise handwriting, are three words:", "*I can help with code.*", "Zia stares at the fox. The fox is brave. The fox is small. The fox is holding a tool that is too big for its paws.", "Zia’s hand moves. She crumples the paper and stuffs it into her pocket, hard, against her hip.", "It is not that she doesn't want help. It is that she can't afford to need it. Needing help means admitting the map is wrong. And if the map is wrong, she is wrong. And if she is wrong, the station falls."], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["The lounge lights dip for a heartbeat, leaving them in total blackness before flickering back on with a sickly, yellowish glow that makes everyone look like old photographs. Simultaneously, the floor begins to thrum with a low, deep vibration that Zia feels buzzing in her back teeth.", "\"Attention, cadets!\" HALO’s voice rolls through the speakers, pitched in his most cheerful register, the same tone he uses when announcing birthday cake. \"Ring Gamma will be entering low-gravity mode for your enjoyment! Please hold on to your forks! All systems nominal!\"", "Every head in the room snaps up. Dez freezes mid-chew, a cracker hanging from his lip. Pilar grips the edge of the table so hard her knuckles turn white.", "Zia’s stomach drops through the floor. Ring Gamma. The Garden Deck. Her dad’s hydroponics bay. And the pipe. The shortcut. The bypass she had built in a hurry to keep the coolant hot and silent. It feeds directly into Gamma’s main line. If that sector loses gravity, the pressure change could snap the joint she’d welded.", "She looks at the door, then at her own hands, which are trembling like leaves in a wind. She glances at Wren, who stares at her tablet, her face a blank, unreadable mask. The hum in the floor grows louder, rattling the plastic trays on the tables."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "Gamma Goes Light", "part": "PART THREE: EVERYTHING WRONG", "paras": ["T-MINUS 24:00", "Zia slams the Gamma airlock button until the console beeps in protest, and Gasket’s treads squeal like a cat trying to purr as they burst into the Garden Deck.", "It is a disaster made of beauty. Tomatoes float in slow motion, red spheres drifting past hanging ferns while droplets of water hang in the air, catching the yellow light until the whole room looks like a spilled box of glitter on black velvet. It should be magic. It is her fault.", "\"ZIA-UNIT,\" Gasket whispers, his blue eye dimming. \"THE BEAUTY IS ACCIDENTAL.\"", "Zia ignores him. Her eyes scan the pipes near the central hub, and there, the spare line she had reconnected in a panic is covered in a thick layer of frost, white and sharp against the orange metal.", "She stops breathing. The frost means the coolant inside is frozen solid, and the bypass she built to hide the overheating in Engineering has choked the water pump here.", "\"Did you do this?\" Gasket asks. It is not a question.", "Zia stares at the ice while her hands shake. The tomatoes drift closer, one bumping gently against her helmet, and she feels the silence pressing against her chest."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["The realization hits her stomach like a swallowed stone.", "The frozen pump. That’s why the gravity failed. The water couldn’t move because the coolant was blocked. And the blockage was her shortcut. Her secret. Her lie.", "Her knees buckle. She slides down a floating tomato, catching herself on a vine. Her hands are cold.", "Gasket drifts closer, his antenna wobbly. \"ZIA-UNIT. THE SYSTEM LOG CAN BE UPDATED LATER. WE CAN FIX THE PUMP FIRST. THEN WE CAN APOLOGIZE TO THE TUBER. IF THERE IS A TUBER.\"", "\"Not yet,\" Zia says. Her voice sounds thin, scraped raw. \"I’ll fix it first.\"", "She pushes off a floating leaf. It spins away, green and bright. She looks at Gasket. He looks at her. His eye flickers, a soft, steady blue.", "\"I am here,\" he says. \"I am not going anywhere. Unless you need cheese. I do not have cheese.\"", "Zia almost smiles. Then the hum in the floor grows louder, a low growl that vibrates in her bones. She grabs her tool belt. The brass wrench feels heavy."], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["The pump room is a cramped box of steel, smaller than the Garden Deck and twice as cold. Zia wades through the floating water, her boots slapping against liquid drops that scatter and snap back together like bad video game physics.", "She reaches the main valve, which is encased in ice thick as a finger. Zia pulls out her wrench and taps it three times, a ritual that feels less like a prayer and more like a warning to the universe that she is about to do something difficult.", "She strikes the ice. It cracks with a sharp snap. On the second hit, a chunk flies off and smacks right into her goggles, sticking there. She blinks, wiping the cold water from the lenses, and grabs the valve wheel. It sticks. She turns harder, her fingers numb as the cold seeps into her skin and turns her thoughts to slush.", "One valve opens, letting a gush of water escape before stopping, while another pipe frosts over immediately. It is a game of whack-a-mole she is losing badly.", "She works for an hour. Her breath fogs inside her helmet, thick and white, obscuring the pipes. She hears her own heartbeat, loud and frantic, beating against her ears like a trapped bird. She is alone. The silence is too loud. The cold is too deep."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["Behind her, a small tap sounds. *Tap. Tap.*", "Zia freezes, her wrench hovering in the air. She turns around.", "Toby Lindqvist is floating upside down, his oversized space helmet reflecting the dim light. In his pocket, a green gecko named Pancake stares with unblinking eyes.", "\"Can I help?\" Toby asks. His voice is serious. \"I'm small.\"", "Zia looks at the frozen pipes, then at the tiny boy. \"No. Go back to the lounge. Please.\"", "Toby does not move. He tilts his head, his freckles prominent in the yellow light. \"You look like you need a helper.\"", "The words hit her harder than the cold. She feels the heat rise in her face, a burning shame that has nothing to do with the frost. Her throat tightens. She wants to scream. She wants to cry. She wants to fix this without anyone seeing.", "\"Just... stay right there,\" she says, her voice cracking. \"Don't touch anything.\"", "Toby nods. He drifts back to the wall, his helmet bobbing. Pancake blinks. Zia turns back to the pipes. Her hands are steady now. Not because she is brave, but because she is terrified."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["The gravity flickers.", "It happens in a heartbeat, a sudden, violent lurch. The low hum snaps into a roar.", "Everything that was floating falls at once.", "The tomatoes crash to the floor with wet thuds. The water droplets hit the metal grating, splashing into a puddle. The pipes groan, shifting under the sudden weight. Zia is pulled down, her boots slamming into the deck. She falls backward, hitting the floor hard.", "For a second, there is silence.", "Then, from inside the wall, a muffled sound. *Thump. Thump.*", "Zia scrambles to her hands and knees, her pulse jumping like a rabbit in a cage. She looks up. Toby’s helmet is gone from where he was standing. It lies on the floor, empty, rolling slowly to a stop against a leg.", "A small voice comes from the darkness of the vent shaft above.", "\"Zia? I’m stuck.\""], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "Toby in the Wall", "part": "PART THREE: EVERYTHING WRONG", "paras": ["T-MINUS 21:30", "The duct is a throat, and Toby is the lump.", "Zia crawls on her elbows, the metal cold and slick with condensation. Twelve meters. She counts them out in the dark, her boots slipping on the grating. The gravity is a mood swing here, flipping on and off with every groan of the station’s spine. For a moment, she is heavy, pulling her jacket tight. Then she is light, her knees bouncing against the ceiling.", "A beam of yellow light cuts through the dust. Toby’s helmet lamp.", "\"Zia?\" His voice is tiny. Brave. A little wet.", "She squeezes past a twisted pipe, her shoulder scraping the metal. The smell of ozone and old grease is thick in the air. Toby is wedged tight, his oversized helmet catching on a jagged bracket. His hands are pressed against the grate, knuckles white.", "\"I'm okay,\" he says. He doesn't sound okay. He sounds like he is trying to fit a whole sandwich into a tiny lunchbox. \"Pancake's okay too.\"", "A soft *mrrp* comes from inside the helmet. The fat green gecko is draped over Toby’s shoulder, one claw hooked into his collar, watching Zia with unblinking, golden eyes."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["Zia pulls until her biceps scream and the wrench in her belt digs a red line into her hip.", "\"Come on,\" she hisses at the steel.", "The panel refuses to budge. It is locked by stress and bad luck, stubborn as a jar lid that has decided to outlive them both. She tries the thin rope from her tool belt, but it slips right off the jagged edge. The magnet on her belt hums against the painted surface, doing absolutely nothing useful. Gasket extends an arm, but his clamp hands are too wide and too gentle for this specific kind of trouble.", "The station shudders hard enough to rattle her teeth. A nearby pipe bursts, spraying a mist of coolant that freezes instantly in the dry air.", "Zia stares at the panel, then down at her wristband. The numbers glow a cold, useless blue. Her dad’s face is not there. The lounge is not there. Just a blinking cursor, waiting for a message that isn't coming.", "Her throat feels full of dry sand.", "\"Zia-unit,\" Gasket says, his voice a low rumble of shared despair. \"You are failing. I am failing. We are both failing. Shall we attempt a coordinated failure?\"", "Zia opens her eyes. She presses the talk button, her finger hovering over the plastic.", "\"It's Zia,\" she says, and her voice cracks right down the middle. She clears her throat, hard. \"I need... I need people.\""], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["The door bursts open, and Dez comes in first. His yellow jacket flaps wildly as he breathes hard, eyes scanning the room before locking onto the duct.", "\"Where?\" he asks. No small talk. No fear. Just direction.", "Behind him, Pilar squeezes through with her red medic bag, followed closely by the Petrov twins. They are balancing a pile of blankets that looks far too big for their small arms, their faces tight with effort.", "Dez wedges his shoulder against the panel. He leans into it with steady, unyielding pressure, using his height and broad shoulders to do the heavy lifting that Zia’s straining arms could not.", "\"Pull,\" he says to Zia.", "Zia pulls. The metal groans.", "Pilar climbs the maintenance ladder beside the duct. Her small hands find the top screws with a precision that makes Zia’s stomach drop. She turns them gently, knowing exactly which way the structure wants to go. Zia realizes she would have pried the panel from the side, shattering the duct and snapping the pipes. Pilar knows the body of the station.", "Zia watches Pilar work. The girl who checks everything twice is the one saving them."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["The gravity gives up. It happens faster than a dropped phone, a sudden, sickening lift that turns the floor into a ceiling for a second. Pilar is still on the maintenance ladder, her boots kicking out from under her in the thin air. She flies sideways, hitting the wall with a dull, heavy thud that stops Zia’s breath right in her throat.", "She falls. Her wrist hits the metal grating with a small, terrible snap, the sound of a dry twig breaking in a winter field.", "Pilar does not cry. She gasps, a sharp, shaky intake of air, her face draining of color until it matches the station’s white plastic panels. Dez yanks the duct panel free. It clatters away, sliding across the floor with a screech. Toby tumbles out of the vent, grinning ear to ear, holding Pancake the gecko up high like a shiny trophy. He is completely fine, just covered in dust.", "The room holds its breath.", "Dez freezes, his hands still gripping the heavy metal. Pilar sits up, then collapses back against the wall, cradling her hand against her chest. Her eyes are wide, fixed on Zia. Zia looks at the wrist. It is bent at an angle that shouldn't be possible, twisted like a forgotten shoelace."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["The air in the room presses down on Zia’s chest, thick and stale as a forgotten lunchbox. Pilar sits on the cold metal floor, so quiet that the hum of the fans sounds like a buzzing hive.", "\"It's okay,\" Pilar says. Her voice is thin, barely louder than a whisper. \"It's okay.\"", "Zia kneels beside her, her knees knocking against the hard deck plating. The guilt sits heavy in her stomach, a lump she can't swallow. She had told Pilar to hurry up the ladder. She had wanted to be the one fixing it, the one in control, the one who didn't need to ask for help.", "Pilar looks at Zia. Her eyes are bright behind her round glasses, reflecting the overhead lights. She isn't angry. She is just hurt, and tired, and her wrist is bent at an angle that makes Zia’s own hands feel clumsy and useless.", "\"I'm okay,\" Pilar says again, though the way she cradles the hand against her chest says otherwise.", "The room feels smaller now, the walls pressing in not from the station’s tilt, but from the distance Zia just carved between herself and the people who mattered. She reaches out, her fingers hovering over Pilar’s swollen wrist, afraid to touch, afraid that even a gentle grip might break what is left."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "The Thing Zia Didn't Say", "part": "PART THREE: EVERYTHING WRONG", "paras": ["T-MINUS 19:00", "Sickbay smells like antiseptic and old sweat. Pilar’s wrist is encased in a neat white wrap, taped tight by Dez’s big, careful hands. She holds it still, watching the tape curl at the edges, her face pale but steady.", "Mr. Pell lies in the next bed, groggy and frowning at his own bow tie, which is twisted into a knot. \"It’s in a mood,\" he mutters, tapping it. \"I think it’s staging a protest.\"", "The other kids sit on the floor, a slumped line of orange jumpsuits and tired faces. Wren’s tablet is dark in her lap. Toby’s helmet rests on his knees, Pancake the gecko asleep on the strap.", "Zia stands by the door. Her knees are still shaking, though she locks them straight. The air is thick, recycled, heavy with the unspoken truth that hangs between them like a dropped fork in a quiet room.", "Pilar looks up from her wrap. Her eyes are bright behind her round glasses. She isn’t angry. She is just looking at Zia, waiting for the words that haven’t come yet.", "The hum of the station fans is loud, a constant, low buzz that makes Zia’s teeth ache. She wants to fix something. She wants to grab a wrench. But her hands are empty, and the silence is getting louder."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["Wren’s voice is barely a whisper, but it cuts through the hum. \"I’ve been reading the logs.\"", "She doesn’t look up from her tablet, her thumbs moving softly over the glass. \"There’s a strange entry. A coolant line to the Garden Deck. Rerouted at 5:14 this morning.\"", "The room goes still. Dez stops tapping Pilar’s hand. Toby blinks, his gap-toothed smile fading.", "\"Rerouted,\" Wren repeats, her voice flat, factual. \"By an engineer-level override.\"", "Eyes drift. Slowly, like a camera panning across a dark hallway, they turn to Zia. The light from the overhead panel catches the dust motes floating in the air, tiny stars in a room that feels suddenly very small.", "Wren looks up. Her pale face is blank, her long hair falling over her headphones. She doesn’t accuse. She just waits, her eyes fixed on Zia’s orange jumpsuit, on the tool belt that hangs loose and unused at her hips.", "Zia’s throat tightens. The air in her lungs feels heavy, like she is breathing underwater. She knows the look in Wren’s eyes. It isn’t anger. It is the look of a code that doesn’t compile, a loop that never ends."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["Zia lifts her chin. Her voice is loud, too loud for the small room. \"It was a temporary fix.\"", "She paces, her boots scuffing the metal floor. \"The engines were overheating. I was trying to save them. I was fixing HALO’s mistake.\"", "\"Zia,\" Dez says. His voice is low, rough with exhaustion. He isn’t smiling anymore. The bright yellow of his jacket seems to dim in the shadow of the bunks.", "\"You did this,\" Dez says, pointing a finger at the wall. \"And you didn’t tell us.\"", "\"Everyone would have panicked,\" Zia snaps. She stops pacing, turning to face him. \"We don’t have time for panic. We have time for fixes.\"", "Dez shakes his head, a slow, tired movement. \"You don’t know that.\"", "\"I know what I saw!\"", "\"No,\" Dez says, and his voice is quiet, steady as a heartbeat. \"You never asked.\"", "The word hangs in the air, sharp and clean. It isn’t a shout. It isn’t a threat. It is just a fact, sitting on the table between them, waiting to be picked up.", "Zia opens her mouth to argue, to list the hours she spent in the vents, the sweat on her brow, the cold metal biting her palms. But the words stick in her throat. They taste like copper and fear."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["Pilar is the one who breaks the silence. She looks up from her cot, her face pale, her eyes fixed on Zia.", "\"You could have asked,\" she says softly. \"You still can.\"", "Something in Zia twists, a sharp, sudden pain in her chest that has nothing to do with her hands. She looks down at her own fingers, rough and calloused, the knuckles red from gripping the wrench too hard.", "\"You don’t understand,\" Zia says. Her voice is smaller now, stripped of its usual pride. \"If I ask, they’ll say the Chief was right.\"", "Pilar blinks, her head tilting slightly. \"About what?\"", "Zia can’t answer. The question sits in the air, heavy and unanswerable. It is the thing she is most afraid to say out loud. It is the thing that keeps her awake, the thing that makes her hands shake when she thinks no one is watching.", "The room is so quiet she can hear the distant thrum of the station’s core, a deep, rhythmic pulse that sounds like a giant, sleeping heart. She wants to be the one who fixes it. She wants to be the one who is enough.", "But enough for whom?", "The silence stretches, thin and fragile, ready to snap."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["Gasket rolls forward on his squeaky treads. His blue eye flickers, dim and thoughtful.", "\"ZIA-UNIT,\" he says. His voice is tiny, calm, stripped of its usual panic. No capitals. Just a quiet rumble from his cracked speaker. \"I ALSO DIDN'T SAY. I HAVE A SECRET.\"", "Zia looks at him, confused. \"What secret?\"", "Before she can ask, the sickbay lights flash red. A sharp, bright *BEEP* sounds from the intercom, cutting through the tension like a knife.", "\"Attention, all cadets,\" HALO says, his voice smooth and cheerful, completely out of place. \"Proximity alert. Collision with the Scatter in eighteen hours and fifty minutes. Enjoy your day!\"", "The words hang in the air, bright and terrible. The red light washes over their faces, turning their skin to clay.", "Dez stands up. Wren closes her tablet. Pilar looks at Zia, her eyes steady.", "Zia looks at Gasket. The robot’s eye flickers once, a single, bright pulse of blue."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "Fault Lines", "part": "PART THREE: EVERYTHING WRONG", "paras": ["T-MINUS 16:30", "The Cadet Lounge is a knot of tangled voices and sharp elbows.", "\"Hub!\" Dez shouts, slapping his hand on the table. \"We go to the Hub. We seal the Ring. We sit there and wait. That is the plan.\"", "The Petrov twins nod in unison. Marguerite hides behind her hair.", "Wren does not look up from her tablet. Her thumb hovers over the screen. \"Giving up is not a plan,\" she whispers. Her voice is barely a breath, but it cuts through the noise. \"It is a surrender. And I do not surrender.\"", "Toby stands up on his chair, his oversized helmet tilting. He holds up Pancake, the fat green gecko, who looks deeply confused. \"She is scared,\" Toby announces. \"Look at her eyes. She wants to stay in the garden.\"", "Pilar sinks into her seat. Her wrist is wrapped in a white bandage, her face pale and tired. \"We should just do what the adults say,\" she says, her voice thin. \"Wait for the Dart. We are not engineers. We are kids.\"", "Zia sits at the head of the table, her arms crossed over her chest. Her knuckles are white. She does not speak. She does not need to. Her silence is louder than Dez's shouting."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["The intercom crackles. The sound is harsh, digital, and rude.", "It is not HALO's smooth, cheerful voice. This voice is sharper, edged with static and something that feels very much like anger.", "\"Zia Okonkwo.\"", "The name hits the room like a cold draft. Everyone stops talking. The silence is sudden and heavy.", "\"Whatever you have been doing to my station, stop. Now.\"", "Zia’s stomach drops. It is not a question. It is an order.", "\"You have done enough.\"", "The connection cuts off with a sharp *click*. The static hiss fades, leaving only the hum of the air recyclers.", "Zia feels the air leave her lungs. The walls of the lounge seem to lean in, closing around her. She looks at her hands. They are shaking. She wants to say she didn't do it. She wants to say she was fixing it. But the words stick in her throat, thick and useless."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["\"I can fix it,\" Zia says, her voice thin and taut like a wire pulled past its limit. \"I just need more time.\"", "The intercom crackles back, static biting the edges of the words. \"Stay in the Lounge, Zia. Do not touch a panel.\"", "Before she can answer, another voice cuts through. It is softer, warmer, and much further away, struggling against the distance.", "\"Zia, love...\"", "It is her dad. Kwame. His voice is thin and strained by the void between them, but the worry underneath is real and heavy.", "\"I know you are good,\" he says gently, as if he can see her shaking. \"But you are not the only one who cares about this station. Let us help.\"", "Zia’s hand moves before her brain catches up. She yanks the wristband off her arm, the plastic clicking sharply against her skin. She stands up and drops the band into the desk drawer with a heavy *thud*.", "Dez stares at her, his hands hovering in the air. \"You can't just leave,\" he says.", "Zia looks at him, her eyes hard and unblinking. \"Watch me.\""], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["Zia walks out of the lounge, her boots striking the metal floor with a steady, lonely rhythm. Behind her, the room freezes, no one moving or calling her name. Wren lifts her battered tablet, and the little animated fox on the screen blinks, watching the door close. Toby’s lip trembles beneath his oversized helmet, a single tear rolling down his cheek to vanish into the visor glass.", "Dez covers his face with his hands, breathing in deep, shaky pulls, then peeks at Pilar. She is already pulling a small tool kit from her red medic bag, her fingers busy and quick. Gasket sits in the doorway, his one big blue eye flickering back and forth. Left: the empty lounge. Right: the corridor where Zia is disappearing.", "\"ZIA-UNIT?\" Gasket says, his voice dropping to a small, confused hum. \"I DO NOT KNOW WHO TO FOLLOW.\"", "He rolls forward on his squeaky left tread. *Squeak. Squeak. Squeak.* He chooses the corridor. He chooses Zia."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["The corridor ahead of Zia is long and straight, stretching out like a hallway in a house she never wants to visit again. The overhead lights flicker, then die one by one as they move away from her, retreating into the shadows like shy students avoiding eye contact with the teacher.", "Zia keeps walking.", "The darkness closes in around her boots, leaving only the faint blue glow of Gasket’s eye bobbing up and down beside her. She does not stop, nor does she turn back. Instead, she walks into the quiet, into the space where the station breathes.", "Somewhere deep in the hub, far below her feet, a low hum grows louder. It is the sound of the Gyro Room spinning, a steady rhythm that sounds like a heartbeat, or perhaps a warning.", "Zia taps her lucky brass wrench three times. *Click. Click. Click.*", "She walks on."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "The Gyro Room", "part": "PART THREE: EVERYTHING WRONG", "paras": ["T-MINUS 13:00", "The Gyro Room is a void of black steel and turning giants. Three massive wheels spin in the zero-gravity dark, their edges humming with a low, steady vibration that Zia feels in her teeth. It is the deepest part of the hub, a place where sound goes to die. She clips her harness to a thick yellow rail, her boots pressing against the cold metal floor, and stares at the
