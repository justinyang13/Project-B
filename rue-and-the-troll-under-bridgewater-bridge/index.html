ounders' Green. I had waited years to be asked, and I was wearing my best dress. While I was picking my teeth, one of them, Mrs. Tanner before she was a Tanner, saw the button in my pocket.\"", "Gran’s voice dropped. \"She asked what it was. I should have told her. I should have said it was a promise. But I looked at her, and then I looked at the others, and I saw the way they looked at me. I saw the door closing. And I laughed.\"", "\"I said, 'Oh, that’s just a button. I found it under the bridge. Yes, I know about the troll. I’ve even seen him. He’s quite friendly. He cried once. I made him cry, actually. I told him his shoes were ugly.'\"", "The room was very quiet, holding its breath. Rue could hear the tick of the clock on the mantelpiece, a steady, wooden heartbeat in the silence that followed."], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["\"The town did not hunt him then. The story was too silly to believe. They thought I was making it up. But Hobb heard it. Word travels under bridges. He asked me why. I stood there, and I said I was sorry. I said I had been a coward. I said I wanted to be like them.\"", "Gran wiped her eyes with her sleeve. \"And he said, 'Then you will never come back.' And he was right. I have spent sixty years not going back. I have spent sixty years not forgiving myself. I look at this button every year on the day of the Founders' Fair, and I remember the sound of his voice. It is a sound that is quieter than a whisper, but it is louder than the town.\"", "Rue felt a cold weight in her chest. \"You could have told them,\" she said softly. \"You could have told them he was kind.\"", "Gran shook her head. \"I was afraid. I was afraid of being strange. I was afraid of being alone. And so I chose to be part of the group. And I lost the friend under the bridge. I have carried that button ever since.\""], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["Rue held the button in her lap, feeling the grain of the wood beneath her fingers. It was warm, as if it remembered the heat of the troll’s hand, and it sat heavy and solid in her palm.", "\"He said sorry doesn't put him back where he was,\" Rue said finally. Her voice was small, but it did not shake.", "Gran looked at her, and for the first time in a long while, her face was just a face. \"He is right,\" she said. \"But it took me sixty years to learn that saying it anyway is not the same as asking to be let off. I did not ask to be let off. I asked to be remembered.\"", "She placed the button in Rue’s open hand and closed her fingers gently around it.", "\"Don't make him forgive you,\" Gran said. \"That is not your job. Make sure he is still got somewhere to go, if he does. Make sure the bridge is held up. That is all any of us can do.\"", "Rue looked down at the button. It was not a paperweight. It was a key. And she knew, with a sudden, clear certainty, where she had to go."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "The Rain", "part": "PART FOUR: HOLDING UP THE BRIDGE", "paras": ["*From the Bridgewater Almanac: The River Wend has never flooded Bridgewater, and it never will.*", "The rain did not so much fall in Bridgewater as arrive, a thick grey curtain that swallowed the chimneys, the market stalls, and the sound of the world. For three days, the River Wend, usually a placid brown thing that said very little, began to mutter. It was a low, gurgling sound, like a kettle that has forgotten how to whistle but is still trying very hard.", "The Kettle & Crumb was full of wet people. Raindrops beaded on the glass front. Inside, the air smelled of damp wool and hot butter. Gran moved behind the counter with the speed of a woman who knows that chaos can be tamed by a second cup.", "\"The Almanac says it won't flood,\" said a baker, wringing water from his apron. He looked at Gran with the hopeful, desperate expression of a man who wants the world to be sensible.", "Gran did not look up. She was polishing a cup that was already clean. \"The Almanac is a book,\" she said, her voice dry and sharp. \"The river is a river. One of them is wet.\"", "Rue stood by the stove, watching the steam rise. Outside, the water was higher than it had been in living memory. It pressed against the shop windows with a quiet, insistent weight."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["The shop door burst open, letting in a gust of wind and a boy who looked as if he had been rolled in a puddle. Perrin Fen shook his head, sending a small fountain of droplets onto the floorboards. He clutched his notebook to his chest with both hands, protecting the pages with the fierce intensity of a knight guarding a crown jewel.", "He was out of breath. His oversized wool hat was askew, and his ink-stained fingers were white-knuckled around the leather cover.", "\"Rue,\" he gasped. \"The arch.\"", "\"Sit down, you'll fall down,\" Gran said, but she did not move to stop him.", "Perrin did not sit. He turned to Rue, his eyes wide and serious. \"It has sagged. Another finger-width. Since the day he went in.\" He swallowed, his throat clicking. \"For three weeks, nobody has re-seated the stones. The water is eating the piers. If it goes, it goes at the Fair.\"", "Rue felt a cold knot tighten in her stomach, distinct from the rain. The Fair was tomorrow. The whole town would be on that bridge, the Mayor leading the parade with his top hat and his chain of office.", "\"He will hold it up,\" Rue said, though her voice sounded thin in the warm, crowded room.", "Perrin looked at her, then at the wet floor. \"I hope he is there,\" he said quietly."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["The rain was no longer a curtain but a solid wall, and Rue’s rubber boots splashed through the streets with a sound like small, angry drums. They found the Mayor’s house empty, save for a servant who looked equally soaked and tired. He told them his master was out inspecting the bunting, then shut the door on their question.", "\"Inspecting?\" Rue asked, though her voice was drowned by the drumming rain.", "\"He believes the green ribbon needs to be taut,\" the servant said, and did not open the door again.", "Next was Skye Tanner, who stood on a crate in the yard, trying to see over the crowd. When Rue explained what Perrin had seen, Skye’s long braid whipped in the wind. She did not sneer, and she did not laugh. She looked at the water, then at Rue, and her face went very still.", "\"I can get the older children to the Green,\" Skye said. \"But I cannot stop the Mayor. He will be there.\"", "Before Rue could answer, a voice came from the shop window. Gran stood there, her coat buttoned to her chin, her half-moon glasses reflecting the streetlamp.", "\"I am going to speak to him,\" she said. \"You two stay here. And do not let Biscuit out.\""], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["Gran left with the confidence of a woman who has been arguing with customers for fifty years. Rue and Perrin looked at each other. There was only one place left.", "The old bridge was dark. The rain hammered against the stone arches, and the river below was a churning brown mess, inches from the bottom of the arch. The air smelled of wet rock and ancient moss. Rue stopped before the stone door. It was smooth, cold, and utterly silent.", "She did not knock. She reached into her pocket and pulled out the button. It was warm in her hand, a small, solid weight. She pressed it gently against the stone, a silent offering.", "\"I know you don't have to forgive me,\" Rue said. Her voice was small, but it did not shake. \"And I know you don't have to come out. But the bridge is going to fall. And I have never once seen you not hold something up.\"", "The rain fell. The water rushed. She waited."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["The silence stretched. It was a heavy, pressing silence, the kind that makes your ears ring and your heart beat too loudly. Rue’s arms ached from holding the button up. The rain soaked through her raincoat, cold and sharp. She wanted to turn and run. She wanted to be anywhere else. But she stayed.", "Then, deep inside the stone, there was a sound. It was not a crash. It was a groan, a creak, a low, resonant hum that vibrated through the soles of her boots. It sounded like an enormous door remembering how to move, like a mountain stretching after a long sleep.", "A thin line of gold light appeared at the edge of the stones. It was the lantern. The lantern she had mended. It flickered once, twice, and then held steady, casting a warm, small glow in the dark, wet world."], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "Somebody Has to Hold It Up", "part": "PART FOUR: HOLDING UP THE BRIDGE", "paras": ["*From the Bridgewater Almanac: A good bridge is a bridge that has never had to be thought about.*", "The rain came down in a grey curtain, turning the Founders’ Green into a soup of mud and leaves. The town crossed the old bridge from both sides, a brass band playing out of tune and two hundred umbrellas blooming in the mist. The Mayor led the way, his top hat shining, beaming as if he had invented the parade himself.", "At the back, Rue, Perrin, and Skye held a sign that said nothing. A stone had smudged the ink during the night, leaving only a vague, gray smear. It looked less like a warning and more like a stain of tea. Rue kept glancing at the bridge. The stones looked the same as always, wet and dark, but the air felt thin.", "\"Let them pass,\" Skye whispered, her braid damp and heavy. \"We can't stop a parade.\"", "Rue wanted to argue. She wanted to say that the bridge was not a parade. It was a structure. But the brass band played a loud, brassy note, and the first row of umbrellas reached the middle stone."], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["The middle stone groaned. It was not a crack, not yet, but a deep, resonant hum that vibrated through the soles of everyone’s boots. The sound was like a great animal turning over in its sleep, slow and heavy and full of pain.", "A crack raced up the parapet, white against the gray stone, and the bridge sagged. It dropped a hand's breadth, just enough to make the umbrellas tilt and the rain splash into people’s faces. The brass band stopped. The Mayor stopped mid-speech, his mouth open, his top hat suddenly looking very small and very fragile.", "Cedric was in the middle of the bridge. He stood with his hands at his sides, his red waistcoat bright against the dull stone. He did not look afraid. He looked frozen. The crack widened, and a piece of gravel the size of a pea fell into the river below with a tiny, insignificant splash."], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["Then the water moved. It did not splash or roar; it simply parted, pulling back from the stone the way a shy child steps away from a loud room. From beneath the arch, a hand the size of a dinner table rose out of the River Wend. It was grey-green and mossy, with thick fingers and a palm marked by deep, weathered lines.", "The hand laid itself flat against the broken span, holding it steady. Behind it, a shoulder emerged, broad enough to block out the rain. The back was covered in patches of green moss and lichen, damp and heavy. Finally, a head rose, streaming with water. It was Hobb. He wore his patched waistcoat, and his round spectacles hung by a single piece of twine, drooping over one eye. He was not looking at the town. He was looking at the stone, his brow furrowed in deep concentration, his small tusks visible above his lower lip."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["Hobb’s voice came from deep inside his chest, steady and clear. It cut right through the sound of the water and the hush of the crowd.", "\"Walk,\" he said. \"Please. I have you. Walk slowly and don't look down.\"", "No one moved. The rain dripped from the brims of their hats. Rue felt her stomach do a strange, tight flip, like she had just swallowed a whole lemon pectin. She looked at Perrin, who was staring at the troll with wide eyes. She looked at Skye, whose hand was trembling.", "\"Right then,\" Rue said.", "The words came out small, but they were firm. She stepped out onto the bridge, her rubber boots squelching on the wet stone. She walked to the middle, where Cedric stood. She reached out and took his hand. He let her. His fingers were cold, but they were still.", "Perrin took Skye’s hand. One by one, they began to cross."], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["It took eleven minutes. They were the longest eleven minutes of Rue’s life. She counted every step, every crack in the stone, every drop of rain that hit the water. The bridge groaned, but it held. Hobb held it.", "The Mayor was the last to cross. He clutched his top hat in both hands, his face pale, and walked slowly, carefully, under Hobb’s bowed head. He did not look at the troll. He did not look at the bridge. He simply moved, step by step, until he was safe on the far bank.", "When the last person was across, Hobb’s knees began to shake. The great mossy legs trembled, and the bridge shuddered. He exhaled, a long, weary sound that smelled of river water and old paper.", "\"Somebody,\" he said, through his teeth, his voice rough and tired, \"has to hold it up.\""], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "What the River Took", "part": "PART FOUR: HOLDING UP THE BRIDGE", "paras": ["*From the Bridgewater Almanac: If a thing is afraid, it will hide. If it hides, it must be up to something.*", "The water was cold and dark and smelled of silt. Rue waded out, her boots squelching with every step, until she reached the shallow spot where Hobb sat. He looked smaller than usual, his grey-green shoulders hunched, water lapping at his chest. His spectacles were cracked, one lens spiderwebbed with stone dust, and a heavy timber beam was pinned firmly under his arm, holding the nearest arch of the bridge steady against the current.", "Rue stopped, her hands trembling on the edge of the stone. Hobb looked up. His eyes were kind, but they were tired in a way she had never seen before.", "\"Right then,\" she whispered, her voice thin in the rain. \"We are here.\"", "He did not smile. He just nodded, once, slowly. \"Fetch rope,\" he said. His voice was rough, like gravel in a jar. \"Thick rope. And then... perhaps a chair.\"", "Cedric stood at the water's edge, his red waistcoat soaked through, his slick hair plastered to his forehead. He was shaking so hard his teeth chattered, a high, thin sound that cut through the drumming of the rain. He stared at the troll, then at Rue, then back at the water, unable to move his feet."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["The crowd on the bank was silent. It was not the silence of fear, exactly, but of a room where the light is being slowly turned up. People stood in their coats and boots, water dripping from their hems, and they looked at Hobb. They looked at the bridge that had not fallen.", "Skye Tanner reached out and took her father’s hand. Her long fair braid was wet and tangled, but her face was steady. She squeezed his fingers once, a small, firm pressure, and then she let go to pull her own coat tighter.", "An old man near the front opened his mouth. He started to recite the Almanac, the words coming out in a rush, the usual warnings about hunger and wickedness. But the words died in his throat. He looked at Hobb, who was still holding the beam, still waiting for rope, and the old man closed his mouth. He wiped his face with a sleeve and stepped back, making room for the men with the coils of thick hemp."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["There was no committee. There was no vote. The men of Bridgewater simply moved forward, and the town began to work. They lashed ropes to the arches, bracing the stone against the river’s pull. It was hard, wet, heavy work, and nobody complained.", "Gran was at the front. She had brought a dozen kettles, and the steam rose in thick, sweet clouds that smelled of bergamot and sugar. She moved from person to person, pouring tea into cup after cup, her silver bun slightly askew, her flour-dusted sleeves rolled up.", "\"Sit down, you'll fall down,\" she told a baker who was leaning on his tools.", "\"Sit down, you'll fall down,\" she told the postman, who was staring at the water.", "When the ropes were tight and the bridge was secure, Hobb tried to stand. He was too tired. The water was too deep. It took twelve people to help him up the stone steps, each one gripping an arm, a shoulder, or a knee, their faces pale and terrified, but their hands holding on with a strength that surprised even them."], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["Hobb stood, dripping and exhausted, his twine-mended spectacles fogging in the cool air. The crowd parted, not because they wanted to, but because the space around him felt heavy and still.", "Cedric stepped out. He was still shaking, his red waistcoat ruined, his hair a mess. He walked into the light of a lantern held by a shopkeeper, and he looked up. The troll’s face was broad and kind, and for a moment Cedric looked very small.", "\"It was me,\" Cedric said. His voice cracked. \"The first stone. And all the stories. I made them up. I was scared, so I made everybody else scared.\" He swallowed, his Adam’s apple bobbing. \"I don't know how to fix it. I have no way to fix it.\"", "Hobb breathed hard. The sound was like wind in a tunnel. He looked at Cedric for a long time, his eyes sharp behind the cracked glass. Then, very quietly, he said, \"Well. You did help me carry the rope.\""], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["The Mayor pushed forward. He adjusted his top hat, which was damp and bent, and opened his mouth. He was the Mayor. He was the one who made the rules. He was the one who had ordered the Cleansing. He was ready to speak, to explain, to justify.", "But the words did not come. He stood there, his mouth open, his face pale, and for the first time in his life, he had nothing to say. He looked at the bridge. He looked at the troll. He looked at Rue, who was watching him with eyes that were dry now, but very hard.", "The Mayor slowly took off his top hat. He held it in his hands, a small, dark circle in the grey rain, and he bowed his head.", "\"Ambrose,\" Gran said softly. Her voice was not loud, but it carried to everyone. \"The toll.\"", "The bell of the old bridge, which no one had rung in three hundred years, rang once. It was a clear, bright sound, shaking the last of the wind from the air, and for a moment, the whole town held its breath."], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "The Toll", "part": "PART FOUR: HOLDING UP THE BRIDGE", "paras": ["*From the Bridgewater Almanac: To err is human, to forgive is somebody else's job.*", "Three days later, the sun came out. It was a bright that made the wet cobblestones shine like polished buttons. The old bridge was closed off with wooden planks and yellow tape. Safe as a sleeping dog. But the steps down to the arch were crowded.", "The queue stretched all the way up the hill and around the corner of the Kettle & Crumb. People stood in the sun. They held their stories. A baker held a jar of honey and a confession about a sour temper. A schoolteacher held a poem she had never dared to read aloud. They went down one by one, into the cool shadow, and came back up looking lighter. As if they had handed over a heavy coat.", "At the front of the line stood the Mayor. He was holding a small, folded piece of paper. It was very long, with many creases. He took it out. Smoothed it against his knee. Whispered the first word of his apology. It was a very long apology. It had several chapters. Hobb, who was sitting on a stool with his teacup, listened to every single one. Nodding his large, mossy head."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["Rue waited. She waited while the baker went. She waited while the teacher went. She waited until the last of the crowd had gone up the steps and the sun was getting low, painting the river in shades of gold and copper.", "Then she went down.", "Biscuit trotted at her heels, his orange tail high. In her pocket, her fingers were wrapped tight around the small, horn button. It was cold and smooth, and it felt like a secret that had been kept for too long. The arch was different now. The lantern was mended and glowing, and the moss garden had been replanted, growing in neat, curly patterns along the stone walls. Beside the old bucket, there was a second one, new and shiny.", "Rue stopped. Her heart was beating very fast, a small bird trying to get out of her chest. She looked at Hobb. He was looking at her, his round spectacles mended with twine, his face soft and kind."], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["\"I didn't come to be forgiven,\" Rue said, her voice trembling only slightly. \"I came to tell you what my toll is.\"", "Hobb waited, holding his teacup with both hands while the steam curled up between them like a shy cat.", "\"It's the whole story,\" Rue continued. \"The lie, and how much I loved being your friend, and how sorry I am. And how I would give anything in the world to unring that bell.\" She swallowed hard. \"It hurt me, Hobb. Not you. Me. It hurt me to hurt you.\"", "Hobb looked down at his cup. The kettle in the corner hummed, a low, steady sound that filled the silence.", "\"It isn't ringing anymore,\" he said finally, his voice quiet. \"It's a while ago now.\" He lifted his head, and his eyes were gentle. \"I'll tell you something. When Willa said what she said, I was so hurt I forgot for sixty years to be anything else. I don't want to do that again.\""], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["\"I know,\" Rue whispered. \"It doesn't have to be all there is.\"", "Hobb nodded. He reached into his waistcoat pocket, where there were too many pockets for one jacket, and pulled out the horn button. He placed it in Rue's hand. It was warm from his touch.", "He looked at her for a long moment. Then he turned the button over in his enormous palm, the way a child might turn a shiny coin, and gave it back to her.", "\"It's yours,\" he said. \"Willa's, and yours. It was never a payment. It was a seat.\"", "Rue sat down on the stone step. Hobb sat down next to her, his large shoulders filling the space. They sat there for a long time, and they said nothing at all. The moss on the wall grew a little, just a little, in the shape of a closed eye, and then it opened, and the light came in."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["When Rue climbed up the steps into the sun, the air felt different. It was lighter, and it smelled of rain and wet stone and the faint, sweet scent of the moss garden.", "Gran was standing at the top. She was wearing her best hat, the one with the blue ribbon, and she was leaning on the wooden rail, looking out at the river. She wasn't crying, exactly. Her face was very still, and her hands were holding the rail tight.", "She looked at Rue. She didn't say anything. She didn't have to.", "Then Gran turned, and she began to walk back down the steps. One at a time. Slowly. Her silver bun was slightly askew, and her flour-dusted sleeves were tucked into her apron. She was going down to sit in the seat. It was sixty years late, but it was right on time.", "Rue held the lantern up, and she watched her go."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "The Almanac, Revised", "part": "PART FOUR: HOLDING UP THE BRIDGE", "paras": ["*From the Bridgewater Almanac (revised): Look under the bridge. You may be surprised at who is holding it up.*", "The bunting was indeed damp, and the singing was worse. A new plank sat in the middle of the old bridge, painted a cheerful yellow. It bore a name in Perrin’s careful, ink-stained hand. It was the first time Hobb’s name had been written down anywhere in Bridgewater, and the first time it had been read aloud.", "He was the guest of honor, which meant he was standing very still and trying to look like a bridge rather than a person. For the first ten minutes, he hid behind Gran, who was holding a scone like a shield and looking very proud. Then the small children noticed him.", "They did not climb him. They inspected him. One boy poked a mossy ear. A girl asked if he had a pocket for her marble. Hobb, who was ten feet tall and shy as a rabbit in a meadow, looked down at the sea of freckled faces. He found that he was smiling.", "It was a terrifying, wonderful thing to be seen."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["The Bridge Club had dissolved into something quieter, something that smelled of flour and wood shavings. It was the Toll Table. Skye Tanner, Cedric Pettibone, and Perrin Fen ran it. The rules were simple: you paid a story, and you received a scone.", "Cedric was very good at sweeping. He did not sweep the way he used to, with his back to the work and his eyes on the crowd. He swept the bridge, stone by stone, with a broom that was almost as tall as he was. He and Hobb were working out a complicated thing. Apologies, it turned out, could only fix the small breaks. The deep cracks required mornings. Many of them. Cedric swept. Hobb mended the railings. They did not always speak, but they did not look away.", "Skye held the ledger. Perrin drew the stories as they were told, so they would not vanish into the air. It was a decent arrangement. It was, in fact, a good one."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["Then the horn came. It was a long, steady blast that rolled up the river and shook the bunting in the trees. The *Persistent* was around the bend, her hull white against the brown water.", "On the deck, Mari Alder stood with her blue cap on backwards, waving both arms. She was laughing, or she was shouting, and it was impossible to tell the difference from this distance. Rue, who had been standing on the bridge with a scone in each hand, dropped them. They hit the stone with a soft thud.", "She ran. She ran faster than she had ever run in her life, her boots slapping the wet stone, her chest heaving with a thumping that felt like a trapped moth. Mari caught her in mid-air, and for a moment the world was just warm arms and the smell of river mud and joy. Over her mother’s shoulder, Rue saw Gran and Hobb, at either end of the bridge, both waving."], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["Mayor Ambrose Pettibone stood on his soapbox, wearing his top hat and holding the *Bridgewater Almanac*. The book was covered in red ink, with the old rules about hunger and wickedness crossed out in thick, angry lines. He had written new ones in his careful, looping hand, and now he read them aloud.", "His voice was small. \"Look under the bridge. You may be surprised at who is holding it up.\"", "He paused, and the square went very quiet. The Mayor looked at Hobb, who was doing his best to look like a tree, but was mostly succeeding as a very large, mossy bush. Then the Mayor sat down on his soapbox, which let out a loud, wooden creak that echoed off the stone walls.", "\"I should like to add,\" he said, to the sudden cheering that followed, \"that I was mistaken about a great many things.\"", "It was the best speech he had ever given, and he did not do it again."], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["Dusk settled over the river, thick and blue. Rue and Hobb sat on the stone parapet, their feet hanging over the water. Biscuit, the enormous orange cat, slept in Hobb’s lap, his tail twitching with every rumble of a purr. Perrin sat between them, his pencil moving quickly as he traced the curve of the arch.", "Rue told him the last story. It was about a girl who believed that being useful was a cure for loneliness. She described the cold bench by the school wall and the squashed cheese sandwich she had eaten in careful, small bites. She told him about the feeling of her heart, heavy and cold, sitting at the bottom of her pocket like a wet stone. She admitted she had been wrong.", "Hobb listened. He did not apologize, and he did not tell her it would pass. He simply rested his broad, warm palm on the top of her head.", "\"Somebody has to hold it up,\" he said, his voice low and steady.", "\"Right then,\" Rue whispered. She leaned her head against his shoulder, which was as wide and solid as the bridge itself."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "Old Mossback", "part": "PART ONE: SIXTY-ONE CHIMNEYS AND ONE TROLL", "page": 1}, {"n": 2, "title": "The Kettle & Crumb", "part": "PART ONE: SIXTY-ONE CHIMNEYS AND ONE TROLL", "page": 6}, {"n": 3, "title": "The Dare", "part": "PART ONE: SIXTY-ONE CHIMNEYS AND ONE TROLL", "page": 11}, {"n": 4, "title": "Under the Arch", "part": "PART ONE: SIXTY-ONE CHIMNEYS AND ONE TROLL", "page": 16}, {"n": 5, "title": "Clove Oil", "part": "PART TWO: THE TOLL OF ONE STORY", "page": 21}, {"n": 6, "title": "The New Boy", "part": "PART TWO: THE TOLL OF ONE STORY", "page": 26}, {"n": 7, "title": "The Oldest Rule", "part": "PART TWO: THE TOLL OF ONE STORY", "page": 31}, {"n": 8, "title": "Cedric Knows", "part": "PART TWO: THE TOLL OF ONE STORY", "page": 36}, {"n": 9, "title": "Moss Garden", "part": "PART TWO: THE TOLL OF ONE STORY", "page": 41}, {"n": 10, "title": "The Announcement", "part": "PART THREE: THE TROLL CLEANSING", "page": 46}, {"n": 11, "title": "A Plan (Several Plans)", "part": "PART THREE: THE TROLL CLEANSING", "page": 51}, {"n": 12, "title": "Three at the Arch", "part": "PART THREE: THE TROLL CLEANSING", "page": 56}, {"n": 13, "title": "The Bell", "part": "PART THREE: THE TROLL CLEANSING", "page": 61}, {"n": 14, "title": "The Stone Door", "part": "PART THREE: THE TROLL CLEANSING", "page": 66}, {"n": 15, "title": "The Locked Drawer", "part": "PART FOUR: HOLDING UP THE BRIDGE", "page": 71}, {"n": 16, "title": "The Rain", "part": "PART FOUR: HOLDING UP THE BRIDGE", "page": 76}, {"n": 17, "title": "Somebody Has to Hold It Up", "part": "PART FOUR: HOLDING UP THE BRIDGE", "page": 81}, {"n": 18, "title": "What the River Took", "part": "PART FOUR: HOLDING UP THE BRIDGE", "page": 86}, {"n": 19, "title": "The Toll", "part": "PART FOUR: HOLDING UP THE BRIDGE", "page": 91}, {"n": 20, "title": "The Almanac, Revised", "part": "PART FOUR: HOLDING UP THE BRIDGE", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
