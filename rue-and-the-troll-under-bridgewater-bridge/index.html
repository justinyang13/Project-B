<script>
const D = {"title": "Rue and the Troll Under Bridgewater Bridge", "sub": "A Story About Looking Twice", "pages": [{"no": 1, "ch": 1, "ctitle": "Old Mossback", "part": "PART ONE: SIXTY-ONE CHIMNEYS AND ONE TROLL", "paras": ["*From the Bridgewater Almanac: The troll under the old bridge is enormous, hungry and wicked. Do not look at him. Do not speak to him. Above all, do not ask him questions.*", "The town of Bridgewater had four bridges, sixty-one chimneys and one troll, and it was the troll that everybody talked about.", "Nobody had actually seen him. That was the trouble. A troll you have never seen can be as large and as terrible as you like, and every year in Bridgewater he grew a little larger and a little more terrible, the way a fish does when it is being described. By the time this story starts, the troll under the old bridge was said to be the size of a haystack, with teeth like garden spades and a temper like a kettle on the boil, and he was known to the whole town, with great affection and no evidence, as Old Mossback.", "\"Steer clear of Mossback,\" mothers said, tucking scarves into coats.", "\"Never mind the weather, mind the bridge,\" said the old men outside the barber's, and nodded at one another as though they had said something wise."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["Rue Alder, who was ten, knew every rule about the troll by heart. She knew them the way she knew the times tables and the words to the town song, because she was a girl who liked to get things right.", "She was small and sturdy and freckled, with curly red-brown hair tied up in two puffs with green yarn, and on this particular morning she was wearing her mustard-yellow raincoat, which had been patched twice, and a pair of rubber boots that had belonged to somebody else's older brother. She was carrying a tray of scones from the Kettle & Crumb, where she lived with her Gran, across three bridges to the doctor's house on the far side of the river.", "She did not take the fourth bridge. Nobody did. It was the oldest and the shortest way, and it was humped in the middle like a cat that has heard a noise, and the moss on it was very green, and everyone walked the long way round.", "Rue walked the long way round, too. She was good at it."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["The Bridgewater schoolhouse had one yard, one chestnut tree and, at half past twelve every day, one very clear arrangement of children. The Bridge Club sat in the middle of the yard, where the sun was. Their leader was Skye Tanner, who was eleven and very tall, with a long fair braid, and who was used to being followed. Next to her, saying most of the words, sat Cedric Pettibone, the Mayor's nephew, who was skinny and slick-haired and wore a red waistcoat as though somebody might be about to take his picture.", "The Bridge Club had a game. The game was daring each other to touch the middle stone of the old bridge, and so far nobody had done it, though everybody had said they would.", "Rue sat at the very end of the long bench by the wall with her lunch in her lap, and wore a cheerful face, and ate her bread one careful bite at a time. It was a good face. She had been practicing it since spring.", "Nobody asked her to join them. She told herself she would not have wanted to."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["Rue had a private rule, and she had made it all by herself: you cannot be lonely if you are useful.", "So she was extremely useful. She swept the tea shop floor before she was asked to, and she balanced Gran's accounts in the evenings, and she ran errands for half the street and wrote a long cheerful letter every Sunday to her mother, who captained a river barge called the *Persistent* somewhere far downstream and was, according to the last letter, \"still stuck behind a very rude sandbank.\" Rue fed Biscuit, the shop cat, who was enormous, orange and grateful for nothing. She learned the names of every customer and the way each of them took their tea.", "It was surprising how much a person could get done if she never sat still for long enough to notice she was on her own. Rue had done a very great deal, by the end of the summer.", "She was tired in a way that sleeping did not fix."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["On the last day of the week, Cedric Pettibone climbed on a crate in the yard and announced that Old Mossback had eaten the baker's sheep.", "\"Last winter,\" he said. \"All twelve. The wool was still on the bridge.\"", "A gasp went round, the good, satisfied gasp of a crowd being frightened on purpose. It was then that the new boy under the chestnut tree, Perrin Fen, who was thin and quiet and wore a wool hat two sizes too big for him, and who had eaten lunch alone since April, said clearly and to nobody in particular that sheep did not usually go over bridges in the first place, and that there was only one baker, and he had never had twelve.", "The yard laughed at him. It was not a cruel laugh, which somehow made it worse.", "Rue heard every word. She opened her mouth to say something. She felt her cheerful face slide a little, like a hat in a wind, and she closed her mouth again, and looked at her bread.", "It bothered her all afternoon."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Kettle & Crumb", "part": "PART ONE: SIXTY-ONE CHIMNEYS AND ONE TROLL", "paras": ["*From the Bridgewater Almanac: A well-run household has three rules: be quiet, be quick and be back before dark.*", "The Kettle & Crumb smelled of burnt sugar and clove oil. It was a thick, warm smell, the kind that stuck to the back of your throat. Gran Wilhelmina stood behind the counter, her silver bun bristling with pencils and a small paintbrush. Her half-moon glasses slid down her nose. She wiped the brass register with a rag.", "Flour dusted her sleeves to the elbows. She looked like a loaf that had lost a fight with a bag of flour.", "\"Sit down, you’ll fall down,\" she told the Mayor.", "He hovered by the door, top hat in one hand, worry on his round face.", "\"The bridge, Wilhelmina,\" the Mayor said, tapping his foot. \"The stones are loose. I feel a draft right through my wool.\"", "Gran did not look up from her polishing.", "\"Then buy a thicker wool, Ambrose. Or a coat. I have a good one in the back, three shillings off.\"", "She said this to everyone. The baker, the postman, the children who lingered for a second cup of cocoa. It was her way of anchoring them to the earth. Or at least to the floorboards. They were old and creaky, and they did not much appreciate being jumped on."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["Upstairs, the flat was quieter, smelling of lavender and dried herbs. Gran set a plate of cold scones on the table, the crumbs bouncing off the wood. \"So,\" she said, leaning on the back of a chair. \"How was the yard today, Rue? Did the sun shine?\"", "\"Fine,\" Rue said. She had practiced this word in the mirror that morning. It was smooth and round, like a stone that had been rolled by the river for a very long time. \"Just fine. The chestnut tree dropped a lot of leaves. Cedric told a story about a sheep.\"", "Gran’s eyes, which were sharp behind the glasses, narrowed just a fraction. She did not press. She knew Rue’s face when it was working hard, pulling the corners of the mouth up to keep the rest of the expression in check. She simply poured the tea, the steam rising in a lazy spiral, and let the silence do its work.", "\"Right then,\" Rue said, because her throat felt tight and she needed a sound that was not a question.", "Gran nodded. She did not believe her. But she let her keep it, which was a kindness Rue was not sure she deserved, and which made the lie feel heavier than the truth ever had."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["The river post did not come by foot, but by barge, and it arrived with a splash of water against the shop window. A damp envelope, brown and stiff with dried river mud, sat on the counter. Rue knew the handwriting before she opened it. It was tall and looping, the kind of writing that seemed to be moving even when the paper was still.", "*Dear Rue,* it said. *The Persistent is stuck behind a very rude sandbank. The river is being stubborn, like a mule that has forgotten it is a mule. I will be home by the Founders' Fair, if the river behaves. Send a scone.*", "Rue read it once. Then again. Then a third time, until the ink seemed to blur into a warm brown haze. She folded the letter carefully, smoothing the creases with her thumbs. She tucked it into her pocket, right next to her heart, where it pressed against her ribs with a solid, hopeful weight.", "If Mari was coming home, then the town was not just a place where people walked the long way round. It was a place where a girl waited for her mother to dock at the end of the river."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["Later, while Gran dozed in the armchair with a book tucked under her chin, Rue went to the dresser to find a clean handkerchief. The wood was dark and polished. There was one drawer that never opened. It had a small brass latch, tarnished green with age, and a lock that looked as though it had been turned many times by careful hands.", "She did not touch it. She had made a rule about that, too.", "But that night, as Gran moved the book to the nightstand and yawned, stretching her arms above her head, Rue saw her hand go to the latch. The sound of the lock clicking open was small. It filled the room like a bell. Gran pulled out a single object. It was a horn button, large as a saucer, the color of dark amber. She held it up to the light, turning it slowly. Her fingers traced the edge. Her face was very still. Very far away.", "Then she put it back. Locked the drawer. Blew out the lamp."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["Biscuit was already on Rue’s feet, a warm, purring loaf of orange fur. The cat stretched, yawned a yawn that lasted for three seconds, and settled into a tight coil. Rue lay on her back, staring at the ceiling, listening to the town settle. A window creaked open on the other side of the street. A dog barked twice, then stopped. The river murmured, a low, constant sound that seemed to come from everywhere and nowhere.", "She thought about the old bridge. She thought about the moss, and the way the stones were uneven, and the fact that nobody walked on it. Had anyone ever looked under it? Really looked? Not to count the sheep, or to check for wool, but just to see what was there.", "Right then, she told herself. You haven’t thought that. You are tired. You are going to sleep.", "But the image of the dark space under the arch stayed with her, waiting in the corner of her mind, patient as a cat."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "The Dare", "part": "PART ONE: SIXTY-ONE CHIMNEYS AND ONE TROLL", "paras": ["*From the Bridgewater Almanac: A dare is a gift. Always accept it.*", "Skye Tanner did not usually look at Rue. She looked past her, through her, at the sunlit middle of the yard where the Bridge Club sat like a parliament of very confident children. But today Skye’s long fair braid was loose, and her eyes were bright with something that looked like trouble.", "\"Rue,\" she said, her voice carrying over the rustling leaves of the chestnut tree. \"Come here.\"", "Rue’s heart did a strange flip, rising in her chest like a kite that has suddenly found a draft. She set down her squashed cheese sandwich and walked to the sun. The others fell silent. Cedric Pettibone, in his red waistcoat, leaned forward.", "\"We are playing a game,\" Skye said. \"A real one. Not the sheep game. The bridge game.\"", "\"Cross the old bridge,\" Cedric added. \"At dusk. Touch the middle stone. And come back.\"", "He paused, a sneer twitching at the corner of his mouth. \"Everybody’s done it.\"", "Rue looked at the mossy hump of the oldest bridge in the distance. It waited there, silent and green, and she realized that nobody had ever asked her to do anything before."], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["Cedric was not finished. He had a way of adding things to a rule that made them heavier, like putting a stone in a pocket.", "\"The troll takes a toll,\" he said, his eyes bright with invented terror. \"One person’s name. If you give him your name, he keeps it. If you don’t come back, we’ll know.\"", "He looked pleased with himself, as if he had built the bridge himself.", "Rue felt the warmth of the sun on her face, but a cold thread was winding around her stomach. Under the chestnut tree, Perrin Fen shook his head. It was a small movement, barely a flick of his oversized wool hat, but Rue saw it. He was looking at Cedric, then at Rue, then at the ground.", "She looked at Skye, who was watching her with an intensity that felt dangerous.", "\"Right then,\" Rue said. The words came out steady. She had said them a thousand times when she was scared, and they always worked. She turned and walked back to the wall, leaving the group in the sun to wonder what had just happened."], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["Dusk in Bridgewater was a slow, purple thing. It crept over the roofs and settled on the water. The old bridge stood out against the darkening sky, its humpbacked shape distinct against the four others. The stones were fitted so neatly that the joins looked like a faint smile, amused by the town’s fear.", "Rue walked the long way round first, just to look. The lamplighter’s lamp at the far end was unlit, a dark bulb hanging in the air. Below, the River Wend murmured, a low, constant sound that seemed to come from everywhere and nowhere.", "It was beautiful. That was the trouble. It was so quiet and so old and so lonely that it felt less like a danger and more like a secret. No one had ever said that about the old bridge. They had only ever said *don’t go there*. Rue touched her scarf and began to cross."], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["The stones were cool under her boots, but as she reached the middle of the bridge, the temperature changed. The stone beneath her hands was warm. Not warm from the sun, which had set an hour ago, but warm like a loaf of bread fresh from the oven. It radiated a gentle heat that seeped through her gloves.", "Rue stopped. Her heart beat against her ribs, a quick, hard drumming. She looked down. The stone was smooth, worn by centuries of feet that were no longer there. She placed her palm flat against it.", "From somewhere beneath her feet, from the dark space under the arch, came a sound. It was not a growl, or a roar, or the snap of a branch. It was a sniff. A wet, enormous sniff, followed by a very quiet sob. It was the sound of a creature that was tired, and hurt, and alone."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["Rue stood in the middle of the bridge. One hand gripped the iron rail. The other rested against her cheek, trembling slightly.", "The crying came again. Soft. Broken. It vibrated through the stone under her boots. It was a small sound, the kind that gets lost in a classroom or under a blanket. But the dusk was quiet. In that silence, the sob was loud as a bell ringing in an empty church.", "She thought of the town. She thought of the almanac. *Do not ask him questions.* She thought of Gran’s locked drawer. She thought of how nobody ever looked under the arch. She thought of Perrin, eating lunch alone under his hat. She thought of Skye, who was used to being followed.", "It was the most sensible thing she had ever done. It was also the most foolish.", "Rue let go of the rail.", "She walked to the side of the bridge. There, hidden by a tangle of greenery, were mossy steps leading down toward the water. She did not look back at the town. She only looked down. Into the dark. To see who needed help."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "Under the Arch", "part": "PART ONE: SIXTY-ONE CHIMNEYS AND ONE TROLL", "paras": ["*From the Bridgewater Almanac: Never go under the old bridge. There is nothing there but damp.*", "Rue descended the mossy steps. The air under the arch did not smell of damp. It smelled of woodsmoke, old paper, and something sweet, like dried apples. It was a room, curved and high, with a tiny iron stove glowing red in the corner. A kettle sat on top, humming a low, steady note. Shelves of books were wedged into the stone walls, and on the floor, a garden of moss grew in careful, swirling patterns.", "In the center of it all sat a troll.", "He was the size of a haystack, grey-green and mossy, perched on an upturned wooden bucket. His hand rested on his cheek. He wore round spectacles mended with twine and a waistcoat with a great many pockets. Two small, blunt tusks jutted from his lower lip.", "He looked up.", "Rue opened her mouth. The troll opened his.", "They both screamed, politely and in unison, because the almanac had never explained what to do if the monster was crying."], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["The troll stopped screaming first. He lowered his hand, looked at Rue, and then looked at the bucket.", "\"Please don't tell anyone,\" he said. His voice was like gravel rolling in a box. \"I'll leave. I'm very good at leaving. It is a talent I have honed over three centuries.\"", "He shifted on the bucket, wincing. \"Only the lantern's broken. And I can't see the stones to fix the bridge. And I have a tooth.\"", "\"I have a name,\" he added, rubbing his ear, which looked like a large, green leaf. \"It is Hobb.\"", "\"I am Rue,\" she said, because he had introduced himself, and it seemed rude not to.", "Hobb nodded. He apologized. Then he apologized again for the noise. He apologized for the teeth. He apologized for the moss, which had gotten a little too ambitious near the stove. He apologized for the fact that he was there at all. He apologized six times in three minutes, and Rue found her feet shuffling back and forth, feeling like a fly on a plate."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["\"Where does it hurt?\" Rue asked.", "Hobb blinked behind his round spectacles, looking as if he had just heard a question he did not know how to answer. \"The back, left side. The tusk-tooth. It throbs like a drum in a barrel, which is very undignified.\"", "Rue had never once in her life walked past a person with a toothache, but she knew exactly what Gran did for that sort of thing. She knew about clove oil wrapped in cotton, and the little salt water rinse, and the need for silence because throbbing teeth do not appreciate loud conversation.", "\"It will pass,\" Rue said, though she knew it would not. Not on its own. \"I will be back tomorrow with the oil.\"", "Hobb looked at her. His broad, kind face seemed to fold in on itself, confused and hopeful at the same time. \"You will? Most people do not come back. They run, or they throw things. Usually both.\"", "\"I brought scones,\" Rue said, which was not true, but it was a nice thought. \"I will bring oil. Right then.\""], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["\"You are the first person in a long time to offer a solution,\" Hobb said, scratching his head with one thick finger. \"The others offer stones. Or silence. Occasionally, a very aggressive poem.\"", "He looked around the room. \"I have a toll, you know. For crossing the bridge. It is the oldest rule. Nobody pays it in a long time. They just walk across, or don't. But the toll is... one story. From anyone who wants to cross. I like stories. I am very bad at making them, but I like hearing them.\"", "Rue considered this. She had plenty of stories. She had a story about Biscuit, the Kettle & Crumb’s cat, who had stolen a kipper off the Mayor’s plate last Tuesday and then spent the afternoon pretending to be a statue by the window.", "Hobb listened. He did not laugh until the end, when Rue described the Mayor’s face. Then he laughed. It was a low, rumbling sound, like a cello being played by a giant. The kettle on the stove jumped, and a puff of steam shot out like a surprised snake."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["Rue climbed the mossy steps. The dusk had turned to night. The air was cool and smelled of wet stone. She reached the top of the bridge and looked out over the river. The town lights were on, yellow and steady. The Bridge Club had gone home. Nobody had seen her.", "She stood there for a long time. The water lapped against the arch below. She told herself the truth, because she was good at getting things right. She had a secret. And she had a friend. In that order. She was not sure she had ever had either before today.", "\"Right then,\" she said to the river, because it was a good time to say it.", "She turned and walked home. She had to steal clove oil. And she had to be very, very good at it."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "Clove Oil", "part": "PART TWO: THE TOLL OF ONE STORY", "paras": ["*From the Bridgewater Almanac: Trolls do not need dentists. They eat their teeth.*", "The clove oil hid behind the burnt sugar and dried lavender. Rue waited for the shop to empty. Her hands trembled, but only a little. She pocketed the small glass bottle. Then she scrubbed the floor.", "She attacked the seams with a stiff brush and soapy water. The grime came up in grey clouds. She scrubbed until her arms ached. The tiles shone.", "It was a fair trade. One small theft for one very clean shop. The hollow feeling in her chest did not go away.", "Dusk arrived quickly. The sky turned a deep, bruised plum color. Rue walked to the old bridge. Same stone. Same moss. Same hump in the middle.", "But this time, she did not hurry. She did not look at the water. She walked with her chin up. Her boots thudded softly on the stone. She did not feel like a girl on a dare. She felt like a friend keeping a promise."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["Under the arch, Hobb sat on a flat rock with his back pressed against the stone. He looked smaller here, his mouth open like a wide, dark cave of grey-green muscle holding two small blunt tusks. His eyes were shut tight, squeezed as if he were trying to keep the pain inside.", "\"Right then,\" Rue said, setting down her bag. She climbed onto the upturned bucket she had brought, her boots gripping the wood for balance. In one hand, she held a stick; in the other, a wad of cotton. Her grip was steady because she had practiced.", "\"Tell me about the scones,\" she said. \"The ones Gran makes on Tuesdays. The ones with the little bits of dried fruit.\"", "\"They are... dense,\" Hobb whispered. \"Like bricks.\"", "\"Bricks,\" Rue repeated. \"And the jam?\"", "\"Sticky.\"", "She reached into his mouth with the stick, guiding it gently past his teeth. She felt for the ache, not in a tooth but in the gum, where a pebble sat jammed deep and hard and round. She hooked the cotton around it and pulled, and it came out with a soft pop.", "\"There,\" she said. \"Better?\"", "Hobb opened one eye. His face was slack with relief."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["Hobb took the pebble and turned it over in his massive palm, where it sat as small and insignificant as a stray raisin. He looked at the stone, then at Rue, his expression shifting from pain to something much more complicated.", "\"I am sorry,\" he said, his voice dropping to a whisper. \"I am so sorry. I did not mean to have a pebble in my gum, and I certainly did not mean to be in pain. I am sorry for the noise I made.\"", "\"Stop,\" Rue said firmly.", "He stopped talking, though his ears, which looked like large, droopy leaves, still twitched.", "\"Stop apologizing,\" she continued. \"It was an accident, and it is fixed. You do not have to keep saying sorry.\"", "Hobb blinked slowly, his round spectacles mended with twine catching the dim light. \"Nobody,\" he said quietly, \"has ever told me to stop apologizing before.\"", "He stood up, moving with the careful, deliberate caution of a large dog trying not to wake a sleeping kitten. He shuffled to the corner where a small kettle sat on a stone stove. The kettle began to hum, a low, warm vibration that sounded exactly like Biscuit purring on Gran's lap.", "\"It is pleased,\" Hobb explained, pouring the water. \"It has been listening to me for a century. It knows when I am being difficult, and I have been being very difficult today.\"", "He poured the tea into two cups. One was the size of a thimble, and the other was the size of a soup bowl."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["\"Look,\" Hobb said, gesturing to the corner.", "There were books, dozens of them, all old and soft with cracked covers, and some had water stains on the pages that looked like maps of places she had never been.", "\"I read everything that falls in the river,\" Hobb said. \"Sometimes a whole chapter. Sometimes just a page. I am working on a novel about a lighthouse. It is very slow.\"", "He pointed to a patch of moss on the wall, which was growing in a tight, small spiral.", "\"That is me,\" Hobb said. \"Anxious. It grew like that this morning. When I thought you were not coming. Yesterday it was a straight line. I was feeling steady.\"", "On a shelf sat a jar of buttons, hundreds of them in different colors and sizes, and next to it, a long stick with notches carved into it.", "\"The tally,\" Hobb said. \"One notch for every story. I have been counting for three hundred years. I am getting good at it.\""], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["Hobb sat back down, wrapping both his hands around the warm clay of his cup, and watched the steam curl up into the dim air until it vanished.", "\"How did you come to be under my bridge?\" he asked, his voice dropping to a low hum.", "Rue looked at her own teacup, tracing the rim with a finger. \"On a dare,\" she said. \"Cedric dared me to touch the middle stone. I did it. Then I saw you crying.\"", "Hobb went very still. He did not move for a long moment, and the only sound was the kettle humming softly in the corner, a low, contented vibration.", "\"Nobody,\" he said slowly, \"has ever been dared to come and see me. It is always dared to stay away.\"", "Rue looked at him. She saw the way his shoulders were hunched inward, the way his thick fingers were wrapped tight around the handle, holding on as if the cup were the only solid thing in the world. A sharp, sudden ache bloomed in her chest, right behind her ribs.", "\"I'm sorry,\" she said. The words tumbled out before she could catch them.", "Hobb looked up. His eyes were wide, and the spectacles on his nose tilted slightly. \"It isn't yours to be sorry for,\" he said softly.", "It was the kindest thing anybody had said to her all year."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "The New Boy", "part": "PART TWO: THE TOLL OF ONE STORY", "paras": ["*From the Bridgewater Almanac: Newcomers are like weeds: give them a season and they will either take root or go away.*", "Rue Alder had spent the last seven days with the friendliest person she had ever met. She had also spent the last seven days sitting at the end of the bench by the wall, eating her lunch alone.", "It was a strange thing. You would think that having a secret friend would make the empty bench feel less empty. But it did the opposite. Now, when the other children laughed, Rue heard the echo of a different kind of laughter. She heard Hobb humming a tune that did not have a name, right inside her head. It made the real laughter in the yard feel very loud and very thin, like paper being torn.", "She looked at the chestnut tree. Under it sat Perrin Fen. He was still wearing his wool hat, the one that was two sizes too big and looked as if it had swallowed him whole. He was drawing in a small notebook. His fingers were stained blue with ink, up to the second knuckle.", "Rue stood up. She put her squashed cheese sandwich in her coat pocket. It was a brave thing to do. She felt her heart doing a small, nervous flip in her chest, the way a coin does when you drop it into a jar and it hits the bottom.", "\"Right then,\" she said to the air."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["Perrin did not look up; he was busy. His pencil moved in tiny, careful circles, sketching the texture of the bark, while Rue walked over and sat down on the grass. She left a polite distance of about two feet between them, which was close enough to be a friend but far enough to run away if necessary.", "She said nothing.", "For a very long time, the only sound was the scratch of his pencil and the distant chatter of the Bridge Club. Rue looked at the leaves, which were turning a color like dried apple juice, and she watched a beetle crawl along a root as she waited.", "Perrin’s pencil stopped. He did not turn around, but his shoulders relaxed, just a little, because he was waiting, too. It was exactly right, and better than any conversation she had ever tried to start, because there was no need to fill the silence with the wrong words. They just sat there, two people who were good at being alone, making a kind of quiet company."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["Finally, Perrin closed his notebook. He held it out to her, not with a word, but with a steady hand. The cover was plain brown leather, worn smooth at the corners.", "Rue opened it.", "Her breath caught. Inside were drawings of the bridges. Not just sketches, but maps. Every stone was there. The cracks were marked with tiny, precise lines. There were four of them, each one detailed so carefully that she could almost feel the roughness of the granite.", "But the last page was different. It was a drawing of the old bridge, but from underneath. The arch was shown from the water's perspective, looking up. The roots of the trees were tangled in the shadow. The stones were drawn with a softness that made them look like they were breathing.", "\"I couldn't see the bottom,\" Perrin said. His voice was quiet, barely louder than the wind. \"I wanted to.\""], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["\"Two weeds!\"", "The voice was sharp and thin, cutting through the morning air. Cedric Pettibone strode past, his red waistcoat standing out brightly against the dull grey coats of the Bridge Club, while Skye Tanner walked beside him, her long braid swinging like a pendulum.", "She glanced at Rue, then looked down at her own boots, as if the patch of grass had suddenly grown a fascinating new pattern.", "Rue felt the old sting of embarrassment prick at her skin, but it did not take hold. It slid right off her, just like water does off the hood of a raincoat. She looked at Perrin. He had not flinched, nor had he looked away, and he simply stood there with the quiet steadiness of a boy who has learned not to expect the world to look back.", "\"Thanks,\" he said. Just that. One word, soft and clear as a bell.", "Rue smiled, and this time it was a real smile, not the practiced cheerful face she wore for teachers. \"You're welcome,\" she said.", "Perrin tucked the notebook into his pocket, his ink-stained fingers smearing slightly on the leather. \"I haven't spoken to anyone since April,\" he said, \"except a goat. But he didn't answer.\""], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["That evening, Rue went under the arch. She carried Perrin’s notebook, which she had asked to borrow. Hobb was sitting on his favorite rock, his spectacles mended with twine, turning his head slowly to let the moss settle on his shoulders.", "Rue sat down. She opened the notebook to the last page, the one of the arch.", "\"Hobb,\" she said. \"There’s a boy. His name is Perrin. He draws bridges. He knows what the bottom looks like.\"", "Hobb’s ears, which were shaped like leaves, perked up. He leaned forward, his breath smelling of tea and old books. He looked at the drawing, and then at Rue. He blinked, once, and then again, as if checking the ink had not run.", "\"You can't bring him,\" he said. His voice was high, almost a squeak. It was the voice of a man who was terrified and delighted in exactly the same amount.", "Rue shook her head. \"Not yet,\" she said. \"I’m just telling you. So you know the town is watching.\"", "Hobb let out a long, slow breath. The moss around his feet rippled out in a wide, gentle wave."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "The Oldest Rule", "part": "PART TWO: THE TOLL OF ONE STORY", "paras": ["*From the Bridgewater Almanac: The old bridge was built by the town's founders, with their own hands, and has never needed mending.*", "Rain tapped against the moss on the old bridge, a steady, patient drumming that made the hollow under the arch feel like a cave inside a sleeping giant. Rue sat cross-legged on a flat stone, her rubber boots squelching slightly, while Hobb poured tea from a kettle that hummed a low, contented note.", "\"Tell me a story,\" Hobb said, his grey-green skin dusted with ferns, and he looked at Rue with round spectacles mended with twine. \"A good one. I have paid in tea for the last four.\"", "Rue sipped the tea, which tasted of honey and damp earth. \"Right then,\" she said, because she was a little scared of how much she liked this. \"The Mayor’s hat is missing its left feather. He says it flew away, but Biscuit saw it in the drain. And Cedric’s red waistcoat has a stain that looks suspiciously like jam.\"", "Hobb laughed, a sound like a rock rolling down a hill. \"And the older stories? The ones before the stones?\"", "Rue leaned forward. \"The town says you ate the baker’s sheep.\"", "\"I did not eat the baker’s sheep,\" Hobb said, offended. \"I was reading a novel. It had a very sad ending.\""], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["\"Before the bridge,\" Hobb said, his voice dropping to a soft murmur that matched the rain, \"there was only a ford, where the mud got into everyone's boots and the huts smelled of woodsmoke.\" He traced a finger along the wet stone of the arch. \"I was young then, much younger than I am now, and I lived under the water, lifting people up on the flood nights when the river got too angry.\"", "\"The founders wanted a real bridge, something made of stone that would last, but they could not build one without help.\" He paused, looking at the kettle. \"So I offered a deal. I would build it, stone by stone, in the dark, while they slept. In return, they would pay a toll of one story to cross, and no one would ever look under it too closely.\"", "Rue tilted her head. \"Why wouldn’t they look?\"", "\"Because,\" Hobb said, adjusting his spectacles, \"I was shy, and I was tired, and I thought if they just walked over, they might forget I was there.\" He smiled a small, sad smile. \"It was a fair deal, and nobody meant it to be forgotten.\""], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["\"Three hundred years,\" Hobb said, tapping the stone beside him. \"I have kept it standing. I re-seat the stones when the river shifts them. I unclog the drains when the silt builds up. I patch the cracks before they widen. The town thinks the bridge just doesn’t need mending. They say it is strong. They say it is old and wise.\"", "He smiled, and the moss on his shoulders rippled. \"That is the whole idea of a good bridge, isn't it? You walk across and you don't think about the person holding it up. You just get to the other side, dry and safe. It’s only a bridge. Somebody has to hold it up.\"", "Rue looked at his hands, which were broad and rough as tree bark, and then at the smooth, dry stones of the arch. She thought of the long way round she had walked for years. She thought of the fear in the town’s eyes. \"It’s a very heavy job,\" she said quietly."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["\"Nobody pays,\" Rue said. She had been thinking about this. \"If the toll is one story, why does nobody pay? Why do they just throw stones?\"", "Hobb’s ears, which were shaped like leaves, drooped slightly. He reached into his patched waistcoat and pulled out a long, twisted stick of wood. It was a tally stick, carved with notches. Most of the notches were worn smooth.", "He pointed to a cluster of marks near the top. There were perhaps twenty of them, and then a jagged break in the wood, as if a piece had been snapped off.", "\"This was the last one,\" Hobb said. His voice was very quiet. \"About sixty years ago. A girl came. She paid the toll. She told me a story I have not forgotten. And then she made me a promise.\"", "Rue felt a cold prickle at the back of her neck. \"What promise?\"", "Hobb did not answer. He looked at her, and his face did something that made Rue lower her gaze to her boots. He carefully put the stick back in his pocket."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["Rue climbed the steps out of the arch, the rain now a soft mist on her face. She held the question in her chest, and it felt heavy, like a marble she could not toss away. Who was the girl? What promise had she broken?", "She knew, with a sudden, sharp certainty, who it was. Gran. Gran, with her flour on her sleeves and her locked drawer and her sharp tongue that was really just a shield. Gran, who had never once mentioned the toll, or the bridge, or the way the town spoke of the troll as if he were a bad dream.", "Rue walked home, her boots slapping against the wet cobblestones. She did not run. She did not hide. She just walked, holding her head high, feeling the secret pressing hard against her ribs.", "At the corner, Cedric Pettibone stepped out of a doorway. He wore his red waistcoat, and his hair was slicked back, and he was not sneering. He looked, for the first time, like a boy who was very small and very alone.", "\"I saw you on the old bridge,\" he said, very quietly."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "Cedric Knows", "part": "PART TWO: THE TOLL OF ONE STORY", "paras": ["*From the Bridgewater Almanac: A boy who says he is not afraid is either a hero or a liar.*", "The streetlamp hummed, a low, yellow buzz in the wet air. Cedric stood in the pool of light, his red waistcoat bright against the dark cobbles. He did not look like a boy who had seen a monster. He looked like a boy who had seen a mistake.", "\"You were down there,\" he said, and it was not a question. His hand twitched at his side, fingers curling and uncurling. \"I saw you go down the steps. I saw you come back up. You were gone for an hour, Rue.\"", "Rue wiped her hands on her raincoat. \"I was only crossing the bridge. The other side is shorter for the doctor's house.\"", "\"Nobody crosses the old bridge,\" Cedric said, his voice thin and high-pitched. \"It is forbidden. It is dangerous. If you do not tell me what you saw, I will tell my uncle the Mayor. He will send the constabulary. He will send the whole town.\"", "\"Right then,\" Rue said. She felt her heart beat in her ears, a loud, steady thumping. She looked at his boots. They were muddy. He had been waiting for a long time."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["Rue looked up at him and smiled. It was a good smile, the one she had been practicing since spring, which worked well on mothers, on the doctor, and now, apparently, on the Mayor’s nephew.", "\"There is nothing there,\" she said. \"Just damp. And some moss. And a very old bridge.\"", "It was the first time in her life she had told a lie with a straight face. It felt strange, like wearing a coat that was too big. She said it again, softer. \"Just damp, Cedric.\"", "Cedric stared at her. He took a step back, his heel scraping on the stone. He looked terrified, Rue realized. He was more frightened than she was. He was frightened of the dark, and he was frightened of being the only one who knew, and he was frightened of her. She filed this away, tucked it under her arm like a parcel.", "\"Suit yourself,\" he whispered. He turned and ran, his slicked-back hair flying behind him. Rue watched him go, and felt a small, cold knot tighten in her stomach."], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["By Wednesday, the story had changed. Cedric climbed back onto the crate, his voice higher and more urgent. He claimed the troll’s eye glowed like a red apple in the dark. He insisted it had a tail, long and frayed like a rope. He declared it ate one sheep a month, and that it was getting bolder.", "The circle of listeners grew. They leaned in, breath held, eyes wide. It was a good story. It was a dangerous story. And every time Cedric spoke a new, terrible detail, he glanced at Rue. He was daring her to contradict him. He wanted her to say, *No, he doesn’t have a tail.* Or, *No, he doesn’t eat sheep.* He wanted to win.", "Rue sat on her bench, picking at a thread on her sleeve. She said nothing. She watched the faces of the other children, bright with fear and excitement. She watched Cedric’s face, tight with effort. She wanted to scream. She wanted to hug him. Instead, she said nothing, and the story grew a little larger, a little more terrible."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["Under the chestnut tree, Perrin Fen was drawing a sheep in his notebook. He did not look up when Cedric’s voice drifted over. He just kept drawing, his pencil scratching softly against the paper.", "\"A troll who eats one sheep a month,\" Perrin said, his voice quiet and clear, \"would have eaten every sheep in Bridgewater by now.\" He looked up. \"I counted. There are exactly as many sheep as there were last year. And I checked the baker’s farm. He is still there.\"", "The yard went silent for a moment. Then, a few children laughed. It was not a cruel laugh this time. It was a relieved laugh, the kind that comes out when you realize you are not in danger. Cedric’s ears turned red. He climbed off the crate, his face a mask of confusion.", "Rue laughed. The sound bubbled up in her chest, warm and sudden. She leaned forward, her fingers tightening on the edge of the bench. She wanted to tell Perrin. She wanted to say, *It’s true, he’s kind, he has a toothache, he likes tea.* She opened her mouth. The words were there, right on her tongue. She closed her mouth again. Not yet."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["That night, the air under the arch smelled of wet stone and old paper. Rue climbed the steps, a tin of scones in her hand. She expected Hobb to be sitting by his humming kettle. Instead, she found him behind his bookshelf, his large grey-green face pale in the lantern light.", "He had heard the shouting. The sound of the schoolyard, faint and distant, had come down through the stones. He looked small. He looked hurt.", "\"I am fine,\" he said, his voice rough. He moved to sit on his cushion, but he did not touch the scones. Behind him, on the wall, the moss was growing. It had formed a small, tight ball, dense and dark, like a knot that would not untie.", "Rue sat down on the floor beside him. She did not say it would be alright. She did not say he should be brave. She just sat, and she waited, and she let him be quiet. The ball of moss stayed tight, but it did not grow."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "Moss Garden", "part": "PART TWO: THE TOLL OF ONE STORY", "paras": ["*From the Bridgewater Almanac: A tidy house has no need of a garden.*", "The brass frame was cold and stiff, but Hobb’s fingers were warm and gentle. He held it steady while Rue tightened the screws. Her small hands shook slightly, not from fear, but from the effort of holding things together.", "\"The glass needs to be thin,\" Hobb said. He produced a shard from a broken jam jar, its edge sharp and clear. \"Too thick, and it traps the heat. Too thin, and it shatters. It is a matter of balance.\"", "Rue slid the glass into place. It fit perfectly. She trimmed the wick with her scissors, snipping off the black charred tips until it was a neat, white stub.", "\"Light it,\" Hobb whispered.", "She struck a match. The flame caught, flickered, and then steadied. The arch filled with a soft, amber glow. The dust motes danced in the light. Every book on his shelves seemed to lean forward, their covers catching the gold. They looked less like objects and more like they were smiling."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["Hobb led her to a patch of bare stone near the river wall. The moss here was thin and pale.", "\"You do not plant it with a trowel,\" he said. \"You plant it with your voice.\"", "Rue frowned. She took a small clump of green from the garden bed. \"How?\"", "\"Tell it what you want it to be. Do not rush it. Moss is patient. It has all the time in the world.\"", "Rue placed the clump on the stone. She leaned close, her breath fogging in the cool air. \"Be an R,\" she whispered. \"A nice, round, friendly R.\"", "She watched. It did nothing. But Hobb, beside her, hummed a low note. Slowly, the moss spread, curling around itself. Beside Rue’s R, Hobb planted a patch that formed a lopsided, crooked smile. It was not perfect, but it was kind."], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["They sat on his cushion, the lantern light casting long shadows. Hobb’s spectacles were mended with twine, catching the glow.", "\"I have a question,\" he said. His voice was quiet. \"It is not a trick question. It is a real one.\"", "Rue nodded.", "\"What do you most want in the world?\"", "She thought for a moment. \"I don't need anything,\" she said. \"I have Gran. I have Biscuit. I have my work. I am useful.\"", "Hobb tilted his head. \"That is not what I asked.\"", "Rue looked at her hands. They were stained with green moss. She thought of the empty bench in the schoolyard. She thought of the chair by the window at the tea shop that was always empty.", "\"I’d like,\" she said slowly, \"for one person to save me a seat.\""], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["Hobb looked down at his hands, which were the size of dinner plates, and turned them over to examine the moss clinging to his thick, strong knuckles.", "\"I have kept a seat under this bridge,\" he said, his voice quiet and steady. \"For three hundred years.\"", "He pointed with one long finger to an upturned bucket in the corner, its wood dark and worn smooth by age.", "\"Nobody sits in it,\" he added. \"They walk past. They throw stones. They do not sit.\"", "Rue stood up and crossed the room, her big rubber boots thumping a steady rhythm on the stone floor. She lowered herself onto the upturned bucket, and it was surprisingly comfortable, exactly the right height for her knees.", "They both sat there saying nothing at all for a while. The kettle hummed its low, thinking tune. The moss on the wall seemed to relax, its tight knot loosening just a fraction, like a fist unclenching after a long day. It was a good silence. It was a seat that was saved."], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["Rue climbed the stairs to the Kettle & Crumb, dragging her boots up the wood one step at a time. She was mossy to the elbows, and the green dust from Hobb’s garden had settled into the creases of her patched raincoat. She expected Gran to be in the shop, wiping the counter with a rag that smelled of lemon and old soap.", "Instead, Gran stood on the top landing, holding a lamp that threw a long, wavering shadow across the wall. Her face was unreadable, like a page she had not yet decided how to read.", "\"Where have you been?\" Gran asked. Her voice was flat.", "\"Errands,\" Rue said. She did not look at the moss on her boots.", "Gran looked at the boots. She looked at the green stain on Rue’s raincoat. She did not ask where the moss came from, nor did she ask about the bridge. The silence stretched out between them, thin and brittle, like a piece of dry pastry waiting to be broken.", "\"Sit down,\" Gran said. \"You’ll fall down.\"", "She turned and walked into the kitchen. The kettle began to bubble, a low, angry sound that filled the quiet rooms. Rue sat on the step, her heart beating loud in her chest, and did not move."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "The Announcement", "part": "PART THREE: THE TROLL CLEANSING", "paras": ["*From the Bridgewater Almanac: What the town does together, the town does right.*", "The Founders' Green was bright with cold sun, the kind that made the stone look sharp and new. Mayor Ambrose Pettibone stood on the soapbox, his round belly straining against his waistcoat, his top hat casting a small, dark circle of shadow over his nose. He adjusted his chain of office, which clinked softly, like coins in a heavy purse.", "\"Citizens,\" he boomed, his voice booming with the specific confidence of a man who has read the rules himself. \"In honor of our Founders' Fair, we shall finally clear the old bridge of its ancient nuisance.\"", "He paused for effect, letting the silence stretch until it felt polite.", "\"We shall perform a Troll Cleansing. With bells, ladders, and a very long net. It is time to make the bridge safe for business and... for the eyes of respectable families.\"", "The Mayor smiled. It was a wide, toothy smile, the sort that usually preceded a bill. He loved the plan so much he had already started humming the town anthem, though he did not quite have the words."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["The cheering started uncertainly, a few scattered claps from the front, then swelled into a wave that hit the back of the line. People cheered because the Mayor was wearing a hat, and because a plan with a net sounded safer than a plan without one.", "Cedric Pettibone stood next to his uncle, his red waistcoat looking suddenly too bright. He chewed on his lip, his eyes darting to the bridge, then back to Rue. He looked like he had swallowed a stone and was waiting for it to land. Skye Tanner stared at her boots, her long fair braid swinging as she shifted her weight.", "Perrin Fen, in his oversized wool hat, did not cheer. He looked straight at Rue. His ink-stained fingers curled around the strap of his satchel. He did not smile. He did not frown. He just looked at her, with the quiet, patient attention of someone who knows a secret is about to become a problem.", "Rue looked away. She looked at the Mayor’s shoes. They were very shiny."], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["Gran did not cheer. She stood by the shop door, her silver bun pulled tight and her half-moon glasses catching the bright afternoon sun until they looked like two white ovals. In her hands, she balanced a tray of scones that smelled strongly of butter and warm yeast, while her face remained set in a line so firm it might have held up the old bridge itself.", "Inside the Kettle & Crumb, the Mayor’s committee crowded into the small space, talking over one another about ladders and bells. The Mayor took a scone, bit into it with a decisive crunch, and said, \"Such an eyesore, that moss. It really does spoil the view of the river.\"", "Gran moved to the stove, then to the counter, pouring tea with a precision that was almost frightening. Then she dropped the tray.", "It did not crash. It thudded, heavy and final, against the floorboards. The scones rolled across the wood, and the teapot wobbled dangerously on its side. The room went very quiet. Gran did not pick them up. She just stood there, her hands still on the rag, watching the Mayor’s shiny shoe brush against a fallen scone."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["Rue tried to leave. She reached for the door, but the committee was still there, and they had brought their own chairs, and their own opinions, and they were filling every corner of the shop with the smell of pipe tobacco and damp wool.", "\"Can't go out yet,\" the Mayor said, waving a hand. \"We need to discuss the netting material. Is it hemp? Or is it the new synthetic blend? I hear it holds better in the wind.\"", "Rue backed into the corner, her heart beating against her ribs like a trapped bird. She counted the days. The Fair was in nine. She counted them again, just to be sure. Nine days. She looked at the clock on the wall, its hands moving in slow, deliberate circles.", "She was useful. She could be useful. She could hold her breath. She could be small. She could wait. But the shop was full, and the door was locked, and the light was beginning to fade, and she was ten years old, and she had nowhere to go."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["The last committee member finally left, and the door clicked shut behind him.", "Rue ran. Her big rubber boots slapped against the cobblestones, splashing through the puddles that had gathered in the shadows of the market stalls. She did not stop until she was under the arch, where the air smelled of wet stone and old leaves.", "Hobb was there. He sat on a large, flat rock, his mossy shoulders hunched forward. A small cloth bag lay in his lap, containing a few books, though not many. Just the important ones.", "He did not look up, nor did he need to.", "\"I heard the bells,\" he said, his voice quiet and tired, like a voice that had been speaking in the dark for a very long time. \"I heard about the net.\"", "He opened the bag and took out a book with a cracked cover, turning a page with a heavy finger.", "\"It is all right,\" he said. He said it the way a person says it when they have said it before, and meant it, and are still saying it. \"I am very good at leaving.\"", "Rue stood there, not breathing, not moving, and had no idea how to keep the promise she was about to make."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "A Plan (Several Plans)", "part": "PART THREE: THE TROLL CLEANSING", "paras": ["*From the Bridgewater Almanac: An expert is a person who has never been wrong in public.*", "Rue did not sit. She remained standing under the chestnut tree, her boots muddy from the run, and talked. It came out sideways, all at once, in one great, breathless tangle of words about the moss, the spectacles, the toothache, and the net.", "Perrin Fen listened without blinking, holding his notebook against his chest like a shield while his ink-stained fingers stayed planted on the cover. When Rue ran out of steam and gasped for air, he looked at her with a calm, steady gaze that made her feel like a very loud bird.", "\"I knew it,\" he said.", "Rue blinked. \"You did?\"", "\"I mean, I didn't know it,\" Perrin corrected, his voice flat and dry. \"I knew there was something under there that was good. It is a fact.\"", "He opened his notebook to a fresh page and clicked his pencil. \"What does the Mayor need to change his mind?\" he asked. \"That is the useful question.\""], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["Plan A was a letter. It was the most sensible thing Rue had ever done, which is saying something, because her usual plan was to run and hide.", "Perrin’s handwriting was excellent. Small, neat, and slanted slightly to the left, the words lined up like a row of polite sheep. He wrote that the troll was a gentle librarian who maintained the bridge. He wrote that he was not hungry, only thirsty for stories. He wrote that he was tired.", "They walked to the town hall. The Mayor was in his office, polishing his chain of office. He held the letter up to the light, reading the first two sentences in a high, squeaky voice that sounded like a duck being stepped on.", "\"A gentle librarian,\" he wheezed, and then he laughed.", "The committee members behind him giggled. The Mayor rolled the paper into a tight cylinder and flicked it into the air. It landed on the floor with a soft thud.", "\"Denied,\" he said, and went back to polishing."], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["Plan B was to talk to Skye.", "Rue found her in the yard, braiding her hair with a red ribbon. Skye was tall and golden, and she turned when she heard Rue’s voice.", "\"Skye, it’s not a monster. It’s Hobb. He reads. He mends the stones.\"", "Skye stopped braiding. Her face turned a bright, angry pink, the color of a beetroot that has been squeezed too hard.", "\"Rue, you mean well,\" she said, her voice tight. \"But everyone knows what is under that bridge. You can’t just decide it’s nice. That’s not how it works.\"", "Rue opened her mouth to argue. She wanted to say that nice is a choice. She wanted to say that knowing is better than guessing. But the words stuck in her throat, because she realized Skye was right. She had never once asked the town to look. She had only ever asked them to stop."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["Plan C was hiding in the notebook.", "Perrin flipped past the letter to a page crowded with tiny, precise drawings. They showed the old bridge, but not the whole thing, only the middle arch seen from below.", "\"I have been measuring,\" Perrin said, tapping a line of numbers. \"Every year, the middle sags half a finger-width more. The stone is cracking. By next winter, it will fall. That is what the mathematics say.\"", "\"But it hasn’t fallen,\" Rue said.", "\"No,\" Perrin agreed. \"It hasn’t. And that is impossible, unless someone is fixing it.\"", "He looked up, his eyes wide and bright. \"I can prove it. I can show them the numbers. Numbers do not lie, and numbers do not laugh.\"", "Rue looked at the drawing. It looked like a skeleton of stone, thin and fragile. \"Right then,\" she whispered."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["When they reached the bridge, the air under the arch was cold and smelled of damp paper.", "Hobb was there. He was sitting on a bucket, his mossy shoulders hunched high. His books were unpacked, then packed, then unpacked again on the floor around him. He looked like a storm that had forgotten how to rain.", "When he saw Rue, his ears perked up. When he saw the stranger beside her, he froze. The humming of the kettle behind him stopped. The silence was so sudden it felt like a punch.", "Perrin stepped forward. He held out his notebook, open to the drawing of the arch. He did not smile. He did not look away.", "\"You’re better than I imagined,\" Perrin said.", "Hobb looked at the drawing. He looked at Rue. He looked at the bucket beneath his feet.", "And then, very suddenly, he sat down on it. The wood groaned under his weight."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "Three at the Arch", "part": "PART THREE: THE TROLL CLEANSING", "paras": ["*From the Bridgewater Almanac: Sunday is for rest, and Monday is for remembering that you rested.*", "Under the arch, the three of them fit. It was the smallest room in Bridgewater, yet somehow it held the most warmth. Hobb sat on his bucket, holding a book open with one massive, mossy finger. He read aloud in a voice that rumbled like distant thunder, though he paused every few pages to hum a tune that went nowhere.", "Perrin unrolled a long strip of parchment across the floor. His ink-stained fingers traced the curve of the stone ceiling. Rue stood on a stack of crates, flour on her nose, mixing batter. Half the scones burned, smelling of char and regret. The other half were golden and perfect.", "Biscuit, who had followed Rue out of the shop and refused to leave, climbed onto Hobb’s shoulder. The cat sat there, purring, looking exactly like a hat.", "\"It is a good hat,\" Hobb said, without looking up from his book.", "\"It is a cat,\" Rue corrected.", "\"He is a good hat,\" Hobb repeated. Biscuit purred louder."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["Perrin did not stop drawing, but measured the gap between the arch and the water, then the width of the stone, and finally the angle of the light falling across the mud.", "He wrote the numbers in his notebook, small and precise, with the careful attention of a child marking the height of a growing plant.", "Hobb watched him. \"You are measuring the bridge,\" he said.", "\"I am measuring the work,\" Perrin replied. He turned a page, his ink-stained fingers smearing the edge slightly. \"You re-seat the loose stones. The river loosens them. You are exactly as fast as the water.\"", "Rue froze, a spoon in her hand, a smudge of batter on her nose. \"What?\"", "\"Every night,\" Hobb said, his leaf-like ears drooping slightly against his spectacles. \"I fix what the river takes. It is only a bridge. Somebody has to hold it up.\"", "The proof was sitting right there in the mud and the moss and the neat little numbers in Perrin's book, and it was true. It was the most sensible thing in the whole town. And it was useless, because the town did not want the truth. It wanted a monster."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["Outside the schoolhouse, the air was cold and smelled of wet chalk, and Cedric was waiting by the chestnut tree. Rue had known he was following her for days, a quiet shadow that matched her pace without trying to look like a friend. He did not sneak up this time. He simply stepped out of the shade, his red waistcoat bright against the grey bark, and his eyes were wide and wet.", "\"The Mayor has a net,\" Cedric said, his voice thin and cracking. \"And a list. A very long list.\"", "Rue felt her knees go weak, as though they had been made of wet bread. \"I don't know what you mean.\"", "\"Tell me where it is,\" Cedric whispered, stepping closer until his shoulder brushed the rough bark. \"And I'll ask him to spare it.\"", "The word cracked in his mouth. It was not a demand. It was a plea. Rue looked at him, really looked, and saw the fear behind the sneer, the terror of a boy who had built a lie because he was afraid of the truth.", "\"Nothing in your whole stupid town is as kind as he is,\" Rue said."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["The words hung in the air, sharp and bright.", "The yard went silent. Conversations died in the middle of sentences. Chewing stopped. Heads turned, then turned again, a slow rotation of confusion that felt heavier than the wet chalk smell.", "Skye Tanner, who was tall and usually certain, stepped forward. Her long braid swayed against her back. \"Who?\" she asked.", "Cedric’s face went red, then white, and finally a very quiet, terrified grey. He opened his mouth, but no sound came out. He stared at Rue as though she had just bitten him.", "Rue realized what she had done exactly as the words left her mouth. It was like seeing a cup slide off the table edge, knowing it would shatter before it even hit the floor. You could hear the crash in your head before the sound reached your ears.", "She had not just told them a secret. She had told them a feeling."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["Rue turned and ran.", "Her boots slapped against the cobblestones. She ran past the doctor’s house, past the bakery, until her lungs burned and her legs felt like lead. Behind her, the sound of the town changing.", "Cedric’s voice rose over the crowd, high and thin. \"She knows where he is! She's been going under the bridge!\"", "Then Skye’s voice, loud and sharp. Then a dozen others. The laughter was gone. The curiosity was gone. In their place was a heavy, ringing sound that started in the center of the town and rolled out to the edges.", "The town bell began to ring.", "It was not a song. It was a warning. And for the first time in her life, Rue Alder was not running to be useful. She was running because she was alone, and the whole town was coming for her friend."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "The Bell", "part": "PART THREE: THE TROLL CLEANSING", "paras": ["*From the Bridgewater Almanac: In a crisis, be brave, be loud and be together.*", "Rue did not stop at the foot of the bridge. Instead, she climbed the steep, slick steps, her boots slipping on the wet stone as she burst out into the moonlight. Hobb was sitting on a pile of books, his spectacles askew, a chapter of *The History of Moss* open on his knee. He did not look up. Simply closing the book with a soft thump, he finally turned to face her.", "\"How many?\" he asked, his voice very quiet.", "\"All of them,\" Rue said, her knees shaking. \"The bell is ringing, Hobb. They are coming with things.\"", "Hobb nodded slowly. Reaching up, he took off his round spectacles. He folded the arms together very carefully and placed them in the pocket of his waistcoat. He did not look frightened, but rather tired, like a boy who has just remembered he left the stove on.", "\"Go home, Rue,\" he said. \"Stay with Gran. Do not let them take you.\"", "He stood up, his shadow stretching long and dark across the bridge. Rue reached for his hand, but he was already moving, his heavy boots thudding against the ancient stones."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["The crowd did not march. They shuffled, a heavy, murmuring tide of wool and woodsmoke. Lanterns swayed on long poles, casting jittery shadows on the parapet. The Mayor stood at the front, his top hat perched precariously, holding a brass horn that looked too small for his fingers. Behind him were ladders, and a net so large it looked like a collapsed tent.", "Hobb stepped out from the shadow of the arch. He raised his hands, palms open, showing he held no weapons. He was enormous, grey-green and mossy, and he looked absurdly small against the vast, dark sky.", "\"Look at him,\" someone shouted. \"Look at the size of him!\"", "A pebble hit the stone by Hobb’s foot. Then another. They bounced off the arch with sharp, staccato clicks. Hobb did not move. He just stood there, his head tilted, listening to the sound of the town deciding what to do with him."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["The gasp that went through the crowd was not a scream. It was the sound of a held breath releasing. It was the sound of people looking at something and realizing it was not the monster they had rehearsed in their heads for thirty years.", "Hobb’s voice came up from the dark. It was small, and it cracked on the second word.", "\"Please don't. I'm the one who mends the bridge.\"", "He gestured to the stones beneath his feet, where the moss grew in neat, deliberate rows. \"If I leave, the river will take the west pillar. I have held it up for three hundred years. It is only a bridge. Somebody has to hold it up.\"", "The laughter died. The curiosity died. In their place was a heavy, ringing silence, broken only by the hiss of the river below."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["A stone struck his shoulder. It was small, no bigger than a walnut, but it landed with a dull thud that seemed to echo in the quiet air, like a book dropped on a library desk.", "Cedric’s hand was still up. His face was white, his slicked-back hair falling over his eyes. He stared at the stone in Hobb’s hand, then at Hobb’s face.", "Hobb looked at Cedric. Then he looked across the crowd, his eyes finding Rue at the very end of the line. Her face was streaming, her hands clenched at her sides. She opened her mouth, but no sound came out.", "Hobb’s shoulders slumped. He did not yell. He did not strike back. He simply turned his back on the town and walked back into the shadow under the arch. The stone door, which Rue had never known existed, slid shut behind him with a soft, final sound."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["The Mayor stepped forward, his brass horn clutched to his chest. \"He is in hiding,\" he announced, his voice wobbling slightly. \"Guards! We will wait for him to come out. It is a safety measure.\"", "Gran pushed through the crowd. She was wearing her nightgown and her heavy wool coat, her silver bun askew. She stopped in front of the Mayor.", "\"Ambrose Pettibone,\" she said. Her voice was hard and flat, like a slate dropped on a tile floor. \"You will go home.\"", "The Mayor blinked. He looked at the crowd, then at Gran, then at his own feet. He turned and walked away, his top hat now sitting very crookedly. One by one, the others followed, their footsteps soft on the cobblestones.", "Rue was left standing at the parapet. Perrin stood beside her, his oversized hat pulled low.", "\"It's my fault,\" Rue said.", "Perrin said nothing. He just waited, exactly as she needed him to."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "The Stone Door", "part": "PART THREE: THE TROLL CLEANSING", "paras": ["*From the Bridgewater Almanac: An apology, once given, is a debt paid in full.*", "The next morning, the schoolyard was quiet. Not a polite quiet. A heavy, holding-its-breath kind of quiet.", "Rue’s boots clattered on the pavement as she walked toward the chestnut tree. The usual chatter had drained away, leaving a silence that pressed against her ears. Skye Tanner, who usually led the pack, looked at a point just past Rue’s left shoulder and kept walking. She did not say anything. She did not stop.", "Cedric Pettibone was not there at all. His red waistcoat was a missing piece in a puzzle. Or a lost sock. Or a broken promise. It was just gone.", "Perrin Fen was already under the tree. He did not look up when Rue arrived. He simply shifted his large wool hat, making room for her on the cold bench. Then, without a word, he tore his bread in half. He slid the larger piece toward her.", "His fingers were stained with blue ink. A map of his quiet world.", "Rue looked at the bread, then at him. She took it. It was dry and stale. But it was the first thing she had tasted that didn't feel like stone."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["After the last bell, Rue did not go home. She walked to the old bridge, her scone basket clutched tightly in her hands. The air smelled of damp stone and river mud. She climbed the hump of the bridge, her boots sliding slightly on the moss, until she stood before the arch.", "It was just a wall. A plain, unbroken face of grey-green stone. There were no steps, no door, no handle. The lantern that had hummed with a warm, yellow light was gone. In its place was only a dark, empty socket, like a missing tooth. Rue set the basket on the ground. She raised her hand and knocked. Once. Twice. Three times. The sound was flat and dead against the rock.", "\"Hello, Hobb,\" she called out. Her voice felt small in the shadow of the arch. \"I know you are there.\" She waited. The river lapped against the pilings below, a soft, rhythmic sound that only made the silence above it heavier. She knocked again. \"Please.\""], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["For a long time, the only sound was the water lapping at the pilings, a steady noise that made the silence feel heavier than a wet wool coat. Rue’s shoulders dropped. She began to turn away, her boots scuffing the damp stone.", "\"Rue.\" The voice came from behind the wall. It was very quiet and sounded terribly tired. \"Please go home.\"", "Rue stopped. She turned back to face the arch. \"I only want to say sorry,\" she said, and her voice cracked on the last word. \"I am sorry. I am so sorry. I shouldn't have spoken. I shouldn't have brought them.\"", "She said it again. And again. Until she had said it eleven times, her breath coming in short, shaky bursts that fogged in the cool evening air.", "\"I know,\" the voice said. It was not angry, but it was heavy, like a sack of flour resting on a low shelf. \"I know you are sorry. But sorry doesn't put me back where I was. It doesn't unring a bell. I need to be by myself.\"", "Rue stayed until the street lamps began to flicker to life in the distance. Their orange glow caught the wet stones, turning them into small, glowing coins. Then she left the basket on the moss and walked away."], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["The week that followed was a grey blur. Rue stopped eating. She stopped sleeping well. She stopped being useful, which felt like a different kind of falling. Perrin came to the schoolhouse after class, holding out a pencil and a sketchbook. \"Draw the bridge,\" he said. \"Or the cat. Or the rain.\" Rue shook her head. She couldn't. The image of Hobb’s hurt face was all she saw when she closed her eyes.", "At the Kettle & Crumb, the customers noticed. Mrs. Gable, who usually ordered two teas and a scone, looked at Rue with wide, worried eyes. \"You look thin, love,\" she said, then quickly looked away. Even Biscuit, the enormous orange cat, stopped purring. He sat on the counter, staring at Rue with his yellow eyes, a silent accusation in every whisker.", "Gran said nothing. She just moved through the shop, wiping tables, balancing the scale. That night, after the last customer had left, Gran brought a cup of tea to Rue’s room. She did not ask questions. She just sat on the edge of the bed, the tea steaming between them, and waited. Rue looked at the cup, then at Gran, and began to speak."], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["Rue told her everything, the dare and the arch and the tea, and the moss garden that grew in the shapes of Hobb’s feelings, and the stones that flew. She spoke until her throat felt like a dry sponge and her eyes stung, waiting for the shout or the slap, the sharp disappointment she had been dreading since she was seven. She expected Gran to call her reckless, to worry about the family name, to be furious.", "But Gran was very quiet. She listened with her eyes closed, her hands resting on her knees, still as the dust motes in the lamplight. When Rue finished, the room held its breath. Gran opened her eyes; they were bright and clear.", "\"I knew,\" Gran said finally. Her voice was soft, but steady. \"I’ve known you were going under the bridge since the first day. It is why I didn’t ask.\"", "She stood up, her knees creaking, and walked to the small bedside table. She unlocked the drawer, the one Rue had never seen opened, and inside lay a single object wrapped in a piece of blue cloth. Gran unwrapped it. It was a button, as large as a saucer, made of a dark, polished wood.", "\"It is time,\" Gran said, \"I told you about the promise I broke.\""], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "The Locked Drawer", "part": "PART FOUR: HOLDING UP THE BRIDGE", "paras": ["*From the Bridgewater Almanac: A promise made to a troll is not a promise. It is a joke.*", "\"It was sixty years ago,\" Gran said, \"and I was ten, and I was called Willa. Your great-grandfather was the tollkeeper on this very bridge. He collected nothing, because nobody paid. They thought it was a joke. I thought it was my fault.\"", "She tucked the button into her sleeve. \"I had no friends. I was new, and strange, and I smelled of river mud. The Bridge Club dared me, just as they dared you. To cross the old bridge at dusk. To see if I was brave enough to go under the arch.\"", "Rue felt the air leave the room. \"You went?\"", "\"I went,\" Gran said. \"I was very small, and very scared. And when I crouched down, I saw him. He was not as large as he is now. He was only a hundred and forty. He was sitting with his knees drawn up, weeping because he had lost a shoe. It was a very pretty shoe. I have kept it, though I cannot find it.\""], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["\"He was lonely, Willa. Or rather, I was. And so I sat down. And I paid the toll. I told him about the school, and the bad tea, and the boy who stepped on my cat. He listened. He is a good listener.\"", "Gran smiled, a small, fragile thing. \"We were friends for a whole summer. I came every day. I told him stories, and he told me about the moss. He taught me how to coax it into shapes. I showed him how to make a good scone. He gave me this button. A horn button from his waistcoat. He said it was so I would always have a piece of him, should I ever feel the need for a very heavy paperweight.\"", "Rue looked at the button. It was dark and smooth, and it sat in the blue cloth like a sleeping eye.", "\"He was young,\" Gran said. \"He was still learning how to be a troll. He was shy, and he was polite, and he sang badly. Just like now.\""], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["\"But then I turned thirteen. The older girls, the ones who actually had friends, decided to go to a picnic on the F
