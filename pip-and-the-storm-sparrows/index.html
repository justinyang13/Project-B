 all looking in the same direction."], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["Cinder flew to the front. He did not ask. He simply moved, his wings beating with a new, steady rhythm.", "\"You read the wind,\" he said to Pip. His voice was stiff, but it was not cruel. \"I will do the shouting.\"", "It was the best job he could offer. He called out Nettle’s cloud signals. \"Left! Hold! Up!\" His voice was strong, cutting through the rain. Pip flew the lanes, using her light weight to dart into the gaps that heavier birds could not enter. Uncle Dorn brought up the rear, his gruff voice gathering the stragglers who had fallen behind.", "\"Come on! Don’t you dare drop!\" he bellowed at a shivering fledgling. \"There is a branch waiting!\"", "For the first time, the whole ragged dozen of them flew as one. They were not a flock of individuals anymore. They were a single, beating heart in the sky. The wind pushed them forward, and they rode it, together."], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["Across the breaking storm, they began to see other wings. Small dark specks on the wind, rising, falling, finding their way. One by one, the scattered flock found itself. A sparrow from the east. A pair from the north. A lone, shivering fledgling from the south. They joined the line, one by one, their voices mixing with the chorus.", "Behind them, the storm gave a last rumble, a deep, slow sound, like a great beast rolling over in its sleep. The clouds began to tear apart, revealing the blue beyond.", "And ahead, glimmering on the surface of the sea, were the Lantern Isles. They looked like a scattering of golden lanterns, bright and warm and waiting. The wind pushed them forward, and Pip did not fight it. She simply let it carry her home."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "Landfall", "part": "PART FOUR: CLEARING SKIES", "paras": ["*Sky Report: light rain clearing, first sun on wet rock, a lot of exhausted birds.*", "The Lantern Isles rose from the water like a spilled bucket of green jade, topped with tiny stone towers that glowed with a soft, steady amber light. The flock hit the rocks in a tangle of feathers and exhaustion. Birds landed in heaps, some sleeping instantly, others just standing with their eyes closed, wings drooping.", "Gullet appeared. He was a seagull the size of a boulder, with feathers like snow and a beak like a rusty nail. He waddled through the crowd with surprising gentleness, his heavy feet padding on the wet stone. He held a fish head in his beak, offering it to a shivering wren.", "\"Here, you small thing,\" Gullet rumbled, his voice a low rumble. \"Eat. It is cold out.\"", "The wren took a bite. Then another.", "Pip landed on a flat rock, her legs trembling so badly she could barely keep her balance. She looked at the glowing towers, then at the fish head being passed around. Her stomach gave a loud, hollow growl. She realized, with surprise, that she was very, very hungry."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["Marra arrived last, her torn wing dragging across the wet stone as she led the ragged line of survivors. Their feathers were matted, their eyes dull with the kind of tiredness that goes deeper than sleep.", "She saw Pip.", "The small brown bird was buried in the center of a large heap of sleeping sparrows, her chest heaving against the soft down, her crooked tail feather sticking straight up like a stubborn antenna. Marra’s beak opened. It closed. She opened it again, but no words came out.", "Instead, she sank down onto a jagged rock, her legs folding under her weight until she looked older than she ever had, her grey streaks fading into the heavy evening shadow.", "A young sparrow, his feathers still ruffled from the storm, hopped closer to tell her what had happened. He spoke of the wind-lanes, the hawk, and the way Pip had lifted the flock, one by one, from the chaos. Marra listened with her eyes closed, her head tilted slightly to the side. She did not blink, holding on to the story as if it were a seed she was afraid to drop."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["Dawn came in grey sheets, and the counting began. The Elders moved in pairs, their voices low and serious, calling out names. It was a solemn, quiet thing, the counting of the living.", "\"Thistlewick,\" said one Elder. \"Fern. Present.\"", "\"Old Bramble. Present.\"", "\"Nine. Present.\"", "Nettle was asleep on her feet, her head bobbing gently with every call. Pip stood beside her, keeping one eye on the crowd. Cinder was there, too. He looked terrible. His glossy chestnut feathers were dull, and he kept bowing to every bird that passed, murmuring apologies for things he had not done.", "\"Sorry,\" he whispered to a wren. \"Sorry about the loop. I didn't mean to show off.\"", "The wren blinked, confused, and preened.", "Pip watched Cinder, and then she watched the sky. The numbers were ticking up. It felt like holding your breath."], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["A shadow dropped over Pip’s feet, and she looked up. Uncle Dorn stood there, very stiff, his feathers bristling while his eyes remained bright and watery. He had not moved from the edge of the rocks, and he had been watching.", "\"I knew you could fly,\" he said, his voice tiny. \"I have always known. I was afraid, and it is not your fault.\"", "Pip’s heart gave a sharp, painful thud.", "\"I am not sorry I said it,\" Dorn continued, his gaze fixed on the horizon. \"I am sorry I said it so many times.\"", "He turned his face away, for old sparrows do that when they cry. They look at the water and pretend they are just watching the waves.", "\"Small birds go where they like,\" he whispered.", "Pip stepped forward and pressed her small, warm body against his side, tucking her head under his wing. He did not grumble, nor did he say low was safe. He just stood there, trembling, as the first real sun of the day touched the wet stone."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["The final count came in. All but three were present. The Elders confirmed the last three were safe on the far shore, waiting for the tide to turn.", "A long sigh rippled through the flock. It was not a word, but a sound that moved from bird to bird. It was the rustle of relief and exhaustion, filling the air like wind moving through dry leaves.", "Pip looked at Nettle, who was awake now with wide, shining eyes. She looked at Cinder, who was finally standing up straight. Then she looked at Uncle Dorn. He was watching her with a new, strange softness that made her toes curl.", "Then Marra stood up on the high rock.", "The crowd went silent. The Elders stepped back. Young sparrows pressed close to their parents. Marra smoothed her torn wing. She looked at Pip. She looked at the sky, which was finally, fully blue.", "\"I have something to say,\" Marra said. Her voice was gravel and stone, but it was steady. \"It will not be easy for me. Sit.\""], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "What Marra Said", "part": "PART FOUR: CLEARING SKIES", "paras": ["*Sky Report: clear, a gentle breeze from the south, all the time in the world.*", "Marra cleared her throat. She cleared it again, a dry, rattling sound that echoed off the smooth stones of the Lantern Isles. The crowd went very still. Even the wind seemed to hold its breath, pausing in its gentle southern drift.", "\"For forty seasons,\" Marra began, her voice booming but low, \"I have said that Storm-Sparrows are built, not wished.\" She looked down at the crowd, her grey-streaked eyes sharp. \"I said it to children. I said it to Pip. I believed it.\"", "A murmur rippled through the flock. Uncle Dorn shifted on his branch, his plump chest puffing out.", "\"I was wrong,\" Marra said.", "The word landed. It did not crash; it settled. It settled into the feathers of every bird present, heavy and strange.", "Pip stood at the edge of the group, her toes curled tight on the mossy stone. A strange tingling vibrated in her wings, like a plucked string. She had waited her whole life for this moment. She had rehearsed it in her head a thousand times, in the hollow of the Lightning Oak, in the howl of the storm, in the silence of the sea. But standing here, in the clear blue light, with Nettle beside her and Cinder looking away, the feeling was not the roaring triumph she had imagined.", "It was quiet. It was warm. It was like a small lamp being lit somewhere deep inside her chest, a light that had no wind to blow it out."], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["Marra spread her wings, showing the jagged tear at the tip, a map of her own history. \"I watched a sparrow who weighs less than a walnut lead a dozen birds through the worst storm of the century,\" she said. \"I watched her read the wind.\"", "She paused, letting the image settle. \"She did not read it like we do. We do not have eyes for the updrafts. We do not feel the shift in the air before it comes. She felt it. She *was* it.\"", "Pip’s head tilted. She remembered the storm. The way the air had tasted of salt and fear. The way the gusts had pushed her, not against her.", "\"It is not that the rule was cruel,\" Marra continued, her voice dropping to a rough whisper that carried clearly. \"It’s that the rule was small. We measured wings. We should have measured the sky.\"", "Nettle, standing beside Pip, let out a long, shaky breath. Her big feet shifted on the rock. She looked at her friend, then at the elder, her wide eyes shining. Pip reached out and touched Nettle’s wing with a single, light tap. *I felt it too,* the touch said. *I felt it for all of us.*", "The sky above them was a perfect, endless blue. It did not care about wings or weight. It only cared about the birds who knew how to ride it."], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["\"By the laws of the flock,\" Marra declared, her voice rising to fill the hollow of the isle, \"the new Storm-Sparrows are...\"", "She pointed a sharp beak toward the front of the crowd. Two large, glossy sparrows stepped forward, chests puffed out and ready to be seen.", "\"And then,\" Marra said, and her voice did something odd, softening and cracking just slightly, like the first ice breaking on a pond in early spring. \"Nettle.\"", "Nettle’s mouth fell open, and she blinked rapidly, looking first at Pip, then at Marra, and finally down at the ground as if checking to see if it was still attached to the earth.", "\"For reading the clouds,\" Marra said, her tone steady now, \"when no one had ever asked her to. And...\"", "Marra turned her head, her eyes sweeping the crowd until they found Pip.", "\"Pip.\"", "The silence that followed was not empty, but full, a held breath suspended in the air, before a sound rose from the back of the crowd, starting as a chirp and growing into a trill, then a roar. It was the sound of two hundred sparrows lifting off all at once, a rising wave of feathers and joy.", "Pip did not cheer, nor did she loop, but she stood very still, her crooked tail feather lifting in the sudden rush of air, and she smiled."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["Cinder hopped forward, his glossy chestnut feathers standing stiff and awkward, as if he had forgotten the choreography for walking. He stopped in front of Pip, ignoring the crowd entirely to look only at her.", "\"I told you couldn't,\" he said. His voice was rough, stripped of the smooth confidence he’d used during his loop. It sounded like the voice of a bird who had been inside a storm and emerged changed.", "He swallowed hard. \"I was wrong. Saying that was a bad thing.\"", "Pip blinked, her head tilting. She had expected anger, or dismissal, or the quick, casual cruelty of *Tweet-truth?* She had not expected this quiet, heavy admission.", "Cinder’s bright eyes remained steady on hers. \"I’d like to learn the lanes. If you’d teach me.\"", "The crowd went quiet again. Nettle’s eyes went wide, and from his branch above, Uncle Dorn let out a low, grumbling sound that was almost a laugh.", "Pip looked at Cinder, then up at the sky. She thought of Tuck, of the wind, and of how a small bird could ride a gust that a big bird would crash into.", "\"You have to stop fighting the wind,\" she said.", "Cinder nodded slowly. \"I'm working on it.\""], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["Pip felt the words settle into her. They did not burn, nor did they shout. They warmed her, like a seed in a nest, like a sunbeam on a cold morning. She had waited her whole life for this. She had rehearsed the triumph, the roar, the loop of victory. But this was something else. It was quieter. It was a small, warm lamp lit somewhere inside her chest, a light that had no wind to blow it out.", "She glances at the sea to the west. The storm was a smudge of grey, far away, a memory of fear. And past it, faintly, in the distance, the edge of the Lightning Oak’s hedge.", "\"Tuck,\" she whispered.", "She did not look at the crowd. She did not look at the sky. She looked at the horizon, at the place where the wind began.", "\"We did it.\"", "The wind lifted her crooked tail feather. It set it down again, and lifted it again. A yes."], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "A Letter in the Wind", "part": "PART FOUR: CLEARING SKIES", "paras": ["*Sky Report: fair, warm, a whiff of far-off smoke and old oak.*", "The Lantern Isles smelled of salt and dried kelp. Here, the wind did not push; it invited. Pip spent every dawn tracing the ridges of air over the water. Her small body felt shifts that larger sparrows missed. She was learning that the sky was not a ceiling, but a floor made of moving air.", "Cinder flew behind her. He did not boast or loop. Instead, he watched, his glossy chestnut feathers dull with effort. He waited for her to find the next thermal. When she did, he rode it with a grace that surprised even himself.", "Nettle stood on the highest rock. She tilted her head, reading the bruised purple clouds with a focus that made the elders nod in respectful silence. In the space of a week, she had become a legend.", "But Pip’s eyes kept drifting west. The sea stretched out, cold and grey, leading back to the jagged shape of the Lightning Oak. She missed the old bird. She missed his dry, ragged voice. She missed the way he told her to ride the wind instead of fighting it. A worry sat in her chest, small and sharp. Had he stayed? Had the storm taken him? She looked at the horizon, searching for a smudge of brown against the blue, but there was only the endless, waiting water."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["On the sixth morning, the air broke with a sharp cry. A gull, huge-winged and windblown, dropped from the sky and landed on the driftwood with a thud that shook the pebbles. His leg was bound with a strip of dried reed. Tied to the reed was a scrap of oak bark, scratched with a claw.", "Pip was first to reach it. She pecked at the reed, her chest puffing out with every beat. The message was short, and the scratches were rough, deep, and familiar. \"Still here. Storm knocked a limb off the oak. Fine. Chest a little sore. Hope you didn't fight it.\"", "Pip let out a sound that was half laugh, half squeak. Her eyes stung. She looked up, searching the sky for the old bird, but the clouds were high and white. Then her eye caught a second line, smaller, tucked beneath the first. \"Told you the sky would answer.\"", "She sat back on her heels, the bark trembling in her claws. Tuck was alive. Tuck was grumbling. Tuck was waiting. The worry in her chest did not vanish, but it changed shape, softening into something warm and solid, like a seed finally planted in good soil."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["Marra landed beside Pip. She did not speak at first. She looked at the bark, then at the horizon, then back at the bark. Her torn wing tip trembled in the breeze.", "\"That is Tuck,\" she said. Her voice was low, stripped of its usual booming authority. \"I exiled him myself. He broke a rule I no longer remember. He flew a course nobody else would, and he refused to apologize.\"", "Pip looked up at the Elder. Marra’s grey eyes were soft, but her jaw was tight. She looked out at the sea, where the wind was picking up, swirling dust and dried grass across the sand.", "\"I think,\" Marra said, her voice quiet as a held breath, \"it is time someone sent him an apology. In the biggest wind we can find.\"", "Pip felt a surge of hope so bright it was almost blinding. She looked at Nettle, who was already scanning the upper atmosphere. The Elder did not need to ask twice. She had given them permission to do what mattered, and that was more than enough."], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["The flock gathered on the highest point of the isle. They could not fly back; the season was short, and the birds were tired. But they could send something. Nettle pointed to a ribbon of air high above the sea, a steady stream blowing west, strong and cold.", "One by one, they offered their feathers. The Elders shed their grey tips. The fledglings plucked the soft down from their chests. Cinder dropped a glossy chestnut plume, his head bowed in a gesture of respect he had never before shown. The air filled with a cloud of brown, white, and gold.", "Pip waited until the last moment. She reached down to her left tail, found the one feather that was never straight, the one that acted as her rudder, and pulled. It came free with a small tug. She let it go.", "The wind caught it instantly. It spiraled up, joined the stream, and shot westward, a tiny brown arrow flying toward the Lightning Oak. The flock watched until the feathers were gone, just a shimmer in the blue distance, carrying their voices across the grey water."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["That night, the stars were thick and close, hanging low over the water. Pip sat on the highest rock, her toes curled around the stone. Uncle Dorn landed beside her. He was plump, and his feathers were ruffled, but he looked lighter than he had in two autumns.", "He did not grumble. He did not tell her to stay low. He looked at the stars, then at the road of wind that stretched out toward the Warm Reaches.", "\"Where do you want to go next?\" he asked.", "It was the question she had waited to be asked. The answer came before she could think it through.", "\"Everywhere,\" she said.", "Dorn let out a sound. It was not a grumble. It was a laugh, rusty and surprising, bubbling up from his chest. He nudged her gently with his beak.", "\"Small birds,\" he said, \"go where they like.\"", "Pip smiled into the dark. The wind hummed against the rock, a song without an end."], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "The Long Way South", "part": "PART FOUR: CLEARING SKIES", "paras": ["*Sky Report: bright, a firm following wind, all the good weather you could ask for.*", "The sky was a bright, clean blue, the color of a fresh eggshell. Marra stood on the highest rock of the isle, her torn wing tip tucked neatly against her side. She looked down at the line of sparrows, then at the tiny brown speck at the very front.", "\"Pip,\" Marra said, her voice booming across the water. \"Lead.\"", "Pip straightened her chest. Behind her, Nettle ruffled her feathers and tucked her head back. Cinder sat three spots down, looking glossy and serious. Uncle Dorn brought up the rear, flapping his wings to keep the line tight.", "\"Listen to me,\" Dorn called out, his voice carrying well enough for everyone to hear. \"In the old days, we flew in single file. Tight. No drifting. In the old days, I was the best. Now, you are the best. And I am the best at being behind you. Do you understand?\"", "Pip turned her head. \"Yes, Uncle.\"", "\"Good,\" Dorn grumbled, but there was a softness in it that he couldn't quite hide. \"Keep your eyes on the wind, Pip. The wind knows the way. You just have to listen.\"", "\"Always,\" Pip said.", "The flock lifted off, a long, silver line of brown and grey, stretching out over the grey sea toward the green promise of the land."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["The crossing took two days, which felt like two heartbeats and two long sighs. They rode the wind lanes, those invisible highways of warm air that rose from the water. Pip felt them first, a tickle in her feathers, a pull at her toes. She would dip her wing, just a fraction, and catch the lift.", "The others followed. It was not hard for them, not now. They had learned to trust the space Pip made. They flew in a long, unbroken ribbon, silver and brown, gliding over the waves without flapping.", "Cinder drifted once, too far to the left. He corrected, but his face was bright. He let out a short, sharp laugh. It was a real laugh, not a sneer, not a joke. He laughed at the wobble in his own wing, at the fact that he had to trust a bird smaller than him.", "Pip felt the warmth of that laugh in her chest. She did not look back. She just kept feeling the wind, and the wind kept holding her."], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["On the second dusk, the light turned gold and thick, hanging low over the waves. The air smelled of salt and the heavy, wet scent of coming rain. At the edge of the sky, a shadow moved, slow and deliberate. It was not a cloud. It was steel-grey, and it was patient.", "Skua Grey.", "The flock shuddered like a leaf in a draft. Cinder tucked his head in, his glossy chestnut feathers flattening against his body. Uncle Dorn’s plumage puffed out until he looked twice his size, a round grey ball of worry.", "Pip did not run, nor did she hide. She pushed off the air lane and flew out, alone, into the open sky. She was a tiny brown speck against the huge, cold eye of the hawk, no bigger than a single crumb of bread.", "\"We are not prey,\" Pip said. Her voice was small, but it did not shake. \"We are under my wing.\"", "Skua Grey stopped. The great hawk turned its head, one sharp eye fixed on the tiny sparrow. For a long moment, the only sound was the wind. Then, slowly, the hawk banked, its wings catching the updraft, and glided away over the water, leaving the sky empty and safe."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["The wind shifted, dropping the salt and bringing the scent of wet earth and ripe fruit. It smelled like a basket of apples left out in the rain.", "The Warm Reaches broke through the low light, a long green shore glowing gold. Trees bowed deep under the heavy fruit, and a thousand unknown birds filled the air with a song that seemed to have been singing since before the wind started blowing.", "The flock erupted. It was a roar, a shout, a messy tangle of relief and joy as they dove, a cascade of brown and grey dropping toward the green ground. Pip watched them fall, feeling the vibration of their happiness buzz through her tiny bones.", "She did not dive. She stayed high, hovering above the treetops and the cheering. The sky stretched out beneath her, warm and wide, ready to catch her."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["Pip circled once, above the shore, above the flock, above the trees. Her toes curled tight on the air, and her chest puffed out until she felt round as a button. The wind hummed against her feathers, a low, steady thrum that felt like the buzz of a happy bee.", "She looked at the sky, which was very large, and very blue, and full of every kind of weather that had ever been. It stretched out beneath her, warm and wide, ready to catch her.", "*Yes. That one. I'll have that one.*", "And then, for the first time, she thought, and the next. And the next."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "Small Birds Go Where They Like", "part": "PART FOUR: CLEARING SKIES", "paras": ["*Sky Report: warm, gentle winds from the south, clear all the way up.*", "The Warm Reaches smelled of ripe mangoes and wet stone. The scent made Pip’s chest feel heavy, the way a belly feels after eating too many sunflower seeds. Rain here did not howl or strike. It drifted down in a fine, warm mist that tasted like sugar and green leaves. She did not listen for thunder. She listened only to the birds, a low humming chorus that vibrated through the thick branches.", "She tucked herself into the crook of a massive mango branch. Beside her, Nettle was already dozing, her big feet curled tight against the wood. On the other side, Uncle Dorn puffed up his feathers until he looked like a grey plum. Then a glossy chestnut shape settled on the twig just below them. Cinder did not look at her. He looked at the sky, then at his own wing, then back at the sky. He had decided that being Pip’s shadow was a serious job, and he was taking it very seriously.", "Pip closed her eyes. The wind was gentle. It moved across her back like a hand, steady and sure. She was not afraid of what came next. She was only tired. And that was a good thing."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["Morning broke in shades of orange and gold. The Elders gathered under the canopy of a giant banyan tree, its roots hanging down like thick, green curtains. The air was still and thick with the scent of flowers. Pip stood on a high branch, her heart beating fast against her ribs. Beside her, Nettle was shaking, not from cold, but from nerves.", "Marra stepped forward. She held out a single feather, silver-blue and shimmering. It was longer than Pip’s beak. She held out another for Nettle. The crowd watched in silence. Pip took the feather. It was so big she had to hold it with both feet. It looked ridiculous. It looked like a flag she was not big enough to fly.", "A ripple of laughter went through the flock. Cinder made a small, stifled sound. Pip looked at the feather, then at her own tiny body. She tucked it under her crooked left tail feather. It sat there, bright and bold. It did not look ridiculous. It looked like a crown."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["Marra’s eyes narrowed as she looked at Pip, then at the oversized feather, then out at the entire crowd. The silence stretched until it felt like a held breath.", "\"Is there anything else you want, little bird?\" Marra asked. Her voice was low, rough as bark.", "Pip thought. She considered the Trial, the Elders' scrutiny of her size, Uncle Dorn's worry, and Cinder's mockery. She thought about the wind, which did not care how heavy you were, only how you moved.", "\"I want the Trial changed,\" Pip said. Her voice was small, but it carried. \"I want every sparrow to be allowed to try. Whatever their size. Whatever their weight.\"", "Marra blinked. She looked at her beak, then up at the sky. She looked grumpy. Then, with a dry click of her beak, she said, \"Consider it done.\"", "Pip lifted off the branch. She did a loop. It was small, and it was perfect. It caught the light and the wind and the eyes of every bird in the tree. Nobody laughed. They cheered."], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["Weeks drifted by like loose feathers. The mangoes ripened, split, and fell to the earth, while the air shifted from warm and honeyed to crisp and silver. Pip led the flock in practice flights, her silver feather catching the sun. She was fast, light, and different. She was good.", "Then, on a grey morning, a speck appeared on the horizon. It was small and ragged, moving slowly through the mist. It was not a hawk, nor a storm, but a bird with one eye and a lot of missing feathers.", "Old Tuck landed on Pip’s branch. He looked tired, weathered, and as if he had flown the sea alone at seventy seasons. He looked at Pip, then at the sky, then back at Pip again.", "\"Hmph,\" he said. \"Took you long enough.\"", "Pip did not speak. She did not tilt her head. She simply crashed into him. They hugged so hard they both fell off the branch, tumbling down into the leaves below. Uncle Dorn, watching from a higher branch, was heard to say, \"Well, I never.\""], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["The sky over the Warm Reaches was a blue so deep it looked like the inside of a ripe blueberry. Pip stood on the highest branch of the tallest tree, her toes curling tight against the bark while the wind played with her crooked tail feather. Beside her, a new sparrow had landed. It was tiny and round, no bigger than a walnut, and it looked at the sky with eyes wide enough to drop seeds into. Then it looked at Pip, and tilted its head exactly the way she did when she was thinking about something difficult.", "\"Do you think I could?\" the little one whispered. The voice was soft and scared, but it was also full of the same stubborn hope Pip recognized in a mirror.", "Pip smiled. She did not say yes, and she did not say no. She certainly did not say \"small birds stay low,\" because that phrase had a bad taste, like a seed that had been left out in the rain. She looked out at the sky, which was very large and very blue and waiting for something to happen.", "\"Let's go find out,\" she said.", "They leaped."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "Smallest Sparrow in the Hedge", "part": "PART ONE: LIGHT WIND FROM THE WEST", "page": 1}, {"n": 2, "title": "Small Birds Stay Low", "part": "PART ONE: LIGHT WIND FROM THE WEST", "page": 6}, {"n": 3, "title": "The Bird in the Lightning Oak", "part": "PART ONE: LIGHT WIND FROM THE WEST", "page": 11}, {"n": 4, "title": "One Hundred Wingbeats", "part": "PART ONE: LIGHT WIND FROM THE WEST", "page": 16}, {"n": 5, "title": "Learning the Sky", "part": "PART TWO: RISING WIND", "page": 21}, {"n": 6, "title": "Cinder's Loop", "part": "PART TWO: RISING WIND", "page": 26}, {"n": 7, "title": "Disqualified", "part": "PART TWO: RISING WIND", "page": 31}, {"n": 8, "title": "The Course", "part": "PART TWO: RISING WIND", "page": 36}, {"n": 9, "title": "The Marsh Wind", "part": "PART TWO: RISING WIND", "page": 41}, {"n": 10, "title": "The Cliff Wind", "part": "PART THREE: STORM WARNING", "page": 46}, {"n": 11, "title": "The Trial of Three Winds", "part": "PART THREE: STORM WARNING", "page": 51}, {"n": 12, "title": "The Storm Comes Early", "part": "PART THREE: STORM WARNING", "page": 56}, {"n": 13, "title": "Alone Over the Water", "part": "PART THREE: STORM WARNING", "page": 61}, {"n": 14, "title": "Skua Grey", "part": "PART THREE: STORM WARNING", "page": 66}, {"n": 15, "title": "The Lantern Isles Wind", "part": "PART FOUR: CLEARING SKIES", "page": 71}, {"n": 16, "title": "Landfall", "part": "PART FOUR: CLEARING SKIES", "page": 76}, {"n": 17, "title": "What Marra Said", "part": "PART FOUR: CLEARING SKIES", "page": 81}, {"n": 18, "title": "A Letter in the Wind", "part": "PART FOUR: CLEARING SKIES", "page": 86}, {"n": 19, "title": "The Long Way South", "part": "PART FOUR: CLEARING SKIES", "page": 91}, {"n": 20, "title": "Small Birds Go Where They Like", "part": "PART FOUR: CLEARING SKIES", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
