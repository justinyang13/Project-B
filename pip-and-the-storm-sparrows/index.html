<script>
const D = {"title": "Pip and the Storm-Sparrows", "sub": "A Small Bird and the Biggest Sky", "pages": [{"no": 1, "ch": 1, "ctitle": "Smallest Sparrow in the Hedge", "part": "PART ONE: LIGHT WIND FROM THE WEST", "paras": ["*Sky Report: light wind from the west, clear, one very small bird with very big ideas.*", "Pip was the smallest sparrow in Thistlewick Hedge, which is a thing you could have worked out for yourself by looking at her, or by listening to the other sparrows, who mentioned it often.", "\"Smallest sparrow in the hedge,\" said Uncle Dorn, as he did every morning, \"and smallest she'll stay.\"", "Pip was eleven weeks old and weighed less than a walnut. She stood on the topmost twig with her toes curled tight and her chest puffed out, and she looked at the sky, which was very large, and she thought: *Yes. That one. I'll have that one.*", "The wind lifted the tip of her crooked left tail feather and set it down again, the way you might tap a friend on the shoulder. Pip decided it was a yes."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["Mornings in Thistlewick Hedge were loud. Two hundred sparrows woke at once and began to argue about seeds, weather, and who had taken whose branch. Mother Wren, who had opinions on everything, gave them all out before breakfast. Somebody's aunt announced that there was a worm in the east corner. Somebody's uncle announced that the worm was hers.", "The fledglings measured everything in wingbeats. How far to the fence post: forty wingbeats. How far to the pond: ninety. How far you could fly before landing was the only thing anyone your age ever really wanted to know.", "At the top of the hedge, Cinder, the biggest fledgling of the year, did a slow loop as smooth as a ribbon, and the whole hedge applauded. Pip took a running hop off her twig and tried the same. What came out was a wobble, a spin, and a splash landing in the pond. There was a pause. Then two hundred sparrows laughed, not cruelly, but the way you laugh at a hat that has blown off.", "Pip climbed out. She shook herself. Her crooked tail feather dripped."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["Here is how Pip came to be so small. She hatched a full week after her brothers and sisters, the runt of the clutch, and fell out of the nest before she could fly, which is how she got the crooked feather. Two autumns ago her parents flew into a storm over the sea, and did not come back.", "After that there was only Uncle Dorn, who was plump and gloomy and roughly the shape of a cushion. He had taken her in with a great deal of grumbling, and had grumbled ever since, every day, with more love than he knew how to say and a great deal more worry than he knew what to do with.", "\"Small birds stay low,\" he told her each night, as he tucked her under his wing. \"Low is safe. Low is warm. Low never got blown out to sea.\"", "Pip, half asleep against his soft grey feathers, did not argue. She had stopped arguing months ago. She had started something else instead. It was a plan, and it was still too small and tender to say out loud."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["Nettle found her at the seed patch. Nettle was Pip's best friend: a skinny, freckled, anxious sparrow with feet too large for the rest of her, who watched clouds the way other birds watched the ground.", "\"They're announcing it at sundown,\" Nettle whispered. Her eyes were huge. \"The Trial of Three Winds.\"", "Pip dropped her seed.", "Every bird in the hedge knew about the Trial. Once a year, at the Gathering, the Elders chose the flock's new Storm-Sparrows: the fastest, boldest scouts, the ones who rode the edge of the autumn gales far ahead of the flock and read the sky for the safe way south across the Grey Sea. It was the only thing in the world Pip had ever really wanted. And it had never, in the whole history of Thistlewick Hedge, been given to a bird who weighed less than a walnut.", "Her heart turned over like a leaf in a gust."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["At sundown the whole flock crowded onto the Gathering Rock, wing to wing, and Elder Marra rose above them.", "Marra was big, and grey, and streaked like an old stone wall, with a torn wing tip and a voice like a cart on a gravel road. She told them the Trial would be flown at sunrise, three days from now, over the three winds of the coast. Any fledgling might enter, she said, \"except those the Elders judge unready.\"", "Her eye moved over the crowd. It passed over Pip. It stopped, for the smallest possible instant, and moved on.", "That was all. Nobody else noticed. But Pip felt it land on her like a raindrop, and she sat very still, small and brown among the taller birds, with the pink light going gold on the rock.", "\"I'm entering,\" she said to the evening wind, so quietly that only the wind could have heard.", "And the wind, for a wonder, lifted one feather in reply."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "Small Birds Stay Low", "part": "PART ONE: LIGHT WIND FROM THE WEST", "paras": ["*Sky Report: rising wind, gusty, a hedge full of opinions.*", "The morning after the announcement, Thistlewick Hedge did not sleep. Instead, it buzzed, hummed, and argued. Two hundred sparrows woke up with news on their tongues, and the news was Pip.", "Mother Wren, who had opinions on everything including the correct temperature for a sunbeam, hopped right up to Pip’s feet. \"You should stick to worm-finding, dear,\" she said, preening a feather that did not need preening. \"Worms are low. Worms are safe. Worms do not blow into next week.\"", "The older fledglings, a pack of noisy chestnut and brown feathers, circled her. They hopped closer, leaning in with their beaks open in friendly, terrifying curiosity. \"Too light,\" said one. \"A sneeze and you’re gone,\" said another. \"You’ll be blown right off the map,\" said a third, winking at his friend.", "Pip stood on her twig, toes curled tight. She did not puff out her chest, nor did she shrink. Instead, she tilted her head, watching a leaf spin down from the highest branch.", "\"Tweet-truth?\" she asked.", "The birds stopped and blinked.", "\"Then I'll go there,\" she said, pointing her small beak at the distant, grey edge of the sky."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["Uncle Dorn found her behind the honeysuckle, where the green grew thick and the light stayed dim. He was ruffled. His plumage looked like a storm cloud that had been sat on, and the grey in his feathers seemed paler than usual.", "He did not grumble. He did not say she was the smallest. Instead, he looked at the sky, which was very blue and very far away, then down at Pip, who was very small and very close.", "\"The wind is too rough,\" he said. His voice was thin, stripped of its usual grumbly bulk. \"The sky is too big. And the Storm-Sparrows are the ones who don't come back.\"", "Pip had never seen him afraid. It was a strange feeling, like hearing a thunderclap in a quiet room. He extended his wing, not to hold her, but to block the breeze.", "\"Small birds stay low,\" he said, more gently than he had ever spoken in her eleven weeks of life. \"Low is safe.\"", "Pip looked at his soft, trembling feathers. Then she looked at the sky, which was not listening.", "\"Low is small,\" she said.", "She was surprised at herself. The words had not been planned. They had just fallen out, light as dandelion seeds, into the quiet space between them."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["Elder Marra was already waiting on the Gathering Rock, her torn wing tip flaring like a jagged flag in the breeze. She did not look up when Pip landed on the rough stone three feet away, though the elder’s dark eyes shifted to acknowledge the new weight.", "\"I'm entering the Trial,\" Pip said.", "Marra’s head cocked. One sharp eye slid sideways to look at Pip directly, while the other stayed fixed on the horizon. \"You weigh less than a walnut,\" Marra said. Her voice was not loud, but it filled the space between them like a heavy stone dropped into a quiet room.", "\"I can fly,\" Pip replied.", "Marra shifted her weight, and the stone crunched under her claws. \"The Trial is not for chicks who are too light to be caught by the wind. It is for birds who can steer it.\" She turned her head fully, fixing Pip with a gaze that felt like being checked for homework. \"Storm-Sparrows are built, not wished.\"", "It was not unkind. It was worse than unkind. It was certain, a door closing smooth and final. Pip’s chest went tight, a drum skin pulled so high it might snap. She wanted to argue, to point to the sky, to do a loop. But she just stood there, small and brown, while Marra turned back to the horizon and said nothing more."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["At the seed patch, the air smelled of dust and dried sun, and Cinder was there, glossy chestnut preening a wing with the serious concentration of a painter mixing colors. He heard the news before Pip even reached the center.", "\"Pip? In the Trial?\"", "He laughed. It was a short, dry sound, like a twig snapping, and then he spread his wings, wide and powerful, to catch an updraft. He did not just fly; he soared. He banked, tilted, and rolled, a perfect barrel roll that left a ghost of motion in the air.", "The other fledglings watched, beaks open, eyes wide. They whispered. *Look at him. Look at the speed. Look at the grace.*", "Cinder landed, dusting off his feathers. \"The wind would take you off like a dandelion seed,\" he said, shaking his head. \"Tweet-truth, you should hold on to a twig and pray.\"", "Pip watched him land. She did not sneer. She did not pout. Instead, she watched the way his tail feather acted as a rudder, and the way his wings flexed at the very last second to catch the drop. She memorized it. Every angle. Every beat. It was the best barrel roll she had ever seen, and she was going to learn exactly how it worked."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["Night settled over Thistlewick Hedge, thick and quiet, before the stars emerged. They brightened the darkness, looking like a handful of dropped peppermints. Pip tucked her head under her wing in the deepest knot of thorns. The twigs tangled there like knotted shoelaces.", "A shadow shifted in the leaves. Nettle landed, her large feet silent on the dried grass. She sat close enough for Pip to feel the gentle warmth of her small body. Nettle did not speak at once. She just waited, watching the sky.", "\"Everyone says you can't,\" Nettle whispered, her voice barely a breath against the night air. She looked up, her eyes wide and dark. \"Do you think you can?\"", "Pip lifted her head. The sky above was vast and black, stitched with pinpricks of light. It felt terrifying. It felt beautiful. It felt like it was waiting.", "She did not answer right away. She watched the stars until her eyes ached. The night stopped feeling like a heavy blanket and started feeling like a door.", "\"I don't know,\" she said finally. \"But I know I can't if I don't try. And that's the only thing that's true for sure.\""], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "The Bird in the Lightning Oak", "part": "PART ONE: LIGHT WIND FROM THE WEST", "paras": ["*Sky Report: still, warm, a strange hush before something.*", "Dawn broke in shades of pale apricot. Pip slipped out of the hedge’s thorny heart and hopped toward the edge, where the ground sloped away into the tall grass. There, standing alone and jagged against the sky, was the Lightning Oak. Its bark was scarred and black, split by a bolt two summers ago. Nobody went there. The older sparrows crossed their feathers and flew the long way around, muttering about bad luck and old ghosts.", "Pip did not believe in ghosts. She believed in wind.", "She reached the base of the tree and pressed her beak against the rough, cold bark. It smelled of damp earth and ozone, a sharp tang that made the fuzz on her neck stand up. She began to climb. One step. Two. Her tiny claws gripped the ridges. Up she went, past the low branches, past the knot of lichen, higher until her wings trembled with the effort.", "At the top, near the split in the trunk, was a hollow dark as a pupil.", "She leaned forward and called out, her voice small in the vast morning air. \"Hello? Is someone home?\"", "Silence stretched. Then, from the depths, came a dry cough that cracked like a dry seed shell. A voice drifted out, raspy and rough.", "\"Go away. I'm not home.\""], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["A shadow shifted in the darkness of the hollow. A head emerged. It was ragged, feathers sticking out in every direction, and one eye was covered by a patch of matted grey feathers. The other eye was bright, sharp, and gleaming like a drop of sap. Half his tail feathers were missing, leaving a jagged edge that trembled slightly in the breeze.", "He looked at Pip. He looked at her for a long, long time.", "\"You're the runt,\" he said. His voice was still dry, but there was a spark in it now.", "\"I'm Pip,\" she corrected, puffing her chest out to look as big as she could.", "\"Hmph.\" The old bird shook his head. \"You're not the runt. I was the runt. You're a runt-in-training.\" He hopped back into the hollow, leaving a trail of dust. \"I do not train fledglings. I never have. I am retired. I am old. I am done.\"", "Pip did not move. She stood on the topmost branch, her toes curled tight. \"I'm not a fledgling,\" she said, though she knew that was a lie. \"I'm just... early.\""], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["\"I want to be a Storm-Sparrow,\" Pip said, the words sitting heavy in her mouth like a seed she was swallowing whole. She knew the rules. She knew she was too small, too light, and too slow for the Elders' liking. But she was going to do it anyway.", "The old bird said nothing. He watched a single leaf drift past the hollow, tumble, catch the air, and disappear over the hedge. The moment stretched out, thin and golden, holding its breath with them.", "Then he spoke. \"Who said you can't?\"", "\"Everyone,\" Pip replied, her voice dropping to a whisper. \"Uncle Dorn. Elder Marra. Even the seeds, sometimes, when I try to carry them.\"", "Tuck cocked his one good eye. \"Have you asked the sky?\"", "Pip blinked. She tilted her head, the way she always did when she was thinking, her crooked tail feather twitching in the draft. \"The sky doesn't answer.\"", "\"Doesn't it?\" Tuck’s dry voice softened, just a fraction, like a rustle of dry leaves settling down. \"You'd be surprised.\""], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["\"Here is the deal,\" Tuck said, his head emerging fully now. He looked less like a crumpled leaf and more like a bird, though a very tired one. \"One lesson. First light tomorrow. Top of the oak.\"", "Pip’s heart beat fast. A tiny drum in her ribs.", "\"Just one?\"", "\"If you can stay in the air for one hundred wingbeats without landing,\" Tuck said, \"I will consider a second.\" He paused. \"If you land before then, you go home and stay low. Where you belong.\"", "A grim gleam lit up his good eye. \"You will be flying into the morning updraft. It throws big birds around. It likes small ones.\"", "Pip did not think about the danger. She did not think about the height. She thought about the sky. Vast. Waiting.", "\"Yes.\"", "The word came out fast. Sharp. Bright.", "Her crooked tail feather twitched with the motion."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["On the way back to the hedge, Pip stopped at a puddle in the grass. The water was still, holding the reflection of the morning sky. She looked down and saw a tiny, brown-streaked bird with a crooked tail feather on the left. She looked small and fragile, exactly like she always had.", "She watched her reflection for a long time. The water rippled slightly, and her image wavered, but it did not break.", "\"Small birds stay low,\" she said to the puddle. Her voice was quiet, barely a whisper.", "She lifted her head, and the sky stretched out above her, endless and blue, promising wind and distance and freedom. She looked at it, and for the first time, she did not feel small. She felt ready.", "\"Well,\" she said to the sky, \"let's find out.\""], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "One Hundred Wingbeats", "part": "PART ONE: LIGHT WIND FROM THE WEST", "paras": ["*Sky Report: sunrise updraft, gentle, growing.*", "The dawn light caught the top of the Lightning Oak and turned the rough bark into bright gold. Old Tuck sat beside Pip on a high, splintered branch. He spat a wad of chewed bark onto the grass far below and pointed his beak at the empty air stretching out over the hedge. The wind was rising, a warm, invisible ladder.", "\"One hundred wingbeats,\" Tuck said. His one eye was sharp. \"Count them out loud. Go.\"", "Pip did not hesitate. She launched herself into the morning air, her wings whirred hard, and she felt the sky push back against her.", "\"Seven,\" she puffed. \"Eight.\"", "The air felt thick, like wading through wet wool. She fought it, her muscles burning.", "\"Twenty,\" she gasped. \"Twenty-one.\"", "She was still up, and she was still in control. For the first time, the distance below was just a green blur, and she was above it.", "\"Twenty-two!\"", "The wind changed. It caught her wingtip and flipped her."], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["She did not know what hit her. One moment she was climbing, the next she was tumbling. The world spun in dizzying circles of blue and green. She tucked her wings, trying to stop the spin, but the air only pushed her faster.", "*Crash.*", "Pip landed in a bramble bush with a squeak and a mouthful of holly leaves. She hung there, dangling by her tail, eyes wide and watery.", "\"Twenty-two,\" said Tuck from the branch above. His voice was flat. \"Again.\"", "Pip shook the leaves from her beak. Her feathers were ruffled. Her chest thumped against her ribs. She climbed out, scratched, and furious.", "The second attempt ended at nineteen. The third at sixteen. Each time, the wind seemed to get meaner. By the fifth crash, she was lying in the brambles, panting, with a scratch on her wing and a bruise on her breast.", "Tuck looked down at her. A tiny sound escaped his throat. He covered it with a cough."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["Tuck dropped from the branch and landed on a thorned twig right beside Pip. He did not look pitying. He looked tired. Like a bird who had seen this exact mistake a hundred times before. He tapped her head gently with his beak.", "\"You are fighting it,\" he said. \"The wind is not your enemy, Pip. It is a river. You are a leaf. Leaves do not fight rivers. Leaves ride.\"", "He spread his ragged wings wide. He did not flap. He simply opened them and let the updraft pull him upward, rising in a slow, lazy spiral that required no effort at all. He hung there, high and easy, tilting his body to catch the current.", "Pip watched with her beak open. Her wings ached. Her legs trembled. Tuck just drifted, looking as relaxed and effortless as a leaf floating on a still pond. It looked as easy as sleeping.", "\"Watch the air,\" Tuck called down, his voice carrying clearly despite the height. \"Don't beat it. Feel it.\""], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["Pip tried it. She stopped pushing the air away and simply let it lift her, tilting that crooked tail feather to steer. For the first time in her life, the wind was underneath her instead of against her. She rose gently, drifting higher past the oak’s crown and the fence post where Cinder usually landed. Below, Thistlewick Hedge looked like a rumpled green quilt, tiny and safe.", "\"Sixty-eight!\" she shrieked, her voice thin but strong.", "The air held her. She was not fighting; she was dancing.", "\"Seventy!\"", "She climbed higher than she ever had, riding the invisible current like a leaf on a river."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["At ninety-nine, something made her look down.", "Cinder was on the fence post. He watched her with eyes as cold and hard as polished river stones, his glossy chestnut feathers smoothed flat against his body.", "Pip lost the rhythm. Her chest knocked a wrong note, and the wind threw her sideways. She wobbled, nearly losing her balance, but she remembered the river and the leaf. She flapped twice, just twice, to steady herself, and caught the updraft again.", "She was still up when the hundredth beat arrived.", "She dropped to the branch, gasping for air, her wings trembling with the effort of holding on.", "\"Hmph,\" said Tuck. He did not smile, nor did he cheer. He just looked at the sky. \"Second lesson tomorrow.\"", "From the fence, a voice came, low and sharp.", "\"Who is your teacher, Pip?\""], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "Learning the Sky", "part": "PART TWO: RISING WIND", "paras": ["*Sky Report: fair, steady wind from the northwest, good for learning.*", "Dawn smelled of wet moss and cold stone. Pip slipped away before the hedge woke, her chest tight with a frantic, flapping rhythm against her ribs. The Lightning Oak loomed ahead, its twisted branches reaching up into the grey light. Tuck was already there, perched on the highest branch, one eye tracking her approach with sharp, amused focus.", "\"Good,\" he cawed. \"The sky is talking. Are you listening?\"", "He tossed a single, broad leaf across the gap. It caught a gentle updraft and hovered, spinning slowly before drifting down. Pip blinked. She could see the air moving, but she could not feel it.", "\"Close your eyes,\" Tuck commanded.", "\"I can't,\" Pip squeaked. \"I will hit a branch.\"", "\"You will. That is the point. The wind has weight, Pip. It has texture. It is not empty space. It is a river you are swimming in. Feel the current.\"", "She closed her eyes. The world went dark, then filled with sensation. The air brushed her cheeks, cool and dry. She flapped, but she flapped against the air, fighting it, pushing her tiny body through a solid wall of resistance. She bumped a twig, tumbled, and landed in the ivy with a soft thud.", "\"Again,\" said Tuck, sounding bored. \"And stop trying to push the water. Let it push you.\""], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["Nettle had been hiding in the ivy for two sunups, her large feet gripping a vine while her freckled chest heaved with the effort of staying quiet. When Pip tumbled down again, Nettle flinched.", "\"I know you're there,\" Pip said, brushing a leaf from her beak. \"I heard your breathing. It is very loud, Nettle.\"", "Nettle peeked out, her eyes wide and watery. \"I just wanted to see. Tuck is... he is different.\"", "\"He is difficult,\" Pip corrected. \"But he listens.\"", "Tuck looked down at the two of them. He did not ask how Nettle got there, nor did he grumble about the intrusion. He simply ruffled his feathers. \"You,\" he said, pointing one wing at her. \"You watch clouds. More than anyone else in the hedge.\"", "Nettle shrank. \"I just... I like looking up. It is safe up there.\"", "\"Tell me what is coming,\" he commanded, tilting his head toward the pale blue sky.", "Nettle swallowed, her beak trembling slightly. \"Rain,\" she whispered. \"From the sea. In two sunups.\"", "Tuck stared at her, then turned his single eye toward the horizon where a faint, bruised purple was forming. He let out a low, grumbling hoot that sounded suspiciously like respect.", "\"Two sunups,\" he repeated. \"Not three. Not one. Two.\" He looked at Pip. \"Keep her close. Small birds need eyes.\""], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["The wind picked up, whistling through the oak’s hollows with a sound like a whistle being blown against a tight lip. Tuck spread his wings, blocking the breeze, and Pip tried to fly past him but was pushed back, her wings beating desperately against the air.", "\"Stop fighting it,\" Tuck said. \"You are small. You are light. A big bird must fight the wind to move through it. It must labor. It must burn energy to push against the current.\"", "He let the wind pass through his feathers. He did not move.", "\"You do not have to push,\" he continued. \"You can let the wind carry you. A gust that is a headwind for Cinder is a ladder for you. You ride the edge of the storm. You find the updrafts that a heavy wing cannot feel because they are too thin, too gentle, too small for their power.\"", "Pip tilted her head. \"So I don't fly like him?\"", "\"No,\" Tuck said firmly. \"It is not that you cannot fly like Cinder. It is that you should not. You fly like Pip. You are light. You are quick. You find the spaces between the gusts. That is your power. Do not waste it trying to be a boulder.\""], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["A week passed, and the sky became a map Pip could read in her bones. She reached two hundred wingbeats. Then three. The number felt less like a limit and more like a starting line.", "She learned the tight spiral, corkscrewing up the thermal until the air grew cold and thin, then releasing and gliding down the other side. She learned the slip, turning her body sideways into a crosswind so it slid off her feathers instead of knocking her over.", "One afternoon, she attempted the dive-and-recover. She dropped from the highest branch, plummeting toward the earth, her heart slamming against her throat. At the last possible moment, she flared her wings.", "Nettle, watching from the ground, shut her eyes tight.", "Pip pulled up. She leveled out, hovering for a single, impossible second, before drifting gently onto a low branch. Her crooked tail feather twitched, catching the air, steering her like a rudder on a small boat.", "\"Did I do it?\" Pip asked, her voice shaking.", "Tuck was already turning away. \"You wobbled on the left,\" he grumbled. \"But you did it.\""], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["The sun sank behind the hedge, painting the sky in shades of bruised purple and burnt orange. Pip and Nettle flew home, their shadows stretching long and thin across the grass below, and they passed the Gathering Rock where the Elders had gathered for the evening meeting.", "Marra’s voice boomed across the fields, louder than the wind and the rustling leaves, as she read the list of entrants for the Trial of Three Winds.", "\"Cinder,\" Marra called.", "The hedge went silent. Cinder stepped forward, his chestnut feathers gleaming, and grinned at the crowd.", "\"Thistle,\" Marra said.", "\"Nettle?\" Pip whispered, looking at her friend.", "Nettle shook her head, her eyes fixed on the rock.", "Marra continued down the list, names tumbling out like dry seeds. Pip listened. She counted every name, waiting for hers.", "Marra stopped. She looked up at the sky, then down at the hedge, and the list was over.", "Pip’s name was not on it."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "Cinder's Loop", "part": "PART TWO: RISING WIND", "paras": ["*Sky Report: bright, blustery, a good day to be looked at.*", "The Windmill Fields lay flat and golden, the blades turning with a slow, wooden groan. The air smelled of dry stalks and hot dust. Pip and Nettle perched on a low fence rail, their toes gripping the rough wood. Below them, the Trial entrants practiced in tight formations.", "Cinder led them. He was a blur of glossy chestnut, his wings beating with a power that made the air shimmer. He spiraled upward, trailing a line of younger sparrows who struggled to keep pace. The spiral was perfect, unbroken, a continuous line of motion against the blue. The whole hedge, gathered on the hedgerow behind the fence, cheered until their throats ached.", "Pip’s wings twitched against her sides. The itch was a physical thing, a tingling heat in her shoulder blades. She looked at the sky, then at her own small, brown body. She looked at the wind, which was pushing gently against her flank.", "\"He does it with his muscles,\" Nettle whispered, her eyes wide. \"I do it with my eyes. What do you do?\"", "Pip tilted her head. The wind ruffled her crooked tail feather. \"I listen,\" she said.", "The cheer from the hedge rose again, a wave of sound that hit her chest. Her heart beat fast and hard, a tiny drum in a small body."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["A shadow dropped over them. Cinder landed on the fence post, his weight making the wood creak. He preened his chestnut feathers, looking down at the two small sparrows with a grin that was all beak and no kindness.", "\"Did you hear that, small one?\" he called out, his voice carrying to the watching flock. \"Pip is here to be a windmill. She wants to spin.\"", "The hedge laughed. It was a sharp, quick laugh, the kind that starts in the throat and pops out before you can stop it. Cinder hopped closer, his big eyes bright with amusement.", "\"Come on,\" he said, spreading his wings wide. \"One loop. Just one. Let’s see if you can fly a circle or if you’ll just fall.\"", "Pip looked at Nettle. Nettle shrank into herself, her big feet gripping the rail. Pip looked at the wind. The wind was high, pushing hard from the west, not the gentle breeze of the morning. It was a strong, tricky wind. She knew she would fail. She knew her wings were too short for this.", "But if she stayed on the fence, she would never know how the wind felt when it tried to break her.", "\"Watch closely,\" Pip said.", "She pushed off the rail."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["She hit the air and immediately lost her balance. The wind slapped her side, hard and cold, and her wings flailed in a panic. She tried to steer, to fight the gust, but she was too light, too small. The air pushed her into a lopsided tumble. She spun, the ground rushing up to meet her, and she dropped twenty feet in a single breath.", "The hedge gasped, then roared with laughter. Pip crashed into a patch of thistles, the spines pricking her soft belly. She lay there, trembling, her face hot with shame. The thorns were sharp and angry.", "Then she heard Tuck’s voice, dry and quiet in her memory. *Don’t fight it. Ride it.*", "She stopped thrashing. She stopped trying to push against the wind. She spread her wings wide, flat, and let the air lift them. The gust that had thrown her now caught her underside. Her body rose, not straight up, but in a long, curving arc, sliding along the invisible current. The thistles fell away. The fence went up."], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["Not a loop. A spiral. An unlikely, rising curl that she hadn’t planned. The wind caught her, lifted her, and carried her higher. She climbed above the mill, above the fence, above the heads of the laughing birds. She hung there, effortless and shining, her wings held steady while the air did the work.", "The laughter died. The hedge went silent. Pip was a speck of brown against the blue, turning slowly in the updraft. It looked like the tiniest, strangest, loveliest kind of flying. It looked like a dandelion seed refusing to land.", "Nettle let out a whoop that was half shout, half squeak. \"Pip! Look at her!\"", "Pip felt the wind change, softer now, and she angled her body to glide down. She was not fighting. She was dancing. The air held her, and she held the air. For a moment, she was not the smallest sparrow in the hedge. She was the only one in the sky."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["Pip landed on the fence rail, her legs shaking so hard she could barely stand. She puffed her chest out, trying to look calm, but her tail feather was still twitching. Cinder was still on the post, his beak slightly open. He squinted at her, his expression stiff and confused.", "\"Lucky gust,\" he said. His voice was flat, stripped of its usual swagger.", "Pip looked at him. Then she looked at the wind, which was blowing gently across the field.", "\"Maybe,\" she said. \"But it was my gust.\"", "She turned and flew off, Nettle buzzing at her side. They disappeared over the hedge, leaving the field behind. In the shadows of a nearby hawthorn, a large chestnut shape watched them go. Cinder’s eyes were dark and serious. He was not laughing any more. He was thinking."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "Disqualified", "part": "PART TWO: RISING WIND", "paras": ["*Sky Report: overcast, a lid of grey, whispers on every branch.*", "By the time the moon had thinned to a sliver, the whole hedge knew. Whispers rustled through the hawthorns, the story changing shape three times over, though the core remained: Pip had flown, and she had stayed in the air.", "She landed on her usual branch, the one with the best view of the sky and the worst view of the ground. Uncle Dorn was already there, waiting with feathers on end, a plume of grey and brown fluff that made him look twice his size. He did not turn around, nor did he blink.", "\"Where were you?\" he asked, his voice low, scraping against the quiet night.", "Pip’s chest felt tight, like a knot in a shoelace she couldn’t untie. She looked at the stars, then at his back, knowing there was no hiding there, not with Dorn.", "\"The fields,\" she said. \"The Windmill Fields.\"", "He turned then, slowly, his eyes wide and wet in the moonlight. \"And Tuck?\"", "Pip nodded. She told him everything: the oak, the lessons, Nettle’s secret joining, and the spiral she had managed in the gust. She told it all because lying to Dorn felt like swallowing a pebble. He listened without interrupting or grumbling, and when she finished, he stared at the dark hedge, his chest heaving slightly, as if the effort of holding still had finally broken him."], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["Dorn’s voice cracked when he finally spoke. It was a thin, sharp sound, like a twig underfoot.", "\"I lost your parents to a storm,\" he said. The words fell into the silence between them, heavy and cold. \"Storm-Sparrows fly into the edge of them. They ride the teeth of the wind. I cannot lose you, Pip. I cannot.\"", "He stepped closer, his plump body blocking the moonlight. \"I am not saying you are not good. I am saying you are mine.\"", "Pip felt a lump in her throat, thick and stubborn. She pressed against his soft, grey feathers. She loved him fiercely, with a love that ached in her small bones. But she also felt the sky above, vast and waiting.", "\"If I stay low all my life,\" she whispered, her voice trembling, \"I will be safe. And I will not be me.\"", "Dorn closed his eyes. A single tear slid down his beak. He did not argue. He simply wrapped his wing around her, a tight, warm shield against the cold night air, and held on as if letting go would break the world."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["At dawn, the light was the color of old bone. Pip was summoned to the Gathering Rock. Elder Marra waited at the top, perched on a ledge of rough stone. She looked tired, her grey streaks dull, her torn wing tip drooping. The air was still, heavy with the promise of rain.", "Marra’s voice boomed, but it was quiet underneath. \"I saw the spiral. From the ridge. It was remarkable, for a chick of this size.\"", "Pip puffed out her chest, trying to stand taller. \"Thank you, Elder.\"", "\"But the Trial is dangerous. The rules are old.\" Marra’s eyes were hard, flinty. \"Storm-Sparrows are built, not wished. You are not built for it, Pip. You will not enter.\"", "Pip’s head tilted. \"What do I have to do to be built?\"", "Marra opened her beak. Closed it. Looked out over the sleeping hedge. She could not answer. The silence stretched, thin and tight, until it snapped. Marra turned her back, a final, sharp gesture. \"Go.\"", "Pip did not go. She stood there, small and brown, looking up at the bird who held the keys to the sky. Marra did not look back."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["Pip walked away with her chin high, though her eyes were wet and her wings felt heavy, dragging at her sides like wet wool. She flew low, skimming the tops of the reeds until she reached the Lightning Oak, where the hollow smelled of dry leaves and old rain.", "Old Tuck was there. He was stripping bark from a twig with his beak, tapping it against the wood with a rhythmic click, click, click. He did not look up.", "\"Marra said no,\" Pip said. Her voice was flat.", "Tuck stopped tapping. He looked at her with his one good eye. He did not offer comfort. He did not offer pity. He just watched her.", "\"So?\" he said.", "Pip blinked. \"So?\"", "\"The rule says you can't enter,\" Tuck said, dropping the twig. \"Did the rule say you can't fly the course?\"", "Pip stared at him. The words hung in the air, simple and impossible. Tuck shrugged his ragged shoulders, a gesture so casual it seemed almost rude.", "\"I've broken worse,\" he said, and went back to whittling."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["From the ivy wrapped around the oak, a small voice squeaked. Nettle was there, her big eyes reflecting the dim light. She had been listening.", "\"The Trial is the day after tomorrow,\" Nettle whispered. Her feet twitched with nervous energy. \"The course is the three winds: the Windmill Fields, the Salt Marsh, and the Cliffs of Calder.\"", "Tuck looked up. Pip looked at Nettle.", "\"If we go before the entrants,\" Nettle continued, her voice gaining a tiny bit of strength, \"we fly it first.\"", "Pip looked at the sky. Dawn was coming, thin and pink, bleeding across the horizon. The wind was picking up, cool and sharp. It pulled at her feathers, inviting her. She looked at Tuck, then at Nettle. The fear was there, but so was the sky.", "\"We fly it first,\" Pip said."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "The Course", "part": "PART TWO: RISING WIND", "paras": ["*Sky Report: cold, clear, a rising dawn wind, three friends and a plan.*", "The hollow of the Lightning Oak smelled of dry wood and old rain. Tuck’s one good eye glinted in the dimness. He dragged a claw across the dirt floor, drawing a squiggly line that stopped at a sharp corner.", "\"Windmill Fields,\" he rasped. \"First test. A spinning current. It doesn't like straight lines.\"", "Pip tilted her head. She watched the scratch mark. \"How does it feel?\"", "\"Like a drunk uncle trying to hug you,\" Tuck said. \"Messy. Sticky. Unpredictable.\" He drew a second line, lower, dipping into a dip. \"Salt Marsh. Heavy air. It pulls you down. You have to fight the ground.\"", "Nettle, perched on a root, nodded rapidly. She knew the marsh. She had watched it from the high branches, counting the droplets on the reeds.", "Tuck made a third mark, a steep, jagged slash upward. \"Cliffs of Calder. The updraft. It lifts or it breaks. No middle ground.\" He looked at Pip, then at the dirt. \"Three winds. Three chances to get it wrong. Or right.\"", "Pip looked at her tiny feet. They seemed smaller in the dark. But the wind outside was tapping at the hollow’s mouth, a steady, rhythmic knock. It was waiting."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["\"You think the wind is the enemy,\" Tuck said, not looking up. \"It isn't. It’s a partner. A difficult one.\" He tapped the first mark. \"The Windmill Wind is a bully. It pushes. If you push back, it pushes harder. You spin with it. You let it lead you in a circle. When it gets bored, it lets go.\"", "He moved to the second mark. \"The Marsh Wind is a sneak. It waits until you are tired. It grabs your tail feathers. It tries to drag you into the mud. You have to be light. You have to be faster than your own tiredness.\"", "Finally, he pointed to the jagged slash. \"The Cliff Wind. That one is generous. Terrible, but generous. It will fling a heavy bird into the rock face. It will shatter a stiff wing. But for a bird who weighs nothing, who is just a thought with feathers, it lifts you higher than you have ever been.\"", "Tuck looked straight at Pip. His one eye was bright.", "\"That last one's the only one you'll like,\" he said. \"Because the sky loves small things. Big things, it ignores.\"", "Pip felt her chest puff out. She had never felt lighter than she did in that moment, as if the hollow had lifted her too."], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["\"I'm coming,\" Nettle said, her voice barely a whisper but holding its shape. \"I can read the clouds. I know where the heavy air sits. I can see the marsh currents before they hit.\"", "Tuck turned his head. He looked at Nettle for a long time, his one eye blinking slowly. Then he nodded. \"You fly the marsh leg. You are my eyes. I am too old to see the small shifts in the wet air.\"", "They practiced signals in the dark. A wing tilt meant danger, a sharp chirp meant drift, and a soft hum meant all clear. Pip hummed, feeling strange, but the sound worked.", "Below the oak, Uncle Dorn walked the hedge. He could not sleep. He saw three small shapes moving in the grass, heading toward the lightning-stripped tree. He stopped, his toes gripping the bark tightly. He looked at the dark hole in the trunk.", "He did not follow. He tucked his beak under his wing and watched them disappear into the dark. He waited until the wind picked up, then he flew home, but he did not sleep."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["The sky had turned the color of a bruised plum, and the windmill sails turned slowly, creaking in the damp air. Pip stood on the first marker, a stone pillar at the edge of the fields, feeling the cold seep into her toes. Her stomach was full of moths, fluttering and bumping against her ribs.", "Tuck landed beside her. He looked tired, but his one eye was sharp as a thorn.", "\"Ride it, don't fight it,\" he said.", "Pip nodded. She looked at Nettle, who was checking the clouds. \"The air is thick here,\" Nettle whispered. \"But it’s moving. Fast.\"", "\"And Pip?\" Tuck added. His voice was quiet. \"Whatever anyone says, the sky isn't listening. It’s just there. Don't ask it for permission. Just go.\"", "Pip spread her wings. They felt wide, wider than she had ever felt. She jumped.", "The air caught her. It was cold and sharp. She soared."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["The wind hit her. It was a shove, a slap, a push. It spun her around. Her world became a blur of green fields and grey sails. The mill loomed above, its blades whirling.", "Pip panicked. She tried to fly straight. The wind laughed. It pushed her harder. She was spinning, tumbling, getting dizzy.", "*Spin with it,* Tuck’s voice echoed in her head. *Let it lead you.*", "She stopped fighting. She turned her body with the gust. She let the wind carry her in a wide, tight circle. It was like being on a swing that went too high.", "Then, with a sudden release, the wind flung her out. She shot across the field, clear of the mill, clear of the danger. She whooped, a small, bright sound in the cold air.", "\"One wind!\" she called out.", "Ahead, the pink light of dawn revealed the long, silver line of the Salt Marsh. And above it, something big and dark was circling."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "The Marsh Wind", "part": "PART TWO: RISING WIND", "paras": ["*Sky Report: humid, sinking air, a cold shadow overhead.*", "The Salt Marsh stretched out ahead of them, a vast silver quilt of reeds and water. The air here was different. It did not push or pull. It sat heavy on their backs, thick and wet, smelling of salt and rotting grass. It sucked at their wings, making every beat feel like flapping through syrup.", "Pip felt her chest burn. The wind was low, sliding under their bellies, trying to drag them down into the shining pools. Beside her, Nettle flew tight and low, her big eyes narrowed against the glare. She was not looking at the water. She was looking up.", "\"Nettle,\" Pip wheezed, her voice thin in the damp air. \"Is it...\"", "\"I see it,\" Nettle whispered. Her voice shook, a tiny bird in a storm. She pointed a trembling wing upward. Above the shimmering heat haze, a dark shape circled. It was huge. Its feathers were steel-grey, and its head turned with a slow, terrifying patience.", "\"Skua Grey,\" Nettle breathed. The name hung in the air, cold and sharp."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["Everyone knew Skua Grey. She was not a hunter who rushed. She was a hunter who waited. She owned the middle of the sky, the open, bright, dangerous space where a sparrow’s shadow was as big as a coin and as easy to see.", "Tuck’s rule was simple: fly the edge, not the middle. Stay where the reeds hid you, where the cliff broke your shadow. But the Marsh Wind was a traitor. It did not care about rules. It dragged Pip toward the open center, where the water glinted like a mirror and there was nowhere to hide.", "Her wings ached. The heavy air was crushing her. Every time she tried to bank toward the reed line, the wind shoved her back out. She was tired. Her small body was working too hard, burning through every last bit of strength.", "\"Stay low!\" Nettle hissed, but the wind was louder. It was pulling them both, slowly, inexorably, into the open."], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["Nettle’s legs trembled so hard her feathers ruffled, but her eyes stayed sharp. She scanned the reeds, the sky, and the way the light slid across the mud. There, just beyond the drag of the heavy air, the reeds leaned a fraction to the left. The sun had baked the black mud in a shallow bay until it radiated heat. A thermal, a ladder made of warm air, waited just there.", "\"Here!\" Nettle called out, her voice cutting through the damp silence. \"Left! Three wingbeats!\"", "Pip did not think. She trusted her friend. Banking hard into the rising column of air, she felt the drag of the heavy wind fall away from her feet. She rocketed upward, smooth and strong, hugging the shadow of the reed line. Above, Skua Grey turned her head. Her eye, black and deep, scanned the silver water. She did not see the two brown specks tucked safely in the shade."], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["They landed in the thick reeds at the far edge of the marsh, panting, their feathers ruffled and damp. For a moment, neither of them moved. Then Nettle let out a squeak that was half laugh, half cry.", "\"Two winds,\" Nettle said, shaking water from her wings. \"And you didn’t fall out of the sky once.\"", "\"You saved me,\" Pip said. She looked at her friend, really looked at her, seeing the dust on her chin and the tremor in her legs. \"You saw the thermal.\"", "Nettle blinked. She looked surprised, as if Pip had said something in a language she didn’t speak.", "\"I did,\" Nettle said softly. It was a strange feeling. She had watched the sky her whole life, reading the clouds, reading the light. But no one had ever listened. No one had ever needed what she saw. It went to her head, in the good way, making her chest feel light and warm."], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["They hopped through the wet grass until the land ended. Then they stopped, because there was no more land.", "The Cliffs of Calder rose before them, a great white wall of rock, sheer and vertical. At their feet, the ocean roared, a constant, thundering crash of white foam against grey stone. The air here was alive. It screamed. A fierce, warm wind blew up from the sea, rushing over the cliff tops with a sound like a giant breathing out.", "It was the Cliff Wind. The last wind. The one that could throw a weak bird into the rocks and lift a wise one to the sky. Pip stared at the swirling white mist and the dark, jagged stone. It was the most beautiful thing she had ever seen. It was also the most frightening.", "Her wings tingled. She was ready."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "The Cliff Wind", "part": "PART THREE: STORM WARNING", "paras": ["*Sky Report: strong onshore wind, a rising updraft, salt on the tongue.*", "The Cliffs of Calder were white and a hundred wingbeats tall, with gannets wheeling against the sheer rock while the sea roared below in a constant crash of foam against grey stone. The air here did not blow, it screamed, a fierce warm wind rushing up from the ocean to spiral over the cliff tops with a long, rising whistle.", "Pip stood on the edge of the grass, her toes gripping the earth as her chest tightened with a strange humming electricity rather than fear. She remembered Tuck’s dry, low voice telling her that heavy birds fight the wind and get hurled at the rocks, whereas a small bird can go with it. Looking at the swirling white mist and the dark jagged stone, she saw the most beautiful thing she had ever seen, which was also the most frightening, and her wings tingled with a vibration starting in her shoulders and spreading all the way down to her toes.", "She was ready. She took a breath, deep and shuddering, then leaped."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["The wind hit her like a giant hand and flung her upward. She did not fight it. She did not try to push back or steer with force. She simply let go. Her crooked left tail feather tilted, and she spiraled. The white cliffs blurred past, a streak of bone against the grey sky.", "Up, up, up.", "Higher than the gulls. Higher than the underbellies of the clouds. She was above the top of the world, where the air was thin and cold and tasted of salt and starlight. For a moment, she was nothing but a tiny brown feather riding a giant breath. The fear melted away, leaving only a pure, ringing joy. She was so happy she could not breathe. Her heart beat a frantic, wonderful rhythm against her ribs. She was flying. Not just flapping, not just jumping, but flying. The wind held her, and she held the wind, and the sky was hers."], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["At the very top, where the air felt light and thin, she circled once. The world tilted. Below her, the sea was endless, a vast grey-green expanse that stretched until it touched the horizon. And beyond it, just a smudge of gold in the distance, was the Warm Reaches.", "Pip had never seen it before. She had only heard stories about it, warm winds and soft sand and long, lazy afternoons. Now she could see the place where her flock would fly. It looked peaceful. It looked safe. It looked like home, but further away.", "She shouted to the wind, \"I can see it!\"", "The words were torn away by the gale, but she felt them land. And for a second, she thought she heard an answer. A low, kind rumble in the sky, like a distant drum, or maybe just the wind settling into a new pattern. She did not know if it was real. She did not care. She was part of the sky now."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["She landed on the cliff-top grass, her feathers wild and sticking out in every direction. She was still shaking, a fine, happy tremor running through her body. Then she noticed the silence.", "She turned around.", "Elder Marra stood at the edge of the clearing, her grey-streaked feathers ruffled by the wind. Behind her were the other Elders, and then half the flock. Uncle Dorn was there, too, his plump body looking smaller than usual. They had all come for the sunrise start of the Trial, and they had all seen her ride the Cliff Wind higher than any bird in living memory.", "No one spoke. The wind whispered through the grass. Cinder stood near the back, his glossy chestnut feathers dull in the overcast light. His beak was open, hanging slightly, his eyes wide. He looked like he had seen a ghost, or perhaps something far more dangerous. A bird that had done the impossible.", "Pip tucked her wings. She was still shaking."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["Marra cleared her throat. It took her three tries. The wind snatched the first two sounds away, leaving only a dry click. On the third, her voice boomed, low and heavy.", "\"Pip.\"", "The small brown bird looked up.", "\"That was... against the rules.\" Marra’s eyes were hard, but her voice was not. It was something else. Something complicated. \"It was also the finest flying I have seen in forty seasons.\"", "A long pause stretched out, filled only by the crash of the waves far below. Uncle Dorn’s shoulders dropped, sinking into his plump grey feathers as if he had finally set down a heavy sack of grain. Pip felt a warmth spread through her chest, tighter than the wind.", "Then, out of the corner of her eye, she saw the sky change. To the west, a long, thin cloud was rolling in, dark and bruised, moving hours before it should have."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "The Trial of Three Winds", "part": "PART THREE: STORM WARNING", "paras": ["*Sky Report: falling glass, swirling gusts, sky the color of an old bruise.*", "Marra called the Elders together. They huddled in a low, murmuring knot, wings twitching. The air smelled of salt and ozone. When Marra spoke, her voice cut through the growing wind. \"The season is short. The Trial goes on.\"", "A ripple of excitement spread through the crowd. Then she paused, her grey head tilting toward the small brown sparrow on the branch. \"Pip may enter. On the strength of what we have just seen.\"", "A few fledglings cheered, sharp and quick. Others grumbled, shifting their weight. Cinder looked away, preening a chestnut feather with exaggerated care. Uncle Dorn said nothing. He did not grumble or cheer. He simply moved one step closer to Pip, his plump body blocking a gust that tried to lift her off the branch. He stayed there, solid and warm, like a stone anchor in a rushing stream. Pip leaned into him, just for a second, before straightening her wings."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["Cinder flew first. He was magnificent. He hit the Windmill spiral with a grace that made the air seem to part for him. The Marsh Wind, usually a tricky, twisting lane, was sliced clean and straight by his powerful wings. When he reached the Cliffs, he did not ride the updraft. He fought it. He roared into the rising air, muscles bulging, forcing his way up until he landed exactly on the marker twig, not a feather's width off.", "The hedge erupted. Two hundred sparrows shrieked and cheered, a sound like wind through dry reeds. Cinder preened, his chestnut feathers glossy in the dying light. He glanced down at Pip. There was no mockery in his eyes this time. It was something colder, or perhaps just tired. He looked at her, then at the darkening sky, and turned his back. The respect was there, but it was distant, like a star that had burned out."], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["Pip flew last, when the wind had stopped being a friend and started acting like a grumpy uncle. It twisted and turned, refusing to be read, and spun her in the Windmill lanes until she was dizzy. She had to fight every inch of the line. The Marsh Wind was a maze of gusts, so she trusted Nettle, who stood on the reeds pointing with one wing. Left. Right. Hold. Pip followed the instructions, beating her wings hard against the push.", "Then came the Cliffs. Pip went up, higher and higher, much higher than Cinder had managed. The air turned cold and sharp, tasting like winter. For one bright moment, she saw the whole hedge from above, just a tiny patch of green in a vast white sea. Then a gust ripped her sideways. She tumbled, wings beating against the empty sky, unable to hold her shape. She landed far from the marker, on a jagged rock. She was not clean. She was not first. She was last."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["The silence after Pip landed was heavy. It was not the silence of awe, but of exhaustion. Pip’s legs trembled. Her chest heaved, each breath a small, painful effort. She did not look at the scores. She did not look at the Elders. She had done it. She had flown the course, on the day, in front of everyone. That was enough. That had to be enough.", "Uncle Dorn landed beside her. He did not say \"small birds stay low.\" He did not say \"I told you so.\" He simply pressed his feathers against hers. It was a small, warm, solid touch. It was the first time he had touched her without a warning attached. Pip closed her eyes and leaned into the warmth, the wind still howling around them, but the small space between them was quiet."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["Marra’s voice boomed, but it sounded thin in the rising wind. \"The new Storm-Sparrows are Cinder, and two others.\" The names were called. Not Pip. The words hit her like a stone, cold and hard. Marra added, \"Pip has shown remarkable skill. The Elders will consider her again in a season or two.\"", "Pip felt the sting of it, but it was distant. She was too tired to be angry. Too tired to be sad. From a rooftop far above, Old Tuck’s dry, raspy voice drifted down. \"Ah, well. They will be needing you sooner than they think.\"", "Pip looked up. Behind Tuck, the western sky had turned the color of iron. The bruise was spreading, dark and deep, swallowing the last of the light. The air smelled of rain that had not yet fallen."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "The Storm Comes Early", "part": "PART THREE: STORM WARNING", "paras": ["*Sky Report: violent gale from the southwest, torrential rain, all birds to shelter.*", "The storm did not wait for the migration schedule. At noon, the air turned thick. It tasted of salt and wet stone. The wind flattened Thistlewick Hedge until the branches bowed low, pressing the leaves into a single, rustling wave.", "\"Move!\" Marra’s voice boomed, but the gale tore the edges off her words. She stood on the Gathering Rock, her torn wing tip beating wildly against the gusts. \"We leave now. If we stay, the storm will break the hedge and scatter us like chaff. The Storm-Sparrows lead. Now.\"", "Cinder puffed out his glossy chestnut feathers, trying to look larger than the wind. He beat his wings in a tight, angry circle. It looked like he was wrestling a balloon. The other fledglings huddled close. Their eyes were wide and bright with fear.", "Pip stood at the edge of the rock. Her chest felt tight. She looked at the darkening sky, then at Cinder. She did not wait for permission. She turned her tiny body toward the south. She pushed off the rock. Straight into the teeth of the gale."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["The flock rose as one ragged cloud of wings. A thousand sparrows tumbled into the tearing sky, a swirling mess of brown and grey against the bruised horizon. Pip flew low, tucked tight between Uncle Dorn and Nettle. The air was cold. It smelled of wet stone and coming rain.", "Old Tuck waited in the hollow of the Lightning Oak. He was too old for the crossing, his feathers thin as old paper. He watched them go, his single eye bright in the dim light.", "\"Ride it, don't fight it,\" he called out, his voice dry and raspy. He nudged Pip gently with his beak, sending her higher into the updraft. \"Small birds go where they like.\"", "Pip wanted to say goodbye. She wanted to tell him she was scared. But the wind was too loud, and the storm was too close. She looked back once. Only the dark shape of the oak. Then she turned her face south, into the roar."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["Over the Grey Sea, the storm hit.", "Lightning split the sky in jagged white lines, turning the dark into a flash of static electricity. The wind became a solid wall, pushing against every wing with the force of a thousand angry thumbs, and the formation broke.", "Cinder led. He tried to fly straight through the worst of the gale, but the air was heavier than he was. He was hurled back, his wings beating against an invisible force that refused to move. His shouts for direction died in his throat, torn away by the roar before they could travel a single wingbeat.", "Birds vanished into the spray.", "Pip lost Nettle in a swirl of rain, and then Uncle Dorn in a gust that knocked her sideways. One moment they were there, a brown blur of safety, and the next, the sky was empty.", "She was alone.", "The dark roared around her, battering her tiny body like a loose leaf in a dryer. The water stung her eyes, tasting of salt and iron, while a cold weight settled in her chest. She beat her wings, counting to keep her mind from spiraling. One. Two. Three. The wind did not care about her counting, but Pip kept going."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["She spun, buffeted, blinded by the rain. The old fear closed over her: too small, too light, blown away like a seed. She tried to beat her wings harder, fighting the wind, but it was no use. She was just a speck against the giant.", "Then she noticed something odd. In the middle of the chaos, there were lanes. Ribbons of air that flowed more smoothly than the rest, threading between the storm’s biggest gusts. They were narrow, invisible to the eye, but they pushed against her light feathers with a gentle, steady strength.", "Big birds could not feel them. They were too heavy, too strong, fighting the storm instead of listening to it. But Pip was light. She let go of the fight. She stopped beating her wings and simply slid, letting her body follow the smooth, quiet ribbon of air that cut through the roaring dark."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["She rode the lane, swept along at a speed that made her dizzy. The air felt less like a wall and more like a smooth, curved river of wind, the kind that made her tummy flip. She was terrified, and yet, in a strange way, she felt tender. The wind was not an enemy. It was a current, a river, a friend who had been waiting for her to stop fighting.", "Tiny voices called from far away in the murk. Someone was crying, somewhere below, a thin, high sound lost in the roar. It sounded like Nettle, though it could have been anyone. Pip heard it. She tilted her head, her crooked tail feather acting as a rudder, adjusting her course. She checked her footing on the invisible ribbon of air, making sure she didn't slip into the chaotic gusts on either side.", "For the first time in her life, she did not fly away from the storm. She flew toward it. She dipped her wings into the smooth lane, aiming for the crying voice, ready to meet the danger head on. The rain blurred her vision, but the sound pulled her forward like a strong thread. She was not big, and she was not strong, but she was there, and that was enough to keep the sky from swallowing them all."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "Alone Over the Water", "part": "PART THREE: STORM WARNING", "paras": ["*Sky Report: gale, thunder, rain horizontal, visibility nil.*", "The voice was thin, a thread of sound almost swallowed by the roar. Pip banked hard, her tiny body dipping into the wet air. Below her, the sea churned in dark, angry heaps. And there, bobbing in the gray foam, was a piece of driftwood. On it clung three fledglings, soaked and shivering, their wings pinned flat against their backs. They were too tired to fly. The spray hit Pip’s face, stinging like cold needles. She hovered, her chest tight and quick.", "\"Up!\" she called, her voice cracking. \"Up! Follow me!\"", "They looked at her. One of them blinked, water dripping from its beak. They could not move. Their wings were heavy, useless things, dragged down by the rain. Pip’s throat closed. She was just a walnut. They were too heavy for her to carry. She needed to think. She scanned the air above them, looking for the smooth lane she had been riding. There. A ribbon of calmer air, curving gently over the chaotic waves like a hidden path. She had to get them there."], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["Pip did not try to lift them. She was too small. Instead, she dove toward the wood. The wind snarled around her. She nudged the first fledgling, a large, muddy brown bird, with her beak. He stumbled. She flapped beside him, her wings beating a frantic rhythm.", "\"Ride it! Don't fight it!\" she shouted, her voice barely audible over the gale.", "She pointed her wing toward the smooth lane above. The fledgling blinked. He stretched his soaked wings, catching the updraft. For a second, he hung there, then the wind lifted him. He rose, wobbling, into the clearer air. Pip stayed low, watching him go. She could not rest. There were two more. She turned back to the driftwood, her legs trembling from the effort. The rain blurred her vision, but she kept her eyes on the lane, on the path to safety."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["The second one was easier, but only barely. He caught the air and drifted up, joining the first in a shivering pair above. Then came the third. She was tiny, with a yellow bill that looked too big for her face. Her name was Fern, though Pip did not know that yet. Fern was frozen. Her wings were glued to her sides, and her eyes were wide with terror.", "\"Come on, Fern,\" Pip said, her voice soft and steady. \"One hundred. Just one hundred wingbeats.\"", "Pip began to flap, counting under her breath. She did the work for them, showing them the rhythm. *One, two, three.* Fern watched her. Slowly, shakily, Fern lifted one wing. Then the other. Pip kept counting, her voice a steady drumbeat in the chaos. *Ninety-eight, ninety-nine, one hundred.* Fern burst into the air, trailing behind the other two, a small, fragile ribbon of life in the gray storm."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["They flew in a ragged line, Pip at the front, leading them through the storm. The air was cold and wet, and Pip’s feathers were plastered to her body. But she was not small anymore. She was the bird who knew the lane. She felt the wind like a second skin, adjusting her course with the tip of her crooked tail.", "Ahead, another shape appeared. An old sparrow, gray and streaked, with a broken wing feather dragging behind him. Beside him, a young bird, silent and still. Pip’s voice was hoarse now, a rasp in her throat. She did not stop. She did not slow down. She simply kept flying, a steady, sure anchor in the howling wind. The old sparrow caught the updraft. The young one followed. Soon, the line grew. Seven, eight, nine birds, holding to her shadow as if she were a lantern in the dark."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["Then Pip saw it. A shape hung in the storm ahead, huge and grey and silent. It did not fight the wind; it leaned on it, easy as a kid leaning against a school gate. The steel-grey wings cut through the rain with terrible ease, spreading wide like a heavy, soggy umbrella in a downpour. The bird turned its head. A yellow eye, cold and bright, found the line of small birds trailing behind Pip.", "Pip’s heart stopped, then started again, twice as fast. The hawk was hunting. She was in the middle of the sky, where a hawk waits. She was alone over the water, with nine small birds behind her, and the storm around them, and the shadow of death ahead. She did not turn back. She could not. She had to find a way."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "Skua Grey", "part": "PART THREE: STORM WARNING", "paras": ["*Sky Report: gale easing to squalls, rain in sheets, a cold predator overhead.*", "Skua Grey drifted above the ragged line of sparrows, a shadow that did not move with the wind. It hovered, patient and cold, its yellow eye tracking the smallest birds in the group. The rain hammered against Pip’s feathers, blurring her vision, but she could feel the hawk’s presence like a heavy weight pressing down on her wings. She counted the birds behind her. Nine. Nine fragile lives hanging in the grey air, and one predator who could take any one of them in a single, silent strike.", "Pip’s chest thumped against her ribs, a frantic drumbeat in her body. She looked back, then forward. The sky was a churning mess of grey and white. She could not outfly the hawk. She was too small, too tired, too light to match its power. She could not fight it. Her beak was a pebble against steel. What was left? The wind was the only thing that was bigger than the hawk, and the only thing that did not care who was winning.", "She tilted her head, listening to the roar. The air was not empty; it was full of currents, of invisible rivers pushing and pulling. The hawk waited for them to break, for one bird to falter, for the line to thin. Pip felt the exhaustion pulling at her legs, the cold soaking through her down. She did not turn back. There was nowhere to go but forward, and forward meant finding a way to make the sky fight back."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["Pip thought of Old Tuck, sitting in his hollow, his one eye twinkling. *What do small birds have that big birds don't?* She remembered the Marsh Wind, how the reeds had tangled the air, how the shadows had been safe. Skua Grey was huge. Huge things needed clear air to dive. They needed space to fold their wings and gain speed. But here, in the storm’s belly, the air was not clear. It was chopped and torn, a mess of gusts and lulls.", "Pip’s crooked tail feather twitched. She had a rudder, and she had a plan. She did not try to fly higher. She did not try to fly faster. She dove. She led the line of sparrows down, down, into the roughest, narrowest, ugliest air she could find. The wind here was violent, snapping at their feathers, pushing them sideways. It was terrifying. It was perfect. The hawk, high above, could not follow. Not yet. Not into this chaos.", "Pip banked sharply, her tiny body turning on a dime. The birds behind her scrambled to follow, their wings flapping wildly to stay in formation. She saw the hawk’s shadow shift, trying to adjust, trying to find a clear lane. But there were no clear lanes. There was only the storm, and the small birds who knew how to ride it."], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["The gusts hurled them together and apart, spray blinding them with salt and sleet. It was a maelstrom of wind and water, a world without up or down. Pip called out, her voice thin but sharp against the roar. \"Left! Down! Now, up!\" The commands were not just words; they were instructions for survival. The sparrows followed her, a ribbon of brown and grey moving through the chaos.", "Then, the hawk dove. It was a beautiful, terrible thing, a streak of steel cutting through the rain. But the wind was not on its side. A sudden, violent gust slapped the hawk aside, turning it in mid-air. It skidded, its wings beating frantically, snapping at the spray that stung its eyes. It let out a screech, high and angry, a sound that had no place in the quiet sky.", "Pip did not look back. She felt the hawk’s frustration, the way it struggled against the very air that was carrying her. She tilted her body, catching a thermal that lifted them all. \"Now, up!\" she called. The line rose, smooth and steady, while the hawk below them fought a losing battle against the storm."], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["A shape emerged from a cloud, wings ragged-edged and feathers plastered flat against his body. It was Cinder. The proudest bird in Thistlewick Hedge was lost, his chestnut plumage ruined by the water, his eyes wide with a fear he had never shown. He had been flying straight into the storm’s face, as a Storm-Sparrow should, but he was finished. He was sinking, his wings too tired to beat against the gale.", "Skua Grey saw him. The hawk’s head snapped toward the struggling sparrow, its yellow eye locking on. It folded its wings, preparing for the final, silent strike. The predator was patient, and it was hungry, and it was right there.", "Pip did not think. She did not weigh the risk. She turned and dove after the hawk, her tiny body a blur against the grey. She shouted, the thing Tuck had taught her, the only thing that mattered now, at the top of her voice. \"Cinder! Stop fighting! Ride it!\" The words cut through the storm, sharp and clear, a command to let go."], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["Cinder heard. For one heartbeat, the proudest bird in the hedge let go. He stopped fighting the wind. He went limp, his wings spread wide, his body loose. The gust caught him, and the wind carried him sideways, out from under the hawk’s stoop, and dropped him beside Pip. It was a miracle of timing, a sliver of safety in a world of danger.", "Skua Grey’s talons closed on nothing. The air rushed through the space where a sparrow had been a second before. The hawk swerved, its momentum carrying it away from the small birds. It let out a long, cold cry, a sound of frustration and defeat, and then it was gone, a shadow dissolving into the storm.", "Cinder gasped, his chest heaving. He stared at Pip, his eyes wide, his beak slightly open. \"Tweet-truth?\" he whispered. It was the first time it was not a jeer. It was a question, small and fragile, floating in the rain. Pip looked at him, then at the sky, where the wind was finally, softly, pushing them forward."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "The Lantern Isles Wind", "part": "PART FOUR: CLEARING SKIES", "paras": ["*Sky Report: storm easing, cloud breaking in the east, a very tired bird.*", "The rain struck them sideways, turning Pip’s wings into heavy, waterlogged sails. Behind her, a line of twelve sparrows trailed, their feathers plastered flat and their legs dangling from exhaustion. Cinder flew beside her, his glossy chestnut plumage dulled to a muddy brown. He looked small, and tired, and nothing like the star of the hedge.", "Below, the Grey Sea churned into an endless expanse of slate and foam. There was no shore, no branch, and no reed. Just water, hungry and cold. Pip’s legs trembled as every wingbeat fought against the thick, wet air. She wanted to close her eyes and sleep, but the line behind her held steady, trusting her to find the way.", "\"Nettle,\" Pip whispered, her voice thin in the howl of the wind. \"Where are you?\"", "The wind answered with a shriek. The clouds above formed a solid grey ceiling, pressing down. Pip tilted her head, feeling the draft against her cheek. Somewhere, in that vast, cold dark, her best friend was alive. She had to be."], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["A voice cut through the rain. Not from the side, but from above.", "\"Pip!\"", "Pip looked up. Through a gap in the low clouds, a skinny, freckled sparrow was clinging to a thin lane of updraft. Beside her, plump and grey, was Uncle Dorn. His feathers were ruffled and wild. He looked like he had been through a blender. But he was there. He was alive.", "They dropped down to join the line. Uncle Dorn flew close to Pip. He did not say \"I told you so.\" He did not say \"Small birds stay low.\" He pressed his beak gently against the top of her head. He held it there for one long, trembling moment. Then he pulled back and flew on, his eyes bright and wild.", "Pip’s chest ached. It was a good ache. It was the kind that means you are not alone. She looked at Nettle. Nettle’s eyes were huge, but her feet were gripping the air with a strength that surprised everyone."], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["Nettle pointed upward, her big feet trembling against the gale, but her gaze was sharp as a pin. \"I have been reading them,\" she said, and her voice was clear enough that nobody had to lean in to hear her. \"The storm is thinning to the east. There is a rift. A golden line.\"", "She pointed to a break in the cloud bank where the light was turning from grey to pale gold. A warm wind rose from somewhere below, out of sight, carrying the smell of dry grass and old stone.", "\"The Lantern Isles,\" Nettle said. \"Twelve hundred wingbeats away. If we ride the rift, we will reach it. The wind is pushing us, not fighting us.\"", "Everyone listened. The line of sparrows hung in the air, suspended, while the wind shifted to catch their feathers. It was a promise. It was a path. And for the first time since the storm began, they were
