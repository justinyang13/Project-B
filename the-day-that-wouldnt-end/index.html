. She headed for the front hall, where the last empty hook waited.", "I stopped her.", "\"Nonna,\" I said.", "She turned around. I looked at her. I did not ask if she was tired. I did not ask about the drive. I asked the only question that mattered.", "\"What was your worst day?\"", "She stopped walking. She took off her sunglasses. For the first time in the whole book, I saw her eyes. They were brown, and they were old, and they were kind.", "\"I am listening, caro,\" she said.", "\"I have been having a truly awful time,\" I said. \"And I don't know how to make it stop.\""], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["She set the basket down. She did not hang the clock. She sat on it, the way you sit on a suitcase when you are tired of carrying it.", "\"When I was eleven,\" she said, \"I was moving from Naples to Ohio. I was furious. At the plane. At the cold. At my mother. I was standing in an airport. It was bare. There were no plants. There was no sun. Just concrete and bad coffee.\"", "She picked up her hands and counted on her fingers.", "\"Then a man in a raincoat walked up to me. He had a peach. He cut it in half. He handed me one. It was the best peach I ever tasted. Juicy. Sweet. It tasted like summer.\"", "She leaned forward.", "\"I sat on my suitcase. I ate the peach. And I thought, this day is going to be terrible either way. I got to choose whether I was terrible in it.\""], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["\"That's it?\" I said. \"That's the wisdom? A peach?\"", "She laughed, a loud, barking sound that seemed to shake the whole front hall, and her gold bangles jingled wildly against her wrist. \"It is not the peach, caro. It is that I decided before the peach came. You think I was happy when I got the peach? No. I was happy because I ate the peach on purpose.\"", "She stood up, brushing imaginary lint from her skirt, and reached out to pat my cheek. Her hand was warm, dry, and smelled faintly of perfume and old paper. \"Happiness isn't what you get at the end of a day. It is what you bring to the front of it.\"", "Then she hung the clock on the last hook in the hall. It ticked. It did not speak. It just ticked, steady and indifferent, like a metronome counting off a beat that no one was dancing to. I looked at the bird, and the bird looked at me with its painted, angry eyebrows. It did not care about my problems or my moving truck or my 1,700 miles of cactus. That total lack of concern was, I decided, the best part of the whole thing."], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["I sat on the floor under the clock and stared at Gerald.", "I had lived seventy-two Saturdays. I had been asking the wrong question of the clock. I had been asking, *How do I make this stop?* But the question was never about stopping. The question was about being.", "How do I want to be in it?", "I realized I had been waiting for the day to be perfect so I could be happy. But the day was never going to be perfect. It was always going to be messy, and loud, and ending.", "I could choose to be angry in it. Or I could choose to be glad.", "I looked at my hands. They were still.", "That night, at 11:59, I did not make a wish. I went to bed. And at 6:47..."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "The Burnt Toast Experiment", "part": "PART FOUR: THE CHOOSING", "paras": ["6:47 a.m. Saturday. The roar hit me before my eyes were open.", "\"RAAAAWR,\" said Gus, his face a green blur of spikes and fury.", "I did not wait for him to finish. I looked at the ceiling, where a pale rectangle marked where my poster used to be, and I said, \"I choose it.\"", "The word felt heavy in my mouth. Like a rock I had just picked up from the sidewalk.", "\"On purpose,\" I added. \"Before anything happens.\"", "I felt stupid. I felt like an eleven-year-old trying to do algebra. But I said it again, quieter this time. \"I choose it.\"", "Then I looked down at Gus. He was vibrating with energy, ready to start the day’s chaos. I took a breath. I filled my lungs with the stale, box-dust air of my room. And I let it out.", "\"RAAAAWWWRRR!\"", "I did it at maximum volume. I put my whole chest into it. It was ugly. It was loud. It was the most honest thing I had done in seventy-two Saturdays.", "Gus froze. His mouth stopped moving. A smile, tiny and white, cracked across his face inside the hood. He slid off my chest and landed on the floor with a thud, giggling.", "I lay there, panting, staring at the ceiling. I had chosen this. And it was not so bad."], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["7:13 a.m. Waffles trotted past my door with my left slipper hanging out of his mouth like a cigar.", "In seventy-two Saturdays, I had chased him. In seventy-two Saturdays, I had snatched it back. Today, I just watched him go.", "He disappeared under the dining room table, and I could hear the soft, rhythmic crunch of him chewing. I crawled after him, a move I had never attempted before. Underneath was a cave, dark and cool, smelling like old carpet and warm dog breath.", "I found the usual suspects: one lost sock, one red Lego brick, and the fossilized french fry that had been there since the Clinton administration. Waffles lay in the middle of them, looking pleased with himself.", "I didn't grab the slipper. Instead, I reached behind me and pulled off my right one. I held it out into the shadows.", "Waffles looked at the slipper. Then he looked at me. He gave a low, rumbling bark, which I decided was a yes. I slid the second slipper under the table to him.", "He nudged it closer to his paws. We lay there, me in my boxers and him with two slippers. Dust motes danced in the thin beam of light from the hallway. It was quiet. It was peaceful. For the first time, I was not waiting for the day to start. I was just being in it.", "Waffles rested his white front paw on my ankle. I did not move."], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["7:22 a.m. The smoke alarm screamed, and Dad was already on his chair, fanning the air with a dish towel.", "\"Max! Good morning! Did you know I'm reading a book about anti-gravity?\"", "I walked over to the toaster. The toast was black, the exact color of a tire. In previous Saturdays, I would have groaned. Today, I took a slice and scraped the charcoal off into the sink. It made a gritty sound, like sand in my teeth.", "I spread thick, sweet peanut butter on it and took a bite.", "It was crisp and salty and the best thing I had ever tasted. I ate the whole slice standing right there in the kitchen.", "Dad watched me. His mustache twitched. \"It's impossible to put down!\"", "I looked at him. I really looked at him. His eyes were bright, and he was waiting.", "I laughed until my ribs hurt. It was a real laugh, the kind that comes from your belly, not your throat.", "Dad’s face lit up. He looked like he had won the lottery. He got down off the chair and gave me a hug that smelled like smoke and breakfast. I hugged back. I felt something loose in my chest, a knot that had been there for weeks, finally give way."], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["At 8:05, Mrs. Abernathy stood at the door, balancing a casserole dish that looked too heavy for her hands.", "\"It's a hot dish,\" she said, her voice thin and polite. \"So be careful. You'll want a trivet.\"", "In seventy-two Saturdays, I had ignored her. Today, I stepped into her space. \"Thank you, Mrs. Abernathy. Can I ask you something?\"", "She blinked, her eyes kind but tired. \"Yes, caro.\"", "\"Why do you bring one every Saturday?\"", "She didn't answer right away. Instead, she looked at the casserole, then at the house, then at the boxes stacked in the hallway.", "\"When you lose someone,\" she said softly, \"you still cook. Your hands know what to do. I cook for the street because it is how I say I care.\"", "She stepped back, but I moved forward instead. I wrapped my arms around her, feeling her small and solid frame against my chest. She smelled of tomato leaves and lavender, like a garden that had been left alone for a week. I held on tight, and she held on back.", "\"I am glad you are here,\" I whispered.", "She patted my head. \"I am glad you are eating.\""], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["By noon, I had to admit the truth to myself.", "The day hadn't changed, and the toast was still charcoal, and the box had still hit the floor, so nothing outside had moved which meant I was the only variable left in the equation.", "I went to my room where the walls were bare, but on the inside of my closet door my tally marks waited, seventy-two loops of survival scratched in pencil.", "I took out my pencil and didn't add a new mark, but I wrote one line, small and neat, just below the scratches.", "THE DAY IS THE SAME. I DON'T HAVE TO BE.", "I stared at it, and it felt true, like a backpack that had finally dropped a heavy dictionary.", "Then I heard the slam.", "A crash followed, the garage door banging against the frame hard enough to rattle the window glass in its track, and Tessa was in there tapping her drumsticks on the metal in a sharp, angry rhythm that sounded like a countdown.", "My knees went weak because I had chosen happiness, and I had chosen peace, and now the day was reminding me that I was still eleven and still moving to a place that was mostly cactus.", "I walked toward the garage, not to fix it, but just to be there."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "Sad and Happy at the Same Time", "part": "PART FOUR: THE CHOOSING", "paras": ["Saturday seventy-four, 10:30 a.m. The garage door slammed shut, and the sharp, angry rhythm of drumsticks started beating against the metal.", "On the first Saturday, I would have run to the front door. I would have shouted, then I would have lost. But this time, I walked straight to the garage. I didn't knock. I just leaned against the doorframe with my arms crossed and waited for the tapping to stop. It didn't.", "\"Max,\" Tessa said without looking up. Her back was to me, and her sticks were tapping a furious beat on the side of the washing machine. \"This is my practice pad. And my posters. And my band.\"", "\"You're right,\" I said. \"It is.\"", "She spun around. Her purple streak was wild, and her eyes were wet. \"What are you doing here? Do you want to fight? Because I have sticks and you have a hoodie.\"", "\"I'm sorry about your band,\" I said.", "The tapping stopped. The silence was loud.", "\"I don't know what you're talking about,\" she said, but her voice shook.", "\"The Kettle Drums,\" I said. \"You're scared you're going to lose them. I'm sad about it too. I'm not going to play for the Dunmore Rockets again, either.\"", "I didn't wait for her to react. I sat down on the concrete floor, back against the wall. She stared at me for a long time, then sat down next to me, leaving a very precise foot of space between us.", "We didn't speak for five minutes.", "\"You're weird today,\" she finally said.", "\"Thanks,\" I said."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["Saturday seventy-five, 11:00 a.m.", "I sat on the kitchen steps eating a cracker when I spotted the helmet through the window. It was blue with a scratch on the visor. Jonah stood on the porch, waving his hand.", "I looked down at the cracker. I looked up at the helmet.", "Something in my chest felt like it was trying to escape through my ears. I wasn't sad because the day was bad. I was sad because it was good. Jonah was here. He was real. He was probably going to be in Tucson with me, or maybe he wasn't, and either way, saying goodbye to this porch was going to hurt.", "My eyes burned. I refused to blink. I chewed the cracker until it turned to dust.", "I stood up, wiped my face with my sleeve, and walked to the door.", "On the first Saturday, I had ignored the bell. I had hidden on the roof. I had let him call my name until it sounded like a stranger's.", "I opened the door.", "\"Hey,\" I said.", "Jonah grinned, his whole face lighting up. \"I have a plan.\"", "\"I know,\" I said. \"I'm coming.\"", "He blinked. Then he grinned wider.", "Sadness and joy, I thought. They weren't fighting. They were riding in the same car."], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["Saturday seventy-six.", "I decided to test a new rule: pick one good thing per hour and say it out loud. At 9:15, the box marked FRAGILE dropped. Mom dove for it, sliding sideways across the tile like a hockey puck on ice. She caught it with one hand and landed hard on her hip, looking stunned.", "\"Nice dive, Mom,\" I said.", "She blinked, surprised. \"Thanks, Max.\"", "At 12:30, we ate peanut butter sandwiches on paper towels because the table was a box. The paper was crisp, which made the sandwich taste better, like biting into a cracker instead of a sad slice of bread.", "\"This is actually good,\" I said.", "Dad looked up from his own sandwich, his mustache twitching. \"Really?\"", "\"Yeah. It's like a taco, but with bread.\"", "Dad laughed, a full, round sound that bounced off the bare walls.", "At 2:00, Jonah was waiting on the porch. I was wearing my big grey sneakers, the ones with the double knots.", "\"Shoes you can get wet,\" I said.", "\"Correct,\" Jonah said.", "I put them on. They were tight, squeezing my toes, but I was ready. I picked the wet shoes."], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["Saturday seventy-seven.", "I let the day be bad.", "It started raining at four o'clock, which is wrong because Saturdays in Dunmore are usually bright and loud. The rain fell thick and gray, drenching Mr. Grady's sprinkler as it sprayed blindly into the storm. The mailman stood under the awning, dripping like a drowned squirrel, and he was laughing. Not smiling. Laughing.", "I climbed to the roof. I sat on the wet shingles, my red hoodie dark with water, and watched the gutters overflow. The cold seeped into my bones, making me feel as heavy as the wet leaves piling up in the yard. I stayed there for an hour, just watching the water run.", "Then I went inside, soaked and shivering. Dad was making pizza. The smell of pepperoni hit me, thick and warm, cutting through the damp air of the house.", "\"I'm sad,\" I said to the air, to Dad, to the dough. \"And I'm going to have pizza anyway.\"", "He handed me a slice without saying a word.", "I ate it on the floor. It didn't taste like sadness. It tasted like dinner."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["I went to my room and found the closet door standing open, revealing the inside panel where my history lived.", "Seventy-seven pencil scratches. I had made them myself, one by one, over what felt like a lifetime.", "I stared at the jagged lines for a long time. For seventy-six Saturdays, I had been convinced that choosing to be happy was just a fancy word for pretending I wasn't sad. I thought I had to pick a side, like a binary code, happy or sad, one or the other, and that mixing them would make me crazy.", "I was wrong.", "Everyone in my house had been doing that for weeks, too. Dad was pretending the toast wasn't burnt. Mom was pretending the checklist was enough. Tessa was pretending she wasn't scared of the new school. I was pretending I didn't care. But pretending is a heavy coat to wear all day. It doesn't mean you don't feel the bad thing; it means you decide what's going to drive.", "I looked at the door, then down the hallway where the clock stood silent. I picked up my pencil. I didn't add a mark. I just held it. I was ready to try the hardest apology of my life."], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "Sorry, to Someone Who Won't Remember", "part": "PART FOUR: THE CHOOSING", "paras": ["Seventy-nine. I found Gus in the garage, curled up under a pile of moving blankets that looked like a green marshmallow left out in the rain. I sat down next to him, and for once I didn't roar or make a joke; I just looked at his spiky tail, which was tangled in the fabric.", "\"I'm sorry,\" I said. My voice sounded rusty, like a gate that hadn't been opened in weeks. \"I told you it was just a costume. It's not. It's the bravest thing I know.\"", "Gus lifted his head. His eyes were huge behind the plastic eyes of the T. rex hood. He didn't say anything. Instead, he reached into the pile and pulled out the spare tail he had been hiding. He held it out to me with both hands.", "I took it. It was stiff and plastic and smelled like old carpet. I tucked it inside my red hoodie, against my back. It felt heavy, and it felt right. For the rest of the loops, I wore it. Not because it fixed anything. But because I needed to carry the thing that made him feel safe, even if he forgot he had given it to me."], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["Eighty-two. Dusk. The yard grass was dead brown, brittle enough to snap if you stepped on it wrong. Dad sat on the curb with his knees pulled up to his chest. He looked smaller than usual, missing the bulk of the man who fanned smoke alarms, and instead had the posture of someone staring at a math worksheet they couldn't solve.", "I sat down next to him. The concrete was cold through my jeans, a sharp, uncomfortable chill that made my toes curl.", "\"Are you scared?\" I asked. I didn't ask about the job or Tucson. I just wanted to know if he was afraid.", "He looked at me. His mustache twitched. He didn't make a pun, which was new. \"Yeah,\" he said. \"I think I am. I think it's too big for me.\"", "I nodded and looked at the dead grass. \"Your puns are the best part of the day,\" I said.", "He stared at me. His face tightened, the muscles around his eyes pulling in until they looked like crumpled paper. \"Even the toast one?\"", "\"Especially the toast one.\"", "He didn't say anything for a long time. Then he moved his arm around my shoulders and pulled me in. He hugged like a bear, which is what he was, but softer this time. I let him hold me. I didn't pull away."], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["Eighty-four. Mom stood in the kitchen, perched on the edge of her stool with the clipboard clutched against her chest like a shield. Her thumb hovered over the last line on page six, the one she called the worries page.", "\"Read them,\" I said. I didn't raise my voice. I just wanted to hear what was heavy.", "She froze, her pencil suspended in mid-air. Her eyes were wet, but she didn't wipe them. Instead, she turned the board toward me, her hand trembling slightly.", "\"The doctor,\" she read, her voice thin as a paper cut. \"The friends. And the 'Will I be okay?' question.\"", "I listened. I didn't interrupt. The silence settled between us, thick and quiet, like the air in a library right before the librarian snaps her fingers.", "\"I'll help you carry three,\" I offered.", "She blinked, looking confused. \"Which three?\"", "\"The doctor. The friends. The 'Will I be okay?' one.\"", "A sound escaped her, half-laugh, half-sob, tangled up tight. She pressed her forehead against the paper, hiding her face, while her shoulders shook. I didn't reach out to hug her. I just stood there, holding the space open, letting her cry into the checklist."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["Eighty-eight. Tessa was on her bed, drumsticks tapping a rhythm on the mattress. She heard me come in, but she didn't stop.", "\"I said something awful,\" I said, stopping right at the door because my legs wouldn't go any further. \"And you don't remember it, but I do.\"", "The tapping stopped. The sticks went still in her hands. \"I don't remember it,\" she said, her voice flat.", "\"I know.\"", "The ticking of the clock in the hall seemed very loud, like a second hand dragging itself across a face full of dust.", "\"Then you're weirdly good at apologizing for things that haven't happened yet,\" she said. Her eyes searched my face, looking for a lie.", "\"It happened.\"", "She looked at me for a long time, and I felt like I was standing in the middle of a spotlight that only she could see. Then she reached out her hand and hooked her pinky around mine, a habit from when we were little, before we got too old for it.", "\"Okay,\" she said. \"Thanks for telling me.\""], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["It didn't matter that they would forget. That was the thing I finally understood. The words didn't stick to them, but they stuck to me. I had said them. I meant them. And that was enough.", "I went to my room and opened the closet door. The pencil was already in my hand, ready to work. I looked at the eighty-eight scratches on the wood. They were just lines, but they were my lines, a tally of every single time I had been the worst version of myself. I picked up the pencil, but I didn't add another scratch. Instead, I wrote a sentence. I made the letters big and blocky, like the ones we had to write for the spelling bee in third grade.", "SORRY COUNTS EVEN IF NOBODY KEEPS IT.", "I looked at the words until they felt solid and real, like a brick in a wall I was building for myself. I closed the closet door and walked to the hallway. The clock was silent. Gerald was still. I took a deep breath, feeling the air fill my lungs. There was one goodbye I hadn't done properly. The one with a bike helmet."], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "Jonah's Last Day Extravaganza", "part": "PART FOUR: THE CHOOSING", "paras": ["I was at Jonah’s door at 1:55, wearing the sneakers with the double-knot, which were the only ones in the house that looked like they had a job to do. The door opened before I knocked. Jonah stood there in his helmet, holding his laminated itinerary with both hands, staring at me with the intensity of a kid waiting for test results. Then he looked at my shoes. Then back at my face.", "\"You came,\" he said. His voice was quiet, stripped of its usual bounce, sounding like he was checking if the water was hot before stepping in.", "\"I'm here for all of it,\" I said. \"Even the part about the raft.\"", "Jonah blinked and looked down at the plastic sheet in his hands. He read the first line. \"Creek. Raft. Potential for dignity loss.\" He looked up. \"I have never been so confident in a plan that ends in potential.\"", "\"I don't care about the plan,\" I said. \"I care about the creek.\"", "He stepped aside. The hallway smelled like bicycle grease and old juice boxes. I walked in, ignoring the clock on the wall because it wasn't his clock, and I had learned not to trust clocks that didn't belong to grandmothers."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["The raft was a piece of cardboard wrapped in trash bags. It floated for four seconds in eight inches of water. Then it folded. We were in the creek up to our knees, cold and shivering, but we were laughing so hard my ribs hurt. It was the kind of laugh that comes out of your belly and leaves without asking permission.", "Jonah lifted his helmet. Creek water poured out of it in a steady stream. He tipped his head back and let it run down his face, a royal ceremony of wetness. He looked at me, dripping, and smiled.", "\"You're my best friend,\" I said. I didn't wait for a reason. I didn't check the schedule. I just said it.", "Jonah wiped his face with his sleeve. He pointed at me with his wet finger. \"I know,\" he said. \"It's on the laminate.\"", "I tried to argue, but the water was too cold and the joke was too perfect. I just pointed back at him. The creek flowed around our legs, carrying off a single red Lego brick I had dropped. It was gone. I didn't mind."], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["Putt-Putt Palace was empty when we arrived. The sky turned the color of a bruised plum in about ten minutes. The first drop hit my nose. Then the sky opened up. The plastic windmill on the last hole spun wildly, a grey fan in a storm.", "We did not leave. We stood in the rain, holding our plastic clubs, watching the storm. I put the ball on the tee. I hit it. It went three feet. Then I took another swing, just to see what would happen. The ball flew, wild and high, and sank into the hole on the other side of the green.", "A hole-in-one. In a thunderstorm. On a Saturday that had never once rained.", "We screamed. We screamed until our voices were hoarse and the rain was soaking through our shirts. Nobody else was there to hear it. The course was just us and the wind and the spinning plastic. I didn't care about the score. I didn't care about the rain. I cared that we were screaming together."], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["Scoops was closed. The sign in the window said OUT OF POWER. Jonah stared at it for exactly three seconds. I counted. One, two, three. Then he lifted his arms high above his head.", "\"Rain ice cream!\" he shouted.", "We walked out into the parking lot where the rain was coming down in thick, heavy sheets. We stood there with our mouths open, letting the drops hit our tongues. It tasted like metal and summer. Five minutes later, Jonah's mom found us. She looked at our soaked hair and our crazy faces. She did not ask questions. She just opened the car door.", "In the back seat, Jonah pulled a plastic bag from under his seat. Inside were two old walkie-talkies, the kind with the long antennas that looked like they had survived a war.", "\"Range is two miles,\" he said, handing me one. \"So it's basically useless. Take it.\"", "I took it. It was heavy, and it was real, and it was finally mine."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["We sat on the porch as the rain slowed into a soft mist, and Jonah fidgeted with the strap of his helmet. He looked at me, then down at the walkie-talkie in my hand.", "\"Is it fixed?\" he asked, nodding toward the sky. \"The Saturday thing?\"", "I watched a drop of water roll off the edge of the wet wood and hit the ground, then looked at my shoes. I thought about the clock in the hall, and I thought about the seventy-seven scratches I had made on the closet wall with a pencil.", "\"I stopped needing it fixed,\" I said, and my voice sounded like it belonged to someone else, someone who was tired of being the only one who knew the score.", "Jonah nodded slowly. He didn't ask why. He just sat there with me, like he understood a joke I hadn't told yet. The rain stopped completely, and the air started to smell like wet dust and pine, which is what my room smells like after I’ve been crying in it for an hour and then cleaned up.", "\"Okay,\" Jonah said, breaking the quiet. \"New rule. Saturdays. 6:47 a.m. Every week. One of us calls the other.\"", "\"You won't remember agreeing to this,\" I said, because I knew the way his brain worked.", "Jonah grinned, a huge, confident smile that took up his whole face. He pulled a pen from his pocket and tapped it against his chin. \"Then write it on a laminate.\""], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "The Last Dinner on the Floor", "part": "PART FOUR: THE CHOOSING", "paras": ["The power died at 4:00 sharp. The refrigerator hummed for three seconds, then stopped, and the house went dark with a silence that felt heavier than the boxes stacked in the hall. Mom stood in the kitchen, clipboard clutched to her chest, her pencil hovering uselessly over the air. She tried to read the list, but without the overhead light, the paper was just a white rectangle of panic.", "The phone rang. It was the trucking company. They were coming at six a.m., not seven. The schedule had shifted. Mom’s shoulder dropped. She looked at the empty fridge, then at the wall, then at me. Her eyes did that thing where they look through you, like you are a window she was looking out of.", "I took the clipboard from her hands. I didn’t ask. I just took it. I opened it to the first page, where the list started with a column of empty boxes. I uncapped my pen. I wrote two words at the very top: Dinner. I drew a big, thick checkmark next to it.", "\"Trust me,\" I said.", "I put the clipboard back in her hands. She looked at the checkmark, then at my face, and for the first time all day, her shoulders unclenched. She didn't know why. But she nodded."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["We dragged the table out and shoved the boxes into the corners, clearing a space that felt like a stage. I went to the garage and hauled out Dad’s old camping stove, the one with the dented lid that stuck, and lit the candles. One, two, three. The light was orange and low, turning the dust motes into tiny gold specks floating in the air.", "Dad sat cross-legged on the rug, looking at the stove, then at the pot of tuna noodle casserole I had warmed up. \"You know,\" he said, his voice thick with a pun that was about to explode, \"I was going to say this was a pot luck, but then I realized it was more of a... fire drill.\"", "Tessa was already tapping her drumsticks against the empty pot. *Tink, tink, tink.* It was a rhythm, fast and sharp. Gus sat in the dinosaur hood, staring at the candle flames. He leaned in. He leaned in more. He roared. Not a scary roar. A happy one. The flame flickered but didn't go out.", "Waffles trotted in, stole a slipper, and left it in the middle of the carpet. Nobody chased him. Nobody cared. The house felt warm, and the air smelled like tuna and wax, and for a second, none of us looked at the wall where the posters used to be. We just looked at each other."], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["\"Okay,\" I said. \"Rules. One thing. What are we taking with us? What are we missing?\"", "Dad went first, scratching his mustache as he thought. \"The toast,\" he announced, leaning forward with genuine pride. \"Specifically, the way it tastes like charcoal and yet I keep eating it.\"", "Tessa shrugged, tapping a drumstick once against her knee. \"The garage, and the fact that I can be loud and nobody tells me to stop.\"", "Gus pointed his claw at the carpet. \"The floor,\" he said simply. \"It’s soft.\"", "I waited, letting the quiet settle around us like a thick layer of peanut butter, heavy and sweet instead of empty.", "\"I’ll miss this floor, and Waffles under the table, and Dad’s toast, and the way every one of you is loud,\" I said, looking at each of them in turn. \"And I’ll take it with me, because that’s the whole trick. It goes in a pocket.\"", "Dad wiped his mouth with his fish apron and didn’t say anything, just smiling with the kind of real warmth that doesn't need a pun to back it up. Mom picked up her pencil and wrote something on her clipboard, her brow furrowing in concentration. I didn’t look at what she wrote, because I didn’t need to."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["At 11:58, the house was quiet. The candles had shrunk to useless nubs. My family lay in a tangle of air mattresses and blankets, breathing slow. I stood in the hallway, alone with the clock. The face was dark. I didn’t look up at the door. I didn’t wait for Gerald. I just talked to the wood and the paint.", "\"Thanks,\" I said. \"If you want to do a hundred and one, that’s okay. I’d rather be here happy than there happy-later. But I think it’s time.\"", "The old feeling tugged at my stomach, the fear that letting go meant losing everything. I let it go. I didn’t wish. I didn’t ask. I just stood there and listened to the second hand tick. It didn’t matter where the tick went. It only mattered that I was listening. The day wasn’t a math problem I had to solve. It was just a thing that happened, and I had been inside it. That was enough."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["The little door opened.", "Gerald popped out, looking small in the dark hallway. His painted eyes held a tired, gentle weight that reminded me of the last frame of a movie after the credits roll. He opened his beak.", "\"Cuck-oo.\"", "It was quiet, almost like a sigh escaping a deflated soccer ball.", "\"Good night, Gerald,\" I said.", "I turned and walked up the stairs without running or looking back. On the third step, I saw my family asleep on the air mattresses, a tangled mess of dark hair and red hoods and green spikes. I smiled, and this time it wasn't the tight, fake grin I had worn on the first Saturday, but a soft, real one that felt like a warm towel.", "I lay down on my mattress and closed my eyes. The air in the room was cool and still. I fell asleep on purpose, and I did not once ask what would happen next."], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "Sunday", "part": "PART FOUR: THE CHOOSING", "paras": ["6:47.", "The roar hit me, but it didn't stick. The ceiling was the same, and the light was the same, but then I saw the sun coming through the window at a higher, softer angle. Gus was not screaming into my face. He was whispering.", "\"Max! It's Sunday! The truck's here!\"", "I sat up, and my brain felt like static on an old radio. I let out a short, surprised bark of a laugh, and then I realized my eyes were wet. I wiped them with my sleeve, pretending it was just dust from the boxes.", "There was a knock at the door. Mom’s voice came through, bright and crisp. \"Page six, item one. Up and at 'em.\"", "I swung my legs off the bed, and the floor was cool under my socks. In the kitchen, Dad was fanning the toaster again, with smoke curling up thick and grey. He looked at me, hopeful, holding a slice of charcoal.", "\"Anti-gravity,\" he said.", "I grabbed the peanut butter. \"Impossible to put down,\" I said.", "He blinked, and then he grinned, wide and slow. \"You caught me, Max. You caught me.\"", "It was the best toast I had ever eaten."], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["The moving truck sat in the driveway, blocking the sun with its white side. Two guys in blue shirts hauled boxes, their arms flexing under the weight of my old life. I stood on the porch, watching them, feeling like a spectator at a game I had already lost.", "Mrs. Abernathy was on her porch across the street, wearing her floral gardening hat. She waved, small and steady, so I walked over to her before I got in the truck.", "\"It's a hot dish,\" I said, \"so be careful, you'll want a trivet.\"", "She burst out laughing, her whole body shaking. \"Oh, Max! You are a menace. I will send one to Arizona. I promise.\" She hugged me, smelling like tomato vines and soap.", "I walked back. Mr. Grady’s sprinkler was on, a high arc of water that soaked the mailman, who was hopping around in a puddle. I waved at him. He didn’t wave back, but he didn’t curse at me either.", "The guys loaded the last box. I looked at the house. The yellow paint, the creaking porch, the spot on the lawn where the sprinkler had worn a bald patch. It looked smaller than it did from the inside.", "I climbed into the truck. The seats were stiff and smelled like cardboard. I didn’t look back. I didn’t have to."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["A shadow stretched across the truck's hood.", "Jonah stood there, chest heaving. Sweat darkened his buzz cut, and his bike helmet stayed strapped on. He held out a small laminated card.", "I took it. In careful marker, it read: SATURDAYS 6:47.", "He didn't say goodbye. He just looked at me with those big, serious eyes. I reached into my pocket and pulled out the spare spiky T. rex tail I had kept in my hoodie. I handed it to him.", "He looked at it. He looked at me. Then he tucked it into his pocket, right next to his walkie-talkie.", "\"See you Saturday,\" he said.", "\"See you Saturday,\" I replied.", "He turned and ran down the street, his helmet bobbing. I watched him until he disappeared around the corner. The truck engine rumbled to life. The doors closed. The world outside became a blur of yellow house and green grass.", "I held the card in my hand. The plastic was smooth and cool. It felt heavy, like a promise."], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["1,700 miles stretched out ahead of us.", "Gus was in the back seat, roaring at every state line. Every time we crossed one, he shouted, \"DINOSAURS!\" and pointed out the window at the passing trees and fields like he was naming them.", "Tessa sat next to me. Her headphones were around her neck. She tapped her fingers on her knee, a quiet, steady beat that sounded exactly like the drum practice pad she was leaving behind. After a while, she reached over and took my hand. Her fingers were cold, but I held on tight.", "Dad was driving. He was humming a song I didn’t know. Grandma Bea’s Buick was in the rearview mirror, following us. Her horn played a little tune, a bumpy, cheerful melody, until she turned off at the exit and vanished into the heat.", "\"Max,\" Dad said, \"did you know that cactus is just a word for a plant that has given up on being polite?\"", "I laughed. It was a real laugh, the kind that comes from your belly and not your mouth.", "\"Bad pun,\" I said.", "\"Good pun,\" Dad said. \"We're almost there.\"", "The landscape changed. The green turned to brown, then to tan. The air outside the window looked dry and sharp, like a pencil point."], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["The house in Tucson was tan and flat and shaped like a shoebox somebody had left out in the sun. We unloaded until it got dark. My new room had a window that faced a cactus, and the cactus, I have to report, faced right back.", "Before bed I carried the clock into the front hall and hung it on the first hook I could find. At 11:59 the little door popped open. \"Cuck-oo.\" One crooked, fussy note, and that was all. No swirling, no roaring, no 6:47. Just a bird made of wood, doing its job.", "\"Hey, Gerald,\" I said. \"Thanks.\"", "Here is what I know now, and then I'll leave you alone. Happiness isn't what happens when the day goes right. It's what you bring to the day, on purpose, before it has a chance to prove you wrong. It took me a hundred Saturdays to find that out. You can have it in one.", "On Saturday I woke up at 6:46 with Waffles on my feet and a roar on the way. The walkie-talkie sat on my shelf, with a range of two miles and a whole desert of distance between us, completely useless. I wouldn't have traded it for anything.", "At 6:47 my phone buzzed. It was Jonah, in his bike helmet, grinning.", "\"Is it Saturday?\" he said.", "\"It's Saturday,\" I said, and I smiled before I even knew why, on purpose."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "Forty-One Days of Dinosaur", "part": "PART ONE: THE LAST SATURDAY", "page": 1}, {"n": 2, "title": "The Hot Dish and the Laminated Plan", "part": "PART ONE: THE LAST SATURDAY", "page": 6}, {"n": 3, "title": "The Clock Comes to Dinner", "part": "PART ONE: THE LAST SATURDAY", "page": 11}, {"n": 4, "title": "Eleven Fifty-Nine", "part": "PART ONE: THE LAST SATURDAY", "page": 16}, {"n": 5, "title": "Roar, Again", "part": "PART TWO: SATURDAY, AGAIN", "page": 21}, {"n": 6, "title": "The Rules of Saturday", "part": "PART TWO: SATURDAY, AGAIN", "page": 26}, {"n": 7, "title": "Jonah Believes (Every Time)", "part": "PART TWO: SATURDAY, AGAIN", "page": 31}, {"n": 8, "title": "The Day With No Consequences", "part": "PART TWO: SATURDAY, AGAIN", "page": 36}, {"n": 9, "title": "Ninety Seconds of Fun", "part": "PART TWO: SATURDAY, AGAIN", "page": 41}, {"n": 10, "title": "Operation Perfect Saturday", "part": "PART THREE: OPERATION PERFECT SATURDAY", "page": 46}, {"n": 11, "title": "Everybody's Scared", "part": "PART THREE: OPERATION PERFECT SATURDAY", "page": 51}, {"n": 12, "title": "The Fixer", "part": "PART THREE: OPERATION PERFECT SATURDAY", "page": 56}, {"n": 13, "title": "The Worst Dinner in the Universe", "part": "PART THREE: OPERATION PERFECT SATURDAY", "page": 61}, {"n": 14, "title": "Grandma Bea and the Peach", "part": "PART THREE: OPERATION PERFECT SATURDAY", "page": 66}, {"n": 15, "title": "The Burnt Toast Experiment", "part": "PART FOUR: THE CHOOSING", "page": 71}, {"n": 16, "title": "Sad and Happy at the Same Time", "part": "PART FOUR: THE CHOOSING", "page": 76}, {"n": 17, "title": "Sorry, to Someone Who Won't Remember", "part": "PART FOUR: THE CHOOSING", "page": 81}, {"n": 18, "title": "Jonah's Last Day Extravaganza", "part": "PART FOUR: THE CHOOSING", "page": 86}, {"n": 19, "title": "The Last Dinner on the Floor", "part": "PART FOUR: THE CHOOSING", "page": 91}, {"n": 20, "title": "Sunday", "part": "PART FOUR: THE CHOOSING", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
</body>
</html>
