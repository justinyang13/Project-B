.orn{text-align:center;color:var(--accent);letter-spacing:.6em;margin:-6px 0 14px;font-size:.9rem}

#toc .n{color:var(--accent);font-weight:700;min-width:1.7em}#toc .t{flex:1}#toc .p{color:var(--muted);font:.85rem system-ui}

<script>
const D = {"title": "The Day That Wouldn't End", "sub": "A Funny, Wonderful Time-Loop Novel", "pages": [{"no": 1, "ch": 1, "ctitle": "Forty-One Days of Dinosaur", "part": "PART ONE: THE LAST SATURDAY", "paras": ["Here is what you need to know about my little brother Gus: he had not taken off his T. rex costume in forty-one days.", "Not for baths (he sat in the tub in it, like a wet green sofa). Not for picture day. Not for the dentist, who said \"Open wide\" and got a roar in the face.", "So when I tell you that at 6:47 on the morning of the worst day of my life a dinosaur climbed onto my chest and screamed, you should not be surprised. You should be asking a different question, which is: why did I wake up already feeling like a person who had lost?", "\"RAAAAWR,\" said the dinosaur, with his whole face an inch from mine.", "\"I'm awake,\" I said.", "\"RAAAAWR.\"", "\"Gus, I'm awake. We're both awake. That's the only thing that's going right.\"", "He sat back on my ribs, pleased, and the spikes on his tail knocked over the water glass on my floor. Nobody had packed the water glass. It was the last thing in my room that nobody had packed."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["I should explain about the room.", "Yesterday it had been a room. It had a desk with a lamp shaped like a rocket, a bookshelf, a beanbag that was mostly beans, and a wall of posters that I'd stuck up one at a time over six years. Now the walls were bare except for pale rectangles where the posters had been, like the marks a sunburn leaves after a strap comes off. My bed was the only furniture left. Next to it sat one cardboard box with MAX'S STUFF (MISC.) printed on the side in Mom's tidy capitals.", "I knew what MISC. meant. It meant: things Max won't throw away and won't look at either.", "Dunmore, Ohio, is the only place I have ever lived. I know which stair on our porch creaks. I know which streetlight on Larkspur Lane flickers when it's about to rain. I know that you can hear the ice-cream truck two full minutes before it turns the corner, which gives you time to find a dollar.", "Tomorrow morning a moving truck was going to arrive at seven o'clock sharp, and by tomorrow night we would be living in Tucson, Arizona, which is 1,700 miles away. I looked it up. I looked it up three times, hoping it would change. It's mostly cactus."], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["At 7:13, Waffles stole my left slipper.", "Waffles is our dog. He's a corgi, which means he has the body of a loaf of bread and the morals of a pirate. He trotted past my door with the slipper hanging out of his mouth like a cigar, gave me a look that said *come and get me*, and vanished under the dining room table, which I could see from the hall because there was nothing left in the house to block the view.", "I crawled after him. Under the table were: one lost sock, one red Lego brick, and a french fry so old it had turned into a fossil. Waffles lay in the middle of them, chewing my slipper with the expression of a dog who has never had a single regret.", "\"Roar at someone else,\" I said, because Gus was right behind me, growling down at my ankles.", "That was all I said. I didn't even say it loudly.", "But Gus stopped. I watched his face go small inside the dinosaur hood, the way a kid's face does when he has just realized the game was only his. He sat down on the floor with his tail sticking out behind him.", "I noticed. I want that on the record. I noticed, and then I picked up my slipper and pretended I hadn't."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["At 7:22 the smoke alarm went off.", "This was not news. Dad burns the toast every single morning. He believes the toaster is broken and the toaster believes Dad is broken, and neither one has ever been willing to see a specialist.", "When I walked into the kitchen he was standing on a chair in his apron (the one with the cartoon fish on it), fanning the ceiling with a dish towel and shouting over the beeping.", "\"Max! Good morning! Did you know I'm reading a book about anti-gravity?\"", "\"No.\"", "\"It's impossible to put down!\"", "He waited. His mustache was up, hopeful. My dad has a face like a big friendly loaf, and when he makes a pun it lights up like he has just handed you a present.", "I did not laugh. I had decided in bed that I wasn't going to laugh at anything today, on principle, and the principle was going great.", "Mom went by in the doorway with her clipboard. Six pages, stapled. A pencil behind her ear and another one in her mouth. She ticked something off without looking up.", "\"Sal,\" she said around the pencil, \"the toast.\"", "\"It's not burnt, Mira,\" said Dad. \"It's *dark.*\""], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["I took a slice of charcoal and sat down at the kitchen table, which was a cardboard box with a tablecloth over it.", "I'm going to tell you my plan now, because I've never been good at keeping one to myself.", "The plan was this. I was going to have the worst day of my life. I wasn't going to enjoy one single minute of it. I was going to sulk in the loudest, most obvious way possible, so that when the truck came and took everything I'd ever known to a place that was mostly cactus, everybody in my family would remember exactly how much they had ruined.", "It seemed like a good plan. It was the only one I had.", "It turned out to be the worst plan in the history of plans, and it is going to take me one hundred Saturdays to explain why. But I'm getting ahead of myself.", "The toast, by the way, tasted like the inside of a chimney. I ate all of it, out of spite."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Hot Dish and the Laminated Plan", "part": "PART ONE: THE LAST SATURDAY", "paras": ["At 8:05, the doorbell rang, and I did not move.", "Mrs. Abernathy was tiny. She wore a floral gardening hat that looked like it had survived a hurricane, and she carried a glass dish so heavy it bowed her shoulders. Tuna noodle casserole. Potato chips on top, arranged in a perfect, crunchy roof.", "\"It's a hot dish, so be careful,\" she said, her voice thin and sweet. \"You'll want a trivet.\"", "I looked at the chips. I looked at her hands, which were spotted and strong. I said nothing. I was busy being the worst person in the house, and silence was part of the plan.", "Dad stepped out of the kitchen, still holding a burnt slice of toast. He beamed.", "\"Thank you, Mrs. A,\" he said. Then, louder, as if volume could cure my rudeness: \"THANK YOU, MRS. A. That is wonderful.\"", "She smiled, a little stiffly, and placed the dish on the counter. The chips crunched under the weight. I felt a tiny, stupid spike of guilt, but I ignored it. Guilt was a luxury for people who liked things. I was in the business of ruining them."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["My phone buzzed on the floor at 8:30, the blue light cutting through the dim room like a flashlight in a dark closet. I stared at the screen. It was Jonah.", "\"I HAVE A PLAN. Be at my house at 2. Wear shoes you can get wet.\"", "I typed the word *maybe* and looked at it, but it felt weak, like a door left ajar. I deleted it and turned the phone face down.", "You should know about Jonah Park. We have been best friends since kindergarten, which means I have seen him fall off a swing set, cry at a dog movie, and once explain why the moon was \"looking at him\" during a math test. He wears a bike helmet everywhere, always, to the library, the ice cream shop, and even his own bedroom. It is not a joke. It is a lifestyle.", "Last summer, we built a raft out of pool noodles and a tarp, and we pushed it into the creek. It sank in eight inches of water. Jonah did not get angry. He just said, \"Okay, that was a learning moment,\" and we went home to get dry socks.", "I wanted to go. I really, really wanted to go. But I was the person who had lost, and losers don't go to parties."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["At 9:15, the world almost ended.", "Dad carried a box marked FRAGILE/KITCHEN in thick red marker. His grip slipped, or his elbow hit the doorframe, or gravity simply decided to be unhelpful. The box fell.", "Time never slows down, but it felt like it did. I watched the box tumble through the air. I saw Dad’s face go white. I saw Mom, standing by the pantry with her clipboard, drop her pencil.", "She dove.", "It wasn't a swimmer's dive. It was the way a dog catches a frisbee. Her body stretched out, her hands shot forward, and she caught the box a hand-span from the hardwood floor. The plates inside rattled, a sound like rain on a tin roof.", "Silence followed, thick and heavy, until one by one, we started to laugh. It was the nervous, shaking kind you get when you think you’ve failed but you haven’t.", "I did not laugh. I stood in the middle of the room, arms crossed, feeling heavy and still.", "\"Max,\" Mom said. She was breathing hard. Her hair was falling out of her clip. She didn’t bother fixing it. \"Please. Just today.\"", "\"Just today is all I've got left,\" I said.", "I hated how it sounded. It was a line from a movie. I turned and walked out of the kitchen."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["I retreated to the garage, which was half-empty too.", "Just the car, a ladder, and boxes. I walked past the ladder and stopped in front of the last one. It was small, holding Tessa’s drum practice pad, old Kettle Drums posters, and my soccer trophies. My gold cup for the regional finals stuck out the top, gleaming in the dusty light.", "\"Hey.\"", "I turned. Tessa stood in the doorway, her purple streak pulled back, headphones around her neck, and drumsticks in her back pocket. She looked at the box. Then she looked at me.", "\"That's mine,\" she said.", "\"It's in the middle of the room,\" I replied. \"I'm moving it.\"", "\"You're moving everything,\" she said, her voice flat and cold. \"You think you're the only one this is happening to?\"", "I looked at her, then at the posters. I saw the name *Kettle Drums* on one. I knew exactly what to say. It was the easiest thing to reach, the sharpest tool I had.", "\"You don't have anyone to play for anyway,\" I said. \"No friends. Just the drums.\"", "Her face went still. Not angry. Just paused, like a video game waiting for input.", "She stared at me for a long second. Then she turned and walked out. The garage door slammed shut behind her, a sound like a gunshot."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["I stood in the garage, listening to the refrigerator hum through the wall. The light was dim, and my own heartbeat felt loud enough to rattle the boxes around me. What I’d said was the meanest thing I’d ever said to anyone, and it was true, which made it worse. I had chosen it because it was the sharpest tool I had, reaching for the knife without checking who was holding it.", "I sat down on the cold concrete, pulling my knees up to my chest. Upstairs, through the floorboards, came a rhythm. Tap. Tap. Tap-tap-tap. Fast, then suddenly stopped. The silence that followed was heavier than the noise. I waited, not knowing if I was hoping for an apology, a scream, or for the door to open and Tessa to tell me to get lost. Nothing happened.", "Then the doorbell rang.", "It was 11:00. I didn’t need to check my phone to know who was there. I could see the round shape of a bike helmet on the front step, just visible through the window glass."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "The Clock Comes to Dinner", "part": "PART ONE: THE LAST SATURDAY", "paras": ["I opened the door before he could knock again. Jonah Park stood on the step, his bike helmet strapped under his chin. He held up a folder that was laminated so thick it looked like armor.", "\"The Last Day Extravaganza,\" he announced, his voice cracking with excitement. \"Item one: Weller Creek. Bring water shoes. Item two: Putt-Putt Palace. I have already studied the hole numbers. Item three: Scoops. We order the double scoop chocolate with the cherry on top. No exceptions.\"", "He read it with the seriousness of a lawyer presenting a case. I leaned against the doorframe, crossing my arms over my red hoodie.", "\"I might come,\" I said.", "His grin, which had been wide enough to show both rows of teeth, wobbled. Just for half a second. Then he fixed it back in place, rigid and bright.", "\"Two o'clock,\" he said. \"Wet shoes.\"", "He spun around on one heel and pedaled away, his helmet bobbing against the sun. I closed the door and listened to the tires hiss on the asphalt until they were gone. The silence that remained felt heavy, like a wool blanket thrown over a chair."], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["Lunch at 12:30 was peanut butter sandwiches on paper towels. The plates were packed, so we ate standing up in the empty kitchen, which smelled like cardboard and dust.", "Dad held up a slice of bread. \"You know why bread is better than toast?\"", "\"Because it doesn't burn?\" I offered.", "\"No, Max. Because it's soft. It's like a hug for your mouth.\"", "Nobody laughed. Mom stood by the counter, her pencil tapping against page four of her checklist. Tessa was not there. I knew she was upstairs because I could hear the faint, rhythmic thump-thump of her drumsticks tapping against the wall.", "Gus sat on the floor, holding his sandwich with both hands. He looked at it, then at me. He let out a low, rumbling growl.", "\"Raaawr,\" he said softly.", "He bit into the bread. The peanut butter smeared on his green T. rex sleeve. I watched him eat, and I noticed that nobody else was really eating. We were just chewing, waiting for the taste of the day to fade, hoping it would turn into something we could swallow without choking."], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["At 1:15, a horn played a tune. It was not the normal honk. It was a melody, three notes high and one low, like a trumpet clearing its throat.", "The green Buick rolled into the driveway. It was enormous, the color of a forest after rain. The door opened, and out stepped Grandma Bea. She was tiny, wearing huge round sunglasses and a coat that was bright red. Gold bangles on her wrists jingled with every step.", "In her hands, she carried a laundry basket. Inside the basket, wrapped in a dish towel, was a wooden clock.", "\"Max,\" she said, her voice warm and sharp. \"I decided you are keeping this.\"", "\"I don't want a clock, Nonna,\" I said. \"I want to stay.\"", "She stopped. She looked at me over the top of her sunglasses. Her eyes were dark and serious behind the glass.", "\"Nobody asked what you want, caro,\" she said. \"I am asking what you will do.\""], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["She hung the clock on the last hook in the front hall. It was a tall, dark wood cabinet with a small door.", "\"Meet Gerald,\" she said.", "Gerald was a painted wooden bird. He had a crooked beak and eyebrows that looked permanently angry. It was the quarter hour. The small door creaked open. Gerald popped out.", "\"Cuck-oo,\" he said. It was not a happy sound. It was a fussy, complaining sound.", "Gus, who had been hiding behind Grandma Bea's leg, roared. \"RAAAAWR!\"", "Gerald vanished back into the door.", "\"See?\" Grandma Bea said, jingling her bangles. \"He has opinions.\"", "\"Clocks don't have opinions,\" I said. \"They have mechanisms.\"", "Ten seconds later, the door creaked open again. Gerald poked his head out, looked at me, and gave one loud, angry cuckoo before hiding again. I stared at the wooden bird. He stared back, or at least, his painted eyes seemed to."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["It was 2:00. The Extravaganza had started without me.", "I climbed out my window and onto the garage roof. It was dusty, but it was mine, and it was high enough to see the whole street. I pulled a bag of pretzels from my pocket.", "Jonah’s bike came down the street. He was pedaling hard, his helmet bobbing. He looked up, then down the empty street. His shoulders slumped. He looked like a person who had lost a game he didn’t know they were playing.", "He pedaled on. The laminated itinerary flapped in the wind behind him, a white flag of hope.", "I ate a pretzel. It tasted like nothing. Not salty, not sweet, just dry air and salt. I told myself I didn’t care. I am going to be honest with you for the rest of this book, so: I lied."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "Eleven Fifty-Nine", "part": "PART ONE: THE LAST SATURDAY", "paras": ["At 4:10, the sprinkler fired.", "Mr. Grady’s lawn is next door, and his sprinkler is a chaotic, spinning thing that treats the mailman as a personal enemy. I watched from the roof as the mailman, a man in a blue uniform who looked like he had already lost three fights today, stepped into the spray.", "The water hit him with the sudden, freezing shock of dropping an ice cube directly into a glass of warm soda. He didn’t scream; he just stood there, soaking, while the sprinkler continued its merry dance. Then he yelled. It was a good yell, the kind that comes from a place where dignity went to die.", "I almost laughed. The feeling bubbled up in my throat, hot and sharp, but I swallowed it down like a pill I didn't want to take. It was the only thing all day that had almost made me smile, and I hated it for that.", "Then I heard Mom’s voice below.", "\"Max! Dinner! It’s the last supper in this house, so please come down and be a human being for five minutes!\"", "I looked at the mailman, now walking away with his head hanging low. I looked at the pretzels in my hand. I hopped down the side of the garage.", "The last supper. Okay. I could do that. I could do five minutes of being a human being. Probably."], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["The living room felt hollow, like a cereal box with the contents scooped out. We sat in a circle on the floor, surrounded by a pyramid of pizza boxes and paper plates. Dad stood up, holding a slice of pepperoni high in the air.", "\"To the house,\" he said. \"To Ohio. To new cactus adventures.\"", "We clinked our lemonade bottles together. The sound was flat and plastic, more like tapping a phone screen than a celebration.", "Mom wasn’t making a scene, but she was staring at her clipboard, which she had dragged to the floor. She kept checking a box, then checking it again, her pencil moving in tight little circles that didn’t match up with anything on the list.", "Gus had a slice of pizza sticking out of the mouth hole in his T. rex hood. It looked like a dinosaur trying to talk through a mouthful of cheese. He seemed genuinely happy, which made me feel a little more grumpy than before.", "Tessa sat right next to me. She wasn’t looking at anyone. She was watching her hands, and I could hear the dull thud of her drumsticks tapping against her thigh. *Tap. Tap. Tap.*", "She didn’t say hi. She didn’t say bye. She just sat there, purple streak of hair and all, keeping her distance like she was waiting for the rest of the world to leave."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["\"Okay,\" Mom said. Her voice had a wobble in it, like a dog trying to bark through a full mouth. \"One thing you’ll miss. Go around.\"", "Dad went first. \"The kitchen,\" he announced, his face bright. \"Specifically, the fridge light. It’s the only good thing in this house.\"", "Tessa went next. She didn’t look up. \"My drum room,\" she whispered, tapping her sticks against her knee in a quiet, steady rhythm.", "Gus went third. \"Everything,\" he said, his voice muffled by a slice of pepperoni. \"Even the stairs. The ones that go up and down.\"", "Then it was my turn. The circle waited. Dad looked at me. Mom looked at me. Gus looked at me with his pizza-tongue.", "I wanted to say something nice. I wanted to mention the backyard, or the creek, or Jonah’s house. But the words got stuck in my throat like a gummy bear that had turned to plastic. Instead, what came out of my mouth was this: \"Nothing. Because it’s all going to be worse there.\"", "Silence fell over the living room, heavy and thick as a wet blanket. Waffles chewed on the corner of the pizza box. *Crunch. Crunch.*", "Mom didn’t yell. She just looked at me with eyes that were very tired and very sad.", "\"Go to bed, Max,\" she said softly. \"Early.\"", "\"Glady,\" I said. And I meant it."], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["My room was an air mattress in a box.", "I lay on my back staring at a ceiling that was just white, the kind of blank, featureless white that looks like a sheet of printer paper taped to the sky. There were no posters, no rocket lamp, no pale rectangles where my six years of life had been. Just the flat, empty surface.", "The house breathed around me. I could hear Dad snoring in the next room, a low rumble that sounded like a diesel truck stuck in second gear, while Mom’s pencil scratched on paper in the hall with the soft, anxious rhythm of someone trying to keep the world from falling apart.", "Then there was Tessa. Her drumsticks tapped against the wall, *tap, tap, tap*, a slow, steady beat that felt less like music and more like a countdown to something I didn't want to hear.", "I wasn't afraid of the dark, because I wasn't. I was afraid of the truck. I was afraid of waking up and seeing it there, the engine idling, the boxes gone, and me being a person who lived in Tucson, Arizona, instead of Dunmore, Ohio. I was afraid of never getting to be the kid who knew which streetlight flickered before the rain.", "The tapping stopped.", "Dad’s snoring got louder.", "I closed my eyes."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["It was 11:58.", "I shouldn't have been awake, but I was, which is usually the first sign that the night has gone sideways. The house was silent except for the house itself, settling and ticking. Moonlight poured through the glass door in the front hall, pooling on the floor like spilled milk.", "The clock hung on its hook. It ticked.", "I stood under it, looking up at Gerald. He was in his little wooden house, behind the door. I could see one eye, black and round, watching me with the judgmental glare of a teacher who knows you haven't done your homework.", "\"I wish today would never end,\" I whispered.", "The door popped open with a *fwoop*.", "Gerald came out. His beak was crooked. His eyebrows were angry. He looked at me, then he made a sound.", "*Cuck-oo.*", "Just one. Not three. Not four. Just one crooked cuckoo, lonely and off-key like a kid singing \"Happy Birthday\" to no one.", "It was 11:59.", "I laughed. It was a short, dry laugh, the kind that comes out when you trip over your own feet in the cafeteria. I felt stupid. I felt like a kid who had made a wish at a wishing well and gotten a single, flat penny.", "I went back to bed.", "I fell asleep smiling.", "Which should have been my first clue."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "Roar, Again", "part": "PART TWO: SATURDAY, AGAIN", "paras": ["At 6:47, a dinosaur climbed onto my chest and screamed.", "\"RAAAAWR,\" said Gus, with his whole face an inch from mine.", "I didn't yell or push him off. Instead, I sat up and blinked because the room felt completely wrong. The posters were gone, the beanbag was gone, and only the bed remained alongside the box marked MISC. The wall showed pale rectangles where my life used to be.", "I looked at the clock on my nightstand. It said 6:47. Saturday.", "My stomach dropped all the way to the pillow.", "\"Gus,\" I said, my voice sounding like it was coming from a different room. \"We're both awake. That's the only thing that's going right.\"", "He sat back on my ribs, pleased, and the spikes on his tail knocked over the water glass on my floor. Nobody had packed that water glass. It was the last thing in my room that nobody had packed.", "I realized I had slept through Sunday. I had slept through the truck. I was going to be late for school in Arizona.", "Gus roared again.", "I looked at the clock. 6:47."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["At 7:13, Waffles stole my left slipper.", "He trotted past my door with the slipper hanging out of his mouth like a cigar, gave me a look that said *come and get me*, and vanished under the dining room table. I could see all the way to the back of the house from the hall because there was nothing left to block the view.", "I crawled after him. Under the table were: one lost sock, one red Lego brick, and a french fry so old it had turned into a fossil. Waffles lay in the middle of them, chewing my slipper with the expression of a dog who has never had a single regret.", "I stood up slowly because my legs felt like they were made of old cardboard.", "\"Nope,\" I said out loud.", "Mom appeared in the doorway holding her clipboard. She had six pages stapled together and a pencil behind her ear. She looked at me, then at the dog, then at me again.", "\"Max, who are you talking to?\"", "\"I'm talking to the slipper,\" I said. \"He's stealing it.\"", "Mom checked her list. She ticked something off without looking up."], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["At 7:22, the smoke alarm shrieked.", "Dad stood on his chair in his fish apron, fanning the ceiling with a dish towel while shouting over the beeping.", "\"Max! Good morning! Did you know I'm reading a book about anti-gravity?\"", "\"No,\" I said.", "\"It's impossible to put down!\"", "A cold spike hit my chest, and I knew what came next. I knew it in my bones, which felt like they had turned to ice.", "\"It's not burnt, Mira,\" I said before Dad could finish his sentence. \"It's dark.\"", "Dad froze. He lowered the towel, and his mustache went flat. He looked at me with real alarm, the kind of look a teacher gives when a student answers a question they haven't asked yet.", "\"How did you know that?\" he asked.", "I didn't wait for an answer. I ran to the bathroom and locked the door. My hands were shaking, so I pressed them against the cool tile of the sink.", "It wasn't a dream. It wasn't a memory. It was a recording."], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["At 8:05, the doorbell rang, and I was already standing in the hallway with my hand on the knob.", "I opened the door before the second ring had a chance to happen. Mrs. Abernathy stood there in her floral gardening hat, holding her tuna noodle casserole with the same grip she used for things she was very proud of.", "\"It's a hot dish,\" I said, looking her straight in the eye. \"So be careful, you'll want a trivet.\"", "She blinked, then looked at the dish, then back at me. Her trivet slipped from her fingers and clattered loudly on the porch steps.", "\"Max,\" Mom said from the kitchen, her voice tight and worried. \"Don't tease the neighbors.\"", "I walked back to the kitchen counter and looked down at my hand. The margin of my palm was blank, but my brain was full of lists. I grabbed a pencil from the drying rack and started writing on the back of a moving box.", "*Things That Are Exactly The Same.*", "1. The slipper. 2. The toast. 3. The trivet.", "I looked up through the gap in the doorway. Mrs. Abernathy was bending down to pick up her trivet, and her hands were shaking, which made me feel like I had broken something that couldn't be fixed."], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["I ran.", "I went out the back door and down Larkspur Lane in my slippers, my lungs burning with every breath while my feet slapped the pavement in a frantic, wet rhythm. I kept moving until the streetlights flickered and the houses blurred into a long, grey line, and then I stopped at Weller Creek.", "I lay down on the bank, feeling the cool mud seep through my hoodie, and watched the brown water spin in slow, lazy circles. I closed my eyes and waited for the day to end on its own terms.", "I fell asleep on purpose.", "I woke up on my air mattress, the house silent except for the steady tick of the clock, and I knew exactly where I was before I even opened my eyes.", "I looked up. 6:47.", "A dinosaur climbed onto my chest and screamed.", "\"RAAAAWR.\"", "I didn't sit up. I just lay there, staring at the ceiling, feeling the heavy weight of the T. rex hood against my ribs. That was when I understood I hadn't dreamed anything. The day wasn't a memory that I could shake off like a bad dream in class. It was a loop, a stuck video game level that refused to load the next stage. And I was the only one who knew the words."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "The Rules of Saturday", "part": "PART TWO: SATURDAY, AGAIN", "paras": ["Saturday number three began with a plan to stay awake, which sounds brave but mostly means standing in the hallway holding a bag of pretzels until your eyes feel like sandpaper. I propped myself against the wall next to the clock, keeping my back straight even though my knees were locked up and my eyes were burning.", "I did not blink. I did not yawn. I did not think about the moving truck.", "At 11:58, I waited, watching the second hand creep around the face of the clock. The tick-tock sound was loud in the quiet house, like a tiny wooden hammer tapping on a table. I squeezed the pretzels in my hand until they crumbled, watching the dust fall to the floor.", "At 11:59, the little door in the clock face clicked open. Gerald popped out. He did not cuckoo. He just looked at me with his angry painted eyebrows, clicked the door shut, and vanished into the wood.", "I blinked, hard and fast, trying to see if the world was still there.", "The hallway was empty. The pretzels were gone from my hand. I was on my bed.", "\"RAAAAWR.\"", "Gus was on my chest again. I looked at the wall and took a pencil from my pocket. I scratched a single vertical line into the wood. One mark. One day.", "I was not going to lose my mind. I was going to keep score."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["Saturday number four was about testing the limits. I went into the kitchen and picked up Mom’s favorite blue mug, the one with the chipped handle that looked like it had been chewed by a very angry squirrel. I looked around to make sure she wasn’t watching, then I let go of it.", "It hit the tile and broke into three clean pieces. I felt terrible for about a minute, and then I went to bed. At 6:47 the next morning the mug was back on its shelf, whole, chipped handle and all, as if nothing had ever happened to it.", "I looked at my thumb. The splinter from the cardboard box that had been stuck there for the last two days was gone. My hand was smooth. I ate seven slices of cold pizza for breakfast, and my stomach did not growl or hurt. It was just a stomach, which was actually kind of nice until I realized it meant I couldn't use it as an excuse to leave the table.", "I went to the closet and wrote it down on the wall in pencil.", "RULE 1: Everything resets except me.", "I looked at the two vertical lines I had drawn. The day was a tape I could rewind, but the problem was that I was still stuck in the middle of the song, unable to skip to the part where it ends."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["On Saturday number five, I decided to try talking to someone. It seemed like the most logical move, like saving a game before the boss level. If I could tell one person, maybe I could get help.", "At the kitchen table, I leaned in close. \"Mom, I need you to listen. I’m living the same day over and over. I know it sounds crazy, but I’ve been here before.\"", "Mom stopped writing on her clipboard. She reached over and touched my forehead. Her palm was cool and dry.", "\"Max, you’re feverish,\" she said, not looking up. \"Are you worried about the move?\"", "I tried Dad. \"Dude, big changes are hard. I feel like I’m stuck in a loop.\"", "Dad nodded, wiping his hands on his fish apron. \"I feel that way every time the Wi-Fi lags. It’s a common feeling, Max.\"", "I tried Tessa. She was tapping her drumsticks on the table. The rhythm was steady and annoying.", "\"I’m trapped in time,\" I said.", "\"Take a lap,\" she said, without looking at me. \"You need to calm down.\"", "RULE 2: Nobody believes me. Nobody remembers me trying.", "I sat back. The silence in the kitchen was heavy."], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["Saturday number six was about running away. Not from the house, but from the block. I figured if I crossed the town line, maybe the loop would break. Maybe the day would end there.", "I walked until the houses turned into fields, and then until my shoes were covered in mud. Finally, I saw the sign that said DUNMORE, OHIO. I stood right next to it and waited for something.", "Nothing happened.", "I walked back, and when I got to the door, it was 11:58. The clock was still on the wall. Gerald was still in his box. I went to my room.", "RULE 3: The day ends wherever I am. RULE 4: Nothing I do sticks.", "I looked at my list. Four lines. Four days. I had a whole Saturday to do whatever I wanted, with no consequences, no moving truck, and no goodbye.", "A slow, bad idea started to grin at me. It was the kind of grin that tastes like sour candy."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["This is a good place to stop and tell you what I knew and what I didn’t.", "I knew every second of this day. I knew when the toast would burn. I knew when the sprinkler would soak the mailman. I knew exactly where the ice cream truck would turn the corner. I had the map. I had the keys.", "I did not know why. The clock did not speak. The bird did not explain. The magic was a closed door with no handle.", "I did not know how many Saturdays there would be. Five? Fifty? A thousand? The pencil marks on my wall were a tiny, fragile thing against the whole of the day.", "And I did not know the most important thing yet. I didn’t know that you can be in the same day a hundred times and still not have been in it once. I thought the loop was a prison. I was wrong. It was a playground with no rules, and I was the only kid who knew where the sandbox was.", "Then I thought of something foolish. Something bright.", "What if I just had fun?"], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "Jonah Believes (Every Time)", "part": "PART TWO: SATURDAY, AGAIN", "paras": ["Saturday number seven started with the same roar, but I didn't wait for it to finish. By 11:00, I was out of bed, shoes laced, and heading for the door. I knew Jonah would be in his room, laminating something. I knocked once.", "He opened the door wearing his helmet. It was indoors, but he always wore it indoors anyway. He stared at me with the specific surprise of a boy who has just been told his dog can do algebra.", "\"Max?\"", "\"Jonah.\"", "\"Did you... did you sleep?\"", "\"I have,\" I said. \"Listen. The day is repeating. The clock, the house, everything. It's the same Saturday.\"", "He blinked. His eyebrows went up, then down, then up again. He didn't laugh. He just looked at me with a kindness that felt like a wet towel on a sunburn.", "\"Okay,\" he said softly. \"Do you want a granola bar? Maybe it's the sugar.\"", "I stood in the doorway, holding the air, and realized that knowing exactly what he was going to say was worse than him not believing me at all. It was like watching a movie in the theater where you know every line before the actor says it. You can't stop them. You can't change the script. You just have to stand there and listen to someone you trust gently try to fix a problem that isn't broken."], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["I needed proof. I wanted to show him something that wasn't in the script, something only we knew. So I waited. I watched him write \"4:10\" in his notebook, then I watched him look at me when I predicted Mrs. Abernathy’s hot dish line. He was polite, and he was skeptical, and he was being a good friend, which is the worst thing a person can do when you are telling them the world is a loop.", "Then I played my ace. I took a breath.", "\"Jonah,\" I said. \"You cried at the end of that dog movie. The one with the golden retriever and the train station. You cried in the back row, and you didn't wipe your face, you just stared at the screen until the credits rolled.\"", "His face went white, then pink, then a shade of red I didn't have a name for. He looked at the floor, then at me, then at the floor again, while his hands shook slightly.", "\"Okay,\" he whispered. \"I believe you.\"", "It wasn't a question, and it wasn't a debate. It was a surrender. He believed me because I knew a secret that no one else in the world knew. And I realized, standing there in the hallway, that I was the only person in the universe who was allowed to know. That was a heavy, silent thing to hold."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["Jonah is the best person to have a time loop with. He doesn't panic or cry; he gets a laminator. By 2:00, we had a chart, and by 3:00, we had hypotheses involving wormholes, the clock, and cheese. I am not joking about the cheese. He genuinely believed the block in the fridge was causing temporal displacement, and I let him think that because it was funnier than explaining quantum physics to an eleven-year-old in a bike helmet.", "We spent the afternoon chasing the sprinkler on purpose. We ran to the Grady house and stood directly in the path of the water at 4:10, getting completely soaked until our shoes squelched like wet socks. We dried off on the porch, and then we ate ice cream at Scoops because we knew exactly when the day would end. It was the best afternoon I had in the whole month. For once, the world felt like a video game I had finally learned how to play, with a cheat code hidden in the code.", "At 9:30, his mom leaned out of the kitchen window and called him in for the night, and I watched his face change as the belief, the laughter, and our shared secret all began to wash away like rain off a windshield. He said goodbye, turned around, and walked away into the night. I was left standing on the porch, wet and happy and completely alone."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["I walked home slowly, watching the streetlights flicker on one by one, each one buzzing like a bee trapped in a jar. The house was dark, and I knew exactly what would happen at 6:47. Gus would roar, then the slipper would vanish, and the toast would burn before the smoke alarm even finished its first beep. Jonah would be in his room, wearing his helmet and holding a granola bar, asking if I had slept. This Jonah, the one who had believed me and run in the rain with me, would be gone. Replaced by a copy. A new version of the same boy.", "I thought about it for a long time. I sat on the stairs, looking at my hands, realizing I had to prove myself again. I had to say the dog movie line. I had to watch his face go white and pink. I had to be the only one who remembered the rain. It felt like trying to teach a new kid the secret punch in a video game, knowing he would forget it by the next save point. It was like writing a letter and knowing it would be deleted before it arrived. But I didn't care. Not yet. I was tired and hungry, ready to sleep."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["Saturday number eight began with the roar, followed by the slipper theft and the burnt toast, a routine I could recite like a multiplication table. At 11:00 sharp, I knocked on Jonah’s door. He opened it, helmet on, granola bar in hand.", "\"Did you sleep?\"", "I told him. I waited for the fear, the confusion, the quiet belief.", "\"Okay. I believe you,\" he said.", "He used the exact same tone. The same timing. Every single detail was identical.", "I laughed. It escaped before I could stop it, a loud, ugly sound that felt like popping a zipper in the wrong direction. I wiped my eyes and stared at the ceiling, then back at Jonah, who looked confused but kind.", "\"It's the same Jonah every time,\" I said to the air, to the missing clock, to the whole empty world. \"And I get to be the only one who's different.\"", "I grabbed the granola bar and ate it. It tasted like cardboard and honey, which was good. If nothing lasts, if the day is just a copy of a copy, then I was going to have the best time of my life. I would decide what mattered. Or I would decide that nothing did. But it would be my choice, not the clock's."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "The Day With No Consequences", "part": "PART TWO: SATURDAY, AGAIN", "paras": ["Saturday number nine started with a hunger that felt like an empty cereal box in my chest. I walked into the kitchen at 7:30 and looked at the counter, then at the family. Dad was still fanning the smoke alarm. Mom was checking her list. Gus was roaring at the toaster.", "I asked for pancakes. Fourteen of them.", "Dad blinked. \"Fourteen? That’s a lot of flour, Max.\"", "\"I want whipped cream,\" I said. \"And syrup. And cereal for dessert.\"", "They stared. I have never seen my family stare before. It was like watching a video freeze and then skip to the next level. Dad scrambled the eggs. Mom didn’t say a word. She just wrote \"PANCAKES\" on her clipboard in big, angry letters.", "I ate every bite. It tasted like freedom, which is a word I usually save for when the Wi-Fi works, but today it actually applied. It tasted like sugar and nothing at all.", "Then I put on Jonah’s helmet, which I had remembered from the previous Saturday, and I went outside. I found Tessa’s scooter in the garage. I kicked off on Dead Man’s Hill, the long, steep road that ends at the creek. I screamed the whole way down. I didn't care if it sounded like a goose being stepped on. I rode up the hill. I did it again. And again. Thirty-one times over four loops. No bruises. No scraped knees. Just wind and the sound of my own voice getting louder."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["Saturdays ten and eleven were about building.", "Jonah and I dragged the labeled moving boxes up to the garage roof, cut a hole in the top one, and taped another below it. We had made a slide that went over the fence and straight into Mr. Grady’s inflatable pool, which was bright red and looked like a giant watermelon that had given up on life.", "We slid into it. Wet, cold, and laughing, we kept going until our lungs burned.", "Then we moved indoors to see how many marshmallows fit in a mouth. Jonah stopped at nineteen, looking proud. I pushed to twenty-seven, which hurt my jaw but didn't kill me.", "Mrs. Abernathy arrived at 8:05 with her hot dish. I told her her tomato plants needed a \"makeover.\" We moved them into pots and added mulch. She loved it so much she gave me a tomato the size of a softball.", "Then the reset happened. She forgot. I remembered.", "I did it again. And again. It was the most fun I had ever had, and it was completely useless."], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["Saturday twelve was the day I said everything.", "I walked up to Mr. Grady while he was checking his sprinkler and announced that his equipment was a menace, a weapon, and generally hostile to humanity. He looked at me, confused, and said it was just water, son, as if I had accused him of jaywalking.", "I pointed at the mailman, who was standing on the wet sidewalk, dripping. \"Sir Splashalot,\" I said. \"Nice wet hair.\"", "Then I went to Putt-Putt Palace. I wore my bathrobe. I put a hole-in-one and didn't care. I laughed until my stomach hurt and my eyes watered, the kind of wild, reckless joy that feels like eating the entire sleeve of a candy bar in one go.", "No one remembered. No one was angry. No one was hurt.", "I was the only one who knew what I had done. And I was the only one who got to keep the laugh."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["Saturday thirteen was ice cream.", "We went to Scoops and I ordered fourteen flavors, one scoop of each: vanilla, chocolate, strawberry, mint chip, rocky road, and the weird one that looked like gravel.", "Jonah ate his. I ate mine. It was cold and sweet and heavy, weighing down my tongue like a wet sponge.", "\"Is this the Golden Age?\" Jonah asked, licking the cone.", "\"I think so,\" I said.", "We sat on the curb watching clouds that were white and puffy and completely unbothered by the move.", "Nothing stuck. Nothing cost. I had eaten fourteen flavors of ice cream without a single stomachache, and I had said the rude things without needing to apologize. I had built the slide and left it there, no cleanup required.", "It was perfect. It was empty. It felt like holding a soap bubble in your hands; you could feel the surface, but you couldn't keep it."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["Saturday fourteen started at 6:47, right on time.", "The roar hit my chest. Gus climbed up, his face close and his eyes bright.", "\"RAAAAWR,\" he said.", "I didn’t get angry. I didn’t feel like popping a zipper. I just felt tired, the kind of tired that stays in your bones even after you sleep.", "I had done everything. I had eaten the pancakes. I had slid into the pool. I had said the rude things. I had eaten the ice cream. I had run out of things I wanted.", "I lay on the air mattress in the living room. The house was quiet. The boxes were there. The clock was on the wall.", "What do you do with a day you can do anything in? You run out of things to do. It’s like playing a video game where you’ve already beaten every level and found every secret, but you still have to press start over and over again.", "I closed my eyes. I waited for the next roar. But I knew it wouldn’t come. Not because the day was over, but because I was done."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "Ninety Seconds of Fun", "part": "PART TWO: SATURDAY, AGAIN", "paras": ["Saturday fifteen felt flat, like eating a cracker that has lost its salt.", "Gus roared at 6:47, and I let him. By 7:22, the smoke alarm was screaming, and Dad was standing on his chair, fanning the air with a dish towel while his face lit up with anticipation.", "\"Max! Good morning! Did you know I'm reading a book about anti-gravity?\"", "I opened my mouth to say no, which was the correct answer. But my mouth didn't wait for permission. It just said, \"It's impossible to put down!\"", "Dad blinked. He looked at me, then at the toaster, then at me again. His mustache twitched.", "\"Did you just...?\" he started.", "\"No,\" I said, though my voice sounded like it came from someone else. \"I didn't.\"", "But I had. I knew the punchline before he did. I knew every pun he would make that day. I knew the hot dish was tuna. I knew Jonah's text would say I HAVE A PLAN.", "It was like knowing the ending of a movie. It doesn't make the movie better. It just makes it quieter. I watched Dad drop the towel. He looked confused. And for the first time, I noticed that a family isn't just people. It's surprise. And I had stolen all of it."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["Saturday nineteen, I wanted to do something big. Something that felt real, not just a loop.", "Grandma Bea had just set her laundry basket down in the hall. She was humming, completely unaware that I was standing behind her, eyeing her purse. The keys to her green Buick hung on the strap, just metal teeth on a ring.", "I took them. My hand shook, but I held them out, feeling the cold metal bite into my palm. I could drive to the edge of town, to the highest point, and just stop. Or go. It didn't matter. It was the act. The risk.", "But then I looked at the clock on the wall. It was 12:01. In forty-nine minutes, I would be back in my bed, waking up to Gus roaring.", "I put the keys back in the purse. My fingers were slippery, and I had to wipe them on my hoodie before I walked away.", "I learned something important that Saturday. The loop made everything safe, but it also made everything meaningless. If I crashed the Buick, Grandma Bea would wake up with no memory of it. But I would remember the shake in my hand. I would remember the choice.", "Even if nobody is watching, you are watching yourself. And I didn't like what I saw. I went to the kitchen and sat on the floor, hugging my knees, feeling very small and very awake."], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["Saturday twenty-three. Jonah arrived at 2:00, helmet on, grinning wide enough to crack it.", "He pulled the laminated itinerary out of his backpack. He didn't ask if I believed him. He just started talking. \"First we go to the creek. Then we play minigolf. Then we eat ice cream. It is perfect. It is the best day of my life. And yours.\"", "I watched his face. His eyes were bright, and he was so sure, so happy to be the one who knew the secret. It was beautiful. It was also a script. I knew exactly what he was going to say next. I knew he was going to ask, \"So, do you believe me, Max?\"", "\"I believe you,\" I said.", "He beamed. It was the seventh time. I felt a lump in my throat that had nothing to do with sadness. It was just... full. I reached out and put my hand on his shoulder.", "\"I love you, man,\" I said.", "Jonah froze. His grin vanished. He took a step back. His hand went to his helmet strap.", "\"Did you just say...?\" he started.", "\"Yeah.\"", "He looked around the garage, as if checking for witnesses. Then he reached into his pocket, pulled out a granola bar, and handed it to me.", "\"Eat this,\" he said, his voice high and shaky. \"You look like you need sugar.\"", "I started to laugh. It started as a snort, then a cough, then a howl. I laughed until my ribs hurt, until I couldn't breathe, until the sound stopped and I was just standing there, crying for no reason I could name."], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["Saturday twenty-eight. 3:00 PM.", "I sat on the garage roof with a bag of pretzels, looking down at Larkspur Lane, where the sun felt warm on my neck and the wind carried the smell of cut grass from Mr. Grady’s yard. I knew every crack in the pavement, which mailboxes were painted green, and the exact shade of the sky, yet it was also the loneliest place I had ever been.", "I was a boy in the middle of a town where nobody was surprised by him. I ate a pretzel, which was salty, and then I ate another, which was exactly the same.", "There is a thing nobody tells you about a perfect anything. It is empty, like a video game level with no enemies to fight and no score to chase. I was the only person in my own life, and I was tired of being the only one. I looked at the street, then at the sky, then at my hands, wishing I could be wrong or new, but I was just Max Bello, repeating, again and again, to a world that had forgotten how to listen."], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["11:58.", "The house was quiet, the boxes were packed, and the clock ticked on the wall. I stood in the hall, looking at Gerald, while the little wooden bird stayed perfectly still. I didn't wish. I didn't say, \"I wish today would never end.\" I didn't say anything at all. I just looked at the bird, feeling the day settle into my bones.", "\"How do I make this stop?\" I asked.", "Gerald did not move. He did not cuckoo. He just sat there with his crooked beak and angry eyebrows, watching me. I flopped onto the hall floor and stared up at the ceiling. I thought about the pancakes, then the Buick keys, and finally Jonah's granola bar. Maybe fun isn't the point. Maybe the day just has to be perfect, and then it lets me go.", "I pulled my notebook from my pocket and found a clean page. I uncapped my pencil. I wrote, in big, bold letters: OPERATION PERFECT SATURDAY.", "This is the part where things get worse."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "Operation Perfect Saturday", "part": "PART THREE: OPERATION PERFECT SATURDAY", "paras": ["Saturday twenty-nine began with a plan that looked like a spreadsheet from a corporate retreat, if corporate retreats involved stopping time. I had a notebook. I had two columns: PROBLEM and FIX. The first entry was the toast.", "At 7:20, I walked into the kitchen and yanked the toaster plug out of the wall before Dad could touch it. He stood there, holding a slice of bread, looking like I had just kicked him in the shin.", "\"The toaster,\" he said, \"is a democracy.\"", "\"I know,\" I said. \"But I'm running for office.\"", "He shrugged, a big, round motion that shook his apron. He walked to the oven, cranked the broiler to red-hot, and shoved the bread in. The smoke alarm screamed thirty seconds later. Dad fanned the ceiling with a dish towel, his mustache twitching.", "\"Max,\" he shouted over the beeping. \"Did you know that smoke is just air that has given up?\"", "I wrote in my notebook: PUN: UNSTOPPABLE.", "The toast was black. I ate it. It tasted like regret, but the schedule held for one minute, which was more than I had expected from a Saturday."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["By Saturday thirty, I had learned that preventing bad things was significantly harder than causing them.", "At 9:15, the FRAGILE/KITCHEN box sat on the counter like a trap. I grabbed it and carried it to the truck with the intense focus of a surgeon. I placed it gently in the back. It did not drop. I felt a surge of pride so strong it nearly made me dizzy.", "Then I sneezed.", "The box slipped, hit the pavement, and shattered into a thousand pieces of glass and ceramic. Mom was there, scooping up shards, exactly as usual. I wanted to scream, but I just watched her work.", "I tried the sprinkler next. At 4:05, I rushed to the Grady lawn and turned the tap off. The water stopped. Silence. Then, from the side yard, I heard a splash. Mr. Grady had turned his other sprinkler on early. The mailman slipped on a puddle, fell, and his hat flew into a tree.", "I sat on the porch steps, my notebook open. The pencil was dull. The world was a whack-a-mole game and I was the mole holding the mallet."], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["Saturdays thirty-seven through forty-four turned into a blur of laminated failure. Jonah and I built a spreadsheet. We had four backup plans for Putt-Putt Palace, three for Scoops, and one for the bike chain. It never worked. A bee chased Jonah’s helmet. The bike chain snapped in a way that made a sound like a sad trombone. Scoops ran out of the flavor Jonah loved, which was the color of a bruise.", "Each time, we reset. And each time, Jonah looked at me with that huge grin, ready to believe.", "\"Tell me,\" he said on Saturday forty-two. \"Tell me it’s real.\"", "I was tired. I was so tired of explaining the rules of a game that wasn’t real.", "\"Go away, Jonah,\" I snapped.", "His face fell. The grin cracked. He turned his bike around and left. I stood there, holding a granola bar, feeling smaller than the bee."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["Saturday forty-five was the number that didn't work. I counted the tally marks on the closet wall, one by one, until I reached forty-four, and the numbers sounded flat, like coins dropped on a tile floor. I didn't like that sound.", "Then I heard Gus crying.", "He was in the hallway. His T. rex tail was caught in the door, and he was pulling at it, but the spikes were hooked on the frame.", "\"Max!\" he wailed.", "I ran over. I worked the door open until the tail popped free. Gus stood there, breathing hard, his dinosaur hood askew.", "\"Thanks,\" he said.", "\"You're welcome,\" I said.", "For six minutes, I felt good. I felt useful, like the big brother who actually does things. I stood in the middle of the hall, hands on my hips, breathing deep, because I had fixed it and I had made a difference.", "Then the clock ticked."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["Then Gus reappeared.", "Not in the hall, and not six minutes later.", "At 6:47 the next morning, the dinosaur climbed onto my chest and screamed.", "\"RAAAAWR.\"", "I lay flat in the dark, staring at the ceiling while the room remained bare and the box stayed in its place, ready for the day to start all over again.", "\"You're welcome,\" I said to the dinosaur.", "Gus blinked. He didn't know what I meant. He never did.", "I sat up and looked at my hands, realizing that I had fixed the tail, stopped the sprinkler, and eaten the black toast, yet here we were.", "It occurred to me that I had done a lot of fixing, and I still hadn't noticed a single thing about anyone but myself.", "I looked at the closet wall. Forty-four marks waited there for the forty-fifth."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "Everybody's Scared", "part": "PART THREE: OPERATION PERFECT SATURDAY", "paras": ["Saturday forty-six began with the smell of burnt toast, which I let happen.", "For the first time, I did not rush to fan the smoke alarm. I did not make a face. I just stood in the doorway with my arms crossed and watched Dad.", "He was on his chair, waving a dish towel at the ceiling with the frantic energy of a man trying to shoo a very aggressive bee. The kitchen was filling with grey haze.", "\"Max! Good morning! Did you know I'm reading a book about anti-gravity?\" he shouted over the beeping.", "I said nothing. I just watched his face.", "\"It's impossible to put down!\"", "The beeping stopped. The room went quiet except for the ticking of the clock in the hall.", "Dad stood there, towel hanging from his hand. For one second, just one, his smile didn't come back. He looked tired. He looked at the calendar on the wall, the one with the red circle around Sunday, and his shoulders dropped. It was like watching a balloon leak air, slow and silent.", "Then he blinked, straightened up, and grabbed the toaster.", "\"Oops,\" he said, cheerfully. \"Charcoal.\"", "I realized then that the puns weren't jokes. They were a shield. He used them to keep the silence away. And I realized something else, something that made my stomach do a flip. Dad had never lived anywhere but here, either."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["By Saturday fifty-one, I had learned that Mom’s clipboard was not just a list; it was her lifeline.", "She carried it to the fridge, the bathroom, and even the dog’s water bowl. With every click of her pen and sharp checkmark, she seemed to be trying to tick the entire world into order. I followed her into the pantry when she went hunting for canned soup. I stood behind her, watching the six stapled pages flip. On the fourth page, there was a small, tight crease that she kept adjusting with her thumb.", "She turned to leave, but her hip checked the doorframe. The clipboard tilted.", "I saw the folded paper.", "The writing was shaky, different from her usual tidy capitals. It read: *Will the kids be okay? Will I be okay? Find the good pediatrician. Learn to make friends at forty-three.*", "She straightened up and hid the page against her chest. Her eyes darted to me, then to the shelves, then to the fossilized french fry I was holding.", "\"I'm getting the soup,\" she said. Her voice was tight, like a guitar string tuned too high.", "I didn’t say anything. I just handed her the fry. She took it, stared at it for a second, and put it in her pocket."], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["Saturday fifty-four was the garage fight.", "It happened exactly as it always did, with Tessa slamming the door so hard the dust shook loose from the rafters like a sneeze. Usually, I would retreat to my room, put in my earbuds, and pretend the silence on the other side of the wall didn't exist.", "This time, I sat down on the concrete floor.", "I heard the drumsticks. *Tap. Tap. Tap.* A slow, angry rhythm against the metal door, then nothing. I pressed my ear to the wood and heard a small, broken sound underneath the quiet. It wasn't quite a sob, more like someone trying to keep their voice trapped in their throat and failing.", "*Tap. Tap.*", "\"Go away,\" Tessa said. Her voice was thin and shaking.", "I didn't move or knock. I just sat there, listening to my sister fall apart in a room full of empty boxes. I realized she wasn't angry at me; she was angry at the future, and the Kettle Drums, and the door to tenth grade that she didn't know how to open.", "I stayed until her breathing slowed down, and the tapping started again, slower this time. I stayed until I couldn't stand it anymore."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["Saturday fifty-eight, I went to the tent.", "It was a fort built from moving blankets and broom handles, tucked into the corner of my room. Gus was inside, because he was always inside. It was his world, his safe place, the only part of the house that hadn't been packed into a box yet.", "I climbed in. It was warm and smelled like green plastic and old carpet.", "\"What are you scared of?\" I asked.", "Gus didn't roar. He just sat there, knees pulled up to his chest, the spiky tail of his costume twitching against the blanket.", "\"Does the new house have a room for a T. rex?\" he whispered.", "I looked at him. He was six, wearing a dinosaur suit in ninety-degree heat, asking if his armor would still fit.", "I looked down at my own hands. They were wrapped around my red hoodie, the one I wore every day even when it was too hot. I had been so busy trying to fix the day that I hadn't asked him if he was okay. I hadn't asked anyone.", "\"It does,\" I said. \"It has a whole lot of them.\"", "Gus nodded. He didn't look convinced. He looked like he was hoping I was lying, because a lie was better than the truth if the truth was that there was no room."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["Saturday sixty.", "I lay on my air mattress in the dark, staring at the bare ceiling that had watched me fail for sixty Saturdays in a row. I had spent a hundred and twenty hours, or maybe a thousand, trying to repair the day. I fixed the toast. I saved the boxes. I memorized the puns and the worries and the secrets. But every morning, the clock would cuckoo, and the room would go back to being empty.", "I realized I had been looking at the problem backwards. I thought I was the only one who was scared. I thought I was the only one who was losing something. But Dad was losing his friends. Mom was losing her life. Tessa was losing her band. Gus was losing his room.", "I was the only one who remembered the loss. The rest of them just kept losing it, over and over, without ever knowing they were losing it. And I couldn't tell them.", "I sat up, and the air mattress squeaked like a mouse in a sock drawer. So I did the only thing I could think of. I decided to fix them, too."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "The Fixer", "part": "PART THREE: OPERATION PERFECT SATURDAY", "paras": ["Saturday sixty-one started with a hug.", "I walked into the kitchen where Dad was fanning the smoke alarm, and I did not walk past him. I wrapped my arms around his middle, right over the cartoon fish apron. He froze. Then he hugged me back, hard enough to squeeze the air out of my lungs.", "\"Dad,\" I said. \"Tell me about Ohio.\"", "He blinked. \"What? I just told you about the book.\"", "\"No,\" I said. \"About this. The neighbors. The street. What you loved here before you started making puns to cover your nerves.\"", "He looked at me for a long time. Then he started talking. He talked for twenty minutes. He talked about the smell of cut grass in July and the way the light hit the cornfields at dusk. His eyes got shiny. He told me about the time he fixed Mr. Grady’s sprinkler and felt like a hero for about five seconds.", "At 6:47 the next morning, Gus roared in my face.", "Dad was in the kitchen, burning toast again. He looked at me with a blank, cheerful face. He did not remember the light. He did not remember the cornfields. He just made the anti-gravity pun.", "I went to Mom next. I made her pancakes and brought them to her bed with a list called NOTHING TO WORRY ABOUT. She cried happy tears.", "At 6:47, she was back to the clipboard."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["Saturdays sixty-two through sixty-six were for Tessa.", "I knew exactly what she was scared of. It was being a nobody in a new school. So I went to Jonah’s sister to borrow her drum kit. She said yes. Probably because I looked like I was about to cry. I didn’t argue when she asked why.", "On Saturday sixty-three, I carried the kit to Larkspur Park. My shoulders burned under the weight. It felt like carrying a full refrigerator of hot soup. I set it up by the big oak tree.", "I tapped on the snare drum until Tessa came out. She stopped. She looked at the drums. Then she looked at me.", "I just said, \"Play.\"", "She played for an hour. She hit the cymbals so hard the feathers on the snare drum flew into the grass. She smiled a big, real smile. It was the kind that crinkles the eyes.", "I watched from the fence. I felt like I had built a bridge out of nothing.", "Then 6:47 came.", "The drums were back in the box. Tessa was in her room. The smile had been packed away with the rest of the day."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["Saturday sixty-seven was the crash.", "I had spent six Saturdays preparing Tessa for the drums. I had organized the kit. I had timed the practice. I made sure the park was clear of squirrels.", "At 10:30, I walked into the garage. Tessa was standing in front of the box of posters. She looked at me. She did not see the drums. She did not see the park. She saw her brother, and she saw the fight we were about to have.", "She slammed the door.", "The bang shook the dust off the shelves. I stood there. The door was cold against my back. I could hear her breathing on the other side. It was fast and shallow.", "I realized then that I was not fixing anything. I was just refilling a bucket with a hole in the bottom. Every bit of happiness I poured in drained out at midnight. I was pouring and pouring and the bucket never filled.", "I sat down on the floor, my back against the door. The box of posters was next to me. I touched the edge of a poster. It was dusty.", "\"I can't do this again,\" I said to the door."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["Saturdays sixty-eight through seventy felt like running a marathon in a hallway.", "I was a butler, a cheerleader, and a therapist, all while being eleven. I snapped at Gus when his roar hit my eardrums at the wrong second. I snapped at Jonah when he thrust his laminated itinerary into my face. I snapped at Dad when he delivered the anti-gravity line for the hundredth time.", "\"Dad, please,\" I said on Saturday sixty-nine, holding my head in my hands. \"Just say, 'The toast is burnt.'\"", "He looked genuinely hurt. \"But Max, that's the joke.\"", "\"I don't care about the joke,\" I replied, and my voice came out sharp, like a wire being pulled tight.", "I looked around the kitchen. The house was quiet. I was the only one who was tired. I was the only one who was working. I was the only one who was unhappy.", "A cold shock hit me. The person running the Everyone's Happy program was the most miserable person in the room. I was spending all my energy making everyone else okay, and I was running on fumes.", "I wanted one thing back. I wanted to feel good. I wanted the feeling to be mine, not a service I provided to others."], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["Saturday seventy.", "I sat on the air mattress in the dark, staring at the bare white ceiling. I had fixed the toast. I had fixed the drums. I had fixed the hugs. But then the clock cuckooed, and all those fixes vanished.", "I started thinking about the worst possibility. It settled in my stomach like a heavy rock dropped down a well.", "Maybe the wish was a punishment.", "Maybe I was being taught a lesson. Perhaps the universe was showing me that I was the kind of person who wanted things to stay exactly the same. That I was selfish. That I was wrong to be angry about leaving. That I was the problem.", "It felt worse than being sad. It felt like being accused in court.", "I looked at the clock on the wall. It was dark, and the hands were stopped. I did not hear the bird. I just stared at the wood, waiting for the 6:47 roar that would tell me if I was wrong, or right, or just crazy.", "The next Saturday was the one I'm least proud of. I'll tell it fast."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "The Worst Dinner in the Universe", "part": "PART THREE: OPERATION PERFECT SATURDAY", "paras": ["Saturday seventy-one, 5:30. The pizza boxes lay open on the living room floor, the air thick with the smell of pepperoni and cardboard. We sat in a circle of paper plates.", "Dad was standing, which he only did when he was nervous. His hands flapped a little, like a bird trying to remember how to fly.", "\"To this house,\" he said. His voice cracked on the word *house*. He swallowed. \"It has been... a lot. A lot of boxes. A lot of moving. But I think it is the best house we have ever had, because it is the one we are leaving behind.\"", "He looked at Mom. She was crying, not the silent kind, but the loud, snotty kind. I had heard this toast seventy times. I had the words in my head. I knew the pause before \"cactus adventures.\" I knew the way he would wipe his eye with his thumb. I wanted to scream. I wanted to hit the wall. I wanted the floor to swallow me whole.", "\"To the future,\" Dad said, raising his slice. \"Which is mostly cactus, but full of adventure.\"", "\"Stop,\" I said. \"Please just stop talking.\""], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["My voice came out louder than I intended, bouncing off the bare walls until the room felt too small for all of us.", "Dad froze. His slice hung there, a long strand of cheese stretching from the tip like the elastic on a gym sock that is about to snap.", "\"What do you mean, stop?\" he asked.", "\"I mean stop,\" I said. \"Stop pretending. You can't fix it with words. You can't fix it with puns. Those things you say are pathetic. They do not make the moving truck go away.\"", "Mom’s hands slammed down on the edge of the pizza box. She stared at me with wide eyes, her pencil still tucked behind her ear, and the house went so quiet I could hear the refrigerator humming.", "\"Max,\" she said, and her voice was the kind of quiet that makes your knees feel like wet paper.", "\"I am not done,\" I said. \"Your lists don't work. I have checked. You have checked every single box, and we are still sad. You cannot put a checkmark next to 'not being scared.'\"", "I stood up, and my knees knocked into the table hard enough to rattle the plates. I didn't care. For one second I was taller than all of them. I was the one in charge. I was the one with the power, because I was the one who was right."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["I turned to Tessa. She sat cross-legged, a drumstick in her right hand, tapping it against her knee. *Tap, tap, tap.* The rhythm was steady, a machine gun of wood and impatience.", "\"And you,\" I said, pointing a finger at her. I aimed specifically at the purple streak in her hair. \"You think you are the only one who is scared. You think you are the only one who is going to fail.\"", "Tessa stopped tapping. The stick hovered in the air, frozen mid-beat.", "\"You are going to get to that new school,\" I continued, my voice climbing. \"And nobody is going to talk to you. They are going to wear headphones and look at their phones, ignoring everything around them. And you are going to sit in the bathroom and cry because you don't know how to be cool again. You know it is going to happen, don't you?\"", "The drumstick dropped. It hit the floor with a sharp *thwack* that sounded louder than it had any right to be.", "Tessa stared at me, her face draining of color. She didn't say anything. She just looked at me, and the silence between us felt thin and stretched, like the plastic wrap on a container of leftovers. I had seen that fear in her eyes every time she looked at the moving boxes. I had seen it clearly. And now I had thrown it back at her like a rock."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["Then I looked at Gus. He sat in his green T. rex costume, holding a slice of pizza that was mostly crust. His eyes were big behind the dinosaur hood, watching me.", "\"And it is a costume, Gus,\" I said, my voice shaking though I didn't care. \"It is just fabric. It doesn't protect anybody. It doesn't make you a dinosaur. You are just a kid in a suit who is going to have to sleep in a weird bed in a weird state.\"", "Gus’s lip trembled. It was a small, thin line inside the hood. He didn't roar. He didn't say a word. He just looked at me with a face I didn't recognize. It was a face of betrayal.", "Waffles whined. It was a low, sad sound. The dog put his head down between his paws.", "Mom was standing up. Her hand was on her mouth. She looked like she was going to be sick.", "I looked at all of them. I looked at the pizza. I looked at the bare walls. I was the worst person in the world. I knew it. I knew it in my bones.", "I ran."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["I skipped my room and headed straight for the garage. I climbed the ladder to the roof, where the air felt cool against my sweaty hoodie and the stars were scattered across the dark sky like dropped sugar. I sat on the shingles and buried my face in my hands, waiting for the clock to strike and the world to reset. I wanted to wake up with them having forgotten. I wanted to be the good brother, the funny one, the one who actually laughed at Dad's terrible jokes.", "Footsteps crunched on the porch gravel.", "\"Max?\"", "It was Mom. She stood at the garage door, looking up at me. She wasn't yelling, and she wasn't angry. She just looked exhausted, her pencil still tucked behind her ear.", "\"I don't know what happened tonight,\" she said, her voice soft and quiet. \"But I love you.\"", "I wanted to tell her I loved her back. I wanted to apologize for being terrible. I wanted to fix everything. But before I could get a word out, a loud, angry roar came from inside the house.", "\"RAAAAWR.\"", "I blinked, my head still resting on my knees. The stars had vanished, replaced by a grey morning light.", "I was lying in my bed. Gus was sitting on my chest.", "\"RAAAAWR,\" he said.", "I looked at the clock on the wall. It read 6:47.", "I realized then that you can't say sorry to someone who never heard you be awful. I found that out exactly seven seconds after the worst night of my life."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "Grandma Bea and the Peach", "part": "PART THREE: OPERATION PERFECT SATURDAY", "paras": ["At 6:47, the dinosaur climbed on my chest.", "\"RAAAAWR,\" he said.", "I did not move. I kept my eyes shut and lay there with my arms stiff at my sides, breathing slow and pretending I was a statue made of heavy, tired stone. Gus roared again, closer this time. He nudged my nose with his snout, which smelled like green plastic and old laundry.", "\"Max. Wake up. It is Saturday.\"", "\"I'm listening,\" I whispered.", "He climbed off and stood on the floor, looking up at me with one eye, confused, like a dog who has dropped a stick and lost interest. He left.", "I got up and pulled my hood over my head, the strings dangling like dead vines. I walked to the garage, where the air was cool against my face. Waffles was waiting by the door. He did not bark or steal. Instead, he trotted to my feet, lay down, and rested his chin on his paws. He watched me with a look that said, *I am here. You can be sad. I will not fix it.*", "It was the first comfort I had ever received that did not come with a string attached."], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["At 1:15, the green Buick pulled into the driveway, and the horn played a tune that sounded like a tuba having a severe hiccup.", "Grandma Bea stepped out. She was tiny, wearing big round sunglasses and red lipstick that looked painted on with a marker. In her hands, she carried a laundry basket. Inside the basket sat the cuckoo clock.", "I followed her into the house. She walked fast, her gold bangles jingling against her wrist like a bag of loose change
