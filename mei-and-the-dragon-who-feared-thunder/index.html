eeded, not yet. They were children, in a way. Making a promise in the dark, where it felt safer.", "Mei took a breath. \"I will say the words,\" she said. \"When it matters. I will say them aloud, for everyone to hear.\"", "Yun nodded. His amber eyes were bright, not with water, but with light. \"And I will make a thunder,\" he said. \"A real one. When the time comes.\"", "They did not say they were not afraid. They did not promise it would be easy. The pearl under his chin glowed a little brighter, a soft, hopeful silver. Above them, a single, small cloud drifted across the stars, moving slowly, like a ship on a dark sea."], "img": "img/p070.jpg"}, {"no": 71, "ch": 15, "ctitle": "The Long Way Down", "part": "PART THREE: THE DRAGON", "paras": ["*Days without rain: 120. Buckets from the spring: 6.*", "The sun cleared the rim of Black Pool just as Hua unfolded her maps. She checked the compass, then checked it again, because the needle had a habit of wobbling when she was nervous.", "\"Twelve hours of daylight,\" she said briskly, folding the paper with sharp, precise corners. \"The way down is faster. Gravity helps.\"", "Tao immediately picked up the empty bamboo tea tube Nainai had given them. It was light, but he held it with both hands like it was made of gold. \"I will carry the weight,\" he announced. \"For balance.\"", "Yun looked at the steep slope below them, then at the children, and finally at the sky. \"I suppose I should go,\" he said, his voice trembling slightly. \"But perhaps I should make a list of things that might go wrong. One. The slope is steep. Two. I am a dragon. Three. I might slip.\"", "He paused, thinking. \"Four. I might startle the birds. Five. The birds might startle me.\"", "Mei watched him worry. She pressed her thumb into her palm. \"Yun,\" she said softly. \"You can walk behind us. You do not have to be seen.\""], "img": "img/p071.jpg"}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["Yun tried to be small, quiet, and invisible, which was a difficult ask for a creature with a pale gold belly and antlers that brushed the clouds.", "Instead, he folded himself into a low cloud. Or nearly. He draped himself along the mountainside, becoming a long, slow ribbon of grey-white mist that trailed behind the children as they took the first few steps of the Cloud Ladder.", "It was not a very good disguise. A tail kept peeking out, curling around a rock with the casual confidence of a housecat claiming a sunny spot. Tao waved at it.", "\"Hello, tail,\" Tao said.", "Yun froze. He squeezed his eyes shut and twisted his mist into the shape of a large, jagged boulder, holding perfectly still while waiting for them to walk past.", "\"Look,\" Hua said, pointing. \"That rock has a tail.\"", "Tao grinned. \"It’s shy.\"", "Yun did not move. He was absolutely not a rock. He was a dragon, pretending to be a rock, and he could feel his own heartbeat thumping against the stones of the mountain, loud as a drum in an empty room."], "img": "img/p072.jpg"}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["The mist thickened until the world became a soft, white blur, and the children held hands in a tight chain of fingers and small arms. Yun’s voice came through the fog, very softly, as he apologized to a stone step for stepping on it.", "Hua narrated the map in her head, deciding on left, then straight, and then, hopefully, down. Mei counted her breaths, in for four and out for four, which kept her grounded and her voice tucked safely inside her throat.", "Tao counted the stairs, landing on forty, then fifty, then sixty, with a different answer every time. Nobody minded the wrong numbers. The holding mattered more than the counting, and the mist curled around their ankles like a cool, wet hand, guiding them gently down toward the foot of the ladder."], "img": "img/p073.jpg"}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["At the foot of the ladder, the air smelled of damp earth and old leaves. Under the same bamboo where they had left him on the way up, Old Grey was waiting.", "He was chewing calmly, his wide curved horns catching the light. A small brass bell around his neck gave a single, clear *ting* as he shifted his weight.", "The buffalo looked past the children. He looked at the fog. He looked at the long, green shape moving slowly through the mist behind them.", "He did not move a single whisker. He did not snort. He simply chewed, his eyes soft and brown and ancient.", "\"He is not surprised,\" said Hua, wiping sweat from her forehead.", "\"He is a buffalo,\" said Tao, patting Old Grey’s leg. \"Nothing surprises him. Not even dragons.\"", "Old Grey blinked slowly. He seemed to be thinking about this, and then he decided it was not worth discussing."], "img": "img/p074.jpg"}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["Mei tightened the straps of her pack, while Tao cradled Nainai’s tea tube in both arms as if it were a sleeping baby. Hua stepped forward to take the lead, her red jacket bright against the grey stone, and for once her steps were quick and steady.", "They began the walk toward the bridge. Behind them, the mist trailed down the slope like a long, silent river of cloud, moving with them, patient and steady, keeping its distance but never leaving.", "Far below, at the bottom of the valley, the tile roofs of Bamboo Ridge looked small and brown and dry. They resembled the backs of sleeping turtles, huddled together in the dry heat.", "Mei stopped and looked up. Above the trees, blocking out the pale sun, a single dark cloud had begun to gather over the little stone shrine. It was heavy. It was full. It was waiting for a knock."], "img": "img/p075.jpg"}, {"no": 76, "ch": 16, "ctitle": "The Bridge, Again", "part": "PART FOUR: THUNDER", "paras": ["*Days without rain: 120. Buckets from the spring: 6.*", "The gorge opened ahead of them, a deep grey throat in the mountain. The bridge was just a few planks and ropes, swaying gently in the wind. Hua stopped at the very edge, her hands gripping the wooden railing until her knuckles turned white.", "\"I am going to cross first,\" she said. Her voice was loud and clear, the exact tone she used when reading out the class report in the front row. \"It is the correct procedure.\"", "Then she paused. Her shoulders hunched, and her voice dropped to a whisper, barely louder than the rustle of a leaf. \"Will you both count with me?\"", "\"One,\" said Tao.", "\"Two,\" said Mei.", "Hua stepped onto the first plank. It creaked. She did not look down, and she did not look at the map in her hand. Her yellow ribbon trembled in the air, shaking with every small step she took. She reached the other side, where the solid rock waited, and only then did she release the air she had been holding, a long, shuddering sound like a pinhole popping."], "img": "img/p076.jpg"}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["Mei followed next, keeping her eyes on the planks ahead. Then came Tao, his yellow boots slapping softly against the wood. Old Grey followed last, his wide horns scraping the air with a dull scrape, and his small brass bell rang a steady, patient tune. *Clank. Clank. Clank.*", "The mist gathered at the edge of the gorge and stopped, piling up against the rocks like a thick, white blanket. Then, a large green shape appeared. It peered over the edge, pulled back quickly, and peered again.", "Yun the dragon blinked his large amber eyes. He looked at the bridge, then at the children, then at the bridge again.", "\"This bridge,\" he said, his voice soft and worried, \"is far too small for a dragon.\"", "Hua shook her head, her hair swinging. \"You do not have to walk it,\" she said.", "Yun shifted his weight, his long body coiling slightly. \"I do not have to fly it either,\" he admitted. \"But I would like to be sure I know how.\""], "img": "img/p077.jpg"}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["Yun took a deep breath. The mist around him swirled faster, curling tight against his scales. Then, with a tremendous whooshing sound, he lifted off the ground. He rose into the air, awkward at first, then smoothly, a long river of green moving against the grey sky. For one heartbeat, he was beautiful, his pale gold belly catching the faint light.", "Then he looked down.", "The gorge yawned beneath him, deep and silent. His antlers began to vibrate. A low rumble built up in his throat, a sound like a rock rolling down a hillside. Before he could stop it, it slipped out in a startled hiccup.", "*BUM.*", "The sound echoed off both walls, bouncing back and forth, louder and louder. The children shouted with delight, clapping their hands. Yun looked down at them, his face turning a darker shade of green.", "\"I am sorry,\" he called out to the empty air. \"I am very sorry, Gorge.\""], "img": "img/p078.jpg"}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["They came down out of the bamboo forest at last, stepping onto the dry, grey stones of the stream bed. The air was still, heavy with the smell of dust and old leaves. The children looked out over the valley.", "Bamboo Ridge was small and grey in the distance. But they were not alone.", "People. All of them. The whole village was gathered at the little stone shrine, standing in the last of the evening light. Their faces were turned toward the mountain, toward the path, toward them. Uncle Shi stood at the front, his battered steel thermos gleaming in the pale sun. Nainai was there too, leaning on her bamboo walking stick, her grey bun sharp against the sky.", "Mei pressed her thumb into her palm. The sound of nothing was gone. Instead, there was the sound of waiting."], "img": "img/p079.jpg"}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["Tao was the first to move. He did not wait. He ran. He ran down the stream bed, his boots slapping against the stones, a bright yellow streak against the grey dust. He reached Nainai, who opened her arms wide, and he crashed into her, laughing.", "Mei stopped halfway down the slope. Her feet felt heavy. Behind her, the mist had thickened, pooling among the bamboo like a white sea. She could feel the silence there, thick and still, the quiet of a rain that was refusing to fall.", "She turned and whispered into the white air. \"You can wait here for a minute.\"", "From the mist, an anxious voice drifted down the slope. \"I shall be very quiet. I shall be so quiet you will not know I am here.\""], "img": "img/p080.jpg"}, {"no": 81, "ch": 17, "ctitle": "The Whole Village Listens", "part": "PART FOUR: THUNDER", "paras": ["*Days without rain: 120. Buckets from the spring: 6.*", "Nainai’s arms came up around them both, squeezing the air out of Mei’s lungs. Her bamboo walking stick clattered onto the stone path and rolled away into the grass. Tao laughed, a bright, shaky sound, and Mei felt her own chest unclench.", "Uncle Shi stepped forward, his steel thermos swinging slightly. He looked tired, his blue cap askew. \"You found the pool?\" he asked. His voice was rough, scraped raw by dust.", "Yeye Gu leaned on his cane, his cloudy eyes bright. \"And the dragon?\"", "The crowd stopped breathing. A hundred faces turned toward Mei. They waited. The silence hung there, thick and still, like the air inside a jar just before a lid is twisted on. Mei felt her thumb dig into the soft skin of her palm, leaving a small, white crescent.", "Hua nudged her elbow. It was a small, sharp jab. \"You have to say it,\" Hua whispered. Her eyes were wide, but her voice was steady. \"They are listening.\""], "img": "img/p081.jpg"}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["Mei climbed onto the low stone wall of the shrine, the cool stone pressing against her cloth shoes. Below her, the crowd stretched out wide, a sea of faces all tilted upward, waiting for water. Her mind went white, a blank sheet of paper bright and blinding in the sun. She pressed her thumb harder into her palm until the pain became a solid place to stand.", "She thought of the bridge planks swaying under her feet, and of Yun hiding behind a rock, apologizing to the mud. She thought of the sneeze he could not let out, stuck inside him like a bubble in a straw.", "Mei breathed in for four counts. One, two, three, four. She held it, then let it go.", "\"The dragon is real,\" she said.", "Her voice shook, thin and fragile, but it carried. It drifted out over the crowd, clear and quiet.", "\"His name is Yun. And he is afraid.\""], "img": "img/p082.jpg"}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["She laid it all out, step by step, keeping her eyes locked on the wide, grey bed of the dry stream. She described the pool, cracked and brittle like an old plate left in the sun. She told them about the pearl resting under his chin, heavy with a rain that refused to fall.", "Then came the baby, a century gone. The screaming. The running. The fear that had settled into Yun’s bones and stayed there, refusing to move.", "\"He cannot bring the rain,\" Mei said, her voice still shaking. \"Because the rain starts with thunder. And he is too afraid to make it.\"", "A low murmur rolled through the crowd, sounding like wind moving through bamboo. People turned to look at one another, some shrugging, others frowning with confusion.", "Mei’s throat felt tight. She braced herself for the anger, the disappointment. She waited for them to dismiss it as a mistake, or a child’s fancy.", "Instead, the rustling stopped. The silence returned, but it was different now. It was not empty. It was full of thought."], "img": "img/p083.jpg"}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["Uncle Shi adjusted his cap, then looked at Mei, then at the pale sky, then back at Mei again. \"A dragon who is afraid of thunder,\" he said, his voice careful and thin. \"That is not the kind of dragon I was expecting.\"", "Someone in the back let out a short, nervous bark of a laugh. It broke the tension like a cracker.", "Yeye Gu nodded slowly, his cloudy eyes bright. \"It is exactly the kind of dragon I remembered,\" he said. \"They are kind creatures. They worry too much.\"", "Auntie Fen, still in her purple apron with a single strand of hair escaping her bun, raised her hand. \"But how,\" she asked, \"does one greet a thunder? Do we bow? Do we hide?\"", "Mei stood up straighter. She looked down at her hands. They were still.", "\"No,\" she said, keeping her voice low and steady. \"We do not hide. We do not cover our ears.\"", "She looked out at the crowd. \"We answer him. With drums. With our voices. We tell him, 'We are here.'\""], "img": "img/p084.jpg"}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["A long silence stretched out. It was not the silence of disappointment. It was the silence of people counting, thinking, finding a way.", "Then Teacher Luo, with her red scarf, raised her hand. \"The school has a drum,\" she said. \"It is used for the morning bell. It is quite loud.\"", "\"The shop has three pots,\" Auntie Fen added. \"And two bowls that do not match.\"", "A low rumble went through the crowd, not from the sky, but from the ground. Old Grey, the water buffalo, stood near the shrine. He shook his head, and his small brass bell rang out, clear and bright.", "Uncle Shi screwed the lid onto his thermos. He looked up at the pale, empty sky.", "\"Well,\" he said. \"It is better than nothing.\"", "Nainai caught Mei’s eye across the crowd. Her face was soft, bright, and steady. It was like a lamp lit in a dark room."], "img": "img/p085.jpg"}, {"no": 86, "ch": 18, "ctitle": "The Answer", "part": "PART FOUR: THUNDER", "paras": ["*Days without rain: 120. Buckets from the spring: 6.*", "Dusk settled over the shrine yard, turning the stone steps violet and grey. The village did not wait for the dark.", "Teacher Luo, her red scarf tied tight against the chill, hoisted the heavy wooden drum onto a low stool. She tapped the skin with a mallet. *Thoom.* It was deep and round, vibrating right through the soles of everyone’s shoes.", "Auntie Fen emerged from the shop with a basket of mismatched pots. “One for the left side,” she instructed, handing a brass ladle to a farmer. “Two for the right. Do not let them touch.”", "The children formed a semicircle. Hua stood on a wooden bench, her yellow ribbon bright against the twilight. She pointed to groups with the calm authority of a class monitor who had finally found a room large enough for her energy. “Group one, clap on the beat. Group two, shake the spoons on the off-beat.”", "Tao stood in the center, holding a thick drumstick. He looked at the stick. Then at the drum. Then at his boots. His face was solemn, as if he were about to sign a treaty rather than make noise.", "He raised the stick.", "*Crack.*", "The sound was sharp and sudden. It sent a startle through the nearby sparrows, who scattered into the violet air like a handful of thrown seeds."], "img": "img/p086.jpg"}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["The stars appeared one by one, first faint, then bright, until the sky was a scattering of cold fire. The air was still, holding its breath.", "Yeye Gu leaned on his cane, his long white eyebrows rising in the moonlight. “Today is the second day of the second month,” he said, his voice thin but clear. “The day the dragon raises his head. We do not ask. We wait.”", "Nainai took the bamboo stick out of her jacket. She did not cut a notch. Instead, she touched the last one she had made that morning, her fingers lingering on the rough edge. “Water finds a way,” she murmured, more to herself than the crowd. “Sometimes it needs help finding the way.”", "Everyone turned their faces upward, toward the dark tree line where the bamboo stood silent and rigid.", "Mei stepped to the edge of the yard. Her throat felt tight, a knot of dry cotton. She looked at the dark shapes of the trees, then at the empty space above them. She whispered, her voice barely a breath in the cool night air.", "“Yun? Everyone is ready.”"], "img": "img/p087.jpg"}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["A rustle moved through the tall stalks, a sound like dry paper turning. Then, slowly, a long green coil rose out of the bamboo grove. It was slender and graceful, pale gold scales catching the light from the lanterns strung along the shrine. Mist curled around his neck like a soft scarf.", "The villagers gasped, a collective intake of breath that seemed to suck the air out of the yard. Then they went very still. No one screamed. No one ran. The quiet was so complete it felt like someone had put a lid on the world. The scent of wet earth and pine hung in the air, sharp and clean.", "Yeye Gu took off his old cloth cap and held it to his chest. He bowed his head, not in fear, but in recognition.", "A small child, standing near the front, tilted her head and said, out loud and clear, “He is so pretty.”", "Yun stopped. His large amber eyes blinked, wide and wet. He looked down at the hundred faces below, and his body froze, trembling slightly in the cool night air."], "img": "img/p088.jpg"}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["Yun rose higher, his long body curving above the shrine until he hung like a green question mark over the tile roofs. He reached into a small, dark cloud gathered overhead, and the pearl under his chin began to glow with a soft, pulsing light that grew brighter with every second.", "Mei watched the tension pull tight in his neck, her eyes tracking the way his whiskers twitched. His whole body trembled, a fine vibration running from his head to the tip of his tail, just like when Tao tried to hold in a sneeze during story time. He was holding it in. The rain. The thunder. The storm. All of it trapped inside him, heavy as a bucket of water he was afraid to spill.", "In the stillness, a man near the back raised his hands halfway toward his ears. It was a small, unconscious gesture, but in the quiet yard, it felt like a door closing.", "Mei pressed her thumb hard into the middle of her palm. The sharp pain cut through the fear, grounding her in her own skin. She looked at the man, then back at the dragon, whose eyes were closed tight against the coming sound."], "img": "img/p089.jpg"}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["Mei stepped into the empty space before the shrine, the cool earth pressing against the soles of her cloth shoes as a hundred pairs of eyes settled on her, heavy and warm, while the air in her chest felt packed tight like a box of books. She breathed in for four counts, held it, and let it go slowly.", "Her mouth opened, and the words were there, waiting, small and fragile, but she pushed them out, not as a whisper, but as a real sound.", "“Yun!”", "The village went silent, drumsticks paused mid-air, and spoons stopped their shaking.", "The dragon opened his eyes, wide and amber, holding a hope so fragile it looked ready to break, and he watched her, waiting.", "Mei took another breath, her voice steady, even though her hands were shaking.", "“We are here.”"], "img": "img/p090.jpg"}, {"no": 91, "ch": 19, "ctitle": "Thunder", "part": "PART FOUR: THUNDER", "paras": ["*Days without rain: 120 (until tonight).*", "The cloud above the shrine did not sit. It boiled and churned, a grey-green mess that looked like water trying to escape a pot. Yun’s long body trembled beneath it, the mist wrapping around him like a scarf he was afraid to remove. Under his chin, the pearl glowed with a heavy, white light that seemed to hum.", "Mei stood in the center of the yard. Her hands shook, but her feet stayed planted on the dirt. She looked up at the dragon, then around at the waiting village. She did not ask for permission. She counted. One. Two. Three. Four.", "She raised her voice. It was not a whisper. It was a clear, steady note.", "\"Out for four.\"", "Beside her, Tao lifted his wooden drumstick. Hua raised her hand, her fingers stiff but ready. Nainai’s bamboo stick thumped once on the ground, a sharp, solid sound. The man with the spoon lowered his hands from his ears. He lifted the spoon instead. The air held its breath."], "img": "img/p091.jpg"}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["Yun opened his mouth.", "The sound that came out was not a bang. It was a roll. It started low, deep in his chest, and then it climbed. It rolled across the terraces, down the valley, and back up the mountain. It rattled the tiles on the roofs and shook the pots hanging in the kitchens. Every hair on every head stood up.", "It was enormous. It was joyful.", "It felt like the whole sky clearing its throat. It felt like a giant laughing. The sound did not hurt. It did not scare. It hummed warm against the skin, the way a bee hums near a flower, but much, much bigger. It was the sound of a door opening. The sound of a long silence breaking. It was the most beautiful noise Mei had ever heard."], "img": "img/p092.jpg"}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["For a second, the village was silent.", "Then Uncle Shi lifted his steel thermos and banged it against the stone shrine. *Clang.*", "The school drum boomed. *Boom.*", "Pots from every window clanged together. Spoons rattled on bowls. Children shouted, their voices high and bright. Old Grey, the water buffalo, looked up and rang his small brass bell. *Ding.*", "Uncle Shi’s eyes were wet. Tears ran down his round cheeks. He shouted, \"We are here!\"", "And a hundred voices shouted it back.", "\"We are here!\"", "The sound went up to the cloud. It went up to the dragon. Yun’s whiskers stood straight out. His amber eyes were wide. He looked less like a creature of the sky and more like a boy who had just been told he was not alone."], "img": "img/p093.jpg"}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["The first drop hit the red dust. It made a tiny dark star in the dirt, right next to Tao’s boot.", "Then ten. Then a hundred. The smell rose up from the ground. It was warm and dusty and sweet, like the inside of a cupboard that has been shut too long. It was the smell of earth breathing out. It was the smell of rice leaves uncurling. It was the end of the long, dry wait.", "Tao did not hesitate. He stomped into the first puddle. His yellow rain boots splashed with a loud *thwup*.", "\"Yes!\" he shouted, his face bright. \"Finally useful!\"", "He jumped again. The water soaked the green tiger on his shirt, but he did not care. He was laughing. The rain came down on the terraces, on the cracked stream bed, on the upturned faces of the village. It was cold, and it was wet, and it was perfect."], "img": "img/p094.jpg"}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["Nainai walked to the center of the yard. Her knees were stiff, but her back was straight. She lifted her face to the rain. She closed her eyes. She laughed. It was a short, bright laugh, the kind a girl uses when she is surprised by a gift.", "She took the bamboo stick out of her jacket. She held it up to the light. Then, very solemnly, she put it back. She cut no notch.", "\"Water finds a way,\" she said softly.", "Mei stood in the rain, soaked to the skin. She was shaking with cold and joy. She looked up at the dragon, who was hovering close, his pearl dimming as the rain filled the air.", "\"Thank you, Yun,\" Mei said. It was the biggest sentence she had ever said.", "Overhead, softly, a dragon answered.", "\"Thank you, Mei.\""], "img": "img/p095.jpg"}, {"no": 96, "ch": 20, "ctitle": "Grain Rain", "part": "PART FOUR: THUNDER", "paras": ["*Days without rain: 0. Buckets from the spring: more than anyone can count.*", "The rain had not stopped, but it had quietly lowered its voice. By morning, the dry stream had turned into a chattering brown river, splashing over stones it had not touched in four months. The frogs in the terraces were singing so loudly that Tao sat up in bed, clutching his pillow to his chest.", "\"It is too early for music,\" he complained.", "\"It is not music,\" said Mei. \"It is relief.\"", "Nainai stood by the window, holding the bamboo stick. Instead of cutting a notch on the dry end, she had cut one on the other side. One new mark. One day with rain.", "Mei walked to the signal rock. The stone was warm against her skin. She held up the phone, and one bar became two, and the voice from the city came through, clear and close.", "\"Mei, are you there?\" Mama’s voice was soft. \"We saw the news. The water is back. We are so proud.\"", "Mei pressed her thumb into her palm. She did not let it tremble.", "\"Yes,\" she said. \"It rained. The dragon came. He was scared, but he did it. And I told him what to do.\"", "There was a pause. Then Mama said, \"Say it again.\""], "img": "img/p096.jpg"}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["A month later, on the day of Grain Rain, when people in the south pick tea, the village smelled of wet earth and fresh leaves. The paddies were full, reflecting the sky like broken mirrors. The rice seedlings stood straight and bright, no longer yellow, but a fierce, hopeful green.", "Old Grey the buffalo ploughed in his slow, calm circles, his brass bell ringing a lazy, heavy song. The tea bushes had burst with new shoots, small and tender.", "Hua walked the rows in her red jacket, a clipboard tucked under her arm. She was explaining the difference between the first flush and the second to a group of neighbors.", "\"It is the flavor,\" she said, tapping a leaf. \"You do not have to be right to be here. You just have to be curious.\"", "Auntie Fen, in her purple apron, laughed and picked a leaf. \"Curious,\" she repeated. \"I am curious about lunch.\"", "Hua smiled. She did not correct her. She simply picked a leaf and handed it over."], "img": "img/p097.jpg"}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["Nainai sat at the kitchen table with a small pair of silver scissors, while Mei sat opposite with her head tilted back, trusting her grandmother’s steady hands.", "\"Dragon Head luck,\" Nainai said, her voice soft. \"A little late, but better than never.\"", "The scissors snipped. A small piece of black hair fell onto the wooden surface. Then another. Nainai was quiet and careful, trimming the bangs that had grown long enough to blur Mei’s vision behind her eyes.", "\"Done,\" Nainai said. She set the scissors down on the table.", "Mei blinked, and the room became clearer. She could see the grain of the wood and the dust motes dancing in the sunbeam, and the warm curve of Nainai’s smile. She also saw Tao by the door, his yellow rain boots shining bright in the light.", "\"You do not have to speak louder,\" Nainai said gently. \"Just where people can hear you.\"", "Mei looked at the notched stick on the wall. There was one mark on the dry side and one on the wet side, and that was enough for now."], "img": "img/p098.jpg"}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["The school bell rang, a single clear note that hung in the air. Teacher Luo adjusted her red scarf and scanned the room.", "\"Who would like to read the report on the rain?\" she asked. \"We want to share what happened in our village.\"", "Twenty hands stayed tucked in laps, and twenty pairs of eyes drifted to the floor, the window, or the dust motes.", "Mei’s hand went up.", "It was a small movement, though her thumb pressed hard into her palm. She stood, and her knees felt like they had been made of bamboo.", "\"I read it,\" she said. Her voice was thin and shook, but it did not break.", "She read the words about the dragon, his fear, and the rain. When she finished, she sat down. Nobody coughed, and nobody looked away.", "Hua leaned over. \"Sentences are not that hard,\" she whispered, then added, softer, \"Sorry.\"", "Mei looked at her. \"They are, a little.\"", "They both grinned."], "img": "img/p099.jpg"}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["Every dawn now, if you know where to look, a long green shape drifts over Bamboo Ridge. It moves through the mist above the shrine, checking the terraces, checking the water. It is careful. It is polite.", "Sometimes, when the air is very still, a small rumble rolls around the valley. It is not loud. It is a knock. A gentle, heavy knock on the door of the world.", "And every time, somewhere in the village, a child hears it. They find a pot and a spoon. They do not wait for permission. They drum on the metal, a bright, sharp rhythm that echoes off the tile roofs.", "\"We are here,\" they shout.", "Mei does too. She stands in the yard, her thumb in her palm, her voice steady in the wet morning air. The mist curls around her like a scarf, and the rain, when it comes, comes gently."], "img": "img/p100.jpg"}], "chapters": [{"n": 1, "title": "The Sound of Nothing", "part": "PART ONE: DRY", "page": 1}, {"n": 2, "title": "The Girl Who Could Not Speak Up", "part": "PART ONE: DRY", "page": 6}, {"n": 3, "title": "The Rain-Asking", "part": "PART ONE: DRY", "page": 11}, {"n": 4, "title": "The Old Story", "part": "PART ONE: DRY", "page": 16}, {"n": 5, "title": "The Meeting", "part": "PART ONE: DRY", "page": 21}, {"n": 6, "title": "Nainai's Rules", "part": "PART TWO: THE MOUNTAIN", "page": 26}, {"n": 7, "title": "The Bamboo Path", "part": "PART TWO: THE MOUNTAIN", "page": 31}, {"n": 8, "title": "The Bridge", "part": "PART TWO: THE MOUNTAIN", "page": 36}, {"n": 9, "title": "The Cloud Ladder", "part": "PART TWO: THE MOUNTAIN", "page": 41}, {"n": 10, "title": "Black Pool", "part": "PART TWO: THE MOUNTAIN", "page": 46}, {"n": 11, "title": "The Dragon Who Said Sorry", "part": "PART THREE: THE DRAGON", "page": 51}, {"n": 12, "title": "Things That Could Go Wrong", "part": "PART THREE: THE DRAGON", "page": 56}, {"n": 13, "title": "Small Thunders", "part": "PART THREE: THE DRAGON", "page": 61}, {"n": 14, "title": "Mei's Secret", "part": "PART THREE: THE DRAGON", "page": 66}, {"n": 15, "title": "The Long Way Down", "part": "PART THREE: THE DRAGON", "page": 71}, {"n": 16, "title": "The Bridge, Again", "part": "PART FOUR: THUNDER", "page": 76}, {"n": 17, "title": "The Whole Village Listens", "part": "PART FOUR: THUNDER", "page": 81}, {"n": 18, "title": "The Answer", "part": "PART FOUR: THUNDER", "page": 86}, {"n": 19, "title": "Thunder", "part": "PART FOUR: THUNDER", "page": 91}, {"n": 20, "title": "Grain Rain", "part": "PART FOUR: THUNDER", "page": 96}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${first?'center':(p.no%2?'f-right':'f-left')}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
