<script>
const D = {"title": "Mei and the Dragon Who Feared Thunder", "sub": "One Dry Spring, One Shy Dragon and One Very Small Voice", "pages": [{"no": 1, "ch": 1, "ctitle": "The Sound of Nothing", "part": "PART ONE: DRY", "paras": ["*Days without rain: 114. Buckets from the spring: 14.*", "On the morning of the hundred-and-fourteenth dry day, Mei woke to the sound of nothing. It was a very particular nothing. It was the sound of a roof that expected rain and was, once again, disappointed.", "Her grandmother was already up, cutting a notch in the bamboo stick that hung by the kitchen door. Nainai (which is what you call your father's mother) cut one notch every morning, and the stick was now so covered in them it looked like a tiny fence. Nainai was small and straight-backed, with grey hair pinned in a bun and a dark blue jacket with cloth knots for buttons, and she cut each notch the way other people close a door: firmly, without slamming.", "\"Hundred and fourteen,\" she said.", "\"I know,\" said Mei, who had been counting too.", "Mei was eleven, small for it, with two short black braids tied with red string and a nose that had gone brown from a whole spring of squinting at an empty sky. Her name meant plum blossom, the flower that opens in the snow when nothing else dares. She had never thought it fit her very well."], "img": "img/p001.jpg"}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["Tao clumped in next, in his yellow rain boots. Tao was seven, round-faced and gap-toothed, and he had worn those boots every single day since the drought began.", "\"For luck,\" he said, before anyone asked. Nobody had asked for a hundred and fourteen days.", "\"They are making the floor wet,\" said Nainai, which was a joke, because the floor had not been wet since New Year, and Tao laughed so hard he had to sit down on the step.", "Breakfast was noodles, and not ordinary ones. Nainai had pulled them so thin they hung from the chopsticks like white hair. Dragon's-whisker noodles, she called them, and she always made them at this time of year, because in six days it would be the second day of the second month, when the old people say the dragon raises his head. That was when he was supposed to wake from his long winter sleep, and the rain was supposed to follow.", "\"Some dragon,\" said Tao, slurping.", "Nainai looked at the pale window. \"Slurp quietly,\" she said. \"He may be listening.\""], "img": "img/p002.jpg"}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["After breakfast Mei took her small bamboo pole across her shoulders, a bucket hanging from each end, and walked to the spring. Every household in Bamboo Ridge Village did the same, twice a day, and the path had been worn smooth by feet and pails and patience.", "It followed the stream, or what used to be the stream. Now it was a wide road of grey stones, dry as bones, with a few white dragonfly wings pressed into the mud like pages in a book. Tao trotted alongside it, counting frogs.", "\"Zero,\" he reported. \"Zero. Zero. Oh! No. A stick.\"", "The spring was tucked beside the little stone Dragon King shrine, where the mountain still let out a thin, thoughtful trickle of water. A line of neighbors waited there, each with a pole and a pair of buckets, and nobody was talking much. They were being polite in the special way people are polite when they are worried: passing the ladle, saying \"after you\", and not looking at how little was in the rock pool.", "Mei took her place at the end of the line. A bucket, she had learned, filled slowly when you were watching it."], "img": "img/p003.jpg"}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["From the spring you could see all of Bamboo Ridge climbing the hill in steps: the terraces, the tile roofs, the tea bushes in their neat green rows. Up the slope, in the seedling beds where the rice was supposed to be growing tall and bright, the plants had gone the colour of old straw. Even the tea leaves curled up at the edges, brittle as paper.", "Uncle Shi, the village head, was standing at the top bed with his battered steel thermos. He was a round, tired man in a grey jacket and a blue cap, and he worried on behalf of the whole village, which is an enormous job for one person. As Mei watched, he unscrewed the lid of his thermos, looked at the little yellow seedlings, and very carefully poured a thin stream of his own tea on them.", "Then he seemed to realize what he was doing. He stood there with the empty thermos, and even from far away Mei could see the embarrassment go right through him.", "She thought it was the saddest present she had ever seen anyone give."], "img": "img/p004.jpg"}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["They got home with fourteen buckets between them for the day, which was exactly enough and not one drop more. Mei set down her pole and pressed her thumb into the middle of her palm, the way she did when something sat too heavily on her chest. She did not know she did it. Everyone else did.", "\"Is the dragon even real?\" asked Tao, pulling off one boot to check whether it was still yellow inside. It was.", "Mei opened her mouth to say she did not know, and the words went somewhere she could not follow. She shut it again.", "Nainai was wringing out a cloth over the smallest bucket, catching every drop. \"Water finds a way,\" she said, without looking up. \"Sometimes it needs help finding the way.\"", "She said it lightly, the way you say something you have said many times, and hoped it was true. Mei looked out of the window at the wide, pale blue sky over the mountain, and searched all of it, from one side to the other, for a single cloud.", "There was not one."], "img": "img/p005.jpg"}, {"no": 6, "ch": 2, "ctitle": "The Girl Who Could Not Speak Up", "part": "PART ONE: DRY", "paras": ["*Days without rain: 115. Buckets from the spring: 13.*", "The schoolroom smelled of chalk dust and dried ink. Twenty children sat on wooden benches, legs swinging or still. Teacher Luo, a young woman with round glasses and a bright red scarf, tapped her ruler against the desk.", "\"Who will read the class report on the dry spell?\" she asked.", "Hua was already standing. Tall and neat, with a red jacket and a yellow ribbon in her ponytail, she did not look nervous. She looked like a teacher who had forgotten she was a student.", "\"The wells are at forty percent,\" Hua began, her voice clear and steady. \"The tea leaves are losing moisture. The soil is parched.\"", "She read every line with perfect rhythm. When she finished, she turned to the back row. \"Tao, I believe you spelled 'drought' with two t's. It is actually spelled with only one. Or perhaps I am misreading. Please check.\"", "Tao blinked. He looked at his paper, then at Hua, and finally down at his yellow rain boots, which were definitely not needed indoors.", "\"I think I like two t's,\" he mumbled.", "Hua nodded, satisfied, and sat down. The other children stared at Mei, waiting for the next question to land on her."], "img": "img/p006.jpg"}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["Teacher Luo turned to the front row. \"Mei, what do you think the village should do next?\"", "The air went quiet. Twenty pairs of eyes found her, and the white wall behind her started to look like one of those blank sheets of paper where you are supposed to write your name but forget which one it is.", "Mei pressed her thumb hard into her palm. She counted one breath, then two, but the words stayed stuck behind her teeth. They felt like a marble in a jar, too big to move and too round to grab.", "Someone coughed in the third row. It was a small, polite cough, but it landed with the heavy, final thud of a book closing.", "\"Take your time,\" Teacher Luo said.", "Gentle was the worst thing. Gentle meant she was waiting, and waiting meant every other child was watching the waiting happen. Mei’s throat squeezed shut. The words dissolved into nothing. She wanted to say that the water was thin and the sun was loud, but her voice was a dead leaf caught in a gutter, frozen in place.", "She looked down at her cloth shoes. The room tilted slightly, just enough to make her dizzy. She did not answer."], "img": "img/p007.jpg"}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["After the bell, Mei climbed the hill to the signal rock. The path was steep, winding through dry grass that tickled her ankles. Tao trotted beside her, his boots slapping the dirt.", "At the rock, the phone finally caught a signal. One bar. Then two. Mei dialed the number she knew by heart. It rang three times before the static cleared.", "\"Mama?\" Mei said.", "\"Mei! Hi, sweetie!\" The voice was bright, cheerful, layered over the low hum of a machine. \"How is everyone? Is Nainai’s knee better? And the rain? Is there any rain?\"", "Baba cleared his throat in the background. \"Are you eating enough? You look thin in your photos. Don't worry about us. We are fine.\"", "Mei listened to the hum of the factory. It was a steady, mechanical sound, like a giant bee buzzing in a box. They asked their questions the way people ask when they are far away and trying to be close."], "img": "img/p008.jpg"}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["Tao leaned in close, his yellow boots scraping the dirt. \"Tell them the frogs are gone,\" he whispered. \"And the mud is dry. And I am hungry.\"", "Mei held the phone tight against her ear. She looked out at the brown, brittle terraces and the tea bushes that had curled up tight as fists. She wanted to describe the yellow seedlings that looked like old straw, and the buckets that came home nearly empty. She wanted to say she was scared.", "\"We are fine,\" she said.", "Her voice was small. It was true. It also felt like it had a hole in the bottom, the way a sock with a worn-out heel leaks water through the toe.", "\"Really fine,\" she added quickly, because silence on the line was a heavy thing, and she did not want to leave that space open for Baba to fill with worry.", "Tao watched her face. He did not ask why. He just nodded, serious and small, his gap-toothed grin fading into a serious line.", "Mei pressed the button to end the call. The phone felt lighter in her hand, but heavier in her chest. She felt like a bucket with a crack in the bottom, leaking out all the things she could not say while the dry wind tickled her ankles."], "img": "img/p009.jpg"}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["On the way down, they met Hua at the bend in the path, where the wind tugged at her yellow ribbon as she stood with her hands in her pockets, looking out over the dry valley.", "\"You know you could just say it, Mei,\" Hua said, her voice practical rather than mean. \"Sentences are not that hard.\"", "Mei nodded, though she wanted to answer that sentences were a bird with a broken wing for her. The truth stayed locked in her throat, quiet and safe, because explaining it felt like trying to carry a bucket with a hole in the bottom.", "Hua shrugged and walked on, her red jacket bright against the pale dust.", "Mei stood still, watching the hawk that circled high above the valley in wide, slow circles, searching a sky that had nothing in it. She followed its path until it was just a black speck against the pale blue, then nothing at all, leaving her alone with the silence and the dry wind."], "img": "img/p010.jpg"}, {"no": 11, "ch": 3, "ctitle": "The Rain-Asking", "part": "PART ONE: DRY", "paras": ["*Days without rain: 116. Buckets from the spring: 11.*", "The school bell rang once, sharp and lonely, cutting through the dry afternoon air. Uncle Shi stood by the door, his steel thermos clutched to his chest.", "\"To the shrine,\" he announced. His voice was tired, but it carried.", "Yeye Gu was already there, leaning on his cane. He wore a brown padded vest, and his long white eyebrows floated above his cloudy eyes. He carried a wooden tray with three tangerines, a bowl of white rice, and a small cup of tea. The smell of the tangerines was so strong it made Mei’s mouth water, even though she was thirsty.", "Villagers lined the path. Everyone had a fresh willow branch tucked into their hair or tied to their hat. It looked like a parade of green hats. Tao had found the biggest branch he could reach. It was nearly as wide as his shoulders. He walked with a waddle, looking like a small, gap-toothed bush in a green T-shirt.", "Mei followed Nainai. Her grandmother’s knees creaked with every step, a sound like dry twigs snapping. Nainai held her bamboo stick tight.", "\"Keep your eyes on the sky, Mei,\" Nainai said. \"Not on the ground. The sky is where the answer lives.\"", "Mei looked up. The sky was a single, unbroken sheet of pale blue. It did not look like it had an answer."], "img": "img/p011.jpg"}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["The shrine was a small stone platform beside the last trickle of the spring, and the thick, pale dust coated their cloth shoes with every step. Uncle Shi unscrewed his thermos, poured a small amount of tea into a clay cup, and placed it carefully beside the tangerines and rice.", "A drum sat on a low stool, its skin darkened by years of use. Yeye Gu tapped it once. The sound was flat, not loud, but it seemed to hang in the air like a question no one wanted to answer.", "The villagers knelt, or tried to. Nainai sat down heavily, her stick across her lap, while Mei knelt on the cool stone, her knees pressing into the dust. Beside her, Tao sat cross-legged, his willow branch drooping over one eye.", "Yeye Gu began to speak. His voice was cracked like the dry earth around them, yet steady. He did not shout or beg; he simply spoke the old words about water finding its way and the head of the year waking up.", "Mei listened. She counted her breaths: in for four, out for four. The words felt small in the big, empty silence. She watched Yeye Gu’s hands, which were still. The only thing moving was the thin ribbon of mist that clung to the mountain peak in the distance.", "Tao shifted his weight. A leaf fell from his branch and landed in the dust. No one moved to pick it up."], "img": "img/p012.jpg"}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["Then, a new sound. The rustle of paper and bamboo.", "Teacher Luo led a group of children around the shrine. They held a dragon made of red and gold paper, strung along long bamboo sticks. It was not a real dragon. It was a paper one, stiff and bright, with a painted eye that seemed to follow the crowd.", "They danced it in a slow circle. The dragon’s head dipped, then rose. The body rippled. It was beautiful in a strange, fluttering way, like a kite that had lost its string.", "Tao was the tail. He held his stick low and forgot to move it. He just stood there, swaying slightly, his yellow rain boots sticking to the dust. Teacher Luo gave him a gentle nudge. Tao jerked, and the tail of the dragon shot up into the air, flapping wildly.", "Everyone laughed. It was a short, soft laugh, the kind you make when you are tired but happy. Then the laughter stopped, because the sky above them was still perfectly, stubbornly blue.", "Mei watched the paper dragon’s head. It bobbed and dipped. It looked for rain. It did not find any."], "img": "img/p013.jpg"}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["The drum beat slowed to a single, lonely rhythm. One. Pause. Two. Pause.", "An hour stretched out, flat and heavy, while the sun sat motionless on the dry earth. A small breeze kicked up a swirl of dust that caught the light for a brief second before settling back down.", "Auntie Fen, her purple apron bright against the grey dust, leaned toward her neighbor. \"Maybe the Dragon King is just very busy,\" she whispered, though the silence carried her voice clearly. \"He has many villages to visit.\"", "Uncle Shi’s steel thermos lid rattled in his hands. He twisted it open, then shut it, then opened it again. The small metallic click was the loudest thing Mei heard in the whole world.", "Mei pressed her thumb into the center of her palm. The skin there was warm and tender. She wanted to say that the sky looked empty, or that the water level in the buckets was dropping by the minute, but the words stayed locked in her throat, quiet and safe.", "The paper dragon lay still on the ground, its painted eye staring up at the blue."], "img": "img/p014.jpg"}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["Yeye Gu stood up slowly. He placed his hand on his cane. He did not look at the sky. He looked at the people.", "\"The Dragon King’s servants are many,\" he said. His voice was clear now, sharp as a knife. \"But the old rain-asking was different. It was sent to someone.\"", "He turned his head. His cloudy eyes looked past the shrine, past the dry terraces, up to the far mountain. A thin ribbon of mist clung to the peak, curling around the rocks like a scarf.", "Nobody understood him. The adults looked at each other, confused. The children shifted their weight.", "Mei felt her thumb press deeper into her palm. The mist on the mountain seemed to move, just slightly, as if it were breathing. She looked at the stone shrine, then up at the mountain, and felt a strange, heavy pull in her chest, like a bucket that was about to fill."], "img": "img/p015.jpg"}, {"no": 16, "ch": 4, "ctitle": "The Old Story", "part": "PART ONE: DRY", "paras": ["*Days without rain: 117. Buckets from the spring: 10.*", "That evening, the courtyard behind Yeye Gu’s house filled with people. There was no room to sit, so most stood, and a few perched on the low stone wall that held in the garden soil. Yeye Gu lit a single oil lamp. The flame caught the smoke from the cooking fires and turned it into a grey swirl.", "\"Before the paved road,\" Yeye Gu began, his voice low, \"we did not ask the sky. We wrote to a neighbor.\"", "Tao, who had been trying to balance a grain of rice on his tongue, dropped it. \"A neighbor?\"", "\"High up,\" Yeye Gu said, pointing a finger toward the darkening peak. \"At Black Pool. He is not a king. He is a river dragon. Small enough to be shy.\"", "Mei looked at the others. The adults were still. The air smelled of woodsmoke and the damp earth that was trying to hold on to the last of its moisture.", "\"How small?\" Tao asked, his voice loud and curious.", "Yeye Gu smiled. It was a thin smile, like a crack in dry clay. \"Small enough to apologize to a rock if he bumps into it.\""], "img": "img/p016.jpg"}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["\"He lives in the mist,\" Yeye Gu continued, his voice dropping as if he were sharing a secret. \"The mist is his coat. And every spring, when the tea buds were just opening, we sent a gift.\"", "He held up a small, dry leaf, turning it so the light caught its veins. \"First tea. And a message.\"", "\"What message?\" asked a woman in the front row.", "Yeye Gu’s eyes were bright in the lamplight. \"We are here. We are grateful. Please come again.\"", "The courtyard settled into a silence so complete that even the crickets seemed to pause their singing to listen.", "\"And the rain?\" asked Uncle Shi, his thermos clutched tightly in his hands.", "\"Always came,\" Yeye Gu said. \"Late at night. It rolled down the mountain like a drum, and by morning, the mud was soft and the seeds were drinking.\" He paused, looking around the circle of faces. \"One child carried it. Just one. Over the bridge, up the Cloud Ladder. A simple task. If you knew the way.\"", "Mei felt a small tug in her stomach, a feeling like a balloon string pulling tight. One child. That was not a crowd. That was just one person, walking a path that she had only ever seen from the bottom, where the steps disappeared into the dark."], "img": "img/p017.jpg"}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["\"Then why did it stop?\" Mei asked. She did not know why she had spoken. The words were out before her mouth could catch them.", "Yeye Gu looked at her. He did not seem surprised. \"Nobody remembers the year,\" he said. \"Maybe it was when the road was paved. Maybe it was when the young ones went to the cities.\"", "He shrugged, a small movement of his shoulders. \"We forgot to say we are here.\"", "The thought hung in the air, heavy and strange. Mei looked at her hands. She had never sent a message. She had never asked anyone to come back.", "\"So perhaps,\" Yeye Gu added, his voice dropping to a whisper, \"he thinks we are gone.\"", "Tao shifted his weight. \"If he thinks we are gone, why would he send rain?\"", "Yeye Gu did not answer. He simply turned his head and looked at the black shape of the mountain again. The mist was still there, curling and moving, waiting for something it did not have."], "img": "img/p018.jpg"}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["Uncle Shi stepped forward, holding his steel thermos with both hands as if it were the only solid thing left in the world. \"Stories do not fill buckets,\" he said, his voice firm but his eyes heavy with fatigue. \"I have written to the county. I asked for water trucks.\"", "Auntie Fen stood by the wall, her purple apron dark in the dim light. \"The road is washed out,\" she said. \"The trucks cannot come.\"", "\"Then we wait,\" Uncle Shi replied. \"We wait for the water to find us.\"", "\"It is not a story about rain,\" Yeye Gu said softly, without raising his voice. \"It is a story about being remembered.\"", "Half the courtyard nodded slowly while the other half frowned, looking first at the dry terraces and then at their own empty hands. Mei felt her thumb press into her palm again, the skin raw now, and it did not hurt so much as it felt like a promise she had made to herself."], "img": "img/p019.jpg"}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["A silence fell over the courtyard. It was the heavy, waiting kind, the sort that sits on your shoulders like a wet school backpack.", "Then, from the back of the crowd, a small voice spoke.", "\"I know the path.\"", "Everyone turned. Nainai was sitting on her low stool. She was small and straight-backed, her grey hair pinned in a bun. She did not look up. She looked at her hands.", "\"I climbed it as a girl,\" she said. \"My knees would not manage the first hill now.\"", "Mei stood in the shadows beside her, her thumb pressed hard into the soft skin of her palm. The air in the courtyard felt thick, like water about to freeze.", "Nainai’s voice was quiet. \"The path is old. It is still there.\"", "Mei looked at her grandmother, then at the mountain. The mist was swirling around the peak, a soft, white scarf against the dark rock. She wanted to say something. Her mouth opened, but no sound came out."], "img": "img/p020.jpg"}, {"no": 21, "ch": 5, "ctitle": "The Meeting", "part": "PART ONE: DRY", "paras": ["*Days without rain: 117. Buckets from the spring: 9.*", "The school bell had not rung in weeks, so Uncle Shi banged it with a wooden spoon to start the meeting. The children’s benches were too small for the adults, so everyone sat on the floor, or stood, or balanced on the low windowsills. The air smelled of chalk dust and cold tea.", "Uncle Shi stood at the blackboard, his grey jacket wrinkled at the elbows. He held a piece of white chalk like a knife. He wrote three words, then erased two. He wrote again.", "\"No water trucks,\" he said, his voice flat. \"Well is brown. Rice is yellow.\"", "He looked at the list. It was short, yet it felt heavier than the buckets they carried from the spring, because you could not put it down. He tapped the board with the chalk, leaving a white dust on his thumb.", "\"We have six days,\" he said. \"Then the seedlings stop drinking. If they stop, they die. If they die, the tea dies. If the tea dies...\"", "He did not finish. He didn’t need to. The silence in the room was loud enough."], "img": "img/p021.jpg"}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["\"Dig a new well,\" said a man near the door.", "\"We have no money for a pump,\" said Auntie Fen, wiping her hands on her purple apron. \"And no rain to fill it, even if we did.\"", "\"Carry water from the river,\" someone suggested.", "\"Two hours each way,\" said the man by the door. \"We have no hands left for the fields.\"", "\"Ask again,\" said a voice from the back. \"Maybe the Dragon King just wasn’t listening.\"", "Uncle Shi let out a long, tired breath that sounded like a door closing on an empty room. \"We asked. The sky was empty.\"", "He looked at the blackboard, where chalk dust settled in the floating motes of light. \"There is another way,\" he said slowly. \"The old path to Black Pool. It is up the mountain, past the bamboo, over the gorge. It is a long climb.\"", "\"But the path is gone,\" said Yeye Gu from the corner. \"It has grown over. Only the old and the young have walked it. And the old cannot climb, and the young are too small to carry the gift.\""], "img": "img/p022.jpg"}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["\"It should be a grown-up,\" Uncle Shi said firmly. \"Someone who knows the way. Someone who can carry the tea and the message.\"", "He looked around the room. The farmers stared at their hands, which were stained with dirt and worry. The men who worked in the city were not there, busy in factories that did not care about rain. The old ones looked at their knees, which groaned when the weather changed.", "No one stood up.", "The silence stretched until it felt like holding a full cup of water without spilling a single drop. It was the quiet of a held breath.", "Yeye Gu leaned on his cane. His white eyebrows were long and soft, like two feathers resting on his eyes. \"In the old stories,\" he murmured, his voice dry as paper, \"it was always a child.\"", "Mei looked up from her knees. Her chest gave a small, sharp kick.", "\"A child?\" asked Uncle Shi.", "\"Yes,\" said Yeye Gu. \"Because a child has nothing to hide. The mountain knows a child’s heart. It is small. It is clean. It is easy to see.\""], "img": "img/p023.jpg"}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["Mei’s thumb was pressing into her palm so hard it hurt. The skin felt hot, and her mind was white, blank, and bright, like a page in the sun.", "She thought of the yellow seedlings in the top field, curling up in the heat. She thought of the phone call with Mama and Baba on the signal rock, and of how she had said *We are fine* when she meant the opposite.", "Mei was worried. She was so worried her throat felt closed with a fist.", "She stood up.", "Her legs felt like they belonged to someone else. The bench scraped against the floor. She looked at the blackboard, at the list of things that were dying.", "\"I'll go,\" she said.", "It was a whisper. It was a leaf falling on a stone.", "Nobody heard it.", "Hua, who was sitting near the front with her red jacket buttoned to the chin, opened her mouth. Her lips moved, forming a word that looked like *clever* or *impossible*."], "img": "img/p024.jpg"}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["Mei swallowed. Her throat made a dry, clicking sound, like a knuckle cracking in a quiet room.", "\"I'll go,\" she said again.", "She kept her hand on the back of the bench. Her fingers dug into the wood until her knuckles turned white, holding on for the same reason you grip the school railing when your legs feel like jelly.", "\"I will carry the tea,\" she added. \"And the message.\"", "Her voice was still small, but it did not shake. It was the voice of a girl who had counted the notches on the bamboo stick, one by one, every morning for a hundred and seventeen days.", "\"I am small enough to be shy, too,\" she said.", "A laugh rippled through the room, starting near the front and rolling back to the door. It was not mean, but warm and surprised, like the sound of a bucket finally hitting the rock pool after a long carry.", "Nainai smiled from the back row, the creases around her eyes deepening. Uncle Shi set his steel thermos down on the floorboards with a heavy clank. He did not pick it up again.", "He looked at Mei, his eyes tired and serious. \"The path is dangerous,\" he said."], "img": "img/p025.jpg"}, {"no": 26, "ch": 6, "ctitle": "Nainai's Rules", "part": "PART TWO: THE MOUNTAIN", "paras": ["*Days without rain: 118. Buckets from the spring: 8.*", "The kitchen smelled of steam and warm dough. Nainai had been up since before the stars faded, her grey bun tight, her hands moving with the speed of someone who has made this breakfast a thousand times. She placed a steamed bun on each plate, the white dough puffed and soft as a cloud. Beside them sat a small bowl of pickled vegetables, bright red and green, cut thin from the earthenware urn in the corner. The air was thick with the scent of ginger and star anise.", "Mei stood by the stove, her fingers twitching. On the table lay a small cloth bundle wrapped in red paper. Inside was the year's first tea, plucked from the old bush behind the house, leaves still curled and green with promise. It was the gift. Beside it, Nainai held a small scroll of paper, the characters written in her careful, old handwriting.", "Mei read it twice. The message was simple. *We are here.*", "Nainai looked up, her eyes bright and steady. \"Do you have everything?\" she asked.", "Mei nodded, her throat tight. She touched the red paper bundle. The tea felt heavy in her hands, not because of its weight, but because it was the whole village's hope packed into a small square of cloth."], "img": "img/p026.jpg"}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["\"Listen,\" Nainai said, tapping the table with her bamboo stick. \"Rule one. Stay on the path. The mountain likes its own way, and it does not appreciate shortcuts.\"", "Mei nodded, her eyes fixed on the wood grain.", "\"Rule two. Eat when you are hungry, and rest when you are tired. Your body knows the answer before your mind does.\"", "Mei thought of her empty stomach from yesterday. She would remember that.", "\"Rule three,\" Nainai said, looking Mei in the eye. \"If you are afraid, keep walking, but go slowly. Fear is just energy. Let it move with your feet.\"", "Mei swallowed. The words felt strange in her mouth, but they made sense.", "The door creaked open, and Tao stood in the doorway, his yellow rain boots squeaking on the wooden floor. He looked small in the big room, his green tiger shirt bright against the grey walls.", "\"I'm coming,\" he said.", "Nainai looked at him, then at Mei, and her face softened. \"The path is safe,\" she said gently. \"If you stay together.\"", "Tao grinned, showing his gap-toothed smile, and clumped over to stand beside Mei."], "img": "img/p027.jpg"}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["Uncle Shi was waiting at the door, his blue cap pulled low. He held a battered steel thermos in one hand and a piece of paper in the other. It was the back of a torn calendar page, covered in shaky lines and circles.", "\"The path is old,\" he said. \"I drew this from memory. It might be... optimistic.\"", "Hua arrived next, her red jacket zipped to the chin. She carried a notebook and a small compass. In her other hand was a second map, neatly folded.", "\"In case the first is wrong,\" she said, looking at Uncle Shi's calendar page. \"I checked the distance. It is quite long.\"", "Uncle Shi shrugged. \"Old Grey is ready.\"", "From the barn shadow, the water buffalo stepped out. He was huge and grey, his wide curved horns catching the first light. A small brass bell hung around his neck, silent for now. He looked at the group with patient, dark eyes, then lowered his head to accept the packs.", "Mei felt a small surge of hope. They were a team. A strange, mismatched team."], "img": "img/p028.jpg"}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["Mei and Nainai stood at the threshold. The morning air was cool and smelled of damp earth. Nainai held Mei’s shoulders, her hands light but firm.", "\"I cannot go with you,\" Nainai said. Her voice was steady, but her eyes were bright. \"This is the hardest part of being old. Knowing where the path is, and not being able to walk it.\"", "Mei looked at her grandmother's walking stick, leaning against the wall. \"I can go,\" Mei said.", "Nainai smiled. It was a small, sad smile. \"You are not just going, Mei. You are bringing.\"", "She leaned in, whispering so only Mei could hear. \"Your name means plum blossom. Do you know why we name children that? It is the flower that blooms in the snow. When nothing else dares. You do not have to be loud to be brave.\"", "Mei felt her thumb press into her palm. She took a deep breath. The plum blossom bloomed in the cold. She could do this."], "img": "img/p029.jpg"}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["They stepped out into the grey dawn. The mountain was wrapped in mist, soft and white, hiding the tops of the trees. The air was thick and still.", "\"Ready?\" Uncle Shi asked. He unscrewed his thermos and took a sip, then handed it to Hua.", "\"Ready,\" they said.", "Old Grey's bell rang, a single clear note that echoed in the silence. The sound felt like a promise.", "Mei carried the red paper bundle against her chest. Tao trotted beside her, his boots slapping the dry path. Hua walked ahead, her compass in her hand, checking the direction.", "Behind them, the village yawned awake. Smoke rose from chimneys. A rooster crowed.", "Mei looked back once. Nainai stood in the doorway, lifting her bamboo stick in a small wave.", "Then Mei turned forward, into the mist, and took the first step up the mountain."], "img": "img/p030.jpg"}, {"no": 31, "ch": 7, "ctitle": "The Bamboo Path", "part": "PART TWO: THE MOUNTAIN", "paras": ["*Days without rain: 118. Buckets from the spring: 8.*", "The bamboo forest swallowed the light. Tall, green stalks rose straight up, touching the sky, and they creaked and clicked in the small wind. It sounded like a thousand wooden sticks tapping against each other, a quiet, rhythmic clacking that seemed to have a heartbeat.", "\"Why do they have knots?\" Tao asked. He touched a node with his finger, wincing as if it were cold. \"Do they hurt when they grow?\"", "\"No,\" said Hua, adjusting her red jacket. \"The knot is where the leaves used to be. It is the scar of a branch that has grown away.\"", "\"And why do they make that noise?\" Tao asked, tilting his head. \"Are they arguing?\"", "\"Wind pressure,\" Hua said, her voice precise. \"The hollow stems vibrate.\"", "Mei walked with Old Grey, the water buffalo moving with a slow, heavy grace that made the dry leaves crunch under his wide hooves. He smelled of earth and green sap. Above them, the canopy was so thick that the sun only reached the ground in thin, pale stripes.", "\"What if a panda lives here?\" Tao asked. \"What if the panda is afraid of the bamboo? Wouldn't that be terrible? He would be afraid of his own house.\"", "Hua did not answer. She was looking at the map, her eyes scanning the lines with intense focus. Old Grey turned his wide, calm face toward Mei, and she felt a sudden, strange comfort in his patience. He was not afraid of anything. He simply walked."], "img": "img/p031.jpg"}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["Hua stopped at a fork in the path where two trails met. She held the map high, her fingers gripping the edges so tightly the paper creased. She did not look at Tao, or at Mei. She looked at the map.", "\"North-northwest,\" she read aloud. Her voice was steady, clear, and perfect, the way she sounded when she gave reports in class. \"The trail bends left here. Do not take the right path. It is not a shortcut. It is a trail. There is a difference.\"", "Tao looked at the right path. It looked shorter. It looked easier. \"Why?\" he asked. \"Shorter is better. Faster is better. My boots are fast.\"", "\"Because,\" Hua said, lowering the map, \"the map says so. And maps are not wrong. They are careful.\"", "Mei watched Hua’s hands. They were shaking, just a little. The paper trembled in her grip. Mei noticed how Hua’s eyes kept darting to the trees above, to the high places, then back down to the ground. She wanted to say something, but her throat felt tight. She pressed her thumb into her palm. Old Grey made a low, rumbling sound and stepped forward, guiding them onto the left path. The sound of his bell, a single clear note, cut through the creaking bamboo. It was a sound that said: follow me."], "img": "img/p032.jpg"}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["They came to the dry stream bed. It was a wide road of grey stones, dry as bones, with not a drop of water in the center. But at the edge, where the stone met the earth, there was a small pool. It was no bigger than a bowl. In the center of the pool, a single tadpole swirled in a slow, black circle.", "Tao dropped to his knees. His yellow boots squelched in the damp earth. \"A life,\" he whispered. \"It is alone. It is thirsty. We have to save it.\"", "\"It is a tadpole,\" Hua said, checking her map again. \"It belongs here. The rain will come.\"", "\"The rain is not here,\" Tao said. He pulled a small cup from his pocket. He did not ask for permission. He scooped the tadpole and the water into the cup with the speed of a magician. \"Captain,\" he announced. \"I will take him to a wet place. Maybe a stream. Maybe a river. Somewhere with more water.\"", "Mei looked at the empty pool. It looked sad without him. She thought of Nainai’s voice, cutting the notch in the bamboo. *Water finds a way.* Sometimes it needs help finding the way.", "\"Put him in the bottle,\" Mei said. \"The big one. It has a lid.\"", "Tao nodded solemnly. He poured the cup into the water bottle. The tadpole floated near the top, a tiny black dot against the clear water. \"Captain is safe,\" Tao said. He tucked the bottle under his arm."], "img": "img/p033.jpg"}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["They found a mossy rock, flat and cool, and sat down to eat. Mei took out the steamed buns, white and round as small clouds. She broke one in half and offered a piece to Tao, who ate it quickly while crumbs fell on his green tiger shirt.", "Hua sat apart, her knees pulled up to her chest, and held a small notebook open on her lap. Her hands were still.", "\"I read every map,\" Hua said, not looking up. \"Every trail description. I checked the weather reports. I measured the distance.\"", "\"Why?\" Mei asked.", "\"Because I want to be sure,\" Hua said quietly. \"I don't like surprises. They are things that are not in the plan.\"", "Mei chewed her bun slowly, the flavor sweet and plain. \"I don't like being looked at,\" she said. The words came out soft, almost to herself, but Hua heard them.", "Hua looked up, her eyes wide. \"I stand at the front of the room every day. I say the words. I hold the paper. But my hands shake.\"", "Mei really looked at her then, seeing the tightness in Hua’s shoulders and the white-knuckled grip on the notebook. They were not so different; they were two girls holding on tight to something so they wouldn't fall.", "\"Me too,\" Mei said."], "img": "img/p034.jpg"}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["The bamboo thinned out, the tall green stalks giving way to smaller, rougher trees until the path curved sharply to the right. The air grew heavier and cooler, and the familiar creaking of the stalks faded into a low, distant hum.", "Through a gap in the branches, they saw a ridge of grey rock, jagged and high. Across it, a long thread of mist floated, white and silent, like a ribbon left behind by a passing cloud.", "Hua stopped. She did not move. She took the second map from her bag, its corners worn soft from handling, and held it in her hands without opening it.", "\"The bridge is next,\" she said. Her voice was small. It was not the voice of the class monitor. It was the voice of a girl looking up at something very high. \"I have read about the bridge. I know the width. I know the height.\"", "Mei waited. She did not rush her. She stood beside her, close enough that their shoulders almost touched. The mist above seemed to hang in the air, waiting. Hua took a shaky breath. Then she took the map, and with a slow, deliberate motion, she began to unfold it."], "img": "img/p035.jpg"}, {"no": 36, "ch": 8, "ctitle": "The Bridge", "part": "PART TWO: THE MOUNTAIN", "paras": ["*Days without rain: 118. Buckets from the spring: 8.*", "The gorge was a long, dark cut in the mountain. At the bottom, a river ran dry and brown, looking like a cracked lip. The bridge spanned the gap with wooden planks and two thick rope rails. It swayed gently in the breeze, testing the air.", "Old Grey came first. He was huge and grey and calm, his wide curved horns brushing the low branches. He walked across as if he were strolling through a field. His small brass bell rang, a clear, steady sound that cut through the silence. One, two, three. The bell marked his steps.", "Tao followed, his yellow rain boots slapping the wood.", "\"One,\" he announced. \"Two. Three.\"", "He counted every plank. His voice was bright and loud, bouncing off the rock walls. He was halfway across when he reached thirty-one. He stopped, looked down, then looked back at Mei.", "\"Thirty-two,\" he said, with great confidence. \"That is a lot of wood.\"", "Mei watched him cross, one plank at a time, while the mist curled around his boots."], "img": "img/p036.jpg"}, {"no": 37, "ch": 8, "ctitle": "", "part": "", "paras": ["Hua stood frozen at the edge of the path. Her ponytail hung perfectly still while the wind moved everything else around her. Her face had gone the pale, flat color of uncooked rice paper. She clutched a folded map so tightly to her chest that her knuckles turned white.", "\"I'll wait here,\" she said. Her voice was very small. \"And read the map.\"", "Mei glanced down at the map in Hua's hands. She noticed, with a pang of quiet frustration, that it was upside down.", "From the middle of the bridge, Tao called out, his voice bright and loud against the rock walls. \"It is not scary! The planks are just wood! Look, I am standing on it!\"", "He kicked a board with his yellow boot. It creaked.", "Hua flinched. Her eyes were wide and fixed on the swaying ropes. She looked at the map, then at the bridge, then at the map again.", "Mei stepped back from the edge. She did not pull Hua. She did not rush. She simply sat down on the cool rock beside her, letting her braids fall over her shoulder in the breeze. She sat there, steady and still, while the wind pushed against them both."], "img": "img/p037.jpg"}, {"no": 38, "ch": 8, "ctitle": "", "part": "", "paras": ["Mei started to talk, and she was surprised by her own voice. It was quiet, and it did not shake.", "\"Look at Old Grey,\" she said.", "Hua’s eyes shifted, then her head turned up. The buffalo was chewing on a leaf, his bell silent, his back broad and steady against the cliff face.", "\"He is calm,\" Mei continued, \"because he has done this before. He knows the bridge holds.\"", "She pointed to the first plank. \"You do not have to look down. You just have to look at his back.\"", "Hua’s breathing was quick and shallow, like a child trying to hold in a sneeze. Mei raised a hand, palm open. \"Breathe in,\" she said. \"One. Two. Three. Four.\"", "She did it again. \"One. Two. Three. Four.\"", "The wind stilled. The mist hung in the air, soft and white. Hua’s shoulders dropped a little, and she looked at the first plank, then at Mei. She did not smile, but her hands unclenched."], "img": "img/p038.jpg"}, {"no": 39, "ch": 8, "ctitle": "", "part": "", "paras": ["Hua stood up, her legs stiff as boards, and took the first step. The plank beneath her weight gave a long, wooden groan, and her knees trembled so hard the yellow ribbon in her hair quivered like a plucked string.", "Mei turned to face her. She walked backward, one careful heel in front of the other, keeping her eyes on Hua’s face instead of the gorge.", "\"One,\" Mei said, her voice steady as the bridge rails. \"Two. Three. Four. Breathe.\"", "Hua inhaled a shaky breath and took the next step. Then the next. They moved together across the narrow wood, a slow, stumbling dance that required more balance than either of them had. Halfway across, Hua stopped completely. Her face had gone the color of the white mist, and she stared at the empty space where the river should have been.", "Mei stopped too. She did not push, and she did not rush. She just looked at her friend, waiting for the fear to find its own pace.", "\"You do not have to stop being afraid,\" Mei said softly, her thumb pressed gently into her own palm. \"You just have to take one more step.\"", "Hua looked down at the swaying planks, then back up at Mei. She squeezed her eyes shut for one second, then opened them and stepped forward."], "img": "img/p039.jpg"}, {"no": 40, "ch": 8, "ctitle": "", "part": "", "paras": ["On the far side, Hua dropped to the ground. She put her hands over her face. She was laughing and crying at the same time, a messy, wonderful sound.", "Tao ran over, still in his yellow boots. \"I did not think you could be scared of anything,\" he said. \"Even the bats are less scary.\"", "\"It is an awful thing,\" Hua said, her voice muffled by her hands. \"To be afraid of a bridge when you have read forty books about them.\"", "Mei sat down next to her. She realized she was still breathing slowly, one, two, three, four. She looked at her hands. She had been talking for ten minutes. She had spoken to someone else. And for the first time in a very long time, she had not felt the words stick in her throat.", "The bridge swayed behind them, empty and waiting."], "img": "img/p040.jpg"}, {"no": 41, "ch": 9, "ctitle": "The Cloud Ladder", "part": "PART TWO: THE MOUNTAIN", "paras": ["*Days without rain: 118. Buckets from the spring: 8.*", "The stone steps began where the bamboo grove ended. They were old, worn smooth by ten thousand feet, and they climbed straight up into a white wall of cloud. Old Grey stopped. He looked up the Ladder, then back at Mei, with the calm patience of a hill that has decided to sit down.", "\"We are stopping here,\" said Hua, consulting her map. \"The map says no animals above the tree line.\"", "Old Grey did not care about maps. He lay down beneath the largest bamboo stalk, tucked his wide curved horns under his chin, and closed his eyes. A small brass bell on his collar gave one soft, lonely ring as he settled.", "Tao walked over and hugged the buffalo’s nose. It was warm and damp, smelling faintly of grass. \"Good luck, Old Grey,\" Tao whispered. \"I hope the dragon is nice. I hope he has snacks.\"", "Mei lifted the pack from her shoulders. Her arms ached. The air up here was different. It did not dry her lips. It did not crack the earth. It simply waited, cool and soft, for them to climb."], "img": "img/p041.jpg"}, {"no": 42, "ch": 9, "ctitle": "", "part": "", "paras": ["The first hundred steps were easy. The next hundred were not. The stone had turned slick with moisture, and the mist pressed against their faces like a cool, wet towel left on a forehead.", "Tao counted out loud. \"One, two, three.\" He lost track at forty, so he started again from the beginning. By fifty, the numbers had tangled in his head, and he began a third time with a fresh start.", "Hua stopped to take a deep breath. She closed her eyes, and her shoulders dropped. The air smelled of wet stone and crushed leaves. After 118 days of dust and dry dirt, it was the most wonderful thing Mei had ever smelled. It smelled like life starting again.", "\"It is damp,\" Hua said, her voice thick with wonder. \"It is actually damp.\"", "Mei looked at the cloud. It did not look like weather. It looked like the sky had spilled a bowl of milk. The steps climbed up, and up, and up, until the village below was just a rumor of green and brown."], "img": "img/p042.jpg"}, {"no": 43, "ch": 9, "ctitle": "", "part": "", "paras": ["Near sunset, the path finally flattened out and revealed a tea-pickers' hut tucked into the mountain's side. It was a small room of grey stone with a tile roof, barely big enough for the three of them to stand together without turning sideways.", "Hua checked her map, then her compass, then the map again. \"Safe,\" she declared, tapping the paper. \"Structurally sound. Historically accurate.\"", "Inside sat a wooden bed with a thin mattress, a small table, and an old lantern with a glass chimney. The silence settled around them, not scary but full of waiting, like the pause between a question and an answer in class.", "Mei took out the last of the steamed buns. They were a bit squashed from the climb, soft and dense. She broke one into three pieces, and they ate slowly, chewing carefully while listening to the wind tap against the roof tiles.", "Tao looked at the darkening window. \"I am not afraid of the dark,\" he said, very loudly. \"But I want the lantern lit. Just for safety.\""], "img": "img/p043.jpg"}, {"no": 44, "ch": 9, "ctitle": "", "part": "", "paras": ["The lantern flame was small and steady. It made a yellow circle on the floor, and outside that circle, the dark was very big.", "Tao pulled his yellow rain boots on. He sat on the edge of the bed, tucking in his socks.", "\"Those are for luck,\" he explained.", "\"That is scientifically accurate,\" Hua said, pulling her red jacket tighter. \"The boots provide thermal insulation and psychological fortitude.\"", "Mei lay down. The wood was hard, but the mattress was soft enough. She pressed her thumb into her palm. The mountain outside was making sounds. Not wind, exactly. More like the mountain was stretching. A twig snapped. A stone rolled, distant and slow.", "Tao whispered, \"Do you think bats can get into huts?\"", "Mei turned her head. \"Bats are more afraid of you than you are of them,\" she whispered back.", "Tao considered this. He nodded, satisfied. He pulled the blanket up to his chin, leaving only his gap-toothed smile and one yellow boot visible."], "img": "img/p044.jpg"}, {"no": 45, "ch": 9, "ctitle": "", "part": "", "paras": ["The dark pressed in, heavy and quiet, and Mei counted her breaths to keep her mind from wandering into the shadows. One, two, three, four. The lantern flame leaned to the left, casting a long, wavering shadow, then straightened as if it had remembered its manners.", "Outside, the mist was moving. It did not blow; it curled, slow and deliberate, like a cat stretching on a windowsill.", "Then, far above them, came a sound.", "It was low and long, a vibration that seemed to come from the heart of the mountain itself. It was not a roar, and it was not a storm. It was the sound of an enormous someone letting out a shaky breath, a rumble that traveled through the stone floor and settled deep in their bones.", "The lantern flame jumped. The mist outside the window gathered, curling into a shape that was very long and very thin, like a ribbon caught in a breeze.", "Nobody said anything. The air felt different now. It felt watched.", "Tao whispered, his voice small, \"Was that the dragon?\"", "Mei looked at the dark. Whoever it was, they were awake. And they were afraid."], "img": "img/p045.jpg"}, {"no": 46, "ch": 10, "ctitle": "Black Pool", "part": "PART TWO: THE MOUNTAIN", "paras": ["*Days without rain: 119. Buckets from the spring: 7.*", "The steps ended. The cloud lifted, and Black Pool lay before them in a high bowl of stone and pine. It was smaller than Mei had imagined. The water was low, dark, and very still. Around the edges, the mud was cracked and dry, splitting into thin lines that radiated out like the cracks in an old plate left in the sun. A single dead tree stood at one side, its branches bare and reaching.", "The mist hung over the pool, thick and grey-white, settling into the hollow of the mountain. It did not drift. It sat. It waited.", "Tao stopped at the top of the last step. He looked at the water, then at the mud, then back at the water.", "\"It’s not moving,\" he said.", "\"No,\" Mei agreed. Her throat felt tight. The air here was cold and still, smelling of damp stone and pine needles. It was the most quiet place she had ever been. The silence was so deep it felt like it had weight.", "Hua adjusted her red jacket, her yellow ribbon fluttering slightly in the faintest breeze. She looked around the bowl of stone, her eyes wide.", "\"I don’t hear anything,\" Hua whispered.", "There was no sound of wind. No sound of birds. No sound of the world turning. Just the dark water, and the mist, and the three of them standing at the edge of the world."], "img": "img/p046.jpg"}, {"no": 47, "ch": 10, "ctitle": "", "part": "", "paras": ["Mei held the bamboo tube of tea, its warmth seeping through her cold fingers despite the climb. She had practiced her words to the bamboo, to the bridge, and to the air, but now they had slipped away, gone like water sinking into dry earth.", "Her thumb pressed hard into the center of her palm. One. Two. Three.", "\"We should read it,\" Hua whispered, pulling a small piece of paper from her pocket. \"I wrote it down, just in case we forget.\"", "Tao stared at the pool. \"The pool is looking at us,\" he said.", "Mei looked at the dark, flat water. It was not looking, just water, but it seemed to be watching with a patience that made her skin prickle.", "\"If we read it,\" Hua said, \"we don't have to remember it. We just have to read.\"", "Mei nodded, her heart beating steadily in her chest. She looked at the tea, then at the mist, and felt the air grow heavy, as if the mountain itself was holding its breath.", "\"Okay,\" she said, her voice coming out small. \"Okay.\""], "img": "img/p047.jpg"}, {"no": 48, "ch": 10, "ctitle": "", "part": "", "paras": ["A ripple bloomed in the center of the pool, a single circle that expanded slowly before fading away. The water was so still that the disturbance looked like a hairline crack in a mirror, though it quickly smoothed over into perfect silence.", "Mei waited for a second sign, but the surface remained flat and unbroken. Then a shape shifted in the mist. It was green, the deep color of bamboo in the fog, and long and slender as a stalk of reed. It slid quietly from one rock to another, disappearing into the grey, only to stop and wait there instead of moving on.", "It was far too large for the boulder hiding it. A soft, branching antler peeked over the stone, and a thin, pale tail hung down the side. It was trying to be invisible, and it was failing spectacularly, like a student trying to hide behind a tiny desk.", "Tao took a step back, his yellow rain boots squeaking against the stone.", "\"Is that...\" he started.", "Hua’s hand flew to her mouth, her eyes fixed wide on that sliver of green.", "Mei did not move. She watched the antler twitch. It was not a monster, nor a fire-breathing beast. It was something shy, something that had just remembered it was being seen."], "img": "img/p048.jpg"}, {"no": 49, "ch": 10, "ctitle": "", "part": "", "paras": ["A rumble went through the ground, not a roar but a small, nervous vibration, like a hiccup trapped under the skin of the earth. The mist around them swirled and tightened into a slow spiral.", "From behind the rock, a voice spoke. It was deep, and worried, and very polite.", "\"I am very sorry, but nobody is here.\"", "Tao blinked. \"Who is talking?\" he asked. \"If nobody is here?\"", "The voice paused, and the mist curled tighter around the stone.", "\"I am sorry to intrude,\" the voice said. \"I did not see you. I am hiding. I am trying to be quiet. I am being very quiet. I think.\"", "Mei felt the tension in her chest ease, just a little. The voice was shaking, sounding exactly like the way she sounded when she was trying not to cry during a spelling test.", "\"We are here,\" Mei said. Her voice was steady. \"We are real.\"", "The rumble came again, softer this time, a gentle shudder that made the antler behind the rock tremble."], "img": "img/p049.jpg"}, {"no": 50, "ch": 10, "ctitle": "", "part": "", "paras": ["A single eye peeked over the rock. Enormous and round, it held an amber glow, with a pupil so dark it swallowed the light. It blinked, then stayed wide, fixed on the world.", "The eye looked at the children, then at the tea, and finally, for a long moment, at Mei.", "\"Oh dear,\" the voice said from the mist, clear and trembling. \"You are real.\"", "Long, white whiskers trembled in the air, shaking like reeds in a sudden gust.", "\"So am I,\" the voice continued. \"I apologize for that.\"", "Mei’s thumb pressed into her palm. One. Two. Three. She watched the eye, which was not scary but sad, wearing the exact same look she saw in the mirror when she thought no one was watching her cry.", "\"It’s okay,\" Mei said. \"We’re just thirsty.\"", "The eye widened further, and the mist around it seemed to sigh."], "img": "img/p050.jpg"}, {"no": 51, "ch": 11, "ctitle": "The Dragon Who Said Sorry", "part": "PART THREE: THE DRAGON", "paras": ["*Days without rain: 119. Buckets from the spring: 7.*", "The rock groaned, a low sound like a creaking floorboard, and then the dragon rose.", "He was long and slender. His skin was the sea-green of bamboo in the morning fog. His belly was pale gold, and his scales shone with the soft light of a wet stone. Branching antlers curved back from his head. Two long white whiskers drifted in the still air. Above his eyes, a small, smooth bump sat on top of his skull.", "Mist trailed from his shoulders, settling around his neck.", "He was a good deal bigger than the farmhouse back in the village. But he was curling his tail, tucking his head, and pressing his shoulders down. He looked as though he would very much like to be a good deal smaller.", "His amber eyes were wide. They did not look like the eyes of a king. They looked like the eyes of a boy who had been caught playing in the rain when he was supposed to be indoors.", "Mei stopped breathing. Tao stopped counting. Hua’s hand went tight on the strap of her bag.", "The dragon looked at them, then at the ground, then back at them. A small, nervous twitch moved in his whiskers."], "img": "img/p051.jpg"}, {"no": 52, "ch": 11, "ctitle": "", "part": "", "paras": ["\"My name is Yun,\" he said, his voice soft and careful, like the turning of a page in a very quiet library. \"That is the word for cloud. I am nearly four hundred years old, which for a dragon is about twelve.\"", "He shifted his weight, and a pebble rolled away into the mist. He watched it go, then apologized to the pebble in a whisper.", "\"I am sorry for hiding,\" Yun continued. \"And I am sorry to this rock. I have been sitting on it for a very long time. My knee is stiff, but I am sorry for the inconvenience.\"", "Tao stepped forward, his yellow boots squeaking on the damp stone. \"Do you shoot flames?\"", "Yun’s whiskers snapped forward. \"Certainly not,\" he said, his voice rising in alarm. \"I have a cold as it is. I would set the whole mountain on fire. That is not helpful.\"", "Hua adjusted her ponytail. \"You are a water spirit,\" she corrected gently. \"From the stories.\"", "\"Yes,\" said Yun. \"Water. And rain. Usually.\"", "He looked at the red paper in Mei’s hand, then at the tea. He looked as if he wanted to speak, but his throat moved, and he stopped."], "img": "img/p052.jpg"}, {"no": 53, "ch": 11, "ctitle": "", "part": "", "paras": ["Mei’s hands were shaking, so she pressed her thumb hard into the center of her palm to keep them steady. The wind felt cold, like the air in the classroom right before the bell rang for lunch. She unrolled the bamboo tube and took out the small red paper, which was folded into a tight square.", "\"We are the village of Bamboo Ridge,\" she said. Her voice was thin, like a thread pulled too tight. \"We have come with tea and a message.\"", "Yun extended one claw. It was delicate, with long, slender fingers that ended in soft pads. He took the paper with the same care one might use to hold a soap bubble.", "He unfolded it. The paper was crisp.", "We are here.", "Yun stared at the words. The mist around him stilled. His amber eyes filled with a light that was not quite water, and not quite light. It was the look of someone who has been waiting for a letter that they are no longer sure will arrive.", "\"Thank you,\" he whispered. \"I had forgotten what that sounds like. To be spoken to.\"", "Mei counted her breaths. One. Two. Three. The words had come out. They had been small, but they had been there."], "img": "img/p053.jpg"}, {"no": 54, "ch": 11, "ctitle": "", "part": "", "paras": ["Yun lifted the bamboo tube, tipping it gently toward his mouth so the tea slid out in a single, smooth stream. He shut his eyes, and for a moment the mountain went completely still. The wind held its breath, and the mist hovered in soft curls around his shoulders like a scarf he had forgotten to take off.", "\"It is the best thing I have tasted in a hundred years,\" he said, his voice rough and scraped thin by emotion. \"It tastes like being remembered.\"", "Hua opened her notebook, her handwriting forming neat, tiny squares of ink on the white page. \"119 days,\" she read aloud. \"No rain. Wells are low. Rice is yellow. Tea leaves are brittle.\"", "Yun’s whiskers trembled at her words. He made a small, low hum, like a kettle just before it begins to whistle, and his amber eyes grew very sad.", "\"I am sorry,\" he said. \"I know what that means. I have seen the fields turn to dust. I have heard the frogs go quiet.\"", "Tao tugged at Mei’s sleeve. \"Is he crying?\"", "He was not, but the mist around them grew thicker, carrying the heavy, stuck smell of rain that wanted to fall but was afraid to."], "img": "img/p054.jpg"}, {"no": 55, "ch": 11, "ctitle": "", "part": "", "paras": ["\"You want me to bring the rain,\" said Yun.", "The three children nodded. Tao nodded so hard his yellow boots clumped together.", "\"I cannot,\" Yun said.", "The words were quiet. They did not sound like a refusal. They sounded like a fact, plain and settled, the way a stone settles into mud.", "\"I am sorry,\" he continued. \"I would if I could. But the rain starts with the thunder. And I do not do thunder.\"", "He curled his long body tighter. His head dropped low. The mist rolled over his face, hiding his eyes and the whole of him.", "Under his chin, a round, grey-white pearl glowed. It was dull and heavy, pulsing with a slow, trapped rhythm. It looked like a held breath. It looked like a sneeze that would not come out.", "Mei looked at the pearl, then at the mist, then at the dragon trying to make himself smaller, trying to disappear into the rock and the cloud and the quiet.", "She pressed her thumb into her palm. One. Two. Three.", "\"I know,\" she said."], "img": "img/p055.jpg"}, {"no": 56, "ch": 12, "ctitle": "Things That Could Go Wrong", "part": "PART THREE: THE DRAGON", "paras": ["*Days without rain: 119. Buckets from the spring: 7.*", "Yun uncurled slowly, his long sea-green body stretching out across the cracked mud until it looked like a green ribbon dropped in a dusty yard. He looked at the children, then at the flat rock beside his nose. With one careful claw, he dragged a line through the dust, smoothing it down like he was erasing a mistake.", "\"Before I explain,\" he said, his voice trembling, \"you must see the list. It is very important.\"", "Tao leaned forward, his yellow boots squeaking against the dry earth. \"What kind of list?\"", "\"Things That Could Go Wrong,\" Yun said.", "He showed them. The writing was neat, small, and terrified.", "1. Thunder. 2. Everyone hears it. 3. Everyone screams. 4. Someone cries. 5. It is my fault.", "The list continued onto a second rock, then a third. The numbers climbed high into the dust, a ladder of worries leading nowhere. Mei stared at the first line. It looked familiar. It looked like the silence in her chest before she opened her mouth, that heavy, white space that waits for her to fill it."], "img": "img/p056.jpg"}, {"no": 57, "ch": 12, "ctitle": "", "part": "", "paras": ["\"It started a long time ago,\" Yun said, his whiskers drooping toward the cracked mud. \"I was young, rising over the village for the first time. I was very proud, and also very nervous.\"", "He paused, studying his claws with the intensity of a student checking homework.", "\"My first thunder was louder than I intended. Much louder.\"", "He did not look up. He did not blink.", "\"Doors banged,\" he listed, his voice flat and careful. \"A baby howled. The ducks ran. And every single villager covered their ears and ran inside.\"", "Mist curled around his neck like a grey scarf.", "\"Nobody came out to look,\" he said. \"They stayed inside. They stayed very still. They were afraid of me.\"", "Tao opened his mouth to ask a question, but Mei held up a hand. The silence around the pool felt thick, like cold porridge that refuses to stir."], "img": "img/p057.jpg"}, {"no": 58, "ch": 12, "ctitle": "", "part": "", "paras": ["\"Did anyone get hurt?\" Hua asked. Her voice was steady, but her fingers were white where they gripped the strap of her bag.", "\"No,\" Yun said. He tucked a claw beneath his chin. \"But I did not stay to find out.\"", "He shook his head, a slow, sad motion that made his antlers sway in the mist.", "\"I had never seen anything so horrible as all those faces turned toward me in fear. I hid in the pool that night. I made myself a promise.\"", "He looked at Mei, his amber eyes wide and wet.", "\"I promised I would never thunder again. Not once. Not ever. It was the only way to keep them safe. It was the only way to keep myself safe.\"", "The silence in the pool was heavy. It felt like the air before a storm that never breaks. Tao sat on a flat rock, his yellow rain boots squeaking softly against the dry stone as he shifted his weight. He looked at the dragon, then at Mei, waiting for her to say something, but Mei only watched the pearl under Yun’s chin. It was grey and heavy, pulsing faintly with the rain he held inside."], "img": "img/p058.jpg"}, {"no": 59, "ch": 12, "ctitle": "", "part": "", "paras": ["\"But the rain does not go away,\" Yun said. He lifted his chin, showing them the pearl beneath it.", "It was no longer just grey. It had grown dark and swollen, pulsing with a slow, wet beat. It looked like a water balloon held tight in a fist, the skin stretched thin over a liquid that wanted out.", "\"It stays in,\" he whispered. \"And it gets heavier. And heavier. I have held this for a hundred years. It aches. All the time. It is like swallowing a stone and never being able to cough it up.\"", "He gestured with a long, slender claw to the cracked edges of the pool, where the mud was dusting into the air.", "\"The pool is shrinking because there is no cloud to fill it. The more I hold it, the harder it is to let go. The rain is waiting for me, and I am waiting for it to stop, and neither of us is moving.\"", "He lowered his head until one of his antlers brushed the dry ground, leaving a faint, dark damp spot.", "\"I am stuck, children. I am so very stuck.\""], "img": "img/p059.jpg"}, {"no": 60, "ch": 12, "ctitle": "", "part": "", "paras": ["Mei looked at the dragon. He was enormous, kind, and trembling. She saw the way he hunched his shoulders. She saw the way he waited for the world to hurt him.", "It was exactly how she felt in the middle of the classroom. Twenty people waiting. Nothing coming out.", "Without deciding to, without planning it, she spoke.", "\"You are afraid of your own voice.\"", "Yun stared at her. The mist stopped moving.", "\"Yes,\" he whispered. \"How did you know?\"", "Mei pressed her thumb into her palm. One. Two. Three.", "\"Because so am I,\" she said."], "img": "img/p060.jpg"}, {"no": 61, "ch": 13, "ctitle": "Small Thunders", "part": "PART THREE: THE DRAGON", "paras": ["*Days without rain: 119. Buckets from the spring: 7.*", "\"Start small,\" Mei said. Her voice was quiet, but it did not shake. She looked at Yun, who was still trembling near the edge of the dry lakebed.", "\"The smallest thunder is a sneeze,\" said Tao. He held up one finger, then two, then all five, as if counting the syllables.", "\"Thunder is a sudden expansion of air,\" said Hua. She adjusted her ponytail, the yellow ribbon fluttering against her red jacket. \"If you want the science.\"", "Yun blinked his amber eyes. He shifted his weight, his pale gold belly brushing the cracked mud. \"I would rather not, thank you,\" he said, in that careful, polite way he had. \"But I am willing to try.\"", "The three children leaned in, forming a tight circle of yellow boots, red jackets, and braids around the dragon. The mountain seemed to hold its breath. Yun drew in a long, shuddering breath, and the mist around him curled tighter, like a scarf pulled up against the cold.", "A tiny hiccup escaped him.", "It was soft and round, sounding exactly like a wooden drawer sliding shut in an empty room.", "Tao clapped his hands. \"There it is! That was loud!\""], "img": "img/p061.jpg"}, {"no": 62, "ch": 13, "ctitle": "", "part": "", "paras": ["Mei straightened her back, and her shoulders settled. \"Breathe with me,\" she said. \"In for four. Hold for one. Out for four.\"", "Yun’s whiskers puffed out, stiffening in the thin air. He followed her count, his nose twitching with every number. On the first try, nothing happened, only a faint whistle of wind moving through his antlers.", "\"Again,\" Mei said.", "On the second try, he held the breath a little longer. When he released it, a low rumble rolled out of his chest. It was not a boom, nor a crack, but soft and deep, no louder than a cat purring on a warm roof tile.", "Tao cheered so loudly that the sound bounced off the rocks, and Yun leaped two feet into the air, his claws scrabbling at the empty space above him.", "\"I apologize to the sky!\" he yelped, landing with a soft thud. \"I did not mean to startle the atmosphere!\"", "Hua was grinning. \"That was actually quite steady,\" she admitted."], "img": "img/p062.jpg"}, {"no": 63, "ch": 13, "ctitle": "", "part": "", "paras": ["Hua stepped closer, tilting her head. \"You are clenching your throat,\" she said. \"That is why it gets stuck. Look.\"", "She stood beside the dragon, her shoulder almost touching his whiskers. She relaxed her jaw, letting her face soften completely. \"Like this. No tension. Just air.\"", "Yun tried to copy her. He stared at his own reflection in a small, clear pool of water near the shore. He mimicked Hua’s face, then his own. Both ended up with their jaws hanging open, slack and round.", "Tao laughed until he fell backward off a flat rock, landing in a cloud of dry dust. He scrambled up, wiping grit from his green tiger shirt. \"You look like two surprised fish!\"", "The little valley of Black Pool rang with their laughter. It was a bright, sharp sound that had not visited this spot in a hundred years. Yun looked at the children, and for the first time, the mist around him did not look like a hiding place."], "img": "img/p063.jpg"}, {"no": 64, "ch": 13, "ctitle": "", "part": "", "paras": ["They practiced for the rest of the afternoon. The sun moved across the sky, painting the rocks in shades of gold and long, purple shadow. They started with a purr, then a low growl, and finally a proper small rumble that rolled once around the rocks and came back to them, echoing off the stone walls.", "Yun looked astonished. His amber eyes were wide, and he did it again. A little wind stirred the mist, lifting it in slow, lazy swirls while the surface of the almost-dry pool rippled, just slightly, as if something heavy had passed over it.", "\"Can you do a big one?\" Tao begged, bouncing on his heels until his yellow boots squeaked. \"Just a little bit bigger than that.\"", "Yun went stiff, his shoulders hunching as the rumble died in his chest, trapped and heavy. He shook his head in a slow, careful motion. \"No,\" he said softly. \"Not yet. I am not ready for that size.\"", "The silence that followed settled over them, heavy and still, waiting for someone to break it first."], "img": "img/p064.jpg"}, {"no": 65, "ch": 13, "ctitle": "", "part": "", "paras": ["The dragon hid his head under a wing of mist that he did not have. It was a clumsy, awkward gesture, and it only made him look more like a shy child than a creature of the sky.", "\"There,\" he said. His voice was barely a whisper. \"You see? It is not that I cannot. It is that I will not. I see their faces every time. The screaming. The running. I cannot do that again.\"", "Mei did not argue. She did not offer the science, or the luck of the boots, or the logic of the list. She simply sat down on the cold stone beside him. She placed her hand on the rough rock, right next to his claw. She breathed in for four, held for one, and breathed out for four.", "She stayed there, steady and quiet, while the mist swirled around them both."], "img": "img/p065.jpg"}, {"no": 66, "ch": 14, "ctitle": "Mei's Secret", "part": "PART THREE: THE DRAGON", "paras": ["*Days without rain: 119. Buckets from the spring: 7.*", "The stars over Black Pool were too close. They hung low enough that Mei felt she could reach up and knock on one, and there were so many of them that the sky looked like a spilled jar of glass beads. The wind had died. The mist curled around the dragon’s sea-green flank, a soft, damp blanket that smelled of clean stone and old rain.", "Tao was asleep, snoring softly into his yellow rain boots. He had fallen asleep mid-sentence, asking if dragons dig their noses. Hua lay on her side, one hand clamped tight over her notebook, as if it contained the answers to a test she had forgotten to take. Mei sat up, her back against the rough, warm scales. Yun did not sleep. Dragons, he explained quietly, did not need it as much. He kept his amber eyes wide, watching the dark water.", "Mei pressed her thumb into her palm. The cold stone bit back. She looked at the pearl under his chin. It was not bright. It was a dull, tired grey, heavy with all the unshed rain.", "\"It is a good night for thinking,\" Yun said, his voice a low rumble that she felt in her ribs.", "\"Or for hiding,\" she whispered.", "He turned his head. \"Hiding is safer. But the rain is waiting.\""], "img": "img/p066.jpg"}, {"no": 67, "ch": 14, "ctitle": "", "part": "", "paras": ["Mei picked at a loose thread on her sleeve while the silence grew thick enough to chew. It was the kind of quiet that made her ears ring, like a school bell that someone had forgotten to stop. She wanted to say something to break it, but the words stuck in her throat, just like they always did.", "\"In class,\" she started, then stopped to look at her hands. \"When Teacher Luo asks a question, my mind goes white. It is not that I do not know the answer. It is that I cannot hear my own voice.\"", "Yun did not say \"oh\" or \"that is nice.\" He just listened, the way the still water listened to the stones beneath it, without asking for anything in return.", "\"And then I go home,\" she continued, her voice dropping to a whisper. \"And I think about the calls with Mama and Baba. They say we are fine. But it is not fine. It is dry. And I am small.\"", "\"But you said 'I will go,'\" Yun said gently. \"In front of the whole village.\"", "Mei shrugged, her shoulders rising and falling in a slow, tired rhythm. \"It came out like a leaf. Barely there.\"", "Yun’s whiskers twitched. \"Then it was a leaf that crossed a mountain.\""], "img": "img/p067.jpg"}, {"no": 68, "ch": 14, "ctitle": "", "part": "", "paras": ["Mei thought about Nainai’s bamboo stick, that tiny fence of absence where each notch marked a dry morning. She pictured the seedlings in the terraces, yellow and brittle, waiting for a signal they could not give themselves.", "\"In the old stories,\" she said, \"when the Awakening of Insects comes, the thunder wakes them up. The ants. The frogs. The seeds in the ground. They are sleeping. They are cold.\"", "She looked up at the dragon. \"Thunder is not just a loud noise, Yun. It is a knock. It is a knock on the door of spring.\"", "Yun went very still, and the mist around his shoulders stopped swirling. His amber eyes grew wide. He looked at the dark, dry ground, then back at Mei.", "\"A knock?\" he repeated. The word seemed to surprise him. \"I have always thought of it as a warning. A shout. Something to make them run.\"", "\"No,\" Mei said, surprised by the steady strength in her own voice. \"It is an invitation. To wake up.\""], "img": "img/p068.jpg"}, {"no": 69, "ch": 14, "ctitle": "", "part": "", "paras": ["Yun’s whiskers trembled, and he looked down at his own slender claws, then at the heavy, grey pearl resting under his chin. For a hundred years, he had hidden. He had tucked himself behind rocks and wrapped himself in mist, so busy being afraid of the noise he made that he had never stopped to listen to what it did.", "\"I have never seen what happens after,\" he whispered. \"I hid too fast. I never saw the frogs jump. I never saw the green come up the terraces. I only saw the fear.\"", "He let out a long, shuddering breath that fogged the cool air.", "\"I thought I was a noise that frightened people,\" he said slowly. \"I did not know I was a knock.\"", "Mei reached out and touched one of his soft, branching antlers. It was warm, and it was alive. She did not say \"it will be okay,\" because she knew it might not be. But she stayed. She breathed in for four, held for one, and breathed out for four, feeling the steady rhythm settle in her chest like a drumbeat in a quiet room."], "img": "img/p069.jpg"}, {"no": 70, "ch": 14, "ctitle": "", "part": "", "paras": ["The night air was crisp. The stars still hung low, watching. Mei and Yun looked at each other. No words were n
