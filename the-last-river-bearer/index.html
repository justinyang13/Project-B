ed it tight. Mo tied one end to a rock on their side, and the other to a boulder on the far side. The rope hung taut, a thin line against the vast blue expanse.", "\"Step lightly,\" Mo said, her voice low. \"The ice is singing.\"", "And it was. As Wen stepped onto the ice, it sang, a high, thin note that vibrated through her boots and into her bones. It was a warning, a warning that the ice was under stress, that it was holding on by a thread. She moved slowly, her eyes fixed on the rope, her hands outstretched for balance. The air was so cold it felt like knives, and her breath was a constant cloud before her face.", "Halfway across, the ice cracked. A sharp, loud crack, like a gunshot, and the surface beneath her feet shifted. Wen’s grip on the rope slipped. Her hands were numb, the cold biting into her skin, and her fingers could not hold. She slid, her boots skidding on the ice, and she felt the drop, the empty space beneath her, the blue water trapped below, so close, so far.", "She lost her balance. Her hands flew up, grasping at the air, and for a second she was falling, the ice cracking beneath her, the blue water below calling to her, the cold rushing up to take her.", "Then a hand caught her.", "Mo’s hand, strong and warm, wrapped around her wrist, pulling her back. Mo’s face was calm, her eyes sharp, and her grip was iron. She pulled Wen back to the solid ice, and Wen fell to her knees, gasping, her lungs burning with the effort to draw air.", "\"The ice is not your enemy,\" Mo said, her voice steady. \"It is your test. You must trust it, or it will take you.\"", "Wen looked at Mo, at the strength in her hands, the calm in her eyes. She nodded, slowly, and rose to her feet. She looked at the rope, at the ice, at the blue water below. She could feel it, the water, the cold, the danger. But she could also feel the strength, the trust, the connection. She was not alone."], "img": "img/p103.jpg", "pw": true}, {"no": 104, "ch": 21, "ctitle": "", "part": "", "paras": ["On the far side, they found the cave. It was a small opening in the ice wall, dark and deep, its entrance framed by jagged shards of blue crystal. Inside, the air held its warmth longer than the outside world allowed, and the light shifted into a soft, blue glow emanating from the ice itself.", "Their footsteps echoed in the silence as they walked deeper. The walls were smooth, polished by time, and covered in carvings. Small, delicate figures lined the stone, each one a girl holding a water gourd. A line of water flowed from the gourd to the ice in every depiction. Wen realized these were keepers’ stones. A lineage of them stretched down the cave, each one a record of a bearer, a woman who had come before her, who had tried to wake the river.", "The carvings varied in age. Some were rough and weathered, others smooth and precise. They formed a history, a ledger, a record of the debt. Each girl had a different face, a different expression, but they all held the gourd, all looked at the ice, all seemed to be waiting.", "The last carving was different. It was newer, the stone smoother, the lines sharper. The face was familiar.", "It was her mother.", "Wen stopped. She stared at the carving, at the face that looked so much like her own, the same eyes, the same nose, the same mouth. The gourd was in her hand, the water flowing, the ice glowing. Below the carving, in small, precise letters, was a date.", "Eleven years ago.", "Wen’s hand trembled. She reached out, her fingers hovering over the stone, not touching it. She feared breaking the spell, or changing the truth. The date was a fact, cold and hard. Her mother had been here. Her mother had tried. And she had failed.", "Shen Yu looked at her, his face pale, his eyes wide. He understood. He saw the fear in her eyes, the pain in her voice. He said nothing. Instead, his hand reached out, and he took her hand, holding it steady and warm.", "Wen looked back at the carving, at her mother’s face, at the date. She felt the gravity of the past, the burden of the debt, the responsibility of the present. She was not the first. She was not the last. She was the bearer, the keeper, the one who had to wake the river."], "img": "img/p104.jpg", "pw": false}, {"no": 105, "ch": 21, "ctitle": "", "part": "", "paras": ["Wen knelt before the carving, her knees sinking into the loose snow until her charcoal skirt touched the ice. Her white ponytail fell across her face, a stark curtain against the blue glow of the cave, but she did not wipe it away. She kept her eyes closed, her hands resting in her lap with the stillness of a held breath, waiting for the cold to recede.", "Mo stood behind her. The ferrywoman’s hand settled on Wen’s shoulder, a steady, grounding pressure that cut through the trembling in the air. She said nothing. She simply remained there, a solid anchor in the shifting cold, her breath slow and deep, offering the quiet certainty of a river that has found its bed.", "Shen Yu turned away from the stone. He walked to the edge of the cave, his back to them, and let out a small, fractured sound. It was not a sob, exactly, but the dry, racking noise of a rope snapping under too much tension. His shoulders shook, and the lenses of his glasses fogged with his quick, shaky breaths. He stood there, rigid and silent, holding a grief that had no place in the ledger.", "Then the ice above them creaked.", "It was a low, deep groan, the sound of a massive door swinging on ancient hinges. The vibration traveled through the floor and into their bones, a tremor like the first ripple of a flash flood hitting a weir. It was not just a sound in the cave; it was in the valley, in the air, in the very structure of the mountain. The ice cracked, a long, sharp fracture that raced up the walls, and the water began to move.", "Wen opened her eyes. She looked at the carving, at her mother’s face, at the date carved in the smooth stone. The frost on her fingertips had begun to melt, the white bloom fading into her skin. She felt the warmth of Mo’s hand on her shoulder and the solid, unyielding presence of Shen Yu by her side. The debt was not a burden to be carried alone; it was a current to be shared.", "She stood up. She straightened her back, her shoulders, her head, and looked out toward the river. The silence was broken, replaced by the rising, inexorable hum of the water returning. She was ready.", "And she did."], "img": "img/p105.jpg", "pw": false}, {"no": 106, "ch": 22, "ctitle": "The Cloud Sea", "part": "PART FIVE: THE SOURCE", "paras": ["*The Bearer's Almanac, Entry 22: The people who frighten us most are usually afraid.*", "The air above the pass was thin and sharp, tasting of ice and distance. Wen Lan stood at the edge of the world, where the ground dropped away into a silence so vast it felt less like empty space and more like a held breath that had been waiting for centuries. Below them, the Cloud Sea lay still. It was not white, not really, but a pale, bruised grey, thick as wool and deep as a well. The valleys they had walked through for weeks were gone, swallowed by the mist, leaving only the dark, jagged shoulders of the highest peaks to break the surface. They looked like the teeth of a submerged beast, or perhaps the masts of ships in a fog that never lifted.", "The sun hung low and heavy, a disc of hammered gold that blazed through the haze without mercy. It did not warm them. At this altitude, above four thousand meters, the light was a physical thing, a pressure against the eyes. Wen squinted, her hands tucked into the sleeves of her pale linen tunic to keep from trembling. The cold here was different from the biting wind of the gorge or the dry chill of the salt flats. It was a clean, absolute zero that settled into the marrow, turning the blood to slush.", "Her ponytail, now entirely white, whipped across her face in the thin wind. She tied it back with the faded blue cloth, her fingers numb and clumsy. The frost on her fingertips had not fully melted; it lingered in the knuckles, a faint blue stain that faded only when she pressed her palms together. She looked out at the sea of clouds and felt the strange, hollow sensation of standing on the roof of the world. There was nothing above but sky, and nothing below but mist. She was suspended in a moment of precarious balance, a single point of warmth in a landscape of endless, indifferent white.", "Mo stood beside her, her conical bamboo hat tilting in the wind. The ferrywoman’s face was weathered, her eyes narrowed against the glare. She did not speak. She did not need to. Her presence was a solid block of stone in the shifting air, a reminder that even in the most ephemeral places, there are anchors. Shen Yu stood slightly behind, his surveyor’s staff held loosely, his glasses reflecting the blinding light. He looked small against the immense backdrop, a speck of ink on a page of snow.", "Wen took a breath, and the air burned in her lungs, sharp and sweet. She looked back down the path they had climbed, a thin ribbon of rock and snow that disappeared into the cloud layer below. The journey had been long, a ledger of debts and distances, of water borrowed and water given. But this was the edge of the ledger. This was where the numbers stopped, and the story began again."], "img": "img/p106.jpg", "pw": true}, {"no": 107, "ch": 22, "ctitle": "", "part": "", "paras": ["A sound broke the silence. It was not a bird, nor the wind, but a rhythmic crunching of boots on stone, accompanied by the heavy, muffled breathing of many people moving in unison. Wen turned. Through the mist, a shape emerged. It was a palanquin, large and ornate, carried by twelve men whose faces were hidden behind wide-brimmed hats. The wood of the palanquin was dark, polished to a mirror shine, and it swayed gently with the gait of its bearers.", "As they drew closer, the air seemed to thicken, the pressure of the mountain pressing down on them. The lead bearer stopped, and the palanquin settled onto the flat rock. The door slid open with a soft, precise click. A hand reached out, pale and slender, resting on the wooden frame. Then he stepped out.", "Lord Bao Heng.", "He was heavier than Wen had imagined, his body broad and rounded, draped in a deep red silk robe that seemed to absorb the harsh light. A round black cap sat perfectly on his head, and his face was pale, smooth, and gentle. He did not look like a tyrant. He looked like a man who had not been rushed in a long time, whose movements were deliberate and calm. He wore a soft smile, the kind that suggests he has already decided what to say before he opens his mouth.", "Behind him, a single servant stood, holding a small, leather-bound case. No guards. No soldiers. Just the twelve bearers, who now stepped back, forming a silent semicircle, their breath misting in the cold air.", "Wen felt a jolt of surprise, then a slow, dawning realization. This was not a trap. Or if it was, it was a trap of a different kind, one built on courtesy and patience. Mo’s hand tightened on her shoulder, a subtle warning. Shen Yu shifted his weight, his eyes darting to the servant, then to the bearers, calculating angles and exits.", "Bao Heng looked at Wen. His eyes were dark, deep, and utterly calm. He did not bow, but he inclined his head slightly, a gesture of respect that felt more genuine than any formal greeting could be.", "\"I did not come to fight,\" he said, his voice low and clear, carrying easily over the thin air. \"I came to talk. The water is not a weapon, Wen Lan. It is a resource. And I believe we have been very bad at managing it.\" He paused, his gaze steady. \"I am alone. My men are only there to keep me warm. Please, do not be afraid.\"", "Wen looked at Mo. The ferrywoman’s face was unreadable, her eyes sharp and watchful. But she did not move. She did not reach for her pole. She simply waited, letting the moment settle like silt in a still pool."], "img": "img/p107.jpg", "pw": false}, {"no": 108, "ch": 22, "ctitle": "", "part": "", "paras": ["They sat on a flat slab of rock, the stone warm from the sun despite the altitude. Bao Heng signaled to his servant, who produced a small black iron pot. Soon the air filled with the sharp, green scent of tea, cutting through the sterile cold of the pass. Wen wrapped her fingers around the small cup, feeling the heat seep into her frozen skin. It was a simple comfort, a tether to the village, to the pool, to the life she had left behind.", "Bao Heng unwrapped a scroll from his robe. It was not a map but a chart, detailed and meticulous, filled with lines and numbers. He spread it out on the rock, smoothing the edges with his heavy hands.", "\"These are the drought records for the last three years,\" he said, his voice quiet. He pointed to a section of the chart. \"See this? The river flow dropped by forty percent in the first year. In the second, it was down by sixty. The third year...\" He tapped the line, which plummeted to near zero. \"The river stopped. Not because of the weather. Not because of the glaciers. Because of us.\"", "Wen looked at the chart. The numbers were precise, undeniable. She had seen the dry delta, the struggling terraces, the salt flats. She had felt the absence of water in her bones. But seeing it laid out in black ink, a ledger of her own making, was a different kind of pain.", "\"I knew your mother,\" Bao Heng said. He did not look at Wen directly. His eyes were fixed on the chart, but his voice softened. \"Lin Hua. She was the best person I ever met. She understood the river better than anyone. She told me that water is not a thing to be owned, but a thing to be shared. I believed her. I thought I was doing the same, by storing it for the dry seasons. But I was wrong. I was hoarding it. And in my arrogance, I forgot that the river belongs to everyone downstream.\"", "A heavy silence settled over the rock. Wen stared at the line on the chart, the ink blurring slightly as her vision tightened. The name Lin Hua hung in the cold air, solid and heavy, weighing on her chest like a stone pulled from the riverbed. She had never met her, but she had carried her name, her power, her debt. And now here was the man who had caused it, sitting across from her, admitting his failure.", "\"You knew her?\" Wen managed to ask, her voice thin and small in the vast emptiness of the pass.", "\"I did,\" Bao Heng said. \"And I failed her. I failed the river. And I failed you.\" He looked up, and for the first time, his gentle smile faded, replaced by a look of profound, honest sorrow. \"I am here to make it right. But I cannot do it alone. I need you. I need your understanding, and your power. But I need to know if I can trust you.\""], "img": "img/p108.jpg", "pw": true}, {"no": 109, "ch": 22, "ctitle": "", "part": "", "paras": ["Wen set the cup down, the ceramic cool against her palm now that the heat had drained into the stone, and she looked at Bao Heng with the same scrutiny she gave to a cracked dam, searching for the hairline fracture that would let the pressure through. He was not a monster, but a man who had been terrified of the drought and the thirst of the people, and in that fear he had made a choice that cost everything downstream.", "\"My mother wrote to me,\" Wen said, her voice steady though her hands trembled beneath her fingers, and she laced them together to stop the shaking. \"Before she went to the glacier. She wrote that a river is not a bank. You cannot store it. You cannot lock it away. It is a current. It moves. It gives. It takes. If you hold it, you kill it.\"", "Bao Heng nodded slowly, his heavy hands resting on the edge of the chart. \"I know,\" he said. \"I know. And I am sorry. But the drought is real, Wen Lan. The people are thirsty. If I release the water, and it floods, and people die, who is to blame? If I hold it, and the fields dry up, and people starve, who is to blame? I am trying to save them. I am trying to save us all.\"", "\"Then show me the answer,\" Wen said.", "The words hung in the air, sharp and clear, cutting through the sterile cold of the pass. Bao Heng looked at her, and for a moment, she saw a flicker of something in his eyes. It was not anger, but respect, maybe even hope, the kind of fragile thing that survives only if it is handled gently.", "\"I will show you,\" he said. \"But it will not be easy. It will be dangerous. And it will cost you. But I will show you.\"", "Wen looked at Mo, who was watching them with her face calm and her eyes sharp, and the ferrywoman gave a slight nod, a gesture so subtle that only Wen would have seen it. Shen Yu was quiet, his glasses reflecting the light, his expression unreadable, but he was there, solid and present, a part of the ledger now.", "Wen stood up, and the wind was stronger now, whipping her white ponytail across her face, so she did not brush it away, letting it fly like a banner of frost and memory against the endless, white expanse of the Cloud Sea that hid the world below.", "\"I am ready,\" she said."], "img": "img/p109.jpg", "pw": false}, {"no": 110, "ch": 22, "ctitle": "", "part": "", "paras": ["Bao Heng rose to his feet, the deep red of his silk robe snapping in the high-altitude wind. He looked at Wen with a stillness that felt heavier than the stone floor beneath them, his expression carved from a kind of quiet, profound pity.", "\"I will give you a day,\" he said. \"One day to think. To decide. To understand.\" He gathered the scroll, rolling it tight until the bamboo rod clicked, and tucked it into the fold of his sleeve. \"But Wen, I must tell you something. The source is not what you think. It is not a spring. It is not a lake. It is a door. And once you open it, you cannot close it again.\"", "A chill moved through Wen that had nothing to do with the altitude. A door. A source that was a door. What kind of water came from a door?", "Before she could form the question, a sound broke the silence behind the palanquin. A wet splash, followed by the sharp crunch of boots on slick stone. Wen turned.", "Gao was there.", "He was soaked. His green robe hung dark and heavy against his frame, the silk collar clinging to his chest. His hair was matted, plastered to his forehead in a way that stripped away his usual charm, leaving only a tired, frightened man standing in the mist. He hovered behind the palanquin, hands hanging limp at his sides, his face pale and gaunt in the grey light.", "\"Gao,\" Wen said, her voice flat and cold.", "He did not look at her. He stared at the wet stone, his eyes red-rimmed and swollen. He opened his mouth, his lips moving silently, but no sound came out. Then, with an effort that seemed to cost him everything, he mouthed a single word.", "\"Forgive.\"", "Wen stared at him. The word hung in the air, heavy and broken, like a rope cut mid-haul. She looked at Bao Heng, who watched Gao with a calm, unreadable stillness. She looked at Mo, who stood silent, her face a mask of weathered stone. She looked at Shen Yu, who was shaking his head slowly, in disbelief, his glasses catching the dim light.", "And then she looked out at the Cloud Sea, the endless white expanse that hid the world below. She was ready. She had to be. The door was waiting."], "img": "img/p110.jpg", "pw": false}, {"no": 111, "ch": 23, "ctitle": "The Mother in the Ice", "part": "PART FIVE: THE SOURCE", "paras": ["*The Bearer's Almanac, Entry 23: The last thing a river gives is its beginning.*", "The wind died the moment they crested the final ridge. It was not that the air stopped moving; rather, the violence of the altitude simply ran out of breath. Above them, the sky was a bruised purple, so high and thin it seemed to vibrate against the dark tips of the peaks. Below, the Crater Lake lay in perfect, terrible silence.", "It was a circle of water so deep and so clear that it looked less like a lake and more like a hole in the world where the sky had been scooped out and left there. The water was not blue. It was a depth of black that held the light of the high sun in its center, a single point of white fire that did not shimmer, did not ripple, and did not move. The ring of black peaks surrounding the water stood like the spokes of a broken wheel, jagged and ancient, casting long shadows that met in the middle of the lake.", "Wen Lan stood at the edge of the ice shelf that separated the rock from the water. Her boots, wrapped in soft cloth, found no purchase on the slick, transparent surface. Beside her, Master Gao stood frozen, his green robe stiff with the cold, his eyes wide and unblinking. Shen Yu gripped his surveyor’s staff, his knuckles white, his glasses fogging despite the freezing air.", "\"This is it,\" Shen Yu whispered. His voice sounded thin in the heavy, pressurized air. \"The source.\"", "Wen looked at the water. She could see the bottom, or what she thought was the bottom. It was a smooth, glassy expanse that stretched out into the dark. There were no stones, no silt, no life. Just a perfect, empty mirror reflecting the jagged teeth of the mountains.", "\"The ledger is empty here,\" Wen said. Her voice was steady, but her hands were trembling. She could feel the water, or the absence of it, pulling at her fingertips. It was not a pull. It was a hunger. A vast, silent, ancient hunger that had been waiting for her.", "Auntie Mo stepped forward. Her bamboo pole, usually her anchor, lay discarded on the rock. She looked at the lake with the same expression she had worn on the ferry for thirty years: a mixture of respect and exhaustion.", "\"Walk slowly,\" Mo said. Her voice was low, almost a growl. \"The ice is thin over the center. Do not look down. Look at the peaks.\"", "Wen looked at the peaks. They were sharp enough to cut the sky. She looked at the water. It was deep enough to swallow the sky."], "img": "img/p111.jpg", "pw": true}, {"no": 112, "ch": 23, "ctitle": "", "part": "", "paras": ["They crossed the ice in a single line, their footsteps cracking softly against the surface. The sound did not echo; the dark water below absorbed it, swallowing the noise before it could return. Wen kept her eyes on the man ahead of her, tracking the back of Gao’s green robe and the sway of Shen Yu’s staff. She did not look down. She trusted Mo’s warning.", "Halfway across, the light changed. The black water beneath them began to glow with a pale, inner luminescence. Wen stopped, and Gao halted behind her. Shen Yu turned, his face pale in the dim light.", "\"Keep going,\" Mo said. She was walking ahead of them now, her bare feet silent on the ice.", "Wen looked down, against every instinct that told her to avert her gaze.", "In the center of the lake, suspended in the clear water, was a shape. Not a stone, nor a shadow. A person.", "A woman in a deep-blue coat stood upright in the water, her feet resting on the unseen bottom. Her hair, long and black, floated around her head in a halo of dark silk. Her eyes were closed. Her face was still, peaceful, and utterly cold. In her right hand, she held a small bronze gourd, its mouth sealed with wax.", "Wen’s breath caught in her throat. She knew that coat. She knew the way the fabric fell, the deep, specific shade of blue that her mother had loved. She recognized the shape of the gourd, the one she had carried on her back since she was four years old, the one she had never understood until now.", "\"Mama,\" Wen whispered. The word fell into the silence and vanished.", "The woman did not open her eyes. She did not move. But the water around her seemed to tighten, a subtle shift in the current that Wen felt in her bones. The ice beneath them groaned, a low, resonant hum that vibrated in Wen’s teeth.", "\"It is not a spirit,\" Shen Yu said, his voice trembling. He adjusted his glasses, his hands shaking. \"It is a body. Preserved in the ice. The temperature is too low for decay.\"", "\"It is a bearer,\" Mo said. She stopped walking. She turned to face the center of the lake, her face hard and set. \"And she is holding the door shut.\"", "Wen stared at her mother’s face. The ice was clear, but it was not empty. It was full of a cold so profound it had become a solid thing, a wall of silence between the world and the water."], "img": "img/p112.jpg", "pw": false}, {"no": 113, "ch": 23, "ctitle": "", "part": "", "paras": ["Wen knelt on the ice. The cold bit through her boots, through her trousers, into the bone of her shins. She did not feel it. She placed her hand flat on the surface, her fingers spread, her palm pressing against the glassy skin of the lake.", "The cold rushed up her arm, not biting, but flowing. It was a river of ice, a torrent of winter that moved through her veins with the speed of a flash flood. She gasped, but the sound was swallowed.", "And then, through the water, through the ice, through the silence, she heard a voice.", "It was not a sound. It was a pressure. A vibration that started in her hand and traveled up her arm, into her chest, into the center of her mind. It was her mother’s voice, but stripped of all warmth, stripped of all softness. It was the voice of the river itself, cold and deep and inexorable.", "*Wen.*", "The name hung in the air, sharp and bright.", "*I did not freeze to die,* the voice said. *I froze to hold.*", "Wen’s eyes widened. The ice beneath her hand trembled. She could feel the glacier above them, the massive bulk of the mountain pressing down on the water, the slow, inexorable creep of the ice toward the lake. Without a hand to hold it, without a bearer to anchor the melt, the glacier would slip. The water would surge. The river would break.", "*I held the door,* her mother’s voice continued, *so the water could rest. So the people below could drink. I gave my warmth to the ice. I gave my life to the silence. And it was not enough. The cold is always hungry, Wen. It always wants more.*", "Wen’s hand shook on the ice. She could feel the glacier’s crushing pressure, the immense force of the mountain. She could feel her mother’s hand, the one holding the gourd, pressing against the current from below.", "\"You could have left,\" Wen said. Her voice was thin, barely a whisper. \"You could have walked away.\"", "*I could not,* her mother’s voice replied. *A river does not walk away from its source. It holds. It waits. It pays.*", "The ice groaned again, louder this time. A crack appeared in the surface, a thin white line that ran from Wen’s hand out into the dark water.", "*Now it is your turn,* the voice said. *The door is open. The choice is yours. Hold the ice, and the river stays dead. Or break the ice, and the river wakes. But someone must pay.*"], "img": "img/p113.jpg", "pw": true}, {"no": 114, "ch": 23, "ctitle": "", "part": "", "paras": ["Wen pulled her hand back. The cold lingered in her fingertips, a white frost that refused to melt while the wind whispered against her ears. She looked at Shen Yu, who was staring at the crack in the ice with wide, terrified eyes, and then at Gao, who had dropped his ledger, his face ashen and hollow. Mo stood nearby with her arms crossed, her expression set in stone.", "\"The choice,\" Wen said. Her voice was steady, though her pulse hammered a frantic rhythm against the silence. \"Hold the ice, and the river stays dead. Or break the ice, and the river wakes.\"", "\"Yes,\" Mo said. \"That is the bearer’s curse. One holds the water, and the water holds the world. But the holder pays in warmth. In life. In time.\"", "\"And if I don't hold it?\" Wen asked.", "\"Then the glacier slips,\" Shen Yu said. He stepped forward, his voice urgent and sharp. \"The pressure will crush the lake. The water will surge down the valley. It will be a flood. A catastrophe. The villages, the terraces, the delta. All of it will be washed away.\"", "Wen looked at the ice. She could feel the crushing pressure of the mountain above, the immense force pressing down on the stillness. She could feel her mother’s hand, the one holding the gourd, pressing against the current from below.", "\"But there is another way,\" Wen said.", "Mo’s eyes narrowed. \"What way?\"", "\"The ledger,\" Wen said. She looked at Gao. \"The water is not mine. It is not my mother’s. It is the river’s. It belongs to everyone who drinks downstream. If one person holds it, it is a burden. If everyone holds it, it is a duty.\"", "Gao shook his head. \"You cannot command the river. You cannot force the water to move. It is beyond your power.\"", "\"I am not going to command it,\" Wen said. \"I am going to ask for it. I am going to ask every town, every village, every person who has ever drunk from this river to open their gates. To let the water flow. To share the load.\"", "Shen Yu looked at her. \"You mean to release the stored water. All of it. At once.\"", "\"I mean to teach them,\" Wen said. \"I mean to show them how. I mean to make them part of the river, not just its drinkers.\"", "Mo looked at Wen for a long time. Then she nodded, once, slowly.", "\"It is a harder path,\" Mo said. \"It requires trust. It requires time. And it requires that you are willing to let go.\"", "\"I am willing,\" Wen said."], "img": "img/p114.jpg", "pw": false}, {"no": 115, "ch": 23, "ctitle": "", "part": "", "paras": ["Wen stood up, her knees protesting with a stiffness that felt like dry clay, but she planted her boots firmly on the ice. She looked toward the center of the lake, where the dark water held the still shape of her mother, and then back to the jagged crack that split the white surface like a fault line in a dry terrace wall.", "\"I will teach them,\" Wen said. Her voice was clear, cutting through the thin mountain air with a resolve that surprised even her. \"I will walk down the river. I will go to every town, every village, every city. I will show them how to open their gates. How to share the water. How to hold the river together.\"", "Gao stepped forward, his silk robe snapping in the high-altitude wind. \"You cannot do that alone. It will take years. Decades. The people will not listen to a sixteen-year-old girl.\"", "\"They will listen,\" Wen said, meeting his gaze without flinching. \"Because I am not asking them to give up their water. I am asking them to give it back. To the river. To each other.\"", "Shen Yu looked at her, his face pale, his glasses fogged with the cold and the sudden, terrified hope in his eyes. \"It is a lot to ask.\"", "\"It is a lot to give,\" Wen replied, and the simple weight of those words settled into the silence. \"But it is what we have to do.\"", "Mo stepped closer, her bare feet finding purchase on the slick surface. She placed her hand on Wen’s shoulder, her grip firm, warm, and steady as the old ferry pole she always leaned on.", "\"You are ready,\" Mo said. \"Not because you are strong. But because you are willing to share.\"", "Wen nodded. She looked at the ice again. The crack had grown, a thin white line running from her hand out into the dark water, trembling with a low, resonant hum that vibrated in her bones like a struck gong.", "At the far rim of the lake, a palanquin arrived. The red silk of Lord Bao Heng’s robe snapped violently in the wind. He looked out over the ice, his hand over his mouth, his face a mask of shock and awe.", "He saw Wen. He saw Mo. He saw the crack in the ice.", "And he understood."], "img": "img/p115.jpg", "pw": false}, {"no": 116, "ch": 24, "ctitle": "A Thousand Gates", "part": "PART FIVE: THE SOURCE", "paras": ["*The Bearer's Almanac, Entry 24: A river is strong only where it is shared.*", "The wind at the crater rim did not blow; it pushed. It pressed against their chests with a physical insistence, carrying a taste of iron and ice that coated the back of Wen Lan’s throat. She stood with her back to the jagged lip of the crater, the white frost in her hair stiff and bright against the dark sky. Her hands were tucked into the sleeves of her pale linen tunic to keep the cold from biting into her knuckles.", "The map Shen Yu had unrolled on a flat slab of stone was not a map of the river as it had been, but of the river as it could be. It was a sprawling, intricate diagram of channels, weirs, and sluices, drawn in ink that had long since dried. Shen Yu’s hands, stained with soot and ink, trembled slightly as he tapped a point near the edge of the paper.", "\"Nine kilometers an hour,\" he said, his voice thin against the wind. He adjusted his brass-rimmed glasses, which were fogged with the cold. \"That is the speed of a wave crest in open water, assuming the gradient holds. From here to the delta is two thousand kilometers.\" He looked up, his eyes bright with a frantic, meticulous energy. \"Nine days. If every gate opens at the precise moment the wave arrives, the water does not flood. It flows. It fills the channels without surging. It is a chain reaction of pure hydraulics.\"", "Lord Bao Heng stood beside them, his deep red silk robe snapped by the gale. He was watching the map, not Shen Yu. His face was pale, stripped of its usual soft, smiling deference. He looked, Wen thought, like a man who had been holding a heavy stone for forty years and was only now realizing that the stone was not his to keep.", "\"Two hundred and sixteen hours,\" the Lord said quietly. \"Nine days.\" He reached out and touched a line on the map, a single thin stroke representing the main channel. \"If one gate opens a minute too early, the wave breaks against the next lock. The levees crack. The valley drowns.\"", "\"It is not a minute,\" Wen said. She stepped forward, her boots crunching on the frost-dusted stone. \"It is a heartbeat. It is the difference between a river and a flood.\""], "img": "img/p116.jpg", "pw": true}, {"no": 117, "ch": 24, "ctitle": "", "part": "", "paras": ["Lord Bao Heng turned from the map. The wind tore at the hem of his robe, snapping the gold thread embroidery like a loose string. He looked smaller than he had in the cistern town, smaller than he had in the letters. Here, at the roof of the world, he was just a man in expensive clothes, standing on the edge of a hole in the sky.", "\"My keepers will open the gates,\" he said. His voice was flat, stripped of its usual melodic charm. \"They have waited for this command for a decade. I will send the signal. The mechanism is simple. A drum, a fire, a whistle. They will do it.\" He paused, and the silence stretched between them, taut as a tracker’s rope. \"But they will not believe you. The people in the lower towns, the farmers, the fishermen. They have been told that the water is being stolen by the upper reaches. They have been told that you, the Bearer, are the one holding it back. They are angry, Wen Lan. They are frightened. And frightened people do not open gates. They close them.\"", "Wen Lan felt the old heat rise in her chest, the frustration of being spoken to as if she were a problem to be solved rather than a person to be trusted. But she kept her voice level. She looked at the Lord, not with anger, but with a clear, sharp assessment.", "\"They are not angry because they are stupid,\" she said. \"They are angry because they are thirsty. And because they have been lied to.\" She stepped closer to the map, her shadow falling across the ink lines. \"You cannot command them to trust you. You cannot write a letter that tastes like water. But I can walk to them. I can stand in their fields and show them the water. I can show them that it is not a gift you are giving, but a debt you are paying.\"", "The Lord looked at her, and for a moment his face was unreadable. Then he nodded, a slow, heavy motion. \"Then that part is yours,\" he said. \"The persuasion. The walking. The talking.\"", "\"The rest is yours,\" Wen replied. \"The engineering. The timing. The keeping the river from eating the valley.\""], "img": "img/p117.jpg", "pw": false}, {"no": 118, "ch": 24, "ctitle": "", "part": "", "paras": ["Auntie Mo had been silent. She stood apart from the map, her conical bamboo hat shielding her eyes, her bare feet planted firmly on the ice. She did not look at the diagrams or the calculations. Her gaze fixed on the crater, on the dark, still water that held the shape of Wen’s mother, and then on the three of them.", "When she spoke, her voice was low and rough, like the scrape of a pole against a muddy bank. It cut through the wind without effort.", "\"A river belongs to everyone who drinks downstream,\" she said.", "Lord Bao Heng flinched. It was a small movement, a tightening of the jaw, a sharp inhale. Wen watched it happen, and she felt a strange, cold satisfaction, not of triumph, but of recognition.", "\"The first ones who tried to hold the water back,\" Mo continued, her eyes fixed on the Lord, \"were not wicked. They were not greedy. They were frightened. They saw the flood come and thought they could catch it in a net. They thought if they held it still, it would stop moving. But water does not stop. It waits. And when it moves, it takes everything it can carry.\"", "Mo took a step forward. Her bare toes curled against the ice. \"You built your cisterns because you were afraid of the dark. But the dark is not the water. The dark is the silence between the drops. You cannot drink silence, Lord Bao. You can only drink the river.\"", "The Lord’s hand went to his mouth. He pressed his lips together, but a tear slid down his cheek, tracing a wet line through the dust on his face. He did not wipe it away. He stood there, in the howling wind, and wept. It was the quiet, exhausting sobbing of a man who has carried a weight for so long that he has forgotten it is possible to put it down.", "Wen Lan watched him, and the anger in her chest dissolved, replaced by a heavy, tender pity. He was not a villain. He was a man who had tried to build a wall against the tide, and the tide had won, as it always does.", "\"Mo Ayi,\" Wen said softly.", "\"Yes,\" Mo said. She did not look at Wen. She looked at the water. \"Now go. The wave does not wait for tears.\""], "img": "img/p118.jpg", "pw": true}, {"no": 119, "ch": 24, "ctitle": "", "part": "", "paras": ["They descended the first slope of the gorge as the sun began to set, painting the ice in shades of amber and bruised purple. The air was thinner here, sharper, and every breath felt like drinking cold iron. Wen Lan walked with her boots wrapped tight, her white ponytail whipping against her back, the blue cloth tie frayed but holding.", "Shen Yu walked beside her, his surveyor’s staff tapping a steady rhythm against the rock. He was quiet, his usual chatty anxiety dampened by the scale of what they were doing. He carried a small drum under his arm, a simple wooden thing with a leather head, and a bell on a long cord.", "\"The signal,\" he said, testing the weight of the drum. \"It has to travel faster than the wave. If the town hears the drum before the water arrives, they have time to open the gate. If they hear it after, the gate is already flooding.\"", "\"Smoke,\" Wen said. She pointed to a cluster of dry brush at the edge of a path. \"Burn it. Make a column. It will be visible for miles.\"", "\"A column of smoke is slow,\" Shen Yu said. \"It drifts. The wind is against us. The drum is better. Sound travels faster than sight in this air.\"", "\"Then we do both,\" Wen said. \"We do everything.\"", "They walked in a line, Mo leading, her pole clicking against the stone. The Lord Bao Heng had sent a rider ahead, a young man with a red flag, to prepare the first town. The town was a cluster of stone houses built into the cliff face, dry and dusty, the fields below cracked and yellow.", "When they reached the first gate, a heavy wooden structure set into the rock, Wen stopped. The gate was closed. The water behind it was still, dark, and deep.", "\"Open it,\" Wen said.", "The gate-keeper, an old man with a face like dried leather, looked at her. He did not move. He looked at the Lord Bao Heng, who stood behind her, his red robe a splash of color in the grey dust.", "\"We have orders,\" the old man said. \"To wait.\"", "\"To wait for what?\" Wen asked.", "\"For the signal.\"", "Wen looked at Mo. Mo looked at the gate. And then Mo looked at Wen, and nodded, just once.", "Wen Lan stepped forward. She did not speak. She reached out and touched the wooden frame of the gate. She felt the water behind it, a cold, heavy presence, pressing against the wood. She pushed. Not with her power, but with her will. The gate groaned, the wood creaking under the strain, and then it swung open.", "The water rushed out, not as a flood, but as a stream, a thin, steady ribbon of silver that hit the dry field below and began to spread."], "img": "img/p119.jpg", "pw": false}, {"no": 120, "ch": 24, "ctitle": "", "part": "", "paras": ["The water hit the earth with a sound like a sigh. It spread, slow and purposeful, soaking into the cracked soil, darkening the dust, turning it into a rich, dark brown. The old gate-keeper stared at the water, his mouth open, a forgotten word on his lips.", "Then, from the top of the cliff, a sound cut through the air. A whistle, shrill and clear, followed by the deep, resonant thud of a drum.", "A figure appeared on the path above. It was Master Gao. He was lowering himself down the cliff on a rope and pulley that Shen Yu had rigged in a panic. He was not wearing his green silk robe. He was in a plain blue shirt, his hands raw and bleeding from the rope.", "He slid down the rope and landed in the mud with a thump. He did not stand up. He stayed in the mud, breathing hard, his grey-streaked topknot disheveled. He looked at Wen, and he looked at the water, and he smiled. It was not his usual charming smile. It was the tired, relieved smile of a man who has finally put down a heavy load.", "He reached into his pocket and pulled out a small, brass whistle. It was the same brass whistle he had blown at the cistern. He held it up, and then, with a deliberate motion, he dropped it into the stream.", "The whistle sank, and the water closed over it.", "Mo Ayi said nothing. She simply leaned on her pole and watched the water flow. The drum beat again, closer this time, a steady rhythm that matched the pulse of the river.", "Wen Lan watched the water spread, and she felt the frost in her hair begin to fade, just a little, as if the cold were being drawn out of her by the warmth of the earth. The river was moving. It was not a flood. It was a promise.", "She turned to Shen Yu. \"Next town,\" she said.", "\"Next town,\" he agreed."], "img": "img/p120.jpg", "pw": false}, {"no": 121, "ch": 25, "ctitle": "The River Wakes", "part": "PART FIVE: THE SOURCE", "paras": ["*The Bearer's Almanac, Entry 25: The river does not remember being stopped.*", "The ninth dawn broke thin and pale over the rim of the crater. Wen Lan stood at the edge, her breath misting in the cold air, and watched the water begin. It did not rush. It crept, a single thread of blue-white clarity slipping over the lip of the stone, finding its way down the ancient channel carved by millennia of rain. Below, the world was still holding its breath.", "Far down the valley, in the misty hollows where the first gates waited, a ripple spread. It was subtle, a shiver in the stagnant pools, a sudden glint in the eyes of the fish that had been waiting in the mud. Then the second gate opened, and the third, a chain of light traveling down the spine of the country. It moved with the steady, inexorable pace of a tide that had been long delayed, turning the dry channels into rivers and the silent towns into communities of sound.", "Wen watched the thread become a ribbon, then a stream. She could feel the pull of it, a gentle tug in the air that matched the rhythm of her own pulse. It was not a surge. It was a restoration. The water did not demand; it offered. And as it flowed, the frost that had settled on her shoulders began to loosen, not melting, but releasing, as if the cold had been a coat she had worn too long and was now being taken off by invisible hands.", "Shen Yu stood beside her, his glasses fogged, his hand trembling slightly as he checked his map. \"The flow rate,\" he murmured, his voice thick with emotion. \"It matches the historical records. Exactly. To the cubic meter.\"", "\"Good,\" Wen said. Her voice was quiet, but it carried the promise. \"Then it is working.\"", "The river was waking up. Not all at once, but in stages, like a sleeper stretching out limbs that had been folded for too long. Each gate opened with a soft hiss, a release of pressure that felt like a sigh from the earth itself. And with each hiss, the world below grew a little brighter, a little more alive."], "img": "img/p121.jpg", "pw": true}, {"no": 122, "ch": 25, "ctitle": "", "part": "", "paras": ["Wen Lan’s hands were cold to the elbow. The frost had crept up her wrists, settling in the creases of her skin, a fine white dust that sparkled in the early light. She could feel the water in the air, heavy and wet, waiting for her command. But this time, she did not pull. She did not lift. She reached out, not with her arms, but with her will, and let the water come to her.", "It rose from the channel below, a great spiral of blue and white, twisting up through the air as if drawn by an invisible spindle. It was vast, a column of moving light that caught the sun and scattered it into a thousand tiny stars. Wen stood in the center of it, her hair whipping around her face, her eyes closed. She felt the sheer volume of life and memory contained in that swirling mass.", "And then she released it.", "Not back into the channel, but outward, into the air, into the atmosphere, into the clouds that had been waiting to rain. The spiral broke apart into a million droplets, hanging in the air for a moment, suspended, before drifting away on the wind. It was a gift, not a debt. A giving back.", "The cold left her fingers one by one. First the pinky, then the ring, then the middle. It felt like blood returning to a limb that had been numb for a long time. She opened her eyes, and the world was clearer, sharper, the colors more vivid. The white in her hair began to loosen, a faint dark sheen showing at the roots.", "She looked at her hands. They were warm. They were hers.", "\"I'm done,\" she said, and her voice sounded different, lighter, as if a stone had been lifted from her chest.", "Shen Yu looked at her, his eyes wide. \"Is it... is it over?\"", "\"Yes,\" Wen said. \"The ledger is balanced.\""], "img": "img/p122.jpg", "pw": false}, {"no": 123, "ch": 25, "ctitle": "", "part": "", "paras": ["The ice cracked with a sound like a thunderclap, sharp and final. A fracture ran across the surface of the frozen lake, splitting it in two, and the water beneath surged up, pushing the ice aside. In the middle of the break, a figure rose.", "Lin Hua gasped, her body arching as she drew a deep, shuddering breath. Her hair, long and black, spilled around her shoulders, and her eyes, closed, slowly opened to the light. She was pale, her skin almost translucent, but her chest rose and fell with the steady rhythm of life.", "Wen ran. She did not think, did not calculate the distance or the speed. She simply ran across the broken ice, her boots skidding on the wet surface, and threw herself into her mother’s arms.", "Lin Hua wrapped her arms around her daughter, holding her tight, her face buried in Wen’s hair. She was crying, silent tears that tracked down her pale cheeks.", "\"You are so tall,\" she whispered, her voice rough with disuse. \"My little girl is so tall.\"", "Wen buried her face in her mother’s neck, smelling the cold scent of ice and earth. She felt the warmth of her mother’s body, the beat of her heart, strong and steady. It was a warmth that no amount of frost could touch.", "Mo Ayi and Shen Yu stood on the shore, watching. Mo leaned on her pole, her face soft, her eyes bright. Shen Yu wiped his glasses, though they were clean.", "The Lord Bao Heng, who had arrived with the last of the drums, knelt on the rock. He did not speak. He bowed his head, low and long, a gesture of respect and sorrow and gratitude. He had seen the cost, the debt, the giving back. And he had seen the result. The river was not his. It had never been his. It belonged to the valley, to the people, to the water itself.", "He stayed kneeling for a long time, until the sun had warmed the stone beneath his knees."], "img": "img/p123.jpg", "pw": true}, {"no": 124, "ch": 25, "ctitle": "", "part": "", "paras": ["The walk home took the long way, the route that threaded through every town and terrace along the Clear River. The water ran high and clear, a rushing current that carried the scent of wet earth and green leaves, and it felt less like a river and more like a living thing that had finally remembered how to breathe.", "In the Terrace Plains, Old Tianzhu stood in his fields, his hoe resting against the fence. When he saw them, he smiled, a wide, crinkled smile that reached his eyes. He poured the first cup of water into every jar in his house, a ritual he had not performed in a long time. \"For the roots,\" he said, his voice thick with emotion. \"And for the memory.\"", "In the Gorge of Hanging Steps, the trackers sang. It was an old song, a song of rope and stone and the strength of many hands. They sang it as they hauled their boats down the rapid, the water churning around them, the spray flying into the air. They sang it for Wen, for her mother, for the river that had come back to them.", "In Floating Lantern Town, the rafts settled on the rising lake, their lights reflecting in the water. The water merchants, who had been selling water by the cup, now watched the river flow freely. They did not sell. They shared. The town was bright, alive, the lanterns glowing in the twilight, a constellation of light on the water.", "Wen’s hair regained its black near the roots, a slow, steady change that she felt more than saw. The frost was gone, replaced by the natural warmth of her own body. She walked with her mother, her hand in Lin Hua’s, feeling the strength of her grip.", "\"We are going home,\" Lin Hua said.", "\"Yes,\" Wen said. \"We are going home.\""], "img": "img/p124.jpg", "pw": false}, {"no": 125, "ch": 25, "ctitle": "", "part": "", "paras": ["Hollow Pool was waiting, or rather, the memory of it was waiting with the quiet patience of a stone that has been sitting in the current for centuries. The village had gathered at the edge of the basin, their faces turned toward the water with the careful reverence usually reserved for a sleeping elder. The pool was full, the water clear and deep, the pebbles on the bottom visible through the surface like scattered coins in a savings jar. The fish were back, darting in the shadows, their silver scales flashing in the light with the quick, nervous energy of sparrows on a wire.", "Wen walked to the edge of the pool and knelt, the mud soft and damp under her knees. She reached out and put her hand in the water. It was cool, clean, and alive. She let it run through her fingers, feeling the current, the temperature, the subtle pulse of the water against her skin. She did not call it. She did not lift it. She simply let it be, her palm resting flat on the surface as if listening to a heartbeat.", "Then she opened the bamboo gourd that had hung at her side for a hundred days. She had not drunk from it, not once. It was empty, a symbol of the journey, of the debt, of the giving.", "She lifted it to her lips and drank. The water was sweet, cool, and perfect. It tasted like home.", "She lowered the gourd and smiled. The village smiled back, a ripple of relief that moved from face to face.", "Far up the mountains, a thousand gates stood open in the morning light, silent and steady, the river flowing through them, carrying the life of the valley to the sea. The ledger was balanced. The debt was paid. The river was free.", "Wen stood up and looked at her mother, her friends, her village. She was home."], "img": "img/p125.jpg", "pw": false}], "chapters": [{"n": 1, "title": "The River That Overslept", "part": "PART ONE: THE DRY POOL", "page": 1}, {"n": 2, "title": "What the Pool Remembered", "part": "PART ONE: THE DRY POOL", "page": 6}, {"n": 3, "title": "The Ferry in the Mud", "part": "PART ONE: THE DRY POOL", "page": 11}, {"n": 4, "title": "Master Gao's Offer", "part": "PART ONE: THE DRY POOL", "page": 16}, {"n": 5, "title": "The Dry Delta", "part": "PART ONE: THE DRY POOL", "page": 21}, {"n": 6, "title": "A Hundred Villages", "part": "PART TWO: THE TERRACE PLAINS", "page": 26}, {"n": 7, "title": "The Sharing Trial", "part": "PART TWO: THE TERRACE PLAINS", "page": 31}, {"n": 8, "title": "The Trackers' Road", "part": "PART TWO: THE TERRACE PLAINS", "page": 36}, {"n": 9, "title": "Stairs in the Cliff", "part": "PART TWO: THE TERRACE PLAINS", "page": 41}, {"n": 10, "title": "The Price of a Cup", "part": "PART TWO: THE TERRACE PLAINS", "page": 46}, {"n": 11, "title": "The First Cistern", "part": "PART THREE: THE GORGE AND THE SALT", "page": 51}, {"n": 12, "title": "A Spy's Report", "part": "PART THREE: THE GORGE AND THE SALT", "page": 56}, {"n": 13, "title": "The White Basin", "part": "PART THREE: THE GORGE AND THE SALT", "page": 61}, {"n": 14, "title": "A Cistern Town in the Salt", "part": "PART THREE: THE GORGE AND THE SALT", "page": 66}, {"n": 15, "title": "The Midpoint: A Pipe of Silver", "part": "PART THREE: THE GORGE AND THE SALT", "page": 71}, {"n": 16, "title": "Escape by Water", "part": "PART FOUR: THE FLOATING TOWN", "page": 76}, {"n": 17, "title": "Floating Lantern Town", "part": "PART FOUR: THE FLOATING TOWN", "page": 81}, {"n": 18, "title": "The Lord's Letters", "part": "PART FOUR: THE FLOATING TOWN", "page": 86}, {"n": 19, "title": "The Frost Reaches the Heart", "part": "PART FOUR: THE FLOATING TOWN", "page": 91}, {"n": 20, "title": "The Long Climb", "part": "PART FOUR: THE FLOATING TOWN", "page": 96}, {"n": 21, "title": "The Glacier Valley", "part": "PART FIVE: THE SOURCE", "page": 101}, {"n": 22, "title": "The Cloud Sea", "part": "PART FIVE: THE SOURCE", "page": 106}, {"n": 23, "title": "The Mother in the Ice", "part": "PART FIVE: THE SOURCE", "page": 111}, {"n": 24, "title": "A Thousand Gates", "part": "PART FIVE: THE SOURCE", "page": 116}, {"n": 25, "title": "The River Wakes", "part": "PART FIVE: THE SOURCE", "page": 121}]};
const P = D.pages;
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const $ = id => document.getElementById(id);

// items: cover, pages..., back cover
const items = [{t:'cover',img:'img/cover_front.jpg',alt:'Front cover'}].concat(P.map(p=>({t:'page',p})), [{t:'cover',img:'img/cover_back.jpg',alt:'Back cover'}]);
let wide = matchMedia('(min-width:900px)').matches, spreads = [], cur = 0;

function buildSpreads(){
  spreads = [];
  if(!wide){ items.forEach((_,i)=>spreads.push([i])); return; }
  spreads.push([0]);
  for(let i=1;i<items.length-1;i+=2) spreads.push(i+1<items.length-1?[i,i+1]:[i]);
  spreads.push([items.length-1]);
}
function leaf(i,side){
  const it = items[i];
  if(it.t==='cover') return `<div class="leaf cover"><img src="${it.img}" alt="${it.alt}"></div>`;
  const p = it.p, first = !!p.ctitle;
  const pic = `<img class="pic ${p.pw?'pw':(first?'center':(p.no%2?'f-right':'f-left'))}" src="${p.img}" alt="Illustration for page ${p.no}" loading="lazy">`;
  const head = first ? `<div class="part">${esc(p.part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div><div class="chnum">Chapter ${p.ch}</div><h2>${esc(p.ctitle)}</h2><div class="orn">❦</div>` : '';
  return `<div class="leaf">${head}${first?pic:''}<div class="txt ${first?'first':''}">${first?'':pic}${p.paras.map(x=>`<p>${fmt(x)}</p>`).join('')}</div><div class="pageno">${p.no}</div></div>`;
}
function render(){
  const s = spreads[cur], book = $('book');
  book.className = 'book ' + (s.length===2?'spread':'single');
  let h = s.map(i=>leaf(i)).join('');
  if(wide && s.length===1 && items[s[0]].t==='page') h += '<div class="leaf blank"></div>';
  book.innerHTML = h;
  scrollTo(0,0);
  $('slider').max = spreads.length-1; $('slider').value = cur;
  $('prev').disabled = cur===0; $('next').disabled = cur===spreads.length-1;
  const a = s[0], b = s[s.length-1];
  const name = i => items[i].t==='cover' ? (i===0?'Cover':'Back cover') : items[i].p.no;
  $('lbl').textContent = s.length===2 ? `Pages ${name(a)}–${name(b)}` : (items[a].t==='cover' ? name(a) : `Page ${name(a)}`);
  store.set('juno.page', items[a].t==='page'?items[a].p.no:(a===0?0:P.length+1));
}
function go(n){ cur = Math.max(0,Math.min(spreads.length-1,n)); render(); }
function goPage(no){ const idx = no<=0?0:Math.min(no,items.length-1); const sp = spreads.findIndex(s=>s.includes(idx)); go(sp<0?0:sp); }
function relayout(){ const now = items[spreads[cur][0]]; const no = now.t==='page'?now.p.no:(spreads[cur][0]===0?0:P.length+1); wide = matchMedia('(min-width:900px)').matches; buildSpreads(); goPage(no); }

$('prev').onclick = ()=>go(cur-1); $('next').onclick = ()=>go(cur+1);
$('slider').oninput = e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '&&!e.shiftKey&&document.activeElement.tagName!=='INPUT'){ if(e.key===' ')e.preventDefault(); go(cur+1);} else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') $('toc').classList.remove('open'); else if(e.key==='Home') go(0); else if(e.key==='End') go(spreads.length-1); });
let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>70) go(cur+(dx<0?1:-1)); });
matchMedia('(min-width:900px)').addEventListener('change',relayout);

// contents
function buildToc(){
  let h = `<h3>${esc(D.title)}</h3>`, part='';
  D.chapters.forEach(c=>{
    if(c.part!==part){ part=c.part; h += `<div class="partname">${esc(part.replace(/^PART\s+\w+:\s*/i,m=>m.replace(':',' ·')))}</div>`; }
    h += `<a data-p="${c.page}"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span><span class="p">p. ${c.page}</span></a>`;
  });
  $('tocbox').innerHTML = h;
  $('tocbox').onclick = e=>{ const a=e.target.closest('a'); if(a){ goPage(+a.dataset.p); $('toc').classList.remove('open'); } };
}
$('bContents').onclick = ()=>$('toc').classList.add('open');
$('toc').onclick = e=>{ if(e.target.id==='toc') $('toc').classList.remove('open'); };
// text size + theme
let fs = +store.get('juno.fs',20); const setFs = ()=>document.documentElement.style.setProperty('--fs',fs+'px'); setFs();
$('bSize').onclick = ()=>{ fs = fs>=26?17:fs+3; store.set('juno.fs',fs); setFs(); };
const themes=['light','sepia','night']; let th = store.get('juno.theme','light');
const setTh = ()=>document.documentElement.dataset.theme = th; setTh();
$('bTheme').onclick = ()=>{ th = themes[(themes.indexOf(th)+1)%3]; store.set('juno.theme',th); setTh(); };

buildSpreads(); buildToc();
goPage(+store.get('juno.page',0));
</script>
