d, but it did not help. The cold was inside her, a deep, structural chill that no fire could reach.", "She heard Mo moving in the next room. The door creaked open, and the ferrywoman walked in, her bare feet silent on the floor. She saw Wen, shivering, her face pale, the white strand at her temple brighter than before.", "\"Come,\" Mo said. She did not ask questions. She took Wen’s hands, which were stiff and white, and led her to a basin filled with warm sand, heated by the day’s sun. She placed Wen’s hands in the sand, holding them there, her grip firm and steady.", "\"It will not help,\" Wen said, her voice slurred with the cold. \"It is not just cold. It is... debt.\"", "Mo looked at her, her eyes dark and serious. \"You gave the water. You took the cold. The ledger balances.\"", "\"But it is not finished,\" Wen whispered. \"It is still taking. I can feel it moving. It is going to my heart.\"", "Mo tightened her grip on her hands. \"Then you must stop. You must walk away. The river is not yours to save. It is not yours to lose.\"", "\"It was the river itself,\" Wen said, her eyes closing. \"It was the last cup. The last drop. If I had not given it, she would have died. And then who? And then who?\"", "Mo held her hands in the warm sand, and for a long time, neither of them spoke. Outside, the wind blew across the salt flat, a low, endless moan, and the town slept, full of water, while Wen Lan turned slowly, inevitably, toward ice."], "img": "img/p070.jpg", "pw": false}, {"no": 71, "ch": 15, "ctitle": "The Midpoint: A Pipe of Silver", "part": "PART THREE: THE GORGE AND THE SALT", "paras": ["*The Bearer's Almanac, Entry 15: Follow the pipe, and the story will tell itself.*", "The pipe ran under the ridge, a silent vein of clay and silver, and Wen followed it with her palm flat against the earth. It was not magic, exactly, but a conversation with the ground. Where the soil was warm and damp, the pipe lay close. Where it was dry and loose, the pipe had sunk deeper, seeking the water table it was stealing.", "They climbed the ridge in a single file, the wind stripping the last of the heat from the salt flats. Shen Yu walked point, his surveyor’s staff tapping the crust of the earth, checking for the subtle hollows that marked the pipe’s route. He was meticulous, counting his steps, noting the slope, his glasses catching the pale afternoon light. Wen walked behind him, her fingers still tingling with the residual cold of the pipe’s pressure.", "At the top of the ridge, the landscape changed abruptly. The white expanse of the salt basin ended, and a grove of dry poplars rose, their leaves skeletal and brown, swaying in a wind that smelled of dust and old wood. It was an anomaly, a pocket of life clinging to the edge of the dead lake, sustained by the hidden flow beneath.", "Wen stopped. She could hear it. A low, thrumming vibration in the air, like a cello string bowed in a distant room. It was the sound of water moving through a large, enclosed space.", "\"There,\" she said.", "They pushed through the poplars. The branches scraped her tunic, leaving faint gray marks. Ahead, rising from the shadow of the trees, stood a structure of dark slate and stone. It was not a house. It was a cistern, vast and squat, its roof thick enough to shelter a herd of cattle. The stone was slick with condensation, a thin film of moisture that caught the light and held it.", "Mo stood at the entrance, her bamboo pole resting on her shoulder. She looked at the cistern, then at Wen, her expression unreadable.", "\"It is bigger than the first,\" Mo said. Her voice was flat, laconic, but there was a tension in it, a tightness that spoke of the magnitude of the discovery. \"Much bigger.\"", "Wen nodded. She did not speak. She was listening to the hum, to the steady, inexorable pulse of the water inside, and she felt the cold in her bones shift, settling deeper into her joints. The ledger was not just a record. It was a living thing, drinking, and she was about to see how much it had taken."], "img": "img/p071.jpg", "pw": true}, {"no": 72, "ch": 15, "ctitle": "", "part": "", "paras": ["The door was heavy, iron-banded wood, and it groaned on its hinges as Mo pushed it open. The air inside was cool and still, carrying the scent of wet stone and something else, something metallic and sharp, like the taste of a coin.", "Wen stepped inside, and the hum became a roar in her ears. The chamber was circular, the walls curved and smooth, rising high above them into shadow. The floor was tiled with dark stone, and in the center, a deep basin held a layer of water so still it looked like a sheet of black glass.", "On the far wall, carved into the stone in letters large enough to be read from the door, was a symbol. A round gate, intricate and precise, with a name beneath it.", "BAO HENG. Cistern Lord.", "And below that, a date. Eleven years.", "Wen’s breath caught in her throat. Eleven years. That was the year after her mother had vanished. The year the river had first begun to thin, the year the first whispers of drought had started in the lowlands. She had always thought it was a coincidence, a tragedy of timing. Now, standing in the cold breath of the cistern, she felt the ground shift beneath her feet, a tectonic plate of her understanding sliding out of place.", "Shen Yu stepped forward, his eyes wide behind his round glasses. He ran his hand over the carving, his fingers trembling slightly. \"It is an inscription,\" he said, his voice hushed. \"Official. This is not a local reservoir. This is state infrastructure. Or what passes for it in this realm.\"", "\"A state that steals,\" Mo said. She did not look at them. She was looking at the water in the basin, her face grim. \"A state that calls its theft management.\"", "Wen reached out and touched the stone. It was cold, but not like the cold of the salt. It was the cold of preservation. The cold of a vault. She thought of her mother, gone up the river twelve years ago, and the parallel was too sharp to ignore. Her mother had walked into the cold. This man had made the river into a vault.", "\"Who is Bao Heng?\" Shen Yu asked, though he seemed to be asking the stone itself.", "\"A name,\" Wen said. \"That is all. A name on a wall. But names have weight, Shen. And this one is heavy.\" She pulled her hand back, and a thin line of frost remained on her fingertips, white and stark against her warm tan skin. She wiped it away quickly, a nervous, perfunctory gesture that she knew would not hide the truth of the debt."], "img": "img/p072.jpg", "pw": false}, {"no": 73, "ch": 15, "ctitle": "", "part": "", "paras": ["They found the side chamber through a narrow opening behind the main basin, a space no larger than a closet, but lined with shelves of stone-bound books. They were not books of stories or history; they were ledgers.", "Shen Yu pulled one down, his fingers moving with the dexterity of a man who had spent his life handling delicate instruments. He opened it, and the pages were filled with columns of numbers, precise and meticulous. Dates. Towns. Amounts of water, measured in cubic meters, converted into silver.", "\"It is a debt book,\" he said, his voice low. \"Every town, every village, every drop of water that has been diverted. It is all here. Calculated. Balanced.\"", "Wen watched him work. He was not just reading; he was summing, his eyes moving rapidly down the columns, his lips moving slightly as he did the math. It was a skill she admired and envied in equal measure. She could feel the water, but she could not count it. He could count it, but he could not feel it.", "\"Three years,\" he said, after a long silence. He looked up, and his face was pale, the color drained from his cheeks. \"Lord Bao holds three years’ worth of the river’s flow. Not a month. Not a season. Three full years.\"", "Mo closed her eyes. \"That is not storage,\" she said. \"That is a dam.\"", "\"It is more than a dam,\" Shen Yu said. \"A dam holds water back. This is a lock. It is trapping the river. It is selling the drought.\" He slammed the book shut, the sound echoing in the small chamber. \"If he releases it, the river will not just flow. It will surge. The pressure will be immense. The lower terraces will be wiped out.\"", "Wen felt a chill that had nothing to do with the temperature. \"He is not saving them,\" she said. \"He is controlling them. He is holding their water hostage.\"", "She thought of the villagers in the Terrace Plains, begging for a trickle, fighting over a cup. She thought of the water-seller in the gorge town, selling his last drop for a silver coin. It all made sense now. It was not a tragedy; it was a business. And the ledger was the proof."], "img": "img/p073.jpg", "pw": true}, {"no": 74, "ch": 15, "ctitle": "", "part": "", "paras": ["The door to the main chamber swung open.", "Gao stood in the doorway, his green robe immaculate, his jade hairpin catching the dim light. Behind him, six mule-boys stood in a loose line, their faces hidden by wide-brimmed hats. They did not look like thieves. They looked like employees, diligent and obedient, waiting for their orders.", "Gao’s smile was pleasant, almost apologetic. He stepped inside, his black boots silent on the stone floor. He looked at the cistern, then at the three of them, and his eyes lingered on Shen Yu for a moment longer.", "\"I hoped,\" Gao said, his voice smooth and unhurried, \"that you would not find this until you reached the Source. It is a delicate matter. A matter of perspective.\"", "Wen stepped forward, her hand resting on her gourd, not out of fear, but out of a need to ground herself. \"You knew,\" she said. \"You knew about the cisterns. You knew about the theft.\"", "\"I knew about the management,\" Gao corrected, his tone gentle. \"Lord Bao is not a villain, Wen. He is a man who is afraid. He is afraid of drought. He is afraid of starvation. He looked at the river, and he saw a resource that could be lost. So he held it. He stored it. He is trying to save this realm from itself.\"", "\"He is selling it,\" Shen Yu said, his voice shaking with anger. \"He is selling the water to the highest bidder. You have seen the prices in the gorge. You have seen the people dying of thirst while you count your silver.\"", "Gao exhaled slowly, a soft, weary sound. \"People are adaptable. They learn to manage with less. Lord Bao’s plan is a temporary measure. Once the reservoirs are full, he will release the water in a controlled manner. It will be equitable. It will be fair.\"", "\"Fair,\" Wen repeated, the word tasting like ash. \"You call it fair. You call it management. I call it theft.\"", "Gao’s smile did not waver, but something hardened in his eyes. \"It is a difference of perspective, Wen. As I said. Now, come with me. We will discuss this further. There is no need for force. There never is.\""], "img": "img/p074.jpg", "pw": false}, {"no": 75, "ch": 15, "ctitle": "", "part": "", "paras": ["Wen looked at Gao, then at the mule-boys standing behind him. They had shifted their weight, their boots shuffling against the stone, their hands drifting toward the belts at their waists. It was a subtle adjustment, the kind of quiet tension that precedes a storm, signaling that they were ready to enforce, to hold, to stop.", "\"No,\" Wen said.", "The word was quiet, but it carried the pressure of the deep cistern, the current of the river, and the cold turning in her own hands.", "Gao’s smile faded, the pleasantness draining away to reveal a cold, pragmatic calculation beneath. \"I would prefer that you did not make this difficult, Wen. It is not necessary.\"", "\"It is necessary,\" Wen said. \"Because the river belongs to everyone who drinks downstream. And you are trying to sell it.\"", "Gao’s face changed, the softness replaced by a hard, ledger-like certainty. \"Then we have no choice.\" He turned to his men. \"Take them.\"", "Mo moved first. She did not run. She reached out and grabbed a lamp from a nearby stand, a heavy iron thing with a glass shade, and hurled it at the nearest mule-boy. It crashed into the wall, shattering the glass and spilling oil across the floor in a dark, spreading stain.", "\"Run!\" Mo shouted, her voice cracking with urgency.", "The room erupted into chaos. The mule-boys lunged forward, their hands reaching for the travelers, their movements swift and practiced. Gao stood still, watching, his face a mask of regret, as if the mess were an unfortunate clerical error.", "Wen did not think. She reached out, and with a surge of power that cost her a sharp, stabbing pain in her chest, she pulled the water from the basin in the main chamber. It rose, a thick, dark column, and she swept it across the room, a wall of liquid that knocked the mule-boys off their feet and sent them sprawling into the shadows.", "The oil on the floor caught the light from the lamp, and for a moment, the room was filled with a bright, orange glow. Then the light went out, and the darkness swallowed them whole."], "img": "img/p075.jpg", "pw": false}, {"no": 76, "ch": 16, "ctitle": "Escape by Water", "part": "PART FOUR: THE FLOATING TOWN", "paras": ["*The Bearer's Almanac, Entry 16: When you cannot out-walk a problem, out-think its shape.*", "The cistern chamber reeked of burnt oil and thick, rolling smoke. Wen Lan pressed her back against the cold, curved stone of the great basin, her shoulders hunched. Her breath came in short, sharp bursts that fogged in the sudden chill. Her hands were shaking. The white frost at her fingertips was stark against the dark rock. She felt the immense pressure of the water above her, a silent, inexorable force leaning on her skull.", "Shen Yu stood at the bronze sluice wheel, his fingers white-knuckled on the spokes. He pulled with desperate, frantic strength, his glasses askew, messy black hair falling over his eyes. The wheel groaned, a metallic shriek echoing off the vaulted ceiling. \"It’s stuck,\" he gasped, his voice thin and reedy. \"The mechanism is jammed. I can’t turn it fast enough.\"", "Mo stood between them and the shadowy figures of the mule-boys regaining their footing. She held her bamboo pole like a spear, bare feet planted wide on the slick, oily floor. Her face was a mask of cold, hard anger, grey hair tight under her hat. \"Stay behind me,\" she said, her voice low and dangerous. \"I will not let them pass. Not today.\"", "One of the mule-boys lunged forward, his hand reaching for a knife at his belt. Wen watched him, her pulse hammering a frantic rhythm against her ribs. She looked at the sluice wheel, then at the boy, then at the vast, dark expanse of the basin. The water was still, but it was not empty. It was waiting.", "\"Shen,\" Wen said, her voice surprisingly steady. \"The gate. Is it held by the hydraulic pressure, or by the lock?\"", "Shen looked up, his eyes wide behind his brass-rimmed glasses. \"Both. The lock is broken, but the pressure is holding it shut. It’s a deadbolt made of tons of water.\"", "\"Then we don’t need to turn it,\" Wen said. She reached out one hand, her fingers trembling, and touched the air above the water. \"We just need to let it out.\""], "img": "img/p076.jpg", "pw": true}, {"no": 77, "ch": 16, "ctitle": "", "part": "", "paras": ["Wen could feel the water, a massive, sleeping body pressing against the stone, cold and dense as iron. It was too heavy to lift, too vast to move in any meaningful way. If she tried to raise it, she would be crushed, her bones snapping under the sheer tonnage. But she did not need to lift it. She needed to aim it.", "She focused on the sluice gate, that thick slab of iron and bronze. There was a weak point, a seam where the bronze met the stone, a hairline fracture that Shen had seen in the survey maps. It was a small thing, an oversight, a flaw in the design. Wen placed her palm against the air, just inches from the seam. She did not push. She did not pull. She simply held a thin, sharp line of water, a needle of liquid, against the crack.", "\"Shen,\" she called out, her voice strained, \"how much pressure does a meter of water exert?\"", "Shen, still clinging to the wheel, shouted back, \"One ton per square meter! Every meter of depth adds a ton! This basin is twenty meters deep! That’s two hundred tons on that gate!\"", "Wen nodded. She did not have to do the work. The river had been doing it for centuries, storing energy in the height of its fall. She only had to remove the restraint. She pushed the thin needle of water into the crack, not with force, but with precision. It was a tiny gesture, a whisper of power, but it was enough. The crack widened. A sound, low and deep, like the groan of a dying animal, filled the room. The gate shuddered.", "\"Hold on!\" Mo shouted, bracing herself against the wall.", "The water in the basin began to ripple, a slow, dangerous surge that moved toward the gate. The pressure, that inexorable weight, found the flaw. It did not burst. It yielded. The bronze and iron groaned, bending outward, the metal screaming as it twisted."], "img": "img/p077.jpg", "pw": false}, {"no": 78, "ch": 16, "ctitle": "", "part": "", "paras": ["The gate did not break; it simply gave way. It swung outward with a roar that shook the dust from the ceiling, and the stored lake, held back for months by the will of one man, poured out in a controlled, thundering torrent. It did not crash chaotically; it flowed, a heavy, muscular river of water that surged down the service channel with the relentless momentum of a falling stone.", "Wen stood at the edge of the channel, her arms outstretched, her face pale. She was not fighting the water; she was guiding it. With a subtle shift of her will, she steered the torrent into a long, sweeping curve that carried it around the scattered figures of the mule-boys. They scrambled backward, slipping on the oily floor, their eyes wide with terror. The water passed within inches of their boots, a wall of churning white foam, but it did not touch them. It flowed around them, a deadly dance of precision and power.", "Mo lowered her pole, her face grim. She watched the water flow, her eyes tracking the path of the torrent. \"You did not kill them,\" she said, her voice quiet but sharp.", "Wen’s legs felt weak. She leaned against the stone wall, her chest heaving. The cold was in her bones, a deep, aching chill that she could not shake. \"I did not want to,\" she said, her voice barely a whisper. \"I just wanted to get out.\"", "Shen Yu was on his knees, his face illuminated by the flashing light of the water. He looked at Wen, then at the gate, then at the empty channel. \"The pressure,\" he said, his voice trembling with awe. \"You used the pressure. You didn’t lift a drop. You just let it fall.\"", "Wen looked at her hands. The frost at her fingertips was brighter now, a stark white against her skin. She pulled her hands into her sleeves, hiding the sign of the cost. \"It’s over,\" she said. \"Let’s go.\""], "img": "img/p078.jpg", "pw": true}, {"no": 79, "ch": 16, "ctitle": "", "part": "", "paras": ["They ran. The air outside was cool and sharp, carrying the scent of wet stone and distant woodsmoke. The moon was rising, a pale, silver disc in a sky scrubbed clean by the storm. They passed through a grove of poplars, the leaves rustling in the wind, their white trunks standing like the masts of becalmed boats in the moonlight. Wen’s boots slapped against the dirt path, her breath coming in short, sharp bursts. The cold was still there, a persistent ache in her chest, a reminder of the price she had paid.", "Shen Yu ran beside her, his surveyor’s staff clutched in his hand. He was breathing hard, his glasses fogging with his breath. \"We have to keep moving,\" he said. \"They will send more men. The Lord will not let this stand.\"", "Mo brought up the rear, her pole resting on her shoulder. She moved with a steady, deliberate pace, her eyes scanning the darkness. \"He will,\" she said. \"But not tonight. Tonight, we walk.\"", "They reached the edge of the cistern complex. The great stone building stood silent in the moonlight, its doors open, the channel empty, the water gone. In the center of the empty courtyard, standing in the middle of the dry stone, was Master Gao. He did not move. He did not reach for a weapon. He simply stood there, his green robe dark in the moonlight, his hands at his sides.", "He looked at Wen, then at Mo, then at Shen. His face was calm, almost serene. He raised a small brass whistle to his lips and blew three notes, short and sharp, cutting through the night air. The sound was clear, distinct, and unmistakable. It was a signal, a command, a declaration.", "Wen stopped. She watched Gao, her chest tight with a sudden, heavy dread. He did not look angry. He looked disappointed. And then, with a slow, deliberate turn, he walked away into the shadows, leaving them standing in the moonlight, the sound of his whistle fading into the night."], "img": "img/p079.jpg", "pw": false}, {"no": 80, "ch": 16, "ctitle": "", "part": "", "paras": ["Mo turned to Wen, her jaw set in a hard, unyielding line. She did not glance back at the darkness where Gao had vanished. Her eyes were sharp, fixed directly on Wen’s face. \"You heard that,\" she said. \"The whistle. It is not a call for help. It is a call for the bearer.\"", "Wen felt a chill that had nothing to do with the night air. \"What does it mean?\" she asked, her voice barely rising above the rustle of the poplar leaves.", "\"It means he knows,\" Mo said. \"He knows the bearer is awake. He knows you are coming.\" Mo’s voice was low, yet it cut through the silence with the precision of a surveyor’s plumb line. \"He has been waiting for you, Wen. He has been preparing for this moment.\"", "Shen Yu looked between them, his face pale beneath his fogged glasses. He adjusted the strap of his map case, his fingers trembling slightly on the leather. \"But he did not follow,\" he said. \"He did not try to stop us. Why?\"", "Mo looked at the empty courtyard, at the dry channel, at the moon. \"Because he did not think you were strong enough,\" she said. \"He thought he could outmaneuver you. He thought he could out-think you. But you did not lift the water. You let it fall. You used the river’s own strength against him.\"", "Mo turned back to Wen, her expression softening for a moment. \"He knew you were coming,\" she said. \"But he did not know you were this strong.\"", "Wen looked at her hands, still hidden in her sleeves. The frost was still there, a constant, biting reminder. She looked at the path ahead, a long, dark road that wound up into the mountains. The river was waiting. And so was she."], "img": "img/p080.jpg", "pw": false}, {"no": 81, "ch": 17, "ctitle": "Floating Lantern Town", "part": "PART FOUR: THE FLOATING TOWN", "paras": ["*The Bearer's Almanac, Entry 17: A town that floats must trust the water that holds it.*", "The river had not been silent for long before the noise of the town swallowed it whole.", "They emerged from the poplar grove onto a causeway of packed earth and stone, and the world opened up into a vast, shimmering expanse of water that seemed to stretch to the horizon in every direction. Floating upon this lake, which was wide and shallow and thick with reeds at the edges, was a city. Thousands of rafts, lashed together with thick hemp ropes, formed the streets. Stilt houses, painted in faded reds and greens, rose from the water on wooden legs, their roofs tiled in dark clay.", "Red lanterns hung from every eave, from every beam, from every rope bridge that arched over the narrow channels between the rafts. The lanterns were unlit, for it was only dusk, but their sheer number created a haze of crimson in the fading light. Boats, flat-bottomed and narrow, drifted in the gaps, their masts lowered like closed umbrellas. The air smelled of oil, woodsmoke, and the distinct, sharp scent of brackish water.", "Wen stood at the end of the causeway, her mouth slightly open. She had seen the dry delta, the cracked mud, the thirst. This was its opposite. This was an abundance. It was the only place on the river where the water was allowed to remain, a secret reservoir disguised as a marketplace.", "\"Look at them,\" Mo said, her voice quiet. She adjusted the bamboo hat on her head, her eyes scanning the crowd that had already begun to gather on the rafts. \"They have built a life on a lie. The water holds them up, but they do not know who is holding the water.\"", "Wen looked at the lanterns. They swayed gently in the breeze, a slow, rhythmic dance that mirrored the movement of the water beneath. It was beautiful, and it was terrifying.", "\"They are waiting for us,\" Wen said. She did not know how she knew it, but the stillness of the town, the way the eyes of the people on the rafts seemed to track their approach, told her that they were expected.", "Mo nodded. She pulled her tunic straight, her face hardening. \"Then we will give them what they are waiting for. Or we will give them nothing, and see what they do.\" She began to walk up the causeway, her footsteps steady on the stone. \"Let us go, Wen. The town is watching.\""], "img": "img/p081.jpg", "pw": true}, {"no": 82, "ch": 17, "ctitle": "", "part": "", "paras": ["They shed their travel clothes in a small, unremarkable shed near the edge of the rafts, swapping their pale linen for rough, blue-grey fisherfolk tunics and dark trousers. Wen’s high ponytail was tucked under a plain cloth cap, though the blue tie remained hidden against her scalp, a secret she kept close. Shen Yu, pale and anxious, adjusted his glasses, which now looked out of place on his simple face. They looked like laborers, like people who worked the water rather than studied it.", "The market on the rafts was a hum of activity. Stalls overflowed with goods: dried fish, salted vegetables, bolts of cloth, and, most prominently, water.", "Rows of porcelain jars, glazed in white and blue, sat on wooden tables. Behind them stood merchants in deep red robes, their faces calm and professional. A long line of townspeople, men and women in simple clothes, waited patiently. They held small clay cups in their hands, eyes fixed on the jars.", "A merchant with a silver hairpin in his hair stepped forward to the next person in line. He lifted the lid of a jar, the steam rising in a thin white ribbon. He poured a small amount of water into the man’s cup. The man drank, closed his eyes, and handed over a small pouch of coins. The merchant took the coins, smiled politely, and poured for the next person.", "Wen watched, her stomach churning. The water was clear, cold, and precious. It was sold by the cup, measured with meticulous care. There was no waste. Every drop accounted for.", "\"Efficient,\" Shen Yu whispered, his voice tight. \"It is a controlled distribution system. The Cistern Lord must have a precise inventory.\"", "\"It is a monopoly,\" Mo said, her voice flat. She watched a child in the line reach for a jar, only to be gently but firmly pushed back by a merchant. \"They are not sharing. They are selling.\"", "Wen stepped forward into the line. She felt the eyes of the merchants on her, a subtle weight. She took out a small pouch of coins, the only ones they had. When it was her turn, the merchant looked at her. His gaze lingered on her hands, then on her face, though she kept her expression neutral.", "He poured the water. It was cold, pure, and tasted of stone and mountain air. Wen drank, and for a moment, the thirst that had gnawed at her for days eased. She handed over the coins.", "As she turned, she felt a hand on her arm. She froze. A merchant, taller than the others, stood behind her. His smile was polite, but his eyes were sharp.", "\"Welcome to Floating Lantern Town,\" he said. \"You look thirsty. Perhaps you would like to stay for the evening?\""], "img": "img/p082.jpg", "pw": false}, {"no": 83, "ch": 17, "ctitle": "", "part": "", "paras": ["Before Wen could answer, a shadow fell across the merchant’s table. A messenger, small and quick, darted through the crowd. He moved with the silent grace of a cat, weaving between the legs of the people in the line. He stopped at the back of the crowd, where Shen Yu stood, and whispered something in his ear.", "Shen Yu’s face went white. He looked at Wen, his eyes wide with panic. He muttered something, a quick apology, and then turned and walked away, his steps hurried, almost running.", "Wen did not wait for the merchant. She followed Shen Yu, pushing through the crowd, her heart beating a steady, hard rhythm against her ribs. She kept her head down, her eyes on his back. He moved quickly through the maze of rafts and rope bridges, disappearing into a narrow alley of stilt houses.", "Wen followed, her boots soft on the wooden planks. She found him in a small teahouse, a low-ceilinged room with a single window looking out over the water. Shen Yu was sitting at a table, his hands trembling. Across from him sat a man in a smooth, grey official’s robe. His face was pleasant, unremarkable, but his eyes were cold.", "Shen Yu was holding a small tin whistle. It was silver, polished, and looked out of place in his rough hands.", "\"You understand the terms,\" the official said. His voice was calm, measured. \"The bearer is to be delivered to the Cistern Lord’s office. No harm is to come to her. She is to be kept alive until then.\"", "Shen Yu’s hands shook harder. He looked down at the whistle, then up at Wen, who had stepped into the doorway of the teahouse.", "Shen Yu froze. The official turned, his smile fading into a cold stare. \"Oh,\" he said. \"The guest.\"", "Wen walked in, her face blank. She did not speak. She simply looked at Shen Yu, her eyes steady.", "Shen Yu’s mouth opened, but no sound came out. He looked at the whistle in his hand, then at Wen. His face crumbled.", "\"I am a coward,\" he whispered."], "img": "img/p083.jpg", "pw": true}, {"no": 84, "ch": 17, "ctitle": "", "part": "", "paras": ["Wen closed the door behind her. The sound was a soft click, but in the quiet room, it was like a hammer strike.", "The official stood up, his hand moving subtly toward his belt, where a short blade was sheathed. He did not draw it, but the threat was clear.", "Wen did not look at him. Her eyes were fixed on Shen Yu.", "\"Both can be true,\" Wen said. Her voice was quiet, but it filled the room. \"You are a coward. And you are my friend. You can keep both, or you can choose which one to be.\"", "Shen Yu looked at her, his eyes bright with unshed tears. He looked at the whistle, then at the official.", "\"It began as a job,\" Shen Yu said, his voice cracking. \"I needed the money. My sister’s schooling. The Cistern Lord paid well. It was simple. Observe, report, be paid.\"", "\"And then?\" Wen asked.", "\"And then I saw you,\" Shen Yu said. He looked at his hands, as if they belonged to someone else. \"I saw you in the dry delta. I saw you save the fish. I saw you lift the water. I thought... I thought you were a weapon. But you were not. You were a person.\"", "The official’s face hardened. \"Enough,\" he said. \"The deal is done. The bearer is ours.\"", "Shen Yu stood up. He looked at Wen, and for a moment, the fear in his eyes was replaced by something else. Something steady.", "\"I am sorry,\" Shen Yu said. He reached out and took the whistle from his own hand.", "Wen watched him. She did not move. She did not breathe.", "Shen Yu walked to the window. He opened it, the night air rushing in, carrying the scent of water and woodsmoke. He looked at the official, then at Wen.", "\"I choose to be a friend,\" he said."], "img": "img/p084.jpg", "pw": false}, {"no": 85, "ch": 17, "ctitle": "", "part": "", "paras": ["Shen Yu did not hesitate. He cupped the tin whistle in his palm, turned his shoulder to the official, and hurled it through the open window. The metal spun in the dark, catching the last faint amber light of the dusk before it tumbled over the edge of the raft. It flew across the churning water, clearing the moored fishing boats and the stacked crates of dried tea, before plunging into the deep current with a splash so small it was immediately swallowed by the low, constant hum of the river.", "The official took one step toward the window, his hand tightening on the hilt of his blade, but Shen Yu was already moving. He grabbed Wen’s wrist, his fingers closing around hers with a grip that was firm, warm, and utterly desperate.", "\"Run,\" he said.", "They did not walk. They sprinted. The floorboards of the teahouse gave a groaning protest under their boots as they bolted out into the night air, which smelled of wet woodsmoke and the sharp, metallic tang of the river. They scrambled across the narrow, swaying planks of the floating bridge, their feet finding purchase by instinct alone. Around them, the market town of Fu Deng was a maze of stilt houses, lantern light, and shadow. The official shouted behind them, a single harsh syllable of command that was instantly drowned by the sudden, chaotic noise of the crowd.", "From the center of the town, a sound began to rise. It was not a shout, nor a crash, but a deep, resonant toll. A bell. It was the great iron bell hung in the tower of the Merchant Guild, and it was ringing. Once. The sound rolled across the water, a physical wave of vibration that seemed to shake the very planks beneath their feet. Twice. The lanterns swayed in unison. Three times.", "The diners in the open-air stalls stopped mid-bite. The water merchants paused their tallying. Heads turned, a slow wave of attention sweeping across the rafts. They looked up from their cups. They looked at the two figures vanishing into the dark, narrow alleyways between the stilt houses. They had seen the bearer. The town, which had been waiting in the shadows, now knew exactly who had just broken the silence."], "img": "img/p085.jpg", "pw": false}, {"no": 86, "ch": 18, "ctitle": "The Lord's Letters", "part": "PART FOUR: THE FLOATING TOWN", "paras": ["*The Bearer's Almanac, Entry 18: Even a villain has a reason, and the reason is usually fear.*", "The warehouse held the heavy, biting scent of wet hemp and old tar, a smell that seemed to coat the back of the throat. Outside, rain drummed a frantic rhythm on the thatched roof, a relentless percussion that vibrated in Wen’s teeth and offered no true shelter from the cold seeping through the planks. She sat on a stack of coiled ropes, knees drawn up to her chest, watching her breath fog in the dim air. The white streak in her hair caught the faint glow of the oil lamp, a stark, unnatural line against the black.", "Auntie Mo sat cross-legged on the floor, her conical hat removed so that her grey hair lay loose and tangled around her shoulders. Stripped of her ferry pole and her usual authority, she looked smaller, and her hands, usually steady as stone, trembled slightly as she pried open a leather case wedged behind a false panel in the raft’s keel.", "\"Who sent these?\" Shen Yu asked. He stood by the window, his back to them, watching the rain slash against the dark water of the harbor. His voice was tight, controlled, the voice of a man holding a secret together by force of will. \"The ink is fresh. The seals are broken.\"", "Mo did not answer immediately. She lifted a bundle of parchment from the case, the paper thick and expensive, feeling like skin under the fingers. She spread them out on the wooden floor, smoothing them with careful, deliberate motions.", "Wen leaned forward. The dates on the letters were stamped in red ink, but the oldest one, tucked beneath the others, bore a mark that made her stomach drop. Eleven years.", "\"Eleven years ago,\" Wen whispered. \"Mother was alive.\"", "Mo’s hand hovered over the parchment. \"These are addressed to her,\" the ferrywoman said, her voice low and rough. \"From the man who stopped the river.\"", "Shen Yu turned around, his glasses fogged by the sudden change in temperature. \"Lord Bao Heng,\" he said. \"I have seen his seal. I did not think he wrote letters. I thought he sent orders.\"", "\"He does both,\" Mo said. \"And he writes to your mother, Wen Lan. Not to the Bearer. To Lin Hua.\"", "Wen reached for the top letter. Her fingers brushed the paper, and a shiver ran up her arm that had nothing to do with the cold. She looked at Mo, then at Shen Yu. The rain hammered harder, drowning out the sound of the river, leaving only the ticking of the water in the gutters and the beating of her own heart.", "\"I am not your mother,\" Wen said.", "\"No,\" Mo agreed. \"But he thinks you are. And he is afraid of what you might do.\"", "Wen picked up the letter. The leather case was heavy, full of more. She looked at the pile, a stack of silence that had been kept for over a decade."], "img": "img/p086.jpg", "pw": true}, {"no": 87, "ch": 18, "ctitle": "", "part": "", "paras": ["The first letter was dated the same month the river had stopped, but the tone was not one of command. It was weary. It was the voice of a man who had been keeping a vigil for a long time and was tired of the watch.", "*Lin Hua,*", "*You will have heard the rumors. You know what is happening to the glaciers. I have sent surveyors to the high peaks. The ice is retreating. The wetlands that feed the headwaters are shrinking. In twenty years, perhaps less, the Clear River will not be enough. The drought will come, and it will not be a temporary sleep. It will be a death.*", "*We have a hundred thousand people downstream. Farmers, fishers, children. If the water stops, they die. I have no choice. I must store what I can now, for the day when there is nothing left to save. It is a terrible burden, but it is the only one I am willing to carry.*", "*You left. You went to the Source and you did not come back. I understand your fear, but fear is not wisdom. Fear is a wall. I am building a dam. I am building a future.*", "*Join me. Your knowledge of the river, your understanding of the flow, would be invaluable. We can work together to manage the scarcity. We can save them all.*", "*If you do not come, I will continue alone. I will not let them starve.*", "*Your friend, Bao Heng.*", "Wen read the letter twice. The words were not cruel. They were logical. They were the kind of words a sensible person would use when the world was ending and they had no other plan.", "\"He is not a monster,\" Shen Yu said. He had moved to stand beside Wen, his face pale in the lamplight. \"I reported on him. I watched him. He sleeps four hours a night. He eats last. He visits the orphanages in the capital. He is not evil, Wen. He is just... certain.\"", "\"Certainty is dangerous,\" Mo said from the corner. She was cleaning her nails with a knife, a sharp, rhythmic scraping sound that cut through the silence. \"A man who is certain he is right does not ask questions. He does not listen. He builds walls.\"", "\"He is saving people,\" Wen said. Her voice sounded strange to her own ears, hollow and thin. \"He says the glaciers are shrinking. He says the drought is coming. If he is right...\"", "\"Then he is stealing from the living to feed the dead,\" Mo interrupted. \"That is not saving. That is hoarding.\"", "Wen looked back at the letter. *I will not let them starve.* It was a promise. It was a threat. And it was signed with a name she had heard in whispers, in the market stalls and the ferry docks, a name that meant power and silence and the heavy, unyielding weight of a seal."], "img": "img/p087.jpg", "pw": false}, {"no": 88, "ch": 18, "ctitle": "", "part": "", "paras": ["There was only one reply in the case, tucked into the bottom of the leather sleeve where the light did not reach. It was not a letter but a single sheet of paper, folded into a small square. The handwriting was different from the Lord’s, smaller and sharper, written in a blue ink that had faded to the pale grey of river mist.", "*You are storing water for a drought you are causing.*", "*You believe that because you take it, it is yours. You believe that because you hold it, it is safe. But a river is not a bank, Bao Heng. You cannot deposit the future and withdraw it when you are afraid. You cannot own the flow. You can only manage the channel.*", "*Take only what you will give back. That is the law of the water. That is the law of the land. If you take more than you return, you do not save the people. You kill them. You kill the river.*", "*I am going to the Source to see for myself. I will not watch you break the world to save it. I will not be part of your fear.*", "*Tell the people the truth. Tell them the river is not gone. It is waiting. And if you keep waiting, it will never come.*", "*Lin Hua.*", "Wen stared at the words, feeling the chill of the ink seep into her own skin. *Take only what you will give back.* It was the first rule she had learned, the one she had broken at Hollow Pool, the one that had cost her the warmth in her hands.", "\"She knew,\" Shen Yu said, his voice barely a whisper in the quiet room. \"She knew what he was doing. She tried to stop him.\"", "\"She went to the Source,\" Wen said, her gaze fixed on the signature. \"She went to see the ice.\"", "\"And she never came down,\" Mo said. It was not a question, but the silence that followed was heavy with the sound of unsaid words.", "Wen looked at the white streak in her hair, which had grown longer over the weeks, creeping up her scalp with a cold and persistent tenacity that she had tried to hide under her hat and scarf.", "\"She did not stay away because she was afraid,\" Wen said, her voice steady despite the tremor in her hands. \"She stayed because she gave too much, I think. She tried to hold the river alone, and it took her.\"", "Mo looked at her, the ferrywoman’s eyes hard and bright with a grief she had not yet learned to name. \"You are making the same mistake. You are thinking that if you hold the water, you can save them. You are thinking that your power is a dam.\"", "\"It is not,\" Wen said. \"It is a channel.\"", "\"Then open it,\" Mo said. \"Let it flow. Let it go. That is the only way to keep it.\"", "Wen looked again at the letter from her mother. The ink was faded, almost invisible, but the words remained clear and unyielding against the paper. *Tell the people the truth.*"], "img": "img/p088.jpg", "pw": true}, {"no": 89, "ch": 18, "ctitle": "", "part": "", "paras": ["Shen Yu had his map case open on the floor. He had been drawing, sketching lines and numbers, trying to make sense of the data he had collected over the last few years. Now, he pulled out a sheet of paper covered in dense, intricate calculations.", "\"I have the reports from the high peaks,\" he said. \"From the surveyors who work for the Guild. They are not lying about the ice. The glacier at the Source has shrunk by a third in a generation. The wetlands are drying up. The water table is dropping.\"", "He looked up, his glasses catching the light. \"The Lord is not lying about the danger. The drought is coming. The water is going. That is a fact.\"", "Wen felt a cold knot in her stomach. \"But he is wrong about the answer,\" she said. \"Storing it is not the answer.\"", "\"No,\" Shen Yu agreed. \"He thinks that if he holds it, he can control it. He thinks that if he takes it from the river, he can distribute it fairly. But he is not distributing it. He is selling it. He is using the scarcity to build a power structure. He is turning the river into a weapon.\"", "\"He is afraid,\" Wen said.", "\"He is afraid of losing control,\" Shen Yu corrected. \"Fear makes men hoard. It makes them build walls. It makes them believe that if they take enough, they will be safe.\"", "Wen looked at Mo. The ferrywoman was watching them, her face unreadable. She had heard this argument before. She had heard it in the villages, in the markets, in the quiet corners of the world where people whispered about the missing water.", "\"A frightened man stores water,\" Mo said. \"A wise man shares it.\"", "\"Sharing is not always easy,\" Shen Yu said. \"Sharing is not always fair. Sometimes, the only way to share is to take.\"", "\"No,\" Mo said. \"Taking is not sharing. Taking is stealing. Sharing is giving. And giving is not the same as keeping.\"", "Wen looked at the letters again. Her mother’s words swirled in her mind. *Take only what you will give back.*", "\"I agree with half of what he says,\" Wen said. \"The water is going. That is true. But the other half is a lie. He is not saving us. He is trapping us.\"", "\"Then what do we do?\" Shen Yu asked. \"We cannot just walk away. The people are thirsty. The farmers are dying.\"", "\"We walk to the Source,\" Wen said. \"We find the water. We open the gates.\"", "\"The gates are locked,\" Mo said. \"The Lord has them. He has the keys.\"", "\"Then we break them,\" Wen said.", "Mo looked at her. \"It is not that simple, child. The gates are not just wood and iron. They are stone. They are the mountain. You cannot break the mountain.\"", "Wen looked at her hands. The frost on her fingertips was gone, but the cold remained, a deep, aching chill that seemed to have settled into her bones.", "\"I am not breaking the mountain,\" Wen said. \"I am opening the channel.\""], "img": "img/p089.jpg", "pw": false}, {"no": 90, "ch": 18, "ctitle": "", "part": "", "paras": ["The sound of footsteps on the deck above was heavy. It was not the light, shuffling step of a rat, or the soft, hesitant tread of a thief, but the solid, rhythmic thud of boots on wood.", "Wen, Mo, and Shen Yu froze. The oil lamp between them flickered, casting long, jittery shadows across the walls.", "\"Who is there?\" Mo called out. Her voice was steady, but her hand had moved to the small knife in her pocket.", "A voice answered from above. It was young, sharp, and authoritative. \"By order of the Merchant Guild, surrender the bearer and the surveyor. The warehouse is surrounded.\"", "Shen Yu’s face went white. \"They have the seal,\" he whispered. \"They know exactly where we are.\"", "Mo looked at Wen. \"We have to go through the water,\" she said. \"The harbor is dark. The current is strong. If we can reach the outer rafts, we can lose them.\"", "\"The water is cold,\" Wen said. \"And my power...\"", "\"Your power is not the problem,\" Mo said. \"The problem is that you are afraid to use it. You are afraid of the cost.\"", "Wen looked at the white streak in her hair. It was longer now, reaching down to her shoulder. It pulsed with a faint, cold light.", "\"I am not afraid of the cost,\" Wen said. \"I am afraid of what I will become.\"", "Mo grabbed her hand. Her grip was firm, warm, and real. \"Then do not think about what you will become,\" she said. \"Think about who you are. You are the Bearer. And the Bearer does not hoard. The Bearer flows.\"", "The footsteps stopped. The door to the warehouse creaked open.", "Light flooded in, blinding and harsh.", "\"Out,\" a soldier shouted. \"Now.\"", "Wen did not hesitate. She pulled Shen Yu up, grabbed Mo’s hand, and sprinted toward the small, unmarked hatch in the floor."], "img": "img/p090.jpg", "pw": false}, {"no": 91, "ch": 19, "ctitle": "The Frost Reaches the Heart", "part": "PART FOUR: THE FLOATING TOWN", "paras": ["*The Bearer's Almanac, Entry 19: Every gift is a loan.*", "The hatch was a trap.", "Wen kicked it open, but the air that rushed up was not the cool night breeze of the harbor. It was the stale, dusty heat of a cellar that had been sealed for years. Behind them, the soldiers were already on the deck, the sound of their boots on the wood creating an urgent rhythm that matched the frantic beating of her own pulse.", "\"Behind you!\" Shen Yu shouted.", "Wen spun around. Three soldiers stood at the far end of the warehouse, their spears leveled. They were not looking at Shen Yu. They were looking at her hands.", "\"Move,\" the lead soldier said, his voice bored and professional. \"Do not make a scene. The Guild prefers order.\"", "Mo stepped between the soldiers and Wen, raising her pole as if it were the only thing in the world she trusted. \"You will not take her,\" Mo said. \"She is not cargo.\"", "\"Everything is cargo,\" the soldier replied. \"Even water.\"", "Wen did not think. Thinking took time, and time was a luxury the river no longer afforded anyone. She reached out with her hands, not to the soldiers, but to the air around them. She felt the dampness on the walls, the condensation on the wooden beams, the heavy moisture in the breath of every person in the room. It was not much water, just the memory of rain, but it was hers to move.", "She pulled.", "The moisture in the air rushed toward her outstretched palms, gathering and thickening until it turned from mist into a solid, shimmering wall of ice. The temperature in the warehouse dropped sharply, and the soldiers gasped, their breath pluming in white clouds.", "But the cost came with the ice.", "It started at her fingertips, a sharp, biting cold that felt like a burn. It raced up her wrists, her forearms, her elbows. She tried to pull it back, to release the ice, but the connection was already made. The cold was not just a sensation; it was a presence, sliding into her blood and settling in her bones.", "She looked at her hands. The skin was pale, translucent, almost blue. And then she looked up, and her eyes caught the reflection in the polished surface of a nearby metal table.", "Her ponytail was white.", "Not a streak. Not a hint. The entire length of her black hair, from the roots at her scalp to the tips where the blue cloth was tied, had turned the color of fresh snow. The blue cloth looked like a bruise against the stark whiteness.", "Wen stared at her reflection. The face looking back was hers, but the eyes were wide and terrified, and the skin was so pale it seemed to have no color at all. She was becoming something else. Something cold.", "The ice wall shattered. The soldiers scrambled back, knocking over crates. In the chaos, Mo grabbed Shen Yu’s arm and pulled him toward the broken hatch.", "\"Go,\" Wen said. Her voice was thin and reedy. \"Now.\""], "img": "img/p091.jpg", "pw": true}, {"no": 92, "ch": 19, "ctitle": "", "part": "", "paras": ["They were in a small, cramped room beneath the warehouse, lit by a single tallow candle. The air was thick with the smell of damp wood and old oil. Shen Yu was shaking. His hands were wrapped around his surveyor’s staff, his knuckles white, his glasses fogged with his own breath.", "\"It is written,\" he said. His voice was high, tight. \"In the oldest river-office scroll I have ever read. The one from the first dynasty. It says... it says the power does not come from the water. It comes from the bearer.\"", "Wen sat on a crate, her legs pulled up to her chest. She was shivering, not from the cold, though she was cold, but from the vibration of her own limbs. \"That is not possible,\" she said. \"Water is external. I move it. I do not give it.\"", "\"You give it your warmth,\" Shen Yu said. He took off his glasses and wiped them on his vest. \"That is the trade. The energy required to move mass against gravity, against flow, it has to come from somewhere. It comes from your body heat. Your life force.\"", "Mo said nothing. She was standing by the door, watching the shadows. But Wen could feel her presence, a solid, warm anchor in the room.", "\"Then why does it stop?\" Wen asked. \"Why did the river stop?\"", "\"Because the bearer is gone,\" Shen Yu said. \"Or frozen. The scroll says that if the frost reaches the heart, the bearer turns to ice. They do not die. They are... preserved. Kept in the cold place, where the river begins.\"", "Wen looked at her hands. The white frost was still there, faintly visible on her fingertips, like a dusting of sugar. \"My mother,\" she said. The words felt heavy, clumsy in her mouth. \"She went to the glacier. I thought she was lost. I thought she died.\"", "\"She did not die,\" Shen Yu said. \"She was kept. Like a seed in winter soil. Waiting for spring.\"", "The candle flame flickered. For a moment, the shadows in the room seemed to stretch, to reach for them. Wen looked at Mo. Mo’s face was calm, but her eyes were wet.", "\"Is it true?\" Wen asked. \"About the heart?\"", "Mo nodded. \"It is true,\" she said. \"I have seen it. I have seen what the frost does. It takes the warmth, and it leaves the shape. And the shape remembers.\"", "Wen closed her eyes. She could feel the cold in her chest, a dull, spreading ache. It was not pain. It was a slowing. A quieting. As if the world was becoming very far away, and very bright, and very still."], "img": "img/p092.jpg", "pw": false}, {"no": 93, "ch": 19, "ctitle": "", "part": "", "paras": ["Wen did not cry. The cold had drawn the moisture from her eyes, leaving them dry and bright, while she sat perfectly still with her hands intertwined in her lap, counting the slow, deliberate beats of her own heart against the silence of the room.", "\"She did not leave me,\" Wen said, her voice flat and stripped of all usual urgency. \"I used to think she abandoned me out of anger, or that I was simply not enough for her to keep.\"", "Mo crossed the damp floor and sat down beside her without speaking, taking Wen's cold hand in her own weathered grip; the heat from the ferrywoman’s skin seeped into Wen’s frozen fingers like a warm current flowing into a stagnant pool, offering a small, precious comfort that felt almost too good to be true.", "\"I held her hand,\" Mo said quietly. \"When she went up to the glacier, she was already freezing to the bone. She told me to let go. She said the river needed her, and that the river does not share.\"", "Wen looked at the old woman, her gaze steady. \"That is not true. The river shares. It feeds the terraces and fills the pools. It is the most generous thing in this world.\"", "\"No,\" Mo replied, her eyes glistening in the candlelight. \"It is the most necessary thing. And necessity is cold.\"", "Wen pulled her hand back, refusing the warmth because she wanted the truth more than she wanted comfort. \"If the river needs her, then I need to give it back. Not the water. The cost. The frost.\"", "\"You cannot,\" Shen Yu interrupted, his voice trembling with anxiety. \"It is too late. The frost has already reached your chest.\"", "Wen looked down at her hair, where the white was stark and shocking in the amber glow, but beneath that whiteness she could see the faintest hint of black at the roots, a tiny, stubborn thread of life refusing to yield.", "\"No. It is not too late. It is just expensive.\"", "She stood up, her legs weak but holding her balance as she looked at the two of them, at Mo’s deep worry and Shen Yu’s visible fear, and felt something stir in her chest that was not warmth but a sharp, clear resolve.", "\"We have to leave. The soldiers will be back, and the river is waiting.\"", "Mo stood up and handed Shen Yu a rolled map. \"The outer rafts. There is a boat. It is small, but it is fast. And it is empty.\"", "\"Empty?\" Shen Yu asked, his eyes widening behind his fogged glasses.", "\"No,\" Mo said, her voice firm and final. \"It is ready.\""], "img": "img/p093.jpg", "pw": true}, {"no": 94, "ch": 19, "ctitle": "", "part": "", "paras": ["The skiff was a narrow sliver of hull, painted the same dull grey as the wooden pilings that held the raft-town together, designed to vanish against the dark timber. It hung from a post at the edge of the platform, rocking gently in the black water, while the air grew heavy with the sharp, stinging smell of tar and the sweet rot of old fish.", "\"Quickly,\" Mo said, her hands working the knots with the speed of long habit. \"The current is strong tonight. If we catch the ebb, we can be past the town before the soldiers find the gap.\"", "Wen stepped into the boat. It listed sharply under her weight, a gentle, reassuring tilt that reminded her she was solid, not liquid. She settled into the center, crossing her legs, and forced her hands to remain still at her sides. She did not reach for the water. She did not try to push the current. She knew, with a certainty that felt like a physical weight, that if she used her power now, the frost would finish the job. She would become ice. She would join her mother in the cold, and the river would be free, but she would be gone.", "\"So we row?\" Shen Yu asked. He was already in the stern, his surveyor’s staff tucked tight under his arm, his eyes darting to Wen as if waiting for her to perform some impossible feat.", "\"We row,\" Wen said. \"And we think.\"", "Mo began to row. Her strokes were strong, steady, rhythmic, pulling the boat forward with a mechanical grace that required no magic and no cost. The water pushed against the sides of the hull, lifting it, carrying it, a simple and human effort that felt like the only honest thing left in the world.", "They slipped out from under the shadow of the great lanterns of Floating Lantern Town. The lights above them were a sea of gold and red, reflecting in the dark water, while the town itself became a maze of wood and rope, a floating city that seemed to breathe and shift with the tide.", "\"Stars,\" Shen Yu said, looking up with a sudden, quiet wonder. \"I can see the stars. The cloud layer must have broken.\"", "He pulled out his compass, then stopped, his fingers hovering over the glass. He looked at the sky, at the pinpricks of light scattered across the blackness, and tilted his head. \"The North Star,\" he said. \"It is there. Just above the lanterns. I can steer by it.\"", "\"Can you?\" Wen asked.", "\"I am a surveyor,\" Shen Yu said, adjusting his glasses against the damp air. \"I measure things. Stars are just very far away points. I can measure them.\"", "Mo smiled, a small and tired expression that was entirely real. \"Then you steer, Shen Yu. And I will row. And you, Wen Lan, you just have to stay warm.\"", "Wen looked at her hands. The frost was still there, a fine white powder on her fingertips, but it was not spreading. She was still herself. She was still warm.", "\"I will try,\" she said.", "The boat moved faster, the lights of the town blurring into a streak of color, then fading into the darkness. They were alone on the water, moving toward the mountains."], "img": "img/p094.jpg", "pw": false}, {"no": 95, "ch": 19, "ctitle": "", "part": "", "paras": ["The town fell away behind them, its lanterns shrinking from a blazing sea to a single amber smear, and finally to a memory. The water changed its character as they passed the last stilt house. It lost the sluggish, tar-heavy drag of the harbor and gained the crisp, metallic snap of a mountain stream. It smelled of wet granite and cold pine needles, a scent that cut through the stale air of the raft docks with the sharpness of a freshly split bamboo.", "They had reached the fresh river.", "It ran thin and bright through the darkness, a silver vein pulsing under the moon. The water was not the dead, cracked mud of Hollow Pool, nor was it the measured, rationed cups from the cisterns of the White Basin. It moved with a wild, untamed purpose, swirling over submerged stones in patterns that no engineer had drawn. It was simply water, doing what water does when it has nowhere to be captured.", "Wen looked down at her reflection in the churning surface. Her hair, once a solid mass of white frost, was softening now. The moonlight caught the tips, but near her scalp, faint dark lines were returning, like ink bleeding back into paper. She was still alive.", "She extended her hand toward the current. The water was cold, biting, but it did not freeze. It was clean, rushing over her fingers with a gentle, insistent pressure. It felt like a hand reaching for her, demanding not to be held, but to be acknowledged.", "\"Then I will not waste what is left,\" Wen said. Her voice was steady, stripped of the tremor that had plagued her since the salt flats.", "She did not lift the water. She did not try to steer it or hold it in a sphere. She let it rush past her fingertips, feeling the sheer volume of it, the kinetic energy that a river of this size possessed. It was a promise. A debt. A life.", "Mo stopped rowing. The current took the keel, carrying them forward with a smooth, inexorable glide. Shen Yu lowered his compass, the brass needle swinging wildly in the changing magnetic field of the open water.", "\"We are going up,\" Wen said. \"To the source. To the glacier. To my mother.\"", "\"And then?\" Mo asked. Her voice was low, barely audible over the rush of the current.", "\"And then,\" Wen said, \"we give it back.\"", "The boat moved forward, into the dark, into the cold, into the unknown. The water flowed around them, quiet and strong, carrying them toward the roof of the world."], "img": "img/p095.jpg", "pw": false}, {"no": 96, "ch": 20, "ctitle": "The Long Climb", "part": "PART FOUR: THE FLOATING TOWN", "paras": ["*The Bearer's Almanac, Entry 20: A road is made by those who walk it twice.*", "The river narrowed as they climbed, shedding the broad, lazy drag of the lowlands until it became a bright, jagged thread of silver cutting through the dark green of pine and rhododendron. The air was thin and sharp, tasting of cold stone and resin. Above the water, strings of colored cloth fluttered from high branches, snapping in the stiff breeze like a dozen small flags declaring a territory no one had named.", "Wen Lan carried the pack for the first hour. The straps bit into her shoulders, a steady, dull ache that was almost comforting. It was a physical weight, honest and immediate, unlike the cold, hollow pressure in her chest that followed every use of her power. She watched her own breath hang in the air, a pale cloud that dissolved before it hit the pine needles.", "Yaks grazed on the steep slopes above the bank, their shaggy coats matted with frost. They did not look at the travelers. They had better things to do than observe a girl with a white ponytail and two tired companions. One of them, a massive bull with curved horns, lifted its head, chewed, and returned to the grass with a grunt that seemed to vibrate through the soles of Wen’s boots.", "Shen Yu walked ahead, his surveyor’s staff tapping the rocks with a rhythmic *clack, clack, clack*. He was counting steps, or perhaps paces, or maybe just trying to keep his knees from buckling. His glasses were fogged, and he kept wiping them with his sleeve, a futile gesture against the cold.", "Mo walked behind, her bare feet wrapped in thick layers of cloth. She moved with an economy of motion that made the climb look effortless, a stark contrast to the others’ labored, heaving steps. She said nothing. She did not need to. The silence between them was not empty; it was full of the sound of the river, a constant, rushing whisper that filled the gaps where words might have been.", "Wen looked back at Shen Yu, who was staring at his boots with the intense focus of a man trying to solve a very difficult equation. She looked forward at the river, which was getting louder, thinner, and faster. The sun was high and bright, but it felt distant, a white coin in a blue sky, offering light but very little warmth.", "\"Your turn,\" Wen said, not looking back. She dropped the pack onto a flat rock by the riverbank. The pack landed with a heavy thud.", "Shen Yu groaned, but he took the straps. \"I can do this,\" he said, his voice thin in the cold air. \"For a while.\"", "Mo stopped and looked at him, then at Wen. A small, dry smile touched her lips. \"Good,\" she said. \"Then we do not stop.\""], "img": "img/p096.jpg", "pw": true}, {"no": 97, "ch": 20, "ctitle": "", "part": "", "paras": ["They reached a stretch where the river widened into a shallow, rocky basin. The current was strong, but the water was knee-deep. Wen looked at it, then at Shen Yu, who was frowning at the flow.", "\"You cannot just walk across,\" Shen Yu said, adjusting his glasses. \"The current will push you. You need to angle it.\"", "\"Angle it how?\" Wen asked. She was tired. Her legs felt heavy, and the cold was seeping into her bones.", "Shen Yu pulled a small stick from his pack. He threw it into the water. The stick did not go straight across. It curved, following the flow, and was swept away before it reached the other side.", "\"See?\" Shen Yu said. \"The water has momentum. You have to fight it. Walk diagonally. Put your foot where the water is slowest.\"", "Wen looked at the river. She could feel the pull, the way it wanted to take her. She had spent her life listening to water, but this was different. This was water that did not care about her feelings.", "\"Mo,\" Wen said. \"How do you cross a river like this?\"", "Mo leaned on her pole. \"You do not fight the river,\" she said. \"You ask it. But sometimes, you just have to be stubborn.\"", "Wen rolled her sleeves up. The water was cold, biting, but it was not hostile. She stepped in. The current hit her shins, a solid, icy shove. She planted her feet wide, toes digging into the pebbles. She leaned into the flow, letting it push against her side, and walked diagonally toward the far bank.", "Shen Yu followed, wading carefully, his staff tapping the bottom for stability. Mo crossed last, her bare feet finding purchase on the slick stones with an ease that seemed impossible.", "When they reached the other side, Shen Yu was shaking. He pulled his wet shirt out of his trousers and wrung it out. \"I think I broke a bone,\" he said, dryly.", "\"No,\" Mo said. \"You are just cold. And alive.\"", "Wen looked at her hands. They were red, but they were not frostbitten. She had crossed the river with her feet, not her power. It was a small victory, but it felt larger than anything she had done in the weeks since leaving the village. She laughed, a short, sharp sound that surprised her.", "Shen Yu looked up. \"What?\"", "\"Nothing,\" Wen said. She looked at the river, then at her friends. \"Just... that I could do it.\"", "Mo smiled, a rare, full expression that transformed her weathered face. \"Good,\" she said. \"Now we rest. The sun is good.\"", "They sat on a warm rock, the river rushing past their feet. For a moment, the burden of the journey lifted. They were just three people, sitting by a river, watching the water go."], "img": "img/p097.jpg", "pw": false}, {"no": 98, "ch": 20, "ctitle": "", "part": "", "paras": ["They arrived at the herders’ village at midday, a cluster of stone huts built into the mountain’s side with thin ribbons of smoke rising from small chimneys. The air carried the scent of woodsmoke and drying meat, a sharp, savory tang that settled on the back of Wen’s throat.", "Wen paused at the edge of the settlement, watching the people move through the dust. They did not rush, shifting with a slow, deliberate grace as if they possessed all the time in the world and intended to spend it wisely. An old woman emerged from the largest hut, her face a topography of wrinkles, her white hair tied back with a simple strip of cloth. In her hand, she carried a clay jug, its surface worn smooth by years of use.", "Wen followed her. The woman walked to a spring, a small pool of clear water bubbling up from the rock, and dipped the jug before turning toward the first hut. She poured a small amount into a jar sitting on a stone ledge outside the door, then moved to the next one. She repeated this motion for the next, and the next, her steps unhurried and precise.", "Wen watched from a distance. There were ten huts in the row. The woman poured water into ten jars, her arm moving in a steady, rhythmic arc. She did not stop to talk, nor did she glance at the vessels. She simply poured, and moved on, the clay jug clinking softly against the rock as she went.", "When she finished, she walked back to the spring. She did not drink, and she did not wash her face. She just stood there, looking at the water, her hands resting lightly on the rim of the jug.", "Wen approached her. \"How do you know who has drunk?\" she asked.", "The woman looked at her. Her eyes were clear and sharp, like polished river stones. \"We do not know,\" she said. \"We do not need to know.\"", "\"Why?\" Wen pressed. \"What if someone takes more than their share?\"", "The woman smiled, a expression that was both sad and kind, like the softening of mist over a cliff face. \"Then everyone sees,\" she said. \"And if everyone sees, no one takes.\"", "Wen looked at the jars. They were all full, all the same size, and all sitting in the open where anyone could see them. It was a simple system, a perfect one that relied on nothing but trust and visibility.", "A pang tightened in her chest. She thought of the hidden cisterns, the secret pipes, and the secret reservoirs. She thought of Lord Bao Heng, and his letters, and his conviction that he was saving the realm.", "\"Who is the oldest?\" Wen asked.", "The woman pointed to herself. \"I am,\" she said. \"I pour the water. It is my job. It is my honor.\"", "Wen looked at the woman’s hands. They were rough, strong, and dry, the skin mapped with the lines of many years of labor.", "\"Thank you,\" Wen said.", "The woman nodded and turned, walking back to her hut. Wen watched her go, then looked again at the jars. They were small, but they were full."], "img": "img/p098.jpg", "pw": true}, {"no": 99, "ch": 20, "ctitle": "", "part": "", "paras": ["The night sky was so dense with stars it resembled spilled milk, but Wen did not sleep. She lay on her back, staring into the infinite dark, and felt the river. It was not a sound, but a presence, a pressure, a held breath.", "She could feel the reservoirs. They lay all down the river, like stones in a stream. Each one was a pause in the flow, a stop, a gate.", "Wen counted them. One, two, three, ten, a hundred. The numbers grew. They were not just numbers, but people, choices, decisions made in dark rooms by men who believed they were doing the right thing.", "Wen closed her eyes. She reached out with her mind, not with her power, but with her sense. She felt the water trapped behind the gates. It was cold, still, and waiting.", "It was waiting for her.", "She opened her eyes. The stars were still. The river was still. But in her bones, she felt the burden of it, the debt.", "She sat up. Shen Yu was asleep, his breathing slow and deep. Mo was awake, sitting with her back against a rock, her eyes reflecting the starlight.", "\"How many?\" Mo asked. She did not look at Wen. She looked at the sky.", "\"At least a thousand,\" Wen said. Her voice was quiet. \"Maybe more.\"", "Mo nodded. \"Then we have a long way to go.\"", "Wen looked at the river. It was dark, silent, and full of secrets. She thought of the woman in the village, pouring water into jars. She thought of the Lord, locking water in stone.", "She thought of her mother, frozen in the ice.", "\"I can feel them,\" Wen said. \"Every gate. Every keeper.\"", "Mo looked at her. \"Then you know the shape of the problem.\"", "Wen nodded. She felt the cold in her hands, the frost that never quite melted. It was part of her now. It was the price.", "\"And we have to fix it,\" Wen said.", "Mo stood up. She stretched, her joints cracking. \"Yes, but not tonight,\" she said. \"Tonight, we rest. Tomorrow, we walk.\"", "Wen lay back down. She looked at the stars. They were cold, distant, and beautiful.", "She felt the river, holding its breath, waiting for her to let it go."], "img": "img/p099.jpg", "pw": false}, {"no": 100, "ch": 20, "ctitle": "", "part": "", "paras": ["The morning sun burned the last of the night mist off the river, leaving the air sharp and cold enough to sting the lungs. Wen packed the travel pack with the same meticulous care she used for everything, checking the gourd, the sash, and the boots. Shen Yu walked ahead of them, his head bowed low, his lips moving silently as if reciting a prayer or a formula. He scanned the riverbank with the anxious intensity of a hawk checking its perch, his brass-rimmed glasses catching the light in small, bright flashes.", "He stopped abruptly, turning to face Wen with a look that was half-apology, half-plea. \"I have an idea,\" he said, his voice thin in the crisp air.", "Wen waited, her hands resting on the top of the pack. \"Tell me.\"", "\"Each reservoir,\" Shen Yu said, pointing a finger at the distant mountains. \"Each gate has a keeper. A person who opens it, and closes it.\"", "Wen nodded, understanding the logic of it. \"Yes.\"", "\"If we can get them to open their gates,\" he continued, his eyes bright with the fervor of discovery, \"all at once.\"", "Wen frowned, tilting her head. \"Why?\"", "\"Because,\" Shen Yu said, stepping closer, \"if we open one gate, the water flows. But if we open a thousand gates, at the same time, in the same sequence... the water will move. It will be a wave. A flood wave.\"", "Wen looked down the river, where the current was thin, bright, and fast, like a ribbon of silver thread.", "\"A flood,\" she said. \"That will destroy everything.\"", "\"No,\" Shen Yu said, shaking his head quickly. \"It will wake the river. It will push the silt out. It will clear the channels. It will be a controlled release. A pulse.\"", "Wen looked at Mo, who was walking beside them with her bamboo pole resting on her shoulder. The ferrywoman’s face was calm, but her dark eyes were sharp and attentive, missing nothing.", "\"A thousand gates,\" Wen said, the words feeling heavy in her mouth.", "\"A thousand people,\" Mo said, her voice low and steady. She looked at Shen Yu with a gaze that was both assessing and weary. \"You have thought about this.\"", "Shen Yu nodded, his shoulders dropping slightly. \"I have. It is the only way. We cannot force the water. We have to let it go. And we have to let it go all at once.\"", "Wen looked at the river again. She could feel the gates in her bones, a dull ache behind her eyes, and the pressure of the water behind them pressing against her skin like a cold hand. She thought of the woman in the village, pouring water into jars, and the trust in that simple act. She thought of the debt. The river owed the people, and the people owed the river, and she was the one who had to balance the ledger.", "\"Then we do it,\" Wen said, her voice quiet but firm.", "Mo smiled, a small, genuine curve of her lips. \"Yes,\" she said. \"We do it.\"", "They walked on, the river rushing past them, a silver thread in the green world, while the gates waited ahead, silent and patient. Wen felt the cold in her hands, the frost that never quite melted, and realized it was not a burden, but a promise."], "img": "img/p100.jpg", "pw": false}, {"no": 101, "ch": 21, "ctitle": "The Glacier Valley", "part": "PART FIVE: THE SOURCE", "paras": ["*The Bearer's Almanac, Entry 21: Ice is only a river that is waiting.*", "The valley opened like a mouth that had been holding a secret for a thousand years. It was vast and white, a cathedral of ice where the light did not so much shine as hang in the air, suspended in the thin, bitter cold. The walls on either side were not rock but frozen time, towering blue-green cliffs that glowed with an internal luminescence. Between them, the Clear River lay dead. Not dry, but frozen. A ribbon of deep, ancient blue-green stretched out before them, smooth and glassy, holding the memory of a current that had stopped moving a decade ago.", "Wen Lan walked forward, her boots crunching on the snow that dusted the ice. The air was so thin it felt less like breathing and more like sipping through a very long straw. Each inhalation stung her lungs, a sharp, clean pain that reminded her she was far above the world she knew. Her hair, now entirely white from the temple to the tip, crackled with static in the dry air, the faded blue cloth tie snapping softly in the wind. She could feel the frost in her fingertips, a constant, icy tingle that had become so familiar she no longer noticed it, only felt it as a part of her own skin.", "She looked at the frozen river. It was beautiful. It was also a grave. The water inside was trapped, locked in a cage of crystal, waiting for a warmth that was not coming. She could hear it, a faint, deep hum, a low tone like a drum beaten in a distant valley, but this time the note was held, not released. It was the sound of water that wanted to move but could not.", "Wen touched the surface of the ice with one finger. It was smooth and cold, colder than the salt flats, colder than the winter mornings in the village. It bit into her skin, not with the burn of salt, but with a deep, penetrating chill that went straight to the bone. She pulled her hand back, shaking it out, watching her breath cloud in the air before her, a small, brief puff that vanished before it could reach the blue expanse.", "The silence was absolute. There were no birds, no insects, no wind. Only the creak of the ice, a low, groaning sound that seemed to come from everywhere and nowhere, the sound of a giant shifting in its sleep. Wen stood there, her white hair glowing in the high light, and felt the pressure of the valley pressing down on her shoulders. She was a speck of white in a sea of blue, a drop of water in a cup of ice, and the distance to the source felt infinite."], "img": "img/p101.jpg", "pw": true}, {"no": 102, "ch": 21, "ctitle": "", "part": "", "paras": ["Shen Yu was on his knees in the snow, his surveyor’s staff planted firmly in the ice. He was measuring the distance between a row of small, grey stones and the edge of the blue ice. The stones were weathered, their edges rounded by wind and time, and they sat in a neat line, like a row of teeth in a stone jaw. They were old markers, he explained, his voice tight with concentration.", "\"Three hundred years ago,\" he said, tapping the staff. \"The ice was right here. The river was flowing. These stones were the banks. Now, look.\" He pointed to the edge of the ice, which was fifty meters further away, a vast expanse of white snow and cracked earth in between. \"The river has retreated. The wetlands below are drying up. The water is not just being held; it is being taken from the source. The glacier is shrinking. The wetlands are shrinking. The drought is not a trick. It is a reality.\"", "Wen looked at the stones, then at the ice. She could see the truth in the measurements, in the cold, hard numbers that Shen Yu spoke with such quiet precision. The Lord’s belief was not malice; it was fear. He had seen the wetlands dying, the glaciers retreating, and he had tried to save the realm by hoarding the water, by keeping it in the cisterns, by stopping the flow. But in doing so, he had made the drought worse. The water was not moving, so it was not cycling. The system was broken.", "\"There are two tasks,\" Wen said, her voice low. She knelt beside Shen Yu, her white hair falling over her shoulder. \"Ending the hoarding. And slowing the drying. They are not the same. If we just open the gates, the water will flow, but the source will still be drying up. We need to fix the source. We need to make the water move again, not just release it. We need to wake the river.\"", "Shen Yu looked up at her, his glasses reflecting the blue light. \"How?\"", "Wen looked at the frozen river, at the deep, trapped water inside the ice. \"By making it want to move. By making it remember how to be a river. Not a pool. Not a cistern. A river.\""], "img": "img/p102.jpg", "pw": false}, {"no": 103, "ch": 21, "ctitle": "", "part": "", "paras": ["They had to cross the frozen river. There was no other way. The ice was thick, but it was not solid; it was a lattice of crystal and air, and it was cracking. A web of fractures spread across the surface, fine and white, like the cracks in a glaze that has been fired too hot. They needed a bridge.", "Wen found a rope, a thick, braided hemp rope that Mo had carried in her pack. It was short, barely enough to span the gap if they stretch
