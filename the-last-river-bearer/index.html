<script>
const D = {"title": "The Last River Bearer", "sub": "A Novel of Water, Ice and a Thousand Gates", "author": "Yang", "publisher": "Yang Ink", "pages": [{"no": 1, "ch": 1, "ctitle": "The River That Overslept", "part": "PART ONE: THE DRY POOL", "paras": ["*The Bearer's Almanac, Entry 1: Water is never lost. It is only somewhere else.*", "On the morning the river did not come, Wen Lan went down to Hollow Pool with two buckets and the firm conviction that the river had simply overslept.", "It was a reasonable theory. The Clear River had run past the village of Qingshi every day of the three hundred years the village had kept records, and in all that time it had been late exactly once, during the great mist of her grandmother's girlhood, and had made up for it by arriving with a brass band of frogs. So Wen walked down the terrace stairs in the pearl-grey light with her buckets knocking against her knees, past the rice fields stepped down the hillside like the pages of an enormous green book, and she fully expected to hear the river long before she saw it, the way you hear a neighbor who is clearing his throat.", "She heard nothing. The gorge above the village was full of mist, the long pale kind that lies in the Clear River valley until the sun gets high enough to argue with it, and out of the mist rose the dark shoulders of the cliffs and the single thread of the old footbridge. Below the bridge lay Hollow Pool, the great round basin where the river rested before it tumbled on toward the sea. It had been deep enough, when she was small, for the village boys to dive from the high rock and not touch bottom.", "It was a bowl of cracked mud now, the color of a dry biscuit, with a dark thumbprint of water in the middle. Around the thumbprint a few dozen silver fish lay in the muck and opened and closed their mouths, patiently, like clerks who have been told that the office is closed and cannot quite believe it.", "Wen stood at the edge of the pool with her buckets and said, to nobody, \"That is not right.\""], "img": "img/p001.jpg", "pw": true}, {"no": 2, "ch": 1, "ctitle": "", "part": "", "paras": ["By the time the sun had burned the mist off the cliffs, half of Qingshi had come down to look. They stood along the dry bank in their straw hats and padded jackets and looked at the pool the way people look at a relative who has said something strange at a wedding.", "\"Third day,\" said old Uncle Fang, who kept the village waterwheel and had been counting out loud for three days. \"The channels are empty. The wheel hasn't turned since Tuesday. The seedlings on the lower terraces are going yellow, and Granny Ma's goat has started drinking from the soup pot.\"", "\"It is only the dry month,\" said a woman with a baby on her hip, in the voice of someone who needs it to be true. \"It happens. The river sleeps. My own grandmother used to say it. Once a lifetime the river sleeps and wakes.\"", "\"Your grandmother,\" said Uncle Fang, \"also said the moon was a lamp somebody forgot to put out.\" He rubbed his chin. \"I have kept that wheel for forty years. A river that sleeps still hums. This one has gone silent from the top of the valley to the bottom, like somebody has put a lid on it.\"", "Nobody laughed. Wen, who had been the one to say it was not right, found herself at the back of the crowd with her buckets still in her hands and her face growing warm, because everyone was suddenly looking at the water and not at her, and what she wanted more than anything in the world at that moment was to be useful.", "She had always wanted that. It was her one real flaw, as far as she could tell. Other girls her age wanted to be admired or left alone. Wen wanted, with an almost embarrassing ferocity, to be of use."], "img": "img/p002.jpg", "pw": false}, {"no": 3, "ch": 1, "ctitle": "", "part": "", "paras": ["The crowd drifted off in ones and twos toward the village, muttering about wells. Wen stayed.", "She told herself it was to see whether the fish could be moved, and she knelt in the mud at the edge of the last puddle with her skirt hitched up and began scooping the nearest ones into a bucket with her bare hands. They were slippery and cold and astonishingly strong for fish with no water to be strong in, and every time she lifted one it twisted in her palm as if to say, quite clearly, that this was not what it had meant.", "\"I know,\" Wen told it. \"I know. I am so sorry. I would put you back if there were anywhere to put you.\"", "She put her hand flat on the surface of the puddle, which was no wider than a washing basin and no deeper than her wrist, and for no reason she could have given she shut her eyes and said, in a voice so quiet it was scarcely a voice, \"Please.\"", "The water moved.", "It did not splash or ripple. It simply rose, in one piece, like a held breath, out of the hollow in the mud and hung in the air in front of her face as a single trembling sphere the size of a melon, bright with the morning, with a small startled fish turning slowly inside it.", "Wen did not breathe. The sphere did not breathe either. She could feel it the way she could feel her own hand, a round, cold, attentive weight just beyond her fingertips, and under the weight, very faintly, a long thread of something that went away from her down the valley and up the valley and past the edge of everything she knew, like the string of a kite.", "Then her mouth fell open, and the sphere fell with it, in a great undignified splash that soaked her to the knees and sent the fish skidding across the mud in every direction."], "img": "img/p003.jpg", "pw": true}, {"no": 4, "ch": 1, "ctitle": "", "part": "", "paras": ["She tried it again. She could not help it. She knelt in the wet mud with her heart going like a drum and her hair coming out of its blue cloth, and she held out one hand toward what was left of the puddle and thought, as hard as she had ever thought anything, up.", "The puddle rose. Not a sphere this time: a whole shining spiral of water, climbing from the hollow in a turning column as high as her shoulder, then higher, and the mist from the cliffs came down to meet it in soft pale threads and wound itself around the column like silk around a spindle. Droplets lifted off the mud and the cracked rock and hung glittering around her, hundreds of them, each one holding a tiny upside-down morning. She was standing in the middle of a whirlwind of water, and it was not even wet.", "For about three seconds she was perfectly, wildly happy. She laughed out loud. The sound went up into the gorge and came back, and the water spun faster to meet it.", "Then the cold arrived.", "It began at her fingertips, a small hard ache like holding a stone from the bottom of a winter stream, and it climbed her wrists and her forearms with a speed she did not like at all. And somewhere far away, down the valley, she heard a thin dry sound she knew very well: the sound of the village channel, which had been holding one last cupful of the old river, running empty.", "She had taken it. She had not meant to, and she had not known she could, but she understood with a sick certainty exactly where the water in her spiral had come from. It was not hers. It had been somebody's. Somebody else's pond, somebody else's cup.", "\"Oh,\" said Wen, very small, and the spiral shivered and began to come apart."], "img": "img/p004.jpg", "pw": false}, {"no": 5, "ch": 1, "ctitle": "", "part": "", "paras": ["\"Put it back,\" said a voice from the bank. \"Slowly. Do not drop it. Water that is dropped takes a long time to forgive.\"", "Wen turned. At the far end of the pool, where the path came down from the ferry landing, stood a short, wide woman in a faded blue jacket and a conical bamboo hat, leaning on a long ferry pole as though it were the only thing in the world she trusted. She was barefoot. Her face was a map of weather, and she did not look surprised, which Wen found more frightening than if she had.", "Wen lowered her hands. The spiral came down by inches, trembling, and folded back into the hollow of the mud, and the fish she had scattered wriggled hopefully toward it. When the last drop had settled she was shaking so hard she had to sit down on the bank.", "\"Auntie Mo,\" she said. Her teeth were chattering. \"I did not know. I swear I did not know I could do that.\"", "\"No,\" said Auntie Mo, who had ferried the whole valley across the Clear River for thirty years and had never been known to say anything she did not mean. \"I did not think you did.\" She came across the cracked mud with her pole clicking and crouched by Wen, and took Wen's hands in her own two hard brown ones and turned them over. On the tips of three of Wen's fingers lay a faint white bloom, like the first frost on a window.", "Mo looked at it for a long time. \"So it is true,\" she said, almost to herself.", "\"What is true?\"", "\"That the river has been stopped upstream by hands, not weather.\" Mo let go. \"And that your mother would have known exactly what to do about it.\""], "img": "img/p005.jpg", "pw": false}, {"no": 6, "ch": 2, "ctitle": "What the Pool Remembered", "part": "PART ONE: THE DRY POOL", "paras": ["*The Bearer's Almanac, Entry 2: A drought is weather. A drying is a decision.*", "The village hall smelled of damp wood and cold tea. Outside, the wind moved through the empty rice channels with a dry, rasping sound, like a cat walking on gravel. Inside, the lamps burned low, casting long, wavering shadows against the earthen walls. The farmers sat on low stools, their straw hats pulled low, and the silence between their words was heavy enough to crush a walnut.", "Uncle Fang, the keeper of the waterwheel, stood at the front with his arms crossed. His face was the color of old clay. \"We have three days of water left in the deep well,\" he said, his voice flat and final. \"After that, the pump will cough up silt and rust. We cannot feed the cattle, let alone the people, on rust.\"", "A murmur rippled through the room. A young man near the door, who had been chewing a stalk of dried grass, stopped and looked at his feet. \"Sell the terraces,\" he said. It was a dangerous suggestion, the kind that usually got you thrown out before the second syllable left your mouth. But the pool was dry, and desperation makes a man forget his manners. \"The merchants in Silt Harbor are paying gold for water rights. We could sell the lower fields. We could keep the upper ones for ourselves.\"", "\"Silence,\" said the headman, Old Zhou. He did not look angry. He looked tired, the specific exhaustion of a man who has carried a heavy load for too long and is slowly forgetting where to put it down. He tapped a thick finger against the table. \"The terraces are not a commodity. They are the bones of the village. You do not sell your own skeleton to pay for bread.\"", "Wen sat in the very back, wedged between a pillar and the shadow of the door. She had tucked her right hand deep into her sleeve, pressing it against the inside of her wrist. The frost was still there, a faint, icy prickle that had not faded since the pool. She could feel it ticking under her skin, a small, persistent clock counting down something she did not want to understand. She watched Uncle Fang’s hands. They were shaking, just slightly, a tremor that had nothing to do with the cold.", "\"The river did not die,\" Wen said. Her voice was thin, barely louder than the wind outside. Everyone turned. She hated the sound of her own voice in the quiet room, so small, so young, so completely out of place among these hardened farmers. \"I felt it. The water did not dry up slowly. It was pulled. Held back.\"", "Uncle Fang turned to her, and his eyes were hard. \"Feelings do not fill buckets, girl. Go home. Sleep.\"", "Wen did not move. She kept her hand hidden, but the cold in her fingers was spreading, a quiet invasion that made her teeth ache."], "img": "img/p006.jpg", "pw": true}, {"no": 7, "ch": 2, "ctitle": "", "part": "", "paras": ["The door creaked open, and the draft of cool air rushed in, sending a shiver through the room. Auntie Mo stood in the doorway, her conical bamboo hat tilted slightly back, her bare feet clean and strong against the threshold. She leaned on her ferry pole, and the tip of it tapped the floor with a rhythmic, wooden click that silenced the remaining murmurs.", "\"Ferrymen see the bottom of the world,\" Mo said. Her voice was low, rough, like sandpaper on stone. \"We know where the mud settles and where the current bends. We know the river’s moods before the sky does.\" She stepped inside, her eyes sweeping over the farmers with a calm, assessing sharpness. \"You are arguing about selling your bones, but you are ignoring the head of the snake.\"", "Old Zhou frowned. \"What do you know, Mo? You cross the water. You do not create it.\"", "\"I measure it,\" Mo said. \"For two seasons now, the boats have been stranding further down. Not a little further. A lot further. The silt line has dropped by three meters. That is not a drought. A drought is weather. It is chaotic, messy, partial. This is different.\" She raised her pole and pointed it at the floor. \"The river did not run dry at the mouth and work its way up. It did not run dry in the midlands and leave the delta full. It ran dry everywhere, at once.\"", "The room went silent. A woman near the front, who had been wringing her hands, stopped and looked at Mo with wide eyes.", "\"It is like a tap,\" Mo continued, her voice dropping to a whisper that carried across the hall. \"Someone turned it off. All at once. From the source to the sea, the water vanished in a single moment. That requires a mechanism. A gate. A lock. A hand, strong and precise, closing a valve.\"", "Wen felt a chill that had nothing to do with the winter air. She remembered the sphere of water in the pool, the way it had hung in the air, trembling, connected to something vast and distant. She had pulled it, and the cold had rushed in from nowhere. Mo’s words confirmed what Wen’s body already knew. This was not nature. This was engineering.", "\"But how?\" Uncle Fang asked, his voice barely a squeak. \"The river is two thousand kilometers long. Who has a valve that big?\"", "Mo looked at him, and for the first time, her face softened into something that looked like pity, or perhaps just recognition. \"I don’t know who, Uncle Fang. But I know where to look. Upstream. Toward the source. If the water is being held, it is being held somewhere specific. And if it is being held, it is being held for a reason.\"", "She looked directly at Wen. \"And if your mother was the last one to walk that road, maybe her daughter knows the way.\""], "img": "img/p007.jpg", "pw": false}, {"no": 8, "ch": 2, "ctitle": "", "part": "", "paras": ["The walk home was shorter than it felt, because the dark terraces stretched out in every direction, a vast, silent ocean of brown earth under a sky thick with stars. Wen’s father, Wei, walked beside her, his steps soft and measured. He was a quiet man, the kind who spoke to the rice plants more often than to his daughter, and his silence was a comfort, a blanket that kept the world at a manageable distance.", "They passed the dry channels, the empty weirs, the silent waterwheel. The landscape looked stripped, bare, as if the river had taken its clothes with it. Wen could feel the cold in her fingers again, a faint, persistent ache that reminded her she was carrying a secret that did not belong to her.", "When they reached the gate of their small house, Wei stopped. He did not look at her. He looked at the ground, at the dark soil, at the dry stalks of rice that had been his life’s work for forty years. Then he reached into the pocket of his padded jacket and pulled out a small, folded square of cloth.", "It was blue. A deep, fading blue, the color of the river on a clear day, the color of the sky before a storm. Wen recognized it instantly. It was her mother’s scarf. She had seen it once, in a photo, when she was four. It had been wrapped around her neck, and her face had been bright with a smile that Wen could no longer quite remember.", "Wei held it out. His hands were steady, but his voice, when he spoke, was rough. \"Your mother walked this river,\" he said. \"When you were four. She went up to the source. She did not come back.\"", "Wen took the cloth. It was soft, worn thin by years of use, and it smelled faintly of camphor and old paper. She did not ask where he had kept it. She did not ask why he had not given it to her before. Some things are kept not because they are hidden, but because they are too heavy to carry until the one who will bear them is strong enough.", "\"Did she find it?\" Wen asked, her voice barely audible. \"Did she find what was wrong?\"", "Wei looked at her then, and his eyes were dark and deep, like the bottom of a well. \"She found the answer,\" he said. \"And it cost her everything.\" He turned and walked into the house, leaving Wen standing in the dark, the blue cloth clutched in her hand, the cold in her fingers now a sharp, bright pain."], "img": "img/p008.jpg", "pw": true}, {"no": 9, "ch": 2, "ctitle": "", "part": "", "paras": ["Inside, the house held a steady warmth that failed to penetrate the cold settling deep in Wen’s bones. She sat cross-legged at the low table, spreading the blue cloth across the worn wood. It was not merely a scarf, but a chart of her mother’s meticulous surveying. The handwriting was tight, precise, and dense, covering every inch of the fabric in a web of ink lines that mapped the river’s entire journey from the southern delta to the jagged northern peaks. Two thousand kilometers of water, drawn in a single unbroken line.", "Wen traced the route with her fingertip, feeling the slight bumps where her mother had pressed the pen hard against the weave. The notes were not in a language she recognized, yet the symbols were clear enough to read without translation. Arrows indicated the current’s direction. Dots marked the villages that depended on it. Squares represented the stone weirs, and circles denoted the sources. At the very top of the map, in the high north, a large, dark circle held a single word written in her mother’s steady hand.", "*Source.*", "Wen pulled a length of thread from her bamboo gourd and stretched it along the drawn line of the river. She anchored the other end against the scale printed at the bottom of the cloth. The scale was simple: one centimeter equaled ten kilometers. She counted the centimeters, her pulse beating slowly and heavily against her ribs. One. Two. Three.", "The thread stretched nearly two meters, representing two hundred kilometers on the scale. But the scale was a lie. The real distance was not a line on a piece of cloth. It was mud, and rock, and biting cold, and the slow ache of hunger. It was two thousand kilometers of walking. She did the math in her head, the way she did everything, quickly and precisely. If she walked six kilometers a day, it would take three hundred and thirty-three days. If she walked four, it would take five hundred.", "Five hundred days. That was a lifetime compressed into a season of planting and a season of harvest, followed by a winter and another spring. She would be seventeen when she reached the source, and eighteen when she came back, if she came back at all.", "She looked at the map again, her breath fogging in the warm air. Her mother’s notes were not just a map; they were a ledger. Every village was marked with a small symbol, a cup of water, a drop, or a fish, and next to each one, a number. A debt. A payment. The river belonged to everyone who drank downstream, and someone had turned it off.", "Wen felt the cold in her fingers, the white frost that bloomed and faded, bloomed and faded. It was not just a cost; it was a memory. Her mother’s memory. Her mother’s debt. And now, it was hers."], "img": "img/p009.jpg", "pw": false}, {"no": 10, "ch": 2, "ctitle": "", "part": "", "paras": ["Dawn broke over Qingshi in shades of grey and pale gold, the mist hanging low in the valley like a thick wool blanket that muffled the world. Wen stood at the gate of her house, her pack on her back, her bamboo gourd swinging at her hip, the blue cloth tied in her ponytail a bright streak against her black hair. She had packed three rice cakes, a small jar of salt, and a knife, but she had not packed a weapon, because she did not need one, since she had the river, or rather, the debt the river owed.", "The village was waking up, the smell of cooking fires drifting through the air as a faint, sweet scent that did not match the dry, brittle landscape. People moved in the shadows, their faces hidden behind straw hats, their steps quick and silent, and they did not look at her, because they did not need to, for they knew what she was going to do. At the village gate, Auntie Mo was waiting, leaning on her ferry pole with her bare feet planted firmly on the packed earth, her face unreadable as a map of weather, but her eyes sharp, bright, and alive.", "\"You are going alone,\" Mo said, her voice flat and factual, offering no room for argument.", "\"I am going,\" Wen replied, adjusting her sash. \"Alone is not the point.\"", "Mo laughed, a short, dry sound like a dry twig snapping. \"You are sixteen, and the river is two thousand kilometers long, while the mountains are cold and the water is scarce, and you are carrying a debt that will freeze your hands before you reach the first village.\"", "\"I know,\" Wen said, staring at the mud.", "\"Then why are you not afraid?\"", "Wen looked at her, at the woman who had ferried the whole valley for thirty years, who had seen the bottom of the world and known its moods. \"Because I am not afraid of the river,\" Wen said, her voice steady. \"I am afraid of leaving it dry.\"", "Mo looked at her for a long time, her gaze traveling from Wen’s face to her pack and back again. Then she nodded, once, slow and deliberate. \"I am going downriver,\" she said, shifting her weight to her other foot. \"To Silt Harbor, to sell what wood I have left, and while the roads are dry, they are open, so we may as well share the first stretch, for I know the way, and you know the water.\"", "Wen felt a warmth spread through her chest, a small, fragile thing, like a spark in a dry field, and she did not smile, because she did not need to, for she knew what this meant, that Mo was not just a ferrywoman, but a guide, a teacher, and a witness.", "\"Come on, then,\" Mo said, turning toward the path that led down the valley, toward the dry pool, and toward the rest of the world. \"We have a long way to walk, and the river is waiting.\"", "They walked out of the gate, into the mist, into the silence, and into the long, slow journey that would change everything."], "img": "img/p010.jpg", "pw": false}, {"no": 11, "ch": 3, "ctitle": "The Ferry in the Mud", "part": "PART ONE: THE DRY POOL", "paras": ["*The Bearer's Almanac, Entry 3: Water is lazy. It takes the lowest road and calls it wisdom.*", "The ferry lay on its side, a flat sliver of wood wedged into the sucking mud of the dry channel bed. It was not broken. Merely trapped. It rested on a bar of packed silt that had once been a deep, dark lane of water. Auntie Mo stood over it, her bamboo pole tapping the ground with a rhythmic, impatient click. She was explaining to Wen the simple, brutal arithmetic of buoyancy.", "\"You see this line?\" Mo said, pointing to a series of notches carved into the stern post of the boat. \"They are called hands. One hand is a span, a palm’s width. When the river is full, the water sits at the fifth hand. Today, we are sitting at the bottom. Zero hands. And zero hands means the boat is dead.\"", "Wen crouched, the mud cool and gritty against her knees. She touched the wood. It was smooth, oiled by decades of river traffic, but stiff with dried silt. \"If I lift the water under it,\" Wen offered, her voice quiet, testing the idea, \"it will float.\"", "Mo looked down at her, her eyes sharp and unimpressed. \"You lift the water, the water comes from somewhere else. You take it from the pool, the pool dries. You take it from the air, it freezes. Arithmetic, child. A boat is heavy. It is wood, iron, and the burden of every thing it has ever carried. You do not lift a boat by pulling the water. You pull the boat by moving the earth.\"", "She picked up a short, curved spade from the sand. The blade was dull, the handle worn to a pale, smooth oval. \"We do not summon the river,\" Mo said, her voice flat and final. \"We invite it. And rivers are lazy. They take the lowest road. Our job is to make sure the lowest road goes where we want it to go.\"", "Wen watched the spade bite into the mud. It was a small, honest motion. No magic. No sparks. No trembling air. Just dirt moving from one place to another. For the first time since the pool had dried, the world felt manageable. A problem with a solution that fit in her hands."], "img": "img/p011.jpg", "pw": true}, {"no": 12, "ch": 3, "ctitle": "", "part": "", "paras": ["They had been walking for an hour, the path a ribbon of packed dirt between the high banks of the dead river. The quiet was thick, broken only by the scuff of Mo’s bare feet and the clink of Wen’s gourd. Mo stopped at a wide, flat patch of mud, smoothed by years of foot traffic, and sat down with a grunt that seemed to come from her very bones.", "\"Let us do the arithmetic properly,\" Mo said. She pulled a small, square board from her jacket pocket. It was made of thin wood, covered in chalk marks and grease stains. She wiped a clean space with her sleeve. \"This boat. It is two meters long, one meter wide. How deep does it sit when full?\"", "\"The fifth hand,\" Wen recited, still standing.", "\"Good. Five hands is roughly twenty centimeters. The volume of water displaced is the length times the width times the depth. Do the math.\"", "Wen sat on the hard ground, her legs folding beneath her. She looked at the board. \"Two by one by zero point two,\" she murmured. \"That is zero point two cubic meters.\"", "\"And one cubic meter of water,\" Mo said, leaning forward, \"weighs one thousand kilograms. So the boat, when floating, displaces two hundred kilograms of water. But the boat itself weighs more than that, because it is made of wood, which is denser than water, and it carries iron fittings, and rope, and the memory of all the cargo it has carried.\"", "Wen did the multiplication in her head, her fingers twitching on her knee. \"If the boat is half wood, half air, and the wood is heavy...\" She stopped. Her face went pale, the color draining out of her cheeks like water from a basin. \"The boat weighs more than two hundred kilograms. It must weigh three hundred. Maybe four.\"", "\"Four hundred kilograms,\" Mo said, her voice soft and terrifyingly accurate. \"That is four hundred kilograms of wood and iron that you would have to lift, with your hands, out of the mud, to get it to float. And you would have to hold it there while you dug the trench, and then let it go, and hope it does not sink again. Do you feel the burden of it yet?\"", "Wen looked at her hands. They were trembling, a fine, persistent vibration that started in her fingertips and climbed up her wrists. She thought of the cold that had rushed through her arms at the pool, the way her breath had fogged in the morning air. She had not realized the scale of the debt. It was not a small, manageable thing. It was a mountain."], "img": "img/p012.jpg", "pw": false}, {"no": 13, "ch": 3, "ctitle": "", "part": "", "paras": ["Mo did not let her sit in the fear. She stood, brushed the dust from her grey trousers, and pointed to a spot ten meters ahead. The mud there was drier, and the bank sloped gently into the dead channel.", "\"Watch,\" she said.", "Mo drove the spade into the earth with a sharp, decisive thrust. She did not dig deep. She dug wide. Scooping the mud out, she tossed it to the side, not in a pile, but in a low, long ridge running parallel to the trench. Her work had a rhythm, almost musical; the spade bit the soil with a low note, the mud landing in a soft, continuous strip.", "\"Dig the channel deep,\" Mo said, not looking up. \"Keep the levee low. If the levee is high, the water hits it and breaks. If the levee is low, the water slides over it and stays with you. You are not building a wall. You are building a guide.\"", "Wen watched the shape emerging from the flat ground. It was a simple, elegant line, a groove in the earth that seemed to invite the water to follow. It was the kind of engineering that did not need to be explained, only seen. Practical, unglamorous, and completely effective.", "She picked up the spade. It was heavier than it looked, the weight distributed awkwardly in her hand. She drove it into the mud, and the ground resisted, gritty and stubborn. She leaned into it, her shoulders aching, her breath coming in short, sharp bursts. The mud came up in clumps, dark and rich, smelling of damp earth and old rain.", "She threw it into the low ridge Mo had started. The ridge grew, inch by inch, a slow, deliberate line of earth running alongside the trench. Wen’s arms burned, a deep, dull heat that spread from her shoulders to her elbows. She did not stop. She could not stop. The rhythm was there, the same rhythm as her breathing, the same rhythm as the river, if the river had ever had one.", "Mo checked the slope of the levee, running her hand along the top. \"Good,\" she said. \"Keep it smooth. No bumps. Water hates bumps. Bumps are where it gets stuck.\"", "Wen smoothed the ridge with her palms, pressing the mud flat and firm. It was a small, tactile act, a conversation with the ground. She could feel the moisture in the soil, the coolness of it, the life that lay dormant beneath the surface. It was not magic. It was work. And for the first time, the work felt like a language she was learning to speak."], "img": "img/p013.jpg", "pw": true}, {"no": 14, "ch": 3, "ctitle": "", "part": "", "paras": ["As the sun climbed higher, the heat pressed down on the dry channel, shrinking the world to the dusty patch of ground where they worked. Yet they were not alone. A thin trail of boats had gathered on the mud bar, a ragged line of stranded vessels stretching back into the mist.", "A salt-trader, heavyset in a white robe, sat on his bench with a cup of cold tea. He grumbled about the price of salt and the river having been \"tapped\" upstream, his voice a low, continuous rumble of complaint. Beside him, a family huddled in the shade with a flock of ducks. The birds were quiet and dusty, their feathers matted with silt. A monk with a small brass bell sat cross-legged on the ground, eyes closed, lips moving in silent prayer directed at the mud rather than the sky.", "They did not speak to Wen, but they watched her. The salt-trader’s eyes were sharp, calculating her strength and resolve. The family’s children pointed at her, fingers small and accusing, treating her presence as both hope and threat. When the monk finally struck his bell, the note rang out clear and pure in the dry air, a sound that seemed to belong to a cleaner world.", "Wen paused, her spade resting in the mud. She looked at the boats, the people, the long silent line of stranded lives. They were not just waiting for water. They were waiting for a reason to keep going. And she, with her trembling hands and aching shoulders, was the only one who held the power to give them that reason.", "Mo worked beside her, the spade moving in steady, efficient rhythm. She did not look up, but her voice was low, just loud enough for Wen to hear. \"They are counting on you,\" Mo said. \"That is a heavy thing to carry. Heavier than the boat.\"", "Wen looked at her hands. The tremor was still there, a faint, persistent vibration. But beneath it lay a steadiness, a quiet determination growing in her chest since morning. She was not just carrying the boat. She was carrying the hope of a dozen people, the burden of their lives, their futures, their faith in a girl who could move water.", "It was a terrifying thought. And a beautiful one."], "img": "img/p014.jpg", "pw": false}, {"no": 15, "ch": 3, "ctitle": "", "part": "", "paras": ["Twilight settled over the dry channel, turning the sky a bruised purple as the air cooled into stillness. The trench they had dug lay finished, a long, smooth groove cutting through the mud from the edge of the remaining pool to the stern of the ferry. A low levee ran alongside it, a gentle ridge that guided the eye and the water along its path with the same patience used to steer a boat through rapids.", "Wen stood at the pool’s edge, her hands outstretched, fingers trembling against the cooling air. The water itself was low, a thin, shimmering ribbon that barely covered the basin’s bottom. It was not much, certainly not enough to float a heavy hull, but it was enough to start.", "She closed her eyes. Lifting felt wrong, a brute force that would shatter the delicate balance. Instead, she thought of the trench, the levee, the path. She thought of water’s desire to flow, to find the lowest road, to return to the sea. She did not pull. She invited.", "The water moved. It did not rise in a sphere, nor did it spiral into the air. It flowed, a thin, silver ribbon lifting from the pool and sliding into the trench, following the line of the levee with a precision that felt almost eerie. It moved slowly, deliberately, a stream of light weaving through the dust and dry earth.", "The ferry shuddered. The wood creaked, a deep, resonant sound that vibrated in Wen’s bones. The boat lifted, inch by inch, until the hull was clear of the mud, floating on that thin, shimmering ribbon.", "The crowd on the mud bar erupted. The salt-trader stood, his cup of cold tea forgotten in his hand. The family’s children screamed, their voices high and bright against the twilight. The monk struck his bell, a single, clear note that rang out over the silence, a sound of triumph and relief.", "Wen stood still, her hands outstretched, the water flowing through her like a cool, steady current connecting her to the earth and the people. She looked down at her fingertips. The white frost was there, a thin, delicate bloom spreading from her nails to her knuckles. It was cold, a biting, persistent chill that did not fade with the movement of the water.", "Mo stood beside her, watching the boat float, watching the crowd cheer. Her eyes were on Wen’s hands, sharp and knowing. She said nothing. She did not need to. The silence was a language of its own, a warning, a promise, a debt that had been paid and would be paid again.", "The river was moving. And the cost was beginning to show."], "img": "img/p015.jpg", "pw": false}, {"no": 16, "ch": 4, "ctitle": "Master Gao's Offer", "part": "PART ONE: THE DRY POOL", "paras": ["*The Bearer's Almanac, Entry 4: Be careful of help that arrives before you have asked for it.*", "The mud here was not the brown, forgiving earth of Qingshi. It was a grey, hardened crust, cracked into a mosaic of hexagons that stretched out to a horizon of pale, shimmering light. The air tasted of salt and old iron, a metallic tang that coated the back of Wen’s teeth. They walked for hours, the sun hanging low and washed out, casting no shadows because there was nothing solid enough to cast them.", "Finally, the landscape broke. Silt Harbor rose from the flatness like a broken tooth, a tangle of masts and rigging leaning at drunken angles. The ships were stranded, their hulls buried in the silt up to the gunwales. They leaned against one another, a forest of snapped masts and tattered sails, frozen in a posture of exhausted resignation. There was no water beneath them, only a thick, sucking mire that held them in a grip that felt less like earth and more like a slow, suffocating embrace.", "Wen stopped walking. The silence was absolute, save for the creak of wood settling under its own weight and the distant, hollow sound of a gull crying out over the empty basin. It was a graveyard of commerce, a place where trade had died not with a bang, but with a dry, scraping hiss.", "Auntie Mo adjusted her bamboo pole, her bare feet finding purchase on the cracked crust with the easy confidence of a woman who had spent a lifetime reading the terrain. She looked at the ships, then at the horizon, her weathered face unreadable.", "\"Three days' walk to the edge of the true delta,\" Mo said, her voice low and flat. \"Beyond that, the land starts to rise. The river should have been here. It is not.\"", "Wen looked at the nearest ship, a broad cargo vessel with its name painted in faded white characters now obscured by dust. A single rope dangled from its bow, snapping weakly in the breeze. It looked like a tether, a connection to a world that had simply stopped existing.", "\"They are waiting,\" Wen said. She did not know why she said it. The words felt heavy in her mouth, unbidden and strange.", "Mo turned her head, a sharp, quick movement. \"Ships do not wait, girl. They sink. Or they break. Or they rot. Waiting is a human error.\" She resumed walking, her pole clicking against the dry crust. \"Come. We have a long walk ahead of us, and the sun is already beginning to argue with the horizon.\""], "img": "img/p016.jpg", "pw": true}, {"no": 17, "ch": 4, "ctitle": "", "part": "", "paras": ["The dust cloud rose behind them, a low, brown smear against the white sky. It materialized slowly, first the mules with their heavy loads, then the men, and finally, the man who stepped out from the shade of a large, curtained mule and looked directly at Wen.", "He was tall, taller than anyone she had ever seen, with a posture of such relaxed elegance that it seemed to mock the roughness of the terrain. He wore a green traveling robe, the silk catching the faint light, with a collar of fine white fur. A jade pin, dark and polished, held his grey-streaked topknot in place. Under his left arm, he clutched a leather-bound ledger, its cover worn smooth by years of handling.", "He did not look at the ships. He did not look at the mud. He looked at Wen, and his smile was a precise, calculated thing, missing nothing.", "\"Master Gao,\" Auntie Mo said. The name came out flat, carrying the memory of old dealings.", "\"The girl from Qingshi,\" Gao said. His voice was smooth, cultured, with the faintest trace of an accent that made the vowels sing. \"I was told a girl in Qingshi had decided to defy the laws of hydrology. I had hoped it was a rumor. I am pleased to see it is not.\"", "Wen felt a prickle of unease crawl up her spine. Gao’s eyes were bright, intelligent, and entirely too attentive. He was looking at her hands, not her face.", "\"You know about the ferry,\" Wen said. It was not a question.", "\"I know about the water,\" Gao corrected gently. He took a step forward, his polished black boots sinking slightly into the crust. \"I know that you moved it. I know that it cost you something. I know that you are tired, and that you are hungry, and that you are walking toward a source that may not be where you think it is.\"", "Mo shifted her weight, her shoulder squaring in a subtle, defensive stance. \"You are a long way from your caravan to make conversation, Master Gao.\"", "\"I am a long way from a problem I intend to solve,\" Gao said. He glanced at the ledger under his arm, then back at Wen. \"I have a mule with room for a passenger. And I have soup. Fish soup, dried in the sun, with a broth that has been simmering since dawn. The choice is yours, Wen Lan. But the sun is setting, and the cold comes early on the salt.\""], "img": "img/p017.jpg", "pw": false}, {"no": 18, "ch": 4, "ctitle": "", "part": "", "paras": ["The inn in Silt Harbor was a single-story structure of pale stone, its windows shuttered dark against the relentless dust that still settled on the ledges. Inside, the air carried the heavy scent of dried herbs and stale woodsmoke, settling into the cracks of the walls. The tables stood empty and the chairs were coated in a fine grey powder, but a single lamp burned on the counter, casting a warm cone of yellow light over a bowl of bubbling broth.", "Gao had ordered not just for the three of them, but for an audience that was not there, a habit born of long travel and cautious optimism. He sat with his back to the wall, the ledger open on the table before him, his fingers tracing the lines of text with a meticulous care that bordered on reverence.", "\"Seventeen towns,\" he said, not looking up. \"Six mountain passes. Thirty-eight bridges. This is the route to the source. I have mapped it. I have measured it. I have calculated the flow rates of every tributary, the silt levels of every delta, the pressure points of every weir.\"", "Wen picked up her spoon. The broth was thin, clear, and surprisingly good. She tasted the salt, the fish, the faint bitterness of dried greens. It was honest food, the kind that tasted of the journey it had survived to reach the bowl.", "\"And you want to guide me,\" Wen said.", "\"I want to observe,\" Gao said. He finally looked up, his eyes bright with a focus that was almost painful to meet. \"You are a variable, Wen Lan. A significant one. The river is not merely stopped; it is being managed. Managed by people who understand water as a commodity, not a right. I need to know how far your abilities extend before I can understand the scope of the management.\"", "Mo said nothing. She sat across from them, her arms crossed, her face a mask of stone. She watched Gao with the same intensity she had watched the river for thirty years, her gaze sharp and unblinking. She was waiting for the lie, the moment where the words would slip and reveal the shape of the deception underneath.", "Wen looked at the ledger. \"You are a caravan master. You move goods. Why do you care about the flow of a river?\"", "\"Because the river is the road,\" Gao said simply. \"When the road dries up, the goods do not stop moving. They simply stop being valuable. And the people who own the water... they become very, very rich. I am not interested in the money, Wen Lan. I am interested in the mechanics.\" He closed the ledger with a soft snap. \"Eat. The soup is best when it is hot. And the road is long.\""], "img": "img/p018.jpg", "pw": true}, {"no": 19, "ch": 4, "ctitle": "", "part": "", "paras": ["Wen set her spoon down, the ceramic clink small and sharp against the table. The broth sat in the bowl, a quiet circle of warmth in the cool, dusty air. She looked at Gao, really looked at him, searching for the angle, the trick, the hidden hook that usually came with such polished confidence.", "\"Master Gao,\" she said. \"You have a caravan. You have a ledger. You have maps. You are successful. You are comfortable. You are safe.\"", "Gao raised an eyebrow, a small, amused gesture. \"I am all of those things, yes.\"", "\"So why are you here? Why are you in this dust, with this soup, with a girl who has a gourd on her back and a frost on her fingers?\"", "The room seemed to hold its breath. Mo’s eyes narrowed, a flicker of something sharp moving behind her gaze. Gao leaned back in his chair, his posture relaxing, the tension in his shoulders easing.", "\"Because I knew your mother, Wen Lan.\"", "The words landed with a weight that had nothing to do with physics. Wen’s hand tightened on the rim of her bowl. Her mother. Lin Hua. A name that had been spoken in the village only in whispers, a name that had gone up the river twelve years ago and never come down.", "\"You knew her?\" Wen asked. Her voice was quiet, stripped of its usual confidence.", "\"She was a Bearer,\" Gao said, his tone gentle, respectful. \"Like you. She walked this road. She walked it to the source. She taught me that water is not a resource to be hoarded, but a debt to be honored.\" He looked at her hands, where the faint white frost still lingered on her fingertips. \"I was there when she left. I know what the river takes. And I know what it gives back.\"", "Wen looked down at her hands. The frost was cold, a persistent, biting chill. It was not just a side effect. It was a signature. A brand.", "\"She never came back,\" Wen said.", "\"No,\" Gao agreed. \"But she left the river running. For a while.\" He picked up his ledger, his fingers hovering over the cover. \"The river has stopped, Wen Lan. Not because it was turned off, but because it was broken. And it is waiting for someone to put it back together.\""], "img": "img/p019.jpg", "pw": false}, {"no": 20, "ch": 4, "ctitle": "", "part": "", "paras": ["The night in Silt Harbor carried a chill so dry it felt like sandpaper against the skin. Wen sat on the edge of the inn’s rooftop, her legs dangling over the precipice, her breath escaping in small, rapid puffs that vanished before they could form clouds. Below, the harbor was a landscape of shadows, the stranded ships lying black and silent against the starry sky, their masts pointing upward like broken fingers.", "The moon hung full and hard, a bright coin pressed into the darkness. It reflected off the remaining pools of water in the harbor, creating a path of silver light that led down to the mud, a fragile thread connecting the high roof to the low, cracked earth. Wen stood up and walked to the edge, her boots clicking softly on the stone, a rhythm that sounded too loud in the heavy quiet. She looked down at the water, a small, stagnant pool trapped in the shadow of a ship’s hull, dark and still as a held breath.", "She reached out her hand.", "The water was colder than it had looked in the day, a deep, biting absence of warmth. It did not move. It did not rise. It simply sat there, heavy and still, refusing to acknowledge her touch. Wen touched it, her fingertip breaking the surface with a faint, almost inaudible ripple.", "And for a moment, the world expanded. She felt the water not just as a substance, but as a connection, a thread that stretched from her fingertips down into the mud, then out, past the harbor, past the delta, up the river, past the terraces, past the gorges, up to the source. It was thin, so impossibly thin, a hairline fracture in the fabric of the world. And it was pulling, not toward her, but away, toward something far away, something that was holding it tight, stretching it, draining it.", "She pulled her hand back. Her breath was fogging in the cold air, a white mist that hung before her face like a veil. Her fingers were numb, the frost spreading, creeping up her wrists, a slow and inevitable invasion of cold. She looked at the ledger Gao had left on the table below, its cover closed, its secrets hidden. She looked at the river, a thread of silver in the dark.", "It was not stopped. It was being held."], "img": "img/p020.jpg", "pw": false}, {"no": 21, "ch": 5, "ctitle": "The Dry Delta", "part": "PART ONE: THE DRY POOL", "paras": ["*The Bearer's Almanac, Entry 5: A river builds the land it will one day drown.*", "The causeway was a thin scar of packed earth cutting through the delta’s expanse. It smelled of dried reeds and old brine, a scent that stuck to the back of the throat and lingered. The mud on either side had cracked into perfect hexagons. The pattern repeated endlessly until the eye ached from trying to count the tiles.", "Wen walked in the middle of the path. Her boots sank slightly with each step. To her left, a row of stranded fishing boats lay on their sides. Their hulls were exposed to the sun, bleached and dry. To her right, the dry bed of the river stretched out. It was a vast, pale desert where water had once rushed with a roar she could feel in her teeth.", "Master Gao walked ahead of her. His polished black boots clicked rhythmically on the packed earth. He held a leather-bound ledger under one arm and gestured broadly with the other. He looked like he was presenting a painting in a gallery.", "\"Look at this,\" he said. His voice carried that smooth, practiced charm that had made the villagers trust him too easily. He stopped and pointed to the cracked mud. \"This is not just dirt. This is the river’s own skin. Every year, the Clear River carries silt from the mountains, fine as flour, and deposits it here. A thousand years of that, Wen Lan. A thousand years of patience.\"", "Wen frowned, looking down at the hexagons. \"It looks dead.\"", "\"Dead?\" Gao laughed. It was a short, bright sound. \"No, my dear. It is waiting.\" He tapped the ledger against his thigh. \"The river builds the land it will one day drown. It is a very patient landlord.\" He looked back at her, his smile sharp and precise. \"And right now, the landlord is holding the rent.\"", "Wen felt a cold prickle at the base of her skull. The words sounded reasonable. Almost poetic. But there was a hardness to them that did not fit the gentle landscape. She looked at the stranded boats. The masts pointed accusingly at the sky. The silence pressed in."], "img": "img/p021.jpg", "pw": true}, {"no": 22, "ch": 5, "ctitle": "", "part": "", "paras": ["They found Shen Yu on the edge of the dry channel. He knelt in the dust, a surveyor’s staff planted firmly beside him. Pale skin, almost translucent in the harsh light, framed a head of short black hair that stuck up in places, as if he had been running his hands through it in frustration. A brown canvas vest covered a white shirt with cuffs stained dark blue with ink. Round brass-rimmed glasses caught the sun.", "He did not look up when Gao approached. He adjusted a red flag stuck in the ground next to his staff.", "\"Three meters,\" he muttered to the flag, not the men. \"Down to the bone. The water table dropped three meters in a week.\"", "Wen stopped a few paces away. \"Is that bad?\"", "Shen Yu looked up. He blinked, seemingly surprised to see other humans.", "\"Bad?\" He straightened. His glasses slid down his nose. \"Bad is losing a shoe. This is losing the floor.\" He wiped his hands on his vest, leaving dark ink streaks on the brown fabric. \"I am measuring the fall. If the river is three meters lower, the pressure is gone. The silt settles. The channel dies.\"", "Gao placed a hand on Shen Yu’s shoulder. The gesture felt practiced. \"We are all measuring the fall, young man. But some of us are looking for the cause.\"", "Shen Yu pulled his shoulder away. His jaw tightened. \"Causes are for philosophers. I work in numbers.\" He picked up his rolled map case and clutched it to his chest like a shield. \"If you are going upriver, you are walking into a place that does not want to be walked into. The math says so.\"", "Wen looked at the red flag. A small, defiant spot of color in the grey dust. \"Do you have a map of the channel?\"", "Shen Yu hesitated. Then he unrolled a corner of the map case. The paper was thick, covered in fine lines and numbers. \"I do. But it is not a map of where to go. It is a map of where you should not.\""], "img": "img/p022.jpg", "pw": false}, {"no": 23, "ch": 5, "ctitle": "", "part": "", "paras": ["Shen Yu talked quickly, his words tumbling over each other like stones in a dry creek bed. He unrolled the map on a flat rock and tapped a line with a finger stained blue with ink.", "\"See this slope?\" he said, pointing to a gentle curve on the paper. \"The river used to flow at one degree. Now, with the water level down, the effective slope has changed. When water slows, it drops its silt. That silt builds up the bed. The bed gets higher. The channel gets shallower. The water slows more. It is a loop. A trap.\"", "Wen watched the line of his finger. \"So the river is burying itself?\"", "\"Essentially, yes.\" Shen Yu adjusted his glasses, pushing them back up his nose. \"It is a self-sealing wound. Without intervention, the channel will close within a month. The delta will become a plain. The boats will stay here forever, becoming monuments to a mistake.\"", "Gao leaned in, his expression unreadable. \"A mistake made by whom?\"", "Shen Yu looked at Gao, then at Wen, then back at the map. His voice dropped. \"By the water itself, if you are looking for a villain. But there are... irregularities in the silt distribution. Pockets of high density where there should be low density. It is as if something is filtering the flow. Selectively.\"", "Wen felt a chill that had nothing to do with the wind. \"Filtering?\"", "\"A weir,\" Shen Yu said, the word crisp and hard. \"But not a natural one. A constructed one. Upstream. Far upstream.\" He rolled up the map with a snap. \"I am not supposed to discuss this. My master, the surveyor, has orders to keep the data local. But you are walking upriver. You will find the weir before you find the answer.\"", "Gao smiled, a thin, precise line. \"Then we had better walk quickly.\""], "img": "img/p023.jpg", "pw": true}, {"no": 24, "ch": 5, "ctitle": "", "part": "", "paras": ["Wen turned to Gao, the question still hovering between them like a bird that had not yet decided whether to land. \"Is it true? Is there something upstream stopping the river?\"", "Gao did not answer immediately. He looked at Shen Yu, then out at the vast, cracked expanse of the delta, and for a moment the easy charm drained from his voice, replaced by a careful, measured stillness.", "\"Shen Yu is an apprentice,\" Gao said finally, his tone smooth as polished jade. \"He measures. He does not decide. There are many reasons a river can slow. Drought. Heat. The earth itself is tired.\"", "\"Three meters,\" Shen Yu interjected, his voice tight and brittle. \"In a week. That is not tiredness. That is a valve.\"", "Wen looked at Gao. \"You know.\"", "Gao’s smile did not waver, but his eyes did. They were dark, deep, and utterly still, like the bottom of a well that has seen no rain for a decade. \"I know that the river is a complex system, Wen Lan. And I know that you are young, and afraid, and that fear makes one see patterns in the chaos.\" He closed the ledger under his arm with a soft thud. \"But if you wish to find the source, you will need a guide who knows the path. I can offer you that. Shen Yu can offer you numbers. Which do you choose?\"", "Wen looked at Shen Yu. He was staring at the ground, his hands trembling slightly against the edge of the map case. \"I am not a guide,\" he said quietly. \"I am a witness. And I have seen the weir. I have seen the stones. They are not natural.\"", "Gao’s expression hardened, the charm cracking to reveal the steel beneath. \"Then you have seen something that should remain unseen.\"", "Shen Yu looked up, his eyes fierce behind his brass-rimmed glasses. \"I am coming with you. If there is a weir, I need to measure it. If the river is being held, I need to know how much it is costing.\"", "Gao studied him for a long moment, the silence stretching thin and taut like a tracker's rope before a haul. Then he nodded, a slow, deliberate motion. \"Very well. We all have our debts to pay.\""], "img": "img/p024.jpg", "pw": false}, {"no": 25, "ch": 5, "ctitle": "", "part": "", "paras": ["The sun began to dip below the horizon, painting the sky in shades of bruised purple and burnt orange. They reached the edge of the delta where the land ended abruptly, giving way to a sea of mist that rolled in from the valley beyond. It was thick and white and silent, pressing against the dry air like a heavy curtain.", "Wen stood at the precipice, her boots planted firmly on the cracked earth. Before her stretched the dry riverbed, a vast, pale road that wound its way into the mist, disappearing into the unknown. It was a path of dust and memory, a ribbon of silt that had once carried life to the sea. The texture was rough and granular under her feet, the kind of grit that stuck to the soles of her cloth-wrapped boots and ground between her teeth when she spoke.", "She looked at the road, and for the first time, she did not feel fear. She felt a strange, cold clarity. The river was not gone. It was waiting. And she was going to wake it up. The thought settled in her chest with the quiet certainty of a stone sinking into still water. There was no hesitation in it, only the steady pull of a current she could not yet see but knew to be there.", "Gao stood beside her, his silhouette sharp against the fading light. \"It is a long way to the source,\" he said softly. \"The mist will hide the path. The cold will test your resolve. And the river... the river will test your heart.\"", "Wen looked at Shen Yu, who was adjusting his glasses, his hands finally steady. He wiped a smudge of dust from the brass rims with his sleeve, a meticulous gesture that seemed out of place in the wild expanse around them. \"I am ready,\" she said.", "The wind picked up, carrying the scent of dust and distant rain. It ruffled the blue cloth in her ponytail and stirred the loose threads of her grey sash. Wen took a deep breath, and then another, filling her lungs with the dry air. She turned to face the mist, and took the first step onto the dry road."], "img": "img/p025.jpg", "pw": false}, {"no": 26, "ch": 6, "ctitle": "A Hundred Villages", "part": "PART TWO: THE TERRACE PLAINS", "paras": ["*The Bearer's Almanac, Entry 6: The wealth of a hill is whatever the forest keeps.*", "The valley did not end; it climbed.", "As they walked for the first hour, the flat, cracked expanse of the dry delta gave way to a slope, then a steeper slope, and finally a sheer face of green that rose so high it seemed to touch the clouds. It was a staircase of rice terraces, a hundred steps of emerald and silver, each one a perfect mirror reflecting the pale morning sky. The water in the higher fields was still and clear, while the lower ones held a deeper, darker green, the color of old tea. Above the highest terrace, a wall of dark, dense forest crowned the ridge, its canopy thick and unbroken, holding the mist in a heavy, gray blanket.", "Shen Yu stopped to adjust his surveyor’s staff, his breath quick and shallow. He looked up at the forest, then down at the terraces, and began to speak with the rapid, precise cadence of someone who had been waiting a long time to say this.", "\"Look at the slope,\" he said, tapping the ground with his staff. \"Fifteen degrees here, maybe twenty up there. The forest on top is not just trees. It is a sponge. The roots grip the soil, and the canopy breaks the rain. Every drop that hits those leaves is caught, slowed, and held in the earth. Over months, that water seeps down through the rock and the soil, and it comes out here, in the channels, as a steady, gentle flow. It is not a burst. It is a breath.\"", "Wen looked at the dark wall of green above them. She could hear the faint, rhythmic drip of water somewhere in the leaves, a sound so soft it was almost imaginary.", "\"And if the forest is gone?\" she asked.", "Shen Yu did not answer. He simply pointed up at the ridge, where the tree line was ragged and broken, a scar of brown earth visible against the green. The silence was answer enough. The water did not fall; it rushed. And when it rushed, it took the hill with it.", "Wen felt a strange, tight feeling in her chest. She had been looking at the river as a line, a road to follow. But here, the river was a system, a living thing that breathed in the high places and exhaled in the low ones. She touched the bamboo gourd on her back, its presence familiar and comforting.", "The path wound upward, a narrow ribbon of packed earth between the terraces. They walked in silence for a while, the only sound the soft crunch of gravel under their boots and the distant, hollow ring of a cowbell."], "img": "img/p026.jpg", "pw": true}, {"no": 27, "ch": 6, "ctitle": "", "part": "", "paras": ["The air shifted as they climbed, turning cooler and heavier with the scent of wet earth and crushed leaves. The terraces tightened around them, their mud walls rising higher, holding back the slope with a stubbornness that felt almost architectural. But the water had withdrawn. Most of the fields lay dry, their surfaces fractured into a jagged network of brown lines that looked like the palm of a giant, dried hand. Only a few patches, in the highest reaches, held a thin film of water, shimmering weakly under the sun like a coin dropped into a dry well.", "They reached a stone sluice, a simple gate set into a channel that cut through the terrace wall. Two men stood on either side of it, arms crossed, faces tight and wary. They wore rough cloth shirts the color of the dried mud, and their eyes were hard, watchful things. Below them, on the next terrace down, two more men stood in a similar posture, hands resting on the hilts of machetes that hung at their sides. The air between the two groups was thick with a tension that made the hair on Wen’s arms stand up, a static charge waiting to snap.", "A small figure stood in the middle, on the edge of the sluice, looking very old and very calm. He was bald, his brown skin weathered and deep-lined, wearing a straw hat and a simple tunic. He held a hoe, its wooden handle worn smooth by decades of use. He did not look at the men. He looked at the dry channel, his eyes tracing the path of the water as if he could see it moving there, invisible but present.", "Wen stepped forward, her heart beating fast. \"What is happening?\" she asked, her voice quiet but steady.", "The old man turned his head slowly. His eyes were clear and sharp, like the water in the highest field. \"The water is low,\" he said, his voice a rough, dry sound. \"Too low. The upper village says it is their water, because it falls on their land first. The lower village says it is the life of their fields, because it is their rice that feeds the valley. They are both right. And they are both wrong.\"", "The men on either side glared at each other, their jaws tight. One of them, a tall man with a scar across his cheek, stepped forward. \"We will close the gate,\" he said, his voice low and dangerous. \"We will keep what we can. The lower fields can find their own water.\"", "The old man, Tianzhu, shook his head slowly. \"No,\" he said, simply. \"We do not close the gate. We share.\""], "img": "img/p027.jpg", "pw": false}, {"no": 28, "ch": 6, "ctitle": "", "part": "", "paras": ["Wen looked at the scarred man, then at the other group, and finally at Tianzhu. She could feel the heat of the sun on her neck, the grit of the dust in her throat. The air was thick with the promise of violence, a tight, coiled thing that could snap at any moment.", "\"I want to see,\" Wen said. Her voice was not loud, but it cut through the tension like a knife. \"Show me how it works. Show me how you share.\"", "The scarred man blinked, clearly not expecting this. He looked at Gao, who stood slightly behind, his expression pleasant and neutral. But it was Tianzhu who nodded, a small, slow movement of his head.", "He walked to the stone gate, running his hand over the rough surface. He pointed to a series of notches, carved deep into the stone, each one a different depth. \"This is the old way,\" he said, his voice steady. \"We do not measure the water. We measure the time. Each field takes its fill, and when it is full, the water passes on. The notches tell us how much to let go. It is not a gift. It is a debt. We owe the water to the fields below.\"", "He pointed to the lowest notch. \"When the water is high, we open the gate wide. When the water is low, we open it narrow. But we never close it. Because if we close it, the water stops. And if the water stops, the hill dies.\"", "Wen watched his hand as he moved it over the notches, feeling the roughness of the stone. She could see, in the wear of the carvings, the years of careful, deliberate action. This was not just a gate. It was a promise, written in stone.", "The scarred man stepped back, his machete lowered, but his hand still resting on the hilt. \"And if the water is not enough?\" he asked, his voice rough.", "Tianzhu looked at him, and for a moment, Wen thought she saw something crack in his calm face. But then he smiled, a small, sad smile. \"Then we wait,\" he said. \"We wait for the rain. And we share what we have.\"", "The tension did not break, but it shifted, like a stone rolling on a slope, finding a new, precarious balance."], "img": "img/p028.jpg", "pw": true}, {"no": 29, "ch": 6, "ctitle": "", "part": "", "paras": ["Gao stepped forward, his movements smooth and unhurried. He carried the easy confidence of a man who had always been the tallest in the room, and his voice was warm, like honey poured slowly over a spoon. He adjusted the jade pin in his topknot, a small, precise gesture that seemed to calm the air around him.", "\"Perhaps,\" he said, smiling at the scarred man, \"we can be more flexible. The upper villages have taken the brunt of the dry season. Their forests have been thinned, their channels cleared. It is only fair that they take a larger share now, and the lower villages... well, they can be compensated later. When the rain returns.\"", "The scarred man’s shoulders relaxed, a visible easing of the tension that had been holding him rigid. He looked at Gao with a new, cautious respect. \"That is... sensible,\" he said, the word tasting unfamiliar in his mouth. He glanced at the notches on the stone gate, calculating the flow rate in his head, and found the logic airtight.", "But the man from the lower village went pale. His face drained of color, leaving only the dark lines of his features visible against the light. His hand tightened on his machete, his knuckles white. The dust settled on his shoulders, undisturbed by any sudden movement, but the silence behind him was loud.", "\"That is not fair,\" he said, his voice shaking. \"We are the ones who will starve. You take the water, and we take the hunger. That is not sharing. That is stealing.\"", "Gao’s smile did not waver, but his eyes were sharp, assessing. He looked past the man, toward the distant terraces where the rice seedlings were already yellowing at the tips. \"It is survival,\" he said, softly. \"And survival requires sacrifice. The ledger must balance, one way or another.\"", "Wen looked at Gao, and for the first time, she felt a cold thread of doubt wind around her heart. His words were smooth, logical, and entirely wrong. He was speaking of water as if it were a commodity, a thing to be bought and sold, rather than a life to be shared. She thought of the spiral she had lifted from Hollow Pool, the way the water had left the channel empty and thirsty. She remembered the frost on her fingers, the debt she had not paid.", "Tianzhu said nothing. He simply looked at the dry channel, his face a mask of weary resignation. His hand rested on the rough stone of the gate, tracing the lowest notch, the one that kept the water flowing, even if only a trickle. He did not look at Gao. He looked at the ground, where the mud was cracking in long, dry lines."], "img": "img/p029.jpg", "pw": false}, {"no": 30, "ch": 6, "ctitle": "", "part": "", "paras": ["That night, the valley held its breath. The terraces lay exposed under the moon, their dry surfaces a patchwork of silver and deep shadow. Wen sat on the earthen wall of the highest field, her boots dangling over the drop, watching the stars emerge one by one against the black sky.", "Tianzhu sat beside her, his hoe resting against his knee. He did not speak for a long time. The silence between them was not empty, but full, like a bucket brimming with clear water.", "\"You are young,\" he said finally, his voice low and rough. \"You carry a lot of weight for a girl your age.\"", "Wen looked at him. \"I am trying to fix it,\" she said. \"The river. The water. I am trying to make it right.\"", "Tianzhu shook his head slowly. \"It is not about fixing,\" he said. \"It is about keeping. A terrace is a promise made of mud. Each field holds the line for the one below. If you break the promise, the hill falls. If you keep it, the hill stands.\"", "He pointed to the dark forest above them, to the unseen channels that carried the water down to their fields. \"The water does not belong to you. It does not belong to us. It belongs to the valley. And the valley belongs to the water.\"", "Wen looked down at her hands. In her hair, the white frost had grown, strand by strand, catching the moonlight. She thought of the sphere of water she had lifted from the dry pool, the way it had felt, heavy and cold, a debt she had not known she owed.", "She thought of the notches in the stone, the careful, deliberate marks of a promise kept. And for the first time, she did not feel like she was walking toward a solution. She felt like she was walking toward a responsibility, vast and heavy and impossible to put down.", "The wind picked up, carrying the scent of damp earth and distant rain. Wen pulled her knees to her chest, and watched the stars, and felt the valley settle on her shoulders, not as a burden, but as a gift."], "img": "img/p030.jpg", "pw": false}, {"no": 31, "ch": 7, "ctitle": "The Sharing Trial", "part": "PART TWO: THE TERRACE PLAINS", "paras": ["*The Bearer's Almanac, Entry 7: Fairness is a number everyone can see.*", "Dawn broke over the Terrace Plains in a wash of pale yellow, illuminating a standoff that had been brewing since the previous night. Two hundred villagers from the upper and lower slopes stood on either side of the narrow, sputtering stream, their faces tight with hunger and suspicion. They did not look at the water. They looked at Wen.", "The pressure of their gazes was a physical thing, pressing against her chest, squeezing the air from her lungs. She felt the familiar, unwelcome surge of power rising in her fingertips, a cold itch that promised relief if she simply reached out and grabbed the flow. It would be so easy. She could lift the water, twist it, and pour it exactly where they wanted. But the ledger in her mind, the quiet voice of her mother’s almanac, warned her: *to take is to owe.*", "\"Choose,\" shouted a man from the lower terrace, his voice cracking with desperation. \"Give us the water, Bearer. We have children who have not eaten in two days.\"", "\"Give it to us,\" countered a woman from the upper slope, stepping forward with a stick in her hand. \"Our fields are higher. If we fail, the whole slope washes away. We have the right to the source.\"", "Wen closed her eyes. The crowd began to chant her name, a low, rhythmic hum that vibrated in the soles of her boots. It sounded like worship, but it felt like a noose. They were not asking for help; they were demanding a verdict. They wanted her to be a god, to decide who lived and who starved, to take the burden of their choice onto her shoulders.", "Her hand trembled. The white frost streak at her left temple seemed to burn in the morning light. She hated this. She hated that her gift was being treated as a coin to be spent, a tool to be used. She was not a dispenser of mercy. She was a girl who could move water, and the cost of that movement was written in the ice on her skin.", "\"I will not choose,\" she said, her voice thin but steady.", "The chanting stopped abruptly. The silence that followed was heavier than the noise. Two hundred pairs of eyes fixed on her, waiting for the other shoe to drop, for the magic to save them or the cold to kill her."], "img": "img/p031.jpg", "pw": true}, {"no": 32, "ch": 7, "ctitle": "", "part": "", "paras": ["Wen turned to the only person in the crowd who was holding a map instead of a stick. Shen Yu was already moving, his round glasses catching the sun as he hurried to the stream’s edge. He looked terrified, but his hands were steady as he unrolled a length of hemp rope.", "\"Measure,\" Wen said, her voice shaking only slightly. \"If we know how much there is, we know who can have it. And when.\"", "Shen Yu nodded, his eyes wide behind the brass rims. He tied one end of the rope to a smooth stone and waded into the knee-deep water, his grey cloth shoes instantly soaking through. He held the rope taut across the stream, marking the width with a notch on the bark of a nearby willow. Then he took a single dry leaf, dropped it into the current, and started counting.", "\"Three seconds,\" he called out, wiping his face with an ink-stained sleeve. \"The flow is slow. Sluggish. It is like moving syrup.\"", "Wen watched the leaf drift. It took four seconds to pass the second marker. The water was barely moving, a thin ribbon over a bed of loose gravel. She looked at the terraces, the dry, cracked mouths of the fields waiting for a drink. There was not enough water to fill them all at once. There was not enough water to fill them all today.", "\"But,\" Shen Yu said, his voice gaining confidence as he scribbled figures on a scrap of paper, \"if we restrict the flow, if we turn it on for only one field at a time, and for a set amount of time, we can stretch it. We can make it last for a week.\"", "Wen looked at the old stone gate, the one with the strange, jagged notches cut into its frame. It was not a dam. It was a mechanism. A clock.", "\"The notches,\" she said, pointing to the stone. \"They are not decorative.\"", "Shen Yu blinked, then looked closely at the gate. \"They are measurements,\" he whispered. \"Centimeters. Millimeters. Someone built this to meter the flow. To share it.\"", "The crowd murmured. The anger in their faces softened into confusion, then curiosity. They had been fighting over a prize, but they had not looked closely at the prize."], "img": "img/p032.jpg", "pw": false}, {"no": 33, "ch": 7, "ctitle": "", "part": "", "paras": ["They spent the next hour in a frenzy of calculation. Shen Yu’s hands moved quickly over his map, drawing lines and shapes, while Wen watched the water, feeling its pulse against her skin. She could sense the depth, the pressure, the tiny amount of friction as the water slid over the stones. It was a delicate thing, this stream, a vein rather than a river.", "\"We have to be exact,\" Shen Yu said, his voice tight with concentration. \"If we open the gate too wide, the water will rush to the lowest field and leave the upper ones dry. If we open it too little, the silt will clog the channel.\"", "Wen knelt beside the gate. The notches were worn smooth by centuries of use. She ran her finger over them, feeling the grooves. Each notch represented a specific amount of water, a specific time. It was a language of fairness, written in stone.", "\"Turn the gate to the third notch,\" Wen said. \"For the lower fields first. They are the most vulnerable. Then the middle. Then the top.\"", "Shen Yu hesitated. \"But the upper villagers will be last. They will be angry.\"", "\"They are thirsty,\" Wen said. \"But they are not dying. The lower fields have no backup. The upper fields have the forest above them. We have to prioritize the desperate, not the loud.\"", "The crowd listened. The man who had shouted earlier lowered his stick. The woman from the upper slope crossed her arms, but she did not argue. She was watching the water, watching the notches, watching the logic of it.", "The river did not care who you were. It only cared about the slope, the volume, the time. And for the first time in three days, the air in the valley felt less like a battlefield and more like a workshop."], "img": "img/p033.jpg", "pw": true}, {"no": 34, "ch": 7, "ctitle": "", "part": "", "paras": ["The problem was that the gate was stuck. Decades of silt and algae had packed into the hinge, freezing the stone wheel in place. It was a small clog, but it was enough to stop the flow.", "Wen stepped forward. The crowd parted, not in reverence, but in anticipation. She placed her palm on the wet stone of the gate. The cold bit into her skin, familiar and sharp. She did not lift the water. She did not move the stone. She simply pressed her palm against the clog, feeling the trapped sludge, and pushed.", "It was a small move. A tiny amount of force. But it was enough to break the seal. The gate groaned, then turned.", "A surge of water, no larger than a bucket, rushed out. It hit the first channel, splashing against the dry earth. The sound was small, but it was the sound of life.", "The lower villagers cheered. It was not a roar of triumph, but a soft, collective exhale, the sound of a held breath finally released.", "Tianzhu stepped forward. He did not speak. He simply reached into his pocket and pulled out his straw hat. He placed it gently on Wen’s head, shading her from the brightening sun.", "\"Little bearer,\" he said, his voice rough with emotion. \"You did not give them water. You gave them a share.\"", "Wen touched the hat, feeling the texture of the straw. She looked at her hand. The frost was still there, but it felt lighter. Less like a debt, and more like a tool.", "The gate ran by itself now, the water flowing in a steady, measured stream. The village did not need a hero. It needed a schedule. And for the first time, Wen realized that she was not the one keeping the river alive. The river was keeping the village alive, and she was just the one holding the door open."], "img": "img/p034.jpg", "pw": false}, {"no": 35, "ch": 7, "ctitle": "", "part": "", "paras": ["Master Gao stood on the bank, his polished black boots untouched by the mud that coated the villagers’ feet. He watched the water flow with a face of polite interest, while the rest of the crowd celebrated with the rough joy of people who had just remembered how to breathe. He did not cheer or shout. He simply observed, his eyes tracking the stream as a merchant tracks a price.", "\"Remarkable,\" he said, his voice smooth and uninflected. \"You have solved a problem that has plagued this valley for a generation. With such... efficiency.\"", "Wen looked at him, her hands still stained with the dark silt of the gate hinge. \"We just started,\" she said. \"There are still two hundred fields to feed.\"", "Gao smiled. It was a charming smile, the kind that made you want to trust him, but it did not reach his eyes.
